app-chart:
### apm section ####

  apm:
    enabled: false        
    env:
    - name: ELASTIC_APM_SERVER_URL
      valueFrom: 
        secretKeyRef: 
          name: apm-server-token
          key: apm-url
        ## Update the value with app name ##
    - name: ELASTIC_APM_SERVICE_NAME 
      value: sample
        ## Update with the application package name ## 
    - name: ELASTIC_APM_APPLICATION_PACKAGES 
      value: sample
        ## Update it with the current environment Dev,QA ##
    - name: ELASTIC_APM_ENVIRONMENT 
      value: test
        ## To get all the APM metrics ## 
    - name: ELASTIC_APM_LOG_LEVEL 
      value: sample
        ## This will be already present in your namespace ##
    - name: ELASTIC_APM_SECRET_TOKEN 
      valueFrom: 
        secretKeyRef: 
          name: apm-server-token 
          key: secret-token
    - name: JAVA_TOOL_OPTIONS 
      value: sample
    resources:
      limits:
        cpu: 200m
        memory: 100M
      requests:
        cpu: 100m
        memory: 50M

### apm section ends ###

### appd section ####
  appD:
    enabled: true     
    env:
    - name: APPDYNAMICS_AGENT_ACCOUNT_ACCESS_KEY
      valueFrom: 
        secretKeyRef: 
          key: controller-key
          name: cluster-agent-secret
    - name: APPDYNAMICS_AGENT_APPLICATION_NAME
      value: sample
    - name: APPDYNAMICS_AGENT_TIER_NAME
      value: sample
    envFrom: 
    - configMapRef:
        name: appd-agent-settings-configmap    
    resources:
      limits:
        cpu: 200m
        memory: 100M
      requests:
        cpu: 100m
        memory: 50M

  
  configmaps:          
    configurations:
    - name: appd-agent-settings
      config:
        APPDYNAMICS_AGENT_ACCOUNT_NAME: pepsi-test
        APPDYNAMICS_CONTROLLER_HOST_NAME: pepsi-test.saas.appdynamics.com
        APPDYNAMICS_CONTROLLER_PORT: "443"
        APPDYNAMICS_CONTROLLER_SSL_ENABLED: "false"
        APPDYNAMICS_JAVA_AGENT_REUSE_NODE_NAME: "true"
        JAVA_TOOL_OPTIONS: -Dappdynamics.agent.accountAccessKey=$(APPDYNAMICS_AGENT_ACCOUNT_ACCESS_KEY) -Dappdynamics.socket.collection.bci.enable=true -Dorg.osgi.framework.bootdelegation=com.singularity.* -javaagent:/opt/appdynamics/javaagent.jar

### appd section ends####