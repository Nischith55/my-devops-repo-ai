next-version: 1.1.1
mode: Mainline
branches:
  bugfix:
    regex: ^bugfix[/-]
    increment: Patch
    source-branches: ['develop']
  feature:
    regex: ^feature[/-]
    increment: Minor
    source-branches: ['develop']
  release:
    regex: ^release[/-]
    increment: Major
    source-branches: ['develop']