--- 
#Property for micrometer config
management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      probes:
        enabled: 'true'
      show-details: always
#Property for spring boot admin client and server 
server:
  forward-headers-strategy: 'none'
spring: 
  #Property for sleuth config
  application: 
    name: pep-eip-pbna-fivestar-ivr-service
  #Property for spring boot admin client and server
  boot:
    admin:
      client:
        #url: ''
        instance:
          service-host-type: 'ip'
          metadata:
            tags:
              applicationname: "pep-eip-pbna-fivestar-ivr-service"
  security:
    oauth2:
      audience: api://default
      resourceserver:
        jwt:
          issuer-uri: https://secure.ite.pepsico.com/oauth2/default
ivr:          
  pbna-dispatch-download-url: http://156.81.217.186:7445/Api/v1/Sybase
  pbna-hh-password-url: http://156.81.217.186:7445/Api/v1/GetPBCTempHHPassword
  frito-manifest-download-url:  http://156.81.217.186:7445/Api/v1/RedownloadManifest
  frito-manifest-enable-url: http://156.81.217.186:7445/api/v1/IsManifestAutomationEnabled 
eiap: 
  api-role: USER
  valid-client-id: "0oa19xrqq9fOXsRRR0h8"
  oauth-scope: "SCOPE_myCustom"
  oauth:
    client-id: ${OAUTH_CLIENT_ID}
    client-secret: ${OAUTH_CLIENT_SECRET}
    tokenUrl: ${spring.security.oauth2.resourceserver.jwt.issuer-uri}/v1/token
    scope: "myCustom"
    grant-type: "client_credentials"
  rest-timeout: 30000
  password: 
    storage: 
      type: "{noop}"
  start-thread: 1
retry: 
    number-of-retries: 3
    wait-time: 1800    
cle: 
  api-enabled: true
  app-domain: ivr_dev
  app-id: EIP_SHARED
  enabled-for-replay: false
  exception-url: "https://pep-eiap-cgf-cle-rest-services.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com/api/v2/error/"
  log-enabled: true
  success-url: "https://pep-eiap-cgf-cle-rest-services.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com/api/v2/log/"
validation: 
  ivr: 
    date-reg-ex: "^(0?[1-9]|[12][0-9]|3[01])-(JAN|Jan|FEB|Feb|MAR|Mar|APR|Apr|MAY|May|JUN|Jun|JUL|Jul|AUG|Aug|SEP|Sep|OCT|Oct|NOV|Nov|DEC|Dec)-(19|20)\\d\\d\\s([0-1][0-9]|[2][0-3]):([0-5][0-9]):([0-5][0-9])$"