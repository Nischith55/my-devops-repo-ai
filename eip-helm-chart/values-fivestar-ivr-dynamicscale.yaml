global:
  fullnameOverride: "pep-eip-pbna-fivestar-ivr-service" 
  namespace: test 
  deployment:
    enabled: false
  service:
    enabled: true
  
  rollout:
    enabled: true
    minReadySeconds: 10
    progressDeadlineSeconds: 600
    progressDeadlineAbort: true
    revisionHistoryLimit: 2
    rollbackWindowRevisions: 2
    strategy: canary     
    notifications:
      enabled: true      
      email: 'test.pepsico.com'
      teams:
        channel: argo-notification
      onRolloutPaused: true
      onRolloutAborted: true
    canary:
      canaryService: pep-eip-pbna-fivestar-ivr-service-preview
      stableService: pep-eip-pbna-fivestar-ivr-service
      analysis:
        templates:
        - templateName: http-requests-fivestar
        startingStep: 2
        args: 
        - name: hostname
          value: pep-eip-pbna-fivestar-ivr-service.sbox.gw01.aks03.eus.nonprod.azure.intra.pepsico.com
      steps:
      - setMirrorRoute:          
          name: "mirror-route"         
          percentage: 100          
          match:
            - method: 
                exact: "GET" 
      - setCanaryScale:
          replicas: 1  
      - pause: {duration: 10}  
      - setCanaryScale:
          replicas: 2      
      - pause: {duration: 10}
      - analysis:
          templates:
          - templateName: prometheus-fivestar-analysis
          args:
          - name: appname
            value: pep-eip-pbna-fivestar-ivr-service
          - name: namespace
            value: test
          - name: podhash
            valueFrom:
              podTemplateHashValue: Latest
      - setCanaryScale:
          replicas: 3
      - pause: {duration: 10}
      - setCanaryScale:
          replicas: 4
      - setWeight: 0
      - pause: {}  
      dynamicStableScale: false
      trafficRouting:
        managedRoutes:
          - name: mirror-route
        istio:      
          virtualServices:     
          - name: pep-eip-pbna-fivestar-ivr-service-vs 

platform-chart:  
  autoscalingEnabled: true
  hpaConfigMinReplicas: 1
  hpaConfigMaxReplicas: 5
  targetCPUUtilizationPercentage: 80 
  targetMemoryUtilizationPercentage: 60
  pdbEnabled: true
  pdbMaxUnavailable: 1
  pdbSelector:
    app: pep-eip-pbna-savvy-metrics
  
  virtualService: 
    enabled: true
    name: pep-eip-pbna-fivestar-ivr-service-vs
    gateways:
    - istio-system/istio-in-gateway-01
    hosts: 
    - pep-eip-pbna-fivestar-ivr-service.sbox.gw01.aks03.eus.nonprod.azure.intra.pepsico.com
    tlsTerminationOnPod: false
    routes:
    - prefix: /     
      destinations: 
      - destinationService: pep-eip-pbna-fivestar-ivr-service-preview
        port: 8080 
        weight: 0 
      - destinationService: pep-eip-pbna-fivestar-ivr-service
        port: 8080 
        weight: 100 
 
  destinationRule:
    enabled: false
    namespace: pep-eiap-istio-config   
    subsets:
    - name: canary
      labels:        
        role: canary
    - name: stable
      labels:       
        role: stable 

app-chart:  
  replicaCount: 5
  labels:
    app: pep-eip-pbna-fivestar-ivr-service

  image: 
    repository: pepeiapnonprodglobalcommonacr.azurecr.io/pep/eip/shared-services/pep-eip-pbna-fivestar-ivr-service
    tag: "20240116.1"
    pullPolicy: IfNotPresent


  containerPorts:
  - port: 8080
    name: "app-port"
   

  serviceAccount:
    name: test-sa

  probes:
    enabled: true
    liveness:
      path: /actuator/health/liveness
      port: app-port
      initialDelaySeconds: 30
      periodSeconds: 5
      timeoutSeconds: 15
      successThreshold: 1
      failureThreshold: 1
    readiness:
      path: /actuator/health/readiness
      port: app-port
      initialDelaySeconds: 30
      periodSeconds: 5
      timeoutSeconds: 15
      successThreshold: 1
      failureThreshold: 1
    startup:
      path: /actuator/health/liveness
      port: app-port
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 15
      successThreshold: 1
      failureThreshold: 30

  envFromSecrets:
  - name: OAUTH_CLIENT_ID
    secret: 
      name: pep-eip-pbna-fivestar-ivr-secret
      key: eiap.oauth.client-id
  - name: OAUTH_CLIENT_SECRET
    secret: 
      name: pep-eip-pbna-fivestar-ivr-secret
      key:  eiap.oauth.client-secret

  resources: 
    limits:
      cpu: "1"
      memory: "1Gi"
    requests:
      cpu: "500m"
      memory: "1Gi"

# configmap creation from file
  configmapFromFile:
  # enabled - default value is false, set it to true to create the configmap from file
    enabled: true   
    # configmaps to be created 
    configurations: 
      # name of the configmap - suffixed with -configmap
      pep-eip-pbna-fivestar-ivr-service:
        # config to be assigned to some random text - which is overwritten with contents of the file in the pipeline with --set-file flag
        config: 'test'

  analysisTemplates:
    enabled: true
    templates:
    - name: prometheus-fivestar-analysis
      args:
      - appname
      - namespace
      - podhash
      metrics:
      - name: failure-rate        
        interval: 60s
        count: 5    
        successCondition: len(result)==0 || result[0] >=0.95
        failureLimit: 3
        provider: prometheus 
        prometheus:
          address: https://pep-eiap-prometheus.sbox.gw01.aks03.eus.nonprod.azure.intra.pepsico.com 
          insecure: true  
          timeout: 40        
          query: |
            sum(rate(istio_requests_total{app="{{args.appname}}",kubernetes_namespace="{{args.namespace}}",rollouts_pod_template_hash="{{args.podhash}}",request_protocol="http",response_code!~"5.*"}[5m]))/ sum(rate(
              istio_requests_total{app="{{args.appname}}",kubernetes_namespace="{{args.namespace}}",rollouts_pod_template_hash="{{args.podhash}}",request_protocol="http"}[5m]
            ))
 
    - name: http-requests-fivestar
      args:
      - hostname
      metrics:
      - name: http-request  
        interval: 10s
        count: 5  
        provider: job 
        job:        
          spec:  
            ttlSecondsAfterFinished: 240     
            template:   
              metadata:
                annotations:
                  sidecar.istio.io/inject: "false"          
              spec:
                containers:
                - name: load-tester
                  image: argoproj/load-tester:latest
                  command: [sh, -xec]
                  args:
                  - |
                    wrk -t1 -c1 -d5 -s report.lua https://{{args.hostname}}/readyz
                    # jq -e '.errors_ratio <= 0.05' report.json
                restartPolicy: Never
            backoffLimit: 0 

 
### Scheduling section

# node selector to schedule the pod on a specific node
  nodeSelector: {}

# tolerations to be set on the pod to get scheduled on the node where there are taints
  tolerations: []

# affinity to be set on the pods to co-schedule with other pods 
  affinity: {}
  
## scheduling section ends ##