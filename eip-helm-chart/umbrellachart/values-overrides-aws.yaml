global:
  # fullnameoverride sets the name of the deployment and service and prefix of other k8s objects
  fullnameOverride: "pep-eip-pbna-savvy-efstest"
  # targetted namespace to which the chart objects get deployed
  namespace: helm-test
  # labels to use for all the objects and to manage the pods
  labels:
    # app label is manadatory which is internally used by the deployment, service, virtual service
    app: pep-eip-pbna-savvy-metrics
    team: "test"
  annotations:
    team: "testteam"
    cost-center: "2324"
  # deployment - configuration to toggle the creation of deployment
  deployment:
    # enabled - default value is true and creates deployment
    # when turned off, turns off the creation of VS,DR,PDB and HPA
    enabled: false
  # service - configuration to toggle the creation of service  
  service:
    # enabled - default value is true and creates service
    enabled: true

  #pvc section to include when a persistent volume must be created and mounted on pod.
  pvc:
    # enabled - default value is false, set it to true for creation of PVC
    enabled: true
    # access modes of the volume mount 
    accessModes:
    - ReadWriteOnce
    # storage class to use - to use the volume configuration (binding mode, reclaim policy etc)
    storageClass: "test-ebs-sc"
    # amount of storage requested
    storageRequest: 1Gi
    # mount path where the volume is mounted on the container
    mountPath: /data
  # pvc section ends

  # statefulset - sample configuration to deploy the workload as a StatefulSet instead of a Deployment
  # NOTE: statefulset and deployment/rollout are mutually exclusive. To use the StatefulSet,
  # set global.deployment.enabled to false (and global.rollout.enabled to false, if set).
  statefulset:
    # enabled - default value is false, set it to true to create a StatefulSet
    enabled: true
    # serviceName - headless service used for network identity of the pods
    # defaults to "<fullnameOverride>-headless" when left empty
    serviceName: ""
    # podManagementPolicy - OrderedReady (sequential) or Parallel (start/stop pods together)
    podManagementPolicy: Parallel
    # revisionHistoryLimit - number of old ControllerRevisions to retain
    revisionHistoryLimit: 10
    # updateStrategy - RollingUpdate (default, one pod at a time, each keeps its own PVC) or OnDelete
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        # partition - ordinal at which the StatefulSet should be partitioned for updates
        partition: 0
    # persistentVolumeClaimRetentionPolicy - controls whether per-pod PVCs are kept or deleted
    # when the StatefulSet is deleted or scaled down. Retain ensures a WAL/data disk is never
    # deleted automatically.
    persistentVolumeClaimRetentionPolicy:
      whenDeleted: Retain
      whenScaled: Retain
    # volumeClaimTemplates - per-pod persistent storage; each entry provisions one PVC per
    # replica (e.g. <name>-<statefulset-name>-0, -1, ...) and is mounted into every container
    volumeClaimTemplates:
    - name: data
      # mountPath - path inside the container(s) where this volume is mounted
      mountPath: /data
      accessModes:
      - ReadWriteOnce
      # storageClassName - storage class to use for dynamic provisioning
      storageClassName: test-ebs-sc
      # storageRequest - amount of storage requested per replica
      storageRequest: 5Gi
  # statefulset section ends

  # secret Management section to enable creation of secrets through Azure KV integration
  awsSecretManagement:
    # enabled - default value is false, set it to true to manage secrets using SSCSI Driver
    enabled: true
    # name of the secret provider class to be created
    secretProviderClassName: test-csi-metrics
    # mount path on the container where the objects pulled from KV are mounted
    mountPath: /secretmount
    # use pod identity to access the KV - default value is true
    usePodIdentity: true
    # IAM role ARN associated with the EKS pod identity/IRSA used to access AWS Secrets Manager
    roleArn: "arn:aws:iam::009049667538:role/pep-aws-eks-pod-identity-nexonomy-role"
    # region  of the ASM
    awsregion: us-east-1
    # single substitution character to use if the file name in Amazon EKS will contain the path separator character, such as slash (/) on Linux
    # awspathTranslation: "true"
    # list of objects to be pulled and synced to K8s secret
    objects:
    # name of the secret to be created to which the objects from KV are to be syced
    - secretName: aws-secrets-private
      data:
      - objectName: aws-secrets-private
        # type of the object (valid values are secretsmanager or ssmparameter)
        objectType: secretsmanager
        # jmesPath - maps AWS secret keys to K8s secret keys
        jmesPath:
        # path - JMESPath expression to extract value
        - path: DB_USER
          # objectAlias - reference name in SecretProviderClass
          objectAlias: DB_USER
          # secretKey - K8s secret key name
          secretKey: username
        # secretKey - K8s secret key name  
        - secretKey: password
          # path - JMESPath expression to extract value
          path: DB_PASSWORD
          # objectAlias - reference name in SecretProviderClass
          objectAlias: DB_PASSWORD
    # name of the second secret to be created to which the objects from a different AWS Secrets Manager secret are synced
    - secretName: aws-secrets-public
      data:
      # objectName - name of the secret in AWS Secrets Manager (different secret than above)
      - objectName: aws-secrets-public
        # type of the object (valid values are secretsmanager or ssmparameter)
        objectType: secretsmanager
        # jmesPath - maps AWS secret keys to K8s secret keys
        jmesPath:
        # path - JMESPath expression to extract value
        - path: API_KEY
          # objectAlias - reference name in SecretProviderClass
          objectAlias: API_KEY
          # secretKey - K8s secret key name
          secretKey: api_key
        # secretKey - K8s secret key name
        - secretKey: api_secret
          # path - JMESPath expression to extract value
          path: API_SECRET
          # objectAlias - reference name in SecretProviderClass
          objectAlias: API_SECRET
# secret Management section ends


## Platform chart - overrides to create and manage platform objects 
platform-chart:
  # enables the creation of hpa 
  autoscalingEnabled: true
  # min replicas to be configured on hpa
  hpaConfigMinReplicas: 3
  # max replicas to be configured on hpa
  hpaConfigMaxReplicas: 6
  # target CPU Utilisation based on which autoscaling happens
  targetCPUUtilizationPercentage: 80
  # target Memory Utilisation based on which autoscaling happens 
  targetMemoryUtilizationPercentage: 20
  # behavior of scaling can be defined for the HPA us
  # hpaBehavior - controls scaling rate to prevent rapid replica fluctuations
  hpaBehavior:
    # scaleDown - scaling down policies
    scaleDown:
      # policies - scaling rules for scale down operations
      policies:
      # type - policy type (Pods or Percent)
      - type: Pods
        # value - max pods to scale down per period
        value: 4
        # periodSeconds - time window for this policy
        periodSeconds: 60
      # type - policy type (Pods or Percent)  
      - type: Percent
        # value - max percentage to scale down per period
        value: 10
        # periodSeconds - time window for this policy
        periodSeconds: 60
  # enables the creation of pdb
  pdbEnabled: true
  # Min Available or Max Unavailable configuration of PDB can be provided
  pdbMaxUnavailable: 1
  # selector to use for the PDB to monitor the workloads
  pdbSelector:
    app: pep-eip-pbna-savvy-metrics

  # envoy filter section
  envoyfilter:
    enabled: false
    name: testapp
    patchOperation: INSERT_BEFORE #if applyTo field is "HTTP_FILTER", then context is set to following "INSERT_BEFORE, INSERT_AFTER, INSERT_FIRST" or if applyTo is set to ROUTE_CONFIGURATION, or HTTP_ROUTE, then context would be "ADD, REMOVE"
    context: SIDECAR_INBOUND
    applyto: HTTP_FILTER # if applyTo field is HTTP_FILTER, then network filter selection on "envoy.filters.network.http_connection_manager"  
    portnumber: 8080
    filterConfig:
      inlineCode: |-
        function envoy_on_request(request_handle)
          local original_auth = request_handle:headers():get("authorization")
            local x_auth = request_handle:headers():get("x-authorization")               
              if original_auth then
                -- Move Authorization value to X-Authorization
                request_handle:headers():replace("x-authorization", original_auth)
              end              
  # envoy filter section ends 

  # virtual service section -  to enable the creation of VS with SSL termination on POD
  virtualService:
    # enabled - default value is false, set it to true to create the Virtual service 
    enabled: true
    # name of the virutal service to be created
    name: pep-eip-pbna-savvy-metrics-vs
    # list of host names to be used 
    hosts:
    - savvycustomer.dev.mypepsico.com
    # tlsTerminationOnPod - allows user to configure the virtual service to terminate SSL on POD
    tlsTerminationOnPod: false
    # list of routes to be configured for the Virtal service to route the traffic to destination service
    routes:
    # context path to be used after the host name to route specific requests to backend service
    #- prefix: /
    - prefixes:
      - /external-upload
      - /internal-upload
      - /admin
      # backend service to which the request must be routed to
      destinationService: pep-eip-pbna-savvy-metrics
      # port on the service 
      port: 443
  # virtual service section ends

  # destination rule section to enable and create destination rule for the service 
  destinationRule:
    # enabled - default value is false, set it to true to create the Destination rule
    enabled: true
    # target namespace where the destination rule has to be created
    namespace: pep-eiap-istio-config
    # if the purpose of creation of this destionation rule is to achieve session affinity, turn this flag to true. This flag takes care of configuring the session affinity based on the http cookie "IstioSessionAffinity" on the destination rule.
    sessionAffinity: false
    # Traffic policies to apply for a specific destination, to achieve outlier detection, controlling the volume of connections, loadbalancing etc. 
    trafficPolicy:
      tls:
        mode: ISTIO_MUTUAL
      outlierDetection:
        consecutive5xxErrors: 2
        interval: 1m
        baseEjectionTime: 5m
        maxEjectionPercent: 100
  # destination rule section ends       

  # storage class section - to be enabled if we need to create a storage class with file CSI driver and reuse the pv configuration
  awsStorageClass:
    # enabled - set to true to create AWS storage class for dynamic volume provisioning
    enabled: false
    # isEBS - set to true to use Amazon EBS for block storage volumes
    isEBS: true
    # isEFS - set to true to use Amazon EFS for shared file system storage
    isEFS: false
    # name - unique name for the storage class used by PVC claims
    name: test-efs-sc
    # parameters - driver-specific configuration for AWS EFS/EBS provisioning
    parameters:
      # fileSystemId - existing EFS file system ID to mount (required for EFS)
      fileSystemId: "fs-0426c86679bda510f"
      # provisioningMode - EFS access method (efs-ap creates access points for isolation)
      provisioningMode: "efs-ap"
      # directoryPerms - octal permissions for created directories in EFS
      directoryPerms: "0777"

  # pv section - to enable and create persistent volume
  awsPV:
    # enabled - set to true to create a static persistent volume for pre-existing AWS storage
    enabled: true
    # labels - key-value pairs to tag and categorize the persistent volume
    labels:
      team: testteam
    # storageClass - storage class name that defines provisioning and binding behavior
    storageClass: "test-ebs-sc"
    # isEBS - set to true when using Amazon EBS volumes for block storage
    isEBS: true
    # isEFS - set to true when using Amazon EFS for shared file system access
    isEFS: false
    # isS3 - set to true when mounting an existing Amazon S3 bucket (Mountpoint for Amazon S3 CSI driver)
    isS3: false
    # volumeHandle - unique identifier of the existing AWS volume (EBS volume ID or EFS file system ID)
    volumeHandle: vol-test

  # pv section ends

  # ---------------------------------------------------------------------------
  # Amazon S3 example (Mountpoint for Amazon S3 CSI driver - s3.csi.aws.com)
  # ---------------------------------------------------------------------------
  # Amazon S3 supports STATIC provisioning only - there is no StorageClass and no
  # dynamic provisioning. The chart creates a PersistentVolume that points at an
  # existing bucket and a PersistentVolumeClaim that binds to it by volumeName.
  # To use S3 instead of EBS/EFS above:
  #   1. Ensure the Mountpoint for Amazon S3 CSI driver is installed on the cluster
  #      and the node/pod IAM role (IRSA) has access to the bucket.
  #   2. Under global.pvc: set enabled: true, storageClass: "" (empty for static
  #      binding), accessModes to ReadWriteMany (or ReadOnlyMany), and mountPath.
  #   3. Under platform-chart.awsStorageClass: keep enabled: false (S3 has no SC).
  #   4. Configure platform-chart.awsPV as shown below.
  #
  #  awsPV:
  #  # enabled - set to true to create the S3 backed persistent volume
  #    enabled: true
  #  # storageClass - MUST be "" for S3 static provisioning
  #    storageClass: ""
  #  # isEBS/isEFS - keep false when using S3
  #    isEBS: false
  #    isEFS: false
  #  # isS3 - set to true to render an s3.csi.aws.com CSI volume
  #    isS3: true
  #  # bucketName - name of the existing S3 bucket to mount
  #    bucketName: my-existing-s3-bucket
  #  # volumeHandle - MUST be unique within the cluster (any unique string)
  #    volumeHandle: pep-eip-s3-csi-volume
  #  # claimRef - set to true to reserve this PV exclusively for the chart's PVC
  #    claimRef: true
  #  # mountOptions - Mountpoint for Amazon S3 options (region is required)
  #    mountOptions:
  #    - allow-delete
  #    - region us-east-1
  #    - uid=1000
  #    - gid=1000
  #    - allow-other
  #    # - prefix some-s3-prefix/   # optional: mount only a sub-path of the bucket
  # ---------------------------------------------------------------------------


  # keda configuration
  keda:
    # set to true to enable KEDA event-driven autoscaling for workloads
    enabled: false
    # maximum number of replicas KEDA can scale up to
    maxReplicaCount: 20
    # minimum number of replicas to maintain (0 allows scale-to-zero)
    minReplicaCount: 0
    # frequency in seconds to check scaling metrics from external sources
    pollingInterval: 30
    # wait time in seconds before scaling down after last trigger activation
    cooldownPeriod: 300
    # backup scaling configuration when scaler fails or becomes unavailable
    fallback:
      # maintain during scaler failure
      replicas: 2
      # consecutive failures before activating fallback mode
      failureThreshold: 3
    # external event sources that drive autoscaling decisions
    triggers:
    # Kafka message queue monitoring
    - type: kafka
      # Kafka scaler configuration parameters
      metadata:
        # comma-separated list of broker addresses
        bootstrapServers: kafkabroker.eus.nonprod.azure.intra.pepsico.com:19095
        # monitor for lag metrics
        consumerGroup: auditstorehhndev
        ## Optional parameters
        # monitor for scaling decisions
        topic: pep-flna-salesmetrics-filter-queue-1-0
        # consumer lag count that triggers scale-up operations from 1 replica to N replicas
        lagThreshold: '10'
        # minimum lag to activate from zero replicas
        activationLagThreshold: '5'
        # behavior when consumer offset is invalid (earliest/latest)
        offsetResetPolicy: latest
        # permit consumers with no active partitions (conflicts with limitToPartitionsWithLag)
        allowIdleConsumers: false # cannot be set to true when limitToPartitionsWithLag is true
        # scale to zero when offset becomes invalid
        scaleToZeroOnInvalidOffset: false
        # ignore partitions with persistent lag in scaling decisions
        excludePersistentLag: false
        # only consider partitions with actual lag for scaling
        limitToPartitionsWithLag: true # when set to true, topic must be specified  
        # monitor specific partition numbers (comma-separated ranges)
        partitionLimitation: '1,2,10-20,31'
      # secret containing authentication credentials
      authenticationRef:
        name: pep-eip-pbna-savvy-metrics-trigger-auth-kafka-cred
    # Azure Event Hub message processing monitoring
    - type: eventhub
      # Event Hub scaler configuration parameters
      metadata:
        # environment variable containing connection string
        connectionFromEnv: EVENTHUB_CONNECTIONSTRING_ENV_NAME
        # monitor for unprocessed events
        eventHubName: XYZ # "eventHubName or eventHubNameFromEnv is required as the connection string does not end with EntityPath=<event_hub_name> "
        # environment variable for checkpoint storage connection string
        storageConnectionFromEnv: STORAGE_CONNECTIONSTRING_ENV_NAME
        # track processing progress
        consumerGroup: $Default
        # number that triggers scale-up
        unprocessedEventThreshold: '64'
        # minimum to activate from zero
        activationUnprocessedEventThreshold: '10'
        # store consumer checkpoints
        blobContainer: 'name_of_container'
        # for connection
        eventHubNamespace: XYZ
        # environment variable for namespace
        eventHubNamespaceFromEnv: XYZ
        # environment variable for name
        eventHubNameFromEnv: XYZ
        # Azure environment (AzurePublicCloud, AzureGovernmentCloud, etc.) Optional (Default: AzurePublicCloud)
        cloud: AzurePublicCloud
        # custom endpoint for private Azure environments Required when cloud = Private
        endpointSuffix: servicebus.airgap.example
        # custom storage endpoint for private environments required when cloud = Private
        storageEndpointSuffix: airgap.example
        # for checkpoint persistence. Required when using pod identity authentication with blob storage
        storageAccountName: 'name_of_account'
        # access method (podIdentity/connectionString)
        authenticationType: "podIdentity" # possible values podIdentity or connectionString
    # Redis data structure monitoring
    - type: redis
      # Redis scaler configuration parameters
      metadata:
        # server host and port for connection
        address: localhost:8799
        # monitor for length-based scaling
        listName: testlist
        # target length that triggers scaling operations
        listLength: "10"
        # minimum length to activate from zero replicas
        activationListLength: 0
        # use encryption for connection security
        enableTLS: true
        # database number to connect to (0-15 typically)
        databaseIndex: 0
      # secret containing authentication credentials
      authenticationRef:
        name: keda-trigger-auth-redis-secret

# end of keda configuration


## Application chart - overrides to create and manage deployment, service and configmaps
app-chart:
  sidecar:
    # enabled - default value is false, set it to true to create the configmap from file
    enabled: false
    securityContext:
      allowPrivilegeEscalation: false
      runAsUser: 10000
  # number of replicas of the service to run
  replicaCount: 1
  podLabels:
    lable1: test1
    lable2: test2
  command: [ "/bin/sh", "-c" ]
  args: [ "while true; do echo $(date -u) >> /data/out1.txt; sleep 5; done" ]

  # image section - mentioning the image to use by the deployment   
  image:
    # repository to use - NonProd ACR in lower and Prod ACR in higher env   
    repository: 928734899669.dkr.ecr.us-east-1.amazonaws.com/busybox
    # image tag to use
    tag: "latest"

    pullPolicy: IfNotPresent
  # image pull secret to be used to pull the image from image repository

  # container life cycle ends here
  # list of contianer ports to configured and used
  containerPorts:
  # port number
  - port: 8080
    # port name - this is mandatory as the port name is re-used in probes configuration
    name: "app-port"

  # service account configuration to be used by the deployment
  serviceAccount:
    # set create flag to true - to create the service account
    create: false
    # name of the service account to be used by the deployment
    name: default

  # deployment strategy to use - valid values are Recreate and RollingUpdate. Defaults to Rolling update. 
  # In case of Rollingupdate, rollingUpdate configuraiton mentioning maxSurge and maxUnavailable can be provided.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 75%
      maxUnavailable: 25%

  podSecurityContext:
    runAsNonRoot: false

  securityContext:
    allowPrivilegeEscalation: true
    privileged: true
    runAsUser: 0
  # liveness and readiness probes configuration - supports both http probe and command probe
  probes:
    # enabled - default value is false, set it to true to add the probes configuration to the deployment
    enabled: true
    # liveness probe to be included under liveness section
    liveness:
      # http probes require path and port configuration
      command:
      - ls
      - /secretmount
      # path: /actuator/health/liveness
      # # name of the port (matching to the contianer ports configuration) to be used for probes
      # port: app-port
      # wait period in sec, before the performing the first liveness probe 
      initialDelaySeconds: 120
      # interval with which the probes are performed
      periodSeconds: 5
      # Number of seconds after which the probe times out
      timeoutSeconds: 15
      # success threshold
      successThreshold: 1
      # failure threshold
      failureThreshold: 1
    # readiness probe to be included under readiness section
    readiness:
      # command to execute for the probe
      command:
      - ls
      - /secretmount
      # wait period in sec, before the performing the first liveness probe 
      initialDelaySeconds: 120
      # interval with which the probes are performed
      periodSeconds: 5
      # Number of seconds after which the probe times out
      timeoutSeconds: 15
      # success threshold
      successThreshold: 1
      # failure threshold
      failureThreshold: 1
  # startup probe (optional) - only rendered when this section is present; delays liveness/readiness until startup completes
  startup:
    # command to execute for the probe (http path/port also supported, see liveness/readiness examples)
    command:
    - ls
    - /secretmount
    # wait period in sec, before performing the first startup probe
    initialDelaySeconds: 10
    # interval with which the probes are performed
    periodSeconds: 10
    # Number of seconds after which the probe times out
    timeoutSeconds: 15
    # success threshold
    successThreshold: 1
    # failure threshold - the container has (failureThreshold * periodSeconds) to finish starting up
    failureThreshold: 30
  # liveness, readiness and startup probe section ends

  # ENV Section
  # ENV from Secrets - to be used for setting env from couple of keys from multiple secrets
  # envFromSecrets:
  # # name of the env variable
  # - name: TERADATA_USER
  # # secret to refer to extract the value and set to env variable
  #   secret: 
  #   # name of the secret
  #     name: pep-eip-pbna-savvy-customer-secret
  #   # key in the secret to refer, whose value is extracted and assigned to env variable
  #     key: TERADATA_USER
  # # name of the env variable
  # - name: TERADATA_PASSWORD
  # #  secret to refer to extract the value and set to env variable
  #   secret: 
  #   # name of the secret
  #     name: pep-eip-pbna-savvy-customer-secret
  #   # key in the secret to refer, whose value is extracted and assigned to env variable
  #     key: TERADATA_PASSWORD

  # ENV from Secret Ref - to be used when all the keys in a secret are to be created as env variables
  # envFromSecretRef:
  # # secret reference to extract all the keys and values and set as env variables in the container
  # - secretRef:
  #   # name of the secret
  #     name:  test-secret
  # # secret reference to extract all the keys and values and set as env variables in the container
  # - secretRef: 
  #   # name of the secret
  #     name: test-secret2

  # ENV from Configmap Ref - to be used when all the keys in a configmap are to be created as env variables
  # envFromConfigMapRef:
  # # configmap reference to extract all the keys and values and set as env variables in the container
  # - configMapRef:
  #   # name of the configmap
  #     name: pepsico-test-configmap

  # ENV from Key and Value pairs - list of keys and values to be used to create env variables
  env:
  - name: APP_NAME
    value: "pep-cgpt-cgf-rstrct-sql-exec"
  # env:
  # # name of the env variable
  # - name: testenv1
  # # value to be assigned 
  #   value: value1
  # # name of the env variable
  # - name: testenv2
  # # value to be assigned 
  #   value: value2
  # ENV Section ends

  # resource section - to specify limits and requests
  resources:
    # limits - the maximum amount of resource to be used by the container
    limits:
      cpu: "2"
      memory: "2Gi"
    # requests - the minimum amount of resource required for the container
    requests:
      cpu: "1"
      memory: "1400Mi"
  # resurce section ends



  # configmap creation from file
  configmapFromFile:
    # enabled - default value is false, set it to true to create the configmap from file
    enabled: true
    # configmaps to be created 
    configurations:
      # name of the configmap - suffixed with -configmap
      pep-eip-pbna-savvy-metrics:
        # config to be assigned to some random text - which is overwritten with contents of the file in the pipeline with --set-file flag
        config: test
        # tobeMounted - set to true to moun the configmap as volume
        tobeMounted: true
        # mount path on the container where configmap is mounted
        mountPath: '/config'
        # name of the volume to be created and mounted
        volumeName: application-config

  # configmap creation from key and value pair
  configmaps:
    # enabled - default value is false, set it to true to create the configmap from key-value pair
    enabled: true
    # list of configmaps to be created with the keyand value configuration  
    configurations:
    # name of the configmap - suffixed with -configmap
    - name: application-settings
      # key and value configuration
      config:
        key1: value1
        key2: value2

  #list of any additional volumes to mount
  additionalVolumes:
  # name of the volume
  - name: testvolume1
    # path to mount on the container
    mountPath: /addVol/test/test1.yaml
    # subpath - to facilitate multiple mounts on same path
    subPath: test1.yaml
    # readonly set to true if we want the mout to be readonly
    readOnly: true
    # source of the volume - configmap / secret etc
    type:
      # source of the volume and settings
      configMap:
        # name of the source of volume
        name: application-settings-configmap
        # items to mount
        items:
        - key: key1
          path: key1

  ### Scheduling section

  # topologicalspreadconstraints dictate how Pods are spread across your cluster among failure-domains such as regions, zones, nodes etc
  topologySpreadConstraints:
    # enabled - default value is false, set it to true to configure topological spread constraint on deployment
    enabled: true
    # max skew describes the degree to which Pods may be unevenly distributed
    maxSkew: 1
    # topologyKey is the key of node labels
    topologyKey: topology.kubernetes.io/zone
    # indicates how to deal with a Pod if it doesn't satisfy the spread constraint
    whenUnsatisfiable: ScheduleAnyway

  # node selector to schedule the pod on a specific node
  nodeSelector: {}

  # tolerations to be set on the pod to get scheduled on the node where there are taints

  # affinity to be set on the pods to co-schedule with other pods 
  affinity: {}

## scheduling section ends ##
