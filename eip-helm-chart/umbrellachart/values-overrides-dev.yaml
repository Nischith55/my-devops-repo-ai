### Scheduling section

# topologicalspreadconstraints dictate how Pods are spread across your cluster among failure-domains such as regions, zones, nodes etc
  topologySpreadConstraints:
  # enabled - default value is false, set it to true to configure topological spread constraint on deployment
    enabled: true
  # max skew describes the degree to which Pods may be unevenly distributed
    maxSkew: 1
  # topologyKey is the key of node labels
    topologyKey: topology.kubernetes.io/zone
  # indicates how to deal with a Pod if it doesn't satisfy the spread constraint
    whenUnsatisfiable: ScheduleAnyway

# node selector to schedule the pod on a specific node
  nodeSelector: {}

# tolerations to be set on the pod to get scheduled on the node where there are taints
  tolerations: []

# affinity to be set on the pods to co-schedule with other pods 
  affinity: {}
  
## scheduling section ends ##






