# Application chart - overrides to create and manage cronjob
app-chart:
# CronJob Configuration
  sidecar:
    # enabled - default value is false, set it to true to create the configmap from file
    enabled: true 
    name: libreoffice  
    # configmaps to be created 
    command: ["/bin/sh", "-c"]
    args: ["sleep 180"]     
    containerPorts:
    # port number
    - port: 8000
    # port name - this is mandatory as the port name is re-used in probes configuration
      name: "libre-port"
    image: 
      repository: pepeiapnonprodcommonacr.azurecr.io/pep/eiap/infra/base/ubuntu/ubuntu
      tag: "20.04"
      pullPolicy: IfNotPresent
    
    lifecycle:
      postStart:
        httpGet:
        exec:
          command: ["/bin/sh", "-c", "ls  /tmp"]
      preStop:
        httpGet:
        exec:
          command:  ["/bin/sh", "-c", "ls  /tmp"]
    securityContext:
      allowPrivilegeEscalation: true
      runAsUser: 0
    
    resources: 
  # limits - the maximum amount of resource to be used by the container
      limits:
        cpu: "2"
        memory: "2Gi"
  # requests - the minimum amount of resource required for the container
      requests:
        cpu: "1"
        memory: "1400Mi"
    # liveness and readiness probes configuration - supports both http probe and command probe
    probes:
    # enabled - default value is false, set it to true to add the probes configuration to the deployment
      enabled: true
    # liveness probe to be included under liveness section
      liveness:
      # http probes require path and port configuration
        command: 
          - ls
          - /tmp
      # path: /actuator/health/liveness
      # # name of the port (matching to the contianer ports configuration) to be used for probes
      # port: app-port
      # wait period in sec, before the performing the first liveness probe 
        initialDelaySeconds: 120
        # interval with which the probes are performed
        periodSeconds: 5
        # Number of seconds after which the probe times out
        timeoutSeconds: 15
        # success threshold
        successThreshold: 1
        # failure threshold
        failureThreshold: 1
      # readiness probe to be included under readiness section
      readiness:
        # command to execute for the probe
        command: 
          - ls
          - /tmp
        # wait period in sec, before the performing the first liveness probe 
        initialDelaySeconds: 120
        # interval with which the probes are performed
        periodSeconds: 5
        # Number of seconds after which the probe times out
        timeoutSeconds: 15
        # success threshold
        successThreshold: 1
        # failure threshold
        failureThreshold: 1
      # startup probe (optional) - only rendered when this section is present; delays liveness/readiness until startup completes
      startup:
        # command to execute for the probe (http path/port also supported, see liveness/readiness examples)
        command: 
          - ls
          - /tmp
        # wait period in sec, before performing the first startup probe
        initialDelaySeconds: 10
        # interval with which the probes are performed
        periodSeconds: 10
        # Number of seconds after which the probe times out
        timeoutSeconds: 15
        # success threshold
        successThreshold: 1
        # failure threshold - the container has (failureThreshold * periodSeconds) to finish starting up
        failureThreshold: 30
      # liveness, readiness and startup probe section ends
    # ENV from Key and Value pairs - list of keys and values to be used to create env variables
    env:
    - name: APP_NAME 
      value: "pep-cgpt-cgf-rstrct-sql-exec"
  # env:
  # # name of the env variable
  # - name: testenv1
  # # value to be assigned 
  #   value: value1
  # # name of the env variable
  # - name: testenv2
  # # value to be assigned 
  #   value: value2
# ENV Section ends
    envFromSecrets:
    - name: AZURE_KEY_VAULT_URI
      secret:
        name: kv-secret-pepsico-dev
        key: AZURE_KEY_VAULT_URI
  #  # ENV from Secret Ref - to be used when all the keys in a secret are to be created as env variables
    envFromSecretRef:
      - secretRef:
          name:  kv-secret-pepsico-dev
  # # # secret reference to extract all the keys and values and set as env variables in the container
  #     - secretRef: 
  # #   # name of the secret
  #         name: test-secret2

# ENV from Configmap Ref - to be used when all the keys in a configmap are to be created as env variables
    envFromConfigMapRef:
      - configMapRef:
          name: pep-cto-ee-pepgenx-llmgeneric-restricted-configmap
    
