global:
  fullnameOverride: dai-iam-ocp-control-plane
  namespace: pep-aisp-cgf-aiseciam-dev
  labels:
    app: dai-iam-ocp-control-plane
  awsSecretManagement:
    enabled: true
    secretProviderClassName: dai-iam-ocp-github-pem
    # THE FIX: same missing-mountPath bug as OPA's file — the dedicated
    # awsSecretManagement auto-mount block needs this set explicitly.
    mountPath: /github
    awsregion: us-east-1
    awspathTranslation: "_"
    objects:
      - secretName: dai-iam-ocp-github-pem
        data:
          - objectName: AISecurityIAM/GITHUB_APP_PEM_KEY
            objectType: secretsmanager
            filePermission: "0400"
          - objectName: AISecurityIAM/GITHUB_APP2_PEM_KEY
            objectType: secretsmanager
            filePermission: "0400"
platform-chart:
  autoscalingEnabled: false
  hpaConfigMinReplicas: 1
  hpaConfigMaxReplicas: 3
  targetCPUUtilizationPercentage: 70
  destinationRule:
    enabled: false
    trafficPolicy:
      portLevelSettings:
        - port:
            number: 8181
          tls:
            mode: DISABLE  
  virtualService:
    enabled: false
app-chart:
  replicaCount: 1
  image:
    repository: 751328675657.dkr.ecr.us-east-1.amazonaws.com/dai-iam-ocp-control-plane
    pullPolicy: IfNotPresent
    tag: "edge"
  serviceAccount:
    name: pep-aisp-cgf-aiseciam-dev-sa    
  command:
    - "/ocp"
    - "run"
    - "--config=/app/config.d/application.yml"
    - "--data-dir=/app/data"
    - "--apply-migrations"
    - "--log-level=debug"
  podSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    runAsNonRoot: true
  securityContext:
    allowPrivilegeEscalation: false
  additionalVolumes:
    - name: ocp-data
      mountPath: /app/data
      type:
        emptyDir: {}
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi    
  configmapFromFile:
    enabled: true
    configurations:
      ocp-config:
        volumeName: ocp-config-vol
        mountPath: /app/config.d
        tobeMounted: true
        config: |
          sources:
            enterprise:
              git:
                repo: "https://github.com/Global-SnT/is-iam-ai-security-policies.git"
                reference: "refs/heads/poc"
                path: sources/enterprise-policy/src
                excluded_files:
                  - .*/.*
                credentials: git-creds
            system-service:
              git:
                repo: "https://github.com/Global-SnT/is-iam-ai-security-policies.git"
                reference: "refs/heads/poc"
                path: sources/system/service/src
                excluded_files:
                  - .*/.*
                credentials: git-creds
            system-sidecar:
              git:
                repo: "https://github.com/Global-SnT/is-iam-ai-security-policies.git"
                reference: "refs/heads/poc"
                path: sources/system/sidecar/src
                excluded_files:
                  - .*/.*
                credentials: git-creds
            poc-workload:
              git:
                repo: "https://github.com/Global-SnT/is-iam-ai-security-poc.git"
                reference: "refs/heads/poc"
                path: security/policy/sources/poc/src
                excluded_files:
                  - .*/.*
                credentials: git-creds
            poc-framework-overlay:
              git:
                repo: "https://github.com/Global-SnT/is-iam-ai-security-poc.git"
                reference: "refs/heads/poc"
                path: security/policy/sources/poc/effective
                excluded_files:
                  - .*/.*
                credentials: git-creds
            poc-authz-overlay:
              git:
                repo: "https://github.com/Global-SnT/is-iam-ai-security-poc.git"
                reference: "refs/heads/poc"
                path: security/policy/sources/poc/effective
                excluded_files:
                  - .*/.*
                credentials: git-creds
            # --- sample-mcp-server (PepsiCo-AISP org, uses git-creds-2) ---
            sample-mcp-server-workload:
              git:
                repo: "https://github.com/PepsiCo-AISP/dai-pepgenx-sample-mcp-server.git"
                reference: "refs/heads/develop"
                path: security/policy/effective
                credentials: git-creds-2
            sample-mcp-server-framework-overlay:
              git:
                repo: "https://github.com/PepsiCo-AISP/dai-pepgenx-sample-mcp-server.git"
                reference: "refs/heads/develop"
