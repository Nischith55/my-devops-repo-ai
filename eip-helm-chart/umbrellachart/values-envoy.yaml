apiVersion: v1
data:
  sync.py: "# Copyright 2020-2021 The Kubeflow Authors\r\n#\r\n# Licensed under the
    Apache License, Version 2.0 (the \"License\");\r\n# you may not use this file
    except in compliance with the License.\r\n# You may obtain a copy of the License
    at\r\n#\r\n#      http://www.apache.org/licenses/LICENSE-2.0\r\n#\r\n# Unless
    required by applicable law or agreed to in writing, software\r\n# distributed
    under the License is distributed on an \"AS IS\" BASIS,\r\n# WITHOUT WARRANTIES
    OR CONDITIONS OF ANY KIND, either express or implied.\r\n# See the License for
    the specific language governing permissions and\r\n# limitations under the License.\r\n\r\nfrom
    http.server import BaseHTTPRequestHandler, HTTPServer\r\nimport json\r\nimport
    os\r\nimport base64\r\n\r\n\r\ndef main():\r\n    settings = get_settings_from_env()\r\n
    \   server = server_factory(**settings)\r\n    server.serve_forever()\r\n\r\n\r\ndef
    get_settings_from_env(controller_port=None,\r\n                          visualization_server_image=None,
    frontend_image=None,\r\n                          visualization_server_tag=None,
    frontend_tag=None, disable_istio_sidecar=None,\r\n                          minio_access_key=None,
    minio_secret_key=None, kfp_default_pipeline_root=None):\r\n    \"\"\"\r\n    Returns
    a dict of settings from environment variables relevant to the controller\r\n\r\n
    \   Environment settings can be overridden by passing them here as arguments.\r\n\r\n
    \   Settings are pulled from the all-caps version of the setting name.  The\r\n
    \   following defaults are used if those environment variables are not set\r\n
    \   to enable backwards compatibility with previous versions of this script:\r\n
    \       visualization_server_image: gcr.io/ml-pipeline/visualization-server\r\n
    \       visualization_server_tag: value of KFP_VERSION environment variable\r\n
    \       frontend_image: gcr.io/ml-pipeline/frontend\r\n        frontend_tag: value
    of KFP_VERSION environment variable\r\n        disable_istio_sidecar: Required
    (no default)\r\n        minio_access_key: Required (no default)\r\n        minio_secret_key:
    Required (no default)\r\n    \"\"\"\r\n    settings = dict()\r\n    settings[\"controller_port\"]
    = \\\r\n        controller_port or \\\r\n        os.environ.get(\"CONTROLLER_PORT\",
    \"8080\")\r\n\r\n    settings[\"visualization_server_image\"] = \\\r\n        visualization_server_image
    or \\\r\n        os.environ.get(\"VISUALIZATION_SERVER_IMAGE\", \"gcr.io/ml-pipeline/visualization-server\")\r\n\r\n
    \   settings[\"frontend_image\"] = \\\r\n        frontend_image or \\\r\n        os.environ.get(\"FRONTEND_IMAGE\",
    \"gcr.io/ml-pipeline/frontend\")\r\n\r\n    # Look for specific tags for each
    image first, falling back to\r\n    # previously used KFP_VERSION environment
    variable for backwards\r\n    # compatibility\r\n    settings[\"visualization_server_tag\"]
    = \\\r\n        visualization_server_tag or \\\r\n        os.environ.get(\"VISUALIZATION_SERVER_TAG\")
    or \\\r\n        os.environ[\"KFP_VERSION\"]\r\n\r\n    settings[\"frontend_tag\"]
    = \\\r\n        frontend_tag or \\\r\n        os.environ.get(\"FRONTEND_TAG\")
    or \\\r\n        os.environ[\"KFP_VERSION\"]\r\n\r\n    settings[\"disable_istio_sidecar\"]
    = \\\r\n        disable_istio_sidecar if disable_istio_sidecar is not None \\\r\n
    \           else os.environ.get(\"DISABLE_ISTIO_SIDECAR\") == \"true\"\r\n\r\n
    \   settings[\"minio_access_key\"] = \\\r\n        minio_access_key or \\\r\n
    \       base64.b64encode(bytes(os.environ.get(\"MINIO_ACCESS_KEY\"), 'utf-8')).decode('utf-8')\r\n\r\n
    \   settings[\"minio_secret_key\"] = \\\r\n        minio_secret_key or \\\r\n
    \       base64.b64encode(bytes(os.environ.get(\"MINIO_SECRET_KEY\"), 'utf-8')).decode('utf-8')\r\n\r\n
    \   # KFP_DEFAULT_PIPELINE_ROOT is optional\r\n    settings[\"kfp_default_pipeline_root\"]
    = \\\r\n        kfp_default_pipeline_root or \\\r\n        os.environ.get(\"KFP_DEFAULT_PIPELINE_ROOT\")\r\n\r\n
    \   return settings\r\n\r\n\r\ndef server_factory(visualization_server_image,\r\n
    \                  visualization_server_tag, frontend_image, frontend_tag,\r\n
    \                  disable_istio_sidecar, minio_access_key,\r\n                   minio_secret_key,
    kfp_default_pipeline_root=None,\r\n                   url=\"\", controller_port=8080):\r\n
    \   \"\"\"\r\n    Returns an HTTPServer populated with Handler with customized
    settings\r\n    \"\"\"\r\n    class Controller(BaseHTTPRequestHandler):\r\n        def
    sync(self, parent, children):\r\n            # parent is a namespace\r\n            namespace
    = parent.get(\"metadata\", {}).get(\"name\")\r\n\r\n            pipeline_enabled
    = parent.get(\"metadata\", {}).get(\r\n                \"labels\", {}).get(\"pipelines.kubeflow.org/enabled\")\r\n\r\n
    \           if pipeline_enabled != \"true\":\r\n                return {\"status\":
    {}, \"children\": []}\r\n\r\n            desired_configmap_count = 1\r\n            desired_resources
    = []\r\n            if kfp_default_pipeline_root:\r\n                desired_configmap_count
    = 2\r\n                desired_resources += [{\r\n                    \"apiVersion\":
    \"v1\",\r\n                    \"kind\": \"ConfigMap\",\r\n                    \"metadata\":
    {\r\n                        \"name\": \"kfp-launcher\",\r\n                        \"namespace\":
    namespace,\r\n                    },\r\n                    \"data\": {\r\n                        \"defaultPipelineRoot\":
    kfp_default_pipeline_root,\r\n                    },\r\n                }]\r\n\r\n\r\n
    \           # Compute status based on observed state.\r\n            desired_status
    = {\r\n                \"kubeflow-pipelines-ready\":\r\n                    len(children[\"Secret.v1\"])
    == 1 and\r\n                    len(children[\"ConfigMap.v1\"]) == desired_configmap_count
    and\r\n                    len(children[\"Deployment.apps/v1\"]) == 2 and\r\n
    \                   len(children[\"Service.v1\"]) == 2 and\r\n                    len(children[\"DestinationRule.networking.istio.io/v1alpha3\"])
    == 1 and\r\n                    len(children[\"AuthorizationPolicy.security.istio.io/v1beta1\"])
    == 1 and\r\n                    \"True\" or \"False\"\r\n            }\r\n\r\n
    \           # Generate the desired child object(s).\r\n            desired_resources
    += [\r\n                {\r\n                    \"apiVersion\": \"v1\",\r\n                    \"kind\":
    \"ConfigMap\",\r\n                    \"metadata\": {\r\n                        \"name\":
    \"metadata-grpc-configmap\",\r\n                        \"namespace\": namespace,\r\n
    \                   },\r\n                    \"data\": {\r\n                        \"METADATA_GRPC_SERVICE_HOST\":\r\n
    \                           \"metadata-grpc-service.kubeflow\",\r\n                        \"METADATA_GRPC_SERVICE_PORT\":
    \"8080\",\r\n                    },\r\n                },\r\n                #
    Visualization server related manifests below\r\n                {\r\n                    \"apiVersion\":
    \"apps/v1\",\r\n                    \"kind\": \"Deployment\",\r\n                    \"metadata\":
    {\r\n                        \"labels\": {\r\n                            \"app\":
    \"ml-pipeline-visualizationserver\"\r\n                        },\r\n                        \"name\":
    \"ml-pipeline-visualizationserver\",\r\n                        \"namespace\":
    namespace,\r\n                    },\r\n                    \"spec\": {\r\n                        \"selector\":
    {\r\n                            \"matchLabels\": {\r\n                                \"app\":
    \"ml-pipeline-visualizationserver\"\r\n                            },\r\n                        },\r\n
    \                       \"template\": {\r\n                            \"metadata\":
    {\r\n                                \"labels\": {\r\n                                    \"app\":
    \"ml-pipeline-visualizationserver\"\r\n                                },\r\n
    \                               \"annotations\": disable_istio_sidecar and {\r\n
    \                                   \"sidecar.istio.io/inject\": \"false\"\r\n
    \                               } or {},\r\n                            },\r\n
    \                           \"spec\": {\r\n                                \"containers\":
    [{\r\n                                    \"image\": f\"{visualization_server_image}:{visualization_server_tag}\",\r\n
    \                                   \"imagePullPolicy\":\r\n                                        \"IfNotPresent\",\r\n
    \                                   \"name\":\r\n                                        \"ml-pipeline-visualizationserver\",\r\n
    \                                   \"ports\": [{\r\n                                        \"containerPort\":
    8888\r\n                                    }],\r\n                                    \"resources\":
    {\r\n                                        \"requests\": {\r\n                                            \"cpu\":
    \"50m\",\r\n                                            \"memory\": \"200Mi\"\r\n
    \                                       },\r\n                                        \"limits\":
    {\r\n                                            \"cpu\": \"500m\",\r\n                                            \"memory\":
    \"1Gi\"\r\n                                        },\r\n                                    }\r\n
    \                               }],\r\n                                \"serviceAccountName\":\r\n
    \                                   \"default-editor\",\r\n                            },\r\n
    \                       },\r\n                    },\r\n                },\r\n
    \               {\r\n                    \"apiVersion\": \"networking.istio.io/v1alpha3\",\r\n
    \                   \"kind\": \"DestinationRule\",\r\n                    \"metadata\":
    {\r\n                        \"name\": \"ml-pipeline-visualizationserver\",\r\n
    \                       \"namespace\": namespace,\r\n                    },\r\n
    \                   \"spec\": {\r\n                        \"host\": \"ml-pipeline-visualizationserver\",\r\n
    \                       \"trafficPolicy\": {\r\n                            \"tls\":
    {\r\n                                \"mode\": \"ISTIO_MUTUAL\"\r\n                            }\r\n
    \                       }\r\n                    }\r\n                },\r\n                {\r\n
    \                   \"apiVersion\": \"security.istio.io/v1beta1\",\r\n                    \"kind\":
    \"AuthorizationPolicy\",\r\n                    \"metadata\": {\r\n                        \"name\":
    \"ml-pipeline-visualizationserver\",\r\n                        \"namespace\":
    namespace,\r\n                    },\r\n                    \"spec\": {\r\n                        \"selector\":
    {\r\n                            \"matchLabels\": {\r\n                                \"app\":
    \"ml-pipeline-visualizationserver\"\r\n                            }\r\n                        },\r\n
    \                       \"rules\": [{\r\n                            \"from\":
    [{\r\n                                \"source\": {\r\n                                    \"principals\":
    [\"cluster.local/ns/kubeflow/sa/ml-pipeline\"]\r\n                                }\r\n
    \                           }]\r\n                        }]\r\n                    }\r\n
    \               },\r\n                {\r\n                    \"apiVersion\":
    \"v1\",\r\n                    \"kind\": \"Service\",\r\n                    \"metadata\":
    {\r\n                        \"name\": \"ml-pipeline-visualizationserver\",\r\n
    \                       \"namespace\": namespace,\r\n                    },\r\n
    \                   \"spec\": {\r\n                        \"ports\": [{\r\n                            \"name\":
    \"http\",\r\n                            \"port\": 8888,\r\n                            \"protocol\":
    \"TCP\",\r\n                            \"targetPort\": 8888,\r\n                        }],\r\n
    \                       \"selector\": {\r\n                            \"app\":
    \"ml-pipeline-visualizationserver\",\r\n                        },\r\n                    },\r\n
    \               },\r\n                # Artifact fetcher related resources below.\r\n
    \               {\r\n                    \"apiVersion\": \"apps/v1\",\r\n                    \"kind\":
    \"Deployment\",\r\n                    \"metadata\": {\r\n                        \"labels\":
    {\r\n                            \"app\": \"ml-pipeline-ui-artifact\"\r\n                        },\r\n
    \                       \"name\": \"ml-pipeline-ui-artifact\",\r\n                        \"namespace\":
    namespace,\r\n                    },\r\n                    \"spec\": {\r\n                        \"selector\":
    {\r\n                            \"matchLabels\": {\r\n                                \"app\":
    \"ml-pipeline-ui-artifact\"\r\n                            }\r\n                        },\r\n
    \                       \"template\": {\r\n                            \"metadata\":
    {\r\n                                \"labels\": {\r\n                                    \"app\":
    \"ml-pipeline-ui-artifact\"\r\n                                },\r\n                                \"annotations\":
    disable_istio_sidecar and {\r\n                                    \"sidecar.istio.io/inject\":
    \"false\"\r\n                                } or {},\r\n                            },\r\n
    \                           \"spec\": {\r\n                                \"containers\":
    [{\r\n                                    \"name\":\r\n                                        \"ml-pipeline-ui-artifact\",\r\n
    \                                   \"image\": f\"{frontend_image}:{frontend_tag}\",\r\n
    \                                   \"imagePullPolicy\":\r\n                                        \"IfNotPresent\",\r\n
    \                                   \"ports\": [{\r\n                                        \"containerPort\":
    3000\r\n                                    }],\r\n                                    \"env\":
    [\r\n                                        {\r\n                                            \"name\":
    \"MINIO_ACCESS_KEY\",\r\n                                            \"valueFrom\":
    {\r\n                                                \"secretKeyRef\": {\r\n                                                    \"key\":
    \"accesskey\",\r\n                                                    \"name\":
    \"mlpipeline-minio-artifact\"\r\n                                                }\r\n
    \                                           }\r\n                                        },\r\n
    \                                       {\r\n                                            \"name\":
    \"MINIO_SECRET_KEY\",\r\n                                            \"valueFrom\":
    {\r\n                                                \"secretKeyRef\": {\r\n                                                    \"key\":
    \"secretkey\",\r\n                                                    \"name\":
    \"mlpipeline-minio-artifact\"\r\n                                                }\r\n
    \                                           }\r\n                                        }\r\n
    \                                   ],\r\n                                    \"resources\":
    {\r\n                                        \"requests\": {\r\n                                            \"cpu\":
    \"10m\",\r\n                                            \"memory\": \"70Mi\"\r\n
    \                                       },\r\n                                        \"limits\":
    {\r\n                                            \"cpu\": \"100m\",\r\n                                            \"memory\":
    \"500Mi\"\r\n                                        },\r\n                                    }\r\n
    \                               }],\r\n                                \"serviceAccountName\":\r\n
    \                                   \"default-editor\"\r\n                            }\r\n
    \                       }\r\n                    }\r\n                },\r\n                {\r\n
    \                   \"apiVersion\": \"v1\",\r\n                    \"kind\": \"Service\",\r\n
    \                   \"metadata\": {\r\n                        \"name\": \"ml-pipeline-ui-artifact\",\r\n
    \                       \"namespace\": namespace,\r\n                        \"labels\":
    {\r\n                            \"app\": \"ml-pipeline-ui-artifact\"\r\n                        }\r\n
    \                   },\r\n                    \"spec\": {\r\n                        \"ports\":
    [{\r\n                            \"name\":\r\n                                \"http\",
    \ # name is required to let istio understand request protocol\r\n                            \"port\":
    80,\r\n                            \"protocol\": \"TCP\",\r\n                            \"targetPort\":
    3000\r\n                        }],\r\n                        \"selector\": {\r\n
    \                           \"app\": \"ml-pipeline-ui-artifact\"\r\n                        }\r\n
    \                   }\r\n                },\r\n            ]\r\n            print('Received
    request:\\n', json.dumps(parent, sort_keys=True))\r\n            print('Desired
    resources except secrets:\\n', json.dumps(desired_resources, sort_keys=True))\r\n
    \           # Moved after the print argument because this is sensitive data.\r\n
    \           desired_resources.append({\r\n                \"apiVersion\": \"v1\",\r\n
    \               \"kind\": \"Secret\",\r\n                \"metadata\": {\r\n                    \"name\":
    \"mlpipeline-minio-artifact\",\r\n                    \"namespace\": namespace,\r\n
    \               },\r\n                \"data\": {\r\n                    \"accesskey\":
    minio_access_key,\r\n                    \"secretkey\": minio_secret_key,\r\n
    \               },\r\n            })\r\n\r\n            return {\"status\": desired_status,
    \"children\": desired_resources}\r\n\r\n        def do_POST(self):\r\n            #
    Serve the sync() function as a JSON webhook.\r\n            observed = json.loads(\r\n
    \               self.rfile.read(int(self.headers.get(\"content-length\"))))\r\n
    \           desired = self.sync(observed[\"parent\"], observed[\"children\"])\r\n\r\n
    \           self.send_response(200)\r\n            self.send_header(\"Content-type\",
    \"application/json\")\r\n            self.end_headers()\r\n            self.wfile.write(bytes(json.dumps(desired),
    'utf-8'))\r\n\r\n    return HTTPServer((url, int(controller_port)), Controller)\r\n\r\n\r\nif
    __name__ == \"__main__\":\r\n    main()\r\n"
