apiVersion: v1
data:
  spawner_ui_config.yaml: |-
    "# --------------------------------------------------------------\r\n#
    Configuration file for the Kubeflow Notebooks UI.\r\n#\r\n# About the "readOnly"
    configs:\r\n#  - when "readOnly" is set to \"true\", the respective option\r\n#
    \   will be disabled for users and only set by the admin\r\n#  - when 'readOnly'
    is missing, it defaults to 'false'\r\n# --------------------------------------------------------------\r\n\r\nspawnerFormDefaults:\r\n
    \ ################################################################\r\n  # Container
    Images\r\n  ################################################################\r\n
    \ # if users can input custom images, or only select from dropdowns\r\n  allowCustomImage:
    true\r\n\r\n  # if the registry of the container image is hidden from display\r\n
    \ hideRegistry: true\r\n\r\n  # if the tag of the container image is hidden from
    display\r\n  hideTag: false\r\n\r\n  # configs for the ImagePullPolicy\r\n  imagePullPolicy:\r\n
    \   readOnly: false\r\n\r\n    # the default ImagePullPolicy\r\n    # (possible
    values: \"Always\", \"IfNotPresent\", \"Never\")\r\n    value: IfNotPresent\r\n\r\n
    \ ################################################################\r\n  # Jupyter-like
    Container Images\r\n  #\r\n  # NOTES:\r\n  #  - the "image" section is used for
    \"Jupyter-like\" apps whose\r\n  #    HTTP path is configured by the \"NB_PREFIX\"
    environment variable\r\n  ################################################################\r\n
    \ image:\r\n    # the default container image\r\n    value: kubeflownotebookswg/jupyter-scipy:v1.8.0\r\n\r\n
    \   # the list of available container images in the dropdown\r\n    options:\r\n
    \   - kubeflownotebookswg/jupyter-scipy:v1.8.0\r\n    - kubeflownotebookswg/jupyter-pytorch-full:v1.8.0\r\n
    \   - kubeflownotebookswg/jupyter-pytorch-cuda-full:v1.8.0\r\n    - kubeflownotebookswg/jupyter-tensorflow-full:v1.8.0\r\n
    \   - kubeflownotebookswg/jupyter-tensorflow-cuda-full:v1.8.0\r\n\r\n  ################################################################\r\n
    \ # VSCode-like Container Images (Group 1)\r\n  #\r\n  # NOTES:\r\n  #  - the
    "imageGroupOne" section is used for \"VSCode-like\" apps that\r\n  #    expose
    themselves under the HTTP root path \"/\" and support path\r\n  #    rewriting
    without breaking\r\n  #  - the annotation "notebooks.kubeflow.org/http-rewrite-uri:
    \"/\"" is\r\n  #    set on Notebooks spawned by this group, to make Istio rewrite\r\n
    \ #    the path of HTTP requests to the HTTP root\r\n  ################################################################\r\n
    \ imageGroupOne:\r\n    # the default container image\r\n    value: kubeflownotebookswg/codeserver-python:v1.8.0\r\n\r\n
    \   # the list of available container images in the dropdown\r\n    options:\r\n
    \   - kubeflownotebookswg/codeserver-python:v1.8.0\r\n\r\n  ################################################################\r\n
    \ # RStudio-like Container Images (Group 2)\r\n  #\r\n  # NOTES:\r\n  #  - the
    "imageGroupTwo" section is used for \"RStudio-like\" apps whose\r\n  #    HTTP
    path is configured by the \"X-RStudio-Root-Path\" header\r\n  #  - the annotation
    "notebooks.kubeflow.org/http-rewrite-uri: \"/\"" is\r\n  #    set on Notebooks
    spawned by this group, to make Istio rewrite\r\n  #    the path of HTTP requests
    to the HTTP root\r\n  #  - the annotation "notebooks.kubeflow.org/http-headers-request-set"
    is\r\n  #    set on Notebooks spawned by this group, such that Istio injects the\r\n
    \ #    \"X-RStudio-Root-Path\" header to all request\r\n  ################################################################\r\n
    \ imageGroupTwo:\r\n    # the default container image\r\n    value: kubeflownotebookswg/rstudio-tidyverse:v1.8.0\r\n\r\n
    \   # the list of available container images in the dropdown\r\n    options:\r\n
    \   - kubeflownotebookswg/rstudio-tidyverse:v1.8.0\r\n\r\n  ################################################################\r\n
    \ # CPU Resources\r\n  ################################################################\r\n
    \ cpu:\r\n    readOnly: false\r\n\r\n    # the default cpu request for the container\r\n
    \   value: \"0.5\"\r\n\r\n    # a factor by which to multiply the CPU request
    calculate the cpu limit\r\n    # (to disable cpu limits, set as \"none\")\r\n
    \   limitFactor: \"1.2\"\r\n\r\n  ################################################################\r\n
    \ # Memory Resources\r\n  ################################################################\r\n
    \ memory:\r\n    readOnly: false\r\n\r\n    # the default memory request for the
    container\r\n    value: \"1.0Gi\"\r\n\r\n    # a factor by which to multiply the
    memory request calculate the memory limit\r\n    # (to disable memory limits,
    set as \"none\")\r\n    limitFactor: \"1.2\"\r\n\r\n  ################################################################\r\n
    \ # GPU/Device-Plugin Resources\r\n  ################################################################\r\n
    \ gpus:\r\n    readOnly: false\r\n\r\n    # configs for gpu/device-plugin limits
    of the container\r\n    # https://kubernetes.io/docs/tasks/manage-gpus/scheduling-gpus/#using-device-plugins\r\n
    \   value:\r\n      # the "limitKey" of the default vendor\r\n      # (to have
    no default, set as \"\")\r\n      vendor: \"\"\r\n\r\n      # the list of available
    vendors in the dropdown\r\n      #  "limitsKey" - what will be set as the actual
    limit\r\n      #  "uiName" - what will be displayed in the dropdown UI\r\n      vendors:\r\n
    \     - limitsKey: \"nvidia.com/gpu\"\r\n        uiName: \"NVIDIA\"\r\n      -
    limitsKey: \"amd.com/gpu\"\r\n        uiName: \"AMD\"\r\n\r\n      # the default
    value of the limit\r\n      # (possible values: \"none\", \"1\", \"2\", \"4\",
    \"8\")\r\n      num: \"none\"\r\n\r\n  ################################################################\r\n
    \ # Workspace Volumes\r\n  ################################################################\r\n
    \ workspaceVolume:\r\n    readOnly: false\r\n\r\n    # the default workspace volume
    to be created and mounted\r\n    # (to have no default, set "value: null")\r\n
    \   value:\r\n      mount: /home/jovyan\r\n\r\n      # pvc configs for creating
    new workspace volumes\r\n      # https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.24/#persistentvolumeclaim-v1-core\r\n
    \     newPvc:\r\n        metadata:\r\n          # \"{notebook-name}\" is replaced
    with the Notebook name\r\n          name: \"{notebook-name}-workspace\"\r\n        spec:\r\n
    \         #storageClassName: my-storage-class\r\n          resources:\r\n            requests:\r\n
    \             storage: 5Gi\r\n          accessModes:\r\n          - ReadWriteOnce\r\n\r\n
    \ ################################################################\r\n  # Data
    Volumes\r\n  ################################################################\r\n
    \ dataVolumes:\r\n    readOnly: false\r\n\r\n    # a list of additional data volumes
    to be created and/or mounted\r\n    value: []\r\n    #value:\r\n    #  - mount:
    /home/jovyan/datavol-1\r\n    #    newPvc:\r\n    #      metadata:\r\n    #        name:
    \"{notebook-name}-datavol-1\"\r\n    #      spec:\r\n    #        resources:\r\n
    \   #          requests:\r\n    #            storage: 5Gi\r\n    #        accessModes:\r\n
    \   #          - ReadWriteOnce\r\n    #\r\n    #  - mount: /home/jovyan/datavol-1\r\n
    \   #    existingSource:\r\n    #      persistentVolumeClaim:\r\n    #        claimName:
    \"test-pvc\"\r\n\r\n  ################################################################\r\n
    \ # Affinity\r\n  ################################################################\r\n
    \ affinityConfig:\r\n    readOnly: false\r\n\r\n    # the "configKey" of the default
    affinity config\r\n    # (to have no default, set as \"\")\r\n    # (if "readOnly",
    the default "value" will be the only accessible option)\r\n    value: \"\"\r\n\r\n
    \   # the list of available affinity configs in the dropdown\r\n    options: []\r\n
    \   #options:\r\n    #  - configKey: \"dedicated_node_per_notebook\"\r\n    #
    \   displayName: \"Dedicated Node Per Notebook\"\r\n    #    affinity:\r\n    #
    \     # Require a Node with label "lifecycle=kubeflow-notebook"\r\n    #      nodeAffinity:\r\n
    \   #        requiredDuringSchedulingIgnoredDuringExecution:\r\n    #          nodeSelectorTerms:\r\n
    \   #            - matchExpressions:\r\n    #                - key: \"lifecycle\"\r\n
    \   #                  operator: \"In\"\r\n    #                  values:\r\n
    \   #                    - \"kubeflow-notebook\"\r\n    #\r\n    #      # Require
    a Node WITHOUT an existing Pod having "notebook-name" label\r\n    #      podAntiAffinity:\r\n
    \   #        requiredDuringSchedulingIgnoredDuringExecution:\r\n    #          -
    labelSelector:\r\n    #              matchExpressions:\r\n    #                -
    key: \"notebook-name\"\r\n    #                  operator: \"Exists\"\r\n    #
    \           topologyKey: \"kubernetes.io/hostname\"\r\n    #            # WARNING:
    "namespaceSelector" is Beta in 1.22 and Stable in 1.24,\r\n    #            #
    \         setting to {} is required for affinity to work across Namespaces\r\n
    \   #            namespaceSelector: {}\r\n\r\n  ################################################################\r\n
    \ # Tolerations\r\n  ################################################################\r\n
    \ tolerationGroup:\r\n    readOnly: false\r\n\r\n    # the "groupKey" of the default
    toleration group\r\n    # (to have no default, set as \"\")\r\n    # (if "readOnly",
    the default "value" will be the only accessible option)\r\n    value: \"\"\r\n\r\n
    \   # the list of available toleration groups in the dropdown\r\n    options:
    []\r\n    #options:\r\n    #  - groupKey: \"group_1\"\r\n    #    displayName:
    \"4 CPU 8Gb Mem at ~$X.XXX USD per day\"\r\n    #    tolerations:\r\n    #      -
    key: \"dedicated\"\r\n    #        operator: \"Equal\"\r\n    #        value:
    \"kubeflow-c5.xlarge\"\r\n    #        effect: \"NoSchedule\"\r\n    #\r\n    #
    \ - groupKey: \"group_2\"\r\n    #    displayName: \"8 CPU 16Gb Mem at ~$X.XXX
    USD per day\"\r\n    #    tolerations:\r\n    #      - key: \"dedicated\"\r\n
    \   #        operator: \"Equal\"\r\n    #        value: \"kubeflow-c5.2xlarge\"\r\n
    \   #        effect: \"NoSchedule\"\r\n    #\r\n    #  - groupKey: \"group_3\"\r\n
    \   #    displayName: \"16 CPU 32Gb Mem at ~$X.XXX USD per day\"\r\n    #    tolerations:\r\n
    \   #      - key: \"dedicated\"\r\n    #        operator: \"Equal\"\r\n    #        value:
    \"kubeflow-c5.4xlarge\"\r\n    #        effect: \"NoSchedule\"\r\n    #\r\n    #
    \ - groupKey: \"group_4\"\r\n    #    displayName: \"32 CPU 256Gb Mem at ~$X.XXX
    USD per day\"\r\n    #    tolerations:\r\n    #      - key: \"dedicated\"\r\n
    \   #        operator: \"Equal\"\r\n    #        value: \"kubeflow-r5.8xlarge\"\r\n
    \   #        effect: \"NoSchedule\"\r\n\r\n  ################################################################\r\n
    \ # Shared Memory\r\n  ################################################################\r\n
    \ shm:\r\n    readOnly: false\r\n\r\n    # the default state of the \"Enable Shared
    Memory\" toggle\r\n    value: true\r\n\r\n  ################################################################\r\n
    \ # PodDefaults\r\n  ################################################################\r\n
    \ configurations:\r\n    readOnly: false\r\n\r\n    # the list of PodDefault names
    that are selected by default\r\n    # (take care to ensure these PodDefaults exist
    in Profile Namespaces)\r\n    value: []\r\n    #value:\r\n    #  - my-pod-default\r\n\r\n
    \ ################################################################\r\n  # Environment\r\n
    \ #\r\n  # NOTE:\r\n  #  - these configs are only used by the ROK \"flavor\" of
    the UI\r\n  ################################################################\r\n
    \ environment:\r\n    readOnly: false\r\n    value: {}\r\n"
kind: ConfigMap
metadata:
  labels:
    app: jupyter-web-app
    kustomize.component: jupyter-web-app
  name: jupyter-web-app-config-d864ktd55c
  namespace: kubeflow
