{{- $namespace := .Values.global.namespace -}}
{{- if .Values.global.pvc.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.global.fullnameOverride }}-pvc
  namespace: {{ $namespace }}
  {{- with .Values.global.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
    {{- include "platform-chart.labels" . | nindent 4 }}
spec:
  accessModes:
  {{- toYaml .Values.global.pvc.accessModes | nindent 4 }}
{{- if .Values.storageClass.enabled }}
  storageClassName: {{ .Values.storageClass.name }}
{{- else if .Values.awsStorageClass.enabled }}
  storageClassName: {{ .Values.awsStorageClass.name }}
{{- else }}
  storageClassName: {{ .Values.global.pvc.storageClass | quote}}
  volumeName: {{ .Values.global.fullnameOverride }}-{{ mustLast (regexSplit "-" $namespace -1) }}-pv
{{- end }}
  resources:
    requests:
      storage: {{ .Values.global.pvc.storageRequest }}
{{- end }}