{{- if and (.Values.pdbEnabled)  (or .Values.global.deployment.enabled .Values.global.rollout.enabled .Values.global.statefulset.enabled)}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "platform-chart.fullname" . }}-pdb
  namespace: {{ .Values.global.namespace }}
  {{- with .Values.global.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
    {{- include "platform-chart.labels" . | nindent 4 }}
spec: 
  {{- include "platform-chart.pdbAvailabilitySpec" . | nindent 2}}
  selector:
   {{- if .Values.pdbSelector  }}
     {{- with .Values.pdbSelector  }}
    matchLabels:
        {{- toYaml . | nindent 6 }}
      {{- end }}
    {{- else}}
    matchLabels:
      app: {{ include "platform-chart.fullname" . }}
    {{- end }}
{{- end }}
