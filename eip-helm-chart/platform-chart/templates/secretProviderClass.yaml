{{- if .Values.global.secretManagement.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.global.secretManagement.secretProviderClassName }}
  namespace: {{ .Values.global.namespace }}
  {{- with .Values.global.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
    {{- include "platform-chart.labels" . | nindent 4 }}
spec:
  provider: azure
  secretObjects:
  {{- range .Values.global.secretManagement.objects }}
  - data:
    {{- range .data }}
    - key: {{ .key }}
      objectName: {{ .objectName }}
    {{- end }}
    secretName: {{ .secretName }}
    type: Opaque
  {{- end }}  
  parameters:
    usePodIdentity: {{ .Values.global.secretManagement.usePodIdentity | default false | quote }}
    useVMManagedIdentity: {{ .Values.global.secretManagement.useVMManagedIdentity | default false | quote }}
    clientID: {{ .Values.global.secretManagement.clientId }}
    keyvaultName: {{ .Values.global.secretManagement.keyvaultName }}
    objects: |
      array:
    {{- range .Values.global.secretManagement.objects }}
       {{- range .data }}
        - |
          objectName: {{ .objectName }}
          objectType: {{ .objectType }}  
          objectVersion: {{.objectVersion | default "" }}
      {{- end }}        
    {{- end }}
    tenantId: {{ .Values.global.secretManagement.tenantId }}
{{- end }}


---

{{- if .Values.global.awsSecretManagement.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.global.awsSecretManagement.secretProviderClassName }}
  namespace: {{ .Values.global.namespace }}
  {{- with .Values.global.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
    {{- include "platform-chart.labels" . | nindent 4 }}
spec:
  provider: aws
  secretObjects:
  {{- range .Values.global.awsSecretManagement.objects }}
  - data:
    {{- range .data }}
    {{- if .jmesPath }}
    {{- range .jmesPath }}
    - key: {{ .secretKey | default .objectAlias }}
      objectName: {{ .objectAlias }}
    {{- end }}
    {{- end }}
    {{- end }}
    secretName: {{ .secretName }}
    type: Opaque
  {{- end }}  
  parameters:
    usePodIdentity: {{ .Values.global.awsSecretManagement.usePodIdentity | default true | quote }}
    region: {{ .Values.global.awsSecretManagement.awsregion }}
    filePermission: {{ .filePermission | default "0644" | quote }}
    pathTranslation: {{ .Values.global.awsSecretManagement.awspathTranslation | default "" | quote }}
    objects: |
    {{- range .Values.global.awsSecretManagement.objects }}
       {{- range .data }}
        - objectName: {{ .objectName }}
          objectType: {{ .objectType }}  
          {{- if .objectVersionLabel }}
          objectVersionLabel: {{ .objectVersionLabel }}
          {{- end }}
          {{- if .jmesPath }}
          jmesPath:
          {{- range .jmesPath }}
          {{- if contains "-" .path }}
          - path: '"{{ .path }}"'
          {{- else }}
          - path: {{ .path }}
          {{- end }}
            objectAlias: {{ .objectAlias }}
          {{- end }}
          {{- end }}
      {{- end }}        
    {{- end }}
{{- end }}
        