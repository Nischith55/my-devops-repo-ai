{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "app-chart.serviceAccountName" . }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "app-chart.labels" . | nindent 4 }}
  {{- if .Values.global.secretManagement.enabled }}
    azure.workload.identity/use: "true"
  {{- end }}     
  annotations:
  {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if .Values.global.secretManagement.enabled }}
    azure.workload.identity/client-id: {{ .Values.global.secretManagement.clientId }}
  {{- end }}
  {{- if and .Values.global.awsSecretManagement.enabled .Values.global.awsSecretManagement.roleArn }}
    eks.amazonaws.com/role-arn: {{ .Values.global.awsSecretManagement.roleArn | quote }}
  {{- end }}

---

apiVersion: v1
kind: Secret
type: kubernetes.io/service-account-token
metadata:
  name: {{ include "app-chart.serviceAccountName" . }}-token
  annotations:
    kubernetes.io/service-account.name: {{ include "app-chart.serviceAccountName" . }}

{{- end }}
