global:
  fullnameOverride: pep-eiap-cgf-genai-prod-api
  namespace: pep-eiap-cgf-genai-prod

  labels:
    app: pep-eiap-cgf-genai-prod-api

platform-chart:
  autoscalingEnabled: false
  hpaConfigMinReplicas: 2
  hpaConfigMaxReplicas: 4
  targetCPUUtilizationPercentage: 70

  virtualService:
    enabled: true
    name: pep-eiap-cgf-genai-prod-api-vs
    hosts:
      - pep-eiap-cgf-genai-prod-api.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
    routes:
      - prefix: /
        destinationService: pep-eiap-cgf-genai-prod-api
        port: 8000

app-chart:
  replicaCount: 2

  selector:
    app: pep-eiap-cgf-genai-prod-api

  image:
    repository: pepeiapnonprodglobalcommonacr.azurecr.io/pep/eip/genai-devops-starter
    tag: "latest"

  containerPorts:
    - port: 8000
      name: app-port

  serviceAccount:
    name: pep-eiap-cgf-genai-prod-sa

  env:
    - name: APP_ENV
      value: PROD
    - name: MOCK_MODE
      value: "true"

  resources:
    limits:
      cpu: "500m"
      memory: "1024Mi"
    requests:
      cpu: "200m"
      memory: "512Mi"