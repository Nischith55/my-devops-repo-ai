global:
  spec:
    destination:
      clusterName: pep-eiap-prod-scus-global-01-aks
      namespace: pep-eiap-cgf-psm-prod

argoCDApplications:  
  potato-sourcing-matrix-api-repo:  
    enabled: true
    autoSync: true
    helm: true
    path: prod/pep-eiap-prod-scus-global-01-aks/potato-sourcing-matrix-api-repo
    ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
      - /spec/replicas
  genai-devops-starter:
    enabled: true
    autoSync: true
    helm: true
    path: prod/pep-eiap-prod-scus-global-01-aks/genai-devops-starter
    ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
      - /spec/replicas
