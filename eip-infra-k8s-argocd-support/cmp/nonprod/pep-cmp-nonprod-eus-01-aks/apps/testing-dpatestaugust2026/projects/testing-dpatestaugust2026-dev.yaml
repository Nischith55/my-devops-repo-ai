    - p, proj:testing-dpatestaugust2026-dev:testing-dpatestaugust2026-dev-user, applications, sync, testing-dpatestaugust2026-dev/*, allow
    - p, proj:testing-dpatestaugust2026-dev:testing-dpatestaugust2026-dev-user, repositories, get, testing-dpatestaugust2026-dev/*, allow
    - p, proj:testing-dpatestaugust2026-dev:testing-dpatestaugust2026-dev-user, *, delete, *, deny
    groups:
    - "Team.Support.CGF.NonProd.devX"
    - "Team.Support.EIAP.READ"