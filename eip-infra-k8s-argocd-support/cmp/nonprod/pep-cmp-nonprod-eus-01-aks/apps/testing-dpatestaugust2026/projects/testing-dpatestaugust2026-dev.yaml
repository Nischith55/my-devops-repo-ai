apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: testing-dpatestaugust2026-dev
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Project for testing-dpatestaugust2026-dev 
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/testing-dpatestaugust2026-argocd-configs
  - pepeiapnonprodglobalcommonacr.azurecr.io/helm 
  destinations:
  - name: pep-cmp-nonprod-eus-01-aks
    namespace: pep-cmp-cmp-cmp11-dev
  - name: pep-cmp-nonprod-eus-01-aks
    namespace: pep-cmp-ops-admin
  roles:
