apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: testblob01-testargorepo-dev
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Project for testblob01-testargorepo-dev 
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/CTO_DevX/_git/testblob01-testargorepo-argocd-configs
  - pepeiapnonprodcommonacr.azurecr.io/helm 
  destinations:
  - name: pep-cmp-nonprod-eus-01-aks
    namespace: pep-cmp-cmp-cmp11-dev
  - name: pep-cmp-nonprod-eus-01-aks
    namespace: pep-cmp-ops-admin
  roles:
  - name: testblob01-testargorepo-dev-admin
    description: Admin privileges to testblob01-testargorepo-dev
    policies:
    - p, proj:testblob01-testargorepo-dev:testblob01-testargorepo-dev-admin, applications, *, testblob01-testargorepo-dev/*, allow
    - p, proj:testblob01-testargorepo-dev:testblob01-testargorepo-dev-admin, repositories, *, testblob01-testargorepo-dev/*, allow
    groups:
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
  - name: testblob01-testargorepo-dev-user
    description: Read-only privileges to testblob01-testargorepo-dev
    policies:
    - p, proj:testblob01-testargorepo-dev:testblob01-testargorepo-dev-user, applications, get, testblob01-testargorepo-dev/*, allow
    - p, proj:testblob01-testargorepo-dev:testblob01-testargorepo-dev-user, applications, sync, testblob01-testargorepo-dev/*, allow
    - p, proj:testblob01-testargorepo-dev:testblob01-testargorepo-dev-user, repositories, get, testblob01-testargorepo-dev/*, allow
    - p, proj:testblob01-testargorepo-dev:testblob01-testargorepo-dev-user, *, delete, *, deny
    groups:
    - "Team.Support.CGF.NonProd.devX"
    - "Team.Support.EIAP.READ"