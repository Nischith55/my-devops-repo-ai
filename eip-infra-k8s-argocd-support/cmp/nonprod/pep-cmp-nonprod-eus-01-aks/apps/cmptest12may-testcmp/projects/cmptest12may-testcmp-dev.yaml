    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
  - name: cmptest12may-testcmp-dev-user
    description: Read-only privileges to cmptest12may-testcmp-dev
    policies:
    - p, proj:cmptest12may-testcmp-dev:cmptest12may-testcmp-dev-user, applications, get, cmptest12may-testcmp-dev/*, allow
    - p, proj:cmptest12may-testcmp-dev:cmptest12may-testcmp-dev-user, applications, sync, cmptest12may-testcmp-dev/*, allow
    - p, proj:cmptest12may-testcmp-dev:cmptest12may-testcmp-dev-user, repositories, get, cmptest12may-testcmp-dev/*, allow
    - p, proj:cmptest12may-testcmp-dev:cmptest12may-testcmp-dev-user, *, delete, *, deny
    groups:
    - "Team.Support.CGF.NonProd.devX"
    - "Team.Support.EIAP.READ"