apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: testnode0001-testnoderelease-qa
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Project for testnode0001-testnoderelease-qa 
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/CTO_DevX/_git/testnode0001-testnoderelease-argocd-configs
  - pepeiapnonprodglobalcommonacr.azurecr.io/pep/cmp/pep-cgf-devx-helloworld-react18-vite-frontend-service/helm 
  destinations:
  - name: pep-cmp-nonprod-eus-01-aks
    namespace: pep-cmp-test-test-qa
  - name: pep-cmp-nonprod-eus-01-aks
    namespace: pep-cmp-ops-admin
  roles:
