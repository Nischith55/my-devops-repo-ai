    description: Admin privileges to testnode0001-testnoderelease-qa
    policies:
    - p, proj:testnode0001-testnoderelease-qa:testnode0001-testnoderelease-qa-admin, applications, *, testnode0001-testnoderelease-qa/*, allow
    - p, proj:testnode0001-testnoderelease-qa:testnode0001-testnoderelease-qa-admin, repositories, *, testnode0001-testnoderelease-qa/*, allow
