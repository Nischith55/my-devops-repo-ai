  - name: testnode0001-testnoderelease-qa-user
    description: Read-only privileges to testnode0001-testnoderelease-qa
    policies:
    - p, proj:testnode0001-testnoderelease-qa:testnode0001-testnoderelease-qa-user, applications, get, testnode0001-testnoderelease-qa/*, allow
    - p, proj:testnode0001-testnoderelease-qa:testnode0001-testnoderelease-qa-user, applications, sync, testnode0001-testnoderelease-qa/*, allow
    - p, proj:testnode0001-testnoderelease-qa:testnode0001-testnoderelease-qa-user, repositories, get, testnode0001-testnoderelease-qa/*, allow
    - p, proj:testnode0001-testnoderelease-qa:testnode0001-testnoderelease-qa-user, *, delete, *, deny
    groups:
    - "Team.Support.CGF.NonProd.devX"
    - "Team.Support.EIAP.READ"