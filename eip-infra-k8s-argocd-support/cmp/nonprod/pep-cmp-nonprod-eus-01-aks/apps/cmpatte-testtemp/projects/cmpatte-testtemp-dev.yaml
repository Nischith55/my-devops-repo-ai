apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: cmpatte-testtemp-dev
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Project for cmpatte-testtemp-dev 
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/cmpatte-testtemp-argocd-configs
  - pepeiapnonprodcommonacr.azurecr.io/helm 
  destinations:
  - name: pep-cmp-nonprod-eus-01-aks
    namespace: pep-cmp-cmp-cmp11-dev
  - name: pep-cmp-nonprod-eus-01-aks
    namespace: pep-cmp-ops-admin
  roles:
  - name: cmpatte-testtemp-dev-admin
    description: Admin privileges to cmpatte-testtemp-dev
    policies:
    - p, proj:cmpatte-testtemp-dev:cmpatte-testtemp-dev-admin, applications, *, cmpatte-testtemp-dev/*, allow
    - p, proj:cmpatte-testtemp-dev:cmpatte-testtemp-dev-admin, repositories, *, cmpatte-testtemp-dev/*, allow
    groups:
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
  - name: cmpatte-testtemp-dev-user
    description: Read-only privileges to cmpatte-testtemp-dev
    policies:
    - p, proj:cmpatte-testtemp-dev:cmpatte-testtemp-dev-user, applications, get, cmpatte-testtemp-dev/*, allow
    - p, proj:cmpatte-testtemp-dev:cmpatte-testtemp-dev-user, applications, sync, cmpatte-testtemp-dev/*, allow
    - p, proj:cmpatte-testtemp-dev:cmpatte-testtemp-dev-user, repositories, get, cmpatte-testtemp-dev/*, allow
    - p, proj:cmpatte-testtemp-dev:cmpatte-testtemp-dev-user, *, delete, *, deny
    groups:
    - "Team.Support.CGF.NonProd.devX"
    - "Team.Support.EIAP.READ"