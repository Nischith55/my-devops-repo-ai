apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: pythontst-releasetestrepo-dev
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Project for pythontst-releasetestrepo-dev 
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/CTO_DevX/_git/pythontst-releasetestrepo-argocd-configs
  - pepeiapnonprodglobalcommonacr.azurecr.io/pep/cmp/gt-test-1-devx-python/helm 
  destinations:
  - name: pep-cmp-nonprod-eus-01-aks
    namespace: pep-cmp-cmp-cmp11-dev
  - name: pep-cmp-nonprod-eus-01-aks
    namespace: pep-cmp-ops-admin
  roles:
  - name: pythontst-releasetestrepo-dev-admin
    description: Admin privileges to pythontst-releasetestrepo-dev
    policies:
    - p, proj:pythontst-releasetestrepo-dev:pythontst-releasetestrepo-dev-admin, applications, *, pythontst-releasetestrepo-dev/*, allow
    - p, proj:pythontst-releasetestrepo-dev:pythontst-releasetestrepo-dev-admin, repositories, *, pythontst-releasetestrepo-dev/*, allow
    groups:
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
  - name: pythontst-releasetestrepo-dev-user
    description: Read-only privileges to pythontst-releasetestrepo-dev
    policies:
    - p, proj:pythontst-releasetestrepo-dev:pythontst-releasetestrepo-dev-user, applications, get, pythontst-releasetestrepo-dev/*, allow
    - p, proj:pythontst-releasetestrepo-dev:pythontst-releasetestrepo-dev-user, applications, sync, pythontst-releasetestrepo-dev/*, allow
    - p, proj:pythontst-releasetestrepo-dev:pythontst-releasetestrepo-dev-user, repositories, get, pythontst-releasetestrepo-dev/*, allow
    - p, proj:pythontst-releasetestrepo-dev:pythontst-releasetestrepo-dev-user, *, delete, *, deny
    groups:
    - "Team.Support.CGF.NonProd.devX"
    - "Team.Support.EIAP.READ"