apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apptest-testteam123-dev-bootstrapper
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: argocd
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
  sources:
  - ref: values
    repoURL: https://dev.azure.com/PepsiCoIT/CTO_DevX/_git/apptest-testteam123-argocd-configs
    targetRevision: develop
  - repoURL: pepeiapnonprodcommonacr.azurecr.io/helm
    targetRevision: 0.2.6
    chart: argocd-app-bootstrapper
    helm:
      releaseName: apptest-testteam123-dev
      valueFiles:
      - $values/dev/pep-cmp-nonprod-eus-01-aks/argocd-app-configs.yaml
      values: "global:\n  env: prod\n  helm:\n    enabled: false\n    repo: pepeiapnonprodcommonacr.azurecr.io\n\
        \    chart: umbrellachart\n    revision: 2.2.1\n    values:\n      platform-chart:\n\
        \        destination:\n          jobImage: pepeiapnonprodcommonacr.azurecr.io/pep/eip/infra/azurepipeline/devopsagent:20240222.1\n\
        \          jobNS: pep-cmp-ops-admin\n          jobServiceAccount: gw-update-sa\n\
        \  spec:\n    project: apptest-testteam123-dev\n    source:\n      repoURL:\
        \ https://dev.azure.com/PepsiCoIT/CTO_DevX/_git/apptest-testteam123-argocd-configs\n\
        \      repoName: apptest-testteam123-argocd-configs\n      targetRevision:\
        \ develop\n      manifest: helm-values.yaml\n    sync:\n      prune: false\n\
        \    notifications:\n      notifyEmail: test@pepsico.com\n    destination:\n\
        \      clusterName: pep-cmp-nonprod-eus-01-aks\n      jobImage: pepeiapprodcommonacr.azurecr.io/pep/eip/infra/azurepipeline/devopsagent\n"
