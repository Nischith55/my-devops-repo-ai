apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: apptest-testteam123-dev
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  description: Project for apptest-testteam123-dev
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/CTO_DevX/_git/apptest-testteam123-argocd-configs
  - pepeiapnonprodcommonacr.azurecr.io/helm
  destinations:
  - name: pep-cmp-nonprod-eus-01-aks
    namespace: pep-cmp-cmp-cmp11-dev
  - name: pep-cmp-nonprod-eus-01-aks
    namespace: pep-cmp-ops-admin
  roles:
  - name: apptest-testteam123-dev-admin
    description: Admin privileges to apptest-testteam123-dev
    policies:
    - p, proj:apptest-testteam123-dev:apptest-testteam123-dev-admin, applications,
      *, apptest-testteam123-dev/*, allow
    - p, proj:apptest-testteam123-dev:apptest-testteam123-dev-admin, repositories,
      *, apptest-testteam123-dev/*, allow
    groups:
    - Team.Support.EIAP.GLOBAL.DevSecOps.Developer
  - name: apptest-testteam123-dev-user
    description: Read-only privileges to apptest-testteam123-dev
    policies:
    - p, proj:apptest-testteam123-dev:apptest-testteam123-dev-user, applications,
      get, apptest-testteam123-dev/*, allow
    - p, proj:apptest-testteam123-dev:apptest-testteam123-dev-user, applications,
      sync, apptest-testteam123-dev/*, allow
    - p, proj:apptest-testteam123-dev:apptest-testteam123-dev-user, repositories,
      get, apptest-testteam123-dev/*, allow
    - p, proj:apptest-testteam123-dev:apptest-testteam123-dev-user, *, delete, *,
      deny
    groups:
    - Team.Support.CGF.NonProd.devX
    - Team.Support.EIAP.GLOBAL.CMP.Read
    - Team.Support.CGF.NonProd.devX
    - Team.Support.EIAP.READ
  privilegedGroups:
  - Team.Support.CGF.NonProd.devX
