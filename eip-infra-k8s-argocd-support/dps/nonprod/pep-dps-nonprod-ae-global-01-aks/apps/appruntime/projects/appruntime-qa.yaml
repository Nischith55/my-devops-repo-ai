apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: appruntime-qa
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app       
spec:
  description: Project for appruntime-qa   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/appruntime-argocd-configs
  - pepdpsnonprodacr.azurecr.io/helm
  destinations:
  - name: pep-dps-nonprod-ae-global-01-aks
    namespace: pep-dps-cgf-apprt-qa
  - name: pep-dps-nonprod-ae-global-01-aks
    namespace: pep-dps-ops-admin
  roles:
  - name: appruntime-qa-admin
    description: Admin privileges to appruntime-qa
    policies:
    - p, proj:appruntime-qa:appruntime-qa-admin, applications, *, appruntime-qa/*, allow
    - p, proj:appruntime-qa:appruntime-qa-admin, applications, get, argocd/*, allow
    - p, proj:appruntime-qa:appruntime-qa-admin, repositories, *, appruntime-qa/*, allow
    groups:
    - "Team.Support.CGF.NonProd.devops"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: appruntime-qa-user
    description: Read-only privileges to appruntime-qa
    policies:
    - p, proj:appruntime-qa:appruntime-qa-user, applications, get, appruntime-qa/*, allow
    - p, proj:appruntime-qa:appruntime-qa-user, applications, sync, appruntime-qa/*, allow
    - p, proj:appruntime-qa:appruntime-qa-user, repositories, get, appruntime-qa/*, allow
    - p, proj:appruntime-qa:appruntime-qa-user, applications, action/apps/Deployment/restart, appruntime-qa/*, allow
    groups:
    - "Team.App.DPS.AppRuntime.Dev"
    - "Team.Support.CGF.NonProd.devops"
    - "Team.Support.EIAP.READ"