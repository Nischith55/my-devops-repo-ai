apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: retail360-qa-mx
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Project for retail360-qa-mx   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/r360-argocd-configs
  - pepdpsnonprodacr.azurecr.io/helm
  destinations:
  - name: pep-dps-nonprod-eus-global-01-aks
    namespace: pep-dps-dps-re360-qa
  - name: pep-dps-nonprod-eus-global-01-aks
    namespace: pep-dps-ops-admin
  roles:
  - name: retail360-qa-mx-admin
    description: Admin privileges to retail360-qa-mx
    policies:
    - p, proj:retail360-qa-mx:retail360-qa-mx-admin, applications, *, retail360-qa-mx/*, allow
    - p, proj:retail360-qa-mx:retail360-qa-mx-admin, repositories, *, retail360-qa-mx/*, allow
    groups:
    - "Team.Support.CGF.NonProd.devops"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: retail360-qa-mx-user
    description: Read-only privileges to retail360-qa-mx
    policies:
    - p, proj:retail360-qa-mx:retail360-qa-mx-user, applications, get, retail360-qa-mx/*, allow
    - p, proj:retail360-qa-mx:retail360-qa-mx-user, applications, sync, retail360-qa-mx/*, allow
    - p, proj:retail360-qa-mx:retail360-qa-mx-user, repositories, get, retail360-qa-mx/*, allow
    - p, proj:retail360-qa-mx:retail360-qa-mx-user, applications, action/apps/Deployment/restart, retail360-qa-mx/*, allow
    groups:
    - "Team.App.SupportDPS.OnePEP.CAF"
    - "Team.Support.EIAP.READ"
    - "Team.Support.CGF.NonProd.devops"    