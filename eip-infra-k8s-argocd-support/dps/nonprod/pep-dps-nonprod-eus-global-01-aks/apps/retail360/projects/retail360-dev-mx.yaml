apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: retail360-dev-mx
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app    
spec:
  description: Project for retail360-dev-mx   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/r360-argocd-configs
  - pepdpsnonprodacr.azurecr.io/helm
  destinations:
  - name: pep-dps-nonprod-eus-global-01-aks
    namespace: pep-dps-dps-re360-dev
  - name: pep-dps-nonprod-eus-global-01-aks
    namespace: pep-dps-ops-admin
  roles:
  - name: retail360-dev-mx-admin
    description: Admin privileges to retail360-dev-mx
    policies:
    - p, proj:retail360-dev-mx:retail360-dev-mx-admin, applications, *, retail360-dev-mx/*, allow
    - p, proj:retail360-dev-mx:retail360-dev-mx-admin, repositories, *, retail360-dev-mx/*, allow
    groups:
    - "Team.App.DPS.DevOps.NonProd"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: retail360-dev-mx-user
    description: Read-only privileges to retail360-dev-mx
    policies:
    - p, proj:retail360-dev-mx:retail360-dev-mx-user, applications, get, retail360-dev-mx/*, allow
    - p, proj:retail360-dev-mx:retail360-dev-mx-user, applications, sync, retail360-dev-mx/*, allow
    - p, proj:retail360-dev-mx:retail360-dev-mx-user, repositories, get, retail360-dev-mx/*, allow
    - p, proj:retail360-dev-mx:retail360-dev-mx-user, applications, action/apps/Deployment/restart, retail360-dev-mx/*, allow
    groups:
    - "Team.App.SupportDPS.OnePEP.CAF"
    - "Team.Support.EIAP.READ"
    - "Team.App.DPS.DevOps.NonProd"    