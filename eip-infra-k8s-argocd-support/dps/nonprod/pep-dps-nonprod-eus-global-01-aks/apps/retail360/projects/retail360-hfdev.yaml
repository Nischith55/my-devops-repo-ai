apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: retail360-hfdev
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app    
spec:
  description: Project for retail360-hfdev   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/r360-argocd-configs
  - pepdpsnonprodacr.azurecr.io/helm
  destinations:
  - name: pep-dps-nonprod-eus-global-01-aks
    namespace: pep-dps-cgf-retailhfd-dev
  - name: pep-dps-nonprod-eus-global-01-aks
    namespace: pep-dps-ops-admin

  - name: pep-dps-nonprod-eus-global-01-aks
    namespace: pep-dps-dps-re360hf-dev
    server: https://kubernetes.default.svc

  - name: pep-dps-nonprod-eus-global-01-aks
    namespace:  pep-dps-dps-aiq360hf-dev
    server: https://kubernetes.default.svc

  roles:
  - name: retail360-hfdev-admin
    description: Admin privileges to retail360-hfdev
    policies:
    - p, proj:retail360-hfdev:retail360-hfdev-admin, applications, *, retail360-hfdev/*, allow
    - p, proj:retail360-hfdev:retail360-hfdev-admin, applications, get, argocd/*, allow
    - p, proj:retail360-hfdev:retail360-hfdev-admin, repositories, *, retail360-hfdev/*, allow
    groups:
    - "Team.Support.CGF.NonProd.devops"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: retail360-hfdev-user
    description: Read-only privileges to retail360-hfdev
    policies:
    - p, proj:retail360-hfdev:retail360-hfdev-user, applications, get, retail360-hfdev/*, allow
    - p, proj:retail360-hfdev:retail360-hfdev-user, applications, sync, retail360-hfdev/*, allow
    - p, proj:retail360-hfdev:retail360-hfdev-user, repositories, get, retail360-hfdev/*, allow
    - p, proj:retail360-hfdev:retail360-hfdev-user, applications, action/apps/Deployment/restart, retail360-hfdev/*, allow
    groups:
    - "Team.App.SupportDPS.OnePEP.CAF"
    - "Team.Support.EIAP.READ"
    - "Team.Support.CGF.NonProd.devops"    