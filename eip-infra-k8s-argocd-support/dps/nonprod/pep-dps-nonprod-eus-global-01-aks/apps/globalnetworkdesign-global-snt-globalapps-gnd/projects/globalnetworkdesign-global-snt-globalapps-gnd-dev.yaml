apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: globalnetworkdesign-global-snt-globalapps-gnd-dev
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Project for globalnetworkdesign-global-snt-globalapps-gnd-dev 
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT2/Global_SnT_GlobalApps_GND/_git/globalnetworkdesign-global-snt-globalapps-gnd-argocd-configs
  - pepdpsnonprodacr.azurecr.io/helm 
  destinations:
  - name: pep-dps-nonprod-eus-global-01-aks
    namespace: pep-dps-dps-gnddata-dev
  - name: pep-dps-nonprod-eus-global-01-aks
    namespace: pep-dps-ops-admin
  roles:
  - name: globalnetworkdesign-global-snt-globalapps-gnd-dev-admin
