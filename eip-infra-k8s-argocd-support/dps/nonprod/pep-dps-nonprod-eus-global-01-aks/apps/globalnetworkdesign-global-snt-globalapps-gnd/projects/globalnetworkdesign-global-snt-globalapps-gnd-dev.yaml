    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
    - "Team.Support.CGF.NonProd.devops"

  - name: globalnetworkdesign-global-snt-globalapps-gnd-dev-user
    description: Read-only privileges to globalnetworkdesign-global-snt-globalapps-gnd-dev
    policies:
    - p, proj:globalnetworkdesign-global-snt-globalapps-gnd-dev:globalnetworkdesign-global-snt-globalapps-gnd-dev-user, applications, get, globalnetworkdesign-global-snt-globalapps-gnd-dev/*, allow
