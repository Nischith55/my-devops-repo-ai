    - p, proj:globalnetworkdesign-global-snt-globalapps-gnd-dev:globalnetworkdesign-global-snt-globalapps-gnd-dev-user, repositories, get, globalnetworkdesign-global-snt-globalapps-gnd-dev/*, allow
    - p, proj:globalnetworkdesign-global-snt-globalapps-gnd-dev:globalnetworkdesign-global-snt-globalapps-gnd-dev-user, *, delete, *, deny
    groups:
    - "Team.Support.DPS.NonProd.GNDDATA"
    - "Team.Support.EIAP.READ"
    - "Team.Support.CGF.NonProd.devops"    