apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: globalnetworkdesign-global-snt-globalapps-gnd-dev-bootstrapper
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: argocd
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  syncPolicy:    
    automated:
      prune: false
      selfHeal: true
  sources:
  - ref: values
    repoURL: https://dev.azure.com/PepsiCoIT2/Global_SnT_GlobalApps_GND/_git/globalnetworkdesign-global-snt-globalapps-gnd-argocd-configs
    targetRevision: develop 
  - repoURL: pepdpsnonprodacr.azurecr.io/helm 
    targetRevision: "0.2.6"
    chart: argocd-app-bootstrapper 
    helm:
      releaseName: globalnetworkdesign-global-snt-globalapps-gnd-dev
      valueFiles:
      - $values/dev/pep-dps-nonprod-eus-global-01-aks/argocd-app-configs.yaml    
      values: |
        global:
          env: dev
          helm:  
            enabled: false       
            repo: pepdpsnonprodacr.azurecr.io/helm 
            chart: umbrellachart
            revision: 2.2.2
            values: 
              platform-chart:
                destination: 
                  jobImage: pepeiapnonprodcommonacr.azurecr.io/pep/eip/infra/azurepipeline/devopsagent:20240222.1
                  jobNS: pep-dps-ops-admin 
                  jobServiceAccount: gw-update-sa
          spec:
            project: globalnetworkdesign-global-snt-globalapps-gnd-dev 
            source: 
              repoURL: https://dev.azure.com/PepsiCoIT2/Global_SnT_GlobalApps_GND/_git/globalnetworkdesign-global-snt-globalapps-gnd-argocd-configs 
              repoName: globalnetworkdesign-global-snt-globalapps-gnd-argocd-configs # appruntime-argocd-configs
              targetRevision: develop
              manifest: helm-values.yaml
            sync:
              prune: false 
            notifications:  
              notifyEmail: chandra.mouli1.contractor@pepsico.com