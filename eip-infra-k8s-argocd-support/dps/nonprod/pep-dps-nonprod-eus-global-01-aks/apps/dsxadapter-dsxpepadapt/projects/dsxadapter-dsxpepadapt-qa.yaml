apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: dsxadapter-dsxpepadapt-qa
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Project for dsxadapter-dsxpepadapt-qa 
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/dsxadapter-dsxpepadapt-argocd-configs
  - pepdpsnonprodacr.azurecr.io/helm 
  destinations:
  - name: pep-dps-nonprod-eus-global-01-aks
    namespace: pep-dps-dps-adapt-qa
  - name: pep-dps-nonprod-eus-global-01-aks
    namespace: pep-dps-ops-admin
  roles:
  - name: dsxadapter-dsxpepadapt-qa-admin
    description: Admin privileges to dsxadapter-dsxpepadapt-qa
    policies:
    - p, proj:dsxadapter-dsxpepadapt-qa:dsxadapter-dsxpepadapt-qa-admin, applications, *, dsxadapter-dsxpepadapt-qa/*, allow
    - p, proj:dsxadapter-dsxpepadapt-qa:dsxadapter-dsxpepadapt-qa-admin, repositories, *, dsxadapter-dsxpepadapt-qa/*, allow
    groups:
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
    - "Team.Support.CGF.NonProd.devops"

  - name: dsxadapter-dsxpepadapt-qa-user
    description: Read-only privileges to dsxadapter-dsxpepadapt-qa
    policies:
    - p, proj:dsxadapter-dsxpepadapt-qa:dsxadapter-dsxpepadapt-qa-user, applications, get, dsxadapter-dsxpepadapt-qa/*, allow
    - p, proj:dsxadapter-dsxpepadapt-qa:dsxadapter-dsxpepadapt-qa-user, applications, sync, dsxadapter-dsxpepadapt-qa/*, allow
    - p, proj:dsxadapter-dsxpepadapt-qa:dsxadapter-dsxpepadapt-qa-user, repositories, get, dsxadapter-dsxpepadapt-qa/*, allow
    - p, proj:dsxadapter-dsxpepadapt-qa:dsxadapter-dsxpepadapt-qa-user, *, delete, *, deny
    groups:
    - "Team.Support.DPS.NonProd.adapt"
    - "Team.Support.EIAP.READ"