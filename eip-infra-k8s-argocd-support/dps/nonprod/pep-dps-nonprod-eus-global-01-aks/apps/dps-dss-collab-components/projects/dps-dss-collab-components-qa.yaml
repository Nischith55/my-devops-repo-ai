apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: dps-dss-collab-components-qa
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app
spec:
  description: Project for dps-dss-collab-components-qa   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/dps-dss-collab-components-argocd-configs
  - pepdpsnonprodacr.azurecr.io/helm
  destinations:
  - name: pep-dps-nonprod-eus-global-01-aks
    namespace: pep-dps-dps-collabcq-qa
  - name: pep-dps-nonprod-eus-global-01-aks
    namespace: pep-dps-ops-admin
  roles:
  - name: dps-dss-collab-components-qa-admin
    description: Admin privileges to dps-dss-collab-components-qa
    policies:
    - p, proj:dps-dss-collab-components-qa:dps-dss-collab-components-qa-admin, applications, *, dps-dss-collab-components-qa/*, allow
    - p, proj:dps-dss-collab-components-qa:dps-dss-collab-components-qa-admin, repositories, *, dps-dss-collab-components-qa/*, allow
    groups:
    - "Team.Support.CGF.NonProd.devops"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: dps-dss-collab-components-qa-user
    description: Read-only privileges to dps-dss-collab-components-qa
    policies:
    - p, proj:dps-dss-collab-components-qa:dps-dss-collab-components-qa-user, applications, get, dps-dss-collab-components-qa/*, allow
    - p, proj:dps-dss-collab-components-qa:dps-dss-collab-components-qa-user, applications, sync, dps-dss-collab-components-qa/*, allow
    - p, proj:dps-dss-collab-components-qa:dps-dss-collab-components-qa-user, repositories, get, dps-dss-collab-components-qa/*, allow
     # This line will be replaced by the pipeline script
    - p, proj:dps-dss-collab-components-qa:dps-dss-collab-components-qa-user, applications, action/apps/Deployment/restart, dps-dss-collab-components-qa/*, allow

    groups:
    - "Team.App.DPS.CollabComponents.admin"
    - "Team.Support.EIAP.READ"
    - "Team.Support.CGF.NonProd.devops"