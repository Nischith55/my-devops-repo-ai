apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: pep-dtv-dev
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app
spec:
  description: Project for pep-dtv-dev   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/pep-dtv-argocd-configs
  - pepdpsnonprodacr.azurecr.io/helm
  destinations:
  - name: pep-dps-nonprod-eus-global-01-aks
    namespace: pep-dps-dps-dtvapp-dev
  - name: pep-dps-nonprod-eus-global-01-aks
    namespace: pep-dps-ops-admin
  roles:
  - name: pep-dtv-dev-admin
    description: Admin privileges to pep-dtv-dev
    policies:
    - p, proj:pep-dtv-dev:pep-dtv-dev-admin, applications, *, pep-dtv-dev/*, allow
    - p, proj:pep-dtv-dev:pep-dtv-dev-admin, repositories, *, pep-dtv-dev/*, allow
    groups:
    - "Team.Support.CGF.NonProd.devops"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: pep-dtv-dev-user
    description: Read-only privileges to pep-dtv-dev
    policies:
    - p, proj:pep-dtv-dev:pep-dtv-dev-user, applications, get, pep-dtv-dev/*, allow
    - p, proj:pep-dtv-dev:pep-dtv-dev-user, applications, sync, pep-dtv-dev/*, allow
    - p, proj:pep-dtv-dev:pep-dtv-dev-user, repositories, get, pep-dtv-dev/*, allow
    - p, proj:pep-dtv-dev:pep-dtv-dev-user, applications, action/apps/Deployment/restart, pep-dtv-dev/*, allow
    groups:
    - "Team.Support.DPS.NonProd.dtvapp"
    - "Team.Support.EIAP.READ"
    - "Team.Support.CGF.NonProd.devops"    