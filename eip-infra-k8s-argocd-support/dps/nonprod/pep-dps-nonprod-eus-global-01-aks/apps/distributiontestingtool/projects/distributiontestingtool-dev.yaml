apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: distributiontestingtool-dev
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app    
spec:
  description: Project for distributiontestingtool-dev 
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/distributiontestingtool-argocd-configs
  - pepdpsnonprodacr.azurecr.io/helm 
  destinations:
  - name: pep-dps-nonprod-eus-global-01-aks
    namespace: pep-dps-dps-dcs-dev
  - name: pep-dps-nonprod-eus-global-01-aks
    namespace: pep-dps-ops-admin
  roles:
  - name: distributiontestingtool-dev-admin
    description: Admin privileges to distributiontestingtool-dev
    policies:
    - p, proj:distributiontestingtool-dev:distributiontestingtool-dev-admin, applications, *, distributiontestingtool-dev/*, allow
    - p, proj:distributiontestingtool-dev:distributiontestingtool-dev-admin, applications, get, argocd/*, allow
    - p, proj:distributiontestingtool-dev:distributiontestingtool-dev-admin, repositories, *, distributiontestingtool-dev/*, allow
    groups:
    - "Team.Support.CGF.NonProd.devops"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: distributiontestingtool-dev-user
    description: Read-only privileges to distributiontestingtool-dev
    policies:
    - p, proj:distributiontestingtool-dev:distributiontestingtool-dev-user, applications, get, appruntime-dev/*, allow
    - p, proj:distributiontestingtool-dev:distributiontestingtool-dev-user, applications, sync, appruntime-dev/*, allow
    - p, proj:distributiontestingtool-dev:distributiontestingtool-dev-user, repositories, get, appruntime-dev/*, allow
    - p, proj:distributiontestingtool-dev:distributiontestingtool-dev-user, *, delete, *, deny
    - p, proj:distributiontestingtool-dev:distributiontestingtool-dev-user, applications, action/apps/Deployment/restart, distributiontestingtool-dev/*, allow
    groups:
    - "Team.Support.CGF.NonProd.DCS" ## modify the group here as per the user input
    - "Team.Support.EIAP.READ"
    - "Team.Support.CGF.NonProd.devops"