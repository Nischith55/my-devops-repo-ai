apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: mct-dev
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app    
spec:
  description: Project for mct-dev   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/mct-argocd-configs
  - pepdpsnonprodacr.azurecr.io/helm
  destinations:
  - name: pep-dps-nonprod-eus-global-01-aks
    namespace: pep-dps-cgf-vcr-dev
  - name: pep-dps-nonprod-eus-global-01-aks
    namespace: pep-dps-ops-admin
  roles:
  - name: mct-dev-admin
    description: Admin privileges to mct-dev
    policies:
    - p, proj:mct-dev:mct-dev-admin, applications, *, mct-dev/*, allow
    - p, proj:mct-dev:mct-dev-admin, applications, get, argocd/*, allow
    - p, proj:mct-dev:mct-dev-admin, repositories, *, mct-dev/*, allow
    groups:
    - "Team.Support.CGF.NonProd.devops"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: mct-dev-user
    description: Read-only privileges to mct-dev
    policies:
    - p, proj:mct-dev:mct-dev-user, applications, get, mct-dev/*, allow
    - p, proj:mct-dev:mct-dev-user, applications, sync, mct-dev/*, allow
    - p, proj:mct-dev:mct-dev-user, repositories, get, mct-dev/*, allow
    - p, proj:mct-dev:mct-dev-user, applications, action/apps/Deployment/restart, mct-dev/*, allow
    groups:
    - "Team.Support.cgf.snt.vcr.NonProd.AppSupport"
    - "Team.Support.cgf.snt.vcr.prod.appsupport"
    - "Team.Support.EIAP.READ"
    - "Team.Support.CGF.NonProd.devops"