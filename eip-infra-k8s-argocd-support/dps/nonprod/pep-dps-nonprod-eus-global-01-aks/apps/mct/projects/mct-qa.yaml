apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: mct-qa
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app    
spec:
  description: Project for mct-qa   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/mct-argocd-configs
  - pepdpsnonprodacr.azurecr.io/helm
  destinations:
  - name: pep-dps-nonprod-eus-global-01-aks
    namespace: pep-dps-dps-vcr-qa
  - name: pep-dps-nonprod-eus-global-01-aks
    namespace: pep-dps-ops-admin
  roles:
  - name: mct-qa-admin
    description: Admin privileges to mct-qa
    policies:
    - p, proj:mct-qa:mct-qa-admin, applications, *, mct-qa/*, allow
    - p, proj:mct-qa:mct-qa-admin, applications, get, argocd/*, allow
    - p, proj:mct-qa:mct-qa-admin, repositories, *, mct-qa/*, allow
    groups:
    - "Team.Support.CGF.NonProd.devops"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: mct-qa-user
    description: Read-only privileges to mct-qa
    policies:
    - p, proj:mct-qa:mct-qa-user, applications, get, mct-qa/*, allow
    - p, proj:mct-qa:mct-qa-user, applications, sync, mct-qa/*, allow
    - p, proj:mct-qa:mct-qa-user, repositories, get, mct-qa/*, allow
    - p, proj:mct-qa:mct-qa-user, applications, action/apps/Deployment/restart, mct-qa/*, allow
    groups:
    - "Team.Support.CGF.NonProd.devops"
    - "Team.Support.cgf.snt.vcr.prod.appsupport"
    - "Team.Support.EIAP.READ"