apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: rules-engine-dev
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app    
spec:
  description: Project for rules-engine-dev   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/rules-engine-argocd-configs
  - pepdpsnonprodacr.azurecr.io/helm
  destinations:
  - name: pep-dps-nonprod-eus-global-01-aks
    namespace: pep-dps-dps-ruleng-dev
  - name: pep-dps-nonprod-eus-global-01-aks
    namespace: pep-dps-ops-admin
  roles:
  - name: rules-engine-dev-admin
    description: Admin privileges to rules-engine-dev
    policies:
    - p, proj:rules-engine-dev:rules-engine-dev-admin, applications, *, rules-engine-dev/*, allow
    - p, proj:rules-engine-dev:rules-engine-dev-admin, applications, get, argocd/*, allow
    - p, proj:rules-engine-dev:rules-engine-dev-admin, repositories, *, rules-engine-dev/*, allow
    groups:
    - "Team.Support.CGF.NonProd.devops"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: rules-engine-dev-user
    description: Read-only privileges to rules-engine-dev
    policies:
    - p, proj:rules-engine-dev:rules-engine-dev-user, applications, get, rules-engine-dev/*, allow
    - p, proj:rules-engine-dev:rules-engine-dev-user, applications, sync, rules-engine-dev/*, allow
    - p, proj:rules-engine-dev:rules-engine-dev-user, repositories, get, rules-engine-dev/*, allow
    - p, proj:rules-engine-dev:rules-engine-dev-user, applications, action/apps/Deployment/restart, rules-engine-dev/*, allow
    groups:
    - "Team.Support.CGF.NonProd.devops"
    - "Team.Support.DPS.NonProd.RulEng"
    - "Team.Support.EIAP.READ"