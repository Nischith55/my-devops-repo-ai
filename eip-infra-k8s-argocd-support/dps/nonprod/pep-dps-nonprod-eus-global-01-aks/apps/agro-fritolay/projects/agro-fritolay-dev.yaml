apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: agro-fritolay-dev
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app
spec:
  description: Project for agro-fritolay-dev   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/fritolay-argocd-configs
  - pepdpsnonprodacr.azurecr.io/helm
  destinations:
  - name: pep-dps-nonprod-eus-global-01-aks
    namespace: pep-dps-dps-flag-dev
  - name: pep-dps-nonprod-eus-global-01-aks
    namespace: pep-dps-ops-admin
  roles:
  - name: agro-fritolay-dev-admin
    description: Admin privileges to agro-fritolay-dev
    policies:
    - p, proj:agro-fritolay-dev:agro-fritolay-dev-admin, applications, *, agro-fritolay-dev/*, allow
    - p, proj:agro-fritolay-dev:agro-fritolay-dev-admin, applications, get, argocd/*, allow
    - p, proj:agro-fritolay-dev:agro-fritolay-dev-admin, repositories, *, agro-fritolay-dev/*, allow
    - p, proj:agro-fritolay-dev:agro-fritolay-dev-admin, *, delete, *, deny
    groups:
    - "Team.Support.CGF.NonProd.devops"

  - name: agro-fritolay-dev-user
    description: Read-only privileges to agro-fritolay-dev
    policies:
    - p, proj:agro-fritolay-dev:agro-fritolay-dev-user, applications, get, agro-fritolay-dev/*, allow
    - p, proj:agro-fritolay-dev:agro-fritolay-dev-user, applications, sync, agro-fritolay-dev/*, allow
    - p, proj:agro-fritolay-dev:agro-fritolay-dev-user, repositories, get, agro-fritolay-dev/*, allow
    - p, proj:agro-fritolay-dev:agro-fritolay-dev-user, *, delete, *, deny
    groups:
    - "Team.Support.DPS.NonProd.flag"
    - "Team.Support.DPS.NonProd.GSAT"
    - "Team.Support.EIAP.READ"
    - "Team.App.DPS.DevOps.NonProd"   
  
  - name: agro-fritolay-dev-delete
    description: Delete-only privileges to agro-fritolay-dev
    policies:
    - p, proj:agro-fritolay-dev:agro-fritolay-dev-delete, *, delete, agro-fritolay-dev/*, allow
    - p, proj:agro-fritolay-dev:agro-fritolay-dev-delete, applications, get, agro-fritolay-dev/*, allow
    - p, proj:agro-fritolay-dev:agro-fritolay-dev-delete, applications, sync, agro-fritolay-dev/*, allow
    - p, proj:agro-fritolay-dev:agro-fritolay-dev-user, applications, action/apps/Deployment/restart, agro-fritolay-dev/*, allow
    groups:
    - "srinivasarao.prudhivi.contractor@pepsico.com"