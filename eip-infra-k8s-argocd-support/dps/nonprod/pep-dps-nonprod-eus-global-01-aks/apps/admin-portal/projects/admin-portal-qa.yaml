apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: admin-portal-qa
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app    
spec:
  description: Project for admin-portal-qa   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/admin-portal-argocd-configs
  - pepdpsnonprodacr.azurecr.io/helm
  destinations:
  - name: pep-dps-nonprod-eus-global-01-aks
    namespace: pep-dps-ops-admin
    server: https://kubernetes.default.svc
  - name: pep-dps-nonprod-eus-global-01-aks
    namespace: pep-dps-cgf-adportal-qa
    server: https://kubernetes.default.svc
  roles:
  - name: admin-portal-qa-admin
    description: Admin privileges to admin-portal-qa
    policies:
    - p, proj:admin-portal-qa:admin-portal-qa-admin, applications, *, admin-portal-qa/*, allow
    - p, proj:admin-portal-qa:admin-portal-qa-admin, applications, get, argocd/*, allow
    - p, proj:admin-portal-qa:admin-portal-qa-admin, repositories, *, admin-portal-qa/*, allow
    groups:
    - "Team.Support.CGF.NonProd.devops"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: admin-portal-qa-user
    description: Read-only privileges to admin-portal-qa
    policies:
    - p, proj:admin-portal-qa:admin-portal-qa-user, applications, get, admin-portal-qa/*, allow
    - p, proj:admin-portal-qa:admin-portal-qa-user, applications, sync, admin-portal-qa/*, allow
    - p, proj:admin-portal-qa:admin-portal-qa-user, repositories, get, admin-portal-qa/*, allow
    - p, proj:admin-portal-qa:admin-portal-qa-user, applications, action/apps/Deployment/restart, admin-portal-qa/*, allow
    groups:
    - "Team.Support.ST.AdminPortal.AppSupport"
    - "Team.Support.EIAP.READ"
    - "Team.Support.CGF.NonProd.devops"    