apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: dsx-agentic-dev
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app
spec:
  description: Project for dsx-agentic-dev   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/dsx-agentic-argocd-configs
  - pepdpsnonprodacr.azurecr.io/helm
  destinations:
  - name: pep-dps-nonprod-eus-global-01-aks
    namespace: pep-dps-cgf-dsxdevops-dev
  - name: pep-dps-nonprod-eus-global-01-aks
    namespace: pep-dps-ops-admin
  roles:
  - name: dsx-agentic-dev-admin
    description: Admin privileges to dsx-agentic-dev
    policies:
    - p, proj:dsx-agentic-dev:dsx-agentic-dev-admin, applications, *, dsx-agentic-dev/*, allow
    - p, proj:dsx-agentic-dev:dsx-agentic-dev-admin, repositories, *, dsx-agentic-dev/*, allow
    groups:
    - "Team.Support.CGF.NonProd.devops"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: dsx-agentic-dev-user
    description: Read-only privileges to dsx-agentic-dev
    policies:
    - p, proj:dsx-agentic-dev:dsx-agentic-dev-user, applications, get, dsx-agentic-dev/*, allow
    - p, proj:dsx-agentic-dev:dsx-agentic-dev-user, applications, sync, dsx-agentic-dev/*, allow
    - p, proj:dsx-agentic-dev:dsx-agentic-dev-user, repositories, get, dsx-agentic-dev/*, allow
     # This line will be replaced by the pipeline script
    - p, proj:dsx-agentic-dev:dsx-agentic-dev-user, applications, action/apps/Deployment/restart, dsx-agentic-dev/*, allow

    groups:
    - "Team.Support.CGF.NonProd.devops"
    - "Team.Support.EIAP.READ"
    - "Team.App.DPS.DevOps.NonProd"