apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: dsxdevopstest-sasitest-dev
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Project for dsxdevopstest-sasitest-dev 
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/dsxdevopstest-sasitest-argocd-configs
  - pepdpsnonprodacr.azurecr.io/helm 
  destinations:
  - name: pep-dps-nonprod-eus-global-01-aks
    namespace: pep-dps-devx-test-dev
  - name: pep-dps-nonprod-eus-global-01-aks
    namespace: pep-dps-ops-admin
  roles:
  - name: dsxdevopstest-sasitest-dev-admin
    description: Admin privileges to dsxdevopstest-sasitest-dev
    policies:
    - p, proj:dsxdevopstest-sasitest-dev:dsxdevopstest-sasitest-dev-admin, applications, *, dsxdevopstest-sasitest-dev/*, allow
    - p, proj:dsxdevopstest-sasitest-dev:dsxdevopstest-sasitest-dev-admin, repositories, *, dsxdevopstest-sasitest-dev/*, allow
    groups:
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
    - "Team.Support.CGF.NonProd.devops"

  - name: dsxdevopstest-sasitest-dev-user
    description: Read-only privileges to dsxdevopstest-sasitest-dev
    policies:
    - p, proj:dsxdevopstest-sasitest-dev:dsxdevopstest-sasitest-dev-user, applications, get, dsxdevopstest-sasitest-dev/*, allow
    - p, proj:dsxdevopstest-sasitest-dev:dsxdevopstest-sasitest-dev-user, applications, sync, dsxdevopstest-sasitest-dev/*, allow
    - p, proj:dsxdevopstest-sasitest-dev:dsxdevopstest-sasitest-dev-user, repositories, get, dsxdevopstest-sasitest-dev/*, allow
    - p, proj:dsxdevopstest-sasitest-dev:dsxdevopstest-sasitest-dev-user, *, delete, *, deny
    groups:
    - "Team.Support.CGF.NonProd.devX"
    - "Team.Support.EIAP.READ"