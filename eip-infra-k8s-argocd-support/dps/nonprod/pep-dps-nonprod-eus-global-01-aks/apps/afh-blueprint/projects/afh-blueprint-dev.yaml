apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: afh-blueprint-dev
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app
spec:
  description: Project for afh-blueprint-dev   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/afh-blueprint-argocd-configs
  - pepdpsnonprodacr.azurecr.io/helm
  destinations:
  - name: pep-dps-nonprod-eus-global-01-aks
    namespace: pep-dps-cgf-afhblue-dev
  - name: pep-dps-nonprod-eus-global-01-aks
    namespace: pep-dps-ops-admin
  roles:
  - name: afh-blueprint-dev-admin
    description: Admin privileges to afh-blueprint-dev
    policies:
    - p, proj:afh-blueprint-dev:afh-blueprint-dev-admin, applications, *, afh-blueprint-dev/*, allow
    - p, proj:afh-blueprint-dev:afh-blueprint-dev-admin, repositories, *, afh-blueprint-dev/*, allow
    groups:
    - "Team.Support.CGF.NonProd.devops"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: afh-blueprint-dev-user
    description: Read-only privileges to afh-blueprint-dev
    policies:
    - p, proj:afh-blueprint-dev:afh-blueprint-dev-user, applications, get, afh-blueprint-dev/*, allow
    - p, proj:afh-blueprint-dev:afh-blueprint-dev-user, applications, sync, afh-blueprint-dev/*, allow
    - p, proj:afh-blueprint-dev:afh-blueprint-dev-user, repositories, get, afh-blueprint-dev/*, allow
     # This line will be replaced by the pipeline script
    - p, proj:afh-blueprint-dev:afh-blueprint-dev-user, applications, action/apps/Deployment/restart, afh-blueprint-dev/*, allow

    groups:
    - "Team.Support.CGF.NonProd.AFHMenuPro"
    - "Team.Support.EIAP.READ"