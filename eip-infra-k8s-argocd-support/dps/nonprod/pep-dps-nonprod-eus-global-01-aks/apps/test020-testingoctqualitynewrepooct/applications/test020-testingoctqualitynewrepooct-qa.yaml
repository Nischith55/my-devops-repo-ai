apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: test020-testingoctqualitynewrepooct-qa-bootstrapper
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: argocd
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  syncPolicy:    
    automated:
      prune: false
      selfHeal: true
  sources:
  - ref: values
    repoURL: https://dev.azure.com/PepsiCoIT/CTO_DevX/_git/test020-testingoctqualitynewrepooct-argocd-configs
    targetRevision: develop 
  - repoURL: pepdpsnonprodacr.azurecr.io/helm 
    targetRevision: "0.2.5"
    chart: argocd-app-bootstrapper 
    helm:
      releaseName: test020-testingoctqualitynewrepooct-qa
      valueFiles:
      - $values/qa/pep-dps-nonprod-eus-global-01-aks/argocd-app-configs.yaml    
      values: |
        global:
          env: qa
          helm:  
            enabled: false       
            repo: pepdpsnonprodacr.azurecr.io/helm 
            chart: umbrellachart
            revision: 2.2.2 
            values: 
              platform-chart:
                destination: 
                  jobImage: pepeiapnonprodcommonacr.azurecr.io/pep/eip/infra/azurepipeline/devopsagent:20240222.1
                  jobNS: pep-dps-ops-admin 
                  jobServiceAccount: gw-update-sa
          spec:
            project: test020-testingoctqualitynewrepooct-qa 
            source: 
              repoURL: https://dev.azure.com/PepsiCoIT/CTO_DevX/_git/test020-testingoctqualitynewrepooct-argocd-configs 
              repoName: test020-testingoctqualitynewrepooct-argocd-configs # appruntime-argocd-configs
              targetRevision: develop
              manifest: helm-values.yaml
            sync:
              prune: false 
            notifications:  
              notifyEmail: Dl@pepsico.com