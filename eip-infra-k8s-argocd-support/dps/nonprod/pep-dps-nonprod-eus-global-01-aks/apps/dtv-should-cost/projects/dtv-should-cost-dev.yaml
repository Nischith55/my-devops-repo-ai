apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: dtv-should-cost-dev
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app    
spec:
  description: Project for dtv-should-cost-dev   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/dtv-should-cost-argocd-configs
  - pepdpsnonprodacr.azurecr.io/helm
  destinations:
  - server: https://kubernetes.default.svc
    namespace: pep-dps-dps-dtvscm-dev
  - server: https://kubernetes.default.svc
    namespace: pep-dps-cgf-dtvscm-dev
  - server: https://kubernetes.default.svc
    namespace: pep-dps-ops-admin
  roles:
  - name: dtv-should-cost-dev-admin
    description: Admin privileges to dtv-should-cost-dev
    policies:
    - p, proj:dtv-should-cost-dev:dtv-should-cost-dev-admin, applications, *, dtv-should-cost-dev/*, allow
    - p, proj:dtv-should-cost-dev:dtv-should-cost-dev-admin, applications, get, argocd/*, allow
    - p, proj:dtv-should-cost-dev:dtv-should-cost-dev-admin, repositories, *, dtv-should-cost-dev/*, allow
    groups:
    - "Team.Support.CGF.NonProd.devops"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: dtv-should-cost-dev-user
    description: Read-only privileges to dtv-should-cost-dev
    policies:
    - p, proj:dtv-should-cost-dev:dtv-should-cost-dev-user, applications, get, dtv-should-cost-dev/*, allow
    - p, proj:dtv-should-cost-dev:dtv-should-cost-dev-user, applications, sync, dtv-should-cost-dev/*, allow
    - p, proj:dtv-should-cost-dev:dtv-should-cost-dev-user, repositories, get, dtv-should-cost-dev/*, allow
    - p, proj:dtv-should-cost-dev:dtv-should-cost-dev-user, applications, action/apps/Deployment/restart, dtv-should-cost-dev/*, allow
    groups:
    - "Team.Support.CGF.NonProd.devops"
    - "Team.Support.CGF.NonProd.dtvscm"
    - "Team.Support.EIAP.READ"