apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: dsx-react-codepush-delivr-dev
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app
spec:
  description: Project for dsx-react-codepush-delivr-dev   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/dsx-react-codepush-delivr-argocd-configs
  - pepdpsnonprodacr.azurecr.io/helm
  destinations:
  - name: pep-dps-nonprod-eus-global-01-aks
    namespace: pep-dps-cgf-dsxota-dev
  - name: pep-dps-nonprod-eus-global-01-aks
    namespace: pep-dps-ops-admin
  roles:
  - name: dsx-react-codepush-delivr-dev-admin
    description: Admin privileges to dsx-react-codepush-delivr-dev
    policies:
    - p, proj:dsx-react-codepush-delivr-dev:dsx-react-codepush-delivr-dev-admin, applications, *, dsx-react-codepush-delivr-dev/*, allow
    - p, proj:dsx-react-codepush-delivr-dev:dsx-react-codepush-delivr-dev-admin, repositories, *, dsx-react-codepush-delivr-dev/*, allow
    groups:
    - "Team.Support.CGF.NonProd.devops"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: dsx-react-codepush-delivr-dev-user
    description: Read-only privileges to dsx-react-codepush-delivr-dev
    policies:
    - p, proj:dsx-react-codepush-delivr-dev:dsx-react-codepush-delivr-dev-user, applications, get, dsx-react-codepush-delivr-dev/*, allow
    - p, proj:dsx-react-codepush-delivr-dev:dsx-react-codepush-delivr-dev-user, applications, sync, dsx-react-codepush-delivr-dev/*, allow
    - p, proj:dsx-react-codepush-delivr-dev:dsx-react-codepush-delivr-dev-user, repositories, get, dsx-react-codepush-delivr-dev/*, allow
     # This line will be replaced by the pipeline script
    - p, proj:dsx-react-codepush-delivr-dev:dsx-react-codepush-delivr-dev-user, applications, action/apps/Deployment/restart, dsx-react-codepush-delivr-dev/*, allow

    groups:
    - "Team.Support.CGF.NonProd.devops"
    - "Team.Support.EIAP.READ"