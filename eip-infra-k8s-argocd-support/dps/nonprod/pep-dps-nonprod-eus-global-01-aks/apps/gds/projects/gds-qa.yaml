apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: gds-qa
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app    
spec:
  description: Project for gds-qa   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/gds-argocd-configs
  - pepdpsnonprodacr.azurecr.io/helm
  destinations:
  - server: https://kubernetes.default.svc
    namespace: pep-dps-cgf-peacock-qa
  - server: https://kubernetes.default.svc
    namespace: pep-dps-ops-admin
  roles:
  - name: gds-qa-admin
    description: Admin privileges to gds-qa
    policies:
    - p, proj:gds-qa:gds-qa-admin, applications, *, gds-qa/*, allow
    - p, proj:gds-qa:gds-qa-admin, applications, get, argocd/*, allow
    - p, proj:gds-qa:gds-qa-admin, repositories, *, gds-qa/*, allow
    groups:
    - "Team.Support.CGF.NonProd.devops"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: gds-qa-user
    description: Read-only privileges to gds-qa
    policies:
    - p, proj:gds-qa:gds-qa-user, applications, get, gds-qa/*, allow
    - p, proj:gds-qa:gds-qa-user, applications, sync, gds-qa/*, allow
    - p, proj:gds-qa:gds-qa-user, repositories, get, gds-qa/*, allow
    - p, proj:gds-qa:gds-qa-user, applications, action/apps/Deployment/restart, gds-qa/*, allow
    groups:
    - "Team.Support.CGF.NonProd.devops"
    - "Team.App.DPS.AppRuntime.Dev"
    - "Team.Support.EIAP.READ"