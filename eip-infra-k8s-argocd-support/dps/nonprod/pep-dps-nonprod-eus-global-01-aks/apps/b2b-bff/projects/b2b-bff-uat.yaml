apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: b2b-bff-uat
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app
spec:
  description: Project for b2b-bff-uat   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/b2b-bff-argocd-configs
  - pepdpsnonprodacr.azurecr.io/helm
  destinations:
  - name: pep-dps-nonprod-eus-global-01-aks
    namespace: pep-dps-latam-bff-qa
  - name: pep-dps-nonprod-eus-global-01-aks
    namespace: pep-dps-ops-admin
  roles:
  - name: b2b-bff-uat-admin
    description: Admin privileges to b2b-bff-uat
    policies:
    - p, proj:b2b-bff-uat:b2b-bff-uat-admin, applications, *, b2b-bff-uat/*, allow
    - p, proj:b2b-bff-uat:b2b-bff-uat-admin, repositories, *, b2b-bff-uat/*, allow
    groups:
    - "Team.Support.CGF.NonProd.devops"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: b2b-bff-uat-user
    description: Read-only privileges to b2b-bff-uat
    policies:
    - p, proj:b2b-bff-uat:b2b-bff-uat-user, applications, get, b2b-bff-uat/*, allow
    - p, proj:b2b-bff-uat:b2b-bff-uat-user, applications, sync, b2b-bff-uat/*, allow
    - p, proj:b2b-bff-uat:b2b-bff-uat-user, repositories, get, b2b-bff-uat/*, allow
     # This line will be replaced by the pipeline script
    - p, proj:b2b-bff-uat:b2b-bff-uat-user, applications, action/apps/Deployment/restart, b2b-bff-uat/*, allow

    groups:
    - "Team.App.DPS.DevOps.NonProd"
    - "Team.Support.EIAP.READ"
    - "Team.Support.CGF.NonProd.devops"