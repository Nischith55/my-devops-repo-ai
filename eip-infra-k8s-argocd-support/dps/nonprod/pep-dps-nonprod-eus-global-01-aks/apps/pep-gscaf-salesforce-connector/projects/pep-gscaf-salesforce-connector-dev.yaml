apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: pep-gscaf-salesforce-connector-dev
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app    
spec:
  description: Project for pep-gscaf-salesforce-connector-dev   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/salesforce-connector-argocd-configs
  - pepdpsnonprodacr.azurecr.io/helm
  destinations:
  - server: https://kubernetes.default.svc
    namespace: pep-dps-cgf-gscafso-dev
  - server: https://kubernetes.default.svc
    namespace: pep-dps-ops-admin
  roles:
  - name: pep-gscaf-salesforce-connector-dev-admin
    description: Admin privileges to pep-gscaf-salesforce-connector-dev
    policies:
    - p, proj:pep-gscaf-salesforce-connector-dev:pep-gscaf-salesforce-connector-dev-admin, applications, *, pep-gscaf-salesforce-connector-dev/*, allow
    - p, proj:pep-gscaf-salesforce-connector-dev:pep-gscaf-salesforce-connector-dev-admin, applications, get, argocd/*, allow
    - p, proj:pep-gscaf-salesforce-connector-dev:pep-gscaf-salesforce-connector-dev-admin, repositories, *, pep-gscaf-salesforce-connector-dev/*, allow
    groups:
    - "Team.Support.CGF.NonProd.devops"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: pep-gscaf-salesforce-connector-dev-user
    description: Read-only privileges to pep-gscaf-salesforce-connector-dev
    policies:
    - p, proj:pep-gscaf-salesforce-connector-dev:pep-gscaf-salesforce-connector-dev-user, applications, get, pep-gscaf-salesforce-connector-dev/*, allow
    - p, proj:pep-gscaf-salesforce-connector-dev:pep-gscaf-salesforce-connector-dev-user, applications, sync, pep-gscaf-salesforce-connector-dev/*, allow
    - p, proj:pep-gscaf-salesforce-connector-dev:pep-gscaf-salesforce-connector-dev-user, repositories, get, pep-gscaf-salesforce-connector-dev/*, allow
    - p, proj:pep-gscaf-salesforce-connector-dev:pep-gscaf-salesforce-connector-dev-user, applications, action/apps/Deployment/restart, pep-gscaf-salesforce-connector-dev/*, allow
    groups:
    - "Team.Support.CGF.NonProd.devops"
    - "Team.App.SupportDPS.OnePEP.CAF"
    - "Team.Support.EIAP.READ"