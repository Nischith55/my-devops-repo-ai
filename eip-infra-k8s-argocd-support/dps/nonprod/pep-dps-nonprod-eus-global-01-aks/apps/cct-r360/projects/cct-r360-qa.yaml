apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: cct-r360-qa
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app
spec:
  description: Project for cct-r360-qa   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/cct-r360-argocd-configs
  - pepdpsnonprodacr.azurecr.io/helm
  destinations:
  - name: pep-dps-nonprod-eus-global-01-aks
    namespace: pep-dps-dps-jo-qa
  - name: pep-dps-nonprod-eus-global-01-aks
    namespace: pep-dps-ops-admin
  roles:
  - name: cct-r360-qa-admin
    description: Admin privileges to cct-r360-qa
    policies:
    - p, proj:cct-r360-qa:cct-r360-qa-admin, applications, *, cct-r360-qa/*, allow
    - p, proj:cct-r360-qa:cct-r360-qa-admin, repositories, *, cct-r360-qa/*, allow
    groups:
    - "Team.Support.CGF.NonProd.devops"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: cct-r360-qa-user
    description: Read-only privileges to cct-r360-qa
    policies:
    - p, proj:cct-r360-qa:cct-r360-qa-user, applications, get, cct-r360-qa/*, allow
    - p, proj:cct-r360-qa:cct-r360-qa-user, applications, sync, cct-r360-qa/*, allow
    - p, proj:cct-r360-qa:cct-r360-qa-user, repositories, get, cct-r360-qa/*, allow
     # This line will be replaced by the pipeline script
    - p, proj:cct-r360-qa:cct-r360-qa-user, applications, action/apps/Deployment/restart, cct-r360-qa/*, allow

    groups:
    - "Team.Support.ST.PAM.AppSupport"
    - "Team.Support.EIAP.READ"
    - "Team.Support.CGF.NonProd.devops"