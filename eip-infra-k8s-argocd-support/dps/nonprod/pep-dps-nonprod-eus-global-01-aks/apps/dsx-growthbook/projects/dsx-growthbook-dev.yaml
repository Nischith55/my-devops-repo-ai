apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: dsx-growthbook-dev
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app    
spec:
  description: Project for dsx-growthbook-dev   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/pep-gscaf-argocd-configs
  - pepdpsnonprodacr.azurecr.io/helm
  destinations:
  - name: pep-dps-nonprod-eus-global-01-aks
    namespace: pep-dps-cgf-gscafso-dev
  - name: pep-dps-nonprod-eus-global-01-aks
    namespace: pep-dps-ops-admin
  roles:
  - name: dsx-growthbook-dev-admin
    description: Admin privileges to dsx-growthbook-dev
    policies:
    - p, proj:dsx-growthbook-dev:dsx-growthbook-dev-admin, applications, *, dsx-growthbook-dev/*, allow
    - p, proj:dsx-growthbook-dev:dsx-growthbook-dev-admin, applications, get, argocd/*, allow
    - p, proj:dsx-growthbook-dev:dsx-growthbook-dev-admin, repositories, *, dsx-growthbook-dev/*, allow
    groups:
    - "Team.Support.CGF.NonProd.devops"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: dsx-growthbook-dev-user
    description: Read-only privileges to dsx-growthbook-dev
    policies:
    - p, proj:dsx-growthbook-dev:dsx-growthbook-dev-user, applications, get, dsx-growthbook-dev/*, allow
    - p, proj:dsx-growthbook-dev:dsx-growthbook-dev-user, applications, sync, dsx-growthbook-dev/*, allow
    - p, proj:dsx-growthbook-dev:dsx-growthbook-dev-user, repositories, get, dsx-growthbook-dev/*, allow
    - p, proj:dsx-growthbook-dev:dsx-growthbook-dev-user, applications, action/apps/Deployment/restart, dsx-growthbook-dev/*, allow
    groups:
    - "Team.App.SupportDPS.OnePEP.CAF"
    - "Team.Support.EIAP.READ"
    - "Team.Support.CGF.NonProd.devops"