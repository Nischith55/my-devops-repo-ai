apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: customer-communication-tool-qa
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app    
spec:
  description: Project for customer-communication-tool-qa   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/customer-communication-tool-argocd-configs
  - pepdpsnonprodacr.azurecr.io/helm
  destinations:
  - name: pep-dps-nonprod-eus-global-01-aks
    namespace: pep-dps-cgf-cct-qa
  - name: pep-dps-nonprod-eus-global-01-aks
    namespace: pep-dps-ops-admin
  roles:
  - name: customer-communication-tool-qa-admin
    description: Admin privileges to customer-communication-tool-qa
    policies:
    - p, proj:customer-communication-tool-qa:customer-communication-tool-qa-admin, applications, *, customer-communication-tool-qa/*, allow
    - p, proj:customer-communication-tool-qa:customer-communication-tool-qa-admin, applications, get, argocd/*, allow
    - p, proj:customer-communication-tool-qa:customer-communication-tool-qa-admin, repositories, *, customer-communication-tool-qa/*, allow
    groups:
    - "Team.Support.CGF.NonProd.devops"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: customer-communication-tool-qa-user
    description: Read-only privileges to customer-communication-tool-qa
    policies:
    - p, proj:customer-communication-tool-qa:customer-communication-tool-qa-user, applications, get, customer-communication-tool-qa/*, allow
    - p, proj:customer-communication-tool-qa:customer-communication-tool-qa-user, applications, sync, customer-communication-tool-qa/*, allow
    - p, proj:customer-communication-tool-qa:customer-communication-tool-qa-user, repositories, get, customer-communication-tool-qa/*, allow
    - p, proj:customer-communication-tool-qa:customer-communication-tool-qa-user, applications, action/apps/Deployment/restart, customer-communication-tool-qa/*, allow
    groups:
    - "Team.Support.ST.PAM.AppSupport"
    - "Team.Support.EIAP.READ"
    - "Team.Support.CGF.NonProd.devops"