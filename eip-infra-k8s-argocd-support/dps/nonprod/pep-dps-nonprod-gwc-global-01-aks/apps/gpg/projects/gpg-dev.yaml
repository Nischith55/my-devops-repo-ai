apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: gpg-dev
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app    
spec:
  description: Project for gpg-dev   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_SNT_Global_Payment_Gateway/_git/gpg-argocd-configs
  - pepdpsnonprodacr.azurecr.io/helm
  destinations:
  - name: pep-dps-nonprod-gwc-global-01-aks
    namespace: pep-dps-dps-gpg-dev
  - name: pep-dps-nonprod-gwc-global-01-aks
    namespace: pep-dps-europe-gpg-dev
  - name: pep-dps-nonprod-gwc-global-01-aks
    namespace: pep-dps-ops-admin
  roles:
  - name: gpg-dev-admin
    description: Admin privileges to gpg-dev
    policies:
    - p, proj:gpg-dev:gpg-dev-admin, applications, *, gpg-dev/*, allow
    - p, proj:gpg-dev:gpg-dev-admin, applications, get, argocd/*, allow
    - p, proj:gpg-dev:gpg-dev-admin, repositories, *, gpg-dev/*, allow
    groups:
    - "Team.Support.CGF.NonProd.devops"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: gpg-dev-user
    description: Read-only privileges to gpg-dev
    policies:
    - p, proj:gpg-dev:gpg-dev-user, applications, get, gpg-dev/*, allow
    - p, proj:gpg-dev:gpg-dev-user, applications, sync, gpg-dev/*, allow
    - p, proj:gpg-dev:gpg-dev-user, repositories, get, gpg-dev/*, allow
    - p, proj:gpg-dev:gpg-dev-user, applications, action/apps/Deployment/restart, gpg-dev/*, allow
    groups:
    - "Team.App.DPS.GPG.nonprod"
    - "Team.app.DPS.NonProd.GPG"
    - "Team.Support.EIAP.READ"
    - "Team.Support.CGF.NonProd.devops"