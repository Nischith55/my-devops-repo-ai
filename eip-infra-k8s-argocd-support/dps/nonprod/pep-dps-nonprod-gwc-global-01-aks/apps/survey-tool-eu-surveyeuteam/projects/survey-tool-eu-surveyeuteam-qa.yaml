apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: survey-tool-eu-surveyeuteam-qa
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app
spec:
  description: Project for survey-tool-eu-surveyeuteam-qa   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/survey-tool-eu-surveyeuteam-argocd-configs
  - pepdpsnonprodacr.azurecr.io/helm
  destinations:
  - name: pep-dps-nonprod-gwc-global-01-aks
    namespace: pep-dps-dps-admineu-qa
  - name: pep-dps-nonprod-gwc-global-01-aks
    namespace: pep-dps-ops-admin
  roles:
  - name: survey-tool-eu-surveyeuteam-qa-admin
    description: Admin privileges to survey-tool-eu-surveyeuteam-qa
    policies:
    - p, proj:survey-tool-eu-surveyeuteam-qa:survey-tool-eu-surveyeuteam-qa-admin, applications, *, survey-tool-eu-surveyeuteam-qa/*, allow
    - p, proj:survey-tool-eu-surveyeuteam-qa:survey-tool-eu-surveyeuteam-qa-admin, repositories, *, survey-tool-eu-surveyeuteam-qa/*, allow
    groups:
    - "Team.Support.CGF.NonProd.devops"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: survey-tool-eu-surveyeuteam-qa-user
    description: Read-only privileges to survey-tool-eu-surveyeuteam-qa
    policies:
    - p, proj:survey-tool-eu-surveyeuteam-qa:survey-tool-eu-surveyeuteam-qa-user, applications, get, survey-tool-eu-surveyeuteam-qa/*, allow
    - p, proj:survey-tool-eu-surveyeuteam-qa:survey-tool-eu-surveyeuteam-qa-user, applications, sync, survey-tool-eu-surveyeuteam-qa/*, allow
    - p, proj:survey-tool-eu-surveyeuteam-qa:survey-tool-eu-surveyeuteam-qa-user, repositories, get, survey-tool-eu-surveyeuteam-qa/*, allow
     # This line will be replaced by the pipeline script
    - p, proj:survey-tool-eu-surveyeuteam-qa:survey-tool-eu-surveyeuteam-qa-user, applications, action/apps/Deployment/restart, survey-tool-eu-surveyeuteam-qa/*, allow

    groups:
    - "Team.Support.EUROPE.NonProd.SurveyEU"
    - "Team.Support.EIAP.READ"