apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: accessbridge-accessbridge-dev
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Project for accessbridge-accessbridge-dev 
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/accessbridge-accessbridge-argocd-configs
  - pepdpsnonprodacr.azurecr.io/helm 
  destinations:
  - name: pep-dps-nonprod-gwc-global-01-aks
    namespace: pep-dps-europe-accessbr-dev
  - name: pep-dps-nonprod-gwc-global-01-aks
    namespace: pep-dps-ops-admin
  roles:
  - name: accessbridge-accessbridge-dev-admin
    description: Admin privileges to accessbridge-accessbridge-dev
    policies:
    - p, proj:accessbridge-accessbridge-dev:accessbridge-accessbridge-dev-admin, applications, *, accessbridge-accessbridge-dev/*, allow
    - p, proj:accessbridge-accessbridge-dev:accessbridge-accessbridge-dev-admin, repositories, *, accessbridge-accessbridge-dev/*, allow
    groups:
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
    - "Team.Support.CGF.NonProd.devops"

  - name: accessbridge-accessbridge-dev-user
    description: Read-only privileges to accessbridge-accessbridge-dev
    policies:
    - p, proj:accessbridge-accessbridge-dev:accessbridge-accessbridge-dev-user, applications, get, accessbridge-accessbridge-dev/*, allow
    - p, proj:accessbridge-accessbridge-dev:accessbridge-accessbridge-dev-user, applications, sync, accessbridge-accessbridge-dev/*, allow
    - p, proj:accessbridge-accessbridge-dev:accessbridge-accessbridge-dev-user, repositories, get, accessbridge-accessbridge-dev/*, allow
    - p, proj:accessbridge-accessbridge-dev:accessbridge-accessbridge-dev-user, *, delete, *, deny
    groups:
    - "Team.Support.EUROPE.NonProd.accessbr"
    - "Team.Support.EIAP.READ"