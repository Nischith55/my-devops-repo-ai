apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: test-dev
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app
spec:
  description: Project for test-dev   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/test-argocd-configs
  - pepdpsnonprodacr.azurecr.io/helm
  destinations:
  - name: pep-dps-nonprod-gwc-global-01-aks
    namespace: pep-dps-europe-btbota-dev
  - name: pep-dps-nonprod-gwc-global-01-aks
    namespace: pep-dps-ops-admin
  roles:
  - name: test-dev-admin
    description: Admin privileges to test-dev
    policies:
    - p, proj:test-dev:test-dev-admin, applications, *, test-dev/*, allow
    - p, proj:test-dev:test-dev-admin, repositories, *, test-dev/*, allow
    groups:
    - "Team.Support.CGF.NonProd.devops"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: test-dev-user
    description: Read-only privileges to test-dev
    policies:
    - p, proj:test-dev:test-dev-user, applications, get, test-dev/*, allow
    - p, proj:test-dev:test-dev-user, applications, sync, test-dev/*, allow
    - p, proj:test-dev:test-dev-user, repositories, get, test-dev/*, allow
     # This line will be replaced by the pipeline script
    - p, proj:test-dev:test-dev-user, applications, action/apps/Deployment/restart, test-dev/*, allow

    groups:
    - "Team.Support.CGF.Prod.dsxdevops"
    - "Team.Support.EIAP.READ"