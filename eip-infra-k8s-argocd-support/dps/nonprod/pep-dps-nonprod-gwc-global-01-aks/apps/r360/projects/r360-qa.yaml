apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: r360-qa
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app    
spec:
  description: Project for r360-qa   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/r360-argocd-configs
  - pepdpsnonprodacr.azurecr.io/helm
  destinations:
  - name: pep-dps-nonprod-gwc-global-01-aks
    namespace: pep-dps-dps-r360qa-qa
  - name: pep-dps-nonprod-gwc-global-01-aks
    namespace: pep-dps-ops-admin
  roles:
  - name: r360-qa-admin
    description: Admin privileges to r360-qa
    policies:
    - p, proj:r360-qa:r360-qa-admin, applications, *, r360-qa/*, allow
    - p, proj:r360-qa:r360-qa-admin, applications, get, argocd/*, allow
    - p, proj:r360-qa:r360-qa-admin, repositories, *, r360-qa/*, allow
    groups:
    - "Team.Support.CGF.NonProd.devops"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: r360-qa-user
    description: Read-only privileges to r360-qa
    policies:
    - p, proj:r360-qa:r360-qa-user, applications, get, r360-qa/*, allow
    - p, proj:r360-qa:r360-qa-user, applications, sync, r360-qa/*, allow
    - p, proj:r360-qa:r360-qa-user, repositories, get, r360-qa/*, allow
    - p, proj:r360-qa:r360-qa-user, applications, action/apps/Deployment/restart, r360-qa/*, allow
    groups:
    - "Team.App.SupportDPS.OnePEP.CAF"
    - "Team.Support.EIAP.READ"
    - "Team.Support.CGF.NonProd.devops"