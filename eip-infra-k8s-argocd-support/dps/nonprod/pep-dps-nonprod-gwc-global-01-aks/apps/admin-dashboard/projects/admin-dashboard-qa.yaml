apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: admin-dashboard-qa
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app
spec:
  description: Project for admin-dashboard-qa   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/admin-dashboard-argocd-configs
  - pepdpsnonprodacr.azurecr.io/helm
  destinations:
  - name: pep-dps-nonprod-gwc-global-01-aks
    namespace: pep-dps-dps-admineu-qa
  - name: pep-dps-nonprod-gwc-global-01-aks
    namespace: pep-dps-ops-admin
  roles:
  - name: admin-dashboard-qa-admin
    description: Admin privileges to admin-dashboard-qa
    policies:
    - p, proj:admin-dashboard-qa:admin-dashboard-qa-admin, applications, *, admin-dashboard-qa/*, allow
    - p, proj:admin-dashboard-qa:admin-dashboard-qa-admin, repositories, *, admin-dashboard-qa/*, allow
    groups:
    - "Team.Support.CGF.NonProd.devops"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: admin-dashboard-qa-user
    description: Read-only privileges to admin-dashboard-qa
    policies:
    - p, proj:admin-dashboard-qa:admin-dashboard-qa-user, applications, get, admin-dashboard-qa/*, allow
    - p, proj:admin-dashboard-qa:admin-dashboard-qa-user, applications, sync, admin-dashboard-qa/*, allow
    - p, proj:admin-dashboard-qa:admin-dashboard-qa-user, repositories, get, admin-dashboard-qa/*, allow
    - p, proj:admin-dashboard-qa:admin-dashboard-qa-user, applications, action/apps/Deployment/restart, admin-dashboard-qa/*, allow
    groups:
    - "Team.Support.DPS.NonProd.NBA"
    - "Team.Support.EIAP.READ"
    - "Team.Support.CGF.NonProd.devops"