apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: b2b-bff-qa
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app    
spec:
  description: Project for b2b-bff-qa   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/b2b-bff-argocd-configs
  - pepdpsnonprodacr.azurecr.io/helm
  destinations:
  - server: https://kubernetes.default.svc
    namespace: pep-dps-europe-bff-qa
  - server: https://kubernetes.default.svc
    namespace: pep-dps-ops-admin
  roles:
  - name: b2b-bff-qa-admin
    description: Admin privileges to b2b-bff-qa
    policies:
    - p, proj:b2b-bff-qa:b2b-bff-qa-admin, applications, *, b2b-bff-qa/*, allow
    - p, proj:b2b-bff-qa:b2b-bff-qa-admin, applications, get, argocd/*, allow
    - p, proj:b2b-bff-qa:b2b-bff-qa-admin, repositories, *, b2b-bff-qa/*, allow
    groups:
    - "Team.Support.CGF.NonProd.devops"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: b2b-bff-qa-user
    description: Read-only privileges to b2b-bff-qa
    policies:
    - p, proj:b2b-bff-qa:b2b-bff-qa-user, applications, get, b2b-bff-qa/*, allow
    - p, proj:b2b-bff-qa:b2b-bff-qa-user, applications, sync, b2b-bff-qa/*, allow
    - p, proj:b2b-bff-qa:b2b-bff-qa-user, repositories, get, b2b-bff-qa/*, allow
    - p, proj:b2b-bff-qa:b2b-bff-qa-user, applications, action/apps/Deployment/restart, b2b-bff-qa/*, allow
    groups:
    - "Team.App.DPS.DevOps.NonProd"
    - "Team.Support.EIAP.READ"
    - "Team.Support.CGF.NonProd.devops"