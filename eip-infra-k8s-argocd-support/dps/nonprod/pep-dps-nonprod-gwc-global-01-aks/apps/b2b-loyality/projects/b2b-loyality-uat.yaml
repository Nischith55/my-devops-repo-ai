    apiVersion: argoproj.io/v1alpha1
    kind: AppProject
    metadata:
      name: b2b-loyality-uat
      namespace: argocd  
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      labels:
        argocd.argoproj.io/project-inherit: global-app
    spec:
      description: Project for b2b-loyality-uat   
      sourceRepos:
      - https://dev.azure.com/PepsiCoIT/Web_and_Commerce_Solutions/_git/b2b-pepconnect-argocd-configs
      - pepdpsnonprodacr.azurecr.io/helm
      destinations:
      - name: pep-dps-nonprod-gwc-global-01-aks
        namespace: pep-dps-europe-btblylty-qa
      - name: pep-dps-nonprod-gwc-global-01-aks
        namespace: pep-dps-ops-admin

      - name: pep-dps-nonprod-gwc-global-01-aks
        namespace: pep-dps-europe-btboms-qa
        server: https://kubernetes.default.svc

      roles:
      - name: b2b-loyality-uat-admin
        description: Admin privileges to b2b-loyality-uat
        policies:
        - p, proj:b2b-loyality-uat:b2b-loyality-uat-admin, applications, *, b2b-loyality-uat/*, allow
        - p, proj:b2b-loyality-uat:b2b-loyality-uat-admin, repositories, *, b2b-loyality-uat/*, allow
        groups:
        - "Team.Support.CGF.NonProd.devops"
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

      - name: b2b-loyality-uat-user
        description: Read-only privileges to b2b-loyality-uat
        policies:
        - p, proj:b2b-loyality-uat:b2b-loyality-uat-user, applications, get, b2b-loyality-uat/*, allow
        - p, proj:b2b-loyality-uat:b2b-loyality-uat-user, applications, sync, b2b-loyality-uat/*, allow
        - p, proj:b2b-loyality-uat:b2b-loyality-uat-user, repositories, get, b2b-loyality-uat/*, allow
         # This line will be replaced by the pipeline script
        - p, proj:b2b-loyality-uat:b2b-loyality-uat-user, applications, action/apps/Deployment/restart, b2b-loyality-uat/*, allow
        groups:
        - "Team.Support.LATAM.NonProd.B2BOps"
        - "Team.Support.EIAP.READ"
        - "Team.Support.CGF.NonProd.devops"