apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: pep-gscaf-qa
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app    
spec:
  description: Project for pep-gscaf-qa   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/pep-gscaf-argocd-configs
  - pepdpsnonprodacr.azurecr.io/helm
  destinations:
  - name: pep-dps-nonprod-gwc-global-01-aks
    namespace: pep-dps-cgf-gscafso-qa
  - name: pep-dps-nonprod-gwc-global-01-aks
    namespace: pep-dps-ops-admin
  roles:
  - name: pep-gscaf-qa-admin
    description: Admin privileges to pep-gscaf-qa
    policies:
    - p, proj:pep-gscaf-qa:pep-gscaf-qa-admin, applications, *, pep-gscaf-qa/*, allow
    - p, proj:pep-gscaf-qa:pep-gscaf-qa-admin, applications, get, argocd/*, allow
    - p, proj:pep-gscaf-qa:pep-gscaf-qa-admin, repositories, *, pep-gscaf-qa/*, allow
    groups:
    - "Team.Support.CGF.NonProd.devops"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: pep-gscaf-qa-user
    description: Read-only privileges to pep-gscaf-qa
    policies:
    - p, proj:pep-gscaf-qa:pep-gscaf-qa-user, applications, get, pep-gscaf-qa/*, allow
    - p, proj:pep-gscaf-qa:pep-gscaf-qa-user, applications, sync, pep-gscaf-qa/*, allow
    - p, proj:pep-gscaf-qa:pep-gscaf-qa-user, repositories, get, pep-gscaf-qa/*, allow
    - p, proj:pep-gscaf-qa:pep-gscaf-qa-user, applications, action/apps/Deployment/restart, pep-gscaf-qa/*, allow
    groups:
    - "Team.App.SupportDPS.OnePEP.CAF"
    - "Team.Support.EIAP.READ"
    - "Team.Support.CGF.NonProd.devops"