apiVersion: v1
kind: ConfigMap
metadata:  
  labels:
    app.kubernetes.io/name: argocd-rbac-cm
    app.kubernetes.io/part-of: argocd  
  name: argocd-rbac-cm
  namespace: argocd
data:
    policy.default: role:nginx-user
    policy.csv: |
       p, role:argo-admin, applications, *, */*, allow
       p, role:argo-admin, clusters, *, *, allow
       p, role:argo-admin, repositories, *, *, allow
       p, role:argo-admin, projects, *, *, allow
       p, role:argo-admin, logs, *, */*, allow
       p, role:argo-admin, exec, *, */*, allow
       g, "Team.Support.EIAP.K8S.Admin", role:argo-admin       
       p, role:argo-user, applications, get, */*, allow
       p, role:argo-user, applications, sync, */*, allow
       p, role:argo-user, clusters, get, *, allow
       p, role:argo-user, repositories, get, *, allow
       p, role:argo-user, projects, get, *, allow
       p, role:argo-user, logs, get, */*, allow
       g, "Team.Support.EIAP.READ", role:argo-user  
       p, role:automation-user, applications, get, */*, allow
       p, role:automation-user, applications, sync, */*, allow
       p, role:automation-user, logs, get, */*, allow
       p, role:automation-user, projects, get, *, allow
       g, dps-nonprod-user, role:automation-user
       p, role:dps-read-user, applications, get, */*, allow
       p, role:dps-read-user, logs, get, */*, allow
       p, role:dps-read-user, projects, get, *, allow
       g, dps-team-read-user, role:dps-read-user        
       p, role:nginx-user, applications, get, nginx/*, allow
       p, role:nginx-user, exec, create, nginx/*, allow
       p, role:nginx-user, *, delete , *, deny
       p, role:nginx-user, logs, get, */*, allow
       p, role:nginx-user, applications, action/argoproj.io/Rollout/abort, */*, allow
       p, role:nginx-user, applications, action/argoproj.io/Rollout/resume, */*, allow
       p, role:nginx-user, applications, action/argoproj.io/Rollout/promote-full, */*, allow
       p, role:nginx-user, applications, action/argoproj.io/Rollout/skip-current-step, */*, allow
       p, role:nginx-user, applications, action/argoproj.io/Rollout/retry, */*, allow
       p, role:nginx-user, applications, action/argoproj.io/Rollout/restart, */*, allow
    scopes: '[groups, email]'