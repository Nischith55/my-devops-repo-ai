apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: ibp-faui-preprod
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app    
spec:
  description: Project for ibp-faui-preprod   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/ibp-faui-argocd-configs
  - pepdpsprodacr.azurecr.io/helm
  destinations:
  - name: pep-dps-preprod-scus-global-01-aks
    namespace: pep-dps-dps-ibpfau-preprod
  - name: pep-dps-preprod-scus-global-01-aks
    namespace: pep-dps-ops-admin
  roles:
  - name: ibp-faui-preprod-admin
    description: Admin privileges to ibp-faui-preprod
    policies:
    - p, proj:ibp-faui-preprod:ibp-faui-preprod-admin, applications, *, ibp-faui-preprod/*, allow
    - p, proj:ibp-faui-preprod:ibp-faui-preprod-admin, applications, get, argocd/*, allow
    - p, proj:ibp-faui-preprod:ibp-faui-preprod-admin, repositories, *, ibp-faui-preprod/*, allow
    groups:
    - "Team.Support.CGF.NonProd.devops"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: ibp-faui-preprod-user
    description: Read-only privileges to ibp-faui-preprod
    policies:
    - p, proj:ibp-faui-preprod:ibp-faui-preprod-user, applications, get, ibp-faui-preprod/*, allow
    - p, proj:ibp-faui-preprod:ibp-faui-preprod-user, applications, sync, ibp-faui-preprod/*, allow
    - p, proj:ibp-faui-preprod:ibp-faui-preprod-user, repositories, get, ibp-faui-preprod/*, allow
    - p, proj:ibp-faui-preprod:ibp-faui-preprod-user, applications, action/apps/Deployment/restart, ibp-faui-preprod/*, allow
    groups:
    - "Team.Support.DPS.NonProd.ibpfaui"
    - "Team.Support.EIAP.READ"
    - "Team.Support.CGF.NonProd.devops"