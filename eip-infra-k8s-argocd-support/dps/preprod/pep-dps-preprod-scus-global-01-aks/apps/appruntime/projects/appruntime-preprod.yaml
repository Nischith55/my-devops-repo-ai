apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: appruntime-preprod
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app    
spec:
  description: Project for appruntime-preprod   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/appruntime-argocd-configs
  - pepdpsprodacr.azurecr.io/helm
  destinations:
  - server: https://kubernetes.default.svc
    namespace: pep-dps-cgf-psd-preprod
  - server: https://kubernetes.default.svc
    namespace: pep-dps-ops-admin
  roles:
  - name: appruntime-preprod-admin
    description: Admin privileges to appruntime-preprod
    policies:
    - p, proj:appruntime-preprod:appruntime-preprod-admin, applications, *, appruntime-preprod/*, allow
    - p, proj:appruntime-preprod:appruntime-preprod-admin, applications, get, argocd/*, allow
    - p, proj:appruntime-preprod:appruntime-preprod-admin, repositories, *, appruntime-preprod/*, allow
    groups:
    - "Team.Support.CGF.NonProd.devops"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: appruntime-preprod-user
    description: Read-only privileges to appruntime-preprod
    policies:
    - p, proj:appruntime-preprod:appruntime-preprod-user, applications, get, appruntime-preprod/*, allow
    - p, proj:appruntime-preprod:appruntime-preprod-user, applications, sync, appruntime-preprod/*, allow
    - p, proj:appruntime-preprod:appruntime-preprod-user, repositories, get, appruntime-preprod/*, allow
    - p, proj:appruntime-preprod:appruntime-preprod-user, applications, action/apps/Deployment/restart, appruntime-preprod/*, allow
    groups:
    - "Team.App.DPS.DevOps.NonProd"
    - "Team.Support.EIAP.READ"
    - "Team.Support.CGF.NonProd.devops"