apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: r360-preprod
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app
spec:
  description: Project for r360-preprod   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/r360-argocd-configs
  - pepdpsprodacr.azurecr.io/helm
  destinations:
  - name: pep-dps-preprod-scus-global-01-aks
    namespace: pep-dps-dps-re360-preprod
  - name: pep-dps-preprod-scus-global-01-aks
    namespace: pep-dps-ops-admin
  - name: pep-dps-preprod-scus-global-01-aks
    namespace: pep-dps-dps-aiqr360-preprod
    server: https://kubernetes.default.svc

  roles:
  - name: r360-preprod-admin
    description: Admin privileges to r360-preprod
    policies:
    - p, proj:r360-preprod:r360-preprod-admin, applications, *, r360-preprod/*, allow
    - p, proj:r360-preprod:r360-preprod-admin, repositories, *, r360-preprod/*, allow
    groups:
    - "Team.Support.CGF.NonProd.devops"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: r360-preprod-user
    description: Read-only privileges to r360-preprod
    policies:
    - p, proj:r360-preprod:r360-preprod-user, applications, get, r360-preprod/*, allow
    - p, proj:r360-preprod:r360-preprod-user, applications, sync, r360-preprod/*, allow
    - p, proj:r360-preprod:r360-preprod-user, repositories, get, r360-preprod/*, allow
    - p, proj:r360-preprod:r360-preprod-user, applications, action/apps/Deployment/restart, r360-preprod/*, allow
    groups:
    - "Team.App.SupportDPS.OnePEP.CAF"
    - "Team.Support.EIAP.READ"
    - "Team.Support.CGF.NonProd.devops"