apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: b2b-bff-feature
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app    
spec:
  description: Project for b2b-bff-feature   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/b2b-bff-argocd-configs
  - pepdpsprodacr.azurecr.io/helm
  destinations:
  - name: pep-dps-preprod-suk-global-01-aks
    namespace: pep-dps-dps-b2bbffeu-preprod
  - name: pep-dps-preprod-suk-global-01-aks
    namespace: pep-dps-ops-admin
  roles:
  - name: b2b-bff-feature-admin
    description: Admin privileges to b2b-bff-feature
    policies:
    - p, proj:b2b-bff-feature:b2b-bff-feature-admin, applications, *, b2b-bff-feature/*, allow
    - p, proj:b2b-bff-feature:b2b-bff-feature-admin, applications, get, argocd/*, allow
    - p, proj:b2b-bff-feature:b2b-bff-feature-admin, repositories, *, b2b-bff-feature/*, allow
    groups:
    - "Team.Support.CGF.NonProd.devops"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: b2b-bff-feature-user
    description: Read-only privileges to b2b-bff-feature
    policies:
    - p, proj:b2b-bff-feature:b2b-bff-feature-user, applications, get, b2b-bff-feature/*, allow
    - p, proj:b2b-bff-feature:b2b-bff-feature-user, applications, sync, b2b-bff-feature/*, allow
    - p, proj:b2b-bff-feature:b2b-bff-feature-user, repositories, get, b2b-bff-feature/*, allow
    - p, proj:b2b-bff-feature:b2b-bff-feature-user, applications, action/apps/Deployment/restart, b2b-bff-feature/*, allow
    groups:
    - "Team.App.SupportDPS.OnePEP.CAF"
    - "Team.Support.EIAP.READ"
    - "Team.Support.CGF.NonProd.devops"