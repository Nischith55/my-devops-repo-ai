apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: dsxadapter-dsxpepadapt-preprod
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app
spec:
  description: Project for dsxadapter-dsxpepadapt-preprod   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/dsxadapter-dsxpepadapt-argocd-configs
  - pepdpsprodacr.azurecr.io/helm
  destinations:
  - name: pep-dps-preprod-suk-global-01-aks
    namespace: pep-dps-dps-euadapt-preprod
  - name: pep-dps-preprod-suk-global-01-aks
    namespace: pep-dps-ops-admin
  roles:
  - name: dsxadapter-dsxpepadapt-preprod-admin
    description: Admin privileges to dsxadapter-dsxpepadapt-preprod
    policies:
    - p, proj:dsxadapter-dsxpepadapt-preprod:dsxadapter-dsxpepadapt-preprod-admin, applications, *, dsxadapter-dsxpepadapt-preprod/*, allow
    - p, proj:dsxadapter-dsxpepadapt-preprod:dsxadapter-dsxpepadapt-preprod-admin, repositories, *, dsxadapter-dsxpepadapt-preprod/*, allow
    groups:
    - "Team.Support.CGF.NonProd.devops"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: dsxadapter-dsxpepadapt-preprod-user
    description: Read-only privileges to dsxadapter-dsxpepadapt-preprod
    policies:
    - p, proj:dsxadapter-dsxpepadapt-preprod:dsxadapter-dsxpepadapt-preprod-user, applications, get, dsxadapter-dsxpepadapt-preprod/*, allow
    - p, proj:dsxadapter-dsxpepadapt-preprod:dsxadapter-dsxpepadapt-preprod-user, applications, sync, dsxadapter-dsxpepadapt-preprod/*, allow
    - p, proj:dsxadapter-dsxpepadapt-preprod:dsxadapter-dsxpepadapt-preprod-user, repositories, get, dsxadapter-dsxpepadapt-preprod/*, allow
     # This line will be replaced by the pipeline script
    - p, proj:dsxadapter-dsxpepadapt-preprod:dsxadapter-dsxpepadapt-preprod-user, applications, action/apps/Deployment/restart, dsxadapter-dsxpepadapt-preprod/*, allow

    groups:
    - "Team.Support.DPS.NonProd.adapt"
    - "Team.Support.EIAP.READ"