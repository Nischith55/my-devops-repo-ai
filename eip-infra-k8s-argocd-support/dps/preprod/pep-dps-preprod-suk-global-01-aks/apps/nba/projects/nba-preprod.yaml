apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: nba-preprod
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app    
spec:
  description: Project for nba-preprod   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/nba-argocd-configs
  - pepdpsprodacr.azurecr.io/helm
  destinations:
  - name: pep-dps-preprod-suk-global-01-aks
    namespace: pep-dps-dps-nba-preprod
  - name: pep-dps-preprod-suk-global-01-aks
    namespace: pep-dps-ops-admin
  roles:
  - name: nba-preprod-admin
    description: Admin privileges to nba-preprod
    policies:
    - p, proj:nba-preprod:nba-preprod-admin, applications, *, nba-preprod/*, allow
    - p, proj:nba-preprod:nba-preprod-admin, applications, get, argocd/*, allow
    - p, proj:nba-preprod:nba-preprod-admin, repositories, *, nba-preprod/*, allow
    groups:
    - "Team.Support.CGF.NonProd.devops"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: nba-preprod-user
    description: Read-only privileges to nba-preprod
    policies:
    - p, proj:nba-preprod:nba-preprod-user, applications, get, nba-preprod/*, allow
    - p, proj:nba-preprod:nba-preprod-user, applications, sync, nba-preprod/*, allow
    - p, proj:nba-preprod:nba-preprod-user, repositories, get, nba-preprod/*, allow
    - p, proj:nba-preprod:nba-preprod-user, applications, action/apps/Deployment/restart, nba-preprod/*, allow
    groups:
    - "Team.Support.CGF.NonProd.devops"
    - "Team.Support.EIAP.READ"
    - "Team.Support.DPS.NonProd.NBA"