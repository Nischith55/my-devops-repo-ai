apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: retail360-preprod
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app    
spec:
  description: Project for retail360-preprod   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/r360-argocd-configs
  - pepdpsprodacr.azurecr.io/helm
  destinations:
  - name: pep-dps-preprod-suk-global-01-aks
    namespace: pep-dps-dps-r360uat-preprod
  - name: pep-dps-preprod-suk-global-01-aks
    namespace: pep-dps-ops-admin
  roles:
  - name: retail360-preprod-admin
    description: Admin privileges to retail360-preprod
    policies:
    - p, proj:retail360-preprod:retail360-preprod-admin, applications, *, retail360-preprod/*, allow
    - p, proj:retail360-preprod:retail360-preprod-admin, applications, get, argocd/*, allow
    - p, proj:retail360-preprod:retail360-preprod-admin, repositories, *, retail360-preprod/*, allow
    groups:
    - "Team.Support.CGF.NonProd.devops"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: retail360-preprod-user
    description: Read-only privileges to retail360-preprod
    policies:
    - p, proj:retail360-preprod:retail360-preprod-user, applications, get, retail360-preprod/*, allow
    - p, proj:retail360-preprod:retail360-preprod-user, applications, sync, retail360-preprod/*, allow
    - p, proj:retail360-preprod:retail360-preprod-user, repositories, get, retail360-preprod/*, allow
    - p, proj:retail360-preprod:retail360-preprod-user, applications, action/apps/Deployment/restart, retail360-preprod/*, allow
    groups:
    - "Team.App.SupportDPS.OnePEP.CAF"
    - "Team.Support.EIAP.READ"
    - "Team.Support.CGF.NonProd.devops"