apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-rollouts
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: argocd
  syncPolicy:    
    automated:
      prune: false
      selfHeal: true
      allowEmpty: false
  destination:
    namespace: argo-rollouts
    server: https://kubernetes.default.svc
  source:
    repoURL: https://dev.azure.com/PepsiCoIT/EIP-Infrastructure/_git/eip-infra-k8s-argocd-support
    targetRevision: main
    path: dps/preprod/pep-dps-preprod-suk-global-01-aks/argo-rollouts
    directory:
      recurse: true
      jsonnet: {}