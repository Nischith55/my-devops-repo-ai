apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: gscaf-prod
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app     
spec:
  description: Project for gscaf-prod   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/pep-gscaf-argocd-configs
  - pepdpsprodacr.azurecr.io/helm
  destinations:
  - name: pep-dps-prod-sea-global-01-aks
    namespace: pep-dps-cgf-gscafso-prod
  - name: pep-dps-prod-sea-global-01-aks
    namespace: pep-dps-ops-admin
  roles:
  - name: gscaf-prod-admin
    description: Admin privileges to gscaf-prod
    policies:
    - p, proj:gscaf-prod:gscaf-prod-admin, applications, *, gscaf-prod/*, allow
    - p, proj:gscaf-prod:gscaf-prod-admin, applications, get, argocd/*, allow
    - p, proj:gscaf-prod:gscaf-prod-admin, repositories, *, gscaf-prod/*, allow
    groups:
    - "Team.Support.CGF.NonProd.devops"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: gscaf-prod-user
    description: Read-only privileges to gscaf-prod
    policies:
    - p, proj:gscaf-prod:gscaf-prod-user, applications, get, gscaf-prod/*, allow
    - p, proj:gscaf-prod:gscaf-prod-user, applications, sync, gscaf-prod/*, allow
    - p, proj:gscaf-prod:gscaf-prod-user, repositories, get, gscaf-prod/*, allow
    groups:
    - "Team.App.DPS.GSCAF.Prod"
    - "Team.Support.EIAP.READ"
    - "Team.Support.CGF.NonProd.devops"