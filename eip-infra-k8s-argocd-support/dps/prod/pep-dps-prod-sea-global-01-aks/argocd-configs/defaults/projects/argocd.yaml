apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: argocd
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-platform
spec:
  description: Default project for dps   
  sourceRepos:
  - pepdpsprodacr.azurecr.io/helm
  - pepeiapprodcommonacr.azurecr.io/helm
  - https://dev.azure.com/PepsiCoIT/EIP-Infrastructure/_git/eip-infra-k8s-argocd-support
  - https://dev.azure.com/PepsiCoIT/Global_SNT_Global_Payment_Gateway/_git/gpg-argocd-configs
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/product-success-argocd-configs
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/appruntime-argocd-configs
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/pep-gscaf-argocd-configs
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/notifications-argocd-configs
  - https://dev.azure.com/PepsiCoIT2/InfoSec_Falcon_Upgradation/_git/pep-falcon-aisp-aks-argocd-configs
  destinations:
  - name: pep-dps-prod-sea-global-01-aks
    namespace: argocd
    server: https://kubernetes.default.svc
  - name: pep-dps-prod-sea-global-01-aks
    namespace: argo-rollouts
    server: https://kubernetes.default.svc
  roles:  
  - name: argocd-user
    description: Read-only privileges to argocd
    policies:
    - p, proj:argocd:argocd-user, applications, get, argocd/*, allow
    - p, proj:argocd:argocd-user, applications, sync, argocd/*, allow
    - p, proj:argocd:argocd-user, repositories, get, argocd/*, allow
    groups:
    - "Team.Support.CGF.NonProd.devops"