apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: gsat-prod
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app
spec:
  description: Project for gsat-prod   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/gsat-argocd-configs
  - pepdpsprodacr.azurecr.io/helm
  destinations:
  - name: pep-dps-prod-scus-global-01-aks
    namespace: pep-dps-dps-gspt-prod
  - name: pep-dps-prod-scus-global-01-aks
    namespace: pep-dps-ops-admin
  roles:
  - name: gsat-prod-admin
    description: Admin privileges to gsat-prod
    policies:
    - p, proj:gsat-prod:gsat-prod-admin, applications, *, gsat-prod/*, allow
    - p, proj:gsat-prod:gsat-prod-admin, repositories, *, gsat-prod/*, allow
    groups:
    - "Team.Support.CGF.NonProd.devops"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: gsat-prod-user
    description: Read-only privileges to gsat-prod
    policies:
    - p, proj:gsat-prod:gsat-prod-user, applications, get, gsat-prod/*, allow
    - p, proj:gsat-prod:gsat-prod-user, applications, sync, gsat-prod/*, allow
    - p, proj:gsat-prod:gsat-prod-user, repositories, get, gsat-prod/*, allow
    groups:
    - "Team.Support.DPS.NonProd.GSAT"
    - "Team.Support.EIAP.READ"
    - "Team.Support.CGF.NonProd.devops"