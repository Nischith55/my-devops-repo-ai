apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: admin-dashboard-prod
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app
spec:
  description: Project for admin-dashboard-prod   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/admin-dashboard-argocd-configs
  - pepdpsprodacr.azurecr.io/helm
  destinations:
  - name: pep-dps-prod-scus-global-01-aks
    namespace: pep-dps-dps-b2badmin-prod
  - name: pep-dps-prod-scus-global-01-aks
    namespace: pep-dps-ops-admin
  roles:
  - name: admin-dashboard-prod-admin
    description: Admin privileges to admin-dashboard-prod
    policies:
    - p, proj:admin-dashboard-prod:admin-dashboard-prod-admin, applications, *, admin-dashboard-prod/*, allow
    - p, proj:admin-dashboard-prod:admin-dashboard-prod-admin, repositories, *, admin-dashboard-prod/*, allow
    groups:
    - "Team.Support.CGF.NonProd.devops"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: admin-dashboard-prod-user
    description: Read-only privileges to admin-dashboard-prod
    policies:
    - p, proj:admin-dashboard-prod:admin-dashboard-prod-user, applications, get, admin-dashboard-prod/*, allow
    - p, proj:admin-dashboard-prod:admin-dashboard-prod-user, applications, sync, admin-dashboard-prod/*, allow
    - p, proj:admin-dashboard-prod:admin-dashboard-prod-user, repositories, get, admin-dashboard-prod/*, allow
    groups:
    - "Team.Support.DPS.NonProd.NBA"
    - "Team.Support.EIAP.READ"
    - "Team.Support.CGF.NonProd.devops"