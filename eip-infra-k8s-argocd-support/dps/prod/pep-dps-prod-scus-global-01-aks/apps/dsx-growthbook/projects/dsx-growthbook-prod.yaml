apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: dsx-growthbook-prod
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app    
spec:
  description: Project for dsx-growthbook-prod   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/pep-gscaf-argocd-configs
  - pepdpsprodacr.azurecr.io/helm
  destinations:
  - name: pep-dps-prod-scus-global-01-aks
    namespace: pep-dps-cgf-gscafso-prod
  - name: pep-dps-prod-scus-global-01-aks
    namespace: pep-dps-ops-admin
  roles:
  - name: dsx-growthbook-prod-admin
    description: Admin privileges to dsx-growthbook-prod
    policies:
    - p, proj:dsx-growthbook-prod:dsx-growthbook-prod-admin, applications, *, dsx-growthbook-prod/*, allow
    - p, proj:dsx-growthbook-prod:dsx-growthbook-prod-admin, applications, get, argocd/*, allow
    - p, proj:dsx-growthbook-prod:dsx-growthbook-prod-admin, repositories, *, dsx-growthbook-prod/*, allow
    groups:
    - "Team.Support.CGF.NonProd.devops"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: dsx-growthbook-prod-user
    description: Read-only privileges to dsx-growthbook-prod
    policies:
    - p, proj:dsx-growthbook-prod:dsx-growthbook-prod-user, applications, get, dsx-growthbook-prod/*, allow
    - p, proj:dsx-growthbook-prod:dsx-growthbook-prod-user, applications, sync, dsx-growthbook-prod/*, allow
    - p, proj:dsx-growthbook-prod:dsx-growthbook-prod-user, repositories, get, dsx-growthbook-prod/*, allow
    groups:
    - "Team.App.SupportDPS.OnePEP.CAF"
    - "Team.Support.EIAP.READ"
    - "Team.Support.CGF.NonProd.devops"