apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: dtv-should-cost-prod
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app    
spec:
  description: Project for dtv-should-cost-prod   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/dtv-should-cost-argocd-configs
  - pepdpsprodacr.azurecr.io/helm
  destinations:
  - server: https://kubernetes.default.svc
    namespace: pep-dps-dps-dtvscm-prod
  - server: https://kubernetes.default.svc
    namespace: pep-dps-ops-admin
  roles:
  - name: dtv-should-cost-prod-admin
    description: Admin privileges to dtv-should-cost-prod
    policies:
    - p, proj:dtv-should-cost-prod:dtv-should-cost-prod-admin, applications, *, dtv-should-cost-prod/*, allow
    - p, proj:dtv-should-cost-prod:dtv-should-cost-prod-admin, applications, get, argocd/*, allow
    - p, proj:dtv-should-cost-prod:dtv-should-cost-prod-admin, repositories, *, dtv-should-cost-prod/*, allow
    groups:
    - "Team.Support.CGF.NonProd.devops"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: dtv-should-cost-prod-user
    description: Read-only privileges to dtv-should-cost-prod
    policies:
    - p, proj:dtv-should-cost-prod:dtv-should-cost-prod-user, applications, get, dtv-should-cost-prod/*, allow
    - p, proj:dtv-should-cost-prod:dtv-should-cost-prod-user, applications, sync, dtv-should-cost-prod/*, allow
    - p, proj:dtv-should-cost-prod:dtv-should-cost-prod-user, repositories, get, dtv-should-cost-prod/*, allow
    groups:
    - "Team.App.CGF.NonProd.dtvscm"
    - "Team.Support.EIAP.READ"
    - "Team.Support.CGF.NonProd.devops"