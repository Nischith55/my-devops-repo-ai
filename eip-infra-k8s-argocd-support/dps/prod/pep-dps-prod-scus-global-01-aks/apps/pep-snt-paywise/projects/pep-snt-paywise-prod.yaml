apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: pep-snt-paywise-prod
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app
spec:
  description: Project for pep-snt-paywise-prod   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT2/IT_SnT_GRIR/_git/pep-snt-paywise-argocd-configs
  - pepdpsprodacr.azurecr.io/helm
  destinations:
  - name: pep-dps-prod-scus-global-01-aks
    namespace: pep-dps-dps-grirprod-prod
  - name: pep-dps-prod-scus-global-01-aks
    namespace: pep-dps-ops-admin
  roles:
  - name: pep-snt-paywise-prod-admin
    description: Admin privileges to pep-snt-paywise-prod
    policies:
    - p, proj:pep-snt-paywise-prod:pep-snt-paywise-prod-admin, applications, *, pep-snt-paywise-prod/*, allow
    - p, proj:pep-snt-paywise-prod:pep-snt-paywise-prod-admin, repositories, *, pep-snt-paywise-prod/*, allow
    groups:
    - "Team.Support.CGF.NonProd.devops"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: pep-snt-paywise-prod-user
    description: Read-only privileges to pep-snt-paywise-prod
    policies:
    - p, proj:pep-snt-paywise-prod:pep-snt-paywise-prod-user, applications, get, pep-snt-paywise-prod/*, allow
    - p, proj:pep-snt-paywise-prod:pep-snt-paywise-prod-user, applications, sync, pep-snt-paywise-prod/*, allow
    - p, proj:pep-snt-paywise-prod:pep-snt-paywise-prod-user, repositories, get, pep-snt-paywise-prod/*, allow
     # This line will be replaced by the pipeline script

    groups:
    - "Team.Support.DPS.Prod.grirprod"
    - "Team.Support.EIAP.READ"
    - "Team.Support.CGF.NonProd.devops"