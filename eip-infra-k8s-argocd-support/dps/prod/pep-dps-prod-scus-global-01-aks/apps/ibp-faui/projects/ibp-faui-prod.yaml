apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: ibp-faui-prod
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app    
spec:
  description: Project for ibp-faui-prod   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/ibp-faui-argocd-configs
  - pepdpsprodacr.azurecr.io/helm
  destinations:
  - name: pep-dps-prod-scus-global-01-aks
    namespace: pep-dps-dps-fauiibp-prod
  - name: pep-dps-prod-scus-global-01-aks
    namespace: pep-dps-ops-admin
  roles:
  - name: ibp-faui-prod-admin
    description: Admin privileges to ibp-faui-prod
    policies:
    - p, proj:ibp-faui-prod:ibp-faui-prod-admin, applications, *, ibp-faui-prod/*, allow
    - p, proj:ibp-faui-prod:ibp-faui-prod-admin, applications, get, argocd/*, allow
    - p, proj:ibp-faui-prod:ibp-faui-prod-admin, repositories, *, ibp-faui-prod/*, allow
    groups:
    - "Team.Support.CGF.NonProd.devops"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: ibp-faui-prod-user
    description: Read-only privileges to ibp-faui-prod
    policies:
    - p, proj:ibp-faui-prod:ibp-faui-prod-user, applications, get, ibp-faui-prod/*, allow
    - p, proj:ibp-faui-prod:ibp-faui-prod-user, applications, sync, ibp-faui-prod/*, allow
    - p, proj:ibp-faui-prod:ibp-faui-prod-user, repositories, get, ibp-faui-prod/*, allow
    groups:
    - "Team.Support.DPS.NonProd.fauiqa"
    - "Team.Support.EIAP.READ"
    - "Team.Support.CGF.NonProd.devops"