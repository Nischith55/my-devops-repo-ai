apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: rules-engine-prod
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app    
spec:
  description: Project for rules-engine-prod   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/rules-engine-argocd-configs
  - pepdpsprodacr.azurecr.io/helm
  destinations:
  - name: pep-dps-prod-scus-global-01-aks
    namespace: pep-dps-dps-ruleng-prod
  - name: pep-dps-prod-scus-global-01-aks
    namespace: pep-dps-ops-admin
  roles:
  - name: rules-engine-prod-admin
    description: Admin privileges to rules-engine-prod
    policies:
    - p, proj:rules-engine-prod:rules-engine-prod-admin, applications, *, rules-engine-prod/*, allow
    - p, proj:rules-engine-prod:rules-engine-prod-admin, repositories, *, rules-engine-prod/*, allow
    groups:
    - "Team.App.DPS.DevOps.NonProd"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: rules-engine-prod-user
    description: Read-only privileges to rules-engine-prod
    policies:
    - p, proj:rules-engine-prod:rules-engine-prod-user, applications, get, rules-engine-prod/*, allow
    - p, proj:rules-engine-prod:rules-engine-prod-user, applications, sync, rules-engine-prod/*, allow
    - p, proj:rules-engine-prod:rules-engine-prod-user, repositories, get, rules-engine-prod/*, allow
    groups:
    - "Team.Support.DPS.Prod.RulEng"
    - "Team.Support.EIAP.READ"
    - "Team.Support.CGF.NonProd.devops"