apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devtest2805-devtesting2805-prod-bootstrapper
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: argocd
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  syncPolicy:    
    automated:
      prune: false
      selfHeal: true
  sources:
  - ref: values
    repoURL: https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/devtest2805-devtesting2805-argocd-configs
    targetRevision: develop 
  - repoURL: pepdpsprodacr.azurecr.io/helm 
    targetRevision: "0.2.5"
    chart: argocd-app-bootstrapper 
    helm:
      releaseName: devtest2805-devtesting2805-prod
      valueFiles:
      - $values/prod/pep-dps-prod-scus-global-01-aks/argocd-app-configs.yaml    
      values: |
        global:
          env: prod
          helm:  
            enabled: false       
            repo: pepdpsprodacr.azurecr.io/helm 
            chart: umbrellachart
            revision: 2.2.2 
            values: 
              platform-chart:
                destination: 
                  jobImage: pepeiapprodcommonacr.azurecr.io/pep/eip/infra/azurepipeline/devopsagent:20240222.1
                  jobNS: pep-dps-ops-admin 
                  jobServiceAccount: gw-update-sa
          spec:
            project: devtest2805-devtesting2805-prod 
            source: 
              repoURL: https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/devtest2805-devtesting2805-argocd-configs 
              repoName: devtest2805-devtesting2805-argocd-configs # appruntime-argocd-configs
              targetRevision: develop
              manifest: helm-values.yaml
            sync:
              prune: false 
            notifications:  
              notifyEmail: Ashu.Agrawal.Contractor@pepsico.com