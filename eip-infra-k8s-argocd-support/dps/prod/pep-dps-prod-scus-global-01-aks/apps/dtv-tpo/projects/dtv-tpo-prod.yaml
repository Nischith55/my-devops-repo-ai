apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: dtv-tpo-prod
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app    
spec:
  description: Project for dtv-tpo-prod   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/dtv-tpo-argocd-configs
  - pepdpsprodacr.azurecr.io/helm
  destinations:
  - name: pep-dps-prod-scus-global-01-aks
    namespace: pep-dps-dps-dtvtpo-prod
  - name: pep-dps-prod-scus-global-01-aks
    namespace: pep-dps-ops-admin
  roles:
  - name: dtv-tpo-prod-admin
    description: Admin privileges to dtv-tpo-prod
    policies:
    - p, proj:dtv-tpo-prod:dtv-tpo-prod-admin, applications, *, dtv-tpo-prod/*, allow
    - p, proj:dtv-tpo-prod:dtv-tpo-prod-admin, applications, get, argocd/*, allow
    - p, proj:dtv-tpo-prod:dtv-tpo-prod-admin, repositories, *, dtv-tpo-prod/*, allow
    groups:
    - "Team.Support.CGF.NonProd.devops"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: dtv-tpo-prod-user
    description: Read-only privileges to dtv-tpo-prod
    policies:
    - p, proj:dtv-tpo-prod:dtv-tpo-prod-user, applications, get, dtv-tpo-prod/*, allow
    - p, proj:dtv-tpo-prod:dtv-tpo-prod-user, applications, sync, dtv-tpo-prod/*, allow
    - p, proj:dtv-tpo-prod:dtv-tpo-prod-user, repositories, get, dtv-tpo-prod/*, allow
    groups:
    - "Team.Support.CGF.NonProd.devops"
    - "Team.Support.DPS.NonProd.dtvtpo"
    - "Team.Support.EIAP.READ"