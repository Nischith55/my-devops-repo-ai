apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: pep-abt-shopper-prod
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app
spec:
  description: Project for pep-abt-shopper-prod   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/pep-abt-shopper-argocd-configs
  - pepdpsprodacr.azurecr.io/helm
  destinations:
  - name: pep-dps-prod-scus-global-01-aks
    namespace: pep-dps-dps-abts-prod
  - name: pep-dps-prod-scus-global-01-aks
    namespace: pep-dps-ops-admin
  roles:
  - name: pep-abt-shopper-prod-admin
    description: Admin privileges to pep-abt-shopper-prod
    policies:
    - p, proj:pep-abt-shopper-prod:pep-abt-shopper-prod-admin, applications, *, pep-abt-shopper-prod/*, allow
    - p, proj:pep-abt-shopper-prod:pep-abt-shopper-prod-admin, repositories, *, pep-abt-shopper-prod/*, allow
    groups:
    - "Team.Support.CGF.NonProd.devops"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: pep-abt-shopper-prod-user
    description: Read-only privileges to pep-abt-shopper-prod
    policies:
    - p, proj:pep-abt-shopper-prod:pep-abt-shopper-prod-user, applications, get, pep-abt-shopper-prod/*, allow
    - p, proj:pep-abt-shopper-prod:pep-abt-shopper-prod-user, applications, sync, pep-abt-shopper-prod/*, allow
    - p, proj:pep-abt-shopper-prod:pep-abt-shopper-prod-user, repositories, get, pep-abt-shopper-prod/*, allow
     # This line will be replaced by the pipeline script

    groups:
    - "Team.Support.CGF.NonProd.devops"
    - "Team.App.SupportDPS.OnePEP.CAF"
    - "Team.Support.EIAP.READ"