apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: proc-scm-ai-api-prod
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app
spec:
  description: Project for proc-scm-ai-api-prod   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/proc-scm-ai-api-argocd-configs
  - pepdpsprodacr.azurecr.io/helm
  destinations:
  - name: pep-dps-prod-scus-global-01-aks
    namespace: pep-dps-dps-dtvscm-prod
  - name: pep-dps-prod-scus-global-01-aks
    namespace: pep-dps-ops-admin
  roles:
  - name: proc-scm-ai-api-prod-admin
    description: Admin privileges to proc-scm-ai-api-prod
    policies:
    - p, proj:proc-scm-ai-api-prod:proc-scm-ai-api-prod-admin, applications, *, proc-scm-ai-api-prod/*, allow
    - p, proj:proc-scm-ai-api-prod:proc-scm-ai-api-prod-admin, repositories, *, proc-scm-ai-api-prod/*, allow
    groups:
    - "Team.Support.CGF.NonProd.devops"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: proc-scm-ai-api-prod-user
    description: Read-only privileges to proc-scm-ai-api-prod
    policies:
    - p, proj:proc-scm-ai-api-prod:proc-scm-ai-api-prod-user, applications, get, proc-scm-ai-api-prod/*, allow
    - p, proj:proc-scm-ai-api-prod:proc-scm-ai-api-prod-user, applications, sync, proc-scm-ai-api-prod/*, allow
    - p, proj:proc-scm-ai-api-prod:proc-scm-ai-api-prod-user, repositories, get, proc-scm-ai-api-prod/*, allow
     # This line will be replaced by the pipeline script

    groups:
    - "Team.Support.CGF.NonProd.dtvscm"
    - "Team.Support.EIAP.READ"