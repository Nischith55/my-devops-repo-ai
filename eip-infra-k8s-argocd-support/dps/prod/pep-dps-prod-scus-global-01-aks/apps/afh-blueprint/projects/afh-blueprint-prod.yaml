apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: afh-blueprint-prod
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app
spec:
  description: Project for afh-blueprint-prod   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/afh-blueprint-argocd-configs
  - pepdpsprodacr.azurecr.io/helm
  destinations:
  - name: pep-dps-prod-scus-global-01-aks
    namespace: pep-dps-cgf-afhblue-prod
  - name: pep-dps-prod-scus-global-01-aks
    namespace: pep-dps-ops-admin
  roles:
  - name: afh-blueprint-prod-admin
    description: Admin privileges to afh-blueprint-prod
    policies:
    - p, proj:afh-blueprint-prod:afh-blueprint-prod-admin, applications, *, afh-blueprint-prod/*, allow
    - p, proj:afh-blueprint-prod:afh-blueprint-prod-admin, repositories, *, afh-blueprint-prod/*, allow
    groups:
    - "Team.Support.CGF.NonProd.devops"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: afh-blueprint-prod-user
    description: Read-only privileges to afh-blueprint-prod
    policies:
    - p, proj:afh-blueprint-prod:afh-blueprint-prod-user, applications, get, afh-blueprint-prod/*, allow
    - p, proj:afh-blueprint-prod:afh-blueprint-prod-user, applications, sync, afh-blueprint-prod/*, allow
    - p, proj:afh-blueprint-prod:afh-blueprint-prod-user, repositories, get, afh-blueprint-prod/*, allow
     # This line will be replaced by the pipeline script

    groups:
    - "Team.Support.CGF.NonProd.AFHMenuPro"
    - "Team.Support.EIAP.READ"