apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: dps-dss-collab-components-prod
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app
spec:
  description: Project for dps-dss-collab-components-prod   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/dps-dss-collab-components-argocd-configs
  - pepdpsprodacr.azurecr.io/helm
  destinations:
  - name: pep-dps-prod-scus-global-01-aks
    namespace: pep-dps-dps-collabcp-prod
  - name: pep-dps-prod-scus-global-01-aks
    namespace: pep-dps-ops-admin
  roles:
  - name: dps-dss-collab-components-prod-admin
    description: Admin privileges to dps-dss-collab-components-prod
    policies:
    - p, proj:dps-dss-collab-components-prod:dps-dss-collab-components-prod-admin, applications, *, dps-dss-collab-components-prod/*, allow
    - p, proj:dps-dss-collab-components-prod:dps-dss-collab-components-prod-admin, repositories, *, dps-dss-collab-components-prod/*, allow
    groups:
    - "Team.Support.CGF.NonProd.devops"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: dps-dss-collab-components-prod-user
    description: Read-only privileges to dps-dss-collab-components-prod
    policies:
    - p, proj:dps-dss-collab-components-prod:dps-dss-collab-components-prod-user, applications, get, dps-dss-collab-components-prod/*, allow
    - p, proj:dps-dss-collab-components-prod:dps-dss-collab-components-prod-user, applications, sync, dps-dss-collab-components-prod/*, allow
    - p, proj:dps-dss-collab-components-prod:dps-dss-collab-components-prod-user, repositories, get, dps-dss-collab-components-prod/*, allow
     # This line will be replaced by the pipeline script

    groups:
    - "Team.App.DPS.CollabComponents.admin"
    - "Team.Support.EIAP.READ"
    - "Team.Support.CGF.NonProd.devops"