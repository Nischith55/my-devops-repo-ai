apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: cct-r360-prod
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app
spec:
  description: Project for cct-r360-prod   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/cct-r360-argocd-configs
  - pepdpsprodacr.azurecr.io/helm
  destinations:
  - name: pep-dps-prod-scus-global-01-aks
    namespace: pep-dps-dps-jo-prod
  - name: pep-dps-prod-scus-global-01-aks
    namespace: pep-dps-ops-admin
  roles:
  - name: cct-r360-prod-admin
    description: Admin privileges to cct-r360-prod
    policies:
    - p, proj:cct-r360-prod:cct-r360-prod-admin, applications, *, cct-r360-prod/*, allow
    - p, proj:cct-r360-prod:cct-r360-prod-admin, repositories, *, cct-r360-prod/*, allow
    groups:
    - "Team.Support.CGF.NonProd.devops"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: cct-r360-prod-user
    description: Read-only privileges to cct-r360-prod
    policies:
    - p, proj:cct-r360-prod:cct-r360-prod-user, applications, get, cct-r360-prod/*, allow
    - p, proj:cct-r360-prod:cct-r360-prod-user, applications, sync, cct-r360-prod/*, allow
    - p, proj:cct-r360-prod:cct-r360-prod-user, repositories, get, cct-r360-prod/*, allow
     # This line will be replaced by the pipeline script

    groups:
    - "Team.Support.CGF.NonProd.devops"
    - "Team.Support.DPS.Prod.JO"
    - "Team.Support.EIAP.READ"