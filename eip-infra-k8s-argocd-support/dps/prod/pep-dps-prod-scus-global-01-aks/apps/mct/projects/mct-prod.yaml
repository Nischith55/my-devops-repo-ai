apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: mct-prod
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app    
spec:
  description: Project for mct-prod   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/mct-argocd-configs
  - pepdpsprodacr.azurecr.io/helm
  destinations:
  - name: pep-dps-prod-scus-global-01-aks
    namespace: pep-dps-cgf-vcr-prod
  - name: pep-dps-prod-scus-global-01-aks
    namespace: pep-dps-ops-admin
  roles:
  - name: mct-prod-admin
    description: Admin privileges to mct-prod
    policies:
    - p, proj:mct-prod:mct-prod-admin, applications, *, mct-prod/*, allow
    - p, proj:mct-prod:mct-prod-admin, applications, get, argocd/*, allow
    - p, proj:mct-prod:mct-prod-admin, repositories, *, mct-prod/*, allow
    groups:
    - "Team.Support.CGF.NonProd.devops"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: mct-prod-user
    description: Read-only privileges to mct-prod
    policies:
    - p, proj:mct-prod:mct-prod-user, applications, get, mct-prod/*, allow
    - p, proj:mct-prod:mct-prod-user, applications, sync, mct-prod/*, allow
    - p, proj:mct-prod:mct-prod-user, repositories, get, mct-prod/*, allow
    groups:
    - "Team.Support.cgf.snt.vcr.prod.appsupport"
    - "Team.Support.EIAP.READ"
    - "Team.Support.CGF.NonProd.devops"