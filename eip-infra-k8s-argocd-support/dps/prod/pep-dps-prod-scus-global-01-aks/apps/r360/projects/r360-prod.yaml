apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: r360-prod
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app
spec:
  description: Project for r360-prod   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/r360-argocd-configs
  - pepdpsprodacr.azurecr.io/helm
  destinations:
  - name: pep-dps-prod-scus-global-01-aks
    namespace: pep-dps-cgf-retailprod-prod
  - name: pep-dps-prod-scus-global-01-aks
    namespace: pep-dps-ops-admin

  - name: pep-dps-prod-scus-global-01-aks
    namespace: pep-dps-dps-re360-prod
    server: https://kubernetes.default.svc
  - name: pep-dps-prod-scus-global-01-aks
    namespace: pep-dps-dps-aiqr360-prod
    server: https://kubernetes.default.svc

  roles:
  - name: r360-prod-admin
    description: Admin privileges to r360-prod
    policies:
    - p, proj:r360-prod:r360-prod-admin, applications, *, r360-prod/*, allow
    - p, proj:r360-prod:r360-prod-admin, repositories, *, r360-prod/*, allow
    groups:
    - "Team.Support.CGF.NonProd.devops"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: r360-prod-user
    description: Read-only privileges to r360-prod
    policies:
    - p, proj:r360-prod:r360-prod-user, applications, get, r360-prod/*, allow
    - p, proj:r360-prod:r360-prod-user, applications, sync, r360-prod/*, allow
    - p, proj:r360-prod:r360-prod-user, repositories, get, r360-prod/*, allow
    groups:
    - "Team.App.SupportDPS.OnePEP.CAF"
    - "Team.Support.EIAP.READ"
    - "Team.Support.CGF.NonProd.devops"