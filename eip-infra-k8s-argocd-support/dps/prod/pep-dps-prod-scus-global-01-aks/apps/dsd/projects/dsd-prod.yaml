apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: dsd-prod
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app    
spec:
  description: Project for dsd-prod   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/dsd-argocd-configs
  - pepdpsprodacr.azurecr.io/helm
  destinations:
  - name: pep-dps-prod-scus-global-01-aks
    namespace: pep-dps-cgf-dsd-prod
  - name: pep-dps-prod-scus-global-01-aks
    namespace: pep-dps-ops-admin
  roles:
  - name: dsd-prod-admin
    description: Admin privileges to dsd-prod
    policies:
    - p, proj:dsd-prod:dsd-prod-admin, applications, *, dsd-prod/*, allow
    - p, proj:dsd-prod:dsd-prod-admin, applications, get, argocd/*, allow
    - p, proj:dsd-prod:dsd-prod-admin, repositories, *, dsd-prod/*, allow
    groups:
    - "Team.Support.CGF.NonProd.devops"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: dsd-prod-user
    description: Read-only privileges to dsd-prod
    policies:
    - p, proj:dsd-prod:dsd-prod-user, applications, get, dsd-prod/*, allow
    - p, proj:dsd-prod:dsd-prod-user, applications, sync, dsd-prod/*, allow
    - p, proj:dsd-prod:dsd-prod-user, repositories, get, dsd-prod/*, allow
    groups:
    - "Team.App.DPS.DSD.prod.admin"
    - "Team.Support.EIAP.READ"
    - "Team.Support.CGF.NonProd.devops"