apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: distributiontestingtool-prod
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app    
spec:
  description: Project for distributiontestingtool-prod 
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/distributiontestingtool-argocd-configs
  - pepdpsprodacr.azurecr.io/helm 
  destinations:
  - name: pep-dps-prod-scus-global-01-aks
    namespace: pep-dps-dps-dcs-dev
  - name: pep-dps-prod-scus-global-01-aks
    namespace: pep-dps-ops-admin
  roles:
  - name: distributiontestingtool-prod-admin
    description: Admin privileges to distributiontestingtool-prod
    policies:
    - p, proj:distributiontestingtool-prod:distributiontestingtool-prod-admin, applications, *, distributiontestingtool-prod/*, allow
    - p, proj:distributiontestingtool-prod:distributiontestingtool-prod-admin, applications, get, argocd/*, allow
    - p, proj:distributiontestingtool-prod:distributiontestingtool-prod-admin, repositories, *, distributiontestingtool-prod/*, allow
    groups:
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
    - "Team.Support.CGF.NonProd.devops"

  - name: distributiontestingtool-prod-user
    description: Read-only privileges to distributiontestingtool-prod
    policies:
    - p, proj:distributiontestingtool-prod:distributiontestingtool-prod-user, applications, get, appruntime-dev/*, allow
    - p, proj:distributiontestingtool-prod:distributiontestingtool-prod-user, applications, sync, appruntime-dev/*, allow
    - p, proj:distributiontestingtool-prod:distributiontestingtool-prod-user, repositories, get, appruntime-dev/*, allow
    - p, proj:distributiontestingtool-prod:distributiontestingtool-prod-user, *, delete, *, deny
    groups:
    - "Team.Support.CGF.NonProd.DCS" ## modify the group here as per the user input
    - "Team.Support.EIAP.READ"
    - "Team.Support.CGF.NonProd.devops"