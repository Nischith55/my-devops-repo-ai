apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: bdr-sync-prod
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app
spec:
  description: Project for bdr-sync-prod   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/bdr-sync-argocd-configs
  - pepdpsprodacr.azurecr.io/helm
  destinations:
  - name: pep-dps-prod-scus-global-01-aks
    namespace: pep-dps-dps-bdrtapp-prod
  - name: pep-dps-prod-scus-global-01-aks
    namespace: pep-dps-ops-admin
  roles:
  - name: bdr-sync-prod-admin
    description: Admin privileges to bdr-sync-prod
    policies:
    - p, proj:bdr-sync-prod:bdr-sync-prod-admin, applications, *, bdr-sync-prod/*, allow
    - p, proj:bdr-sync-prod:bdr-sync-prod-admin, repositories, *, bdr-sync-prod/*, allow
    groups:
    - "Team.Support.CGF.NonProd.devops"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: bdr-sync-prod-user
    description: Read-only privileges to bdr-sync-prod
    policies:
    - p, proj:bdr-sync-prod:bdr-sync-prod-user, applications, get, bdr-sync-prod/*, allow
    - p, proj:bdr-sync-prod:bdr-sync-prod-user, applications, sync, bdr-sync-prod/*, allow
    - p, proj:bdr-sync-prod:bdr-sync-prod-user, repositories, get, bdr-sync-prod/*, allow
     # This line will be replaced by the pipeline script

    groups:
    - "Team.Support.DPS.Prod.BDRTAPP"
    - "Team.Support.EIAP.READ"
    - "Team.Support.CGF.NonProd.devops"