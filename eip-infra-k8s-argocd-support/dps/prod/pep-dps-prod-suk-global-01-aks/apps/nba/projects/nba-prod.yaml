apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: nba-prod
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app
spec:
  description: Project for nba-prod   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/nba-argocd-configs
  - pepdpsprodacr.azurecr.io/helm
  destinations:
  - name: pep-dps-prod-suk-global-01-aks
    namespace: pep-dps-dps-nbaprod-prod
  - name: pep-dps-prod-suk-global-01-aks
    namespace: pep-dps-ops-admin
  roles:
  - name: nba-prod-admin
    description: Admin privileges to nba-prod
    policies:
    - p, proj:nba-prod:nba-prod-admin, applications, *, nba-prod/*, allow
    - p, proj:nba-prod:nba-prod-admin, repositories, *, nba-prod/*, allow
    groups:
    - "Team.Support.CGF.NonProd.devops"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: nba-prod-user
    description: Read-only privileges to nba-prod
    policies:
    - p, proj:nba-prod:nba-prod-user, applications, get, nba-prod/*, allow
    - p, proj:nba-prod:nba-prod-user, applications, sync, nba-prod/*, allow
    - p, proj:nba-prod:nba-prod-user, repositories, get, nba-prod/*, allow
     # This line will be replaced by the pipeline script

    groups:
    - "Team.App.DPS.NonProd.NBA"
    - "Team.Support.EIAP.READ"
    - "Team.Support.CGF.NonProd.devops"