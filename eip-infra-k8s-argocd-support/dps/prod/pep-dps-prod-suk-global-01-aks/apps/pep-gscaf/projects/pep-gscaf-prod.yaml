apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: pep-gscaf-prod
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app     
spec:
  description: Project for pep-gscaf-prod   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/pep-gscaf-argocd-configs
  - pepdpsprodacr.azurecr.io/helm
  destinations:
  - name: pep-dps-prod-suk-global-01-aks
    namespace: pep-dps-europe-gscafso-prod
  - name: pep-dps-prod-suk-global-01-aks
    namespace: pep-dps-ops-admin
  roles:
  - name: pep-gscaf-prod-admin
    description: Admin privileges to pep-gscaf-prod
    policies:
    - p, proj:pep-gscaf-prod:pep-gscaf-prod-admin, applications, *, pep-gscaf-prod/*, allow
    - p, proj:pep-gscaf-prod:pep-gscaf-prod-admin, applications, get, argocd/*, allow
    - p, proj:pep-gscaf-prod:pep-gscaf-prod-admin, repositories, *, pep-gscaf-prod/*, allow
    groups:
    - "Team.Support.CGF.NonProd.devops"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: pep-gscaf-prod-user
    description: Read-only privileges to pep-gscaf-prod
    policies:
    - p, proj:pep-gscaf-prod:pep-gscaf-prod-user, applications, get, pep-gscaf-prod/*, allow
    - p, proj:pep-gscaf-prod:pep-gscaf-prod-user, applications, sync, pep-gscaf-prod/*, allow
    - p, proj:pep-gscaf-prod:pep-gscaf-prod-user, repositories, get, pep-gscaf-prod/*, allow
    groups:
    - "Team.App.SupportDPS.OnePEP.CAF"
    - "Team.Support.EIAP.READ"
    - "Team.Support.CGF.NonProd.devops"