apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: tctsaudi-qa
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app       
spec:
  description: Project for tctsaudi-qa   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/tct-adapter-service-argocd-configs
  - pepcgfschnonprodgwcacr.azurecr.io/helm
  destinations:
  - name: pep-cgf-sch-nonprod-gwc-01-aks
    namespace: pep-cgf-cgf-tctsa-qa
  - name: pep-cgf-sch-nonprod-gwc-01-aks
    namespace: pep-cgf-ops-admin
  roles:
  - name: tctsaudi-qa-admin
    description: Admin privileges to tctsaudi-qa
    policies:
    - p, proj:tctsaudi-qa:tctsaudi-qa-admin, applications, *, tctsaudi-qa/*, allow
    - p, proj:tctsaudi-qa:tctsaudi-qa-admin, repositories, *, tctsaudi-qa/*, allow
    - p, proj:tctsaudi-qa:tctsaudi-qa-admin, applications, get, argocd/*, allow
    groups:
    - "Team.Support.CGF.NonProd.devops"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: tctsaudi-qa-user
    description: Read-only privileges to tctsaudi-qa
    policies:
    - p, proj:tctsaudi-qa:tctsaudi-qa-user, applications, get, tctsaudi-qa/*, allow
    - p, proj:tctsaudi-qa:tctsaudi-qa-user, applications, sync, tctsaudi-qa/*, allow
    - p, proj:tctsaudi-qa:tctsaudi-qa-user, repositories, get, tctsaudi-qa/*, allow
    - p, proj:tctsaudi-qa:tctsaudi-qa-user, applications, action/apps/Deployment/restart, tctsaudi-qa/*, allow
    groups:
    - "Team.Support.DPS.NonProd.AMESATCT"
    - "Team.App.DPS.DevOps.NonProd"
    - "Team.Support.EIAP.READ"