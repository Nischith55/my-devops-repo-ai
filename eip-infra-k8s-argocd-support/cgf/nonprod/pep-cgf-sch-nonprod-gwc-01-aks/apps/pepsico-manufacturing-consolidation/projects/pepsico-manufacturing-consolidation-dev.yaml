    apiVersion: argoproj.io/v1alpha1
    kind: AppProject
    metadata:
      name: pepsico-manufacturing-consolidation-dev
      namespace: argocd  
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      labels:
        argocd.argoproj.io/project-inherit: global-app
    spec:
      description: Project for pepsico-manufacturing-consolidation-dev  
      sourceRepos:
      - https://dev.azure.com/PepsiCoIT2/Global_SNT_MFG_Consolidation_HUB/_git/pepsico-manufacturing-consolidation-argocd-configs
      - pepcgfschnonprodgwcacr.azurecr.io/helm
      destinations:
