apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cgftest-dev-bootstrapper
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: argocd
  destination:
    namespace: argocd    
    server: https://kubernetes.default.svc
  syncPolicy:    
    automated:
      prune: false
      selfHeal: true
  sources:
  - ref: values
    repoURL: https://dev.azure.com/PepsiCoIT/PFNA_SupplyChainHub/_git/pfna-sch-argocd-configs
    targetRevision: develop
  - repoURL: pepcgfschprodsukacr.azurecr.io/helm
    targetRevision: 0.2.4
    chart: argocd-app-bootstrapper
    helm:
      releaseName: cgftest-dev
      valueFiles:
      - $values/prod/pep-cgf-sch-prod-suk-01-aks/argocd-app-configs.yaml    
      values: |
        global:
          env: dev
          helm:  
            enabled: false       
            repo: pepcgfschprodsukacr.azurecr.io/helm
            chart: umbrellachart
            revision: 2.2.2
            values: 
              platform-chart:
                destination: 
                  jobImage: pepeiapprodcommonacr.azurecr.io/pep/eip/infra/azurepipeline/devopsagent:20240222.1
                  jobNS: pep-cgf-ops-admin
                  jobServiceAccount: gw-update-sa
          spec:
            project: 'cgftest-dev' 
            source: 
              repoURL: https://dev.azure.com/PepsiCoIT/PFNA_SupplyChainHub/_git/pfna-sch-argocd-configs
              repoName: pfna-sch-argocd-configs
              targetRevision: develop
              manifest: helm-values.yaml
            sync:
              prune: false 
            notifications:  
              teamsChannel: argo-notifications