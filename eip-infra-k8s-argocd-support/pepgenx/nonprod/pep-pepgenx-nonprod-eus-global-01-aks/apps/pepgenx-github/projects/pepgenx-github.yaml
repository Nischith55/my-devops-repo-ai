    apiVersion: argoproj.io/v1alpha1
    kind: AppProject
    metadata:
      name: pepgenx-github-dev
      namespace: argocd  
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      labels:
        argocd.argoproj.io/project-inherit: global-platform
    spec:
      description: Project for pepgenx-github-dev  
      sourceRepos:
      - https://github.com/PepsiCo-AISP/dai-aisp-pepgenx-argocd-configs
      - pepeiapnonprodcommonacr.azurecr.io/helm
      - pepeiapnonprodglobalcommonacr.azurecr.io/pep/eiap/lyzr/helm
      - peppepgenxnonprodeusacr.azurecr.io
      - peppepgenxnonprodeusacr.azurecr.io/pep/eiap/lyzr/helm
      - peppepgenxnonprodeusacr.azurecr.io/pep/eiap
      destinations:
      - name: pep-pepgenx-nonprod-eus-global-01-aks
        namespace: pep-pepgenx-cgf-usecases-dev
      - name: pep-pepgenx-nonprod-eus-global-01-aks
        namespace: pep-pepgenx-ops-admin
      - name: pep-pepgenx-nonprod-eus-global-01-aks
        namespace: pep-pepgenx-cgf-temporal-dev
      - name: pep-pepgenx-nonprod-eus-global-01-aks
        namespace: pep-pepgenx-cgf-lyzr-dev   
      - name: pep-pepgenx-nonprod-eus-global-01-aks
        namespace: pep-pepgenx-cgf-pepvigilotel-dev 
      - name: pep-pepgenx-nonprod-eus-global-01-aks
        namespace: pep-pepgenx-cgf-temporal-workers-dev    
       
      roles:
      - name: pepgenx-github-dev-admin
        description: Admin privileges to pepgenx-github-dev
        policies:
        - p, proj:pepgenx-github-dev:pepgenx-github-dev-admin, applications, *, pepgenx-github-dev/*, allow
        - p, proj:pepgenx-github-dev:pepgenx-github-dev-admin, repositories, *, pepgenx-github-dev/*, allow
        groups:
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

      - name: pepgenx-github-dev-user
        description: Read-only privileges to pepgenx-github-dev
        policies:
        - p, proj:pepgenx-github-dev:pepgenx-github-dev-user, applications, get, pepgenx-github-dev/*, allow
        - p, proj:pepgenx-github-dev:pepgenx-github-dev-user, applications, sync, pepgenx-github-dev/*, allow
        - p, proj:pepgenx-github-dev:pepgenx-github-dev-user, repositories, get, pepgenx-github-dev/*, allow
         # This line will be replaced by the pipeline script
        - p, proj:dai-aisp-pepgenx-argocd-dev:dai-aisp-pepgenx-argocd-dev-user, applications, action/apps/Deployment/restart, dai-aisp-pepgenx-argocd-dev/*, allow
        groups:
        - "Team.Support.EIAP.READ"
        - "Team.Support.AZURE.aks.aisec.admins"