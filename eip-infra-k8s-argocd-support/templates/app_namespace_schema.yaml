apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: applicationname-envname-namespaces
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Namespace(s) must exist before the application syncs its workloads into them.
    argocd.argoproj.io/sync-wave: "-10"
spec:
  # Dedicated project that inherits global-platform (whitelists the cluster-scoped
  # Namespace resource). The app's own project inherits global-app, which blacklists
  # Namespace, so it cannot be used to create namespaces.
  project: applicationname-envname-namespaces
  destination:
    name: destcluster
    namespace: appnamespace
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
  source:
    repoURL: argorepourl
    targetRevision: targetbranchname
    # Folder in the ArgoCD config repo that holds the raw Namespace manifest(s),
    # including any Pod Security Admission / labels the application requires.
    path: envname/clustername/namespaces
    directory:
      recurse: false
