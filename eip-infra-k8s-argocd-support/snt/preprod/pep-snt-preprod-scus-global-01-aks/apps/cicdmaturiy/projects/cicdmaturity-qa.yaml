apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: cicdmaturity-qa
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app    
spec:
  description: Project for cicdmaturity-qa   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/pep-eiap-cicdmaturity-argocd-configs
  - pepnonprodsntacr.azurecr.io/helm
  destinations:
  - name: pep-snt-nonprod-eus-global-01-aks
    namespace: pep-snt-cgf-cicd-qa
    server: https://kubernetes.default.svc
  - name: pep-snt-nonprod-eus-global-01-aks
    namespace: pep-snt-ops-admin
    server: https://kubernetes.default.svc
  roles:
  - name: cicdmaturity-qa-admin
    description: Admin privileges to cicdmaturity-qa
    policies:
    - p, proj:cicdmaturity-qa:cicdmaturity-qa-admin, applications, *, cicdmaturity-qa/*, allow
    - p, proj:cicdmaturity-qa:cicdmaturity-qa-admin, repositories, *, cicdmaturity-qa/*, allow
    groups:
    - "Team.App.DPS.DSSRS.admin"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: cicdmaturity-qa-user
    description: Read-only privileges to cicdmaturity-qa
    policies:
    - p, proj:cicdmaturity-qa:cicdmaturity-qa-user, applications, get, cicdmaturity-qa/*, allow
    - p, proj:cicdmaturity-qa:cicdmaturity-qa-user, applications, sync, cicdmaturity-qa/*, allow
    - p, proj:cicdmaturity-qa:cicdmaturity-qa-user, repositories, get, cicdmaturity-qa/*, allow
    groups:
    - "Team.App.SupportDPS.OnePEP.CAF"
