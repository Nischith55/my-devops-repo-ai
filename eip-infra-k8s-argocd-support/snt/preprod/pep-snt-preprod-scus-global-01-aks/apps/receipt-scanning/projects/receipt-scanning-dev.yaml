apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: receipt-scanning-dev
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app    
spec:
  description: Project for receipt-scanning-dev   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/receipt-scanning-argocd-configs
  - pepnonprodsntacr.azurecr.io/helm
  destinations:
  - name: pep-snt-nonprod-eus-global-01-aks
    namespace: pep-snt-cgf-rescan-dev
    server: https://kubernetes.default.svc
  - name: pep-snt-nonprod-eus-global-01-aks
    namespace: pep-snt-ops-admin
    server: https://kubernetes.default.svc
  roles:
  - name: receipt-scanning-dev-admin
    description: Admin privileges to receipt-scanning-dev
    policies:
    - p, proj:receipt-scanning-dev:receipt-scanning-dev-admin, applications, *, receipt-scanning-dev/*, allow
    - p, proj:receipt-scanning-dev:receipt-scanning-dev-admin, repositories, *, receipt-scanning-dev/*, allow
    groups:    
    - "Team.App.DPS.DevOps.NonProd"
  - name: receipt-scanning-dev-user
    description: Read-only privileges to receipt-scanning-dev
    policies:
    - p, proj:receipt-scanning-dev:receipt-scanning-dev-user, applications, get, receipt-scanning-dev/*, allow
    - p, proj:receipt-scanning-dev:receipt-scanning-dev-user, applications, sync, receipt-scanning-dev/*, allow
    - p, proj:receipt-scanning-dev:receipt-scanning-dev-user, repositories, get, receipt-scanning-dev/*, allow
    groups:
    - "Team.App.DPS.DSSRS.admin"