apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: argocd
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-platform
spec:
  description: Default project for SNT   
  sourceRepos:
  - pepnonprodsntacr.azurecr.io/helm
  - pepeiapnonprodcommonacr.azurecr.io/helm
  - https://dev.azure.com/PepsiCoIT/EIP-Infrastructure/_git/eip-infra-k8s-argocd-support
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/pep-eiap-cicdmaturity-argocd-configs
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/receipt-scanning-argocd-configs
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/notifications-argocd-configs
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/product-success-argocd-configs
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/feature-toggle-argocd-configs
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/pepsico-retail-360-argocd-configs
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/fmcs-argocd-configs
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/dsd-argocd-configs
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/rd-gssi-argocd-configs
  - https://dev.azure.com/PepsiCoIT2/CGF_Global_Functions_Transformation/_git/rd-ppsi-argocd-configs
  - https://dev.azure.com/PepsiCoIT/RD_Digital_Platform_Engineering/_git/lghthouse-ai-labs-argocd-configs
  - https://dev.azure.com/PepsiCoIT2/InfoSec_Falcon_Upgradation/_git/pep-falcon-aisp-aks-argocd-configs
  destinations:
  - name: pep-snt-nonprod-eus-global-02-aks
    namespace: argocd
    server: https://kubernetes.default.svc
  roles:  
  - name: argocd-user
    description: Read-only privileges to argocd
    policies:
    - p, proj:argocd:argocd-user, applications, get, argocd/*, allow
    - p, proj:argocd:argocd-user, applications, sync, argocd/*, allow
    - p, proj:argocd:argocd-user, repositories, get, argocd/*, allow
    groups:
    - "Team.Support.CGF.NonProd.devops"