apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rd-gssi-qa-bootstrapper
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: argocd
  destination:
    namespace: argocd    
    server: https://kubernetes.default.svc
  syncPolicy:    
    automated:
      prune: false
      selfHeal: true
  sources:
  - ref: values
    repoURL: https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/rd-gssi-argocd-configs
    targetRevision: develop
  - repoURL: pepnonprodsntacr.azurecr.io/helm
    targetRevision: 0.2.2
    chart: argocd-app-bootstrapper
    helm:
      releaseName: rd-gssi-qa
      valueFiles:
      - $values/qa/pep-snt-nonprod-eus-global-02-aks/argocd-app-configs.yaml    
      values: |
        global:
          env: qa
          helm:  
            enabled: false       
            repo: pepnonprodsntacr.azurecr.io/helm
            chart: umbrellachart
            revision: 2.2.2
            values: 
              platform-chart:
                destination: 
                  jobImage: pepeiapnonprodcommonacr.azurecr.io/pep/eip/infra/azurepipeline/devopsagent:20240222.1
                  jobNS: pep-snt-ops-admin
                  jobServiceAccount: gw-update-sa
          spec:
            project: 'rd-gssi-qa' 
            source: 
              repoURL: https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/rd-gssi-argocd-configs
              repoName: rd-gssi-argocd-configs
              targetRevision: develop
              manifest: helm-values.yaml
            sync:
              prune: false 
            notifications:  
              teamsChannel: argo-notifications