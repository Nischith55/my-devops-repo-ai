apiVersion: apps/v1
kind: Deployment
metadata:
  name: no-name
spec:
  template:
    spec:
      nodeSelector:
        balance-group: Argo01ZonedPools
      tolerations:
      - key: "ArgoNodePool"
        operator: "Exists"
        effect: "NoSchedule"
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway

