apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: product-success-dev
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app    
spec:
  description: Project for product-success-dev   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/product-success-argocd-configs
  - pepnonprodsntacr.azurecr.io/helm
  destinations:
  - name: pep-snt-nonprod-eus-global-01-aks
    namespace: pep-snt-cgf-apprt-dev
    server: https://kubernetes.default.svc
  - name: pep-snt-nonprod-eus-global-01-aks
    server: https://kubernetes.default.svc
    namespace: pep-snt-ops-admin
  roles:
  - name: product-success-dev-admin
    description: Admin privileges to product-success-dev
    policies:
    - p, proj:product-success-dev:product-success-dev-admin, applications, *, product-success-dev/*, allow
    - p, proj:product-success-dev:product-success-dev-admin, repositories, *, product-success-dev/*, allow
    groups:    
    - "Team.App.DPS.DevOps.NonProd"
  - name: product-success-dev-user
    description: Read-only privileges to product-success-dev
    policies:
    - p, proj:product-success-dev:product-success-dev-user, applications, get, product-success-dev/*, allow
    - p, proj:product-success-dev:product-success-dev-user, applications, sync, product-success-dev/*, allow
    - p, proj:product-success-dev:product-success-dev-user, repositories, get, product-success-dev/*, allow
    - p, proj:product-success-dev:product-success-dev-user, applications, action/apps/Deployment/restart, product-success-dev/*, allow
    groups:
    - "Team.App.DPS.DSSRS.admin"