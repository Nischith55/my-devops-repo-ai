apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cicdmaturity-qa-bootstrapper
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: argocd
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  syncPolicy:    
    automated:
      prune: false
      selfHeal: false
  sources:
  - ref: values
    repoURL: https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/pep-eiap-cicdmaturity-argocd-configs
    targetRevision: develop
  - repoURL: pepnonprodsntacr.azurecr.io/helm
    targetRevision: 0.2.2
    chart: argocd-app-bootstrapper
    helm:
      releaseName: cicdmaturity-qa
      valueFiles:
      - $values/qa/pep-snt-nonprod-eus-global-01-aks/argocd-app-configs.yaml    
      values: |
        global:
          env: qa
          helm:  
            enabled: false       
            repo: pepnonprodsntacr.azurecr.io/helm
            chart: umbrellachart
            revision: 2.1.29
            values: 
              platform-chart:
                destination: 
                  jobImage: pepeiapnonprodcommonacr.azurecr.io/pep/eip/infra/azurepipeline/devopsagent:20240222.1
                  jobNS: pep-snt-ops-admin
                  jobServiceAccount: gw-update-sa
          spec:
            project: 'cicdmaturity-qa' 
            source: 
              repoURL: https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/pep-eiap-cicdmaturity-argocd-configs
              targetRevision: develop
              manifest: helm-values.yaml
            sync:
              prune: false 
            notifications: 
              notifyEmail: notify.sch@pepsico.com  
              teamsChannel: sntteam