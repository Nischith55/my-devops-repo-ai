apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: gssi-prod
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Project for gssi-prod   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/rd-gssi-argocd-configs
  - pepeiapprodcommonacr.azurecr.io/helm
  destinations:
  - name: pep-snt-prod-scus-global-02-aks
    namespace: pep-snt-cgf-gssilabs-prod
  - name: pep-snt-prod-scus-global-02-aks
    namespace: pep-snt-ops-admin
  roles:
  - name: gssi-prod-admin
    description: Admin privileges to gssi-prod
    policies:
    - p, proj:gssi-prod:gssi-prod-admin, applications, *, gssi-prod/*, allow
    - p, proj:gssi-prod:gssi-prod-admin, repositories, *, gssi-prod/*, allow
    groups:
    - "Team.App.DPS.DevOps.NonProd"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: gssi-prod-user
    description: Read-only privileges to gssi-prod
    policies:
    - p, proj:gssi-prod:gssi-prod-user, applications, get, gssi-prod/*, allow
    - p, proj:gssi-prod:gssi-prod-user, applications, sync, gssi-prod/*, allow
    - p, proj:gssi-prod:gssi-prod-user, repositories, get, gssi-prod/*, allow
    groups:
    - "Team.Support.CGF.NonProd.GSSILABS"
    - "Team.Support.EIAP.READ"
    - "Team.Support.CGF.NonProd.devops"