apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nextgenpwm-bootstrapper-dev1
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: argocd
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  syncPolicy:    
    automated:
      prune: false
      selfHeal: true
  sources:
  - ref: values
    repoURL: https://dev.azure.com/PepsiCoIT/SCHUB_WHSE/_git/pepsico-global-schub-whse-argocd-configs
    targetRevision: feature/argocd
  - repoURL: peppfnaschnonprodacr.azurecr.io/helm
    targetRevision: 0.2.4
    chart: argocd-app-bootstrapper
    helm:
      releaseName: nextgenpwm-dev1
      valueFiles:
      - $values/dev1/pep-pfna-sch-nonprod-eus-01-aks/argocd-app-configs.yaml    
      values: |
        global:
          env: dev1
          helm:  
            enabled: false       
            repo: peppfnaschnonprodacr.azurecr.io/helm
            chart: umbrellachart
            revision: 2.2.2
            values: 
              platform-chart:
                destination: 
                  jobImage: pepeiapnonprodcommonacr.azurecr.io/pep/eip/infra/azurepipeline/devopsagent:20240222.1
                  jobNS: pep-pfna-sch-ops-admin
                  jobServiceAccount: gw-update-sa
          spec:
            project: 'nextgenpwm-dev1' 
            source: 
              repoURL: https://dev.azure.com/PepsiCoIT/SCHUB_WHSE/_git/pepsico-global-schub-whse-argocd-configs
              repoName: pepsico-global-schub-whse-argocd-configs
              targetRevision: feature/argocd
              manifest: helm-values.yaml
            sync:
              prune: false 
            notifications:             
              teamsChannel: argo-notification
              