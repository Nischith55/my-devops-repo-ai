apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: nextgenpwm-dev2
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app    
spec:
  description: Project for SCH   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/SCHUB_WHSE/_git/pepsico-global-schub-whse-argocd-configs
  - peppfnaschnonprodacr.azurecr.io/helm   
  destinations:  
  - name: pep-pfna-sch-nonprod-eus-01-aks
    namespace: pep-pfna-pfna-schwhseint-dev  
    server: https://kubernetes.default.svc  
  - name: pep-pfna-sch-nonprod-eus-01-aks
    namespace: pep-pfna-sch-ops-admin
    server: https://kubernetes.default.svc    
  roles:
  - name: nextgenpwm-admin-dev2
    description: Admin privileges to nextgenpwm-dev2
    policies:
    - p, proj:nextgenpwm-dev2:nextgenpwm-admin-dev2, applications, *, nextgenpwm-dev2/*, allow
    - p, proj:nextgenpwm-dev2:nextgenpwm-admin-dev2, repositories, *, nextgenpwm-dev2/*, allow
    groups:
    - "Team.Support.EIAP.Deployment.Approvers"

  - name: nextgenpwm-user-dev2
    description: Read-only privileges to nextgenpwm-dev2
    policies:
    - p, proj:nextgenpwm-dev2:nextgenpwm-user-dev2, applications, get, nextgenpwm-dev2/*, allow
    - p, proj:nextgenpwm-dev2:nextgenpwm-user-dev2, applications, sync, nextgenpwm-dev2/*, allow
    - p, proj:nextgenpwm-dev2:nextgenpwm-user-dev2, repositories, get, nextgenpwm-dev2/*, allow
    - p, proj:nextgenpwm-dev2:nextgenpwm-user-dev2, applications, action/apps/Deployment/restart, nextgenpwm-dev2/*, allow
    groups:
    - "Team.Support.NGPWM.Admins"
    - "Team.Support.NGPWM.Dev"
