apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: sch-helloworld-github-dev
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app   
spec:
  description: Project for sch-helloworld-github-dev   
  sourceRepos:
  - https://github.com/Global-SnT/tsep-pfna-sch-helloworld-configs
  - peppfnaschnonprodacr.azurecr.io/helm
  - peppfnaschnonprodacr.azurecr.io/bitnamicharts
  destinations:
  - name: pep-pfna-sch-nonprod-eus-01-aks
    namespace: pep-pfna-flna-schservice-dev
    server: https://kubernetes.default.svc 
  - name: pep-pfna-sch-nonprod-eus-01-aks
    namespace: pep-pfna-sch-ops-admin
    server: https://kubernetes.default.svc 
  roles:
  - name: sch-helloworld-github-dev-admin
    description: Admin privileges to sch-helloworld-github-dev
    policies:
    - p, proj:sch-helloworld-github-dev:sch-helloworld-github-dev-admin, applications, *, sch-helloworld-github-dev/*, allow
    - p, proj:sch-helloworld-github-dev:sch-helloworld-github-dev-admin, repositories, *, sch-helloworld-github-dev/*, allow
    groups:
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
 
  - name: sch-helloworld-github-dev-user
    description: Read-only privileges to sch-helloworld-github-dev
    policies:
    - p, proj:sch-helloworld-github-dev:sch-helloworld-github-dev-user, applications, get, sch-helloworld-github-dev/*, allow
    - p, proj:sch-helloworld-github-dev:sch-helloworld-github-dev-user, applications, sync, sch-helloworld-github-dev/*, allow
    - p, proj:sch-helloworld-github-dev:sch-helloworld-github-dev-user, repositories, get, sch-helloworld-github-dev/*, allow
    - p, proj:sch-helloworld-github-dev:sch-helloworld-github-dev-user, applications, action/apps/Deployment/restart, sch-helloworld-github-dev/*, allow
    groups:
    - "Team.Support.PFNA.SCH.Reader"
    - "Team.Support.EIAP.READ"
    - "Team.Support.PFNA.SCH.Contributor"