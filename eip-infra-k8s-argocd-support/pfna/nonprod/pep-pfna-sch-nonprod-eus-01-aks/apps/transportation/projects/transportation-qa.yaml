apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: transportation-qa
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app   
spec:
  description: Project for transportation-qa   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/transportation/_git/pep-pfna-transp-argocd-config
  - peppfnaschnonprodacr.azurecr.io/helm
  destinations:
  - name: pep-pfna-sch-nonprod-eus-01-aks
    namespace: pep-pfna-flna-midmile-qa
    server: https://kubernetes.default.svc 
  - name: pep-pfna-sch-nonprod-eus-01-aks
    namespace: pep-pfna-sch-ops-admin
    server: https://kubernetes.default.svc 
  - name: pep-pfna-sch-nonprod-eus-01-aks
    namespace: pep-pfna-flna-transp-qa
    server: https://kubernetes.default.svc 
  roles:
  - name: transportation-qa-admin
    description: Admin privileges to transportation-qa
    policies:
    - p, proj:transportation-qa:transportation-qa-admin, applications, *, transportation-qa/*, allow
    - p, proj:transportation-qa:transportation-qa-admin, repositories, *, transportation-qa/*, allow
    groups:
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
 
  - name: transportation-qa-user
    description: Read-only privileges to transportation-qa
    policies:
    - p, proj:transportation-qa:transportation-qa-user, applications, get, transportation-qa/*, allow
    - p, proj:transportation-qa:transportation-qa-user, applications, sync, transportation-qa/*, allow
    - p, proj:transportation-qa:transportation-qa-user, repositories, get, transportation-qa/*, allow
    - p, proj:transportation-qa:transportation-qa-user, applications, action/apps/Deployment/restart, transportation-qa/*, allow
    groups:
    - "Team.Support.PFNA.Fleet.Developer"
    - "Team.Support.EIAP.READ"
    - "Team.Support.CGF.Prod.dsxdevop"