apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: pep-pfna-sr-services-dev
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app
spec:
  description: Project for pep-pfna-sr-services-dev   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Commercial_IT/_git/pep-pfna-sr-services-argocd-configs
  - peppfnanonprodhhnextacr.azurecr.io/helm
  destinations:
  - name: pep-pfna-nonprod-eus-hhnxt-global-01-aks
    namespace: pep-pfna-pcaf-dev
  - name: pep-pfna-nonprod-eus-hhnxt-global-01-aks
    namespace: pep-pfna-ops-admin
  roles:
  - name: pep-pfna-sr-services-dev-admin
    description: Admin privileges to pep-pfna-sr-services-dev
    policies:
    - p, proj:pep-pfna-sr-services-dev:pep-pfna-sr-services-dev-admin, applications, *, pep-pfna-sr-services-dev/*, allow
    - p, proj:pep-pfna-sr-services-dev:pep-pfna-sr-services-dev-admin, repositories, *, pep-pfna-sr-services-dev/*, allow
    groups:
    - "Team.Support.CGF.NonProd.devops"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: pep-pfna-sr-services-dev-user
    description: Read-only privileges to pep-pfna-sr-services-dev
    policies:
    - p, proj:pep-pfna-sr-services-dev:pep-pfna-sr-services-dev-user, applications, get, pep-pfna-sr-services-dev/*, allow
    - p, proj:pep-pfna-sr-services-dev:pep-pfna-sr-services-dev-user, applications, sync, pep-pfna-sr-services-dev/*, allow
    - p, proj:pep-pfna-sr-services-dev:pep-pfna-sr-services-dev-user, repositories, get, pep-pfna-sr-services-dev/*, allow
     # This line will be replaced by the pipeline script
    - p, proj:pep-pfna-sr-services-dev:pep-pfna-sr-services-dev-user, applications, action/apps/Deployment/restart, pep-pfna-sr-services-dev/*, allow

    groups:
    - "Team.Support.PFNA.BEDEV"
    - "Team.Support.PFNA.RG.AKS.NONPROD.Contributor"
    - "Team.Support.PFNA.RG.AKS.PROD.Reader"
    - "Team.Support.EIAP.READ"