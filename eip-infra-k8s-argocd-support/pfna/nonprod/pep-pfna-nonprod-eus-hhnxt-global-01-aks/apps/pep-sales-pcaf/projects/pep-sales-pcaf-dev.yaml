apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: pep-sales-pcaf-dev
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Project for pep-sales-pcaf-dev   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/pep-sales-pcaf-argocd-configs
  - peppfnanonprodhhnextacr.azurecr.io/helm
  destinations:
  - name: pep-pfna-nonprod-eus-hhnxt-global-01-aks
    namespace: pep-pfna-pgt-dev
  - name: pep-pfna-nonprod-eus-hhnxt-global-01-aks
    namespace: pep-pfna-ops-admin
  roles:
  - name: pep-sales-pcaf-dev-admin
    description: Admin privileges to pep-sales-pcaf-dev
    policies:
    - p, proj:pep-sales-pcaf-dev:pep-sales-pcaf-dev-admin, applications, *, pep-sales-pcaf-dev/*, allow
    - p, proj:pep-sales-pcaf-dev:pep-sales-pcaf-dev-admin, repositories, *, pep-sales-pcaf-dev/*, allow
    groups:
    - "Team.App.DPS.DevOps.NonProd"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: pep-sales-pcaf-dev-user
    description: Read-only privileges to pep-sales-pcaf-dev
    policies:
    - p, proj:pep-sales-pcaf-dev:pep-sales-pcaf-dev-user, applications, get, pep-sales-pcaf-dev/*, allow
    - p, proj:pep-sales-pcaf-dev:pep-sales-pcaf-dev-user, applications, sync, pep-sales-pcaf-dev/*, allow
    - p, proj:pep-sales-pcaf-dev:pep-sales-pcaf-dev-user, repositories, get, pep-sales-pcaf-dev/*, allow
    - p, proj:pep-sales-pcaf-dev:pep-sales-pcaf-dev-user, applications, action/apps/Deployment/restart, pep-sales-pcaf-dev/*, allow
    groups:
    - "Team.test.test"
    - "Team.Support.PFNA.RG.AKS.NONPROD.Contributor"
    - "Team.Support.PFNA.BEDEV"
    - " Team.Support.PFNA.RG.AKS.PROD.Reader"
    - "Team.Support.EIAP.READ"