apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: pep-pfna-spp-services-qa
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app
spec:
  description: Project for pep-pfna-spp-services-qa   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Commercial_IT/_git/pep-pfna-spp-services-argocd-configs
  - peppfnanonprodhhnextacr.azurecr.io/helm
  destinations:
  - name: pep-pfna-nonprod-eus-hhnxt-global-01-aks
    namespace: pep-pfna-flna-salesplus-qa
  - name: pep-pfna-nonprod-eus-hhnxt-global-01-aks
    namespace: pep-pfna-ops-admin
  roles:
  - name: pep-pfna-spp-services-qa-admin
    description: Admin privileges to pep-pfna-spp-services-qa
    policies:
    - p, proj:pep-pfna-spp-services-qa:pep-pfna-spp-services-qa-admin, applications, *, pep-pfna-spp-services-qa/*, allow
    - p, proj:pep-pfna-spp-services-qa:pep-pfna-spp-services-qa-admin, repositories, *, pep-pfna-spp-services-qa/*, allow
    groups:
    - "Team.Support.PFNA.RG.AKS.NONPROD.Admin"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: pep-pfna-spp-services-qa-user
    description: Read-only privileges to pep-pfna-spp-services-qa
    policies:
    - p, proj:pep-pfna-spp-services-qa:pep-pfna-spp-services-qa-user, applications, get, pep-pfna-spp-services-qa/*, allow
    - p, proj:pep-pfna-spp-services-qa:pep-pfna-spp-services-qa-user, applications, sync, pep-pfna-spp-services-qa/*, allow
    - p, proj:pep-pfna-spp-services-qa:pep-pfna-spp-services-qa-user, repositories, get, pep-pfna-spp-services-qa/*, allow
    - p, proj:pep-pfna-spp-services-qa:pep-pfna-spp-services-qa-user, applications, action/apps/Deployment/restart, pep-pfna-spp-services-qa/*, allow
    groups:
    - "Team.Support.PFNA.BEDEV"
    - "Team.Support.EIAP.READ"