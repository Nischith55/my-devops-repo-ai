apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pep-pfna-shp-services-dev-bootstrapper
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: argocd
  destination:
    namespace: argocd    
    server: https://kubernetes.default.svc
  syncPolicy:    
    automated:
      prune: false
      selfHeal: true
  sources:
  - ref: values
    repoURL: https://dev.azure.com/PepsiCoIT/Hand_Held_Next/_git/pep-pfna-shp-services-argocd-configs
    targetRevision: develop
  - repoURL: peppfnanonprodhhnextacr.azurecr.io/helm
    targetRevision: 0.2.5
    chart: argocd-app-bootstrapper
    helm:
      releaseName: pep-pfna-shp-services-dev
      valueFiles:
      - $values/dev/pep-pfna-nonprod-eus-hhnxt-global-01-aks/argocd-app-configs.yaml    
      values: |
        global:
          env: dev
          helm:  
            enabled: false       
            repo: peppfnanonprodhhnextacr.azurecr.io/helm
            chart: umbrellachart
            revision: 2.2.2
            values: 
              platform-chart:
                destination: 
                  jobImage: pepeiapnonprodcommonacr.azurecr.io/pep/eip/infra/azurepipeline/devopsagent:20240222.1
                  jobNS: pep-pfna-ops-admin
                  jobServiceAccount: gw-update-sa
          spec:
            project: 'pep-pfna-shp-services-dev' 
            source: 
              repoURL: https://dev.azure.com/PepsiCoIT/Hand_Held_Next/_git/pep-pfna-shp-services-argocd-configs
              repoName: pep-pfna-shp-services-argocd-configs
              targetRevision: develop
              manifest: helm-values.yaml
            sync:
              prune: false 
            notifications:  
              teamsChannel: argo-notifications