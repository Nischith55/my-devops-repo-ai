apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: ehs-middleware-ehs-prod
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Project for ehs-middleware-ehs-prod 
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/ehs-middleware-ehs-argocd-configs
  - peppfnaschprodacr.azurecr.io/helm 
  destinations:
  - name: pep-pfna-sch-prod-scus-01-aks
    namespace: pep-pfna-flna-scmehs-prod
  - name: pep-pfna-sch-prod-scus-01-aks
    namespace: pep-pfna-sch-ops-admin
  roles:
  - name: ehs-middleware-ehs-prod-admin
    description: Admin privileges to ehs-middleware-ehs-prod
    policies:
    - p, proj:ehs-middleware-ehs-prod:ehs-middleware-ehs-prod-admin, applications, *, ehs-middleware-ehs-prod/*, allow
    - p, proj:ehs-middleware-ehs-prod:ehs-middleware-ehs-prod-admin, repositories, *, ehs-middleware-ehs-prod/*, allow
    groups:
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
    - "Team.Support.CGF.NonProd.devops"

  - name: ehs-middleware-ehs-prod-user
    description: Read-only privileges to ehs-middleware-ehs-prod
    policies:
    - p, proj:ehs-middleware-ehs-prod:ehs-middleware-ehs-prod-user, applications, get, ehs-middleware-ehs-prod/*, allow
    - p, proj:ehs-middleware-ehs-prod:ehs-middleware-ehs-prod-user, applications, sync, ehs-middleware-ehs-prod/*, allow
    - p, proj:ehs-middleware-ehs-prod:ehs-middleware-ehs-prod-user, repositories, get, ehs-middleware-ehs-prod/*, allow
    - p, proj:ehs-middleware-ehs-prod:ehs-middleware-ehs-prod-user, *, delete, *, deny
    groups:
    - "Team.Support.PFNA.SCH.AKS.Reader"
    - "Team.Support.EIAP.READ"
    - "Team.Support.AZURE.MYEHS"