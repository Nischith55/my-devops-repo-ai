    apiVersion: argoproj.io/v1alpha1
    kind: AppProject
    metadata:
      name: pfna-sch-iwms-prod
      namespace: argocd  
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      labels:
        argocd.argoproj.io/project-inherit: global-app
    spec:
      description: Project for pfna-sch-iwms-prod  
      sourceRepos:
      - https://dev.azure.com/PepsiCoIT/IT_Supply_Chain_Data_and_Analytics_Program/_git/pfna-sch-iwms-argocd-configs
      - peppfnaschprodacr.azurecr.io/helm
      destinations:
      - name: pep-pfna-sch-prod-scus-01-aks
        namespace: pep-pfna-flna-iwms-prod
      - name: pep-pfna-sch-prod-scus-01-aks
        namespace: pep-pfna-sch-ops-admin
      - name : pep-pfna-sch-prod-scus-01-aks
        namespace: pep-pfna-ops-admin   
      roles:
      - name: pfna-sch-iwms-prod-admin
        description: Admin privileges to pfna-sch-iwms-prod
        policies:
        - p, proj:pfna-sch-iwms-prod:pfna-sch-iwms-prod-admin, applications, *, pfna-sch-iwms-prod/*, allow
        - p, proj:pfna-sch-iwms-prod:pfna-sch-iwms-prod-admin, repositories, *, pfna-sch-iwms-prod/*, allow
        groups:
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

      - name: pfna-sch-iwms-prod-user
        description: Read-only privileges to pfna-sch-iwms-prod
        policies:
        - p, proj:pfna-sch-iwms-prod:pfna-sch-iwms-prod-user, applications, get, pfna-sch-iwms-prod/*, allow
        - p, proj:pfna-sch-iwms-prod:pfna-sch-iwms-prod-user, applications, sync, pfna-sch-iwms-prod/*, allow
        - p, proj:pfna-sch-iwms-prod:pfna-sch-iwms-prod-user, repositories, get, pfna-sch-iwms-prod/*, allow
         # This line will be replaced by the pipeline script
        groups:
        - "Team.App.PFNAIT.DDS.Smartwarehouse.prod.Contributor"
        - "Team.Support.EIAP.READ"
    