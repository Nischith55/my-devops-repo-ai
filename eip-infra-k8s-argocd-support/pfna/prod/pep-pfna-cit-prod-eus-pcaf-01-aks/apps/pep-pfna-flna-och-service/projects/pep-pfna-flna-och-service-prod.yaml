        - p, proj:pep-pfna-flna-och-service-prod:pep-pfna-flna-och-service-prod-user, applications, sync, pep-pfna-flna-och-service-prod/*, allow
        - p, proj:pep-pfna-flna-och-service-prod:pep-pfna-flna-och-service-prod-user, repositories, get, pep-pfna-flna-och-service-prod/*, allow
         # This line will be replaced by the pipeline script
        groups:
