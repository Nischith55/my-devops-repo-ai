    apiVersion: argoproj.io/v1alpha1
    kind: AppProject
    metadata:
      name: pep-pcaf-och-preprod
      namespace: argocd  
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      labels:
        argocd.argoproj.io/project-inherit: global-app
    spec:
      description: Project for pep-pcaf-och-preprod   
      sourceRepos:
      - https://dev.azure.com/PepsiCoIT/eCommerce_D2C_PFNA/_git/pep-pcaf-och-argocd-configs
      - pepeiapprodcommonacr.azurecr.io/helm
      destinations:
      - name: pep-pfna-cit-preprod-scus-pcaf-01-aks
        namespace: pep-pfna-pcaf-preprod
      - name: pep-pfna-cit-preprod-scus-pcaf-01-aks
        namespace: pep-pfna-ops-admin
      roles:
      - name: pep-pcaf-och-preprod-admin
        description: Admin privileges to pep-pcaf-och-preprod
        policies:
        - p, proj:pep-pcaf-och-preprod:pep-pcaf-och-preprod-admin, applications, *, pep-pcaf-och-preprod/*, allow
        - p, proj:pep-pcaf-och-preprod:pep-pcaf-och-preprod-admin, repositories, *, pep-pcaf-och-preprod/*, allow
        groups:
        - "Team.Support.PFNA.RG.AKS.NONPROD.Admin"
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

      - name: pep-pcaf-och-preprod-user
        description: Read-only privileges to pep-pcaf-och-preprod
        policies:
        - p, proj:pep-pcaf-och-preprod:pep-pcaf-och-preprod-user, applications, get, pep-pcaf-och-preprod/*, allow
        - p, proj:pep-pcaf-och-preprod:pep-pcaf-och-preprod-user, applications, sync, pep-pcaf-och-preprod/*, allow
        - p, proj:pep-pcaf-och-preprod:pep-pcaf-och-preprod-user, repositories, get, pep-pcaf-och-preprod/*, allow
         # This line will be replaced by the pipeline script
        - p, proj:pep-pcaf-och-preprod:pep-pcaf-och-preprod-user, applications, action/apps/Deployment/restart, pep-pcaf-och-preprod/*, allow
        groups:
        - "Team.Support.PFNA.BEDEV"        
        - "Team.Support.EIAP.READ"
        - "Team.Support.PFNA.RG.AKS.PREPROD.Reader"
        - "Team.Support.PFNA.RG.AKS.PROD.Reader"
    