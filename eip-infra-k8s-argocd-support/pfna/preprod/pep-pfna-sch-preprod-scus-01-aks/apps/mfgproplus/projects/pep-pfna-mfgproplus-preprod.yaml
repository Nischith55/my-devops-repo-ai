apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: mfgproplus-preprod
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app    
spec:
  description: Project for SCH   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/PFNA_SC_Manufacturing_MfgPro/_git/pep-pfna-mfgpro-argocd-configs
  - peppfnaschprodacr.azurecr.io/helm   
  destinations:  
  - name: pep-pfna-sch-preprod-scus-01-aks
    namespace: pep-pfna-pfna-mfgpropl-preprod  
    server: https://kubernetes.default.svc  
  - name: pep-pfna-sch-preprod-scus-01-aks
    namespace: pep-pfna-ops-admin
    server: https://kubernetes.default.svc   
  # - name: pep-pfna-sch-preprod-scus-01-aks
  #   namespace: pep-pfna-sch-ops-admin
  #   server: https://kubernetes.default.svc     
  roles:
  - name: mfgproplus-preprod-admin
    description: Admin privileges to mfgproplus-preprod
    policies:
    - p, proj:mfgproplus-preprod:mfgproplus-preprod-admin, applications, *, mfgproplus-preprod/*, allow
    - p, proj:mfgproplus-preprod:mfgproplus-preprod-admin, repositories, *, mfgproplus-preprod/*, allow
    groups:
    - "Team.Support.EIAP.Deployment.Approvers"

  - name: mfgproplus-preprod-user
    description: Read-only privileges to mfgproplus-preprod
    policies:
    - p, proj:mfgproplus-preprod:mfgproplus-preprod-user, applications, get, mfgproplus-preprod/*, allow
    - p, proj:mfgproplus-preprod:mfgproplus-preprod-user, applications, sync, mfgproplus-preprod/*, allow
    - p, proj:mfgproplus-preprod:mfgproplus-preprod-user, repositories, get, mfgproplus-preprod/*, allow
    - p, proj:mfgproplus-preprod:mfgproplus-preprod-user, applications, action/apps/Deployment/restart, mfgproplus-preprod/*, allow
    groups:
    - "Team.Support.PFNA.Mfgpro.Developer"
    - "Team.Support.PFNA.Fleet.Developer"
