apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-install
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
    
spec:
  project: argocd
  syncPolicy:    
    automated:
      prune: false
      selfHeal: true
      allowEmpty: false
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  sources:
  - repoURL: https://dev.azure.com/PepsiCoIT/EIP-Infrastructure/_git/eip-infra-k8s-argocd-support
    targetRevision: main
    path: infratools/nonprod/pep-paas-infratools-nonprod-eus-01-aks/argocd/install
    