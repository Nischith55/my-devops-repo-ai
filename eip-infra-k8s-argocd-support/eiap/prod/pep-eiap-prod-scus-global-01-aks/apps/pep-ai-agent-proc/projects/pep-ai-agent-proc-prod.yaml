    apiVersion: argoproj.io/v1alpha1
    kind: AppProject
    metadata:
      name: pep-ai-agent-proc-prod
      namespace: argocd  
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      labels:
        argocd.argoproj.io/project-inherit: global-app
    spec:
      description: Project for pep-ai-agent-proc-prod   
      sourceRepos:
      - https://dev.azure.com/PepsiCoIT/EIAP_Projects/_git/pep-ai-agent-proc-argocd-configs
      - pepeiapprodcommonacr.azurecr.io/helm
      destinations:
      - name: pep-eiap-prod-scus-global-01-aks
        namespace: pep-eiap-cgf-paagent-prod
      - name: pep-eiap-prod-scus-global-01-aks
        namespace: pep-eiap-ops-admin
      roles:
      - name: pep-ai-agent-proc-prod-admin
        description: Admin privileges to pep-ai-agent-proc-prod
        policies:
        - p, proj:pep-ai-agent-proc-prod:pep-ai-agent-proc-prod-admin, applications, *, pep-ai-agent-proc-prod/*, allow
        - p, proj:pep-ai-agent-proc-prod:pep-ai-agent-proc-prod-admin, repositories, *, pep-ai-agent-proc-prod/*, allow
        groups:
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

      - name: pep-ai-agent-proc-prod-user
        description: Read-only privileges to pep-ai-agent-proc-prod
        policies:
        - p, proj:pep-ai-agent-proc-prod:pep-ai-agent-proc-prod-user, applications, get, pep-ai-agent-proc-prod/*, allow
        - p, proj:pep-ai-agent-proc-prod:pep-ai-agent-proc-prod-user, applications, sync, pep-ai-agent-proc-prod/*, allow
        - p, proj:pep-ai-agent-proc-prod:pep-ai-agent-proc-prod-user, repositories, get, pep-ai-agent-proc-prod/*, allow
         # This line will be replaced by the pipeline script
        groups:
        - "Team.Support.CGF.NonProd.PAagent"
        - "Team.Support.EIAP.READ"
    