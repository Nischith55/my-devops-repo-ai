    apiVersion: argoproj.io/v1alpha1
    kind: AppProject
    metadata:
      name: pes-sw-prod
      namespace: argocd  
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      labels:
        argocd.argoproj.io/project-inherit: global-app
    spec:
      description: Project for pes-sw-prod   
      sourceRepos:
      - https://dev.azure.com/PepsiCoIT/PBNA_Commercial-Equipment_Service_and_Vending/_git/pes_sw_argocd_configs
      - pepeiapprodcommonacr.azurecr.io/helm
      destinations:
      - name: pep-eiap-prod-scus-global-01-aks
        namespace: pep-eiap-pbna-vms365-prod
      - name: pep-eiap-prod-scus-global-01-aks
        namespace: pep-eiap-ops-admin

      - name: pep-eiap-prod-scus-global-01-aks
        namespace: pep-eiap-pbna-cets-prod
        server: https://kubernetes.default.svc
          
      roles:
      - name: pes-sw-prod-admin
        description: Admin privileges to pes-sw-prod
        policies:
        - p, proj:pes-sw-prod:pes-sw-prod-admin, applications, *, pes-sw-prod/*, allow
        - p, proj:pes-sw-prod:pes-sw-prod-admin, repositories, *, pes-sw-prod/*, allow
        groups:
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

      - name: pes-sw-prod-user
        description: Read-only privileges to pes-sw-prod
        policies:
        - p, proj:pes-sw-prod:pes-sw-prod-user, applications, get, pes-sw-prod/*, allow
        - p, proj:pes-sw-prod:pes-sw-prod-user, applications, sync, pes-sw-prod/*, allow
        - p, proj:pes-sw-prod:pes-sw-prod-user, repositories, get, pes-sw-prod/*, allow
         # This line will be replaced by the pipeline script
        groups:
        - "Team.Support.PBNA.Prod.VMS365"
        - "Team.Support.EIAP.READ"
    