apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: pepgpt-prod
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app     
spec:
  description: Project for pepgpt-prod   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/EIAP_Projects/_git/pepgpt-argocd-configs
  - pepeiapprodcommonacr.azurecr.io/helm
  destinations:
  - name: pep-eiap-prod-scus-global-01-aks
    namespace: pep-eiap-cgf-pepgpt-prod
  - name: pep-eiap-prod-scus-global-01-aks
    namespace: pep-eiap-ops-admin
  roles:
  - name: pepgpt-prod-admin
    description: Admin privileges to pepgpt-prod
    policies:
    - p, proj:pepgpt-prod:pepgpt-prod-admin, applications, *, pepgpt-prod/*, allow
    - p, proj:pepgpt-prod:pepgpt-prod-admin, repositories, *, pepgpt-prod/*, allow
    groups:
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"    

  - name: pepgpt-prod-user
    description: Read-only privileges to pepgpt-prod
    policies:
    - p, proj:pepgpt-prod:pepgpt-prod-user, applications, get, pepgpt-prod/*, allow
    - p, proj:pepgpt-prod:pepgpt-prod-user, applications, sync, pepgpt-prod/*, allow
    - p, proj:pepgpt-prod:pepgpt-prod-user, repositories, get, pepgpt-prod/*, allow
    groups:
    - "Team.App.EIAP.PEPCI.RG.Contributor"
    - "Team.Support.EIAP.READ"
    - "Team.App.AI.PepGpt.Admin"