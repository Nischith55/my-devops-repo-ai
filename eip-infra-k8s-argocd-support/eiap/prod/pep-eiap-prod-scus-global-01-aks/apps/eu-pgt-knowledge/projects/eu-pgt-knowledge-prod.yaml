    apiVersion: argoproj.io/v1alpha1
    kind: AppProject
    metadata:
      name: eu-pgt-knowledge-prod
      namespace: argocd  
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      labels:
        argocd.argoproj.io/project-inherit: global-app
    spec:
      description: Project for eu-pgt-knowledge-prod   
      sourceRepos:
      - https://dev.azure.com/PepsiCoIT/EIAP_Projects/_git/eu-pgt-argocd-configs
      - pepeiapprodcommonacr.azurecr.io/helm
      destinations:
      - name: pep-eiap-prod-scus-global-01-aks
        namespace: pep-eiap-cgf-eugeniep-prod
      - name: pep-eiap-prod-scus-global-01-aks
        namespace: pep-eiap-ops-admin
      roles:
      - name: eu-pgt-knowledge-prod-admin
        description: Admin privileges to eu-pgt-knowledge-prod
        policies:
        - p, proj:eu-pgt-knowledge-prod:eu-pgt-knowledge-prod-admin, applications, *, eu-pgt-knowledge-prod/*, allow
        - p, proj:eu-pgt-knowledge-prod:eu-pgt-knowledge-prod-admin, repositories, *, eu-pgt-knowledge-prod/*, allow
        groups:
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

      - name: eu-pgt-knowledge-prod-user
        description: Read-only privileges to eu-pgt-knowledge-prod
        policies:
        - p, proj:eu-pgt-knowledge-prod:eu-pgt-knowledge-prod-user, applications, get, eu-pgt-knowledge-prod/*, allow
        - p, proj:eu-pgt-knowledge-prod:eu-pgt-knowledge-prod-user, applications, sync, eu-pgt-knowledge-prod/*, allow
        - p, proj:eu-pgt-knowledge-prod:eu-pgt-knowledge-prod-user, repositories, get, eu-pgt-knowledge-prod/*, allow
         # This line will be replaced by the pipeline script
        groups:
        - "Team.Support.EUPGTKnowledgeAssistProd.Admins"
        - "Team.Support.EIAP.READ"
    