      - name: pep-eiap-prod-scus-global-01-aks
        namespace: pep-eiap-ops-admin
      roles:
      - name: pbna-wse-lighthouse-prod-admin
        description: Admin privileges to pbna-wse-lighthouse-prod
        policies:
