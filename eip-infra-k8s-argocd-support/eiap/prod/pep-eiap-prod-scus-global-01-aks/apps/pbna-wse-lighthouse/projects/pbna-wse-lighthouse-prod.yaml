    apiVersion: argoproj.io/v1alpha1
    kind: AppProject
    metadata:
      name: pbna-wse-lighthouse-prod
      namespace: argocd  
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      labels:
        argocd.argoproj.io/project-inherit: global-app
    spec:
      description: Project for pbna-wse-lighthouse-prod   
      sourceRepos:
      - https://dev.azure.com/PepsiCoIT2/PBNA_WSE_LIGHTHOUSE/_git/pbna-wse-lighthouse-argocd-configs
      - pepeiapprodcommonacr.azurecr.io/helm
      destinations:
