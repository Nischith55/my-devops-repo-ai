        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

      - name: pbna-wse-lighthouse-prod-user
        description: Read-only privileges to pbna-wse-lighthouse-prod
        policies:
        - p, proj:pbna-wse-lighthouse-prod:pbna-wse-lighthouse-prod-user, applications, get, pbna-wse-lighthouse-prod/*, allow
        - p, proj:pbna-wse-lighthouse-prod:pbna-wse-lighthouse-prod-user, applications, sync, pbna-wse-lighthouse-prod/*, allow
        - p, proj:pbna-wse-lighthouse-prod:pbna-wse-lighthouse-prod-user, repositories, get, pbna-wse-lighthouse-prod/*, allow
         # This line will be replaced by the pipeline script
        groups:
        - "Team.Support.PBNA.NonProd.lighth"
        - "Team.Support.EIAP.READ"
    