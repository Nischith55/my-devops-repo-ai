    apiVersion: argoproj.io/v1alpha1
    kind: AppProject
    metadata:
      name: commercial-brain-prod
      namespace: argocd  
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      labels:
        argocd.argoproj.io/project-inherit: global-app
    spec:
      description: Project for commercial-brain-prod   
      sourceRepos:
      - https://dev.azure.com/PepsiCoIT/EIAP_Projects/_git/commercial-brain-argocd-configs
      - pepeiapprodcommonacr.azurecr.io/helm
      destinations:
      - name: pep-eiap-prod-scus-global-01-aks
        namespace: pep-eiap-cgf-combrain-prod
      - name: pep-eiap-prod-scus-global-01-aks
        namespace: pep-eiap-ops-admin
      roles:
      - name: commercial-brain-prod-admin
        description: Admin privileges to commercial-brain-prod
        policies:
        - p, proj:commercial-brain-prod:commercial-brain-prod-admin, applications, *, commercial-brain-prod/*, allow
        - p, proj:commercial-brain-prod:commercial-brain-prod-admin, repositories, *, commercial-brain-prod/*, allow
        groups:
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

      - name: commercial-brain-prod-user
        description: Read-only privileges to commercial-brain-prod
        policies:
        - p, proj:commercial-brain-prod:commercial-brain-prod-user, applications, get, commercial-brain-prod/*, allow
        - p, proj:commercial-brain-prod:commercial-brain-prod-user, applications, sync, commercial-brain-prod/*, allow
        - p, proj:commercial-brain-prod:commercial-brain-prod-user, repositories, get, commercial-brain-prod/*, allow
         # This line will be replaced by the pipeline script
        groups:
        - "Team.Support.CGF.Prod.combrain"
        - "Team.Support.EIAP.READ"
    