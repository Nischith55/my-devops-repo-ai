    apiVersion: argoproj.io/v1alpha1
    kind: AppProject
    metadata:
      name: eip-services-prod
      namespace: argocd  
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      labels:
        argocd.argoproj.io/project-inherit: global-app
    spec:
      description: Project for eip-services-prod   
      sourceRepos:
      - https://dev.azure.com/PepsiCoIT/EIP-Services/_git/eip-services-argocd-configs
      - pepeiapprodcommonacr.azurecr.io/helm
      destinations:
      - name: pep-eiap-prod-suk-global-01-aks
        namespace: pep-eiap-global-eip-prod
      - name: pep-eiap-prod-suk-global-01-aks
        namespace: pep-eiap-ops-admin
      roles:
      - name: eip-services-prod-admin
        description: Admin privileges to eip-services-prod
        policies:
        - p, proj:eip-services-prod:eip-services-prod-admin, applications, *, eip-services-prod/*, allow
        - p, proj:eip-services-prod:eip-services-prod-admin, repositories, *, eip-services-prod/*, allow
        groups:
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

      - name: eip-services-prod-user
        description: Read-only privileges to eip-services-prod
        policies:
        - p, proj:eip-services-prod:eip-services-prod-user, applications, get, eip-services-prod/*, allow
        - p, proj:eip-services-prod:eip-services-prod-user, applications, sync, eip-services-prod/*, allow
        - p, proj:eip-services-prod:eip-services-prod-user, repositories, get, eip-services-prod/*, allow
         # This line will be replaced by the pipeline script
        groups:
        - "Team.Support.EIAP.GLOBAL.SERVICES.Developer"
        - "Team.Support.EIAP.READ"
    