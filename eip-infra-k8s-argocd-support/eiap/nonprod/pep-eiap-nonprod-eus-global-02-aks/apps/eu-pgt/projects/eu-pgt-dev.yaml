apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: eu-pgt-dev
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Project for eu-pgt-dev   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/EIAP_Projects/_git/eu-pgt-argocd-configs
  - pepeiapnonprodcommonacr.azurecr.io/helm
  destinations:
  - name: pep-eiap-nonprod-eus-global-02-aks
    namespace: pep-eiap-pfna-eugenie-dev
  - name: pep-eiap-nonprod-eus-global-02-aks
    namespace: pep-eiap-ops-admin
  roles:
  - name: eu-pgt-dev-admin
    description: Admin privileges to eu-pgt-dev
    policies:
    - p, proj:eu-pgt-dev:eu-pgt-dev-admin, applications, *, eu-pgt-dev/*, allow
    - p, proj:eu-pgt-dev:eu-pgt-dev-admin, repositories, *, eu-pgt-dev/*, allow
    groups:
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: eu-pgt-dev-user
    description: Read-only privileges to eu-pgt-dev
    policies:
    - p, proj:eu-pgt-dev:eu-pgt-dev-user, applications, get, eu-pgt-dev/*, allow
    - p, proj:eu-pgt-dev:eu-pgt-dev-user, applications, sync, eu-pgt-dev/*, allow
    - p, proj:eu-pgt-dev:eu-pgt-dev-user, repositories, get, eu-pgt-dev/*, allow
    groups:
    - "Team.Support.EUPGTKnowledgeAsst.Admins"
    - "Team.Support.EIAP.READ"