apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: dsworkbench-dev
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app    
spec:
  description: Project for dsworkbench-dev   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/dsworkbench-argocd-configs
  - pepeiapnonprodcommonacr.azurecr.io/helm
  destinations:
  - name: pep-eiap-nonprod-eus-global-02-aks
    namespace: pep-eiap-cgf-dsworkbench-dev
  - name: pep-eiap-nonprod-eus-global-02-aks
    namespace: pep-eiap-ops-admin
  roles:
  - name: dsworkbench-dev-admin
    description: Admin privileges to dsworkbench-dev
    policies:
    - p, proj:dsworkbench-dev:dsworkbench-dev-admin, applications, *, dsworkbench-dev/*, allow
    - p, proj:dsworkbench-dev:dsworkbench-dev-admin, repositories, *, dsworkbench-dev/*, allow
    groups:
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: dsworkbench-dev-user
    description: Read-only privileges to dsworkbench-dev
    policies:
    - p, proj:dsworkbench-dev:dsworkbench-dev-user, applications, get, dsworkbench-dev/*, allow
    - p, proj:dsworkbench-dev:dsworkbench-dev-user, applications, sync, dsworkbench-dev/*, allow
    - p, proj:dsworkbench-dev:dsworkbench-dev-user, repositories, get, dsworkbench-dev/*, allow
    - p, proj:dsworkbench-dev:dsworkbench-dev-user, applications, action/apps/Deployment/restart, dsworkbench-dev/*, allow
    groups:
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
    - "Team.Support.EIAP.READ"