    apiVersion: argoproj.io/v1alpha1
    kind: AppProject
    metadata:
      name: chcc-indirect-sourcing-qa
      namespace: argocd  
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      labels:
        argocd.argoproj.io/project-inherit: global-app
    spec:
      description: Project for chcc-indirect-sourcing-qa  
      sourceRepos:
      - https://dev.azure.com/PepsiCoIT/EIAP_Projects/_git/chcc-indirect-sourcing-argocd-configs
      - pepeiapnonprodcommonacr.azurecr.io/helm
      destinations:
      - name: pep-eiap-nonprod-eus-global-02-aks
        namespace: pep-eiap-cgf-indrisk-qa
      - name: pep-eiap-nonprod-eus-global-02-aks
        namespace: pep-eiap-ops-admin
      roles:
      - name: chcc-indirect-sourcing-qa-admin
        description: Admin privileges to chcc-indirect-sourcing-qa
        policies:
        - p, proj:chcc-indirect-sourcing-qa:chcc-indirect-sourcing-qa-admin, applications, *, chcc-indirect-sourcing-qa/*, allow
        - p, proj:chcc-indirect-sourcing-qa:chcc-indirect-sourcing-qa-admin, repositories, *, chcc-indirect-sourcing-qa/*, allow
        groups:
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

      - name: chcc-indirect-sourcing-qa-user
        description: Read-only privileges to chcc-indirect-sourcing-qa
        policies:
        - p, proj:chcc-indirect-sourcing-qa:chcc-indirect-sourcing-qa-user, applications, get, chcc-indirect-sourcing-qa/*, allow
        - p, proj:chcc-indirect-sourcing-qa:chcc-indirect-sourcing-qa-user, applications, sync, chcc-indirect-sourcing-qa/*, allow
        - p, proj:chcc-indirect-sourcing-qa:chcc-indirect-sourcing-qa-user, repositories, get, chcc-indirect-sourcing-qa/*, allow
         # This line will be replaced by the pipeline script
        - p, proj:chcc-indirect-sourcing-qa:chcc-indirect-sourcing-qa-user, applications, action/apps/Deployment/restart, chcc-indirect-sourcing-qa/*, allow
        groups:
        - "Team.Support.AZURE.APAC.NONPROD.CNINRISK"
        - "Team.Support.EIAP.READ"
    