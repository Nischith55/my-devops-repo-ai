    apiVersion: argoproj.io/v1alpha1
    kind: AppProject
    metadata:
      name: aisp-agentfactory-qa
      namespace: argocd  
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      labels:
        argocd.argoproj.io/project-inherit: global-app
    spec:
      description: Project for aisp-agentfactory-qa   
      sourceRepos:
      - https://dev.azure.com/PepsiCoIT2/CTO_AI_Agent_Factory/_git/pep-aisp-agentfactory-argocd-configs
      - pepeiapnonprodcommonacr.azurecr.io/helm
      destinations:
      - name: pep-eiap-nonprod-eus-global-02-aks
        namespace: pep-eiap-apac-agfactory-qa
      - name: pep-eiap-nonprod-eus-global-02-aks
        namespace: pep-eiap-ops-admin
      roles:
      - name: aisp-agentfactory-qa-admin
        description: Admin privileges to aisp-agentfactory-qa
        policies:
        - p, proj:aisp-agentfactory-qa:aisp-agentfactory-qa-admin, applications, *, aisp-agentfactory-qa/*, allow
        - p, proj:aisp-agentfactory-qa:aisp-agentfactory-qa-admin, repositories, *, aisp-agentfactory-qa/*, allow
        groups:
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

      - name: aisp-agentfactory-qa-user
        description: Read-only privileges to aisp-agentfactory-qa
        policies:
        - p, proj:aisp-agentfactory-qa:aisp-agentfactory-qa-user, applications, get, aisp-agentfactory-qa/*, allow
        - p, proj:aisp-agentfactory-qa:aisp-agentfactory-qa-user, applications, sync, aisp-agentfactory-qa/*, allow
        - p, proj:aisp-agentfactory-qa:aisp-agentfactory-qa-user, repositories, get, aisp-agentfactory-qa/*, allow
         # This line will be replaced by the pipeline script
        - p, proj:aisp-agentfactory-qa:aisp-agentfactory-qa-user, applications, action/apps/Deployment/restart, aisp-agentfactory-qa/*, allow
        groups:
        - "Team.Support.CGF.NonProd.EEGenAI"
        - "Team.Support.EIAP.READ"
        - "Team.App.myCert.EIAP.KUBERNETES.SUPPORT-Platform-Cert"