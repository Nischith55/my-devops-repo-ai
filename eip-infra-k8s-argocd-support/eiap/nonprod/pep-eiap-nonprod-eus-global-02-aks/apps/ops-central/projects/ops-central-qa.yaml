    apiVersion: argoproj.io/v1alpha1
    kind: AppProject
    metadata:
      name: ops-central-qa
      namespace: argocd  
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      labels:
        argocd.argoproj.io/project-inherit: global-app
    spec:
      description: Project for ops-central-qa   
      sourceRepos:
      - https://dev.azure.com/PepsiCoIT/Service_Reliability/_git/ops-central-argocd-configs
      - pepeiapnonprodcommonacr.azurecr.io/helm
      destinations:
      - name: pep-eiap-nonprod-eus-global-02-aks
        namespace: pep-eiap-cgf-bsradius-qa
      - name: pep-eiap-nonprod-eus-global-02-aks
        namespace: pep-eiap-ops-admin
      roles:
      - name: ops-central-qa-admin
        description: Admin privileges to ops-central-qa
        policies:
        - p, proj:ops-central-qa:ops-central-qa-admin, applications, *, ops-central-qa/*, allow
        - p, proj:ops-central-qa:ops-central-qa-admin, repositories, *, ops-central-qa/*, allow
        groups:
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

      - name: ops-central-qa-user
        description: Read-only privileges to ops-central-qa
        policies:
        - p, proj:ops-central-qa:ops-central-qa-user, applications, get, ops-central-qa/*, allow
        - p, proj:ops-central-qa:ops-central-qa-user, applications, sync, ops-central-qa/*, allow
        - p, proj:ops-central-qa:ops-central-qa-user, repositories, get, ops-central-qa/*, allow
         # This line will be replaced by the pipeline script
        - p, proj:ops-central-qa:ops-central-qa-user, applications, action/apps/Deployment/restart, ops-central-qa/*, allow
        groups:
        - "Team.App.NextGenITSM"
        - "Team.Support.EIAP.READ"
    