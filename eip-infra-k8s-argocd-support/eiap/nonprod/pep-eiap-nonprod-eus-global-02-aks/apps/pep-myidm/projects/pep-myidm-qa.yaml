    apiVersion: argoproj.io/v1alpha1
    kind: AppProject
    metadata:
      name: pep-myidm-qa
      namespace: argocd  
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      labels:
        argocd.argoproj.io/project-inherit: global-app
    spec:
      description: Project for pep-myidm-qa   
      sourceRepos:
      - https://dev.azure.com/PepsiCoIT/Identity_and_Access_Management%20(IAM)/_git/pep-iamc-argocd-configs
      - pepeiapnonprodcommonacr.azurecr.io/helm
      destinations:
      - name: pep-eiap-nonprod-eus-global-02-aks
        namespace: pep-eiap-cgf-iamcentral-qa
      - name: pep-eiap-nonprod-eus-global-02-aks
        namespace: pep-eiap-ops-admin
      roles:
      - name: pep-myidm-qa-admin
        description: Admin privileges to pep-myidm-qa
        policies:
        - p, proj:pep-myidm-qa:pep-myidm-qa-admin, applications, *, pep-myidm-qa/*, allow
        - p, proj:pep-myidm-qa:pep-myidm-qa-admin, repositories, *, pep-myidm-qa/*, allow
        groups:
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

      - name: pep-myidm-qa-user
        description: Read-only privileges to pep-myidm-qa
        policies:
        - p, proj:pep-myidm-qa:pep-myidm-qa-user, applications, get, pep-myidm-qa/*, allow
        - p, proj:pep-myidm-qa:pep-myidm-qa-user, applications, sync, pep-myidm-qa/*, allow
        - p, proj:pep-myidm-qa:pep-myidm-qa-user, repositories, get, pep-myidm-qa/*, allow
         # This line will be replaced by the pipeline script
        - p, proj:pep-myidm-qa:pep-myidm-qa-user, applications, action/apps/Deployment/restart, pep-myidm-qa/*, allow
        groups:
        - "Team.Support.CGF.NonProd.iamcen"
        - "Team.Support.EIAP.READ"
    