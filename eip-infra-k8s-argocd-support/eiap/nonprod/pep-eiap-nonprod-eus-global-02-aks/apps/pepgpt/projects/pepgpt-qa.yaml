apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: pepgpt-qa
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app
spec:
  description: Project for pepgpt-qa
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/EIAP_Projects/_git/pepgpt-argocd-configs
  - pepeiapnonprodcommonacr.azurecr.io/helm
  destinations:
  - name: pep-eiap-nonprod-eus-global-02-aks
    namespace: pep-eiap-cgf-pepgptlite-qa
  - name: pep-eiap-nonprod-eus-global-02-aks
    namespace: pep-eiap-cgf-pepgptrecon-qa
  - name: pep-eiap-nonprod-eus-global-02-aks
    namespace: pep-eiap-cgf-pepgpt-qa
  - name: pep-eiap-nonprod-eus-global-02-aks
    namespace: pep-eiap-ops-admin
  roles:
  - name: pepgpt-qa-admin
    description: Admin privileges to pepgpt-qa
    policies:
    - p, proj:pepgpt-qa:pepgpt-qa-admin, applications, *, pepgpt-qa/*, allow
    - p, proj:pepgpt-qa:pepgpt-qa-admin, repositories, *, pepgpt-qa/*, allow
    groups:
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: pepgpt-qa-user
    description: Read-only privileges to pepgpt-qa
    policies:
    - p, proj:pepgpt-qa:pepgpt-qa-user, applications, get, pepgpt-qa/*, allow
    - p, proj:pepgpt-qa:pepgpt-qa-user, applications, sync, pepgpt-qa/*, allow
    - p, proj:pepgpt-qa:pepgpt-qa-user, repositories, get, pepgpt-qa/*, allow
    - p, proj:pepgpt-qa:pepgpt-qa-user, applications, action/apps/Deployment/restart, pepgpt-qa/*, allow
    groups:
    - "Team.Support.EIAP.READ"
    - "Team.App.AI.PepGpt.Admin"
    - "Team.App.EIAP.PEPCI.RG.Contributor"
