    apiVersion: argoproj.io/v1alpha1
    kind: AppProject
    metadata:
      name: pep-iam-qa
      namespace: argocd  
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      labels:
        argocd.argoproj.io/project-inherit: global-app
    spec:
      description: Project for pep-iam-qa   
      sourceRepos:
      - https://dev.azure.com/PepsiCoIT/Identity_and_Access_Management%20(IAM)/_git/pep-iam-argocd-configs
      - pepeiapnonprodcommonacr.azurecr.io/helm
      - pepeiapnonprodcommonacr.azurecr.io
      - pepeiapnonprodcommonacr.azurecr.io/helm/policy-engine 
      - pepeiapnonprodcommonacr.azurecr.io/policy-engine

      destinations:
      - name: pep-eiap-nonprod-eus-global-02-aks
        namespace: pep-eiap-cgf-iamai-qa
      - name: pep-eiap-nonprod-eus-global-02-aks
        namespace: pep-eiap-ops-admin
      roles:
      - name: pep-iam-qa-admin
        description: Admin privileges to pep-iam-qa
        policies:
        - p, proj:pep-iam-qa:pep-iam-qa-admin, applications, *, pep-iam-qa/*, allow
        - p, proj:pep-iam-qa:pep-iam-qa-admin, repositories, *, pep-iam-qa/*, allow
        groups:
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

      - name: pep-iam-qa-user
        description: Read-only privileges to pep-iam-qa
        policies:
        - p, proj:pep-iam-qa:pep-iam-qa-user, applications, get, pep-iam-qa/*, allow
        - p, proj:pep-iam-qa:pep-iam-qa-user, applications, sync, pep-iam-qa/*, allow
        - p, proj:pep-iam-qa:pep-iam-qa-user, repositories, get, pep-iam-qa/*, allow
         # This line will be replaced by the pipeline script
        - p, proj:pep-iam-qa:pep-iam-qa-user, applications, action/apps/Deployment/restart, pep-iam-qa/*, allow
        groups:
        - "Team.App.FPA.CKPGPT.DEV.Developer"
        - "Team.Support.EIAP.READ"
        - "Team.Support.CGF.NonProd.iamcen"
    