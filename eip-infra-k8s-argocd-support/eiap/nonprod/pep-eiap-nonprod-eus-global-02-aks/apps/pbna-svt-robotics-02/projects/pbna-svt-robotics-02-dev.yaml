    apiVersion: argoproj.io/v1alpha1
    kind: AppProject
    metadata:
      name: pbna-svt-robotics-02-dev
      namespace: argocd  
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      labels:
        argocd.argoproj.io/project-inherit: global-app
    spec:
      description: Project for pbna-svt-robotics-02-dev   
      sourceRepos:
      - https://dev.azure.com/PepsiCoIT/PBNA_Automated_Case_Picking_ACP/_git/PBNA-SVT-ROBOTICS-argocd-configs
      - pepeiapnonprodcommonacr.azurecr.io/helm
      destinations:
      - name: pep-eiap-nonprod-eus-global-02-aks
        namespace: pep-eiap-pbna-acpgrime-dev
      - name: pep-eiap-nonprod-eus-global-02-aks
        namespace: pep-eiap-ops-admin
      roles:
      - name: pbna-svt-robotics-02-dev-admin
        description: Admin privileges to pbna-svt-robotics-02-dev
        policies:
        - p, proj:pbna-svt-robotics-02-dev:pbna-svt-robotics-02-dev-admin, applications, *, pbna-svt-robotics-02-dev/*, allow
        - p, proj:pbna-svt-robotics-02-dev:pbna-svt-robotics-02-dev-admin, repositories, *, pbna-svt-robotics-02-dev/*, allow
        groups:
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

      - name: pbna-svt-robotics-02-dev-user
        description: Read-only privileges to pbna-svt-robotics-02-dev
        policies:
        - p, proj:pbna-svt-robotics-02-dev:pbna-svt-robotics-02-dev-user, applications, get, pbna-svt-robotics-02-dev/*, allow
        - p, proj:pbna-svt-robotics-02-dev:pbna-svt-robotics-02-dev-user, applications, sync, pbna-svt-robotics-02-dev/*, allow
        - p, proj:pbna-svt-robotics-02-dev:pbna-svt-robotics-02-dev-user, repositories, get, pbna-svt-robotics-02-dev/*, allow
         # This line will be replaced by the pipeline script
        - p, proj:pbna-svt-robotics-02-dev:pbna-svt-robotics-02-dev-user, applications, action/apps/Deployment/restart, pbna-svt-robotics-02-dev/*, allow
        groups:
        - "Team.App.SVTRobotics.Developers"
        - "Team.Support.EIAP.READ"
    