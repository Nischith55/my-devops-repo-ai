        - p, proj:pep-flna-whse-assistant-qa:pep-flna-whse-assistant-qa-user, applications, sync, pep-flna-whse-assistant-qa/*, allow
        - p, proj:pep-flna-whse-assistant-qa:pep-flna-whse-assistant-qa-user, repositories, get, pep-flna-whse-assistant-qa/*, allow
         # This line will be replaced by the pipeline script
        - p, proj:pep-flna-whse-assistant-qa:pep-flna-whse-assistant-qa-user, applications, action/apps/Deployment/restart, pep-flna-whse-assistant-qa/*, allow
        groups:
        - "Team.App.FLNA.NonProd.WHSECC"
        - "Team.Support.EIAP.READ"
    