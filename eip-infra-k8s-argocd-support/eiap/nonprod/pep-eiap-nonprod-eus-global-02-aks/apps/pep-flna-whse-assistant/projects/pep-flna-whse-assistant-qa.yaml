        - resources-finalizer.argocd.argoproj.io
      labels:
        argocd.argoproj.io/project-inherit: global-app
    spec:
      description: Project for pep-flna-whse-assistant-qa   
      sourceRepos:
      - https://dev.azure.com/PepsiCoIT/FLNA_PWM/_git/pep-flna-whse-ai-argocd-configs
      - pepeiapnonprodcommonacr.azurecr.io/helm
      destinations:
      - name: pep-eiap-nonprod-eus-global-02-aks
