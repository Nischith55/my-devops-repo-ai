apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: pbna-supplychain-qa
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Project for pbna-supplychain-qa   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/PBNA_Data_Analytics_and_Digital_Solutions/_git/pbna-supplychain-argocd-configs
  - pepeiapnonprodcommonacr.azurecr.io/helm
  destinations:
  - name: pep-eiap-nonprod-eus-global-02-aks
    namespace: pep-eiap-pbna-sckm2-qa
  - name: pep-eiap-nonprod-eus-global-02-aks
    namespace: pep-eiap-ops-admin
  roles:
  - name: pbna-supplychain-qa-admin
    description: Admin privileges to pbna-supplychain-qa
    policies:
    - p, proj:pbna-supplychain-qa:pbna-supplychain-qa-admin, applications, *, pbna-supplychain-qa/*, allow
    - p, proj:pbna-supplychain-qa:pbna-supplychain-qa-admin, repositories, *, pbna-supplychain-qa/*, allow
    groups:
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: pbna-supplychain-qa-user
    description: Read-only privileges to pbna-supplychain-qa
    policies:
    - p, proj:pbna-supplychain-qa:pbna-supplychain-qa-user, applications, get, pbna-supplychain-qa/*, allow
    - p, proj:pbna-supplychain-qa:pbna-supplychain-qa-user, applications, sync, pbna-supplychain-qa/*, allow
    - p, proj:pbna-supplychain-qa:pbna-supplychain-qa-user, repositories, get, pbna-supplychain-qa/*, allow
    - p, proj:pbna-supplychain-qa:pbna-supplychain-qa-user, applications, action/apps/Deployment/restart, pbna-supplychain-qa/*, allow
    groups:
    - "Team.Support.PBNA.NonProd.PBNASCKM"
    - "Team.Support.EIAP.READ"