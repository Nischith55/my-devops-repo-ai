    apiVersion: argoproj.io/v1alpha1
    kind: AppProject
    metadata:
      name: askea-genai-eiap-02-dev
      namespace: argocd  
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      labels:
        argocd.argoproj.io/project-inherit: global-app
    spec:
      description: Project for askea-genai-eiap-02-dev   
      sourceRepos:
      - https://dev.azure.com/PepsiCoIT/EIAP_Projects/_git/askea-genai-argocd-configs
      - pepeiapnonprodcommonacr.azurecr.io/helm
      destinations:
      - name: pep-eiap-nonprod-eus-global-02-aks
        namespace: pep-eiap-cgf-askeadig-dev
      - name: pep-eiap-nonprod-eus-global-02-aks
        namespace: pep-eiap-ops-admin
      roles:
      - name: askea-genai-eiap-02-dev-admin
        description: Admin privileges to askea-genai-eiap-02-dev
        policies:
        - p, proj:askea-genai-eiap-02-dev:askea-genai-eiap-02-dev-admin, applications, *, askea-genai-eiap-02-dev/*, allow
        - p, proj:askea-genai-eiap-02-dev:askea-genai-eiap-02-dev-admin, repositories, *, askea-genai-eiap-02-dev/*, allow
        groups:
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
        - "hpedapro@pepsico.com"

      - name: askea-genai-eiap-02-dev-user
        description: Read-only privileges to askea-genai-eiap-02-dev
        policies:
        - p, proj:askea-genai-eiap-02-dev:askea-genai-eiap-02-dev-user, applications, get, askea-genai-eiap-02-dev/*, allow
        - p, proj:askea-genai-eiap-02-dev:askea-genai-eiap-02-dev-user, applications, sync, askea-genai-eiap-02-dev/*, allow
        - p, proj:askea-genai-eiap-02-dev:askea-genai-eiap-02-dev-user, repositories, get, askea-genai-eiap-02-dev/*, allow
         # This line will be replaced by the pipeline script
        - p, proj:askea-genai-eiap-02-dev:askea-genai-eiap-02-dev-user, applications, action/apps/Deployment/restart, askea-genai-eiap-02-dev/*, allow
        groups:
        - "Team.Support.DPS.NonProd.AzureSub.Admin"
        - "Team.Support.EIAP.READ"
        - "hpedapro@pepsico.com"
    