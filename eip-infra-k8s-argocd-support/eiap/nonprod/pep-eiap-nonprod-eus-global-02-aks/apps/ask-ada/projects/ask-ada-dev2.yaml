    apiVersion: argoproj.io/v1alpha1
    kind: AppProject
    metadata:
      name: ask-ada-stage
      namespace: argocd  
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      labels:
        argocd.argoproj.io/project-inherit: global-app
    spec:
      description: Project for ask-ada-stage  
      sourceRepos:
      - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/ask-ada-argocd-configs
      - pepeiapnonprodcommonacr.azurecr.io/helm
      destinations:
      - name: pep-eiap-nonprod-eus-global-02-aks
        namespace: pep-eiap-cgf-askadaa-dev
      - name: pep-eiap-nonprod-eus-global-02-aks
        namespace: pep-eiap-ops-admin
      roles:
      - name: ask-ada-stage-admin
        description: Admin privileges to ask-ada-stage
        policies:
        - p, proj:ask-ada-stage:ask-ada-stage-admin, applications, *, ask-ada-stage/*, allow
        - p, proj:ask-ada-stage:ask-ada-stage-admin, repositories, *, ask-ada-stage/*, allow
        groups:
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
        - "hpedapro@pepsico.com"

      - name: ask-ada-stage-user
        description: Read-only privileges to ask-ada-stage
        policies:
        - p, proj:ask-ada-stage:ask-ada-stage-user, applications, get, ask-ada-stage/*, allow
        - p, proj:ask-ada-stage:ask-ada-stage-user, applications, sync, ask-ada-stage/*, allow
        - p, proj:ask-ada-stage:ask-ada-stage-user, repositories, get, ask-ada-stage/*, allow
         # This line will be replaced by the pipeline script
        - p, proj:ask-ada-stage:ask-ada-stage-user, applications, action/apps/Deployment/restart, ask-ada-stage/*, allow
        groups:
        - "Team.App.CGF.NonProd.AskADAA"
        - "Team.Support.EIAP.READ"
        - "hpedapro@pepsico.com"
    