    apiVersion: argoproj.io/v1alpha1
    kind: AppProject
    metadata:
      name: ansible-awx-qa
      namespace: argocd  
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      labels:
        argocd.argoproj.io/project-inherit: global-platform
    spec:
      description: Project for ansible-awx-qa   
      sourceRepos:
      - https://dev.azure.com/PepsiCoIT/Ansible_AWX/_git/ansible-awx-argocd-configs
      - pepeiapnonprodcommonacr.azurecr.io/helm
      - pepinfratoolsnonprodcommonacr.azurecr.io
      - pepinfratoolsnonprodcommonacr.azurecr.io/ansible-awx
      destinations:
      - name: pep-eiap-nonprod-eus-global-02-aks
        namespace: pep-eiap-pbna-awxtest-qa
      - name: pep-eiap-nonprod-eus-global-02-aks
        namespace: pep-eiap-ops-admin
      roles:
      - name: ansible-awx-qa-admin
        description: Admin privileges to ansible-awx-qa
        policies:
        - p, proj:ansible-awx-qa:ansible-awx-qa-admin, applications, *, ansible-awx-qa/*, allow
        - p, proj:ansible-awx-qa:ansible-awx-qa-admin, repositories, *, ansible-awx-qa/*, allow
        groups:
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

      - name: ansible-awx-qa-user
        description: Read-only privileges to ansible-awx-qa
        policies:
        - p, proj:ansible-awx-qa:ansible-awx-qa-user, applications, get, ansible-awx-qa/*, allow
        - p, proj:ansible-awx-qa:ansible-awx-qa-user, applications, sync, ansible-awx-qa/*, allow
        - p, proj:ansible-awx-qa:ansible-awx-qa-user, repositories, get, ansible-awx-qa/*, allow
         # This line will be replaced by the pipeline script
        - p, proj:ansible-awx-qa:ansible-awx-qa-user, applications, action/apps/Deployment/restart, ansible-awx-qa/*, allow
        groups:
        - "Team.Support.HyperAutomation.AnsibleAWX"
        - "Team.Support.EIAP.READ"
    