    apiVersion: argoproj.io/v1alpha1
    kind: AppProject
    metadata:
      name: should-cost-beta-qa
      namespace: argocd  
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      labels:
        argocd.argoproj.io/project-inherit: global-app
    spec:
      description: Project for should-cost-beta-qa   
      sourceRepos:
      - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/should-cost-argocd-configs
      - pepeiapnonprodcommonacr.azurecr.io/helm
      destinations:
      - name: pep-eiap-nonprod-eus-global-02-aks
        namespace: pep-eiap-cgf-shcomo-qa
      - name: pep-eiap-nonprod-eus-global-02-aks
        namespace: pep-eiap-ops-admin
      roles:
      - name: should-cost-beta-qa-admin
        description: Admin privileges to should-cost-beta-qa
        policies:
        - p, proj:should-cost-beta-qa:should-cost-beta-qa-admin, applications, *, should-cost-beta-qa/*, allow
        - p, proj:should-cost-beta-qa:should-cost-beta-qa-admin, repositories, *, should-cost-beta-qa/*, allow
        groups:
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

      - name: should-cost-beta-qa-user
        description: Read-only privileges to should-cost-beta-qa
        policies:
        - p, proj:should-cost-beta-qa:should-cost-beta-qa-user, applications, get, should-cost-beta-qa/*, allow
        - p, proj:should-cost-beta-qa:should-cost-beta-qa-user, applications, sync, should-cost-beta-qa/*, allow
        - p, proj:should-cost-beta-qa:should-cost-beta-qa-user, repositories, get, should-cost-beta-qa/*, allow
         # This line will be replaced by the pipeline script
        - p, proj:should-cost-beta-qa:should-cost-beta-qa-user, applications, action/apps/Deployment/restart, should-cost-beta-qa/*, allow
        groups:
        - "Team.Support.CGF.NonProd.SHCOMO"
        - "Team.Support.EIAP.READ"
    