    apiVersion: argoproj.io/v1alpha1
    kind: AppProject
    metadata:
      name: r2p-qa
      namespace: argocd  
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      labels:
        argocd.argoproj.io/project-inherit: global-app
    spec:
      description: Project for r2p-qa   
      sourceRepos:
      - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/r2p-argocd-configs
      - pepeiapnonprodcommonacr.azurecr.io/helm
      destinations:
      - name: pep-eiap-nonprod-eus-global-02-aks
        namespace: pep-eiap-cgf-cataiagent-qa
      - name: pep-eiap-nonprod-eus-global-02-aks
        namespace: pep-eiap-ops-admin
      roles:
      - name: r2p-qa-admin
        description: Admin privileges to r2p-qa
        policies:
        - p, proj:r2p-qa:r2p-qa-admin, applications, *, r2p-qa/*, allow
        - p, proj:r2p-qa:r2p-qa-admin, repositories, *, r2p-qa/*, allow
        groups:
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

      - name: r2p-qa-user
        description: Read-only privileges to r2p-qa
        policies:
        - p, proj:r2p-qa:r2p-qa-user, applications, get, r2p-qa/*, allow
        - p, proj:r2p-qa:r2p-qa-user, applications, sync, r2p-qa/*, allow
        - p, proj:r2p-qa:r2p-qa-user, repositories, get, r2p-qa/*, allow
         # This line will be replaced by the pipeline script
        - p, proj:r2p-qa:r2p-qa-user, applications, action/apps/Deployment/restart, r2p-qa/*, allow
        groups:
        - "Team.Support.AZURE.CGF.NONPROD.CATAIAGENT1"
        - "Team.Support.EIAP.READ"
    