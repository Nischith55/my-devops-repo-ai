    apiVersion: argoproj.io/v1alpha1
    kind: AppProject
    metadata:
      name: gatoradedid-qa
      namespace: argocd  
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      labels:
        argocd.argoproj.io/project-inherit: global-app
    spec:
      description: Project for gatoradedid-qa   
      sourceRepos:
      - https://dev.azure.com/PepsiCoIT/EIAP_Projects/_git/gatoradedid-argocd-configs
      - pepeiapnonprodcommonacr.azurecr.io/helm
      destinations:
      - name: pep-eiap-nonprod-eus-global-02-aks
        namespace: pep-eiap-latam-gatdidqa-qa
      - name: pep-eiap-nonprod-eus-global-02-aks
        namespace: pep-eiap-ops-admin
      roles:
      - name: gatoradedid-qa-admin
        description: Admin privileges to gatoradedid-qa
        policies:
        - p, proj:gatoradedid-qa:gatoradedid-qa-admin, applications, *, gatoradedid-qa/*, allow
        - p, proj:gatoradedid-qa:gatoradedid-qa-admin, repositories, *, gatoradedid-qa/*, allow
        groups:
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

      - name: gatoradedid-qa-user
        description: Read-only privileges to gatoradedid-qa
        policies:
        - p, proj:gatoradedid-qa:gatoradedid-qa-user, applications, get, gatoradedid-qa/*, allow
        - p, proj:gatoradedid-qa:gatoradedid-qa-user, applications, sync, gatoradedid-qa/*, allow
        - p, proj:gatoradedid-qa:gatoradedid-qa-user, repositories, get, gatoradedid-qa/*, allow
         # This line will be replaced by the pipeline script
        - p, proj:gatoradedid-qa:gatoradedid-qa-user, applications, action/apps/Deployment/restart, gatoradedid-qa/*, allow
        groups:
        - "Team.Support.LATAM.NonProd.DIDGENAI"
        - "Team.Support.EIAP.READ"
    