    apiVersion: argoproj.io/v1alpha1
    kind: AppProject
    metadata:
      name: gatoradedid-dev
      namespace: argocd  
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      labels:
        argocd.argoproj.io/project-inherit: global-app
    spec:
      description: Project for gatoradedid-dev   
      sourceRepos:
      - https://dev.azure.com/PepsiCoIT/EIAP_Projects/_git/gatoradedid-argocd-configs
      - pepeiapnonprodcommonacr.azurecr.io/helm
      destinations:
      - name: pep-eiap-nonprod-eus-global-02-aks
        namespace: pep-eiap-latam-didgenai-dev
      - name: pep-eiap-nonprod-eus-global-02-aks
        namespace: pep-eiap-ops-admin
      roles:
      - name: gatoradedid-dev-admin
        description: Admin privileges to gatoradedid-dev
        policies:
        - p, proj:gatoradedid-dev:gatoradedid-dev-admin, applications, *, gatoradedid-dev/*, allow
        - p, proj:gatoradedid-dev:gatoradedid-dev-admin, repositories, *, gatoradedid-dev/*, allow
        groups:
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

      - name: gatoradedid-dev-user
        description: Read-only privileges to gatoradedid-dev
        policies:
        - p, proj:gatoradedid-dev:gatoradedid-dev-user, applications, get, gatoradedid-dev/*, allow
        - p, proj:gatoradedid-dev:gatoradedid-dev-user, applications, sync, gatoradedid-dev/*, allow
        - p, proj:gatoradedid-dev:gatoradedid-dev-user, repositories, get, gatoradedid-dev/*, allow
         # This line will be replaced by the pipeline script
        - p, proj:gatoradedid-dev:gatoradedid-dev-user, applications, action/apps/Deployment/restart, gatoradedid-dev/*, allow
        groups:
        - "Team.Support.LATAM.NonProd.DIDGENAI"
        - "Team.Support.EIAP.READ"
    