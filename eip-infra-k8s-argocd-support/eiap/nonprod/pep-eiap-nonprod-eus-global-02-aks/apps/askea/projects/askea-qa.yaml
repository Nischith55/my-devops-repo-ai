    apiVersion: argoproj.io/v1alpha1
    kind: AppProject
    metadata:
      name: askea-qa
      namespace: argocd  
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      labels:
        argocd.argoproj.io/project-inherit: global-app
    spec:
      description: Project for askea-qa   
      sourceRepos:
      - https://dev.azure.com/PepsiCoIT/EIAP_Projects/_git/askea-genai-argocd-configs
      - pepeiapnonprodcommonacr.azurecr.io/helm
      destinations:
      - name: pep-eiap-nonprod-eus-global-02-aks
        namespace: pep-eiap-cgf-askeadig-qa
      - name: pep-eiap-nonprod-eus-global-02-aks
        namespace: pep-eiap-ops-admin
      roles:
      - name: askea-qa-admin
        description: Admin privileges to askea-qa
        policies:
        - p, proj:askea-qa:askea-qa-admin, applications, *, askea-qa/*, allow
        - p, proj:askea-qa:askea-qa-admin, repositories, *, askea-qa/*, allow
        groups:
        - "Team.Support.DPS.NonProd.AzureSub.Admin"
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

      - name: askea-qa-user
        description: Read-only privileges to askea-qa
        policies:
        - p, proj:askea-qa:askea-qa-user, applications, get, askea-qa/*, allow
        - p, proj:askea-qa:askea-qa-user, applications, sync, askea-qa/*, allow
        - p, proj:askea-qa:askea-qa-user, repositories, get, askea-qa/*, allow
         # This line will be replaced by the pipeline script
        - p, proj:askea-qa:askea-qa-user, applications, action/apps/Deployment/restart, askea-qa/*, allow
        groups:
        - "Team.Support.DPS.NonProd.AzureSub.Admin"
        - "Team.Support.EIAP.READ"
    