    apiVersion: argoproj.io/v1alpha1
    kind: AppProject
    metadata:
      name: rgm-gah-wo-dev
      namespace: argocd  
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      labels:
        argocd.argoproj.io/project-inherit: global-app
    spec:
      description: Project for rgm-gah-wo-dev   
      sourceRepos:
      - https://dev.azure.com/PepsiCoIT/GNRM_Analytics_Hub/_git/rgm-gah-wo-dwd-argocd-configs
      - pepeiapnonprodcommonacr.azurecr.io/helm
      destinations:
      - name: pep-eiap-nonprod-eus-global-02-aks
        namespace: pep-eiap-cgf-rgmgah-dev
      - name: pep-eiap-nonprod-eus-global-02-aks
        namespace: pep-eiap-ops-admin
      roles:
      - name: rgm-gah-wo-dev-admin
        description: Admin privileges to rgm-gah-wo-dev
        policies:
        - p, proj:rgm-gah-wo-dev:rgm-gah-wo-dev-admin, applications, *, rgm-gah-wo-dev/*, allow
        - p, proj:rgm-gah-wo-dev:rgm-gah-wo-dev-admin, repositories, *, rgm-gah-wo-dev/*, allow
        groups:
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

      - name: rgm-gah-wo-dev-user
        description: Read-only privileges to rgm-gah-wo-dev
        policies:
        - p, proj:rgm-gah-wo-dev:rgm-gah-wo-dev-user, applications, get, rgm-gah-wo-dev/*, allow
        - p, proj:rgm-gah-wo-dev:rgm-gah-wo-dev-user, applications, sync, rgm-gah-wo-dev/*, allow
        - p, proj:rgm-gah-wo-dev:rgm-gah-wo-dev-user, repositories, get, rgm-gah-wo-dev/*, allow
         # This line will be replaced by the pipeline script
        - p, proj:rgm-gah-wo-dev:rgm-gah-wo-dev-user, applications, action/apps/Deployment/restart, rgm-gah-wo-dev/*, allow
        groups:
        - "Team.App.RGMAIforBI.Admins"
        - "Team.Support.EIAP.READ"
    