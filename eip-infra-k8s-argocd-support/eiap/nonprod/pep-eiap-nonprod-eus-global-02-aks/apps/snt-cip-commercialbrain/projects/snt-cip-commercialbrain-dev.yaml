apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: snt-cip-commercialbrain-dev
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Project for snt-cip-commercialbrain-dev 
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT2/Global_SnT_DAI_Precision_Engineering_Plugin/_git/snt-cip-commercialbrain-argocd-configs
  - pepeiapnonprodcommonacr.azurecr.io/helm 
  destinations:
  - name: pep-eiap-nonprod-eus-global-02-aks
    namespace: pep-eiap-cgf-combrain-dev
  - name: pep-eiap-nonprod-eus-global-02-aks
    namespace: pep-eiap-ops-admin
  roles:
  - name: snt-cip-commercialbrain-dev-admin
    description: Admin privileges to snt-cip-commercialbrain-dev
    policies:
    - p, proj:snt-cip-commercialbrain-dev:snt-cip-commercialbrain-dev-admin, applications, *, snt-cip-commercialbrain-dev/*, allow
    - p, proj:snt-cip-commercialbrain-dev:snt-cip-commercialbrain-dev-admin, repositories, *, snt-cip-commercialbrain-dev/*, allow
    groups:
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
  - name: snt-cip-commercialbrain-dev-user
    description: Read-only privileges to snt-cip-commercialbrain-dev
    policies:
    - p, proj:snt-cip-commercialbrain-dev:snt-cip-commercialbrain-dev-user, applications, get, snt-cip-commercialbrain-dev/*, allow
    - p, proj:snt-cip-commercialbrain-dev:snt-cip-commercialbrain-dev-user, applications, sync, snt-cip-commercialbrain-dev/*, allow
    - p, proj:snt-cip-commercialbrain-dev:snt-cip-commercialbrain-dev-user, repositories, get, snt-cip-commercialbrain-dev/*, allow
    - p, proj:snt-cip-commercialbrain-dev:snt-cip-commercialbrain-dev-user, *, delete, *, deny
    groups:
    - "Team.Support.CGF.NonProd.combrain"
    - "Team.Support.EIAP.READ"