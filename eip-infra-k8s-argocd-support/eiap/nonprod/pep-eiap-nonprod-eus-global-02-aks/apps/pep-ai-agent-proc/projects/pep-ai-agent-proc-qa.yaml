    apiVersion: argoproj.io/v1alpha1
    kind: AppProject
    metadata:
      name: pep-ai-agent-proc-qa
      namespace: argocd  
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      labels:
        argocd.argoproj.io/project-inherit: global-app
    spec:
      description: Project for pep-ai-agent-proc-qa   
      sourceRepos:
      - https://dev.azure.com/PepsiCoIT/EIAP_Projects/_git/pep-ai-agent-proc-argocd-configs
      - pepeiapnonprodcommonacr.azurecr.io/helm
      destinations:
      - name: pep-eiap-nonprod-eus-global-02-aks
        namespace: pep-eiap-cgf-paagent-qa
      - name: pep-eiap-nonprod-eus-global-02-aks
        namespace: pep-eiap-ops-admin
      roles:
      - name: pep-ai-agent-proc-qa-admin
        description: Admin privileges to pep-ai-agent-proc-qa
        policies:
        - p, proj:pep-ai-agent-proc-qa:pep-ai-agent-proc-qa-admin, applications, *, pep-ai-agent-proc-qa/*, allow
        - p, proj:pep-ai-agent-proc-qa:pep-ai-agent-proc-qa-admin, repositories, *, pep-ai-agent-proc-qa/*, allow
        groups:
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

      - name: pep-ai-agent-proc-qa-user
        description: Read-only privileges to pep-ai-agent-proc-qa
        policies:
        - p, proj:pep-ai-agent-proc-qa:pep-ai-agent-proc-qa-user, applications, get, pep-ai-agent-proc-qa/*, allow
        - p, proj:pep-ai-agent-proc-qa:pep-ai-agent-proc-qa-user, applications, sync, pep-ai-agent-proc-qa/*, allow
        - p, proj:pep-ai-agent-proc-qa:pep-ai-agent-proc-qa-user, repositories, get, pep-ai-agent-proc-qa/*, allow
         # This line will be replaced by the pipeline script
        - p, proj:pep-ai-agent-proc-qa:pep-ai-agent-proc-qa-user, applications, action/apps/Deployment/restart, pep-ai-agent-proc-qa/*, allow
        groups:
        - "Team.Support.CGF.NonProd.PAagent"
        - "Team.Support.EIAP.READ"
    