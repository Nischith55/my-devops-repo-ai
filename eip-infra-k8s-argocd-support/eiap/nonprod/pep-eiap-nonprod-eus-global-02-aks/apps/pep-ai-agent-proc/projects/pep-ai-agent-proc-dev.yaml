    apiVersion: argoproj.io/v1alpha1
    kind: AppProject
    metadata:
      name: pep-ai-agent-proc-dev
      namespace: argocd  
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      labels:
        argocd.argoproj.io/project-inherit: global-app
    spec:
      description: Project for pep-ai-agent-proc-dev   
      sourceRepos:
      - https://dev.azure.com/PepsiCoIT/EIAP_Projects/_git/pep-ai-agent-proc-argocd-configs
      - pepeiapnonprodcommonacr.azurecr.io/helm
      destinations:
      - name: pep-eiap-nonprod-eus-global-02-aks
        namespace: pep-eiap-cgf-shrdagntai-dev
      - name: pep-eiap-nonprod-eus-global-02-aks
        namespace: pep-eiap-ops-admin
      roles:
      - name: pep-ai-agent-proc-dev-admin
        description: Admin privileges to pep-ai-agent-proc-dev
        policies:
        - p, proj:pep-ai-agent-proc-dev:pep-ai-agent-proc-dev-admin, applications, *, pep-ai-agent-proc-dev/*, allow
        - p, proj:pep-ai-agent-proc-dev:pep-ai-agent-proc-dev-admin, repositories, *, pep-ai-agent-proc-dev/*, allow
        groups:
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

      - name: pep-ai-agent-proc-dev-user
        description: Read-only privileges to pep-ai-agent-proc-dev
        policies:
        - p, proj:pep-ai-agent-proc-dev:pep-ai-agent-proc-dev-user, applications, get, pep-ai-agent-proc-dev/*, allow
        - p, proj:pep-ai-agent-proc-dev:pep-ai-agent-proc-dev-user, applications, sync, pep-ai-agent-proc-dev/*, allow
        - p, proj:pep-ai-agent-proc-dev:pep-ai-agent-proc-dev-user, repositories, get, pep-ai-agent-proc-dev/*, allow
         # This line will be replaced by the pipeline script
        - p, proj:pep-ai-agent-proc-dev:pep-ai-agent-proc-dev-user, applications, action/apps/Deployment/restart, pep-ai-agent-proc-dev/*, allow
        groups:
        - "Team.App.Snowcontrols.auditors"
        - "Team.Support.EIAP.READ"
    