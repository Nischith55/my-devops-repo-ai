    apiVersion: argoproj.io/v1alpha1
    kind: AppProject
    metadata:
      name: pepgenx-sit
      namespace: argocd  
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      labels:
        argocd.argoproj.io/project-inherit: global-app
    spec:
      description: Project for pepgenx-sit   
      sourceRepos:
      - https://dev.azure.com/PepsiCoIT/CTO_PEPGENX_PLATFORM/_git/pep-asip-pepgenx-argocd-configs
      - pepeiapnonprodcommonacr.azurecr.io/helm
      destinations:
      - name: pep-eiap-nonprod-eus-global-02-aks
        namespace: pep-eiap-cgf-pepgenxsit-qa
      - name: pep-eiap-nonprod-eus-global-02-aks
        namespace: pep-eiap-ops-admin
      roles:
      - name: pepgenx-sit-admin
        description: Admin privileges to pepgenx-sit
        policies:
        - p, proj:pepgenx-sit:pepgenx-sit-admin, applications, *, pepgenx-sit/*, allow
        - p, proj:pepgenx-sit:pepgenx-sit-admin, repositories, *, pepgenx-sit/*, allow
        groups:
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

      - name: pepgenx-sit-user
        description: Read-only privileges to pepgenx-sit
        policies:
        - p, proj:pepgenx-sit:pepgenx-sit-user, applications, get, pepgenx-sit/*, allow
        - p, proj:pepgenx-sit:pepgenx-sit-user, applications, sync, pepgenx-sit/*, allow
        - p, proj:pepgenx-sit:pepgenx-sit-user, repositories, get, pepgenx-sit/*, allow
         # This line will be replaced by the pipeline script
        - p, proj:pepgenx-sit:pepgenx-sit-user, applications, action/apps/Deployment/restart, pepgenx-sit/*, allow
        groups:
        - "Team.Support.CGF.NonProd.EEGenAI"
        - "Team.Support.EIAP.READ"
    