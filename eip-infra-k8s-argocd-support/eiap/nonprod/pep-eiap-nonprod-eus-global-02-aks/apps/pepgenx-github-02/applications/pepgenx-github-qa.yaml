apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pepgenx-github-02-qa-bootstrapper
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: argocd
  destination:
    namespace: argocd    
    server: https://kubernetes.default.svc
  syncPolicy:    
    automated:
      prune: false
      selfHeal: true
  sources:
  - ref: values
    repoURL: https://github.com/PepsiCo-AISP/dai-aisp-pepgenx-argocd-configs
    targetRevision: develop
  - repoURL: pepeiapprodcommonacr.azurecr.io/helm
    targetRevision: 0.2.8
    chart: argocd-app-bootstrapper
    helm:
      releaseName: pepgenx-github-02-qa
      valueFiles:
      - $values/qa/pep-eiap-nonprod-eus-global-02-aks/argocd-app-configs.yaml    
      values: |
        global:
          env: qa
          helm:  
            enabled: false       
            repo: pepeiapprodcommonacr.azurecr.io/helm
            chart: umbrellachart
            revision: 2.2.4-gamma
            values: 
              platform-chart:
                destination: 
                  jobImage: pepeiapprodcommonacr.azurecr.io/pep/eip/infra/azurepipeline/devopsagent:20240222.1
                  jobNS: pep-eiap-ops-admin
                  jobServiceAccount: gw-update-sa
          spec:
            project: 'pepgenx-github-02-qa' 
            source: 
              repoURL: https://github.com/PepsiCo-AISP/dai-aisp-pepgenx-argocd-configs
              repoName: dai-aisp-pepgenx-argocd-configs
              targetRevision: develop
              manifest: helm-values.yaml
            sync:
              prune: false 
            notifications:  
              teamsChannel: argo-notifications