    apiVersion: argoproj.io/v1alpha1
    kind: AppProject
    metadata:
      name: amesa-apac-qa
      namespace: argocd  
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      labels:
        argocd.argoproj.io/project-inherit: global-app
    spec:
      description: Project for amesa-apac-qa   
      sourceRepos:
      - https://dev.azure.com/PepsiCoIT/AMESA_APAC_Data_Digital/_git/amesa-apac-argocd-configs
      - pepeiapnonprodcommonacr.azurecr.io/helm
      destinations:
      - name: pep-eiap-nonprod-eus-global-01-aks
        namespace: pep-eiap-amesa-ksaeinvc-qa
      - name: pep-eiap-nonprod-eus-global-01-aks
        namespace: pep-eiap-ops-admin
      roles:
      - name: amesa-apac-qa-admin
        description: Admin privileges to amesa-apac-qa
        policies:
        - p, proj:amesa-apac-qa:amesa-apac-qa-admin, applications, *, amesa-apac-qa/*, allow
        - p, proj:amesa-apac-qa:amesa-apac-qa-admin, repositories, *, amesa-apac-qa/*, allow
        groups:
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

      - name: amesa-apac-qa-user
        description: Read-only privileges to amesa-apac-qa
        policies:
        - p, proj:amesa-apac-qa:amesa-apac-qa-user, applications, get, amesa-apac-qa/*, allow
        - p, proj:amesa-apac-qa:amesa-apac-qa-user, applications, sync, amesa-apac-qa/*, allow
        - p, proj:amesa-apac-qa:amesa-apac-qa-user, repositories, get, amesa-apac-qa/*, allow
         # This line will be replaced by the pipeline script
        - p, proj:amesa-apac-qa:amesa-apac-qa-user, applications, action/apps/Deployment/restart, amesa-apac-qa/*, allow
        groups:
        - "Team.Support.Azure.ANZ.Developers"
        - "Team.Support.EIAP.READ"
    