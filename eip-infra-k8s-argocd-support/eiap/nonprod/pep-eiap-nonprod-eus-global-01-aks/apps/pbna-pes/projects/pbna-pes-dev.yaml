    apiVersion: argoproj.io/v1alpha1
    kind: AppProject
    metadata:
      name: pbna-pes-dev
      namespace: argocd  
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      labels:
        argocd.argoproj.io/project-inherit: global-app
    spec:
      description: Project for pbna-pes-dev   
      sourceRepos:
      - https://dev.azure.com/PepsiCoIT2/PBNA_PES_Request_To_Serve/_git/pbna-pes-request-to-serve-configs
      - pepeiapnonprodcommonacr.azurecr.io/helm
      destinations:
      - name: pep-eiap-nonprod-eus-global-01-aks
        namespace: pep-eiap-pbna-halo-dev
      - name: pep-eiap-nonprod-eus-global-01-aks
        namespace: pep-eiap-ops-admin
      roles:
      - name: pbna-pes-dev-admin
        description: Admin privileges to pbna-pes-dev
        policies:
        - p, proj:pbna-pes-dev:pbna-pes-dev-admin, applications, *, pbna-pes-dev/*, allow
        - p, proj:pbna-pes-dev:pbna-pes-dev-admin, repositories, *, pbna-pes-dev/*, allow
        groups:
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

      - name: pbna-pes-dev-user
        description: Read-only privileges to pbna-pes-dev
        policies:
        - p, proj:pbna-pes-dev:pbna-pes-dev-user, applications, get, pbna-pes-dev/*, allow
        - p, proj:pbna-pes-dev:pbna-pes-dev-user, applications, sync, pbna-pes-dev/*, allow
        - p, proj:pbna-pes-dev:pbna-pes-dev-user, repositories, get, pbna-pes-dev/*, allow
         # This line will be replaced by the pipeline script
        - p, proj:pbna-pes-dev:pbna-pes-dev-user, applications, action/apps/Deployment/restart, pbna-pes-dev/*, allow
        groups:
        - "Team.Support.EIAP.PBNA.HALO.Developer"
        - "Team.Support.EIAP.READ"
    