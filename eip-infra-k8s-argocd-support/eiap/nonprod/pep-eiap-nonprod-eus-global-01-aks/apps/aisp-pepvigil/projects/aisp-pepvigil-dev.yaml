apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: aisp-pepvigil-dev
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Project for aisp-pepvigil-dev   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/PEPCTODPCEEDLOPS/_git/pep-aisp-pepvigil-mlworks-argocd-configs
  - pepeiapnonprodcommonacr.azurecr.io/helm
  destinations:
  - name: pep-eiap-nonprod-eus-global-01-aks
    namespace: pep-eiap-cgf-dlops-dev
  - name: pep-eiap-nonprod-eus-global-01-aks
    namespace: pep-eiap-ops-admin
  roles:
  - name: aisp-pepvigil-dev-admin
    description: Admin privileges to aisp-pepvigil-dev
    policies:
    - p, proj:aisp-pepvigil-dev:aisp-pepvigil-dev-admin, applications, *, aisp-pepvigil-dev/*, allow
    - p, proj:aisp-pepvigil-dev:aisp-pepvigil-dev-admin, repositories, *, aisp-pepvigil-dev/*, allow
    groups:
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: aisp-pepvigil-dev-user
    description: Read-only privileges to aisp-pepvigil-dev
    policies:
    - p, proj:aisp-pepvigil-dev:aisp-pepvigil-dev-user, applications, get, aisp-pepvigil-dev/*, allow
    - p, proj:aisp-pepvigil-dev:aisp-pepvigil-dev-user, applications, sync, aisp-pepvigil-dev/*, allow
    - p, proj:aisp-pepvigil-dev:aisp-pepvigil-dev-user, repositories, get, aisp-pepvigil-dev/*, allow
    - p, proj:aisp-pepvigil-dev:aisp-pepvigil-dev-user, applications, action/apps/Deployment/restart, aisp-pepvigil-dev/*, allow
    groups:
    - "Team.support.EE.Azure.DLOPS"
    - "Team.Support.EIAP.READ"