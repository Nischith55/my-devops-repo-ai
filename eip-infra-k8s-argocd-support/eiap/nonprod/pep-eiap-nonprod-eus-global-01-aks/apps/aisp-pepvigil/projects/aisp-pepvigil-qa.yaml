    apiVersion: argoproj.io/v1alpha1
    kind: AppProject
    metadata:
      name: aisp-pepvigil-qa
      namespace: argocd  
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      labels:
        argocd.argoproj.io/project-inherit: global-app
    spec:
      description: Project for aisp-pepvigil-qa   
      sourceRepos:
      - https://dev.azure.com/PepsiCoIT/PEPCTODPCEEDLOPS/_git/pep-aisp-pepvigil-mlworks-argocd-configs
      - pepeiapnonprodcommonacr.azurecr.io/helm
      destinations:
      - name: pep-eiap-nonprod-eus-global-01-aks
        namespace: pep-eiap-cgf-eedlops-qa
      - name: pep-eiap-nonprod-eus-global-01-aks
        namespace: pep-eiap-ops-admin
      roles:
      - name: aisp-pepvigil-qa-admin
        description: Admin privileges to aisp-pepvigil-qa
        policies:
        - p, proj:aisp-pepvigil-qa:aisp-pepvigil-qa-admin, applications, *, aisp-pepvigil-qa/*, allow
        - p, proj:aisp-pepvigil-qa:aisp-pepvigil-qa-admin, repositories, *, aisp-pepvigil-qa/*, allow
        groups:
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

      - name: aisp-pepvigil-qa-user
        description: Read-only privileges to aisp-pepvigil-qa
        policies:
        - p, proj:aisp-pepvigil-qa:aisp-pepvigil-qa-user, applications, get, aisp-pepvigil-qa/*, allow
        - p, proj:aisp-pepvigil-qa:aisp-pepvigil-qa-user, applications, sync, aisp-pepvigil-qa/*, allow
        - p, proj:aisp-pepvigil-qa:aisp-pepvigil-qa-user, repositories, get, aisp-pepvigil-qa/*, allow
         # This line will be replaced by the pipeline script
        - p, proj:aisp-pepvigil-qa:aisp-pepvigil-qa-user, applications, action/apps/Deployment/restart, aisp-pepvigil-qa/*, allow
        groups:
        - "Team.support.EE.Azure.DLOPS"
        - "Team.Support.EIAP.READ"
    