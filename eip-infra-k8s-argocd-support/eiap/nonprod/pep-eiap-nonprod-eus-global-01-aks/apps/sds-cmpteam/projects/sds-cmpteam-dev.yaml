apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: sds-cmpteam-dev
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Project for sds-cmpteam-dev 
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/sds-cmpteam-argocd-configs
  - pepeiapnonprodcommonacr.azurecr.io/helm 
  destinations:
  - name: pep-eiap-nonprod-eus-global-01-aks
    namespace: pep-eiap-cgf-launchp-dev
  - name: pep-eiap-nonprod-eus-global-01-aks
    namespace: pep-eiap-ops-admin
  roles:
  - name: sds-cmpteam-dev-admin
    description: Admin privileges to sds-cmpteam-dev
    policies:
    - p, proj:sds-cmpteam-dev:sds-cmpteam-dev-admin, applications, *, sds-cmpteam-dev/*, allow
    - p, proj:sds-cmpteam-dev:sds-cmpteam-dev-admin, repositories, *, sds-cmpteam-dev/*, allow
    groups:
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
  - name: sds-cmpteam-dev-user
    description: Read-only privileges to sds-cmpteam-dev
    policies:
    - p, proj:sds-cmpteam-dev:sds-cmpteam-dev-user, applications, get, sds-cmpteam-dev/*, allow
    - p, proj:sds-cmpteam-dev:sds-cmpteam-dev-user, applications, sync, sds-cmpteam-dev/*, allow
    - p, proj:sds-cmpteam-dev:sds-cmpteam-dev-user, repositories, get, sds-cmpteam-dev/*, allow
    - p, proj:sds-cmpteam-dev:sds-cmpteam-dev-user, *, delete, *, deny
    groups:
    - "Team.Support.CGF.NonProd.devX"
    - "Team.Support.EIAP.READ"