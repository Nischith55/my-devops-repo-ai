apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: och-dev
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app
spec:
  description: Project for och-dev
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/OmniChannelEcommerceHub/_git/och-argocd-configs
  - pepeiapnonprodcommonacr.azurecr.io/helm
  destinations:
  - name: pep-eiap-nonprod-eus-global-01-aks
    namespace: pep-eiap-och-na-dev

  - name: pep-eiap-nonprod-eus-global-01-aks
    namespace: pep-eiap-ops-admin
  roles:
  - name: och-dev-admin
    description: Admin privileges to och-dev
    policies:
    - p, proj:och-dev:och-dev-admin, applications, *, och-dev/*, allow
    - p, proj:och-dev:och-dev-admin, repositories, *, och-dev/*, allow
    groups:
    - "Team.App.DPS.DevOps.NonProd"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: och-dev-user
    description: Read-only privileges to och-dev
    policies:
    - p, proj:och-dev:och-dev-user, applications, get, och-dev/*, allow
    - p, proj:och-dev:och-dev-user, applications, sync, och-dev/*, allow
    - p, proj:och-dev:och-dev-user, repositories, get, och-dev/*, allow
    - p, proj:och-dev:och-dev-user, applications, action/apps/Deployment/restart, och-dev/*, allow
    groups:
    - "Team.Support.OCH.NA.DigitalSales.Developer"
    - "Team.Support.EIAP.READ"
