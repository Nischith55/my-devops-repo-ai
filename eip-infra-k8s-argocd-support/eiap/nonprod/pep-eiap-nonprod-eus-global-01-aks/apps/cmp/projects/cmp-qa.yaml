    apiVersion: argoproj.io/v1alpha1
    kind: AppProject
    metadata:
      name: cmp-qa
      namespace: argocd  
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      labels:
        argocd.argoproj.io/project-inherit: global-app
    spec:
      description: Project for cmp-qa   
      sourceRepos:
      - https://dev.azure.com/PepsiCoIT/PepsiCo_CloudMarketPlace/_git/cmp-argocd-configs
      - pepeiapnonprodcommonacr.azurecr.io/helm
      destinations:
      - name: pep-eiap-nonprod-eus-global-01-aks
        namespace: pep-eiap-global-cmp-qa
      - name: pep-eiap-nonprod-eus-global-01-aks
        namespace: pep-eiap-cgf-devxinfr-qa
      - name: pep-eiap-nonprod-eus-global-01-aks
        namespace: pep-eiap-ops-admin
      roles:
      - name: cmp-qa-admin
        description: Admin privileges to cmp-qa
        policies:
        - p, proj:cmp-qa:cmp-qa-admin, applications, *, cmp-qa/*, allow
        - p, proj:cmp-qa:cmp-qa-admin, repositories, *, cmp-qa/*, allow
        groups:
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

      - name: cmp-qa-user
        description: Read-only privileges to cmp-qa
        policies:
        - p, proj:cmp-qa:cmp-qa-user, applications, get, cmp-qa/*, allow
        - p, proj:cmp-qa:cmp-qa-user, applications, sync, cmp-qa/*, allow
        - p, proj:cmp-qa:cmp-qa-user, repositories, get, cmp-qa/*, allow
         # This line will be replaced by the pipeline script
        - p, proj:cmp-qa:cmp-qa-user, applications, action/apps/Deployment/restart, cmp-qa/*, allow
        groups:
        - "Team.Support.EIAP.GLOBAL.CMP.Developer"
        - "Team.Support.EIAP.READ"
    