apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: iai-cv-pepiris-qa
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Project for iai-cv-pepiris-qa   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/EIAP_Projects/_git/iai-cv-pepiris-argocd-configs
  - pepeiapnonprodcommonacr.azurecr.io/helm
  destinations:
  - name: pep-eiap-nonprod-eus-global-01-aks
    namespace: pep-eiap-cgf-iaicv-qa
  - name: pep-eiap-nonprod-eus-global-01-aks
    namespace: pep-eiap-ops-admin
  roles:
  - name: iai-cv-pepiris-qa-admin
    description: Admin privileges to iai-cv-pepiris-qa
    policies:
    - p, proj:iai-cv-pepiris-qa:iai-cv-pepiris-qa-admin, applications, *, iai-cv-pepiris-qa/*, allow
    - p, proj:iai-cv-pepiris-qa:iai-cv-pepiris-qa-admin, repositories, *, iai-cv-pepiris-qa/*, allow
    groups:
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: iai-cv-pepiris-qa-user
    description: Read-only privileges to iai-cv-pepiris-qa
    policies:
    - p, proj:iai-cv-pepiris-qa:iai-cv-pepiris-qa-user, applications, get, iai-cv-pepiris-qa/*, allow
    - p, proj:iai-cv-pepiris-qa:iai-cv-pepiris-qa-user, applications, sync, iai-cv-pepiris-qa/*, allow
    - p, proj:iai-cv-pepiris-qa:iai-cv-pepiris-qa-user, repositories, get, iai-cv-pepiris-qa/*, allow
    groups:
    - "Team.Support.IACOE.MLOPS.NPRDCNTB"
    - "Team.Support.EIAP.READ"