    apiVersion: argoproj.io/v1alpha1
    kind: AppProject
    metadata:
      name: potato-sourcing-qa
      namespace: argocd  
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      labels:
        argocd.argoproj.io/project-inherit: global-app
    spec:
      description: Project for potato-sourcing-qa   
      sourceRepos:
      - https://dev.azure.com/PepsiCoIT/Potato_Sourcing_Matrix_automation_PSMa/_git/potato-sourcing-argocd-configs
      - pepeiapnonprodcommonacr.azurecr.io/helm
      destinations:
      - name: pep-eiap-nonprod-eus-global-01-aks
        namespace: pep-eiap-cgf-psm-qa
      - name: pep-eiap-nonprod-eus-global-01-aks
        namespace: pep-eiap-ops-admin
      roles:
      - name: potato-sourcing-qa-admin
        description: Admin privileges to potato-sourcing-qa
        policies:
        - p, proj:potato-sourcing-qa:potato-sourcing-qa-admin, applications, *, potato-sourcing-qa/*, allow
        - p, proj:potato-sourcing-qa:potato-sourcing-qa-admin, repositories, *, potato-sourcing-qa/*, allow
        groups:
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

      - name: potato-sourcing-qa-user
        description: Read-only privileges to potato-sourcing-qa
        policies:
        - p, proj:potato-sourcing-qa:potato-sourcing-qa-user, applications, get, potato-sourcing-qa/*, allow
        - p, proj:potato-sourcing-qa:potato-sourcing-qa-user, applications, sync, potato-sourcing-qa/*, allow
        - p, proj:potato-sourcing-qa:potato-sourcing-qa-user, repositories, get, potato-sourcing-qa/*, allow
         # This line will be replaced by the pipeline script
        - p, proj:potato-sourcing-qa:potato-sourcing-qa-user, applications, action/apps/Deployment/restart, potato-sourcing-qa/*, allow
        groups:
        - "Team.App.Potato.Sourcing.Matrix.ReadOnly"
        - "Team.Support.EIAP.READ"
    