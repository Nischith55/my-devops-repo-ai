apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: och-cle-replay-qa
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  description: Project for och-cle-replay-qa
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/OmniChannelEcommerceHub/_git/pep-global-och-argocd-config
  - pepeiapnonprodcommonacr.azurecr.io/helm
  - pepeiapnonprodcommonacr.azurecr.io
  destinations:
  - name: pep-eiap-nonprod-eus-global-01-aks
    namespace: pep-eiap-och-na-qa
  - name: pep-eiap-nonprod-eus-global-01-aks
    namespace: pep-eiap-ops-admin
  roles:
  - name: och-cle-replay-qa-admin
    description: Admin privileges to och-cle-replay-qa
    policies:
    - p, proj:och-cle-replay-qa:och-cle-replay-qa-admin, applications, *, och-cle-replay-qa/*, allow
    - p, proj:och-cle-replay-qa:och-cle-replay-qa-admin, repositories, *, och-cle-replay-qa/*, allow
    groups:
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: och-cle-replay-qa-user
    description: Read-only privileges to och-cle-replay-qa
    policies:
    - p, proj:och-cle-replay-qa:och-cle-replay-qa-user, applications, get, och-cle-replay-qa/*, allow
    - p, proj:och-cle-replay-qa:och-cle-replay-qa-user, applications, sync, och-cle-replay-qa/*, allow
    - p, proj:och-cle-replay-qa:och-cle-replay-qa-user, repositories, get, och-cle-replay-qa/*, allow
    groups:
    - "Team.Support.OCH.NA.DigitalSales.Developer"
    - "Team.Support.EIAP.READ"
