    apiVersion: argoproj.io/v1alpha1
    kind: AppProject
    metadata:
      name: eiotp-cloud-qa
      namespace: argocd  
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      labels:
        argocd.argoproj.io/project-inherit: global-app
    spec:
      description: Project for eiotp-cloud-qa   
      sourceRepos:
      - https://dev.azure.com/PepsiCoIT/PEPsense_IoT_Platform/_git/pep-eiotp-cloud-argocd-configs
      - pepeiapnonprodcommonacr.azurecr.io/helm
      destinations:
      - name: pep-eiap-nonprod-eus-global-01-aks
        namespace: pep-eiap-global-eiotp-qa
      - name: pep-eiap-nonprod-eus-global-01-aks
        namespace: pep-eiap-ops-admin
      roles:
      - name: eiotp-cloud-qa-admin
        description: Admin privileges to eiotp-cloud-qa
        policies:
        - p, proj:eiotp-cloud-qa:eiotp-cloud-qa-admin, applications, *, eiotp-cloud-qa/*, allow
        - p, proj:eiotp-cloud-qa:eiotp-cloud-qa-admin, repositories, *, eiotp-cloud-qa/*, allow
        groups:
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

      - name: eiotp-cloud-qa-user
        description: Read-only privileges to eiotp-cloud-qa
        policies:
        - p, proj:eiotp-cloud-qa:eiotp-cloud-qa-user, applications, get, eiotp-cloud-qa/*, allow
        - p, proj:eiotp-cloud-qa:eiotp-cloud-qa-user, applications, sync, eiotp-cloud-qa/*, allow
        - p, proj:eiotp-cloud-qa:eiotp-cloud-qa-user, repositories, get, eiotp-cloud-qa/*, allow
         # This line will be replaced by the pipeline script
        - p, proj:eiotp-cloud-qa:eiotp-cloud-qa-user, applications, action/apps/Deployment/restart, eiotp-cloud-qa/*, allow
        groups:
        - "Team.Support.EIAP.Global.EIOTP.NonProd.contributor"
        - "Team.Support.EIAP.Global.EIOTP.NonProd.ContributorNoDelete"
        - "Team.Support.EIAP.READ"
    