    apiVersion: argoproj.io/v1alpha1
    kind: AppProject
    metadata:
      name: eip-services-qa
      namespace: argocd  
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      labels:
        argocd.argoproj.io/project-inherit: global-app
    spec:
      description: Project for eip-services-qa   
      sourceRepos:
      - https://dev.azure.com/PepsiCoIT/EIP-Services/_git/eip-services-argocd-configs
      - pepeiapnonprodcommonacr.azurecr.io/helm
      destinations:
      - name: pep-eiap-nonprod-eus-global-01-aks
        namespace: pep-eiap-global-services-qa
      - name: pep-eiap-nonprod-eus-global-01-aks
        namespace: pep-eiap-ops-admin
      roles:
      - name: eip-services-qa-admin
        description: Admin privileges to eip-services-qa
        policies:
        - p, proj:eip-services-qa:eip-services-qa-admin, applications, *, eip-services-qa/*, allow
        - p, proj:eip-services-qa:eip-services-qa-admin, repositories, *, eip-services-qa/*, allow
        groups:
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

      - name: eip-services-qa-user
        description: Read-only privileges to eip-services-qa
        policies:
        - p, proj:eip-services-qa:eip-services-qa-user, applications, get, eip-services-qa/*, allow
        - p, proj:eip-services-qa:eip-services-qa-user, applications, sync, eip-services-qa/*, allow
        - p, proj:eip-services-qa:eip-services-qa-user, repositories, get, eip-services-qa/*, allow
         # This line will be replaced by the pipeline script
        - p, proj:eip-services-qa:eip-services-qa-user, applications, action/apps/Deployment/restart, eip-services-qa/*, allow
        groups:
        - "Team.Support.EIAP.GLOBAL.SERVICES.Developer"
        - "Team.Support.EIAP.READ"
    