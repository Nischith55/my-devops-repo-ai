    apiVersion: argoproj.io/v1alpha1
    kind: AppProject
    metadata:
      name: pes-sw-qa
      namespace: argocd  
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      labels:
        argocd.argoproj.io/project-inherit: global-app
    spec:
      description: Project for pes-sw-qa   
      sourceRepos:
      - https://dev.azure.com/PepsiCoIT/PBNA_Commercial-Equipment_Service_and_Vending/_git/pes_sw_argocd_configs
      - pepeiapnonprodcommonacr.azurecr.io/helm
      destinations:
      - name: pep-eiap-nonprod-eus-global-01-aks
        namespace: pep-eiap-pbna-cets-qa
      - name: pep-eiap-nonprod-eus-global-01-aks
        namespace: pep-eiap-pbna-halo-qa
      - name: pep-eiap-nonprod-eus-global-01-aks
        namespace: pep-eiap-ops-admin
      - name: pep-eiap-nonprod-eus-global-01-aks
        namespace: pep-eiap-pbna-vms365-dev
        server: https://kubernetes.default.svc
      - name: pep-eiap-nonprod-eus-global-01-aks
        namespace: pep-eiap-pbna-cets-dev
        server: https://kubernetes.default.svc  
      - name: pep-eiap-nonprod-eus-global-01-aks
        namespace: pep-eiap-pbna-vms365-qa
        server: https://kubernetes.default.svc  
      roles:
      - name: pes-sw-qa-admin
        description: Admin privileges to pes-sw-qa
        policies:
        - p, proj:pes-sw-qa:pes-sw-qa-admin, applications, *, pes-sw-qa/*, allow
        - p, proj:pes-sw-qa:pes-sw-qa-admin, repositories, *, pes-sw-qa/*, allow
        groups:
        - "team.support.fsv.aks.nonprod.admins"
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

      - name: pes-sw-qa-user
        description: Read-only privileges to pes-sw-qa
        policies:
        - p, proj:pes-sw-qa:pes-sw-qa-user, applications, get, pes-sw-qa/*, allow
        - p, proj:pes-sw-qa:pes-sw-qa-user, applications, sync, pes-sw-qa/*, allow
        - p, proj:pes-sw-qa:pes-sw-qa-user, repositories, get, pes-sw-qa/*, allow
         # This line will be replaced by the pipeline script
        - p, proj:pes-sw-qa:pes-sw-qa-user, applications, action/apps/Deployment/restart, pes-sw-qa/*, allow
        groups:
        - "team.support.fsv.aks.nonprod.admins"
        - "Team.Support.EIAP.READ"
        - "Team.Support.EIAP.PBNA.HALO.Developer"
        - "Team.Support.PBNA.NonProd.VMS365"
    