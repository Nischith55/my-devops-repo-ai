apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: pep-dtc-dev
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app
spec:
  description: Project for pep-dtc-dev   
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/PEPCommerce_Loyalty/_git/pep-dtc-argocd-configs
  - pepeiapnonprodcommonacr.azurecr.io/helm
  destinations:
  - name: pep-eiap-nonprod-eus-global-01-aks
    namespace: pep-eiap-latam-cep-dev
  - name: pep-eiap-nonprod-eus-global-01-aks
    namespace: pep-eiap-ops-admin
  roles:
  - name: pep-dtc-dev-admin
    description: Admin privileges to pep-dtc-dev
    policies:
    - p, proj:pep-dtc-dev:pep-dtc-dev-admin, applications, *, pep-dtc-dev/*, allow
    - p, proj:pep-dtc-dev:pep-dtc-dev-admin, repositories, *, pep-dtc-dev/*, allow
    groups:
    - "Team.Support.CGF.NonProd.devops"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: pep-dtc-dev-user
    description: Read-only privileges to pep-dtc-dev
    policies:
    - p, proj:pep-dtc-dev:pep-dtc-dev-user, applications, get, pep-dtc-dev/*, allow
    - p, proj:pep-dtc-dev:pep-dtc-dev-user, applications, sync, pep-dtc-dev/*, allow
    - p, proj:pep-dtc-dev:pep-dtc-dev-user, repositories, get, pep-dtc-dev/*, allow
    - p, proj:pep-dtc-dev:pep-dtc-dev-user, applications, action/apps/Deployment/restart, pep-dtc-dev/*, allow
    groups:
    - "Team.Support.EIAP.GLOBAL.CEP.Developer"
    - "Team.Support.EIAP.READ"