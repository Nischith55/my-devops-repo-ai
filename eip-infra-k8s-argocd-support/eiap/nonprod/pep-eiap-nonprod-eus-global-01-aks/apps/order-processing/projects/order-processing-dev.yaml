    apiVersion: argoproj.io/v1alpha1
    kind: AppProject
    metadata:
      name: order-processing-dev
      namespace: argocd  
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      labels:
        argocd.argoproj.io/project-inherit: global-app
    spec:
      description: Project for order-processing-dev   
      sourceRepos:
      - https://dev.azure.com/PepsiCoIT/CGF_BI_Reporting/_git/order-processing-argocd-configs
      - pepeiapnonprodcommonacr.azurecr.io/helm
      destinations:
      - name: pep-eiap-nonprod-eus-global-01-aks
        namespace: pep-eiap-cgf-orderproce-dev
      - name: pep-eiap-nonprod-eus-global-01-aks
        namespace: pep-eiap-ops-admin
      roles:
      - name: order-processing-dev-admin
        description: Admin privileges to order-processing-dev
        policies:
        - p, proj:order-processing-dev:order-processing-dev-admin, applications, *, order-processing-dev/*, allow
        - p, proj:order-processing-dev:order-processing-dev-admin, repositories, *, order-processing-dev/*, allow
        groups:
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

      - name: order-processing-dev-user
        description: Read-only privileges to order-processing-dev
        policies:
        - p, proj:order-processing-dev:order-processing-dev-user, applications, get, order-processing-dev/*, allow
        - p, proj:order-processing-dev:order-processing-dev-user, applications, sync, order-processing-dev/*, allow
        - p, proj:order-processing-dev:order-processing-dev-user, repositories, get, order-processing-dev/*, allow
         # This line will be replaced by the pipeline script
        - p, proj:order-processing-dev:order-processing-dev-user, applications, action/apps/Deployment/restart, order-processing-dev/*, allow
        groups:
        - "Team.Support.IAI.PWC.Azure.Dev"
        - "Team.Support.EIAP.READ"
    