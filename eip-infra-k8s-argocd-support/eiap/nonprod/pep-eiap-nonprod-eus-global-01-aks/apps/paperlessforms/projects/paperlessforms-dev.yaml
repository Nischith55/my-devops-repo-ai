    apiVersion: argoproj.io/v1alpha1
    kind: AppProject
    metadata:
      name: paperlessforms-dev
      namespace: argocd  
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      labels:
        argocd.argoproj.io/project-inherit: global-app
    spec:
      description: Project for paperlessforms-dev   
      sourceRepos:
      - https://dev.azure.com/PepsiCoIT/CTO_DigitalServices_WebSolutions/_git/paperlessforms-argocd-configs
      - pepeiapnonprodcommonacr.azurecr.io/helm
      destinations:
      - name: pep-eiap-nonprod-eus-global-01-aks
        namespace: pep-eiap-amesa-paperless-dev
      - name: pep-eiap-nonprod-eus-global-01-aks
        namespace: pep-eiap-ops-admin
      roles:
      - name: paperlessforms-dev-admin
        description: Admin privileges to paperlessforms-dev
        policies:
        - p, proj:paperlessforms-dev:paperlessforms-dev-admin, applications, *, paperlessforms-dev/*, allow
        - p, proj:paperlessforms-dev:paperlessforms-dev-admin, repositories, *, paperlessforms-dev/*, allow
        groups:
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

      - name: paperlessforms-dev-user
        description: Read-only privileges to paperlessforms-dev
        policies:
        - p, proj:paperlessforms-dev:paperlessforms-dev-user, applications, get, paperlessforms-dev/*, allow
        - p, proj:paperlessforms-dev:paperlessforms-dev-user, applications, sync, paperlessforms-dev/*, allow
        - p, proj:paperlessforms-dev:paperlessforms-dev-user, repositories, get, paperlessforms-dev/*, allow
         # This line will be replaced by the pipeline script
        - p, proj:paperlessforms-dev:paperlessforms-dev-user, applications, action/apps/Deployment/restart, paperlessforms-dev/*, allow
        groups:
        - "Team.Support.Azure.ANZ.Developers"
        - "Team.Support.EIAP.READ"
    