apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: mtmultiplemarket-mt-dev
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Project for mtmultiplemarket-mt-dev 
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/mtmultiplemarket-mt-argocd-configs
  - pepeiapnonprodcommonacr.azurecr.io/helm 
  destinations:
  - name: pep-eiap-nonprod-eus-global-01-aks
    namespace: pep-eiap-cgf-devxinfr-dev
  - name: pep-eiap-nonprod-eus-global-01-aks
    namespace: pep-eiap-ops-admin
  roles:
  - name: mtmultiplemarket-mt-dev-admin
    description: Admin privileges to mtmultiplemarket-mt-dev
    policies:
    - p, proj:mtmultiplemarket-mt-dev:mtmultiplemarket-mt-dev-admin, applications, *, mtmultiplemarket-mt-dev/*, allow
    - p, proj:mtmultiplemarket-mt-dev:mtmultiplemarket-mt-dev-admin, repositories, *, mtmultiplemarket-mt-dev/*, allow
    groups:
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
  - name: mtmultiplemarket-mt-dev-user
    description: Read-only privileges to mtmultiplemarket-mt-dev
    policies:
    - p, proj:mtmultiplemarket-mt-dev:mtmultiplemarket-mt-dev-user, applications, get, mtmultiplemarket-mt-dev/*, allow
    - p, proj:mtmultiplemarket-mt-dev:mtmultiplemarket-mt-dev-user, applications, sync, mtmultiplemarket-mt-dev/*, allow
    - p, proj:mtmultiplemarket-mt-dev:mtmultiplemarket-mt-dev-user, repositories, get, mtmultiplemarket-mt-dev/*, allow
    - p, proj:mtmultiplemarket-mt-dev:mtmultiplemarket-mt-dev-user, *, delete, *, deny
    groups:
    - "Team.Support.CGF.NonProd.devX"
    - "Team.Support.EIAP.READ"