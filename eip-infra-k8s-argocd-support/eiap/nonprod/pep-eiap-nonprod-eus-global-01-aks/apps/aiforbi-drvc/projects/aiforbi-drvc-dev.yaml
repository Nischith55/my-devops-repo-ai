    apiVersion: argoproj.io/v1alpha1
    kind: AppProject
    metadata:
      name: aiforbi-drvc-dev
      namespace: argocd  
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      labels:
        argocd.argoproj.io/project-inherit: global-app
    spec:
      description: Project for aiforbi-drvc-dev   
      sourceRepos:
      - https://dev.azure.com/PepsiCoIT/BI-Reporting/_git/aiforbi-drvc-backend-argocd-configs
      - pepeiapnonprodcommonacr.azurecr.io/helm
      destinations:
      - name: pep-eiap-nonprod-eus-global-01-aks
        namespace: pep-eiap-cgf-pricechang-dev
      - name: pep-eiap-nonprod-eus-global-01-aks
        namespace: pep-eiap-ops-admin
      roles:
      - name: aiforbi-drvc-dev-admin
        description: Admin privileges to aiforbi-drvc-dev
        policies:
        - p, proj:aiforbi-drvc-dev:aiforbi-drvc-dev-admin, applications, *, aiforbi-drvc-dev/*, allow
        - p, proj:aiforbi-drvc-dev:aiforbi-drvc-dev-admin, repositories, *, aiforbi-drvc-dev/*, allow
        groups:
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

      - name: aiforbi-drvc-dev-user
        description: Read-only privileges to aiforbi-drvc-dev
        policies:
        - p, proj:aiforbi-drvc-dev:aiforbi-drvc-dev-user, applications, get, aiforbi-drvc-dev/*, allow
        - p, proj:aiforbi-drvc-dev:aiforbi-drvc-dev-user, applications, sync, aiforbi-drvc-dev/*, allow
        - p, proj:aiforbi-drvc-dev:aiforbi-drvc-dev-user, repositories, get, aiforbi-drvc-dev/*, allow
         # This line will be replaced by the pipeline script
        - p, proj:aiforbi-drvc-dev:aiforbi-drvc-dev-user, applications, action/apps/Deployment/restart, aiforbi-drvc-dev/*, allow
        groups:
        - "Team.Support.CGF.NonProd.EEGenAI"
        - "Team.Support.EIAP.READ"