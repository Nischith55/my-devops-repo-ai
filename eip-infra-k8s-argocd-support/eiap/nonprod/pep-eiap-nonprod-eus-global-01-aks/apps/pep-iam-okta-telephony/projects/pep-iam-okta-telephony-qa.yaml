    apiVersion: argoproj.io/v1alpha1
    kind: AppProject
    metadata:
      name: pep-iam-okta-telephony-qa
      namespace: argocd  
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      labels:
        argocd.argoproj.io/project-inherit: global-app
    spec:
      description: Project for pep-iam-okta-telephony-qa 
      sourceRepos:
      - https://dev.azure.com/PepsiCoIT/Identity_and_Access_Management%20(IAM)/_git/pep-iam-okta-telephony-argocd-configs
      - pepeiapnonprodcommonacr.azurecr.io/helm
      destinations:
      - name: pep-eiap-nonprod-eus-global-01-aks
        namespace: pep-eiap-cgf-iamservice-qa
      - name: pep-eiap-nonprod-eus-global-01-aks
        namespace: pep-eiap-ops-admin
      roles:
      - name: pep-iam-okta-telephony-qa-admin
        description: Admin privileges to pep-iam-okta-telephony-qa
        policies:
        - p, proj:pep-iam-okta-telephony-qa:pep-iam-okta-telephony-qa-admin, applications, *, pep-iam-okta-telephony-qa/*, allow
        - p, proj:pep-iam-okta-telephony-qa:pep-iam-okta-telephony-qa-admin, repositories, *, pep-iam-okta-telephony-qa/*, allow
        groups:
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

      - name: pep-iam-okta-telephony-qa-user
        description: Read-only privileges to pep-iam-okta-telephony-qa
        policies:
        - p, proj:pep-iam-okta-telephony-qa:pep-iam-okta-telephony-qa-user, applications, get, pep-iam-okta-telephony-qa/*, allow
        - p, proj:pep-iam-okta-telephony-qa:pep-iam-okta-telephony-qa-user, applications, sync, pep-iam-okta-telephony-qa/*, allow
        - p, proj:pep-iam-okta-telephony-qa:pep-iam-okta-telephony-qa-user, repositories, get, pep-iam-okta-telephony-qa/*, allow
         # This line will be replaced by the pipeline script
        - p, proj:pep-iam-okta-telephony-qa:pep-iam-okta-telephony-qa-user, applications, action/apps/Deployment/restart, pep-iam-okta-telephony-qa/*, allow
        groups:
        - "Team.support.AssociateSSO.PROD.Admins"
        - "Team.Support.EIAP.READ"
    