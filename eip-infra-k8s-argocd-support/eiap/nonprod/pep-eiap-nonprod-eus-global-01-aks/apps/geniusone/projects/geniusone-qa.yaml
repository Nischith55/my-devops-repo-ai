    apiVersion: argoproj.io/v1alpha1
    kind: AppProject
    metadata:
      name: geniusone-qa
      namespace: argocd  
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      labels:
        argocd.argoproj.io/project-inherit: global-app
    spec:
      description: Project for geniusone-qa   
      sourceRepos:
      - https://dev.azure.com/PepsiCoIT/GeniusOne/_git/geniusone-argocd-configs
      - pepeiapnonprodcommonacr.azurecr.io/helm
      destinations:
      - name: pep-eiap-nonprod-eus-global-01-aks
        namespace: pep-eiap-global-services-qa
      - name: pep-eiap-nonprod-eus-global-01-aks
        namespace: pep-eiap-ops-admin
      roles:
      - name: geniusone-qa-admin
        description: Admin privileges to geniusone-qa
        policies:
        - p, proj:geniusone-qa:geniusone-qa-admin, applications, *, geniusone-qa/*, allow
        - p, proj:geniusone-qa:geniusone-qa-admin, repositories, *, geniusone-qa/*, allow
        groups:
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

      - name: geniusone-qa-user
        description: Read-only privileges to geniusone-qa
        policies:
        - p, proj:geniusone-qa:geniusone-qa-user, applications, get, geniusone-qa/*, allow
        - p, proj:geniusone-qa:geniusone-qa-user, applications, sync, geniusone-qa/*, allow
        - p, proj:geniusone-qa:geniusone-qa-user, repositories, get, geniusone-qa/*, allow
         # This line will be replaced by the pipeline script
        - p, proj:geniusone-qa:geniusone-qa-user, applications, action/apps/Deployment/restart, geniusone-qa/*, allow
        groups:
        - "Team.Support.EIAP.GLOBAL.SERVICES.Developer"
        - "Team.Support.EIAP.READ"
    