    apiVersion: argoproj.io/v1alpha1
    kind: AppProject
    metadata:
      name: geniusone-dev
      namespace: argocd  
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      labels:
        argocd.argoproj.io/project-inherit: global-app
    spec:
      description: Project for geniusone-dev   
      sourceRepos:
      - https://dev.azure.com/PepsiCoIT/GeniusOne/_git/geniusone-argocd-configs
      - pepeiapnonprodcommonacr.azurecr.io/helm
      destinations:
      - name: pep-eiap-nonprod-eus-global-01-aks
        namespace: pep-eiap-global-services-dev
      - name: pep-eiap-nonprod-eus-global-01-aks
        namespace: pep-eiap-ops-admin
      roles:
      - name: geniusone-dev-admin
        description: Admin privileges to geniusone-dev
        policies:
        - p, proj:geniusone-dev:geniusone-dev-admin, applications, *, geniusone-dev/*, allow
        - p, proj:geniusone-dev:geniusone-dev-admin, repositories, *, geniusone-dev/*, allow
        groups:
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

      - name: geniusone-dev-user
        description: Read-only privileges to geniusone-dev
        policies:
        - p, proj:geniusone-dev:geniusone-dev-user, applications, get, geniusone-dev/*, allow
        - p, proj:geniusone-dev:geniusone-dev-user, applications, sync, geniusone-dev/*, allow
        - p, proj:geniusone-dev:geniusone-dev-user, repositories, get, geniusone-dev/*, allow
         # This line will be replaced by the pipeline script
        - p, proj:geniusone-dev:geniusone-dev-user, applications, action/apps/Deployment/restart, geniusone-dev/*, allow
        groups:
        - "Team.Support.EIAP.GLOBAL.SERVICES.Developer"
        - "Team.Support.EIAP.READ"
    