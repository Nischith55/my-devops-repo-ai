apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: gcrtest02-gcrargorepo02-dev
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Project for gcrtest02-gcrargorepo02-dev 
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/CTO_DevX/_git/gcrtest02-gcrargorepo02-argocd-configs
  - pepeiapnonprodcommonacr.azurecr.io/helm 
  destinations:
  - name: pep-cmp-nonprod-eus-01-aks
    namespace: pep-cmp-cmp-cmp11-dev
  - name: pep-cmp-nonprod-eus-01-aks
    namespace: pep-eiap-ops-admin
  roles:
  - name: gcrtest02-gcrargorepo02-dev-admin
    description: Admin privileges to gcrtest02-gcrargorepo02-dev
    policies:
    - p, proj:gcrtest02-gcrargorepo02-dev:gcrtest02-gcrargorepo02-dev-admin, applications, *, gcrtest02-gcrargorepo02-dev/*, allow
    - p, proj:gcrtest02-gcrargorepo02-dev:gcrtest02-gcrargorepo02-dev-admin, repositories, *, gcrtest02-gcrargorepo02-dev/*, allow
    groups:
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: gcrtest02-gcrargorepo02-dev-user
    description: Read-only privileges to gcrtest02-gcrargorepo02-dev
    policies:
    - p, proj:gcrtest02-gcrargorepo02-dev:gcrtest02-gcrargorepo02-dev-user, applications, get, gcrtest02-gcrargorepo02-dev/*, allow
    - p, proj:gcrtest02-gcrargorepo02-dev:gcrtest02-gcrargorepo02-dev-user, applications, sync, gcrtest02-gcrargorepo02-dev/*, allow
    - p, proj:gcrtest02-gcrargorepo02-dev:gcrtest02-gcrargorepo02-dev-user, repositories, get, gcrtest02-gcrargorepo02-dev/*, allow
    - p, proj:gcrtest02-gcrargorepo02-dev:gcrtest02-gcrargorepo02-dev-user, *, delete, *, deny
    groups:
    - "Team.Support.EIAP.READ"