apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: pepsico-eip-eipone-scus-dev
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app
spec:
  description: Project for pepsico-eip-eipone-scus-dev
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/Microservices_Development_Portal/_git/pepsico-eip-eipone-argocd-configs
  - pepeiapnonprodcommonacr.azurecr.io/helm
  destinations:
  - name: pep-eiap-nonprod-scus-global-01-aks
    namespace: pep-eiap-global-mdp-dev
  - name: pep-eiap-nonprod-scus-global-01-aks
    namespace: pep-eiap-ops-admin
  roles:
  - name: pepsico-eip-eipone-scus-dev-admin
    description: Admin privileges to pepsico-eip-eipone-scus-dev
    policies:
    - p, proj:pepsico-eip-eipone-scus-dev:pepsico-eip-eipone-scus-dev-admin, applications, *, pepsico-eip-eipone-scus-dev/*, allow
    - p, proj:pepsico-eip-eipone-scus-dev:pepsico-eip-eipone-scus-dev-admin, repositories, *, pepsico-eip-eipone-scus-dev/*, allow
    groups:
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: pepsico-eip-eipone-scus-dev-user
    description: Read-only privileges to pepsico-eip-eipone-scus-dev
    policies:
    - p, proj:pepsico-eip-eipone-scus-dev:pepsico-eip-eipone-scus-dev-user, applications, get, pepsico-eip-eipone-scus-dev/*, allow
    - p, proj:pepsico-eip-eipone-scus-dev:pepsico-eip-eipone-scus-dev-user, applications, sync, pepsico-eip-eipone-scus-dev/*, allow
    - p, proj:pepsico-eip-eipone-scus-dev:pepsico-eip-eipone-scus-dev-user, repositories, get, pepsico-eip-eipone-scus-dev/*, allow # This line will be replaced by the pipeline script
    - p, proj:pepsico-eip-eipone-scus-dev:pepsico-eip-eipone-scus-dev-user, applications, action/apps/Deployment/restart, pepsico-eip-eipone-scus-dev/*, allow
    groups:
    - "Team.Support.EIAP.READ"
    - "Team.Support.EIAP.GLOBAL.MDP.AppSupport"
