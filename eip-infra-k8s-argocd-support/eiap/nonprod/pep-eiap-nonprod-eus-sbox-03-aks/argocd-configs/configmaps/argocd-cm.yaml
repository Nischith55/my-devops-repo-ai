apiVersion: v1
data:
  # admin.enabled: "false"
  exec.enabled: "true"
  globalProjects: |-
    - labelSelector:
        matchExpressions:
          - key: argocd.argoproj.io/project-inherit
            operator: In
            values:
              - global
      projectName: global
  dex.config: |
    connectors:
    - type: microsoft
      id: microsoft
      name: Microsoft
      config:
        clientID: 2d6cf6c5-486e-46ec-834e-a7f359bdfb88
        clientSecret: $oidc.azure.clientSecret
        redirectURI: https://argocd.eiap.eus.sbox.intra.pepsico.com/api/dex/callback
        tenant: 42cc3295-cd0e-449c-b98e-5ce5b560c1d3
        emailToLowercase: true
        scopes:
         - profile
         - email
         - openid
  resource.exclusions: |
    - apiGroups:
      - ''
      kinds:
      - namespaces
      clusters:
      - "*"
  url: https://argocd.eiap.eus.sbox.intra.pepsico.com
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
  name: argocd-cm
  namespace: argocd
