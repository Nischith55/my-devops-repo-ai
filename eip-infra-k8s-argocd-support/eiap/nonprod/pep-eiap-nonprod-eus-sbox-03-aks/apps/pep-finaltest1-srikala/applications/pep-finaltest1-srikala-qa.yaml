apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pep-finaltest1-srikala-qa-bootstrapper
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: argocd
  destination:
    namespace: argocd    
    server: https://kubernetes.default.svc
  syncPolicy:    
    automated:
      prune: false
      selfHeal: true
  sources:
  - ref: values
    repoURL: https://dev.azure.com/PepsiCoIT/EIAP_DevOps/_git/pep-finaltest1-srikala-argocd-configs
    targetRevision: develop 
  - repoURL: pepeiapnonprodcommonacr.azurecr.io/helm 
    targetRevision: 0.2.4
    chart: argocd-app-bootstrapper 
    helm:
      releaseName: pep-finaltest1-srikala-qa
      valueFiles:
      - $values/qa/pep-eiap-nonprod-eus-sbox-03-aks/argocd-app-configs.yaml    
      values: |
        global:
          env: qa
          helm:  
            enabled: false       
            repo: pepeiapnonprodcommonacr.azurecr.io/helm 
            chart: umbrellachart
            revision: 2.1.30 
            values: 
              platform-chart:
                destination: 
                  jobImage: pepeiapnonprodcommonacr.azurecr.io/pep/eip/infra/azurepipeline/devopsagent:20240222.1 
                  jobNS: pep-eiap-ops-admin 
                  jobServiceAccount: gw-update-sa
          spec:
            project: pep-finaltest1-srikala-qa 
            source: 
              repoURL: https://dev.azure.com/PepsiCoIT/EIAP_DevOps/_git/pep-finaltest1-srikala-argocd-configs 
              repoName: pep-finaltest1-srikala-argocd-configs # appruntime-argocd-configs
              targetRevision: develop
              manifest: helm-values.yaml
            sync:
              prune: false 
            notifications:  
              notifyEmail: dl-azureautomation@pepsico.com