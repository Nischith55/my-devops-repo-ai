apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: askea-dev
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  description: Project for askea-dev
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/EIAP_Projects/_git/askea-genai-argocd-configs
  - pepeiapnonprodcommonacr.azurecr.io/helm
  destinations:
  - name: pep-eiap-nonprod-eus-aisp-01-aks
    namespace: pep-eiap-cgf-askeadev-dev
  - name: pep-eiap-nonprod-eus-aisp-01-aks
    namespace: pep-eiap-ops-admin
  roles:
  - name: askea-dev-admin
    description: Admin privileges to askea-dev
    policies:
    - p, proj:askea-dev:askea-dev-admin, applications, *, askea-dev/*, allow
    - p, proj:askea-dev:askea-dev-admin, repositories, *, askea-dev/*, allow
    groups:
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: askea-dev-user
    description: Read-only privileges to askea-dev
    policies:
    - p, proj:askea-dev:askea-dev-user, applications, get, askea-dev/*, allow
    - p, proj:askea-dev:askea-dev-user, applications, sync, askea-dev/*, allow
    - p, proj:askea-dev:askea-dev-user, repositories, get, askea-dev/*, allow
    - p, proj:askea-dev:askea-dev-user, applications, action/apps/Deployment/restart, askea-dev/*, allow
    groups:
    - "Team.Support.EIAP.READ"
    - "Team.Support.CGF.NonProd.AskEAdev"
