apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: pepgafs-qa
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  description: Project for pepgafs-qa
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/EIAP_Projects/_git/pepgafs-argocd-config
  - pepeiapnonprodcommonacr.azurecr.io/helm
  destinations:
  - name: pep-eiap-nonprod-eus-aisp-01-aks
    namespace: pep-eiap-cgf-gafsqa-qa
  - name: pep-eiap-nonprod-eus-aisp-01-aks
    namespace: pep-eiap-ops-admin
  roles:
  - name: pepgafs-qa-admin
    description: Admin privileges to pepgafs-qa
    policies:
    - p, proj:pepgafs-qa:pepgafs-qa-admin, applications, *, pepgafs-qa/*, allow
    - p, proj:pepgafs-qa:pepgafs-qa-admin, repositories, *, pepgafs-qa/*, allow
    groups:
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: pepgafs-qa-user
    description: Read-only privileges to pepgafs-qa
    policies:
    - p, proj:pepgafs-qa:pepgafs-qa-user, applications, get, pepgafs-qa/*, allow
    - p, proj:pepgafs-qa:pepgafs-qa-user, applications, sync, pepgafs-qa/*, allow
    - p, proj:pepgafs-qa:pepgafs-qa-user, repositories, get, pepgafs-qa/*, allow
    - p, proj:pepgafs-qa:pepgafs-qa-user, applications, action/apps/Deployment/restart, pepgafs-qa/*, allow
    groups:
    - "Team.Support.EIAP.READ"
    - "Team.Support.CGF.NonProd.PepGAFS"
