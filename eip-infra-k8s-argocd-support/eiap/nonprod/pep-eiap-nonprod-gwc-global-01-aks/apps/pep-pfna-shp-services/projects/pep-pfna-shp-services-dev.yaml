    apiVersion: argoproj.io/v1alpha1
    kind: AppProject
    metadata:
      name: pep-pfna-shp-services-dev
      namespace: argocd  
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      labels:
        argocd.argoproj.io/project-inherit: global-app
    spec:
      description: Project for pep-pfna-shp-services-dev   
      sourceRepos:
      - https://dev.azure.com/PepsiCoIT/Hand_Held_Next/_git/pep-pfna-shp-services-argocd-configs
      - pepeiapnonprodcommonacr.azurecr.io/helm
      destinations:
      - name: pep-eiap-nonprod-gwc-global-01-aks
        namespace: pep-eiap-och-edt-dev
      - name: pep-eiap-nonprod-gwc-global-01-aks
        namespace: pep-eiap-ops-admin
      roles:
      - name: pep-pfna-shp-services-dev-admin
        description: Admin privileges to pep-pfna-shp-services-dev
        policies:
        - p, proj:pep-pfna-shp-services-dev:pep-pfna-shp-services-dev-admin, applications, *, pep-pfna-shp-services-dev/*, allow
        - p, proj:pep-pfna-shp-services-dev:pep-pfna-shp-services-dev-admin, repositories, *, pep-pfna-shp-services-dev/*, allow
        groups:
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

      - name: pep-pfna-shp-services-dev-user
        description: Read-only privileges to pep-pfna-shp-services-dev
        policies:
        - p, proj:pep-pfna-shp-services-dev:pep-pfna-shp-services-dev-user, applications, get, pep-pfna-shp-services-dev/*, allow
        - p, proj:pep-pfna-shp-services-dev:pep-pfna-shp-services-dev-user, applications, sync, pep-pfna-shp-services-dev/*, allow
        - p, proj:pep-pfna-shp-services-dev:pep-pfna-shp-services-dev-user, repositories, get, pep-pfna-shp-services-dev/*, allow
         # This line will be replaced by the pipeline script
        - p, proj:pep-pfna-shp-services-dev:pep-pfna-shp-services-dev-user, applications, action/apps/Deployment/restart, pep-pfna-shp-services-dev/*, allow
        groups:
        - "Team.Support.OCH.ESSA.DigitalSales.Developer"
        - "Team.Support.EIAP.READ"
    