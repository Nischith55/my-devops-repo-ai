apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: pepci-preprod
  namespace: argocd  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd.argoproj.io/project-inherit: global-app     
spec:
  description: Project for pepci-preprod 
  sourceRepos:
  - https://dev.azure.com/PepsiCoIT/EIAP_Projects/_git/pepci-argocd-configs
  - pepeiapprodcommonacr.azurecr.io/helm 
  destinations:
  - name: pep-eiap-preprod-scus-global-01-aks
    namespace: pep-eiap-cgf-pepci-dev
  - name: pep-eiap-preprod-scus-global-01-aks
    namespace: pep-eiap-ops-admin
  roles:
  - name: pepci-preprod-admin
    description: Admin privileges to pepci-preprod
    policies:
    - p, proj:pepci-preprod:pepci-preprod-admin, applications, *, appruntime-dev/*, allow
    - p, proj:pepci-preprod:pepci-preprod-admin, repositories, *, appruntime-dev/*, allow
    groups:
    - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

  - name: pepci-preprod-user
    description: Read-only privileges to pepci-preprod
    policies:
    - p, proj:pepci-preprod:pepci-preprod-user, applications, get, appruntime-dev/*, allow
    - p, proj:pepci-preprod:pepci-preprod-user, applications, sync, appruntime-dev/*, allow
    - p, proj:pepci-preprod:pepci-preprod-user, repositories, get, appruntime-dev/*, allow
    - p, proj:pepci-preprod:pepci-preprod-user, *, delete, *, deny
    - p, proj:pepci-preprod:pepci-preprod-user, applications, action/apps/Deployment/restart, pepci-preprod/*, allow
    groups:
    - "Team.Support.CGF.NonProd.PepCI" ## modify the group here as per the user input
    - "Team.Support.EIAP.READ"