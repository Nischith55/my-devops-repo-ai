apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pepci-preprod-bootstrapper
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: argocd
  destination:
    namespace: argocd    
    server: https://kubernetes.default.svc
  syncPolicy:    
    automated:
      prune: false
      selfHeal: true
  sources:
  - ref: values
    repoURL: https://dev.azure.com/PepsiCoIT/EIAP_Projects/_git/pepci-argocd-configs
    targetRevision: develop 
  - repoURL: pepeiapprodcommonacr.azurecr.io/helm 
    targetRevision: 0.2.5
    chart: argocd-app-bootstrapper 
    helm:
      releaseName: pepci-preprod
      valueFiles:
      - $values/preprod/pep-eiap-preprod-scus-global-01-aks/argocd-app-configs.yaml    
      values: |
        global:
          env: preprod
          helm:  
            enabled: false       
            repo: pepeiapprodcommonacr.azurecr.io/helm 
            chart: umbrellachart
            revision: 2.1.31 
            values: 
              platform-chart:
                destination: 
                  jobImage: pepeiapprodcommonacr.azurecr.io/pep/eip/infra/azurepipeline/devopsagent:20240222.1 
                  jobNS: pep-eiap-ops-admin 
                  jobServiceAccount: gw-update-sa
          spec:
            project: pepci-preprod 
            source: 
              repoURL: https://dev.azure.com/PepsiCoIT/EIAP_Projects/_git/pepci-argocd-configs 
              repoName: pepci-argocd-configs # appruntime-argocd-configs
              targetRevision: develop
              manifest: helm-values.yaml
            sync:
              prune: false 
            notifications:  
              notifyEmail: ITIAICONVERSATIONALAI@pepsico.com