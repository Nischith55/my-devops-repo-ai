    apiVersion: argoproj.io/v1alpha1
    kind: AppProject
    metadata:
      name: eiotp-cloud-preprod
      namespace: argocd  
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      labels:
        argocd.argoproj.io/project-inherit: global-app
    spec:
      description: Project for eiotp-cloud-preprod   
      sourceRepos:
      - https://dev.azure.com/PepsiCoIT/PEPsense_IoT_Platform/_git/pep-eiotp-cloud-argocd-configs
      - pepeiapprodcommonacr.azurecr.io/helm
      destinations:
      - name: pep-eiap-preprod-scus-global-01-aks
        namespace: pep-eiap-global-eiotp-preprod
      - name: pep-eiap-preprod-scus-global-01-aks
        namespace: pep-eiap-ops-admin
      roles:
      - name: eiotp-cloud-preprod-admin
        description: Admin privileges to eiotp-cloud-preprod
        policies:
        - p, proj:eiotp-cloud-preprod:eiotp-cloud-preprod-admin, applications, *, eiotp-cloud-preprod/*, allow
        - p, proj:eiotp-cloud-preprod:eiotp-cloud-preprod-admin, repositories, *, eiotp-cloud-preprod/*, allow
        groups:
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

      - name: eiotp-cloud-preprod-user
        description: Read-only privileges to eiotp-cloud-preprod
        policies:
        - p, proj:eiotp-cloud-preprod:eiotp-cloud-preprod-user, applications, get, eiotp-cloud-preprod/*, allow
        - p, proj:eiotp-cloud-preprod:eiotp-cloud-preprod-user, applications, sync, eiotp-cloud-preprod/*, allow
        - p, proj:eiotp-cloud-preprod:eiotp-cloud-preprod-user, repositories, get, eiotp-cloud-preprod/*, allow
         # This line will be replaced by the pipeline script
        - p, proj:eiotp-cloud-preprod:eiotp-cloud-preprod-user, applications, action/apps/Deployment/restart, eiotp-cloud-preprod/*, allow
        groups:
        - "Team.Support.EIAP.Global.EIOTP.PreProd.ContributorNoDelete"
        - "Team.Support.EIAP.Global.EIOTP.NonProd.contributor"
        - "Team.Support.EIAP.Global.EIOTP.PreProd.Reader"
        - "Team.Support.EIAP.Global.EIOTP.PreProd.contributor"
        - "mrengara@pepsico.com"
        - "Team.Support.EIAP.READ"
    