    apiVersion: argoproj.io/v1alpha1
    kind: AppProject
    metadata:
      name: aisp-agentfactory-preprod
      namespace: argocd  
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      labels:
        argocd.argoproj.io/project-inherit: global-app
    spec:
      description: Project for aisp-agentfactory-preprod   
      sourceRepos:
      - https://dev.azure.com/PepsiCoIT2/CTO_AI_Agent_Factory/_git/pep-aisp-agentfactory-argocd-configs
      - pepeiapprodcommonacr.azurecr.io/helm
      destinations:
      - name: pep-eiap-preprod-scus-global-01-aks
        namespace: pep-eiap-cgf-agfactory-preprod
      - name: pep-eiap-preprod-scus-global-01-aks
        namespace: pep-eiap-ops-admin
      roles:
      - name: aisp-agentfactory-preprod-admin
        description: Admin privileges to aisp-agentfactory-preprod
        policies:
        - p, proj:aisp-agentfactory-preprod:aisp-agentfactory-preprod-admin, applications, *, aisp-agentfactory-preprod/*, allow
        - p, proj:aisp-agentfactory-preprod:aisp-agentfactory-preprod-admin, repositories, *, aisp-agentfactory-preprod/*, allow
        groups:
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

      - name: aisp-agentfactory-preprod-user
        description: Read-only privileges to aisp-agentfactory-preprod
        policies:
        - p, proj:aisp-agentfactory-preprod:aisp-agentfactory-preprod-user, applications, get, aisp-agentfactory-preprod/*, allow
        - p, proj:aisp-agentfactory-preprod:aisp-agentfactory-preprod-user, applications, sync, aisp-agentfactory-preprod/*, allow
        - p, proj:aisp-agentfactory-preprod:aisp-agentfactory-preprod-user, repositories, get, aisp-agentfactory-preprod/*, allow
         # This line will be replaced by the pipeline script
        - p, proj:aisp-agentfactory-preprod:aisp-agentfactory-preprod-user, applications, action/apps/Deployment/restart, aisp-agentfactory-preprod/*, allow
        groups:
        - "Team.Support.CGF.NonProd.EEGenAI"
        - "Team.Support.EIAP.READ"
    