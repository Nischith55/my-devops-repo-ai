    apiVersion: argoproj.io/v1alpha1
    kind: AppProject
    metadata:
      name: geniusone-preprod
      namespace: argocd  
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      labels:
        argocd.argoproj.io/project-inherit: global-app
    spec:
      description: Project for geniusone-preprod   
      sourceRepos:
      - https://dev.azure.com/PepsiCoIT/GeniusOne/_git/geniusone-argocd-configs
      - pepeiapprodcommonacr.azurecr.io/helm
      destinations:
      - name: pep-eiap-preprod-scus-global-01-aks
        namespace: pep-eiap-global-eip-preprod
      - name: pep-eiap-preprod-scus-global-01-aks
        namespace: pep-eiap-ops-admin
      roles:
      - name: geniusone-preprod-admin
        description: Admin privileges to geniusone-preprod
        policies:
        - p, proj:geniusone-preprod:geniusone-preprod-admin, applications, *, geniusone-preprod/*, allow
        - p, proj:geniusone-preprod:geniusone-preprod-admin, repositories, *, geniusone-preprod/*, allow
        groups:
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

      - name: geniusone-preprod-user
        description: Read-only privileges to geniusone-preprod
        policies:
        - p, proj:geniusone-preprod:geniusone-preprod-user, applications, get, geniusone-preprod/*, allow
        - p, proj:geniusone-preprod:geniusone-preprod-user, applications, sync, geniusone-preprod/*, allow
        - p, proj:geniusone-preprod:geniusone-preprod-user, repositories, get, geniusone-preprod/*, allow
         # This line will be replaced by the pipeline script
        - p, proj:geniusone-preprod:geniusone-preprod-user, applications, action/apps/Deployment/restart, geniusone-preprod/*, allow
        groups:
        - "Team.Support.EIAP.GLOBAL.SERVICES.Developer"
        - "Team.Support.EIAP.READ"
    