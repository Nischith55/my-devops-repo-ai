    apiVersion: argoproj.io/v1alpha1
    kind: AppProject
    metadata:
      name: admin-dashboard-preprod
      namespace: argocd  
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      labels:
        argocd.argoproj.io/project-inherit: global-app
    spec:
      description: Project for admin-dashboard-preprod   
      sourceRepos:
      - https://dev.azure.com/PepsiCoIT/Global_Data_Project/_git/admin-dashboard-argocd-configs
      - pepeiapprodcommonacr.azurecr.io/helm
      destinations:
      - name: pep-eiap-preprod-scus-global-01-aks
        namespace: pep-eiap-och-na-preprod
      - name: pep-eiap-preprod-scus-global-01-aks
        namespace: pep-eiap-ops-admin
      roles:
      - name: admin-dashboard-preprod-admin
        description: Admin privileges to admin-dashboard-preprod
        policies:
        - p, proj:admin-dashboard-preprod:admin-dashboard-preprod-admin, applications, *, admin-dashboard-preprod/*, allow
        - p, proj:admin-dashboard-preprod:admin-dashboard-preprod-admin, repositories, *, admin-dashboard-preprod/*, allow
        groups:
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

      - name: admin-dashboard-preprod-user
        description: Read-only privileges to admin-dashboard-preprod
        policies:
        - p, proj:admin-dashboard-preprod:admin-dashboard-preprod-user, applications, get, admin-dashboard-preprod/*, allow
        - p, proj:admin-dashboard-preprod:admin-dashboard-preprod-user, applications, sync, admin-dashboard-preprod/*, allow
        - p, proj:admin-dashboard-preprod:admin-dashboard-preprod-user, repositories, get, admin-dashboard-preprod/*, allow
         # This line will be replaced by the pipeline script
        - p, proj:admin-dashboard-preprod:admin-dashboard-preprod-user, applications, action/apps/Deployment/restart, admin-dashboard-preprod/*, allow
        groups:
        - "Team.App.DPS.NonProd.NBA"
        - "Team.Support.EIAP.READ"
    