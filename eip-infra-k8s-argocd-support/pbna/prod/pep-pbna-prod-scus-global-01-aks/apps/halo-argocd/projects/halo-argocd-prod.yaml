    apiVersion: argoproj.io/v1alpha1
    kind: AppProject
    metadata:
      name: halo-argocd-prod
      namespace: argocd  
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      labels:
        argocd.argoproj.io/project-inherit: global-app
    spec:
      description: Project for halo-argocd-prod  
      sourceRepos:
      - https://dev.azure.com/PepsiCoIT/HaloCRM_SAFe/_git/halo-argocd-configs
      - pepeiapprodcommonacr.azurecr.io/helm
      destinations:
      - name: pep-pbna-prod-scus-global-01-aks
        namespace: pep-pbna-pbna-savvy-prod
      - name: pep-pbna-prod-scus-global-01-aks
        namespace: pep-pbna-ops-admin
      roles:
      - name: halo-argocd-prod-admin
        description: Admin privileges to halo-argocd-prod
        policies:
        - p, proj:halo-argocd-prod:halo-argocd-prod-admin, applications, *, halo-argocd-prod/*, allow
        - p, proj:halo-argocd-prod:halo-argocd-prod-admin, repositories, *, halo-argocd-prod/*, allow
        groups:
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

      - name: halo-argocd-prod-user
        description: Read-only privileges to halo-argocd-prod
        policies:
        - p, proj:halo-argocd-prod:halo-argocd-prod-user, applications, get, halo-argocd-prod/*, allow
        - p, proj:halo-argocd-prod:halo-argocd-prod-user, applications, sync, halo-argocd-prod/*, allow
        - p, proj:halo-argocd-prod:halo-argocd-prod-user, repositories, get, halo-argocd-prod/*, allow
         # This line will be replaced by the pipeline script
        groups:
        - "Team.Support.OCH.NA.DigitalSales.Developer"
        - "Team.Support.EIAP.READ"
    