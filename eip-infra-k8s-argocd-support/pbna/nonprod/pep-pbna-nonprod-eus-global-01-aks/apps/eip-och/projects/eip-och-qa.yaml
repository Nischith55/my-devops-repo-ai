    apiVersion: argoproj.io/v1alpha1
    kind: AppProject
    metadata:
      name: eip-och-qa
      namespace: argocd  
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      labels:
        argocd.argoproj.io/project-inherit: global-app
    spec:
      description: Project for eip-och-qa   
      sourceRepos:
      - https://dev.azure.com/PepsiCoIT/EIP-Services/_git/eip-och-argocd-configs
      - pepeiapnonprodcommonacr.azurecr.io/helm
      destinations:
      - name: pep-pbna-nonprod-eus-global-01-aks
        namespace: pep-pbna-pbna-savvy-qa
      - name: pep-pbna-nonprod-eus-global-01-aks
        namespace: pep-pbna-ops-admin
      roles:
      - name: eip-och-qa-admin
        description: Admin privileges to eip-och-qa
        policies:
        - p, proj:eip-och-qa:eip-och-qa-admin, applications, *, eip-och-qa/*, allow
        - p, proj:eip-och-qa:eip-och-qa-admin, repositories, *, eip-och-qa/*, allow
        groups:
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"
        - "Team.Support.EIAP.GLOBAL.DevSecOps.Developer"

      - name: eip-och-qa-user
        description: Read-only privileges to eip-och-qa
        policies:
        - p, proj:eip-och-qa:eip-och-qa-user, applications, get, eip-och-qa/*, allow
        - p, proj:eip-och-qa:eip-och-qa-user, applications, sync, eip-och-qa/*, allow
        - p, proj:eip-och-qa:eip-och-qa-user, repositories, get, eip-och-qa/*, allow
         # This line will be replaced by the pipeline script
        - p, proj:eip-och-qa:eip-och-qa-user, applications, action/apps/Deployment/restart, eip-och-qa/*, allow
        groups:
        - "Team.Support.OCH.NA.DigitalSales.Developer"
        - "Team.Support.EIAP.READ"
    