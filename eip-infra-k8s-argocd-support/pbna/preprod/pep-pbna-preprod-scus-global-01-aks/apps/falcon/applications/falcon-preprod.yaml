apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: falcon-bootstrapper-pep-pbna-preprod-scus-global-01-aks
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: argocd
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
  sources:
  - ref: values
    repoURL: https://dev.azure.com/PepsiCoIT2/InfoSec_Falcon_Upgradation/_git/pep-falcon-aisp-aks-argocd-configs
    targetRevision: develop
  - repoURL: pepeiapprodcommonacr.azurecr.io/helm
    targetRevision: 0.2.4
    chart: argocd-app-bootstrapper
    helm:
      releaseName: falcon-pep-pbna-preprod-scus-global-01-aks
      valueFiles:
      - $values/preprod/pbna/pep-pbna-preprod-scus-global-01-aks/argocd-app-configs.yaml
      values: |
        global:
          env: preprod
          helm:
            enabled: false
          spec:
            project: 'falcon-pep-pbna-preprod-scus-global-01-aks'
            source:
              repoURL: https://dev.azure.com/PepsiCoIT2/InfoSec_Falcon_Upgradation/_git/pep-falcon-aisp-aks-argocd-configs
              repoName: pep-falcon-aisp-aks-argocd-configs
              targetRevision: develop
              manifest: helm-values.yaml
            sync:
              prune: false
            notifications:
              teamsChannel: argo-notifications
