# ##
# CHANGELOG:
# 2021-09:
#   - added Ansible 2.10 variables collections_paths
# ##
# IMPORTANT:
# - ansible.cfg search order:
#   (ANSIBLE_CONFIG [env], ansible.cfg (cur_dir), ~/.ansible.cfg)
#   Ansible will process the above list and use the first file found,
#   ALL others are IGNORED.
#
# Ansible Config Sample file for executing the playbooks in this project.
# IMPORTANT: Read the security warning regarding world writable directories
# where this is hosted.

# Nearly all parameters can be overridden in ansible-playbook
# or with command line flags. Ansible will read ANSIBLE_CONFIG,
# ansible.cfg in the current working directory, .ansible.cfg in
# the home directory, or /etc/ansible/ansible.cfg, whichever it
# finds first

# For a full list of available options, run ansible-config list or see the
# documentation: https://docs.ansible.com/ansible/latest/reference_appendices/config.html.

[defaults]
# IMPORTANT: This requires Ansible version 2.7 or greater and jinja2 > 2.10
# read the docs --
# This option preserves variable types during template operations. This
# requires Jinja2 >= 2.10.
# For a description of what bugs you will face please refer to the issue
# https://github.com/ansible/ansible/issues/47795
# 2021:
#  swicthing it back to no
#  see: https://github.com/ansible/ansible/issues/65981
# REMEMBER -- setting it to yes, will return native types so things like
# int filter etc will work. BUT, this will not allow {% raw %} tags to
# work correctly
jinja2_native = yes
ansible_managed = Ansible managed: modified on %Y-%m-%d %H:%M:%S

# NOTE: added in v2.10 ansible (env var: COLLECTIONS_PATHS)
collections_paths = ~/.ansible/collections-ansible211:~/.ansible/collections:/usr/share/ansible/collections
# A boolean to enable or disable scanning the sys.path for installed collectionsA boolean to enable or
# disable scanning the sys.path for installed collections (env var: COLLECTIONS_SCAN_SYS_PATH)
collections_scan_sys_path = true

# default plugin to mute output
#  see https://docs.ansible.com/ansible/latest/plugins/callback/default.html)
display_skipped_hosts = no

# default inventory directory Just the common one,
#inventory       =  src/main/ansible/inventory/azure/common
library         = src/main/ansible/plugin/modules:~/.ansible/plugins/modules:/usr/share/ansible/plugins/modules
module_utils    = src/main/ansible/plugin/module_utils:~/.ansible/plugins/module_utils:/usr/share/ansible/plugins/module_utils
action_plugins = src/main/ansible/plugins/action:~/.ansible/plugins/action:/usr/share/ansible/plugins/action
inventory_plugins = src/main/ansible/plugins/inventory:~/.ansible/plugins/inventory:/usr/share/ansible/plugins/inventory
lookup_plugins = src/main/ansible/plugins/lookup:~/.ansible/plugins/lookup:/usr/share/ansible/plugins/lookup
filter_plugins = src/main/ansible/plugins/filter:~/.ansible/plugins/filter:/usr/share/ansible/plugins/filter
#remote_tmp      = ~/.ansible/tmp
#local_tmp       = ~/.ansible/tmp
#forks           = 5
#poll_interval   = 0.001
#ask_pass        = False
#transport       = smart

# Paths to search for roles, colon separated, we add roles subdirectory from
# current working directory
roles_path = src/main/ansible/roles:~/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles
#roles_path = src/test/ansible/roles:~/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles
# Don't like colors either?
# set to 1 if you don't want colors, or export ANSIBLE_NOCOLOR=1
#
#nocolor = 1

# pretty print (debug, yaml, json, actionable, dense, minimal)
stdout_callback = default
result_format = yaml

deprecation_warnings = False
# MRK
#inventory_root = src/main/ansible/inventory
#playbooks_root = src/main/ansible/playbooks

#system_warnings = False

; ~~~
; inventory configuration
; ~~~
[inventory]
#enable_plugins = host_list, script, auto, yaml, ini, toml
#enable_plugins = yaml
# List of extensions to ignore when using a directory as an inventory source
# {{(REJECT_EXTS + ('.orig', '.ini, '.cfg', '.retry'))}}
# ignore our extensions
ignore_extensions = .pyc, .yml.j2, .md, .sh, .conf
# List of patterns to ignore when using a directory as an inventory source
# ignore_patterns =

[colors]
#highlight = white
#verbose = blue
verbose = white
#warn = bright purple
error = bright red
#debug = dark gray
#deprecate = purple
#skip = cyan
#unreachable = red
#ok = green
#changed = yellow
#diff_add = green
#diff_remove = red
#diff_lines = cyan

# Please be vary careful with this
[ssh_connection]

# def: -C -o ControlMaster=auto -o ControlPersist=60s
# NOTE: Do NOT set -o ControlPath here as it will be preferred
ssh_args = -C -o ControlMaster=auto -o ControlPersist=30m -o UserKnownHostsFile=/dev/null
# we will default to scp instead of sftp first
transfer_method = scp
