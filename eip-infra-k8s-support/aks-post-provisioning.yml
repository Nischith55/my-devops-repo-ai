trigger: none

resources:
 repositories:
    - repository: eip-infra-azure-terraform-support
      type: git
      name: eip-infra-azure-terraform-support
      ref: main

parameters:
  - name: Functional_Area
    displayName: Functional Area
    type: string
    values:
      - eiap
      - edap
      - pfna
      - automation
      - snt
      - cmp
      - aisp
      - infratools
      - infosectools
      - pbna
      - dps
      - pepgenx
      - globalit
      - cgf

  - name: service_principal
    displayName: Service Principal
    type: string
    values:  
      - NONPROD_K8S_SPN
      - PREPROD_K8S_SPN
      - PROD_K8S_SPN

  - name: env
    displayName: Environment
    type: string
    values:
      - nonprod
      - preprod
      - prod

  - name: Region
    displayName: Region
    type: string
    values:
      - scus
      - eus
      - gwc
      - suk
      - sea
      - ae
      - na
      - essa
      - apac

  - name: ResourceType
    displayName: Resource Type
    type: string
    values:
      - azure-kubernetes-services

  - name: ClusterType
    displayName: Cluster type
    type: string
    values:
      - global
      - infra 
  
  - name: Schedule
    displayName: schedule time */15 * * * *
    type: string

  - name: ResourceGroupName
    displayName: Resource Group Name
    type: string

  - name: ResourceName
    displayName: AKS Cluster Name
    type: string

  - name: StorageClasses
    displayName: Storage Classes
    type: boolean
    default: 'false'

  - name: GpuOperator
    displayName: GPU Operator
    type: boolean
    default: 'false'

  - name: storageAccount 
    displayName: Standard Storage Account
    type: string
    default: ' '

  - name: premiumstorageaccounts 
    displayName: Premium Storage Account
    type: string
    default: ' '

  - name: GPU_Operator_Helm_Chart_Version
    displayName: Helm-chart-version-for-GPU-Operator [Required if enabled]
    type: string
    default: 'v24.9.1'
        
  - name: filename
    displayName: Cert File Name(.pfx filename)
    type: string
  
  - name: elastichost 
    displayName: elastichost (Ex:- https://e6219866bfdc4f498cc01c3450d994ab.privatelink.francecentral.azure.elastic-cloud.com:9243)
    type: string 
  
  - name: elastic_public_ip
    displayName: Elastic Public Endpoint IP
    type: string


####################################################################################################################################################################################################################
 
####################################################################################################################################################################################################################

variables:
  - group: preprod_nonprod_ansible_azure_secrets
  - group: prod_ansible_azure_secrets
  - group: repo_access_token
  - group: linux_windows_profiles

  - name: nonprod_eus_agents
    value: pep-eiap-nonprod-eus-infra-02-aks-agents

  - name: nonprod_scus_agents
    value: pep-eiap-nonprod-scus-infra-02-aks-agents

  - name: preprod_eus_agents
    value: pep-eiap-preprod-eus-infra-02-aks-agents

  - name: preprod_scus_agents
    value: pep-eiap-preprod-scus-infra-02-aks-agents

  - name: prod_eus_agents
    value: pep-eiap-prod-eus-infra-02-aks-agents

  - name: prod_scus_agents
    value: pep-eiap-prod-scus-infra-02-aks-agents
    
  - name: approval_ITEIAPAZUREPlatformServices 
    value: ITEIAPAZUREPlatformServices@pepsico.com
  - name: approval_ITEIAPCICDSupportServices
    value: ITEIAPCICDSupportServices@pepsico.com
  - name: approval_AzureAutomation
    value: DL-AzureAutomation@pepsico.com

  - name: agent_pool
    ${{ if and(eq(parameters.env, 'nonprod'), or(eq(parameters.Region, 'eus'),eq(parameters.Region, 'gwc'),eq(parameters.Region, 'suk'))) }}:
      value: $(nonprod_eus_agents)
    ${{ elseif and(eq(parameters.env, 'nonprod'), or(eq(parameters.Region, 'scus'),eq(parameters.Region, 'sea'),eq(parameters.Region, 'ae'))) }}:
      value: $(nonprod_scus_agents)
    ${{ elseif and(eq(parameters.env, 'preprod'), or(eq(parameters.Region, 'eus'),eq(parameters.Region, 'gwc'),eq(parameters.Region, 'suk'))) }}:
      value: $(preprod_eus_agents)
    ${{ elseif and(eq(parameters.env, 'preprod'), or(eq(parameters.Region, 'scus'),eq(parameters.Region, 'sea'),eq(parameters.Region, 'ae'))) }}:
      value: $(preprod_scus_agents)
    ${{ elseif and(eq(parameters.env, 'prod'), or(eq(parameters.Region, 'eus'),eq(parameters.Region, 'sea'),eq(parameters.Region, 'ae'))) }}:
      value: $(prod_eus_agents)
    ${{ elseif and(eq(parameters.env, 'prod'), or(eq(parameters.Region, 'scus'),eq(parameters.Region, 'gwc'),eq(parameters.Region, 'suk'))) }}:
      value: $(prod_scus_agents) 
    ${{ else }}:
      value: $(nonprod_eus_agents)

  - name: terraform_modules_repo
    value: "https://PepsiCoIT@dev.azure.com/PepsiCoIT/EIP-Infrastructure/_git/eip-infra-terraform-modules"  
   

  - name: resource_name_input
    value: ${{parameters.ResourceName}}

  - name: secure_access_key_kc
    ${{ if contains(parameters.ResourceName, 'sbox') }}:
      value: $(sbox_storage_access_key)
    ${{ else }}:
      value: $(storage_access_key)
  
