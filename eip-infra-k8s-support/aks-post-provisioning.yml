    ${{ elseif and(eq(parameters.env, 'preprod'), eq(parameters.Functional_Area, 'aisp')) }}:
      value: 8a22bd18-1080-472c-a8af-da15be88b076
    ${{ elseif and(eq(parameters.env, 'prod'), eq(parameters.Functional_Area, 'aisp')) }}:
      value: 06d0e1b4-b6e3-43c3-9f97-29e840d4d893
    ${{ elseif and(or(eq(parameters.env, 'nonprod'),eq(parameters.env, 'preprod')), eq(parameters.Functional_Area, 'cgf')) }}:
      value: 0c1319a6-1def-4d09-a0ca-46d9b0812fbd
    ${{ elseif and(eq(parameters.env, 'prod'), eq(parameters.Functional_Area, 'cgf')) }}:
      value: f479bd9e-6531-43ea-85eb-cc6c21b4957b
    ${{ else }}:
      value: Using-subscription-id-available-in-keyvault
  
  - name: subscription_id_other_regions
    ${{ if and(eq(parameters.Region, 'suk'), eq(parameters.Functional_Area, 'eiap'), eq(parameters.ResourceType, 'storage-account'), eq(parameters.env, 'nonprod')) }}:
      value: 154431fe-c911-490e-87a0-c84ced2bee05
    ${{ elseif and(eq(parameters.Region, 'suk'), eq(parameters.Functional_Area, 'eiap'), or(eq(parameters.env, 'nonprod'), eq(parameters.env, 'preprod'))) }}:
      value: 8a22bd18-1080-472c-a8af-da15be88b076
    ${{ elseif and(eq(parameters.Region, 'gwc'), eq(parameters.Functional_Area, 'eiap'), or(eq(parameters.env, 'nonprod'), eq(parameters.env, 'preprod'))) }}:
      value: 8a22bd18-1080-472c-a8af-da15be88b076
    ${{ elseif and(eq(parameters.Region, 'ae'), eq(parameters.Functional_Area, 'eiap'), or(eq(parameters.env, 'nonprod'), eq(parameters.env, 'preprod'))) }}:
      value: 8a22bd18-1080-472c-a8af-da15be88b076
    ${{ else }}:
      value: Using-subscription-id-available-in-keyvault

  - name: currentbranch
    value: $(Build.SourceBranchName)

  - name: k8s_sp  
    ${{ if eq(parameters.env, 'nonprod') }}:
      value: bbb2f5e3-8297-495c-a66d-ec21d27823ff
    ${{ if eq(parameters.env, 'preprod') }}:
      value: c93e3f5f-6cfa-4c4d-820e-ff53b9168f4a
    ${{ if eq(parameters.env, 'prod') }}:
      value: 60fd3acd-e12c-4a61-b55f-752cb9b28233


  - name: devsecops_cd
    ${{ if eq(parameters.env, 'nonprod') }}:
      value: 17e4954c-637f-4c1c-bb3a-ff0a6a69a108
    ${{ if eq(parameters.env, 'preprod') }}:
      value: 89b32fe8-f980-4857-8c26-37e763ddb047
    ${{ if eq(parameters.env, 'prod') }}:
      value: eea00c38-1800-4362-98ea-2e594b4585f5

  - name: cmp
    ${{ if eq(parameters.env, 'nonprod') }}:
      value: 7f6ff09f-c5e7-4555-a897-dac0649b2aaa
    ${{ if eq(parameters.env, 'preprod') }}:
      value: 8cf61482-31d6-4e96-a7a5-f6528b85abe0
    ${{ if eq(parameters.env, 'prod') }}:
      value: 6d01d83f-30c2-45d6-841d-e2530cbb7b03

  - name: eiap_k8s_admin
    value: 367dfb5d-8aed-4dcf-9366-6024024bfb94

  - name: eiap_admins
    value: fbdad232-1e31-4027-a8e2-4528fbbd01b7

  - name: acrpullbindingName
    ${{ if eq(parameters.env, 'nonprod') }}:
      value: pepeiapnonprodcommonacr
    ${{ if eq(parameters.env, 'preprod') }}:
      value: pepeiapprodcommonacr
    ${{ if eq(parameters.env, 'prod') }}:
      value: pepeiapprodcommonacr

  - name: infrans
    ${{if and(eq(parameters.env, 'nonprod'),eq(parameters.ClusterType, 'infra')) }}:
      value: infra-dev
    ${{elseif and(eq(parameters.env, 'nonprod'),eq(parameters.ClusterType, 'global')) }}:
      value: global-dev
    ${{ elseif and(eq(parameters.env, 'preprod'),eq(parameters.ClusterType, 'infra')) }}:
      value: infra-preprod
    ${{ elseif and(eq(parameters.env, 'preprod'),eq(parameters.ClusterType, 'global')) }}:
      value: global-preprod
    ${{ elseif and(eq(parameters.env, 'prod'),eq(parameters.ClusterType, 'infra')) }}:
      value: infra-prod
    ${{ elseif and(eq(parameters.env, 'prod'),eq(parameters.ClusterType, 'global')) }}:
      value: global-prod



####################################################################################################################################################################################################################
 
####################################################################################################################################################################################################################


stages:   

  - stage: display
    displayName: Display-User-Defined-Parameters
    pool: 
      name: $(agent_pool)
    jobs: 
      - job: Display_User_Inputs
        displayName: User-selected-parameters
        continueOnError: false
        steps:
        - task: Bash@3
          displayName: "Display user-selected-parameters"
          inputs: 
            targetType: 'inline'
            script: |    
              echo "Checked out branch: $(Build.SourceBranch)"
              echo "Selected Environment : ${{Parameters.env}}"
              echo "Functional Area : ${{parameters.Functional_Area}}"
              echo "Selected Region : ${{Parameters.Region}}"
              echo "Agent Pool to be used for all stages : ${{variables.agent_pool}}"
              echo "Resource Group Name : ${{parameters.ResourceGroupName}}"
              echo "AKS Cluster Name :  ${{parameters.ResourceName}}"
              echo "Storage Account Name:  ${{parameters.storageAccount}}"
              echo "GPU Operator Helm chart Version:  ${{parameters.GPU_Operator_Helm_Chart_Version}}"
              


####################################################################################################################################################################################################################
 
####################################################################################################################################################################################################################
  - stage: checkforapproval
    displayName: Manualcheck-for-selected-parameters
    dependsOn: display
    pool: 
      name: $(agent_pool)
    jobs:
    - job: approval
      pool: server
      timeoutInMinutes: 5 # job times out in 5 min
      steps:
      - task: ManualValidation@0
        timeoutInMinutes: 6 # task times out in 6 min
        inputs:
          instructions: 'validate the user selected parameters before proceeding'

####################################################################################################################################################################################################################
 
####################################################################################################################################################################################################################

  - stage: kube_configs_extract
    displayName: Extract-Admin-and-User-Kube-Configs
    dependsOn: checkforapproval
    condition: and(succeeded('checkforapproval'), ne(variables['build.sourceBranch'], 'refs/heads/develop'))
    pool: 
        name: $(agent_pool)
    jobs:
    - template: src/main/ansible/playbooks/k8s/templates/aks-post-provisioning-templates/extract_kube_configs.yml
      parameters:
        Functional_Area: ${{parameters.Functional_Area}}
        env: ${{ parameters.env }}
        Region: ${{ parameters.Region }}
        ResourceType: ${{ parameters.ResourceType }} 
        service_principal: ${{parameters.service_principal}}
        service_principal_backend: ${{variables.backend_spn}}
        resource_name: ${{variables.resource_name_input}}
        ResourceGroupName: ${{parameters.ResourceGroupName}}


####################################################################################################################################################################################################################
 
####################################################################################################################################################################################################################


  - stage: AKS_POST_PROVISIONING
    displayName: Post-Provisioining
    dependsOn: kube_configs_extract
    condition: and(succeeded('kube_configs_extract'), ne(variables['build.sourceBranch'], 'refs/heads/develop'))    
    pool: 
      name: $(agent_pool)
    jobs:
    - template: src/main/ansible/playbooks/k8s/templates/aks-post-provisioning-templates/AKS_Post_Provisioning.yml
      parameters:
        Functional_Area: ${{parameters.Functional_Area}}
        env: ${{parameters.env}}
        Region: ${{parameters.Region }}
        schedule_time: ${{parameters.Schedule}}
        ResourceType: ${{parameters.ResourceType}}  
        service_principal: ${{parameters.service_principal}}
        service_principal_backend: ${{variables.backend_spn}}
        resource_name: ${{variables.resource_name_input}}
        currentbranch: ${{variables.currentbranch}}
        k8s_sp : ${{variables.k8s_sp}}
        devsecops_cd : ${{variables.devsecops_cd}}
        cmp: ${{variables.cmp}}
        eiap_k8s_admin : ${{variables.eiap_k8s_admin}}
        eiap_admins : ${{variables.eiap_admins}}
        ResourceName : ${{parameters.ResourceName}}  
        ResourceGroupName : ${{parameters.ResourceGroupName}}  
        acrpullbindingName : ${{variables.acrpullbindingName}}
        infrans: ${{variables.infrans}}
        storageAccount : ${{parameters.storageAccount}}
        premiumstorageaccounts : ${{parameters.premiumstorageaccounts}}
        storageClasses : ${{parameters.StorageClasses }}
        gpuOperator: ${{parameters.GpuOperator }}
        gpuversion : ${{parameters. GPU_Operator_Helm_Chart_Version}}
        filename: ${{parameters.filename}}
        elastichost: ${{parameters.elastichost}}
        elastic_public_ip: ${{parameters.elastic_public_ip}}
        secure_access_key_kc: ${{variables.secure_access_key_kc}}
        snow_discovery_pwd: $(snow_discovery_pwd)


####################################################################################################################################################################################################################
#----------------------------------------------------------#End of template-------------------------------------------
