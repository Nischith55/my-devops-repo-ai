---
# apiVersion and kind of Kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- daemonset.yml

configMapGenerator:
- name: pep-eiap-aks-init-configs
  # create|replace|merge
  behavior: create
  files:
  - configs/timesyncd.conf
  - configs/zzz-eiap-limits.conf
  - configs/zzz-sysctl-aks-eiap.conf
  - scripts/entrypoint.sh
  - scripts/apply-node-changes.sh
  options:
    disableNameSuffixHash: true
