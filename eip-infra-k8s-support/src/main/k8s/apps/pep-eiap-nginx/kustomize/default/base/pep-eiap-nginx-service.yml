  namespace: pep-eiap-global-infra-dev
  labels:
    app: *aid001
spec:
  ports:
  - name: http-8080
    port: 8080
    protocol: TCP
    targetPort: 8080
  selector:
    app: *aid001
  #sessionAffinity: None
  type: ClusterIP
