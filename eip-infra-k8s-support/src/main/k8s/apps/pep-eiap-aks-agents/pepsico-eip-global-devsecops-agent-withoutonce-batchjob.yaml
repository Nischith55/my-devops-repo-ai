#        KUBERNETES JOB TEMPLATE              #
######################################################

# Placeholders enclosed inside double braces {{PLACEHOLDERS}} - Replace this with actual values during implementation

# Job Resource
---
apiVersion: batch/v1
kind: Job
metadata:
  name: pepsico-eip-global-devsecops-agent-withoutonce-batchjob
  namespace: pep-eiap-global-devsecops-dev     # Kubernetes Namespace in which the deployment will be perfomed. Example: pep-eip-latam-akv-dev-ns
spec:
  completions: 1  # Number of fixed completion count
  parallelism: 1  # Number of Parallel Jobs
  template:
    spec:
      imagePullSecrets:
      - name: pep-eiap-svc-global-devsecops-sp-regcred # Secret name created earlier
      containers:
      - name: pepsico-eip-global-devsecops-agent
        image: pepeiapnonprodcommonacr.azurecr.io/pep/eip/infra/azurepipeline/devopsagent:20210714.2
        imagePullPolicy: Always
        resources:
          requests:
            memory: "4Gi"
            cpu: "1000m"
          limits:
            memory: "8Gi"
            cpu: "8000m"
        command:
              - "./start-withoutonce.sh"
        envFrom:
        - secretRef:
            name: pep-eiap-infra-backend-support
        - secretRef:
            name: pep-eiap-svc-global-devsecops-azdevops
        volumeMounts:
        - mountPath: "/mnt/azure"
          name: volume
      serviceAccountName: pep-eiap-buildagent
      nodeSelector:        # Agent pool restriction
        agentpool: npu02
      tolerations:
      - key: "BuildAgentPool"
        operator: "Exists"
        effect: "NoSchedule"
      restartPolicy: "OnFailure"
      volumes:
      - name: volume
        persistentVolumeClaim:
          claimName: pvc-azurefile-devops