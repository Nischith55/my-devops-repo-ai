apiVersion: v1
kind: Pod
metadata:
  name: testpod
  namespace: pep-pbna-pbna-pepcommerc-dev
spec:
  serviceAccount: pep-pbna-pbna-pepcommerc-dev-sa
  containers:
    - name: test-container
      image: registry.k8s.io/busybox
      command: [ "/bin/sh", "-c", "env && sleep 6000" ]
      env:
        - name: SPECIAL_LEVEL_KEY
          valueFrom:
            configMapKeyRef:
              name: pep-och-application-env-configmap
              key: application-dev.yml
  restartPolicy: Never  