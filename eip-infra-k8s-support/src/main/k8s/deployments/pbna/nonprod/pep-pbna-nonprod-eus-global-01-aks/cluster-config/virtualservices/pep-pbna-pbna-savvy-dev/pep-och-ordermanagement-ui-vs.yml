apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-och-ordermanagement-ui
  name: pep-och-ordermanagement-ui-vs
  namespace: pep-pbna-pbna-savvy-dev
spec:
  gateways:
  - pep-pbna-pbna-savvy-dev/pep-pbna-pbna-savvy-dev-cv-gw
  hosts:
  - pep-och-ordermanagement-ui.pbna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - corsPolicy:
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Link
      - Content-Type
      - Access-Control-Allow-Origin
      allowMethods:
      - POST
      - GET
      - DELETE
      - PATCH
      - PUT
      - OPTIONS
      allowOrigins:
      - exact: https://pep-och-ui.pbna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
      exposeHeaders:
      - x-total-count
      - x-source
    match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-och-ordermanagement-ui.pep-pbna-pbna-savvy-dev.svc.cluster.local
        port:
          number: 80
