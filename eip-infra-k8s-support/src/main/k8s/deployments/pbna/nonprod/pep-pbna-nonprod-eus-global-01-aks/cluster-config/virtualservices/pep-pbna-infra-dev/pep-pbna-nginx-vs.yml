apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-pbna-nginx
  name: pep-pbna-nginx-vs
  namespace: pep-pbna-infra-dev
spec:
  gateways:
  - pep-pbna-infra-dev/pep-pbna-infra-dev-cv-gw
  hosts:
  - pep-pbna-nginx-curl.pbna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-pbna-nginx.pep-pbna-infra-dev.svc.cluster.local
        port:
          number: 8080
