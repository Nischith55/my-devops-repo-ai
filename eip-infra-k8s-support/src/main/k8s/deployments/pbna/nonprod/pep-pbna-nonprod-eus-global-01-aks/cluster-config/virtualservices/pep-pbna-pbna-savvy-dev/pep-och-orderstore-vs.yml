apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-och-orderstore
  name: pep-och-orderstore-vs
  namespace: pep-pbna-pbna-savvy-dev
spec:
  gateways:
  - pep-pbna-pbna-savvy-dev/pep-pbna-pbna-savvy-dev-cv-gw
  hosts:
  - pep-och-orderstore.pbna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    - ignoreUriCase: true
      uri:
        prefix: /management     
    route:
    - destination:
        host: pep-och-orderstore.pep-pbna-pbna-savvy-dev.svc.cluster.local
        port:
          number: 80
