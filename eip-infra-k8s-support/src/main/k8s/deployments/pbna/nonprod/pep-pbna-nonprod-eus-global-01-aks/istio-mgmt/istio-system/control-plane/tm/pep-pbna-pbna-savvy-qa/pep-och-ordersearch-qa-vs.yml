apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-och-ordersearch-qa-vs
  namespace: pep-pbna-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-och-ordersearch-qa.pbna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-och-ordersearch.pep-pbna-pbna-savvy-qa.svc.cluster.local
        port: 
          number: 80
    corsPolicy:
      allowOrigins:
      - exact: https://pep-och-ui-qa.pbna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
      allowMethods:
      - POST
      - GET
      - DELETE
      - PATCH
      - PUT 
      - OPTIONS
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Link
      - Content-Type
      - Access-Control-Allow-Origin
      exposeHeaders:
      - x-total-count
      - x-source         