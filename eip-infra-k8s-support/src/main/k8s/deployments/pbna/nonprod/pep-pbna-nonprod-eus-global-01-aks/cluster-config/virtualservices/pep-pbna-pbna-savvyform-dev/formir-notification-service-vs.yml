    app: pep-eip-savvy-form
  name: formir-notification-service-vs
  namespace: pep-pbna-pbna-savvyform-dev
spec:
  gateways:
  - pep-pbna-pbna-savvyform-dev/pep-pbna-pbna-savvyform-dev-cv-gw
  hosts:
  - formir-notification-service.pbna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
