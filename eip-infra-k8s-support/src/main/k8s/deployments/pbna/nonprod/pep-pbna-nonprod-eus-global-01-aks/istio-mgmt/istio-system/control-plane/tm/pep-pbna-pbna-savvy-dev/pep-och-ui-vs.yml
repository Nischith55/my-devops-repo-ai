apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-och-ui-vs
  namespace: pep-pbna-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-och-ui.pbna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-och-ui.pep-pbna-pbna-savvy-dev.svc.cluster.local
        port: 
          number: 80