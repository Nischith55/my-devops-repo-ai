apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: formir-notification-service-vs
  namespace: pep-pbna-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - formir-notification-service.pbna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: formir-notification-service.pep-pbna-pbna-savvyform-dev.svc.cluster.local
        port: 
          number: 5000