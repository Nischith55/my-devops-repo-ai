apiVersion: v1
kind: Secret
metadata:
  name: pep-pbna-servicenow-sa-token  # Naming convention followed is ServiceAccountName-token
  namespace: pep-pbna-ops-admin      # Namespace where the service account is created
  annotations:
    kubernetes.io/service-account.name: "pep-pbna-servicenow-sa" # Service Account name to map the token
type: kubernetes.io/service-account-token  # Secret type should be this