apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-och-ordermanagement-ui-vs
  namespace: pep-pbna-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-och-ordermanagement-ui.pbna.gw01.aks01.scus.preprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-och-ordermanagement-ui.pep-pbna-pbna-savvy-preprod.svc.cluster.local
        port: 
          number: 80
    corsPolicy:
      allowOrigins:      
      - exact: https://pep-och-ui.pbna.gw01.aks01.scus.preprod.azure.intra.pepsico.com
      allowMethods:
      - POST
      - GET
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Content-Type
      - Link
      - Access-Control-Allow-Origin
      exposeHeaders:
      - x-total-count 
      - x-source      