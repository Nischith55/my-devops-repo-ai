apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: istio-in-gateway-01
  namespace: istio-system
spec:
  selector:
    istio: pep-pbna-ingress-gw01
  servers:
  - hosts:
    - "*.pbna.gw01.aks01.scus.preprod.azure.intra.pepsico.com" 
    name: istio-in-gateway-01-wildcard-https-443
    port:
      name: https-ppp-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-pbna-preprod-scus-global-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - "*.pbna.gw01.aks01.scus.preprod.azure.intra.pepsico.com"
    name: istio-in-gateway-01-wildcard-http-80
    port:
      name: http-ppp-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true
