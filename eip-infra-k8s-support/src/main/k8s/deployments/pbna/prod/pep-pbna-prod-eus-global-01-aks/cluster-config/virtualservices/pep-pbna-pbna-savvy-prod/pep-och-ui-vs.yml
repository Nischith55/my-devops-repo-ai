apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  annotations: {}
  labels:
    app: pep-och-ui
  name: pep-och-ui-vs
  namespace: pep-pbna-pbna-savvy-prod
spec:
  gateways:
  - pep-pbna-pbna-savvy-prod/pep-pbna-pbna-savvy-prod-cv-gw
  hosts:
  - pep-och-ui.pbna.gw01.aks01.eus.prod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-och-ui.pep-pbna-pbna-savvy-prod.svc.cluster.local
        port:
          number: 80
