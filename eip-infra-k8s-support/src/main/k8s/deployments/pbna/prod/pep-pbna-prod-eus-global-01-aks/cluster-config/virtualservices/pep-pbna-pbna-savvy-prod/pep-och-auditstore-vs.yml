apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  annotations: {}
  labels:
    app: pep-och-auditstore
  name: pep-och-auditstore-vs
  namespace: pep-pbna-pbna-savvy-prod
spec:
  gateways:
  - pep-pbna-pbna-savvy-prod/pep-pbna-pbna-savvy-prod-cv-gw
  hosts:
  - pep-och-auditstore.pbna.gw01.aks01.eus.prod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-och-auditstore.pep-pbna-pbna-savvy-prod.svc.cluster.local
        port:
          number: 80
    corsPolicy:
      allowOrigins:      
      - exact: https://pep-och-ui.pbna.gw01.aks01.eus.prod.azure.intra.pepsico.com
      allowMethods:
      - POST
      - GET
      - PUT
      - DELETE
      - OPTIONS
      - PATCH
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Link
      - Content-Type
      - Access-Control-Allow-Origin
      exposeHeaders:
      - x-total-count         
    
