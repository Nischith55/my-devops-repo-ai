apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  annotations: {}
  labels:
    app: pep-och-orderintakeconsumer
  name: pep-och-orderintakeconsumer-vs
  namespace: pep-pbna-pbna-savvy-prod
spec:
  gateways:
  - pep-pbna-pbna-savvy-prod/pep-pbna-pbna-savvy-prod-cv-gw
  hosts:
  - pep-och-orderintakeconsumer.pbna.gw01.aks01.scus.prod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /management/
    route:
