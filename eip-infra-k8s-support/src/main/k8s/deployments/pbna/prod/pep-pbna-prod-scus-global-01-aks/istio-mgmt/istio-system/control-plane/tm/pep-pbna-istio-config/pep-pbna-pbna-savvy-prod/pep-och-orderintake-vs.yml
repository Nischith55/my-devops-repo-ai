apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-och-orderintake-vs
  namespace: pep-pbna-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-och-orderintake.pbna.gw01.aks01.scus.prod.azure.intra.pepsico.com
