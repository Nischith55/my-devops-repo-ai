---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pep-apigee-disasterrecovery-clusterrole
rules: 
-   apiGroups:
    - "apps"
    resources:
    - deployments/scale
    - deployments
    verbs:
    - get
    - list
    - patch
    - update
-   apiGroups:
    - "batch"
    resources:
    - cronjobs
    verbs:
    - get
    - list
    - patch
    - update
-   apiGroups:
    - ''
    resources:
    - namespaces
    verbs:
    - list
    - get