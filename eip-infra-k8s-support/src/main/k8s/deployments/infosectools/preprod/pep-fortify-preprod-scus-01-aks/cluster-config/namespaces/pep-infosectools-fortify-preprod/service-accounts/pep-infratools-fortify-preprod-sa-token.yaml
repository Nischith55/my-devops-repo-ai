apiVersion: v1
kind: Secret
metadata:
  name: pep-infosectools-fortify-preprod-sa-token  # Naming convention followed is ServiceAccountName-token
  namespace: pep-infosectools-fortify-preprod      # Namespace where the service account is created
  annotations:
    kubernetes.io/service-account.name: "pep-infosectools-fortify-preprod-sa" # Service Account name to map the token
type: kubernetes.io/service-account-token  # Secret type should be this