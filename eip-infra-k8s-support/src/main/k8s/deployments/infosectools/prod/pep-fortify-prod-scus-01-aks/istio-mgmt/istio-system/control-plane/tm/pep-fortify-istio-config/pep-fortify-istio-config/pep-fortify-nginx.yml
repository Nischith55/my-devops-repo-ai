apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-fortify-nginx-vs
  namespace: pep-fortify-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-fortify-nginx.fortify.gw01.aks01.scus.prod.azure.intra.pepsico.com
  #pep-fortify-nginx-curl.latam.opsbridge.gw01.aks01.eus.nonprod.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-fortify-nginx.pep-fortify-infra-prod.svc.cluster.local
        port: 
          number: 8080