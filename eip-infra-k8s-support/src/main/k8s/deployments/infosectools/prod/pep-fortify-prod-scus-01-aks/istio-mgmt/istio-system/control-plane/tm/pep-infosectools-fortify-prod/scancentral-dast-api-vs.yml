apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: scancentral-dast-api-vs
  namespace: pep-fortify-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - scancentral-dast-api.fortify.gw01.aks01.scus.prod.azure.intra.pepsico.com
  - dastapi.pepasm.net 
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: scancentral-dast-api.pep-infosectools-fortify-prod.svc.cluster.local
        port: 
          number: 80