apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-pepgenx-nginx-vs
  namespace: pep-pepgenx-global-dev
spec:
  gateways:
  - pep-pepgenx-global-dev/pep-pepgenx-global-dev-cv-gw
  hosts:
  - pep-pepgenx-nginx.pepgenx.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-pepgenx-nginx.pep-pepgenx-global-dev.svc.cluster.local
        port: 
          number: 8080