apiVersion: v1
kind: ConfigMap
metadata:
  # NOTE: change this for instance of elastic running
  name: nonprod-eus-global-01-aks-k8s-metricbeat-config
  namespace: pep-pepgenx-elastic-client-01

data:

  K8S_CLUSTER_NAME: pep-pepgenx-nonprod-eus-global-01-aks

  metricbeat-processor.yml: |

    processors:

    - drop_event:
        when:
          not:
            or:
              - equals:
                  kubernetes.node.labels.elastic-group: AskAdaZonedPools
              - equals:
                  event.module: prometheus


    - add_fields:
        fields:
          ls-destination: "EUS"
          pep-aks-cluster: ${K8S_CLUSTER_NAME}

    - add_host_metadata: {}
    - add_cloud_metadata: {}
    - add_kubernetes_metadata: {}

    - add_tags:
        tags: ["NONPROD-EUS-Shared", "retain-logs"]

    - script:
        lang: javascript
        source: >
          function process(event) {
            event.Put("fields.sn-application", "metrics-pep-pepgenx-nonprod-eus-global-01-aks" + "-" + event.Get("kubernetes.namespace"));
            return event;
          }   
    # ~~
    # Logging
    # ~~
    logging:
      level: INFO
      metrics:
        enabled: true

  metricbeat.yml: |
    setup.template.name: "metrics-kubernetes-tsds"
    setup.template.pattern: "metrics-*"
    setup.ilm.enabled: false     

    output.elasticsearch:
        hosts: [https://pepaskadadev-2769af.es.privatelink.eastus.azure.elastic-cloud.com:443]
        api_key: "qh1S9Z8BR5NJfQSJ2bvN:-WWXV6NU_bNF9YyMHuTsYw"
        index: "%{[fields][sn-application]}"
        # worker: 2
        # bulk_max_size: 1000
        ssl.verification_mode: none
        timeout: 90s
    metricbeat:

      # ~~
      # modules
      # ~~
      modules:

      - module: system
        enabled: false

      - module: kubernetes
        enabled: true
        add_metadata: true
        period: 30s
        hosts:
        - kube-state-metrics.${KUBE_STATE_METRICS_NAMESPACE}.svc:${KUBE_STATE_METRICS_PORT}
        metricsets:
        - state_node
        - state_deployment
        - state_daemonset
        - state_replicaset
        - state_pod
        - state_container
        - state_cronjob
        - state_resourcequota
        - state_statefulset
        - state_service
        - state_persistentvolume
        - state_persistentvolumeclaim
        - state_storageclass
        # k8s events
        - event


      - module: prometheus
        period: 60s
        hosts: ["https://nvidia-dcgm-exporter.pepgenx.gw01.aks01.eus.nonprod.azure.intra.pepsico.com"]
        metrics_path: /metrics
        ssl.verification_mode: "none"
        metricsets: ["collector"]



      - module: prometheus
        period: 60s
        hosts: ["https://pep-aisp-metrics-nemoretriever-page-elements-dev.pepgenx.gw01.aks01.eus.nonprod.azure.intra.pepsico.com"]
        metrics_path: /v1/metrics
        ssl.verification_mode: "none"
        metricsets: ["collector"]

      - module: prometheus
        period: 60s
        hosts: ["https://pep-aisp-metrics-nemoretriever-table-structure-dev.pepgenx.gw01.aks01.eus.nonprod.azure.intra.pepsico.com"]
        metrics_path: /v1/metrics
        ssl.verification_mode: "none"
        metricsets: ["collector"]

      - module: prometheus
        period: 60s
        hosts: ["https://pep-aisp-metrics-embedqa-dev.pepgenx.gw01.aks01.eus.nonprod.azure.intra.pepsico.com"]
        metrics_path: /v1/metrics
        ssl.verification_mode: "none"
        metricsets: ["collector"]

      - module: prometheus
        period: 60s
        hosts: ["https://pep-aisp-metrics-nv-ingest-ocr-dev.pepgenx.gw01.aks01.eus.nonprod.azure.intra.pepsico.com"]
        metrics_path: /v1/metrics
        ssl.verification_mode: "none"
        metricsets: ["collector"]

      - module: prometheus
        period: 60s
        hosts: ["https://pep-aisp-pepgenx-nim-vlm-image-captioning.pepgenx.gw01.aks01.eus.nonprod.azure.intra.pepsico.com"]
        metrics_path: /v1/metrics
        ssl.verification_mode: "none"
        metricsets: ["collector"]

      - module: prometheus
        period: 60s
        hosts: ["https://pep-aisp-metrics-llama-32-nv-rerankqa-dev.pepgenx.gw01.aks01.eus.nonprod.azure.intra.pepsico.com"]
        metrics_path: /v1/metrics
        ssl.verification_mode: "none"
        metricsets: ["collector"]

      - module: prometheus
        period: 60s
        hosts: ["https://pep-aisp-pepgenx-nv-ingest-dev.pepgenx.gw01.aks01.eus.nonprod.azure.intra.pepsico.com"]
        metrics_path: /v1/ingest/metrics
        ssl.verification_mode: "none"
        metricsets: ["collector"]


