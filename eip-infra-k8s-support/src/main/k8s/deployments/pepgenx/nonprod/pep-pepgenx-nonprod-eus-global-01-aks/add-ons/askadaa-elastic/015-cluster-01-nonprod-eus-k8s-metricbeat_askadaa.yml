---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: metricbeat
  namespace: pep-pepgenx-elastic-client-01
  labels:
    k8s-app: metricbeat
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: metricbeat
  # should be the namespace where metricbeat is running
  namespace: pep-pepgenx-elastic-client-01
  labels:
    k8s-app: metricbeat
rules:
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: metricbeat-kubeadm-config
  namespace: pep-pepgenx-elastic-client-01
  labels:
    k8s-app: metricbeat
rules:
  - apiGroups: [""]
    resources:
      - configmaps
    resourceNames:
      - kubeadm-config
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: metricbeat
subjects:
- kind: ServiceAccount
  name: metricbeat
  namespace: pep-pepgenx-elastic-client-01
- kind: ServiceAccount
  name: metricbeat
  namespace: pep-pepgenx-elastic-client-01
roleRef:
  kind: ClusterRole
  name: metricbeat
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: metricbeat
  namespace: pep-pepgenx-elastic-client-01
subjects:
  - kind: ServiceAccount
    name: metricbeat
    namespace: pep-pepgenx-elastic-client-01
roleRef:
  kind: Role
  name: metricbeat
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: metricbeat-kubeadm-config
  namespace: pep-pepgenx-elastic-client-01
subjects:
  - kind: ServiceAccount
    name: metricbeat
    namespace: pep-pepgenx-elastic-client-01
roleRef:
  kind: Role
  name: metricbeat-kubeadm-config
  apiGroup: rbac.authorization.k8s.io
---
