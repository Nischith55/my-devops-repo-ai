---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pep-pepgenx-devsecops-clusterrole
rules: 
-   apiGroups:
    - ''
    - apps
    - autoscaling
    - extensions
    - batch
    resources:
    - jobs
    - jobs/status
    - cronjobs
    - pods
    - podtemplates
    - pods/attach
    - pods/binding
    - pods/eviction
    - pods/exec
    - pods/log
    - pods/status
    verbs:
    - create
    - get
    - list
    - patch
    - update
    - watch
    - delete
