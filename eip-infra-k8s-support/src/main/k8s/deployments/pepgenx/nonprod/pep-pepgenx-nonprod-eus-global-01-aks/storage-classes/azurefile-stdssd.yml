---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: azurefile-stdssd
mountOptions:
  - vers=3.0
  - dir_mode=0777
  - file_mode=0644
  - mfsymlinks
  - nobrl
  - cache=strict
  - actimeo=30
  - uid=1000
  - gid=1000
parameters:
  resourceGroup: pep-azr-pepgenx2-dev-eus-01-rg
  skuName: StandardSSD_LRS
  storageAccount: pp1003pepgenx01aks01sa
provisioner: file.csi.azure.com
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true