apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
    labels:
        app: pep-eiap-pbna-pog-webapp
    name: pep-eiap-pbna-pog-webapp-vs
    namespace: pep-eiap-pbna-pog-dev
spec:
    gateways:
    - pep-eiap-pbna-pog-dev/pep-eiap-pbna-pog-dev-cv-gw
    hosts:
    - pep-eiap-pbna-pog-webapp.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pog-validator.dev.mypepsico.com
    http:
    -   match:
        -   ignoreUriCase: true
            uri:
                prefix: /
        route:
        -   destination:
                host: pep-eiap-pbna-pog-webapp.pep-eiap-pbna-pog-dev.svc.cluster.local
