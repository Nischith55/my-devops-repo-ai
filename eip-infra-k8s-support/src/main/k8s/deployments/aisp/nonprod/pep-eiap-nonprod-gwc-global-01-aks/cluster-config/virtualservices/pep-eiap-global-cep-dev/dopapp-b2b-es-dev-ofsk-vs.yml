  namespace: pep-eiap-global-cep-dev
  labels:
      app: dopapp-b2b-es-dev
spec:
  hosts:
  - admin-cep-es.global.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
  - admin-cep-es.dev.pepsico.com
  gateways:
  - pep-eiap-global-cep-dev/pep-eiap-global-cep-dev-cv-gw
  http:
