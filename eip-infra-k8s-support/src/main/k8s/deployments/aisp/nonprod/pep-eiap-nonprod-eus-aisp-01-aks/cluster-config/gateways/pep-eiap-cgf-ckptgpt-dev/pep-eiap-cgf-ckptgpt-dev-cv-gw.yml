        port:
            name: http-pep-eiap-cgf-ckptgpt-dev-cv-gw-80
            number: 80
            protocol: http
        tls:
            httpsRedirect: true
    -   hosts:
        - cockpitgpt2.dev.mypepsico.com
        name: pep-eiap-cgf-ckptgpt-dev-cv-gw-3-https-443
