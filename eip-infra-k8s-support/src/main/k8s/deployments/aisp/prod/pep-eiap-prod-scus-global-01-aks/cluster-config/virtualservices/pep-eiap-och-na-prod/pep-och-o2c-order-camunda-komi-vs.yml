  namespace: pep-eiap-och-na-prod
  labels:
      app: pep-och-o2c-order-camunda
spec:
  hosts:
  - pep-och-o2c-order-camunda.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
  gateways:
  - pep-eiap-och-na-prod/pep-eiap-och-na-prod-cv-gw
  http:
  - match:
