apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: pep-aisp-cgf-ckptgpt-prod-cv-gw
  namespace: pep-aisp-cgf-ckptgpt-prod
spec:
  selector:
    istio: pep-aisp-ingress-gw01
  servers:
  - hosts:
    - dummy-passthrough-pep-aisp-cgf-ckptgpt-prod.gw01.aks01.scus.prod.azure.intra.pepsico.com
    name: pep-aisp-cgf-ckptgpt-prod-cv-gw-tls-443
    port:
      name: https-pep-aisp-cgf-ckptgpt-prod-cv-gw-tls-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - dummy-pep-aisp-cgf-ckptgpt-prod-443.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pep-cgpt-cgf-rstrct-query-ui.aisp.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pep-cgpt-cgf-rstrct-query.aisp.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pep-cgpt-cgf-rstrct-sql-exec.aisp.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pep-fpa-cockpitgpt-genai-app.aisp.gw01.aks01.scus.prod.azure.intra.pepsico.com
    name: pep-aisp-cgf-ckptgpt-prod-cv-gw-https-443
    port:
      name: https-pep-aisp-cgf-ckptgpt-prod-cv-gw-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-aisp-prod-scus-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - dummy-pep-aisp-cgf-ckptgpt-prod-80.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pep-cgpt-cgf-rstrct-query-ui.aisp.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pep-cgpt-cgf-rstrct-query.aisp.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pep-cgpt-cgf-rstrct-sql-exec.aisp.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - cockpitgpt2.azure.intra.pepsico.com
    - cockpitai.mypepsico.com
    - pep-fpa-cockpitgpt-genai-app.aisp.gw01.aks01.scus.prod.azure.intra.pepsico.com
    name: pep-aisp-cgf-ckptgpt-prod-cv-gw-http-80
    port:
      name: http-pep-aisp-cgf-ckptgpt-prod-cv-gw-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true
  - hosts:
    - cockpitgpt2.azure.intra.pepsico.com
    name: pep-aisp-cgf-ckptgpt-prod-cv-gw-3-https-443
    port:
      name: pep-aisp-cgf-ckptgpt-prod-cv-gw-3-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: cockpitgpt2-azure-intra-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - cockpitai.mypepsico.com
    name: pep-aisp-cgf-ckptgpt-prod-cv-gw-4-https-443
    port:
      name: pep-aisp-cgf-ckptgpt-prod-cv-gw-4-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: cockpitai-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE

