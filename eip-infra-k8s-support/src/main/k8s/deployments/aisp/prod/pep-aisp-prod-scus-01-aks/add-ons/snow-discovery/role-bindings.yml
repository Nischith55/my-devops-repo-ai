---
kind: Namespace
apiVersion: v1
metadata:
  name: pep-aisp-snowdiscovery-prod
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: snow-sa-pepsicoprod
  namespace: pep-aisp-snowdiscovery-prod

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: snow-cr-pep-aisp-snowdiscovery-prod
  namespace: pep-aisp-snowdiscovery-prod
rules:
  - apiGroups: ["","apps","batch", "networking.k8s.io"]
    resources: ["namespaces","nodes","deployments","statefulsets","daemonsets","replicasets","replicationcontrollers",
                "jobs","cronjobs","pods", "pods/log", "endpoints","services", "ingresses","routes", "groups", "users"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: snow-sa-snow-cr-pep-aisp-snowdiscovery-prod
  namespace: pep-aisp-snowdiscovery-prod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: snow-cr-pep-aisp-snowdiscovery-prod
subjects:
  - kind: ServiceAccount
    name: snow-sa-pepsicoprod
    namespace: pep-aisp-snowdiscovery-prod