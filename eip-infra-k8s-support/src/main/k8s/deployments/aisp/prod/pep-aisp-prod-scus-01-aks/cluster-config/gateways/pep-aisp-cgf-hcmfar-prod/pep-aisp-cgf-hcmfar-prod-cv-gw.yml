apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: pep-aisp-cgf-hcmfar-prod-cv-gw
  namespace: pep-aisp-cgf-hcmfar-prod
spec:
  selector:
    istio: pep-aisp-ingress-gw01
  servers:
  - hosts:
    - dummy-passthrough-pep-aisp-cgf-hcmfar-prod.gw01.aks01.scus.prod.azure.intra.pepsico.com
    name: pep-aisp-cgf-hcmfar-prod-cv-gw-tls-443
    port:
      name: https-pep-aisp-cgf-hcmfar-prod-cv-gw-tls-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - dummy-pep-aisp-cgf-hcmfar-prod-443.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pep-hcmfar.aisp.gw01.aks01.scus.prod.azure.intra.pepsico.com
    name: pep-aisp-cgf-hcmfar-prod-cv-gw-https-443
    port:
      name: https-pep-aisp-cgf-hcmfar-prod-cv-gw-443
      number: 443
      protocol: https
    tls:
