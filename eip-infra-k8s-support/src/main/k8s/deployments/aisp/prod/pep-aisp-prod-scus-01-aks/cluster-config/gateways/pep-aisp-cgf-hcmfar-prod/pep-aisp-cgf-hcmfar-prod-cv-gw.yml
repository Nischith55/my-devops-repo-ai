      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-SHA
      - ECDHE-RSA-AES256-SHA
      credentialName: pep-aisp-prod-scus-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - saphcm.azure.intra.pepsico.com
    name: pep-aisp-cgf-hcmfar-prod-cv-gw-1-https-443
    port:
      name: https-pep-aisp-cgf-hcmfar-prod-cv-gw-1-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-SHA
      - ECDHE-RSA-AES256-SHA
      credentialName: pep-aisp-saphcm-prod-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - dummy-pep-aisp-cgf-hcmfar-prod-80.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pep-hcmfar.aisp.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - saphcm.azure.intra.pepsico.com
