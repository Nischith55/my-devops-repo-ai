apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-aisp-cgf-hcmfar-prod-vs
  namespace: pep-aisp-cgf-hcmfar-prod
spec:
  hosts:
  - pep-hcmfar.aisp.gw01.aks01.scus.prod.azure.intra.pepsico.com
  gateways:
  - pep-aisp-cgf-hcmfar-prod/pep-aisp-cgf-hcmfar-prod-cv-gw
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /dsearchadmin
    route:
    - destination:
        host: indexserver.pep-aisp-cgf-hcmfar-prod.svc.cluster.local
        port:
          number: 9300
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /indexagent
    route:
    - destination:
        host: indexagent.pep-aisp-cgf-hcmfar-prod.svc.cluster.local
        port:
          number: 9200
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /DmMethods/servlet/DoMethod
    route:
    - destination:
        host: dcs-pg-jms-service.pep-aisp-cgf-hcmfar-prod.svc.cluster.local
        port:
          number: 9080
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /Acs/servlet
    route:
    - destination:
        host: dcs-pg-jms-service.pep-aisp-cgf-hcmfar-prod.svc.cluster.local
        port:
          number: 9080