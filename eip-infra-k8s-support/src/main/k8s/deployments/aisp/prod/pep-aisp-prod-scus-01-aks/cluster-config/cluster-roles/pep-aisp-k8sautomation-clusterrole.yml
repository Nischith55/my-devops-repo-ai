---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:  
  name: pep-aisp-k8sautomation-clusterrole
rules:

- apiGroups: [""]
  resources:
  - namespaces
  - persistentvolumeclaims
  - persistentvolumes
  - pods
  - pods/status
  - pods/portforward
  - pods/log
  - events
  verbs: ["*"]

- apiGroups: [""]
  resources:
  - configmaps
  - serviceaccounts
  verbs: ["*"]

- apiGroups: [""]
  resources:
  - pods/exec
  - pods/eviction
  verbs: ["create"]

- apiGroups: ["apps","extensions"]
  resources:
  - deployments
  - statefulsets
  - replicasets
  verbs: ["*"]

- apiGroups: ["storage.k8s.io"]
  resources:
  - storageclasses
  verbs: ["get","list"]

- apiGroups: ["policy"]
  resources:
  - poddisruptionbudgets
  verbs: ["*"]

- apiGroups: [""]
  resources:
  - nodes
  verbs: ["get","list","patch"]

- apiGroups: ["apps","extensions"]
  resources:
  - daemonsets
  verbs: ["*"]

- apiGroups: ["apps"]
  resources:
  - deployments
  - deployments/scale
  verbs: ["*"]

# ✅ FIXED: correct batch resources
- apiGroups: ["batch"]
  resources:
  - cronjobs
  - jobs
  verbs: ["*"]

# ✅ FIXED: moved to correct API group
- apiGroups: ["autoscaling"]
  resources:
  - horizontalpodautoscalers
  verbs: ["*"]

# ✅ FIXED: replicationcontrollers stays in core group
- apiGroups: [""]
  resources:
  - replicationcontrollers
  - endpoints
  verbs: ["*"]

- apiGroups: [""]
  resources:
  - services
  verbs: ["*"]

# ✅ EXISTING Istio (kept)
- apiGroups: ["networking.istio.io"]
  resources:
  - gateways
  - virtualservices
  - sidecars
  - destinationrules
  verbs: ["*"]

# ✅ ✅ ADDED (missing Istio resources causing your errors)
- apiGroups: ["networking.istio.io"]
  resources:
  - serviceentries
  - workloadentries
  - workloadgroups
  - proxyconfigs
  - envoyfilters
  verbs: ["*"]

- apiGroups: ["security.istio.io"]
  resources:
  - authorizationpolicies
  - peerauthentications
  - requestauthentications
  verbs: ["*"]

- apiGroups: ["extensions.istio.io"]
  resources:
  - wasmplugins
  verbs: ["*"]

- apiGroups: ["telemetry.istio.io"]
  resources:
  - telemetries
  verbs: ["*"]

- apiGroups: [""]
  resources:
  - secrets
  verbs: ["*"]

- apiGroups: ["rbac.authorization.k8s.io"]
  resources:
  - clusterroles
  - clusterrolebindings
  - roles
  - rolebindings
  verbs: ["*"]

- apiGroups: ["argoproj.io"]
  resources:
  - appprojects
  - applications
  verbs: ["*"]

- apiGroups: [""]
  resources:
  - serviceaccounts/token
  verbs: ["*"]
- apiGroups:
  - secrets-store.csi.x-k8s.io
  resources:
  - secretproviderclasses
  verbs: ["*"]
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  verbs: ["*"]
- apiGroups:
  - ray.io
  resources:
  - rayclusters
  - rayjobs
  - rayservices
  verbs:
  - get
  - list
  - watch
- apiGroups: ["admissionregistration.k8s.io"]
  resources: ["*"]
  verbs: ["*"]
- apiGroups:
  - ""
  resources:
  - resourcequotas
  verbs:
  - '*'
- apiGroups:
  - ""
  resources:
  - namespaces
  - nodes
  - services
  - persistentvolumes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - serviceaccounts
  - configmaps
  - secrets
  - pods
  verbs:
  - get
  - list
  - watch
  - create
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - roles
  - rolebindings
  - clusterroles
  - clusterrolebindings
  verbs:
  - get
  - list
  - watch
  - create
- apiGroups:
  - apps
  resources:
  - daemonsets
  - deployments
  - replicasets
  - statefulsets
  verbs:
  - get
  - list
  - watch
- apiGroups: ["batch"]
  resources:
  - jobs
  - cronjobs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - admissionregistration.k8s.io
  resources:
  - validatingwebhookconfigurations
  - mutatingwebhookconfigurations
  verbs:
  - get
  - list
  - watch
  - patch
  - update
  - create
- apiGroups: ["gateway.networking.k8s.io"]
  resources:
  - gateways
  - virtualservices
  - sidecars
  - destinationrules
  verbs: ["*"]