apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: pep-aisp-cgf-fss-prod-cv-gw
  namespace: pep-aisp-cgf-fss-prod
spec:
  selector:
    istio: pep-aisp-ingress-gw01
  servers:
  - hosts:
    - dummy-passthrough-pep-aisp-cgf-fss-prod.gw01.aks01.scus.prod.azure.intra.pepsico.com
    name: pep-aisp-cgf-fss-prod-cv-gw-tls-443
    port:
      name: https-pep-aisp-cgf-fss-prod-cv-gw-tls-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - dummy-pep-aisp-cgf-fss-prod-443.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pep-fss-prod.aisp.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pep-fss.aisp.gw01.aks01.scus.prod.azure.intra.pepsico.com
    name: pep-aisp-cgf-fss-prod-cv-gw-https-443
    port:
      name: https-pep-aisp-cgf-fss-prod-cv-gw-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-SHA
      - ECDHE-RSA-AES256-SHA
      credentialName: pep-aisp-prod-scus-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - fssdm.mypepsico.com
    name: pep-aisp-cgf-fssdm-prod-cv-gw-https-443
    port:
      name: https-pep-aisp-cgf-fssdm-prod-cv-gw-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-SHA
      - ECDHE-RSA-AES256-SHA
      credentialName: pep-aisp-fssdm-prod-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - dummy-pep-aisp-cgf-fss-prod-80.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pep-fss-prod.aisp.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pep-fss.aisp.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - fssdm.mypepsico.com
    name: pep-aisp-cgf-fss-prod-cv-gw-http-80
    port:
      name: http-pep-aisp-cgf-fss-prod-cv-gw-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true
  - hosts:
    - pep-fss-prd-dbrext-dbr.aisp.gw01.aks01.scus.prod.azure.intra.pepsico.com
    name: pep-aisp-cgf-fss-prod-cv-gw-tcp-2491
    port:
      name: grpc-pep-aisp-cgf-fss-prod-cv-gw-2491
      number: 2491
      protocol: TCP
  - hosts:
    - pep-fss-prd-csext-dcs-pg.aisp.gw01.aks01.scus.prod.azure.intra.pepsico.com
    name: pep-aisp-cgf-fss-prod-cv-gw-tcp-2591
    port:
      name: grpc-pep-aisp-cgf-fss-prod-cv-gw-2591
      number: 2591
      protocol: TCP

