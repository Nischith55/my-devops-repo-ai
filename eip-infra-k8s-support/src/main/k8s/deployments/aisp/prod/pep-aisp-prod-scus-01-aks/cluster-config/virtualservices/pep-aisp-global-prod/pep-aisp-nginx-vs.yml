apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-aisp-nginx-vs
  namespace: pep-aisp-global-prod
spec:
  gateways:
  - pep-aisp-global-prod/pep-aisp-global-prod-cv-gw
  hosts:
  - pep-aisp-nginx.aisp.gw01.aks01.scus.prod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-aisp-nginx.pep-aisp-global-prod.svc.cluster.local
        port: 
          number: 8080