apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: iai-cv-pepiris-tr-head-cpdk-vs
  namespace: pep-eiap-cgf-pepiris-preprod
  labels:
      app: iai-cv-pepiris-tr-head
spec:
  hosts:
  - iai-cv-pepiris-tr-head.global.gw01.aks01.scus.preprod.azure.intra.pepsico.com
  gateways:
  - pep-eiap-cgf-pepiris-preprod/pep-eiap-cgf-pepiris-preprod-cv-gw
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /model
    route:
    - destination:
        host: iai-cv-pepiris-tr-head.pep-eiap-cgf-pepiris-preprod.svc.cluster.local
        port:
          number: 8000
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /api/pepiris
    route:
    - destination:
        host: iai-cv-pepiris-tr-head.pep-eiap-cgf-pepiris-preprod.svc.cluster.local
        port:
          number: 8000
  