apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-och-ordertransform-tfpp-vs
  namespace: pep-eiap-och-na-preprod
  labels:
      app: pep-och-ordertransform
spec:
  hosts:
  - pep-och-ordertransform.global.gw01.aks01.scus.preprod.azure.intra.pepsico.com
  gateways:
  - pep-eiap-och-na-preprod/pep-eiap-och-na-preprod-cv-gw
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-och-ordertransform.pep-eiap-och-na-preprod.svc.cluster.local
        port:
          number: 8080
  