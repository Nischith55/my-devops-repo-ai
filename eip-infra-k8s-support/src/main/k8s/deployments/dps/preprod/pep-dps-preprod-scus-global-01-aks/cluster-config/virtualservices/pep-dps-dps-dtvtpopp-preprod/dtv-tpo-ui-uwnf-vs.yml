  namespace: pep-dps-dps-dtvtpopp-preprod
  labels:
      app: dtv-tpo-ui
spec:
  hosts:
  - dtv-tpo-ui.dps.gw01.aks01.scus.preprod.azure.intra.pepsico.com
  - dtv-tpo.preprod.mypepsico.com
  gateways:
  - pep-dps-dps-dtvtpopp-preprod/pep-dps-dps-dtvtpopp-preprod-cv-gw
