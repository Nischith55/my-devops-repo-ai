apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-dps-dps-dcs-preprod-cv-web-vs
  namespace: pep-dps-dps-dcs-preprod
  labels:
    app: pep-dps-dps-dcs-preprod-cv-web
spec:
  hosts:
    - dcs.preprod.mypepsico.com
    - pep-dps-dps-dcs-preprod-cv.dps.gw01.aks01.scus.preprod.azure.intra.pepsico.com
  gateways:
  - pep-dps-dps-dcs-preprod/pep-dps-dps-dcs-preprod-cv-gw
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host:  pep-dps-dps-dcs-preprod-cv-web.pep-dps-dps-dcs-preprod.svc.cluster.local
        port:
          number: 80