apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-dss-fmcs-vs
  namespace: pep-dps-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-dss-fmcs.dps.gw01.aks01.scus.preprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-dss-fmcs.pep-dps-cgf-fmcs-preprod.svc.cluster.local
        port: 
          number: 8080