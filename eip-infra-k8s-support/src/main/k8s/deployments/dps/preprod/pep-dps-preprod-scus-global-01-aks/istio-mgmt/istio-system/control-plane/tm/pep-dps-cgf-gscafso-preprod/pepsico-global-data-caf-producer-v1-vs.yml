apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pepsico-global-data-caf-producer-v1-vs
  namespace: pep-dps-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pepsico-global-data-caf-producer-v1.dps.gw01.aks01.scus.preprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pepsico-global-data-caf-producer-v1.pep-dps-cgf-gscafso-preprod.svc.cluster.local
        port: 
          number: 80