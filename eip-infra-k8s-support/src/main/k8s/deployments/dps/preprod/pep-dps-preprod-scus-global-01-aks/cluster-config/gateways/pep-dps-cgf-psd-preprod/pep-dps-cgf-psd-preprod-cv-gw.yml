apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: pep-dps-cgf-psd-preprod-cv-gw
  namespace: pep-dps-cgf-psd-preprod
spec:
  selector:
    istio: pep-dps-ingress-gw01
  servers:
  - hosts:
    - dummy-passthrough-pep-dps-cgf-psd-preprod.gw01.aks01.scus.preprod.azure.intra.pepsico.com
    name: pep-dps-cgf-psd-preprod-cv-gw-tls-443
    port:
      name: https-pep-dps-cgf-psd-preprod-cv-gw-tls-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - pep-global-psdreportapi.dps.gw01.aks01.scus.preprod.azure.intra.pepsico.com
    - pep-psd-ui.dps.gw01.aks01.scus.preprod.azure.intra.pepsico.com
    - psd-data-collector-preprod.dps.gw01.aks01.scus.preprod.azure.intra.pepsico.com
