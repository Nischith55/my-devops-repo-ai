apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: istio-in-gateway-01
  namespace: istio-system
spec:
  selector:
    istio: pep-dps-ingress-gw01
  servers:
  - hosts:
    - "*.dps.gw01.aks01.scus.preprod.azure.intra.pepsico.com"
    name: istio-in-gateway-01-wildcard-https-443
    port:
      name: https-lob-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-dps-preprod-scus-global-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - success.preprod.mypepsico.com
    name: istio-in-gateway-01-success-https-443
    port:
      name: https-success-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-dps-preprod-success-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE    
  - hosts:
    - delamanomayoreo.preprod.pepsico.com
    name: istio-in-gateway-01-delamanomayoreo-https-443
    port:
      name: https-delamanomayoreo-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-dps-preprod-eus-delamanomayoreo-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE      
  - hosts:
    - admin-portal.preprod.mypepsico.com
    name: istio-in-gateway-01-admin-portal-https-443
    port:
      name: https-admin-portal-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-dps-preprod-scus-admin-portal-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - afhmenupro.uat.pepsico.com
    name: istio-in-gateway-01-afhmenu-uat-https-443
    port:
      name: https-afhmenu-uat-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-dps-dps-afhmenu-preprod-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE            
  - hosts:
    - "*.dps.gw01.aks01.scus.preprod.azure.intra.pepsico.com"
    - success.preprod.mypepsico.com
    - delamanomayoreo.preprod.pepsico.com
    - admin-portal.preprod.mypepsico.com
    - afhmenupro.uat.pepsico.com
    name: istio-in-gateway-01-wildcard-http-80
    port:
      name: http-lob-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true