apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pep-dps-devsecops-cgf-cct-preprod-clusterrole
rules:
- apiGroups:
  - networking.istio.io
  resources:
  - gateways
  - virtualservices
  verbs:
  - get
  - list
  - create
- apiGroups:
  - ""
  resources:
    - pods
    - pods/log
  verbs:
    - list
    - get
    - watch
- apiGroups:
  - batch
  resources:
    - jobs
  verbs:
    - list
    - get
    - watch
    - create
- apiGroups:
  - ""
  resources:
    - namespaces
  verbs:
    - list
    - get
    - watch
    - create