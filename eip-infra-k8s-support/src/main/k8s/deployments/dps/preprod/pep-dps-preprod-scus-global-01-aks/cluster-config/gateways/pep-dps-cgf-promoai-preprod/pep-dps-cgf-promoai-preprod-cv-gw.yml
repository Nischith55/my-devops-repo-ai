apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: pep-dps-cgf-promoai-preprod-cv-gw
  namespace: pep-dps-cgf-promoai-preprod
spec:
  selector:
    istio: pep-dps-ingress-gw01
  servers:
  - hosts:
    - dummy-passthrough-pep-dps-cgf-promoai-preprod.gw01.aks01.scus.preprod.azure.intra.pepsico.com
    name: pep-dps-cgf-promoai-preprod-cv-gw-tls-443
    port:
      name: https-pep-dps-cgf-promoai-preprod-cv-gw-tls-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - promoai-admin.dps.gw01.aks01.scus.preprod.azure.intra.pepsico.com
    - promoai-api.dps.gw01.aks01.scus.preprod.azure.intra.pepsico.com
    - promoai-ui.dps.gw01.aks01.scus.preprod.azure.intra.pepsico.com
    name: pep-dps-cgf-promoai-preprod-cv-gw-https-443
    port:
      name: https-pep-dps-cgf-promoai-preprod-cv-gw-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-dps-preprod-scus-global-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - promoai-admin.dps.gw01.aks01.scus.preprod.azure.intra.pepsico.com
    - promoai-api.dps.gw01.aks01.scus.preprod.azure.intra.pepsico.com
    - promoai-ui.dps.gw01.aks01.scus.preprod.azure.intra.pepsico.com
    - gnrm.preprod.mypepsico.com
    name: pep-dps-cgf-promoai-preprod-cv-gw-http-80
    port:
      name: http-pep-dps-cgf-promoai-preprod-cv-gw-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true
  - hosts:
    - gnrm.preprod.mypepsico.com
    name: gnrm-promoai-ui-https-443
    port:
      name: https-gnrm-promoai-ui-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-dps-preprod-scus-gnrm-promoai-ui-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE

