apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: journey-optimizer-backend-vs
  namespace: pep-dps-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - journey-optimizer-backend.dps.gw01.aks01.scus.preprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: journey-optimizer-backend.pep-dps-cgf-cct-preprod.svc.cluster.local
        port: 
          number: 8080