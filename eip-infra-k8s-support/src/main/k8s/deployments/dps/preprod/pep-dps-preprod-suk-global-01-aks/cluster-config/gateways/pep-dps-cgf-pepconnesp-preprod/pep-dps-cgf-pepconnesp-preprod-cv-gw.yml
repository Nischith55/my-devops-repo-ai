apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: pep-dps-cgf-pepconnesp-preprod-cv-gw
  namespace: pep-dps-cgf-pepconnesp-preprod
spec:
  selector:
    istio: pep-dps-ingress-gw01
  servers:
  - hosts:
    - dummy-passthrough-pep-dps-cgf-pepconnesp-preprod.gw01.aks01.suk.preprod.azure.intra.pepsico.com
    name: pep-dps-cgf-pepconnesp-preprod-cv-gw-tls-443
    port:
      name: https-pep-dps-cgf-pepconnesp-preprod-cv-gw-tls-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - journey-optimizer-backend.dps.gw01.aks01.suk.preprod.azure.intra.pepsico.com
    - journey-optimizer-frontend.dps.gw01.aks01.suk.preprod.azure.intra.pepsico.com
    - journey-optimizer-processor.dps.gw01.aks01.suk.preprod.azure.intra.pepsico.com
    - pepsico-pepconnect-b2bweb-spain.dps.gw01.aks01.suk.preprod.azure.intra.pepsico.com
    name: pep-dps-cgf-pepconnesp-preprod-cv-gw-https-443
    port:
      name: https-pep-dps-cgf-pepconnesp-preprod-cv-gw-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-dps-preprod-suk-global-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - journey-optimizer-backend.dps.gw01.aks01.suk.preprod.azure.intra.pepsico.com
    - journey-optimizer-frontend.dps.gw01.aks01.suk.preprod.azure.intra.pepsico.com
    - journey-optimizer-processor.dps.gw01.aks01.suk.preprod.azure.intra.pepsico.com
    - pepsico-pepconnect-b2bweb-spain.dps.gw01.aks01.suk.preprod.azure.intra.pepsico.com
    - conectados24h.preprod.pepsico.com
    name: pep-dps-cgf-pepconnesp-preprod-cv-gw-http-80
    port:
      name: http-pep-dps-cgf-pepconnesp-preprod-cv-gw-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true
  - hosts:
    - conectados24h.preprod.pepsico.com
    name: pep-dps-cgf-pepconnesp-preprod-cv-gw-1-https-443
    port:
      name: https-pep-dps-cgf-pepconnesp-preprod-cv-gw-1-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-dps-preprod-suk-conectados24h-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE

