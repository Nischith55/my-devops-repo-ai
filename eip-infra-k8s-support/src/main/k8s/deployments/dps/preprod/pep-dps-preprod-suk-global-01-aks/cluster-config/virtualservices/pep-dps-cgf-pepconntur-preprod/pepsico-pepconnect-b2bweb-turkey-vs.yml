  - pep-dps-cgf-pepconntur-preprod/pep-dps-cgf-pepconntur-preprod-cv-gw
  hosts:
  - pepsico-pepconnect-b2bweb-turkey.dps.gw01.aks01.suk.preprod.azure.intra.pepsico.com
