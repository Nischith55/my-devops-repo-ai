apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: gpg
  name: gpg
  namespace: pep-dps-cgf-gpg-dev
spec:
  gateways:
  - pep-dps-cgf-gpg-dev/pep-dps-cgf-gpg-dev-cv-gw
  hosts:
  - gpg.dps.gw01.aks01.ae.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: gpg.pep-dps-cgf-gpg-dev.svc.cluster.local
        port:
          number: 8080
