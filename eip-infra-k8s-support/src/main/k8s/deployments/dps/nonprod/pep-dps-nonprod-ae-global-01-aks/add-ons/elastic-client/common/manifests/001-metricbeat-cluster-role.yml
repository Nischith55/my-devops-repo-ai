---
# ##
# Common cluster wide role for metricbeat
# ##
# permissions needed for metricbeat
# source: https://www.elastic.co/guide/en/beats/metricbeat/current/metricbeat-module-kubernetes.html
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pep-dps-nonprod-elastic-client-metricbeat
rules:
- apiGroups:
  - ""
  resources:
  - events
  - nodes
  - namespaces
  - pods
  # missing
  - services
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - "extensions"
  resources:
  - replicasets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - statefulsets
  - deployments
  - replicasets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - nodes/stats
  verbs:
  - get
# For metricbeat to gather the apiserver endpoint
- nonResourceURLs:
  - /metrics
  verbs:
  - get
# for leader election (mainly for the deployment option)
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - create
  - update
  - list
  - watch
