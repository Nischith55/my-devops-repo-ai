apiVersion: v1
kind: Secret
metadata:
  name: pep-dps-ae-conjur-sa-token  # Naming convention followed is ServiceAccountName-token
  namespace: pep-dps-ops-admin     # Namespace where the service account is created
  annotations:
    kubernetes.io/service-account.name: "pep-dps-ae-conjur-sa" # Service Account name to map the token
type: kubernetes.io/service-account-token  # Secret type should be this