apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: pep-dps-dps-amesatct-qa-cv-gw
  namespace: pep-dps-dps-amesatct-qa
spec:
  selector:
    istio: pep-dps-ingress-gw01
  servers:
  - hosts:
    - dummy-passthrough-pep-dps-dps-amesatct-qa.dps.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    name: pep-dps-dps-amesatct-qa-cv-gw-tls-443
    port:
      name: https-pep-dps-dps-amesatct-qa-cv-gw-tls-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - pep-dps-dps-amesatct-qa-cv.dps.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    - tct-api-adapter-service.qa.dps.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    - tct-event-distributor-service.qa.dps.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    - tct-api-adapter-service-qa.dps.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    - tct-event-distributor-service-qa.dps.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    - tct-carrier-api-service-qa.dps.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    name: pep-dps-dps-amesatct-qa-cv-gw-https-443
    port:
      name: https-pep-dps-dps-amesatct-qa-cv-gw-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-dps-nonprod-gwc-global-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - tct.qa.mypepsico.com
    - pep-dps-dps-amesatct-qa-cv.dps.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    - tct-api-adapter-service.qa.dps.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    - tct-event-distributor-service.qa.dps.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    - tct-api-adapter-service-qa.dps.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    - tct-event-distributor-service-qa.dps.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    - tct-carrier-api-service-qa.dps.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    name: pep-dps-dps-amesatct-qa-cv-gw-http-80
    port:
      name: http-pep-dps-dps-amesatct-qa-cv-gw-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true
  - hosts:
    - tct.qa.mypepsico.com
    name: pep-dps-dps-amesatct-qa-cv-gw-https-1-443
    port:
      name: https-pep-dps-dps-amesatct-qa-cv-gw-1-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-dps-dps-amesatct-qa-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE

