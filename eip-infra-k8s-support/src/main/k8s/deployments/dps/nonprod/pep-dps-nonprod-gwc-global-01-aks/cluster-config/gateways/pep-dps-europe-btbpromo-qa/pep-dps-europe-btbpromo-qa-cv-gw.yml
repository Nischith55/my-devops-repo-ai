apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: pep-dps-europe-btbpromo-qa-cv-gw
  namespace: pep-dps-europe-btbpromo-qa
spec:
  selector:
    istio: pep-dps-ingress-gw01
  servers:
  - hosts:
    - dummy-passthrough-pep-dps-europe-btbpromo-qa.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    name: pep-dps-europe-btbpromo-qa-cv-gw-tls-443
    port:
      name: https-pep-dps-europe-btbpromo-qa-cv-gw-tls-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - dummy-pep-dps-europe-btbpromo-qa-443.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    - b2b-promotions-in-qa.dps.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    - b2b-promotions-in-auto.dps.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    - b2b-promotions-in-hf.dps.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    - b2b-promotions-qa.dps.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    - b2b-promotions-eu-hf.dps.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    - b2b-promotions-eu-auto.dps.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    - b2b-promotions-am-qa.dps.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    - b2b-promotions-am-auto.dps.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    - b2b-promotions-am-hf.dps.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    name: pep-dps-europe-btbpromo-qa-cv-gw-https-443
    port:
      name: https-pep-dps-europe-btbpromo-qa-cv-gw-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-dps-nonprod-gwc-global-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - dummy-pep-dps-europe-btbpromo-qa-80.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    - b2b-promotions-in-qa.dps.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    - b2b-promotions-in-auto.dps.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    - b2b-promotions-in-hf.dps.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    - b2b-promotions-qa.dps.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    - b2b-promotions-eu-hf.dps.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    - b2b-promotions-eu-auto.dps.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    - b2b-promotions-am-qa.dps.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    - b2b-promotions-am-auto.dps.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    - b2b-promotions-am-hf.dps.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    name: pep-dps-europe-btbpromo-qa-cv-gw-http-80
    port:
      name: http-pep-dps-europe-btbpromo-qa-cv-gw-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true

