    - pederecebe.qa.pepsico.com
    - pephub.dev.pepsico.com
    - pephub.qa.pepsico.com
    - pepsicopartner.dev.pepsico.com
    - pepsicopartner.qa.pepsico.com
    - dogovorilis24.dev.pepsico.com
    - dogovorilis24.qa.pepsico.com
    - dukkan-senin.dev.pepsico.com
    - dukkan-senin.qa.pepsico.com
    name: istio-in-gateway-01-wildcard-http-80
    port:
      name: http-lob-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true
