apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: pep-dps-dps-admineu-dev-cv-gw
  namespace: pep-dps-dps-admineu-dev
spec:
  selector:
    istio: pep-dps-ingress-gw01
  servers:
  - hosts:
    - dummy-passthrough-pep-dps-dps-admineu-dev.dps.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    name: pep-dps-dps-admineu-dev-cv-gw-tls-443
    port:
      name: https-pep-dps-dps-admineu-dev-cv-gw-tls-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - pep-dps-dps-admineu-dev-cv.dps.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    - admin-dashboard-audit-log.dps.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    - admin-dashboard-bff.dps.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    - admin-dashboard-creation-properties.dps.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    - admin-dashboard-shell-mfe.dps.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    - survey-bff.dps.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    - survey-delivery-service.dps.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    - survey-frontend.dps.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    - survey-management-service.dps.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    name: pep-dps-dps-admineu-dev-cv-gw-https-443
    port:
      name: https-pep-dps-dps-admineu-dev-cv-gw-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-dps-nonprod-gwc-global-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - b2b-admin-tool-eu.dev.mypepsico.com
    - pep-dps-dps-admineu-dev-cv.dps.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    - admin-dashboard-audit-log.dps.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    - admin-dashboard-bff.dps.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    - admin-dashboard-creation-properties.dps.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    - admin-dashboard-shell-mfe.dps.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    - survey-bff.dps.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    - survey-delivery-service.dps.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    - survey-frontend.dps.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    - survey-management-service.dps.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
