  - pep-dps-cgf-pepconnrou-dev/pep-dps-cgf-pepconnrou-dev-cv-gw
  hosts:
  - pepsico-pepconnect-b2bweb-romania.dps.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
