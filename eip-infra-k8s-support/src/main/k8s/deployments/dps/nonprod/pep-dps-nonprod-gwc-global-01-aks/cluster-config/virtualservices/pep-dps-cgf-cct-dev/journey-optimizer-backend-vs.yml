apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: journey-optimizer-backend
  name: journey-optimizer-backend-vs
  namespace: pep-dps-cgf-cct-dev
spec:
  gateways:
  - pep-dps-cgf-cct-dev/pep-dps-cgf-cct-dev-cv-gw
  hosts:
  - journey-optimizer-backend.dps.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: journey-optimizer-backend.pep-dps-cgf-cct-dev.svc.cluster.local
        port:
          number: 8080
