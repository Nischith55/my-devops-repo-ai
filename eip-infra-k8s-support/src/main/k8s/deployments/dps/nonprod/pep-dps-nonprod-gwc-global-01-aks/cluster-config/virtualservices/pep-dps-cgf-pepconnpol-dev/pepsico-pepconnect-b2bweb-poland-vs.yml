  name: pepsico-pepconnect-b2bweb-poland-vs
  namespace: pep-dps-cgf-pepconnpol-dev
spec:
  gateways:
  - pep-dps-cgf-pepconnpol-dev/pep-dps-cgf-pepconnpol-dev-cv-gw
  hosts:
  - pepsico-pepconnect-b2bweb-poland-dev.dps.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
  - pephub.dev.pepsico.com
  http:
