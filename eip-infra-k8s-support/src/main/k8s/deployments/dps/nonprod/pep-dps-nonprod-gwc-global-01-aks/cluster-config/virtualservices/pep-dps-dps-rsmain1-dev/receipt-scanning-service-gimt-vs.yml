apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: receipt-scanning-service-gimt-vs
  namespace: pep-dps-dps-rsmain1-dev
  labels:
      app: receipt-scanning-service
spec:
  hosts:
  - pep-dps-dev-receipt-scanning-service.dps.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
  gateways:
  - pep-dps-dps-rsmain1-dev/pep-dps-dps-rsmain1-dev-cv-gw
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: receipt-scanning-service.pep-dps-dps-rsmain1-dev.svc.cluster.local
        port:
          number: 8080
    corsPolicy:
      allowOrigins:
      - exact: https://receiptscanning.dev.mypepsico.com
      allowMethods:
      - GET
      - PUT
      - POST
      - DELETE
      - OPTIONS
  
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Access-Control-Allow-Origin
      exposeHeaders:
      - Authorization
       
  