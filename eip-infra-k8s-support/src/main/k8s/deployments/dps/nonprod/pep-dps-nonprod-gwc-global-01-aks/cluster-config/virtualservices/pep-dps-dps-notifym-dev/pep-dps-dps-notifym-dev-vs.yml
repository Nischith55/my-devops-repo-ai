apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-dps-dps-notifym-dev-cv-vs
  namespace: pep-dps-dps-notifym-dev
spec:
  hosts:
    - pep-dps-dps-notifym-dev-cv.dps.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
  gateways:
  - "istio-system/istio-in-gateway-01"
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: "/"
    route:
    - destination:
        host:  "pep-dps-dps-notifym-dev-cv-webdeploy.pep-dps-dps-notifym-dev.svc.cluster.local"
        port:
          number: 80