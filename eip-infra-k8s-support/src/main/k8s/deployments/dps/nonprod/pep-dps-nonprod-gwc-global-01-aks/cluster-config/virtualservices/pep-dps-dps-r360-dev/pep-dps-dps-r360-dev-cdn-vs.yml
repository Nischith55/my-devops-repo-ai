apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-dps-dps-r360-dev-cv-cdn-vs
  namespace: pep-dps-dps-r360-dev
spec:
  hosts:
    - retail360-eu.dev.pepsico.com
  gateways:
  - "pep-dps-dps-r360-dev/pep-dps-dps-r360-dev-cv-gw"
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: "/"
    route:
    - destination:
        host:  "pep-dps-dps-r360-dev-cv-webdeploy.pep-dps-dps-r360-dev.svc.cluster.local"
        port:
          number: 80