apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: nginx
    app.kubernetes.io/instance: promoai-admin-dev
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: 1.16.3
    helm.sh/chart: platform-chart-0.1.2
  name: promoai-admin
  namespace: pep-dps-cgf-promoai-dev
spec:
  gateways:
  - pep-dps-cgf-promoai-dev/pep-dps-cgf-promoai-dev-cv-gw
  hosts:
  - promoai-admin.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: promoai-admin.pep-dps-cgf-promoai-dev.svc.cluster.local
        port:
          number: 80
