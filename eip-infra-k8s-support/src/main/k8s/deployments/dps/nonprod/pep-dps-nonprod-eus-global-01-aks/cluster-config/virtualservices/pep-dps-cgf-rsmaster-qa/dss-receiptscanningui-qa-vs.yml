apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: dss-receiptscanningui
  name: dss-receiptscanningui-qa-vs
  namespace: pep-dps-cgf-rsmaster-qa
spec:
  gateways:
  - pep-dps-cgf-rsmaster-qa/pep-dps-cgf-rsmaster-qa-cv-gw
  hosts:
  - dss-receiptscanningui-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: dss-receiptscanningui.pep-dps-cgf-rsmaster-qa.svc.cluster.local
        port:
          number: 80
