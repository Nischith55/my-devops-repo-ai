apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: pep-dps-cgf-aspiretwob-dev-cv-gw
  namespace: pep-dps-cgf-aspiretwob-dev
spec:
  selector:
    istio: pep-dps-ingress-gw01
  servers:
  - hosts:
    - dummy-passthrough-pep-dps-cgf-aspiretwob-dev.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    name: pep-dps-cgf-aspiretwob-dev-cv-gw-tls-443
    port:
      name: https-pep-dps-cgf-aspiretwob-dev-cv-gw-tls-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - dummy-pep-dps-cgf-aspiretwob-dev-443.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - aspire2b-digitalassets-service.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - aspire2b-admin-portal.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    name: pep-dps-cgf-aspiretwob-dev-cv-gw-https-443
    port:
      name: https-pep-dps-cgf-aspiretwob-dev-cv-gw-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-dps-nonprod-eus-global-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - dummy-pep-dps-cgf-aspiretwob-dev-80.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - aspire2b-digitalassets-service.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - aspire2badmin.dev.pepsico.com
    - aspire2b-admin-portal.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    name: pep-dps-cgf-aspiretwob-dev-cv-gw-http-80
    port:
      name: http-pep-dps-cgf-aspiretwob-dev-cv-gw-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true
  - hosts:
    - aspire2badmin.dev.pepsico.com
    name: pep-dps-cgf-aspiretobe-dev-cv-gw-1-https-443
    port:
      name: https-pep-dps-cgf-aspiretobe-dev-cv-gw-1-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-dps-nonprod-eus-global-aspire2badmin-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE

