apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: gpg
    app.kubernetes.io/instance: gpg-dev
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: 1.16.3
    helm.sh/chart: platform-chart-0.1.2
  name: gpg
  namespace: pep-dps-cgf-gpg-dev
spec:
  gateways:
  - pep-dps-cgf-gpg-dev/pep-dps-cgf-gpg-dev-cv-gw
  hosts:
  - gpg.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: gpg.pep-dps-cgf-gpg-dev.svc.cluster.local
        port:
          number: 8080
