    - b2b-bff-latam.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - b2b-bff-co.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - b2b-bff-na.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
