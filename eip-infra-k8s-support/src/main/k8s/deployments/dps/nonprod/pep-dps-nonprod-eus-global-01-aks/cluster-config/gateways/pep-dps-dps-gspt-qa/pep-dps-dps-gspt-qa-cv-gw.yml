apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: pep-dps-dps-gspt-qa-cv-gw
  namespace: pep-dps-dps-gspt-qa
spec:
  selector:
    istio: pep-dps-ingress-gw01
  servers:
  - hosts:
    - dummy-passthrough-pep-dps-dps-gspt-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    name: pep-dps-dps-gspt-qa-cv-gw-tls-443
    port:
      name: https-pep-dps-dps-gspt-qa-cv-gw-tls-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - pep-dps-dps-gspt-qa-cv.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - agro-gsat-ui-qahotfix.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - gspt-crop-cycle-service-qahotfix.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - gspt-notification-service-qahotfix.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - gspt-demand-actuals-service-qahotfix.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - gspt-demand-strategy-service-api-qahotfix.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - gspt-master-data-service-qahotfix.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - gspt-allocation-service-qahotfix.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    name: pep-dps-dps-gspt-qa-cv-gw-https-443
    port:
      name: https-pep-dps-dps-gspt-qa-cv-gw-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-dps-nonprod-eus-global-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - gsathotfix.qa.pepsico.com
    - pep-dps-dps-gspt-qa-cv.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - agro-gsat-ui-qahotfix.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - gspt-crop-cycle-service-qahotfix.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - gspt-notification-service-qahotfix.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - gspt-demand-actuals-service-qahotfix.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - gspt-demand-strategy-service-api-qahotfix.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - gspt-master-data-service-qahotfix.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - gspt-allocation-service-qahotfix.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    name: pep-dps-dps-gspt-qa-cv-gw-http-80
    port:
      name: http-pep-dps-dps-gspt-qa-cv-gw-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true
  - hosts:
    - gsathotfix.qa.pepsico.com
    name: pep-dps-dps-gspt-qa-cv-gw-https-1-443
    port:
      name: https-pep-dps-dps-gspt-qa-cv-gw-1-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-dps-dps-gspt-qa-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE

