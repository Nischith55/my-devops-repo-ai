    app: undefined
  name: pepsico-retail-360-frontend-vs
  namespace: pep-dps-cgf-retaildev-dev
spec:
  gateways:
  - pep-dps-cgf-retaildev-dev/pep-dps-cgf-retaildev-dev-cv-gw
  hosts:
  - pepsico-retail-360-frontend-dev.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
