apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: r360-caf-metrics
  name: r360-caf-metrics-retaildev-dev-vs
  namespace: pep-dps-cgf-retaildev-dev
spec:
  gateways:
  - pep-dps-cgf-retaildev-dev/pep-dps-cgf-retaildev-dev-cv-gw
  hosts:
  - r360-caf-metrics-retaildev-dev.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - corsPolicy:
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Content-Type
      - Access-Control-Allow-Origin
      - Link
      allowMethods:
      - GET
      - PUT
      - POST
      - DELETE
      - OPTIONS
      - PATCH
      allowOrigins:
      - exact: https://retail360.dev.pepsico.com/
      - exact: https://localhost:3000/
      exposeHeaders:
      - x-total-count
      - x-source
    match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: r360-caf-metrics.pep-dps-cgf-retaildev-dev.svc.cluster.local
        port:
          number: 8080
