apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-dss-fmcs
    app.kubernetes.io/instance: fmcs-services-dev
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: 1.16.3
    helm.sh/chart: platform-chart-0.1.2
  name: pep-dss-fmcs
  namespace: pep-dps-cgf-fmcs-dev
spec:
  gateways:
  - pep-dps-cgf-fmcs-dev/pep-dps-cgf-fmcs-dev-cv-gw
  hosts:
  - pep-dss-fmcs.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-dss-fmcs.pep-dps-cgf-fmcs-dev.svc.cluster.local
        port:
          number: 8080
