apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: undefined
  name: r360-luminate-api-vs
  namespace: pep-dps-cgf-retaildev-dev
spec:
  gateways:
  - pep-dps-cgf-retaildev-dev/pep-dps-cgf-retaildev-dev-cv-gw
  hosts:
