    app: dtv-should-cost-ui
    app.kubernetes.io/instance: dtv-should-cost-ui-qa
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: 1.16.3
    helm.sh/chart: platform-chart-0.1.2
  name: dtv-should-cost-ui
  namespace: pep-dps-dps-scm-qa
spec:
  gateways:
  - pep-dps-dps-scm-qa/pep-dps-dps-scm-qa-cv-gw
  hosts:
