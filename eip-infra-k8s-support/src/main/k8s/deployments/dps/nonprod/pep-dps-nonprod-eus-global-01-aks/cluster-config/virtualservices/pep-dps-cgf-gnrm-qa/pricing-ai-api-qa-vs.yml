apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pricing-ai-api
  name: pricing-ai-api-qa-vs
  namespace: pep-dps-cgf-gnrm-qa
spec:
  gateways:
  - pep-dps-cgf-gnrm-qa/pep-dps-cgf-gnrm-qa-cv-gw
  hosts:
  - pricing-ai-api-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pricing-ai-api.pep-dps-cgf-gnrm-qa.svc.cluster.local
        port:
          number: 8080
