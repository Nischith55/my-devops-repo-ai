apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: pep-dps-cgf-psd-qa-cv-gw
  namespace: pep-dps-cgf-psd-qa
spec:
  selector:
    istio: pep-dps-ingress-gw01
  servers:
  - hosts:
    - dummy-passthrough-pep-dps-cgf-psd-qa.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    name: pep-dps-cgf-psd-qa-cv-gw-tls-443
    port:
      name: https-pep-dps-cgf-psd-qa-cv-gw-tls-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - pep-global-psdreportapi-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pep-psd-ui-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - psd-data-collector-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pep-global-psdreportapi-argocd-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pep-psd-ui-argocd-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - psd-app-performance-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - psd-widget-service-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - psd-common-service-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - psd-graph-federation-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - psd-user-adoption-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    name: pep-dps-cgf-psd-qa-cv-gw-https-443
    port:
      name: https-pep-dps-cgf-psd-qa-cv-gw-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-dps-nonprod-eus-global-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - pep-global-psdreportapi-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pep-psd-ui-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - success.qa.mypepsico.com
    - psd-data-collector-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pep-global-psdreportapi-argocd-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pep-psd-ui-argocd-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - psd-app-performance-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - psd-widget-service-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - psd-common-service-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - psd-graph-federation-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - psd-user-adoption-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    name: pep-dps-cgf-psd-qa-cv-gw-http-80
    port:
      name: http-pep-dps-cgf-psd-qa-cv-gw-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true
  - hosts:
    - success.qa.mypepsico.com
    name: pep-dps-cgf-psd-qa-cv-gw-1-https-443
    port:
      name: https-pep-dps-cgf-psd-qa-cv-gw-1-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-dps-nonprod-success-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE

