apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-dps-region
    app.kubernetes.io/instance: pep-multi-region-failover-dev
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: 1.16.3
    helm.sh/chart: platform-chart-0.1.2
  name: pep-dps-region
  namespace: pep-dps-cgf-adportal-dev
spec:
  gateways:
  - pep-dps-cgf-adportal-dev/pep-dps-cgf-adportal-dev-cv-gw
  hosts:
  - pep-dps-region.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-dps-region.pep-dps-cgf-adportal-dev.svc.cluster.local
        port:
          number: 80
