    app: receipt-scanning-admin-service
  name: receipt-scanning-admin-service-qa-vs
  namespace: pep-dps-cgf-rsadmin-qa
spec:
  gateways:
  - pep-dps-cgf-rsadmin-qa/pep-dps-cgf-rsadmin-qa-cv-gw
  hosts:
  - receipt-scanning-admin-service-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
