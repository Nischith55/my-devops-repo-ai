apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: receipt-scanning-admin-ui
  name: receipt-scanning-admin-ui-vs
  namespace: pep-dps-cgf-rsadmin-dev
spec:
  gateways:
  - pep-dps-cgf-rsadmin-dev/pep-dps-cgf-rsadmin-dev-cv-gw
  hosts:
  - receipt-scanning-admin-ui.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: receipt-scanning-admin-ui.pep-dps-cgf-rsadmin-dev.svc.cluster.local
        port:
          number: 8090
