apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: dps-dsx-pepiris-services-vs
  namespace: pep-dps-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pepirisservices-dev.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: dps-dsx-pepiris-services.pep-dps-cgf-optmerchnd-dev.svc.cluster.local
        port:
          number: 8080
          