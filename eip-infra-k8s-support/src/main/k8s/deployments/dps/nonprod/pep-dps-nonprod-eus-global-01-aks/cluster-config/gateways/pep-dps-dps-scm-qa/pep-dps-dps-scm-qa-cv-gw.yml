apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: pep-dps-dps-scm-qa-cv-gw
  namespace: pep-dps-dps-scm-qa
spec:
  selector:
    istio: pep-dps-ingress-gw01
  servers:
  - hosts:
    - dummy-passthrough-pep-dps-dps-scm-qa.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    name: pep-dps-dps-scm-qa-cv-gw-tls-443
    port:
      name: https-pep-dps-dps-scm-qa-cv-gw-tls-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - dtv-should-cost-api-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - dtv-should-cost-ui-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - dtv-should-cost-dashboard-api-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - proc-scm-ai-api-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    name: pep-dps-dps-scm-qa-cv-gw-https-443
    port:
      name: https-pep-dps-dps-scm-qa-cv-gw-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-dps-nonprod-eus-global-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - dtv-should-cost-api-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - dtv-should-cost-ui-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - scm.qa.mypepsico.com
    - dtv-should-cost-dashboard-api-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - proc-scm-ai-api-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    name: pep-dps-dps-scm-qa-cv-gw-http-80
    port:
      name: http-pep-dps-dps-scm-qa-cv-gw-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true
  - hosts:
    - scm.qa.mypepsico.com
    name: pep-dps-dps-scm-qa-cv-gw-1-https-443
    port:
      name: https-pep-dps-dps-scm-qa-cv-gw-1-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-dps-dps-scm-qa-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE

