apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: receipt-scanning-rule-engine-service
  name: receipt-scanning-rule-engine-service-qa-vs
  namespace: pep-dps-cgf-rsruleng-qa
spec:
  gateways:
  - pep-dps-cgf-rsruleng-qa/pep-dps-cgf-rsruleng-qa-cv-gw
  hosts:
  - receipt-scanning-rule-engine-service-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /receipt-scanning/rule-engine/get-rules
    route:
    - destination:
        host: receipt-scanning-rule-engine-service.pep-dps-cgf-rsruleng-qa.svc.cluster.local
        port:
          number: 8081
