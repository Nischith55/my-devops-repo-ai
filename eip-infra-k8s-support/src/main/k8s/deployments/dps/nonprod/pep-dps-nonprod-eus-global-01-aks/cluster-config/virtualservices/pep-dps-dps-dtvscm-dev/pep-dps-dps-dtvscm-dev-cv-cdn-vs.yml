apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-dps-dps-dtvscm-dev-cv-webdeploy
  name: pep-dps-dps-dtvscm-dev-cv-cdn-vs
  namespace: pep-dps-dps-dtvscm-dev
spec:
  gateways:
  - pep-dps-dps-dtvscm-dev/pep-dps-dps-dtvscm-dev-cv-gw
  hosts:
  - dtv-scm.dev.mypepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-dps-dps-dtvscm-dev-cv-webdeploy.pep-dps-dps-dtvscm-dev.svc.cluster.local
        port:
          number: 80
