apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: pep-dps-dps-supplier-dev-cv-gw
  namespace: pep-dps-dps-supplier-dev
spec:
  selector:
    istio: pep-dps-ingress-gw01
  servers:
  - hosts:
    - dummy-passthrough-pep-dps-dps-supplier-dev.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    name: pep-dps-dps-supplier-dev-cv-gw-tls-443
    port:
      name: https-pep-dps-dps-supplier-dev-cv-gw-tls-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - pep-dps-dps-supplier-dev-cv.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pepsico-ap-finance-help-desk-frontend.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pepsico-r2p-supplier-console-backend.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - it-snt-r2p-intelliextractservice.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - invoice-export-service.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    name: pep-dps-dps-supplier-dev-cv-gw-https-443
    port:
      name: https-pep-dps-dps-supplier-dev-cv-gw-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-dps-nonprod-eus-global-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - supplierassist.dev.pepsico.com
    - pep-dps-dps-supplier-dev-cv.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pepsico-ap-finance-help-desk-frontend.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pepsico-r2p-supplier-console-backend.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - it-snt-r2p-intelliextractservice.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - invoice-export-service.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    name: pep-dps-dps-supplier-dev-cv-gw-http-80
    port:
      name: http-pep-dps-dps-supplier-dev-cv-gw-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true
  - hosts:
    - supplierassist.dev.pepsico.com
    name: pep-dps-dps-supplier-dev-cv-gw-https-1-443
    port:
      name: https-pep-dps-dps-supplier-dev-cv-gw-1-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-dps-dps-supplier-dev-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE

