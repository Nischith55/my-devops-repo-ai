    - dps-dss-collab-components-bff-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - dps-dss-collab-components-service-bus-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
