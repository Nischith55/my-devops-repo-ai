apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: pep-dps-dps-collabcq-qa-cv-gw
  namespace: pep-dps-dps-collabcq-qa
spec:
  selector:
    istio: pep-dps-ingress-gw01
  servers:
  - hosts:
    - dummy-passthrough-pep-dps-dps-collabcq-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
