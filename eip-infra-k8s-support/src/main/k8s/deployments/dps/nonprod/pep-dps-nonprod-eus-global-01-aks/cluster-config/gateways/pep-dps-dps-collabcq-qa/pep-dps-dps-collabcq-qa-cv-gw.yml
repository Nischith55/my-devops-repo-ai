    - dps-dss-collab-components-notification-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - dps-dss-collab-components-translation-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - dps-dss-collab-components-chat-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
