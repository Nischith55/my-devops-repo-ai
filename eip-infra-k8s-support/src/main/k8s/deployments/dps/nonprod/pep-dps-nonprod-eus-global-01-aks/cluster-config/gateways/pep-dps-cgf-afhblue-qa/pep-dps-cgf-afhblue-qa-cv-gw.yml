apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: pep-dps-cgf-afhblue-qa-cv-gw
  namespace: pep-dps-cgf-afhblue-qa
spec:
  selector:
    istio: pep-dps-ingress-gw01
  servers:
  - hosts:
    - dummy-passthrough-pep-dps-cgf-afhblue-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    name: pep-dps-cgf-afhblue-qa-cv-gw-tls-443
    port:
      name: https-pep-dps-cgf-afhblue-qa-cv-gw-tls-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - dummy-pep-dps-cgf-afhblue-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - afh-blueprint-user-mgmt-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - afh-blueprint-ui-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - afh-blueprint-agent-comm-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - afh-blueprint-bff-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - afh-blueprint-activity-processor-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    name: pep-dps-cgf-afhblue-qa-cv-gw-https-443
    port:
      name: https-pep-dps-cgf-afhblue-qa-cv-gw-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-dps-nonprod-eus-global-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - dummy-pep-dps-cgf-afhblue-qa-80.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - afh-blueprint-user-mgmt-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - afh-blueprint-ui-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - afh-blueprint-agent-comm-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - afh-blueprint-bff-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - afhblueprint.qa.pepsico.com
    - afh-blueprint-activity-processor-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    name: pep-dps-cgf-afhblue-qa-cv-gw-http-80
    port:
      name: http-pep-dps-cgf-afhblue-qa-cv-gw-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true
  - hosts:
    - afhblueprint.qa.pepsico.com
    name: pep-dps-cgf-afhblue-qa-cv-gw-3-https-443
    port:
      name: pep-dps-cgf-afhblue-qa-cv-gw-3-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: afhblueprint.qa-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE

