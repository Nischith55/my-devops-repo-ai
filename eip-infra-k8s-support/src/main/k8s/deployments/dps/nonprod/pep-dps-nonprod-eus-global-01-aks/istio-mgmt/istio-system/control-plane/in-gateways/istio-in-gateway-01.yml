apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: istio-in-gateway-01
  namespace: istio-system
spec:
  selector:
    istio: pep-dps-ingress-gw01
  servers:
  - hosts:
    - "*.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com"
    name: istio-in-gateway-01-wildcard-https-443
    port:
      name: https-lob-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-dps-nonprod-eus-global-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - "*.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com"
    -  conectados24h.qa.pepsico.com
    -  afhmenupro.dev.pepsico.com
    - dtv-scm.dev.mypepsico.com
    - scm.qa.mypepsico.com
    - success.qa.mypepsico.com
    - success.dev.mypepsico.com 
    - delamanomayoreo.qa.pepsico.com
    - delamanomayoreo.dev.pepsico.com
    - admin-portal.dev.mypepsico.com
    - admin-portal.qa.mypepsico.com
    name: istio-in-gateway-01-wildcard-http-80
    port:
      name: http-lob-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true
  - hosts:
    - conectados24h.qa.pepsico.com
    name: conectados24h-in-gateway-01-wildcard-https-443
    port:
      name: https-conectados24h-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-dps-dps-conectados24h-qa-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE    
  - hosts:
    - afhmenupro.dev.pepsico.com
