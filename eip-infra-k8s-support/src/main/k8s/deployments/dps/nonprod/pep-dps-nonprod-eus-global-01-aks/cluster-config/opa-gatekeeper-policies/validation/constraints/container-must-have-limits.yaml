apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sContainerLimits
metadata:
  name: container-must-have-limits
spec:
  enforcementAction: warn
  match:
    excludedNamespaces:
    - calico-system
    - cattle-fleet-system
    - cattle-gatekeeper-system
    - cattle-impersonation-system
    - cattle-system
    - istio-system
    - kube-node-lease
    - kube-public
    - kube-system
    - kubecost
    - kubernetes-dashboard
    - monitoring
    - msi-acrpull-system
    - observability
    - twistlocknp
    - tigera-operator
    - pep-dps-ops-admin
    - pep-dps-global-infra-dev
    - pep-dps-istio-config
    - pep-dps-elastic-client-01
    - pep-dps-global-devsecops-dev
    - cert-manager-system
    - reloader
    - flux-system
    - flagger
    - policy-system
    - gitops-connector-system
    - pep-dps-latam-btborch-dev
    # DNS forward routing 
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    scope: '*'
  parameters:
    cpu: "2"
    memory: "4Gi"
    exemptImages:
    - cyberark/secrets-provider-for-k8s*
    - docker.io/istio/*
    - docker.elastic.co/observability/*
    - appdynamics/*
    - docker.io/appdynamics/*