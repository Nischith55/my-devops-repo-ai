    app: pepsico-retail-360-caf-api
  name: pepsico-retail-360-caf-api-vs
  namespace: pep-dps-cgf-retaildev-dev
spec:
  gateways:
  - pep-dps-cgf-retaildev-dev/pep-dps-cgf-retaildev-dev-cv-gw
  hosts:
  - pepsico-retail-360-caf-api.dev.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  - pepsico-retail-360-caf-api-dev.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pepsico-retail-360-caf-api.pep-dps-cgf-retaildev-dev.svc.cluster.local
        port:
          number: 8080
