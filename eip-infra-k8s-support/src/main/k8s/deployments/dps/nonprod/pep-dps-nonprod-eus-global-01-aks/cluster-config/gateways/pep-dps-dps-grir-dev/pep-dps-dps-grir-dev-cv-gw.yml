apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: pep-dps-dps-grir-dev-cv-gw
  namespace: pep-dps-dps-grir-dev
spec:
  selector:
    istio: pep-dps-ingress-gw01
  servers:
  - hosts:
    - dummy-passthrough-pep-dps-dps-grir-dev.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    name: pep-dps-dps-grir-dev-cv-gw-tls-443
    port:
      name: https-pep-dps-dps-grir-dev-cv-gw-tls-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - pep-dps-dps-grir-dev-cv.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pepsico-snt-grir-ariba-backend.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pepsico-snt-grir-s4-backend.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - grir-orchestrator.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - grir-sourcing.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - it-snt-grir-teams-app.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    name: pep-dps-dps-grir-dev-cv-gw-https-443
    port:
      name: https-pep-dps-dps-grir-dev-cv-gw-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-dps-nonprod-eus-global-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - grir.dev.pepsico.com
    - pep-dps-dps-grir-dev-cv.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pepsico-snt-grir-ariba-backend.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pepsico-snt-grir-s4-backend.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - grir-orchestrator.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - grir-sourcing.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - it-snt-grir-teams-app.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    name: pep-dps-dps-grir-dev-cv-gw-http-80
    port:
      name: http-pep-dps-dps-grir-dev-cv-gw-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true
  - hosts:
    - grir.dev.pepsico.com
    name: pep-dps-dps-grir-dev-cv-gw-https-1-443
    port:
      name: https-pep-dps-dps-grir-dev-cv-gw-1-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-dps-dps-grir-dev-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE

