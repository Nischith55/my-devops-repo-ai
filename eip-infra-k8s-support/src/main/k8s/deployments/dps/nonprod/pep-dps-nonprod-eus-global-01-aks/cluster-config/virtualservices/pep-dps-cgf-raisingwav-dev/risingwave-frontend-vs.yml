    app: undefined
  name: risingwave-frontend-vs
  namespace: pep-dps-cgf-raisingwav-dev
spec:
  gateways:
  - pep-dps-cgf-raisingwav-dev/pep-dps-cgf-raisingwav-dev-cv-gw
