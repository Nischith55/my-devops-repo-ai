apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: dtv-should-cost-ui-qa-vs
  namespace: pep-dps-istio-config
spec:
  gateways:
    - istio-system/istio-in-gateway-01
  hosts:
  - dtv-should-cost-ui-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  - scm.qa.mypepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: dtv-should-cost-ui.pep-dps-dps-scm-qa.svc.cluster.local
        port:
          number: 8080 