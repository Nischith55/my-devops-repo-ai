apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: promoai-admin-vs
  namespace: pep-dps-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - promoai-admin.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: promoai-admin.pep-dps-cgf-promoai-dev.svc.cluster.local
        port:
          number: 80
          