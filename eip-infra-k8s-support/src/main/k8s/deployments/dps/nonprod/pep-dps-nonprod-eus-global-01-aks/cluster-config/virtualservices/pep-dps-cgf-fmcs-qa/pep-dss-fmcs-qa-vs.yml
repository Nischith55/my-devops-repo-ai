apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-dss-fmcs
  name: pep-dss-fmcs-qa-vs
  namespace: pep-dps-cgf-fmcs-qa
spec:
  gateways:
  - pep-dps-cgf-fmcs-qa/pep-dps-cgf-fmcs-qa-cv-gw
  hosts:
  - pep-dss-fmcs-qa-new.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-dss-fmcs.pep-dps-cgf-fmcs-qa.svc.cluster.local
        port:
          number: 8080
