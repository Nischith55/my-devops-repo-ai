apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: r360-ui
    app.kubernetes.io/instance: pepsico-retail-360-frontend-dev
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: 1.16.3
    helm.sh/chart: platform-chart-0.1.2
  name: r360-ui
  namespace: pep-dps-cgf-retaildev-dev
spec:
  gateways:
  - pep-dps-cgf-retaildev-dev/pep-dps-cgf-retaildev-dev-cv-gw
  hosts:
  - r360-ui.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  - r360-ui.dev.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: r360-ui.pep-dps-cgf-retaildev-dev.svc.cluster.local
        port:
          number: 8080
