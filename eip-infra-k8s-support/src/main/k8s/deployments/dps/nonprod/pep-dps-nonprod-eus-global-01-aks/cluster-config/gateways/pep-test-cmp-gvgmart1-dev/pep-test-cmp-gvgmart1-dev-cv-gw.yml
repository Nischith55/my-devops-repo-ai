apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: pep-test-cmp-gvgmart1-dev-cv-gw
  namespace: pep-test-cmp-gvgmart1-dev
spec:
  selector:
    istio: pep-dps-ingress-gw01
  servers:
  - hosts:
    - dummy-passthrough-pep-test-cmp-gvgmart1-dev.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    name: pep-test-cmp-gvgmart1-dev-cv-gw-tls-443
    port:
      name: https-pep-test-cmp-gvgmart1-dev-cv-gw-tls-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - dummy-pep-test-cmp-gvgmart1-dev.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - dpssrikala-nonprod1-java-dev.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    name: pep-test-cmp-gvgmart1-dev-cv-gw-https-443
    port:
      name: https-pep-test-cmp-gvgmart1-dev-cv-gw-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-dps-nonprod-eus-global-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - dummy-pep-test-cmp-gvgmart1-dev-80.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - dpssrikala-nonprod1-java-dev.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    name: pep-test-cmp-gvgmart1-dev-cv-gw-http-80
    port:
      name: http-pep-test-cmp-gvgmart1-dev-cv-gw-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true

