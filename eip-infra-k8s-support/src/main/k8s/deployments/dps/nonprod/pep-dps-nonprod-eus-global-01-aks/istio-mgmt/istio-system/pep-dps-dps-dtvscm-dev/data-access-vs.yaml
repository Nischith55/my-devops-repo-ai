apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: data-access-vs
  namespace: pep-dps-istio-config
spec:
  gateways:
    - istio-system/istio-in-gateway-01
  hosts:
  - data-access.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: data-access.pep-dps-dps-dtvscm-dev.svc.cluster.local
        port:
          number: 8000 