apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pepsico-retail-360-caf-api
    app.kubernetes.io/instance: pepsico-retail-360-caf-api-dev
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: 1.16.3
    helm.sh/chart: platform-chart-0.1.2
  name: pepsico-retail-360-caf-api
  namespace: pep-dps-cgf-retaildev-dev
spec:
  gateways:
  - pep-dps-cgf-retaildev-dev/pep-dps-cgf-retaildev-dev-cv-gw
  hosts:
  - pepsico-retail-360-caf-api.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  - pepsico-retail-360-caf-api.dev.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pepsico-retail-360-caf-api.pep-dps-cgf-retaildev-dev.svc.cluster.local
        port:
          number: 8080
