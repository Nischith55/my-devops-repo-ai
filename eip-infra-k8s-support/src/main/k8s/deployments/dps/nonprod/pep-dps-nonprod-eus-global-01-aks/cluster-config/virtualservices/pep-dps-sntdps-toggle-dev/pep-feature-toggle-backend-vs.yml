apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-feature-toggle-backend
  name: pep-feature-toggle-backend-vs
  namespace: pep-dps-sntdps-toggle-dev
spec:
  gateways:
  - pep-dps-sntdps-toggle-dev/pep-dps-sntdps-toggle-dev-cv-gw
  hosts:
  - pep-feature-toggle-backend.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - corsPolicy:
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Link
      - Content-Type
      - Access-Control-Allow-Origin
      - x-organization
      allowMethods:
      - POST
      - GET
      - PUT
      - DELETE
      - OPTIONS
      allowOrigins:
      - exact: https://pep-feature-toggle.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
      exposeHeaders:
      - x-total-count
    match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-feature-toggle.pep-dps-sntdps-toggle-dev.svc.cluster.local
        port:
          number: 3100
