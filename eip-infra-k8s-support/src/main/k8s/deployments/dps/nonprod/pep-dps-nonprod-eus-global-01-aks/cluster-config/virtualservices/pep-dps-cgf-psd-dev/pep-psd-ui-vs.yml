apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-psd-ui
  name: pep-psd-ui-vs
  namespace: pep-dps-cgf-psd-dev
spec:
  gateways:
  - pep-dps-cgf-psd-dev/pep-dps-cgf-psd-dev-cv-gw
  hosts:
  - pep-psd-ui.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  - success.dev.mypepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-psd-ui.pep-dps-cgf-psd-dev.svc.cluster.local
        port:
          number: 80
