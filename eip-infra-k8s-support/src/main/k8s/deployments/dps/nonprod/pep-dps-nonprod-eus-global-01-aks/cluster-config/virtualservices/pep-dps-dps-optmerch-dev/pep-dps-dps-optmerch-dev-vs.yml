apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-dps-dps-optimal-dev-cv-vs
  namespace: pep-dps-dps-optmerch-dev
spec:
  hosts:
    - optimal-merch-dev.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  gateways:
  - "istio-system/istio-in-gateway-01"
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: "/"
    route:
    - destination:
        host:  "dps-dsx-pepiris-services.pep-dps-dps-optmerch-dev.svc.cluster.local"
        port:
          number: 8080