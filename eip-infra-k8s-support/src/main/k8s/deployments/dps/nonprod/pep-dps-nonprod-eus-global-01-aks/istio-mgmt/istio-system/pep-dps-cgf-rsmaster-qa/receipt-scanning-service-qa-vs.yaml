apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: receipt-scanning-service-qa-vs
  namespace: pep-dps-istio-config
spec:
  gateways:
    - istio-system/istio-in-gateway-01
  hosts:
  - receipt-scanning-service-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: receipt-scanning-service.pep-dps-cgf-rsmaster-qa.svc.cluster.local
        port:
          number: 8080