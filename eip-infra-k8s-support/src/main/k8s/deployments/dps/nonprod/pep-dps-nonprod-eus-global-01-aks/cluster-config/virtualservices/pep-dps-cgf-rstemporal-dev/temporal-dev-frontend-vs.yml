apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: undefined
  name: temporal-dev-frontend-vs
  namespace: pep-dps-cgf-rstemporal-dev
spec:
  gateways:
  - pep-dps-cgf-rstemporal-dev/pep-dps-cgf-rstemporal-dev-cv-gw
  hosts:
  - temporal-dev-frontend.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
