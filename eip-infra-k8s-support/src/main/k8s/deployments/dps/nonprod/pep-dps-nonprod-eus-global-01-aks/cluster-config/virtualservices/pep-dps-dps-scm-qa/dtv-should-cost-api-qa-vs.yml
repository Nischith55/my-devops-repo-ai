apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: dtv-should-cost-api
  name: dtv-should-cost-api-qa-vs
  namespace: pep-dps-dps-scm-qa
spec:
  gateways:
  - pep-dps-dps-scm-qa/pep-dps-dps-scm-qa-cv-gw
  hosts:
  - dtv-should-cost-api-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: dtv-should-cost-api.pep-dps-dps-scm-qa.svc.cluster.local
        port:
          number: 8080
