apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-dps-dps-tpouat-qa-cv-web-vs
  namespace: pep-dps-dps-tpouat-qa
  labels:
    app: pep-dps-dps-tpouat-qa-cv-web
spec:
  hosts:
    - dtv-tpo-uat.qa.mypepsico.com
    - pep-dps-dps-tpouat-qa-cv.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  gateways:
  - pep-dps-dps-tpouat-qa/pep-dps-dps-tpouat-qa-cv-gw
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host:  pep-dps-dps-tpouat-qa-cv-web.pep-dps-dps-tpouat-qa.svc.cluster.local
        port:
          number: 80