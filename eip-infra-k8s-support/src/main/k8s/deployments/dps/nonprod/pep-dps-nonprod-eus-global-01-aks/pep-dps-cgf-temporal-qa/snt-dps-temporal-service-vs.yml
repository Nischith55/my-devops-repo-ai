apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: snt-dps-temporal-service-qa-vs
  namespace: pep-dps-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - snt-dps-temporal-service-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: snt-dps-temporal-service.pep-dps-cgf-temporal-qa.svc.cluster.local
        port:
          number: 8087
          