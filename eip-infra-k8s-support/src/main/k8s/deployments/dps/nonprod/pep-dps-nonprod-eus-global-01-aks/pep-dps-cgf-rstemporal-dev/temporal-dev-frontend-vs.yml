apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: temporal-dev-frontend-vs
  namespace: pep-dps-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - temporal-dev-frontend.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: temporal-dev-frontend.pep-dps-cgf-rstemporal-dev.svc.cluster.local
        port:
          number: 7233