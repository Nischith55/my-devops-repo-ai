apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-feature-toggle-proxy
  name: pep-feature-toggle-proxy-vs
  namespace: pep-dps-sntdps-toggle-dev
spec:
  gateways:
  - pep-dps-sntdps-toggle-dev/pep-dps-sntdps-toggle-dev-cv-gw
  hosts:
  - pep-feature-toggle-proxy.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com 
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-feature-toggle-proxy.pep-dps-sntdps-toggle-dev.svc.cluster.local
        port:
          number: 3300
    corsPolicy:
      allowOrigins:
      - exact: https://dogovorilis24.dev.pepsico.com
      - exact: https://dogovorilis24.qa.pepsico.com
      - exact: https://dogovorilis24.preprod.pepsico.com
      - exact: https://kookahpuenkhun.dev.pepsico.com
      - exact: https://kookahpuenkhun.qa.pepsico.com
      - exact: https://kookahpuenkhun.preprod.pepsico.com
      - exact: http://localhost:3000
      - exact: https://gb-proxy-na.dev.caf.pepsico.com
      allowMethods:
      - POST
      - GET
      - DELETE
      - OPTIONS
      - PUT
      - PATCH
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Link
      - Content-Type
      - Access-Control-Allow-Origin
      - x-organization
      exposeHeaders:
      - x-total-count
      - x-source       