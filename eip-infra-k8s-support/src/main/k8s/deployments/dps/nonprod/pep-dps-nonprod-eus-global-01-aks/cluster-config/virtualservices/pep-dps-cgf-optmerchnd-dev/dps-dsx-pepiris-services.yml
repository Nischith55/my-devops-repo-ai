apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: dps-dsx-pepiris-services
    app.kubernetes.io/instance: dps-dsx-pepiris-services-dev
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: 1.16.3
    helm.sh/chart: platform-chart-0.1.2
  name: dps-dsx-pepiris-services
  namespace: pep-dps-cgf-optmerchnd-dev
spec:
  gateways:
  - pep-dps-cgf-optmerchnd-dev/pep-dps-cgf-optmerchnd-dev-cv-gw
  hosts:
  - optimalmerchendizing-dev.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: dps-dsx-pepiris-services.pep-dps-cgf-optmerchnd-dev.svc.cluster.local
        port:
          number: 8080
