apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: promoai-api
  name: promoai-api-qa-vs
  namespace: pep-dps-cgf-promoai-qa
spec:
  gateways:
  - pep-dps-cgf-promoai-qa/pep-dps-cgf-promoai-qa-cv-gw
  hosts:
  - promoai-api-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: promoai-api.pep-dps-cgf-promoai-qa.svc.cluster.local
        port:
          number: 80
