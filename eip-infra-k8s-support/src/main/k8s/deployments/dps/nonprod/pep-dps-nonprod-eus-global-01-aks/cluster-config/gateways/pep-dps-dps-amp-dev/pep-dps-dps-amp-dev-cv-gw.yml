apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: pep-dps-dps-amp-dev-cv-gw
  namespace: pep-dps-dps-amp-dev
spec:
  selector:
    istio: pep-dps-ingress-gw01
  servers:
  - hosts:
    - dummy-passthrough-pep-dps-dps-amp-dev.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    name: pep-dps-dps-amp-dev-cv-gw-tls-443
    port:
      name: https-pep-dps-dps-amp-dev-cv-gw-tls-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - pep-dps-dps-amp-dev-cv.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - amp-caf-common-dev.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - amp-ui.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - amp-caf-auth.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - amp-caf-insights.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - amp-orchestrator.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - amp-caf-file-auth.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pep-cgf-amp-temporal-dev-web.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - ampretail360-lite-frontend-dev.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - ampretail360-lite-caf-common-dev.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    name: pep-dps-dps-amp-dev-cv-gw-https-443
    port:
      name: https-pep-dps-dps-amp-dev-cv-gw-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-dps-nonprod-eus-global-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - amp.dev.pepsico.com
    - pep-dps-dps-amp-dev-cv.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - amp-caf-common-dev.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - amp-ui.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - amp-caf-auth.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - amp-caf-insights.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - amp-orchestrator.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - amp-caf-file-auth.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pep-cgf-amp-temporal-dev-web.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - ampretail360-lite-frontend-dev.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - ampretail360-lite-caf-common-dev.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    name: pep-dps-dps-amp-dev-cv-gw-http-80
    port:
      name: http-pep-dps-dps-amp-dev-cv-gw-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true
  - hosts:
    - amp.dev.pepsico.com
    name: pep-dps-dps-amp-dev-cv-gw-https-1-443
    port:
      name: https-pep-dps-dps-amp-dev-cv-gw-1-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-dps-dps-amp-dev-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE

