apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: istio-in-gateway-02
  namespace: istio-system
spec:
  selector:
    istio: pep-dps-ingress-gw02
  servers:
  - hosts:
    - "*.dps.gw02.aks01.eus.nonprod.azure.intra.pepsico.com"
    name: istio-in-gateway-02-wildcard-https-443
    port:
      name: https-lob-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-dps-nonprod-eus-global-01-aks-gw02-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - "*.dps.gw02.aks01.eus.nonprod.azure.intra.pepsico.com"
    name: istio-in-gateway-02-wildcard-http-80
    port:
      name: http-lob-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true
  - hosts:
    - risingwave-dev.dps.gw02.aks01.eus.nonprod.azure.intra.pepsico.com 
    name: tcp-raisingwave-dev-4567
    port:
      name: tcp-raisingwave-dev-4567
      number: 4567
      protocol: TCP
