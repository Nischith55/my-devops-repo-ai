apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-psd-ui-qa-vs
  namespace: pep-dps-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-psd-ui.dps-qa.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-psd-ui.pep-dps-cgf-psd-qa.svc.cluster.local
        port:
          number: 80
          