apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: gpg-frontend
  name: gpg-frontend-qa-vs
  namespace: pep-dps-cgf-gpg-qa
spec:
  gateways:
  - pep-dps-cgf-gpg-qa/pep-dps-cgf-gpg-qa-cv-gw
  hosts:
  - gpg-frontend-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: gpg-frontend.pep-dps-cgf-gpg-qa.svc.cluster.local
        port:
          number: 8080
