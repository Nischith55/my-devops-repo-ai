apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: pep-dps-dps-grirqa-qa-cv-gw
  namespace: pep-dps-dps-grirqa-qa
spec:
  selector:
    istio: pep-dps-ingress-gw01
  servers:
  - hosts:
    - dummy-passthrough-pep-dps-dps-grirqa-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    name: pep-dps-dps-grirqa-qa-cv-gw-tls-443
    port:
      name: https-pep-dps-dps-grirqa-qa-cv-gw-tls-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - dummy-pep-dps-dps-grirqa-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - it-snt-grir-teams-app-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - grir-orchestrator-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pepsico-snt-grir-s4-backend-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pepsico-snt-grir-ariba-backend-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - grir-sourcing-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    name: pep-dps-dps-grirqa-qa-cv-gw-https-443
    port:
      name: https-pep-dps-dps-grirqa-qa-cv-gw-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-dps-nonprod-eus-global-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - grir.qa.pepsico.com
    name: pep-dps-grir-qa-cv-gw-https-443
    port:
      name: https-pep-dps-grir-qa-cv-gw-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: grir-qa-dps-pepsico-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - dummy-pep-dps-dps-grirqa-qa-80.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - it-snt-grir-teams-app-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - grir-orchestrator-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pepsico-snt-grir-s4-backend-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pepsico-snt-grir-ariba-backend-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - grir-sourcing-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - grir.qa.pepsico.com
    name: pep-dps-dps-grirqa-qa-cv-gw-http-80
    port:
      name: http-pep-dps-dps-grirqa-qa-cv-gw-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true

