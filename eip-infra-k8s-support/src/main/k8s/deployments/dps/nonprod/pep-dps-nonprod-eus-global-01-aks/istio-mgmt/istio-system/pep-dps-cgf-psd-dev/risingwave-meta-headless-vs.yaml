apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: risingwave-meta-headless-vs
  namespace: pep-dps-istio-config
spec:
  gateways:
    - istio-system/istio-in-gateway-02
  hosts:
  - risingwave-meta-headless.dps.gw02.aks01.eus.nonprod.azure.intra.pepsico.com
