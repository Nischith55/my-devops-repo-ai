apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: receipt-scanning-extractor-service-vs
  namespace: pep-dps-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - receipt-scanning-extractor-service.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: receipt-scanning-extractor-service.pep-dps-cgf-extractor-dev.svc.cluster.local
        port:
          number: 8082
          