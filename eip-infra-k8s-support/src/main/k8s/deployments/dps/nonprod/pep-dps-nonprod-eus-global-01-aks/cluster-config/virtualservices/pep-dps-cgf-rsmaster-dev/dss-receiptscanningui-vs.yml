apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: dss-receiptscanningui
  name: dss-receiptscanningui-vs
  namespace: pep-dps-cgf-rsmaster-dev
spec:
  gateways:
  - pep-dps-cgf-rsmaster-dev/pep-dps-cgf-rsmaster-dev-cv-gw
  hosts:
  - dss-receiptscanningui.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: dss-receiptscanningui.pep-dps-cgf-rsmaster-dev.svc.cluster.local
        port:
          number: 80
