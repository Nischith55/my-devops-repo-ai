apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: pep-dps-latam-bffmerch-qa-cv-gw
  namespace: pep-dps-latam-bffmerch-qa
spec:
  selector:
    istio: pep-dps-ingress-gw01
  servers:
