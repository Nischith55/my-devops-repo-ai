  - pep-dps-qa-bdr-sync-service.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  gateways:
  - pep-dps-dps-bdrtapp-qa/pep-dps-dps-bdrtapp-qa-cv-gw
