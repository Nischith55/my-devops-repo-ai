apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pepsico-retail-360-frontend-vs
  namespace: pep-dps-istio-config
spec:
  gateways:
    - istio-system/istio-in-gateway-01
  hosts:
  - pepsico-retail-360-frontend-dev.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  - retail360.hfdev.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pepsico-retail-360-frontend.pep-dps-cgf-retaildev-dev.svc.cluster.local
        port:
          number: 8080