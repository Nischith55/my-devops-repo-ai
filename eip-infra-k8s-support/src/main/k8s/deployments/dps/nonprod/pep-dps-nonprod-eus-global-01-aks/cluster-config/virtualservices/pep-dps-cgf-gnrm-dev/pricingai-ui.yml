apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pricingai-ui
    app.kubernetes.io/instance: pricingai-ui-dev
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: 1.16.3
    helm.sh/chart: platform-chart-0.1.2
  name: pricingai-ui
  namespace: pep-dps-cgf-gnrm-dev
spec:
  gateways:
  - pep-dps-cgf-gnrm-dev/pep-dps-cgf-gnrm-dev-cv-gw
  hosts:
  - pricing-ai-ui-dev.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pricingai-ui.pep-dps-cgf-gnrm-dev.svc.cluster.local
        port:
          number: 80
