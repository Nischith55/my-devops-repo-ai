apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: apollo-router-5-vs
  namespace: pep-dps-istio-config
spec:
  gateways:
    - istio-system/istio-in-gateway-01
  hosts:
  - apollo-router-5.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: apollo-router-5.pep-dps-cgf-retaildev-dev.svc.cluster.local
        port:
          number: 8081