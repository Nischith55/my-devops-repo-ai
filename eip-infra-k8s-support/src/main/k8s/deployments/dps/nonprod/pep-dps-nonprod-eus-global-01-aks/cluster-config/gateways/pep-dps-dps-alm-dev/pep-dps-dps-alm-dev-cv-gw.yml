apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: pep-dps-dps-alm-dev-cv-gw
  namespace: pep-dps-dps-alm-dev
spec:
  selector:
    istio: pep-dps-ingress-gw01
  servers:
  - hosts:
    - dummy-passthrough-pep-dps-dps-alm-dev.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    name: pep-dps-dps-alm-dev-cv-gw-tls-443
    port:
      name: https-pep-dps-dps-alm-dev-cv-gw-tls-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - dummy-pep-dps-dps-alm-dev.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - alm-gt-dashboard.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - alm-ado-service.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - alm-data-ingestion.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - alm-react-frontend.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - alm-gt-dashboard.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - alm-data-ingestion.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - alm-ado-service.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - alm-react-frontend.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    name: pep-dps-dps-alm-dev-cv-gw-https-443
    port:
      name: https-pep-dps-dps-alm-dev-cv-gw-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-dps-nonprod-eus-global-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - dummy-pep-dps-dps-alm-dev-80.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - alm-gt-dashboard.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - alm-ado-service.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - alm-data-ingestion.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - alm-react-frontend.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - alm-gt-dashboard.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - alm-data-ingestion.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - alm-ado-service.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - alm-react-frontend.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - insightboard.dev.pepsico.com
    name: pep-dps-dps-alm-dev-cv-gw-http-80
    port:
      name: http-pep-dps-dps-alm-dev-cv-gw-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true
  - hosts:
    - insightboard.dev.pepsico.com
    name: pep-dps-dps-alm-dev-cv-gw-3-https-443
    port:
      name: pep-dps-dps-alm-dev-cv-gw-3-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: insightboard.dev-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE

