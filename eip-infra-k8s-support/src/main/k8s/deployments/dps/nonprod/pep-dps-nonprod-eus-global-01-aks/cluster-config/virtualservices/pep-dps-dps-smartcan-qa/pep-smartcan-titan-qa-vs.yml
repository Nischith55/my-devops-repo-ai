apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-smartcan-titan-app
  namespace: pep-dps-dps-smartcan-qa
spec:
  gateways:
  - pep-dps-dps-smartcan-qa/pep-dps-dps-smartcan-qa-cv-gw
  hosts:
  - smartcancms.qa.pepsico.com
  - pep-smartcan-titan-app-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-smartcan-titan-app.pep-dps-dps-smartcan-qa.svc.cluster.local
        port:
          number: 8080
