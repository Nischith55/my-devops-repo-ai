apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-feature-toggle
  name: pep-feature-toggle-vs
  namespace: pep-dps-sntdps-toggle-dev
spec:
  gateways:
  - pep-dps-sntdps-toggle-dev/pep-dps-sntdps-toggle-dev-cv-gw
  hosts:
  - pep-feature-toggle.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-feature-toggle.pep-dps-sntdps-toggle-dev.svc.cluster.local
        port:
          number: 3000
