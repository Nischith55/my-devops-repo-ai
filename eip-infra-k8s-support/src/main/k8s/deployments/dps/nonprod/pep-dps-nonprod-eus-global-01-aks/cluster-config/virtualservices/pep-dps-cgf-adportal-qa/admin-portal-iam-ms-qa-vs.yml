apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: admin-portal-iam-ms
  name: admin-portal-iam-ms-qa-vs
  namespace: pep-dps-cgf-adportal-qa
spec:
  gateways:
  - pep-dps-cgf-adportal-qa/pep-dps-cgf-adportal-qa-cv-gw
  hosts:
  - admin-portal-iam-ms-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: admin-portal-iam-ms.pep-dps-cgf-adportal-qa.svc.cluster.local
        port:
          number: 8080
    corsPolicy:
      allowOrigins:
      - exact: https://admin-portal.qa.mypepsico.com
      allowMethods:
      - POST
      - GET
      - PUT
      - DELETE
      - OPTIONS
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Content-Type
      exposeHeaders:
      - x-total-count
