apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pepsico-ds-library-vs
  namespace: pep-dps-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pepsico-ds-library.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pepsico-ds-library.pep-dps-cgf-peacock-dev.svc.cluster.local
        port:
          number: 80
          