apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: pep-dps-dps-vcr-qa-cv-gw
  namespace: pep-dps-dps-vcr-qa
spec:
  selector:
    istio: pep-dps-ingress-gw01
  servers:
  - hosts:
    - dummy-passthrough-pep-dps-dps-vcr-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    name: pep-dps-dps-vcr-qa-cv-gw-tls-443
    port:
      name: https-pep-dps-dps-vcr-qa-cv-gw-tls-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - pepsico-manufacturing-vcr-alerts-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pepsico-manufacturing-vcr-api-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pepsico-manufacturing-vcr-frontend-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pepsico-manufacturing-mct-kafka-consumer-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pepsico-manufacturing-mct-chatpro-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    name: pep-dps-dps-vcr-qa-cv-gw-https-443
    port:
      name: https-pep-dps-dps-vcr-qa-cv-gw-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-dps-nonprod-eus-global-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - pepsico-manufacturing-vcr-alerts-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pepsico-manufacturing-vcr-api-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pepsico-manufacturing-vcr-frontend-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pepsico-manufacturing-mct-kafka-consumer-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pepsico-manufacturing-mct-chatpro-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    name: pep-dps-dps-vcr-qa-cv-gw-http-80
    port:
      name: http-pep-dps-dps-vcr-qa-cv-gw-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true
  - hosts:
    - vcr.qa.pepsico.com
    name: pep-dps-dps-vcr-qa-cv-gw-https-1-443
    port:
      name: https-pep-dps-dps-vcr-qa-cv-gw-1-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-dps-nonprod-eus-global-vcrqa-pepsico-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE

