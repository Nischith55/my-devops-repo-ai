apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pepsico-ds-peacock
  name: pepsico-ds-peacock-qa-vs
  namespace: pep-dps-cgf-peacock-qa
spec:
  gateways:
  - pep-dps-cgf-peacock-qa/pep-dps-cgf-peacock-qa-cv-gw
  hosts:
  - pepsico-ds-peacock-qa.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pepsico-ds-peacock.pep-dps-cgf-peacock-qa.svc.cluster.local
        port:
          number: 80
