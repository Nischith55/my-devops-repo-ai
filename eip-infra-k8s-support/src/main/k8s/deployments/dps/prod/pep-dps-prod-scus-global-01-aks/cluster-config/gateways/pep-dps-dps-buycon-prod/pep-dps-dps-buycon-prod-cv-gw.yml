apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: pep-dps-dps-buycon-prod-cv-gw
  namespace: pep-dps-dps-buycon-prod
spec:
  selector:
    istio: pep-dps-ingress-gw01
  servers:
  - hosts:
    - dummy-passthrough-pep-dps-dps-buycon-prod.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    name: pep-dps-dps-buycon-prod-cv-gw-tls-443
    port:
      name: https-pep-dps-dps-buycon-prod-cv-gw-tls-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - pep-dps-dps-buycon-prod-cv.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pepsico-buyerconsole-frontend.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pepsico-buyer-console-api.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pepsico-buyer-console-kpiprocessor.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pepsico-buyerconsole-ai-api.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - spendanalytics-ai-api.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    name: pep-dps-dps-buycon-prod-cv-gw-https-443
    port:
      name: https-pep-dps-dps-buycon-prod-cv-gw-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-dps-prod-scus-global-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - buyerconsole.pepsico.com
    - pep-dps-dps-buycon-prod-cv.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pepsico-buyerconsole-frontend.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pepsico-buyer-console-api.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pepsico-buyer-console-kpiprocessor.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - procurementhub.mypepsico.com
    - pepsico-buyerconsole-ai-api.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - spendanalytics-ai-api.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    name: pep-dps-dps-buycon-prod-cv-gw-http-80
    port:
      name: http-pep-dps-dps-buycon-prod-cv-gw-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true
  - hosts:
    - buyerconsole.pepsico.com
    name: pep-dps-dps-buycon-prod-cv-gw-https-1-443
    port:
      name: https-pep-dps-dps-buycon-prod-cv-gw-1-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-dps-dps-buycon-prod-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - procurementhub.mypepsico.com
    name: pep-dps-dps-buycon-prod-cv-gw-4-https-443
    port:
      name: pep-dps-dps-buycon-prod-cv-gw-4-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: procurementhub-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE

