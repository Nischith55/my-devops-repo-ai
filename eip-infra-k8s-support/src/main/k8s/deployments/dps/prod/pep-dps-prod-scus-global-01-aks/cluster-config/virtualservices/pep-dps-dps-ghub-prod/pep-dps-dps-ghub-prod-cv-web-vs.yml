apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-dps-dps-ghub-prod-cv-web-vs
  namespace: pep-dps-dps-ghub-prod
  labels:
    app: pep-dps-dps-ghub-prod-cv-web
spec:
  hosts:
    - ghub.mypepsico.com
    - pep-dps-dps-ghub-prod-cv.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
  gateways:
  - pep-dps-dps-ghub-prod/pep-dps-dps-ghub-prod-cv-gw
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host:  pep-dps-dps-ghub-prod-cv-web.pep-dps-dps-ghub-prod.svc.cluster.local
        port:
          number: 80