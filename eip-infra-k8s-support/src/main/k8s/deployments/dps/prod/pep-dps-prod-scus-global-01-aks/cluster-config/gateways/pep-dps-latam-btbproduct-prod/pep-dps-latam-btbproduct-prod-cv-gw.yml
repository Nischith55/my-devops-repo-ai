apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: pep-dps-latam-btbproduct-prod-cv-gw
  namespace: pep-dps-latam-btbproduct-prod
spec:
  selector:
    istio: pep-dps-ingress-gw01
  servers:
  - hosts:
    - dummy-passthrough-pep-dps-latam-btbproduct-prod.gw01.aks01.scus.prod.azure.intra.pepsico.com
    name: pep-dps-latam-btbproduct-prod-cv-gw-tls-443
    port:
      name: https-pep-dps-latam-btbproduct-prod-cv-gw-tls-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - dummy-pep-dps-latam-btbproduct-prod-443.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - b2b-product-admin-ui.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - b2b-products.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - b2b-domainsync.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - b2b-elastic.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - b2b-domainsync-co.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - b2b-elastic-co.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    name: pep-dps-latam-btbproduct-prod-cv-gw-https-443
    port:
      name: https-pep-dps-latam-btbproduct-prod-cv-gw-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-dps-prod-scus-global-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - dummy-pep-dps-latam-btbproduct-prod-80.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - b2b-product-admin-ui.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - products-b2b.pepsico.com
    - b2b-products.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - b2b-domainsync.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - b2b-elastic.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - b2b-domainsync-co.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - b2b-elastic-co.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    name: pep-dps-latam-btbproduct-prod-cv-gw-http-80
    port:
      name: http-pep-dps-latam-btbproduct-prod-cv-gw-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true
  - hosts:
    - products-b2b.pepsico.com
    name: pep-dps-latam-btbproduct-prod-cv-gw-3-https-443
    port:
      name: pep-dps-latam-btbproduct-prod-cv-gw-3-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: products-b2b-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE

