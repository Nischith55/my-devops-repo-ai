apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: afh-menupro-temporal-prod-web-vs
  namespace: pep-dps-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - afh-menupro-temporal-prod-web.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: afh-menupro-temporal-prod-web.pep-dps-dps-afhmenu-prod.svc.cluster.local
        port:
          number: 80