apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: pep-dps-sntdps-toggle-prod-cv-gw
  namespace: pep-dps-sntdps-toggle-prod
spec:
  selector:
    istio: pep-dps-ingress-gw01
  servers:
  - hosts:
    - dummy-passthrough-pep-dps-sntdps-toggle-prod.gw01.aks01.scus.prod.azure.intra.pepsico.com
    name: pep-dps-sntdps-toggle-prod-cv-gw-tls-443
    port:
      name: https-pep-dps-sntdps-toggle-prod-cv-gw-tls-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - dummy-pep-dps-sntdps-toggle-prod-443.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pep-feature-toggle.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pep-feature-toggle-proxy.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pep-feature-toggle-backend.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pep-feature-toggle-rev-proxy.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    name: pep-dps-sntdps-toggle-prod-cv-gw-https-443
    port:
      name: https-pep-dps-sntdps-toggle-prod-cv-gw-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-dps-prod-scus-global-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - dummy-pep-dps-sntdps-toggle-prod-80.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pep-feature-toggle.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pep-feature-toggle-proxy.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pep-feature-toggle-backend.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - toggle.prod.mypepsico.com
    - featuretoggle.mypepsico.com
    - pep-feature-toggle-rev-proxy.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    name: pep-dps-sntdps-toggle-prod-cv-gw-http-80
    port:
      name: http-pep-dps-sntdps-toggle-prod-cv-gw-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true
  - hosts:
    - toggle.prod.mypepsico.com
    name: pep-dps-sntdps-toggle-prod-cv-gw-3-https-443
    port:
      name: pep-dps-sntdps-toggle-prod-cv-gw-3-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: toggle.prod-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - featuretoggle.mypepsico.com
    name: pep-dps-sntdps-feature-toggle-prod-cv-gw-3-https-443
    port:
      name: pep-dps-sntdps-feature-toggle-prod-cv-gw-3-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-dps-sntdps-feature-toggle-prod-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE

