apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-dps-nginx-vs
  namespace: pep-dps-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-dps-nginx-curl.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-dps-nginx.pep-dps-infra-prod.svc.cluster.local
        port: 
          number: 8080