apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: pep-dps-cgf-peacock-prod-cv-gw
  namespace: pep-dps-cgf-peacock-prod
spec:
  selector:
    istio: pep-dps-ingress-gw01
  servers:
  - hosts:
    - dummy-passthrough-pep-dps-cgf-peacock-prod.gw01.aks01.scus.prod.azure.intra.pepsico.com
    name: pep-dps-cgf-peacock-prod-cv-gw-tls-443
    port:
      name: https-pep-dps-cgf-peacock-prod-cv-gw-tls-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - dummy-pep-dps-cgf-peacock-prod-443.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pepsico-ds-peacock.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pepsico-ds-library.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pepsico-ds-inner-source.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pepsico-ds-inner-source.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    name: pep-dps-cgf-peacock-prod-cv-gw-https-443
    port:
      name: https-pep-dps-cgf-peacock-prod-cv-gw-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-dps-prod-scus-global-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - dummy-pep-dps-cgf-peacock-prod-80.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pepsico-ds-peacock.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pepsico-ds-library.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - peacock.pepsico.com
    - library.pepsico.com
    - pepsico-ds-inner-source.dps.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pepsico-ds-inner-source.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - innersource.pepsico.com
    name: pep-dps-cgf-peacock-prod-cv-gw-http-80
    port:
      name: http-pep-dps-cgf-peacock-prod-cv-gw-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true
  - hosts:
    - library.pepsico.com
    name: pep-dps-cgf-peacock-prod-cv-gw-1-https-443
    port:
      name: https-pep-dps-cgf-peacock-prod-cv-gw-1-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-dps-prod-scus-library-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - peacock.pepsico.com
    name: pep-dps-cgf-peacock-prod-cv-gw-2-https-443
    port:
      name: https-pep-dps-cgf-peacock-prod-cv-gw-2-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-dps-prod-scus-peacock-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - innersource.pepsico.com
    name: pep-dps-cgf-peacock-prod-cv-gw-5-https-443
    port:
      name: pep-dps-cgf-peacock-prod-cv-gw-5-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: innersource-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE

