apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: pep-dps-dps-ghub-prod-cv-gw
  namespace: pep-dps-dps-ghub-prod
spec:
  selector:
    istio: pep-dps-ingress-gw01
  servers:
  - hosts:
    - dummy-passthrough-pep-dps-dps-ghub-prod.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    name: pep-dps-dps-ghub-prod-cv-gw-tls-443
    port:
      name: https-pep-dps-dps-ghub-prod-cv-gw-tls-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - pep-dps-dps-ghub-prod-cv.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - agro-growers-hub-web.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - agro-growers-hub-service.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    name: pep-dps-dps-ghub-prod-cv-gw-https-443
    port:
      name: https-pep-dps-dps-ghub-prod-cv-gw-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-dps-prod-scus-global-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - ghub.mypepsico.com
    - flgrowershub.pepsico.com
    - pep-dps-dps-ghub-prod-cv.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - agro-growers-hub-web.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - agro-growers-hub-service.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    name: pep-dps-dps-ghub-prod-cv-gw-http-80
    port:
      name: http-pep-dps-dps-ghub-prod-cv-gw-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true
  - hosts:
    - ghub.mypepsico.com
    name: pep-dps-dps-ghub-prod-cv-gw-https-1-443
    port:
      name: https-pep-dps-dps-ghub-prod-cv-gw-1-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-dps-dps-ghub-prod-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - flgrowershub.pepsico.com
    name: pep-dps-dps-flgrowershub-prod-cv-gw-https-1-443
    port:
      name: https-pep-dps-dps-flgrowershub-prod-cv-gw-1-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-dps-dps-flgrowershubhub-prod-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE

