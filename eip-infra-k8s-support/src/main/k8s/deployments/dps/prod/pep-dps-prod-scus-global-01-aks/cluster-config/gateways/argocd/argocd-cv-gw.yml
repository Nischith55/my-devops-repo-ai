apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: argocd-cv-gw
  namespace: argocd
spec:
  selector:
    istio: pep-dps-ingress-gw01
  servers:
  - hosts:
    - dummy-passthrough-argocd.gw01.aks01.scus.prod.azure.intra.pepsico.com
    name: argocd-cv-gw-tls-443
    port:
      name: https-argocd-cv-gw-tls-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - argocd.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    name: argocd-cv-gw-https-443
    port:
      name: https-argocd-cv-gw-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-dps-prod-scus-global-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - argocd.dps.scus.intra.pepsico.com
    name: argocd-cv-gw-https-443-argocd
    port:
      name: https-argocd-cv-gw-443-argocd
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: argocd-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - argocd.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - argocd.dps.scus.intra.pepsico.com
    name: argocd-cv-gw-http-80
    port:
      name: http-argocd-cv-gw-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true

