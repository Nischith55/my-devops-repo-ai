apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-global-appruntimeapi-vs
  namespace: pep-dps-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-global-appruntimeapi.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /apprt-api
    route:
    - destination:
        host: pep-global-appruntimeapi.pep-dps-cgf-appruntime-prod.svc.cluster.local
        port:
          number: 80