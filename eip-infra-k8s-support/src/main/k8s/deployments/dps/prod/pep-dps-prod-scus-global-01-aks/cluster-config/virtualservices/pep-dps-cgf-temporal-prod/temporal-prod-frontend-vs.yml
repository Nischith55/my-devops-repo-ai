apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  annotations: {}
  labels:
    app: undefined
  name: temporal-prod-frontend-vs
  namespace: pep-dps-cgf-temporal-prod
spec:
  gateways:
  - pep-dps-cgf-temporal-prod/pep-dps-cgf-temporal-prod-cv-gw
  hosts:
  - temporal-prod-frontend.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
