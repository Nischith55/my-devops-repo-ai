apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: journey-optimizer-processor-vs
  namespace: pep-dps-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - journey-optimizer-processor.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: journey-optimizer-processor.pep-dps-cgf-cct-prod.svc.cluster.local
        port:
          number: 8080