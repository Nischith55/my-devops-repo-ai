apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  annotations: {}
  labels:
    app: pep-dss-fmcs
  name: pep-dss-fmcs-vs
  namespace: pep-dps-cgf-fmcs-prod
spec:
  gateways:
  - pep-dps-cgf-fmcs-prod/pep-dps-cgf-fmcs-prod-cv-gw
  hosts:
  - pep-dss-fmcs.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-dss-fmcs.pep-dps-cgf-fmcs-prod.svc.cluster.local
        port:
          number: 80
