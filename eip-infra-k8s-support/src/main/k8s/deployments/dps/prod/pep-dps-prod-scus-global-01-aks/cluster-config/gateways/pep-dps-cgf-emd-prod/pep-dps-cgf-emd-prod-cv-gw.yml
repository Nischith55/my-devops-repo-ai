apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: pep-dps-cgf-emd-prod-cv-gw
  namespace: pep-dps-cgf-emd-prod
spec:
  selector:
    istio: pep-dps-ingress-gw01
  servers:
  - hosts:
    - dummy-passthrough-pep-dps-cgf-emd-prod.gw01.aks01.scus.prod.azure.intra.pepsico.com
    name: pep-dps-cgf-emd-prod-cv-gw-tls-443
    port:
      name: https-pep-dps-cgf-emd-prod-cv-gw-tls-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - dummy-pep-dps-cgf-emd-prod-443.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pep-cicdmaturity-caf-hygieia-execdashboard-api.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pep-cicdmaturity-hygieia-team-ui.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pep-cicdmaturity-caf.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pep-cicdmaturity-hygieia-exec-dashboard.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - emd-frontend.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pep-cicdmaturity-caf-events-consumer.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pep-cicdmaturity-caf-ado-workitem-events-consumer.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    name: pep-dps-cgf-emd-prod-cv-gw-https-443
    port:
      name: https-pep-dps-cgf-emd-prod-cv-gw-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-dps-prod-scus-global-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - dummy-pep-dps-cgf-emd-prod-80.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pep-cicdmaturity-caf-hygieia-execdashboard-api.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pep-cicdmaturity-hygieia-team-ui.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pep-cicdmaturity-caf.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pep-cicdmaturity-hygieia-exec-dashboard.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - execdashboard.intra.pepsico.com
    - cicdmaturity.mypepsico.com
    - cicddashboard.intra.pepsico.com
    - emd-frontend.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pep-cicdmaturity-caf-events-consumer.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pep-cicdmaturity-caf-ado-workitem-events-consumer.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    name: pep-dps-cgf-emd-prod-cv-gw-http-80
    port:
      name: http-pep-dps-cgf-emd-prod-cv-gw-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true
  - hosts:
    - execdashboard.intra.pepsico.com
    name: pep-dps-cgf-cicd-prod-cv-gw-1-https-443
    port:
      name: https-pep-dps-cgf-cicd-prod-cv-gw-1-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-dps-prod-scus-exedashboard-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - cicdmaturity.mypepsico.com
    name: pep-dps-cgf-cicd-prod-cv-gw-2-https-443
    port:
      name: https-pep-dps-cgf-cicd-prod-cv-gw-2-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-dps-prod-eus-cicdmaturity-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - cicddashboard.intra.pepsico.com
    name: pep-dps-cgf-cicd-prod-cv-gw-3-https-443
    port:
      name: https-pep-dps-cgf-cicd-prod-cv-gw-3-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-dps-prod-scus-cicddashboard-intra-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE

