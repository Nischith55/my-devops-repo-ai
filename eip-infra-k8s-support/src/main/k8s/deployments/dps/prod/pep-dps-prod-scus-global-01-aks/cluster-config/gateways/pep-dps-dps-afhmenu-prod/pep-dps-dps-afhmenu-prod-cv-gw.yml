    - afh-menupro-search-api-prod.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - afh-menupro-ui-prod.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pep-dps-dps-afhmenu-prod-cv.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - afh-menupro-temporal-prod-web.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - afh-menupro-insights-prod.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    name: pep-dps-dps-afhmenu-prod-cv-gw-https-443
    port:
      name: https-pep-dps-dps-afhmenu-prod-cv-gw-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-dps-prod-scus-global-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - afh-menupro-auditengine-prod.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - afh-menupro-fileproxy-api-prod.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - afh-menupro-orchestrator-prod.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - afh-menupro-recoengine-prod.dps.gw01.aks01.scus.prod.azure.intra.pepsico.com
