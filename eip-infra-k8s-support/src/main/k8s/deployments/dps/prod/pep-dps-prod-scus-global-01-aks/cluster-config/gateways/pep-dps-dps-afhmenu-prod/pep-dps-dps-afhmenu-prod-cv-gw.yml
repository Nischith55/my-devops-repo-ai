apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: pep-dps-dps-afhmenu-prod-cv-gw
  namespace: pep-dps-dps-afhmenu-prod
spec:
  selector:
    istio: pep-dps-ingress-gw01
  servers:
  - hosts:
    - dummy-passthrough-pep-dps-dps-afhmenu-prod.gw01.aks01.scus.prod.azure.intra.pepsico.com
