apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-gscaf-global-producer-vs
  namespace: pep-dps-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-gscaf-global-producer.dps.gw01.aks01.suk.prod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-gscaf-global-producer.pep-dps-europe-gscafso-prod.svc.cluster.local
        port: 
          number: 80