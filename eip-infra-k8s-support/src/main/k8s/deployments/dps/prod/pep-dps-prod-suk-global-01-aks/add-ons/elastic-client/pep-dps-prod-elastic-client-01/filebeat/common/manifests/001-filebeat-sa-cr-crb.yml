# ##
# PEP
# - filebeat SA, CR and CRB
# - change NAMESPACE
# - minimum required permissions for filebeat to operate
# ##
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: filebeat
  namespace: pep-dps-elastic-client-01
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pep-dps-elastic-client-01-filebeat
roleRef:
  kind: ClusterRole
  name: pep-dps-prod-elastic-client-filebeat
  apiGroup: rbac.authorization.k8s.io
subjects:
- kind: ServiceAccount
  name: filebeat
  namespace: pep-dps-elastic-client-01