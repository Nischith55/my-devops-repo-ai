  namespace: pep-dps-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pepsico-pepconnect-b2bweb-romania.dps.gw01.aks01.suk.prod.azure.intra.pepsico.com
