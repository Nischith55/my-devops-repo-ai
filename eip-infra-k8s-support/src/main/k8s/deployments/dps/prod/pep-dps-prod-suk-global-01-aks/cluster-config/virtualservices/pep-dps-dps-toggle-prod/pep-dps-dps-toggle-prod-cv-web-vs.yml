apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-dps-dps-toggle-prod-cv-web-vs
  namespace: pep-dps-dps-toggle-prod
  labels:
    app: pep-dps-dps-toggle-prod-cv-web
spec:
  hosts:
    - toggle-eu-prod.pepsico.com
    - pep-dps-dps-toggle-prod-cv.dps.gw01.aks01.suk.prod.azure.intra.pepsico.com
  gateways:
  - pep-dps-dps-toggle-prod/pep-dps-dps-toggle-prod-cv-gw
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host:  pep-dps-dps-toggle-prod-cv-web.pep-dps-dps-toggle-prod.svc.cluster.local
        port:
          number: 80