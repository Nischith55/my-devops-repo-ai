  namespace: pep-dps-dps-r360prod-prod
  labels:
      app: r360-caf-nginx
spec:
  hosts:
  - pep-sntdps-prod-r360-caf-nginx.dps.gw01.aks01.suk.prod.azure.intra.pepsico.com
  - eur360assets.pepsico.com
  gateways:
