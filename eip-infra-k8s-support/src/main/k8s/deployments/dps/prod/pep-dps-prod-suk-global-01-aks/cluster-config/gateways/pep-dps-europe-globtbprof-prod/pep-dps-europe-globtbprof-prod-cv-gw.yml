      name: http-pep-dps-europe-globtbprof-prod-cv-gw-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true
  - hosts:
    - profile-b2b-pl.pepsico.com
    name: pep-dps-europe-globtbprof-prod-cv-gw-3-https-443
    port:
      name: pep-dps-europe-globtbprof-prod-cv-gw-3-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: profile-b2b-pl-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE

