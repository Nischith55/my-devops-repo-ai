apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: pep-dps-europe-globtbprof-prod-cv-gw
  namespace: pep-dps-europe-globtbprof-prod
spec:
  selector:
    istio: pep-dps-ingress-gw01
  servers:
  - hosts:
    - dummy-passthrough-pep-dps-europe-globtbprof-prod.gw01.aks01.suk.prod.azure.intra.pepsico.com
    name: pep-dps-europe-globtbprof-prod-cv-gw-tls-443
    port:
      name: https-pep-dps-europe-globtbprof-prod-cv-gw-tls-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - dummy-pep-dps-europe-globtbprof-prod-443.gw01.aks01.suk.prod.azure.intra.pepsico.com
    - b2b-profile-admin-bff-eu.dps.gw01.aks01.suk.prod.azure.intra.pepsico.com
    - b2b-profile-admin-bff-in.dps.gw01.aks01.suk.prod.azure.intra.pepsico.com
    - b2b-profile-eu.dps.gw01.aks01.suk.prod.azure.intra.pepsico.com
    - b2b-profile-in.dps.gw01.aks01.suk.prod.azure.intra.pepsico.com
    - b2b-profile-admin-ui-pl.dps.gw01.aks01.suk.prod.azure.intra.pepsico.com
    - b2b-cnc-segments-in.dps.gw01.aks01.suk.prod.azure.intra.pepsico.com
    - b2b-cnc-content-in.dps.gw01.aks01.suk.prod.azure.intra.pepsico.com
    - b2b-cnc-stores-in.dps.gw01.aks01.suk.prod.azure.intra.pepsico.com
    name: pep-dps-europe-globtbprof-prod-cv-gw-https-443
    port:
      name: https-pep-dps-europe-globtbprof-prod-cv-gw-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-dps-prod-suk-global-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - dummy-pep-dps-europe-globtbprof-prod-80.gw01.aks01.suk.prod.azure.intra.pepsico.com
    - b2b-profile-admin-bff-eu.dps.gw01.aks01.suk.prod.azure.intra.pepsico.com
    - b2b-profile-admin-bff-in.dps.gw01.aks01.suk.prod.azure.intra.pepsico.com
    - b2b-profile-eu.dps.gw01.aks01.suk.prod.azure.intra.pepsico.com
    - b2b-profile-in.dps.gw01.aks01.suk.prod.azure.intra.pepsico.com
    - b2b-profile-admin-ui-pl.dps.gw01.aks01.suk.prod.azure.intra.pepsico.com
