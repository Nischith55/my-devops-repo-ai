apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: pep-dps-dps-sparklt-prod-cv-gw
  namespace: pep-dps-dps-sparklt-prod
spec:
  selector:
    istio: pep-dps-ingress-gw01
  servers:
  - hosts:
    - dummy-passthrough-pep-dps-dps-sparklt-prod.dps.gw01.aks01.suk.prod.azure.intra.pepsico.com
    name: pep-dps-dps-sparklt-prod-cv-gw-tls-443
    port:
      name: https-pep-dps-dps-sparklt-prod-cv-gw-tls-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - pep-dps-dps-sparklt-prod-cv.dps.gw01.aks01.suk.prod.azure.intra.pepsico.com
    - pepsico-spark-lite-frontend.dps.gw01.aks01.suk.prod.azure.intra.pepsico.com
    - pepsico-spark-lite-backend.dps.gw01.aks01.suk.prod.azure.intra.pepsico.com
    name: pep-dps-dps-sparklt-prod-cv-gw-https-443
    port:
      name: https-pep-dps-dps-sparklt-prod-cv-gw-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-dps-prod-suk-global-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - sparklite.mypepsico.com
    - pep-dps-dps-sparklt-prod-cv.dps.gw01.aks01.suk.prod.azure.intra.pepsico.com
    - pepsico-spark-lite-frontend.dps.gw01.aks01.suk.prod.azure.intra.pepsico.com
    - pepsico-spark-lite-backend.dps.gw01.aks01.suk.prod.azure.intra.pepsico.com
    name: pep-dps-dps-sparklt-prod-cv-gw-http-80
    port:
      name: http-pep-dps-dps-sparklt-prod-cv-gw-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true
  - hosts:
    - sparklite.mypepsico.com
    name: pep-dps-dps-sparklt-prod-cv-gw-https-1-443
    port:
      name: https-pep-dps-dps-sparklt-prod-cv-gw-1-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-dps-dps-sparklt-prod-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE

