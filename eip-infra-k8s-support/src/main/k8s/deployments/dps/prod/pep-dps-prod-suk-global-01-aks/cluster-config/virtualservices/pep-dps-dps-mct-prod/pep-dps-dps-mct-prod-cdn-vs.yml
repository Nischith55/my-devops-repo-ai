apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-dps-dps-mct-prod-cv-cdn-vs
  namespace: pep-dps-dps-mct-prod
spec:
  hosts:
    - mct-eu.pepsico.com
  gateways:
  - "pep-dps-dps-mct-prod/pep-dps-dps-mct-prod-cv-gw"
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: "/"
    route:
    - destination:
        host:  "pep-dps-dps-mct-prod-cv-webdeploy.pep-dps-dps-mct-prod.svc.cluster.local"
        port:
          number: 80