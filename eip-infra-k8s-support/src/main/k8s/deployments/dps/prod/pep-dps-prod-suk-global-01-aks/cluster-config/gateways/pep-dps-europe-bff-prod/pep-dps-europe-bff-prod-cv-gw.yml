apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: pep-dps-europe-bff-prod-cv-gw
  namespace: pep-dps-europe-bff-prod
spec:
  selector:
    istio: pep-dps-ingress-gw01
  servers:
  - hosts:
    - dummy-passthrough-pep-dps-europe-bff-prod.gw01.aks01.suk.prod.azure.intra.pepsico.com
    name: pep-dps-europe-bff-prod-cv-gw-tls-443
    port:
      name: https-pep-dps-europe-bff-prod-cv-gw-tls-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - b2b-bff.dps.gw01.aks01.suk.prod.azure.intra.pepsico.com
    - b2b-bff-eg.dps.gw01.aks01.suk.prod.azure.intra.pepsico.com
    - b2b-bff-sa.dps.gw01.aks01.suk.prod.azure.intra.pepsico.com
    - b2b-bff-pl.dps.gw01.aks01.suk.prod.azure.intra.pepsico.com
    - b2b-bff-eu-global.dps.gw01.aks01.suk.prod.azure.intra.pepsico.com
    - b2b-bff-in.dps.gw01.aks01.suk.prod.azure.intra.pepsico.com
    name: pep-dps-europe-bff-prod-cv-gw-https-443
    port:
      name: https-pep-dps-europe-bff-prod-cv-gw-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-dps-prod-suk-global-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - b2b-bff.dps.gw01.aks01.suk.prod.azure.intra.pepsico.com
    - b2b-bff-eg.dps.gw01.aks01.suk.prod.azure.intra.pepsico.com
    - b2b-bff-sa.dps.gw01.aks01.suk.prod.azure.intra.pepsico.com
    - b2b-bff-pl.dps.gw01.aks01.suk.prod.azure.intra.pepsico.com
    - b2b-bff-eu-global.dps.gw01.aks01.suk.prod.azure.intra.pepsico.com
    - b2b-bff-in.dps.gw01.aks01.suk.prod.azure.intra.pepsico.com
    name: pep-dps-europe-bff-prod-cv-gw-http-80
    port:
      name: http-pep-dps-europe-bff-prod-cv-gw-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true

