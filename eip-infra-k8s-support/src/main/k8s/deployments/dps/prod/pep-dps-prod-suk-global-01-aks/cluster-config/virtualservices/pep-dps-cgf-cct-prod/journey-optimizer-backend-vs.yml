apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  annotations: {}
  labels:
    app: undefined
  name: journey-optimizer-backend-vs
  namespace: pep-dps-cgf-cct-prod
spec:
  gateways:
  - pep-dps-cgf-cct-prod/pep-dps-cgf-cct-prod-cv-gw
  hosts:
  - journey-optimizer-backend.dps.gw01.aks01.suk.prod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: journey-optimizer-backend.pep-dps-cgf-cct-prod.svc.cluster.local
        port:
          number: 8080
