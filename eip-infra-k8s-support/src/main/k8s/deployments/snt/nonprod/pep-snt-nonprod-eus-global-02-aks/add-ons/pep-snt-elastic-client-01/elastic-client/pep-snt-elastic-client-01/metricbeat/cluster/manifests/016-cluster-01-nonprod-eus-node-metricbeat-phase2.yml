---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nonprod-eus-global-02-aks-node-metricbeat-config
  namespace: pep-snt-elastic-client-01
data:

  K8S_CLUSTER_NAME: pep-snt-nonprod-eus-global-02-aks

  metricbeat-processor.yml: |

    processors:

    # ~~
    # Add snt fields
    # ~~
    # - add_fields:
    #     target: pfna
    #     fields:
    #       cluster_name: ${K8S_CLUSTER_NAME}

    - add_host_metadata: {}
    - add_fields:
           fields:
             ls-destination: "SCUS"
             pep-aks-cluster: ${K8S_CLUSTER_NAME}

    - add_tags:
        tags: ["PreProd-SNT", "retain-logs"]

    - script:
        lang: javascript
        source: >
          function process(event) {
            event.Put("fields.sn-application", "metrics-pep-snt-nonprod-eus-global-02-aks" + "-" + event.Get("kubernetes.namespace"));
            return event;
          }
    # ~~
    # Logging
    # ~~
    logging:
      level: INFO
      metrics:
        enabled: true

  # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  # metricbeat standard k8s stuff
  # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  metricbeat.yml: |

    # --------------------
    # All outputs
    # --------------------
    # output.logstash:
    #   hosts: ["pepwap23142.corp.pep.pvt:5045", "pepwap23143.corp.pep.pvt:5045", "pepwap23144.corp.pep.pvt:5045"]
    #   loadbalance: true
    #   worker: 3
    setup.template.name: "metrics-kubernetes-tsds"
    setup.template.pattern: "metrics-pep-snt-nonprod-eus-global-02-aks*"
    setup.ilm.enabled: false     

    output.elasticsearch:
        hosts: [https://3825028849b946d3a380f6136dcd7c3a.privatelink.southcentralus.azure.elastic-cloud.com:9243]
        api_key: "GnuNB5MBWuezjPg1DKep:OPckBJB2QHOYgXBnfTHhZw"
        index: "%{[fields][sn-application]}"
        # worker: 2
        # bulk_max_size: 1000
        ssl.verification_mode: none
        timeout: 90s

    # --------------------
    # send metricbeat metrics itself to our monitoring cluster
    # --------------------
    monitoring:
      enabled: false
    http:
      enabled: true
      host: 0.0.0.0
      port: 5066

    metricbeat:

      monitoring:
        enabled: false

      # ~~
      # modules
      # ~~

      modules:

      # +++
      # 1) System: Node/Host metrics
      # +++
      - module: system
        enabled: true
        period: 1m
        metricsets:
        - cpu
        - load
        - memory
        - network
        - process
        - process_summary
        - uptime
        - core
        process:
          include_top_n:
            by_cpu: 5
            by_memory: 5
        processes:
        - .*

      # +++
      # System: FileSystem metrics
      # +++
      - module: system
        period: 1m
        metricsets:
        - filesystem
        - fsstat
        processors:
        - drop_event:
            when:
              regexp:
                system:
                  filesystem:
                    mount_point: ^/(sys|cgroup|proc|dev|etc|host|lib)($|/)

      # +++
      # Kubernetes: kubelet (secure port)
      # +++
      - module: kubernetes
        enabled: true
        # IMPORTANT: when using module directly, it's still host (not node)
        host: ${NODE_NAME}
        period: 30s
        hosts:
        # change to local host kubelet secure port
        - https://${NODE_IP}:10250
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        ssl:
          verification_mode: none
        metricsets:
        - container
        - node
        - pod
        - system
        - volume

      # +++
      # Kubernetes: kube-proxy
      # +++
      # Currently `proxy` metricset is not supported on Openshift,
      - module: kubernetes
        enabled: true
        # IMPORTANT: when using module directly, it's still host (not node)
        host: ${NODE_NAME}
        period: 30s
        metricsets:
          - proxy
        hosts:
          - "${NODE_IP}:10249"
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: &app_name nonprod-eus-global-02-aks-node-metricbeat
  namespace: pep-snt-elastic-client-01
  labels:
    app.kubernetes.io/name: *app_name
    app.kubernetes.io/version: &vers 8.19.11
    app: *app_name
    # match the  ES server version (beats is not backward compatible)
    version: *vers
spec:
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: nonprod-eus-global-02-aks-node-metricbeat
      app.kubernetes.io/version: 8.19.11
  template:
    metadata:
      annotations:
        co.elastic.logs/enabled: "true"
      creationTimestamp: null
      labels:
        app: nonprod-eus-global-02-aks-node-metricbeat
        app.kubernetes.io/name: nonprod-eus-global-02-aks-node-metricbeat
        app.kubernetes.io/version: 8.19.11
        stack-monitoring.elastic.co/type: metricbeat-node
        version: 8.19.11
    spec:
      automountServiceAccountToken: true
      containers:
      - args:
        - --environment
        - container
        - --system.hostfs=/hostfs
        - -e
        - -c
        - /projected/etc/beat-processor-config.yml
        - -c
        - /projected/etc/beat.yml
        env:
        - name: K8S_CLUSTER_NAME
          valueFrom:
            configMapKeyRef:
              key: K8S_CLUSTER_NAME
              name: nonprod-eus-global-02-aks-node-metricbeat-config
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.nodeName
        - name: NODE_IP
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.hostIP
        image: docker.elastic.co/beats/metricbeat:8.19.11
        imagePullPolicy: IfNotPresent
        name: metricbeat
        ports:
        - containerPort: 5066
          name: monitoring
          protocol: TCP
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /projected
          name: config-projected
          readOnly: true
        - mountPath: /hostfs/sys/fs/cgroup
          name: cgroup
        - mountPath: /var/run/docker.sock
          name: dockersock
        - mountPath: /hostfs/proc
          name: proc
        - mountPath: /usr/share/metricbeat/data
          name: data
      dnsPolicy: ClusterFirstWithHostNet
      hostAliases:
      - hostnames:
        - 3825028849b946d3a380f6136dcd7c3a.privatelink.southcentralus.azure.elastic-cloud.com
        ip: 172.27.62.199
      hostNetwork: true
      nodeSelector:
        kubernetes.io/os: linux
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        runAsUser: 0
      serviceAccount: metricbeat
      serviceAccountName: metricbeat
      terminationGracePeriodSeconds: 30
      tolerations:
      - operator: Exists
      volumes:
      - hostPath:
          path: /sys/fs/cgroup
          type: ""
        name: cgroup
      - hostPath:
          path: /var/run/docker.sock
          type: ""
        name: dockersock
      - hostPath:
          path: /proc
          type: ""
        name: proc
      - hostPath:
          path: /var/lib/pep-snt-elastic-client-01/nonprod-eus-global-02-aks-node-metricbeat/metricbeat-data
          type: DirectoryOrCreate
        name: data
      - name: config-projected
        projected:
          defaultMode: 384
          sources:
          - configMap:
              items:
              - key: PepsiCoCA01.pem
                path: etc/certs/PepsiCoCA01.pem
              - key: PepsiCoRootCA.pem
                path: etc/certs/PepsiCoRootCA.pem
              name: pep-ca-certs-config
              optional: false
          - configMap:
              items:
              - key: metricbeat.yml
                path: etc/beat.yml
              - key: metricbeat-processor.yml
                path: etc/beat-processor-config.yml
              name: nonprod-eus-global-02-aks-node-metricbeat-config
              optional: false
  updateStrategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate

