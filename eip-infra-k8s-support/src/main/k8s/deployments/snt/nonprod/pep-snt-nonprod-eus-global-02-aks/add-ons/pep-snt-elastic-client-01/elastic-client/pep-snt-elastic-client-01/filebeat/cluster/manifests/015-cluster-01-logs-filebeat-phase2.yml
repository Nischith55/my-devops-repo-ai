---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: filebeat
  labels:
    k8s-app: filebeat
rules:
- apiGroups: [""] # "" indicates the core API group
  resources:
  - namespaces
  - pods
  - nodes
  verbs:
  - get
  - watch
  - list
- apiGroups: ["apps"]
  resources:
    - replicasets
  verbs: ["get", "list", "watch"]
- apiGroups: ["batch"]
  resources:
    - jobs
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: filebeat
  # should be the namespace where filebeat is running
  namespace: pep-snt-elastic-client-01 #Namespace to be update
  labels:
    k8s-app: filebeat
rules:
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: filebeat-kubeadm-config
  namespace: pep-snt-elastic-client-01 #Namespace to be update
  labels:
    k8s-app: filebeat
rules:
  - apiGroups: [""]
    resources:
      - configmaps
    resourceNames:
      - kubeadm-config
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: filebeat
subjects:
- kind: ServiceAccount
  name: filebeat
  namespace: pep-snt-elastic-client-01 #Namespace to be update
roleRef:
  kind: ClusterRole
  name: filebeat
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: filebeat
  namespace: pep-snt-elastic-client-01 #Namespace to be update
subjects:
  - kind: ServiceAccount
    name: filebeat
    namespace: pep-snt-elastic-client-01 #Namespace to be update
roleRef:
  kind: Role
  name: filebeat
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: filebeat-kubeadm-config
  namespace: pep-snt-elastic-client-01 #Namespace to be update
subjects:
  - kind: ServiceAccount
    name: filebeat
    namespace: pep-snt-elastic-client-01 #Namespace to be update
roleRef:
  kind: Role
  name: filebeat-kubeadm-config
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nonprod-eus-global-02-aks-logs-filebeat-config
  namespace: pep-snt-elastic-client-01
data:

  K8S_CLUSTER_NAME: pep-snt-nonprod-eus-global-02-aks

  filebeat-processor.yml: |

    processors:

    - add_fields:
        #target: pfna
        fields:
          cluster_name: ${K8S_CLUSTER_NAME}
          pep-aks-cluster: ${K8S_CLUSTER_NAME}
    - add_cloud_metadata:
        when:
          equals:
            event.module: system

    - add_host_metadata: {}

    - add_kubernetes_metadata:
        host: ${NODE_NAME}
        default_indexers:
          enabled: false
        default_matchers:
          enabled: false

    - add_tags:
        tags: ["SNT-NonProd-EUS", "retain-logs"]

    - script:
        lang: javascript
        source: >
          function process(event) {
            event.Put("fields.sn-application", "aks-pep-snt-nonprod-eus-global-02-aks" + "-" + event.Get("kubernetes.namespace"));
            return event;
          }

    # ~~
    # Logging
    # ~~
    logging:
      level: INFO
      metrics:
        enabled: true

  filebeat.yml: |-

    filebeat:

      modules:
      # - module: system
      #   syslog:
      #     enabled: true
      #     # Default: Configured paths: [/var/log/messages* /var/log/syslog*]
      #     var:
      #       paths:
      #       - /var/log/syslog
      #       - /var/log/messages
      #       - /var/log/waagent.log
      #       - /var/log/azure/*.log
      #   auth:
      #     enabled: true
      #     # Default: Configured paths: [/var/log/auth.log* /var/log/secure*]
      #     var:
      #       paths:
      #       - /var/log/auth.log

      autodiscover:
        providers:
        - type: kubernetes
          scope: node
          resource: pod
          node: ${NODE_NAME}
          hints:
            enabled: true
          templates:
            - condition:
                not:
                  has_fields:
                  # ignore all logs from elastic pods since we are shipping
                  # it to monitoring cluster
                  - kubernetes.labels.common.k8s.elastic.co/type
              config:
              - type: container
                paths:
                - /var/log/containers/*${data.kubernetes.container.id}.log
                # output
                multiline:
                  type: pattern
                  pattern: '^(\[|[0-9]{4}-[0-9]{2}-[0-9]{2} )'
                  negate: true
                  match: after
    setup.template.name: "aks-data-stream-snt"
    setup.template.pattern: "aks-pep_snt*"

    setup.ilm.enabled: false     
    #setup.template.overwrite: true
    output.elasticsearch:
        hosts: [https://3825028849b946d3a380f6136dcd7c3a.privatelink.southcentralus.azure.elastic-cloud.com:9243]
        api_key: "GnuNB5MBWuezjPg1DKep:OPckBJB2QHOYgXBnfTHhZw"
        index: "%{[fields][sn-application]}"
        worker: 3
        bulk_max_size: 1000
        ssl.verification_mode: none

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: &app_name nonprod-eus-global-02-aks-logs-filebeat
  namespace: pep-snt-elastic-client-01
  labels:
    app.kubernetes.io/name: *app_name
    app.kubernetes.io/version: &vers 8.19.11
    app: *app_name
    # match the  ES server version (beats is not backward compatible)
    version: *vers
spec:
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: nonprod-eus-global-02-aks-logs-filebeat
      app.kubernetes.io/version: 8.19.11
  template:
    metadata:
      creationTimestamp: null
      labels:
        app.kubernetes.io/name: nonprod-eus-global-02-aks-logs-filebeat
        app.kubernetes.io/version: 8.19.11
    spec:
      containers:
      - args:
        - --environment
        - container
        - -e
        - -c
        - /projected/etc/beat-processor-config.yml
        - -c
        - /projected/etc/beat.yml
        env:
        - name: K8S_CLUSTER_NAME
          valueFrom:
            configMapKeyRef:
              key: K8S_CLUSTER_NAME
              name: nonprod-eus-global-02-aks-logs-filebeat-config
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.nodeName
        image: docker.elastic.co/beats/filebeat:8.19.11
        imagePullPolicy: IfNotPresent
        name: filebeat
        resources:
          requests:
            memory: 512Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /projected
          name: config-projected
          readOnly: true
        - mountPath: /usr/share/filebeat/data
          name: data
        - mountPath: /var/lib/docker/containers
          name: varlibdockercontainers
          readOnly: true
        - mountPath: /var/log
          name: varlog
          readOnly: true
        - mountPath: /var/run/docker.sock
          name: dockersock
      dnsPolicy: ClusterFirst
      hostAliases:
      - hostnames:
        - 3825028849b946d3a380f6136dcd7c3a.privatelink.southcentralus.azure.elastic-cloud.com
        ip: 172.27.62.199
      nodeSelector:
        kubernetes.io/os: linux
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        runAsUser: 0
      serviceAccount: filebeat
      serviceAccountName: filebeat
      terminationGracePeriodSeconds: 30
      tolerations:
      - operator: Exists
      volumes:
      - name: config-projected
        projected:
          defaultMode: 384
          sources:
          - configMap:
              items:
              - key: PepsiCoCA01.pem
                path: etc/certs/PepsiCoCA01.pem
              - key: PepsiCoRootCA.pem
                path: etc/certs/PepsiCoRootCA.pem
              name: pep-ca-certs-config
              optional: false
          - configMap:
              items:
              - key: filebeat.yml
                path: etc/beat.yml
              - key: filebeat-processor.yml
                path: etc/beat-processor-config.yml
              name: nonprod-eus-global-02-aks-logs-filebeat-config
              optional: false
      - hostPath:
          path: /var/lib/docker/containers
          type: ""
        name: varlibdockercontainers
      - hostPath:
          path: /var/log
          type: ""
        name: varlog
      - hostPath:
          path: /var/lib/pep-snt-elastic-client-01/nonprod-eus-global-02-aks-logs-filebeat/filebeat-data
          type: DirectoryOrCreate
        name: data
      - hostPath:
          path: /var/run/docker.sock
          type: ""
        name: dockersock
  updateStrategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate

