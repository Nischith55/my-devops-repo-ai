apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: pep-snt-cgf-lighthouse-dev-cv-gw
  namespace: pep-snt-cgf-lighthouse-dev
spec:
  selector:
    istio: pep-snt-ingress-gw01
  servers:
  - hosts:
    - dummy-passthrough-pep-snt-cgf-lighthouse-dev.snt.gw01.aks02.eus.nonprod.azure.intra.pepsico.com
    name: pep-snt-cgf-lighthouse-dev-cv-gw-tls-443
    port:
      name: https-pep-snt-cgf-lighthouse-dev-cv-gw-tls-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - dummy-pep-snt-cgf-lighthouse-dev.snt.gw01.aks02.eus.nonprod.azure.intra.pepsico.com
    - lighthouse-ai-labs.snt.gw01.aks02.eus.nonprod.azure.intra.pepsico.com
    name: pep-snt-cgf-lighthouse-dev-cv-gw-https-443
    port:
      name: https-pep-snt-cgf-lighthouse-dev-cv-gw-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-snt-nonprod-eus-global-02-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - dummy-pep-snt-cgf-lighthouse-dev-80.snt.gw01.aks02.eus.nonprod.azure.intra.pepsico.com
    - lighthouse-ai-labs.snt.gw01.aks02.eus.nonprod.azure.intra.pepsico.com
    name: pep-snt-cgf-lighthouse-dev-cv-gw-http-80
    port:
      name: http-pep-snt-cgf-lighthouse-dev-cv-gw-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true

