apiVersion: v1
kind: Secret
metadata:
  name: istio-cni-token # Naming convention followed is ServiceAccountName-token
  namespace: istio-system     # Namespace where the service account is created
  annotations:
    kubernetes.io/service-account.name: "istio-cni" # Service Account name to map the token
type: kubernetes.io/service-account-token  # Secret type should be this