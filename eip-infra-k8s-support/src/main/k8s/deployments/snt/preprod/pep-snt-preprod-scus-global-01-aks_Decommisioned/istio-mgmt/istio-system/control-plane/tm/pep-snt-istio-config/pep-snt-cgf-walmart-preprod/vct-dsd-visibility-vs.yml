apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: vct-dsd-visibility-vs
  namespace: pep-snt-istio-config
spec:
  gateways:
    - istio-system/istio-in-gateway-01
  hosts:
  - vct-dsd-visibility.snt.gw01.aks01.scus.preprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /vct-dsd-visibility/dsd
    route:
    - destination:
        host:  vct-dsd-visibility.pep-snt-cgf-walmart-preprod.svc.cluster.local
        port:
          number: 80