apiVersion: v1
kind: Secret
metadata:
  name: kube-state-metrics-token # Naming convention followed is ServiceAccountName-token
  namespace: monitoring     # Namespace where the service account is created
  annotations:
    kubernetes.io/service-account.name: "kube-state-metrics" # Service Account name to map the token
type: kubernetes.io/service-account-token  # Secret type should be this