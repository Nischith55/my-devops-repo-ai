apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: promoai-api-vs
  namespace: pep-snt-istio-config
spec:
  gateways:
    - istio-system/istio-in-gateway-01
  hosts:
  - promoai-api.snt.gw01.aks01.scus.preprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: promoai-api.pep-snt-cgf-promoai-preprod.svc.cluster.local
        port:
          number: 80