---
apiVersion: batch/v1
kind: Job
metadata:
  name: pep-snt-conjur-agent-job
  namespace: pep-snt-cgf-pcam-preprod
  labels:
    job-name: pep-snt-conjur-agent-job
spec:
  backoffLimit: 0
  completionMode: NonIndexed
  completions: 1
  parallelism: 1

  selector:
    matchLabels:
      job-name: pep-snt-conjur-agent-job

  suspend: false

  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"

      labels:
        job-name: pep-snt-conjur-agent-job

    spec:
      containers:
        - env:
            - name: MY_POD_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.name

            - name: MY_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace

            - name: CONJUR_APPLIANCE_URL
              value: https://mypam.conjur.ite.mypepsico.com

            - name: CONJUR_AUTHN_URL
              value: https://mypam.conjur.ite.mypepsico.com/authn-k8s/pep-snt-preprod-scus-global-01-aks

            - name: CONJUR_ACCOUNT
              value: ITE

            - name: CONJUR_SSL_CERTIFICATE
              valueFrom:
                configMapKeyRef:
                  key: ssl-certificate
                  name: pep-snt-conjur-cert-cm

            - name: CONJUR_AUTHN_LOGIN
              value: host/pep/snt/aks/pep-snt-cgf-pcam-preprod

            - name: SECRETS_DESTINATION
              value: k8s_secrets

            - name: DEBUG
              value: "true"

            - name: CONTAINER_MODE
              value: application

            - name: K8S_SECRETS
              value: pep-snt-cgf-pcam-conjur

          image: cyberark/secrets-provider-for-k8s:1.1.4
          imagePullPolicy: IfNotPresent
          name: cyberark-secrets-provider-for-k8s
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File

      dnsPolicy: ClusterFirst
      restartPolicy: Never
      schedulerName: default-scheduler
      serviceAccount: conjur-agent-sa
      serviceAccountName: conjur-agent-sa
      terminationGracePeriodSeconds: 30
