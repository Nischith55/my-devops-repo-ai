apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name:  journey-optimizer-processor-vs
  namespace: pep-snt-istio-config
spec:
  gateways:
    - istio-system/istio-in-gateway-01
  hosts:
  -  journey-optimizer-processor.snt.gw01.aks01.scus.preprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host:   journey-optimizer-processor.pep-snt-cgf-pcam-preprod.svc.cluster.local
        port:
          number: 8080