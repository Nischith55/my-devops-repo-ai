apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: admin-portal-frontend-vs
  namespace: pep-snt-istio-config
spec:
  gateways:
    - istio-system/istio-in-gateway-01
  hosts:
  - admin-portal-frontend.snt.gw01.aks01.scus.preprod.azure.intra.pepsico.com
  - admin-portal.preprod.mypepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: admin-portal-frontend.pep-snt-cgf-adportal-preprod.svc.cluster.local
        port:
          number: 8080

      