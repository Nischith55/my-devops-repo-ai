apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: dsd-pbna-adapter-vs
  namespace: pep-snt-istio-config
spec:
  gateways:
    - istio-system/istio-in-gateway-01
  hosts:
  - dsd-pbna-adapter.snt.gw01.aks01.scus.preprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /dsd-pbna-adapter
    route:
    - destination:
        host:  dsd-pbna-adapter.pep-snt-cgf-walmart-preprod.svc.cluster.local
        port:
          number: 80