apiVersion: v1
kind: Secret
metadata:
  name: istio-operator-1-14-4-token # Naming convention followed is ServiceAccountName-token
  namespace: istio-operator   # Namespace where the service account is created
  annotations:
    kubernetes.io/service-account.name: "istio-operator-1-14-4" # Service Account name to map the token
type: kubernetes.io/service-account-token  # Secret type should be this