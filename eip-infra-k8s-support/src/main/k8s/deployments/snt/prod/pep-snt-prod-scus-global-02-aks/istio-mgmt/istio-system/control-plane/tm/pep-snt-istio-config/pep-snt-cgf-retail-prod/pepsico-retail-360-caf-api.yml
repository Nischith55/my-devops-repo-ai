apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pepsico-retail-360-caf-api-vs
  namespace: pep-snt-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pepsico-retail-360-caf-api.snt.gw01.aks02.scus.prod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pepsico-retail-360-caf-api.pep-snt-cgf-retail-prod.svc.cluster.local
        port:
          number: 80