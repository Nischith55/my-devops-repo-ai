apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-snt-nginx-vs
  namespace: pep-snt-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-snt-nginx.snt.gw01.aks02.scus.prod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-snt-nginx.pep-snt-global-infra-prod.svc.cluster.local
        port:
          number: 8080