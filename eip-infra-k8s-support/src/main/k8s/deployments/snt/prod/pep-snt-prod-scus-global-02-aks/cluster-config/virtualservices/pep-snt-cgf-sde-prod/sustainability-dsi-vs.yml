apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  annotations: {}
  labels:
    app: sustainability-dsi
  name: sustainability-dsi-vs
  namespace: pep-snt-cgf-sde-prod
spec:
  gateways:
  - pep-snt-cgf-sde-prod/pep-snt-cgf-sde-prod-cv-gw
  hosts:
  - sustainability-dsi.snt.gw01.aks02.scus.prod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: sustainability-dsi.pep-snt-cgf-sde-prod.svc.cluster.local
        port:
          number: 80
