# Keeps the runner image resident on every build node so a scale-from-zero
# runner starts without paying the image pull.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: arc-runner-image-prepull
  namespace: pep-pfna-global-devsecops-prod
  labels:
    app.kubernetes.io/name: arc-runner-image-prepull
    app.kubernetes.io/part-of: pep-pfna-arc
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: arc-runner-image-prepull
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 100%
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arc-runner-image-prepull
    spec:
      # Must match the runner-set nodeSelector/tolerations, or the image is
      # cached on nodes the runners never land on.
      nodeSelector:
        kubernetes.io/os: linux
        balance-group: BuildAgentPools
      tolerations:
        - key: "BuildAgentPool"
          operator: "Exists"
          effect: "NoSchedule"
      imagePullSecrets:
        - name: pep-pfna-svc-global-devsecops-acr-creds
      terminationGracePeriodSeconds: 0
      containers:
        - name: prepull
          image: pepeiapprodcommonacr.azurecr.io/pep/eip/infra/azurepipeline/github-runner:20260814.4
          command: ["/bin/sh", "-c", "echo image cached on $(hostname); sleep infinity"]
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "50m"
              memory: "128Mi"
