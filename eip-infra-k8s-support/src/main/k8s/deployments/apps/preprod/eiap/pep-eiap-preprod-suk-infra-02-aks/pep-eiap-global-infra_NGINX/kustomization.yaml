apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base/pep-eiap-global-infra_NGINX

patches:
- path: patch-nginx.yaml
  target:
    kind: Deployment
    name: pep-eiap-nginx
    namespace: pep-eiap-global-infra
- path: patch-service.yaml
  target:
    kind: Service 
    name: pep-eiap-nginx
    namespace: pep-eiap-global-infra
