global:
  spec:
    destination:
      clusterName: pep-dps-nonprod-gwc-global-01-aks

argoCDApplications:
  arc-secret-provider-pep-dps-nonprod-gwc-global-01-aks:
    enabled: true
    autoSync: true
    helm: false
    recursive: false
    namespace: pep-dps-global-devsecops-dev
    path: src/main/k8s/deployments/apps/nonprod/dps/pep-dps-nonprod-gwc-global-01-aks/pep-dps-arc/secret-provider
    syncOptions:
      - CreateNamespace=true

  arc-controller-pep-dps-nonprod-gwc-global-01-aks:
    enabled: true
    autoSync: true
    helm: true
    recursive: false
    chart: gha-runner-scale-set-controller
    revision: 0.14.2
    namespace: pep-dps-global-devsecops-dev
    path: src/main/k8s/deployments/apps/nonprod/dps/pep-dps-nonprod-gwc-global-01-aks/pep-dps-arc/controller
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

  arc-runner-set-pep-dps-nonprod-gwc-global-01-aks:
    enabled: true
    autoSync: true
    helm: true
    recursive: false
    chart: gha-runner-scale-set
    revision: 0.14.2
    namespace: pep-dps-global-devsecops-dev
    path: src/main/k8s/deployments/apps/nonprod/dps/pep-dps-nonprod-gwc-global-01-aks/pep-dps-arc/runner-set
    syncOptions:
      - CreateNamespace=true

  arc-image-prepull-pep-dps-nonprod-gwc-global-01-aks:
    enabled: true
    autoSync: true
    helm: false
    recursive: false
    namespace: pep-dps-global-devsecops-dev
    path: src/main/k8s/deployments/apps/nonprod/dps/pep-dps-nonprod-gwc-global-01-aks/pep-dps-arc/prepull
    syncOptions:
      - CreateNamespace=true
