apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: arc-kube-mode-buildagent
  namespace: pep-dps-global-devsecops-dev
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: arc-kube-mode-buildagent
  namespace: pep-dps-global-devsecops-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: arc-kube-mode-buildagent
subjects:
  - kind: ServiceAccount
    name: pep-dps-buildagent
    namespace: pep-dps-global-devsecops-dev
