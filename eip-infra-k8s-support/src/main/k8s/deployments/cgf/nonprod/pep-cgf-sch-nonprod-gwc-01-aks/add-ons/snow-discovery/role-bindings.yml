---
kind: Namespace
apiVersion: v1
metadata:
  name: pep-cgf-snowdiscovery-nonprod
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: snow-sa-pepsicononprod
  namespace: pep-cgf-snowdiscovery-nonprod

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: snow-cr-pep-cgf-snowdiscovery-nonprod
  namespace: pep-cgf-snowdiscovery-nonprod
rules:
  - apiGroups: ["","apps","batch", "networking.k8s.io"]
    resources: ["namespaces","nodes","deployments","statefulsets","daemonsets","replicasets","replicationcontrollers",
                "jobs","cronjobs","pods", "pods/log", "endpoints","services", "ingresses","routes", "groups", "users"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: snow-sa-snow-cr-pep-cgf-snowdiscovery-nonprod
  namespace: pep-cgf-snowdiscovery-nonprod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: snow-cr-pep-cgf-snowdiscovery-nonprod
subjects:
  - kind: ServiceAccount
    name: snow-sa-pepsicononprod
    namespace: pep-cgf-snowdiscovery-nonprod