apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-cgf-nginx-vs
  namespace: pep-cgf-global-dev
spec:
  gateways:
  - pep-cgf-global-dev/pep-cgf-global-dev-cv-gw
  hosts:
  - pep-cgf-nginx.cgfsch.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-cgf-nginx.pep-cgf-global-dev.svc.cluster.local
        port: 
          number: 8080