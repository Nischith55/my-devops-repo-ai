apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: pep-cgf-cgf-tctsa-qa-cv-gw
  namespace: pep-cgf-cgf-tctsa-qa
spec:
  selector:
    istio: pep-cgf-ingress-gw01
  servers:
  - hosts:
    - dummy-passthrough-pep-cgf-cgf-tctsa-qa.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    name: pep-cgf-cgf-tctsa-qa-cv-gw-tls-443
    port:
      name: https-pep-cgf-cgf-tctsa-qa-cv-gw-tls-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - dummy-pep-cgf-cgf-tctsa-qa-443.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    - tct-event-distributor-service-qa.cgfsch.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    - tct-api-adapter-service-qa.cgfsch.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    - tct-carrier-api-service-qa.cgfsch.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    - pep-tct-schub-api-service-qa.cgfsch.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    - pep-tct-schub-consumer-service-qa.cgfsch.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    - pep-tct-sch-poland-consumer-service-qa.cgfsch.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    - pep-tct-sch-uk-consumer-service-qa.cgfsch.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    name: pep-cgf-cgf-tctsa-qa-cv-gw-https-443
    port:
      name: https-pep-cgf-cgf-tctsa-qa-cv-gw-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-cgf-sch-nonprod-gwc-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - dummy-pep-cgf-cgf-tctsa-qa-80.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    - tct-event-distributor-service-qa.cgfsch.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    - tct-api-adapter-service-qa.cgfsch.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    - tct-carrier-api-service-qa.cgfsch.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    - pep-tct-schub-api-service-qa.cgfsch.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    - pep-tct-schub-consumer-service-qa.cgfsch.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    - pep-tct-sch-poland-consumer-service-qa.cgfsch.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    - pep-tct-sch-uk-consumer-service-qa.cgfsch.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    name: pep-cgf-cgf-tctsa-qa-cv-gw-http-80
    port:
      name: http-pep-cgf-cgf-tctsa-qa-cv-gw-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true

