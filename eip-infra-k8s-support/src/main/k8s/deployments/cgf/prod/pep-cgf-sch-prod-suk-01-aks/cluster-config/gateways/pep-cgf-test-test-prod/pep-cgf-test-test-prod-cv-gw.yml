---
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: pep-cgf-test-test-prod-cv-gw
  namespace: pep-cgf-test-test-prod
spec:
  selector:
    istio: pep-cgf-ingress-gw01
  servers:
  - hosts:
    - "dummy-passthrough-pep-cgf-test-test-prod.gw01.aks01.suk.prod.azure.intra.pepsico.com"
    name: pep-cgf-test-test-prod-cv-gw-tls-443
    port:
      name: https-pep-cgf-test-test-prod-cv-gw-tls-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - "dummy-pep-cgf-test-test-prod-443.gw01.aks01.suk.prod.azure.intra.pepsico.com"
    name: pep-cgf-test-test-prod-cv-gw-https-443
    port:
      name: https-pep-cgf-test-test-prod-cv-gw-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-cgf-sch-prod-suk-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - "dummy-pep-cgf-test-test-prod-80.gw01.aks01.suk.prod.azure.intra.pepsico.com"
    name: pep-cgf-test-test-prod-cv-gw-http-80
    port:
      name: http-pep-cgf-test-test-prod-cv-gw-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true
      