apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-cgf-nginx-vs
  namespace: pep-cgf-global-prod
spec:
  gateways:
  - pep-cgf-global-prod/pep-cgf-global-prod-cv-gw
  hosts:
  - pep-cgf-nginx.cfgsch.gw01.aks01.suk.prod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-cgf-nginx.pep-cgf-global-prod.svc.cluster.local
        port: 
          number: 8080