apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-pcaf-api-employeeservice-dsld-vs
  namespace: pep-pfna-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-pcaf-api-employeeservice-dsld.pfnapgt.gw01.aks01.scus.prod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: //api/v1/dsld/employee
    route:
    - destination:
        host: pep-pcaf-api-employeeservice-dsld.pep-pfna-flna-gtmdsld-prod.svc.cluster.local
        port:
          number: 80