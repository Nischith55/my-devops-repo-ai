apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-pcaf-api-zoneforecastmodelservice-sp-zfm-vs
  namespace: pep-pfna-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-pcaf-api-zoneforecastmodelservice-sp-zfm.pfnapgt.gw01.aks01.scus.prod.azure.intra.pepsico.com
  http: 
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /api/v1/sp/zfm/zoneforecast
    route:
    - destination:
        host: pep-pcaf-api-zoneforecastmodelservice-sp-zfm.pep-pfna-flna-gtmsp-prod.svc.cluster.local
        port:
          number: 80  