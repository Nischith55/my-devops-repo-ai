apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pcaf-shp-filestore-gqev-vs
  namespace: pep-pfna-pgt-prod
  labels:
      app: pcaf-shp-filestore
spec:
  hosts:
  - pcaf-shp-filestore.pfnapgt.gw01.aks01.scus.prod.azure.intra.pepsico.com
  gateways:
  - pep-pfna-pgt-prod/pep-pfna-pgt-prod-cv-gw
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pcaf-shp-filestore.pep-pfna-pgt-prod.svc.cluster.local
        port:
          number: 80
    corsPolicy:
      allowOrigins:
      - exact: https://shop.pfna.mypepsico.com/
      allowedOriginPatterns:
      - exact: https://shop.pfna.mypepsico.com/
      allowMethods:
      - GET
      - PUT
      - POST
      - DELETE
      - OPTIONS
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Access-Control-Allow-Origin
      - Access-Control-Allow-Headers
      - Content-Type
      - Link
      exposeHeaders:
      - Authorization
      - Link
  