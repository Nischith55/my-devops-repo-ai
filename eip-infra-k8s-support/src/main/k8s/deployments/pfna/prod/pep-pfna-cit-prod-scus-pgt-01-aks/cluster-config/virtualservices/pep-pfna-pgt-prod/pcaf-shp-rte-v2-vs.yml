apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  annotations: {}
  labels:
    app: pcaf-shp-rte-v2
  name: pcaf-shp-rte-v2-vs
  namespace: pep-pfna-pgt-prod
spec:
  gateways:
  - pep-pfna-pgt-prod/pep-pfna-pgt-prod-cv-gw
  hosts:
  - pcaf-shp-rte-v2.pfnapgt.gw01.aks01.scus.prod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pcaf-shp-rte-v2.pep-pfna-pgt-prod.svc.cluster.local
        port:
          number: 80
