  labels:
    app: pep-eiap-cgf-cle-rest-services
  name: pep-eiap-cgf-cle-rest-services-vs
  namespace: pep-pfna-pgt-cle-prod
spec:
  gateways:
  - pep-pfna-pgt-cle-prod/pep-pfna-pgt-cle-prod-cv-gw
  hosts:
  - pep-eiap-cgf-cle-rest-services.pfnapgt.gw01.aks01.scus.prod.azure.intra.pepsico.com
