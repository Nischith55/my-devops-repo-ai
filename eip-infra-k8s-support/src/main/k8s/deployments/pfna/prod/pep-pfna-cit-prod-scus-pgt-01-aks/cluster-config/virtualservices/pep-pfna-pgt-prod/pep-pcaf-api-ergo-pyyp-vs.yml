apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-pcaf-api-ergo-pyyp-vs
  namespace: pep-pfna-pgt-prod
  labels:
      app: pep-pcaf-api-ergo
spec:
  hosts:
  - pep-pcaf-api-ergo.pfnapgt.gw01.aks01.scus.prod.azure.intra.pepsico.com
  gateways:
  - pep-pfna-pgt-prod/pep-pfna-pgt-prod-cv-gw
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-pcaf-api-ergo.pep-pfna-pgt-prod.svc.cluster.local
        port:
          number: 80
  