apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: pep-pfna-sch-nginx
  name: pep-pfna-sch-nginx
  namespace: pep-pfna-pfna-mfgpropl-prod
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  selector:
    matchLabels:
      app: pep-pfna-sch-nginx
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: pep-pfna-sch-nginx
    spec:
#      imagePullSecrets:
#      - name: pep-pfna-sch-global-infra-regcred
      containers:
      - command:
        - sudo
        - nginx
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        image: random
        imagePullPolicy: Always
        name: pep-pfna-sch-nginx
        ports:
        - containerPort: 8080
          name: http
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsUser: 1000

