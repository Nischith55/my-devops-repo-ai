apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  annotations: {}
  labels:
    app: undefined
  name: pep-pfna-transp-dispatcher-api-vs
  namespace: pep-pfna-sch-istio-config
spec:
  gateways:
  - pep-pfna-sch-istio-config/pep-pfna-sch-istio-config-cv-gw
  hosts:
  - pep-pfna-transp-dispatcher-api.pfna.sch.gw01.aks01.scus.prod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /transp/v1/dispatcher
    route:
    - destination:
        host: pep-pfna-transp-dispatcher-api.pep-pfna-flna-transp-prod.svc.cluster.local
        port:
          number: 80
