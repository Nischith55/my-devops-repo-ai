apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  annotations: {}
  labels:
    app: undefined
  name: tracing-vs
  namespace: pep-pfna-sch-istio-config
spec:
  gateways:
  - pep-pfna-sch-istio-config/pep-pfna-sch-istio-config-cv-gw
  hosts:
  - pep-pfna-sch-jaegertracing.pfna.sch.gw01.aks01.scus.prod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    name: tracing-v1-route
    route:
    - destination:
        host: jaeger-backend-query.observability.svc.cluster.local
        port:
          number: 16686
