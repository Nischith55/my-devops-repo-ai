apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  annotations: {}
  labels:
    app: pep-pfna-transp-exception-details-api
  name: pep-pfna-transp-exception-details-api-vs
  namespace: pep-pfna-flna-transp-prod
spec:
  gateways:
  - pep-pfna-flna-transp-prod/pep-pfna-flna-transp-prod-cv-gw
  hosts:
  - pep-pfna-transp-exception-details-api.pfna.sch.gw01.aks01.scus.prod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /transp/v1/exception-details
    route:
    - destination:
        host: pep-pfna-transp-exception-details-api.pep-pfna-flna-transp-prod.svc.cluster.local
        port:
          number: 80
