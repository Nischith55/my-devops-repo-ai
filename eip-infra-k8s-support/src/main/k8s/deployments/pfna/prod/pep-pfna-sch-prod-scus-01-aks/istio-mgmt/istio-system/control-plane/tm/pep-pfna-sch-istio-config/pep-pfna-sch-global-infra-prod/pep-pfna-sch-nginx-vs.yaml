apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-pfna-sch-nginx-vs
  namespace: pep-pfna-sch-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-pfna-sch-nginx.pfna.sch.gw01.aks01.scus.prod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-pfna-sch-nginx.pep-pfna-sch-global-infra-prod.svc.cluster.local
        port:
          number: 8080
