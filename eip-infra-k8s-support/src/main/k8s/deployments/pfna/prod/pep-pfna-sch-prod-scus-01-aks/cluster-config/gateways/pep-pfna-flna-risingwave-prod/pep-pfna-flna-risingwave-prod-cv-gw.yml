apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: pep-pfna-flna-risingwave-prod-cv-gw
  namespace: pep-pfna-flna-risingwave-prod
spec:
  selector:
    istio: pep-pfna-ingress-gw01
  servers:
  - hosts:
    - dummy-passthrough-pep-pfna-flna-risingwave-prod.gw01.aks01.scus.prod.azure.intra.pepsico.com
    name: pep-pfna-flna-risingwave-prod-cv-gw-tls-443
    port:
      name: https-pep-pfna-flna-risingwave-prod-cv-gw-tls-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - dummy-pep-pfna-flna-risingwave-prod-443.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - prometheus-grafana.pfna.sch.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - risingwave-meta-headless-prod.pfna.sch.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - risingwave-cluster-utilization-tracker.pfna.sch.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - risingwave-console.pfna.sch.gw01.aks01.scus.prod.azure.intra.pepsico.com
    name: pep-pfna-flna-risingwave-prod-cv-gw-https-443
    port:
      name: https-pep-pfna-flna-risingwave-prod-cv-gw-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-pfna-sch-prod-scus-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - dummy-pep-pfna-flna-risingwave-prod-80.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - prometheus-grafana.pfna.sch.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - risingwave-meta-headless-prod.pfna.sch.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - risingwave-cluster-utilization-tracker.pfna.sch.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - risingwave-console.pfna.sch.gw01.aks01.scus.prod.azure.intra.pepsico.com
    name: pep-pfna-flna-risingwave-prod-cv-gw-http-80
    port:
      name: http-pep-pfna-flna-risingwave-prod-cv-gw-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true
  - hosts:
    - risingwave.pfna.sch.gw01.aks01.scus.prod.azure.intra.pepsico.com
    name: pep-pfna-flna-risingwave-prod-cv-gw-tcp-4567
    port:
      name: grpc-pep-pfna-flna-risingwave-prod-cv-gw-4567
      number: 4567
      protocol: TCP
  - hosts:
    - schrisingwavedb.intra.pepsico.com
    name: pep-pfna-flna-risingwave-prod-dev-cv-gw-tcp-5432
    port:
      name: grpc-pep-pfna-flna-risingwave-prod-cv-gw-5432
      number: 5432
      protocol: TCP

