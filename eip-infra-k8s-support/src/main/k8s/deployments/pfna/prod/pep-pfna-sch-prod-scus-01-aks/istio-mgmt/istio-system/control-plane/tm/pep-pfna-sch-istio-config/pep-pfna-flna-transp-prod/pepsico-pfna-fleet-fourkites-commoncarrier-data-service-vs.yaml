apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pepsico-pfna-fleet-fourkites-commoncarrier-data-service-vs
  namespace: pep-pfna-sch-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pepsico-pfna-fleet-fourkites-commoncarrier-data-service.pfna.sch.gw01.aks01.scus.prod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /pfna/fleet/v1
    route:
    - destination:
        host: pepsico-pfna-fleet-fourkites-commoncarrier-data-service.pep-pfna-flna-transp-prod.svc.cluster.local
        port:
          number: 80 