apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: metrics-role
apiVersion: rbac.authorization.k8s.io/v1
rules:
- apiGroups: [""]
  resources:
  - nodes/metrics
  - nodes/stats
  verbs: ["get"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: curl-metrics-sa
  namespace: pep-pfna-sch-elastic-client-01
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: metrics-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: metrics-role
subjects:
- kind: ServiceAccount
  name: curl-metrics-sa
  namespace: pep-pfna-sch-elastic-client-01
---
apiVersion: v1
kind: Pod
metadata:
  name: curl-metrics
  namespace: pep-pfna-sch-elastic-client-01
spec:
  serviceAccount: curl-metrics-sa
  containers:
  - command:
    - tail
    - -f
    - /dev/null
    image: alpine/curl
    name: curl-metrics
    resources: {}
  dnsPolicy: ClusterFirst
  restartPolicy: Always