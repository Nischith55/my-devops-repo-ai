---
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: istio-in-gateway-01
  namespace: istio-system
spec:
  selector:
    istio: pep-pfna-ingress-gw01
  servers:

  # ###########################################################################
  #  ALL SSL Passthrough ONLY 1 block, no need for separate blocks.
  # ###########################################################################

  - hosts:
#    - pfnainfra.gw01.aks02.scus.prod.azure.intra.pepsico.com
    # pep-pfna-elastic-cluster-01
    - pep-pfna-elastic-01.pfnainfra.gw01.aks02.scus.prod.azure.intra.pepsico.com
    - pep-pfna-elastic-01-admin.pfnainfra.gw01.aks02.scus.prod.azure.intra.pepsico.com
    #- pep-pfna-apm-01.pfnainfra.gw01.aks02.scus.nonprod.azure.intra.pepsico.com
    - pep-pfna-kibana-01.pfnainfra.gw01.aks02.scus.prod.azure.intra.pepsico.com
    - pep-pfna-ingest-01.pfnainfra.gw01.aks02.scus.prod.azure.intra.pepsico.com
    # pep-eiap-elastic-cluster-03
    # - pep-pfna-elastic-03.pfnainfra.gw01.aks02.scus.nonprod.azure.intra.pepsico.com
    # - pep-pfna-elastic-03-admin.pfnainfra.gw01.aks02.scus.nonprod.azure.intra.pepsico.com
    name: gw01-elastic-all-tls-443
    port:
      name: tls-elastic-all-443
      number: 443
      protocol: tls
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH

  # HTTPS traffic - SSL Terminated -- Please ensure http match is used in
  # VS routing
  - hosts:
    - "*.pfnainfra.gw01.aks02.scus.prod.azure.intra.pepsico.com"
    name: gw01-wc-https-443
    port:
      name: https-wc-443
      number: 443
      protocol: HTTPS
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-pfna-cit-prod-scus-infra-02-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - "*.pfnainfra.gw01.aks02.scus.prod.azure.intra.pepsico.com"
    name: istio-in-gateway-01-wildcard-http-80
    port:
      name: http-wc-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true

