---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prod-scus-infra-02-aks-k8s-metricbeat-config
  namespace: pep-pfna-elastic-client-01

data:
  K8S_CLUSTER_NAME: pep-pfna-cit-prod-scus-infra-02-aks

  metricbeat-processor.yml: |

    processors:

    # ~~
    # Add PFNA fields
    # ~~
 
    - add_fields:
        fields:
          ls-destination: "SCUS"
          pep-aks-cluster: ${K8S_CLUSTER_NAME}
    - add_host_metadata: {}
    - add_cloud_metadata: {}
    - add_kubernetes_metadata: {}

    - add_tags:
        tags: ["Prod-SCUS-PFNA", "retain-logs"]

    - script:
        lang: javascript
        source: >
          function process(event) {
           event.Put("fields.sn-application", "metrics-pep-pfna-cit-prod-scus-infra-02-aks" + "-" + event.Get("kubernetes.namespace"));
            return event;
          }

    logging:
      level: INFO
      metrics:
        enabled: true

  metricbeat.yml: |



    setup.template.name: "pep-aks-metrics-template"
    setup.template.pattern: "metrics-pep-pfna-cit-prod-scus-infra-02-aks*"
    setup.ilm.enabled: false     
    
    output.elasticsearch:
        hosts: [https://c0b565d4570c433e91e8d9ff1bd1b170.privatelink.southcentralus.azure.elastic-cloud.com:9243]
        api_key: "-Op1ipUBtMbxeTz3X0oS:8TirsYuVSTuAMHOlq06-Jw"
        index: "%{[fields][sn-application]}"

        worker: 2
        bulk_max_size: 1000
        ssl.verification_mode: none
    metricbeat:

      modules:

      - module: system
        enabled: false

      # ~~
      # kubernetes: add metrics from metrics endpoint
      # ~~
      - module: kubernetes
        enabled: true
        add_metadata: true
        period: 30s
        hosts:
        - kube-state-metrics.${KUBE_STATE_METRICS_NAMESPACE}.svc:${KUBE_STATE_METRICS_PORT}
        metricsets:
        - state_node
        - state_deployment
        - state_daemonset
        - state_replicaset
        - state_pod
        - state_container
        - state_cronjob
        - state_resourcequota
        - state_statefulset
        - state_service
        - state_persistentvolume
        - state_persistentvolumeclaim
        - state_storageclass
        # k8s events
        - event

      # ~~
      # kubernetes: add metrics from apiserver
      # ~~
      - module: kubernetes
        enabled: true
        period: 30s
        hosts:
        - https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}
        metricsets:
        - apiserver
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        ssl:
          certificate_authorities:
          - /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          supported_protocols:
            - TLSv1.2
            - TLSv1.3
          verification_mode: certificate

      # ~~
      # istio: istiod metricset (NOTE: experimental)
      # IMPORTANT: Make sure istiod SVC is correct for the cluster
      # ~~
      - module: istio
        enabled: true
        period: 30s
        timeout: 90s
        metricsets:
        - istiod
        hosts:
        # standard install, if different change it
        - istiod.istio-system.svc.cluster.local:15014

      # TODO: Please enable after prometheus is installed..
      # ~~
      # Autodiscover istio-proxy containers (since we are sidecar injected)
      # ~~
      autodiscover:
        providers:
        # stack monitoring
        - type: kubernetes
          scope: cluster
          resource: pod
          node: ${NODE_NAME}
          hints:
            enabled: true
          templates:
            - condition:
                contains:
                  # (we use std. istio injected annotation)
                  kubernetes.annotations.prometheus.io/path: "/stats/prometheus"
              config:
                - module: istio
                  enabled: true
                  period: 30s
                  metricsets:
                  - proxy
                  # undocumented seems to work for slow system
                  timeout: 90s
                  hosts:
                  # istio proxy port
                  - http://${data.kubernetes.pod.ip}:15020

---
apiVersion: apps/v1
kind: Deployment
metadata:
  # name format: <output-eck-cluster>-k8s
  name: &app_name prod-scus-infra-02-aks-k8s-metricbeat
  namespace: pep-pfna-elastic-client-01
  labels:
    app.kubernetes.io/name: *app_name
    app.kubernetes.io/version: &vers 8.17.1
spec:

  # For cluster wide metricbeat we use recreate, so we don't run into locks
  strategy:
    type: Recreate

  selector:
    matchLabels:
      app.kubernetes.io/name: *app_name
      app.kubernetes.io/version: *vers

  template:

    metadata:
      labels:
        app.kubernetes.io/name: *app_name
        app.kubernetes.io/version: *vers
        app: *app_name
        version: *vers

    spec:
      # PEP:
      # - Deployment run only on system node pool taints
      # - also lock down the node selector
      hostAliases:
      - ip: "172.20.79.12"
        hostnames:
        - "c0b565d4570c433e91e8d9ff1bd1b170.privatelink.southcentralus.azure.elastic-cloud.com"
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.azure.com/mode: system
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists

      serviceAccountName: metricbeat
      # some older Beat versions are depending on this settings presence
      # in k8s context
      automountServiceAccountToken: true
      securityContext:
        runAsUser: 0

      # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
      # All volumes
      # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
      volumes:

      # PEP: all in one configMap (using projections)
      - name: config-projected
        projected:
          # 0644 -> 420, 0600 -> 384
          defaultMode: 384
          sources:

          # pep-ca-certs-config
          - configMap:
              name: pep-ca-certs-config
              optional: false
              items:
                - key: PepsiCoCA01.pem
                  # must be relative
                  path: etc/certs/PepsiCoCA01.pem
                - key: PepsiCoRootCA.pem
                  # must be relative
                  path: etc/certs/PepsiCoRootCA.pem

          - configMap:
              name: &beats_config prod-scus-infra-02-aks-k8s-metricbeat-config
              optional: false
              items:
                - key: metricbeat.yml
                  # must be relative
                  path: etc/beat.yml
                - key: metricbeat-processor.yml
                  # must be relative
                  path: etc/beat-processor-config.yml

      containers:
      # PEP: args removed sysfs it's a deployment
      - name: metricbeat
        image: docker.elastic.co/beats/metricbeat:8.17.1
        args:
        - --environment
        - container
        - -e
        - -c
        - /projected/etc/beat-processor-config.yml
        - -c
        - /projected/etc/beat.yml
        # - -d
        # - "monitoring"
        # - index-management,processors

        resources:
          requests:
            # cpu: 200m
            memory: 512Mi
        env:

        - name: K8S_CLUSTER_NAME
          valueFrom:
            configMapKeyRef:
              name: *beats_config
              key: K8S_CLUSTER_NAME

        # PEP: change
        - name: KUBE_STATE_METRICS_NAMESPACE
          value: monitoring

        # PEP: change
        - name: KUBE_STATE_METRICS_PORT
          value: "8080"

        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName

        # ~~
        # volumemounts
        # ~~
        volumeMounts:
        # PEP:
        - name: config-projected
          # where it is mounted
          mountPath: /projected
          readOnly: true
