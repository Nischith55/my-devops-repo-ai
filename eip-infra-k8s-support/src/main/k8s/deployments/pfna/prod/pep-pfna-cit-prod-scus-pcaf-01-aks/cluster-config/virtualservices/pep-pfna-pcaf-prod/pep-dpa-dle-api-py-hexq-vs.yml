apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-dpa-dle-api-py-hexq-vs
  namespace: pep-pfna-pcaf-prod
  labels:
      app: pep-dpa-dle-api-py
spec:
  hosts:
  - pep-dpa-dle-api-py-prod.pfnapcaf.gw01.aks01.scus.prod.azure.intra.pepsico.com
  gateways:
  - pep-pfna-pcaf-prod/pep-pfna-pcaf-prod-cv-gw
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-dpa-dle-api-py.pep-pfna-pcaf-prod.svc.cluster.local
        port:
          number: 8080
  