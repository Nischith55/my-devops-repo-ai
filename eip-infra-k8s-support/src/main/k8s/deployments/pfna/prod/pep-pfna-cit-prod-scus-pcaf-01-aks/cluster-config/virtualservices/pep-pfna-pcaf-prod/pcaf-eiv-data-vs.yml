apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  annotations: {}
  labels:
    app: pcaf-eiv-data
  name: pcaf-eiv-data-vs
  namespace: pep-pfna-pcaf-prod
spec:
  gateways:
  - pep-pfna-pcaf-prod/pep-pfna-pcaf-prod-cv-gw
  hosts:
  - pcaf-eiv-data.pfnapcaf.gw01.aks01.scus.prod.azure.intra.pepsico.com
  http:
  - corsPolicy:
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Link
      - Content-Type
      - Access-Control-Allow-Origin
      - Access-Control-Allow-Headers
      - x-source
      allowMethods:
      - POST
      - GET
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
      allowOrigins:
      - exact: https://shp.pfna.mypepsico.com
      exposeHeaders:
      - x-total-count
    match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pcaf-eiv-data.pep-pfna-pcaf-prod.svc.cluster.local
        port:
          number: 80
