apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: pep-pfna-ast-prod-cv-gw
  namespace: pep-pfna-ast-prod
spec:
  selector:
    istio: pep-pfna-ingress-gw01
  servers:
  - hosts:
    - dummy-passthrough-pep-pfna-ast-prod.gw01.aks01.scus.prod.azure.intra.pepsico.com
    name: pep-pfna-ast-prod-cv-gw-tls-443
    port:
      name: https-pep-pfna-ast-prod-cv-gw-tls-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - pep-pcaf-amf-api-py.pfnapcaf.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pcaf-ast-custasset-api-py.pfnapcaf.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pcaf-ast-plandeqpmt-api-py.pfnapcaf.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pcaf-ast-download-api-py-prod.pfnapcaf.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pcaf-ast-eqpmtctlg-api-py-prod.pfnapcaf.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pcaf-ast-chneqpmt-api-py.pfnapcaf.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pep-pfna-pcaf-unified-planogram-api-py.pfnapcaf.gw01.aks01.scus.prod.azure.intra.pepsico.com
    name: pep-pfna-ast-prod-cv-gw-https-443
    port:
      name: https-pep-pfna-ast-prod-cv-gw-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-pfna-cit-prod-scus-pcaf-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - pep-pcaf-amf-api-py.pfnapcaf.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pcaf-ast-custasset-api-py.pfnapcaf.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pcaf-ast-plandeqpmt-api-py.pfnapcaf.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pcaf-ast-download-api-py-prod.pfnapcaf.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pcaf-ast-eqpmtctlg-api-py-prod.pfnapcaf.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pcaf-ast-chneqpmt-api-py.pfnapcaf.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pep-pfna-pcaf-unified-planogram-api-py.pfnapcaf.gw01.aks01.scus.prod.azure.intra.pepsico.com
    name: pep-pfna-ast-prod-cv-gw-http-80
    port:
      name: http-pep-pfna-ast-prod-cv-gw-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true

