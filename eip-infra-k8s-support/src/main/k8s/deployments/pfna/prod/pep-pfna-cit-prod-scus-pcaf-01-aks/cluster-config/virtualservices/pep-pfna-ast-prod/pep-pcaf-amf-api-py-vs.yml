apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  annotations: {}
  labels:
    app: pep-pcaf-amf-api-py
  name: pep-pcaf-amf-api-py-vs
  namespace: pep-pfna-ast-prod
spec:
  gateways:
  - pep-pfna-ast-prod/pep-pfna-ast-prod-cv-gw
  hosts:
  - pep-pcaf-amf-api-py.pfnapcaf.gw01.aks01.scus.prod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-pcaf-amf-api-py.pep-pfna-ast-prod.svc.cluster.local
        port:
          number: 8080