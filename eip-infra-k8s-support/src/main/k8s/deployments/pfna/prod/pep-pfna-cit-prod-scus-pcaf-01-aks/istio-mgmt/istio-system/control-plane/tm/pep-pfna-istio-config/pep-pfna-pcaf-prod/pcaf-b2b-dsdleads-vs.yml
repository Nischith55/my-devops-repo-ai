apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pcaf-b2b-dsdleads-vs
  namespace: pep-pfna-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pcaf-b2b-dsdleads.pfnapcaf.gw01.aks01.scus.prod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pcaf-b2b-dsdleads.pep-pfna-pcaf-prod.svc.cluster.local
        port:
          number: 80
    corsPolicy:   
      allowOrigins:
      - exact: https://shp.pfna.mypepsico.com
      - exact: https://shop.pfna.mypepsico.com
      allowMethods:
      - POST
      - GET
      - PUT
      - DELETE
      - OPTIONS
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Link
      - Content-Type
      - Access-Control-Allow-Origin
      - Access-Control-Allow-Headers
      exposeHeaders:
      - x-total-count     