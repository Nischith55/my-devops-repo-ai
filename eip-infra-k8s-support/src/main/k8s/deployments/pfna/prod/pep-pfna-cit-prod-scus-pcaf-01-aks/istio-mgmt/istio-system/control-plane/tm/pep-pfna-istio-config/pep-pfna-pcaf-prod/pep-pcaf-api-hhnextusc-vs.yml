  namespace: pep-pfna-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-pcaf-api-hhnextusc.pfnapcaf.gw01.aks01.scus.prod.azure.intra.pepsico.com
