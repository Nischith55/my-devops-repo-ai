---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prod-eus-pcaf-01-aks-logs-filebeat-config
  namespace: pep-pfna-elastic-client-01
data:

  K8S_CLUSTER_NAME: pep-pfna-cit-prod-eus-pcaf-01-aks

  filebeat-processor.yml: |
    processors:

      - add_fields:
          fields:
            cluster_name: ${K8S_CLUSTER_NAME}
            ls-destination: "EUS"
            pep-aks-cluster: ${K8S_CLUSTER_NAME}

      - add_cloud_metadata:
          when:
            equals:
              event.module: system

      - add_host_metadata: {}

      - add_kubernetes_metadata:
          host: ${NODE_NAME}
          default_indexers:
            enabled: false
          default_matchers:
            enabled: false

      - add_tags:
          tags: ["PROD-DR-EUS-PFNA", "retain-logs"]

      - script:
          lang: javascript
          source: >
            function process(event) {
              event.Put(
                "fields.sn-application",
                "aks-pep-pfna-cit-prod-eus-pcaf-01-aks" + "-" +
                event.Get("kubernetes.namespace")
              );
              return event;
            }

    logging:
      level: INFO
      metrics:
        enabled: true

  filebeat.yml: |-
    filebeat:
      modules:
        - module: system
          syslog:
            enabled: true
            var.paths:
              - /var/log/syslog
              - /var/log/messages
              - /var/log/waagent.log
              - /var/log/azure/*.log
          auth:
            enabled: true
            var.paths:
              - /var/log/auth.log

      autodiscover:
        providers:
          - type: kubernetes
            scope: node
            resource: pod
            node: ${NODE_NAME}
            hints.enabled: true
            templates:
              - condition:
                  not:
                    has_fields:
                      - kubernetes.labels.common.k8s.elastic.co/type
                config:
                  - type: container
                    paths:
                      - /var/log/containers/*${data.kubernetes.container.id}.log
                    multiline:
                      type: pattern
                      pattern: '^(\[|[0-9]{4}-[0-9]{2}-[0-9]{2} )'
                      negate: true
                      match: after

    setup.template.name: "pep-pfna-aks-logs-template"
    setup.template.pattern: "aks-pep-pfna-cit-prod-eus-*"
    setup.ilm.enabled: false

    output.elasticsearch:
      hosts:
        - https://c0b565d4570c433e91e8d9ff1bd1b170.privatelink.southcentralus.azure.elastic-cloud.com:9243
      api_key: "-Op1ipUBtMbxeTz3X0oS:8TirsYuVSTuAMHOlq06-Jw"
      index: "%{[fields][sn-application]}"
      worker: 3
      bulk_max_size: 1000
      ssl.verification_mode: none
      timeout: 90s
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: &app_name prod-eus-pcaf-01-aks-logs-filebeat
  namespace: pep-pfna-elastic-client-01
  labels:
    app.kubernetes.io/name: *app_name
    app.kubernetes.io/version: &vers 8.19.11
    app: *app_name
    version: *vers
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: *app_name
      app.kubernetes.io/version: *vers

  template:
    metadata:
      labels:
        app.kubernetes.io/name: *app_name
        app.kubernetes.io/version: *vers

    spec:
      hostAliases:
        - ip: "172.25.237.37"
          hostnames:
            - "c0b565d4570c433e91e8d9ff1bd1b170.privatelink.southcentralus.azure.elastic-cloud.com"

      nodeSelector:
        kubernetes.io/os: linux

      tolerations:
        - operator: Exists

      serviceAccountName: filebeat
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 0

      volumes:
        - name: config-projected
          projected:
            defaultMode: 384
            sources:
              - configMap:
                  name: pep-ca-certs-config
                  items:
                    - key: PepsiCoCA01.pem
                      path: etc/certs/PepsiCoCA01.pem
                    - key: PepsiCoRootCA.pem
                      path: etc/certs/PepsiCoRootCA.pem

              - configMap:
                  name: &beats_config prod-eus-pcaf-01-aks-logs-filebeat-config
                  items:
                    - key: filebeat.yml
                      path: etc/beat.yml
                    - key: filebeat-processor.yml
                      path: etc/beat-processor-config.yml

        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers

        - name: varlog
          hostPath:
            path: /var/log

        - name: data
          hostPath:
            path: /var/lib/pep-pfna-elastic-client-01/prod-eus-pcaf-01-aks-logs-filebeat/filebeat-data
            type: DirectoryOrCreate

        - name: dockersock
          hostPath:
            path: /var/run/docker.sock

      containers:
        - name: filebeat
          image: docker.elastic.co/beats/filebeat:8.19.11
          args:
            - --environment
            - container
            - -e
            - -c
            - /projected/etc/beat-processor-config.yml
            - -c
            - /projected/etc/beat.yml

          resources:
            requests:
              memory: 512Mi

          env:
            - name: K8S_CLUSTER_NAME
              valueFrom:
                configMapKeyRef:
                  name: *beats_config
                  key: K8S_CLUSTER_NAME

            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

          volumeMounts:
            - name: config-projected
              mountPath: /projected
              readOnly: true

            - name: data
              mountPath: /usr/share/filebeat/data

            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true

            - name: varlog
              mountPath: /var/log
              readOnly: true

            - name: dockersock
              mountPath: /var/run/docker.sock