apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  annotations: {}
  labels:
    app: pcaf-messaging-web-controller
  name: pcaf-messaging-web-controller-vs
  namespace: pep-pfna-flna-pcaf-prod
spec:
  gateways:
  - pep-pfna-flna-pcaf-prod/pep-pfna-flna-pcaf-prod-cv-gw
  hosts:
  - pcaf-messaging-web-controller.pfnapcaf.gw01.aks01.eus.prod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pcaf-messaging-web-controller.pep-pfna-flna-pcaf-prod.svc.cluster.local
        port:
          number: 80
