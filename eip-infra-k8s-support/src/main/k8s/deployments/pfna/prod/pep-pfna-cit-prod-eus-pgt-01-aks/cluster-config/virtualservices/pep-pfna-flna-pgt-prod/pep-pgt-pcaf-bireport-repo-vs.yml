apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  annotations: {}
  labels:
    app: pep-pgt-pcaf-bireport-repo
  name: pep-pgt-pcaf-bireport-repo-vs
  namespace: pep-pfna-flna-pgt-prod
spec:
  gateways:
  - pep-pfna-flna-pgt-prod/pep-pfna-flna-pgt-prod-cv-gw
  hosts:
  - pep-pgt-pcaf-bireport-repo.pfnapgt.gw01.aks01.eus.prod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-pgt-pcaf-bireport-repo.pep-pfna-flna-pgt-prod.svc.cluster.local
        port:
          number: 80
