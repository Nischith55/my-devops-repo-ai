apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-pgt-pcaf-cblite-repo-vs
  namespace: pep-pfna-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-pgt-pcaf-cblite-repo.pfnapgt.gw01.aks01.eus.prod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
