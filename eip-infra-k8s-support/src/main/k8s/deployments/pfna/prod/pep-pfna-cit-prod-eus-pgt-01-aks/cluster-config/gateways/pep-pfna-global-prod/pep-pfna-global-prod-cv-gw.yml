---
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: pep-pfna-global-prod-cv-gw
  namespace: pep-pfna-global-prod
spec:
  selector:
    istio: pep-pfna-ingress-gw01
  servers:
  - hosts:
    - "dummy-passthrough-pep-pfna-global-prod.gw01.aks01.eus.prod.azure.intra.pepsico.com"
    name: "pep-pfna-global-prod-cv-gw-tls-443"
    port:
      name: "https-pep-pfna-global-prod-cv-gw-tls-443"
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - pep-pfna-nginx.pfnapgt.gw01.aks01.eus.prod.azure.intra.pepsico.com
    name: "pep-pfna-global-prod-cv-gw-https-443"
    port:
      name: "https-pep-pfna-global-prod-cv-gw-443"
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: "pep-pfna-cit-prod-eus-pgt-01-aks-gw01-tls"
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - pep-pfna-nginx.pfnapgt.gw01.aks01.eus.prod.azure.intra.pepsico.com
    name: "pep-pfna-global-prod-cv-gw-http-80"
    port:
      name: "http-pep-pfna-global-prod-cv-gw-80"
      number: 80
      protocol: http
    tls:
      httpsRedirect: true
