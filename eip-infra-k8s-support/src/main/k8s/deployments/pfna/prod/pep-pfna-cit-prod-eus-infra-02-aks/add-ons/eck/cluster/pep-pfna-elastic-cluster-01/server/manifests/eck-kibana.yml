---
# ##
# IMPORTANT:
# - Follow the conventions <env>-<region> suffix
# ##
# Kibana Bits for ECK deployment
apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: cluster-01-prod-eus
  namespace: pep-pfna-elastic-cluster-01
spec:
  version: !!str 7.17.5
  image: &img_kibana001 docker.elastic.co/kibana/kibana:7.17.5
  count: 2

  elasticsearchRef:
    # name of the cluster that this is attached to
    name: cluster-01-prod-eus
    # IMPORTANT: we use our custom service which redirects to coordinator
    # nodes must be in the same namespace as the elasticsearch ref
    serviceName: pep-pfna-data-01

  # ##
  # secureSettings are all consolidated into 1 secret xpack-generic
  # - the secret contains all kibana encryption keys
  # ##
  secureSettings:
    - secretName: pep-pfna-cit-prod-eus-infra-02-aks-xpack-generic
      entries:
        - key: xpack.security.encryptionKey
        - key: xpack.encryptedSavedObjects.encryptionKey
        - key: xpack.reporting.encryptionKey

  # HTTP Layer
  http:
    tls:
      certificate:
        # make sure this is installed in the namespace
        secretName: &gw01_secret pep-pfna-cit-prod-eus-infra-02-aks-gw01-generic

  #: Most of the kibana.yaml NOT ALL - read the docs go here
  config:
    csp:
      strict: true

    # ES Communications
    elasticsearch:
      # This is the default, but shown here for completeness
      requestHeadersWhitelist:
        - authorization
      ssl:
        certificateAuthorities:
        - /usr/share/kibana/config/pep/etc/certs/PepsiCoCA01.pem
        - /usr/share/kibana/config/pep/etc/certs/PepsiCoRootCA.pem
        verificationMode: certificate

    logging:
      appenders:
        json-layout:
          type: console
          layout:
            type: json
      root:
        level: info
        appenders:
        # IMPORTANT: default must be present, till v8 then it should be
        # removed
        - default
        - json-layout

      loggers:
      - name: elasticsearch.query
        level: info

    # Part (1/3) Stack Monitoring (disable built-in)
    monitoring:
      kibana:
        collection:
          enabled: false

    server:
      publicBaseUrl: https://pep-pfna-kibana-01.pfnainfra.gw01.aks02.eus.prod.azure.intra.pepsico.com:443
      # Default 1mb (had 100, now 3)
      maxPayload: 3145728
      ssl:
        certificateAuthorities:
        - /usr/share/kibana/config/pep/etc/certs/PepsiCoCA01.pem
        - /usr/share/kibana/config/pep/etc/certs/PepsiCoRootCA.pem
        supportedProtocols:
        - TLSv1.2
        - TLSv1.3

    telemetry:
      # we don't need to send anything to elastic
      enabled: false

    #: ~~ xpack settings

    xpack:

      # Part (2/3) Stack Monitoring (enable xpack monitoring)
      monitoring:
        collection:
          enabled: false
        ui:
          enabled: true
          container:
            elasticsearch:
              enabled: true
        kibana:
          collection:
            enabled: true

      #Webhook Config for alerts
      actions:
        allowedHosts: ["pepsico.service-now.com","planrr.corp.pep.pvt","wsgna.corp.pep.pvt","maker.ifttt.com"]
        rejectUnauthorized: false
        customHostSettings:
          - url: https://pepsico.service-now.com
        # allowedHosts: ["wsgna.corp.pep.pvt","planrr.corp.pep.pvt"]
        # rejectUnauthorized: false
        # customHostSettings:
        #   - url: https://wsgna.corp.pep.pvt
        #     ssl:
        #       verificationMode: 'full'
        #       certificateAuthoritiesFiles: 
        #         - /usr/share/kibana/config/pep/etc/certs/PepsiCoCA01.pem
        #         - /usr/share/kibana/config/pep/etc/certs/PepsiCoRootCA.pem

      license_management.ui:
        # let's enabled license mgmt through UI
        enabled: true

      reporting:
        enabled: true

      security:
        audit:
          enabled: true
        authc:
          providers:
            basic:
              native1:
                order: 0
                description: Administrators Only
            saml:
              pep_prod_saml:
                order: 2
                enabled: true
                realm: pep_prod_saml
                description: Log in with PROD Credentials
          selector:
            enabled: true

        loginAssistanceMessage: |
          PFNA Kibana - Please contact PFNA Admins for assistance

        loginHelp: |
          PFNA Kibana - Only TLS1.2 supported

        # since we are reverse proxying
        secureCookies: true

        # session timeouts
        session:
          idleTimeout: 8h
          lifespan: 24h

  podTemplate:
    # ES for Stack monitoring
    metadata:
      labels:
        # Part (3/3) Stack Monitoring (for autodiscover)
        stack-monitoring.elastic.co/type: kb-cluster-01-prod-eus
      annotations:
        co.elastic.logs/enabled: "true"

    spec:

      # ##
      # IMPORTANT: we will pack kibana on Cooridnator nodes
      # - setup the antiaffinity for ingest nodes
      # - setup preferred topology constraints (since we are zoned)
      # - setup nodeSelector and tolerations
      # - adjust limits (resource) so we can schedule
      # ##
      nodeSelector:
        balance-group: ESGeneralPurpose01ZonedPools

      tolerations:
        - key: ESGeneralPurpose01NodeOnlyZone1
          operator: Exists
        - key: ESGeneralPurpose01NodeOnlyZone2
          operator: Exists
        - key: ESGeneralPurpose01NodeOnlyZone3
          operator: Exists

      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        # Hard Constraint
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            common.k8s.elastic.co/type: kibana

      # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
      # All volumes
      # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
      volumes:
        - name: config-projected
          projected:
            # 0775 -> 509, 0644 -> 420
            defaultMode: 420
            sources:
            # pep-ca-certs-config
            - configMap:
                name: pep-ca-certs-config
                optional: false
                items:
                  - key: PepsiCoCA01.pem
                    # must be relative
                    path: etc/certs/PepsiCoCA01.pem
                  - key: PepsiCoRootCA.pem
                    # must be relative
                    path: etc/certs/PepsiCoRootCA.pem

      # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
      # All containers
      # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
      containers:
        - name: kibana

          env:
          - name: NODE_OPTIONS
            value: "--max-old-space-size=4192"
          resources:
            limits:
              memory: 4Gi
              cpu: 2000m
            requests:
              memory: 3Gi
              cpu: 1900m

          volumeMounts:
            - name: config-projected
              # NOTE: we mount it in well known path for kibana container
              mountPath: /usr/share/kibana/config/pep
              readOnly: true
