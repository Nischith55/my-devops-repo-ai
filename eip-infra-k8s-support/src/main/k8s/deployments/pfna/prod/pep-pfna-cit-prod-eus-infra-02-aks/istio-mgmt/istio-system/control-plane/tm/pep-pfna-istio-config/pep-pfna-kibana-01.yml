      - port: 443
        sniHosts:
          - pep-pfna-kibana-01.pfnainfra.gw01.aks02.eus.prod.azure.intra.pepsico.com
      route:
        - destination:
            host: cluster-01-prod-eus-kb-http.pep-pfna-elastic-cluster-01.svc.cluster.local
            port:
              number: 5601
