  namespace: pep-pfna-istio-config
spec:
  gateways:
    - istio-system/istio-in-gateway-01
  hosts:
  - pep-pfna-kibana-01.pfnainfra.gw01.aks02.eus.prod.azure.intra.pepsico.com
  tls:
