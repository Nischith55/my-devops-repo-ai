---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pep-pfna-cmponboard-clusterrole
rules: 
-   apiGroups:
    - ''
    resources:
    - namespaces
    - serviceaccounts
    verbs:
    - create
    - list
    - get
-   apiGroups:
    - 'rbac.authorization.k8s.io'
    resources:
    - rolebindings
    verbs:
    - create
    - list
    - get
-   apiGroups:
    - 'rbac.authorization.k8s.io'
    resources:
    - clusterroles
    verbs:
    - bind
    resourceNames:
    - pep-pfna-developer-clusterrole
    - pep-pfna-springcloudk8s-clusterrole
    - pep-pfna-appsupport-clusterrole
-   apiGroups:
    - ''
    resources:
    - secrets
    verbs:
    - create
    - list
    - get
    - patch
    - update
    - watch       
-   apiGroups:
    - 'secrets-store.csi.x-k8s.io'
    resources:
    - secretproviderclasses
    verbs:
    - get
    - list
    - watch
    - patch
    - update