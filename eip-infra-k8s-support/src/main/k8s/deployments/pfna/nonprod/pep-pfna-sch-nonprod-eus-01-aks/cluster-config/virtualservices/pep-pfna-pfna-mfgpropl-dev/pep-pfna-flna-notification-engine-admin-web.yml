apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-pfna-flna-notification-engine-admin-web
  name: pep-pfna-flna-notification-engine-admin-web
  namespace: pep-pfna-pfna-mfgpropl-dev
spec:
  gateways:
  - pep-pfna-pfna-mfgpropl-dev/pep-pfna-pfna-mfgpropl-dev-cv-gw
  hosts:
  - mfgproplus.dev.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /app/notifications
    route:
    - destination:
        host: pep-pfna-flna-notification-engine-admin-web.pep-pfna-pfna-mfgpropl-dev.svc.cluster.local
        port:
          number: 8080
