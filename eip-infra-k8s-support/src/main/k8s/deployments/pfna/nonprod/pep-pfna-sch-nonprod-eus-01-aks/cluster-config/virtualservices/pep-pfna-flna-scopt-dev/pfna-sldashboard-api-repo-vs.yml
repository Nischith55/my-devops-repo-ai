apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pfna-sldashboard-api-repo
  name: pfna-sldashboard-api-repo-vs
  namespace: pep-pfna-flna-scopt-dev
spec:
  gateways:
  - pep-pfna-flna-scopt-dev/pep-pfna-flna-scopt-dev-cv-gw
  hosts:
  - pfna-sldashboard-api-repo.pfna.sch.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pfna-sldashboard-api-repo.pep-pfna-flna-scopt-dev.svc.cluster.local
        port:
          number: 8080
