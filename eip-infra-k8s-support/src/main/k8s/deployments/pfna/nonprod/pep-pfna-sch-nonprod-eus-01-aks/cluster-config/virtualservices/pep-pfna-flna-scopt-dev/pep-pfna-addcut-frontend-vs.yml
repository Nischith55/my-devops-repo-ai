apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-pfna-addcut-frontend
  name: pep-pfna-addcut-frontend-vs
  namespace: pep-pfna-flna-scopt-dev
spec:
  gateways:
  - pep-pfna-flna-scopt-dev/pep-pfna-flna-scopt-dev-cv-gw
  hosts:
  - pep-pfna-addcut-frontend.pfna.sch.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  - addcut.dev.mypepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-pfna-addcut-frontend.pep-pfna-flna-scopt-dev.svc.cluster.local
        port:
          number: 8000
