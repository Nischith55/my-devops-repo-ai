apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-pfna-flna-scopt-sc-notifications
  name: pep-pfna-flna-scopt-sc-notifications-vs
  namespace: pep-pfna-flna-scopt-dev
spec:
  gateways:
  - pep-pfna-flna-scopt-dev/pep-pfna-flna-scopt-dev-cv-gw
  hosts:
  - pep-pfna-flna-scopt-sc-notifications.pfna.sch.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - corsPolicy:
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Link
      - Content-Type
      - Access-Control-Allow-Origin
      - Access-Control-Allow-Headers
      - x-operation-name
      - x-operation-type
      allowMethods:
      - POST
      - GET
      - PUT
      - DELETE
      - OPTIONS
      allowOrigins:
      - exact: https://pep-pfna-addcut.pfna.sch.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
      exposeHeaders:
      - x-total-count
    match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-pfna-flna-scopt-sc-notifications.pep-pfna-flna-scopt-dev.svc.cluster.local
        port:
          number: 8000
