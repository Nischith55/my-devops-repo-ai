apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-pfna-transp-exception-details-api-vs
  namespace: pep-pfna-sch-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-pfna-transp-exception-details-api.pfna.sch.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /transp/v1/exception-details
    route:
    - destination:
        host: pep-pfna-transp-exception-details-api.pep-pfna-flna-transp-dev.svc.cluster.local
        port:
          number: 80
