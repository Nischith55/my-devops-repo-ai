apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: azurefile
mountOptions:
  - vers=3.0
  - dir_mode=0777
  - file_mode=0644
  - mfsymlinks
  - nobrl
  - cache=strict
  - actimeo=30
  - uid=1000
  - gid=1000
parameters:
  resourceGroup: pep-pfna-sch-nonprod-eus-k8s-01-rg
  skuName: Standard_LRS
  storageAccount: pp1003sch01aks03sa
provisioner: file.csi.azure.com
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
