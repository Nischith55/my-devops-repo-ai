allowVolumeExpansion: true
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: azurefiledevops
mountOptions:
- vers=3.0
- dir_mode=0777
- file_mode=0644
- mfsymlinks
- nobrl
- cache=strict
- actimeo=30
- uid=1000
- gid=1000
parameters:
  resourceGroup: pep-pfna-sch-nonprod-eus-k8s-01-rg
  skuName: Premium_LRS
  storageAccount: pp1003sch01aksfp04sa
provisioner: file.csi.azure.com
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer