  namespace: pep-pfna-flna-transp-dev
  labels:
      app: pep-pfna-transp-masterdatacache
spec:
  hosts:
  - pep-pfna-transp-masterdatacache-dev-01.pfna.sch.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  gateways:
  - pep-pfna-flna-transp-dev/pep-pfna-flna-transp-dev-cv-gw
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /transp/v1/masterdata-cache-api
    route:
    - destination:
        host: pep-pfna-transp-masterdatacache.pep-pfna-flna-transp-dev.svc.cluster.local
        port:
          number: 80
  