---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: risingwave-opentelemetry-collector
  labels:
    app: risingwave-collector
    type: telemetry
    app.kubernetes.io/instance: otelrisingwave
    app.kubernetes.io/name: opentelemetry-collector
    app.kubernetes.io/version: latest
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: otelrisingwave
      app.kubernetes.io/name: opentelemetry-collector
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: risingwave-collector
        type: telemetry
        app.kubernetes.io/instance: otelrisingwave
        app.kubernetes.io/name: opentelemetry-collector
      annotations:
        prometheus.io/port: "9464"
        prometheus.io/scrape: "true"
    spec:
      hostAliases:
      - ip: "172.27.62.199"
        hostnames:
        - "3825028849b946d3a380f6136dcd7c3a.privatelink.southcentralus.azure.elastic-cloud.com"
      volumes:
        - name: opentelemetry-collector-config-vol
          configMap:
            name: risingwave-opentelemetry-collector
            items:
              - key: collectorconfig
                path: opentelemetry-collector-config.yaml
            defaultMode: 420
      containers:
        - name: risingwave-opentelemetry-collector
          image: otel/opentelemetry-collector-contrib:latest
          command:
            - /otelcol-contrib
            - --config=/conf/opentelemetry-collector-config.yaml
          ports:
            - name: otlp
              containerPort: 4317
              protocol: TCP
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
            - name: metrics
              containerPort: 8888
              protocol: TCP
          env:
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: status.podIP
          resources:
            requests:
              memory: "2Gi"
              cpu: "100m"
            limits:
              memory: "3Gi"
              cpu: "300m"
          volumeMounts:
            - name: opentelemetry-collector-config-vol
              mountPath: /conf
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: IfNotPresent
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      serviceAccount: risingwave-opentelemetry-collector
      securityContext: {}
      schedulerName: default-scheduler
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: risingwave-opentelemetry-collector
  labels:
    app: risingwave-collector
    type: telemetry
    app.kubernetes.io/instance: otelrisingwave
    app.kubernetes.io/name: opentelemetry-collector
    app.kubernetes.io/version: latest
data:
  collectorconfig: |
    exporters:
      debug:
        verbosity: detailed    
      elasticsearch:
        # Choose exactly ONE of the following connection methods:
        endpoint: https://3825028849b946d3a380f6136dcd7c3a.privatelink.southcentralus.azure.elastic-cloud.com:9243
        # --- API key authentication ---
        # Paste the *encoded* API key value (base64 of "id:api_key"):
        api_key: b1VBVl9ab0JYdC0zaFRlRk5uekE6SFR0RFE3TFpFSW5oc2wxQkFVUF9vUQ==
        # Route *metrics* to a specific index       
        metrics_index: metrics-sch-risingwave
        # (optional but recommended) keep default OTel-native mapping
        mapping:
          mode: otel
        include_source_on_error: true

    extensions:
      health_check: {}
      zpages: {}
    processors:
      batch:
        send_batch_size: 512
        send_batch_max_size: 1024
    receivers:
      prometheus:
        config:
          scrape_configs:
            - job_name: 'risingwave-compute'
              scrape_interval: 5s
              static_configs:
                - targets: ['risingwave-compute-headless:1222']
            - job_name: 'risingwave-meta'
              scrape_interval: 5s
              static_configs:
                - targets: ['risingwave-meta-headless:1250']
    service:
      extensions:
      - health_check
      - zpages
      pipelines:
        metrics:
          receivers: [prometheus]
          processors: [batch]
          exporters: [elasticsearch]
      telemetry:
        logs:
          level: "ERROR"

---
apiVersion: v1
kind: Service
metadata:
  name: risingwave-opentelemetry-collector
  labels:
    app: risingwave-collector
    type: telemetry
    app.kubernetes.io/instance: otelrisingwave
    app.kubernetes.io/name: opentelemetry-collector
    app.kubernetes.io/version: latest
status:
  loadBalancer: {}
spec:
  ports:
    - name: otlp
      protocol: TCP
      appProtocol: grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      protocol: TCP
      port: 4318
      targetPort: 4318
    - name: metrics
      protocol: TCP
      port: 8888
      targetPort: 8888
  selector:
    app.kubernetes.io/instance: otelrisingwave
    app.kubernetes.io/name: opentelemetry-collector
  type: ClusterIP
  sessionAffinity: None
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  internalTrafficPolicy: Cluster

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: risingwave-opentelemetry-collector
  labels:
    app: risingwave-collector
    type: telemetry
    app.kubernetes.io/instance: otelrisingwave
    app.kubernetes.io/name: opentelemetry-collector
    app.kubernetes.io/version: latest