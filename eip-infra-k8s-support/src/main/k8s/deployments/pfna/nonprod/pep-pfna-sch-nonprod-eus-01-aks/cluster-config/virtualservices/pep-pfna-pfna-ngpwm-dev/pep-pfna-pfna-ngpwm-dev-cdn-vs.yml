apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-pfna-pfna-ngpwm-dev-cv-cdn-vs
  namespace: pep-pfna-pfna-ngpwm-dev
spec:
  hosts:
    - nextgenpwm.dev.mypepsico.com
  gateways:
  - "pep-pfna-pfna-ngpwm-dev/pep-pfna-pfna-ngpwm-dev-cv-gw"
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: "/"
    route:
    - destination:
        host:  "pep-pfna-pfna-ngpwm-dev-cv-webdeploy.pep-pfna-pfna-ngpwm-dev.svc.cluster.local"
        port:
          number: 80