apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-pfna-transp-databot
  name: pep-pfna-transp-databot-vs
  namespace: pep-pfna-flna-transp-dev
spec:
  gateways:
  - pep-pfna-flna-transp-dev/pep-pfna-flna-transp-dev-cv-gw
  hosts:
  - pep-pfna-transp-databot.pfna.sch.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /transp/v1/databot
    route:
    - destination:
        host: pep-pfna-transp-databot.pep-pfna-flna-transp-dev.svc.cluster.local
        port:
          number: 80
