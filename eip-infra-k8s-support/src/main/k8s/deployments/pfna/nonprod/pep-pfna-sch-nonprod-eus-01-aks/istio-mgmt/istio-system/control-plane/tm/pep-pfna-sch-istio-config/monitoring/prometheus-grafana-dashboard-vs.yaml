apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: prometheus-grafana-dashboard-vs
  namespace: monitoring
spec:
  gateways:
  - monitoring/prometheus-gw
  hosts:
  - prometheus-grafana-dashboard.pfna.sch.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: prometheus-grafana.monitoring.svc.cluster.local
        port:
          number: 3000
