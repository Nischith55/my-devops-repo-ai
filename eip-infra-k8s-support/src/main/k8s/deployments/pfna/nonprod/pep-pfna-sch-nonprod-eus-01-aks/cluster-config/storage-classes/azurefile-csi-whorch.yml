apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: azurefile-csi-whorch
mountOptions:
  - vers=3.0
  - dir_mode=0777
  - file_mode=0644
  - mfsymlinks
  - nobrl
  - cache=strict
  - actimeo=30
  - uid=1000
  - gid=1000
parameters:
  resourceGroup: pep-warehouseorchestration-pfna-eus-nonprod-01-rg
  skuName: Standard_LRS
  storageAccount: askstream
provisioner: file.csi.azure.com
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
