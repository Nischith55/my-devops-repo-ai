kind: Namespace
apiVersion: v1
metadata:
  name: pep-pfna-snowdiscovery-dev
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: snow-sa-pepsicodev
  namespace: pep-pfna-snowdiscovery-dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: snow-cr-pep-eiap-snowdiscovery-dev
  namespace: pep-pfna-snowdiscovery-dev
rules:
  - apiGroups: ["","apps","batch", "networking.k8s.io"]
    resources: ["namespaces","nodes","deployments","statefulsets","daemonsets","replicasets","replicationcontrollers",
                "jobs","cronjobs","pods", "pods/log", "endpoints","services", "ingresses","routes", "groups", "users"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: snow-sa-snow-cr-pep-eiap-snowdiscovery-dev
  namespace: pep-pfna-snowdiscovery-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pep-pfna-snowdiscovery-dev
subjects:
  - kind: ServiceAccount
    name: snow-sa-pepsicodev
    namespace: pep-pfna-snowdiscovery-dev
