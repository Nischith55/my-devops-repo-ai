apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-pfna-transp-geotab-api-argocd
  name: pep-pfna-transp-geotab-api-argocd
  namespace: pep-pfna-flna-transp-dev
spec:
  gateways:
  - pep-pfna-flna-transp-dev/pep-pfna-flna-transp-dev-cv-gw
  hosts:
  - pep-pfna-transp-geotab-api-argocd.pfna.sch.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /transp/v1/geotab-api
    route:
    - destination:
        host: pep-pfna-transp-geotab-api-argocd.pep-pfna-flna-transp-dev.svc.cluster.local
        port:
          number: 8080
