# - Setup metricbeat configuration (note: This is a Deployment) so only
#   cluster wide metrics are applicable
# ##
apiVersion: v1
kind: ConfigMap
metadata:
  # NOTE: change this for instance of elastic running
  name: pep-pfna-sch-nonprod-eus-01-aks-k8s-metricbeat-config
  namespace: pep-pfna-sch-elastic-client-01

data:

  # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  # metricbeat environment variables change here
  # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  K8S_CLUSTER_NAME: pep-pfna-sch-nonprod-eus-01-aks
  #TEMPLATE_NAME: metricbeat-aks-cluster
  #INDEX_PATTERN_PREFIX: mb-aks

  # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  # metricbeat processor stuff
  # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  metricbeat-processor.yml: |


    # ---------------------------------------------------------------------
    # Common Processors across all beats deployment
    # ---------------------------------------------------------------------
    
    processors:
      - add_fields:
          fields:
            ls-destination: "EUS"
            pep-aks-cluster: pep-pfna-sch-nonprod-eus-01-aks
            sn-application: "SUPPLY-CHAIN-HUB-NONPROD"
      - add_host_metadata: {}
      - add_cloud_metadata: {}
      - add_kubernetes_metadata: {}
    # ~~
    # Logging
    # ~~
    logging:
      level: DEBUG
      metrics:
        enabled: true

  # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  # metricbeat standard k8s stuff
  # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  metricbeat.yml: |

    # --------------------
    # All outputs
    # --------------------
    output.logstash:
      hosts: ["pepwap23142.corp.pep.pvt:5078", "pepwap23143.corp.pep.pvt:5078", "pepwap23144.corp.pep.pvt:5078"]
      loadbalance: true
      worker: 3

    # --------------------
    # send metricbeat metrics itself to our monitoring cluster
    # --------------------
    # monitoring:
    #   enabled: true
    #   elasticsearch:
    #     hosts:
    #       - ${MONITORING_CLUSTER_URL}
    #     # IMPORTANT we are re-using the usernae and password
    #     username: ${MONITORING_CLUSTER_USERNAME}
    #     password: ${MONITORING_CLUSTER_PASSWORD}
    #     ssl: *pep_ca_ssl

    # ---------------------------------------------------------------------
    # Setup metricbeat configuration (Common K8S stuff)
    # ---------------------------------------------------------------------
    metricbeat:

      # ~~
      # modules
      # ~~
      modules:

      # Since this is a cluster wide scoped metricbeat disable the system
      # module which is enabled by default
      - module: system
        enabled: false

      # ~~
      # kubernetes: add metrics from metrics endpoint
      # ~~
      - module: kubernetes
        enabled: true
        add_metadata: true
        period: 10s
        hosts:
        - kube-state-metrics.${KUBE_STATE_METRICS_NAMESPACE}.svc:${KUBE_STATE_METRICS_PORT}
        metricsets:
        - state_node
        - state_deployment
        - state_daemonset
        - state_replicaset
        - state_pod
        - state_container
        - state_cronjob
        - state_resourcequota
        - state_statefulset
        - state_service
        - state_persistentvolume
        - state_persistentvolumeclaim
        - state_storageclass
        # k8s events
        # - event

      # ~~
      # kubernetes: add metrics from apiserver
      # ~~
      - module: kubernetes
        enabled: true
        period: 30s
        hosts:
        - https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}
        metricsets:
        - apiserver
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        ssl:
          certificate_authorities:
          - /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          supported_protocols:
            - TLSv1.2
            - TLSv1.3
          verification_mode: certificate

      # ~~
      # istio: istiod metricset (NOTE: experimental)
      # IMPORTANT: Make sure istiod SVC is correct for the cluster
      # ~~
      - module: istio
        enabled: true
        period: 30s
        timeout: 90s
        metricsets:
        - istiod
        hosts:
        # standard install, if different change it
        - istiod-1-14-4.istio-system.svc.cluster.local:15014

      # TODO: Please enable after promethscus is installed..
      # # ~~
      # # Autodiscover istio-proxy containers (since we are sidecar injected)
      # # ~~
      # autodiscover:
      #  providers:
      # # stack monitoring
      #  - type: kubernetes
      #    scope: cluster
      #    resource: pod
      #    node: ${NODE_NAME}
      #    hints:
      #      enabled: true
      #    templates:
      #      - condition:
      #          contains:
      #            # (we use std. istio injected annotation)
      #            kubernetes.annotations.prometheus.io/path: "/stats/prometheus"
      #        config:
      #          - module: istio
      #            enabled: true
      #            period: 30s
      #            metricsets:
      #            - proxy
      #            # undocumented seems to work for slow system
      #            timeout: 90s
      #           hosts:
      #            # istio proxy port
      #            - http://${data.host}:15090
        

      
---
apiVersion: apps/v1
kind: Deployment
metadata:
  # name format: <output-eck-cluster>-k8s
  name: &app_name pep-pfna-sch-nonprod-eus-01-aks-k8s-metricbeat
  namespace: pep-pfna-sch-elastic-client-01
  labels:
    app.kubernetes.io/name: *app_name
    app.kubernetes.io/version: &vers 8.5.2
spec:

  # For cluster wide metricbeat we use recreate, so we don't run into locks
  strategy:
    type: Recreate

  selector:
    matchLabels:
      app.kubernetes.io/name: *app_name
      app.kubernetes.io/version: *vers

  template:

    metadata:
      labels:
        app.kubernetes.io/name: *app_name
        app.kubernetes.io/version: *vers
        app: *app_name
        version: *vers

    spec:
      # PEP:
      # - Deployment run only on system node pool taints
      # - also lock down the node selector
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.azure.com/mode: system
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists

      serviceAccountName: metricbeat
      # some older Beat versions are depending on this settings presence
      # in k8s context
      automountServiceAccountToken: true
      securityContext:
        runAsUser: 0

      # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
      # All volumes
      # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
      volumes:

      # PEP: all in one configMap (using projections)
      - name: config-projected
        projected:
          # 0644 -> 420, 0600 -> 384
          defaultMode: 384
          sources:

          # pep-ca-certs-config
          - configMap:
              name: pep-ca-certs-config
              optional: false
              items:
                - key: PepsiCoCA01.pem
                  # must be relative
                  path: etc/certs/PepsiCoCA01.pem
                - key: PepsiCoRootCA.pem
                  # must be relative
                  path: etc/certs/PepsiCoRootCA.pem

          - configMap:
              name: &beats_config pep-pfna-sch-nonprod-eus-01-aks-k8s-metricbeat-config
              optional: false
              items:
                - key: metricbeat.yml
                  # must be relative
                  path: etc/beat.yml
                - key: metricbeat-processor.yml
                  # must be relative
                  path: etc/beat-processor-config.yml

      containers:
      # PEP: args removed sysfs it's a deployment
      - name: metricbeat
        image: docker.elastic.co/beats/metricbeat:8.5.2
        args:
        - -environment
        - container
        - -e
        - -c
        - /projected/etc/beat-processor-config.yml
        - -c
        - /projected/etc/beat.yml
        # - -d
        # - "monitoring"
        # - index-management,processors

        resources:
          # limits:
          #   cpu: 100m
          #   memory: 200Mi
          requests:
            # cpu: 200m
            memory: 512Mi
        env:

        # All environment variables from beats-shared-env-config
        # # Monitoring cluster url for ingesting stack monitoring data
        # - name: MONITORING_CLUSTER_URL
        #   valueFrom:
        #     configMapKeyRef:
        #       name: *beats_config
        #       key: MONITORING_CLUSTER_URL

        # - name: MONITORING_CLUSTER_USERNAME
        #   valueFrom:
        #     secretKeyRef:
        #       name: *shared_sec
        #       # re-use
        #       key: BEATS_MONITOR_INGEST_USER_01

        # - name: MONITORING_CLUSTER_PASSWORD
        #   valueFrom:
        #     secretKeyRef:
        #       name: *shared_sec
        #       # re-use
        #       key: BEATS_MONITOR_INGEST_PASSWORD_01

        # # NOTE: this is only if we use it (stack_collector)
        # - name: MONITOR_USERNAME
        #   valueFrom:
        #     secretKeyRef:
        #       name: *shared_sec
        #       key: MONITOR_COMMON_USER_01

        # - name: MONITOR_PASSWORD
        #   valueFrom:
        #     secretKeyRef:
        #       name: *shared_sec
        #       key: MONITOR_COMMON_PASSWORD_01

        # PEP: change
        - name: KUBE_STATE_METRICS_NAMESPACE
          value: monitoring

        # PEP: change
        - name: KUBE_STATE_METRICS_PORT
          value: "8080"

        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        # ~~
        # volumemounts
        # ~~
        volumeMounts:
        # PEP:
        - name: config-projected
          # where it is mounted
          mountPath: /projected
          readOnly: true
