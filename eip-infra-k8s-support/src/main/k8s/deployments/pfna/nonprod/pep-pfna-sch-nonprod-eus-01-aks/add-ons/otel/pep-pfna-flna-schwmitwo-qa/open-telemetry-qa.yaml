---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: schub-whse-opentelemetry-collector
  labels:
    app: schub-whse-collector
    type: telemetry
    app.kubernetes.io/instance: otelschubwhse
    app.kubernetes.io/name: opentelemetry-collector
    app.kubernetes.io/version: 0.101.0
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: otelschubwhse
      app.kubernetes.io/name: opentelemetry-collector
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: schub-whse-collector
        type: telemetry
        app.kubernetes.io/instance: otelschubwhse
        app.kubernetes.io/name: opentelemetry-collector
      annotations:
        prometheus.io/port: "9464"
        prometheus.io/scrape: "true"
    spec:
      volumes:
        - name: opentelemetry-collector-config-vol
          configMap:
            name: schub-whse-opentelemetry-collector
            items:
              - key: collectorconfig
                path: opentelemetry-collector-config.yaml
            defaultMode: 420
      containers:
        - name: schub-whse-opentelemetry-collector
          image: otel/opentelemetry-collector-contrib:0.101.0
          command:
            - /otelcol-contrib
            - --config=/conf/opentelemetry-collector-config.yaml
          ports:
            - name: otlp
              containerPort: 4317
              protocol: TCP
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
            - name: metrics
              containerPort: 8888
              protocol: TCP
          env:
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: status.podIP
          resources: {}
          volumeMounts:
            - name: opentelemetry-collector-config-vol
              mountPath: /conf
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: IfNotPresent
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      serviceAccount: schub-whse-opentelemetry-collector
      securityContext: {}
      schedulerName: default-scheduler
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: schub-whse-opentelemetry-collector
  labels:
    app: schub-whse-collector
    type: telemetry
    app.kubernetes.io/instance: otelschubwhse
    app.kubernetes.io/name: opentelemetry-collector
    app.kubernetes.io/version: 0.101.0
data:
  collectorconfig: >-
    exporters:
      debug:
        verbosity: detailed 
      logging: 
        verbosity: detailed
      otlp/elastic:
        # Elastic APM server https endpoint without the "https://" prefix
        endpoint: "4a611ebe056e4a2ebe7de241c50482f4.apm.southcentralus.azure.elastic-cloud.com:443"  
        headers:
        # Elastic APM Server secret token
          Authorization: "Bearer OelgRXU8r2XZSqrWDC"
    extensions:
      health_check: {}
      zpages:
    processors:
      groupbytrace/custom:
        wait_duration: 1s
        num_traces: 5000
        num_workers: 4
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 30
      batch:
        send_batch_size: 512
        send_batch_max_size: 1024
      groupbyattrs:
        keys:
          - host.name
      attributes/ba:
        actions:
          - action: insert
            key: service_offering
            value: SCHUB-WHSE
          - action: insert
            key: business_application
            value: SCHUB-WHSE
      filter/drop_healthcheck:
        error_mode: ignore
        traces:
          span:
            - attributes["url.path"] == "/health/liveness"
            - attributes["url.path"] == "/health/readiness"
    receivers:
      otlp:
        protocols:
          grpc:
    service:
      extensions:
      - health_check
      - zpages
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [attributes/ba]
          exporters: []
        traces:
          receivers: [otlp]
          processors: [filter/drop_healthcheck, attributes/ba, groupbytrace/custom, groupbyattrs, memory_limiter, batch]
          exporters: []
        logs:
          receivers: [otlp]
          processors: [attributes/ba]
          exporters: []
      telemetry:
        logs:
          level: "debug"
        metrics:
          address: "localhost:8888"

---
apiVersion: v1
kind: Service
metadata:
  name: schub-whse-opentelemetry-collector
  labels:
    app: schub-whse-collector
    type: telemetry
    app.kubernetes.io/instance: otelschubwhse
    app.kubernetes.io/name: opentelemetry-collector
    app.kubernetes.io/version: 0.101.0
status:
  loadBalancer: {}
spec:
  ports:
    - name: otlp
      protocol: TCP
      appProtocol: grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      protocol: TCP
      port: 4318
      targetPort: 4318
    - name: metrics
      protocol: TCP
      port: 8888
      targetPort: 8888
  selector:
    app.kubernetes.io/instance: otelschubwhse
    app.kubernetes.io/name: opentelemetry-collector
  type: ClusterIP
  sessionAffinity: None
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  internalTrafficPolicy: Cluster

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: schub-whse-opentelemetry-collector
  labels:
    app: schub-whse-collector
    type: telemetry
    app.kubernetes.io/instance: otelschubwhse
    app.kubernetes.io/name: opentelemetry-collector
    app.kubernetes.io/version: 0.101.0