apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-pfna-flna-mfgproplus-noteng-event-processor-api
  name: pep-pfna-flna-mfgproplus-noteng-event-processor-api
  namespace: pep-pfna-pfna-mfgpropl-dev
spec:
  gateways:
  - pep-pfna-pfna-mfgpropl-dev/pep-pfna-pfna-mfgpropl-dev-cv-gw
  hosts:
  - pep-pfna-flna-mfgproplus-noteng-event-processor-api.pfna.sch.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - corsPolicy:
      allowCredentials: null
      allowHeaders:
      - '*'
      allowMethods:
      - POST
      - GET
      - PUT
      - DELETE
      - OPTIONS
      - HEAD
      - PATCH
      allowOrigins:
      - regex: .*
    match:
    - ignoreUriCase: true
      uri:
        prefix: /noteng/eventproc/api/
    rewrite:
      uri: /
    route:
    - destination:
        host: pep-pfna-flna-mfgproplus-noteng-event-processor-api.pep-pfna-pfna-mfgpropl-dev.svc.cluster.local
        port:
          number: 8080
