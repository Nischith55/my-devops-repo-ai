apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pfna-add-cut-services-vs
  namespace: pep-pfna-sch-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pfna-add-cut-services.pfna.sch.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  - api.addcut.dev.mypepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /api/v1/
    route:
    - destination:
        host: pfna-add-cut-services.pep-pfna-flna-scopt-dev.svc.cluster.local
        port:
          number: 80
