apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pepsico-pfna-transportation-sch-ui-vs
  namespace: pep-pfna-sch-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pepsico-pfna-transportation-sch-ui.pfna.sch.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pepsico-pfna-transportation-sch-ui.pep-pfna-flna-transp-dev.svc.cluster.local
        port:
          number: 80
