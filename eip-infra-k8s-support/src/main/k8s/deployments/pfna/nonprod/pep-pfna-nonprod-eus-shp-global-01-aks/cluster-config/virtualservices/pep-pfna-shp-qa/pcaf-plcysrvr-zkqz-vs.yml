apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pcaf-plcysrvr-zkqz-vs
  namespace: pep-pfna-shp-qa
  labels:
      app: pcaf-plcysrvr
spec:
  hosts:
  - pcaf-plcysrvr.pfnashp.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  gateways:
  - pep-pfna-shp-qa/pep-pfna-shp-qa-cv-gw
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pcaf-plcysrvr.pep-pfna-shp-qa.svc.cluster.local
        port:
          number: 80
    corsPolicy:
      allowOrigins:
      - exact: https://apim-pfna.qa.mypepsico.com
      - exact: https://apim-na.qa.mypepsico.com
      - exact: https://apim-na.dev.mypepsico.com
      - exact: https://t1.uap.pepenv.com
      - exact: https://d1.uap.pepenv.com
      - exact: https://q2.pfnaweb.mypepsico.com
      - exact: https://q1.pfnaweb.mypepsico.com
      - exact: https://d1.pfnaweb.mypepsico.com
      - exact: https://d2.pfnaweb.mypepsico.com
      - exact: https://pp.uap.pepenv.com
      allowMethods:
      - GET
      - PUT
      - POST
      - DELETE
      - OPTIONS
  
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Access-Control-Allow-Origin
      - Access-Control-Allow-Headers
      - Link
      - Content-Type
      exposeHeaders:
      - Authorization
      - Link
       
  