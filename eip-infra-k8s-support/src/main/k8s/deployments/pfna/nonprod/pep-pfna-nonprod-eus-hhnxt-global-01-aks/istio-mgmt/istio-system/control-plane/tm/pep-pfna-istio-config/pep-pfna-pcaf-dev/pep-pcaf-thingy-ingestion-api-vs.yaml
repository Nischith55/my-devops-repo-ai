apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-pcaf-thingy-ingestion-api-vs
  namespace: pep-pfna-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-pcaf-thingy-ingestion-api.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /ti
    route:
    - destination:
        host: pep-pcaf-thingy-ingestion-api.pep-pfna-pcaf-dev.svc.cluster.local
        port:
          number: 8080
