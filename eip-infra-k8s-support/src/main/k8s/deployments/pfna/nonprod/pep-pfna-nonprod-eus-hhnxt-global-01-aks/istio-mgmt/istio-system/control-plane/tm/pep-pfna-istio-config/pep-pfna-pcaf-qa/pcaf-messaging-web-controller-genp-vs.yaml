apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pcaf-messaging-web-controller-genp-qa-vs
  namespace: pep-pfna-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pcaf-messaging-web-controller-genp-qa.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pcaf-messaging-web-controller-genp.pep-pfna-pcaf-qa.svc.cluster.local
        port:
          number: 80
    corsPolicy:
      allowOrigins:
      - exact: https://q2.pfnaweb.mypepsico.com
      allowMethods:
      - POST
      - GET
      - PUT
      - DELETE
      - OPTIONS
      - PATCH
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Content-Type
      - Link
      - x-source
      - Access-Control-Allow-Origin  
      - Access-Control-Allow-Headers
      exposeHeaders:
      - x-total-count
      - x-source