apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pcaf-shp-imgvision-pod-pxap-vs
  namespace: pep-pfna-pgt-qa
  labels:
      app: pcaf-shp-imgvision-pod
spec:
  hosts:
  - pcaf-shp-imgvision-pod-qa-01.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  gateways:
  - pep-pfna-pgt-qa/pep-pfna-pgt-qa-cv-gw
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /replay
    route:
    - destination:
        host: pcaf-shp-imgvision-pod.pep-pfna-pgt-qa.svc.cluster.local
        port:
          number: 80
  