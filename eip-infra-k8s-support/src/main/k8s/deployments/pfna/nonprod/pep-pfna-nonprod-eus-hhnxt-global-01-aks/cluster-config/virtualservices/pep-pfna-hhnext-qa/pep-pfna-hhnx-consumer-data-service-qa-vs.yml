apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-pfna-hhnx-consumer-data-service
  name: pep-pfna-hhnx-consumer-data-service-qa-vs
  namespace: pep-pfna-hhnext-qa
spec:
  gateways:
  - pep-pfna-hhnext-qa/pep-pfna-hhnext-qa-cv-gw
  hosts:
  - pep-pfna-hhnx-consumer-data-service-qa.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - headers:
      request:
        add:
          Content-Type: application/json
        remove:
        - Content-Type
    match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-pfna-hhnx-consumer-data-service.pep-pfna-hhnext-qa.svc.cluster.local
        port:
          number: 80
