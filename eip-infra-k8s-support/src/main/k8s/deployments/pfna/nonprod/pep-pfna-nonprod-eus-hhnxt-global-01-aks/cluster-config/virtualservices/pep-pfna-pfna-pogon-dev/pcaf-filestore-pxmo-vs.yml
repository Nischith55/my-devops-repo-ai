apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pcaf-filestore-pxmo-vs
  namespace: pep-pfna-pfna-pogon-dev
  labels:
      app: pcaf-filestore
spec:
  hosts:
  - pcaf-filestore-dev.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  gateways:
  - pep-pfna-pfna-pogon-dev/pep-pfna-pfna-pogon-dev-cv-gw
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pcaf-filestore.pep-pfna-pfna-pogon-dev.svc.cluster.local
        port:
          number: 80
  