apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pcaf-b2b-caseservice-vs
  namespace: pep-pfna-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pcaf-b2b-caseservice.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pcaf-b2b-caseservice.pep-pfna-pcaf-dev.svc.cluster.local
        port:
          number: 80
    corsPolicy:   
      allowOrigins:
      - exact: https://uatshop.fls2u.com
      - exact: https://s2u-qa-admin.azurefd.net
      allowMethods:
      - POST
      - GET
      - PUT
      - DELETE
      - OPTIONS
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Link
      - Content-Type
      - Access-Control-Allow-Origin
      - Access-Control-Allow-Headers
      exposeHeaders:
      - x-total-count
