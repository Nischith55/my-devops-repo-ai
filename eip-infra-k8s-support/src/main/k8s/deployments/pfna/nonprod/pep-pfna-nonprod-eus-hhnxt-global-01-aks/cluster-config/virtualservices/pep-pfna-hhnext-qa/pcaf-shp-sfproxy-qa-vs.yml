apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pcaf-shp-sfproxy
  name: pcaf-shp-sfproxy-qa-vs
  namespace: pep-pfna-hhnext-qa
spec:
  gateways:
  - pep-pfna-hhnext-qa/pep-pfna-hhnext-qa-cv-gw
  hosts:
  - pcaf-shp-sfproxy-qa.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pcaf-shp-sfproxy.pep-pfna-hhnext-qa.svc.cluster.local
        port:
          number: 80
