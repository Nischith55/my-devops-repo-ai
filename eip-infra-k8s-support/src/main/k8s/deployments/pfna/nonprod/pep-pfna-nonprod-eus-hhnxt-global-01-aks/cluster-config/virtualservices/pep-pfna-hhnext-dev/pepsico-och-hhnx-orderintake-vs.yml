apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pepsico-och-hhnx-orderintake
  name: pepsico-och-hhnx-orderintake-vs
  namespace: pep-pfna-hhnext-dev
spec:
  gateways:
  - pep-pfna-hhnext-dev/pep-pfna-hhnext-dev-cv-gw
  hosts:
  - pepsico-och-hhnx-orderintake.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
