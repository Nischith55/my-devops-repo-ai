apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pcaf-shpn-cpo-ingest-toap-vs
  namespace: pep-pfna-pgt-qa
  labels:
      app: pcaf-shpn-cpo-ingest
spec:
  hosts:
  - pcaf-shpn-cpo-ingest-qa-01.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  gateways:
  - pep-pfna-pgt-qa/pep-pfna-pgt-qa-cv-gw
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pcaf-shpn-cpo-ingest.pep-pfna-pgt-qa.svc.cluster.local
        port:
          number: 80
  