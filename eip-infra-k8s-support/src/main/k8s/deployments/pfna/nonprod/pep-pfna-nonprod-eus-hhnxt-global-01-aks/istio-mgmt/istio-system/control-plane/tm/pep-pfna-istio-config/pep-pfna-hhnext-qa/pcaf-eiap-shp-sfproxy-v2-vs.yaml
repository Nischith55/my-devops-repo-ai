apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pcaf-eiap-shp-sfproxy-v2-qa-vs
  namespace: pep-pfna-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pcaf-eiap-shp-sfproxy-v2-qa.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        exact: /api/v2/sf/services/apexrest/SalesHub/v5/customerTask
      method:
        exact: GET
    - ignoreUriCase: true
      uri:
        exact: /api/v2/sf/services/apexrest/SalesHub/v5/initialData
      method:
        exact: GET
    - ignoreUriCase: true
      uri:
        exact: /api/v2/sf/services/apexrest/SalesHub/v5/upload
      method:
        exact: POST
    - ignoreUriCase: true
      uri:
        exact: /api/v2/sf/services/apexrest/SalesHub/v5/adminInitialData
      method:
        exact: GET
    - ignoreUriCase: true
      uri:
        prefix: /api/v2/sf/services/data/v52.0/query
      method:
        exact: GET
    - ignoreUriCase: true
      uri:
        exact: /api/v2/sf/services/data/v52.0/ui-api/object-info/Customer_Task__c/picklist-values/012000000000000AAA/Activity_Type__c
      method:
        exact: GET
    timeout: 4m
    retries:
      attempts: 2
      perTryTimeout: 1m
      retryOn: gateway-error,connect-failure,refused-stream
    route:
    - destination:
        host: pcaf-eiap-shp-sfproxy-v2.pep-pfna-hhnext-qa.svc.cluster.local
        port:
          number: 80
    #   weight: 80
    # - destination:
    #     host: pcaf-eiap-shp-sfproxy-v2-canary.pep-pfna-hhnext-qa.svc.cluster.local
    #     port:
    #       number: 80
    #   weight: 20