apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-pcaf-eiv-inventory-reporting
  name: pep-pcaf-eiv-inventory-reporting-qa-vs
  namespace: pep-pfna-pcaf-qa
spec:
  gateways:
  - pep-pfna-pcaf-qa/pep-pfna-pcaf-qa-cv-gw
  hosts:
  - pep-pcaf-eiv-inventory-reporting-qa.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
