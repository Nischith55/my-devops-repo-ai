apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-pfna-pgt-user-privileges-wqam-vs
  namespace: pep-pfna-pgt-dev
  labels:
      app: pep-pfna-pgt-user-privileges
spec:
  hosts:
  - pep-pfna-pgt-user-privileges.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  gateways:
  - pep-pfna-pgt-dev/pep-pfna-pgt-dev-cv-gw
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-pfna-pgt-user-privileges.pep-pfna-pgt-dev.svc.cluster.local
        port:
          number: 80
  