apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: istio-in-gateway-01
  namespace: istio-system
spec:
  selector:
    istio: pep-pfna-ingress-gw01
  servers:
  - hosts:
    - "*.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com"
    name: istio-in-gateway-01-selective-https-443
    port:
      name: https-sltv-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-pfna-nonprod-eus-hhnxt-global-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - "*.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com"
    # - cle-rest-api.pfna.dev.intra.pepsico.com
    - growthbook-pfna.dev.mypepsico.com
    name: istio-in-gateway-01-selective-http-80
    port:
      name: http-sltv-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true
  # - hosts:
  #   - cle-rest-api.pfna.dev.intra.pepsico.com
  #   name: istio-in-gateway-01-cle-rest-api-https-443
  #   port:
  #     name: https-cle-rest-api-443
  #     number: 443
  #     protocol: https
  #   tls:
  #     cipherSuites:
  #     - AES128-GCM-SHA256
  #     - AES256-GCM-SHA384
  #     - ECDHE-ECDSA-AES128-SHA
  #     - ECDHE-ECDSA-AES256-SHA
  #     - ECDHE-ECDSA-AES128-GCM-SHA256
  #     - ECDHE-ECDSA-AES256-GCM-SHA384
  #     - ECDHE-RSA-AES128-GCM-SHA256
  #     - ECDHE-RSA-AES256-GCM-SHA384
  #     credentialName: pep-eiap-nonprod-eus-hhnxt-cle-rest-api-gw01-tls-1
  #     maxProtocolVersion: TLSV1_3
  #     minProtocolVersion: TLSV1_2
  #     mode: SIMPLE
  - hosts:
    - growthbook-pfna.dev.mypepsico.com
    name: istio-in-gateway-growthbook-https-443
    port:
      name: https-growthbook-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-pfna-nonprod-eus-global-01-growthbook-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
