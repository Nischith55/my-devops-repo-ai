apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-pfna-hhnx-employee-webapp
  name: pep-pfna-hhnx-employee-webapp-vs
  namespace: pep-pfna-hhnext-dev
spec:
  gateways:
  - pep-pfna-hhnext-dev/pep-pfna-hhnext-dev-cv-gw
  hosts:
  - pep-pfna-hhnx-employee-webapp.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /api/v1/employees
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-pfna-hhnx-employee-webapp.pep-pfna-hhnext-dev.svc.cluster.local
        port:
          number: 80
