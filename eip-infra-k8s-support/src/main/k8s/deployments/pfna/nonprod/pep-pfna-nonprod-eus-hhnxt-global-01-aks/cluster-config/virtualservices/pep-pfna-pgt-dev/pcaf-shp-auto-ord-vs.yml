apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pcaf-shp-auto-ord
  name: pcaf-shp-auto-ord-vs
  namespace: pep-pfna-pgt-dev
spec:
  gateways:
  - pep-pfna-pgt-dev/pep-pfna-pgt-dev-cv-gw
  hosts:
  - pcaf-shp-auto-ord.genp.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pcaf-shp-auto-ord.pep-pfna-pgt-dev.svc.cluster.local
        port:
          number: 8080
