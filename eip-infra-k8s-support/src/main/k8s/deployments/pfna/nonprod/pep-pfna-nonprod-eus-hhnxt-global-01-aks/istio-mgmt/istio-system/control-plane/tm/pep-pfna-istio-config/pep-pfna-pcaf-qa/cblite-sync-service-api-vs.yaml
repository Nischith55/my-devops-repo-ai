apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: cblite-sync-service-api-qa-vs
  namespace: pep-pfna-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - cblite-sync-service-api-qa.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /api/v1
    route:
    - destination:
        host: cblite-sync-service-api.pep-pfna-pcaf-qa.svc.cluster.local
        port:
          number: 80
