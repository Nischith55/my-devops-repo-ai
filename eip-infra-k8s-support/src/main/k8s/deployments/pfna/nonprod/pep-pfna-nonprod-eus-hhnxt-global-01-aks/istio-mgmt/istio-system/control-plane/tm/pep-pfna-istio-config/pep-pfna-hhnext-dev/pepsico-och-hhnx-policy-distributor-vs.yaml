apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pepsico-och-hhnx-policy-distributor-vs
  namespace: pep-pfna-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pepsico-och-hhnx-policy-distributor.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pepsico-och-hhnx-policy-distributor.pep-pfna-hhnext-dev.svc.cluster.local
        port:
          number: 80