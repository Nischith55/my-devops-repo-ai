apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pcaf-sr-admin-service
  name: pcaf-sr-admin-service-qa-vs
  namespace: pep-pfna-pcaf-qa
spec:
  gateways:
  - pep-pfna-pcaf-qa/pep-pfna-pcaf-qa-cv-gw
  hosts:
  - pcaf-sr-admin-service-qa.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /sr-admin-api
    route:
    - destination:
        host: pcaf-sr-admin-service.pep-pfna-pcaf-qa.svc.cluster.local
        port:
          number: 80
