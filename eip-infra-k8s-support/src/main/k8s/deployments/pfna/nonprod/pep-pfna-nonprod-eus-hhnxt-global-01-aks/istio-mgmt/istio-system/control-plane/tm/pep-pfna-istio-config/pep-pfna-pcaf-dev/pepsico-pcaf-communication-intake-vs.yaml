apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pepsico-pcaf-communication-intake-vs
  namespace: pep-pfna-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pepsico-pcaf-communication-intake.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /api/v1
    route:
    - destination:
        host: pepsico-pcaf-communication-intake.pep-pfna-pcaf-dev.svc.cluster.local
        port:
          number: 80
