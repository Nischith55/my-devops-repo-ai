apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-pcaf-pogon-backend-scheduler-ktxz-vs
  namespace: pep-pfna-pfna-pogon-dev
  labels:
      app: pep-pcaf-pogon-backend-scheduler
spec:
  hosts:
  - pep-pcaf-pogon-backend-scheduler-dev.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  gateways:
  - pep-pfna-pfna-pogon-dev/pep-pfna-pfna-pogon-dev-cv-gw
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-pcaf-pogon-backend-scheduler.pep-pfna-pfna-pogon-dev.svc.cluster.local
        port:
          number: 80
    corsPolicy:
      allowOrigins:
      - exact: https://d2.pfnaweb.mypepsico.com
      allowMethods:
      - GET
      - PUT
      - POST
      - DELETE
      - OPTIONS
  
      allowCredentials: true
      allowHeaders:
      - Access-Control-Allow-Headers
      - Access-Control-Allow-Methods
       
  