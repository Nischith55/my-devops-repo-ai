apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-pfna-hhnx-uow-processor-vs
  namespace: pep-pfna-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-pfna-hhnx-uow-processor.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:   
    - ignoreUriCase: true
      uri:
        prefix: /uowreplay  
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-pfna-hhnx-uow-processor.pep-pfna-hhnext-dev.svc.cluster.local
        port:
          number: 80