apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-pcaf-python-services-salesforce
  name: pep-pcaf-python-services-salesforce-vs
  namespace: pep-pfna-pcaf-dev
spec:
  gateways:
  - pep-pfna-pcaf-dev/pep-pfna-pcaf-dev-cv-gw
  hosts:
  - pep-pcaf-python-services-salesforce.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /sf/SalesForce-health
    - ignoreUriCase: true
      uri:
        prefix: /sf
    route:
    - destination:
        host: pep-pcaf-python-services-salesforce.pep-pfna-pcaf-dev.svc.cluster.local
        port:
          number: 8080
