apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-pcaf-api-contentservice-dsld
  name: pep-pcaf-api-contentservice-dsld-vs
  namespace: pep-pfna-flna-gtmdstwo-dev
spec:
  gateways:
  - pep-pfna-flna-gtmdstwo-dev/pep-pfna-flna-gtmdstwo-dev-cv-gw
  hosts:
  - pep-pcaf-api-contentservice-dsld.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /api/v1/dsld/sfod/customersearch
    route:
    - destination:
        host: pep-pcaf-api-contentservice-dsld.pep-pfna-flna-gtmdstwo-dev.svc.cluster.local
        port:
          number: 80
