apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pcaf-webappcontroller-v2-qa-vs
  namespace: pep-pfna-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pcaf-webappcontroller-qa-genp.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pcaf-webappcontroller.pep-pfna-pgt-qa.svc.cluster.local
        port:
          number: 80
    corsPolicy:
      allowOrigins:
      - exact: https://apim-pfna.qa.mypepsico.com
      allowMethods:
      - POST
      - GET
      - PUT
      - DELETE
      - OPTIONS
      - PATCH
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Content-Type
      - Link
      - x-source
      - Access-Control-Allow-Origin  
      exposeHeaders:
      - x-total-count
      - x-source
