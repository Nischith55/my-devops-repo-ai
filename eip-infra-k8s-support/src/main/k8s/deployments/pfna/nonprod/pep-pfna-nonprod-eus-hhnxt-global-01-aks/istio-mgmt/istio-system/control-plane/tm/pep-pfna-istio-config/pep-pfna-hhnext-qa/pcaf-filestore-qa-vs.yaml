apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pcaf-filestore-qa-vs
  namespace: pep-pfna-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pcaf-filestore-qa.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pcaf-filestore.pep-pfna-hhnext-qa.svc.cluster.local
        port:
          number: 80    
    corsPolicy:
      allowOrigins:      
      - exact: https://d2.pfnaweb.mypepsico.com
      - exact: https://q2.pfnaweb.mypepsico.com
      - exact: https://t1.uap.pepenv.com
      - exact: https://d1.uap.pepenv.com
      - exact: https://api-na.qa.mypepsico.com
      - exact: https://q1.pfnaweb.mypepsico.com
      - exact: https://d1.pfnaweb.mypepsico.com 
      allowMethods:
      - POST
      - GET
      - PUT
      - DELETE
      - OPTIONS
      - PATCH
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Link
      - Content-Type
      - x-source
      - Access-Control-Allow-Origin
      - Access-Control-Allow-Headers
      - Access-Control-Allow-Credentials
      exposeHeaders:
      - x-total-count 
      - x-source 
     