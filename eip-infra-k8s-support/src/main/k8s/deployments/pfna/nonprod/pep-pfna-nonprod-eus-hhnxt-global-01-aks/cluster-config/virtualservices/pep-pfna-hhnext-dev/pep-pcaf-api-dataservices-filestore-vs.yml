apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-pcaf-api-dataservices-filestore
  name: pep-pcaf-api-dataservices-filestore-vs
  namespace: pep-pfna-hhnext-dev
spec:
  gateways:
  - pep-pfna-hhnext-dev/pep-pfna-hhnext-dev-cv-gw
  hosts:
  - pep-pcaf-api-dataservices-filestore.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-pcaf-api-dataservices-filestore.pep-pfna-hhnext-dev.svc.cluster.local
        subset: v1
      weight: 50
    - destination:
        host: pep-pcaf-api-dataservices-filestore.pep-pfna-hhnext-dev.svc.cluster.local
        subset: v2
      weight: 50
