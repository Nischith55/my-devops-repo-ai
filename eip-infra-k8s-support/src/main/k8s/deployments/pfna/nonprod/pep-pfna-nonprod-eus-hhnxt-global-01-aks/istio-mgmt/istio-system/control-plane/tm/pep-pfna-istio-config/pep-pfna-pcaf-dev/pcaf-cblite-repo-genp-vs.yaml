apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pcaf-cblite-repo-genp-vs
  namespace: pep-pfna-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pcaf-cblite-repo-genp.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
