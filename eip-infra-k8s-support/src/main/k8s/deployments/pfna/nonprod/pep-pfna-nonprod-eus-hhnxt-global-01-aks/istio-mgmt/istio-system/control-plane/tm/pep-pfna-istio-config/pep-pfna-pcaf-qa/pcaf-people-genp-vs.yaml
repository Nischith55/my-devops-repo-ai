apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pcaf-people-genp-qa-vs
  namespace: pep-pfna-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pcaf-people-genp-qa.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pcaf-people-genp.pep-pfna-pcaf-qa.svc.cluster.local
        port: 
          number: 80 
    corsPolicy:   
      allowOrigins:
      - exact: https://d1.uap.pepenv.com/
      - exact: https://t1.uap.pepenv.com/
      - exact: https://d1.pfnaweb.mypepsico.com/
      - exact: https://q1.pfnaweb.mypepsico.com/
      - exact: http://localhost:3000/
      - exact: https://api-na.qa.mypepsico.com/flna/pgt/pcaf/v1/people
      allowMethods:
      - POST
      - GET
      - PUT
      - DELETE
      - OPTIONS
      - PATCH
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Link
      - Content-Type
      - Access-Control-Allow-Origin
      - Access-Control-Allow-Headers
      exposeHeaders:
      - x-total-count
      - x-source