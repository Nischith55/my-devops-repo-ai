apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-warehouse-deployment
  name: pep-warehouse-deployment-qa-vs
  namespace: pep-pfna-flna-gtmothr-qa
spec:
  gateways:
  - pep-pfna-flna-gtmothr-qa/pep-pfna-flna-gtmothr-qa-cv-gw
  hosts:
  - pep-warehouse-deployment-qa.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /api/v1/warehouse/deployment
    route:
    - destination:
        host: pep-warehouse-deployment.pep-pfna-flna-gtmothr-qa.svc.cluster.local
        port:
          number: 80
