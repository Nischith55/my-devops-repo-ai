apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-pfna-pcaf-och-dsdconversionservice-qa-vs
  namespace: pep-pfna-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-pfna-pcaf-och-dsdconversionservice-qa.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-pfna-pcaf-och-dsdconversionservice.pep-pfna-pcaf-qa.svc.cluster.local
        port:
          number: 80
    corsPolicy:
      allowOrigins:    
      - exact: https://q1.pfnaweb.mypepsico.com
      allowMethods:
      - POST
      - GET
      - PUT
      - DELETE
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Link
      - Content-Type
      exposeHeaders:
      - x-total-count