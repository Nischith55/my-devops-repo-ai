  namespace: pep-pfna-pcaf-dev
  labels:
      app: locinsights-synergy-connect-webapp
spec:
  hosts:
  - locinsights-synergy-connect-webapp.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  gateways:
  - pep-pfna-pcaf-dev/pep-pfna-pcaf-dev-cv-gw
  http:
