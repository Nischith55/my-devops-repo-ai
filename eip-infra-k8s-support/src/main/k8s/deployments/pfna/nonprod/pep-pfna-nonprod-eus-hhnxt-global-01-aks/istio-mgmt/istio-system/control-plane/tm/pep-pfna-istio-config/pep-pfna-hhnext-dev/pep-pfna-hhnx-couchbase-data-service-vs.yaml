apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-pfna-hhnx-couchbase-data-service-vs
  namespace: pep-pfna-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-pfna-hhnx-couchbase-data-service.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /api/source
    - ignoreUriCase: true
      uri:
        prefix: /api/target
    - ignoreUriCase: true
      uri:
        prefix: /api/transaction
    - ignoreUriCase: true
      uri:
        prefix: /api/webapp
    - ignoreUriCase: true
      uri:
        prefix: /
    headers:
      request:
        remove:
          - "Content-Type"
        add:
          Content-Type: "application/json"
    route:
    - destination:
        host: pep-pfna-hhnx-couchbase-data-service.pep-pfna-hhnext-dev.svc.cluster.local
        port:
          number: 80