apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-pfna-nginx
  name: pep-nginx-vs
  namespace: pep-pfna-global-infra-dev
spec:
  gateways:
  - pep-pfna-global-infra-dev/pep-pfna-global-infra-dev-cv-gw
  hosts:
  - pep-nginx.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-pfna-nginx.pep-pfna-global-infra-dev.svc.cluster.local
        port:
          number: 8080
