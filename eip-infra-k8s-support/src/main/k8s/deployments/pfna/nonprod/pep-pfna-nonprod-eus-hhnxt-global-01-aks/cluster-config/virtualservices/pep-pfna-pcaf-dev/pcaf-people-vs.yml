apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pcaf-people
  name: pcaf-people-vs
  namespace: pep-pfna-pcaf-dev
spec:
  gateways:
  - pep-pfna-pcaf-dev/pep-pfna-pcaf-dev-cv-gw
  hosts:
  - pcaf-people.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - corsPolicy:
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Link
      - Content-Type
      - x-source
      - Access-Control-Allow-Origin
      allowMethods:
      - GET
      allowOrigins:
      - exact: https://d1.uap.pepenv.com/
      - exact: https://t1.uap.pepenv.com/
      - exact: https://d1.pfnaweb.mypepsico.com/
      - exact: https://q1.pfnaweb.mypepsico.com/
      exposeHeaders:
      - x-total-count
    match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pcaf-people.pep-pfna-pcaf-dev.svc.cluster.local
        port:
          number: 80
