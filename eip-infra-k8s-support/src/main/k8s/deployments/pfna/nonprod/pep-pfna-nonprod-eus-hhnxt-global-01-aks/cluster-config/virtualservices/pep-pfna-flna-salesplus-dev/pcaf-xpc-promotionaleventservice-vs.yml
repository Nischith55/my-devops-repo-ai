apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pcaf-xpc-promotionaleventservice
  name: pcaf-xpc-promotionaleventservice-vs
  namespace: pep-pfna-flna-salesplus-dev
spec:
  gateways:
  - pep-pfna-flna-salesplus-dev/pep-pfna-flna-salesplus-dev-cv-gw
  hosts:
  - pcaf-xpc-promotionaleventservice.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pcaf-xpc-promotionaleventservice.pep-pfna-flna-salesplus-dev.svc.cluster.local
        port:
          number: 80
    corsPolicy:   
      allowOrigins:
      - exact: https://q2.pfnaweb.mypepsico.com
      - exact: https://d2.pfnaweb.mypepsico.com
      - exact: https://pp1.pfnaweb.mypepsico.com
      allowMethods:
      - POST
      - GET
      - PUT
      - DELETE
      - OPTIONS
      - PATCH
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Link
      - Content-Type
      - Access-Control-Allow-Origin
      - Access-Control-Allow-Headers
      exposeHeaders:
      - x-total-count
      - x-source  
