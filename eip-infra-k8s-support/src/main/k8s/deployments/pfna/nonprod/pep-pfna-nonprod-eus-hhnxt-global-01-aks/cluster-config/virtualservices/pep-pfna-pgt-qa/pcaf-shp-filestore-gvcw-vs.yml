apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pcaf-shp-filestore-gvcw-vs
  namespace: pep-pfna-pgt-qa
  labels:
      app: pcaf-shp-filestore
spec:
  hosts:
  - pcaf-shp-filestore-qa.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  gateways:
  - pep-pfna-pgt-qa/pep-pfna-pgt-qa-cv-gw
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pcaf-shp-filestore.pep-pfna-pgt-qa.svc.cluster.local
        port:
          number: 80
    corsPolicy:
      allowOrigins:
      - exact: https://d2.pfnaweb.mypepsico.com
      - exact: https://q2.pfnaweb.mypepsico.com
      - exact: https://t1.uap.pepenv.com
      - exact: https://d1.uap.pepenv.com
      - exact: https://q1.pfnaweb.mypepsico.com
      - exact: https://d1.pfnaweb.mypepsico.com
      - exact: https://apim-pfna.qa.mypepsico.com
      - exact: https://apim-na.qa.mypepsico.com
      allowMethods:
      - GET
      - PUT
      - POST
      - DELETE
      - OPTIONS
  
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Link
      - Content-Type
      - Access-Control-Allow-Origin
      - Access-Control-Allow-Headers
      - Access-Control-Allow-Credentials
      - Access-Control-Expose-Headers
       
  