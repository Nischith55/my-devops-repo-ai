apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-pfna-hhnx-sf-geotab-consumer-qa-vs
  namespace: pep-pfna-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-pfna-hhnx-sf-geotab-consumer-qa.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    headers:
      request:
        remove:
          - "Content-Type"
        add:
          Content-Type: "application/xml"
    route:
    - destination:
        host: pep-pfna-hhnx-sf-geotab-consumer.pep-pfna-hhnext-qa.svc.cluster.local
        port:
          number: 80
