apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-pcaf-api-geographyservice-gro-pog
  name: pep-pcaf-api-geographyservice-gro-pog-two-vs
  namespace: pep-pfna-flna-gtmgrotwo-dev
spec:
  gateways:
  - pep-pfna-flna-gtmgrotwo-dev/pep-pfna-flna-gtmgrotwo-dev-cv-gw
  hosts:
  - pep-pcaf-api-geographyservice-gro-pog-two.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /api/v1/pog/gro/geography
    route:
    - destination:
        host: pep-pcaf-api-geographyservice-gro-pog.pep-pfna-flna-gtmgrotwo-dev.svc.cluster.local
        port:
          number: 80
