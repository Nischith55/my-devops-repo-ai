apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pepsico-cit-pcaf-python-people-api-v1-vs
  namespace: pep-pfna-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pepsico-cit-pcaf-python-people-api-v1.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pepsico-cit-pcaf-python-people-api-v1.pep-pfna-pcaf-dev.svc.cluster.local
        port: 
          number: 8080