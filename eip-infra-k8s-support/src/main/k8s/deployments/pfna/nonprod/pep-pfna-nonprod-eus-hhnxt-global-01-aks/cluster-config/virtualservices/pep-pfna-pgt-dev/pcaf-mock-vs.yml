apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pcaf-mock
  name: pcaf-mock-vs
  namespace: pep-pfna-pgt-dev
spec:
  gateways:
  - pep-pfna-pgt-dev/pep-pfna-pgt-dev-cv-gw
  hosts:
  - pcaf-mock-genp.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pcaf-mock.pep-pfna-pgt-dev.svc.cluster.local
        port:
          number: 80