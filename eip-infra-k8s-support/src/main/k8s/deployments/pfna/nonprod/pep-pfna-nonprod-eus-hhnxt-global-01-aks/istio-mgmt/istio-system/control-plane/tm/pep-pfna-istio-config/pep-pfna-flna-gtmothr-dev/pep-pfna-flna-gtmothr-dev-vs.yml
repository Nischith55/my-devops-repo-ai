apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-pfna-flna-gtmothr-dev-vs
  namespace: pep-pfna-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-pfna-flna-gtmothr-dev.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /api/v1/ctr/tracking/
    route:
    - destination:
        host: pep-pcaf-api-cartontrackingservice-ctr.pep-pfna-flna-gtmothr-dev.svc.cluster.local
        port:
          number: 80
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /api/v1/icm/
    route:
    - destination:
        host: pep-pcaf-api-userservices-icm.pep-pfna-flna-gtmothr-dev.svc.cluster.local
        port:
          number: 80        