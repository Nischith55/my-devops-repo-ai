apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-pfna-pcaf-user-privileges-vs
  namespace: pep-pfna-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-pfna-pcaf-user-privileges.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-pfna-pcaf-user-privileges.pep-pfna-pcaf-dev.svc.cluster.local
        port:
          number: 80
    corsPolicy:
      allowOrigins:
      - exact: https://api-na.dev.mypepsico.com
      - exact: https://t1.uap.pepenv.com
      - exact: https://d1.uap.pepenv.com
      - exact: https://q1.pfnaweb.mypepsico.com
      - exact: https://q2.pfnaweb.mypepsico.com
      - exact: https://d1.pfnaweb.mypepsico.com
      - exact: https://d2.pfnaweb.mypepsico.com 
      - exact: http://localhost:3002
      allowMethods:
      - POST
      - GET
      - PUT
      - DELETE
      - OPTIONS
      - PATCH
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Access-Control-Allow-Origin
      - Access-Control-Allow-Headers
      - Link
      - content-type
      exposeHeaders:
      - x-total-count   

