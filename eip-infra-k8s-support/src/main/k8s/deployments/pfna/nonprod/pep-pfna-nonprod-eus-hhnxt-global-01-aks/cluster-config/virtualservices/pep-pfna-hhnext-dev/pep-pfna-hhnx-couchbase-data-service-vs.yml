apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-pfna-hhnx-couchbase-data-service
  name: pep-pfna-hhnx-couchbase-data-service-vs
  namespace: pep-pfna-hhnext-dev
spec:
  gateways:
  - pep-pfna-hhnext-dev/pep-pfna-hhnext-dev-cv-gw
  hosts:
  - pep-pfna-hhnx-couchbase-data-service.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - headers:
      request:
        add:
          Content-Type: application/json
        remove:
        - Content-Type
    match:
    - ignoreUriCase: true
      uri:
        prefix: /api/source
    - ignoreUriCase: true
      uri:
        prefix: /api/target
    - ignoreUriCase: true
      uri:
        prefix: /api/transaction
    - ignoreUriCase: true
      uri:
        prefix: /api/webapp
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-pfna-hhnx-couchbase-data-service.pep-pfna-hhnext-dev.svc.cluster.local
        port:
          number: 80
