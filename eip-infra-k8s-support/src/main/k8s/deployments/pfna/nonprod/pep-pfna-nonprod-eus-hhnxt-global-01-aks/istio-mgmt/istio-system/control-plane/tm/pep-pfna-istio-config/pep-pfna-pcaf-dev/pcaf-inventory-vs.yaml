apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pcaf-inventory-vs
  namespace: pep-pfna-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pcaf-inventory.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pcaf-inventory.pep-pfna-pcaf-dev.svc.cluster.local
        port:
          number: 80
    corsPolicy:   
      allowOrigins:
      - exact: https://t1.uap.pepenv.com
      - exact: http://localhost:3001
      - exact: https://d1.uap.pepenv.com 
      allowMethods:
      - POST
      - GET
      - PUT
      - DELETE
      - OPTIONS
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Link
      - Content-Type
      - Access-Control-Allow-Origin
      - Access-Control-Allow-Headers
      exposeHeaders:
      - x-total-count
