apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pcaf-shp-ec-consumer-kmyq-vs
  namespace: pep-pfna-pcaf-dev
  labels:
      app: pcaf-shp-ec-consumer
spec:
  hosts:
  - pcaf-shp-ec-consumer.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  gateways:
  - pep-pfna-pcaf-dev/pep-pfna-pcaf-dev-cv-gw
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pcaf-shp-ec-consumer.pep-pfna-pcaf-dev.svc.cluster.local
        port:
          number: 8080
  