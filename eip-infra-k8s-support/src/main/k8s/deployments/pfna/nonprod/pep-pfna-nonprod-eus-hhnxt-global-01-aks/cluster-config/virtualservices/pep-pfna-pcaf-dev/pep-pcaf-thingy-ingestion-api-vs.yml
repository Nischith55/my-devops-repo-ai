apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-pcaf-thingy-ingestion-api
  name: pep-pcaf-thingy-ingestion-api-vs
  namespace: pep-pfna-pcaf-dev
spec:
  gateways:
  - pep-pfna-pcaf-dev/pep-pfna-pcaf-dev-cv-gw
  hosts:
  - pep-pcaf-thingy-ingestion-api.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /ti
    route:
    - destination:
        host: pep-pcaf-thingy-ingestion-api.pep-pfna-pcaf-dev.svc.cluster.local
        port:
          number: 8080
