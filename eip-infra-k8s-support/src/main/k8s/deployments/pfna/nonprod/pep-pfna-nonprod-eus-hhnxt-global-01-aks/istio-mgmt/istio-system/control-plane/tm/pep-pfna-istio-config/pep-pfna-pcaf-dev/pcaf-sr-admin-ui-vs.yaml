apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pcaf-sr-admin-ui-vs
  namespace: pep-pfna-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pcaf-sr-admin-ui.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pcaf-sr-admin-ui.pep-pfna-pcaf-dev.svc.cluster.local
        port: 
          number: 80 