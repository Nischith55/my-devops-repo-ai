apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pcaf-people-vs
  namespace: pep-pfna-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pcaf-people.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pcaf-people.pep-pfna-pcaf-dev.svc.cluster.local
        port: 
          number: 80
    corsPolicy:
      allowOrigins:      
      - exact: https://d1.uap.pepenv.com/
      - exact: https://t1.uap.pepenv.com/
      - exact: https://d1.pfnaweb.mypepsico.com/
      - exact: https://q1.pfnaweb.mypepsico.com/
      allowMethods:
      - GET
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Link
      - Content-Type
      - x-source
      - Access-Control-Allow-Origin
      exposeHeaders:
      - x-total-count