apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pepsico-pgt-och-hhnx-transactional-processor
  name: pep-pgt-och-hhnx-transactional-processor-vs
  namespace: pep-pfna-pgt-dev
spec:
  gateways:
  - pep-pfna-pgt-dev/pep-pfna-pgt-dev-cv-gw
  hosts:
  - pep-pgt-och-hhnx-transactional-processor.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /api/v1
    route:
    - destination:
        host: pepsico-pgt-och-hhnx-transactional-processor.pep-pfna-pgt-dev.svc.cluster.local
        port:
          number: 80
