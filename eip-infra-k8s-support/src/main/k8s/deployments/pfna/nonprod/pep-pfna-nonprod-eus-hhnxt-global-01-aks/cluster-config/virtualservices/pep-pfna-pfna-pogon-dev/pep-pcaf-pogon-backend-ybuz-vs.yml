apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-pcaf-pogon-backend-ybuz-vs
  namespace: pep-pfna-pfna-pogon-dev
  labels:
      app: pep-pcaf-pogon-backend
spec:
  hosts:
  - pep-pcaf-pogon-backend.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  gateways:
  - pep-pfna-pfna-pogon-dev/pep-pfna-pfna-pogon-dev-cv-gw
  http:
  - corsPolicy:
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Link
      - Content-Type
      - Access-Control-Allow-Origin
      - Access-Control-Allow-Headers
      allowMethods:
      - POST
      - GET
      - PUT
      - DELETE
      - OPTIONS
      - PATCH
      allowOrigins:
      - exact: https://q2.pfnaweb.mypepsico.com
      - exact: https://d2.pfnaweb.mypepsico.com
      - exact: https://pp1.pfnaweb.mypepsico.com
      exposeHeaders:
      - x-total-count
      - x-source
    match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-pcaf-pogon-backend.pep-pfna-pfna-pogon-dev.svc.cluster.local
        port:
          number: 80