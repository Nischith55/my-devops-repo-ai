apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-warehouse-ops
  name: pep-warehouse-ops-vs
  namespace: pep-pfna-flna-gtmothrtwo-dev
spec:
  gateways:
  - pep-pfna-flna-gtmothrtwo-dev/pep-pfna-flna-gtmothrtwo-dev-cv-gw
  hosts:
  - pep-warehouse-ops.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /api/v1/warehouse/ops
    route:
    - destination:
        host: pep-warehouse-ops.pep-pfna-flna-gtmothrtwo-dev.svc.cluster.local
        port:
          number: 80
