apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pcaf-sr-admin-service
  name: pcaf-sr-admin-service-vs
  namespace: pep-pfna-pcaf-dev
spec:
  gateways:
  - pep-pfna-pcaf-dev/pep-pfna-pcaf-dev-cv-gw
  hosts:
  - pcaf-sr-admin-service.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - corsPolicy:
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Link
      - Content-Type
      - Access-Control-Allow-Origin
      - Access-Control-Allow-Headers
      allowMethods:
      - POST
      - GET
      - PUT
      - DELETE
      - OPTIONS
      - PATCH
      allowOrigins:
      - exact: https://api-na.dev.mypepsico.com
      - exact: https://d2.pfnaweb.mypepsico.com
      - exact: http://localhost:9032
      - exact: http://localhost:3001
      - exact: https://d1.uap.pepenv.com
      - exact: https://t1.uap.pepenv.com
      - exact: https://q2.pfnaweb.mypepsico.com
      exposeHeaders:
      - x-total-count
      - x-source
    match:
    - ignoreUriCase: true
      uri:
        prefix: /sr-admin-api
    route:
    - destination:
        host: pcaf-sr-admin-service.pep-pfna-pcaf-dev.svc.cluster.local
        port:
          number: 80
