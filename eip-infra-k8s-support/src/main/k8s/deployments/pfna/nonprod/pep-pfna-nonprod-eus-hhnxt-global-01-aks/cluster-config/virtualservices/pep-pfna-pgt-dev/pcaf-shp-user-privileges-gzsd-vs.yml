apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pcaf-shp-user-privileges-gzsd-vs
  namespace: pep-pfna-pgt-dev
  labels:
      app: pcaf-shp-user-privileges
spec:
  hosts:
  - pcaf-shp-user-privileges.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  gateways:
  - pep-pfna-pgt-dev/pep-pfna-pgt-dev-cv-gw
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pcaf-shp-user-privileges.pep-pfna-pgt-dev.svc.cluster.local
        port:
          number: 80
    corsPolicy:
      allowOrigins:
      - exact: https://t1.uap.pepenv.com
      - exact: https://d1.uap.pepenv.com
      - exact: https://q1.pfnaweb.mypepsico.com
      - exact: https://q2.pfnaweb.mypepsico.com
      - exact: https://d1.pfnaweb.mypepsico.com
      - exact: https://d2.pfnaweb.mypepsico.com
      - exact: https://apim-na.dev.mypepsico.com
      allowMethods:
      - GET
      - PUT
      - POST
      - DELETE
      - OPTIONS
  
      allowCredentials: true
      allowHeaders:
      - Access-Control-Allow-Origin
      - Access-Control-Allow-Headers
      - Link
      - Content-Type
      - Authorization
      - Access-Control-Allow-Credentials
      exposeHeaders:
      - Authorization
      - Link
       
  