apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pcaf-pml-repo-qa-vs
  namespace: pep-pfna-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pcaf-pml-repo-qa.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pcaf-pml-repo.pep-pfna-pcaf-qa.svc.cluster.local
        port: 
          number: 80
    corsPolicy:
      allowOrigins:
      - exact: https://t1.uap.pepenv.com
      - exact: https://api-na.qa.mypepsico.com
      - exact: http://localhost:3001
      allowMethods:
      - POST
      - GET
      - PUT
      - DELETE
      - OPTIONS
      - PATCH
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Content-Type
      - Link
      - Access-Control-Allow-Origin  
      - Access-Control-Allow-Headers
      exposeHeaders:
      - x-total-count
      - x-source   
      - Page-Number
      - Page-Size
      - Total-Pages
      - Total-Elements
      - Content-Disposition
          