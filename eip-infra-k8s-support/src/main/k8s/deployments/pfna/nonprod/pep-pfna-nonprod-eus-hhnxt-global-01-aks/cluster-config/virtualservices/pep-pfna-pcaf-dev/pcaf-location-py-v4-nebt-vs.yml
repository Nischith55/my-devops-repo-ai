apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pcaf-location-py-v4-nebt-vs
  namespace: pep-pfna-pcaf-dev
  labels:
      app: pcaf-location-py-v4
spec:
  hosts:
  - pcaf-location-py-v4.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  gateways:
  - pep-pfna-pcaf-dev/pep-pfna-pcaf-dev-cv-gw
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pcaf-location-py-v4.pep-pfna-pcaf-dev.svc.cluster.local
        port:
          number: 8080
  