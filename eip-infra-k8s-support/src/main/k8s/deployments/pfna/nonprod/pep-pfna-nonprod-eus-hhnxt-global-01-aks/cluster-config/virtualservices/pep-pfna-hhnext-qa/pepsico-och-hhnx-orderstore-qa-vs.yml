apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pepsico-och-hhnx-orderstore
  name: pepsico-och-hhnx-orderstore-qa-vs
  namespace: pep-pfna-hhnext-qa
spec:
  gateways:
  - pep-pfna-hhnext-qa/pep-pfna-hhnext-qa-cv-gw
  hosts:
  - pepsico-och-hhnx-orderstore-qa.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pepsico-och-hhnx-orderstore.pep-pfna-hhnext-qa.svc.cluster.local
        port:
          number: 80
