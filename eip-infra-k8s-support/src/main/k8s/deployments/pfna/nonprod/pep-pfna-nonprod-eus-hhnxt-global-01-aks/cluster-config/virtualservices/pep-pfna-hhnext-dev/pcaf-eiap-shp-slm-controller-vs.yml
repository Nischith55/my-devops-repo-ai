apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pcaf-eiap-shp-slm-controller
  name: pcaf-eiap-shp-slm-controller-vs
  namespace: pep-pfna-hhnext-dev
spec:
  gateways:
  - pep-pfna-hhnext-dev/pep-pfna-hhnext-dev-cv-gw
  hosts:
  - pcaf-eiap-shp-slm-controller.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - corsPolicy:
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Link
      - Content-Type
      - Access-Control-Allow-Origin
      - Access-Control-Allow-Headers
      allowMethods:
      - POST
      - GET
      - PUT
      - DELETE
      - OPTIONS
      - PATCH
      allowOrigins:
      - exact: https://d1.uap.pepenv.com
      - exact: https://t1.uap.pepenv.com
      exposeHeaders:
      - x-total-count
      - x-source
    match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pcaf-eiap-shp-slm-controller.pep-pfna-hhnext-dev.svc.cluster.local
        port:
          number: 80
