apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-pcaf-api-userservices-icm
  name: pep-pcaf-api-userservices-icm-two-vs
  namespace: pep-pfna-flna-gtmothrtwo-dev
spec:
  gateways:
  - pep-pfna-flna-gtmothrtwo-dev/pep-pfna-flna-gtmothrtwo-dev-cv-gw
  hosts:
  - pep-pcaf-api-userservices-icm-two.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /api/v1/icm/
    route:
    - destination:
        host: pep-pcaf-api-userservices-icm.pep-pfna-flna-gtmothrtwo-dev.svc.cluster.local
        port:
          number: 80
