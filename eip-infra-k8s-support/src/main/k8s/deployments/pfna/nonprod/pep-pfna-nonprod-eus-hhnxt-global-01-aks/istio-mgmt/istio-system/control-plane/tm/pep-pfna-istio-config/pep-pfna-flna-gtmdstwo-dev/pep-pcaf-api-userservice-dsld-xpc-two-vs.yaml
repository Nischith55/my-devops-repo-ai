apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-pcaf-api-userservice-dsld-xpc-two-vs
  namespace: pep-pfna-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-pcaf-api-userservice-dsld-xpc-two.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /api/v1/dsld/xpc/user
    route:
    - destination:
        host: pep-pcaf-api-userservice-dsld-xpc.pep-pfna-flna-gtmdstwo-dev.svc.cluster.local
        port:
          number: 80