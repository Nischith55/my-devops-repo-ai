apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: snacks-smart-search-events-server-vs
  namespace: pep-pfna-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - snacks-smart-search-events-server.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /events
    route:
    - destination:
        host: snacks-smart-search-events-server.pep-pfna-pcaf-dev.svc.cluster.local
        port:
          number: 80
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /webhooks
    route:
    - destination:
        host: snacks-smart-search-events-server.pep-pfna-pcaf-dev.svc.cluster.local
        port:
          number: 8083