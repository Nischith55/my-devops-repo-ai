apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pcaf-recipecontroller
  name: pcaf-recipecontroller-v2-qa-vs
  namespace: pep-pfna-pgt-qa
spec:
  gateways:
  - pep-pfna-pgt-qa/pep-pfna-pgt-qa-cv-gw
  hosts:
  - pcaf-recipecontroller-qa-genp.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pcaf-recipecontroller.pep-pfna-pgt-qa.svc.cluster.local
        port:
          number: 80
