apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pcaf-pgt-filestore-ncsf-vs
  namespace: pep-pfna-pgt-dev
  labels:
      app: pcaf-pgt-filestore
spec:
  hosts:
  - pcaf-pgt-filestore-dev.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  gateways:
  - pep-pfna-pgt-dev/pep-pfna-pgt-dev-cv-gw
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pcaf-pgt-filestore.pep-pfna-pgt-dev.svc.cluster.local
        port:
          number: 80
  