apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-pfna-api-audit-service
  name: pep-pfna-api-audit-service-qa-vs
  namespace: pep-pfna-pcaf-qa
spec:
  gateways:
  - pep-pfna-pcaf-qa/pep-pfna-pcaf-qa-cv-gw
  hosts:
  - pep-pfna-api-audit-service-qa.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /api/v1
    route:
    - destination:
        host: pep-pfna-api-audit-service.pep-pfna-pcaf-qa.svc.cluster.local
        port:
          number: 80
