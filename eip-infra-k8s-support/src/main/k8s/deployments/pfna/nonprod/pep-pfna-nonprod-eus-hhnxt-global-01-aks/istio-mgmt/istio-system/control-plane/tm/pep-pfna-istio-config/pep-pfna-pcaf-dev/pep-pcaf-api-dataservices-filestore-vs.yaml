apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: pep-pcaf-api-dataservices-filestore-vs
  namespace: pep-pfna-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-pcaf-api-dataservices-filestore.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
  - route:
    - destination:
        host: pep-pcaf-api-dataservices-filestore.pep-pfna-pcaf-dev.svc.cluster.local
        subset: v1
      weight: 0
    - destination:
        host: pep-pcaf-api-dataservices-filestore.pep-pfna-pcaf-dev.svc.cluster.local
        subset: v2
      weight: 100