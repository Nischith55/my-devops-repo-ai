apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pepsico-och-pcaf-orderstore
  name: pepsico-och-pcaf-orderstore-qa-vs
  namespace: pep-pfna-pcaf-qa
spec:
  gateways:
  - pep-pfna-pcaf-qa/pep-pfna-pcaf-qa-cv-gw
  hosts:
  - pepsico-och-pcaf-orderstore-qa.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - corsPolicy:
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Link
      - Content-Type
      - Access-Control-Allow-Origin
      - Access-Control-Allow-Headers
      allowMethods:
      - POST
      - GET
      - PUT
      - DELETE
      - OPTIONS
      allowOrigins:
      - exact: https://q1.pfnaweb.mypepsico.com
      - exact: https://q2.pfnaweb.mypepsico.com
      exposeHeaders:
      - x-total-count
    match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pepsico-och-pcaf-orderstore.pep-pfna-pcaf-qa.svc.cluster.local
        port:
          number: 80
