apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pcaf-shp-slm-controller
  name: pcaf-shp-slm-controller-v2-qa-vs
  namespace: pep-pfna-pgt-qa
spec:
  gateways:
  - pep-pfna-pgt-qa/pep-pfna-pgt-qa-cv-gw
  hosts:
  - pcaf-shp-slm-controller-qa-genp.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - corsPolicy:
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Content-Type
      - Link
      - x-source
      - Access-Control-Allow-Origin
      allowMethods:
      - POST
      - GET
      - PUT
      - DELETE
      - OPTIONS
      - PATCH
      allowOrigins:
      - exact: https://apim-pfna.qa.mypepsico.com
      exposeHeaders:
      - x-total-count
      - x-source
    match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pcaf-shp-slm-controller.pep-pfna-pgt-qa.svc.cluster.local
        port:
          number: 80
