apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pcaf-eiap-cblite-repo-qa-vs
  namespace: pep-pfna-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pcaf-eiap-cblite-repo-qa.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pcaf-eiap-cblite-repo.pep-pfna-pcaf-qa.svc.cluster.local
        port: 
          number: 80 
    corsPolicy:   
      allowOrigins:
      - exact: https://t1.uap.pepenv.com
      - exact: https://api-na.qa.mypepsico.com/flna/pcaf/aks/v2/cbliterepo/
      allowMethods:
      - POST
      - GET
      - PUT
      - DELETE
      - OPTIONS
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Link
      - Content-Type
      - requestId
      - docCategory
      - gpid
      - Access-Control-Allow-Origin
      - Access-Control-Allow-Headers
      exposeHeaders:
      - x-total-count      