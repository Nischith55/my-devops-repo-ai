apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: snacks-contextual-search
  name: snacks-contextual-search-vs
  namespace: pep-pfna-pcaf-dev
spec:
  gateways:
  - pep-pfna-pcaf-dev/pep-pfna-pcaf-dev-cv-gw
  hosts:
  - snacks-contextual-search.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: snacks-contextual-search.pep-pfna-pcaf-dev.svc.cluster.local
        port:
          number: 80
