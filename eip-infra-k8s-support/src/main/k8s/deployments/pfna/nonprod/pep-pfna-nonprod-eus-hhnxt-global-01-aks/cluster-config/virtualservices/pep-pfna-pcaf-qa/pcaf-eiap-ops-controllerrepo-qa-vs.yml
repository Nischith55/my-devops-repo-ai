apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pcaf-eiap-ops-controllerrepo
  name: pcaf-eiap-ops-controllerrepo-qa-vs
  namespace: pep-pfna-pcaf-qa
spec:
  gateways:
  - pep-pfna-pcaf-qa/pep-pfna-pcaf-qa-cv-gw
  hosts:
  - pcaf-eiap-ops-controllerrepo-qa.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - corsPolicy:
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Link
      - Content-Type
      - requestId
      - docCategory
      - gpid
      - Access-Control-Allow-Origin
      - Access-Control-Allow-Headers
      allowMethods:
      - POST
      - GET
      - PUT
      - DELETE
      - OPTIONS
      allowOrigins:
      - exact: https://t1.uap.pepenv.com
      - exact: https://pcaf-eiap-ops-controllerrepo-qa.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
      exposeHeaders:
      - x-total-count
    match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pcaf-eiap-ops-controllerrepo.pep-pfna-pcaf-qa.svc.cluster.local
        port:
          number: 80
