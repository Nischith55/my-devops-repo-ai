apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-eiap-hhnx-imagesync-microbatch-vs
  namespace: pep-pfna-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-eiap-hhnx-imagesync-microbatch.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
