apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pcaf-shp-user-privileges-rvxm-vs
  namespace: pep-pfna-pgt-qa
  labels:
      app: pcaf-shp-user-privileges
spec:
  hosts:
  - pcaf-shp-user-privileges-qa.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  gateways:
  - pep-pfna-pgt-qa/pep-pfna-pgt-qa-cv-gw
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pcaf-shp-user-privileges.pep-pfna-pgt-qa.svc.cluster.local
        port:
          number: 80
    corsPolicy:
      allowOrigins:
      - exact: https://apim-pfna.qa.mypepsico.com
      - exact: https://t1.uap.pepenv.com
      - exact: https://d1.uap.pepenv.com
      - exact: https://q1.pfnaweb.mypepsico.com
      - exact: https://q2.pfnaweb.mypepsico.com
      - exact: https://d1.pfnaweb.mypepsico.com
      - exact: https://d2.pfnaweb.mypepsico.com
      - exact: https://pp.uap.pepenv.com
      - exact: http://localhost:3002
      - exact: http://localhost:3001
      allowMethods:
      - POST
      - GET
      - PUT
      - DELETE
      - OPTIONS
      - PATCH
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Access-Control-Allow-Origin
      - Access-Control-Allow-Headers
      - Content-Type
      - Link
      exposeHeaders:
      - Authorization
      - Link
      - x-Total-Count
       
  