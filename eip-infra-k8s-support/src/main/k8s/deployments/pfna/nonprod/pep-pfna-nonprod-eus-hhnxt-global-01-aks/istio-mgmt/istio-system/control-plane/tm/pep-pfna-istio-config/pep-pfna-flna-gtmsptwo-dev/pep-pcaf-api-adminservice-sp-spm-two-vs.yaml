apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-pcaf-api-adminservice-sp-spm-two-vs
  namespace: pep-pfna-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-pcaf-api-adminservice-sp-spm-two.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /api/v1/sp/admin
    route:
    - destination:
        host: pep-pcaf-api-adminservice-sp-spm.pep-pfna-flna-gtmsptwo-dev.svc.cluster.local
        port:
          number: 80