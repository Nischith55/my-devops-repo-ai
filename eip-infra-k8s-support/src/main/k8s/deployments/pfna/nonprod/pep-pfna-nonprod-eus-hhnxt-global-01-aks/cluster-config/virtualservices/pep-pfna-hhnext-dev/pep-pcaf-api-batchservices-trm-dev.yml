    app: pep-pcaf-api-batchservices-trm
  name: pep-pcaf-api-batchservices-trm-dev
  namespace: pep-pfna-hhnext-dev
spec:
  gateways:
  - pep-pfna-hhnext-dev/pep-pfna-hhnext-dev-cv-gw
  hosts:
  - pep-pcaf-api-batchservices-trm.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
