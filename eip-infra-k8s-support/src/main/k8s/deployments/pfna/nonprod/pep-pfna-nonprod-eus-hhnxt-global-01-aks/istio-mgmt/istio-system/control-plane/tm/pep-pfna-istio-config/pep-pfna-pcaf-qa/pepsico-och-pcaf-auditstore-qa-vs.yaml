apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pepsico-och-pcaf-auditstore-qa-vs
  namespace: pep-pfna-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pepsico-och-pcaf-auditstore-qa.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pepsico-och-pcaf-auditstore.pep-pfna-pcaf-qa.svc.cluster.local
        port:
          number: 80
    corsPolicy:
      allowOrigins:      
      - exact: https://t1.uap.pepenv.com
      - exact: https://pepsico-och-pcaf-auditstore-qa.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
      - exact: https://api-na.qa.mypepsico.com
      allowMethods:
      - POST
      - GET
      - PUT
      - DELETE
      - OPTIONS
      - PATCH
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Link
      - Content-Type
      - x-source
      - Access-Control-Allow-Origin
      exposeHeaders:
      - x-total-count
      - x-source