apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pepsico-pcaf-communication-intake
  name: pepsico-pcaf-communication-intake-qa-vs
  namespace: pep-pfna-pcaf-qa
spec:
  gateways:
  - pep-pfna-pcaf-qa/pep-pfna-pcaf-qa-cv-gw
  hosts:
  - pepsico-pcaf-communication-intake-qa.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /api/v1
    route:
    - destination:
        host: pepsico-pcaf-communication-intake.pep-pfna-pcaf-qa.svc.cluster.local
        port:
          number: 80
