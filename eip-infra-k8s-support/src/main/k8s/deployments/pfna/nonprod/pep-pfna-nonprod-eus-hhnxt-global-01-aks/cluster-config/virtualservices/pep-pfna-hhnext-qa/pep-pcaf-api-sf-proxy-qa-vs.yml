apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-pcaf-api-sf-proxy
  name: pep-pcaf-api-sf-proxy-qa-vs
  namespace: pep-pfna-hhnext-qa
spec:
  gateways:
  - pep-pfna-hhnext-qa/pep-pfna-hhnext-qa-cv-gw
  hosts:
  - pep-pcaf-api-sf-proxy-qa.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-pcaf-api-sf-proxy.pep-pfna-hhnext-qa.svc.cluster.local
        port:
          number: 80
