apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-hhnx-rtproxy-service
  name: pep-hhnx-rtproxy-service-vs
  namespace: pep-pfna-pcaf-dev
spec:
  gateways:
  - pep-pfna-pcaf-dev/pep-pfna-pcaf-dev-cv-gw
  hosts:
  - pep-hhnx-rtproxy-service.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-hhnx-rtproxy-service.pep-pfna-pcaf-dev.svc.cluster.local
        port:
          number: 8080
