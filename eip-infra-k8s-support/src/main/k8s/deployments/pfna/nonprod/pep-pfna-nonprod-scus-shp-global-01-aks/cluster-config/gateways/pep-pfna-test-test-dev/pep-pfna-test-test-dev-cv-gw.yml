apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: pep-pfna-test-test-dev-cv-gw
  namespace: pep-pfna-test-test-dev
spec:
  selector:
    istio: pep-pfna-ingress-gw01
  servers:
  - hosts:
    - dummy-passthrough-pep-pfna-test-test-dev.gw01.aks01.scus.nonprod.azure.intra.pepsico.com
    name: pep-pfna-test-test-dev-cv-gw-tls-443
    port:
      name: https-pep-pfna-test-test-dev-cv-gw-tls-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - dummy-pep-pfna-test-test-dev-443.gw01.aks01.scus.nonprod.azure.intra.pepsico.com
    name: pep-pfna-test-test-dev-cv-gw-https-443
    port:
      name: https-pep-pfna-test-test-dev-cv-gw-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-pfna-nonprod-scus-shp-global-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - dummy-pep-pfna-test-test-dev-80.gw01.aks01.scus.nonprod.azure.intra.pepsico.com
    name: pep-pfna-test-test-dev-cv-gw-http-80
    port:
      name: http-pep-pfna-test-test-dev-cv-gw-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true

