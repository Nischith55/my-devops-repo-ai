---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-pfna-nginx-vs
  namespace: pep-pfna-istio-config
spec:
  gateways:
    - istio-system/istio-in-gateway-01
  hosts:
  - pep-pfna-nginx.pfnainfra.gw01.aks02.scus.preprod.azure.intra.pepsico.com
  http:
    match:
      - uri:
          prefix: /
    route:
    - destination:
        host: pep-pfna-nginx.pep-pfna-global-infra-preprod.svc.cluster.local
        port: 
          number: 8080