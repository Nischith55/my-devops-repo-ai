apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pcaf-ast-plandeqpmt-api-py-rfoz-vs
  namespace: pep-pfna-pcaf-preprod
  labels:
      app: pcaf-ast-plandeqpmt-api-py
spec:
  hosts:
  - pcaf-ast-plandeqpmt-api-py.pfnapcaf.gw01.aks01.scus.preprod.azure.intra.pepsico.com
  gateways:
  - pep-pfna-pcaf-preprod/pep-pfna-pcaf-preprod-cv-gw
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pcaf-ast-plandeqpmt-api-py.pep-pfna-pcaf-preprod.svc.cluster.local
        port:
          number: 80
    corsPolicy:
      allowOrigins:
      - exact: https://apim-pfna.preprod.mypepsico.com
      - exact: https://pcaf-ast-plandeqpmt-api-py.pfnapcaf.gw01.aks01.scus.preprod.azure.intra.pepsico.com
      allowMethods:
      - GET
      - PUT
      - POST
      - DELETE
      - OPTIONS
  
      allowCredentials: true
       
  