apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: pep-pfna-pfna-pogon-preprod-cv-gw
  namespace: pep-pfna-pfna-pogon-preprod
spec:
  selector:
    istio: pep-pfna-ingress-gw01
  servers:
  - hosts:
    - dummy-passthrough-pep-pfna-pfna-pogon-preprod.gw01.aks01.scus.preprod.azure.intra.pepsico.com
    name: pep-pfna-pfna-pogon-preprod-cv-gw-tls-443
    port:
      name: https-pep-pfna-pfna-pogon-preprod-cv-gw-tls-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - dummy-pep-pfna-pfna-pogon-preprod-443.gw01.aks01.scus.preprod.azure.intra.pepsico.com
    - pep-pcaf-pogon-backend-preprod.pfnapcaf.gw01.aks01.scus.preprod.azure.intra.pepsico.com
    - pep-pcaf-pogon-backend-scheduler-preprod.pfnapcaf.gw01.aks01.scus.preprod.azure.intra.pepsico.com
    - pep-pcaf-pogon-print-fulfillment-ms-preprod.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pep-pcaf-pogon-print-fulfillment-ms.pfnapcaf.gw01.aks01.scus.preprod.azure.intra.pepsico.com
    - pep-pcaf-pogon-user-context.pfnapcaf.gw01.aks01.scus.preprod.azure.intra.pepsico.com
    - pep-pcaf-pogon-product-catalog.pfnapcaf.gw01.aks01.scus.preprod.azure.intra.pepsico.com
    name: pep-pfna-pfna-pogon-preprod-cv-gw-https-443
    port:
      name: https-pep-pfna-pfna-pogon-preprod-cv-gw-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-pfna-cit-preprod-scus-pcaf-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - dummy-pep-pfna-pfna-pogon-preprod-80.gw01.aks01.scus.preprod.azure.intra.pepsico.com
    - pep-pcaf-pogon-backend-preprod.pfnapcaf.gw01.aks01.scus.preprod.azure.intra.pepsico.com
    - pep-pcaf-pogon-backend-scheduler-preprod.pfnapcaf.gw01.aks01.scus.preprod.azure.intra.pepsico.com
    - pep-pcaf-pogon-print-fulfillment-ms-preprod.pfna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pep-pcaf-pogon-print-fulfillment-ms.pfnapcaf.gw01.aks01.scus.preprod.azure.intra.pepsico.com
    - pep-pcaf-pogon-user-context.pfnapcaf.gw01.aks01.scus.preprod.azure.intra.pepsico.com
    - pep-pcaf-pogon-product-catalog.pfnapcaf.gw01.aks01.scus.preprod.azure.intra.pepsico.com
    name: pep-pfna-pfna-pogon-preprod-cv-gw-http-80
    port:
      name: http-pep-pfna-pfna-pogon-preprod-cv-gw-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true

