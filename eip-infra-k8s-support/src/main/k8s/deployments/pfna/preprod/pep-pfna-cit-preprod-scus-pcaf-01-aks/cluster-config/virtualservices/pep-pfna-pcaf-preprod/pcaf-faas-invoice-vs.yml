apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  annotations: {}
  labels:
    app: pcaf-faas-invoice
  name: pcaf-faas-invoice-vs
  namespace: pep-pfna-pcaf-preprod
spec:
  gateways:
  - pep-pfna-pcaf-preprod/pep-pfna-pcaf-preprod-cv-gw
  hosts:
  - pcaf-faas-invoice.pfnapcaf.gw01.aks01.scus.preprod.azure.intra.pepsico.com
