  namespace: pep-pfna-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pepsico-och-pcaf-orderintakeconsumer.pfnapcaf.gw01.aks01.scus.preprod.azure.intra.pepsico.com
