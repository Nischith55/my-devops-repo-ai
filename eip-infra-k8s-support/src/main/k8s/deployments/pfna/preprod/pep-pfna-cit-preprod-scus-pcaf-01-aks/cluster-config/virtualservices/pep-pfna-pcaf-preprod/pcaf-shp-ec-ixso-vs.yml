apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pcaf-shp-ec-ixso-vs
  namespace: pep-pfna-pcaf-preprod
  labels:
      app: pcaf-shp-ec
spec:
  hosts:
  - pcaf-shp-ec.pfnapcaf.gw01.aks01.scus.preprod.azure.intra.pepsico.com
  gateways:
  - pep-pfna-pcaf-preprod/pep-pfna-pcaf-preprod-cv-gw
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pcaf-shp-ec.pep-pfna-pcaf-preprod.svc.cluster.local
        port:
          number: 8080
  