apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-pcaf-api-user-privileges-vs
  namespace: pep-pfna-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-pcaf-api-user-privileges.pfnapcaf.gw01.aks01.scus.preprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-pcaf-api-user-privileges.pep-pfna-flna-salesplus-preprod.svc.cluster.local
        port: 
          number: 80 