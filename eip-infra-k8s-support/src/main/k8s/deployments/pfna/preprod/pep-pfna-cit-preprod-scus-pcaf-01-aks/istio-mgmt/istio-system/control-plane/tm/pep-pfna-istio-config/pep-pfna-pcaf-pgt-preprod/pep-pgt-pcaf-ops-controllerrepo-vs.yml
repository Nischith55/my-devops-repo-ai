apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-pgt-pcaf-ops-controllerrepo-vs
  namespace: pep-pfna-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-pgt-pcaf-ops-controllerrepo.pfnapcaf.gw01.aks01.scus.preprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-pgt-pcaf-ops-controllerrepo.pep-pfna-pcaf-pgt-preprod.svc.cluster.local
        port:
          number: 80
          