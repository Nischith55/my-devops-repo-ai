  labels:
    app: pep-pgt-pcaf-people
  name: pep-pgt-pcaf-people-vs
  namespace: pep-pfna-pcaf-pgt-preprod
spec:
  gateways:
  - pep-pfna-pcaf-pgt-preprod/pep-pfna-pcaf-pgt-preprod-cv-gw
  hosts:
  - pep-pgt-pcaf-people.pfnapcaf.gw01.aks01.scus.preprod.azure.intra.pepsico.com
