---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pep-pfna-servicenow-clusterrole
rules: 
-   apiGroups:
    - ''
    - apps
    - autoscaling
    - extensions
    - batch
    resources:
    - endpoints
    - daemonsets
    - deployments
    - jobs
    - cronjobs
    - namespaces
    - nodes
    - pods
    - replicasets
    - services
    - statefulsets
    verbs:
    - get
    - list
    - watch
-   apiGroups:
    - ''
    resources:
    - events
    verbs:
    - get
    - list
