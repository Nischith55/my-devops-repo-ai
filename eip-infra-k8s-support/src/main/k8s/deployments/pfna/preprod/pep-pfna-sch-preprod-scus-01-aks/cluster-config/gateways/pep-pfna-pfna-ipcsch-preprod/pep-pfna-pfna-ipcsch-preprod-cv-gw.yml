apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: pep-pfna-pfna-ipcsch-preprod-cv-gw
  namespace: pep-pfna-pfna-ipcsch-preprod
spec:
  selector:
    istio: pep-pfna-ingress-gw01
  servers:
  - hosts:
    - dummy-passthrough-pep-pfna-pfna-ipcsch-preprod.pfna.sch.gw01.aks01.scus.preprod.azure.intra.pepsico.com
    name: pep-pfna-pfna-ipcsch-preprod-cv-gw-tls-443
    port:
      name: https-pep-pfna-pfna-ipcsch-preprod-cv-gw-tls-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - dummy-pep-pfna-pfna-ipcsch-preprod.pfna.sch.gw01.aks01.scus.preprod.azure.intra.pepsico.com
    - pepsico-manufacturing-ipc-frontend.pfna.sch.gw01.aks01.scus.preprod.azure.intra.pepsico.com
    - pepsico-manufacturing-ipc-api.pfna.sch.gw01.aks01.scus.preprod.azure.intra.pepsico.com
    - pepsico-manufacturing-ipc-kpi.pfna.sch.gw01.aks01.scus.preprod.azure.intra.pepsico.com
    name: pep-pfna-pfna-ipcsch-preprod-cv-gw-https-443
    port:
      name: https-pep-pfna-pfna-ipcsch-preprod-cv-gw-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-pfna-sch-preprod-scus-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - dummy-pep-pfna-pfna-ipcsch-preprod-80.pfna.sch.gw01.aks01.scus.preprod.azure.intra.pepsico.com
    - pepsico-manufacturing-ipc-frontend.pfna.sch.gw01.aks01.scus.preprod.azure.intra.pepsico.com
    - pepsico-manufacturing-ipc-api.pfna.sch.gw01.aks01.scus.preprod.azure.intra.pepsico.com
    - pepsico-manufacturing-ipc-kpi.pfna.sch.gw01.aks01.scus.preprod.azure.intra.pepsico.com
    - ipcflna.preprod.mypepsico.com
    name: pep-pfna-pfna-ipcsch-preprod-cv-gw-http-80
    port:
      name: http-pep-pfna-pfna-ipcsch-preprod-cv-gw-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true
  - hosts:
    - ipcflna.preprod.mypepsico.com
    name: pep-ipcsch-preprod-cv-gw-9-https-443
    port:
      name: pep-ipcsch-preprod-cv-gw-9-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: ipcflna-pep-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE

