apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pcaf-shp-rteexpansion-vs
  namespace: pep-pfna-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pcaf-shp-rteexpansion.genp.pfnapgt.gw01.aks01.scus.preprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
