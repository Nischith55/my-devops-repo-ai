apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pcaf-plcysrvr-vs
  namespace: pep-pfna-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pcaf-plcysrvr-genp.gw01.aks01.scus.preprod.azure.intra.pepsico.com
  - pcaf-plcysrvr.genp.gw01.aks01.scus.preprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pcaf-plcysrvr.pep-pfna-pgt-preprod.svc.cluster.local
        port:
          number: 80
