apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  annotations: {}
  labels:
    app: pcaf-shp-cust
  name: pcaf-shp-cust-vs
  namespace: pep-pfna-pgt-preprod
spec:
  gateways:
  - pep-pfna-pgt-preprod/pep-pfna-pgt-preprod-cv-gw
  hosts:
  - pcaf-shp-cust.genp.gw01.aks01.scus.preprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
