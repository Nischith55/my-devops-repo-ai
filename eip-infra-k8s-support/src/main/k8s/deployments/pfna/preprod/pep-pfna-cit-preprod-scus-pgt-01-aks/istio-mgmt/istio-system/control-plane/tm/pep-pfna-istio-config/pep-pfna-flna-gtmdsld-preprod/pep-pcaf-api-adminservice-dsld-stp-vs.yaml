apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-pcaf-api-adminservice-dsld-stp-vs
  namespace: pep-pfna-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-pcaf-api-adminservice-dsld-stp.pfnapgt.gw01.aks01.scus.preprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /api/v1/dsld/stp/admin
    route:
    - destination:
        host: pep-pcaf-api-adminservice-dsld-stp.pep-pfna-flna-gtmdsld-preprod.svc.cluster.local
        port: 
          number: 80 