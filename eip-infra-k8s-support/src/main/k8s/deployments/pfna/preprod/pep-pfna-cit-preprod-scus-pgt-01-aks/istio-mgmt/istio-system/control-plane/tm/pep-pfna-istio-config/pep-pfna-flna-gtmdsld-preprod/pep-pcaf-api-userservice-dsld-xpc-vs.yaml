apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-pcaf-api-userservice-dsld-xpc-vs
  namespace: pep-pfna-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-pcaf-api-userservice-dsld-xpc.pfnapgt.gw01.aks01.scus.preprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /api/v1/dsld/xpc/user
    route:
    - destination:
        host: pep-pcaf-api-userservice-dsld-xpc.pep-pfna-flna-gtmdsld-preprod.svc.cluster.local
        port: 
          number: 80 