---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: azurefile-premium
mountOptions:
  - vers=3.0
  - dir_mode=0777
  - file_mode=0644
  - mfsymlinks
  - nobrl
  - cache=strict
  - actimeo=30
  - uid=1000
  - gid=1000
parameters:
  resourceGroup: pep-eiap-nonprod-scus-k8s-01-rg
  skuName: Premium_LRS
  storageAccount: pe0001sbox03aksfp02sa
provisioner: file.csi.azure.com
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true