apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-eiap-nginx-vs
  namespace: pep-eiap-global-dev
spec:
  gateways:
  - pep-eiap-global-dev/pep-eiap-global-dev-cv-gw
  hosts:
  - pep-eiap-nginx.sandbox.gw01.aks03.scus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-eiap-nginx.pep-eiap-global-dev.svc.cluster.local
        port: 
          number: 8080