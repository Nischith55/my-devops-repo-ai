apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: grafana
  name: pep-eiap-cgf-wsp-grafana-vs
  namespace: pep-eiap-eus-grafana-01
spec:
  gateways:
  - pep-eiap-eus-grafana-01/pep-eiap-eus-grafana-01-cv-gw
  hosts:
  - grafana-file.mldeploy.gw01.aks04.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: grafana.pep-eiap-eus-grafana-01.svc.cluster.local
        port:
          number: 3000
