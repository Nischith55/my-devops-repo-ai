apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-eiap-nginx
  name: pep-eiap-nginx-vs
  namespace: pep-eiap-global-infra-dev
spec:
  gateways:
  - pep-eiap-global-infra-dev/pep-eiap-global-infra-dev-cv-gw
  hosts:
  - pep-eiap-nginx.mldeploy.gw01.aks04.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-eiap-nginx.pep-eiap-global-infra-dev.svc.cluster.local
        port:
          number: 8080
