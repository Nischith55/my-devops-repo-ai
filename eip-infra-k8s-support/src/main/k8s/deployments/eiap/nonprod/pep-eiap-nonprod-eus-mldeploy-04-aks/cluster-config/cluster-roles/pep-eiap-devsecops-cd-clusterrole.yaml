apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:  
  name: pep-eiap-devsecops-cd-clusterrole  
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - secrets
  - serviceaccounts
  verbs:
  - '*'
- apiGroups:
  - apps
  resources:
  - deployments
  - replicasets
  - statefulsets
  verbs:
  - '*'
- apiGroups:
  - ""
  resources:
  - podtemplates
  - pods
  - pods/status  
  - pods/exec
  - pods/log
  verbs:
  - '*'
- apiGroups:
  - ""
  resources:
  - services
  - services/proxy
  verbs:
  - '*'
- apiGroups:
  - batch
  resources:
  - jobs
  - cronjobs
  verbs:
  - '*'
- apiGroups:
  - policy
  resources:
  - poddisruptionbudgets
  verbs:
  - '*'
- apiGroups:
  - autoscaling
  resources:
  - horizontalpodautoscalers
  verbs:
  - '*'
-   apiGroups:
    - constraints.gatekeeper.sh
    resources:
    - '*'
    verbs:
    - get
    - list
    - watch
-   apiGroups:
    - ''
    resources:
    - persistentvolume
    - persistentvolumeclaims
    verbs:
    - create
    - get
    - list
    - patch
    - update
    - watch
-   apiGroups:
    - networking.istio.io
    resources:
    - virtualservices
    - destinationrules
    verbs:
    - '*'
- apiGroups:
  - secrets-store.csi.x-k8s.io
  resources:
  - secretproviderclasses
  verbs:
  - '*'
- apiGroups:
  - storage.k8s.io
  resources:
  - storageclass
  verbs:
  - '*'
-   apiGroups:
    - networking.istio.io
    resources:
    - gateways
    verbs:
    - get 
    - list 
    - patch
- apiGroups:
  - ray.io
  resources:
  - rayjobs
  - rayservices
  - rayclusters
  verbs:
  - '*'