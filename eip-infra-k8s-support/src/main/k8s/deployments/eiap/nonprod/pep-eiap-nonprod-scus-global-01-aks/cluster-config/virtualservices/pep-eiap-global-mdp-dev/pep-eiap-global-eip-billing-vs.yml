apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-eiap-global-eip-billing
  name: pep-eiap-global-eip-billing-vs
  namespace: pep-eiap-global-mdp-dev
spec:
  gateways:
  - pep-eiap-global-mdp-dev/pep-eiap-global-mdp-dev-cv-gw
  hosts:
  - pep-eiap-global-eip-billing.global.gw01.aks01.scus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - uri:
        prefix: /eipone/billing-service
    route:
    - destination:
        host: pep-eiap-global-eip-billing.pep-eiap-global-mdp-dev.svc.cluster.local
        port:
          number: 80
