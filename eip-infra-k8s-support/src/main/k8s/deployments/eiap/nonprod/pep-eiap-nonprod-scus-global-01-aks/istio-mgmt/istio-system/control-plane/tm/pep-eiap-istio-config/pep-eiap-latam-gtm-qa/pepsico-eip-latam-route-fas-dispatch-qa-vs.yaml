apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pepsico-eip-latam-route-fas-dispatch-qa-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pepsico-eip-latam-route-fas-dispatch-qa.global.gw01.aks01.scus.nonprod.azure.intra.pepsico.com
  http:
