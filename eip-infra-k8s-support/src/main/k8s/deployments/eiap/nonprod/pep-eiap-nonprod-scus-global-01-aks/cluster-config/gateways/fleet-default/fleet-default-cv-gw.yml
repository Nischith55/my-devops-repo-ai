apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: fleet-default-cv-gw
  namespace: fleet-default
spec:
  selector:
    istio: pep-eiap-ingress-gw01
  servers:
  - hosts:
    - dummy-passthrough-fleet-default.gw01.aks01.scus.nonprod.azure.intra.pepsico.com
    name: fleet-default-cv-gw-tls-443
    port:
      name: https-fleet-default-cv-gw-tls-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - dummy-fleet-default-443.gw01.aks01.scus.nonprod.azure.intra.pepsico.com
    name: fleet-default-cv-gw-https-443
    port:
      name: https-fleet-default-cv-gw-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-eiap-nonprod-scus-global-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - dummy-fleet-default-80.gw01.aks01.scus.nonprod.azure.intra.pepsico.com
    name: fleet-default-cv-gw-http-80
    port:
      name: http-fleet-default-cv-gw-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true

