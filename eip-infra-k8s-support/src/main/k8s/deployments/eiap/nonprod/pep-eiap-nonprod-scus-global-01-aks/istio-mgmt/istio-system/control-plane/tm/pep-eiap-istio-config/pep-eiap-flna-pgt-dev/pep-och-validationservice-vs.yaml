apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-och-validationservice-vs
  namespace: pep-eiap-istio-config 
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - "pep-och-validationservice.global.gw01.aks01.scus.nonprod.azure.intra.pepsico.com"
  http:
  - match:
    - uri:
        prefix: /v1/api
      ignoreUriCase: true
    route:
    - destination:
        host: pep-och-validationservice.pep-eiap-flna-pgt-dev.svc.cluster.local
        port:
          number: 80