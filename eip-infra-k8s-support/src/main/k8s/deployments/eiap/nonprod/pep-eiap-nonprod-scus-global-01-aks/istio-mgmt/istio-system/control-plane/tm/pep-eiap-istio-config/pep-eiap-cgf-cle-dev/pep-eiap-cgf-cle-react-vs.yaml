apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-eiap-cgf-cle-react-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-eiap-cgf-cle-react.global.gw01.aks01.scus.nonprod.azure.intra.pepsico.com
  tls:
    - match:
      - port: 443
        sniHosts:
          - pep-eiap-cgf-cle-react.global.gw01.aks01.scus.nonprod.azure.intra.pepsico.com
      route:
        - destination:
            host: pep-eiap-cgf-cle-react.pep-eiap-cgf-cle-dev.svc.cluster.local
            port: 
              number: 443
