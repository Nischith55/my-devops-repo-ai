apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pepsico-eip-latam-order-translator-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pepsico-eip-latam-order-translator.global.gw01.aks01.scus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - uri:
        prefix: /api/v1/canonical/order/create
    route:
    - destination:
        host: pepsico-eip-latam-order-translator.pep-eiap-latam-gtm-dev.svc.cluster.local
        port:
          number: 80