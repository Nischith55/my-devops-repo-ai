apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-eiap-digitaltwinnetcode-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pepdigitaltwinnetcode-service.global.gw01.aks01.scus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /machinekpi
    route:
    - destination:
        host: pepdigitaltwinnetcode-service.pep-eiap-global-idt-dev.svc.cluster.local