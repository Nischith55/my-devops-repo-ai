apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: pep-eiap-flna-hhnext-qa-cv-gw
  namespace: pep-eiap-flna-hhnext-qa
spec:
  selector:
    istio: pep-eiap-ingress-gw01
  servers:
  - hosts:
    - dummy-passthrough-pep-eiap-flna-hhnext-qa.gw01.aks01.scus.nonprod.azure.intra.pepsico.com
    name: pep-eiap-flna-hhnext-qa-cv-gw-tls-443
    port:
      name: https-pep-eiap-flna-hhnext-qa-cv-gw-tls-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - pep-eiap-flna-hhnext-advshpmntnotice-qa.global.gw01.aks01.scus.nonprod.azure.intra.pepsico.com
    - pep-eiap-flna-hhnext-qa.global.gw01.aks01.scus.nonprod.azure.intra.pepsico.com
    - pep-eip-pfna-hhnext-binorderasn-qa.global.gw01.aks01.scus.nonprod.azure.intra.pepsico.com
    - pep-eip-pfna-hhnext-manifest-qa.global.gw01.aks01.scus.nonprod.azure.intra.pepsico.com
    - pep-pcaf-api-dataservices-routeassign-qa.global.gw01.aks01.scus.nonprod.azure.intra.pepsico.com
    - pep-eiap-hhnext-pcaf-api-product-qa.global.gw01.aks01.scus.nonprod.azure.intra.pepsico.com
    - pep-pfna-api-cblite-qa.global.gw01.aks01.scus.nonprod.azure.intra.pepsico.com
    name: pep-eiap-flna-hhnext-qa-cv-gw-https-443
    port:
      name: https-pep-eiap-flna-hhnext-qa-cv-gw-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-eiap-nonprod-scus-global-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - pep-eiap-flna-hhnext-advshpmntnotice-qa.global.gw01.aks01.scus.nonprod.azure.intra.pepsico.com
    - pep-eiap-flna-hhnext-qa.global.gw01.aks01.scus.nonprod.azure.intra.pepsico.com
    - pep-eip-pfna-hhnext-binorderasn-qa.global.gw01.aks01.scus.nonprod.azure.intra.pepsico.com
    - pep-eip-pfna-hhnext-manifest-qa.global.gw01.aks01.scus.nonprod.azure.intra.pepsico.com
    - pep-pcaf-api-dataservices-routeassign-qa.global.gw01.aks01.scus.nonprod.azure.intra.pepsico.com
    - pep-eiap-hhnext-pcaf-api-product-qa.global.gw01.aks01.scus.nonprod.azure.intra.pepsico.com
    - pep-pfna-api-cblite-qa.global.gw01.aks01.scus.nonprod.azure.intra.pepsico.com
    name: pep-eiap-flna-hhnext-qa-cv-gw-http-80
    port:
      name: http-pep-eiap-flna-hhnext-qa-cv-gw-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true

