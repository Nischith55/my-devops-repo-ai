apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-och-ordersearch-qa-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - "pep-och-ordersearch-qa.global.gw01.aks01.scus.nonprod.azure.intra.pepsico.com"
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /v1/api/orders
    - ignoreUriCase: true
      uri:
        prefix: /v2/api/orders
    route:
    - destination:
        host: pep-och-ordersearch.pep-eiap-flna-pgt-qa.svc.cluster.local
        port:
          number: 80