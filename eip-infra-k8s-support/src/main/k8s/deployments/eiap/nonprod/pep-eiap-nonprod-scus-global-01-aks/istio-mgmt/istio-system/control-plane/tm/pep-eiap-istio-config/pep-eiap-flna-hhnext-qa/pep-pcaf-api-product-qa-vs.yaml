  name: pep-pcaf-api-product-qa-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-eiap-hhnext-pcaf-api-product-qa.global.gw01.aks01.scus.nonprod.azure.intra.pepsico.com
