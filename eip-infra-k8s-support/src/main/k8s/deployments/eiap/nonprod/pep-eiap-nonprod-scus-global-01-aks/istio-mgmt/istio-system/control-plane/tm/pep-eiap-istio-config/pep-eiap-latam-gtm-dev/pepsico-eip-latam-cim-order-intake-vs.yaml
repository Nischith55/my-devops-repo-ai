apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pepsico-eip-latam-cim-order-intake-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - "pepsico-eip-latam-cim-order-intake.global.gw01.aks01.scus.nonprod.azure.intra.pepsico.com"
  http:
  - match:
    - uri:
        prefix: /api/v1/cim-order
    route:
    - destination:
        host: pepsico-eip-latam-cim-order-intake.pep-eiap-latam-gtm-dev.svc.cluster.local
        port:
          number: 80