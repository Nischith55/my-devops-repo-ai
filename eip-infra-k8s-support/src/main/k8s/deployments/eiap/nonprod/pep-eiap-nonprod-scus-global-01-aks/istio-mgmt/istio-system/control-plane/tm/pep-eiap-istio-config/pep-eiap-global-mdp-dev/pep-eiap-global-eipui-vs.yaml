apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-eiap-global-eipui-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - "pep-eiap-global-eipui.global.gw01.aks01.scus.nonprod.azure.intra.pepsico.com"
  http:
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        host: pep-eiap-global-eipui.pep-eiap-global-mdp-dev.svc.cluster.local
        port:
          number: 80