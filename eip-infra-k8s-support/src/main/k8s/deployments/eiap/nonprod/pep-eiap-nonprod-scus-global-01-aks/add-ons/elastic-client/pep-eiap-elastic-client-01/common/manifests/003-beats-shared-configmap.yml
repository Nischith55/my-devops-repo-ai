---
apiVersion: v1
kind: ConfigMap
metadata:
  name: beats-common-output-config
  namespace: pep-eiap-elastic-client-01
data:
  # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  # Common beats config for both metricbeat and filebeat
  # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  beat-output-config.yml: |

    # ##
    # All outputs
    # ##
    output:
      elasticsearch:
        hosts:
          - ${ELASTICSEARCH_HOST}:${ELASTICSEARCH_PORT}
        index: ${INDEX_PATTERN_PREFIX}-%{[index_name_add]}-%{[agent.version]}-%{+yyyy.MM.dd}
        username: ${ELASTICSEARCH_USERNAME}
        password: ${ELASTICSEARCH_PASSWORD}
        ssl:
          enabled: true
          # The following 2 must be mounted at paths shown below from
          # pep-ca-certs-config ConfigMap
          certificate_authorities:
            - /projected/etc/certs/PepsiCoCA01.pem
            - /projected/etc/certs/PepsiCoRootCA.pem
          supported_protocols:
            - TLSv1.2
            - TLSv1.3
          verification_mode: certificate

    # ##
    # Setup all index patterns
    # ##
    setup:
      ilm:
        enabled: false
      template:
        enabled: true
        name: ${TEMPLATE_NAME}
        overwrite: false
        pattern: ${INDEX_PATTERN_PREFIX}-*
        settings:
          index:
            codec: best_compression
            number_of_replicas: ${INDEX_REPLICAS:1}
            # NOTE: From 7.x this should be set automatically by elastic
            # number_of_routing_shards: 64
            # MUST be a multiple of number_of_routing_shards
            number_of_shards: ${INDEX_SHARDS:1}


    # ##
    # Common Processors across all beats deployment
    # ##

    processors:

    # --
    # Add EIAP fields
    # --

    - add_fields:
        target: eiap
        fields:
          cluster_name: ${K8S_CLUSTER_NAME}

    - if:
        has_fields:
          - kubernetes.namespace
        and:
          - equals:
              agent.type: filebeat
      then:
        # NOTE for filebeat we add namespace
        - copy_fields:
            fields:
              - from: kubernetes.namespace
                to: index_name_add
            ignore_missing: false
            fail_on_error: true
      else:
        # NOTE for metricbeat or default (for modules that don't have namespace)
        - copy_fields:
            fields:
              - from: eiap.cluster_name
                to: index_name_add
            ignore_missing: false
            fail_on_error: true

    - add_cloud_metadata:
        # **
        # Only augment for system level data
        # **
        when:
          equals:
            event.module: system

    - add_kubernetes_metadata:
        # --
        # Only augment kubernetes metadata for pods
        # --
        when:
          has_fields:
            - kubernetes.pod.name
            - kubernetes.container.name
        # ##
        # parameters
        # ##
        node: ${NODE_NAME}
        add_resource_metadata:
          namespace:
            enabled: true
          node:
            enabled: true
        default_indexers:
          enabled: false
        default_matchers:
          enabled: false
        indexers:
          - pod_name:
        # IMPORTANT: due to a bug beats is looking at 
        # '/var/lib/docker/containers/'
        matchers:
        - logs_path:
            logs_path: "/var/log/containers/"

    - add_fields:
        # **
        # Only augment for system level data
        # **
        when:
          equals:
            event.module: system
        target: eiap
        fields:
          host.os.family: ${ID}
          host.os.name: ${NAME}
          host.os.codename: ${VERSION_CODENAME}
          host.os.version: ${VERSION}


    # ##
    # Logging
    # ##

    logging:
      level: INFO
      metrics:
        enabled: true