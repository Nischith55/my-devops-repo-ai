apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: demo-hello-world
  name: demo-hello-world
  namespace: pep-eiap-flna-eiv-dev
spec:
  gateways:
  - pep-eiap-flna-eiv-dev/pep-eiap-flna-eiv-dev-cv-gw
  hosts:
  - demo-hello-world.global.gw01.aks01.scus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: demo-hello-world.pep-eiap-flna-eiv-dev.svc.cluster.local
        port:
          number: 8080
