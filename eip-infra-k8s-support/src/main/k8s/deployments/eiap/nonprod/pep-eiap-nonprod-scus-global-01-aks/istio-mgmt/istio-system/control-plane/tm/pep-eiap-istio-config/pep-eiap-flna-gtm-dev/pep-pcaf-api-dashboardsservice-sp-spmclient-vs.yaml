apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-pcaf-api-dashboardsservice-sp-spmclient-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-pcaf-api-dashboardsservice-sp-spmclient.global.gw01.aks01.scus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /api/v1/sp/spmclient/dashboard
    route:
    - destination:
        host: pep-pcaf-api-dashboardsservice-sp-spmclient.pep-eiap-flna-gtm-dev.svc.cluster.local
        port:
          number: 80