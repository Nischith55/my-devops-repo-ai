apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pepsico-filestore-dev-service-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pepsico-filestore-dev-service.global.gw01.aks01.scus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: filestore.pep-eiap-flna-hhnext-dev.svc.cluster.local