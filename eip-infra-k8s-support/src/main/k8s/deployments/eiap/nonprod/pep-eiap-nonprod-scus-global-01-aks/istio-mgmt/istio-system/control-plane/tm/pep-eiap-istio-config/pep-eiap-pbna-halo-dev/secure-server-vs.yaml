apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: secure-server-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - "secure-server.global.gw01.aks01.scus.nonprod.azure.intra.pepsico.com"
  http:
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        host: secure-server.pep-eiap-pbna-halo-dev.svc.cluster.local
        port:
          number: 80
