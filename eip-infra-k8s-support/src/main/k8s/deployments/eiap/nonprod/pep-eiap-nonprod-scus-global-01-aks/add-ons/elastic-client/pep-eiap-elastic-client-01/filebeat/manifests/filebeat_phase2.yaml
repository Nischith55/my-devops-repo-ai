# ##
# Non-ECK deployment.
# IMPORTANT:
# - This is meant to send all AKS logs to our primary cluster (cluster-01)
# ##
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat-node-config
  namespace: pep-eiap-elastic-client-01
data:

  K8S_CLUSTER_NAME: pep-eiap-nonprod-scus-global-01-aks

  filebeat-processor.yml: |

    # ---------------------------------------------------------------------
    # Common Processors across all beats deployment
    # ---------------------------------------------------------------------

    processors:

    - add_fields:
        #target: eiap
        fields:
          cluster_name: ${K8S_CLUSTER_NAME}
          pep-aks-cluster: ${K8S_CLUSTER_NAME}

    - add_cloud_metadata:
        # **
        # Only augment for system level data
        # **
        when:
          equals:
            event.module: system

    - add_host_metadata: {}

    - add_kubernetes_metadata:
        # we need this since we disabled hostNetwork
        host: ${NODE_NAME}
        # NOTE: default_indexer: container and default_matcher: logs_path
        # but logs_path matcher is wrong! so we disable it
        default_indexers:
          enabled: false
        default_matchers:
          enabled: false


         
    - add_tags:
        tags: ["NonProd-SCUS-Shared", "retain-logs"]

    - script:
        lang: javascript
        source: >
          function process(event) {
            event.Put("fields.sn-application", "aks-pep-eiap-nonprod-scus-global-01-aks" + "-" + event.Get("kubernetes.namespace"));
            return event;
          }

    # ~~
    # Logging
    # ~~
    logging:
      level: INFO
      metrics:
        enabled: true

  filebeat.yml: |-

    # #####################################################################
    # Setup filebeat configuration
    # #####################################################################
    filebeat:

      # ~~
      # All enabled modules. NOTE: This requires an ingest-node to be
      # available OTHERWISE it will fail!!!
      # ~~
      modules:
      - module: system
        syslog:
          enabled: true
          # Default: Configured paths: [/var/log/messages* /var/log/syslog*]
          var:
            paths:
            - /var/log/syslog
            - /var/log/messages
            - /var/log/waagent.log
            - /var/log/azure/*.log
        auth:
          enabled: true
          # Default: Configured paths: [/var/log/auth.log* /var/log/secure*]
          var:
            paths:
            - /var/log/auth.log
      # ~~
      # autodiscover settings
      # ~~
      autodiscover:
        providers:
        - type: kubernetes
          node: ${NODE_NAME}
          paths:
          - /var/log/containers/*.log
          processors:
          # IMPORTANT:
          # - autodiscover will not work without the matcher currently, 
          # report bug to es support. It is looking at 
          # '/var/lib/docker/containers/'
          - add_kubernetes_metadata:
              node: ${NODE_NAME}
              matchers:
              - logs_path:
                  logs_path: "/var/log/containers/"

          # enable hints for pod annotations
          hints:
            enabled: true
            # default_config 
            default_config:
              type: container
              paths:
                # CRI path
              - /var/log/containers/*-${data.container.id}.log
                # output
              multiline:
                type: pattern
                pattern: '^(\[|[0-9]{4}-[0-9]{2}-[0-9]{2} )'
                negate: true
                match: after

    setup.template.name: "aks-data-stream-3shards"
    setup.template.pattern: "aks-pep_eiap_nonprod_scus_global_01_aks*"

    setup.ilm.enabled: false     
    #setup.template.overwrite: true
    output.elasticsearch:
        hosts: [https://3825028849b946d3a380f6136dcd7c3a.privatelink.southcentralus.azure.elastic-cloud.com:9243]
        api_key: "GnuNB5MBWuezjPg1DKep:OPckBJB2QHOYgXBnfTHhZw"
        index: "%{[fields][sn-application]}"
        worker: 3
        bulk_max_size: 1000
        ssl.verification_mode: none
      
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: elastic-beat-autodiscover
rules:
- apiGroups: [""]
  resources:
  - namespaces
  - pods
  - nodes
  verbs:
  - get
  - watch
  - list
- apiGroups: ["apps"]
  resources:
  - replicasets
  verbs: ["list", "watch"]
- apiGroups: ["batch"]
  resources:
  - jobs
  verbs: ["list", "watch"]
---

apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: filebeat-node
  namespace: pep-eiap-elastic-client-01
  labels:
    k8s-app: &app_name filebeat-node
spec:

  selector:
    matchLabels:
      k8s-app: *app_name

  template:

    metadata:
      labels:
        k8s-app: *app_name
        app: *app_name
        version: 8.19.11

    spec:
      hostAliases:
      - ip: "172.20.34.198"
        hostnames:
        - "3825028849b946d3a380f6136dcd7c3a.privatelink.southcentralus.azure.elastic-cloud.com"

      # PEP: DaemonSet we need to run it on EVERY node. so tolerate all
      #      taints
      tolerations:
      - operator: Exists
      #

      serviceAccountName: filebeat
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 0
        # If using Red Hat OpenShift uncomment this:
        # privileged: true
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet

      # ~~
      # Please pay attention to this
      # ~~
      volumes:

      - name: varlibdockercontainers
        hostPath:
          path: /var/lib/docker/containers

      - name: varlog
        hostPath:
          path: /var/log

      # data folder stores a registry of read status for all files, 
      # so we don't send everything again on a Filebeat pod restart
      - name: data
        hostPath:
          path: /var/lib/pep-eiap-elastic-client-01/filebeat-node/filebeat-data
          type: DirectoryOrCreate

      - name: dockersock
        hostPath:
          path: /var/run/docker.sock

      # os-release
      - name: os-release
        hostPath:
          path: /etc/os-release

      - name: config
        configMap:
          defaultMode: 0600
          name: filebeat-node-config

      # PEP: all in one configMap (using projections)
      - name: config-projected
        projected:   
          # 0644 -> 420, 0600 -> 384
          defaultMode: 384
          sources:

          # # pep-ca-certs-config
          # - configMap:
          #     name: pep-ca-certs-config
          #     optional: false
          #     items:
          #       - key: PepsiCoCA01.pem
          #         # must be relative
          #         path: etc/certs/PepsiCoCA01.pem
          #       - key: PepsiCoRootCA.pem
          #         # must be relative
          #         path: etc/certs/PepsiCoRootCA.pem

          # beats-entrypoint-config
          - configMap:
              name: beats-entrypoint-config
              optional: false
              items:
                - key: entrypoint.sh
                  # must be relative
                  path: bin/entrypoint.sh
                  # 0755 -> 493
                  mode: 493 


          # filebeat-node-config
          - configMap:
              name: &beats_config filebeat-node-config
              optional: false
              items:
                - key: filebeat.yml
                  # must be relative
                  path: etc/beat.yml
                - key: filebeat-processor.yml
                  # must be relative
                  path: etc/beat-processor-config.yml

      # ##
      # All Containers
      # ##
      containers:
      - name: filebeat
        image: docker.elastic.co/beats/filebeat:8.19.11
        # command:
        #   - /projected/bin/entrypoint.sh
        args:
        - --environment
        - container
        - -e
        - -c
        - /projected/etc/beat-processor-config.yml
        - -c
        - /projected/etc/beat.yml

        env:

        # All secrets from elastic-client-shared
        - name: K8S_CLUSTER_NAME
          valueFrom:
            configMapKeyRef:
              name: *beats_config
              key: K8S_CLUSTER_NAME

        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName

        # DaemonSet Do NOT set any resource limits !!!
        
        volumeMounts:

        - name: data
          mountPath: /usr/share/filebeat/data

        - name: varlibdockercontainers
          mountPath: /var/lib/docker/containers
          readOnly: true

        - name: varlog
          mountPath: /var/log
          readOnly: true

        - name: dockersock
          mountPath: "/var/run/docker.sock"

        # PEP: we need this mount to setup some environment variables
        - name: os-release
          mountPath: /tmp/etc/os-release
          readOnly: true

        # PEP: 
        - name: config-projected
          # where it is mounted
          mountPath: /projected
          readOnly: true
