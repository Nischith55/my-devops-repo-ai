apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pepsico-flna-eiv-oms-azuresql-data-service-qa-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - "pepsico-flna-eiv-oms-azuresql-data-service-qa.global.gw01.aks01.scus.nonprod.azure.intra.pepsico.com"
  http:
  - match:
    - uri:
        prefix: /flna/eiv/v1
      ignoreUriCase: true
    route:
    - destination:
        host: pepsico-flna-eiv-oms-azuresql-data-service.pep-eiap-flna-eiv-qa.svc.cluster.local
        port:
          number: 80