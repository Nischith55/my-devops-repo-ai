apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-eiap-flna-hhnext-qa-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - "pep-eiap-flna-hhnext-qa.global.gw01.aks01.scus.nonprod.azure.intra.pepsico.com"
  http:
  - match:
    - uri:
        prefix: /asnadjsvc/
      ignoreUriCase: true
    rewrite:
      uri: /
    route:
    - destination:
        host: advancedshipmentnotice.pep-eiap-flna-hhnext-qa.svc.cluster.local
        port:
          number: 80
  - match:
    - uri:
        prefix: /azureblobwoopa/
      ignoreUriCase: true
    - uri:
        prefix: /azureblobwoopa
      ignoreUriCase: true
    rewrite:
      uri: /
    route:
    - destination:
        host: pep-eip-pfna-hhnext-filestore.pep-eiap-flna-hhnext-qa.svc.cluster.local
        port:
          number: 80
  - match:
    - uri:
        prefix: /azureblob/
      ignoreUriCase: true
    rewrite:
      uri: /
    route:
    - destination:
        host: filestore.pep-eiap-flna-hhnext-qa.svc.cluster.local
        port:
          number: 80
  - match:
    - uri:
        prefix: /sfproxy/
      ignoreUriCase: true
    rewrite:
      uri: /
    route:
    - destination:
        host: peppcafapisfproxy.pep-eiap-flna-hhnext-qa.svc.cluster.local

