apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-eiap-pfna-ipp-demo-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-eiap-pfna-ipp-demo.global.gw01.aks01.scus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /greeting
    route:
    - destination:
        host: demo.pep-eiap-pfna-ipp-dev.svc.cluster.local
        port:
          number: 8080
