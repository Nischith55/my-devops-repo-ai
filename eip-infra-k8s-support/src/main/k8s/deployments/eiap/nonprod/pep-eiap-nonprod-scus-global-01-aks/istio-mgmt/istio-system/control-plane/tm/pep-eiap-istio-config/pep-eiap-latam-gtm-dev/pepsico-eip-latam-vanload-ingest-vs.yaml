apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pepsico-eip-latam-vanload-ingest-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - "pepsico-eip-latam-vanload-ingest.global.gw01.aks01.scus.nonprod.azure.intra.pepsico.com"
  http:
  - match:
    - uri:
        prefix: /api/v1/vanload
    headers:
      request:
        remove:
          - "Content-Type"
        add:
          Content-Type: "Text/Plain" 
    route:
    - destination:
        host: pepsico-eip-latam-vanload-ingest.pep-eiap-latam-gtm-dev.svc.cluster.local