  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - "pepsico-eip-latam-cle-replay.global.gw01.aks01.scus.nonprod.azure.intra.pepsico.com"
