apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pepsico-eip-latam-survey-intake-qa-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - "srvyintk.global.gw01.aks01.scus.nonprod.azure.intra.pepsico.com"
  http:
  - match:
    - uri:
        prefix: /api/v1/survey/questions
    - uri:
        prefix: /api/v1/survey/answers
    route:
    - destination:
        host: pepsico-eip-latam-survey-intake.pep-eiap-latam-gtm-qa.svc.cluster.local