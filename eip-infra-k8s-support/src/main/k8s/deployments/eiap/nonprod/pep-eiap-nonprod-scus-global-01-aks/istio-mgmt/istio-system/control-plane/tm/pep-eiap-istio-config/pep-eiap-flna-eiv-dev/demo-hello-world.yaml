apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: demo-hello-world
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - demo-hello-world.global.gw01.aks01.scus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: demo-hello-world.pep-eiap-flna-eiv-dev.svc.cluster.local
        port:
          number: 8080