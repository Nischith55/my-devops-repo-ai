apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-pcaf-api-layoutservice-dsld-msa-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-pcaf-api-layoutservice-dsld-msa.global.gw01.aks01.scus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /api/v1/dsld/msa/layout
    route:
    - destination:
        host: pep-pcaf-api-layoutservice-dsld-msa.pep-eiap-flna-gtmds-dev.svc.cluster.local
        port:
          number: 80        