---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: metricbeat
  namespace: pep-eiap-elastic-client-01
---
# permissions needed for metricbeat
# source: https://www.elastic.co/guide/en/beats/metricbeat/current/metricbeat-module-kubernetes.html
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pep-eiap-metricbeat
rules:
- apiGroups:
  - ""
  resources:
  - events
  - nodes
  - namespaces
  - pods
  # missing
  - services
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - "extensions"
  resources:
  - replicasets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - statefulsets
  - deployments
  - replicasets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - nodes/stats
  verbs:
  - get
# For metricbeat to gather the apiserver endpoint
- nonResourceURLs:
  - /metrics
  verbs:
  - get
# for leader election (mainly for the deployment option)
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - create
  - update
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pep-eiap-metricbeat
subjects:
- kind: ServiceAccount
  name: metricbeat
  namespace: pep-eiap-elastic-client-01
roleRef:
  kind: ClusterRole
  name: pep-eiap-metricbeat
  apiGroup: rbac.authorization.k8s.io
