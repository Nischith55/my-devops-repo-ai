apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: dctm-rest-uujm-vs
  namespace: pep-eiap-cgf-pepsar-dev
  labels:
      app: dctm-rest
spec:
  hosts:
  - pep-pepsar-dev-dctm-rest.aisp.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  gateways:
  - pep-eiap-cgf-pepsar-dev/pep-eiap-cgf-pepsar-dev-cv-gw
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /dctm-rest
    route:
    - destination:
        host: dctm-rest.pep-eiap-cgf-pepsar-dev.svc.cluster.local
        port:
          number: 8080
  