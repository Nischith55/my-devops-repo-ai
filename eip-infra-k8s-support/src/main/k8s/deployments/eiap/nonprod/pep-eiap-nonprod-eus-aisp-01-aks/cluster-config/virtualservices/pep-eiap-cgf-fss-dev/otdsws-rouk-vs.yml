apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: otdsws-rouk-vs
  namespace: pep-eiap-cgf-fss-dev
  labels:
      app: dfs-server
spec:
  hosts:
  - pep-fss-dev-otdsws.aisp.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  gateways:
  - pep-eiap-cgf-fss-dev/pep-eiap-cgf-fss-dev-cv-gw
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /otdsws/
    route:
    - destination:
        host: otdsws.pep-eiap-cgf-fss-dev.svc.cluster.local
        port:
          number: 80
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /otds-admin/
    route:
    - destination:
        host: otdsws.pep-eiap-cgf-fss-dev.svc.cluster.local
        port:
          number: 80
  