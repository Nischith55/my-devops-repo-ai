apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-eiap-cgf-edocs-qa-vs
  namespace: pep-eiap-cgf-edocs-qa
spec:
  hosts:
  - pep-edocs-qa.aisp.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  gateways:
  - pep-eiap-cgf-edocs-qa/pep-eiap-cgf-edocs-qa-cv-gw
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /DmMethods/servlet/DoMethod
    route:
    - destination:
        host: dcs-pg-jms-service.pep-eiap-cgf-edocs-qa.svc.cluster.local
        port:
          number: 9080
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /Acs/servlet
    route:
    - destination:
        host: dcs-pg-jms-service.pep-eiap-cgf-edocs-qa.svc.cluster.local
        port:
          number: 9080
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /dsearchadmin
    route:
    - destination:
        host: indexserver.pep-eiap-cgf-edocs-qa.svc.cluster.local
        port:
          number: 9300
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /IndexAgent
    route:
    - destination:
        host: indexagent.pep-eiap-cgf-edocs-qa.svc.cluster.local
        port:
          number: 9200

  