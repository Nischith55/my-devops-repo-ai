apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: indexserver-elvl-vs
  namespace: pep-eiap-cgf-edocs-dev
  labels:
      app: dcs-pg
spec:
  hosts:
  - pep-edocs-dev-indexserver.aisp.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  gateways:
  - pep-eiap-cgf-edocs-dev/pep-eiap-cgf-edocs-dev-cv-gw
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /dsearchadmin
    route:
    - destination:
        host: indexserver.pep-eiap-cgf-edocs-dev.svc.cluster.local
        port:
          number: 9300
  