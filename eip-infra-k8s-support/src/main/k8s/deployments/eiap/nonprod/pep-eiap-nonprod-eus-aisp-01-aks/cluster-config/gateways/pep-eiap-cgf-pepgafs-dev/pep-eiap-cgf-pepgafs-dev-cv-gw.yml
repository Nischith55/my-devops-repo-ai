apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
    name: pep-eiap-cgf-pepgafs-dev-cv-gw
    namespace: pep-eiap-cgf-pepgafs-dev
spec:
    selector:
        istio: pep-eiap-ingress-gw01
    servers:
    -   hosts:
        - dummy-passthrough-pep-eiap-cgf-pepgafs-dev.aisp.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
        name: pep-eiap-cgf-pepgafs-dev-cv-gw-tls-443
        port:
            name: https-pep-eiap-cgf-pepgafs-dev-cv-gw-tls-443
            number: 443
            protocol: https
        tls:
            cipherSuites:
            - AES128-GCM-SHA256
            - AES256-GCM-SHA384
            - ECDHE-ECDSA-AES128-SHA
            - ECDHE-ECDSA-AES256-SHA
            - ECDHE-ECDSA-AES128-GCM-SHA256
            - ECDHE-ECDSA-AES256-GCM-SHA384
            - ECDHE-RSA-AES128-GCM-SHA256
            - ECDHE-RSA-AES256-GCM-SHA384
            maxProtocolVersion: TLSV1_3
            minProtocolVersion: TLSV1_2
            mode: PASSTHROUGH
    -   hosts:
        - dummy-pep-eiap-cgf-pepgafs-dev.aisp.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
        - pep-gafs-api-service.aisp.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
        name: pep-eiap-cgf-pepgafs-dev-cv-gw-https-443
        port:
            name: https-pep-eiap-cgf-pepgafs-dev-cv-gw-443
            number: 443
            protocol: https
        tls:
            cipherSuites:
            - AES128-GCM-SHA256
            - AES256-GCM-SHA384
            - ECDHE-ECDSA-AES128-SHA
            - ECDHE-ECDSA-AES256-SHA
            - ECDHE-ECDSA-AES128-GCM-SHA256
            - ECDHE-ECDSA-AES256-GCM-SHA384
            - ECDHE-RSA-AES128-GCM-SHA256
            - ECDHE-RSA-AES256-GCM-SHA384
            credentialName: pep-eiap-nonprod-eus-aisp-01-aks-gw01-tls
            maxProtocolVersion: TLSV1_3
            minProtocolVersion: TLSV1_2
            mode: SIMPLE
    -   hosts:
        - dummy-pep-eiap-cgf-pepgafs-dev-80.aisp.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
        - pep-gafs-api-service.aisp.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
        - pepgafs.dev.mypepsico.com
        - api-pepgafs.dev.mypepsico.com
        name: pep-eiap-cgf-pepgafs-dev-cv-gw-http-80
        port:
            name: http-pep-eiap-cgf-pepgafs-dev-cv-gw-80
            number: 80
            protocol: http
        tls:
            httpsRedirect: true
    -   hosts:
        - pepgafs.dev.mypepsico.com
        name: pep-eiap-cgf-pepgafs-dev-cv-gw-3-https-443
        port:
            name: pep-eiap-cgf-pepgafs-dev-cv-gw-3-443
            number: 443
            protocol: https
        tls:
            cipherSuites:
            - AES128-GCM-SHA256
            - AES256-GCM-SHA384
            - ECDHE-ECDSA-AES128-SHA
            - ECDHE-ECDSA-AES256-SHA
            - ECDHE-ECDSA-AES128-GCM-SHA256
            - ECDHE-ECDSA-AES256-GCM-SHA384
            - ECDHE-RSA-AES128-GCM-SHA256
            - ECDHE-RSA-AES256-GCM-SHA384
            credentialName: pepgafs.dev-gw01-tls
            maxProtocolVersion: TLSV1_3
            minProtocolVersion: TLSV1_2
            mode: SIMPLE
    -   hosts:
        - api-pepgafs.dev.mypepsico.com
        name: pep-eiap-cgf-pepgafs-dev-cv-gw-4-https-443
        port:
            name: pep-eiap-cgf-pepgafs-dev-cv-gw-4-443
            number: 443
            protocol: https
        tls:
            cipherSuites:
            - AES128-GCM-SHA256
            - AES256-GCM-SHA384
            - ECDHE-ECDSA-AES128-SHA
            - ECDHE-ECDSA-AES256-SHA
            - ECDHE-ECDSA-AES128-GCM-SHA256
            - ECDHE-ECDSA-AES256-GCM-SHA384
            - ECDHE-RSA-AES128-GCM-SHA256
            - ECDHE-RSA-AES256-GCM-SHA384
            credentialName: api-pepgafs.dev-gw01-tls
            maxProtocolVersion: TLSV1_3
            minProtocolVersion: TLSV1_2
            mode: SIMPLE
