---
apiVersion: v1
kind: Pod
metadata:
  name: tf-notebook2
  namespace: pep-eiap-ops-admin
  labels:
    app: tf-notebook
spec:
  tolerations:
    - key: nvidia.com/gpu
      operator: Equal
      value: Exists
  securityContext:
    fsGroup: 0
  containers:
    - name: tf-notebook2
      image: tensorflow/tensorflow:latest-gpu-jupyter
      resources:
        limits:
          nvidia.com/gpu: 1
      ports:
        - containerPort: 8888
          name: notebook
