apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: da-svc-erab-vs
  namespace: pep-eiap-cgf-pepsar-dev
  labels:
      app: da-app
spec:
  hosts:
  - pep-pepsar-dev-da-svc.aisp.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  gateways:
  - pep-eiap-cgf-pepsar-dev/pep-eiap-cgf-pepsar-dev-cv-gw
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /da
    route:
    - destination:
        host: da-svc.pep-eiap-cgf-pepsar-dev.svc.cluster.local
        port:
          number: 8080
  