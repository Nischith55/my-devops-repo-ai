apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
    name: pep-eiap-cgf-edocs-dev-cv-gw
    namespace: pep-eiap-cgf-edocs-dev
spec:
    selector:
        istio: pep-eiap-ingress-gw01
    servers:
    -   hosts:
        - dummy-passthrough-pep-eiap-cgf-edocs-dev.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
        name: pep-eiap-cgf-edocs-dev-cv-gw-tls-443
        port:
            name: https-pep-eiap-cgf-edocs-dev-cv-gw-tls-443
            number: 443
            protocol: https
        tls:
            cipherSuites:
            - AES128-GCM-SHA256
            - AES256-GCM-SHA384
            - ECDHE-ECDSA-AES128-SHA
            - ECDHE-ECDSA-AES256-SHA
            - ECDHE-ECDSA-AES128-GCM-SHA256
            - ECDHE-ECDSA-AES256-GCM-SHA384
            - ECDHE-RSA-AES128-GCM-SHA256
            - ECDHE-RSA-AES256-GCM-SHA384
            maxProtocolVersion: TLSV1_3
            minProtocolVersion: TLSV1_2
            mode: PASSTHROUGH
    -   hosts:
        - dummy-pep-eiap-cgf-edocs-dev-443.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
        #- pep-edocs-dev-dcs-pg-jms-service.aisp.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
        #- pep-edocs-dev-indexserver.aisp.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
        #- pep-edocs-dev-indexagent.aisp.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
        - pep-edocs-dev.aisp.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
        name: pep-eiap-cgf-edocs-dev-cv-gw-https-443
        port:
            name: https-pep-eiap-cgf-edocs-dev-cv-gw-443
            number: 443
            protocol: https
        tls:
            cipherSuites:
            - AES128-GCM-SHA256
            - AES256-GCM-SHA384
            - ECDHE-ECDSA-AES128-SHA
            - ECDHE-ECDSA-AES256-SHA
            - ECDHE-ECDSA-AES128-GCM-SHA256
            - ECDHE-ECDSA-AES256-GCM-SHA384
            - ECDHE-RSA-AES128-GCM-SHA256
            - ECDHE-RSA-AES256-GCM-SHA384
            credentialName: pep-eiap-nonprod-eus-aisp-01-aks-gw01-tls
            maxProtocolVersion: TLSV1_3
            minProtocolVersion: TLSV1_2
            mode: SIMPLE
    -   hosts:
        - dummy-pep-eiap-cgf-edocs-dev-80.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
        #- pep-edocs-dev-dcs-pg-jms-service.aisp.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
        #- pep-edocs-dev-indexserver.aisp.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
        #- pep-edocs-dev-indexagent.aisp.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
        - pep-edocs-dev.aisp.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
        name: pep-eiap-cgf-edocs-dev-cv-gw-http-80
        port:
            name: http-pep-eiap-cgf-edocs-dev-cv-gw-80
            number: 80
            protocol: http
        tls:
            httpsRedirect: true
    -   hosts:
        - pep-edocs-dev-csext-dcs-pg.aisp.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
        name: pep-eiap-cgf-edocs-dev-cv-gw-tcp-1591
        port:
            name: grpc-pep-eiap-cgf-edocs-dev-cv-gw-1591
            number: 1591
            protocol: TCP
