apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: dfs-server-guny-vs
  namespace: pep-eiap-cgf-pepsar-dev
  labels:
      app: dfs-server
spec:
  hosts:
  - pep-pepsar-dev-dfs-server.aisp.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  gateways:
  - pep-eiap-cgf-pepsar-dev/pep-eiap-cgf-pepsar-dev-cv-gw
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /dfs
    route:
    - destination:
        host: dfs-server.pep-eiap-cgf-pepsar-dev.svc.cluster.local
        port:
          number: 8080
  