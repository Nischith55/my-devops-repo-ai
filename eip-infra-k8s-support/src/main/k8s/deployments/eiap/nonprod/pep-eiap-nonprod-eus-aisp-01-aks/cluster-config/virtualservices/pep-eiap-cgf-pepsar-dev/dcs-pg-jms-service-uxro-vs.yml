apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: dcs-pg-jms-service-uxro-vs
  namespace: pep-eiap-cgf-pepsar-dev
  labels:
      app: dcs-pg
spec:
  hosts:
  - pep-pepsar-dev-dcs-pg-jms-service.aisp.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  gateways:
  - pep-eiap-cgf-pepsar-dev/pep-eiap-cgf-pepsar-dev-cv-gw
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /DmMethods/servlet/DoMethod
    route:
    - destination:
        host: dcs-pg-jms-service.pep-eiap-cgf-pepsar-dev.svc.cluster.local
        port:
          number: 9080
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /ACS/servlet
    route:
    - destination:
        host: dcs-pg-jms-service.pep-eiap-cgf-pepsar-dev.svc.cluster.local
        port:
          number: 9080
  