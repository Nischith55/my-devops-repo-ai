---
# ##
# - Setup heartbeat configuration (note: This is a Deployment) so only
#   cluster wide metrics are applicable
# ##
apiVersion: v1
kind: ConfigMap
metadata:
  # NOTE: change this for instance of elastic running
  name: nonprod-eus-global-01-aks-k8s-heartbeat-config
  namespace: pep-eiap-elastic-client-01

data:

  # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  # heartbeat environment variables change here
  # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  K8S_CLUSTER_NAME: pep-eiap-nonprod-eus-global-01-aks
 
  # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  # heartbeat processor stuff
  # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  heartbeat-processor.yml: |

    # ---------------------------------------------------------------------
    # Common Processors across all beats deployment
    # ---------------------------------------------------------------------

    processors:

    # ~~
    # Add EIAP fields
    # ~~
    - add_fields:
        target: eiap
        fields:
          cluster_name: ${K8S_CLUSTER_NAME}
    - add_fields:
       fields:
         ls-destination: "EUS"
         pep-aks-cluster: ${K8S_CLUSTER_NAME}
    - add_tags:
       tags: ["NonProd-SCUS-Shared", "retain-logs"]
    - script:
       lang: javascript
       source: >
         function process(event) {
           event.Put("fields.legacy-index", "hb-aks-" + event.Get("fields.pep-aks-cluster"));
           return event;
         }
    # ~~
    # Logging
    # ~~
    logging:
      level: INFO
      metrics:
        # this will dump metrics sent
        enabled: true
        period: 1m

  # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  # heartbeat standard k8s stuff
  # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  heartbeat.yml: |

    # ---------------------------------------------------------------------
    # Setup heartbeat configuration (Common K8S stuff)
    # ---------------------------------------------------------------------
    heartbeat:

      # ~~
      # modules
      # ~~
      modules:

      # Since this is a cluster wide scoped heartbeat disable the system
      # module which is enabled by default
      - module: system
        enabled: false

      # ~~
      # Autodiscover kubernetes cluster wide heartbeats
      # ~~
      autodiscover:

        providers:
        # Autodiscover nodes (is ssh right?)
        - type: kubernetes
          scope: cluster
          # first get the node resource
          resource: node
          node: ${NODE_NAME}
          period: 5m
          hints:
            enabled: true
          templates:
            - condition: ~
              config:
                - hosts:
                  - ${data.host}:22
                  name: ${data.kubernetes.node.name}
                  schedule: '@every 1m'
                  timeout: 5s
                  type: tcp

        # Autodiscover services
        # Important: hints enabled which means annotations must be present
        - type: kubernetes
          resource: service
          scope: cluster
          node: ${NODE_NAME}
          period: 1m
          hints:
            enabled: true

        # Autodiscover pods
        # Important: hints enabled which means annotations must be present
        - type: kubernetes
          resource: pod
          scope: cluster
          node: ${NODE_NAME}
          period: 1m
          hints:
            enabled: true

        # Autodiscover pods that have the istio-proxy sidecar
        - type: kubernetes
          resource: pod
          scope: cluster
          node: ${NODE_NAME}
          period: 1m
          templates:
          - condition:
              equals:
                kubernetes.container.name: istio-proxy
            config:
            - type: http
              name: istio-healthcheck
              urls:
              - http://${data.kubernetes.pod.ip}:15021/healthz/ready
              schedule: "@every 30s"
              timeout: 1s
    output.logstash:
      hosts: ["pepwap23142.corp.pep.pvt:5045", "pepwap23143.corp.pep.pvt:5045", "pepwap23144.corp.pep.pvt:5045"]
      loadbalance: true
      worker: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  # name format: <output-eck-cluster>-k8s
  name: &app_name nonprod-eus-global-01-aks-k8s-heartbeat
  namespace: pep-eiap-elastic-client-01
  labels:
    app.kubernetes.io/name: *app_name
    app.kubernetes.io/version: &vers 7.17.1
    app: *app_name
    # match the  ES server version (beats is not backward compatible)
    version: *vers
spec:

  # For cluster wide heartbeat we use recreate, so we don't run into locks
  strategy:
    type: Recreate

  selector:
    matchLabels:
      app.kubernetes.io/name: *app_name
      app.kubernetes.io/version: *vers

  template:

    metadata:
      labels:
        app.kubernetes.io/name: *app_name
        app.kubernetes.io/version: *vers

    spec:
      # PEP:
      # - Deployment run only on system node pool taints
      # - also lock down the node selector
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.azure.com/mode: system
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists

      serviceAccountName: heartbeat
      # some older Beat versions are depending on this settings presence
      # in k8s context
      automountServiceAccountToken: true
      securityContext:
        runAsUser: 0

      # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
      # All volumes
      # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
      volumes:

      # PEP: all in one configMap (using projections)
      - name: config-projected
        projected:
          # 0644 -> 420, 0600 -> 384
          defaultMode: 384
          sources:

          # pep-ca-certs-config
          - configMap:
              name: pep-ca-certs-config
              optional: false
              items:
                - key: PepsiCoCA01.pem
                  # must be relative
                  path: etc/certs/PepsiCoCA01.pem
                - key: PepsiCoRootCA.pem
                  # must be relative
                  path: etc/certs/PepsiCoRootCA.pem

          - configMap:
              name: &beats_config nonprod-eus-global-01-aks-k8s-heartbeat-config
              optional: false
              items:
                - key: heartbeat.yml
                  # must be relative
                  path: etc/beat.yml
                - key: heartbeat-processor.yml
                  # must be relative
                  path: etc/beat-processor-config.yml

      containers:
      # PEP: args removed sysfs it's a deployment
      - name: heartbeat
        image: docker.elastic.co/beats/heartbeat:8.5.2
        args:
        - -environment
        - container
        - -e
        - -c
        - /projected/etc/beat-processor-config.yml
        - -c
        - /projected/etc/beat.yml
        # - -d
        # - "processors"
        # - "monitoring"
        # - index-management,processors

        resources:
          # limits:
          #   cpu: 100m
          #   memory: 200Mi
          requests:
            # cpu: 200m
            memory: 512Mi
        env:

        # All environment variables from beats-shared-env-config
        - name: K8S_CLUSTER_NAME
          valueFrom:
            configMapKeyRef:
              name: *beats_config
              key: K8S_CLUSTER_NAME


        # PEP: change
        - name: KUBE_STATE_METRICS_NAMESPACE
          value: monitoring

        # PEP: change
        - name: KUBE_STATE_METRICS_PORT
          value: "8080"

        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName

        - name: NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP

        # ~~
        # volumemounts
        # ~~
        volumeMounts:
        # PEP:
        - name: config-projected
          # where it is mounted
          mountPath: /projected
          readOnly: true