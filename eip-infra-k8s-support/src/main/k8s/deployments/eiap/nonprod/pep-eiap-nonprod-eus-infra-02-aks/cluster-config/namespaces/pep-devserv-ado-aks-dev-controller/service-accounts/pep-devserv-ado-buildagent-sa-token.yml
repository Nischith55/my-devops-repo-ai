apiVersion: v1
kind: Secret
metadata:
  name: pep-devserv-ado-buildagent-token  # Naming convention followed is ServiceAccountName-token
  namespace: pep-devserv-ado-aks-dev-controller    # Namespace where the service account is created
  annotations:
    kubernetes.io/service-account.name: "pep-devserv-ado-buildagent" # Service Account name to map the token
type: kubernetes.io/service-account-token  # Secret type should be this