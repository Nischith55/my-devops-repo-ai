---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: kubernetes-dashboard-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
    - istio-system/istio-in-gateway-01
  hosts:
  - pep-eiap-k8s-dashboard.infra.gw01.aks02.eus.nonprod.azure.intra.pepsico.com
  tls:
    - match:
      - port: 443
        sniHosts:
          - pep-eiap-k8s-dashboard.infra.gw01.aks02.eus.nonprod.azure.intra.pepsico.com
      route:
        - destination:
            host: kubernetes-dashboard.kubernetes-dashboard.svc.cluster.local
            port: 
              number: 443
