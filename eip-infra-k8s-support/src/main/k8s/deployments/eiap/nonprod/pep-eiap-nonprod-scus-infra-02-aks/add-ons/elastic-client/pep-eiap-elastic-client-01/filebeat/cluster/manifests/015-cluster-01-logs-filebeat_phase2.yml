# ##
# Non-ECK deployment.
# IMPORTANT:
# - This is meant to send all AKS logs to our primary cluster (cluster-01)
# ##
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: filebeat
  labels:
    k8s-app: filebeat
rules:
- apiGroups: [""] # "" indicates the core API group
  resources:
  - namespaces
  - pods
  - nodes
  verbs:
  - get
  - watch
  - list
- apiGroups: ["apps"]
  resources:
    - replicasets
  verbs: ["get", "list", "watch"]
- apiGroups: ["batch"]
  resources:
    - jobs
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: filebeat
  # should be the namespace where filebeat is running
  namespace: pep-eiap-elastic-client-01 #Namespace to be update
  labels:
    k8s-app: filebeat
rules:
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: filebeat-kubeadm-config
  namespace: pep-eiap-elastic-client-01 #Namespace to be update
  labels:
    k8s-app: filebeat
rules:
  - apiGroups: [""]
    resources:
      - configmaps
    resourceNames:
      - kubeadm-config
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: filebeat
subjects:
- kind: ServiceAccount
  name: filebeat
  namespace: pep-eiap-elastic-client-01 #Namespace to be update
roleRef:
  kind: ClusterRole
  name: filebeat
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: filebeat
  namespace: pep-eiap-elastic-client-01 #Namespace to be update
subjects:
  - kind: ServiceAccount
    name: filebeat
    namespace: pep-eiap-elastic-client-01 #Namespace to be update
roleRef:
  kind: Role
  name: filebeat
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: filebeat-kubeadm-config
  namespace: pep-eiap-elastic-client-01 #Namespace to be update
subjects:
  - kind: ServiceAccount
    name: filebeat
    namespace: pep-eiap-elastic-client-01 #Namespace to be update
roleRef:
  kind: Role
  name: filebeat-kubeadm-config
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-01-logs-filebeat-config
  namespace: pep-eiap-elastic-client-01
data:

  K8S_CLUSTER_NAME: pep-eiap-nonprod-scus-infra-02-aks

  filebeat-processor.yml: |

    processors:

    - add_fields:
        #target: eiap
        fields:
          cluster_name: ${K8S_CLUSTER_NAME}
          pep-aks-cluster: ${K8S_CLUSTER_NAME}
    - add_cloud_metadata:
        when:
          equals:
            event.module: system
    - add_host_metadata: {}
    - add_kubernetes_metadata:
        host: ${NODE_NAME}
        default_indexers:
          enabled: false
        default_matchers:
          enabled: false

    - add_tags:
        tags: ["NonProd-SCUS-Shared", "retain-logs"]
    - script:
        lang: javascript
        source: >
          function process(event) {
            event.Put("fields.sn-application", "aks-pep-eiap-nonprod-scus-infra-02-aks" + "-" + event.Get("kubernetes.namespace"));
            return event;
          }
    # ~~
    # Logging
    # ~~
    logging:
      level: INFO
      metrics:
        enabled: true

  filebeat.yml: |-

    # --------------------
    # All outputs
    # IMPORTANT:
    # - This is for stack monitoring gather all ES, Beats etc.
    # - By default they go to monitoring-* index CANNOT configure it
    # --------------------
    filebeat:
      modules:
      - module: system
        syslog:
          enabled: true
          # Default: Configured paths: [/var/log/messages* /var/log/syslog*]
          var:
            paths:
            - /var/log/syslog
            - /var/log/messages
            - /var/log/waagent.log
            - /var/log/azure/*.log
        auth:
          enabled: true
          # Default: Configured paths: [/var/log/auth.log* /var/log/secure*]
          var:
            paths:
            - /var/log/auth.log

      # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
      #  autodiscover via hints (pod annotations)
      # NOTE: Only stack monitoring.
      # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
      autodiscover:
        providers:
        - type: kubernetes
          scope: node
          resource: pod
          node: ${NODE_NAME}
          hints:
            enabled: true
          templates:
            - condition:
                not:
                  has_fields:
                  # ignore all logs from elastic pods since we are shipping
                  # it to monitoring cluster
                  - kubernetes.labels.common.k8s.elastic.co/type
          
              config:
              - type: container
                paths:
                - /var/log/containers/*${data.kubernetes.container.id}.log
                multiline:
                  type: pattern
                  pattern: '^(\[|[0-9]{4}-[0-9]{2}-[0-9]{2} )'
                  negate: true
                  match: after

    setup.template.name: "aks-data-stream-3shards"
    setup.template.pattern: "aks-pep_eiap_nonprod_scus_infra_02_aks*"

    setup.ilm.enabled: false     
    #setup.template.overwrite: true
    output.elasticsearch:
        hosts: [https://3825028849b946d3a380f6136dcd7c3a.privatelink.southcentralus.azure.elastic-cloud.com:9243]
        api_key: "GnuNB5MBWuezjPg1DKep:OPckBJB2QHOYgXBnfTHhZw"
        index: "%{[fields][sn-application]}"
        worker: 2
        bulk_max_size: 500
        ssl.verification_mode: none
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: elastic-beat-autodiscover
rules:
- apiGroups: [""]
  resources:
  - namespaces
  - pods
  - nodes
  verbs:
  - get
  - watch
  - list
- apiGroups: ["apps"]
  resources:
  - replicasets
  verbs: ["list", "watch"]
- apiGroups: ["batch"]
  resources:
  - jobs
  verbs: ["list", "watch"]
---

apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: &app_name cluster-01-logs-filebeat
  namespace: pep-eiap-elastic-client-01
  labels:
    k8s-app: *app_name
    app: *app_name
    version: &vers 8.19.11
spec:

  selector:
    matchLabels:
      app: *app_name
      version: *vers

  template:

    metadata:
      labels:
        app: *app_name
        version: *vers

    spec:
      hostAliases:
      - ip: "172.20.34.198"
        hostnames:
        - "3825028849b946d3a380f6136dcd7c3a.privatelink.southcentralus.azure.elastic-cloud.com"

      # # PEP: DaemonSet we need to run it on EVERY node. so tolerate all
      # # taints
      tolerations:
      - operator: Exists
      nodeSelector:
        kubernetes.io/os: linux

      serviceAccountName: filebeat
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 0

      # ~~~
      # All volumes
      # ~~~
      volumes:

      # PEP: all in one configMap (using projections)
      - name: config-projected
        projected:
          # 0644 -> 420, 0600 -> 384
          defaultMode: 384
          sources:

          # pep-ca-certs-config
          - configMap:
              name: pep-ca-certs-config
              optional: false
              items:
                - key: PepsiCoCA01.pem
                  # must be relative
                  path: etc/certs/PepsiCoCA01.pem
                - key: PepsiCoRootCA.pem
                  # must be relative
                  path: etc/certs/PepsiCoRootCA.pem

          - configMap:
              name: &beats_config cluster-01-logs-filebeat-config
              optional: false
              items:
                - key: filebeat.yml
                  # must be relative
                  path: etc/beat.yml
                - key: filebeat-processor.yml
                  # must be relative
                  path: etc/beat-processor-config.yml

      - name: varlibdockercontainers
        hostPath:
          path: /var/lib/docker/containers

      - name: varlog
        hostPath:
          path: /var/log

      # data folder stores a registry of read status for all files,
      # so we don't send everything again on a Filebeat pod restart
      - name: data
        hostPath:
          path: /var/lib/pep-eiap-elastic-client-01/cluster-01-logs-filebeat/filebeat-data
          type: DirectoryOrCreate

      - name: dockersock
        hostPath:
          path: /var/run/docker.sock

      # ##
      # All Containers
      # ##
      containers:
      - name: filebeat
        image: docker.elastic.co/beats/filebeat:8.19.11
        args:
        - --environment
        - container
        - -e
        - -c
        - /projected/etc/beat-processor-config.yml
        - -c
        - /projected/etc/beat.yml
        # - -d
        # - "monitoring"
        # - index-management,processors

        resources:
          # limits:
          #   cpu: 100m
          #   memory: 200Mi
          requests:
            # cpu: 200m
            memory: 512Mi

        env:

        # All environment variables from beats-shared-env-config
        - name: K8S_CLUSTER_NAME
          valueFrom:
            configMapKeyRef:
              name: *beats_config
              key: K8S_CLUSTER_NAME


        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
              
        - name: NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP

        volumeMounts:

        # PEP:
        - name: config-projected
          # where it is mounted
          mountPath: /projected
          readOnly: true

        - name: data
          mountPath: /usr/share/filebeat/data

        - name: varlibdockercontainers
          mountPath: /var/lib/docker/containers
          readOnly: true

        - name: varlog
          mountPath: /var/log
          readOnly: true

        - name: dockersock
          mountPath: "/var/run/docker.sock"

