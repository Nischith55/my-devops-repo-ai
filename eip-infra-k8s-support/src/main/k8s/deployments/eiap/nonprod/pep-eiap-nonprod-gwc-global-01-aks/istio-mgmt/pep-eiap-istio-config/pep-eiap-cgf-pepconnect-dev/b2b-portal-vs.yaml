apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: b2b-portal-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - b2b-portal.global.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: b2b-portal.pep-eiap-cgf-pepconntur-dev.svc.cluster.local
        port:
          number: 80