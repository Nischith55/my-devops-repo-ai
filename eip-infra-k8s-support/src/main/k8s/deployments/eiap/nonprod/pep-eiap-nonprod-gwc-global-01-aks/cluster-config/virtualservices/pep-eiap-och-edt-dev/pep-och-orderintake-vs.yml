apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-och-orderintake
  name: pep-och-orderintake-vs
  namespace: pep-eiap-och-edt-dev
spec:
  gateways:
  - pep-eiap-och-edt-dev/pep-eiap-och-edt-dev-cv-gw
  hosts:
  - pep-och-orderintake.global.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /v1/api/orders
    route:
    - destination:
        host: pep-och-orderintake.pep-eiap-och-edt-dev.svc.cluster.local
        port:
          number: 80
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /v2/api/orders
    route:
    - destination:
        host: pep-och-orderintake.pep-eiap-och-edt-dev.svc.cluster.local
        port:
          number: 80
