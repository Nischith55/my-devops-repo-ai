apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: appruntimedashboard-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - appruntimedashboard.global.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: appruntimedashboard.pep-eiap-cgf-apprt-dev.svc.cluster.local
        port:
          number: 80