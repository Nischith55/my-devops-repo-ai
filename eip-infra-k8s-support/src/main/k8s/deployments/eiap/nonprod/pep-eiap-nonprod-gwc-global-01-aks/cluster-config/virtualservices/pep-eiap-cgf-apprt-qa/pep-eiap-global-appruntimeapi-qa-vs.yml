apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-eiap-global-appruntimeapi
  name: pep-eiap-global-appruntimeapi-qa-vs
  namespace: pep-eiap-cgf-apprt-qa
spec:
  gateways:
  - pep-eiap-cgf-apprt-qa/pep-eiap-cgf-apprt-qa-cv-gw
  hosts:
  - pep-eiap-global-appruntimeapi-qa.global.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /apprtqa-api
    route:
    - destination:
        host: pep-eiap-global-appruntimeapi.pep-eiap-cgf-apprt-qa.svc.cluster.local
        port:
          number: 80
