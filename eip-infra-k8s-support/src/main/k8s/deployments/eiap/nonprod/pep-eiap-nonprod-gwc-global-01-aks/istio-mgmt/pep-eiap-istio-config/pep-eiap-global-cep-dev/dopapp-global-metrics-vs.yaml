apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: dopapp-global-metrics-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - dopapp-global-metrics.global.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: dopapp-global-metrics.pep-eiap-global-cep-dev.svc.cluster.local
        port:
          number: 80 
          