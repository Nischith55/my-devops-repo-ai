    app: pep-gscaf-global-producer
  name: pep-gscaf-global-producer-qa-vs
  namespace: pep-eiap-europe-eugscafqa-dev
spec:
  gateways:
  - pep-eiap-europe-eugscafqa-dev/pep-eiap-europe-eugscafqa-dev-cv-gw
  hosts:
  - pep-gscaf-global-producer-qa.global.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
