apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-och-ochbireportauth-qa-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-och-ochbireportauth-qa.global.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-och-ochbireportauth.pep-eiap-och-edt-qa.svc.cluster.local
        port:
          number: 80
    corsPolicy:
      allowOrigins:
      - exact: https://pep-och-falloutmanagement-qa.global.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
      - exact: https://pep-och-ui-qa.global.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
      allowMethods:
      - POST
      - GET
      - PUT 
      - PATCH
      - DELETE 
      - OPTIONS
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Content-Type
      - Link 
      exposeHeaders:
      - x-total-count    
      - x-source         
    