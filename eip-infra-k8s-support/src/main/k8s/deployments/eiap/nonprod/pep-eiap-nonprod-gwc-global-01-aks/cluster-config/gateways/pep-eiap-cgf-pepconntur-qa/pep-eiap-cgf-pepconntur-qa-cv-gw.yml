apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: pep-eiap-cgf-pepconntur-qa-cv-gw
  namespace: pep-eiap-cgf-pepconntur-qa
spec:
  selector:
    istio: pep-eiap-ingress-gw01
  servers:
  - hosts:
    - dummy-passthrough-pep-eiap-cgf-pepconntur-qa.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    name: pep-eiap-cgf-pepconntur-qa-cv-gw-tls-443
    port:
      name: https-pep-eiap-cgf-pepconntur-qa-cv-gw-tls-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - b2b-portal-qa.global.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    - pepsico-pepconnect-b2bweb-turkey-qa.global.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    name: pep-eiap-cgf-pepconntur-qa-cv-gw-https-443
    port:
      name: https-pep-eiap-cgf-pepconntur-qa-cv-gw-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-eiap-nonprod-gwc-global-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - b2b-portal-qa.global.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    - pepsico-pepconnect-b2bweb-turkey-qa.global.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
    - dukkan-senin.qa.pepsico.com
    name: pep-eiap-cgf-pepconntur-qa-cv-gw-http-80
    port:
      name: http-pep-eiap-cgf-pepconntur-qa-cv-gw-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true
  - hosts:
    - dukkan-senin.qa.pepsico.com
    name: pep-eiap-cgf-pepconntur-qa-cv-gw-1-https-443
    port:
      name: https-pep-eiap-cgf-pepconntur-qa-cv-gw-1-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-eiap-nonprod-gwc-global-dukkan-senin-qa-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE

