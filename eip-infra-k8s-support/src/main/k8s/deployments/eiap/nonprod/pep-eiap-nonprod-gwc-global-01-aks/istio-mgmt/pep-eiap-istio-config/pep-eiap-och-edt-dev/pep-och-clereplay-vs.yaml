apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-och-clereplay-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-och-clereplay.global.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
    - uri:
        prefix: /api/v1
      ignoreUriCase: true
    - uri:
        prefix: /management/
    route:
    - destination:
        host: pep-och-clereplay.pep-eiap-och-edt-dev.svc.cluster.local
        port:
          number: 80     