apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pepsico-eip-global-anm-ui-v3-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pepsico-eip-global-anm-ui-v3.global.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pepsico-eip-global-anm-ui-v3.pep-eiap-europe-anm-dev.svc.cluster.local
        port:
          number: 80