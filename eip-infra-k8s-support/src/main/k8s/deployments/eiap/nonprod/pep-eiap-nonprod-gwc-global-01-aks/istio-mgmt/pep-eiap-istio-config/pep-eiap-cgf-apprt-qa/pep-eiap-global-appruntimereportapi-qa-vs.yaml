apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-eiap-global-appruntimereportapi-qa-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-eiap-global-appruntimereportapi-qa.global.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /apprtqa-report-api
    route:
    - destination:
        host: pep-eiap-global-appruntimereportapi.pep-eiap-cgf-apprt-qa.svc.cluster.local
        port:
          number: 80