apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pepsico-pepconnect-b2bweb-spain
  name: pepsico-pepconnect-b2bweb-spain-vs
  namespace: pep-eiap-cgf-pepconnect-dev
spec:
  gateways:
  - pep-eiap-cgf-pepconnect-dev/pep-eiap-cgf-pepconnect-dev-cv-gw
  hosts:
  - pepsico-pepconnect-b2bweb-spain.global.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pepsico-pepconnect-b2bweb-spain.pep-eiap-cgf-pepconnect-dev.svc.cluster.local
        port:
          number: 80
