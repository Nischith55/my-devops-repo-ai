apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: b2b-portal
  name: b2b-portal-qa-vs
  namespace: pep-eiap-cgf-pepconntur-qa
spec:
  gateways:
  - pep-eiap-cgf-pepconntur-qa/pep-eiap-cgf-pepconntur-qa-cv-gw
  hosts:
  - b2b-portal-qa.global.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: b2b-portal.pep-eiap-cgf-pepconntur-qa.svc.cluster.local
        port:
          number: 80
