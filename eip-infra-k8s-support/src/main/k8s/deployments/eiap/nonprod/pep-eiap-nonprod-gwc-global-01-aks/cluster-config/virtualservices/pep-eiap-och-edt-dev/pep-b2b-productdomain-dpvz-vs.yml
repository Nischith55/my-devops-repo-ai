apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-b2b-productdomain-dpvz-vs
  namespace: pep-eiap-och-edt-dev
  labels:
      app: pep-b2b-productdomain
spec:
  hosts:
  - pep-b2b-productdomain-dev-01.global.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
  gateways:
  - pep-eiap-och-edt-dev/pep-eiap-och-edt-dev-cv-gw
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-b2b-productdomain.pep-eiap-och-edt-dev.svc.cluster.local
        port:
          number: 80
    corsPolicy:
      allowOrigins:
      - exact: https://apim-eu.dev.mypepsico.com
      allowMethods:
      - GET
      - PUT
      - POST
      - DELETE
      - OPTIONS
  
      allowCredentials: true
       
  