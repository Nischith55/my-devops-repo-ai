apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-och-orderstore
  name: pep-och-orderstore-v1-qa-vs
  namespace: pep-eiap-och-edt-qa
spec:
  gateways:
  - pep-eiap-och-edt-qa/pep-eiap-och-edt-qa-cv-gw
  hosts:
  - pep-och-orderstore-v1-qa.global.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /v1/api/orders
    - ignoreUriCase: true
      uri:
        prefix: /v2/api/orders
    route:
    - destination:
        host: pep-och-orderstore.pep-eiap-och-edt-qa.svc.cluster.local
        port:
          number: 80
