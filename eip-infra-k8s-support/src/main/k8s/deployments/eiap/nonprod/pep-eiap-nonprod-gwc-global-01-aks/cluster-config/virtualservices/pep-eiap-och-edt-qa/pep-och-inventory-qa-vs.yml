apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-och-inventory
  name: pep-och-inventory-qa-vs
  namespace: pep-eiap-och-edt-qa
spec:
  gateways:
  - pep-eiap-och-edt-qa/pep-eiap-och-edt-qa-cv-gw
  hosts:
  - pep-och-inventory-qa.global.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
  http:
  - corsPolicy:
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Content-Type
      - Link
      - Access-Control-Allow-Origin
      allowMethods:
      - POST
      - GET
      - PUT
      - DELETE
      - OPTIONS
      allowOrigins:
      - exact: https://pep-och-ops-ui-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
      - exact: https://pep-och-developerportal-ui-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
      - exact: https://pep-och-developerportal-ui.global.gw01.aks01.scus.preprod.azure.intra.pepsico.com
      - exact: https://pep-och-ops-ui.global.gw01.aks01.scus.preprod.azure.intra.pepsico.com
      - exact: https://pep-och-developerportal-ui.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
      - exact: https://pep-och-ops-ui.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
      exposeHeaders:
      - x-total-count
    match:
    - ignoreUriCase: true
      uri:
        prefix: /v1/api
    - ignoreUriCase: true
      uri:
        prefix: /api/inventory-kafka
    route:
    - destination:
        host: pep-och-inventory.pep-eiap-och-edt-qa.svc.cluster.local
        port:
          number: 80
