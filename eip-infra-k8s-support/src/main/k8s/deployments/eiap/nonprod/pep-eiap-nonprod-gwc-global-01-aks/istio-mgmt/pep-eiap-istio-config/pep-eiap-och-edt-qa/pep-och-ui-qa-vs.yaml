apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-och-ui-qa-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-och-ui-qa.global.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - uri:
        prefix: /
      ignoreUriCase: true
    route:
    - destination:
        host: pep-och-ui.pep-eiap-och-edt-qa.svc.cluster.local
        port:
          number: 80     