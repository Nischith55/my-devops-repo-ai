apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-och-invoice
  name: pep-och-invoice-vs
  namespace: pep-eiap-och-edt-dev
spec:
  gateways:
  - pep-eiap-och-edt-dev/pep-eiap-och-edt-dev-cv-gw
  hosts:
  - pep-och-invoice.global.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
  http:
  - corsPolicy:
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Content-Type
      - Access-Control-Allow-Origin
      allowMethods:
      - POST
      - GET
      - PUT
      - DELETE
      allowOrigins:
      - exact: https://pep-och-ops-ui.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
      exposeHeaders:
      - x-total-count
    match:
    - ignoreUriCase: true
      uri:
        prefix: /v1/api
    route:
    - destination:
        host: pep-och-invoice.pep-eiap-och-edt-dev.svc.cluster.local
        port:
          number: 80
