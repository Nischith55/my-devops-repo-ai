apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sRequiredProbes
metadata:
  name: must-have-probes
spec:
  enforcementAction: deny
  match:
    excludedNamespaces:
    - calico-system
    - cattle-fleet-system
    - cattle-gatekeeper-system
    - cattle-impersonation-system
    - cattle-system
    - istio-operator
    - istio-system
    - kube-node-lease
    - kube-public
    - kube-system
    - kubecost
    - kubernetes-dashboard
    - monitoring
    - msi-acrpull-system
    - observability
    - twistlocknp
    - tigera-operator
    - pep-eiap-ops-admin
    - pep-eiap-global-infra-dev
    - pep-eiap-istio-config
    - pep-eiap-elastic-client-01
    - pep-eiap-elastic-client-02
    - pep-eiap-elastic-cluster-01
    - pep-eiap-elastic-cluster-02
    - pep-eiap-elastic-monitor-01
    - pep-eiap-global-devsecops-dev
    - cert-manager-system
    - reloader
    - flux-system
    - flagger
    - policy-system
    - gitops-connector-system
    # RITM4319394 - Probe-exempt for namespaces "och-edt" qa and dev
    - pep-eiap-och-edt-dev
    - pep-eiap-och-edt-qa
    - pep-eiap-snowdiscovery-dev
    - argocd
    kinds:
    - apiGroups:
      - ""
      kinds:
      - Pod
    labelSelector:
      matchExpressions:
      - key: app
        operator: Exists
    scope: '*'
  parameters:
    probeTypes:
    - tcpSocket
    - httpGet
    - exec
    probes:
    - readinessProbe