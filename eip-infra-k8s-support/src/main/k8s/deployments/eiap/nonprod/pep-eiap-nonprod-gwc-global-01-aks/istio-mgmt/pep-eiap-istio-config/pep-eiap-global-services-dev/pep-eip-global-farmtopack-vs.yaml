apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-eip-global-farmtopack-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-eip-global-farmtopack.global.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
