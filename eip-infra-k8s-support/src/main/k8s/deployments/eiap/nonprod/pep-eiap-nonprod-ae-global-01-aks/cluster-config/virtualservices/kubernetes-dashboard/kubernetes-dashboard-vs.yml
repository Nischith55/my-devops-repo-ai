apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  annotations: {}
  labels:
    app: undefined
  name: kubernetes-dashboard-vs
  namespace: kubernetes-dashboard
spec:
  gateways:
  - kubernetes-dashboard/kubernetes-dashboard-cv-gw
  hosts:
  - pep-eiap-k8s-dashboard.global.gw01.aks01.ae.nonprod.azure.intra.pepsico.com
  tls:
  - match:
    - port: 443
      sniHosts:
      - pep-eiap-k8s-dashboard.global.gw01.aks01.ae.nonprod.azure.intra.pepsico.com
    route:
    - destination:
        host: kubernetes-dashboard.kubernetes-dashboard.svc.cluster.local
        port:
          number: 443
