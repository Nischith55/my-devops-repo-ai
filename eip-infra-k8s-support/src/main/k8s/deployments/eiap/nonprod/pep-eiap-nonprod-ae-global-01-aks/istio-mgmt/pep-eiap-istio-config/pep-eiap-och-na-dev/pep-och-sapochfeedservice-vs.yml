apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-och-sapochfeedservice-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-och-sapochfeedservice.global.gw01.aks01.ae.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-och-sapochfeedservice.pep-eiap-och-na-dev.svc.cluster.local
        port: 
          number: 80

