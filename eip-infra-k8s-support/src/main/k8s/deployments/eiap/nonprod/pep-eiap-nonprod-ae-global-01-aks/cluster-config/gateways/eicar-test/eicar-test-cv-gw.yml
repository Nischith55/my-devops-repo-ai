---
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: eicar-test-cv-gw
  namespace: eicar-test
spec:
  selector:
    istio: pep-eiap-ingress-gw01
  servers:
  - hosts:
    - "dummy-passthrough-eicar-test.gw01.aks01.ae.nonprod.azure.intra.pepsico.com"
    name: "eicar-test-cv-gw-tls-443"
    port:
      name: "https-eicar-test-cv-gw-tls-443"
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - "dummy-eicar-test-443.gw01.aks01.ae.nonprod.azure.intra.pepsico.com"
    name: "eicar-test-cv-gw-https-443"
    port:
      name: "https-eicar-test-cv-gw-443"
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: "pep-eiap-nonprod-ae-global-01-aks-gw01-tls"
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - "dummy-eicar-test-80.gw01.aks01.ae.nonprod.azure.intra.pepsico.com"
    name: "eicar-test-cv-gw-http-80"
    port:
      name: "http-eicar-test-cv-gw-80"
      number: 80
      protocol: http
    tls:
      httpsRedirect: true
