apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-eiap-global-appruntimeapi-qa-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-eiap-global-appruntimeapi-qa.global.gw01.aks01.ae.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /apprtqa-api
    route:
    - destination:
        host: pep-eiap-global-appruntimeapi.pep-eiap-cgf-apprt-qa.svc.cluster.local
        port:
          number: 80
          