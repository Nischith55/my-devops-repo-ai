  name: pep-gscaf-global-producer-qa-vs
  namespace: pep-eiap-apac-gscaf-qa
spec:
  gateways:
  - pep-eiap-apac-gscaf-qa/pep-eiap-apac-gscaf-qa-cv-gw
  hosts:
