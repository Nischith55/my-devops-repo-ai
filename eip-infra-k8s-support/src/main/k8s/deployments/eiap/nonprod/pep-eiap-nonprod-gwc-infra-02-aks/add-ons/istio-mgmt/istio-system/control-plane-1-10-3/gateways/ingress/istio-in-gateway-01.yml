---
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: istio-in-gateway-01
  namespace: istio-system
spec:
  selector:
    istio: pep-eiap-ingress-gw01
  servers:

  # ###########################################################################
  #  ALL SSL Passthrough ONLY 1 block, no need for separate blocks
  # ###########################################################################

  - hosts:
    # pep-eiap-elastic-cluster-01
    - pep-eiap-elastic-01.infra.gw01.aks02.gwc.nonprod.azure.intra.pepsico.com
    - pep-eiap-elastic-01-admin.infra.gw01.aks02.gwc.nonprod.azure.intra.pepsico.com
    # - pep-eiap-apm-01.infra.gw01.aks02.gwc.nonprod.azure.intra.pepsico.com
    - pep-eiap-kibana-01.infra.gw01.aks02.gwc.nonprod.azure.intra.pepsico.com
    - pep-eiap-ingest-01.infra.gw01.aks02.gwc.nonprod.azure.intra.pepsico.com
    - pep-eiap-apm-01.infra.gw01.aks02.gwc.nonprod.azure.intra.pepsico.com
    # pep-eiap-elastic-cluster-03
    # - pep-eiap-elastic-03.infra.gw01.aks02.gwc.nonprod.azure.intra.pepsico.com
    # - pep-eiap-elastic-03-admin.infra.gw01.aks02.gwc.nonprod.azure.intra.pepsico.com
    # - pep-eiap-apm-03.infra.gw01.aks02.gwc.nonprod.azure.intra.pepsico.com
    # - pep-eiap-kibana-03.infra.gw01.aks02.gwc.nonprod.azure.intra.pepsico.com
    # - pep-eiap-ingest-03.infra.gw01.aks02.gwc.nonprod.azure.intra.pepsico.com
    # pep-eiap-elastic-monitor-01
    # - pep-eiap-elastic-monitor-01.infra.gw01.aks02.gwc.nonprod.azure.intra.pepsico.com
    # - pep-eiap-kibana-monitor-01.infra.gw01.aks02.gwc.nonprod.azure.intra.pepsico.com
    name: gw01-elastic-all-tls-443
    port:
      name: tls-elastic-all-443
      number: 443
      protocol: tls
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH

  # # HTTPS traffic - SSL Terminated -- Please ensure http match is used in
  # # VS routing
  # - hosts:
  #   - '*.infra.gw01.aks02.gwc.nonprod.azure.intra.pepsico.com'
  #   name: gw01-wc-https-443
  #   port:
  #     name: https-wc-443
  #     number: 443
  #     protocol: HTTPS
  #   tls:
  #     cipherSuites:
  #     - AES128-GCM-SHA256
  #     - AES256-GCM-SHA384
  #     - ECDHE-ECDSA-AES128-SHA
  #     - ECDHE-ECDSA-AES256-SHA
  #     - ECDHE-ECDSA-AES128-GCM-SHA256
  #     - ECDHE-ECDSA-AES256-GCM-SHA384
  #     - ECDHE-RSA-AES128-GCM-SHA256
  #     - ECDHE-RSA-AES256-GCM-SHA384
  #     credentialName: pep-eiap-preprod-scus-infra-02-aks-gw01-tls
  #     maxProtocolVersion: TLSV1_3
  #     minProtocolVersion: TLSV1_2
  #     mode: SIMPLE
  - hosts:
    - "*.infra.gw01.aks02.gwc.nonprod.azure.intra.pepsico.com"
    name: istio-in-gateway-01-wildcard-https-443
    port:
      name: https-wcard-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-eiap-nonprod-gwc-infra-02-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE