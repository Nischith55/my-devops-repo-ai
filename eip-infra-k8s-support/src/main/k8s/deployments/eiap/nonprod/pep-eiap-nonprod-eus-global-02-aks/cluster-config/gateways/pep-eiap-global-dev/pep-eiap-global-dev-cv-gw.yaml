apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: pep-eiap-global-dev-cv-gw
  namespace: pep-eiap-global-dev
spec:
  selector:
    istio: pep-eiap-ingress-gw01
  servers:
  - hosts:
    - 'dummy-passthrough-pep-eiap-global-dev.gw01.aks02.eus.nonprod.azure.intra.pepsico.com'
    name: pep-eiap-global-dev-cv-gw-tls-443
    port:
      name: https-pep-eiap-global-dev-cv-gw-tls-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - 'dummy-pep-eiap-global-dev-443.gw01.aks02.eus.nonprod.azure.intra.pepsico.com'
    - pep-eiap-nginx.eiap.gw01.aks02.eus.nonprod.azure.intra.pepsico.com
    name: pep-eiap-global-dev-cv-gw-https-443
    port:
      name: https-pep-eiap-global-dev-cv-gw-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-SHA
      - ECDHE-RSA-AES256-SHA
      credentialName: pep-eiap-nonprod-eus-global-02-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - 'dummy-pep-eiap-global-dev-80.gw01.aks02.eus.nonprod.azure.intra.pepsico.com'
    - pep-eiap-nginx.eiap.gw01.aks02.eus.nonprod.azure.intra.pepsico.com
    name: pep-eiap-global-dev-cv-gw-http-80
    port:
      name: http-pep-eiap-global-dev-cv-gw-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true
