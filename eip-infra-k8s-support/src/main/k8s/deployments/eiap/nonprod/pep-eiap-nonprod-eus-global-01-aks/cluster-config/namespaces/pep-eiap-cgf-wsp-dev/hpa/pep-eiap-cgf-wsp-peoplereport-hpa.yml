apiVersion: autoscaling/v1
kind: HorizontalPodAutoscaler
metadata:
  name: pep-eiap-cgf-wsp-peoplereport-hpa
  namespace: pep-eiap-cgf-wsp-dev
spec:
  maxReplicas: 5
  minReplicas: 1
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: peoplereport
  targetCPUUtilizationPercentage: 80
