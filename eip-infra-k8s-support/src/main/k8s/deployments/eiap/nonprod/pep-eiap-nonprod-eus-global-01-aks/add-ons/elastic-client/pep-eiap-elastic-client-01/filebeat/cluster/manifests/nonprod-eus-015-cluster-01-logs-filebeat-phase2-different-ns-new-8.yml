# ##
# Non-ECK deployment.
# IMPORTANT:
# - This is meant to send all AKS logs to our primary cluster (cluster-01)
# ##
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: filebeat
  labels:
    k8s-app: filebeat
rules:
- apiGroups: [""] # "" indicates the core API group
  resources:
  - namespaces
  - pods
  - nodes
  verbs:
  - get
  - watch
  - list
- apiGroups: ["apps"]
  resources:
    - replicasets
  verbs: ["get", "list", "watch"]
- apiGroups: ["batch"]
  resources:
    - jobs
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: filebeat
  # should be the namespace where filebeat is running
  namespace: pep-eiap-elastic-client-01
  labels:
    k8s-app: filebeat
rules:
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: filebeat-kubeadm-config
  namespace: pep-eiap-elastic-client-01
  labels:
    k8s-app: filebeat
rules:
  - apiGroups: [""]
    resources:
      - configmaps
    resourceNames:
      - kubeadm-config
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: filebeat
subjects:
- kind: ServiceAccount
  name: filebeat
  namespace: pep-eiap-elastic-client-01
roleRef:
  kind: ClusterRole
  name: filebeat
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: filebeat
  namespace: pep-eiap-elastic-client-01
subjects:
  - kind: ServiceAccount
    name: filebeat
    namespace: pep-eiap-elastic-client-01
roleRef:
  kind: Role
  name: filebeat
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: filebeat-kubeadm-config
  namespace: pep-eiap-elastic-client-01
subjects:
  - kind: ServiceAccount
    name: filebeat
    namespace: pep-eiap-elastic-client-01
roleRef:
  kind: Role
  name: filebeat-kubeadm-config
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nonprod-eus-global-01-aks-logs-filebeat-config
  namespace: pep-eiap-elastic-client-01
data:

  K8S_CLUSTER_NAME: pep-eiap-nonprod-eus-global-01-aks

  filebeat-processor.yml: |

    # ---------------------------------------------------------------------
    # Common Processors across all beats deployment
    # ---------------------------------------------------------------------

    processors:

    - add_fields:
        target: eiap
        fields:
          cluster_name: ${K8S_CLUSTER_NAME}

    - add_cloud_metadata:
        when:
          equals:
            event.module: system

    - add_host_metadata: {}

    - add_kubernetes_metadata:
        host: ${NODE_NAME}
        default_indexers:
          enabled: false
        default_matchers:
          enabled: false

    - add_fields:
        fields:
          ls-destination: "EUS"
          index_name_add: ${K8S_CLUSTER_NAME}
         
    - add_tags:
        tags: ["NonProd-EUS-Shared", "retain-logs"]

    - script:
        lang: javascript
        source: >
          function process(event) {
            event.Put("fields.pep-aks-cluster", event.Get("eiap.cluster_name"));
            event.Put("fields.sn-application", "aks-" + event.Get("eiap.cluster_name"));
            if (event.Get("kubernetes.namespace")) {
            event.Put("fields.index_name_add", event.Get("kubernetes.namespace"));
            event.Put("fields.sn-application", event.Get("fields.sn-application") + "-" + event.Get("kubernetes.namespace"));
            }
            event.Put("fields.legacy-index", "fb-aks-" + event.Get("fields.index_name_add"));
            return event;
          }
    # ~~
    # Logging
    # ~~
    logging:
      level: INFO
      metrics:
        enabled: true

  filebeat.yml: |-

    # --------------------
    # Setup filebeat configuration
    # --------------------
    filebeat.inputs:
      - type: filestream
        enabled: false
        paths:
         - /var/www/html/var/pepconnectlogs/MX/*.log
         - /var/www/html/var/pepconnectlogs/TR/*.log
        fields:
          application: "cep-nonproduction" 
        fields_under_root: true
      - type: filestream
        enabled: true
        paths:
         - /ray/session_latest/logs/*/logs/*.err                          ###RAYSERVE CUSTOM LOGGING SETUP
         - /ray/session_latest/logs/*/logs/*.log                          ###RAYSERVE CUSTOM LOGGING SETUP
         - /ray/session_latest/logs/*/logs/events/*.log                   ###RAYSERVE CUSTOM LOGGING SETUP
         - /ray/session_latest/logs/*/logs/events/*.err                    ###RAYSERVE CUSTOM LOGGING SETUP
        fields:
          application: "rayserve-nonproduction" 
        fields_under_root: true  
    filebeat:
      modules:
      autodiscover:
        providers:
          - type: kubernetes
            scope: node
            resource: pod
            node: ${NODE_NAME}
            hints:
              enabled: true
            templates:
              # Condition for the specific namespaces
              - condition:
                  or:
                    - equals:
                        kubernetes.namespace: "pep-eiap-global-eiotp-dev"
                    - equals:
                        kubernetes.namespace: "pep-eiap-global-eiotp-qa"
                config:
                  - type: container
                    paths:
                      - /var/log/containers/*${data.kubernetes.container.id}.log
                    json.keys_under_root: true
                    json.add_error_key: true
                    json.message_key: message
                    # Process each log line as JSON
                    # processors:
                    #   - decode_json_fields:
                    #       fields: ["message"]  # The field containing JSON logs
                    #       target: ""           # Place parsed fields at the root level
                    #       overwrite_keys: true # Overwrite existing fields if necessary
                      # - add_fields:
                      #     target: ""
                      #     fields:
                      #       namespace: "pep-eiap-global-eiotp-dev"
              # Condition for all other namespaces
              # - condition:
              #     and:
              #       - equals:
              #           kubernetes.namespace: "pep-eiap-cgf-pepgenx-dev"
              #   config:
              #     - type: container
              #       paths:
              #          - /var/log/containers/*${data.kubernetes.container.id}.log
              #       # Output multiline logs
              #       multiline:
              #         type: pattern
              #         pattern: '^(INFO|DEBUG|ERROR|TRACE|WARN|CRITICAL|FATAL):|^\[[0-9]{4}-[0-9]{2}-[0-9]{2}|^(\[|[0-9]{4}-[0-9]{2}-[0-9]{2} )'
              #         negate: true
              #         match: after
                      
              # - condition:
              #     and:
              #       - equals:
              #           kubernetes.namespace: "pep-eiap-cgf-pepgenx-qa"
              #   config:
              #     - type: container
              #       paths:
              #          - /var/log/containers/*${data.kubernetes.container.id}.log
              #       # Output multiline logs
              #       multiline:
              #         type: pattern
              #         pattern: '^(INFO|DEBUG|ERROR|TRACE|WARN|CRITICAL|FATAL):|^\[[0-9]{4}-[0-9]{2}-[0-9]{2}|^(\[|[0-9]{4}-[0-9]{2}-[0-9]{2} )'
              #         negate: true
              #         match: after
                      
              - condition:
                  and:
                    - or:
                       - equals:
                           kubernetes.namespace: "pep-eiap-cgf-pepgenx-dev"
                       - equals:
                           kubernetes.namespace: "pep-eiap-cgf-pepgenx-qa"
                    - not:
                        has_fields:
                          - kubernetes.labels.common.k8s.elastic.co/type
                config:
                  - type: container
                    paths:
                       - /var/log/containers/*${data.kubernetes.container.id}.log
                    # Output multiline logs
                    multiline:
                      type: pattern
                      pattern: '^(INFO|DEBUG|ERROR|TRACE|WARN|CRITICAL|FATAL) | ^\{"team_id"'
                      negate: true
                      match: after
                      
              - condition:
                  and:
                    - not:
                        equals:
                          kubernetes.namespace: "pep-eiap-global-eiotp-dev"
                    - not:
                        has_fields:
                          - kubernetes.labels.common.k8s.elastic.co/type
                config:
                  - type: container
                    paths:
                      - /var/log/containers/*${data.kubernetes.container.id}.log
                    # Output multiline logs
                    multiline:
                      type: pattern
                     # pattern: '^(\[|[0-9]{4}-[0-9]{2}-[0-9]{2} )'
                      pattern: '^(\[|[0-9]{4}-[0-9]{2}-[0-9]{2} |\{"team_id)'
                      negate: true
                      match: after
                     
    output.elasticsearch:
        hosts: [https://3825028849b946d3a380f6136dcd7c3a.privatelink.southcentralus.azure.elastic-cloud.com:9243]
        api_key: "GnuNB5MBWuezjPg1DKep:OPckBJB2QHOYgXBnfTHhZw"
        index: "%{[fields][sn-application]}"
        worker: 2
        timeout: 300s
        bulk_max_size: 1500
    setup.template.name: "aks-data-stream"
    setup.template.pattern: "aks-pep_eiap*"
    # output.logstash:
    #   hosts: ["pepwap23142.corp.pep.pvt:5045", "pepwap23143.corp.pep.pvt:5045", "pepwap23144.corp.pep.pvt:5045"]
    #   loadbalance: true
    #   worker: 1
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: &app_name nonprod-eus-global-01-aks-logs-filebeat
  namespace: pep-eiap-elastic-client-01
  labels:
    app.kubernetes.io/name: *app_name
    app.kubernetes.io/version: &vers 8.19.11
    app: *app_name
    # match the  ES server version (beats is not backward compatible)
    version: *vers
spec:

  selector:
    matchLabels:
      app.kubernetes.io/name: *app_name
      app.kubernetes.io/version: *vers

  template:

    metadata:
      labels:
        app.kubernetes.io/name: *app_name
        app.kubernetes.io/version: *vers

    spec:
      hostAliases:
      - ip: "172.25.249.4"
        hostnames:
        - "3825028849b946d3a380f6136dcd7c3a.privatelink.southcentralus.azure.elastic-cloud.com"
     

      # Run only on linux nodes, not that we have non linux nodes :)
      nodeSelector:
        kubernetes.io/os: linux
      # PEP: DaemonSet we need to run it on EVERY node. so tolerate all
      # taints
      tolerations:
      - operator: Exists

      serviceAccountName: filebeat
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 0

      # ~~~
      # All volumes
      # ~~~
      volumes:

      # PEP: all in one configMap (using projections)
      - name: config-projected
        projected:
          # 0644 -> 420, 0600 -> 384
          defaultMode: 384
          sources:

          # pep-ca-certs-config
          - configMap:
              name: pep-ca-certs-config
              optional: false
              items:
                - key: PepsiCoCA01.pem
                  # must be relative
                  path: etc/certs/PepsiCoCA01.pem
                - key: PepsiCoRootCA.pem
                  # must be relative
                  path: etc/certs/PepsiCoRootCA.pem

          - configMap:
              name: &beats_config nonprod-eus-global-01-aks-logs-filebeat-config
              optional: false
              items:
                - key: filebeat.yml
                  # must be relative
                  path: etc/beat.yml
                - key: filebeat-processor.yml
                  # must be relative
                  path: etc/beat-processor-config.yml

      - name: varlibdockercontainers
        hostPath:
          path: /var/lib/docker/containers

      - name: varwwwhtml-pepconnect-b2b-logs
        persistentVolumeClaim:
          claimName: pepconnect-b2b-logs-elastic-pvc

      - name: assets-pvc-ray-pepiris-inference-ray-service-elastic
        persistentVolumeClaim:
          claimName: assets-pvc-ray-pepiris-inference-ray-service-elastic

      - name: varlog
        hostPath:
          path: /var/log

      # data folder stores a registry of read status for all files,
      # so we don't send everything again on a Filebeat pod restart
      - name: data
        hostPath:
          path: /var/lib/pep-eiap-elastic-client-01/nonprod-eus-global-01-aks-logs-filebeat/filebeat-data
          type: DirectoryOrCreate

      - name: dockersock
        hostPath:
          path: /var/run/docker.sock

      # ##
      # All Containers
      # ##
      containers:
      - name: filebeat
        image: docker.elastic.co/beats/filebeat:8.19.11
        args:
        - --environment
        - container
        - -e
        - -c
        - /projected/etc/beat-processor-config.yml
        - -c
        - /projected/etc/beat.yml
        # - -d
        # - "monitoring"
        # - index-management,processors

        resources:
          # limits:
          #   cpu: 100m
          #   memory: 200Mi
          requests:
            # cpu: 200m
            memory: 512Mi

        env:

        # All environment variables from beats-shared-env-config
        - name: K8S_CLUSTER_NAME
          valueFrom:
            configMapKeyRef:
              name: *beats_config
              key: K8S_CLUSTER_NAME

        # - name: TEMPLATE_NAME
        #   valueFrom:
        #     configMapKeyRef:
        #       name: *beats_config
        #       key: TEMPLATE_NAME

        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP

        volumeMounts:

        # PEP:
        - name: config-projected
          # where it is mounted
          mountPath: /projected
          readOnly: true

        - name: data
          mountPath: /usr/share/filebeat/data

        - name: varlibdockercontainers
          mountPath: /var/lib/docker/containers
          readOnly: true

        - name: varwwwhtml-pepconnect-b2b-logs
          mountPath: /var/www/html/var/pepconnectlogs
          readOnly: true

        - name: assets-pvc-ray-pepiris-inference-ray-service-elastic
          mountPath: /ray/session_latest/logs
          readOnly: true  

        - name: varlog
          mountPath: /var/log
          readOnly: true

        - name: dockersock
          mountPath: "/var/run/docker.sock"