apiVersion: v1
kind: Secret
metadata:
  name: pep-eiap-cgf-gpacommgt-qa-sa-token  # Naming convention followed is ServiceAccountName-token
  namespace: pep-eiap-cgf-gpacommgt-qa      # Namespace where the service account is created
  annotations:
    kubernetes.io/service-account.name: "pep-eiap-cgf-gpacommgt-qa-sa" # Service Account name to map the token
type: kubernetes.io/service-account-token  # Secret type should be this