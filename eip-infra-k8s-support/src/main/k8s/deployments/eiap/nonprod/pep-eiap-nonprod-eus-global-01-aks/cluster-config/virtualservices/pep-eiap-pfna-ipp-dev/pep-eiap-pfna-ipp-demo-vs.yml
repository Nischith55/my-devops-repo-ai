apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: demo
  name: pep-eiap-pfna-ipp-demo-vs
  namespace: pep-eiap-pfna-ipp-dev
spec:
  gateways:
  - pep-eiap-pfna-ipp-dev/pep-eiap-pfna-ipp-dev-cv-gw
  hosts:
  - pep-eiap-pfna-ipp-demo.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /greeting
    route:
    - destination:
        host: demo.pep-eiap-pfna-ipp-dev.svc.cluster.local
        port:
          number: 8080
