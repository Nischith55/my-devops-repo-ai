apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: dsi-powerbi-metrics-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - dsi-powerbi-metrics.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: dsi-powerbi-metrics.pep-eiap-global-hcm-dev.svc.cluster.local
        port:
          number: 80        