apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: cvat-app
  name: cvat-release-non-prod-frontend-service-vs
  namespace: pep-eiap-latam-eiapcvcvat-dev
spec:
  gateways:
  - pep-eiap-latam-eiapcvcvat-dev/pep-eiap-latam-eiapcvcvat-dev-cv-gw
  hosts:
  - cvat-release-non-prod-frontend-service.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  - cvat.dev.mypepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /api
    - ignoreUriCase: true
      uri:
        prefix: /admin
    - ignoreUriCase: true
      uri:
        prefix: /static
    - ignoreUriCase: true
      uri:
        prefix: /django-rq
    - ignoreUriCase: true
      uri:
        prefix: /profiler
    route:
    - destination:
        host: cvat-release-non-prod-backend-service.pep-eiap-latam-eiapcvcvat-dev.svc.cluster.local
        port:
          number: 8080
  - match:
    - uri:
        prefix: /analytics
    route:
    - destination:
        host: cvat-release-non-prod-grafana.pep-eiap-latam-eiapcvcvat-dev.svc.cluster.local
        port:
          number: 80
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        host: cvat-release-non-prod-frontend-service.pep-eiap-latam-eiapcvcvat-dev.svc.cluster.local
        port:
          number: 80
