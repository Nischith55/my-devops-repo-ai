apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
    labels:
        app: duaas-webapp
    name: duaas-webapp-vs
    namespace: pep-eiap-cgf-duaas-dev
spec:
    gateways:
    - pep-eiap-cgf-duaas-dev/pep-eiap-cgf-duaas-dev-cv-gw
    hosts:
    - duaas-webapp.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pepdoculingo.dev.mypepsico.com
    http:
    -   match:
        -   ignoreUriCase: true
            uri:
                prefix: /
        route:
        -   destination:
                host: duaas-webapp.pep-eiap-cgf-duaas-dev.svc.cluster.local
                port:
                    number: 80
