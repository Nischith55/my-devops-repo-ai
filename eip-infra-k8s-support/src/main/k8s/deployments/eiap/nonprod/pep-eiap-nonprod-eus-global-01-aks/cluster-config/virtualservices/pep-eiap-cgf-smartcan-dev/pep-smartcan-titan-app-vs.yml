apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-smartcan-titan-app
  name: pep-smartcan-titan-app-vs
  namespace: pep-eiap-cgf-smartcan-dev
spec:
  gateways:
  - pep-eiap-cgf-smartcan-dev/pep-eiap-cgf-smartcan-dev-cv-gw
  hosts:
  - pep-smartcan-titan-app.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  - smartcancms.dev.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-smartcan-titan-app.pep-eiap-cgf-smartcan-dev.svc.cluster.local
        port:
          number: 8080
