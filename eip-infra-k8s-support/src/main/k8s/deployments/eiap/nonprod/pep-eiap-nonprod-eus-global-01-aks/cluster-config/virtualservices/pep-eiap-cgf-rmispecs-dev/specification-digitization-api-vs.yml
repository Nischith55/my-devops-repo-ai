apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: specification-digitization-api
  name: specification-digitization-api-vs
  namespace: pep-eiap-cgf-rmispecs-dev
spec:
  gateways:
  - pep-eiap-cgf-rmispecs-dev/pep-eiap-cgf-rmispecs-dev-cv-gw
  hosts:
  - specification-digitization-api.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - corsPolicy:
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Link
      - Content-Type
      - Access-Control-Allow-Origin
      allowMethods:
      - POST
      - GET
      - PUT
      - DELETE
      - OPTIONS
      allowOrigins:
      - exact: https://pepwap18308.corp.pep.pvt
      - exact: https://pepwap18050.corp.pep.pvt
      - exact: https://specification-digitization-ui.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
      exposeHeaders:
      - x-total-count
      - x-source
    match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: specification-digitization-api.pep-eiap-cgf-rmispecs-dev.svc.cluster.local
        port:
          number: 8080
