apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: duaas-webapp-qa-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - duaas-webapp-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: duaas-webapp.pep-eiap-cgf-duaas-qa.svc.cluster.local
        port:
          number: 80