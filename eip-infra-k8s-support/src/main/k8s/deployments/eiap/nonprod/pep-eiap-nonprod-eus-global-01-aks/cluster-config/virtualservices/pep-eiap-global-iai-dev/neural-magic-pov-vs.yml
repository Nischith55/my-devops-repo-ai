apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: neural-magic-pov
  name: neural-magic-pov-vs
  namespace: pep-eiap-global-iai-dev
spec:
  gateways:
  - pep-eiap-global-iai-dev/pep-eiap-global-iai-dev-cv-gw
  hosts:
  - neural-magic-pov.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: neural-magic-pov.pep-eiap-global-iai-dev.svc.cluster.local
        port:
          number: 8000
