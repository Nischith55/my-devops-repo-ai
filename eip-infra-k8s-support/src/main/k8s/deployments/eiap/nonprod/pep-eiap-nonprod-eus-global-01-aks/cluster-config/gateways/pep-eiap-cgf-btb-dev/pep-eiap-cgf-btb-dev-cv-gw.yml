    port:
      name: http-pep-eiap-cgf-btb-dev-cv-gw-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true
  - hosts:
    - sodastreamprofessional.dev.pepsico.com
    name: pep-eiap-cgf-btb-dev-cv-gw-1-https-443
