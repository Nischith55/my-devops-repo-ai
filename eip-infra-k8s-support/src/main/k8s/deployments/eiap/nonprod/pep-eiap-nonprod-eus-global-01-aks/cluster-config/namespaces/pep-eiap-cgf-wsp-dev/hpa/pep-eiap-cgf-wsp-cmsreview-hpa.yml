apiVersion: autoscaling/v1
kind: HorizontalPodAutoscaler
metadata:
  name: pep-eiap-cgf-wsp-cmsreview-hpa
  namespace: pep-eiap-cgf-wsp-dev
spec:
  maxReplicas: 10
  minReplicas: 2
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cmsreview
  targetCPUUtilizationPercentage: 80