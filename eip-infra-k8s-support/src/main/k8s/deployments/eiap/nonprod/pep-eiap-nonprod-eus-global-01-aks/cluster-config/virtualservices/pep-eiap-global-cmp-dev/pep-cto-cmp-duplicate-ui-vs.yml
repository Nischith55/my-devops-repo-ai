apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-eip-global-cmp-ui
  name: pep-cto-cmp-duplicate-ui-vs
  namespace: pep-eiap-global-cmp-dev
spec:
  gateways:
  - pep-eiap-global-cmp-dev/pep-eiap-global-cmp-dev-cv-gw
  hosts:
  - cloud.dev.mypepsico.com
  - pep-eip-cmp-ui.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /v1
    route:
    - destination:
        host: pep-eip-global-cmp-ui-v1.pep-eiap-global-cmp-dev.svc.cluster.local
        port:
          number: 80
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pepsico-eip-global-cmp-ui.pep-eiap-global-cmp-dev.svc.cluster.local
        port:
          number: 80
