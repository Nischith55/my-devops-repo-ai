apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: smartlook-latammodel
  name: smartlook-latammodel-vs
  namespace: pep-eiap-global-iai-dev
spec:
  gateways:
  - pep-eiap-global-iai-dev/pep-eiap-global-iai-dev-cv-gw
  hosts:
  - smartlook-latammodel.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: smartlook-latammodel.pep-eiap-global-iai-dev.svc.cluster.local
        port:
          number: 8000
