apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: cmp-oauth-poc
  name: pep-eiap-cmp-oauth-poc-vs
  namespace: pep-eiap-global-cmp-dev
spec:
  gateways:
  - pep-eiap-global-cmp-dev/pep-eiap-global-cmp-dev-cv-gw
  hosts:
  - cmp-oauth-poc.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: cmp-oauth-poc.pep-eiap-global-cmp-dev.svc.cluster.local
        port:
          number: 8080
