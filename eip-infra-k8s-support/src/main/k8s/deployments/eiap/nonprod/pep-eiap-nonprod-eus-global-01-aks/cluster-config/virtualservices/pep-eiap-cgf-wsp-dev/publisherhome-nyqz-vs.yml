apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: publisherhome-nyqz-vs
  namespace: pep-eiap-cgf-wsp-dev
  labels:
      app: publisherhome
spec:
  hosts:
  - pep-eiap-cgf-wsp-publisherhome-dev.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  gateways:
  - pep-eiap-cgf-wsp-dev/pep-eiap-cgf-wsp-dev-cv-gw
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /publisher-home
    route:
