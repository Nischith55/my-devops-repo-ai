apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-eiap-cto-cmp-ui-sni-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - cloud.qa.mypepsico.com
  - pep-eip-cmp-ui-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  tls:
    - match:
      - port: 443
        sniHosts:
          - cloud.qa.mypepsico.com
          - pep-eip-cmp-ui-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
      route:
        - destination:
            host: pepsico-global-cmp-ui.pep-eiap-global-cmp-qa.svc.cluster.local
            port: 
              number: 443