apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: qa-dlops-mlflow-server-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - qa-dlops-mlflow-server.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: qa-dlops-mlflow-server.pep-eiap-cgf-eedlops-qa.svc.cluster.local
        port:
          number: 5000