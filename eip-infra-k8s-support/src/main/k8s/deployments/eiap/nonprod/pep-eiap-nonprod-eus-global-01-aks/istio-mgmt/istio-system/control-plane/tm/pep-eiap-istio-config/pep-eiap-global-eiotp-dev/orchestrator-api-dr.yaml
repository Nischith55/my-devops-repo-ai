apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: solution-api-dr
  namespace: pep-eiap-istio-config
spec:
  host: solution-api.pep-eiap-global-eiotp-dev.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    outlierDetection:
      consecutive5xxErrors: 2
      interval: 1m
      baseEjectionTime: 5m
      maxEjectionPercent: 100