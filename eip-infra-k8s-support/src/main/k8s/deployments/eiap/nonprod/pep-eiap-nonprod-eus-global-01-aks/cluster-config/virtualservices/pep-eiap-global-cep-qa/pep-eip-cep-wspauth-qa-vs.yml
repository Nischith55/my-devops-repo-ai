apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: wspauth
  name: pep-eip-cep-wspauth-qa-vs
  namespace: pep-eiap-global-cep-qa
spec:
  gateways:
  - pep-eiap-global-cep-qa/pep-eiap-global-cep-qa-cv-gw
  hosts:
  - pepwspa01.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: wspauth.pep-eiap-global-cep-qa.svc.cluster.local
        port:
          number: 8080
