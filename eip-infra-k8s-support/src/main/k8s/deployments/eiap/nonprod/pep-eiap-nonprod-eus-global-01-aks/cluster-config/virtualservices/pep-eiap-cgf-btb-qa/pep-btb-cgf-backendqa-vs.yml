apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-eiap-cgf-btb-app-equipment
  name: pep-btb-cgf-backendqa-vs
  namespace: pep-eiap-cgf-btb-qa
spec:
  gateways:
  - pep-eiap-cgf-btb-qa/pep-eiap-cgf-btb-qa-cv-gw
  hosts:
  - pep-btb-cgf-backendqa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /api/v1/alerts
    route:
    - destination:
        host: pep-eiap-cgf-btb-app-alerts.pep-eiap-cgf-btb-qa.svc.cluster.local
        port:
          number: 80
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /api/v1/pepsense
    route:
    - destination:
        host: pep-eiap-cgf-btb-app-pepsense.pep-eiap-cgf-btb-qa.svc.cluster.local
        port:
          number: 80
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /api/v1/userpreferences
    route:
    - destination:
        host: pep-eiap-cgf-btb-app-userpreferences.pep-eiap-cgf-btb-qa.svc.cluster.local
        port:
          number: 80
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /api/v1/filter
    route:
    - destination:
        host: pep-eiap-cgf-btb-app-filter.pep-eiap-cgf-btb-qa.svc.cluster.local
        port:
          number: 80
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /api/v1/accessmanagement
    route:
    - destination:
        host: pep-eiap-cgf-btb-app-accessmanagement.pep-eiap-cgf-btb-qa.svc.cluster.local
        port:
          number: 80
  - corsPolicy:
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Content-Type
      - Access-Control-Allow-Origin
      - Timeout
      - x-functions-key
      - Access-Control-Allow-Headers
      allowMethods:
      - GET
      - PUT
      - POST
      - DELETE
      - OPTIONS
      allowOrigins:
      - exact: https://api-na.qa.mypepsico.com/
      - exact: https://sodastreamprofessional.dev.pepsico.com/
      - exact: https://sodastreamprofessional.qa.pepsico.com/
      - exact: https://api-na.dev.mypepsico.com/
      - exact: https://pep-btb-cgf-backendqa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com/api/v1
      exposeHeaders:
      - x-total-count
      - x-source
      - Content-Disposition
    match:
    - ignoreUriCase: true
      uri:
        prefix: /api/v1
    route:
    - destination:
        host: pep-eiap-cgf-btb-app-equipment.pep-eiap-cgf-btb-qa.svc.cluster.local
        port:
          number: 80
