apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-eip-global-gdm-dataservice
  name: pep-eip-global-gdm-dataservice-service-qa-vs
  namespace: pep-eiap-cgf-pdm-qa
spec:
  gateways:
  - pep-eiap-cgf-pdm-qa/pep-eiap-cgf-pdm-qa-cv-gw
  hosts:
  - pep-eip-global-gdm-dataservice-service-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /api/
    route:
    - destination:
        host: pep-eip-global-gdm-dataservice-service.pep-eiap-cgf-pdm-qa.svc.cluster.local
        port:
          number: 80
