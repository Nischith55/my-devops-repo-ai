apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: vctswdev-backend-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - vctswdev-backend.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /api/v1/vctswdev-backend
    route:
    - destination:
        host: vctswdev-backend.pep-eiap-cgf-onepep-dev.svc.cluster.local
        port:
          number: 80