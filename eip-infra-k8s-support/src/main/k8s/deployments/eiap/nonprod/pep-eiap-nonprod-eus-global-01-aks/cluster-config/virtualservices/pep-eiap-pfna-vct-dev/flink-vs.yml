apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: vct-pyservices-orm
  name: flink-vs
  namespace: pep-eiap-pfna-vct-dev
spec:
  gateways:
  - pep-eiap-pfna-vct-dev/pep-eiap-pfna-vct-dev-cv-gw
  hosts:
  - flink.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: flink.pep-eiap-pfna-vct-dev.svc.cluster.local
        port:
          number: 8081
