apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: pep-eiap-cgf-scaop-dev-cv-gw
  namespace: pep-eiap-cgf-scaop-dev
spec:
  selector:
    istio: pep-eiap-ingress-gw01
  servers:
  - hosts:
    - dummy-passthrough-pep-eiap-cgf-scaop-dev.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    name: pep-eiap-cgf-scaop-dev-cv-gw-tls-443
    port:
      name: https-pep-eiap-cgf-scaop-dev-cv-gw-tls-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - pep-eiap-df-pfna-order-processing-ui.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pep-eip-df-pfna-order-processing-api.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pep-eiap-df-pfna-order-processing-ui.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pep-eip-df-pfna-order-processing-api.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pfna-order-processing-api.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pfna-order-processing-ui.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pfna-order-processing-ui-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pfna-order-processing-api-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pfna-order-processing-intelliextractservice.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    name: pep-eiap-cgf-scaop-dev-cv-gw-https-443
    port:
      name: https-pep-eiap-cgf-scaop-dev-cv-gw-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-eiap-nonprod-eus-global-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - pep-eiap-df-pfna-order-processing-ui.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pep-eip-df-pfna-order-processing-api.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pep-eiap-df-pfna-order-processing-ui.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pep-eip-df-pfna-order-processing-api.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pfna-order-processing-api.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pfna-order-processing-ui.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pfna-order-processing-ui-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pfna-order-processing-api-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - peporderengineui.qa.pepsico.com
    - pfna-order-processing-intelliextractservice.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    name: pep-eiap-cgf-scaop-dev-cv-gw-http-80
    port:
      name: http-pep-eiap-cgf-scaop-dev-cv-gw-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true
  - hosts:
    - peporderengineui.qa.pepsico.com
    name: peporderengineui.qa.pepsico.com-1-https-443
    port:
      name: peporderengineui.qa.pepsico.com-1-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-order-processing-qa-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE

