apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: appruntimeclientsdk-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - appruntimeclientsdk.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /apprtdemo-clsdk
    route:
    - destination:
        host: appruntimeclientsdk.pep-eiap-cgf-appruntime-dev.svc.cluster.local
        port:
          number: 80