apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: app-pipeline
  name: pep-eiap-cgf-wsp-app-pipeline-vs
  namespace: pep-eiap-cgf-wsp-dev
spec:
  gateways:
  - pep-eiap-cgf-wsp-dev/pep-eiap-cgf-wsp-dev-cv-gw
  hosts:
  - pep-eiap-cgf-wsp-app-pipeline.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: app-pipeline.pep-eiap-cgf-wsp-dev.svc.cluster.local
        port:
          number: 80
