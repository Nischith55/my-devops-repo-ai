apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: dlops-mlflow-server
  name: dlops-mlflow-server-vs
  namespace: pep-eiap-cgf-dlops-dev
spec:
  gateways:
  - pep-eiap-cgf-dlops-dev/pep-eiap-cgf-dlops-dev-cv-gw
  hosts:
  - dlops-mlflow-server.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: dlops-mlflow-server.pep-eiap-cgf-dlops-dev.svc.cluster.local
        port:
          number: 5000
