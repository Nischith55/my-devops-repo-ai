apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: peopleazapp
  name: peopleazapp-vs
  namespace: pep-eiap-cgf-wsp-dev
spec:
  gateways:
  - pep-eiap-cgf-wsp-dev/pep-eiap-cgf-wsp-dev-cv-gw
  hosts:
  - peopleazapp.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: peopleazapp.pep-eiap-cgf-wsp-dev.svc.cluster.local
        port:
          number: 80
