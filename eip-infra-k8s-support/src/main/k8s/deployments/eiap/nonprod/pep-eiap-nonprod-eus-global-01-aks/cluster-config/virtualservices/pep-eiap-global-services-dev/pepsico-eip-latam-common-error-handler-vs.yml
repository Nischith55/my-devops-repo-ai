apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pepsico-eip-latam-common-error-handler
  name: pepsico-eip-latam-common-error-handler-vs
  namespace: pep-eiap-global-services-dev
spec:
  gateways:
  - pep-eiap-global-services-dev/pep-eiap-global-services-dev-cv-gw
  hosts:
  - pepsico-eip-latam-common-error-handler.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /api/v1/direct-replay
    route:
    - destination:
        host: pepsico-eip-latam-common-error-handler.pep-eiap-global-services-dev.svc.cluster.local
        port:
          number: 80
