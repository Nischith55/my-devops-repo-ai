apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-eiap-df-pfna-order-processing-ui-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-eiap-df-pfna-order-processing-ui.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - uri:
        prefix: /orders
    route:
    - destination:
        port:
          number: 80
        host: pep-eiap-df-pfna-order-processing-ui.pep-eiap-cgf-scaop-dev.svc.cluster.local
    corsPolicy:
      allowOrigins:      
      - exact: https://pep-eiap-df-pfna-order-processing-api.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com/
      - exact: https://apim-na.dev.mypepsico.com/it/scas/v1/orders/
      allowMethods:
      - POST
      - GET
      - PUT
      - DELETE
      - OPTIONS
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Link
      - Content-Type
      - Access-Control-Allow-Origin 
      exposeHeaders:
      - x-total-count
      - x-source