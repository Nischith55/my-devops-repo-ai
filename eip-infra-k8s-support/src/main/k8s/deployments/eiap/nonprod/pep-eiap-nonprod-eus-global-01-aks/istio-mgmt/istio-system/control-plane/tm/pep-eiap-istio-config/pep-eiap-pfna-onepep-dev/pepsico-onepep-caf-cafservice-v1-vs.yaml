apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pepsico-onepep-caf-cafservice-v1-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pepsico-onepep-caf-cafservice-v1.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pepsico-onepep-caf-cafservice-v1.pep-eiap-pfna-onepep-dev.svc.cluster.local
        port:
          number: 80