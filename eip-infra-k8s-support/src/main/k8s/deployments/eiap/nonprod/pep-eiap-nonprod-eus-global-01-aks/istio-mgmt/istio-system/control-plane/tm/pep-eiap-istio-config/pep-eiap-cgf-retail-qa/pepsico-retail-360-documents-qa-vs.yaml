apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pepsico-retail-360-documents-qa-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pepsico-retail-360-documents-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pepsico-retail-360-documents.pep-eiap-cgf-retail-qa.svc.cluster.local
        port:
          number: 80