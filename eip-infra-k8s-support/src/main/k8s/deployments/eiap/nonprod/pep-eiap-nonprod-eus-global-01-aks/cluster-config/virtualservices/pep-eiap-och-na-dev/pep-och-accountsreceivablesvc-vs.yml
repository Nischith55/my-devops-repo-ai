apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-och-accountsreceivablesvc
  name: pep-och-accountsreceivablesvc-vs
  namespace: pep-eiap-och-na-dev
spec:
  gateways:
  - pep-eiap-och-na-dev/pep-eiap-och-na-dev-cv-gw
  hosts:
  - pep-och-accountsreceivablesvc.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - corsPolicy:
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Content-Type
      allowMethods:
      - POST
      - GET
      - PUT
      allowOrigins:
      - exact: https://cepar.spo.nonprod.wspdop.pepsico.com
      exposeHeaders:
      - x-total-count
    match:
    - ignoreUriCase: true
      uri:
        prefix: /api/invoices
    - ignoreUriCase: true
      uri:
        prefix: /api/customers
    - ignoreUriCase: true
      uri:
        prefix: /management
    route:
    - destination:
        host: pep-och-accountsreceivablesvc.pep-eiap-och-na-dev.svc.cluster.local
        port:
          number: 80
