apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: kafka-avro-producer
  name: kafka-avro-producer-vs
  namespace: pep-eiap-global-services-dev
spec:
  gateways:
  - pep-eiap-global-services-dev/pep-eiap-global-services-dev-cv-gw
  hosts:
  - kafka-avro-producer.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: kafka-avro-producer.pep-eiap-global-services-dev.svc.cluster.local
        port:
          number: 80
