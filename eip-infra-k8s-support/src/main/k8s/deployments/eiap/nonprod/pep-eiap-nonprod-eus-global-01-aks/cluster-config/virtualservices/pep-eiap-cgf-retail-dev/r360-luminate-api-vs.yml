apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: r360-luminate-api
  name: r360-luminate-api-vs
  namespace: pep-eiap-cgf-retail-dev
spec:
  gateways:
  - pep-eiap-cgf-retail-dev/pep-eiap-cgf-retail-dev-cv-gw
  hosts:
  - r360-luminate-api.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: r360-luminate-api.pep-eiap-cgf-retail-dev.svc.cluster.local
        port:
          number: 8080
