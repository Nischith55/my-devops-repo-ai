apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pfna-smartform-ui
  name: pfna-smartform-ui-qa-vs
  namespace: pep-eiap-pfna-smartform-qa
spec:
  gateways:
  - pep-eiap-pfna-smartform-qa/pep-eiap-pfna-smartform-qa-cv-gw
  hosts:
  - pfna-smartform-ui-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pfna-smartform-ui.pep-eiap-pfna-smartform-qa.svc.cluster.local
        port:
          number: 3000
