apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: dsi-testing
  name: dsi-testing-vs
  namespace: pep-eiap-global-hcm-dev
spec:
  gateways:
  - pep-eiap-global-hcm-dev/pep-eiap-global-hcm-dev-cv-gw
  hosts:
  - dsi-testing-dev.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: dsi-testing.pep-eiap-global-hcm-dev.svc.cluster.local
        port:
          number: 80
