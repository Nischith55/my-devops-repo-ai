apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-eip-td-idm-service-v2-qa-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-eip-td-idm-service-v2-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /tdHrRoles
    - ignoreUriCase: true
      uri:
        prefix: /ecUsers
    - ignoreUriCase: true
      uri:
        prefix: /usersv
    - ignoreUriCase: true
      uri:
        prefix: /usersvTest
    - ignoreUriCase: true
      uri:
        prefix: /mpi
    - ignoreUriCase: true
      uri:
        prefix: /mpiTest
    - ignoreUriCase: true
      uri:
        prefix: /replaySp
    - ignoreUriCase: true
      uri:
        prefix: /replayMpi
    - ignoreUriCase: true
      uri:
        prefix: /targetGroupAttr
    route:
    - destination:
        host: pep-eip-td-idm-service-v2.pep-eiap-global-services-qa.svc.cluster.local
        port:
          number: 80