apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: api-server
  name: api-server-vs
  namespace: pep-eiap-amesa-paperless-dev
spec:
  gateways:
  - pep-eiap-amesa-paperless-dev/pep-eiap-amesa-paperless-dev-cv-gw
  hosts:
  - api-server.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: api-server.pep-eiap-amesa-paperless-dev.svc.cluster.local
        port:
          number: 3000
