apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-och-amazonbatchservice
  name: pep-och-amazonbatchservice-qa-vs
  namespace: pep-eiap-och-na-qa
spec:
  gateways:
  - pep-eiap-och-na-qa/pep-eiap-och-na-qa-cv-gw
  hosts:
  - pep-och-amazonbatchservice-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - corsPolicy:
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Link
      - content-type
      - vendorCode
      - purchaseOrder
      allowMethods:
      - GET
      - PUT
      - PATCH
      - POST
      - DELETE
      - OPTIONS
      allowOrigins:
      - exact: https://pep-och-amazonflnamop-ui-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
      - exact: https://pep-och-ui-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
      - exact: https://pepcommerce-ordermanagement.dev.na.pepsico.com
      exposeHeaders:
      - x-total-count
      - x-source
    match:
    - ignoreUriCase: true
      uri:
        prefix: /api/job
    route:
    - destination:
        host: pep-och-amazonbatchservice.pep-eiap-och-na-qa.svc.cluster.local
        port:
          number: 80
