apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-och-notificationservice-qa-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-och-notificationservice-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /v1/api
    route:
    - destination:
        host: pep-och-notificationservice.pep-eiap-och-na-qa.svc.cluster.local
        port:
          number: 80
    corsPolicy:
      allowOrigins:      
      - exact: https://pep-och-ops-ui-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
      - exact: https://pep-och-developerportal-ui-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
      - exact: https://pep-och-developerportal-ui.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
      - exact: https://pep-och-developerportal-ui.global.gw01.aks01.scus.preprod.azure.intra.pepsico.com
      - exact: https://pep-och-ops-ui.global.gw01.aks01.scus.preprod.azure.intra.pepsico.com
      - exact: https://pep-och-ops-ui.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
      allowMethods:
      - POST
      - GET
      - PUT
      - DELETE
      - OPTIONS
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Content-Type
      - Link
      - Access-Control-Allow-Origin
      exposeHeaders:
      - x-total-count 