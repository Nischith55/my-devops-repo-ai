apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: tpo-powerbi-serve-layer
  name: tpo-powerbi-serve-layer-qa-vs
  namespace: pep-eiap-global-hcm-qa
spec:
  gateways:
  - pep-eiap-global-hcm-qa/pep-eiap-global-hcm-qa-cv-gw
  hosts:
  - tpo-powerbi-services-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: tpo-powerbi-serve-layer.pep-eiap-global-hcm-qa.svc.cluster.local
        port:
          number: 80
