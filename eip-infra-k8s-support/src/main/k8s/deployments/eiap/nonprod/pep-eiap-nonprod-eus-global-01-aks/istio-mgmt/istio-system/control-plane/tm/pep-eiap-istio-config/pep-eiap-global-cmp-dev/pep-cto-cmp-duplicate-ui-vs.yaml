apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-cto-cmp-duplicate-ui-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - cloud.dev.mypepsico.com
  - pep-cto-cmp-duplicate-ui.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /v1
    route:
    - destination:
        host: pep-cto-cmp-ui-poc-switchtoggle.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
        port:
          number: 80
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-cto-cmp-duplicate-ui.pep-eiap-global-cmp-dev.svc.cluster.local
        port:
          number: 80
  
  