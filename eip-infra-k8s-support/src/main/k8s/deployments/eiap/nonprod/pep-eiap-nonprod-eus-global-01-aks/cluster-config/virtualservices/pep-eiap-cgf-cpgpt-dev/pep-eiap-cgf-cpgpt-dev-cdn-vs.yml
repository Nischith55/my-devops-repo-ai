apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-eiap-cgf-cpgpt-dev-cv-cdn-vs
  namespace: pep-eiap-cgf-cpgpt-dev
spec:
  hosts:
    - cockpitgpt.dev.pepsico.com
  gateways:
  - "pep-eiap-cgf-cpgpt-dev/pep-eiap-cgf-cpgpt-dev-cv-gw"
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: "/"
    route:
    - destination:
        host:  "pep-eiap-cgf-cpgpt-dev-cv-webdeploy.pep-eiap-cgf-cpgpt-dev.svc.cluster.local"
        port:
          number: 80