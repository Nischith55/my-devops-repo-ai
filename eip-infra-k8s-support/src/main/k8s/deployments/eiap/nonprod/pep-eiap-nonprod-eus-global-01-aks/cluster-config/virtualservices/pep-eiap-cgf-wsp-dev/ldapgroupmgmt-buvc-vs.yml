apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: ldapgroupmgmt-buvc-vs
  namespace: pep-eiap-cgf-wsp-dev
  labels:
      app: ldapgroupmgmt
spec:
  hosts:
  - pep-eiap-cgf-wsp-ldapgroupmgmt-dev.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  gateways:
  - pep-eiap-cgf-wsp-dev/pep-eiap-cgf-wsp-dev-cv-gw
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: ldapgroupmgmt.pep-eiap-cgf-wsp-dev.svc.cluster.local
        port:
          number: 80
  