apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pepsico-cto-cmp-order-item-accumulator-v2-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pepsico-cto-cmp-order-item-accumulator-v2.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /cmp/api/order/item/accumulator-v2
    route:
    - destination:
        host: pepsico-cto-cmp-order-item-accumulator-v2.pep-eiap-global-cmp-dev.svc.cluster.local
        port:
          number: 80
          