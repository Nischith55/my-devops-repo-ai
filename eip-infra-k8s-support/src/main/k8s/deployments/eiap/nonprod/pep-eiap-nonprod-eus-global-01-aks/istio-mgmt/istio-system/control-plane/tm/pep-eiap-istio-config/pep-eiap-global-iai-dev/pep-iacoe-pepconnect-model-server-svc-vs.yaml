apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-iacoe-pepconnect-model-server-svc-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-iacoe-pepconnect-model-server-svc.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /model
    route:
    - destination:
        host: pep-iacoe-pepconnect-model-server-svc.pep-eiap-global-iai-dev.svc.cluster.local
        port:
          number: 8000
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-iacoe-pepconnect-model-server-svc.pep-eiap-global-iai-dev.svc.cluster.local
        port:
          number: 8265