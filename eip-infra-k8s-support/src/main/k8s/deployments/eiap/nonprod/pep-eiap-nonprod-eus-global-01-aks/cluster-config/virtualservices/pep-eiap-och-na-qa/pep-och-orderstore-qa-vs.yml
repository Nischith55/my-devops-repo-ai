apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-och-orderstore
  name: pep-och-orderstore-qa-vs
  namespace: pep-eiap-och-na-qa
spec:
  gateways:
  - pep-eiap-och-na-qa/pep-eiap-och-na-qa-cv-gw
  hosts:
  - pep-och-orderstore-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - corsPolicy:
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Link
      - Content-Type
      allowMethods:
      - POST
      - GET
      - PUT
      allowOrigins:
      - exact: https://pep-och-downconfirm-ui-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
      - exact: https://pep-och-ui-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
      - exact: https://pep-och-cleansing-ui-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
      - exact: https://pepcommerce-ordermanagement.qa.na.pepsico.com
      exposeHeaders:
      - x-total-count
    match:
    - ignoreUriCase: true
      uri:
        prefix: /v1/api/orders
    - ignoreUriCase: true
      uri:
        prefix: /v2/api/orders
    - ignoreUriCase: true
      uri:
        prefix: /management
    route:
    - destination:
        host: pep-och-orderstore.pep-eiap-och-na-qa.svc.cluster.local
        port:
          number: 80
