apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: orchestrator-int-api
  name: orchestrator-internal-api-vs
  namespace: pep-eiap-global-eiotp-dev
spec:
  gateways:
  - pep-eiap-global-eiotp-dev/pep-eiap-global-eiotp-dev-cv-gw
  hosts:
  - eiotpapi-int-dev.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        host: orchestrator-int-api.pep-eiap-global-eiotp-dev.svc.cluster.local
        port:
          number: 8080
