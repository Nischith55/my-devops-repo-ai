apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-eiap-cgf-wsp-drupal-service-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-eiap-cgf-wsp-drupal-service.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - route:
    - destination:
        host: drupal-service.pep-eiap-cgf-wsp-dev.svc.cluster.local
        port:
          number: 80
    match:
    - ignoreUriCase: true
      uri:
        prefix: /