apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-eip-global-gdm-userservice-service-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-eip-global-gdm-userservice-service-dev.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /api/
    route:
    - destination:
        host: pep-eip-global-gdm-userservice-service.pep-eiap-cgf-pdm-dev.svc.cluster.local
        port:
          number: 80