apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-eiap-global-eip-consumer-portal
  name: pep-eiap-global-eip-qa-vs
  namespace: pep-eiap-cgf-codeone-qa
spec:
  gateways:
  - pep-eiap-cgf-codeone-qa/pep-eiap-cgf-codeone-qa-cv-gw
  hosts:
  - pepsico-global-eipone-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /eipone/mdp/admin
    route:
    - destination:
        host: pep-eiap-global-eip-mdp.pep-eiap-cgf-codeone-qa.svc.cluster.local
        port:
          number: 80
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /eipone/cmp
    route:
    - destination:
        host: pep-eiap-global-cmp.pep-eiap-cgf-codeone-qa.svc.cluster.local
        port:
          number: 80
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /eipone/ddh
    route:
    - destination:
        host: pepsico-eip-eipone-ddh-integration.pep-eiap-cgf-codeone-qa.svc.cluster.local
        port:
          number: 80
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /eipone/backend
    route:
    - destination:
        host: pep-eiap-global-eip.pep-eiap-cgf-codeone-qa.svc.cluster.local
        port:
          number: 80
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /eipone/access-management
    route:
    - destination:
        host: pep-eiap-global-eip-access.pep-eiap-cgf-codeone-qa.svc.cluster.local
        port:
          number: 80
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /eipone/ami-service
    route:
    - destination:
        host: pep-eiap-global-eip-ami.pep-eiap-cgf-codeone-qa.svc.cluster.local
        port:
          number: 80
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /eipone/api-management
    route:
    - destination:
        host: pep-eiap-global-eip-api.pep-eiap-cgf-codeone-qa.svc.cluster.local
        port:
          number: 80
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /eipone/billing-service
    route:
    - destination:
        host: pep-eiap-global-eip-billing.pep-eiap-cgf-codeone-qa.svc.cluster.local
        port:
          number: 80
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /eipone/cle
    route:
    - destination:
        host: pep-eiap-global-eip-common-cle.pep-eiap-cgf-codeone-qa.svc.cluster.local
        port:
          number: 80
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /eipone/iai
    route:
    - destination:
        host: pep-eiap-global-iai.pep-eiap-cgf-codeone-qa.svc.cluster.local
        port:
          number: 80
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /eipone/consumer-portal
    route:
    - destination:
        host: pep-eiap-global-eip-consumer-portal.pep-eiap-cgf-codeone-qa.svc.cluster.local
        port:
          number: 80
