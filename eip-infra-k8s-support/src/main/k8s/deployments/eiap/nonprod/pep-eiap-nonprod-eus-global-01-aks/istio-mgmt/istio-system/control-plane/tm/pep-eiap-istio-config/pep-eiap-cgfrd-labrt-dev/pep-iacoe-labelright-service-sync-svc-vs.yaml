apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-iacoe-labelright-service-sync-svc-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-iacoe-labelright-service-sync-svc.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /labelright
    - ignoreUriCase: true
      uri:
        prefix: /lrwebinterface/hub
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-iacoe-labelright-service-sync-svc.pep-eiap-cgfrd-labrt-dev.svc.cluster.local
        port:
          number: 8000