apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-och-catalogservice-api-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-och-catalogservice-api.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-och-catalogservice-api.pep-eiap-och-na-dev.svc.cluster.local
        port:
          number: 80
    corsPolicy:
      allowOrigins:
      - exact: https://pep-och-ops-ui.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
      - exact: https://pep-och-developerportal-ui.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
      allowMethods:
      - POST
      - GET
      - PUT
      - DELETE
      - OPTIONS
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Content-Type
      exposeHeaders:
      - x-total-count          