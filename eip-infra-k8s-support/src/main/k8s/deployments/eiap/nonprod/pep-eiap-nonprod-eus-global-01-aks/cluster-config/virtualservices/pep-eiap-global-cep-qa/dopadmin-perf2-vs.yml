apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: dopadmin-perf2
  name: dopadmin-perf2-vs
  namespace: pep-eiap-global-cep-qa
spec:
  gateways:
  - pep-eiap-global-cep-qa/pep-eiap-global-cep-qa-cv-gw
  hosts:
  - pepcepa18.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  - admin-2.cep.stage.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: dopadmin-perf2.pep-eiap-global-cep-qa.svc.cluster.local
        port:
          number: 80
