apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: dsworkbench-latam
  name: dsworkbench-latam-vs
  namespace: pep-eiap-latam-lassot-dev
spec:
  gateways:
  - pep-eiap-latam-lassot-dev/pep-eiap-latam-lassot-dev-cv-gw
  hosts:
  - dsworkbench-latam.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: dsworkbench-latam.pep-eiap-latam-lassot-dev.svc.cluster.local
        port:
          number: 80
