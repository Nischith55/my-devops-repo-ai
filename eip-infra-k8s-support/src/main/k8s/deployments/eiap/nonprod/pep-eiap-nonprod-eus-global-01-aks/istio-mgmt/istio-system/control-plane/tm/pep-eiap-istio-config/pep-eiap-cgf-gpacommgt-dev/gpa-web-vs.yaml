apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: gpa-web-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - gpa-web.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: gpa-web.pep-eiap-cgf-gpacommgt-dev.svc.cluster.local
        port:
          number: 3000