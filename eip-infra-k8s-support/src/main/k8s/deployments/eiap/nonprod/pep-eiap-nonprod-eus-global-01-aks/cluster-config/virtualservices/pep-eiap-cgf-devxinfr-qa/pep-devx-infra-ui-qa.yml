apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-devx-infra-ui
  name: pep-devx-infra-ui-qa-vs
  namespace: pep-eiap-cgf-devxinfr-qa
spec:
  gateways:
  - pep-eiap-cgf-devxinfr-qa/pep-eiap-cgf-devxinfr-qa-cv-gw
  hosts:
  - pep-devx-infra-ui-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  - devx-infra.qa.mypepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-devx-infra-ui.pep-eiap-cgf-devxinfr-qa.svc.cluster.local
        port:
          number: 80
