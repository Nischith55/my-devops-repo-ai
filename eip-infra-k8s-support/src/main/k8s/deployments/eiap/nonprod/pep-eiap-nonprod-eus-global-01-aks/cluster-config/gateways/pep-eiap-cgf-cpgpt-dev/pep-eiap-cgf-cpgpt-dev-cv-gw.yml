apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: pep-eiap-cgf-cpgpt-dev-cv-gw
  namespace: pep-eiap-cgf-cpgpt-dev
spec:
  selector:
    istio: pep-eiap-ingress-gw01
  servers:
  - hosts:
    - dummy-passthrough-pep-eiap-cgf-cpgpt-dev.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    name: pep-eiap-cgf-cpgpt-dev-cv-gw-tls-443
    port:
      name: https-pep-eiap-cgf-cpgpt-dev-cv-gw-tls-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - pep-eiap-cgf-cpgpt-dev-cv.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pep-cpgpt-cgf-frontend.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pep-cpgpt-cgf-backend.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pep-cpgpt-cgf-ingestion.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pep-cpgpt-cgf-knowledgegraph.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pep-cpgpt-cgf-scheduled-jobs.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pep-cpgpt-cgf-sql-gen.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pep-fpa-cockpitgpt-genai-app.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    name: pep-eiap-cgf-cpgpt-dev-cv-gw-https-443
    port:
      name: https-pep-eiap-cgf-cpgpt-dev-cv-gw-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-eiap-nonprod-eus-global-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - cockpitgpt.dev.mypepsico.com
    - pep-eiap-cgf-cpgpt-dev-cv.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pep-cpgpt-cgf-frontend.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pep-cpgpt-cgf-backend.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pep-cpgpt-cgf-ingestion.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pep-cpgpt-cgf-knowledgegraph.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pep-cpgpt-cgf-scheduled-jobs.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pep-cpgpt-cgf-sql-gen.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pep-fpa-cockpitgpt-genai-app.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    name: pep-eiap-cgf-cpgpt-dev-cv-gw-http-80
    port:
      name: http-pep-eiap-cgf-cpgpt-dev-cv-gw-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true
  - hosts:
    - cockpitgpt.dev.mypepsico.com
    name: pep-eiap-cgf-cpgpt-dev-cv1-gw-1-https-443
    port:
      name: https-pep-eiap-cgf-cpgpt1-dev-cv-gw-1-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-eiap-nonprod-eus-global-cockpitgpt-dev-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE

