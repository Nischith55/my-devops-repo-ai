apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: dopapp-perf3-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pepcepb19.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  - web-3.cep.stage.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: dopapp-perf3.pep-eiap-global-cep-qa.svc.cluster.local
        port:
          number: 80