apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: qa-dlops-frontend
  name: qa-dlops-frontend-vs
  namespace: pep-eiap-cgf-eedlops-qa
spec:
  gateways:
  - pep-eiap-cgf-eedlops-qa/pep-eiap-cgf-eedlops-qa-cv-gw
  hosts:
  - qa-dlops-frontend.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: qa-dlops-frontend.pep-eiap-cgf-eedlops-qa.svc.cluster.local
        port:
          number: 3000
