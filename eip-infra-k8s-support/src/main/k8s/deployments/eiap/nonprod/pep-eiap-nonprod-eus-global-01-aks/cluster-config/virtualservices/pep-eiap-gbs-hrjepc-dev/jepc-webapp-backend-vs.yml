apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: jepc-webapp-backend
  name: jepc-webapp-backend-vs
  namespace: pep-eiap-gbs-hrjepc-dev
spec:
  gateways:
  - pep-eiap-gbs-hrjepc-dev/pep-eiap-gbs-hrjepc-dev-cv-gw
  hosts:
  - jepc-webapp-backend.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: jepc-webapp-backend.pep-eiap-gbs-hrjepc-dev.svc.cluster.local
        port:
          number: 80
