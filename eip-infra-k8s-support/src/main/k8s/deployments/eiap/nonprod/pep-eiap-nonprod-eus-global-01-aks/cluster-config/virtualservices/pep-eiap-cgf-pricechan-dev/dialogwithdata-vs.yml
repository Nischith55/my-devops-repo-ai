apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: dialogwithdata
  name: dialogwithdata-vs
  namespace: pep-eiap-cgf-pricechan-dev
spec:
  gateways:
  - pep-eiap-cgf-pricechan-dev/pep-eiap-cgf-pricechan-dev-cv-gw
  hosts:
  - dialogwithdata.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pfb-pricing-solution-webapp-ui.pep-eiap-cgf-pricechan-dev.svc.cluster.local
        port:
          number: 80
