apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: och-bees-catalog-batch
  name: och-bees-catalog-batch-vs
  namespace: pep-eiap-och-na-dev
spec:
  gateways:
  - pep-eiap-och-na-dev/pep-eiap-och-na-dev-cv-gw
  hosts:
  - och-bees-catalog-batch.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: och-bees-catalog-batch.pep-eiap-och-na-dev.svc.cluster.local
        port:
          number: 80
