apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-eiap-cgf-psm-qa-api
  name: pep-eiap-cgf-psm-qa-api-vs
  namespace: pep-eiap-cgf-psm-qa
spec:
  gateways:
  - pep-eiap-cgf-psm-qa/pep-eiap-cgf-psm-qa-cv-gw
  hosts:
  - pep-eiap-cgf-psm-qa-api-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-eiap-cgf-psm-qa-api.pep-eiap-cgf-psm-qa.svc.cluster.local
        port:
          number: 8000
