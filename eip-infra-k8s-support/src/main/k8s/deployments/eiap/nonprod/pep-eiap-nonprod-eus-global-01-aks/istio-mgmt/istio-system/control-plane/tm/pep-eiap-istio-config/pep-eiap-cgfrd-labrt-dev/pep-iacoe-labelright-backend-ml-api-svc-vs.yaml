apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-iacoe-labelright-backend-ml-api-svc-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-iacoe-labelright-backend-ml-api-svc.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-iacoe-labelright-backend-ml-api-svc.pep-eiap-cgfrd-labrt-dev.svc.cluster.local
        port:
          number: 8000
    corsPolicy:   
      allowOrigins:
      - exact: https://pep-iacoe-labelright-frontend-ui-svc.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
      - exact: https://pep-iacoe-labelright-service-sync-svc.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
      - exact: https://pep-iacoe-labelright-backend-api-svc.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
      - exact: https://peplabelrightdevsa.z13.web.core.windows.net
      - exact: https://api-na.dev.mypepsico.com
      - exact: https://labelrightglobal.dev.mypepsico.com
      allowMethods:
      - POST
      - GET
      - PUT
      - DELETE
      - OPTIONS
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Link
      - Content-Type
      - Access-Control-Allow-Origin  
      - Timeout
      - x-functions-key      
      - Access-Control-Allow-Headers
      