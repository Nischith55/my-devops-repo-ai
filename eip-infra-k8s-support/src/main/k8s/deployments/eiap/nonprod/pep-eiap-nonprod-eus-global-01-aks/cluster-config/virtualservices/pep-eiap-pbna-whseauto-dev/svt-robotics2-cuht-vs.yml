  - pep-pbna-nonprod-svt-robotics2.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  gateways:
  - pep-eiap-pbna-whseauto-dev/pep-eiap-pbna-whseauto-dev-cv-gw
  http:
