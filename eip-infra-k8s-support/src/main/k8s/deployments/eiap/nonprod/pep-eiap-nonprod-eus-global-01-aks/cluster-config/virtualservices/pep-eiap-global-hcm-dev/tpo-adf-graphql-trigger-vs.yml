apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: tpo-adf-graphql-trigger
  name: tpo-adf-graphql-trigger-vs
  namespace: pep-eiap-global-hcm-dev
spec:
  gateways:
  - pep-eiap-global-hcm-dev/pep-eiap-global-hcm-dev-cv-gw
  hosts:
  - tpo-adf-graphql-trigger.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: tpo-adf-graphql-trigger.pep-eiap-global-hcm-dev.svc.cluster.local
        port:
          number: 80
