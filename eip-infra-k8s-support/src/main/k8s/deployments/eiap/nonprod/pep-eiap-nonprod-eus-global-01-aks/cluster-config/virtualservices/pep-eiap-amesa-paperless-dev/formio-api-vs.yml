apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: formio-api
  name: formio-api-vs
  namespace: pep-eiap-amesa-paperless-dev
spec:
  gateways:
  - pep-eiap-amesa-paperless-dev/pep-eiap-amesa-paperless-dev-cv-gw
  hosts:
  - formio-api.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: formio-api.pep-eiap-amesa-paperless-dev.svc.cluster.local
        port:
          number: 3000
