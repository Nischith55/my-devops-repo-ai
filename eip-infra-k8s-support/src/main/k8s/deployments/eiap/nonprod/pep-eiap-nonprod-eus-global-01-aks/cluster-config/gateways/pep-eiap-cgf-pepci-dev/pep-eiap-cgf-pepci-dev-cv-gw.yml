apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: pep-eiap-cgf-pepci-dev-cv-gw
  namespace: pep-eiap-cgf-pepci-dev
spec:
  selector:
    istio: pep-eiap-ingress-gw01
  servers:
  - hosts:
    - dummy-passthrough-pep-eiap-cgf-pepci-dev.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    name: pep-eiap-cgf-pepci-dev-cv-gw-tls-443
    port:
      name: https-pep-eiap-cgf-pepci-dev-cv-gw-tls-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - pep-eiap-cgf-pepci-dev-cv.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pepci-web-app-dev.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pepci-management-service-dev.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pepci-pgt-eamchatbot-dev.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    name: pep-eiap-cgf-pepci-dev-cv-gw-https-443
    port:
      name: https-pep-eiap-cgf-pepci-dev-cv-gw-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-eiap-nonprod-eus-global-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - pepci.dev.mypepsico.com
    - pep-eiap-cgf-pepci-dev-cv.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pepci-web-app-dev.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pepci-management-service-dev.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pepci-pgt-eamchatbot-dev.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    name: pep-eiap-cgf-pepci-dev-cv-gw-http-80
    port:
      name: http-pep-eiap-cgf-pepci-dev-cv-gw-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true
  - hosts:
    - pepci.dev.mypepsico.com
    name: pep-eiap-cgf-pepci-dev-cv-gw-https-1-443
    port:
      name: https-pep-eiap-cgf-pepci-dev-cv-gw-1-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-eiap-cgf-pepci-dev-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE

