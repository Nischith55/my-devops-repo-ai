apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: management-portal
  name: management-portal-vs
  namespace: pep-eiap-global-eiotp-dev
spec:
  gateways:
  - pep-eiap-global-eiotp-dev/pep-eiap-global-eiotp-dev-cv-gw
  hosts:
  - iotui-d.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        host: management-portal.pep-eiap-global-eiotp-dev.svc.cluster.local
        port:
          number: 80
