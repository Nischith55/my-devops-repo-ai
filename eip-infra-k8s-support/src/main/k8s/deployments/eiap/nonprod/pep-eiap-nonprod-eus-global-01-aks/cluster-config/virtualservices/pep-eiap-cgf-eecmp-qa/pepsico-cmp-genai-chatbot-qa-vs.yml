apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: undefined
  name: pepsico-cmp-genai-chatbot-qa-vs
  namespace: pep-eiap-cgf-eecmp-qa
spec:
  gateways:
  - pep-eiap-cgf-eecmp-qa/pep-eiap-cgf-eecmp-qa-cv-gw
  hosts:
  - pepsico-cmp-genai-chatbot-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /genai/v1
    route:
    - destination:
        host: pepsico-cmp-genai-chatbot.pep-eiap-cgf-eecmp-qa.svc.cluster.local
        port:
          number: 8003
