apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-eip-amesa-nonprod-agro-api
  name: pep-eip-amesa-nonprod-agro-api-vs9
  namespace: pep-eiap-amesa-ksaeinvc-qa
spec:
  gateways:
  - pep-eiap-amesa-ksaeinvc-qa/pep-eiap-amesa-ksaeinvc-qa-cv-gw
  hosts:
  - api-pep-eip-amesa-nonprod-agro.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-eip-amesa-nonprod-agro-api.pep-eiap-amesa-ksaeinvc-qa.svc.cluster.local
        port:
          number: 80
  - corsPolicy:
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Content
      - Access-Control-Allow-Origin
      - Timeout
      - x-functions-key
      - Access-Control-Allow-Headers
      allowMethods:
      - GET
      - PUT
      - POST
      - DELETE
      - OPTIONS
      allowOrigins:
      - exact: https://api-na.qa.mypepsico.com/
      - exact: https://sodastreamprofessional.dev.pepsico.com/
      - exact: https://sodastreamprofessional.qa.pepsico.com/
      exposeHeaders:
      - x-total-count
      - x-source
      - Content-Disposition
    match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-eip-amesa-nonprod-agro-api.pep-eiap-amesa-ksaeinvc-qa.svc.cluster.local
        port:
          number: 80
