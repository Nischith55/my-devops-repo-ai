apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: cto-event-admin-ui-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - cto-event-admin-ui.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        host: cto-event-admin-ui.pep-eiap-global-eventapp-dev.svc.cluster.local
        port:
          number: 8080
