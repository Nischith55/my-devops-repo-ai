apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: vct-dsd-directsubscription-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - vct-dsd-directsubscription.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /vct-dsd-directsubscription
    route:
    - destination:
        host: vct-dsd-directsubscription.pep-eiap-cgf-dpsdsd-dev.svc.cluster.local
        port:
          number: 80