apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-eip-amesa-apbuddy-chatbot
  name: pep-eip-amesa-apbuddy-chatbot-vs
  namespace: pep-eiap-global-services-dev
spec:
  gateways:
  - pep-eiap-global-services-dev/pep-eiap-global-services-dev-cv-gw
  hosts:
  - pep-eip-amesa-apbuddy-chatbot.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /amesa/apbuddy/v1/invoices
    route:
    - destination:
        host: pep-eip-amesa-apbuddy-chatbot.pep-eiap-global-services-dev.svc.cluster.local
        port:
          number: 80
