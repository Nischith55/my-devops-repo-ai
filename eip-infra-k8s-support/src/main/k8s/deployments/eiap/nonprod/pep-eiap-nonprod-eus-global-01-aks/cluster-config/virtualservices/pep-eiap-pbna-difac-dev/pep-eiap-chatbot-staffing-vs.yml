apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-eip-pbna-chatbot-api-hrnationalstaffing-ingest
  name: pep-eiap-chatbot-staffing-vs
  namespace: pep-eiap-pbna-difac-dev
spec:
  gateways:
  - pep-eiap-pbna-difac-dev/pep-eiap-pbna-difac-dev-cv-gw
  hosts:
  - pep-eiap-chatbot-staffing.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /api/v1/nationalstaffing
    route:
    - destination:
        host: pep-eip-pbna-chatbot-api-nationalstaffing.pep-eiap-pbna-difac-dev.svc.cluster.local
        port:
          number: 80
