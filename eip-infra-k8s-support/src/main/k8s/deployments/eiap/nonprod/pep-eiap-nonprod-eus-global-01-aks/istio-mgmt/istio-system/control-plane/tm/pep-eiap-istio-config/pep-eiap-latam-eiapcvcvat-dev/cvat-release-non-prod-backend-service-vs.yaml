apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: cvat-release-non-prod-backend-service-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - cvat-release-non-prod-backend-service.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /api
    - ignoreUriCase: true
      uri:
        prefix: /admin
    - ignoreUriCase: true
      uri:
        prefix: /static
    - ignoreUriCase: true
      uri:
        prefix: /django-rq
    - ignoreUriCase: true
      uri:
        prefix: /profiler
    route:
    - destination:
        host: cvat-release-non-prod-backend-service.pep-eiap-latam-eiapcvcvat-dev.svc.cluster.local
        port:
          number: 8080