apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-eiap-cntwdev-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - cntwdev.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  # - vctswdev.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  - controltower.dev.mypepsico.com
  # updated for vct routing issue.
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: cntwdev.pep-eiap-pfna-vct-dev.svc.cluster.local
        port:
          number: 80
