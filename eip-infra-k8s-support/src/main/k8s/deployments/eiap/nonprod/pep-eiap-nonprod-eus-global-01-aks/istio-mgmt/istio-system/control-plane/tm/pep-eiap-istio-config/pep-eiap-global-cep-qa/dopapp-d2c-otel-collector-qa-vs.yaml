apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: dopapp-d2c-otel-collector-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-cep-opentelemetrycollector.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: dopapp-d2c-otel-collector.pep-eiap-global-cep-qa.svc.cluster.local
        port:
          number: 55681
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /health
    route:
    - destination:
        host: dopapp-d2c-otel-collector.pep-eiap-global-cep-qa.svc.cluster.local
        port:
          number: 13133
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /metrics
    route:
    - destination:
        host: dopapp-d2c-otel-collector.pep-eiap-global-cep-qa.svc.cluster.local
        port:
          number: 8888