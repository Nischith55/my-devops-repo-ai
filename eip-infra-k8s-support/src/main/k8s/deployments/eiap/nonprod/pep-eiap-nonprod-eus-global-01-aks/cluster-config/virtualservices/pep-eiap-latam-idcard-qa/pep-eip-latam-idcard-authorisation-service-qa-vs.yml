apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: authorisation-service
  name: pep-eip-latam-idcard-authorisation-service-qa-vs
  namespace: pep-eiap-latam-idcard-qa
spec:
  gateways:
  - pep-eiap-latam-idcard-qa/pep-eiap-latam-idcard-qa-cv-gw
  hosts:
  - idcardpmf.qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  - idcardpmf.qa.intra.pepsico.com
  http:
  - fault:
      abort:
        httpStatus: 404
        percentage:
          value: 100
    match:
    - ignoreUriCase: true
      uri:
        prefix: /actuator
    route:
    - destination:
        host: none
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        host: pep-eip-latam-idcard-authorisation-service.pep-eiap-latam-idcard-qa.svc.cluster.local
        port:
          number: 80
