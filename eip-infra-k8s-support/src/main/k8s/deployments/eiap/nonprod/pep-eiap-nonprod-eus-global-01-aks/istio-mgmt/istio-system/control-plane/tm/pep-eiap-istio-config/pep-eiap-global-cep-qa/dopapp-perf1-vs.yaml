apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: dopapp-perf1-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pepcepb21.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  - web-1.cep.stage.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: dopapp-perf1.pep-eiap-global-cep-qa.svc.cluster.local
        port:
          number: 80