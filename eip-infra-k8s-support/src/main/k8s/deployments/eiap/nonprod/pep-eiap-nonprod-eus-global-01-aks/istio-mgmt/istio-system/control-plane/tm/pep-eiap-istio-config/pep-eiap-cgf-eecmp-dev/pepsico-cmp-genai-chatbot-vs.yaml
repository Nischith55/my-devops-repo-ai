apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pepsico-cmp-genai-chatbot-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pepsico-cmp-genai-chatbot.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /genai/v1
    route:
    - destination:
        host: pepsico-cmp-genai-chatbot.pep-eiap-cgf-eecmp-dev.svc.cluster.local
        port:
          number: 8080