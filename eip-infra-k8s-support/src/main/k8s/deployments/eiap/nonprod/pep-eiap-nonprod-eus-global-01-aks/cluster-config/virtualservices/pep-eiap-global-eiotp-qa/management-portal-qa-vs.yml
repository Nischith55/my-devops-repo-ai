apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: management-portal
  name: management-portal-qa-vs
  namespace: pep-eiap-global-eiotp-qa
spec:
  gateways:
  - pep-eiap-global-eiotp-qa/pep-eiap-global-eiotp-qa-cv-gw
  hosts:
  - iotui-q.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        host: management-portal.pep-eiap-global-eiotp-qa.svc.cluster.local
        port:
          number: 80
