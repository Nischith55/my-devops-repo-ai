apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-cpgpt-cgf-ingestion-yoot-vs
  namespace: pep-eiap-cgf-cpgpt-qa
  labels:
      app: pep-cpgpt-cgf-ingestion
spec:
  hosts:
  - pep-cpgpt-cgf-ingestion-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  gateways:
  - pep-eiap-cgf-cpgpt-qa/pep-eiap-cgf-cpgpt-qa-cv-gw
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-cpgpt-cgf-ingestion.pep-eiap-cgf-cpgpt-qa.svc.cluster.local
        port:
          number: 8080
  