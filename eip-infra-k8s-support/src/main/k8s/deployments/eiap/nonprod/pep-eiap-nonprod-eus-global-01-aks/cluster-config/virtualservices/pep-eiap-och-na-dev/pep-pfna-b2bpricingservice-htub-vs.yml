apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-pfna-b2bpricingservice-htub-vs
  namespace: pep-eiap-och-na-dev
  labels:
      app: pep-pfna-b2bpricingservice
spec:
  hosts:
  - pep-pfna-b2bpricingservice-dev.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  gateways:
  - pep-eiap-och-na-dev/pep-eiap-och-na-dev-cv-gw
  http:
  - corsPolicy:
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Link
      - Content-Type
      - Access-Control-Allow-Origin
      - Access-Control-Allow-Headers
      allowMethods:
      - POST
      - GET
      - PUT
      - DELETE
      - OPTIONS
      allowOrigins:
      - exact: https://pep-och-ui.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
      exposeHeaders:
      - x-total-count
    match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-pfna-b2bpricingservice.pep-eiap-och-na-dev.svc.cluster.local
        port:
          number: 80
  