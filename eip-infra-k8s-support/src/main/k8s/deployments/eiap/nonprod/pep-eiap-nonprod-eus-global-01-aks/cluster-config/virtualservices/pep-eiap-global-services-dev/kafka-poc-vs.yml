apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: kafka-poc
  name: kafka-poc-vs
  namespace: pep-eiap-global-services-dev
spec:
  gateways:
  - pep-eiap-global-services-dev/pep-eiap-global-services-dev-cv-gw
  hosts:
  - kafka-poc.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        host: kafka-poc.pep-eiap-global-services-dev.svc.cluster.local
        port:
          number: 80
