apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-eip-gbs-hrjepc-webappbackend
  name: pep-eip-gbs-hrjepc-webappbackend-vs
  namespace: pep-eiap-gbs-hrjepc-dev
spec:
  gateways:
  - pep-eiap-gbs-hrjepc-dev/pep-eiap-gbs-hrjepc-dev-cv-gw
  hosts:
  - pep-eip-gbs-hrjepc-webappbackend.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /jepc
    route:
    - destination:
        host: pep-eip-gbs-hrjepc-webappbackend.pep-eiap-gbs-hrjepc-dev.svc.cluster.local
        port:
          number: 80
