apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-iacoe-labelright-backend-api-svc-qa-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-iacoe-labelright-backend-api-svc-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /lid
    - ignoreUriCase: true
      uri:
        prefix: /artwork
    - ignoreUriCase: true
      uri:
        prefix: /swagger-ui.html#/
    - ignoreUriCase: true
      uri:
        prefix: /      
    route:
    - destination:
        host: pep-iacoe-labelright-backend-api-svc-qa.pep-eiap-cgf-labelright-qa.svc.cluster.local
        port:
          number: 8000