apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-btb-cgf-backenddev-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-btb-cgf-backenddev.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /api/v1/filter
    route:
    - destination:
        host: pep-eiap-cgf-btb-app-filter.pep-eiap-cgf-btb-dev.svc.cluster.local
        port:
          number: 80
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /api/v1/pepsense
    route:
    - destination:
        host: pep-eiap-cgf-btb-app-pepsense.pep-eiap-cgf-btb-dev.svc.cluster.local
        port:
          number: 80
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /api/v1/alerts
    route:
    - destination:
        host: pep-eiap-cgf-btb-app-alerts.pep-eiap-cgf-btb-dev.svc.cluster.local
        port:
          number: 80
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /api/v1/userpreferences
    route:
    - destination:
        host: pep-eiap-cgf-btb-app-userpreferences.pep-eiap-cgf-btb-dev.svc.cluster.local
        port:
          number: 80
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /api/v1/accessmanagement
    route:
    - destination:
        host: pep-eiap-cgf-btb-app-accessmanagement.pep-eiap-cgf-btb-dev.svc.cluster.local
        port:
          number: 80
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-eiap-cgf-btb-app-equipment.pep-eiap-cgf-btb-dev.svc.cluster.local
        port:
          number: 80  
    corsPolicy:
      allowOrigins:
      - exact: https://api-na.qa.mypepsico.com/
      - exact: https://sodastreamprofessional.dev.pepsico.com/
      - exact: https://sodastreamprofessional.qa.pepsico.com/
      - exact: https://api-na.dev.mypepsico.com/
      - exact: https://pep-btb-cgf-backenddev.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com/api/v1
      allowMethods:
      - GET
      - PUT
      - POST
      - DELETE
      - OPTIONS
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Content-Type
      - Access-Control-Allow-Origin
      - Timeout
      - x-functions-key
      - Access-Control-Allow-Headers
      exposeHeaders:
      - x-total-count
      - x-source 
      - Content-Disposition        