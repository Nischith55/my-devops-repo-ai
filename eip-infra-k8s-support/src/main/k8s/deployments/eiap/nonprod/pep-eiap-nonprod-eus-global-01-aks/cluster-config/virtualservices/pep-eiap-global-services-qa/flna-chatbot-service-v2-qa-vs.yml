apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: flna-chatbot-service-v2
  name: flna-chatbot-service-v2-qa-vs
  namespace: pep-eiap-global-services-qa
spec:
  gateways:
  - pep-eiap-global-services-qa/pep-eiap-global-services-qa-cv-gw
  hosts:
  - flna-chatbot-service-v2-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        host: flna-chatbot-service-v2.pep-eiap-global-services-qa.svc.cluster.local
        port:
          number: 80
