apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pepsico-eip-latam-segment-survey-ingest
  name: pepsico-eip-latam-segment-survey-ingest-vs
  namespace: pep-eiap-latam-gtm-dev
spec:
  gateways:
  - pep-eiap-latam-gtm-dev/pep-eiap-latam-gtm-dev-cv-gw
  hosts:
  - pepsico-eip-latam-segment-survey-ingest.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /api/v1/survey
    route:
    - destination:
        host: pepsico-eip-latam-segment-survey-ingest.pep-eiap-latam-gtm-dev.svc.cluster.local
        port:
          number: 80
