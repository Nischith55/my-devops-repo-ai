apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: cvdemo-tempod1
  name: cvdemo-tempod1-vs
  namespace: pep-eiap-global-iai-dev
spec:
  gateways:
  - pep-eiap-global-iai-dev/pep-eiap-global-iai-dev-cv-gw
  hosts:
  - cvdemo-tempod1.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: cvdemo-tempod1.pep-eiap-global-iai-dev.svc.cluster.local
        port:
          number: 8000
