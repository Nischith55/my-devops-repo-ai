apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: dlops-frontend-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - dlops-frontend.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: dlops-frontend.pep-eiap-cgf-dlops-dev.svc.cluster.local
        port:
          number: 3000