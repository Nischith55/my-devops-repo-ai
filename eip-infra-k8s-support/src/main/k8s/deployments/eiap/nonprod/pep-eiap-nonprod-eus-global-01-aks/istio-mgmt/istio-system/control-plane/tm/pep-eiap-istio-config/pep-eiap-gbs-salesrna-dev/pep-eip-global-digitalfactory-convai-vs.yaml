apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-eip-global-digitalfactory-convai-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-eip-global-digitalfactory-convai.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /sales
    route:
    - destination:
        host: pep-eip-global-digitalfactory-convai.pep-eiap-gbs-salesrna-dev.svc.cluster.local
        port:
          number: 80