apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: nginx-dev-xsoy-vs
  namespace: pep-eiap-global-cmp-dev
  labels:
      app: nginx-dev
spec:
  hosts:
  - nginx-dev.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  gateways:
  - pep-eiap-global-cmp-dev/pep-eiap-global-cmp-dev-cv-gw
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: nginx-dev.pep-eiap-global-cmp-dev.svc.cluster.local
        port:
          number: 80
  