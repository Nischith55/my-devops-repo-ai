apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: picasso-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts: 
  - picasso.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  - picasso.dev.intra.pepsico.com 
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-eip-flna-dxpicasso-angular.pep-eiap-flna-dxpicasso-dev.svc.cluster.local
        port:
          number: 80