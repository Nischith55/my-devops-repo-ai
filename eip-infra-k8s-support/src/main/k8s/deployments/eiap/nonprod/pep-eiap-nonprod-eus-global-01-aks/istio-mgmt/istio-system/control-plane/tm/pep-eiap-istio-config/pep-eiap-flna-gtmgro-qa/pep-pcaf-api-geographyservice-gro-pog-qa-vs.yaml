apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-pcaf-api-geographyservice-gro-pog-qa-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-pcaf-api-geographyservice-gro-pog-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /api/v1/pog/gro/geography
    route:
    - destination:
        host: pep-pcaf-api-geographyservice-gro-pog.pep-eiap-flna-gtmgro-qa.svc.cluster.local
        port:
          number: 80