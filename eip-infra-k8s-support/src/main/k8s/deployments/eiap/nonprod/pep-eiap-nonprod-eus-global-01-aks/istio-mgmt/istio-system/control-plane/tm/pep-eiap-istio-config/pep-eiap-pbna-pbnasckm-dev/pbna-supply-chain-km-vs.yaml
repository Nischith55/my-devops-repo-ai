apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pbna-supply-chain-km-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pbna-supply-chain-km.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pbna-supply-chain-km.pep-eiap-pbna-pbnasckm-dev.svc.cluster.local
        port:
          number: 8080