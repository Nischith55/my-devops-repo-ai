apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pes-googleapi-service
  name: pes-googleapi-service-qa-vs
  namespace: pep-eiap-pbna-cets-qa
spec:
  gateways:
  - pep-eiap-pbna-cets-qa/pep-eiap-pbna-cets-qa-cv-gw
  hosts:
  - pes-googleapi-service-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pes-googleapi-service.pep-eiap-pbna-cets-qa.svc.cluster.local
        port:
          number: 80
