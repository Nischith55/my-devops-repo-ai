apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: tpo-powerbi-serve-layer
  name: tpo-powerbi-serve-layer-vs
  namespace: pep-eiap-global-hcm-dev
spec:
  gateways:
  - pep-eiap-global-hcm-dev/pep-eiap-global-hcm-dev-cv-gw
  hosts:
  - tpo-powerbi-serve-layer.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: tpo-powerbi-serve-layer.pep-eiap-global-hcm-dev.svc.cluster.local
        port:
          number: 80
