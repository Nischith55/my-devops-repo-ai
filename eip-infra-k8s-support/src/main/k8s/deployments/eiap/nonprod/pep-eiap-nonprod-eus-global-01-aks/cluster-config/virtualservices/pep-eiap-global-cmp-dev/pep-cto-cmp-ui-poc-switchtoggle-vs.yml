apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-eip-global-cmp-ui-apigee
  name: pep-eip-global-cmp-ui-apigee-vs
  namespace: pep-eiap-global-cmp-dev
spec:
  gateways:
  - pep-eiap-global-cmp-dev/pep-eiap-global-cmp-dev-cv-gw
  hosts:
  - pep-eip-global-cmp-ui-apigee.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pepsico-eip-global-cmp-ui-apigee.pep-eiap-global-cmp-dev.svc.cluster.local
        port:
          number: 80
