apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: digital-factory-dsi
  name: digital-factory-dsi-qa-vs
  namespace: pep-eiap-latam-lassot-qa
spec:
  gateways:
  - pep-eiap-latam-lassot-qa/pep-eiap-latam-lassot-qa-cv-gw
  hosts:
  - digital-factory-dsi-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: digital-factory-dsi.pep-eiap-latam-lassot-qa.svc.cluster.local
        port:
          number: 80
