apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: dsi-onepep-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - dsi-onepep.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: dsi-onepep.pep-eiap-pfna-vct-dev.svc.cluster.local