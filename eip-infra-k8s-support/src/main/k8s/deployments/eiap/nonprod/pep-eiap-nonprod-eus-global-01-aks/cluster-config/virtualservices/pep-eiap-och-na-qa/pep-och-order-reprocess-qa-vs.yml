apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-och-order-reprocess
  name: pep-och-order-reprocess-qa-vs
  namespace: pep-eiap-och-na-qa
spec:
  gateways:
  - pep-eiap-och-na-qa/pep-eiap-och-na-qa-cv-gw
  hosts:
  - pep-och-order-reprocess-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - corsPolicy:
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Link
      - Content-Type
      - Access-Control-Allow-Origin
      allowMethods:
      - POST
      - GET
      allowOrigins:
      - exact: https://pep-och-falloutmanagement-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
      - exact: https://pep-och-ui-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
      - exact: https://pepcommerce-ordermanagement.qa.na.pepsico.com
      exposeHeaders:
      - x-total-count
      - x-source
    match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-och-order-reprocess.pep-eiap-och-na-qa.svc.cluster.local
        port:
          number: 80
