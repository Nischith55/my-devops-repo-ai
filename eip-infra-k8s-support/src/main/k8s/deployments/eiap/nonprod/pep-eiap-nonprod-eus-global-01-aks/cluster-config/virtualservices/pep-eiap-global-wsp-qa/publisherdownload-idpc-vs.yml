apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: publisherdownload-idpc-vs
  namespace: pep-eiap-global-wsp-qa
  labels:
      app: publisherdownload
spec:
  hosts:
  - pep-eiap-cgf-wsp-publisherdownload-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  gateways:
  - pep-eiap-global-wsp-qa/pep-eiap-global-wsp-qa-cv-gw
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: publisherdownload.pep-eiap-global-wsp-qa.svc.cluster.local
        port:
          number: 80
  