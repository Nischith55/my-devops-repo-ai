apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: cv-opa
  name: cv-opa-dev-vs
  namespace: pep-eiap-cgf-cvopa-dev
spec:
  gateways:
  - pep-eiap-cgf-cvopa-dev/pep-eiap-cgf-cvopa-dev-cv-gw
  hosts:
  - cv-opa-dev.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: cv-opa.pep-eiap-cgf-cvopa-dev.svc.cluster.local
        port:
          number: 8181
