apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: kotsadm
  name: swaggerhub-dev-admin-vs
  namespace: pep-eiap-cgf-swaggerhub-dev
spec:
  gateways:
  - pep-eiap-cgf-swaggerhub-dev/pep-eiap-cgf-swaggerhub-dev-cv-gw
  hosts:
  - swaggerhub-dev-admin.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        host: kotsadm.pep-eiap-cgf-swaggerhub-dev.svc.cluster.local
        port:
          number: 3000
