apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pepgenx-document-loader-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pepgenx-document-loader.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pepgenx-document-loader.pep-eiap-cgf-pepgenx-dev.svc.cluster.local
        port:
          number: 8080
          