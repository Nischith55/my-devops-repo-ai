apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: df-fileupload-ui
  name: df-fileupload-ui-vs
  namespace: pep-eiap-global-hcm-dev
spec:
  gateways:
  - pep-eiap-global-hcm-dev/pep-eiap-global-hcm-dev-cv-gw
  hosts:
  - df-fileupload-ui.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  - df-fileupload-ui.dev.mypepsico.com
  tls:
  - match:
    - port: 443
      sniHosts:
      - df-fileupload-ui.dev.mypepsico.com
      - df-fileupload-ui.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    route:
    - destination:
        host: df-fileupload-ui.pep-eiap-global-hcm-dev.svc.cluster.local
        port:
          number: 443
