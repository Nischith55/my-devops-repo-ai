apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-eiotp-dev-portal-qa-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - iotui-q.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        host: pep-eiotp-qa-portal.pep-eiap-global-eiotp-qa.svc.cluster.local
        port:
          number: 8080
