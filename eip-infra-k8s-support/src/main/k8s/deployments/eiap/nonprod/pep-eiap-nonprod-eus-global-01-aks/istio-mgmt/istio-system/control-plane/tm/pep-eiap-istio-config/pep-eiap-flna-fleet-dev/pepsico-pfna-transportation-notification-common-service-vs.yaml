apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pepsico-pfna-transportation-notification-common-service-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pepsico-pfna-transportation-notification-common-service.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /pfna/transportation/notification/v1
    route:
    - destination:
        host: pepsico-pfna-transportation-notification-common-service.pep-eiap-flna-fleet-dev.svc.cluster.local
        port:
          number: 80