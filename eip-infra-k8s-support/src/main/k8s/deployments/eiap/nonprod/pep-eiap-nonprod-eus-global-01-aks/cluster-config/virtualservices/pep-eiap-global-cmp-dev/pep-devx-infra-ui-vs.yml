apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-devx-infra-ui
  name: pep-devx-infra-ui-vs
  namespace: pep-eiap-cgf-devx-dev
spec:
  gateways:
  - pep-eiap-cgf-devx-dev/pep-eiap-cgf-devx-dev-cv-gw
  hosts:
  - pep-devx-infra-ui.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-devx-infra-ui.pep-eiap-cgf-devx-dev.svc.cluster.local
        port:
          number: 80
