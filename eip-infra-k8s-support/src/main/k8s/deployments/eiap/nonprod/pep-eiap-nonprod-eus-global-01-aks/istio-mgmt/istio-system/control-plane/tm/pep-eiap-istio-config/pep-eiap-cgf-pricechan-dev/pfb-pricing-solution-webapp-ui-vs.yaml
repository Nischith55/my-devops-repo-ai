apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pfb-pricing-solution-webapp-ui-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pfb-pricing-solution-webapp-ui.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pfb-pricing-solution-webapp-ui.pep-eiap-cgf-pricechan-dev.svc.cluster.local
        port:
          number: 80