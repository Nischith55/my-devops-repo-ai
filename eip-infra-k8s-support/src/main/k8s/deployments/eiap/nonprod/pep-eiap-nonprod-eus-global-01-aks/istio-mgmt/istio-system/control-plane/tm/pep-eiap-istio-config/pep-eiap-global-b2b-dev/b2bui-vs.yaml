apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: b2bui-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pepb2bf01.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: b2bui.pep-eiap-global-b2b-dev.svc.cluster.local
        port:
          number: 8080