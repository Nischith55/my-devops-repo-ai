apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: cpe-cloud-onboarding-agenda
  name: cpe-cloud-onboarding-agenda-vs
  namespace: pep-eiap-cgf-cpefinops-dev
spec:
  gateways:
  - pep-eiap-cgf-cpefinops-dev/pep-eiap-cgf-cpefinops-dev-cv-gw
  hosts:
  - cpe-cloud-onboarding-agenda.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  - cloudonboarding.dev.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: cpe-cloud-onboarding-agenda.pep-eiap-cgf-cpefinops-dev.svc.cluster.local
        port:
          number: 80
