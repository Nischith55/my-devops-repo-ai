apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: vctswdev-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - vctswdev.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: vctswdev.pep-eiap-cgf-onepep-dev.svc.cluster.local
        port:
          number: 80