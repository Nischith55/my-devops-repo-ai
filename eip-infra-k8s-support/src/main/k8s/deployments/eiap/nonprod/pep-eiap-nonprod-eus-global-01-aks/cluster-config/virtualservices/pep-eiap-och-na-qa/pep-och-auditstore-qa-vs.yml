apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-och-auditstore
  name: pep-och-auditstore-qa-vs
  namespace: pep-eiap-och-na-qa
spec:
  gateways:
  - pep-eiap-och-na-qa/pep-eiap-och-na-qa-cv-gw
  hosts:
  - pep-och-auditstore-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - corsPolicy:
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Content-Type
      - Link
      - Access-Control-Allow-Origin
      - Access-Control-Allow-Headers
      allowMethods:
      - POST
      - GET
      allowOrigins:
      - exact: https://pep-och-falloutmanagement-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
      - exact: https://pep-och-ui-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
      - exact: https://pepcommerce-ordermanagement.qa.na.pepsico.com
      exposeHeaders:
      - x-total-count
    match:
    - ignoreUriCase: true
      uri:
        prefix: /v1/api
    - ignoreUriCase: true
      uri:
        prefix: /management/     
    route:
    - destination:
        host: pep-och-auditstore.pep-eiap-och-na-qa.svc.cluster.local
        port:
          number: 80
