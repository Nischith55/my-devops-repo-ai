apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: och-bees-customer-batch-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - och-bees-customer-batch.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: och-bees-customer-batch.pep-eiap-och-na-dev.svc.cluster.local
        port:
          number: 80   