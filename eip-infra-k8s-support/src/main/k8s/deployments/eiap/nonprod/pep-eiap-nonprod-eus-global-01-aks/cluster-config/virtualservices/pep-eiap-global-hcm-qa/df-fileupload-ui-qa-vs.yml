apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: df-fileupload-ui-qa
  name: df-fileupload-ui-qa-vs
  namespace: pep-eiap-global-hcm-qa
spec:
  gateways:
  - pep-eiap-global-hcm-qa/pep-eiap-global-hcm-qa-cv-gw
  hosts:
  - df-fileupload-ui-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  - df-fileupload-ui.qa.mypepsico.com
  tls:
  - match:
    - port: 443
      sniHosts:
      - df-fileupload-ui.qa.mypepsico.com
      - df-fileupload-ui-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    route:
    - destination:
        host: df-fileupload-ui-qa.pep-eiap-global-hcm-qa.svc.cluster.local
        port:
          number: 443
