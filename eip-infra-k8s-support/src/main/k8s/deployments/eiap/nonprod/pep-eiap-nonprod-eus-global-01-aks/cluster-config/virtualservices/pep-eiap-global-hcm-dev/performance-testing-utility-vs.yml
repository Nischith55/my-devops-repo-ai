apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: performance-testing-utility
  name: performance-testing-utility-vs
  namespace: pep-eiap-global-hcm-dev
spec:
  gateways:
  - pep-eiap-global-hcm-dev/pep-eiap-global-hcm-dev-cv-gw
  hosts:
  - performance-testing-utility-dev.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: performance-testing-utility.pep-eiap-global-hcm-dev.svc.cluster.local
        port:
          number: 80
