    port:
      name: http-pep-eiap-cgf-devx-qa-cv-gw-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true
  - hosts:
    - devx.qa.mypepsico.com
    name: pep-eiap-cgf-devx-qa-cv-gw-https-1-443
    port:
      name: https-pep-eiap-cgf-devx-qa-cv-gw-1-443
      number: 443
      protocol: https
    tls:
