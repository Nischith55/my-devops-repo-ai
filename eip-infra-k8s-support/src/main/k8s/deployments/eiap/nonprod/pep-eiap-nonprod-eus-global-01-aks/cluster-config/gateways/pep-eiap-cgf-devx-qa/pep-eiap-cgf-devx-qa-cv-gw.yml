apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: pep-eiap-cgf-devx-qa-cv-gw
  namespace: pep-eiap-cgf-devx-qa
spec:
  selector:
    istio: pep-eiap-ingress-gw01
  servers:
  - hosts:
    - dummy-passthrough-pep-eiap-cgf-devx-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    name: pep-eiap-cgf-devx-qa-cv-gw-tls-443
    port:
      name: https-pep-eiap-cgf-devx-qa-cv-gw-tls-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - pep-eiap-cgf-devx-qa-cv.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pepsico-devx-daily-ui-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pepsico-cgf-devx-rbac-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
