    - pepsico-cgf-devx-home-ui-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pepsico-cgf-devx-cloud-governance-ui-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    name: pep-eiap-cgf-devx-qa-cv-gw-https-443
    port:
      name: https-pep-eiap-cgf-devx-qa-cv-gw-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
