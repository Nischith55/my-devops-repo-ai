apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-och-configmanager-ui
  name: pep-och-configmanager-ui-vs
  namespace: pep-eiap-och-na-dev
spec:
  gateways:
  - pep-eiap-och-na-dev/pep-eiap-och-na-dev-cv-gw
  hosts:
  - pep-och-configmanager-ui.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-och-configmanager-ui.pep-eiap-och-na-dev.svc.cluster.local
        port:
          number: 80
