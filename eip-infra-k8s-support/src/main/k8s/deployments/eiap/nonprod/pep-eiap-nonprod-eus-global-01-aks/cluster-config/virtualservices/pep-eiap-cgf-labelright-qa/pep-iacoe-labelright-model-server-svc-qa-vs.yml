apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-iacoe-labelright-model-server-head-qa
  name: pep-iacoe-labelright-model-server-svc-qa-vs
  namespace: pep-eiap-cgf-labelright-qa
spec:
  gateways:
  - pep-eiap-cgf-labelright-qa/pep-eiap-cgf-labelright-qa-cv-gw
  hosts:
  - pep-iacoe-labelright-model-server-svc-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /model
    route:
    - destination:
        host: pep-iacoe-labelright-model-server-svc-qa.pep-eiap-cgf-labelright-qa.svc.cluster.local
        port:
          number: 8000
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-iacoe-labelright-model-server-svc-qa.pep-eiap-cgf-labelright-qa.svc.cluster.local
        port:
          number: 8265
