apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-och-b2bproductservice-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-och-b2bproductservice.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /v1/api
    route:
    - destination:
        host: pep-och-b2bproductservice.pep-eiap-och-na-dev.svc.cluster.local
        port:
          number: 80    
    corsPolicy:
      allowOrigins:      
      - exact: https://pep-och-ops-ui.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
      allowMethods:
      - POST
      - GET
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Content-Type
      - Link
      exposeHeaders:
      - x-total-count 