apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: jepc-webapp-backend-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - jepc-webapp-backend.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: jepc-webapp-backend.pep-eiap-gbs-hrjepc-dev.svc.cluster.local
        port:
          number: 80 