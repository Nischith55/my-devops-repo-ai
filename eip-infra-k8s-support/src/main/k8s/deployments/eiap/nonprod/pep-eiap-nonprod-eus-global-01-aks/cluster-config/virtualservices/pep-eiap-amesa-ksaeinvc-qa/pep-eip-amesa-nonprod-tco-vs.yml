apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-eip-amesa-nonprod-tco
  name: pep-eip-amesa-nonprod-tco-qa-vs
  namespace: pep-eiap-amesa-ksaeinvc-qa
spec:
  gateways:
  - pep-eiap-amesa-ksaeinvc-qa/pep-eiap-amesa-ksaeinvc-qa-cv-gw
  hosts:
  - pep-eip-amesa-nonprod-tco-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  - agrotco.qa.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-eip-amesa-nonprod-tco.pep-eiap-amesa-ksaeinvc-qa.svc.cluster.local
        port:
          number: 80       
    corsPolicy:
      allowOrigins:
      - exact: https://apac-procurementdb-dev.intra.pepsico.com/api/data
      - exact: https://pep-eip-amesa-nonprod-tco-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
      allowMethods:
      - POST
      - GET
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Link
      - Content-Type
      - Access-Control-Allow-Origin
      exposeHeaders:
      - x-total-count   