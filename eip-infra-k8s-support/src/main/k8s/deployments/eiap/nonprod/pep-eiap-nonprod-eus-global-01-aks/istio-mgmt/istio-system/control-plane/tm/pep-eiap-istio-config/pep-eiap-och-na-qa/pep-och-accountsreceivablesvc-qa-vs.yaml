apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-och-accountsreceivablesvc-qa-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-och-accountsreceivablesvc-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /api/invoices
    - ignoreUriCase: true
      uri:
        prefix: /api/customers
    - ignoreUriCase: true
      uri:
        prefix: /management
    route:
    - destination:
        host: pep-och-accountsreceivablesvc.pep-eiap-och-na-qa.svc.cluster.local
        port:
          number: 80
    corsPolicy:
      allowOrigins:      
      - exact: https://cepar.spo.nonprod.wspdop.pepsico.com
      allowMethods:
      - POST
      - GET
      - PUT
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Content-Type
      exposeHeaders:
      - x-total-count
   
    