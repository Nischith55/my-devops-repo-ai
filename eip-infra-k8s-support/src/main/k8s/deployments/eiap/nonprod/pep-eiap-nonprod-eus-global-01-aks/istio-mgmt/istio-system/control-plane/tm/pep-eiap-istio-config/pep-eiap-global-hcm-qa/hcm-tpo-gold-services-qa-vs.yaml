apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: hcm-tpo-gold-services-qa
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - hcm-tpo-gold-services-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: hcm-tpo-gold-services.pep-eiap-global-hcm-qa.svc.cluster.local
        port:
          number: 80  