apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: undefined
  name: swaggerhub-dev-vs
  namespace: pep-eiap-cgf-swaggerhub-dev
spec:
  gateways:
  - pep-eiap-cgf-swaggerhub-dev/pep-eiap-cgf-swaggerhub-dev-cv-gw
  hosts:
  - swaggerhub-dev.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - uri:
        prefix: /ws
    route:
    - destination:
        host: swaggerhub-notifications.pep-eiap-cgf-swaggerhub-dev.svc.cluster.local
        port:
          number: 80
  - match:
    - uri:
        prefix: /v1/
    route:
    - destination:
        host: haproxy.pep-eiap-cgf-swaggerhub-dev.svc.cluster.local
        port:
          number: 80
  - match:
    - uri:
        prefix: /virts/
    route:
    - destination:
        host: haproxy.pep-eiap-cgf-swaggerhub-dev.svc.cluster.local
        port:
          number: 80
  - match:
    - uri:
        prefix: /api/
    route:
    - destination:
        host: haproxy.pep-eiap-cgf-swaggerhub-dev.svc.cluster.local
        port:
          number: 80
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        host: swaggerhub-frontend.pep-eiap-cgf-swaggerhub-dev.svc.cluster.local
        port:
          number: 80
