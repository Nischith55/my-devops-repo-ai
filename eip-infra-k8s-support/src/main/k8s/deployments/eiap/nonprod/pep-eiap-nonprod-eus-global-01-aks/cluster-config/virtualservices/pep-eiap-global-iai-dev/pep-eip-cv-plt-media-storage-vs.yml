apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-eip-cv-plt-media-storage
  name: pep-eip-cv-plt-media-storage-vs
  namespace: pep-eiap-global-iai-dev
spec:
  gateways:
  - pep-eiap-global-iai-dev/pep-eiap-global-iai-dev-cv-gw
  hosts:
  - pep-eip-cv-plt-media-storage.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /api/v1/media/slice/:id
    - ignoreUriCase: true
      uri:
        prefix: /api/v1/media/:id
    - ignoreUriCase: true
      uri:
        prefix: /api/v1/media
    - ignoreUriCase: true
      uri:
        prefix: /static
    - ignoreUriCase: true
      uri:
        prefix: /api/v1
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-eip-cv-plt-media-storage.pep-eiap-global-iai-dev.svc.cluster.local
        port:
          number: 8000
