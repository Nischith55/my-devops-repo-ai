apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: europe-orderprocessing-frontend 
  name: europe-orderprocessing-frontend-vs
  namespace: pep-eiap-cgf-orderproce-dev
spec:
  gateways:
  - pep-eiap-cgf-orderproce-dev/pep-eiap-cgf-orderproce-dev-cv-gw
  hosts:
  - europe-orderprocessing-frontend.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  - opeur.dev.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: europe-orderprocessing-frontend.pep-eiap-cgf-orderproce-dev.svc.cluster.local
        port:
          number: 8080
