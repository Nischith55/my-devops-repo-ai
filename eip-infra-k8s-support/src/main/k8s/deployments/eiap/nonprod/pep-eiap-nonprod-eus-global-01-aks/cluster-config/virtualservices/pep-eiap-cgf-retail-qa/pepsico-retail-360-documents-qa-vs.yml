apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pepsico-retail-360-documents
  name: pepsico-retail-360-documents-qa-vs
  namespace: pep-eiap-cgf-retail-qa
spec:
  gateways:
  - pep-eiap-cgf-retail-qa/pep-eiap-cgf-retail-qa-cv-gw
  hosts:
  - pepsico-retail-360-documents-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pepsico-retail-360-documents.pep-eiap-cgf-retail-qa.svc.cluster.local
        port:
          number: 80
