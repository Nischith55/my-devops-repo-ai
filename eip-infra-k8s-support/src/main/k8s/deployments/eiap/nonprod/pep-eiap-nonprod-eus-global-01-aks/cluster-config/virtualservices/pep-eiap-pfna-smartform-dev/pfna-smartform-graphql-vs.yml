apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pfna-smartform-graphql
  name: pfna-smartform-graphql-vs
  namespace: pep-eiap-pfna-smartform-dev
spec:
  gateways:
  - pep-eiap-pfna-smartform-dev/pep-eiap-pfna-smartform-dev-cv-gw
  hosts:
  - pfna-smartform-graphql.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /graphql
    route:
    - destination:
        host: pfna-smartform-graphql.pep-eiap-pfna-smartform-dev.svc.cluster.local
        port:
          number: 8080
