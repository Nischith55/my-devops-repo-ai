apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: netcoreapi-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts: 
  - netcoreapi.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-eip-flna-dxpicasso-netcoreapi.pep-eiap-flna-dxpicasso-dev.svc.cluster.local
        port:
          number: 80