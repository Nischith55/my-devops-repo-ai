apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-eiap-cgf-cle-admin-data-service
  name: pep-eiap-cgf-cle-admin-data-service-vs
  namespace: pep-eiap-cgf-cle-dev
spec:
  gateways:
  - pep-eiap-cgf-cle-dev/pep-eiap-cgf-cle-dev-cv-gw
  hosts:
  - pep-eiap-cgf-cle-admin-data-service.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - corsPolicy:
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Link
      - Content-Type
      - Access-Control-Allow-Origin
      - Timeout
      - x-functions-key
      - Access-Control-Allow-Headers
      allowMethods:
      - POST
      - GET
      - PUT
      - DELETE
      - OPTIONS
      allowOrigins:
      - exact: https://pep-eiap-cgf-cle-ui-rebuild.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-eiap-cgf-cle-admin-data-service.pep-eiap-cgf-cle-dev.svc.cluster.local
        port:
          number: 80
