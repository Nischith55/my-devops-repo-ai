apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: orchestrator-app-api
  name: eiotpapi-app-qa-vs
  namespace: pep-eiap-global-eiotp-qa
spec:
  gateways:
  - pep-eiap-global-eiotp-qa/pep-eiap-global-eiotp-qa-cv-gw
  hosts:
  - eiotpapi-app-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        host: orchestrator-app-api.pep-eiap-global-eiotp-qa.svc.cluster.local
        port:
          number: 8080
