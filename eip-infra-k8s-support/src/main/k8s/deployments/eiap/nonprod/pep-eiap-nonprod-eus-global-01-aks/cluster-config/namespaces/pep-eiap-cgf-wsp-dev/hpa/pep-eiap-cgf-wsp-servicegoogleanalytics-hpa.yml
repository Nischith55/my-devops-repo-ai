apiVersion: autoscaling/v1
kind: HorizontalPodAutoscaler
metadata:
  name: pep-eiap-cgf-wsp-servicegoogleanalytics-hpa
  namespace: pep-eiap-cgf-wsp-dev
spec:
  maxReplicas: 5
  minReplicas: 2
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: servicegoogleanalytics
  targetCPUUtilizationPercentage: 80
