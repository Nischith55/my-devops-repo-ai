apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pepsico-eip-latam-vanload-ingest-qa-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pepsico-eip-latam-vanload-ingest-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    headers:
      request:
        remove:
          - "Content-Type"
        add:
          Content-Type: "Text/Plain"
    route:
    - destination:
        host: pepsico-eip-latam-vanload-ingest.pep-eiap-latam-gtm-qa.svc.cluster.local
        port:
          number: 80        