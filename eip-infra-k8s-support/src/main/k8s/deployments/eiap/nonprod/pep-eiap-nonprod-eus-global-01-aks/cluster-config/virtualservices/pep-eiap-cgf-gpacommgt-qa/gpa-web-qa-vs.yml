apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: gpa-web
  name: gpa-web-qa-vs
  namespace: pep-eiap-cgf-gpacommgt-qa
spec:
  gateways:
  - pep-eiap-cgf-gpacommgt-qa/pep-eiap-cgf-gpacommgt-qa-cv-gw
  hosts:
  - gpa-web-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: gpa-web.pep-eiap-cgf-gpacommgt-qa.svc.cluster.local
        port:
          number: 3000
