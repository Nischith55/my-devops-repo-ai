apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: qa-model-mgmt-backend
  name: qa-model-mgmt-backend-vs
  namespace: pep-eiap-cgf-eedlops-qa
spec:
  gateways:
  - pep-eiap-cgf-eedlops-qa/pep-eiap-cgf-eedlops-qa-cv-gw
  hosts:
  - qa-model-mgmt-backend.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - corsPolicy:
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Link
      - Content-Type
      - Access-Control-Allow-Origin
      - x-organization
      - gpid
      allowMethods:
      - POST
      - GET
      - PUT
      - DELETE
      allowOrigins:
      - exact: qa-dlops-frontend.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
      - exact: https://swaggerhub.mypepsico.com
      - exact: https://swaggerhub.infratools.gw01.aks01.scus.prod.azure.intra.pepsico.com
      exposeHeaders:
      - x-total-count
      - x-source
      - gpid
    match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: qa-model-mgmt-backend.pep-eiap-cgf-eedlops-qa.svc.cluster.local
        port:
          number: 8000
