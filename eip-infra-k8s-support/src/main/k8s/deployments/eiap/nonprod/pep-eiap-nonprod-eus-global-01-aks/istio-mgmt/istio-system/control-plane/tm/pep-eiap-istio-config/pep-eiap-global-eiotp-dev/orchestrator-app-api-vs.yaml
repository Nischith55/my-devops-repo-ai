apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: orchestrator-application-api-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - eiotpapi-app-dev.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        host: orchestrator-app-api.pep-eiap-global-eiotp-dev.svc.cluster.local
        port:
          number: 8080