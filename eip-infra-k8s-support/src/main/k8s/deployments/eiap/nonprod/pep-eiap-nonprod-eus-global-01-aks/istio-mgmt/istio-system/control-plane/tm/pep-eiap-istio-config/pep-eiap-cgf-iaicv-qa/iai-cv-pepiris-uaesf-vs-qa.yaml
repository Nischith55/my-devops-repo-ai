apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: iai-cv-pepiris-uaesf-qa-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - iai-cv-pepiris-uaesf-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: iai-cv-pepiris-uaesf.pep-eiap-cgf-iaicv-qa.svc.cluster.local
        port:
          number: 8000