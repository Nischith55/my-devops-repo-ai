apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: cntwdev
  name: pep-eiap-cntwdev-vs
  namespace: pep-eiap-pfna-vct-dev
spec:
  gateways:
  - pep-eiap-pfna-vct-dev/pep-eiap-pfna-vct-dev-cv-gw
  hosts:
  - cntwdev.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  - controltower.dev.mypepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: cntwdev.pep-eiap-pfna-vct-dev.svc.cluster.local
        port:
          number: 80
