apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pepsico-cto-cmp-web-security-tools-qa-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pepsico-cto-cmp-web-security-tools-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pepsico-cto-cmp-web-security-tools.pep-eiap-global-cmp-qa.svc.cluster.local
        port:
          number: 80
