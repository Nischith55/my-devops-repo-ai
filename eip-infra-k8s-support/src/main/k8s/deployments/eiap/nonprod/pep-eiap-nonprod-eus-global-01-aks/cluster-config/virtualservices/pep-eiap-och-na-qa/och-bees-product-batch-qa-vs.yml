apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: och-bees-product-batch
  name: och-bees-product-batch-qa-vs
  namespace: pep-eiap-och-na-qa
spec:
  gateways:
  - pep-eiap-och-na-qa/pep-eiap-och-na-qa-cv-gw
  hosts:
  - och-bees-product-batch-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: och-bees-product-batch.pep-eiap-och-na-qa.svc.cluster.local
        port:
          number: 80
