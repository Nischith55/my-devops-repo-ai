apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: cv-opa-dev-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - cv-opa-dev.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: cv-opa.pep-eiap-cgf-cvopa-dev.svc.cluster.local
        port:
          number: 8181