apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-eip-pbna-savvy-pog-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-eip-pbna-savvy-pog.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-eip-pbna-savvy-pog.pep-eiap-pbna-halo-dev.svc.cluster.local
        port:
          number: 80