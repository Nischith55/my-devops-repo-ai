apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: cto-event-backend
  name: cto-event-backend-vs
  namespace: pep-eiap-global-eventapp-dev
spec:
  gateways:
  - pep-eiap-global-eventapp-dev/pep-eiap-global-eventapp-dev-cv-gw
  hosts:
  - cto-event-backend.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        host: cto-event-backend.pep-eiap-global-eventapp-dev.svc.cluster.local
        port:
          number: 8080
