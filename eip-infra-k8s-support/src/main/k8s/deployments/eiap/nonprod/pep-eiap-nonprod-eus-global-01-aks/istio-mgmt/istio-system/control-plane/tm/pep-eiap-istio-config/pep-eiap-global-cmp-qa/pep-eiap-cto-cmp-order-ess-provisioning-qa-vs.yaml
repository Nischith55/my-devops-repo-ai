apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-eiap-cto-cmp-order-ess-provisioning-qa-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-eip-cto-cmp-order-ess-provisioning-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /cmp/api/order/ansible
    route:
    - destination:
        host: pepsico-cto-cmp-order-ess-provisioning.pep-eiap-global-cmp-qa.svc.cluster.local
        port:
          number: 80