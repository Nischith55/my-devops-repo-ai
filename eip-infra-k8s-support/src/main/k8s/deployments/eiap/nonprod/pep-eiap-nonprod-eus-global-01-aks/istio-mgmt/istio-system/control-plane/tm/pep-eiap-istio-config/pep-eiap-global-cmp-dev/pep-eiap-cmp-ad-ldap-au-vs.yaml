apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pepsico-cmp-ad-ldap-ou-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-eip-cmp-ldap.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pepsico-cmp-ad-ou-user-groups-service.pep-eiap-global-cmp-dev.svc.cluster.local
        port:
          number: 80
