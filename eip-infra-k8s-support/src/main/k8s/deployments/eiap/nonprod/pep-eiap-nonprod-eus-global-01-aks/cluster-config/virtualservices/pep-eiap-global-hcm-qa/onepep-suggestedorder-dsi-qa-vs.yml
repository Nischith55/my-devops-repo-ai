apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: onepep-suggestedorder-dsi
  name: onepep-suggestedorder-dsi-qa-vs
  namespace: pep-eiap-global-hcm-qa
spec:
  gateways:
  - pep-eiap-global-hcm-qa/pep-eiap-global-hcm-qa-cv-gw
  hosts:
  - onepep-suggestedorder-dsi-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: onepep-suggestedorder-dsi.pep-eiap-global-hcm-qa.svc.cluster.local
        port:
          number: 80
