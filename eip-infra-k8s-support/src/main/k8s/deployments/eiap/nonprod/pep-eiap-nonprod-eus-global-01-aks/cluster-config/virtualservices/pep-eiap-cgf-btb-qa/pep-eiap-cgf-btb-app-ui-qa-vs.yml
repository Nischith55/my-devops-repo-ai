apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-eiap-cgf-btb-app-ui
  name: pep-eiap-cgf-btb-app-ui-qa-vs
  namespace: pep-eiap-cgf-btb-qa
spec:
  gateways:
  - pep-eiap-cgf-btb-qa/pep-eiap-cgf-btb-qa-cv-gw
  hosts:
  - btbqa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  - sodastreamprofessional.qa.pepsico.com
  http:
  - corsPolicy:
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Content-Type
      - Access-Control-Allow-Origin
      - Timeout
      - x-functions-key
      - Access-Control-Allow-Headers
      allowMethods:
      - GET
      - PUT
      - POST
      - DELETE
      - OPTIONS
      allowOrigins:
      - exact: https://api-na.qa.mypepsico.com/
      - exact: https://sodastreamprofessional.dev.pepsico.com/
      - exact: https://api-na.dev.mypepsico.com/
      exposeHeaders:
      - x-total-count
      - x-source
      - Content-Disposition
    match:
    - uri:
        prefix: /
    route:
    - destination:
        host: pep-eiap-cgf-btb-app-ui.pep-eiap-cgf-btb-qa.svc.cluster.local
        port:
          number: 80
