apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-hcm-pwbiwrtback-dev
  name: pep-hcm-pwbiwrtback-dev-vs
  namespace: pep-eiap-global-hcm-dev
spec:
  gateways:
  - pep-eiap-global-hcm-dev/pep-eiap-global-hcm-dev-cv-gw
  hosts:
  - pep-hcm-pwbiwrtback.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-hcm-pwbiwrtback-dev.pep-eiap-global-hcm-dev.svc.cluster.local
        port:
          number: 8090
