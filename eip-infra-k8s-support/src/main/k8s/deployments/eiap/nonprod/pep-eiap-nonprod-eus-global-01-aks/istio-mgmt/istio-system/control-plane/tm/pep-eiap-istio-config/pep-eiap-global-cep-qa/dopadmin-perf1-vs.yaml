apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: dopadmin-perf1-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pepcepa21.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  - admin-1.cep.stage.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: dopadmin-perf1.pep-eiap-global-cep-qa.svc.cluster.local
        port:
          number: 80