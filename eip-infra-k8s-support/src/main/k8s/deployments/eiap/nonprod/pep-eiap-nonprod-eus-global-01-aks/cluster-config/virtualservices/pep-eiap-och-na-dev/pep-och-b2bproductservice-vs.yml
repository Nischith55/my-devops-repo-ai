apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-och-b2bproductservice
  name: pep-och-b2bproductservice-vs
  namespace: pep-eiap-och-na-dev
spec:
  gateways:
  - pep-eiap-och-na-dev/pep-eiap-och-na-dev-cv-gw
  hosts:
  - pep-och-b2bproductservice.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - corsPolicy:
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Content-Type
      - Link
      allowMethods:
      - POST
      - GET
      allowOrigins:
      - exact: https://pep-och-ops-ui.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
      exposeHeaders:
      - x-total-count
    match:
    - ignoreUriCase: true
      uri:
        prefix: /v1/api
    route:
    - destination:
        host: pep-och-b2bproductservice.pep-eiap-och-na-dev.svc.cluster.local
        port:
          number: 80
