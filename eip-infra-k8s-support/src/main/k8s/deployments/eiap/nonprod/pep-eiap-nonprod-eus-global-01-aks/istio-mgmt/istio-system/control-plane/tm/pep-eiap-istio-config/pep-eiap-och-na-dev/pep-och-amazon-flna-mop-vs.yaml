apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-och-amazon-flna-mop-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-och-amazon-flna-mop.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-och-amazon-flna-mop.pep-eiap-och-na-dev.svc.cluster.local
        port:
          number: 80    
    corsPolicy:
      allowOrigins:
      - exact: https://pep-och-amazonflnamop-ui.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
      - exact: https://pepcommerce-ordermanagement.dev.na.pepsico.com
      allowMethods:
      - POST
      - GET
      - PUT
      - DELETE
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Content-Type
      exposeHeaders:
      - x-total-count