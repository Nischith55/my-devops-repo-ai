    app: dopsrv-d2c-loyaltyeventprocessing
  name: dopsrv-d2c-loyaltyeventprocessing-vs
  namespace: pep-eiap-global-cep-qa
spec:
  gateways:
  - pep-eiap-global-cep-qa/pep-eiap-global-cep-qa-cv-gw
  hosts:
  - pep-cep-d2c-loyaltyeventprocessing-dev.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
