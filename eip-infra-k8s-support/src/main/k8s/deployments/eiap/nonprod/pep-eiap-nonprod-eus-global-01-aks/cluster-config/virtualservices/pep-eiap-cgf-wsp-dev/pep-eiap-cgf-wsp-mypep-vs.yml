apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: mypep
  name: pep-eiap-cgf-wsp-mypep-vs
  namespace: pep-eiap-cgf-wsp-dev
spec:
  gateways:
  - pep-eiap-cgf-wsp-dev/pep-eiap-cgf-wsp-dev-cv-gw
  hosts:
  - mypep.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  - compass.dev.mypepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: mypep.pep-eiap-cgf-wsp-dev.svc.cluster.local
        port:
          number: 80
    timeout: 120s
