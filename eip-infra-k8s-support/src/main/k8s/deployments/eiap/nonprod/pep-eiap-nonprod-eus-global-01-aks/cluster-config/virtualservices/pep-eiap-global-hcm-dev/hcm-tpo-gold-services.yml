apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: hcm-tpo-gold-services
  name: hcm-tpo-gold-services
  namespace: pep-eiap-global-hcm-dev
spec:
  gateways:
  - pep-eiap-global-hcm-dev/pep-eiap-global-hcm-dev-cv-gw
  hosts:
  - hcm-tpo-gold-services.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: hcm-tpo-gold-services.pep-eiap-global-hcm-dev.svc.cluster.local
        port:
          number: 80
