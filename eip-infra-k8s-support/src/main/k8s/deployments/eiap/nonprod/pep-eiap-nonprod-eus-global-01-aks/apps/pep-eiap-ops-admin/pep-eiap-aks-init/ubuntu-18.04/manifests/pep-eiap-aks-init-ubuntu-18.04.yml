kind: ConfigMap
metadata:
  labels:
    app: pep-eiap-node-setup
  name: cacerts-conf
  namespace: pep-eiap-ops-admin
---
apiVersion: v1
data:
  apply-node-changes.sh: |
    #!/usr/bin/env bash
    set -eu
    # ##
    # IMPORTANT:
    # - This is designed to run on the NODE and NOT the pod make sure you can
    #   ssh from the pod to run the script
    # - Also, this script should be "scp'ed" OR copied by the initContainer to
    #   the NODE filesystem
    # - This must be run as sudo
    # ##

    # ##
    # reload all sysctl settings in ubuntu
    # ##
    custom_sysctl_file=/etc/sysctl.d/zzz-sysctl-aks-eiap.conf
    if [[ -r "${custom_sysctl_file}" ]]; then
      echo "Applying [${custom_sysctl_file}]"
      /sbin/sysctl --load="${custom_sysctl_file}" || echo "Failed sysctl load"
    else
      echo "WARNING: [${custom_sysctl_file}] file not found.."
    fi

    # Check whether pepsico cacerts are already in the bundle
    pep_certs=`ls /etc/ssl/certs | awk '/PepsiCoRootCA/ || /PepsiCoCA01/' | wc -l`
    if [ $pep_certs -eq 2 ]; then
      echo "pepsico cacerts already available; Skipping cacert update block"
    else
      # install ca certificates
      cacert_log=/tmp/cacert-update.log
      echo "updating ca certificates"
      update-ca-certificates > $cacert_log
      # Capture the number of certs added and removed into variables
      added_certs=`cat $cacert_log | head -2 | tail -1 | awk '{print $1, $3}' | awk '{print $1}'`
      removed_certs=`cat $cacert_log | head -2 | tail -1 | awk '{print $1, $3}' | awk '{print $2}'`
      # Check for cacert addition/removal and restart containerd
      if [ $added_certs -gt 0 ] || [ $removed_certs -gt 0 ]; then
        echo "$added_certs pepsico cacerts added to the bundle, $removed_certs removed; restarting containerd"
        # restart containerd
        systemctl restart containerd
        echo "succesfully restarted containerd"
      else
        echo "no certificates added/removed; skipping containerd restart"
      fi
    fi

    # ##
    # restart timesyncd
    # ##

    systemctl restart systemd-timesyncd

    # ##
    # Install and update packages...
    # ##
    #DONT NEED# DEBIAN_FRONTEND=noninteractive

    pkg_mgr="apt-get -qq -y --no-install-recommends "

    # We use chroot to run the following commands in the host root
    # (mounted as the /root volume in the container)
    echo "~~ Disabling auto-update..."
    # Disable auto update
    ${pkg_mgr} purge unattended-upgrades || echo "unattended-upgrades purge failed"
    echo "~~ Disable auto-update done ..."

    echo "~~ Updating apt cache..."
    ${pkg_mgr} update || echo "update failed.."
    echo "~~ Done Updating apt cache.."
    # dist-upgrade
    echo "Performing dist-upgrade"
    dpkg_options="-o \"Dpkg::Options::=--force-confdef\" -o \"Dpkg::Options::=--forceconfold\" "
    ${pkg_mgr} $dpkg_options dist-upgrade || echo "dist-upgrade failed"

    # ## ubuntu system motd changes
    upgrade_file=/var/lib/ubuntu-release-upgrader/release-upgrade-available
    if [[ -r "${upgrade_file}" ]]; then
      truncate -s 0 "${upgrade_file}" || echo "Failed to truncate [${upgrade_file}]"
    fi
    echo "Done: applying changes"
    exit 0
  setup-changes.sh: |
    #!/usr/bin/env bash
    # ##
    # Setup the Node Changes.
    # - involves setting up ssh into nodes
    # - copy all necessary files.
    # ##
    # IMPORTANT:
    # - Please be extremely careful since this is a daemonset and any
    #   error will do a redeployment, so watch for duplicated.
    # - EVERY command must be checked for errors, if you cop out using
    #   || true, then ensure idempotency where required.
    #: ##
    # This should already be passed in container env else default
    ROOT_MOUNT_DIR="${ROOT_MOUNT_DIR:-/root}"
    # ##
    # - setup ssh hack
    # ##
    #
    # copy private key to home_dir of this pods user context
    ssh_dir=~/.ssh
    mkdir -p ${ssh_dir}
    chmod 0700 ${ssh_dir}
    cp -pf /tmp/id_rsa_0 ${ssh_dir}/id_rsa || echo "Failed to copy [id_rsa_0]"
    cp -pf /tmp/id_rsa_0.pub ${ssh_dir}/id_rsa.pub || echo "Failed to copy [id_rsa_0.pub]"
    # Copy pepsico cacerts to /usr/local/share/ca-certificates directory
    cacert_dir="/usr/local/share/ca-certificates/"
    cp -pf /tmp/PepsiCoRootCA.crt "${ROOT_MOUNT_DIR}${cacert_dir}PepsiCoRootCA.crt" || echo Failed to copy [PepsiCoRootCA.crt]
    cp -pf /tmp/PepsiCoCA01.crt "${ROOT_MOUNT_DIR}${cacert_dir}PepsiCoCA01.crt" || echo Failed to copy [PepsiCoCA01.crt]
    #
    # add to node admin user [NOTE: defaults to neipi002]
    admin_user="${AKS_ADMIN_USER:-neipi002}"
    admin_ssh_dir="${ROOT_MOUNT_DIR}/home/${admin_user}/.ssh"
    node_auth_keys_file=${admin_ssh_dir}/authorized_keys
    node_auth_keys_file_orig=${admin_ssh_dir}/authorized_keys.ORIG
    if [[ ! -f "${node_auth_keys_file_orig}" ]]; then
      cp -pn ${node_auth_keys_file} ${node_auth_keys_file_orig} || echo "Failed copy: [${node_auth_keys_file_orig}]"
    fi
    # append public key if not present.
    pub_key_0=$(cat /tmp/id_rsa_0.pub)
    # now, append authorized_keys on the node
    if ! grep -q -F "${pub_key_0}" "${node_auth_keys_file}"; then
      echo "Adding public key to [${node_auth_keys_file}]"
      echo ${pub_key_0} >> "${node_auth_keys_file}"
    fi
    ##
    # Copy timesyncd conf
    ##
    timesyncd_conf=${ROOT_MOUNT_DIR}/etc/systemd/timesyncd.conf
    backup_file=${ROOT_MOUNT_DIR}/etc/systemd/timesyncd.conf.aks-orig
    if [[ ! -r ${backup_file} ]]; then
      cp -p ${timesyncd_conf} ${backup_file}
    fi
    cp -pf /tmp/timesyncd.conf ${timesyncd_conf} || echo "Failed copy: [${timesyncd_conf}]"
    ##
    # Copy timesyncd conf
    ##
    eiap_sysctl_file=zzz-sysctl-aks-eiap.conf
    cp -pf /tmp/${eiap_sysctl_file} /root/etc/sysctl.d/${eiap_sysctl_file} || echo "Failed copy: [${eiap_sysctl_file}]"
    # ##
    # Now we copy the ubuntu apply changes script to the NODE
    # ##
    cp -pf /tmp/apply-node-changes.sh ${ROOT_MOUNT_DIR}/tmp/apply-node-changes.sh || echo "Failed copy: [${apply-node-changes.sh}]"
    echo "Done setup for node change script"
    exit 0
kind: ConfigMap
metadata:
  labels:
    app: pep-eiap-node-setup
  name: eiap-node-initialize-scripts
  namespace: pep-eiap-ops-admin
---
apiVersion: v1
data:
  zzz-sysctl-aks-eiap.conf: |-
    # ##
    # IMPORTANT: Kubernetes has moved to safe and unsafe (namespaced) sysctl.
    # Do NOT mess around with net.* as it will not be inherited by pods.
    # This is mainly for nodelevel tuning
    #
    # ##

    # 65530 - 262144  65530
    vm.max_map_count=262144
    #: ORIG: 3000, flush 5 secs instead of 30 secs
    vm.dirty_expire_centisecs = 500
    # 0 - 100 60
    vm.swappiness=0
    # default: 3284687
    fs.file-max=8388608
    # 65536 - 6553500 (default: 65536)
    fs.aio-max-nr=1048576
    # 8192 - 20000500 (default:1048576)
    fs.nr_open=15728640
    # 4096 - 3240000  def:16384
    net.core.somaxconn=2097152
    # 1000 - 3240000  1000
    net.core.netdev_max_backlog=1048576
    # 212992 - 134217728  212992 (ours: 30mb)
    net.core.rmem_max=31457280
    # 20480 - 4194304 20480
    net.core.optmem_max=2097152
    # 128 - 3240000 16384
    net.ipv4.tcp_max_syn_backlog=65536
    # 131072 - 589824 131072
    net.netfilter.nf_conntrack_max=262144
    # 65536 - 147456  65536
    net.netfilter.nf_conntrack_buckets=98304
    # Default is 2: IMPORTANT please monitor this
    net.ipv4.tcp_tw_reuse=1
    #: this effects nproc as PID's wrap (max for 32bit and default is 32768)
    kernel.pid_max=262144
kind: ConfigMap
metadata:
  labels:
    app: pep-eiap-node-setup
  name: sysctl-conf
  namespace: pep-eiap-ops-admin
---
apiVersion: v1
data:
  timesyncd.conf: |-
    #  This file is part of systemd.
    #
    #  systemd is free software; you can redistribute it and/or modify it
    #  under the terms of the GNU Lesser General Public License as published by
    #  the Free Software Foundation; either version 2.1 of the License, or
    #  (at your option) any later version.
    #
    # Entries in this file show the compile time defaults.
    # You can change settings by editing this file.
    # Defaults can be restored by simply deleting this file.
    #
    # See timesyncd.conf(5) for details.

    [Time]
    NTP=time.pbsg.pvt
    #FallbackNTP=ntp.ubuntu.com
    #RootDistanceMaxSec=5
    #PollIntervalMinSec=32
    #PollIntervalMaxSec=2048
kind: ConfigMap
metadata:
  labels:
    app: pep-eiap-node-setup
  name: timesyncd-conf
  namespace: pep-eiap-ops-admin
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app: pep-eiap-node-setup
  name: pep-eiap-node-setup
  namespace: pep-eiap-ops-admin
spec:
  selector:
    matchLabels:
      app: pep-eiap-node-setup
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
      labels:
        app: pep-eiap-node-setup
        name: pep-eiap-node-setup
    spec:
      containers:
      - image: mcr.microsoft.com/oss/kubernetes/pause:1.4.0
        name: pause
      hostNetwork: "yes"
      initContainers:
      - command:
        - /bin/bash
        - -c
        - |
          #: ##
          #: IMPORTANT
          #: - Step 1) execute the setup-changes.sh
          #: - Step 2) Apply changes
          #: ##

          admin_user=${AKS_ADMIN_USER:-neipi002}
          # setup-changes
          if /tmp/setup-changes.sh; then
            ssh -l "${admin_user}" -tt -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ${NODE_IP} "sudo /tmp/apply-node-changes.sh"
          fi
          exit 0
        env:
        - name: AKS_ADMIN_USER
          value: neipi002
        - name: ROOT_MOUNT_DIR
          value: /root
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        image: pepeiapnonprodcommonacr.azurecr.io/pep/eiap/infra/utils/admin-utils/eiap-nginx:ubuntu-18.04-2021.02.27
        imagePullPolicy: IfNotPresent
        name: aks-node-initialize
        securityContext:
          privileged: true
          runAsUser: 0
        volumeMounts:
        - mountPath: /root
          name: root-mount
        - mountPath: /tmp
          name: all-configmaps
          readOnly: true
      tolerations:
      - operator: Exists
      volumes:
      - hostPath:
          path: /
          type: Directory
        name: root-mount
      - name: all-configmaps
        projected:
          defaultMode: 420
          sources:
          - configMap:
              items:
              - key: zzz-sysctl-aks-eiap.conf
                path: zzz-sysctl-aks-eiap.conf
              name: sysctl-conf
          - configMap:
              items:
              - key: timesyncd.conf
                path: timesyncd.conf
              name: timesyncd-conf
          - configMap:
              items:
              - key: setup-changes.sh
                mode: 493
                path: setup-changes.sh
              - key: apply-node-changes.sh
                mode: 493
                path: apply-node-changes.sh
              name: eiap-node-initialize-scripts
          - configMap:
              items:
              - key: PepsiCoRootCA.crt
                path: PepsiCoRootCA.crt
              - key: PepsiCoCA01.crt
                path: PepsiCoCA01.crt
              name: cacerts-conf
          - secret:
              items:
              - key: ssh_private_key_0
                mode: 256
                path: id_rsa_0
              - key: ssh_public_key_0
                mode: 420
                path: id_rsa_0.pub
              name: pep-eiap-aks-init-nonprod
  updateStrategy:
    type: RollingUpdate
