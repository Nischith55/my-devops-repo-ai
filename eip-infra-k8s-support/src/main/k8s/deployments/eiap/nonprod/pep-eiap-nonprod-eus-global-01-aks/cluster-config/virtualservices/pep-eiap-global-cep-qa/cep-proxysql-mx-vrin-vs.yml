apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
    labels:
        app: cep-proxysql-mx
    name: cep-proxysql-mx-vrin-vs
    namespace: pep-eiap-global-cep-qa
spec:
    gateways:
    - pep-eiap-global-cep-qa/pep-eiap-global-cep-qa-cv-gw
    hosts:
    - pepcepproxy01.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pepcepproxy.qa.pepsico.com
    http:
    -   match:
        -   ignoreUriCase: true
            uri:
                prefix: /
        route:
        -   destination:
                host: cep-proxysql-mx.pep-eiap-global-cep-qa.svc.cluster.local
                port:
                    number: 6080
