apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pfb-pricing-solution-webapp-api-uat-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pfb-pricing-solution-webapp-api-uat.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pfb-pricing-solution-webapp-api-uat.pep-eiap-cgf-pricechang-dev.svc.cluster.local
        port:
          number: 80