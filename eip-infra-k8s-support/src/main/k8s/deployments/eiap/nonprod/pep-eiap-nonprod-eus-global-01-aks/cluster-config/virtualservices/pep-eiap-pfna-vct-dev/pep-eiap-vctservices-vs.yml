apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: vctservices
  name: pep-eiap-vctservices-vs
  namespace: pep-eiap-pfna-vct-dev
spec:
  gateways:
  - pep-eiap-pfna-vct-dev/pep-eiap-pfna-vct-dev-cv-gw
  hosts:
  - pep-eiap-pfna-vct-dev-vctservices.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: vctservices.pep-eiap-pfna-vct-dev.svc.cluster.local
