apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-pcaf-api-cartontrackingservice-ctr-qa-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-pcaf-api-cartontrackingservice-ctr-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /api/v1/ctr/tracking
    route:
    - destination:
        host: pep-pcaf-api-cartontrackingservice-ctr.pep-eiap-flna-gtmothr-qa.svc.cluster.local
        port:
          number: 80  