apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: vctpyservices
  name: pep-eiap-pfna-vct-qa-vctpyservices-vs
  namespace: pep-eiap-pfna-vct-qa
spec:
  gateways:
  - pep-eiap-pfna-vct-qa/pep-eiap-pfna-vct-qa-cv-gw
  hosts:
  - pep-eiap-pfna-vct-qa-vctpyservices.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: vctpyservices.pep-eiap-pfna-vct-qa.svc.cluster.local
        port:
          number: 80
