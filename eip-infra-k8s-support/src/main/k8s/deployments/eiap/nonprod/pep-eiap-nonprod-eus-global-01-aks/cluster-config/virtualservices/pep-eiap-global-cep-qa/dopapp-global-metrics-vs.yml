apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: dopapp-global-metrics
  name: dopapp-global-metrics-vs
  namespace: pep-eiap-global-cep-qa
spec:
  gateways:
  - pep-eiap-global-cep-qa/pep-eiap-global-cep-qa-cv-gw
  hosts:
  - cep-metrics-dashboard.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: dopapp-global-metrics.pep-eiap-global-cep-qa.svc.cluster.local
        port:
          number: 80
