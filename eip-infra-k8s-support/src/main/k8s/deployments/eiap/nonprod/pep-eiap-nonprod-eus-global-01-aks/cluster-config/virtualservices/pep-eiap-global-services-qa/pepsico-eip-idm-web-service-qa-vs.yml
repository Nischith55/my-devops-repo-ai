apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pepsico-eip-idm-web-service
  name: pepsico-eip-idm-web-service-qa-vs
  namespace: pep-eiap-global-services-qa
spec:
  gateways:
  - pep-eiap-global-services-qa/pep-eiap-global-services-qa-cv-gw
  hosts:
  - pepsico-eip-idm-web-service-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pepsico-eip-idm-web-service.pep-eiap-global-services-qa.svc.cluster.local
        port:
          number: 80
