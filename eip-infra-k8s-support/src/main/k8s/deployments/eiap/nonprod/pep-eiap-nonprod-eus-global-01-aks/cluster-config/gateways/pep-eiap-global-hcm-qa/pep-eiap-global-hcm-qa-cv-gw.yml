apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: pep-eiap-global-hcm-qa-cv-gw
  namespace: pep-eiap-global-hcm-qa
spec:
  selector:
    istio: pep-eiap-ingress-gw01
  servers:
  - hosts:
    - df-fileupload-ui.qa.mypepsico.com
    - df-fileupload-ui-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    name: pep-eiap-global-hcm-qa-cv-gw-tls-443
    port:
      name: https-pep-eiap-global-hcm-qa-cv-gw-tls-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - df-fileze-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - hcm-tpo-gold-services-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - hcmqa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - onepep-suggestedorder-dsi-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
