    - pep-hcm-pwbiwrtback-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - tpo-powerbi-services-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    name: pep-eiap-global-hcm-qa-cv-gw-https-443
    port:
      name: https-pep-eiap-global-hcm-qa-cv-gw-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-eiap-nonprod-eus-global-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - df-fileze-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - hcm-tpo-gold-services-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - hcmqa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - hcm.qa.mypepsico.com
    - onepep-suggestedorder-dsi-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pep-hcm-pwbiwrtbac-prod.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - pep-hcm-pwbiwrtback-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - tpo-powerbi-services-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    name: pep-eiap-global-hcm-qa-cv-gw-http-80
    port:
      name: http-pep-eiap-global-hcm-qa-cv-gw-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true
  - hosts:
    - hcm.qa.mypepsico.com
    name: pep-eiap-global-hcm-qa-cv-gw-1-https-443
    port:
      name: https-pep-eiap-global-hcm-qa-cv-gw-1-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-eiap-nonprod-eus-global-hcm-nonprod-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - df-fileupload-ui.qa.mypepsico.com
    name: pep-eiap-global-hcm-qa-cv-gw-3-https-443
