apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: ds-upskilling-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - ds-upskilling-nonprod.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: ds-upskilling.pep-eiap-pfna-vct-dev.svc.cluster.local 
        port:
          number: 80       