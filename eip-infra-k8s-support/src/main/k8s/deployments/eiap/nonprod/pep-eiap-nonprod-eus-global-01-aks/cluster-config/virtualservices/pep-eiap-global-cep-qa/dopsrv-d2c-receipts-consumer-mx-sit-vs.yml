apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: dopsrv-d2c-receipts-consumer-mx-sit
  name: dopsrv-d2c-receipts-consumer-mx-sit-vs
  namespace: pep-eiap-global-cep-qa
spec:
  gateways:
  - pep-eiap-global-cep-qa/pep-eiap-global-cep-qa-cv-gw
  hosts:
  - pep-cep-d2creceiptsconsumer-mx-sit.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    rewrite:
      uri: /external/
    route:
    - destination:
        host: dopsrv-d2c-receipts-consumer-mx-sit.pep-eiap-global-cep-qa.svc.cluster.local
        port:
          number: 80
