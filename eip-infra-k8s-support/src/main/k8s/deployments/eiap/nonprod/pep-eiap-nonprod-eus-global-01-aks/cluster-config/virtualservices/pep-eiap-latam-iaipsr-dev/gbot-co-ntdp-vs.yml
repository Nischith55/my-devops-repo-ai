apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: gbot-co-ntdp-vs
  namespace: pep-eiap-latam-iaipsr-dev
  labels:
      app: gbot-co
spec:
  hosts:
  - gbot-co.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  gateways:
  - pep-eiap-latam-iaipsr-dev/pep-eiap-latam-iaipsr-dev-cv-gw
  http:
