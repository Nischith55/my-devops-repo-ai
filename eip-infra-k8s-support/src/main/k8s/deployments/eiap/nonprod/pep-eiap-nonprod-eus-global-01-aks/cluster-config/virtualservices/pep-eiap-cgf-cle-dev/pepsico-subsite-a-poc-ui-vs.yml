apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pepsico-subsite-a-poc-ui
  name: pepsico-subsite-a-poc-ui-vs
  namespace: pep-eiap-cgf-cle-dev
spec:
  gateways:
  - pep-eiap-cgf-cle-dev/pep-eiap-cgf-cle-dev-cv-gw
  hosts:
  - pepsico-subsite-a-poc-ui.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pepsico-subsite-a-poc-ui.pep-eiap-cgf-cle-dev.svc.cluster.local
        port:
          number: 80
