apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pepsico-cto-cmp-order-item-accumulator
  name: pepsico-cto-cmp-order-item-accumulator-vs
  namespace: pep-eiap-global-cmp-dev
spec:
  gateways:
  - pep-eiap-global-cmp-dev/pep-eiap-global-cmp-dev-cv-gw
  hosts:
  - pepsico-cto-cmp-order-item-accumulator.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /cmp/api/order/item/accumulator
    route:
    - destination:
        host: pepsico-cto-cmp-order-item-accumulator.pep-eiap-global-cmp-dev.svc.cluster.local
        port:
          number: 80
