    app: pep-eip-cv-latam-app-backend-smallformat
  name: pep-eip-cv-latam-app-backend-smallformat-svc-vs
  namespace: pep-eiap-global-iai-dev
spec:
  gateways:
  - pep-eiap-global-iai-dev/pep-eiap-global-iai-dev-cv-gw
  hosts:
  - pep-eip-cv-latam-app-backend-smallformat-svc.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
