apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pfna-smartform-graphql-qa-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pfna-smartform-graphql-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /graphql
    route:
    - destination:
        host: pfna-smartform-graphql.pep-eiap-pfna-smartform-qa.svc.cluster.local 
        port:
          number: 8080