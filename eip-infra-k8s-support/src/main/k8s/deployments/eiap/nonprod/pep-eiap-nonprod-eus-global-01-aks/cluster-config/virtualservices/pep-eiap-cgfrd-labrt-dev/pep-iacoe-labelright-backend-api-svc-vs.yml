apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-iacoe-labelright-backend-api
  name: pep-iacoe-labelright-backend-api-svc-vs
  namespace: pep-eiap-cgfrd-labrt-dev
spec:
  gateways:
  - pep-eiap-cgfrd-labrt-dev/pep-eiap-cgfrd-labrt-dev-cv-gw
  hosts:
  - pep-iacoe-labelright-backend-api-svc.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /lid
    - ignoreUriCase: true
      uri:
        prefix: /artwork
    - ignoreUriCase: true
      uri:
        prefix: /swagger-ui.html#/
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-iacoe-labelright-backend-api-svc.pep-eiap-cgfrd-labrt-dev.svc.cluster.local
        port:
          number: 8000
