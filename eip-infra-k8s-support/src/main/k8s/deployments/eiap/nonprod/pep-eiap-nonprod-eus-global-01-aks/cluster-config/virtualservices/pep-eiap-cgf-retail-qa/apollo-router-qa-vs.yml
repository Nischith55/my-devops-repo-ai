apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: undefined
  name: apollo-router-qa-vs
  namespace: pep-eiap-cgf-retail-qa
spec:
  gateways:
  - pep-eiap-cgf-retail-qa/pep-eiap-cgf-retail-qa-cv-gw
  hosts:
  - apollo-router-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: apollo-router.pep-eiap-cgf-retail-qa.svc.cluster.local
        port:
          number: 8081
