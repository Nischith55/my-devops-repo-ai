apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-eip-global-cmp-ui
  name: pep-eiap-cmp-ui-qa-vs
  namespace: pep-eiap-global-cmp-qa
spec:
  gateways:
  - pep-eiap-global-cmp-qa/pep-eiap-global-cmp-qa-cv-gw
  hosts:
  - cloud.qa.mypepsico.com
  # devx-infra.qa.mypepsico.com
  - pep-eip-cmp-ui-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /v1
    route:
    - destination:
        host: pep-eip-global-cmp-ui-v1.pep-eiap-global-cmp-qa.svc.cluster.local
        port:
          number: 80
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pepsico-eip-global-cmp-ui.pep-eiap-global-cmp-qa.svc.cluster.local
        port:
          number: 80
