---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-eiap-cmp-ui-sni-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
    - istio-system/istio-in-gateway-01
  hosts:
  - cloud.dev.mypepsico.com
  - pep-eip-cmp-ui.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - headers:
      request:
        set:
          Authorization: "true"
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /v1  
    route:
    - destination:
        host: pep-cto-cmp-ui-poc-switchtoggle.pep-eiap-global-cmp-dev.svc.cluster.local
        subset: v1
      #weight: 25
        port:
          number: 80  
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pepsico-eip-global-cmp-ui.pep-eiap-global-cmp-dev.svc.cluster.local
        subset: v2
      #weight: 25
        port:
          number: 80         
    corsPolicy:
      allowOrigins:
      - exact: https://cloud.dev.mypepsico.com
      allowMethods:
      - POST
      - GET
      - PUT
      - DELETE
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Content-Type
      - X-User-Info
      exposeHeaders:
      - x-total-count
      - Cookie
