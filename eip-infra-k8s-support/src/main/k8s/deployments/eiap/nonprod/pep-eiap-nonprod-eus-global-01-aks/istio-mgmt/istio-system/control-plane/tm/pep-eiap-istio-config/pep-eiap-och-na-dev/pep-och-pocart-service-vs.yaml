apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-och-pocart-service-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-och-pocart-service.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-och-pocart-service.pep-eiap-och-na-dev.svc.cluster.local
        port:
          number: 80
    corsPolicy:
      allowOrigins:      
      - exact: https://pep-och-ui.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
      - exact: https://pepcommerce-ordermanagement.dev.na.pepsico.com
      allowMethods:
      - POST
      - GET
      - DELETE
      - PATCH 
      - DELETE 
      - OPTIONS 
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Content-Type
      - Link
      - Access-Control-Allow-Origin
      exposeHeaders:
      - x-total-count 