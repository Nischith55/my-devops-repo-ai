apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: ee-tcgen-frontend
  name: ee-tcgen-frontend-vs
  namespace: pep-eiap-cgf-pepgenx-dev
spec:
  gateways:
  - pep-eiap-cgf-pepgenx-dev/pep-eiap-cgf-pepgenx-dev-cv-gw
  hosts:
  - ee-tcgen-frontend.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  - eetcgen.dev.mypepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: ee-tcgen-frontend.pep-eiap-cgf-pepgenx-dev.svc.cluster.local
        port:
          number: 3000
