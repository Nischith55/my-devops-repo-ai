apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pfb-pricing-solution-webapp-api
  name: pfb-pricing-solution-webapp-api-vs
  namespace: pep-eiap-cgf-pricechan-dev
spec:
  gateways:
  - pep-eiap-cgf-pricechan-dev/pep-eiap-cgf-pricechan-dev-cv-gw
  hosts:
  - pfb-pricing-solution-webapp-api.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pfb-pricing-solution-webapp-api.pep-eiap-cgf-pricechan-dev.svc.cluster.local
        port:
          number: 80
