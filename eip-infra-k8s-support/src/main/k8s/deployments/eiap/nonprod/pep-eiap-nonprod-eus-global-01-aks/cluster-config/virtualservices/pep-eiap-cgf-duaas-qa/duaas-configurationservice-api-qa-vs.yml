apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: duaas-configurationservice-api
  name: duaas-configurationservice-api-qa-vs
  namespace: pep-eiap-cgf-duaas-qa
spec:
  gateways:
  - pep-eiap-cgf-duaas-qa/pep-eiap-cgf-duaas-qa-cv-gw
  hosts:
  - duaas-configurationservice-api-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  - doculingo.qa.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: duaas-configurationservice-api.pep-eiap-cgf-duaas-qa.svc.cluster.local
        port:
          number: 80
