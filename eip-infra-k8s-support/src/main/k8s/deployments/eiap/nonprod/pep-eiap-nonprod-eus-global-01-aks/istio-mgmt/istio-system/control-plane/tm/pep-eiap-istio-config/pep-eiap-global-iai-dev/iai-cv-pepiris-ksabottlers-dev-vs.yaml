apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: iai-cv-pepiris-ksabottlers-dev-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - iai-cv-pepiris-ksabottlers-dev.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: iai-cv-pepiris-ksabottlers-dev.pep-eiap-global-iai-dev.svc.cluster.local
        port:
          number: 8000     