apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pepsico-eip-monday
  name: pepsico-eip-monday-vs
  namespace: pep-eiap-cgf-monday-dev
spec:
  gateways:
  - pep-eiap-cgf-monday-dev/pep-eiap-cgf-monday-dev-cv-gw
  hosts:
  - pepsico-eip-monday.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pepsico-eip-monday.pep-eiap-cgf-monday-dev.svc.cluster.local
        port:
          number: 8080
