    app: pepsico-onepep-caf-cafservice-v1
  name: pepsico-onepep-caf-cafservice-v1-vs
  namespace: pep-eiap-pfna-onepep-dev
spec:
  gateways:
  - pep-eiap-pfna-onepep-dev/pep-eiap-pfna-onepep-dev-cv-gw
  hosts:
  - pepsico-onepep-caf-cafservice-v1.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
