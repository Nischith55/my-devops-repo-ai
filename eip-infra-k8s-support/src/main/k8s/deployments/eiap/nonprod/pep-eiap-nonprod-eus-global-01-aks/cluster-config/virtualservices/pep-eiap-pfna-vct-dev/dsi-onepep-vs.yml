apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: dsi-onepep
  name: dsi-onepep-vs
  namespace: pep-eiap-pfna-vct-dev
spec:
  gateways:
  - pep-eiap-pfna-vct-dev/pep-eiap-pfna-vct-dev-cv-gw
  hosts:
  - dsi-onepep.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: dsi-onepep.pep-eiap-pfna-vct-dev.svc.cluster.local
