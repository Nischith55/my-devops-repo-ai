apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-eip-workforce-odata-service
  name: pep-eip-workforce-odata-service-vs
  namespace: pep-eiap-global-services-dev
spec:
  gateways:
  - pep-eiap-global-services-dev/pep-eiap-global-services-dev-cv-gw
  hosts:
  - pep-eip-workforce-odata-service.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        host: pep-eip-workforce-odata-service.pep-eiap-global-services-dev.svc.cluster.local
        port:
          number: 80
