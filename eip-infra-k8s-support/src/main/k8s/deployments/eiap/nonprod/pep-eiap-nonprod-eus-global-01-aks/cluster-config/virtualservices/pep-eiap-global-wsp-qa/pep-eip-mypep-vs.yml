apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: mypep
  name: pep-eip-mypep-vs
  namespace: pep-eiap-global-wsp-qa
spec:
  gateways:
  - pep-eiap-global-wsp-qa/pep-eiap-global-wsp-qa-cv-gw
  hosts:
  - mypep-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  - compass.ite.mypepsico.com
  http:
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        host: mypep.pep-eiap-global-wsp-qa.svc.cluster.local
        port:
          number: 80
