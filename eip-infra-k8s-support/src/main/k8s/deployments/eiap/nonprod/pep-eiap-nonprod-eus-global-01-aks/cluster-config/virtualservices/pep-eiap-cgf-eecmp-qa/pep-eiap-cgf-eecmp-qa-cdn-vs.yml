apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-eiap-cgf-eecmp-qa-cv-cdn-vs
  namespace: pep-eiap-cgf-eecmp-qa
spec:
  hosts:
    - cvp.qa.mypepsico.com
  gateways:
  - "pep-eiap-cgf-eecmp-qa/pep-eiap-cgf-eecmp-qa-cv-gw"
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: "/"
    route:
    - destination:
        host:  "pep-eiap-cgf-eecmp-qa-cv-webdeploy.pep-eiap-cgf-eecmp-qa.svc.cluster.local"
        port:
          number: 80