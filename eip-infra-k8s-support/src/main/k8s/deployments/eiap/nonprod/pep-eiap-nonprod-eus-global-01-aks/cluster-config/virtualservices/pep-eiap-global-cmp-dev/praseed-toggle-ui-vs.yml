apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-cto-cmp-ui-poc-switchtoggle
  name: praseed-toggle-ui-vs
  namespace: pep-eiap-global-cmp-dev
spec:
  gateways:
  - pep-eiap-global-cmp-dev/pep-eiap-global-cmp-dev-cv-gw
  hosts:
  - praseed-cmp-test.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /v2
    route:
    - destination:
        host: pep-cto-cmp-ui-poc-switchtoggle.pep-eiap-global-cmp-dev.svc.cluster.local
        port:
          number: 80
