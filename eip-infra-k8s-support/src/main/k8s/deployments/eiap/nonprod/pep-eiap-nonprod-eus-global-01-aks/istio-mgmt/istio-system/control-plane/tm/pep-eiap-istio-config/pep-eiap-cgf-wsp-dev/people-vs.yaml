apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: people-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - people.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  - people.dev.mypepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: people.pep-eiap-cgf-wsp-dev.svc.cluster.local
        port:
          number: 80