apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-eiap-global-eipui
  name: pep-eiap-global-eipui-qa-vs
  namespace: pep-eiap-cgf-codeone-qa
spec:
  gateways:
  - pep-eiap-cgf-codeone-qa/pep-eiap-cgf-codeone-qa-cv-gw
  hosts:
  - pep-eiap-global-eipui-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  - codeone.qa.mypepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-eiap-global-eipui.pep-eiap-cgf-codeone-qa.svc.cluster.local
        port:
          number: 80
