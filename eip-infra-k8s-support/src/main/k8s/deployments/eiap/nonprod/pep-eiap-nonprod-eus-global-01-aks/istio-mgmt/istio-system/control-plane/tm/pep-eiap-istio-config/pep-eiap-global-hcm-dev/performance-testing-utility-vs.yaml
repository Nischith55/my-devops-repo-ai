apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: performance-testing-utility-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - performance-testing-utility-dev.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: performance-testing-utility.pep-eiap-global-hcm-dev.svc.cluster.local
        port:
          number: 80        