apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pepsico-eip-latam-vanload-processor-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pepsico-eip-latam-vanload-processor.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
