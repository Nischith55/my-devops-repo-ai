apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pepsico-pfna-fleet-fourkites-commoncarrier-data-service
  name: pepsico-pfna-fleet-fourkites-commoncarrier-data-service-vs
  namespace: pep-eiap-flna-fleet-dev
spec:
  gateways:
  - pep-eiap-flna-fleet-dev/pep-eiap-flna-fleet-dev-cv-gw
  hosts:
  - pepsico-pfna-fleet-fourkites-commoncarrier-data-service.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /pfna/fleet/v1
    route:
    - destination:
        host: pepsico-pfna-fleet-fourkites-commoncarrier-data-service.pep-eiap-flna-fleet-dev.svc.cluster.local
        port:
          number: 80
