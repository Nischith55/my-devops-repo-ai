apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-och-product-catalog-service
  name: pep-och-product-catalog-service-qa-vs
  namespace: pep-eiap-och-na-qa
spec:
  gateways:
  - pep-eiap-och-na-qa/pep-eiap-och-na-qa-cv-gw
  hosts:
  - pep-och-product-catalog-service-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - corsPolicy:
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Link
      - Content-Type
      - Access-Control-Allow-Origin
      allowMethods:
      - POST
      - GET
      - PUT
      - DELETE
      - OPTIONS
      allowOrigins:
      - exact: https://pep-och-ui-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
      - exact: https://pep-och-ops-ui-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
      - exact: https://pep-och-developerportal-ui-qa.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
      - exact: https://pepcommerce-ordermanagement.qa.na.pepsico.com
      - exact: https://pep-och-ui.global.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
      - exact: https://pep-och-ui-qa.global.gw01.aks01.gwc.nonprod.azure.intra.pepsico.com
      - exact: https://pep-och-ui-qa.pbna.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
      exposeHeaders:
      - x-total-count
      - x-source
    match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-och-product-catalog-service.pep-eiap-och-na-qa.svc.cluster.local
        port:
          number: 80
