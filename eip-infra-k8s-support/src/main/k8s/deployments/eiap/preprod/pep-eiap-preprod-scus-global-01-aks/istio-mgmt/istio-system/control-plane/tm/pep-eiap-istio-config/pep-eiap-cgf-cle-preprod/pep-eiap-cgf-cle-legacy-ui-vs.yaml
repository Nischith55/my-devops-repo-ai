apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name:  pep-eiap-cgf-cle-legacy-ui-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-eiap-cgf-cle-legacy-ui.global.gw01.aks01.scus.preprod.azure.intra.pepsico.com
  - cle.ite.mypepsico.com
  - cle-scus.ite.mypepsico.com
  tls:
  - match:
    - port: 443
      sniHosts:
      - cle.ite.mypepsico.com
      - cle-scus.ite.mypepsico.com
      - pep-eiap-cgf-cle-legacy-ui.global.gw01.aks01.scus.preprod.azure.intra.pepsico.com
    route:
    - destination:
        host:  pep-eiap-cgf-cle-legacy-ui.pep-eiap-cgf-cle-preprod.svc.cluster.local
        port:
          number: 443