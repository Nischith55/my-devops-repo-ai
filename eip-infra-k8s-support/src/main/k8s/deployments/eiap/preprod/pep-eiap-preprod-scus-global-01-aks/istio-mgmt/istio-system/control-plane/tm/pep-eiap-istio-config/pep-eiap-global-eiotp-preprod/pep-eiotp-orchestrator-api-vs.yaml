apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-eiotp-orchestrator-api-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - eiotpapi.global.gw01.aks01.scus.preprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: orchestrator-api.pep-eiap-global-eiotp-preprod.svc.cluster.local
        port:
          number: 8080
