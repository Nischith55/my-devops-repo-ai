apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-eiap-global-eip-mdp-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-eiap-global-eip-mdp.global.gw01.aks01.scus.preprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /eipone/mdp/admin
    route:
    - destination:
        host: pep-eiap-global-eip-mdp.pep-eiap-global-eipone-preprod.svc.cluster.local
        port:
          number: 80
