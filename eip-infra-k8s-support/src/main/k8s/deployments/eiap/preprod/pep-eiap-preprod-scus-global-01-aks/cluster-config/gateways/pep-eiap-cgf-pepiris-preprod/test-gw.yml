apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: test-gw
  namespace: pep-eiap-cgf-pepiris-preprod
spec:
  selector:
    istio: pep-eiap-ingress-gw01
  servers:
  - hosts:
    - pep-iacoe-pepconnect-model-server-svc.eiap.gw01.aks02.eus.nonprod.azure.intra.pepsico.com
    name: pep-iacoe-pepconnect-model-server-gw-https-443
    port:
      name: https-pep-iacoe-pepconnect-model-server-gw-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-eiap-nonprod-eus-global-02-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - pep-iacoe-pepconnect-model-server-svc.eiap.gw01.aks02.eus.nonprod.azure.intra.pepsico.com
    name: pep-iacoe-pepconnect-model-server-gw-http-80
    port:
      name: http-pep-iacoe-pepconnect-model-server-gw-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true

