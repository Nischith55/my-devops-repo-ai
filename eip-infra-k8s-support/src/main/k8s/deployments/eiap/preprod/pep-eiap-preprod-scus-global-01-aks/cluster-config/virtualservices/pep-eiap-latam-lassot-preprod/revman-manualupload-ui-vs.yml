  labels:
    app: revman-manualupload-ui
  name: revman-manualupload-ui-vs
  namespace: pep-eiap-latam-lassot-preprod
spec:
  gateways:
  - pep-eiap-latam-lassot-preprod/pep-eiap-latam-lassot-preprod-cv-gw
  hosts:
  - revman-manualupload-ui.global.gw01.aks01.scus.preprod.azure.intra.pepsico.com
