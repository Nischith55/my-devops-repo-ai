---
apiVersion: v1
kind: ConfigMap
metadata:
  name: preprod-scus-global-01-aks-logs-filebeat-config
  namespace: pep-eiap-elastic-client-01
data:

  K8S_CLUSTER_NAME: pep-eiap-preprod-scus-global-01-aks

  filebeat-processor.yml: |

    processors:

    - add_fields:
       # target: eiap
        fields:
          cluster_name: ${K8S_CLUSTER_NAME}
          ls-destination: "SCUS"
          pep-aks-cluster: ${K8S_CLUSTER_NAME}

    - add_cloud_metadata:
        when:
          equals:
            event.module: system

    - add_host_metadata: {}

    - add_kubernetes_metadata:
        host: ${NODE_NAME}
        default_indexers:
          enabled: false
        default_matchers:
          enabled: false


         
    - add_tags:
        tags: ["PreProd-SCUS-Shared", "retain-logs"]

    - script:
        lang: javascript
        #check
        source: >
          function process(event) {
            event.Put("fields.sn-application", "aks-pep-eiap-preprod-scus-global-01-aks" + "-" + event.Get("kubernetes.namespace"));
            return event;
          }

    # ~~
    # Logging
    # ~~
    logging:
      level: INFO
      metrics:
        enabled: true

  filebeat.yml: |-

    filebeat.inputs:  
      - type: filestream
        id: ray-logs-persist
        enabled: true
        paths:
          - /mnt/ray-logs/*/logs/*.log
          - /mnt/ray-logs/*/logs/*.err
          - /mnt/ray-logs/*/logs/*.out
          - /mnt/ray-logs/*/*.log
          - /mnt/ray-logs/*/*.err
          - /mnt/ray-logs/*/*.out
        prospector.scanner.fingerprint.enabled: true
        file_identity.fingerprint: ~
        # scan_frequency: 10s
        # ignore_older: 24h
        # parsers:
        #   - multiline:
        #       type: pattern
        #       pattern: '^(\[|[0-9]{4}-[0-9]{2}-[0-9]{2}|\{)'
        #       negate: true
        #       match: after
        fields:
          sn-application: aks-pep-eiap-preprod-scus-global-01-aks-pep-eiap-cgf-pepiris-preprod
          namespace: pep-eiap-cgf-pepiris-preprod
          application: pepiris
          log_source: ray-logs
        tags: [pepiris, ray, pvc]
    filebeat:

      modules:
      - module: system
        syslog:
          enabled: true

          var:
            paths:
            - /var/log/syslog
            - /var/log/messages
            - /var/log/waagent.log
            - /var/log/azure/*.log
        auth:
          enabled: true
          var:
            paths:
            - /var/log/auth.log

      autodiscover:
        providers:
        - type: kubernetes
          scope: node
          resource: pod
          node: ${NODE_NAME}
          hints:
            enabled: true
          templates:
            - condition:
                or:
                  - equals:
                      kubernetes.namespace: "pep-eiap-global-eiotp-preprod"
              config:
                - type: container
                  paths:
                    - /var/log/containers/*${data.kubernetes.container.id}.log
                  json.keys_under_root: true
                  json.add_error_key: true
                  json.message_key: message
            - condition:
                and:
                  - not:
                      equals:
                        kubernetes.namespace: "pep-eiap-global-eiotp-preprod"
                  - not:
                      has_fields:
                        - kubernetes.labels.common.k8s.elastic.co/type
              config:
              - type: container
                paths:
                - /var/log/containers/*${data.kubernetes.container.id}.log
                ### lines 104-108 commented request from Ankit garg SCTASK7813150 #INC10528817
                multiline:
                  type: pattern
                  pattern: '^(\[|[0-9]{4}-[0-9]{2}-[0-9]{2} )'
                  negate: true
                  match: after  
    setup.template.name: "aks-data-stream"
    setup.template.pattern: "aks*"
    
    setup.ilm.enabled: false     
    
    output.elasticsearch:
        hosts: [https://3825028849b946d3a380f6136dcd7c3a.privatelink.southcentralus.azure.elastic-cloud.com:9243]
        api_key: "GnuNB5MBWuezjPg1DKep:OPckBJB2QHOYgXBnfTHhZw"
        index: "%{[fields][sn-application]}"
        
        worker: 3
        bulk_max_size: 1000
        ssl.verification_mode: none
    

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: &app_name preprod-scus-global-01-aks-logs-filebeat
  namespace: pep-eiap-elastic-client-01
  labels:
    app.kubernetes.io/name: *app_name
    app.kubernetes.io/version: &vers 8.19.11
    app: *app_name
    # match the  ES server version (beats is not backward compatible)
    version: *vers
spec:

  selector:
    matchLabels:
      app.kubernetes.io/name: *app_name
      app.kubernetes.io/version: *vers

  template:

    metadata:
      labels:
        app.kubernetes.io/name: *app_name
        app.kubernetes.io/version: *vers

    spec:
      hostAliases:
      - ip: "172.20.34.198"
        hostnames:
        - "3825028849b946d3a380f6136dcd7c3a.privatelink.southcentralus.azure.elastic-cloud.com"

      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
      - operator: Exists

      serviceAccountName: filebeat
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 0

      # ~~~
      # All volumes
      # ~~~
      volumes:

      # PEP: all in one configMap (using projections)
      - name: config-projected
        projected:
          # 0644 -> 420, 0600 -> 384
          defaultMode: 384
          sources:

          # pep-ca-certs-config
          - configMap:
              name: pep-ca-certs-config
              optional: false
              items:
                - key: PepsiCoCA01.pem
                  path: etc/certs/PepsiCoCA01.pem
                - key: PepsiCoRootCA.pem
                  path: etc/certs/PepsiCoRootCA.pem

          - configMap:
              name: &beats_config preprod-scus-global-01-aks-logs-filebeat-config
              optional: false
              items:
                - key: filebeat.yml
                  # must be relative
                  path: etc/beat.yml
                - key: filebeat-processor.yml
                  # must be relative
                  path: etc/beat-processor-config.yml

      - name: varlibdockercontainers
        hostPath:
          path: /var/lib/docker/containers

      - name: varlog
        hostPath:
          path: /var/log

      - name: data
        hostPath:
          path: /var/lib/pep-eiap-elastic-client-01/preprod-scus-global-01-aks-logs-filebeat/filebeat-data
          type: DirectoryOrCreate

      - name: dockersock
        hostPath:
          path: /var/run/docker.sock

      - name: assets-pvc-ray-pepiris-inference-ray-service-preprod-elastic                 ##RAY setup custom name 
        persistentVolumeClaim:
          claimName: assets-pvc-ray-pepiris-inference-ray-service-preprod-elastic        ##RAY setup custom name   
      - name: ray-logs-elastic-pvc
        persistentVolumeClaim:
          claimName: ray-logs-elastic-pvc
      containers:
      - name: filebeat
        image: docker.elastic.co/beats/filebeat:8.19.11
        args:
        - --environment
        - container
        - -e
        - -c
        - /projected/etc/beat-processor-config.yml
        - -c
        - /projected/etc/beat.yml

        resources:
          requests:
            # cpu: 200m
            memory: 512Mi

        env:

        # All environment variables from beats-shared-env-config
        - name: K8S_CLUSTER_NAME
          valueFrom:
            configMapKeyRef:
              name: *beats_config
              key: K8S_CLUSTER_NAME

        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName


        volumeMounts:

        # PEP:
        - name: config-projected
          # where it is mounted
          mountPath: /projected
          readOnly: true

        - name: data
          mountPath: /usr/share/filebeat/data

        - name: varlibdockercontainers
          mountPath: /var/lib/docker/containers
          readOnly: true

        - name: varlog
          mountPath: /var/log
          readOnly: true

        - name: dockersock
          mountPath: "/var/run/docker.sock"

        - name: assets-pvc-ray-pepiris-inference-ray-service-preprod-elastic 
          mountPath: /ray/session_latest/logs
          readOnly: true                    ##RAY setup custom name
        - name: ray-logs-elastic-pvc
          mountPath: /mnt/ray-logs
          readOnly: true    
