apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  annotations: {}
  labels:
    app: och-bees-customer-batch
  name: och-bees-customer-batch-vs
  namespace: pep-eiap-och-na-preprod
spec:
  gateways:
  - pep-eiap-och-na-preprod/pep-eiap-och-na-preprod-cv-gw
  hosts:
  - och-bees-customer-batch.global.gw01.aks01.scus.preprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: och-bees-customer-batch.pep-eiap-och-na-preprod.svc.cluster.local
        port:
          number: 80
