apiVersion: v1
kind: ServiceAccount
metadata:
  name: appdynamics-cluster-agent
  namespace: appdynamics
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: appdynamics-cluster-agent
rules:
- apiGroups:
  - ""
  resources:
  - pods
  - pods/log
  - endpoints
  - persistentvolumeclaims
  - resourcequotas
  - nodes
  - events
  - namespaces
  - services
  - configmaps
  - secrets
  verbs:
  - get
  - watch
  - list
- apiGroups:
  - apps
  resources:
  - daemonsets
  - statefulsets
  - deployments
  - replicasets
  verbs:
  - get
  - watch
  - list
- apiGroups:
  - batch
  - extensions
  resources:
  - jobs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - metrics.k8s.io
  resources:
  - pods
  - nodes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - appdynamics.com
  resources:
  - '*'
  - clusteragents
  - clustercollectors
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: appdynamics-cluster-agent-instrumentation
rules:
- apiGroups:
  - ""
  resources:
  - pods
  - pods/exec
  - secrets
  - configmaps
  verbs:
  - create
  - update
  - delete
- apiGroups:
  - apps
  resources:
  - daemonsets
  - statefulsets
  - deployments
  - replicasets
  verbs:
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: appdynamics-cluster-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: appdynamics-cluster-agent
subjects:
- kind: ServiceAccount
  name: appdynamics-cluster-agent
  namespace: appdynamics
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: appdynamics-cluster-agent-instrumentation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: appdynamics-cluster-agent-instrumentation
subjects:
- kind: ServiceAccount
  name: appdynamics-cluster-agent
  namespace: appdynamics
---
apiVersion: appdynamics.com/v1alpha1
kind: Clusteragent
metadata:
  name: appd-pepsi-test-cluster-agent
  namespace: appdynamics
spec:
  deploymentMode: PRIMARY
  account: pepsi-test
  appName: pep-eiap-preprod-scus-global-01-aks
  appNameLabel: app
  appNameStrategy: label
  controllerUrl: https://pepsi-test.saas.appdynamics.com:443
  image: pepeiapprodcommonacr.azurecr.io/pep/eiap/infra/vendor/appdynamics/cluster-agent:ubuntu-18.04-20.10.0.1820-unofficial
  imageInfo:
    java:
      agentMountPath: /opt/appdynamics
      image: docker.io/appdynamics/java-agent:latest
      imagePullPolicy: IfNotPresent
  # imagePullSecrets: pep-eiap-svc-eiap-infra-sp-regcred
  instrumentationMethod: None
  logFileBackups: 3
  logFileSizeMb: 5
  logLevel: DEBUG
  maxPodLogsTailLinesCount: 500
  nodeSelector:
    beta.kubernetes.io/os: linux
    kubernetes.azure.com/mode: system
  nsToInstrumentRegex: pep-eiap-ops-admin|pep-eiap-latam-gtm-preprod|pep-eiap-flna-hhnext-preprod
  nsToMonitor:
  - pep-eiap-ops-admin
  - pep-eiap-latam-gtm-preprod
  - pep-eiap-flna-hhnext-preprod
  numberOfTaskWorkers: 2
  resourcesToInstrument:
  - Deployment
  - StatefulSet
  serviceAccountName: appdynamics-cluster-agent
  stdoutLogging: "true"
  tolerations:
  - key: CriticalAddonsOnly
    operator: Exists
