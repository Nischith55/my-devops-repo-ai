apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  annotations:
    meta.helm.sh/release-name: iai-cv-pepiris-backend-common-ksabottlers
    meta.helm.sh/release-namespace: pep-eiap-cgf-pepiris-preprod
  labels:
    app: iai-cv-pepiris-ksabottlers
    app.kubernetes.io/instance: iai-cv-pepiris-backend-common-ksabottlers
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: 1.16.3
    helm.sh/chart: platform-chart-0.1.1
  name: iai-cv-pepiris-ksabottlers-vs
  namespace: pep-eiap-cgf-pepiris-preprod
spec:
  gateways:
