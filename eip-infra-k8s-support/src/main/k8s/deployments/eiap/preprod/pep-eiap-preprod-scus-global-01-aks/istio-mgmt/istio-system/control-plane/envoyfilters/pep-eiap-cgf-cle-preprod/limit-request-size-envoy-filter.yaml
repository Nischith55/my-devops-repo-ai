apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: limit-request-size-cle-legacy-rest-services
  namespace: pep-eiap-cgf-cle-preprod
spec:
  workloadSelector:
    labels:
      app: pep-eiap-cgf-cle-legacy-rest-services
  configPatches:
  - applyTo: HTTP_FILTER
    match:
      context: SIDECAR_INBOUND
      listener:
        filterChain:
          filter:
            name: envoy.filters.network.http_connection_manager
    patch:
      operation: INSERT_BEFORE
      value:
        name: envoy.buffer
        typed_config:
          '@type': type.googleapis.com/udpa.type.v1.TypedStruct
          value:
            maxRequestBytes: 1048576  # ~> 1 MB