apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  annotations: {}
  labels:
    app: flna-chatbot-service-synapse
  name: flna-chatbot-service-synapse-vs
  namespace: pep-eiap-global-eip-preprod
spec:
  gateways:
  - pep-eiap-global-eip-preprod/pep-eiap-global-eip-preprod-cv-gw
  hosts:
  - flna-chatbot-service-synapse.global.gw01.aks01.scus.preprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: flna-chatbot-service-synapse.pep-eiap-global-eip-preprod.svc.cluster.local
        port:
          number: 80
