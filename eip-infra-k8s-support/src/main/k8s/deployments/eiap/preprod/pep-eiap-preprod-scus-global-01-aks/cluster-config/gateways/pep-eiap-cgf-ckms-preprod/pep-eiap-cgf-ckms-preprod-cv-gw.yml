apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: pep-eiap-cgf-ckms-preprod-cv-gw
  namespace: pep-eiap-cgf-ckms-preprod
spec:
  selector:
    istio: pep-eiap-ingress-gw01
  servers:
  - hosts:
    - dummy-passthrough-pep-eiap-cgf-ckms-preprod.gw01.aks01.scus.preprod.azure.intra.pepsico.com
    name: pep-eiap-cgf-ckms-preprod-cv-gw-tls-443
    port:
      name: https-pep-eiap-cgf-ckms-preprod-cv-gw-tls-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - dummy-pep-eiap-cgf-ckms-preprod-443.gw01.aks01.scus.preprod.azure.intra.pepsico.com
    - cgf-ckms-api.global.gw01.aks01.scus.preprod.azure.intra.pepsico.com
    - cgf-ckms-ui.global.gw01.aks01.scus.preprod.azure.intra.pepsico.com
    - cgf-ckms-orchestration.global.gw01.aks01.scus.preprod.azure.intra.pepsico.com
    name: pep-eiap-cgf-ckms-preprod-cv-gw-https-443
    port:
      name: https-pep-eiap-cgf-ckms-preprod-cv-gw-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-eiap-preprod-scus-global-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - dummy-pep-eiap-cgf-ckms-preprod-80.gw01.aks01.scus.preprod.azure.intra.pepsico.com
    - cgf-ckms-api.global.gw01.aks01.scus.preprod.azure.intra.pepsico.com
    - cgf-ckms-ui.global.gw01.aks01.scus.preprod.azure.intra.pepsico.com
    - cgf-ckms-orchestration.global.gw01.aks01.scus.preprod.azure.intra.pepsico.com
    - procurementhub.preprod.mypepsico.com
    - spendwisehub.preprod.mypepsico.com
    name: pep-eiap-cgf-ckms-preprod-cv-gw-http-80
    port:
      name: http-pep-eiap-cgf-ckms-preprod-cv-gw-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true
  - hosts:
    - procurementhub.preprod.mypepsico.com
    name: pep-eiap-cgf-ckms-preprod-cv-gw-3-https-443
    port:
      name: pep-eiap-cgf-ckms-preprod-cv-gw-3-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: procurementhub.preprod-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - spendwisehub.preprod.mypepsico.com
    name: pep-eiap-cgf-ckms-preprod-cv-gw-4-https-443
    port:
      name: pep-eiap-cgf-ckms-preprod-cv-gw-4-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: spendwisehub.preprod-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE

