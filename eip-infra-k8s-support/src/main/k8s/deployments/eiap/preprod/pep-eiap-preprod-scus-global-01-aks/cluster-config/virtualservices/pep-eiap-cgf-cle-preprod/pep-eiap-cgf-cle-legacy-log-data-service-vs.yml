apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  annotations: {}
  labels:
    app: undefined
  name: pep-eiap-cgf-cle-legacy-log-data-service-vs
  namespace: pep-eiap-cgf-cle-preprod
spec:
  gateways:
  - pep-eiap-cgf-cle-preprod/pep-eiap-cgf-cle-preprod-cv-gw
  hosts:
  - pep-eiap-cgf-cle-legacy-log-data-service.global.gw01.aks01.scus.preprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /log/data
    route:
    - destination:
        host: pep-eiap-cgf-cle-legacy-log-data-service.pep-eiap-cgf-cle-preprod.svc.cluster.local
        port:
          number: 80
