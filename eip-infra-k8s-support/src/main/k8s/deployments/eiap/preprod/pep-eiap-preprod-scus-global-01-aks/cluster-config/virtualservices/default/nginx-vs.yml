apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  annotations: {}
  labels:
    app: nginx
  name: nginx-vs
  namespace: default
spec:
  gateways:
  - default/default-cv-gw
  hosts:
  - nginx1.global.gw01.aks01.scus.preprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: nginx.default.svc.cluster.local
        port:
          number: 80
