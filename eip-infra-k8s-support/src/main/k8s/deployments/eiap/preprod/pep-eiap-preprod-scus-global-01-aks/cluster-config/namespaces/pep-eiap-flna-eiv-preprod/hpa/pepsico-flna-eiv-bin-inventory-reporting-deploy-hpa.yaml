apiVersion: autoscaling/v1 
kind: HorizontalPodAutoscaler
metadata:
  name: pepsico-flna-eiv-bin-inventory-reporting-deploy-hpa  # name of hpa object
  namespace: pep-eiap-flna-eiv-preprod  # namespace where the hpa is created
spec:
  maxReplicas: 6 # define max replica count
  minReplicas: 3  # define min replica count
  scaleTargetRef:  # define the resource on which HPA should be applied
    apiVersion: apps/v1
    kind: Deployment
    name: pepsico-flna-eiv-bin-inventory-reporting-deploy   # hpa is applied on this deployment
  targetCPUUtilizationPercentage: 70 # target CPU utilization