apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  annotations: {}
  labels:
    app: graphqlautomation
  name: graphqlautomation-vs
  namespace: pep-eiap-pfna-vct-preprod
spec:
  gateways:
  - pep-eiap-pfna-vct-preprod/pep-eiap-pfna-vct-preprod-cv-gw
  hosts:
  - graphqlautomation.global.gw01.aks01.scus.preprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: graphqlautomation.pep-eiap-pfna-vct-preprod.svc.cluster.local
        port:
          number: 80
