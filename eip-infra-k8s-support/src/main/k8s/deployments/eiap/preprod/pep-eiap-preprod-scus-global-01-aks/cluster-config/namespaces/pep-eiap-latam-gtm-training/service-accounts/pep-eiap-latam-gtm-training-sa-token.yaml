apiVersion: v1
kind: Secret
metadata:
  name: pep-eiap-latam-gtm-training-sa-token  # Naming convention followed is ServiceAccountName-token
  namespace: pep-eiap-latam-gtm-training      # Namespace where the service account is created
  annotations:
    kubernetes.io/service-account.name: "pep-eiap-latam-gtm-training-sa" # Service Account name to map the token
type: kubernetes.io/service-account-token  # Secret type should be this