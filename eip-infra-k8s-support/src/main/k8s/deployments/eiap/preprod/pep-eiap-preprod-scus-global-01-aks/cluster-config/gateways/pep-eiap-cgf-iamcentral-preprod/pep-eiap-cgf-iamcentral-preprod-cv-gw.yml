apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: pep-eiap-cgf-iamcentral-preprod-cv-gw
  namespace: pep-eiap-cgf-iamcentral-preprod
spec:
  selector:
    istio: pep-eiap-ingress-gw01
  servers:
  - hosts:
    - dummy-passthrough-pep-eiap-cgf-iamcentral-preprod.gw01.aks01.scus.preprod.azure.intra.pepsico.com
    name: pep-eiap-cgf-iamcentral-preprod-cv-gw-tls-443
    port:
      name: https-pep-eiap-cgf-iamcentral-preprod-cv-gw-tls-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - dummy-pep-eiap-cgf-iamcentral-preprod-443.gw01.aks01.scus.preprod.azure.intra.pepsico.com
    - pep-myidm-appportal-preprod.global.gw01.aks01.scus.preprod.azure.intra.pepsico.com
    - pep-myidm-appui.global.gw01.aks01.scus.preprod.azure.intra.pepsico.com
    - pep-cgf-preprod-pep-myidm-appui.global.gw01.aks01.scus.preprod.azure.intra.pepsico.com
