    name: pep-eiap-cgf-iamcentral-preprod-cv-gw-http-80
    port:
      name: http-pep-eiap-cgf-iamcentral-preprod-cv-gw-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true
  - hosts:
    - iamcentral-api.ite.mypepsico.com
    name: pep-eiap-cgf-iamcentral-preprod-cv-gw-3-https-443
    port:
      name: pep-eiap-cgf-iamcentral-preprod-cv-gw-3-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: iamcentral-api.ite-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - iamcentral.ite.mypepsico.com
    name: pep-eiap-cgf-iamcentral-preprod-cv-gw-4-https-443
