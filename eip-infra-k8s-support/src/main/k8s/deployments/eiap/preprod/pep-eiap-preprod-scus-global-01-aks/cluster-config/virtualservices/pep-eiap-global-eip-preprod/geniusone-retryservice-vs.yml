apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  annotations: {}
  labels:
    app: geniusone-retryservice
  name: geniusone-retryservice-vs
  namespace: pep-eiap-global-eip-preprod
spec:
  gateways:
  - pep-eiap-global-eip-preprod/pep-eiap-global-eip-preprod-cv-gw
  hosts:
  - geniusone-retryservice.global.gw01.aks01.scus.preprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: geniusone-retryservice.pep-eiap-global-eip-preprod.svc.cluster.local
        port:
          number: 80
