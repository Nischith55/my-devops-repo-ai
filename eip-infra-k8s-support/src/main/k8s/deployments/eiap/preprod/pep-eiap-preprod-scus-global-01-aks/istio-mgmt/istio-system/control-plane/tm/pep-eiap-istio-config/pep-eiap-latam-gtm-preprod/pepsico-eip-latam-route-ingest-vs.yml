apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pepsico-eip-latam-route-ingest-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
    - istio-system/istio-in-gateway-01
  hosts:
  - pepsico-eip-latam-route-ingest.global.gw01.aks01.scus.preprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pepsico-eip-latam-route-ingest.pep-eiap-latam-gtm-preprod.svc.cluster.local
        port:
          number: 80
