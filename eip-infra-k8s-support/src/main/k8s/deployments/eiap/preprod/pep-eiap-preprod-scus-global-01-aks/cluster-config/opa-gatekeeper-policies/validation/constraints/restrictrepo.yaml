apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sAllowedRepos
metadata:
  name: restrictrepo
spec:
  enforcementAction: deny
  match:
    excludedNamespaces:
    - calico-system
    - cattle-fleet-system
    - cattle-gatekeeper-system
    - cattle-impersonation-system
    - cattle-system
    - istio-operator
    - istio-system
    - kube-node-lease
    - kube-public
    - kube-system
    - kubecost
    - kubernetes-dashboard
    - monitoring
    - msi-acrpull-system
    - observability
    - twistlockpp
    - tigera-operator
    - pep-eiap-ops-admin
    - pep-eiap-global-infra
    - pep-eiap-istio-config
    - pep-eiap-elastic-client-01
    - pep-eiap-elastic-client-02
    - pep-eiap-elastic-cluster-01
    - pep-eiap-elastic-cluster-02
    - pep-eiap-elastic-monitor-01
    - pep-eiap-global-devsecops-preprod
    - cert-manager-system
    - reloader
    - flux-system
    - flagger
    - policy-system
    - gitops-connector-system
    - pep-eiap-gremlin
    - snyk-monitor
    - argocd
    - pep-eiap-latam-printmod-preprod
    - kuberay
    - pep-eiap-cgf-aigron-preprod
    kinds:
    - apiGroups:
      - ""
      kinds:
      - Pod
    labelSelector:
      matchExpressions: []
    namespaceSelector:
      matchExpressions: []
    scope: '*'
  parameters:
    repos:
    - pepeiapprodcommonacr.azurecr.io/
    - peppfnanonprodhhnextacr.azurecr.io/
    - pepnonprodsntacr.azurecr.io/
    - docker.io/istio/
    - docker.io/rancher/
    - registry.rancher.com/rancher
    - cyberark/
    - docker.elastic.co/observability/
    - appdynamics/
    - docker.io/appdynamics/
    - myartifactory.mypepsico.com/
    # # OPA Exemption RITM4499633 OCH-NA DEV and QA enviornments
    - otel/
    - openpolicyagent/
    # OPA Exemption RITM4596447 OCH-NA DEV and QA enviornments
    - structurizr/onpremises
    - rancher/
    - wiziopublic.azurecr.io/wiz-app/
    - wizio.azurecr.io/
    #for llamaparse
    - docker.io/llamaindex 
    - docker.io/andrewgaul
    - docker.io/bitnami
    - ghcr.io/chaos-mesh/
    - gcr.io/google-containers/
    # OPA Exemption RITM9011307
    - gcr.io/google-containers/pause