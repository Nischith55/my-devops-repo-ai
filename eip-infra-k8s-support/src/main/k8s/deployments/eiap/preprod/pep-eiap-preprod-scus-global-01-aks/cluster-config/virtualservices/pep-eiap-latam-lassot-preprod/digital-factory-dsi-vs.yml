apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  annotations: {}
  labels:
    app: digital-factory-dsi
  name: digital-factory-dsi-vs
  namespace: pep-eiap-latam-lassot-preprod
spec:
  gateways:
  - pep-eiap-latam-lassot-preprod/pep-eiap-latam-lassot-preprod-cv-gw
  hosts:
  - digital-factory-dsi.global.gw01.aks01.scus.preprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: digital-factory-dsi.pep-eiap-latam-lassot-preprod.svc.cluster.local
        port:
          number: 80
