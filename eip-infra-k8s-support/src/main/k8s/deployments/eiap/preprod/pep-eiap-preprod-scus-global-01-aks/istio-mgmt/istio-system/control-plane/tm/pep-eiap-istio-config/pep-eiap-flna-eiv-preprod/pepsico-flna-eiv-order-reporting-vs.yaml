apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pepsico-flna-eiv-order-reporting-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - flna-eiv-order-reporting.global.gw01.aks01.scus.preprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /flna/eiv/v1
    route:
    - destination:
        host: pepsico-flna-eiv-order-reporting.pep-eiap-flna-eiv-preprod.svc.cluster.local
        port:
          number: 80
