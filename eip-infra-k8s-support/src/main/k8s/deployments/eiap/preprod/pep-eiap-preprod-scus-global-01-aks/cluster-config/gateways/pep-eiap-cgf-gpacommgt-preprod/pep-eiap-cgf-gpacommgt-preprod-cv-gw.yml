    port:
      name: http-pep-eiap-cgf-gpacommgt-preprod-cv-gw-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true
  - hosts:
    - gpacompass.uat.mypepsico.com
    name: pep-eiap-cgf-gpacommgt-preprod-cv-gw-1-https-443
    port:
      name: https-pep-eiap-cgf-gpacommgt-preprod-cv-gw-1-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
