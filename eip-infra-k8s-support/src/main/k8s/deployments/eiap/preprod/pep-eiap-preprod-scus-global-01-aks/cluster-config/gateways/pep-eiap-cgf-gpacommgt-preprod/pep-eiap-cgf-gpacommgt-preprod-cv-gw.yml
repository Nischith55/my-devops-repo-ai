apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: pep-eiap-cgf-gpacommgt-preprod-cv-gw
  namespace: pep-eiap-cgf-gpacommgt-preprod
spec:
  selector:
    istio: pep-eiap-ingress-gw01
  servers:
  - hosts:
    - dummy-passthrough-pep-eiap-cgf-gpacommgt-preprod.gw01.aks01.scus.preprod.azure.intra.pepsico.com
    name: pep-eiap-cgf-gpacommgt-preprod-cv-gw-tls-443
    port:
      name: https-pep-eiap-cgf-gpacommgt-preprod-cv-gw-tls-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - gpa-services.global.gw01.aks01.scus.preprod.azure.intra.pepsico.com
    - gpa-web.global.gw01.aks01.scus.preprod.azure.intra.pepsico.com
    - fcm-services.global.gw01.aks01.scus.preprod.azure.intra.pepsico.com
    - fcm-web.global.gw01.aks01.scus.preprod.azure.intra.pepsico.com
