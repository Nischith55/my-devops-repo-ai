apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pepsico-global-eipone-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pepsico-global-eipone.global.gw01.aks01.scus.preprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /eipone/backend
    route:
    - destination:
        host: pep-eiap-global-eip.pep-eiap-global-eipone-preprod.svc.cluster.local
        port:
          number: 80
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /eipone/api-management
    route:
    - destination:
        host: pep-eiap-global-eip-api.pep-eiap-global-eipone-preprod.svc.cluster.local
        port:
          number: 80
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /eipone/access-management
    route:
    - destination:
        host: pep-eiap-global-eip-access.pep-eiap-global-eipone-preprod.svc.cluster.local
        port:
          number: 80
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /eipone/mdp/admin
    route:
    - destination:
        host: pep-eiap-global-eip-mdp.pep-eiap-global-eipone-preprod.svc.cluster.local
        port:
          number: 80
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /eipone/ami-service
    route:
    - destination:
        host: pep-eiap-global-eip-ami.pep-eiap-global-eipone-preprod.svc.cluster.local
        port:
          number: 80
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /eipone/cmp
    route:
    - destination:
        host: pep-eiap-global-cmp.pep-eiap-global-eipone-preprod.svc.cluster.local
        port:
          number: 80
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /eipone/ddh
    route:
    - destination:
        host: pepsico-eip-eipone-ddh-integration.pep-eiap-global-eipone-preprod.svc.cluster.local
        port:
          number: 80
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /eipone/iai
    route:
    - destination:
        host: pep-eiap-global-iai.pep-eiap-global-eipone-preprod.svc.cluster.local
        port:
          number: 80
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /eipone/billing-service
    route:
    - destination:
        host: pep-eiap-global-eip-billing.pep-eiap-global-eipone-preprod.svc.cluster.local
        port:
          number: 80
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /eipone/consumer-portal
    route:
    - destination:
        host: pep-eiap-global-eip-consumer-portal.pep-eiap-global-eipone-preprod.svc.cluster.local
        port:
          number: 80          
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-eiap-global-eipui.pep-eiap-global-eipone-preprod.svc.cluster.local
        port:
          number: 80                   
