apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  annotations: {}
  labels:
    app: latam-vmi-dsi
  name: latam-vmi-dsi-vs
  namespace: pep-eiap-latam-lassot-preprod
spec:
  gateways:
  - pep-eiap-latam-lassot-preprod/pep-eiap-latam-lassot-preprod-cv-gw
  hosts:
  - latam-vmi-dsi.global.gw01.aks01.scus.preprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: latam-vmi-dsi.pep-eiap-latam-lassot-preprod.svc.cluster.local
        port:
          number: 80
