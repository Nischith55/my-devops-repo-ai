apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pepsico-eip-latam-vanload-ingest-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
    - istio-system/istio-in-gateway-01
  hosts:
  - pepsico-eip-latam-vanload-ingest.global.gw01.aks01.scus.preprod.azure.intra.pepsico.com
  http:
  - headers:
      request:
        add:
          Content-Type: Text/Plain
        remove:
        - Content-Type
    match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pepsico-eip-latam-vanload-ingest.pep-eiap-latam-gtm-preprod.svc.cluster.local
        port:
          number: 80
