apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pythonapi-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pythonapi.global.gw01.aks01.scus.preprod.azure.intra.pepsico.com
  http:
  - match:
    - uri:
        prefix: /api/plan_predict
    - uri:
        prefix: /api/promo_optimize
    - uri:
        prefix: /api/plan_optimize
    - uri:
        prefix: /api/promo_predict
    - uri:
        prefix: /api
    - uri:
        prefix: /
    route:
    - destination:
        host: pythonapi.pep-eiap-flna-ipp-preprod.svc.cluster.local
        port:
          number: 8080