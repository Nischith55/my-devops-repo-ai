apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: flna-chatbot-service-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - flna-chatbot-service.global.gw01.aks01.scus.preprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: flna-chatbot-service.pep-eiap-global-eip-preprod.svc.cluster.local
        port:
          number: 80
          