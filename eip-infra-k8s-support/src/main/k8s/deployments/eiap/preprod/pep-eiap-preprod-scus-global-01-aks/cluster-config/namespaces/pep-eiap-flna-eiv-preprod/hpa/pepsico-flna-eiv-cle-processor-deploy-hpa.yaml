apiVersion: autoscaling/v1 
kind: HorizontalPodAutoscaler
metadata:
  name: pepsico-flna-eiv-cle-processor-deploy-hpa  # name of hpa object
  namespace: pep-eiap-flna-eiv-preprod  # namespace where the hpa is created
spec:
  maxReplicas: 3 # define max replica count
  minReplicas: 2  # define min replica count
  scaleTargetRef:  # define the resource on which HPA should be applied
    apiVersion: apps/v1
    kind: Deployment
    name: pepsico-flna-eiv-cle-processor-deploy  # hpa is applied on this deployment
  targetCPUUtilizationPercentage: 80 # target CPU utilization