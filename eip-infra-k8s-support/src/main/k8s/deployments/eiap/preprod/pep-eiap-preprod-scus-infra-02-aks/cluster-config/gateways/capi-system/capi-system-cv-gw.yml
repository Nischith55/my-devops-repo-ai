---
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: capi-system-cv-gw
  namespace: capi-system
spec:
  selector:
    istio: pep-eiap-ingress-gw01
  servers:
  - hosts:
    - "dummy-passthrough-capi-system.gw01.aks02.scus.preprod.azure.intra.pepsico.com"
    name: "capi-system-cv-gw-tls-443"
    port:
      name: "https-capi-system-cv-gw-tls-443"
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - "dummy-capi-system-443.gw01.aks02.scus.preprod.azure.intra.pepsico.com"
    name: "capi-system-cv-gw-https-443"
    port:
      name: "https-capi-system-cv-gw-443"
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: "pep-eiap-preprod-scus-infra-02-aks-gw01-tls"
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - "dummy-capi-system-80.gw01.aks02.scus.preprod.azure.intra.pepsico.com"
    name: "capi-system-cv-gw-http-80"
    port:
      name: "http-capi-system-cv-gw-80"
      number: 80
      protocol: http
    tls:
      httpsRedirect: true
