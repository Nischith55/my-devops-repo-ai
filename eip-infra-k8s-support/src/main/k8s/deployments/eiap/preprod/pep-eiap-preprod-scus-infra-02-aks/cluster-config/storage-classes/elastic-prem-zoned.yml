---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: elastic-premium-zoned

# a) need for dynamic provision
provisioner: kubernetes.io/azure-disk

reclaimPolicy: Delete

volumeBindingMode: WaitForFirstConsumer

allowVolumeExpansion: True


# c) need for dynamic provision
parameters:
  fsType: xfs
  kind: Managed
  resourceGroup: pep-eiap-preprod-scus-k8s-01-rg
  storageaccounttype: Premium_LRS
  zoned: 'true'

