apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sContainerLimits
metadata:
  name: container-must-have-limits
spec:
  enforcementAction: deny
  match:
    excludedNamespaces:
    - calico-system
    - cattle-fleet-system
    - cattle-gatekeeper-system
    - cattle-impersonation-system
    - cattle-system
    - istio-operator
    - istio-system
    - kube-node-lease
    - kube-public
    - kube-system
    - kubecost
    - kubernetes-dashboard
    - monitoring
    - msi-acrpull-system
    - observability
    - twistlockpp
    - tigera-operator
    - pep-eiap-ops-admin
    - pep-eiap-global-infra
    - pep-eiap-istio-config
    - pep-eiap-elastic-client-01
    - pep-eiap-elastic-client-02
    - pep-eiap-elastic-cluster-01
    - pep-eiap-elastic-cluster-02
    - pep-eiap-elastic-monitor-01
    - pep-eiap-global-devsecops-preprod
    - cert-manager-system
    - reloader
    - flux-system
    - flagger
    - policy-system
    - gitops-connector-system
    - pep-eiap-gremlin
    - argocd
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    scope: '*'
  parameters:
    cpu: "4"
    memory: "8Gi"
    exemptImages:
    - cyberark/secrets-provider-for-k8s*
    - docker.io/istio/*
    - docker.elastic.co/observability/*
    - appdynamics/*
    - docker.io/appdynamics/*
    # OPA Exception RITM4803965 pep-eiap-och-edt-preprod
    - pepeiapprodcommonacr.azurecr.io/omnichannelecommercehub_docker_local/pep/och/essa/edt/*
    # OPA Exception Request RITM5131222
    - pepeiapprodcommonacr.azurecr.io/omnichannelecommercehub_docker_local/pep/och/essa/edt/pep-och-amazon-flna-mop*
    # OPA Exception Request RITM5131222
    - pepeiapnonprodglobalcommonacr.azurecr.io/omnichannelecommercehub_docker_local/pep/och/essa/edt/pep-och-essa-poland-customer-batch*
    # OPA Exception Request RITM6516073
    - pepeiapnonprodglobalcommonacr.azurecr.io/omnichannelecommercehub_docker_local/pep/och/essa/edt/pep-och-essa-poland-pricing-service*
    # OPA Exception Request RITM6525030
    - pepeiapnonprodglobalcommonacr.azurecr.io/omnichannelecommercehub_docker_local/pep/och/essa/edt/pep-och-essa-b2beudatastoresrvc*
      # # OPA Execption RITM6722740 for pep-eiap-och-edt-dev/qa
    - pepeiapnonprodglobalcommonacr.azurecr.io/omnichannelecommercehub_docker_local/pep/och/essa/edt/pep-och-essa-poland-pricing-batch*