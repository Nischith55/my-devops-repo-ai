apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-och-orderintakeconsumer-ufhp-vs
  namespace: pep-eiap-och-edt-preprod
  labels:
      app: pep-och-orderintakeconsumer
spec:
  hosts:
  - pep-och-orderintakeconsumer.global.gw01.aks01.suk.preprod.azure.intra.pepsico.com
  gateways:
  - pep-eiap-och-edt-preprod/pep-eiap-och-edt-preprod-cv-gw
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /management/
    route:
    - destination:
        host: pep-och-orderintakeconsumer.pep-eiap-och-edt-preprod.svc.cluster.local
        port:
          number: 80
  