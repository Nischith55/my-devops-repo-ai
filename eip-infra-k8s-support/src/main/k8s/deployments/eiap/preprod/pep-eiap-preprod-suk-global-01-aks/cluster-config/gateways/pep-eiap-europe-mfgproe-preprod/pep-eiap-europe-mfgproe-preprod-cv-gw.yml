apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: pep-eiap-europe-mfgproe-preprod-cv-gw
  namespace: pep-eiap-europe-mfgproe-preprod
spec:
  selector:
    istio: pep-eiap-ingress-gw01
  servers:
  - hosts:
    - dummy-passthrough-pep-eiap-europe-mfgproe-preprod.global.gw01.aks01.suk.preprod.azure.intra.pepsico.com
    name: pep-eiap-europe-mfgproe-preprod-cv-gw-tls-443
    port:
      name: https-pep-eiap-europe-mfgproe-preprod-cv-gw-tls-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - pep-eiap-europe-mfgproe-preprod-cv.global.gw01.aks01.suk.preprod.azure.intra.pepsico.com
    name: pep-eiap-europe-mfgproe-preprod-cv-gw-https-443
    port:
      name: https-pep-eiap-europe-mfgproe-preprod-cv-gw-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-eiap-preprod-suk-global-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE

