apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  annotations: {}
  labels:
    app: pep-och-ochbireportauth
  name: pep-och-ochbireportauth-vs
  namespace: pep-eiap-och-edt-preprod
spec:
  gateways:
  - pep-eiap-och-edt-preprod/pep-eiap-och-edt-preprod-cv-gw
  hosts:
  - pep-och-ochbireportauth.global.gw01.aks01.suk.preprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    - ignoreUriCase: true
      uri:
        prefix: /management       
    route:
    - destination:
        host: pep-och-ochbireportauth.pep-eiap-och-edt-preprod.svc.cluster.local
        port:
          number: 80
    corsPolicy:
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Link
      - Content-Type
      - Access-Control-Allow-Origin
      allowMethods:
      - GET
      - POST
      - DELETE
      - PATCH
      - PUT
      - OPTIONS
      allowOrigins:
      - exact: https://pep-och-falloutmanagement.global.gw01.aks01.suk.preprod.azure.intra.pepsico.com
      - exact: https://pep-och-ui.global.gw01.aks01.suk.preprod.azure.intra.pepsico.com/
      exposeHeaders:
      - x-total-count
      - x-source      
