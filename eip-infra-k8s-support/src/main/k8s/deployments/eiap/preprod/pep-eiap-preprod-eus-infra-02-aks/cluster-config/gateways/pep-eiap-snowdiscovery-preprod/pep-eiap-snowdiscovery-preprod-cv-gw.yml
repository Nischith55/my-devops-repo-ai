---
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: pep-eiap-snowdiscovery-preprod-cv-gw
  namespace: pep-eiap-snowdiscovery-preprod
spec:
  selector:
    istio: pep-eiap-ingress-gw01
  servers:
  - hosts:
    - "dummy-passthrough-pep-eiap-snowdiscovery-preprod.gw01.aks02.eus.preprod.azure.intra.pepsico.com"
    name: "pep-eiap-snowdiscovery-preprod-cv-gw-tls-443"
    port:
      name: "https-pep-eiap-snowdiscovery-preprod-cv-gw-tls-443"
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - "dummy-pep-eiap-snowdiscovery-preprod-443.gw01.aks02.eus.preprod.azure.intra.pepsico.com"
    name: "pep-eiap-snowdiscovery-preprod-cv-gw-https-443"
    port:
      name: "https-pep-eiap-snowdiscovery-preprod-cv-gw-443"
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: "pep-eiap-preprod-eus-infra-02-aks-gw01-tls"
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - "dummy-pep-eiap-snowdiscovery-preprod-80.gw01.aks02.eus.preprod.azure.intra.pepsico.com"
    name: "pep-eiap-snowdiscovery-preprod-cv-gw-http-80"
    port:
      name: "http-pep-eiap-snowdiscovery-preprod-cv-gw-80"
      number: 80
      protocol: http
    tls:
      httpsRedirect: true
