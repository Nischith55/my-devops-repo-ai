---
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: istio-in-gateway-01
  namespace: istio-system
spec:
  selector:
    istio: pep-eiap-ingress-gw01
  servers:

  # ###########################################################################
  #  ALL SSL Passthrough ONLY 1 block, no need for separate blocks
  # ###########################################################################

  - hosts:
    # pep-eiap-elastic-cluster-02
    - pep-eiap-elastic-02.infra.gw01.aks02.eus.preprod.azure.intra.pepsico.com
    - pep-eiap-elastic-02-admin.infra.gw01.aks02.eus.preprod.azure.intra.pepsico.com
    - pep-eiap-kibana-02.infra.gw01.aks02.eus.preprod.azure.intra.pepsico.com
    - pep-eiap-ingest-02.infra.gw01.aks02.eus.preprod.azure.intra.pepsico.com
    - pep-eiap-elastic-ccr-02.infra.gw01.aks02.eus.preprod.azure.intra.pepsico.com
    name: gw01-elastic-all-tls-443
    port:
      name: tls-elastic-all-443
      number: 443
      protocol: tls
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH

  # HTTPS traffic - SSL Terminated -- Please ensure http match is used in
  # VS routing
  - hosts:
    - '*.infra.gw01.aks02.eus.preprod.azure.intra.pepsico.com'
    name: gw01-wc-https-443
    port:
      name: https-wc-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-eiap-preprod-eus-infra-02-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE

  - hosts:
    - '*.infra.gw01.aks02.eus.preprod.azure.intra.pepsico.com'
    name: gw01-wc-https-80
    port:
      name: http-wcard-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true      

