---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: metricbeat
  namespace: pep-eiap-elastic-client-01
  labels:
    k8s-app: metricbeat
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: metricbeat
  labels:
    k8s-app: metricbeat
rules:
- apiGroups: [""]
  resources:
  - nodes
  - namespaces
  - events
  - pods
  - services
  - persistentvolumes
  - persistentvolumeclaims
  verbs: ["get", "list", "watch"]
- apiGroups: ["extensions"]
  resources:
  - replicasets
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources:
  - statefulsets
  - deployments
  - replicasets
  - daemonsets
  verbs: ["get", "list", "watch"]
- apiGroups: ["batch"]
  resources:
  - jobs
  - cronjobs
  verbs: ["get", "list", "watch"]
- apiGroups: ["storage.k8s.io"]
  resources:
    - storageclasses
  verbs: ["get", "list", "watch"]
- apiGroups:
  - ""
  resources:
  - nodes/stats
  verbs:
  - get
- nonResourceURLs:
  - "/metrics"
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: metricbeat
  # should be the namespace where metricbeat is running
  namespace: pep-eiap-elastic-client-01
  labels:
    k8s-app: metricbeat
rules:
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: metricbeat-kubeadm-config
  namespace: pep-eiap-elastic-client-01
  labels:
    k8s-app: metricbeat
rules:
  - apiGroups: [""]
    resources:
      - configmaps
    resourceNames:
      - kubeadm-config
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: metricbeat
subjects:
- kind: ServiceAccount
  name: metricbeat
  namespace: pep-eiap-elastic-client-01
roleRef:
  kind: ClusterRole
  name: metricbeat
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: metricbeat
  namespace: pep-eiap-elastic-client-01
subjects:
  - kind: ServiceAccount
    name: metricbeat
    namespace: pep-eiap-elastic-client-01
roleRef:
  kind: Role
  name: metricbeat
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: metricbeat-kubeadm-config
  namespace: pep-eiap-elastic-client-01
subjects:
  - kind: ServiceAccount
    name: metricbeat
    namespace: pep-eiap-elastic-client-01
roleRef:
  kind: Role
  name: metricbeat-kubeadm-config
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  # NOTE: change this for instance of elastic running
  name: preprod-eus-infra-02-aks-k8s-metricbeat-config
  namespace: pep-eiap-elastic-client-01

data:

  K8S_CLUSTER_NAME: pep-eiap-preprod-eus-infra-02-aks

  metricbeat-processor.yml: |

    processors:


    - add_fields:
        fields:
          ls-destination: "EUS"
          pep-aks-cluster: ${K8S_CLUSTER_NAME}
    - add_host_metadata: {}
    - add_cloud_metadata: {}
    - add_kubernetes_metadata: {}

    - add_tags:
        tags: ["NONPROD-EUS-Shared", "retain-logs"]

    - script:
        lang: javascript
        source: >
          function process(event) {
            event.Put("fields.sn-application", "metrics-pep-eiap-preprod-eus-infra-02-aks" + "-" + event.Get("kubernetes.namespace"));
            return event;
          }   
    # ~~
    # Logging
    # ~~
    logging:
      level: INFO
      metrics:
        enabled: true

  metricbeat.yml: |
    setup.template.name: "metrics-kubernetes-tsds"
    setup.template.pattern: "metrics-pep-eiap-preprod-eus-infra-02-aks*"
    setup.ilm.enabled: false     

    output.elasticsearch:
        hosts: [https://3825028849b946d3a380f6136dcd7c3a.privatelink.southcentralus.azure.elastic-cloud.com:9243]
        api_key: "GnuNB5MBWuezjPg1DKep:OPckBJB2QHOYgXBnfTHhZw"
        index: "%{[fields][sn-application]}"
        # worker: 2
        # bulk_max_size: 1000
        ssl.verification_mode: none
        timeout: 90s
    metricbeat:

      # ~~
      # modules
      # ~~
      modules:

      - module: system
        enabled: false

      - module: kubernetes
        enabled: true
        add_metadata: true
        period: 30s
        hosts:
        - kube-state-metrics.${KUBE_STATE_METRICS_NAMESPACE}.svc:${KUBE_STATE_METRICS_PORT}
        metricsets:
        - state_node
        - state_deployment
        - state_daemonset
        - state_replicaset
        - state_pod
        - state_container
        - state_cronjob
        - state_resourcequota
        - state_statefulset
        - state_service
        - state_persistentvolume
        - state_persistentvolumeclaim
        - state_storageclass
        # k8s events
        - event

      - module: istio
        enabled: true
        period: 30s
        timeout: 90s
        metricsets:
        - istiod
        hosts:
        # standard install, if different change it
        - istiod.istio-system.svc.cluster.local:15014
      
      - module: prometheus
        period: 10s
        hosts: ["https://pep-eiap-prometheus.infra.gw01.aks02.eus.preprod.azure.intra.pepsico.com:443"]
        ssl.verification_mode: "none"
        metricsets: ["query"]
        queries:
        - name: "argocd_app_reconcile_sum"
          path: "/api/v1/query"
          params:
            query: "argocd_app_reconcile_sum"
        - name: "argocd_git_request_total"
          path: "/api/v1/query"
          params:
            query: "argocd_git_request_total"   
        - name: "argocd_repo_pending_request_total"
          path: "/api/v1/query"
          params:
            query: "argocd_repo_pending_request_total"  
        - name: "argocd_cluster_connection_status"
          path: "/api/v1/query"
          params:
            query: "argocd_cluster_connection_status"
        - name: "argocd_app_info"
          path: "/api/v1/query"
          params:
            query: "argocd_app_info"
        - name: "argocd_app_k8s_request_total"
          path: "/api/v1/query"
          params:
            query: "argocd_app_k8s_request_total"
        - name: "argocd_app_reconcile_count"
          path: "/api/v1/query"
          params:
            query: "argocd_app_reconcile_count"
        - name: "argocd_redis_request_duration_seconds_sum_repo_server"
          path: "/api/v1/query"
          params:
            query: "argocd_redis_request_duration_seconds_sum{initiator='argocd-repo-server'}"
        - name: "argocd_redis_request_duration_sum_app_controller"
          path: "/api/v1/query"
          params:
            query: "argocd_redis_request_duration_sum{initiator='argocd-application-controller'}"
        - name: "argocd_redis_request_duration_sum_argo_server"
          path: "/api/v1/query"
          params:
            query: "argocd_redis_request_duration_sum{initiator='argocd-server'}"
        - name: "argocd_redis_request_total_sum_app_controller"
          path: "/api/v1/query"
          params:
            query: "argocd_redis_request_total{initiator='argocd-application-controller'}"
        - name: "argocd_redis_request_total_argo_server"
          path: "/api/v1/query"
          params:
            query: "argocd_redis_request_total{initiator='argocd-server'}"
        - name: "argocd_git_request_duration_seconds_sum"
          path: "/api/v1/query"
          params:
            query: "argocd_git_request_duration_seconds_sum"


      autodiscover:
        providers:
        # stack monitoring
        - type: kubernetes
          scope: cluster
          resource: pod
          node: ${NODE_NAME}
          hints:
            enabled: true
          templates:
            - condition:
                contains:
                  # (we use std. istio injected annotation)
                  kubernetes.annotations.prometheus.io/path: "/stats/prometheus"
              config:
                - module: istio
                  enabled: true
                  period: 30s
                  metricsets:
                  - proxy
                  # undocumented seems to work for slow system
                  timeout: 90s
                  hosts:
                  # istio proxy port
                  - http://${data.kubernetes.pod.ip}:15020

---
apiVersion: apps/v1
kind: Deployment
metadata:
  # name format: <output-eck-cluster>-k8s
  name: &app_name preprod-eus-infra-02-aks-k8s-metricbeat
  namespace: pep-eiap-elastic-client-01
  labels:
    app.kubernetes.io/name: *app_name
    app.kubernetes.io/version: &vers 8.19.11
spec:

  # For cluster wide metricbeat we use recreate, so we don't run into locks
  strategy:
    type: Recreate

  selector:
    matchLabels:
      app.kubernetes.io/name: *app_name
      app.kubernetes.io/version: *vers

  template:

    metadata:
      labels:
        app.kubernetes.io/name: *app_name
        app.kubernetes.io/version: *vers
        app: *app_name
        version: *vers

    spec:
      hostAliases:
      - ip: "172.27.62.199"
        hostnames:
        - "3825028849b946d3a380f6136dcd7c3a.privatelink.southcentralus.azure.elastic-cloud.com" 
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.azure.com/mode: system
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists

      serviceAccountName: metricbeat
      automountServiceAccountToken: true
      securityContext:
        runAsUser: 0

      # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
      # All volumes
      # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
      volumes:

      - name: config-projected
        projected:
          # 0644 -> 420, 0600 -> 384
          defaultMode: 384
          sources:

          # pep-ca-certs-config
          - configMap:
              name: pep-ca-certs-config
              optional: false
              items:
                - key: PepsiCoCA01.pem
                  # must be relative
                  path: etc/certs/PepsiCoCA01.pem
                - key: PepsiCoRootCA.pem
                  # must be relative
                  path: etc/certs/PepsiCoRootCA.pem

          - configMap:
              name: &beats_config preprod-eus-infra-02-aks-k8s-metricbeat-config
              optional: false
              items:
                - key: metricbeat.yml
                  # must be relative
                  path: etc/beat.yml
                - key: metricbeat-processor.yml
                  # must be relative
                  path: etc/beat-processor-config.yml

      containers:
      # PEP: args removed sysfs it's a deployment
      - name: metricbeat
        image: docker.elastic.co/beats/metricbeat:8.19.11
        args:
        - --environment
        - container
        - -e
        - -c
        - /projected/etc/beat-processor-config.yml
        - -c
        - /projected/etc/beat.yml

        resources:
          requests:
            # cpu: 200m
            memory: 512Mi
        env:

        # All environment variables from beats-shared-env-config
        - name: K8S_CLUSTER_NAME
          valueFrom:
            configMapKeyRef:
              name: *beats_config
              key: K8S_CLUSTER_NAME

        # PEP: change
        - name: KUBE_STATE_METRICS_NAMESPACE
          value: monitoring

        # PEP: change
        - name: KUBE_STATE_METRICS_PORT
          value: "8080"

        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP

        # ~~
        # volumemounts
        # ~~
        volumeMounts:
        # PEP:
        - name: config-projected
          # where it is mounted
          mountPath: /projected
          readOnly: true
