  # - secureSettings is a mechanism to inject keys into elasticsearch.keystore
  # - Please check if the settings supports secure otherwise you will crash and
  #   burn :)
  # secrets to be exported to elasticsearch.keystore
  secureSettings:
    - secretName: pep-eiap-preprod-eus-infra-02-aks-xpack-generic
      entries:
        - key: xpack.security.authc.realms.ldap.pep_ite_ldap.secure_bind_password
  transport:
    service:
      metadata:
        annotations:
          service.beta.kubernetes.io/azure-load-balancer-internal: "true"
      spec:
        loadBalancerIP: 172.25.147.124
        type: LoadBalancer
        
  # HTTP Layer
  http:
    tls:
      certificate:
        # make sure this is installed in the namespace
        secretName: &gw01_secret pep-eiap-preprod-eus-infra-02-aks-gw01-generic
    service:
      spec:
        selector:
          elasticsearch.k8s.elastic.co/cluster-name: *cname
          elasticsearch.k8s.elastic.co/node-master: "false"
          elasticsearch.k8s.elastic.co/node-data: "false"

