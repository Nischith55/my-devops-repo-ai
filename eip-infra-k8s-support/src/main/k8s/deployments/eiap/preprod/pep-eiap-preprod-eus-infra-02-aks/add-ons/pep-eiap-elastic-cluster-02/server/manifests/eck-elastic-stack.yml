      config: &data_config
        node:
          roles:
            - data
        xpack: *common_xpack

      volumeClaimTemplates: &data_vol_claim_templates
        - metadata:
            name: elasticsearch-data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 3072Gi
            storageClassName: *elastic_pressd_sc

      podTemplate:
        # common metdata annotations
        metadata: *pod_tmpl_metadata
        spec:
          # IMPORTANT: should be at pod level
          securityContext: *common_sec_ctxt
          nodeSelector:
            # IMPORTANT: change for each zone
            agentpool: npesd2z1
          tolerations:
            - key: ESData02NodeOnlyZone1
              operator: Exists

          # volumes are same as master
          volumes: *master_volumes

          # we use master init containers (since same)
          initContainers: *master_init_containers

          containers: &data_containers
            - name: elasticsearch
              imagePullPolicy: IfNotPresent

              resources:
                limits:
                  cpu: 7800m
                  memory: 45Gi

                requests:
                  cpu: 6000m
                  memory: 45Gi

              env: &data_env_all

                - name: ES_JAVA_OPTS
                  value: -Xms31g -Xmx31g

                - name: LDAP_URL_0
                  valueFrom:
                    configMapKeyRef:
                      name: pep-eiap-xpack-settings
                      key: ldap_url_0

                - name: LDAP_BIND_DN
                  valueFrom:
                    configMapKeyRef:
                      name: pep-eiap-xpack-settings
                      key: ldap_bind_dn

              volumeMounts: *common_vol_mounts

