---
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: istio-in-gateway-01
  namespace: istio-system
spec:
  selector:
    istio: pep-eiap-ingress-gw01
  servers:

  # HTTPS traffic - SSL Terminated -- Please ensure http match is used in
  # VS routing
  - hosts:
    - "*.global.gw01.aks01.gwc.preprod.azure.intra.pepsico.com"
    name: istio-in-gateway-01-selective-https-443
    port:
      name: https-sltv-443
      number: 443
      protocol: HTTPS
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-eiap-preprod-gwc-global-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - "*.global.gw01.aks01.gwc.preprod.azure.intra.pepsico.com"
    - cle-rest-api.gwc.preprod.intra.pepsico.com
    - cle-rest-api.essa.preprod.intra.pepsico.com
    name: istio-in-gateway-01-selective-http-80
    port:
      name: http-sltv-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true
  - hosts:
    - cle-rest-api.essa.preprod.intra.pepsico.com
    name: istio-in-gateway-01-cle-rest-api-https-443
    port:
      name: https-cle-rest-api-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-eiap-preprod-global-cle-rest-api-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - cle-rest-api.gwc.preprod.intra.pepsico.com
    name: istio-in-gateway-01-cle-rest-api-https-443
    port:
      name: https-cle-rest-gwc-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-eiap-preprod-global-cle-rest-api-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
