---
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: pep-eiap-cgf-cle-preprod-cv-gw
  namespace: pep-eiap-cgf-cle-preprod
spec:
  selector:
    istio: pep-eiap-ingress-gw01
  servers:
  - hosts:
    - "dummy-passthrough-pep-eiap-cgf-cle-preprod.gw01.aks01.gwc.preprod.azure.intra.pepsico.com"
    name: "pep-eiap-cgf-cle-preprod-cv-gw-tls-443"
    port:
      name: "https-pep-eiap-cgf-cle-preprod-cv-gw-tls-443"
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - pep-eiap-cgf-cle-rest-services.global.gw01.aks01.gwc.preprod.azure.intra.pepsico.com
    name: "pep-eiap-cgf-cle-preprod-cv-gw-https-443"
    port:
      name: "https-pep-eiap-cgf-cle-preprod-cv-gw-443"
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: "pep-eiap-preprod-gwc-global-01-aks-gw01-tls"
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - pep-eiap-cgf-cle-rest-services.global.gw01.aks01.gwc.preprod.azure.intra.pepsico.com
    - cle-rest-api.essa.preprod.intra.pepsico.com
    - cle-rest-api.gwc.preprod.intra.pepsico.com
    name: "pep-eiap-cgf-cle-preprod-cv-gw-http-80"
    port:
      name: "http-pep-eiap-cgf-cle-preprod-cv-gw-80"
      number: 80
      protocol: http
    tls:
      httpsRedirect: true
  - hosts:
    - cle-rest-api.essa.preprod.intra.pepsico.com
    name: "pep-eiap-cgf-cle-preprod-cv-gw-1-https-443"
    port:
      name: "https-pep-eiap-cgf-cle-preprod-cv-gw-1-443"
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-eiap-preprod-global-cle-rest-api-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - cle-rest-api.gwc.preprod.intra.pepsico.com
    name: "pep-eiap-cgf-cle-preprod-cv-gw-2-https-443"
    port:
      name: "https-pep-eiap-cgf-cle-preprod-cv-gw-2-443"
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-eiap-preprod-global-cle-rest-api-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
