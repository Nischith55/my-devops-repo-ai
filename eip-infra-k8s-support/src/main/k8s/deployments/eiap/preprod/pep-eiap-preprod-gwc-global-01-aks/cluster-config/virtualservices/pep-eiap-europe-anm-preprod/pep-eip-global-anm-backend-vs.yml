apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-eip-global-anm-backend
  name: pep-eip-global-anm-backend-vs
  namespace: pep-eiap-europe-anm-preprod
spec:
  gateways:
  - pep-eiap-europe-anm-preprod/pep-eiap-europe-anm-preprod-cv-gw
  hosts:
  - pep-eip-global-anm-backend.global.gw01.aks01.gwc.preprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-eip-global-anm-backend.pep-eiap-europe-anm-preprod.svc.cluster.local
        port:
          number: 80
