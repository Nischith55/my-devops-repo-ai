---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-eiap-kibana-monitor-01
  namespace: pep-eiap-istio-config
spec:
  gateways:
    - istio-system/istio-in-gateway-01
  hosts:
  - pep-eiap-kibana-monitor-01.infra.gw01.aks02.scus.preprod.azure.intra.pepsico.com
  tls:
    - match:
      - port: 443
        sniHosts:
          - pep-eiap-kibana-monitor-01.infra.gw01.aks02.scus.preprod.azure.intra.pepsico.com
      route:
        - destination:
            host: monitor-01-preprod-scus-kb-http.pep-eiap-elastic-monitor-01.svc.cluster.local
            port:
              number: 5601
