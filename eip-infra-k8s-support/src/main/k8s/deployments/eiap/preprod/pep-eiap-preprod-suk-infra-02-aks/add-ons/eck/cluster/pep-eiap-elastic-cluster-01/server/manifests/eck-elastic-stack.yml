    # ++
    # Ingest new zone-1 -- (NEW ONE)
    # ++
    - name: ingest01-z1
      count: 1

      config: &ingest_config
        node:
          roles:
            - ingest

        xpack: *common_xpack

      volumeClaimTemplates: &ingest_vol_claim_templates
        - metadata:
            name: elasticsearch-data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 50Gi
            storageClassName: *elastic_standard_sc

      podTemplate:
        # common metdata annotations
        metadata: *pod_tmpl_metadata
        spec:
          # IMPORTANT: should be at pod level
          securityContext: *common_sec_ctxt
          nodeSelector:
            # IMPORTANT: change for each zone
            agentpool: npesg1z1
          tolerations:
            - key: ESGeneralPurpose01NodeOnlyZone1
              operator: Exists

          # volumes are same as master
          volumes: *master_volumes

          # we use master init containers (since same)
          initContainers: *master_init_containers

          containers: &ingest_containers
            - name: elasticsearch
              imagePullPolicy: IfNotPresent

              resources:
                limits:
                  #cpu: 1950m
                  memory: 18Gi

                requests:
                  #cpu: 1000m
                  memory: 17Gi

              env: &ingest_env_all

                - name: ES_JAVA_OPTS
                  value: -Xms16g -Xmx16g

                - name: LDAP_URL_0
                  valueFrom:
                    configMapKeyRef:
                      name: pep-eiap-xpack-settings
                      key: ldap_url_0

                - name: LDAP_BIND_DN
                  valueFrom:
                    configMapKeyRef:
                      name: pep-eiap-xpack-settings
                      key: ldap_bind_dn

              volumeMounts: *common_vol_mounts