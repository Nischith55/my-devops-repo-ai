            - data

        xpack: *common_xpack

      volumeClaimTemplates: &data_vol_claim_templates
        - metadata:
            name: elasticsearch-data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 2048Gi
            storageClassName: &data_storage_class elastic-stdssd-zoned

      podTemplate:

        metadata: *pod_tmpl_metadata

        spec:
          # IMPORTANT: should be at pod level
          securityContext: *common_sec_ctxt
          # Common Node Selector for a ES role type
          nodeSelector:
            agentpool: npesd1z1
          # This should be different for each zone
          tolerations:
            - key: ESData01NodeOnlyZone1
              operator: Exists

          volumes: *master_volumes

          # IMPORTANT: since JAVA_OPTS is shared make sure we have the nodes
          # that can handle it
          initContainers: *master_init_containers

          containers: &data_containers
            - name: elasticsearch

              imagePullPolicy: IfNotPresent
              resources:
                limits:
                  cpu: 7800m
                  memory: 50Gi

                requests:
                  cpu: 6500m
                  memory: 48Gi

              env: &data_env_all

                - name: ES_JAVA_OPTS
                  value: -Xms31g -Xmx31g

                - name: LDAP_URL_0
                  valueFrom:
                    configMapKeyRef:
                      name: pep-eiap-xpack-settings
                      key: ldap_url_0

                - name: LDAP_BIND_DN
                  valueFrom:
                    configMapKeyRef:
                      name: pep-eiap-xpack-settings
                      key: ldap_bind_dn

              volumeMounts: *common_vol_mounts
