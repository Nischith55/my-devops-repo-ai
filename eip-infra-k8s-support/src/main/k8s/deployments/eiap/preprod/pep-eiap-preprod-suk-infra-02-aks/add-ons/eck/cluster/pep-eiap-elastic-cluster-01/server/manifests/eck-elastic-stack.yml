# New Coordinator node pool
    - name: coordinator01-z1
      count: 1

      config: &coordinator_config
        node:
          roles: []

        xpack: *common_xpack

      volumeClaimTemplates: &coordinator_vol_claim_templates
        - metadata:
            name: elasticsearch-data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 50Gi
            storageClassName: *elastic_standard_sc

      podTemplate:
        # common metdata annotations
        metadata: *pod_tmpl_metadata
        spec:
          # IMPORTANT: should be at pod level
          securityContext: *common_sec_ctxt

          nodeSelector:
            # IMPORTANT: change for each zone
            agentpool: npesg1z1

          tolerations:
            - key: ESGeneralPurpose01NodeOnlyZone1
              operator: Exists

          affinity: &coordinator_affinity
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions:
                    - key: elasticsearch.k8s.elastic.co/statefulset-name
                      operator: In
                      values:
                        # make sure to not be co-located with ingest nodes
                        - cluster-01-preprod-suk-es-ingest-z1
                        - cluster-01-preprod-suk-es-ingest-z2
                        - cluster-01-preprod-suk-es-ingest-z3
                # IMPORTANT:
                # - antiAffinity for requiredDuringScheduling only
                #   topologyKey allowed is kubernetes.io/hostname
                #   IF LimitPodHardAntiAffinityTopology admission
                #   controller is enabled
                topologyKey: kubernetes.io/hostname

          # volumes are same as master
          volumes: *master_volumes

          # we use master init containers (since same)
          initContainers: *master_init_containers

          containers: &coordinator_containers
            - name: elasticsearch
              imagePullPolicy: IfNotPresent

              resources:
                limits:
                  cpu: 3100m
                  memory: 26Gi

                requests:
                  cpu: 2800m
                  memory: 25Gi

              env: &coordinator_env_all

                - name: ES_JAVA_OPTS
                  value: -Xms24g -Xmx24g

                - name: LDAP_URL_0
                  valueFrom:
                    configMapKeyRef:
                      name: pep-eiap-xpack-settings
                      key: ldap_url_0

                - name: LDAP_BIND_DN
                  valueFrom:
                    configMapKeyRef:
                      name: pep-eiap-xpack-settings
                      key: ldap_bind_dn

              volumeMounts: *common_vol_mounts

