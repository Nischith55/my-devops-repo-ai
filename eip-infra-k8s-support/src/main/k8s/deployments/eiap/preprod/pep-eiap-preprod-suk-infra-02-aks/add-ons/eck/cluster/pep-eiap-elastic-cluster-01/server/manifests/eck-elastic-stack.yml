    # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
    # Master Node set (new pool)
    # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
    # ~~
    # master zone-1
    # ~~
    - name: master01-z1
      count: 1
      # Most of  elasticsearch.yaml
      config: &common_master_config
        node:
          roles:
            - master

        # ##
        # Shared xpack configuration -- using YAML anchors
        # ##
        xpack: &common_xpack

          # Enable Stack monitoring
          monitoring:
            collection:
              enabled: true
            # disable built-in monitoring
            elasticsearch:
              collection:
                enabled: false

          notification:
            email:
              account:
                exchange_account:
                  profile: outlook
                  email_defaults:
                    from: ITEIAPALERTS@pepsico.com
                  smtp:
                    host: planrr.corp.pep.pvt
                    port: 25
          http:
            ssl:
              verification_mode: none

          security:

            authc:
              token:
                enabled: true

              realms:

                native:
                  native1:
                    order: 0
                    enabled: true

                saml:
                  pep_ite_saml:
                    order: 2
                    attributes:
                      principal: nameid
                      groups: Groups
                    nameid_format: "urn:oasis:names:tc:SAML:1.1:nameid-format:unspecified"
                    idp:
                      entity_id: http://www.okta.com/exk14m8q9zq70MSi90h8
                      metadata:
                        path: "https://secure.ite.pepsico.com/app/exk14m8q9zq70MSi90h8/sso/saml/metadata"
                    sp:
                      entity_id: "https://pep-eiap-kibana-01.infra.gw01.aks02.suk.preprod.azure.intra.pepsico.com/"
                      acs: "https://pep-eiap-kibana-01.infra.gw01.aks02.suk.preprod.azure.intra.pepsico.com/api/security/v1/saml"
                      logout: "https://pep-eiap-kibana-01.infra.gw01.aks02.suk.preprod.azure.intra.pepsico.com/logout"

                ldap:
                  pep_ite_ldap:
                    order: 1
                    enabled: true
                    metadata:
                      - uid
                      - cn
                    authentication:
                      # whether to use for authn too
                      enabled: true
                    # cache
                    cache:
                      ttl: 15m
                      max_users: 100000
                    # ssl
                    ssl:
                      certificate_authorities:
                        - /usr/share/elasticsearch/config/pep/etc/certs/PepsiCoCA01.pem
                        - /usr/share/elasticsearch/config/pep/etc/certs/PepsiCoRootCA.pem
                      verification_mode: certificate
                    url:
                      - "${LDAP_URL_0}"
                    #: --
                    #: IMPORTANT
                    #: - we are using serviece account
                    #: - bind_dn must be provided
                    #: - user_search
                    #: - secure_bind_password (should be in secret)
                    #: --
                    bind_dn: ${LDAP_BIND_DN}
                    user_search:
                      base_dn: "ou=internal,ou=people,o=pepsico,dc=pep,dc=pvt"
                      scope: sub_tree
                      pool:
                        size: 25
                    group_search:
                      base_dn: "ou=groups,ou=EIP_DEV,ou=applications,o=pepsico,dc=pep,dc=pvt"
                      # pep has directly underneath
                      scope: one_level
                      filter: "(&(objectclass=groupOfUniqueNames)(uniqueMember={0}))"
                    unmapped_groups_as_roles: false

      volumeClaimTemplates: &master_vol_claim_templates
        - metadata:
            name: elasticsearch-data
          spec:
            accessModes:
            - ReadWriteOnce
            resources:
              requests:
                storage: 50Gi
            storageClassName: &elastic_standard_sc elastic-stdssd-zoned

      podTemplate:

        metadata: &pod_tmpl_metadata
          labels:
            # need this for stack monitoring (allow autodiscover
            # metricbeat) [Format: es-<cluster-name>]
            stack-monitoring.elastic.co/type: es-cluster-01-preprod-suk
          annotations:
            # need this for stack monitoring
            co.elastic.logs/enabled: "true"
            traffic.sidecar.istio.io/includeInboundPorts: "*"
            traffic.sidecar.istio.io/excludeOutboundPorts: "9300"
            traffic.sidecar.istio.io/excludeInboundPorts: "9300"

        spec:

          # IMPORTANT: should be at pod level
          securityContext: &common_sec_ctxt
            runAsUser: 1000
            fsGroup: 1000

          # Common Node Selector for a ES role type
          nodeSelector:
            agentpool: npesm1z1

          # This should be different for each zone
          tolerations:
            - key: ESMaster01NodeOnlyZone1
              operator: Exists

          volumes: &master_volumes
            - name: config-projected
              projected:
                # 0775 -> 509, 0644 -> 420
                defaultMode: 420
                sources:
                # pep-ca-certs-config
                - configMap:
                    name: pep-ca-certs-config
                    optional: false
                    items:
                      - key: PepsiCoCA01.pem
                        # must be relative
                        path: etc/certs/PepsiCoCA01.pem
                      - key: PepsiCoRootCA.pem
                        # must be relative
                        path: etc/certs/PepsiCoRootCA.pem

          containers: &master_containers
            - name: elasticsearch
              imagePullPolicy: IfNotPresent

              resources:
                limits:
                  cpu: 1950m
                  memory: 18Gi
                requests:
                  cpu: 1800m
                  memory: 17Gi

              env: &master_env_all

                - name: ES_JAVA_OPTS
                  value: -Xms16g -Xmx16g

                - name: LDAP_URL_0
                  valueFrom:
                    configMapKeyRef:
                      name: pep-eiap-xpack-settings
                      key: ldap_url_0

                - name: LDAP_BIND_DN
                  valueFrom:
                    configMapKeyRef:
                      name: pep-eiap-xpack-settings
                      key: ldap_bind_dn

              volumeMounts: &common_vol_mounts
                - name: config-projected
                  # IMPORTANT:
                  # - ES runs as Java Security Context enabled, path must
                  # be /usr/share/elasticsearch/config/pep and make sure to
                  # create a sub-dir
                  # - make sure the init container also runs as elasticsearch
                  #   context
                  mountPath: /usr/share/elasticsearch/config/pep
                  readOnly: true

          initContainers: &master_init_containers
            - name: elastic-internal-init-filesystem
              env: *master_env_all
              volumeMounts: *common_vol_mounts

            - name: elastic-internal-init-keystore
              env: *master_env_all
              volumeMounts: *common_vol_mounts
            # - command:
            #   - sh
            #   - -c
            #   - sysctl -w vm.max_map_count=262144
            #   name: set-max-map-count
            #   securityContext:
            #     privileged: true



