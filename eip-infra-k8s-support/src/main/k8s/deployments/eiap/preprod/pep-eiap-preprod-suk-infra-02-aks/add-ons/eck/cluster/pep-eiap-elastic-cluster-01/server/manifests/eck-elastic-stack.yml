  name: &cname cluster-01-preprod-suk
  namespace: pep-eiap-elastic-cluster-01
spec:
  version: !!str 7.17.5
  image: &img_init001 docker.elastic.co/elasticsearch/elasticsearch:7.17.5

  # ##
  # IMPORTANT:
  # - secureSettings is a mechanism to inject keys into elasticsearch.keystore
  # - Please check if the settings supports secure otherwise you will crash and
  #   burn :)
  # secrets to be exported to elasticsearch.keystore
  secureSettings:
    - secretName: pep-eiap-preprod-suk-infra-02-aks-xpack-generic
      entries:
        - key: xpack.security.authc.realms.ldap.pep_ite_ldap.secure_bind_password

  # HTTP Layer
  http:
    tls:
      certificate:
        # make sure this is installed in the namespace
        secretName: &gw01_secret pep-eiap-preprod-suk-infra-02-aks-gw01-generic
    service:
      spec:
        selector:
          elasticsearch.k8s.elastic.co/cluster-name: *cname
