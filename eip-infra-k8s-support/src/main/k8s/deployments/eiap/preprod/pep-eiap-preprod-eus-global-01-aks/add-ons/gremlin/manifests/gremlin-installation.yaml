# Source: gremlin/templates/apparmor-loader.yaml
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: apparmor-loader
  # Namespace must match that of the ConfigMap.
  namespace: pep-eiap-gremlin
  labels:
    daemon: apparmor-loader
    helm.sh/chart: gremlin-0.4.8
    app.kubernetes.io/instance: pep-eiap-gremlin
    app.kubernetes.io/managed-by: Helm
    version: v1
spec:
  selector:
    matchLabels:
      daemon: apparmor-loader
  template:
    metadata:
      name: apparmor-loader
      labels:
        daemon: apparmor-loader
        helm.sh/chart: gremlin-0.4.8
        app.kubernetes.io/instance: pep-eiap-gremlin
        app.kubernetes.io/managed-by: Helm
        version: v1
    spec:
      initContainers:
      - command:
        - sh
        - -c
        - apparmor_parser -R /profiles/agent_apparmor.profile || true
        image: google/apparmor-loader:latest
        imagePullPolicy: IfNotPresent
        name: clean-old-profiles
        resources: {}
        securityContext:
          privileged: true
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /sys
          name: sys
          readOnly: true
        - mountPath: /etc/apparmor.d
          name: apparmor-includes
          readOnly: true
        - mountPath: /profiles
          name: profiles
          readOnly: true
      containers:
      - name: apparmor-loader
        image: google/apparmor-loader:latest
        args:
          # Tell the loader to pull the /profiles directory every 30 seconds.
          - -poll
          - 30s
          - /profiles
        securityContext:
          # The loader requires root permissions to actually load the profiles.
          privileged: true
        volumeMounts:
        - name: sys
          mountPath: /sys
          readOnly: true
        - name: apparmor-includes
          mountPath: /etc/apparmor.d
          readOnly: true
        - name: profiles
          mountPath: /profiles
          readOnly: true
      volumes:
      # The /sys directory must be mounted to interact with the AppArmor module.
      - name: sys
        hostPath:
          path: /sys
      # The /etc/apparmor.d directory is required for most apparmor include templates.
      - name: apparmor-includes
        hostPath:
          path: /etc/apparmor.d
      # Map in the profile data.
      - name: profiles
        configMap:
          name: pep-eiap-gremlin-apparmor-profile-content
---
# Source: gremlin/templates/daemonset.yaml
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: pep-eiap-gremlin
  namespace: pep-eiap-gremlin
  labels:
    app.kubernetes.io/name: gremlin
    helm.sh/chart: gremlin-0.4.8
    app.kubernetes.io/instance: pep-eiap-gremlin
    app.kubernetes.io/managed-by: Helm
    version: v1
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: gremlin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gremlin
        helm.sh/chart: gremlin-0.4.8
        app.kubernetes.io/instance: pep-eiap-gremlin
        app.kubernetes.io/managed-by: Helm
        version: v1
      annotations:
        container.apparmor.security.beta.kubernetes.io/gremlin: localhost/gremlin-agent
    spec:
      serviceAccountName: gremlin
      hostPID: true
      hostNetwork: false
      containers:
      - name: gremlin
        image: gremlin/gremlin:latest
        args: [ "daemon" ]
        imagePullPolicy: Always
        securityContext:
          capabilities:
            add: 
              - KILL
              - NET_ADMIN
              - SYS_BOOT
              - SYS_TIME
              - SYS_ADMIN
              - SYS_PTRACE
              - SETFCAP
              - AUDIT_WRITE
              - MKNOD
              - SYS_CHROOT
              - NET_RAW
        env:
          - name: GREMLIN_TEAM_ID
            valueFrom:
              secretKeyRef:
                name:  gremlin-secret
                key: GREMLIN_TEAM_ID
          - name: GREMLIN_TEAM_SECRET
            valueFrom:
              secretKeyRef:
                name: gremlin-secret
                key: GREMLIN_TEAM_SECRET
          - name: GREMLIN_IDENTIFIER
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          - name: GREMLIN_CLIENT_TAGS
            value: 
          - name: GREMLIN_DOCKER_IMAGE
            value: gremlin/gremlin:latest
          - name: GREMLIN_SERVICE_URL
            value: https://api.gremlin.com/v1
        volumeMounts:
          - name: gremlin-state
            mountPath: /var/lib/gremlin
            readOnly: false
          - name: gremlin-logs
            mountPath: /var/log/gremlin
            readOnly: false
          - name: cgroup-root
            mountPath: /sys/fs/cgroup
            readOnly: true
          - name: shutdown-trigger
            mountPath: /sysrq
          
          - name: containerd-sock
            mountPath: /run/containerd/containerd.sock
            readOnly: true
          - name: containerd-runc
            mountPath: /run/containerd/runc/k8s.io
            readOnly: false
      volumes:
        - name: cgroup-root
          hostPath:
            path: /sys/fs/cgroup
        
        - name: containerd-sock
          hostPath:
            path: /run/containerd/containerd.sock
        - name: containerd-runc
          hostPath:
            path: /run/containerd/runc/k8s.io
        # The Gremlin daemon communicates with Gremlin sidecars via its state directory.
        # This should be shared with the Kubernetes host
        - name: gremlin-state
          hostPath:
            path: /var/lib/gremlin
        # The Gremlin daemon forwards logs from the Gremlin sidecars to the Gremlin control plane
        # These logs should be shared with the host
        - name: gremlin-logs
          hostPath:
            path: /var/log/gremlin
        - name: shutdown-trigger
          hostPath:
            path: /proc/sysrq-trigger
