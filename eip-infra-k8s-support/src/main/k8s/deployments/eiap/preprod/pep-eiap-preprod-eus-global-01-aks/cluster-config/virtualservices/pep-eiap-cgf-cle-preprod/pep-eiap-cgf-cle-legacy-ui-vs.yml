apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-eiap-cgf-cle-legacy-ui
  name: pep-eiap-cgf-cle-legacy-ui-vs
  namespace: pep-eiap-cgf-cle-preprod
spec:
  gateways:
  - pep-eiap-cgf-cle-preprod/pep-eiap-cgf-cle-preprod-cv-gw
  hosts:
  - pep-eiap-cgf-cle-legacy-ui.global.gw01.aks01.eus.preprod.azure.intra.pepsico.com
  - cle.ite.mypepsico.com
  - cle-eus.ite.mypepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-eiap-cgf-cle-legacy-ui.pep-eiap-cgf-cle-preprod.svc.cluster.local
        port:
          number: 80
  tls:
  - match:
    - port: 443
      sniHosts:
      - pep-eiap-cgf-cle-legacy-ui.global.gw01.aks01.eus.preprod.azure.intra.pepsico.com
      - cle.ite.mypepsico.com
      - cle-eus.ite.mypepsico.com
    route:
    - destination:
        host: pep-eiap-cgf-cle-legacy-ui.pep-eiap-cgf-cle-preprod.svc.cluster.local
        port:
          number: 443
