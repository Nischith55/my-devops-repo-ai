apiVersion: v1
kind: ServiceAccount
metadata:
  name: kured
  namespace: pep-eiap-ops-admin
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kured
  namespace: pep-eiap-ops-admin
rules:
- apiGroups:
  - apps
  resourceNames:
  - kured
  resources:
  - daemonsets
  verbs:
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kured
rules:
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - get
  - patch
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - list
  - delete
  - get
- apiGroups:
  - apps
  resources:
  - daemonsets
  verbs:
  - get
- apiGroups:
  - ""
  resources:
  - pods/eviction
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kured
  namespace: pep-eiap-ops-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kured
subjects:
- kind: ServiceAccount
  name: kured
  namespace: pep-eiap-ops-admin
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kured
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kured
subjects:
- kind: ServiceAccount
  name: kured
  namespace: pep-eiap-ops-admin
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kured
  namespace: pep-eiap-ops-admin
spec:
  selector:
    matchLabels:
      name: kured
  template:
    metadata:
      labels:
        name: kured
    spec:
      containers:
      - command:
        - /usr/bin/kured
        - --drain-grace-period=-1
        - --ds-name=kured
        - --ds-namespace=pep-eiap-ops-admin
        - --start-time=0:00
        - --end-time=23:59:59
        - --time-zone=UTC
        - --lock-ttl=30m
        - --period=1h
        - --reboot-sentinel=/var/run/reboot-required
        - --reboot-days=sat
        env:
        - name: KURED_NODE_ID
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        image: docker.io/weaveworks/kured:1.7.0
        imagePullPolicy: IfNotPresent
        name: kured
        securityContext:
          privileged: true
      hostPID: true
      nodeSelector:
        beta.kubernetes.io/os: linux
      restartPolicy: Always
      serviceAccountName: kured
      tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/master
      - operator: Exists
  updateStrategy:
    type: RollingUpdate
