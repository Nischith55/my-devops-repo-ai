  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-eip-latam-track-and-trace-service.global.gw01.aks01.eus.preprod.azure.intra.pepsico.com
