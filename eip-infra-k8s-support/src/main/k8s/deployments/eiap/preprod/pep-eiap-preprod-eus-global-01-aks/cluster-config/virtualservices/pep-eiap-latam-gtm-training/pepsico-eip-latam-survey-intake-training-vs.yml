apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pepsico-eip-latam-survey-intake
  name: pepsico-eip-latam-survey-intake-training-vs
  namespace: pep-eiap-latam-gtm-training
spec:
  gateways:
  - pep-eiap-latam-gtm-training/pep-eiap-latam-gtm-training-cv-gw
  hosts:
  - svyintr.global.gw01.aks01.eus.preprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /api/v1/survey/questions
    - ignoreUriCase: true
      uri:
        prefix: /api/v1/survey/answers
    route:
    - destination:
        host: pepsico-eip-latam-survey-intake.pep-eiap-latam-gtm-training.svc.cluster.local
