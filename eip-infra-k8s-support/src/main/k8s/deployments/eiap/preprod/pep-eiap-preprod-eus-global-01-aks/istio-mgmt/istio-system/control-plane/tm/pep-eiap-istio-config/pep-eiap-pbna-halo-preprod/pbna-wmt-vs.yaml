apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pbna-wmt-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pbna-wmt.global.gw01.aks01.eus.preprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pbna-wmt.pep-eiap-pbna-halo-preprod.svc.cluster.local
        port:
          number: 80