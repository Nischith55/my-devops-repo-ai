apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pepsico-eip-latam-vanload-ingest
  name: pepsico-eip-latam-vanload-ingest-vs
  namespace: pep-eiap-latam-gtm-preprod
spec:
  gateways:
  - pep-eiap-latam-gtm-preprod/pep-eiap-latam-gtm-preprod-cv-gw
  hosts:
  - vldingst.global.gw01.aks01.eus.preprod.azure.intra.pepsico.com
  http:
  - headers:
      request:
        add:
          Content-Type: Text/Plain
        remove:
        - Content-Type
    match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pepsico-eip-latam-vanload-ingest.pep-eiap-latam-gtm-preprod.svc.cluster.local
