apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: control-message-services
  name: pep-eiap-pfna-control-message-services-vs
  namespace: pep-eiap-pfna-vct-preprod
spec:
  gateways:
  - pep-eiap-pfna-vct-preprod/pep-eiap-pfna-vct-preprod-cv-gw
  hosts:
  - control-message-services.global.gw01.aks01.eus.preprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: control-message-services.pep-eiap-pfna-vct-preprod.svc.cluster.local
        port:
          number: 80
