---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-eip-shipment-intake-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-eip-shipment-intake.global.gw01.aks01.eus.preprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-eip-shipment-intake.pep-eiap-global-eip-preprod.svc.cluster.local
        port:
          number: 80
