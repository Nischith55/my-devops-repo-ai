apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: vctservices
  name: pep-eiap-pfna-vctservices-vs
  namespace: pep-eiap-pfna-vct-preprod
spec:
  gateways:
  - pep-eiap-pfna-vct-preprod/pep-eiap-pfna-vct-preprod-cv-gw
  hosts:
  - pep-eiap-pfna-vct-preprod-vctservices.global.gw01.aks01.eus.preprod.azure.intra.pepsico.com
  - controltower.preprod.mypepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: vctservices.pep-eiap-pfna-vct-preprod.svc.cluster.local
        port:
          number: 80
