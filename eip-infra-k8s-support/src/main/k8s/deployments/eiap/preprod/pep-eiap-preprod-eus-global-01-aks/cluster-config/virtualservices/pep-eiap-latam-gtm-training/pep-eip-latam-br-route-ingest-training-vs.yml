apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pepsico-eip-latam-br-route-ingest
  name: pep-eip-latam-br-route-ingest-training-vs
  namespace: pep-eiap-latam-gtm-training
spec:
  gateways:
  - pep-eiap-latam-gtm-training/pep-eiap-latam-gtm-training-cv-gw
  hosts:
  - pepsico-eip-latam-br-route-ingest-training.global.gw01.aks01.eus.preprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pepsico-eip-latam-br-route-ingest.pep-eiap-latam-gtm-training.svc.cluster.local
        port:
          number: 80
