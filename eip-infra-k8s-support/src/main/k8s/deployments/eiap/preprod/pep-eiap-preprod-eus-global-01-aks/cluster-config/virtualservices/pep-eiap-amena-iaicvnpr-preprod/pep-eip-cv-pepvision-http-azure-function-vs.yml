apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-eip-cv-pepvision-http-azure-function
  name: pep-eip-cv-pepvision-http-azure-function-vs
  namespace: pep-eiap-amena-iaicvnpr-preprod
spec:
  gateways:
  - pep-eiap-amena-iaicvnpr-preprod/pep-eiap-amena-iaicvnpr-preprod-cv-gw
  hosts:
  - pep-eip-cv-pepvision-http-azure-function.global.gw01.aks01.eus.preprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-eip-cv-pepvision-http-azure-function.pep-eiap-amena-iaicvnpr-preprod.svc.cluster.local
        port:
          number: 80
