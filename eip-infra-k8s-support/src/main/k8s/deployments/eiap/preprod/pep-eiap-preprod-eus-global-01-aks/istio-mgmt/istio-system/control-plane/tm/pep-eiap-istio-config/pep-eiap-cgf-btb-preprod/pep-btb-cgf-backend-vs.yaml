---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-btb-cgf-backend-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-btb-cgf-backend.global.gw01.aks01.eus.preprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /api/v1/accessmanagement
    route:
    - destination:
        host: pep-eiap-cgf-btb-app-accessmanagement.pep-eiap-cgf-btb-preprod.svc.cluster.local
        port:
          number: 80
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /api/v1/alerts
    route:
    - destination:
        host: pep-eiap-cgf-btb-app-alerts.pep-eiap-cgf-btb-preprod.svc.cluster.local
        port:
          number: 80
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /api/v1/filter
    route:
    - destination:
        host: pep-eiap-cgf-btb-app-filter.pep-eiap-cgf-btb-preprod.svc.cluster.local
        port:
          number: 80
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-eiap-cgf-btb-app-equipment.pep-eiap-cgf-btb-preprod.svc.cluster.local
        port:
          number: 80
