---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: geniusone-connectorservice-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - geniusone-connectorservice.global.gw01.aks01.eus.preprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: geniusone-connectorservice.pep-eiap-global-eip-preprod.svc.cluster.local
        port:
          number: 80
