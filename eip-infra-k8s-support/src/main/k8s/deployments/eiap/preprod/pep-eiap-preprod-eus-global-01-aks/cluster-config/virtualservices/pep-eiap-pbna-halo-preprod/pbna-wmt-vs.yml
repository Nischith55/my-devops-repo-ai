apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pbna-wmt
  name: pbna-wmt-vs
  namespace: pep-eiap-pbna-halo-preprod
spec:
  gateways:
  - pep-eiap-pbna-halo-preprod/pep-eiap-pbna-halo-preprod-cv-gw
  hosts:
  - pbna-wmt.global.gw01.aks01.eus.preprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pbna-wmt.pep-eiap-pbna-halo-preprod.svc.cluster.local
        port:
          number: 80
