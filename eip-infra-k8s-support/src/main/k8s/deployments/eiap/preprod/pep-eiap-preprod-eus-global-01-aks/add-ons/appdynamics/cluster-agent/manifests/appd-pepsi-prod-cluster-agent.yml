---
apiVersion: appdynamics.com/v1alpha1
kind: Clusteragent
metadata:
  name: appd-pepsi-prod-cluster-agent
  namespace: appdynamics
spec:
  accessSecret: pepsi-prod-cluster-agent-secret
  account: pepsi-prod
  appName: pep-eiap-prod-eus-global-01-aks
  defaultAppName: test-appd-prod-from-preprod
  appNameLabel: app
#  appNameLabel: app
#  appNameStrategy: label
#  appNameStrategy: manual
  controllerUrl: https://pepsi-prod.saas.appdynamics.com:443
#  image: pepeiapprodcommonacr.azurecr.io/pep/eiap/infra/vendor/appdynamics/cluster-agent:ubuntu-18.04-20.10.0.1820-unofficial
#  image: docker.io/appdynamics/cluster-agent:21.7.0
  image: pepeiapprodcommonacr.azurecr.io/pep/eiap/infra/vendor/appdynamics/cluster-agent:ubuntu-18.04-21.7.0.1013-unofficial
  imageInfo:
    java:
      agentMountPath: /opt/appdynamics
      image: docker.io/appdynamics/java-agent:latest
      imagePullPolicy: IfNotPresent
  instrumentationMethod: ENV
  logFileBackups: 3
  logFileSizeMb: 5
  logLevel: INFO
  maxPodLogsTailLinesCount: 500
  nodeSelector:
    beta.kubernetes.io/os: linux
    kubernetes.azure.com/mode: system
#  nsToInstrumentRegex: pep-eiap-ops-admin|pep-eiap-pbna-halo-preprod
  nsToInstrumentRegex: pep-eiap-pbna-halo-preprod
  nsToMonitor:
#  - pep-eiap-ops-admin
  - pep-eiap-pbna-halo-preprod
  numberOfTaskWorkers: 2
  resourcesToInstrument:
  - Deployment
  - StatefulSet
  serviceAccountName: appdynamics-cluster-agent
  stdoutLogging: "true"
  tolerations:
  - key: CriticalAddonsOnly
    operator: Exists
  instrumentationRules:
  - namespaceRegex: pep-eiap-pbna-halo-preprod
    language: java
#    matchString: ^pepsico-eip-latam-inventory-dispatch$
    matchString: ^pep-eip-pbna*
#    runAsUser: 1000
    customAgentConfig: "-Dappdynamics.agent.log4j2.disabled=true -Dorg.osgi.framework.bootdelegation=com.singularity.*"
    imageInfo:
      image: docker.io/appdynamics/java-agent:latest
      agentMountPath: /opt/appdynamics
      imagePullPolicy: IfNotPresent
