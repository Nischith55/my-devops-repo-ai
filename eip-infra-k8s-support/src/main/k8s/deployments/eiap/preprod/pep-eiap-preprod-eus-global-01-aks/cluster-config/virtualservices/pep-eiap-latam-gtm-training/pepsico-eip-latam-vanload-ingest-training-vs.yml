apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pepsico-eip-latam-vanload-ingest
  name: pepsico-eip-latam-vanload-ingest-training-vs
  namespace: pep-eiap-latam-gtm-training
spec:
  gateways:
  - pep-eiap-latam-gtm-training/pep-eiap-latam-gtm-training-cv-gw
  hosts:
  - pepsico-eip-latam-vanload-ingest-training.global.gw01.aks01.eus.preprod.azure.intra.pepsico.com
  http:
  - headers:
      request:
        add:
          Content-Type: Text/Plain
        remove:
        - Content-Type
    match:
    - ignoreUriCase: true
      uri:
        prefix: /api/v1/vanload
    route:
    - destination:
        host: pepsico-eip-latam-vanload-ingest.pep-eiap-latam-gtm-training.svc.cluster.local
        port:
          number: 80
