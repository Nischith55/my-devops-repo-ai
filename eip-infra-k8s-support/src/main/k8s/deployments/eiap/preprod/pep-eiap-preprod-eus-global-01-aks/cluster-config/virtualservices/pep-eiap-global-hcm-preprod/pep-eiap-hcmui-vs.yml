apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: hcmui
  name: pep-eiap-hcmui-vs
  namespace: pep-eiap-global-hcm-preprod
spec:
  gateways:
  - pep-eiap-global-hcm-preprod/pep-eiap-global-hcm-preprod-cv-gw
  hosts:
  - hcmui.global.gw01.aks01.eus.preprod.azure.intra.pepsico.com
  - hcm.preprod.mypepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: hcmui.pep-eiap-global-hcm-preprod.svc.cluster.local
        port:
          number: 80
