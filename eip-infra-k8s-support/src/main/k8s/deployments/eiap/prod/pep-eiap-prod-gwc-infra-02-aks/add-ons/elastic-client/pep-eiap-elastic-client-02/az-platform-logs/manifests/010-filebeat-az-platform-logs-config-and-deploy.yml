---
apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat-az-platform-logs-config
  namespace: pep-eiap-elastic-client-02
data:

  # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  # Used as ENV variables in deployment
  # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  ## NOTE: this will be passed as environment variables too as we need it
  ## elsewhere
  ELASTICSEARCH_HOST: https://pep-eiap-ingest-01.infra.gw01.aks02.gwc.prod.azure.intra.pepsico.com
  ELASTICSEARCH_PORT: "443"
  # EventHub details
  EVENTHUB: pep-eiap-prod-gwc-global-infra-aks-diag-01-evh
  EVENTHUB_CONSUMER_GROUP: azure-diag-01-evh-01-cgrp
  EVENTHUB_STORAGE_ACCOUNT: pe3005monitoring01sa
  EVENTHUB_STORAGE_ACCOUNT_CONTAINER: filebeat-elastic-01-blob

  # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  # Centralized output config and logging
  # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  beat-output-config.yml: |-

    # ##
    # All outputs
    # ##
    output:
      elasticsearch:
        hosts:
          - ${ELASTICSEARCH_HOST}:${ELASTICSEARCH_PORT}
        index: fb-az-evh-diag-gwc-%{[agent.version]}-%{+yyyy.MM.dd}
        username: ${ELASTICSEARCH_USERNAME}
        password: ${ELASTICSEARCH_PASSWORD}
        ssl:
          enabled: true
          # The following 2 must be mounted at paths shown below from
          # pep-ca-certs-config ConfigMap
          certificate_authorities:
            - /projected/etc/certs/PepsiCoCA01.pem
            - /projected/etc/certs/PepsiCoRootCA.pem
          supported_protocols:
            - TLSv1.2
            - TLSv1.3
          verification_mode: certificate

    # ##
    # Setup all index patterns
    # ##
    setup:
      ilm:
        enabled: false
      template:
        enabled: true
        # all azure platform logs via containerized beats
        name: filebeat-aks-evh-azure-platform-logs
        overwrite: false
        pattern: fb-az-evh-diag-*
        settings:
          index:
            codec: best_compression
            number_of_replicas: ${INDEX_REPLICAS:1}
            # NOTE: From 7.x this should be set automatically by elastic
            # number_of_routing_shards: 64
            # MUST be a multiple of number_of_routing_shards
            number_of_shards: ${INDEX_SHARDS:1}

    # ##
    # Logging
    # ##

    logging:
      level: INFO
      metrics:
        enabled: true

  # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  # beats configs
  # - Embedded Yaml Tips: ABSOLUTELY NO SPACES before the new line!!!
  # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  filebeat.yml: |
    # #####################################################################
    # Setup filebeat configuration
    # #####################################################################
    filebeat:

      inputs:
        - type: azure-eventhub
          eventhub: ${EVENTHUB}
          consumer_group: ${EVENTHUB_CONSUMER_GROUP}
          connection_string: ${EVENTHUB_CONNECT_STR}
          storage_account: ${EVENTHUB_STORAGE_ACCOUNT}
          storage_account_key: ${EVENTHUB_STORAGE_ACCOUNT_KEY}
          storage_account_container: ${EVENTHUB_STORAGE_ACCOUNT_CONTAINER}

    # ##
    # Common Processors across all this deployment
    # ##

    processors:

    # --
    # Add EIAP fields
    # --
    - decode_json_fields:
        fields:
        - message
        process_array: false
        max_depth: 2
        target: ""
        add_error_key: true

# ##
# Non-ECK deployment.
# IMPORTANT:
# - This is for slurping Azure Platform Logs from EVH
# ##
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fb-evh-az-platform-logs
  namespace: pep-eiap-elastic-client-02
  labels:
    k8s-app: &app_name fb-evh-az-platform-logs
spec:

  replicas: 1
  
  selector:
    matchLabels:
      k8s-app: *app_name

  template:

    metadata:
      labels:
        k8s-app: *app_name
        app: *app_name
        version: 7.16.1

    spec:
      # PEP: 
      # - Deployment run only on system node pool taints
      # - also lock down the node selector
      nodeSelector:
        beta.kubernetes.io/os: linux
        kubernetes.azure.com/mode: system
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
      # DONT need it serviceAccountName: filebeat
      dnsPolicy: ClusterFirstWithHostNet
      # TODO: reach out to Elastic Support, we should be run this as
      # hostNetwork: false and hence nonroot
      hostNetwork: true 
      securityContext:
        runAsUser: 0
      terminationGracePeriodSeconds: 30
      # All volumes
      volumes:

      - name: config
        configMap:
          defaultMode: 0600
          name: &fb_plat_config filebeat-az-platform-logs-config

      # PEP: all in one configMap (using projections)
      - name: config-projected
        projected:   
          # 0644 -> 420, 0600 -> 384
          defaultMode: 384
          sources:
          # beats-entrypoint-config
          - configMap:
              name: beats-entrypoint-config
              optional: false
              items:
                - key: entrypoint.sh
                  # must be relative
                  path: bin/entrypoint.sh
                  # 0755 -> 493
                  mode: 493

          # beats-common-config
          - configMap:
              name: *fb_plat_config
              optional: false
              items:
                - key: beat-output-config.yml
                  # must be relative
                  path: etc/beat-output-config.yml

          # filebeat-az-platform-logs-config
          - configMap:
              name: *fb_plat_config
              optional: false
              items:
                - key: filebeat.yml
                  # must be relative
                  path: etc/beat.yml

          # pep-ca-certs-config
          - configMap:
              name: pep-ca-certs-config
              optional: false
              items:
                - key: PepsiCoCA01.pem
                  # must be relative
                  path: etc/certs/PepsiCoCA01.pem
                - key: PepsiCoRootCA.pem
                  # must be relative
                  path: etc/certs/PepsiCoRootCA.pem


      # ##
      # All Containers
      # ##
      containers:
      - name: filebeat
        image: docker.elastic.co/beats/filebeat:7.16.1
        command:
          - /projected/bin/entrypoint.sh
        args:
        - filebeat
        - -e
        - -c 
        - /projected/etc/beat-output-config.yml 
        - -c 
        - /projected/etc/beat.yml 
        env:

        # All secrets from elastic-client-shared
        - name: ELASTICSEARCH_USERNAME
          valueFrom: 
            secretKeyRef:
              name: &shared_sec elastic-client-shared
              key: ELASTICSEARCH_USERNAME

        - name: ELASTICSEARCH_PASSWORD
          valueFrom: 
            secretKeyRef:
              name: *shared_sec
              key: ELASTICSEARCH_PASSWORD

        - name: EVENTHUB_CONNECT_STR
          valueFrom: 
            secretKeyRef:
              name: *shared_sec
              key: EVH_PLATFORM_LOGS_CONNECT_STR

        - name: EVENTHUB_STORAGE_ACCOUNT_KEY
          valueFrom: 
            secretKeyRef:
              name: *shared_sec
              key: EVH_PLATFORM_LOGS_SA_KEY

        # PEP: change without - [NOTE: must have -k8s in it]
        - name: INDEX_PREFIX
          value: fb

        # We will re-use EVENTHUB name can be K8S_CLUSTER_NAME 
        - name: INDEX_SUFFIX
          valueFrom: &eventhub_name
            configMapKeyRef:
              name: *fb_plat_config
              key: EVENTHUB

        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName

        - name: ELASTICSEARCH_HOST
          valueFrom:
            configMapKeyRef:
              name: *fb_plat_config
              key: ELASTICSEARCH_HOST

        - name: ELASTICSEARCH_PORT
          valueFrom:
            configMapKeyRef:
              name: *fb_plat_config
              key: ELASTICSEARCH_PORT

        - name: EVENTHUB
          valueFrom: *eventhub_name

        - name: EVENTHUB_CONSUMER_GROUP
          valueFrom:
            configMapKeyRef:
              name: *fb_plat_config
              key: EVENTHUB_CONSUMER_GROUP

        - name: EVENTHUB_STORAGE_ACCOUNT
          valueFrom:
            configMapKeyRef:
              name: *fb_plat_config
              key: EVENTHUB_STORAGE_ACCOUNT

        - name: EVENTHUB_STORAGE_ACCOUNT_CONTAINER
          valueFrom:
            configMapKeyRef:
              name: *fb_plat_config
              key: EVENTHUB_STORAGE_ACCOUNT_CONTAINER

        resources:
          limits:
            memory: 12000Mi
          requests:
            cpu: 800m
            memory: 12000Mi

        volumeMounts:
        # PEP: 
        - name: config-projected
          # where it is mounted
          mountPath: /projected
          readOnly: true
