  # updateStrategy:
  #   changeBudget:
  #     maxSurge: 3
  #     maxUnavailable: 1
  # # This ensure if cluster is deleted the PV are still around.. (ECK 1.5>)
  # volumeClaimDeletePolicy: DeleteOnScaledownOnly

  # ##
  # IMPORTANT:
  # - secureSettings is a mechanism to inject keys into elasticsearch.keystore
  # - Please check if the settings supports secure otherwise you will crash and
  #   burn :)
  # secrets to be exported to elasticsearch.keystore
  secureSettings:
    - secretName: pep-eiap-prod-gwc-infra-02-aks-xpack-generic
      entries:
        - key: xpack.security.authc.realms.ldap.pep_prod_ldap.secure_bind_password

  # HTTP Layer
  http:
    tls:
      certificate:
        # make sure this is installed in the namespace
        secretName: &gw01_secret pep-eiap-prod-gwc-infra-02-aks-gw01-generic
    service:
      spec:
        selector:
          elasticsearch.k8s.elastic.co/cluster-name: *cname
          elasticsearch.k8s.elastic.co/node-master: "false"
          elasticsearch.k8s.elastic.co/node-data: "false"

