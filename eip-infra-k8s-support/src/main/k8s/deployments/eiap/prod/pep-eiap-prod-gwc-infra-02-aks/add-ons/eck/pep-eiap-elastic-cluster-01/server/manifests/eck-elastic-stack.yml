    # Data Nodeset (zoned) - New
    # :::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::
    - name: data01-z1
      count: 1
      config: &data_config
        node:
          roles:
            - data

        xpack: *common_xpack

      volumeClaimTemplates: &data_node_vol_claim_templates
        - metadata:
            name: elasticsearch-data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 500Gi
            storageClassName: *es_stdssd

      podTemplate:

        metadata: *pod_tmpl_metadata

        spec:
          # IMPORTANT: should be at pod level
          securityContext: *common_sec_ctxt
          # Common Node Selector for a ES role type
          nodeSelector:
            agentpool: npesd1z1
          # This should be different for each zone
          tolerations:
            - key: ESData01NodeOnlyZone1
              operator: Exists

          volumes: *master_volumes

          # IMPORTANT: since JAVA_OPTS is shared make sure we have the nodes
          # that can handle it
          initContainers: *master_init_containers

          containers: &data_containers
            - name: elasticsearch

              imagePullPolicy: IfNotPresent
              resources:
                limits:
                  cpu: 3900m
                  memory: 16Gi
                requests:
                  cpu: 3800m
                  memory: 15Gi

              env: &data_env_all

                - name: ES_JAVA_OPTS
                  value: -Xms13g -Xmx13g

                - name: LDAP_URL_0
                  valueFrom:
                    configMapKeyRef:
                      name: pep-eiap-xpack-settings
                      key: ldap_url_0

                - name: LDAP_BIND_DN
                  valueFrom:
                    configMapKeyRef:
                      name: pep-eiap-xpack-settings
                      key: ldap_bind_dn

              volumeMounts: *common_vol_mounts
