    # # ######################################################################
    # # Master Node new (zone-1)
    # # ######################################################################
    - name: master01-z1
      count: 1
      # Most of  elasticsearch.yaml
      config: &common_master_config
        node:
          roles:
            - master

        # ##
        # Shared xpack configuration -- using YAML anchors
        # ##
        xpack: &common_xpack

          # Enable Stack monitoring
          # monitoring:
          #   collection:
          #     enabled: true
          #   # disable built-in monitoring
          #   elasticsearch:
          #     collection:
          #       enabled: false

          notification:
            email:
              account:
                exchange_account:
                  profile: outlook
                  email_defaults:
                    from: ITEIAPALERTS@pepsico.com
                  smtp:
                    host: planrr.corp.pep.pvt
                    port: 25
          http:
            ssl:
              verification_mode: none

          security:

            authc:
              token:
                enabled: true

              # ##
              # All supported realms go here.
              # ##
              realms:

                # Builtin Always First
                native:
                  native1:
                    order: 0

                saml:
                  pep_prod_saml:
                    order: 2
                    attributes:
                      principal: nameid
                      groups: Groups
                    nameid_format: "urn:oasis:names:tc:SAML:1.1:nameid-format:unspecified"
                    idp:
                      entity_id: http://www.okta.com/exk1kkxcxou7VvEiE0h8
                      metadata:
                        path: "https://secure.pepsico.com/app/exk1kkxcxou7VvEiE0h8/sso/saml/metadata"

                    sp:
                      entity_id: "https://pep-eiap-kibana-01.infra.gw01.aks02.gwc.prod.azure.intra.pepsico.com/"
                      acs: "https://pep-eiap-kibana-01.infra.gw01.aks02.gwc.prod.azure.intra.pepsico.com/api/security/v1/saml"
                      logout: "https://pep-eiap-kibana-01.infra.gw01.aks02.gwc.prod.azure.intra.pepsico.com/logout"

                ldap:
                  pep_prod_ldap:
                    order: 1
                    enabled: true
                    metadata:
                      - uid
                      - cn
                    authentication:
                      # whether to use for authn too
                      enabled: true
                    # cache
                    cache:
                      ttl: 15m
                      max_users: 100000
                    # ssl
                    ssl:
                      certificate_authorities:
                        - /usr/share/elasticsearch/config/pep/etc/certs/PepsiCoCA01.pem
                        - /usr/share/elasticsearch/config/pep/etc/certs/PepsiCoRootCA.pem
                      verification_mode: certificate
                    url:
                      - "${LDAP_URL_0}"
                    #: --
                    #: IMPORTANT
                    #: - we are using serviece account
                    #: - bind_dn must be provided
                    #: - user_search
                    #: - secure_bind_password (should be in secret)
                    #: --
                    bind_dn: ${LDAP_BIND_DN}
                    user_search:
                      base_dn: "ou=internal,ou=people,o=pepsico,dc=pep,dc=pvt"
                      scope: sub_tree
                      pool:
                        size: 25
                    group_search:
                      base_dn: "ou=groups,ou=EIP_PROD,ou=applications,o=pepsico,dc=pep,dc=pvt"
                      # pep has directly underneath
                      scope: one_level
                      filter: "(&(objectclass=groupOfUniqueNames)(uniqueMember={0}))"
                    unmapped_groups_as_roles: false

      volumeClaimTemplates: &master_vol_claim_templates
        - metadata:
            name: elasticsearch-data
          spec:
            accessModes:
            - ReadWriteOnce
            resources:
              requests:
                storage: 50Gi
            storageClassName: &es_stdssd elastic-stdssd-zoned

      podTemplate:

        metadata: &pod_tmpl_metadata
          labels:
            # need this for stack monitoring (allow autodiscover
            # metricbeat) [Format: es-<cluster-name>]
            #stack-monitoring.elastic.co/type: es-cluster-01
          annotations:
            # need this for stack monitoring
            #co.elastic.logs/enabled: "true"
            traffic.sidecar.istio.io/includeInboundPorts: "*"
            traffic.sidecar.istio.io/excludeOutboundPorts: "9300"
            traffic.sidecar.istio.io/excludeInboundPorts: "9300"

        spec:

          # IMPORTANT: should be at pod level
          securityContext: &common_sec_ctxt
            runAsUser: 1000
            fsGroup: 1000

          # Common Node Selector for a ES role type
          nodeSelector:
            agentpool: npesm1z1

          # This should be different for each zone
          tolerations:
            - key: ESMaster01NodeOnlyZone1
              operator: Exists

          volumes: &master_volumes
            - name: config-projected
              projected:
                # 0775 -> 509, 0644 -> 420
                defaultMode: 420
                sources:
                # pep-ca-certs-config
                - configMap:
                    name: pep-ca-certs-config
                    optional: false
                    items:
                      - key: PepsiCoCA01.pem
                        # must be relative
                        path: etc/certs/PepsiCoCA01.pem
                      - key: PepsiCoRootCA.pem
                        # must be relative
                        path: etc/certs/PepsiCoRootCA.pem

          containers: &master_containers
            - name: elasticsearch
              imagePullPolicy: IfNotPresent

              resources:
                limits:
                  cpu: 1500m
                  memory: 12Gi
                requests:
                  cpu: 1000m
                  memory: 10Gi

              env: &master_env_all

                - name: ES_JAVA_OPTS
                  value: -Xms8g -Xmx8g

                - name: LDAP_URL_0
                  valueFrom:
                    configMapKeyRef:
                      name: pep-eiap-xpack-settings
                      key: ldap_url_0

                - name: LDAP_BIND_DN
                  valueFrom:
                    configMapKeyRef:
                      name: pep-eiap-xpack-settings
                      key: ldap_bind_dn

              volumeMounts: &common_vol_mounts
                - name: config-projected
                  # IMPORTANT:
                  # - ES runs as Java Security Context enabled, path must
                  # be /usr/share/elasticsearch/config/pep and make sure to
                  # create a sub-dir
                  # - make sure the init container also runs as elasticsearch
                  #   context
                  mountPath: /usr/share/elasticsearch/config/pep
                  readOnly: true

          initContainers: &master_init_containers
            - name: elastic-internal-init-filesystem
              env: *master_env_all
              volumeMounts: *common_vol_mounts

            - name: elastic-internal-init-keystore
              env: *master_env_all
              volumeMounts: *common_vol_mounts
    # ~~
    # master zone-2
    # ~~
    - name: master01-z2
      count: 1

      config: *common_master_config
      volumeClaimTemplates: *master_vol_claim_templates
      podTemplate:
        metadata: *pod_tmpl_metadata
        spec:
          # IMPORTANT: should be at pod level
          securityContext: *common_sec_ctxt
          # Common Node Selector for a ES role type
          nodeSelector:
            agentpool: npesm1z2
          # This should be different for each zone
          tolerations:
            - key: ESMaster01NodeOnlyZone2
              operator: Exists
          initContainers: *master_init_containers
          volumes: *master_volumes
          containers: *master_containers

    # ~~
    # master zone-3
    # ~~
    - name: master01-z3
      count: 1

      config: *common_master_config
      volumeClaimTemplates: *master_vol_claim_templates
      podTemplate:
        metadata: *pod_tmpl_metadata
        spec:
          # IMPORTANT: should be at pod level
          securityContext: *common_sec_ctxt
          # Common Node Selector for a ES role type
          nodeSelector:
            agentpool: npesm1z3
          # This should be different for each zone
          tolerations:
            - key: ESMaster01NodeOnlyZone3
              operator: Exists
          initContainers: *master_init_containers
          volumes: *master_volumes
          containers: *master_containers
