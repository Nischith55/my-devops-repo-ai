# ##
# Non-ECK deployment.
# IMPORTANT:
# - This runs as a daemonset on each k8s node: Hence name is filebeat-node
# ##
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: monitor-01-stack-logs-filebeat-config
  namespace: pep-eiap-elastic-client-01
data:

  # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  # metricbeat environment variables change here
  # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  K8S_CLUSTER_NAME: pep-eiap-prod-scus-infra-02-aks
  # Important we are using inCluster URL (change to gw url if remote)
  # please make sure the scheme is correct
  # We are sending it to the monitoring cluster K8S cluster wide stats
  ELASTICSEARCH_OUTPUT_URL: https://monitor-01-prod-scus-es-http.pep-eiap-elastic-monitor-01.svc.cluster.local:9200
  # sending data to our monitoring cluster
  # please make sure the scheme is correct
  MONITORING_CLUSTER_URL: https://monitor-01-prod-scus-es-http.pep-eiap-elastic-monitor-01.svc.cluster.local:9200
  # Change the template name appropriately if required
  TEMPLATE_NAME: filebeat-aks-cluster
  INDEX_PATTERN_PREFIX: fb-aks

  # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  # metricbeat processor stuff
  # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  filebeat-processor.yml: |

    # ---------------------------------------------------------------------
    # Common Processors across all beats deployment
    # ---------------------------------------------------------------------

    processors:

    - add_cloud_metadata:
        # **
        # Only augment for system level data
        # **
        when:
          equals:
            event.module: system
    - add_host_metadata: {}

    # ~~
    # Logging
    # ~~
    logging:
      level: INFO
      metrics:
        enabled: true

  filebeat.yml: |-

    # --------------------
    # All outputs
    # IMPORTANT:
    # - This is for stack monitoring gather all ES, Beats etc.
    # - By default they go to monitoring-* index CANNOT configure it
    # --------------------
    output:
      elasticsearch:
        hosts:
          - ${ELASTICSEARCH_OUTPUT_URL}
        username: ${ELASTICSEARCH_USERNAME}
        password: ${ELASTICSEARCH_PASSWORD}
        # should equal to number of ingest nodes
        workers: 3
        ssl: &pep_ca_ssl
          enabled: true
          # The following 2 must be mounted at paths shown below from
          # pep-ca-certs-config ConfigMap
          certificate_authorities:
            - /projected/etc/certs/PepsiCoCA01.pem
            - /projected/etc/certs/PepsiCoRootCA.pem
          supported_protocols:
            - TLSv1.2
            - TLSv1.3
          verification_mode: certificate

    # --------------------
    # send metricbeat metrics itself to our monitoring cluster
    # --------------------
    monitoring:
      enabled: true
      elasticsearch:
        hosts:
          - ${MONITORING_CLUSTER_URL}
        # IMPORTANT we are re-using the usernae and password
        username: ${MONITORING_CLUSTER_USERNAME}
        password: ${MONITORING_CLUSTER_PASSWORD}
        ssl: *pep_ca_ssl

    # --------------------
    # Setup filebeat configuration
    # --------------------
    filebeat:

      modules:
      # we are only sending ES component logs to our dedicated monitoring
      # cluster
      - module: system
        enabled: false

      # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
      #  autodiscover via hints (pod annotations)
      # NOTE: Only stack monitoring.
      # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
      autodiscover:
        providers:
        - type: kubernetes
          scope: node
          resource: pod
          node: ${NODE_NAME}
          hints:
            enabled: true
            default_config:
              # only retrieve logs from pods annotated with
              # co.elastic.logs/enabled: true (enable should be false)
              enabled: false
              type: container
              paths:
              - /var/log/containers/*${data.kubernetes.container.id}.log

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: &app_name monitor-01-stack-logs-filebeat
  namespace: pep-eiap-elastic-client-01
  labels:
    k8s-app: *app_name
    app: *app_name
    version: &vers 7.14.0
spec:

  selector:
    matchLabels:
      app: *app_name
      version: *vers

  template:

    metadata:
      labels:
        app: *app_name
        version: *vers

    spec:

      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: balance-group
                operator: In
                values:
                - ESMaster01ZonedPools
                - ESMaster02ZonedPools
                - ESData01ZonedPools
                - ESData02ZonedPools
                - ESGeneralPurpose01ZonedPools
                - ESGeneralPurpose02ZonedPools
                - ESMonitor01Pool
      # we want to run only where elastic nodes are
      tolerations:
      - key: ESMaster01NodeOnlyZone1
        operator: Exists
      - key: ESMaster01NodeOnlyZone2
        operator: Exists
      - key: ESMaster01NodeOnlyZone3
        operator: Exists
      - key: ESData01NodeOnlyZone1
        operator: Exists
      - key: ESData01NodeOnlyZone2
        operator: Exists
      - key: ESData01NodeOnlyZone3
        operator: Exists
      - key: ESGeneralPurpose01NodeOnlyZone1
        operator: Exists
      - key: ESGeneralPurpose01NodeOnlyZone2
        operator: Exists
      - key: ESGeneralPurpose01NodeOnlyZone3
        operator: Exists
      - key: ESMaster02NodeOnlyZone1
        operator: Exists
      - key: ESMaster02NodeOnlyZone2
        operator: Exists
      - key: ESMaster02NodeOnlyZone3
        operator: Exists
      - key: ESData02NodeOnlyZone1
        operator: Exists
      - key: ESData02NodeOnlyZone2
        operator: Exists
      - key: ESData02NodeOnlyZone3
        operator: Exists
      - key: ESGeneralPurpose02NodeOnlyZone1
        operator: Exists
      - key: ESGeneralPurpose02NodeOnlyZone2
        operator: Exists
      - key: ESGeneralPurpose02NodeOnlyZone3
        operator: Exists
      - key: ESMonitor01NodeOnlyZone1
        operator: Exists
      - key: ESMonitor01NodeOnlyZone2
        operator: Exists
      - key: ESMonitor01NodeOnlyZone3
        operator: Exists

      serviceAccountName: filebeat
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 0
        # If using Red Hat OpenShift uncomment this:
        # privileged: true
      # hostNetwork: true
      # dnsPolicy: ClusterFirstWithHostNet

      # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
      # All volumes
      # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
      volumes:

      # PEP: all in one configMap (using projections)
      - name: config-projected
        projected:
          # 0644 -> 420, 0600 -> 384
          defaultMode: 384
          sources:

          # pep-ca-certs-config
          - configMap:
              name: pep-ca-certs-config
              optional: false
              items:
                - key: PepsiCoCA01.pem
                  # must be relative
                  path: etc/certs/PepsiCoCA01.pem
                - key: PepsiCoRootCA.pem
                  # must be relative
                  path: etc/certs/PepsiCoRootCA.pem

          - configMap:
              name: &beats_config monitor-01-stack-logs-filebeat-config
              optional: false
              items:
                - key: filebeat.yml
                  # must be relative
                  path: etc/beat.yml
                - key: filebeat-processor.yml
                  # must be relative
                  path: etc/beat-processor-config.yml

      - name: varlibdockercontainers
        hostPath:
          path: /var/lib/docker/containers

      - name: varlog
        hostPath:
          path: /var/log

      # data folder stores a registry of read status for all files,
      # so we don't send everything again on a Filebeat pod restart
      - name: data
        hostPath:
          path: /var/lib/pep-eiap-elastic-client-01/monitor-01-stack-logs-filebeat/filebeat-data
          type: DirectoryOrCreate

      - name: dockersock
        hostPath:
          path: /var/run/docker.sock

      # ##
      # All Containers
      # ##
      containers:
      - name: filebeat
        image: docker.elastic.co/beats/filebeat:7.14.0
        args:
        - -environment
        - container
        - -e
        - -c
        - /projected/etc/beat-processor-config.yml
        - -c
        - /projected/etc/beat.yml
        # - -d
        # - "monitoring"
        # - index-management,processors

        resources:
          # limits:
          #   cpu: 100m
          #   memory: 200Mi
          requests:
            # cpu: 200m
            memory: 512Mi

        env:

        # All environment variables from beats-shared-env-config
        - name: K8S_CLUSTER_NAME
          valueFrom:
            configMapKeyRef:
              name: *beats_config
              key: K8S_CLUSTER_NAME

        - name: TEMPLATE_NAME
          valueFrom:
            configMapKeyRef:
              name: *beats_config
              key: TEMPLATE_NAME

        - name: INDEX_PATTERN_PREFIX
          valueFrom:
            configMapKeyRef:
              name: *beats_config
              key: INDEX_PATTERN_PREFIX

        - name: ELASTICSEARCH_OUTPUT_URL
          valueFrom:
            configMapKeyRef:
              name: *beats_config
              key: ELASTICSEARCH_OUTPUT_URL

        # All secrets from elastic-client-shared
        - name: ELASTICSEARCH_USERNAME
          valueFrom:
            secretKeyRef:
              name: &shared_sec elastic-client-shared
              key: BEATS_INGEST_USER_01

        - name: ELASTICSEARCH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: *shared_sec
              key: BEATS_INGEST_PASSWORD_01

        - name: MONITORING_CLUSTER_URL
          valueFrom:
            configMapKeyRef:
              name: *beats_config
              key: MONITORING_CLUSTER_URL

        - name: MONITORING_CLUSTER_USERNAME
          valueFrom:
            secretKeyRef:
              name: *shared_sec
              # re-use
              key: BEATS_MONITOR_INGEST_USER_01

        - name: MONITORING_CLUSTER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: *shared_sec
              # re-use
              key: BEATS_MONITOR_INGEST_PASSWORD_01

        - name: MONITOR_USERNAME
          valueFrom:
            secretKeyRef:
              name: *shared_sec
              key: MONITOR_COMMON_USER_01

        - name: MONITOR_PASSWORD
          valueFrom:
            secretKeyRef:
              name: *shared_sec
              key: MONITOR_COMMON_PASSWORD_01

        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName

        - name: NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP

        volumeMounts:

        # PEP:
        - name: config-projected
          # where it is mounted
          mountPath: /projected
          readOnly: true

        - name: data
          mountPath: /usr/share/filebeat/data

        - name: varlibdockercontainers
          mountPath: /var/lib/docker/containers
          readOnly: true

        - name: varlog
          mountPath: /var/log
          readOnly: true

        - name: dockersock
          mountPath: "/var/run/docker.sock"

