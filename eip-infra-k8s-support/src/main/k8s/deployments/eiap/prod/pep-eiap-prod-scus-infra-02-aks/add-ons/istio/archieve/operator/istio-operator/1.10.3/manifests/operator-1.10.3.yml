apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/created-by: Shakirat_Haritha_2020_07_30
    app.kubernetes.io/managed-by: manual
  name: istio-operator-1-10-3
  namespace: istio-operator
spec:
  replicas: 3
  selector:
    matchLabels:
      name: istio-operator-1-10-3
  template:
    metadata:
      labels:
        name: istio-operator-1-10-3
    spec:
      containers:
      - command:
        - operator
        - server
        env:
        - name: WATCH_NAMESPACE
          value: istio-system
        - name: LEADER_ELECTION_NAMESPACE
          value: istio-operator
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: OPERATOR_NAME
          value: istio-operator
        - name: WAIT_FOR_RESOURCES_TIMEOUT
          value: 300s
        - name: REVISION
          value: 1-10-3
        image: docker.io/istio/operator:1.10.3
        imagePullPolicy: IfNotPresent
        name: istio-operator
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsGroup: 1337
          runAsNonRoot: true
          runAsUser: 1337
      nodeSelector:
        kubernetes.azure.com/mode: system
        kubernetes.io/os: linux
      serviceAccountName: istio-operator-1-10-3
      tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            name: istio-operator-1-10-3
        maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
