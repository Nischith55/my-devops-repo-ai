---
# ##
# Common cluster wide role for heartbeat
# ##
# permissions needed for heartbeat
# source: https://www.elastic.co/guide/en/beats/heartbeat/current/heartbeat-module-kubernetes.html
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pep-eiap-elastic-client-heartbeat
rules:
- apiGroups:
  - ""
  resources:
  - events
  - nodes
  - namespaces
  - pods
  # missing
  - services
  verbs:
  - get
  - list
  - watch
# for leader election (mainly for the deployment option)
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - create
  - update
  - list
  - watch
