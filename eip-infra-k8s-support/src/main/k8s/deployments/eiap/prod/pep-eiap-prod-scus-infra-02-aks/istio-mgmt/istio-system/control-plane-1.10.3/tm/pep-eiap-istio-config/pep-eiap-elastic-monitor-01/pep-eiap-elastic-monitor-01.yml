---
# IMPORTANT:
# - please create the k8s service pep-eiap-elastic-01
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-eiap-elastic-monitor-01
  namespace: pep-eiap-istio-config
spec:
  gateways:
    - istio-system/istio-in-gateway-01
  hosts:
  - pep-eiap-elastic-monitor-01.infra.gw01.aks02.scus.prod.azure.intra.pepsico.com
  # TLS routes will be applied to platform service ports named 'https-',
  # 'tls-', unterminated gateway ports using HTTPS/TLS protocols (i.e.
  # with "passthrough" TLS mode) and service entry ports using
  # HTTPS/TLS protocols.
  tls:
    - match:
      - port: 443
        sniHosts:
          - pep-eiap-elastic-monitor-01.infra.gw01.aks02.scus.prod.azure.intra.pepsico.com

      route:
        - destination:
            host: monitor-01-prod-scus-es-http.pep-eiap-elastic-monitor-01.svc.cluster.local
            port:
              number: 9200
          weight: 100
