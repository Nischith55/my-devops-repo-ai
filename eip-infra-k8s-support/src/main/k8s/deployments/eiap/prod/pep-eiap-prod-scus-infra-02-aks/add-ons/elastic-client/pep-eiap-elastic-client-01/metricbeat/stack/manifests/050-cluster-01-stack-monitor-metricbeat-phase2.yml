---
apiVersion: v1
kind: ConfigMap
metadata:
  # NOTE: change this for instance of elastic running
  name: cluster-01-prod-scus-stack-monitor-metricbeat-config
  namespace: pep-eiap-elastic-client-01

data:

  K8S_CLUSTER_NAME: pep-eiap-prod-scus-infra-02-aks
 
  metricbeat-processor.yml: |

    processors:

    # ~~
    # Add EIAP fields
    # ~~
    - add_fields:
        target: eiap
        fields:
          cluster_name: ${K8S_CLUSTER_NAME}

    - add_fields:
        fields:
          ls-destination: "SCUS"
          pep-aks-cluster: ${K8S_CLUSTER_NAME}

    - add_tags:
        tags: ["Prod-SCUS-Shared", "retain-logs"]

    - script:
        lang: javascript
        source: >
          function process(event) {
            event.Put("fields.legacy-index", "mb-aks-" + event.Get("fields.pep-aks-cluster"))
            return event;
          }
    # ~~
    # Logging
    # ~~
    logging:
      level: INFO
      metrics:
        enabled: true

  # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  # metricbeat standard k8s stuff
  # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  metricbeat.yml: |

    metricbeat:

      # ~~
      # modules
      # ~~
      modules:

      # Since this is a cluster wide scoped metricbeat disable the system
      # module which is enabled by default
      - module: system
        enabled: false

      # ~~
      # Autodiscover kubernetes
      # ~~
      autodiscover:
        providers:
        # stack monitoring (for metricbeat-node)
        - type: kubernetes
          scope: cluster
          resource: pod
          node: ${NODE_NAME}
          hints:
            enabled: true
          templates:
            - condition:
                equals:
                  # IMPORTANT: The label must be present on the ES pods
                  kubernetes.labels.stack-monitoring_elastic_co/type: metricbeat-node
              config:
                - module: beat
                  metricsets:
                  - stats
                  - state
                  xpack:
                    enabled: true
                  period: 1m
                  # undocumented seems to work for slow system
                  timeout: 90s
                  hosts:
                  - http://${data.host}:${data.port}
    output.logstash:
      # The Logstash hosts
      hosts: ["pepwap24760.corp.pep.pvt:5051", "pepwap24761.corp.pep.pvt:5051"]
      loadbalance: true
      worker: 1                  

---
apiVersion: apps/v1
kind: Deployment
metadata:
  # name format: <output-eck-cluster>-k8s
  name: &app_name cluster-01-prod-scus-stack-monitor-metricbeat
  namespace: pep-eiap-elastic-client-01
  labels:
    app.kubernetes.io/name: *app_name
    app.kubernetes.io/version: &vers 7.14.0
    app: *app_name
    # match the  ES server version (beats is not backward compatible)
    version: *vers
spec:

  # For cluster wide metricbeat we use recreate, so we don't run into locks
  strategy:
    type: Recreate

  selector:
    matchLabels:
      app.kubernetes.io/name: *app_name
      app.kubernetes.io/version: *vers

  template:

    metadata:
      labels:
        app.kubernetes.io/name: *app_name
        app.kubernetes.io/version: *vers

    spec:

      # PEP:
      # - Deployment run only on system node pool taints
      # - also lock down the node selector
      nodeSelector:
        beta.kubernetes.io/os: linux
        kubernetes.azure.com/mode: system
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists

      terminationGracePeriodSeconds: 30
      serviceAccountName: metricbeat
      # some older Beat versions are depending on this settings presence
      # in k8s context
      automountServiceAccountToken: true
      # need this to read beats.yml
      securityContext:
        runAsUser: 0

      # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
      # All volumes
      # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
      volumes:

      # PEP: all in one configMap (using projections)
      - name: config-projected
        projected:
          # 0644 -> 420, 0600 -> 384
          defaultMode: 384
          sources:

          # pep-ca-certs-config
          - configMap:
              name: pep-ca-certs-config
              optional: false
              items:
                - key: PepsiCoCA01.pem
                  # must be relative
                  path: etc/certs/PepsiCoCA01.pem
                - key: PepsiCoRootCA.pem
                  # must be relative
                  path: etc/certs/PepsiCoRootCA.pem

          - configMap:
              name: &beats_config cluster-01-prod-scus-stack-monitor-metricbeat-config
              optional: false
              items:
                - key: metricbeat.yml
                  # must be relative
                  path: etc/beat.yml
                - key: metricbeat-processor.yml
                  # must be relative
                  path: etc/beat-processor-config.yml

      containers:
      # PEP: args removed sysfs it's a deployment
      - name: metricbeat
        image: docker.elastic.co/beats/metricbeat:7.14.0
        args:
        - -environment
        - container
        - -e
        - -c
        - /projected/etc/beat-processor-config.yml
        - -c
        - /projected/etc/beat.yml
        # - -d
        # - "*"
        # - "monitoring"
        # - index-management,processors

        resources:
          # limits:
          #   cpu: 100m
          #   memory: 200Mi
          requests:
            # cpu: 200m
            memory: 512Mi
        env:

        # All environment variables from beats-shared-env-config
        - name: K8S_CLUSTER_NAME
          valueFrom:
            configMapKeyRef:
              name: *beats_config
              key: K8S_CLUSTER_NAME

        # PEP: change
        - name: KUBE_STATE_METRICS_NAMESPACE
          value: monitoring

        # PEP: change
        - name: KUBE_STATE_METRICS_PORT
          value: "8080"

        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName

        # ~~
        # volumemounts
        # ~~
        volumeMounts:
        # PEP:
        - name: config-projected
          # where it is mounted
          mountPath: /projected
          readOnly: true
