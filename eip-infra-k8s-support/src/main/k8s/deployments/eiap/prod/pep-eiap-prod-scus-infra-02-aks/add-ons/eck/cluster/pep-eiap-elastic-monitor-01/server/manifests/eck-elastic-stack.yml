---
# ECK - Monitoring Cluster
# ##
# IMPORTANT:
# - we are creating a small cluster for Stack Monitoring,
#   so no split configuration.
# - we use dedicated AZ pools (for each zone)
# - Pep CA certs now read from configMap
# ##
apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: &cname monitor-01-prod-scus
  namespace: pep-eiap-elastic-monitor-01
spec:
  version: !!str 7.17.5
  image: &img_init001 docker.elastic.co/elasticsearch/elasticsearch:7.17.5

  # ##
  # IMPORTANT:
  # - secureSettings is a mechanism to inject keys into elasticsearch.keystore
  # - Please check if the settings supports secure otherwise you will crash and
  #   burn :)
  # secrets to be exported to elasticsearch.keystore
  secureSettings:
    - secretName: pep-eiap-prod-scus-infra-02-aks-xpack-generic
      entries:
        - key: xpack.security.authc.realms.ldap.pep_prod_ldap.secure_bind_password

  # HTTP Layer
  http:
    tls:
      certificate:
        # make sure this is installed in the namespace
        secretName: &gw01_secret pep-eiap-prod-scus-infra-02-aks-gw01-generic
    # since each node has all roles we will use default for monitor clusters
    service:
      spec:
        selector:
          elasticsearch.k8s.elastic.co/cluster-name: *cname

