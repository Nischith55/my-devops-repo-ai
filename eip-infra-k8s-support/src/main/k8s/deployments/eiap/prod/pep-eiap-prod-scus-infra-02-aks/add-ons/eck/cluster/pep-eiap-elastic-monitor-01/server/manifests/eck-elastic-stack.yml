  # ##
  # new NodeSets
  # ##
  nodeSets:
    - name: common-zone01-1
      count: 1
      # Most of  elasticsearch.yaml
      config: &common_config
        node:
          # note: you can only have roles or remote_cluster_client
          roles:
            - master
            - data
            - ingest

        # No network configuration allowed

        # ##
        # Shared xpack configuration -- using YAML anchors
        # ##
        xpack:
          # Enable Stack monitoring
          monitoring:
            collection:
              enabled: true
            # enable built-in monitoring
            elasticsearch:
              collection:
                enabled: false

          notification:
            email:
              account:
                exchange_account:
                  profile: outlook
                  email_defaults:
                    from: ITEIAPALERTS@pepsico.com
                  smtp:
                    host: planrr.corp.pep.pvt
                    port: 25
          http:
            ssl:
              verification_mode: none

          security:

            authc:
              token:
                enabled: true

              realms:

                native:
                  native1:
                    order: 0
                    enabled: true

                # TODO: enable SAML
                # saml:
                #   pep_ite_saml:
                #     order: 2
                #     attributes:
                #       principal: nameid
                #       groups: Groups
                #     nameid_format: "urn:oasis:names:tc:SAML:1.1:nameid-format:unspecified"
                #     idp:
                #       entity_id: http://www.okta.com/exkwjvfh95xp6PcuV0h7
                #       metadata:
                #         path: "https://secure.ite.pepsico.com/app/exkwjvfh95xp6PcuV0h7/sso/saml/metadata"
                #     sp:
                #       entity_id: "https://pep-eiap-kibana01.infra.gw01.aks02.scus.nonprod.azure.intra.pepsico.com/"
                #       acs: "https://pep-eiap-kibana01.infra.gw01.aks02.scus.nonprod.azure.intra.pepsico.com/api/security/v1/saml"
                #       logout: "https://pep-eiap-kibana01.infra.gw01.aks02.scus.nonprod.azure.intra.pepsico.com/logout"

                ldap:
                  pep_prod_ldap:
                    order: 1
                    enabled: true
                    metadata:
                      - uid
                      - cn
                    authentication:
                      # whether to use for authn too
                      enabled: true
                    # cache
                    cache:
                      ttl: 15m
                      max_users: 100000
                    # ssl
                    ssl:
                      certificate_authorities:
                        - /usr/share/elasticsearch/config/pep/etc/certs/PepsiCoCA01.pem
                        - /usr/share/elasticsearch/config/pep/etc/certs/PepsiCoRootCA.pem
                      verification_mode: certificate
                    url:
                      - "${LDAP_URL_0}"
                    #: --
                    #: IMPORTANT
                    #: - we are using serviece account
                    #: - bind_dn must be provided
                    #: - user_search
                    #: - secure_bind_password (should be in secret)
                    #: --
                    bind_dn: ${LDAP_BIND_DN}
                    user_search:
                      base_dn: "ou=internal,ou=people,o=pepsico,dc=pep,dc=pvt"
                      scope: sub_tree
                      pool:
                        size: 25
                    group_search:
                      base_dn: "ou=groups,ou=EIP_PROD,ou=applications,o=pepsico,dc=pep,dc=pvt"
                      # pep has directly underneath
                      scope: one_level
                      filter: "(&(objectclass=groupOfUniqueNames)(uniqueMember={0}))"
                    unmapped_groups_as_roles: false

      volumeClaimTemplates: &vol_claim_templates
        - metadata:
            name: elasticsearch-data
          spec:
            accessModes:
            - ReadWriteOnce
            resources:
              requests:
                storage: 500Gi
            storageClassName: &es_stdssd elastic-stdssd-zoned

      podTemplate: &pod_template

        metadata: &pod_tmpl_metadata
          labels:
            # need this for stack monitoring (allow autodiscover
            # metricbeat) (Format: es-<cluster name>)
            stack-monitoring.elastic.co/type: es-monitor-01-prod-scus
          annotations:
            # need this for stack monitoring
            co.elastic.logs/enabled: "true"
            traffic.sidecar.istio.io/includeInboundPorts: "*"
            traffic.sidecar.istio.io/excludeOutboundPorts: "9300"
            traffic.sidecar.istio.io/excludeInboundPorts: "9300"

        spec:
          # IMPORTANT: should be at pod level
          securityContext: &sec_ctxt
            runAsUser: 1000
            fsGroup: 1000

          nodeSelector:
            agentpool: npesmon1z1

          tolerations:
            # IMPORTANT: use the right taint for zone
            - key: ESMonitor01NodeOnlyZone1
              operator: Exists
          # ~~
          # volumes
          # ~~
          volumes: &vol_0
            - name: config-projected
              projected:
                # 0775 -> 509, 0644 -> 420
                defaultMode: 420
                sources:
                # pep-ca-certs-config
                - configMap:
                    name: pep-ca-certs-config
                    optional: false
                    items:
                      - key: PepsiCoCA01.pem
                        # must be relative
                        path: etc/certs/PepsiCoCA01.pem
                      - key: PepsiCoRootCA.pem
                        # must be relative
                        path: etc/certs/PepsiCoRootCA.pem

          containers: &containers
            - name: elasticsearch
              imagePullPolicy: IfNotPresent

              resources:
                limits:
                  cpu: 1950m
                  memory: 18Gi
                requests:
                  cpu: 1000m
                  memory: 17Gi

              env: &env_all

                - name: ES_JAVA_OPTS
                  value: -Xms16g -Xmx16g

                - name: LDAP_URL_0
                  valueFrom:
                    configMapKeyRef:
                      name: pep-eiap-xpack-settings
                      key: ldap_url_0

                - name: LDAP_BIND_DN
                  valueFrom:
                    configMapKeyRef:
                      name: pep-eiap-xpack-settings
                      key: ldap_bind_dn

              volumeMounts: &vol_mnt0
                - name: config-projected
                  # IMPORTANT:
                  # - ES runs as Java Security Context enabled, path must
                  # be /usr/share/elasticsearch/config/pep and make sure to
                  # create a sub-dir
                  # - make sure the init container also runs as elasticsearch
                  #   context
                  mountPath: /usr/share/elasticsearch/config/pep
                  readOnly: true

          initContainers: &init_containers
            - name: elastic-internal-init-filesystem
              env: *env_all
              volumeMounts: *vol_mnt0

            - name: elastic-internal-init-keystore
              env: *env_all
              volumeMounts: *vol_mnt0


    # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
    # common-zone-2 (all roles) (change tolerations to match zone taint,
    # nodeSelector, agentpool only)
    # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
    - name: common-zone01-2
      count: 1
      # Most of  elasticsearch.yaml
      config: *common_config
      volumeClaimTemplates: *vol_claim_templates

      podTemplate:

        metadata: *pod_tmpl_metadata

        spec:
          securityContext: *sec_ctxt

          nodeSelector:
            # IMPORTANT: changed to zoned agentpool
            agentpool: npesmon1z2

          tolerations:
            # IMPORTANT: use the right taint for zone
            - key: ESMonitor01NodeOnlyZone2
              operator: Exists

          containers: *containers

          initContainers: *init_containers

          volumes: *vol_0

    # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
    # common-zone-3 (all roles) (change tolerations to match zone taint,
    # nodeSelector, agentpool only)
    # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
    - name: common-zone01-3
      count: 1
      # Most of  elasticsearch.yaml
      config: *common_config
      volumeClaimTemplates: *vol_claim_templates

      podTemplate:

        metadata: *pod_tmpl_metadata

        spec:
          securityContext: *sec_ctxt

          nodeSelector:
            # IMPORTANT: changed to zoned agentpool
            agentpool: npesmon1z3

          tolerations:
            # IMPORTANT: use the right taint for zone
            - key: ESMonitor01NodeOnlyZone3
              operator: Exists

          containers: *containers

          initContainers: *init_containers

          volumes: *vol_0
