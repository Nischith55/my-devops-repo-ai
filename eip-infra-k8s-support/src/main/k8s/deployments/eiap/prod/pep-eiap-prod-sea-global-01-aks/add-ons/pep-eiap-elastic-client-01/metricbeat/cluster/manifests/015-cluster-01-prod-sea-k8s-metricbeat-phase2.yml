---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: metricbeat
  namespace: pep-eiap-elastic-client-01
  labels:
    k8s-app: metricbeat
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: metricbeat
  labels:
    k8s-app: metricbeat
rules:
- apiGroups: [""]
  resources:
  - nodes
  - namespaces
  - events
  - pods
  - services
  - persistentvolumes
  - persistentvolumeclaims
  verbs: ["get", "list", "watch"]
- apiGroups: ["extensions"]
  resources:
  - replicasets
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources:
  - statefulsets
  - deployments
  - replicasets
  - daemonsets
  verbs: ["get", "list", "watch"]
- apiGroups: ["batch"]
  resources:
  - jobs
  - cronjobs
  verbs: ["get", "list", "watch"]
- apiGroups: ["storage.k8s.io"]
  resources:
    - storageclasses
  verbs: ["get", "list", "watch"]
- apiGroups:
  - ""
  resources:
  - nodes/stats
  verbs:
  - get
- nonResourceURLs:
  - "/metrics"
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: metricbeat
  # should be the namespace where metricbeat is running
  namespace: pep-eiap-elastic-client-01
  labels:
    k8s-app: metricbeat
rules:
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: metricbeat-kubeadm-config
  namespace: pep-eiap-elastic-client-01
  labels:
    k8s-app: metricbeat
rules:
  - apiGroups: [""]
    resources:
      - configmaps
    resourceNames:
      - kubeadm-config
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: metricbeat
subjects:
- kind: ServiceAccount
  name: metricbeat
  namespace: pep-eiap-elastic-client-01
roleRef:
  kind: ClusterRole
  name: metricbeat
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: metricbeat
  namespace: pep-eiap-elastic-client-01
subjects:
  - kind: ServiceAccount
    name: metricbeat
    namespace: pep-eiap-elastic-client-01
roleRef:
  kind: Role
  name: metricbeat
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: metricbeat-kubeadm-config
  namespace: pep-eiap-elastic-client-01
subjects:
  - kind: ServiceAccount
    name: metricbeat
    namespace: pep-eiap-elastic-client-01
roleRef:
  kind: Role
  name: metricbeat-kubeadm-config
  apiGroup: rbac.authorization.k8s.io
---
---
# ##
# - Setup metricbeat configuration (note: This is a Deployment) so only
#   cluster wide metrics are applicable
# ##
apiVersion: v1
kind: ConfigMap
metadata:
  # NOTE: change this for instance of elastic running
  name: prod-sea-global-01-aks-k8s-metricbeat-config
  namespace: pep-eiap-elastic-client-01

data:

  K8S_CLUSTER_NAME: pep-eiap-prod-sea-global-01-aks

  metricbeat-processor.yml: |

    processors:

    # ~~
    # Add EIAP fields
    # ~~


    - add_fields:
        fields:
          ls-destination: "SEA"
          pep-aks-cluster: ${K8S_CLUSTER_NAME}
    - add_host_metadata: {}
    - add_cloud_metadata: {}
    - add_kubernetes_metadata: {}

    - add_tags:
        tags: ["Prod-SEA-Shared", "retain-logs"]

    - script:
        lang: javascript
        source: >
          function process(event) {
            event.Put("fields.sn-application", "metrics-pep-eiap-prod-sea-global-01-aks" + "-" + event.Get("kubernetes.namespace"));
            return event;
          }          

    # ~~
    # Logging
    # ~~
    logging:
      level: INFO
      metrics:
        enabled: true

  metricbeat.yml: |
    setup.template.name: "pep-metrics-template"
    setup.template.pattern: "metrics-*"
    setup.ilm.enabled: false   
    #setup.template.enabled: true  
    
    output.elasticsearch:
        hosts: [https://c0b565d4570c433e91e8d9ff1bd1b170.privatelink.southcentralus.azure.elastic-cloud.com:9243]
        api_key: "-Op1ipUBtMbxeTz3X0oS:8TirsYuVSTuAMHOlq06-Jw"
        index: "%{[fields][sn-application]}"
        #index: "gwc-dps-mb"
        
        #worker: 3
        #bulk_max_size: 1000
        ssl.verification_mode: none
        timeout: 90s

    # ---------------------------------------------------------------------
    # Setup metricbeat configuration (Common K8S stuff)
    # ---------------------------------------------------------------------
    metricbeat:
      modules:
      - module: system
        enabled: false

      - module: kubernetes
        enabled: true
        add_metadata: true
        period: 30s
        hosts:
        - kube-state-metrics.${KUBE_STATE_METRICS_NAMESPACE}.svc:${KUBE_STATE_METRICS_PORT}
        metricsets:
        - state_node
        - state_deployment
        - state_daemonset
        - state_replicaset
        - state_pod
        - state_container
        - state_cronjob
        - state_resourcequota
        - state_statefulset
        - state_service
        - state_persistentvolume
        - state_persistentvolumeclaim
        - state_storageclass
        # k8s events
        - event

      # ~~
      # kubernetes: add metrics from apiserver
      # ~~
      - module: kubernetes
        enabled: true
        period: 30s
        hosts:
        - https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}
        metricsets:
        - apiserver
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        ssl:
          certificate_authorities:
          - /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          supported_protocols:
            - TLSv1.2
            - TLSv1.3
          verification_mode: certificate

      - module: istio
        enabled: true
        period: 30s
        timeout: 90s
        metricsets:
        - istiod
        hosts:
        # standard install, if different change it
        - istiod.istio-system.svc.cluster.local:15014

      autodiscover:
        providers:
        # stack monitoring
        - type: kubernetes
          scope: cluster
          resource: pod
          node: ${NODE_NAME}
          hints:
            enabled: true
          templates:
            - condition:
                contains:
                  # (we use std. istio injected annotation)
                  kubernetes.annotations.prometheus.io/path: "/stats/prometheus"
              config:
                - module: istio
                  enabled: true
                  period: 30s
                  metricsets:
                  - proxy
                  # undocumented seems to work for slow system
                  timeout: 90s
                  hosts:
                  # istio proxy port
                  - http://${data.kubernetes.pod.ip}:15020

---
apiVersion: apps/v1
kind: Deployment
metadata:
  # name format: <output-eck-cluster>-k8s
  name: &app_name prod-sea-global-01-aks-k8s-metricbeat
  namespace: pep-eiap-elastic-client-01
  labels:
    app.kubernetes.io/name: *app_name
    app.kubernetes.io/version: &vers 8.19.11
spec:

  # For cluster wide metricbeat we use recreate, so we don't run into locks
  strategy:
    type: Recreate

  selector:
    matchLabels:
      app.kubernetes.io/name: *app_name
      app.kubernetes.io/version: *vers

  template:

    metadata:
      labels:
        app.kubernetes.io/name: *app_name
        app.kubernetes.io/version: *vers
        app: *app_name
        version: *vers

    spec:
      # PEP:
      # - Deployment run only on system node pool taints
      # - also lock down the node selector
      hostAliases:
      - ip: "172.29.168.20"
        hostnames:
        - "c0b565d4570c433e91e8d9ff1bd1b170.privatelink.southcentralus.azure.elastic-cloud.com"
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.azure.com/mode: system
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists

      serviceAccountName: metricbeat
      # some older Beat versions are depending on this settings presence
      # in k8s context
      automountServiceAccountToken: true
      securityContext:
        runAsUser: 0

      volumes:

      - name: config-projected
        projected:
          # 0644 -> 420, 0600 -> 384
          defaultMode: 384
          sources:

          # pep-ca-certs-config
          - configMap:
              name: pep-ca-certs-config
              optional: false
              items:
                - key: PepsiCoCA01.pem
                  # must be relative
                  path: etc/certs/PepsiCoCA01.pem
                - key: PepsiCoRootCA.pem
                  # must be relative
                  path: etc/certs/PepsiCoRootCA.pem

          - configMap:
              name: &beats_config prod-sea-global-01-aks-k8s-metricbeat-config
              optional: false
              items:
                - key: metricbeat.yml
                  # must be relative
                  path: etc/beat.yml
                - key: metricbeat-processor.yml
                  # must be relative
                  path: etc/beat-processor-config.yml

      containers:
      - name: metricbeat
        image: docker.elastic.co/beats/metricbeat:8.19.11
        args:
        - --environment
        - container
        - -e
        - -c
        - /projected/etc/beat-processor-config.yml
        - -c
        - /projected/etc/beat.yml

        resources:
          # limits:
          #   cpu: 100m
          #   memory: 200Mi
          requests:
            # cpu: 200m
            memory: 512Mi
        env:

        # All environment variables from beats-shared-env-config
        - name: K8S_CLUSTER_NAME
          valueFrom:
            configMapKeyRef:
              name: *beats_config
              key: K8S_CLUSTER_NAME


        - name: KUBE_STATE_METRICS_NAMESPACE
          value: monitoring

        # PEP: change
        - name: KUBE_STATE_METRICS_PORT
          value: "8080"

        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName


        # ~~
        # volumemounts
        # ~~
        volumeMounts:
        # PEP:
        - name: config-projected
          # where it is mounted
          mountPath: /projected
          readOnly: true
