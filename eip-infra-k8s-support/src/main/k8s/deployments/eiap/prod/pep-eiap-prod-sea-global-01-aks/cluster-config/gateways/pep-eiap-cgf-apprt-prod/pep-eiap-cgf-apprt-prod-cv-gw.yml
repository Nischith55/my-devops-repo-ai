apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: pep-eiap-cgf-apprt-prod-cv-gw
  namespace: pep-eiap-cgf-apprt-prod
spec:
  selector:
    istio: pep-eiap-ingress-gw01
  servers:
  - hosts:
    - dummy-passthrough-pep-eiap-cgf-apprt-prod.gw01.aks01.sea.prod.azure.intra.pepsico.com
    name: pep-eiap-cgf-apprt-prod-cv-gw-tls-443
    port:
      name: https-pep-eiap-cgf-apprt-prod-cv-gw-tls-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - pep-eiap-global-appruntimeapi.global.gw01.aks01.sea.prod.azure.intra.pepsico.com
    - pep-eiap-global-appruntimekafkafeedback.global.gw01.aks01.sea.prod.azure.intra.pepsico.com
    name: pep-eiap-cgf-apprt-prod-cv-gw-https-443
    port:
      name: https-pep-eiap-cgf-apprt-prod-cv-gw-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-eiap-prod-sea-global-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - pep-eiap-global-appruntimeapi.global.gw01.aks01.sea.prod.azure.intra.pepsico.com
    - pep-eiap-global-appruntimekafkafeedback.global.gw01.aks01.sea.prod.azure.intra.pepsico.com
    name: pep-eiap-cgf-apprt-prod-cv-gw-http-80
    port:
      name: http-pep-eiap-cgf-apprt-prod-cv-gw-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true

