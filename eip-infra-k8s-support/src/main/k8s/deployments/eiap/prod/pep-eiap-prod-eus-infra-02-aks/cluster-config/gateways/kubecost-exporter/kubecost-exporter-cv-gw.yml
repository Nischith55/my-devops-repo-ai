---
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: kubecost-exporter-cv-gw
  namespace: kubecost-exporter
spec:
  selector:
    istio: pep-eiap-ingress-gw01
  servers:
  - hosts:
    - "dummy-passthrough-kubecost-exporter.gw01.aks02.eus.prod.azure.intra.pepsico.com"
    name: "kubecost-exporter-cv-gw-tls-443"
    port:
      name: "https-kubecost-exporter-cv-gw-tls-443"
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - "dummy-kubecost-exporter-443.gw01.aks02.eus.prod.azure.intra.pepsico.com"
    name: "kubecost-exporter-cv-gw-https-443"
    port:
      name: "https-kubecost-exporter-cv-gw-443"
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: "pep-eiap-prod-eus-infra-02-aks-gw01-tls"
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - "dummy-kubecost-exporter-80.gw01.aks02.eus.prod.azure.intra.pepsico.com"
    name: "kubecost-exporter-cv-gw-http-80"
    port:
      name: "http-kubecost-exporter-cv-gw-80"
      number: 80
      protocol: http
    tls:
      httpsRedirect: true
