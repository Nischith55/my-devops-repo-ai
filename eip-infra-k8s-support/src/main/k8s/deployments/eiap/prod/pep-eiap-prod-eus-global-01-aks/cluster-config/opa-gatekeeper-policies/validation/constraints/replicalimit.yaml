apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sReplicaLimits
metadata:
  name: replicalimit
spec:
  enforcementAction: deny
  match:
    excludedNamespaces:
    # OPA Exception RITM4634288 latam 
    - pep-eiap-latam-gtm-prod
    kinds:
    - apiGroups:
      - apps
      kinds:
      - Deployment
    labelSelector:
      matchExpressions: []
    namespaceSelector:
      matchExpressions: []
    scope: '*'
  parameters:
    ranges:
    - max_replicas: 15
      min_replicas: 0
