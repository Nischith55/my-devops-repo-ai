apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  annotations: {}
  labels:
    app: pep-eiap-cgf-cle-ui-rebuild
  name: pep-eiap-cgf-cle-ui-rebuild-vs
  namespace: pep-eiap-cgf-cle-prod
spec:
  gateways:
  - pep-eiap-cgf-cle-prod/pep-eiap-cgf-cle-prod-cv-gw
  hosts:
  - pep-eiap-cgf-cle-ui-rebuild.global.gw01.aks01.eus.prod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /cle-prod-eus
    route:
    - destination:
        host: pep-eiap-cgf-cle-ui-rebuild.pep-eiap-cgf-cle-prod.svc.cluster.local
        port:
          number: 80
