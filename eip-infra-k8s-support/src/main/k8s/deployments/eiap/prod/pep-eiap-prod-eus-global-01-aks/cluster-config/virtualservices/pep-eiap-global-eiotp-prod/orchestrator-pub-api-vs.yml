apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  annotations: {}
  labels:
    app: undefined
  name: orchestrator-pub-api-vs
  namespace: pep-eiap-global-eiotp-prod
spec:
  gateways:
  - pep-eiap-global-eiotp-prod/pep-eiap-global-eiotp-prod-cv-gw
  hosts:
  - orchestrator-pub-api.global.gw01.aks01.eus.prod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: orchestrator-pub-api.pep-eiap-global-eiotp-prod.svc.cluster.local
        port:
          number: 8080
