apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  annotations: {}
  labels:
    app: pepsico-eip-latam-survey-intake
  name: pepsico-eip-latam-survey-intake-vs
  namespace: pep-eiap-latam-gtm-prod
spec:
  gateways:
  - pep-eiap-latam-gtm-prod/pep-eiap-latam-gtm-prod-cv-gw
  hosts:
  - pepsico-eip-latam-survey-intake.global.gw01.aks01.eus.prod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pepsico-eip-latam-survey-intake.pep-eiap-latam-gtm-prod.svc.cluster.local
        port:
          number: 80
