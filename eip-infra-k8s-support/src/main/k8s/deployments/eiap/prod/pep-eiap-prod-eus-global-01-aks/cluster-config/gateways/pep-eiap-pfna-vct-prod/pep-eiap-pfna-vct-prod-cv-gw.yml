apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: pep-eiap-pfna-vct-prod-cv-gw
  namespace: pep-eiap-pfna-vct-prod
spec:
  selector:
    istio: pep-eiap-ingress-gw01
  servers:
  - hosts:
    - dummy-passthrough-pep-eiap-pfna-vct-prod.gw01.aks01.eus.prod.azure.intra.pepsico.com
    name: pep-eiap-pfna-vct-prod-cv-gw-tls-443
    port:
      name: https-pep-eiap-pfna-vct-prod-cv-gw-tls-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - cntwui.global.gw01.aks01.eus.prod.azure.intra.pepsico.com
    - control-message-services.global.gw01.aks01.eus.prod.azure.intra.pepsico.com
    - dsi.global.gw01.aks01.eus.prod.azure.intra.pepsico.com
    - graphqlautomation.global.gw01.aks01.eus.prod.azure.intra.pepsico.com
    - vctpyservices.global.gw01.aks01.eus.prod.azure.intra.pepsico.com
    - vctservices.global.gw01.aks01.eus.prod.azure.intra.pepsico.com
    - walmartluminatedsi.global.gw01.aks01.eus.prod.azure.intra.pepsico.com
    name: pep-eiap-pfna-vct-prod-cv-gw-https-443
    port:
      name: https-pep-eiap-pfna-vct-prod-cv-gw-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-eiap-prod-eus-global-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - cntwui.global.gw01.aks01.eus.prod.azure.intra.pepsico.com
    - controltower.mypepsico.com
    - control-message-services.global.gw01.aks01.eus.prod.azure.intra.pepsico.com
    - dsi.global.gw01.aks01.eus.prod.azure.intra.pepsico.com
    - graphqlautomation.global.gw01.aks01.eus.prod.azure.intra.pepsico.com
    - vctpyservices.global.gw01.aks01.eus.prod.azure.intra.pepsico.com
    - vctservices.global.gw01.aks01.eus.prod.azure.intra.pepsico.com
    - walmartluminatedsi.global.gw01.aks01.eus.prod.azure.intra.pepsico.com
    name: pep-eiap-pfna-vct-prod-cv-gw-http-80
    port:
      name: http-pep-eiap-pfna-vct-prod-cv-gw-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true
  - hosts:
    - controltower.mypepsico.com
    name: pep-eiap-pfna-vct-prod-cv-gw-1-https-443
    port:
      name: https-pep-eiap-pfna-vct-prod-cv-gw-1-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-eiap-prod-eus-global-controltower-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE

