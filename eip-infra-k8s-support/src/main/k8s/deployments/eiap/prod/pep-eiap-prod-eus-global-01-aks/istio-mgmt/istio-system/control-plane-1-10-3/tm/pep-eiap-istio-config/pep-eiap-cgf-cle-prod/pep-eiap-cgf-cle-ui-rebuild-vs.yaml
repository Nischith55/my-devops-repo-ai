apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-eiap-cgf-cle-ui-rebuild-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-eiap-cgf-cle-ui-rebuild.global.gw01.aks01.eus.prod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /cle-prod-eus
    route:
    - destination:
        host: pep-eiap-cgf-cle-ui-rebuild.pep-eiap-cgf-cle-prod.svc.cluster.local
        port:
          number: 80