apiVersion: autoscaling/v1  
kind: HorizontalPodAutoscaler
metadata:
  name: pep-eip-pbna-workorders-ingest-hpa  # name of hpa object
  namespace: pep-eiap-pbna-halo-prod  # namespace where the hpa is created
spec:
  maxReplicas: 2 # define max replica count
  minReplicas: 1  # define min replica count
  scaleTargetRef:  # define the resource on which HPA should be applied
    apiVersion: apps/v1
    kind: Deployment
    name: pep-eip-pbna-workorders-ingest   # hpa is applied on this deployment
  targetCPUUtilizationPercentage: 80 # target CPU utilization