apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-eiap-df-fileupload-ui-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - df-fileupload-ui.global.gw01.aks01.eus.prod.azure.intra.pepsico.com
  tls:
  - match:
    - port: 443
      sniHosts:
      - df-fileupload-ui.global.gw01.aks01.eus.prod.azure.intra.pepsico.com    
    route:
    - destination:
        host: df-fileupload-ui.pep-eiap-global-hcm-prod.svc.cluster.local
        port:
          number: 80
