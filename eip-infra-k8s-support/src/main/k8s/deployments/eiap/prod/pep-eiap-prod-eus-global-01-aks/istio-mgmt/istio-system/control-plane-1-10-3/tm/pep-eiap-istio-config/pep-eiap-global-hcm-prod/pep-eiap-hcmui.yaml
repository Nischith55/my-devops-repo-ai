apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-eiap-hcmui-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - hcmui.global.gw01.aks01.eus.prod.azure.intra.pepsico.com
  - hcm.mypepsico.com 
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: hcmui.pep-eiap-global-hcm-prod.svc.cluster.local
        port:
          number: 80
