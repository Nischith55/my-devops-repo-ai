---
# ##
# - Setup metricbeat configuration (note: This is a Deployment) so only
#   cluster wide metrics are applicable
# ##
apiVersion: v1
kind: ConfigMap
metadata:
  # NOTE: change this for instance of elastic running
  name: prod-eus-global-01-aks-k8s-metricbeat-config
  namespace: pep-eiap-elastic-client-01

data:

  # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  # metricbeat environment variables change here
  # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  K8S_CLUSTER_NAME: pep-eiap-prod-eus-global-01-aks
  # Important we are using inCluster URL (change to gw url if remote)
  # please make sure the scheme is correct
  ELASTICSEARCH_OUTPUT_URL: https://pep-eiap-ingest-01.infra.gw01.aks02.scus.prod.azure.intra.pepsico.com:443
  # sending data to our monitoring cluster
  # please make sure the scheme is correct
  MONITORING_CLUSTER_URL: https://pep-eiap-elastic-monitor-01.infra.gw01.aks02.scus.prod.azure.intra.pepsico.com:443
  # Change the template name appropriately if required
  TEMPLATE_NAME: metricbeat-aks-cluster
  INDEX_PATTERN_PREFIX: mb-aks

  # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  # metricbeat processor stuff
  # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  metricbeat-processor.yml: |

    # ---------------------------------------------------------------------
    # Common Processors across all beats deployment
    # ---------------------------------------------------------------------

    processors:

    # ~~
    # Add EIAP fields
    # ~~
    - add_fields:
        target: eiap
        fields:
          cluster_name: ${K8S_CLUSTER_NAME}

    - add_fields:
        target: ""
        fields:
          index_name_add: ${K8S_CLUSTER_NAME}

    # ~~
    # Logging
    # ~~
    logging:
      level: INFO
      metrics:
        enabled: true

  # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  # metricbeat standard k8s stuff
  # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  metricbeat.yml: |

    # --------------------
    # All outputs
    # --------------------
    output:
      elasticsearch:
        index: ${INDEX_PATTERN_PREFIX}-%{[index_name_add]}-%{[agent.version]}-%{+yyyy.MM.dd}
        hosts:
          - ${ELASTICSEARCH_OUTPUT_URL}
        username: ${ELASTICSEARCH_USERNAME}
        password: ${ELASTICSEARCH_PASSWORD}
        # should equal to number of ingest nodes
        workers: 3
        ssl: &pep_ca_ssl
          enabled: true
          # The following 2 must be mounted at paths shown below from
          # pep-ca-certs-config ConfigMap
          certificate_authorities:
            - /projected/etc/certs/PepsiCoCA01.pem
            - /projected/etc/certs/PepsiCoRootCA.pem
          supported_protocols:
            - TLSv1.2
            - TLSv1.3
          verification_mode: certificate

    # --------------------
    # Setup all index patterns
    # --------------------
    setup:
      ilm:
        enabled: false
      template:
        enabled: true
        name: ${TEMPLATE_NAME}-%{[agent.version]}
        overwrite: false
        pattern: ${INDEX_PATTERN_PREFIX}-*
        settings:
          index:
            codec: best_compression
            number_of_replicas: ${INDEX_REPLICAS:1}
            number_of_shards: ${INDEX_SHARDS:1}

    # --------------------
    # send metricbeat metrics itself to our monitoring cluster
    # --------------------
    monitoring:
      enabled: true
      elasticsearch:
        hosts:
          - ${MONITORING_CLUSTER_URL}
        # IMPORTANT we are re-using the usernae and password
        username: ${MONITORING_CLUSTER_USERNAME}
        password: ${MONITORING_CLUSTER_PASSWORD}
        ssl: *pep_ca_ssl

    # ---------------------------------------------------------------------
    # Setup metricbeat configuration (Common K8S stuff)
    # ---------------------------------------------------------------------
    metricbeat:

      # ~~
      # modules
      # ~~
      modules:

      # Since this is a cluster wide scoped metricbeat disable the system
      # module which is enabled by default
      - module: system
        enabled: false

      # ~~
      # kubernetes: add metrics from metrics endpoint
      # ~~
      - module: kubernetes
        enabled: true
        add_metadata: true
        period: 30s
        hosts:
        - kube-state-metrics.${KUBE_STATE_METRICS_NAMESPACE}.svc:${KUBE_STATE_METRICS_PORT}
        metricsets:
        - state_node
        - state_deployment
        - state_daemonset
        - state_replicaset
        - state_pod
        - state_container
        - state_cronjob
        - state_resourcequota
        - state_statefulset
        - state_service
        - state_persistentvolume
        - state_persistentvolumeclaim
        - state_storageclass
        # k8s events
        - event

      # ~~
      # kubernetes: add metrics from apiserver
      # ~~
      - module: kubernetes
        enabled: true
        period: 30s
        hosts:
        - https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}
        metricsets:
        - apiserver
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        ssl:
          certificate_authorities:
          - /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          supported_protocols:
            - TLSv1.2
            - TLSv1.3
          verification_mode: certificate

      # ~~
      # istio: istiod metricset (NOTE: experimental)
      # IMPORTANT: Make sure istiod SVC is correct for the cluster
      # ~~
      - module: istio
        enabled: true
        period: 30s
        timeout: 90s
        metricsets:
        - istiod
        hosts:
        # standard install, if different change it
        - istiod-1-10-3.istio-system.svc.cluster.local:15014

      # TODO: Please enable after prometheus is installed..
      # # ~~
      # # Autodiscover istio-proxy containers (since we are sidecar injected)
      # # ~~
      # autodiscover:
      #   providers:
      #   # stack monitoring
      #   - type: kubernetes
      #     scope: cluster
      #     resource: pod
      #     node: ${NODE_NAME}
      #     hints:
      #       enabled: true
      #     templates:
      #       - condition:
      #           contains:
      #             # (we use std. istio injected annotation)
      #             kubernetes.annotations.prometheus.io/path: "/stats/prometheus"
      #         config:
      #           - module: istio
      #             enabled: true
      #             period: 30s
      #             metricsets:
      #             - proxy
      #             # undocumented seems to work for slow system
      #             timeout: 90s
      #             hosts:
      #             # istio proxy port
      #             - http://${data.host}:15090

---
apiVersion: apps/v1
kind: Deployment
metadata:
  # name format: <output-eck-cluster>-k8s
  name: &app_name prod-eus-global-01-aks-k8s-metricbeat
  namespace: pep-eiap-elastic-client-01
  labels:
    app.kubernetes.io/name: *app_name
    app.kubernetes.io/version: &vers 7.14.0
spec:

  # For cluster wide metricbeat we use recreate, so we don't run into locks
  strategy:
    type: Recreate

  selector:
    matchLabels:
      app.kubernetes.io/name: *app_name
      app.kubernetes.io/version: *vers

  template:

    metadata:
      labels:
        app.kubernetes.io/name: *app_name
        app.kubernetes.io/version: *vers
        app: *app_name
        version: *vers

    spec:
      # PEP:
      # - Deployment run only on system node pool taints
      # - also lock down the node selector
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.azure.com/mode: system
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists

      serviceAccountName: metricbeat
      # some older Beat versions are depending on this settings presence
      # in k8s context
      automountServiceAccountToken: true
      securityContext:
        runAsUser: 0

      # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
      # All volumes
      # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
      volumes:

      # PEP: all in one configMap (using projections)
      - name: config-projected
        projected:
          # 0644 -> 420, 0600 -> 384
          defaultMode: 384
          sources:

          # pep-ca-certs-config
          - configMap:
              name: pep-ca-certs-config
              optional: false
              items:
                - key: PepsiCoCA01.pem
                  # must be relative
                  path: etc/certs/PepsiCoCA01.pem
                - key: PepsiCoRootCA.pem
                  # must be relative
                  path: etc/certs/PepsiCoRootCA.pem

          - configMap:
              name: &beats_config prod-eus-global-01-aks-k8s-metricbeat-config
              optional: false
              items:
                - key: metricbeat.yml
                  # must be relative
                  path: etc/beat.yml
                - key: metricbeat-processor.yml
                  # must be relative
                  path: etc/beat-processor-config.yml

      containers:
      # PEP: args removed sysfs it's a deployment
      - name: metricbeat
        image: docker.elastic.co/beats/metricbeat:7.14.0
        args:
        - -environment
        - container
        - -e
        - -c
        - /projected/etc/beat-processor-config.yml
        - -c
        - /projected/etc/beat.yml
        # - -d
        # - "monitoring"
        # - index-management,processors

        resources:
          # limits:
          #   cpu: 100m
          #   memory: 200Mi
          requests:
            # cpu: 200m
            memory: 512Mi
        env:

        # All environment variables from beats-shared-env-config
        - name: K8S_CLUSTER_NAME
          valueFrom:
            configMapKeyRef:
              name: *beats_config
              key: K8S_CLUSTER_NAME

        - name: TEMPLATE_NAME
          valueFrom:
            configMapKeyRef:
              name: *beats_config
              key: TEMPLATE_NAME

        - name: INDEX_PATTERN_PREFIX
          valueFrom:
            configMapKeyRef:
              name: *beats_config
              key: INDEX_PATTERN_PREFIX

        - name: ELASTICSEARCH_OUTPUT_URL
          valueFrom:
            configMapKeyRef:
              name: *beats_config
              key: ELASTICSEARCH_OUTPUT_URL

        # All secrets from elastic-client-shared
        - name: ELASTICSEARCH_USERNAME
          valueFrom:
            secretKeyRef:
              name: &shared_sec elastic-client-shared
              key: BEATS_INGEST_USER_01

        - name: ELASTICSEARCH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: *shared_sec
              key: BEATS_INGEST_PASSWORD_01

        # Monitoring cluster url for ingesting stack monitoring data
        - name: MONITORING_CLUSTER_URL
          valueFrom:
            configMapKeyRef:
              name: *beats_config
              key: MONITORING_CLUSTER_URL

        - name: MONITORING_CLUSTER_USERNAME
          valueFrom:
            secretKeyRef:
              name: *shared_sec
              # re-use
              key: BEATS_MONITOR_INGEST_USER_01

        - name: MONITORING_CLUSTER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: *shared_sec
              # re-use
              key: BEATS_MONITOR_INGEST_PASSWORD_01

        # NOTE: this is only if we use it (stack_collector)
        - name: MONITOR_USERNAME
          valueFrom:
            secretKeyRef:
              name: *shared_sec
              key: MONITOR_COMMON_USER_01

        - name: MONITOR_PASSWORD
          valueFrom:
            secretKeyRef:
              name: *shared_sec
              key: MONITOR_COMMON_PASSWORD_01

        # PEP: change
        - name: KUBE_STATE_METRICS_NAMESPACE
          value: monitoring

        # PEP: change
        - name: KUBE_STATE_METRICS_PORT
          value: "8080"

        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName

        - name: NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP

        # ~~
        # volumemounts
        # ~~
        volumeMounts:
        # PEP:
        - name: config-projected
          # where it is mounted
          mountPath: /projected
          readOnly: true
