apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-eip-tct-carrier-confirmation-processor-piav-vs
  namespace: pep-eiap-global-eip-prod
  labels:
      app: pep-eip-tct-carrier-confirmation-processor
spec:
  hosts:
  - pep-eip-tct-carrier-confirmation-processor.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
  gateways:
  - pep-eiap-global-eip-prod/pep-eiap-global-eip-prod-cv-gw
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-eip-tct-carrier-confirmation-processor.pep-eiap-global-eip-prod.svc.cluster.local
        port:
          number: 80
  