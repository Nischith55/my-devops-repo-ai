---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-och-orderstore-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-och-orderstore.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /v1/api/orders
    - ignoreUriCase: true
      uri:
        prefix: /v2/api/orders
    route:
    - destination:
        host: pep-och-orderstore.pep-eiap-och-na-prod.svc.cluster.local
        port:
          number: 80
    corsPolicy:
      allowOrigins:      
      - exact: https://pep-och-falloutmanagement.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
      - exact: https://pep-och-ui.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
      - exact: https://pep-och-downconfirm-ui.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
      - exact: https://pepcommerce-ordermanagement.na.pepsico.com
      allowMethods:
      - POST
      - GET
      - PUT
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Link
      - Content-Type    
      - Access-Control-Allow-Origin  
      exposeHeaders:
      - x-total-count  
  