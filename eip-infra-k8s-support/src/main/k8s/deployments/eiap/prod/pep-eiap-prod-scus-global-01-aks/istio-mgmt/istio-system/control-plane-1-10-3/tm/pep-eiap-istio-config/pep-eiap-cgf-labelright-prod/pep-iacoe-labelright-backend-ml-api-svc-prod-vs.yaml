apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-iacoe-labelright-backend-ml-api-svc-prod-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-iacoe-labelright-backend-ml-api-svc-prod.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-iacoe-labelright-backend-ml-api-svc-prod.pep-eiap-cgf-labelright-prod.svc.cluster.local
        port:
          number: 8000
    corsPolicy:
      allowOrigins:
      - exact: https://pep-iacoe-labelright-frontend-ui-svc-prod.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
      - exact: https://pep-iacoe-labelright-service-sync-svc-prod.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
      - exact: https://pep-iacoe-labelright-backend-api-svc-prod.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
      - exact: https://pep-iacoe-labelright-backend-ml-api-svc-prod.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
      - exact: https://api-na.mypepsico.com
      - exact: https://labelright.pepsico.com
      - exact: https://pepiacoelabelrightprdst.z21.web.core.windows.net
      - exact: https://labelrightglobal.mypepsico.com
      - exact: https://pep-iacoe-labelright-frontend-ui-svc-prod.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
      - exact: https://pep-iacoe-labelright-service-sync-svc-prod.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
      - exact: https://pep-iacoe-labelright-backend-api-svc-prod.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
      allowMethods:
      - GET
      - PUT
      - POST
      - DELETE
      - OPTIONS
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Content-Type
      - Access-Control-Allow-Origin
      - Timeout
      - x-functions-key
      - Access-Control-Allow-Headers
      exposeHeaders:
      - x-total-count
