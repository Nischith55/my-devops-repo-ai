apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  annotations: {}
  labels:
    app: pep-eip-cdp-appsflyer-data-processor
  name: pep-eip-cdp-appsflyer-data-processor-vs
  namespace: pep-eiap-global-eip-prod
spec:
  gateways:
  - pep-eiap-global-eip-prod/pep-eiap-global-eip-prod-cv-gw
  hosts:
  - pep-eip-cdp-appsflyer-data-processor.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-eip-cdp-appsflyer-data-processor.pep-eiap-global-eip-prod.svc.cluster.local
        port:
          number: 80
