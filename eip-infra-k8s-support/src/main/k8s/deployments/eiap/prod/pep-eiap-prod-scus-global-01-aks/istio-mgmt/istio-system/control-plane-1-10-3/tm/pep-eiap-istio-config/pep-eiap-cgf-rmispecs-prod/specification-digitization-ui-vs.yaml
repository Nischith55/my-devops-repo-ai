apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: specification-digitization-ui-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - specification-digitization-ui.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
  - suit.prod.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: specification-digitization-ui.pep-eiap-cgf-rmispecs-prod.svc.cluster.local
        port:
          number: 8080