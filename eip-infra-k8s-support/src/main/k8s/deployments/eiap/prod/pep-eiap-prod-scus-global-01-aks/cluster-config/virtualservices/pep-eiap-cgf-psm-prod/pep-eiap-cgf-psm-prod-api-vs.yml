apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  annotations: {}
  labels:
    app: pep-eiap-cgf-psm-prod-api
  name: pep-eiap-cgf-psm-prod-api-vs
  namespace: pep-eiap-cgf-psm-prod
spec:
  gateways:
  - pep-eiap-cgf-psm-prod/pep-eiap-cgf-psm-prod-cv-gw
  hosts:
  - pep-eiap-cgf-psm-prod-api.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-eiap-cgf-psm-prod-api.pep-eiap-cgf-psm-prod.svc.cluster.local
        port:
          number: 8000
