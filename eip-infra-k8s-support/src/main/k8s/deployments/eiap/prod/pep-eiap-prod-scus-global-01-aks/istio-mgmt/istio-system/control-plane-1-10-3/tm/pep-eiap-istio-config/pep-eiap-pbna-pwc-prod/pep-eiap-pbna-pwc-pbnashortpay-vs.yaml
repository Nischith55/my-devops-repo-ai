---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-eiap-pbnashortpay-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pbnashortpay.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /api/v1/shortpay
    route:
    - destination:
        host: pep-eip-pbna-chatbot-api-shortpay.pep-eiap-pbna-pwc-prod.svc.cluster.local
        port:
          number: 80
