apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-eiap-cto-cmp-ui-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - cmp.mypepsico.com
  - pepsico-cto-cmp-ui.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /v1
    route:
    - destination:
        host: pep-eip-global-cmp-ui-v1.pep-eiap-global-cmp-prod.svc.cluster.local
        port:
          number: 80
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pepsico-cto-cmp-ui.pep-eiap-global-cmp-prod.svc.cluster.local
        port:
          number: 80 