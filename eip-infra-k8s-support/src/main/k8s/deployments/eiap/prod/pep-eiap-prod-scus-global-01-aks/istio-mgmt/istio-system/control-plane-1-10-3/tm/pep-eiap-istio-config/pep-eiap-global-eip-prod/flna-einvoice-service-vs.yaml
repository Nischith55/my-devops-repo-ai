---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: flna-einvoice-service-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-eip-flna-einvoice-service.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: flna-einvoice-service.pep-eiap-global-eip-prod.svc.cluster.local
        port:
          number: 80
