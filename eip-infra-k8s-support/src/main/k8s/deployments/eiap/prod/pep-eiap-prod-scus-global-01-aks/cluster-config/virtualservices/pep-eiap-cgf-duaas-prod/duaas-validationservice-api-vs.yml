apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  annotations: {}
  labels:
    app: duaas-validationservice-api
  name: duaas-validationservice-api-vs
  namespace: pep-eiap-cgf-duaas-prod
spec:
  gateways:
  - pep-eiap-cgf-duaas-prod/pep-eiap-cgf-duaas-prod-cv-gw
  hosts:
  - duaas-validationservice-api.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: duaas-validationservice-api.pep-eiap-cgf-duaas-prod.svc.cluster.local
        port:
          number: 80
