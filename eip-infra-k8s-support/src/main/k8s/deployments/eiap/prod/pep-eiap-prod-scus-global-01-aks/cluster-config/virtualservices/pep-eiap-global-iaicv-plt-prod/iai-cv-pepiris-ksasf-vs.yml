apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  annotations:
    meta.helm.sh/release-name: iai-cv-pepiris-backend-common-ksasf
    meta.helm.sh/release-namespace: pep-eiap-global-iaicv-plt-prod
  labels:
    app: iai-cv-pepiris-ksasf
    app.kubernetes.io/instance: iai-cv-pepiris-backend-common-ksasf
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: 1.16.3
