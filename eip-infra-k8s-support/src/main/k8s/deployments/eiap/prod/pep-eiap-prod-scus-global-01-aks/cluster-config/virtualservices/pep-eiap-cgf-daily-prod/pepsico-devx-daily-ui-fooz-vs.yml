  namespace: pep-eiap-cgf-daily-prod
  labels:
      app: pepsico-devx-daily-ui
spec:
  hosts:
  - pep-eiap-cgf-daily-prod.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
  gateways:
  - pep-eiap-cgf-daily-prod/pep-eiap-cgf-daily-prod-cv-gw
