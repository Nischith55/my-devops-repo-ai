apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-och-accountsreceivablesvc-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-och-accountsreceivablesvc.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-och-accountsreceivablesvc.pep-eiap-och-na-prod.svc.cluster.local
        port:
          number: 80
    corsPolicy:
      allowOrigins:
      - exact: https://portalcobros.pepsico.com
      allowMethods:
      - POST
      - GET
      - PUT
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Content-Type
      exposeHeaders:
      - x-total-count 