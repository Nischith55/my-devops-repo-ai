---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-eiap-pbnanationalstaffing-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pbnanationalstaffing.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /api/v1/nationalstaffing
    route:
    - destination:
        host: pep-eip-pbna-chatbot-api-nationalstaffing.pep-eiap-pbna-pwc-prod.svc.cluster.local
        port:
          number: 80
