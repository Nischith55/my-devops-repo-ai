apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  annotations: {}
  labels:
    app: och-bees-product-batch
  name: och-bees-product-batch-vs
  namespace: pep-eiap-och-na-prod
spec:
  gateways:
  - pep-eiap-och-na-prod/pep-eiap-och-na-prod-cv-gw
  hosts:
  - och-bees-product-batch.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: och-bees-product-batch.pep-eiap-och-na-prod.svc.cluster.local
        port:
          number: 80
