apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: dopapp-b2b-cl-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pepcepb08.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
  - web.cep.cl.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: dopapp-b2b-cl.pep-eiap-global-cep-prod.svc.cluster.local
        port:
          number: 80
