apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: pep-eiap-global-hcm-prod-cv-gw
  namespace: pep-eiap-global-hcm-prod
spec:
  selector:
    istio: pep-eiap-ingress-gw01
  servers:
  - hosts:
    - df-fileupload-ui.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
    name: pep-eiap-global-hcm-prod-cv-gw-tls-443
    port:
      name: https-pep-eiap-global-hcm-prod-cv-gw-tls-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - hcm-tpo-gold-services.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - onepep-suggesstedorder-dsi.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - onepep-suggestedorder-dsi.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - df-fileze.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - hcmui.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - tpo-powerbi-serve-layer.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
    name: pep-eiap-global-hcm-prod-cv-gw-https-443
    port:
      name: https-pep-eiap-global-hcm-prod-cv-gw-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-eiap-prod-scus-global-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - hcm-tpo-gold-services.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - onepep-suggesstedorder-dsi.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - onepep-suggestedorder-dsi.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - df-fileze.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - hcmui.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - hcm.mypepsico.com
    - tpo-powerbi-serve-layer.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
    name: pep-eiap-global-hcm-prod-cv-gw-http-80
    port:
      name: http-pep-eiap-global-hcm-prod-cv-gw-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true
  - hosts:
    - hcm.mypepsico.com
    name: pep-eiap-global-hcm-prod-cv-gw-1-https-443
    port:
      name: https-pep-eiap-global-hcm-prod-cv-gw-1-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-eiap-prod-scus-global-hcm-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE

