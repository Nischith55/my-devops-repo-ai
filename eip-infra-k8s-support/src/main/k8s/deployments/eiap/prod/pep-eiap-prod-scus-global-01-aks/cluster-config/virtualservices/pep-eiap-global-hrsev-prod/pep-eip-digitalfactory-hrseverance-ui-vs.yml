apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  annotations: {}
  labels:
    app: pep-eip-digitalfactory-hrseverance-ui
  name: pep-eip-digitalfactory-hrseverance-ui-vs
  namespace: pep-eiap-global-hrsev-prod
spec:
  gateways:
  - pep-eiap-global-hrsev-prod/pep-eiap-global-hrsev-prod-cv-gw
  hosts:
  - pep-eip-digitalfactory-hrseverance-ui.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-eip-digitalfactory-hrseverance-ui.pep-eiap-global-hrsev-prod.svc.cluster.local
        port:
          number: 80
