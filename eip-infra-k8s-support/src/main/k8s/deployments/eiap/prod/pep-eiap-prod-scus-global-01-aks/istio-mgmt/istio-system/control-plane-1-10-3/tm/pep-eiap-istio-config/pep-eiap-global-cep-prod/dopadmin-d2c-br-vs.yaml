apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: dopadmin-d2c-br-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pepcepa11.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
  - admin.d2c.cep.br.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: dopadmin-d2c-br.pep-eiap-global-cep-prod.svc.cluster.local
        port:
          number: 80 