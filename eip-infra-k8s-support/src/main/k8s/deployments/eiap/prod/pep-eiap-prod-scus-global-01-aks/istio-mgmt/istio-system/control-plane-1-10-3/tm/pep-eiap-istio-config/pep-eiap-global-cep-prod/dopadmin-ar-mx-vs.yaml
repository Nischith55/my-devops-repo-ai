apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: dopadmin-ar-mx-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pepcepa01.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: dopadmin-ar-mx.pep-eiap-global-cep-prod.svc.cluster.local
        port:
          number: 80