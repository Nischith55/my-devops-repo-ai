apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  annotations: {}
  labels:
    app: geniusone-connectorservice
  name: geniusone-connectorservice-vs
  namespace: pep-eiap-global-eip-prod
spec:
  gateways:
  - pep-eiap-global-eip-prod/pep-eiap-global-eip-prod-cv-gw
  hosts:
  - geniusone-connectorservice.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: geniusone-connectorservice.pep-eiap-global-eip-prod.svc.cluster.local
        port:
          number: 80
