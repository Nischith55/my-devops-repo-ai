apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-eip-latam-idcard-authorisation-service-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-eip-latam-idcard-authorisation-service.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
  - idcardpmf.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /actuator
    fault:
      abort:
        percentage:
          value: 100
        httpStatus: 404   
    route:
    - destination:
        host: none  
  - match:
    - uri:
        prefix: /            
    route:
    - destination:
        host: pep-eip-latam-idcard-authorisation-service.pep-eiap-latam-idcard-prod.svc.cluster.local
        port:
          number: 80


      
