apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: paperless-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - paperless.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
  - mf.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: paperless.pep-eiap-amesa-paperless-prod.svc.cluster.local
        port:
          number: 80