apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  annotations: {}
  labels:
    app: hcm-tpo-gold-services
  name: hcm-tpo-gold-services-vs
  namespace: pep-eiap-global-hcm-prod
spec:
  gateways:
  - pep-eiap-global-hcm-prod/pep-eiap-global-hcm-prod-cv-gw
  hosts:
  - hcm-tpo-gold-services.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: hcm-tpo-gold-services.pep-eiap-global-hcm-prod.svc.cluster.local
        port:
          number: 80
