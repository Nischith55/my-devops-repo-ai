apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-eip-gbs-hrjepc-webappbackend-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-eip-gbs-hrjepc-webappbackend.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-eip-gbs-hrjepc-webappbackend.pep-eiap-gbs-hrjepc-prod.svc.cluster.local
        port:
          number: 80 