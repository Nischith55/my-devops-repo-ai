apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  annotations: {}
  labels:
    app: people
  name: pep-eiap-global-wsp-people-vs
  namespace: pep-eiap-global-wsp-prod
spec:
  gateways:
  - pep-eiap-global-wsp-prod/pep-eiap-global-wsp-prod-cv-gw
  hosts:
  - pep-eiap-global-wsp-people.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
  - people.mypepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: people.pep-eiap-global-wsp-prod.svc.cluster.local
        port:
          number: 80
