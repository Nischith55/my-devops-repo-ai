apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  annotations: {}
  labels:
    app: pep-eip-amesa-prod-ksa-backend
  name: pep-eip-amesa-prod-ksa-backend-vs
  namespace: pep-eiap-amesa-ksaeinvc-prod
spec:
  gateways:
  - pep-eiap-amesa-ksaeinvc-prod/pep-eiap-amesa-ksaeinvc-prod-cv-gw
  hosts:
  - pep-eip-amesa-prod-ksa-backend.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-eip-amesa-prod-ksa-backend.pep-eiap-amesa-ksaeinvc-prod.svc.cluster.local
        port:
          number: 80
