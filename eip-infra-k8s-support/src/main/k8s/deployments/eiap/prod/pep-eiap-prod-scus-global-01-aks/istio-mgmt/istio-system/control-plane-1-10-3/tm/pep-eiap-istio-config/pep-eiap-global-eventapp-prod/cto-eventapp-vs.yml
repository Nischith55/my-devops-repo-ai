apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: cto-eventapp-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - cto-eventapp.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: cto-eventapp.pep-eiap-global-eventapp-prod.svc.cluster.local
        port:
          number: 8081