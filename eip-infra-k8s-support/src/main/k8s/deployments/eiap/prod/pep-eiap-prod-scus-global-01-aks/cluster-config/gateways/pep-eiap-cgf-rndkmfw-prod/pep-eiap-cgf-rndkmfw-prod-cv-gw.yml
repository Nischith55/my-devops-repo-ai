apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: pep-eiap-cgf-rndkmfw-prod-cv-gw
  namespace: pep-eiap-cgf-rndkmfw-prod
spec:
  selector:
    istio: pep-eiap-ingress-gw01
  servers:
  - hosts:
    - dummy-passthrough-pep-eiap-cgf-rndkmfw-prod.gw01.aks01.scus.prod.azure.intra.pepsico.com
    name: pep-eiap-cgf-rndkmfw-prod-cv-gw-tls-443
    port:
      name: https-pep-eiap-cgf-rndkmfw-prod-cv-gw-tls-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - dummy-pep-eiap-cgf-rndkmfw-prod-443.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pep-cgf-rnd-knowledge-management-rag-backend.eiap.gw01.aks02.eus.nonprod.azure.intra.pepsico.com
    - pep-cgf-rnd-knowledge-management-rag-frontend-prod.eiap.gw01.aks02.eus.nonprod.azure.intra.pepsico.com
    - pep-cgf-rnd-knowledge-management-rag-backend-prod.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pep-cgf-rnd-knowledge-management-rag-frontend-prod.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
    name: pep-eiap-cgf-rndkmfw-prod-cv-gw-https-443
    port:
      name: https-pep-eiap-cgf-rndkmfw-prod-cv-gw-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-eiap-prod-scus-global-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - rndkmframework.azure.intra.pepsico.com
    name: pep-eiap-cgf-rndkmfw-prod-cv-gw-cdn-https-443
    port:
      name: https-pep-eiap-cgf-rndkmfw-prod-cv-gw-cdn-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: rndkmframework-cert-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - rndkmframework-api.azure.intra.pepsico.com
    name: pep-eiap-cgf-rndkmfw-prod-cv-gw-api-cdn-https-443
    port:
      name: https-pep-eiap-cgf-rndkmfw-prod-cv-gw-api-cdn-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: rndkmframeworkapi-cert-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - dummy-pep-eiap-cgf-rndkmfw-prod-80.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pep-cgf-rnd-knowledge-management-rag-backend.eiap.gw01.aks02.eus.nonprod.azure.intra.pepsico.com
    - pep-cgf-rnd-knowledge-management-rag-frontend-prod.eiap.gw01.aks02.eus.nonprod.azure.intra.pepsico.com
    - pep-cgf-rnd-knowledge-management-rag-backend-prod.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pep-cgf-rnd-knowledge-management-rag-frontend-prod.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - rndkmframework-api.azure.intra.pepsico.com
    - rndkmframework.azure.intra.pepsico.com
    name: pep-eiap-cgf-rndkmfw-prod-cv-gw-http-80
    port:
      name: http-pep-eiap-cgf-rndkmfw-prod-cv-gw-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true

