apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  annotations: {}
  labels:
    app: pes-googleapi-service
  name: pes-googleapi-service-vs
  namespace: pep-eiap-pbna-cets-prod
spec:
  gateways:
  - pep-eiap-pbna-cets-prod/pep-eiap-pbna-cets-prod-cv-gw
  hosts:
  - pes-googleapi-service.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pes-googleapi-service.pep-eiap-pbna-cets-prod.svc.cluster.local
        port:
          number: 80
