    app: pep-eiap-pbna-lighth-prod-cv-web
  name: pep-eiap-pbna-lighth-prod-cv-web-vs
  namespace: pep-eiap-pbna-lighth-prod
spec:
  gateways:
  - pep-eiap-pbna-lighth-prod/pep-eiap-pbna-lighth-prod-cv-gw
  hosts:
  - pep-eiap-pbna-lighth-prod-cv.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
  http:
