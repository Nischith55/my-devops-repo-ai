apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: pep-eiap-pbna-sckm2-prod-cv-gw
  namespace: pep-eiap-pbna-sckm2-prod
spec:
  selector:
    istio: pep-eiap-ingress-gw01
  servers:
  - hosts:
    - dummy-passthrough-pep-eiap-pbna-sckm2-prod.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
    name: pep-eiap-pbna-sckm2-prod-cv-gw-tls-443
    port:
      name: https-pep-eiap-pbna-sckm2-prod-cv-gw-tls-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - dummy-pep-eiap-pbna-sckm2-prod.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pbna-supply-chain-km-backend-v2.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pbna-supply-chain-km-frontend-v2.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
    name: pep-eiap-pbna-sckm2-prod-cv-gw-https-443
    port:
      name: https-pep-eiap-pbna-sckm2-prod-cv-gw-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-eiap-prod-scus-global-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - dummy-pep-eiap-pbna-sckm2-prod-80.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pbna-supply-chain-km-backend-v2.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pbna-supply-chain-km-frontend-v2.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - cicchatbot.pepsico.com
    name: pep-eiap-pbna-sckm2-prod-cv-gw-http-80
    port:
      name: http-pep-eiap-pbna-sckm2-prod-cv-gw-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true
  - hosts:
    - cicchatbot.pepsico.com
    name: pep-eiap-pbna-sckm2-prod-cv-gw-3-https-443
    port:
      name: pep-eiap-pbna-sckm2-prod-cv-gw-3-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: cicchatbot-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE

