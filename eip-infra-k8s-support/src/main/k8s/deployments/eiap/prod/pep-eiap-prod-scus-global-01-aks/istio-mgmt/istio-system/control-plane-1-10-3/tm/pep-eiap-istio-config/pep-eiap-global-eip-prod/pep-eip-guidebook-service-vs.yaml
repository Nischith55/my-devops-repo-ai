---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-eip-guidebook-service-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-eip-guidebook-service.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    headers:
      request:
        remove:
          - "Content-Type"
        add:
          Content-Type: "Text/Plain"
    route:
    - destination:
        host: pep-eip-guidebook-service.pep-eiap-global-eip-prod.svc.cluster.local
        port:
          number: 80
