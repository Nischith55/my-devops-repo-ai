apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  annotations: {}
  labels:
    app: pbna-wmt
  name: pbna-wmt-vs
  namespace: pep-eiap-pbna-halo-prod
spec:
  gateways:
  - pep-eiap-pbna-halo-prod/pep-eiap-pbna-halo-prod-cv-gw
  hosts:
  - pbna-wmt.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pbna-wmt.pep-eiap-pbna-halo-prod.svc.cluster.local
        port:
          number: 80
