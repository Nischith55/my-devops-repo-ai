apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-och-catalogservice-etl-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-och-catalogservice-etl.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-och-catalogservice-etl.pep-eiap-och-na-prod.svc.cluster.local
        port:
          number: 80
    corsPolicy:
      allowOrigins:
      - exact: https://pep-och-ops-ui.global.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
      - exact: https://pepcommerce-ordermanagement.na.pepsico.com
      - exact: https://pep-och-ui.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
      allowMethods:
      - POST
      - GET
      - PUT
      - DELETE
      - OPTIONS
      - PATCH
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Content-Type
      - Link
      - Access-Control-Allow-Origin
      exposeHeaders:
      - x-total-count
      - x-source          