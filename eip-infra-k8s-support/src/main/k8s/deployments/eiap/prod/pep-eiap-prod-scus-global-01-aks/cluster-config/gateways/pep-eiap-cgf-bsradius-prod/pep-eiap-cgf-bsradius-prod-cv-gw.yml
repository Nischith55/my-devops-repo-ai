apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: pep-eiap-cgf-bsradius-prod-cv-gw
  namespace: pep-eiap-cgf-bsradius-prod
spec:
  selector:
    istio: pep-eiap-ingress-gw01
  servers:
  - hosts:
    - dummy-passthrough-pep-eiap-cgf-bsradius-prod.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
    name: pep-eiap-cgf-bsradius-prod-cv-gw-tls-443
    port:
      name: https-pep-eiap-cgf-bsradius-prod-cv-gw-tls-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - pep-eiap-cgf-bsradius-prod-cv.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - ops-central-digital-twin.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - ops-central-backend.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - ops-central-frontend.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - ops-central-services.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - ops-central-digital-workers.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - ops-central-mcp.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - ops-central-ai-factory.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
    name: pep-eiap-cgf-bsradius-prod-cv-gw-https-443
    port:
      name: https-pep-eiap-cgf-bsradius-prod-cv-gw-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-eiap-prod-scus-global-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - opscentral.mypepsico.com
    - pep-eiap-cgf-bsradius-prod-cv.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - ops-central-digital-twin.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - ops-central-backend.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - ops-central-frontend.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - ops-central-services.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - ops-central-digital-workers.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - ops-central-mcp.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - ops-central-ai-factory.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
    name: pep-eiap-cgf-bsradius-prod-cv-gw-http-80
    port:
      name: http-pep-eiap-cgf-bsradius-prod-cv-gw-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true
  - hosts:
    - opscentral.mypepsico.com
    name: pep-eiap-cgf-bsradius-prod-cv-gw-https-1-443
    port:
      name: https-pep-eiap-cgf-bsradius-prod-cv-gw-1-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-eiap-cgf-bsradius-prod-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE

