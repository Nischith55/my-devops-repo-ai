apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-eiap-cgf-nextgen-cle-ui-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - nextgencle.mypepsico.com
  - pep-eiap-cgf-nextgen-cle-ui.global.gw01.aks01.scus.prod.azure.intra.pepsico.com 
  tls:
  - match:
    - port: 443
      sniHosts:
      - pep-eiap-cgf-nextgen-cle-ui.global.gw01.aks01.scus.prod.azure.intra.pepsico.com 
      - nextgencle.mypepsico.com
    route:
    - destination:
        host: pep-eiap-cgf-nextgen-cle-ui.pep-eiap-cgf-cle-prod.svc.cluster.local
        port:
          number: 443