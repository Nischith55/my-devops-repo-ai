apiVersion: autoscaling/v1  
kind: HorizontalPodAutoscaler
metadata:
  name: pep-eiap-global-wsp-peopledetail-hpa  
  namespace: pep-eiap-global-wsp-prod 
spec:
  maxReplicas: 5 
  minReplicas: 1  
  scaleTargetRef:  
    apiVersion: apps/v1
    kind: Deployment
    name: peopledetail 
  targetCPUUtilizationPercentage: 70