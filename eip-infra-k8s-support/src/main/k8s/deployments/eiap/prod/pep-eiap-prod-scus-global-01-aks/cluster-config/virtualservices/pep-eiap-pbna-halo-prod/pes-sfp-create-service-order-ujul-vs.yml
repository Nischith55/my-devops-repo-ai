apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pes-sfp-create-service-order-ujul-vs
  namespace: pep-eiap-pbna-halo-prod
  labels:
      app: pes-sfp-create-service-order
spec:
  hosts:
  - serviceordercreation.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
  gateways:
  - pep-eiap-pbna-halo-prod/pep-eiap-pbna-halo-prod-cv-gw
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pes-sfp-create-service-order.pep-eiap-pbna-halo-prod.svc.cluster.local
        port:
          number: 80
    corsPolicy:
      allowOrigins:
      - exact: https://apim-pfna.qa.mypepsico.com
      - exact: https://apim-pfna.dev.mypepsico.com
      - exact: https://apim-pfna.preprod.mypepsico.com
      allowMethods:
      - GET
      - PUT
      - POST
      - DELETE
      - OPTIONS
  
      allowCredentials: true
      allowHeaders:
      - Accept
      - Access-Control-Allow-Credentials
      - Authorization
      - Allow
      - Host
      - Content-Type
      - Cookie
       
  