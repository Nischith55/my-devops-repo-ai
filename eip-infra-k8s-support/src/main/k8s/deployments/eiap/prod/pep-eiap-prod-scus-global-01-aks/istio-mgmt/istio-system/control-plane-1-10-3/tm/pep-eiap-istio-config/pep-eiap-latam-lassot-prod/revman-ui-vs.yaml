---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: revman-ui-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - revman-ui.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
  - revolutiom.mypepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: revman-ui.pep-eiap-latam-lassot-prod.svc.cluster.local
        port:
          number: 80