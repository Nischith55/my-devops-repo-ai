apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-eip-pepiris-adminapp-webapp-vmcl-vs
  namespace: pep-eiap-global-iaicv-plt-prod
  labels:
      app: pep-eip-pepiris-adminapp-webapp
spec:
  hosts:
  - pep-eip-pepiris-adminapp-webapp.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
  - pepirisportal.mypepsico.com
  gateways:
  - pep-eiap-global-iaicv-plt-prod/pep-eiap-global-iaicv-plt-prod-cv-gw
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-eip-pepiris-adminapp-webapp.pep-eiap-global-iaicv-plt-prod.svc.cluster.local
        port:
          number: 8000
  