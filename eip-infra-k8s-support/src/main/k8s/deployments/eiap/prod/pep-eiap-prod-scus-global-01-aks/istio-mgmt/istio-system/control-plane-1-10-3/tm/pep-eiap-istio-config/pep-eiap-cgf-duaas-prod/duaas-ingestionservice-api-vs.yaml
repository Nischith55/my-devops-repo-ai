apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: duaas-ingestionservice-api-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - duaas-ingestionservice-api.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: duaas-ingestionservice-api.pep-eiap-cgf-duaas-prod.svc.cluster.local
        port:
          number: 80