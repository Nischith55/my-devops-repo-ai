apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: pep-eiap-cgf-ckptgpt-prod-cv-gw
  namespace: pep-eiap-cgf-ckptgpt-prod
spec:
  selector:
    istio: pep-eiap-ingress-gw01
  servers:
  - hosts:
    - dummy-passthrough-pep-eiap-cgf-ckptgpt-prod.gw01.aks01.scus.prod.azure.intra.pepsico.com
    name: pep-eiap-cgf-ckptgpt-prod-cv-gw-tls-443
    port:
      name: https-pep-eiap-cgf-ckptgpt-prod-cv-gw-tls-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - dummy-pep-eiap-cgf-ckptgpt-prod-443.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pep-fpa-cockpit-genai-query-prod.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pep-fpa-cockpit-genai-query-prod.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pep-cpgpt-cgf-frontend.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pep-cpgpt-cgf-sql-gen.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pep-cpgpt-cgf-ingestion.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pep-cpgpt-cgf-backend.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pep-cpgpt-cgf-knowledgegraph.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pep-cpgpt-cgf-scheduled-jobs.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
    name: pep-eiap-cgf-ckptgpt-prod-cv-gw-https-443
    port:
      name: https-pep-eiap-cgf-ckptgpt-prod-cv-gw-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-eiap-prod-scus-global-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - dummy-pep-eiap-cgf-ckptgpt-prod-80.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pep-fpa-cockpit-genai-query-prod.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pep-fpa-cockpit-genai-query-prod.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pep-cpgpt-cgf-frontend.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - cockpitgpt.azure.intra.pepsico.com
    - pep-cpgpt-cgf-sql-gen.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pep-cpgpt-cgf-ingestion.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pep-cpgpt-cgf-backend.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pep-cpgpt-cgf-knowledgegraph.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pep-cpgpt-cgf-scheduled-jobs.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
    name: pep-eiap-cgf-ckptgpt-prod-cv-gw-http-80
    port:
      name: http-pep-eiap-cgf-ckptgpt-prod-cv-gw-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true
  - hosts:
    - cockpitgpt.azure.intra.pepsico.com
    name: pep-eiap-cgf-ckptgpt-prod-cv-gw-3-https-443
    port:
      name: pep-eiap-cgf-ckptgpt-prod-cv-gw-3-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: cockpitgpt-azure-intra-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE

