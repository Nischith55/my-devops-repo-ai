apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: cpe-cloud-onboarding-agenda-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - cpe-cloud-onboarding-agenda.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
  - cloudonboarding.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: cpe-cloud-onboarding-agenda.pep-eiap-cgf-cpefinops-prod.svc.cluster.local
        port:
          number: 80