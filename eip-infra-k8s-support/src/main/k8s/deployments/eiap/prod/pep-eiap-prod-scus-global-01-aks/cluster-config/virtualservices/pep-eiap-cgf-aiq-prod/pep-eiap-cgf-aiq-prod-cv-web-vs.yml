apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-eiap-cgf-aiq-prod-cv-web-vs
  namespace: pep-eiap-cgf-aiq-prod
  labels:
    app: pep-eiap-cgf-aiq-prod-cv-web
spec:
  hosts:
    - aiq.pepsico.com
    - pep-eiap-cgf-aiq-prod-cv.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
  gateways:
  - pep-eiap-cgf-aiq-prod/pep-eiap-cgf-aiq-prod-cv-gw
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host:  pep-eiap-cgf-aiq-prod-cv-web.pep-eiap-cgf-aiq-prod.svc.cluster.local
        port:
          number: 80