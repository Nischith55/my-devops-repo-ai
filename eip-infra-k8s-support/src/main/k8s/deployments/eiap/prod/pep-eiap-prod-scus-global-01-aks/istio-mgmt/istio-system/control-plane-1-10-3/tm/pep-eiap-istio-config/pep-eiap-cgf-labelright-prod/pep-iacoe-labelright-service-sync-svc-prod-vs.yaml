apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-iacoe-labelright-service-sync-svc-prod-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-iacoe-labelright-service-sync-svc-prod.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
