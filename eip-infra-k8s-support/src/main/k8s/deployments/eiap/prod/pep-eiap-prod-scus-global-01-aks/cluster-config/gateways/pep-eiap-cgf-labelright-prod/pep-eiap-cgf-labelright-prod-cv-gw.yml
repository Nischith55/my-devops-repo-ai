    - pep-iacoe-labelright-backend-ml-api-svc-prod.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - pep-iacoe-labelright-frontend-ui-svc-prod.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
