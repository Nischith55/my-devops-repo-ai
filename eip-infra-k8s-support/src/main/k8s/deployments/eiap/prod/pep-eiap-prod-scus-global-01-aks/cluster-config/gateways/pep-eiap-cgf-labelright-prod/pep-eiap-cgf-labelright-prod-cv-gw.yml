    - pep-iacoe-labelright-frontend-svc-prod.global.gw01.aks01.scus.prod.azure.intra.pepsico.com
    name: pep-eiap-cgf-labelright-prod-cv-gw-http-80
    port:
      name: http-pep-eiap-cgf-labelright-prod-cv-gw-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true
  - hosts:
    - labelright.pepsico.com
    name: pep-eiap-cgf-labelright-prod-cv-gw-1-https-443
    port:
      name: https-pep-eiap-cgf-labelright-prod-cv-gw-1-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-eiap-prod-scus-global-labelright-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
