---
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: filebeat
  namespace: pep-eiap-elastic-client-01
  labels:
    k8s-app: filebeat
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: filebeat
  labels:
    k8s-app: filebeat
rules:
- apiGroups: [""] # "" indicates the core API group
  resources:
  - namespaces
  - pods
  - nodes
  verbs:
  - get
  - watch
  - list
- apiGroups: ["apps"]
  resources:
    - replicasets
  verbs: ["get", "list", "watch"]
- apiGroups: ["batch"]
  resources:
    - jobs
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: filebeat
  # should be the namespace where filebeat is running
  namespace: pep-eiap-elastic-client-01
  labels:
    k8s-app: filebeat
rules:
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: filebeat-kubeadm-config
  namespace: pep-eiap-elastic-client-01
  labels:
    k8s-app: filebeat
rules:
  - apiGroups: [""]
    resources:
      - configmaps
    resourceNames:
      - kubeadm-config
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: filebeat
subjects:
- kind: ServiceAccount
  name: filebeat
  namespace: pep-eiap-elastic-askadaa-01
- kind: ServiceAccount
  name: filebeat
  namespace: pep-eiap-elastic-client-01
roleRef:
  kind: ClusterRole
  name: filebeat
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: filebeat
  namespace: pep-eiap-elastic-client-01
subjects:
  - kind: ServiceAccount
    name: filebeat
    namespace: pep-eiap-elastic-client-01
roleRef:
  kind: Role
  name: filebeat
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: filebeat-kubeadm-config
  namespace: pep-eiap-elastic-client-01
subjects:
  - kind: ServiceAccount
    name: filebeat
    namespace: pep-eiap-elastic-client-01
roleRef:
  kind: Role
  name: filebeat-kubeadm-config
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prod-scus-global-01-aks-logs-filebeat-config
  namespace: pep-eiap-elastic-client-01
data:

  K8S_CLUSTER_NAME: pep-eiap-prod-scus-global-01-aks

  filebeat-processor.yml: |

    processors:

    - add_fields:
        target: eiap
        fields:
          cluster_name: ${K8S_CLUSTER_NAME}

    - add_cloud_metadata:
        when:
          equals:
            event.module: system

    - add_host_metadata: {}

    - add_kubernetes_metadata:
        host: ${NODE_NAME}
        default_indexers:
          enabled: false
        default_matchers:
          enabled: false

    - add_fields:
        fields:
          ls-destination: "SCUS"
          index_name_add: ${K8S_CLUSTER_NAME}
    - add_tags:
        tags: ["Prod-SCUS-Shared", "retain-logs"]
    - script:
        lang: javascript
        source: >
          function process(event) {
            event.Put("fields.sn-application", "aks-pep-eiap-prod-scus-global-01-aks" + "-" + event.Get("kubernetes.namespace"));
            return event;
          }
    # ~~
    # Logging
    # ~~
    logging:
      level: INFO
      metrics:
        enabled: true

  filebeat.yml: |-

    # filebeat.inputs:
    #   - type: filestream
    #     id: cep-logs
    #     enabled: true
    #     paths:
    #      - /var/www/html/var/pepconnectlogs/MX/*.log
    #      - /var/www/html/var/pepconnectlogs/TR/*.log
    #      - /var/www/html/var/pepconnectlogs/CO/*.log
    #      - /var/www/html/var/pepconnectlogs/CL/*.log
    #      - /var/www/html/var/pepconnectlogs/AR/*.log        
    #     fields:
    #       application: "cep-production" 
    #     fields_under_root: true

    filebeat:

      modules:
      # - module: system
      #   syslog:
      #     enabled: false
      #     # Default: Configured paths: [/var/log/messages* /var/log/syslog*]
      #     var:
      #       paths:
      #       - /var/log/syslog
      #       - /var/log/messages
      #       - /var/log/waagent.log
      #       - /var/log/azure/*.log
      #   auth:
      #     enabled: true
      #     # Default: Configured paths: [/var/log/auth.log* /var/log/secure*]
      #     var:
      #       paths:
      #       - /var/log/auth.log

      autodiscover:
        providers:
        - type: kubernetes
          scope: node
          resource: pod
          node: ${NODE_NAME}
          hints:
            enabled: true
          templates:
            - condition:
                or:
                  - equals:
                      kubernetes.namespace: "pep-eiap-global-eiotp-prod"
              config:
                - type: container
                  paths:
                    - /var/log/containers/*${data.kubernetes.container.id}.log
                  # json.keys_under_root: true
                  # json.add_error_key: true
                  # json.message_key: message
            - condition:
                and:
                  - not:
                      equals:
                        kubernetes.namespace: "pep-eiap-global-eiotp-prod"
                  - not:
                      has_fields:
                  # ignore all logs from elastic pods since we are shipping
                  # it to monitoring cluster
                        - kubernetes.labels.common.k8s.elastic.co/type
              # ##
              # Container input has a lot of config options. Please refer to
              # https://www.elastic.co/guide/en/beats/filebeat/current/filebeat-input-container.html#filebeat-input-container
              # for all the options
              # ##
              config:
              - type: container
                paths:
                - /var/log/containers/*${data.kubernetes.container.id}.log
                # Supporting apparently pep java shared common library
                # output
                ### lines 111-115 commented request from Ankit garg INC09698168 #INC10528817
                multiline:
                  type: pattern
                  #pattern: '^(\[|[0-9]{4}-[0-9]{2}-[0-9]{2} )'
                  pattern: '^(INFO|DEBUG|ERROR|TRACE|WARN|CRITICAL|FATAL):|^\[[0-9]{4}-[0-9]{2}-[0-9]{2}|^(\[|[0-9]{4}-[0-9]{2}-[0-9]{2} )'
                  negate: true
                  match: after
    setup.template.name: "pep-pfna-aks-logs-template-less10gb-low"
    setup.template.pattern: "aks-pep-eiap-prod-scus-global-01-aks*"
    setup.ilm.enabled: false     
    output.elasticsearch:
        hosts: [https://c0b565d4570c433e91e8d9ff1bd1b170.privatelink.southcentralus.azure.elastic-cloud.com:9243]
        api_key: "icAorZQB3b76NnfoLvcP:6pNMi3PARbmWmEURDk3ipQ"
        index: "%{[fields][sn-application]}"
        worker: 6
        bulk_max_size: 2000
        timeout: 300s
        ssl.verification_mode: none
               

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: &app_name prod-scus-global-01-aks-logs-filebeat
  namespace: pep-eiap-elastic-client-01
  labels:
    app.kubernetes.io/name: *app_name
    app.kubernetes.io/version: &vers 8.19.11
    app: *app_name
    # match the  ES server version (beats is not backward compatible)
    version: *vers
spec:

  selector:
    matchLabels:
      app.kubernetes.io/name: *app_name
      app.kubernetes.io/version: *vers

  template:

    metadata:
      labels:
        app.kubernetes.io/name: *app_name
        app.kubernetes.io/version: *vers

    spec:
      hostAliases:
      - ip: "172.20.79.12"
        hostnames:
        - "c0b565d4570c433e91e8d9ff1bd1b170.privatelink.southcentralus.azure.elastic-cloud.com"

      # Run only on linux nodes, not that we have non linux nodes :)
      nodeSelector:
        #kubernetes.io/os: linux
        elastic-pool: shared_elastic
      tolerations:
      - operator: Exists

      serviceAccountName: filebeat
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 0

      # ~~~
      # All volumes
      # ~~~
      volumes:

      # PEP: all in one configMap (using projections)
      - name: config-projected
        projected:
          # 0644 -> 420, 0600 -> 384
          defaultMode: 384
          sources:

          # pep-ca-certs-config
          - configMap:
              name: pep-ca-certs-config
              optional: false
              items:
                - key: PepsiCoCA01.pem
                  # must be relative
                  path: etc/certs/PepsiCoCA01.pem
                - key: PepsiCoRootCA.pem
                  # must be relative
                  path: etc/certs/PepsiCoRootCA.pem

          - configMap:
              name: &beats_config prod-scus-global-01-aks-logs-filebeat-config
              optional: false
              items:
                - key: filebeat.yml
                  # must be relative
                  path: etc/beat.yml
                - key: filebeat-processor.yml
                  # must be relative
                  path: etc/beat-processor-config.yml

      - name: varlibdockercontainers
        hostPath:
          path: /var/lib/docker/containers

      - name: varlog
        hostPath:
          path: /var/log

      - name: varwwwhtml-pepconnect-b2b-logs
        persistentVolumeClaim:
          claimName: pepconnect-b2b-logs-elastic-pvc

      # data folder stores a registry of read status for all files,
      # so we don't send everything again on a Filebeat pod restart
      - name: data
        hostPath:
          path: /var/lib/pep-eiap-elastic-client-01/prod-scus-global-01-aks-logs-filebeat/filebeat-data
          type: DirectoryOrCreate

      - name: dockersock
        hostPath:
          path: /var/run/docker.sock

      containers:
      - name: filebeat
        image: docker.elastic.co/beats/filebeat:8.19.11
        args:
        - --environment
        - container
        - -e
        - -c
        - /projected/etc/beat-processor-config.yml
        - -c
        - /projected/etc/beat.yml

        resources:
          requests:
            # cpu: 200m
            memory: 512Mi

        env:

        # All environment variables from beats-shared-env-config
        - name: K8S_CLUSTER_NAME
          valueFrom:
            configMapKeyRef:
              name: *beats_config
              key: K8S_CLUSTER_NAME

        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName

        - name: NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP

        volumeMounts:

        # PEP:
        - name: config-projected
          # where it is mounted
          mountPath: /projected
          readOnly: true

        - name: data
          mountPath: /usr/share/filebeat/data

        - name: varlibdockercontainers
          mountPath: /var/lib/docker/containers
          readOnly: true

        - name: varlog
          mountPath: /var/log
          readOnly: true

        - name: varwwwhtml-pepconnect-b2b-logs
          mountPath: /var/www/html/var/pepconnectlogs
          readOnly: true

        - name: dockersock
          mountPath: "/var/run/docker.sock"
