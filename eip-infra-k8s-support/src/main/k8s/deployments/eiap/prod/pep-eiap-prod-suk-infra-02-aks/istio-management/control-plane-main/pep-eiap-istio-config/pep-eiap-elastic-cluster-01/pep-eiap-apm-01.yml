---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-eiap-apm-01
  namespace: pep-eiap-istio-config
spec:
  gateways:
    - istio-system/istio-in-gateway-01
  hosts:
  - pep-eiap-apm-01.infra.gw01.aks02.suk.prod.azure.intra.pepsico.com
  # TLS routes will be applied to platform service ports named 'https-',
  # 'tls-', unterminated gateway ports using HTTPS/TLS protocols (i.e.
  # with "passthrough" TLS mode) and service entry ports using
  # HTTPS/TLS protocols.
  tls:
    - match:
      - port: 443
        sniHosts:
          - pep-eiap-apm-01.infra.gw01.aks02.suk.prod.azure.intra.pepsico.com

      route:
        # IMPORTANT: if adding another node in different zone please add it
        # here with appropriate weight
        - destination:
            host: cluster-01-apm-http.pep-eiap-elastic-cluster-01.svc.cluster.local
            port:
              number: 8200
          weight: 100