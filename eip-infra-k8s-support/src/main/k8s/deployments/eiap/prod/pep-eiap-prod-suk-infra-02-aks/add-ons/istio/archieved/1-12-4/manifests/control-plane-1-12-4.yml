---
apiVersion: install.istio.io/v1alpha1
kind: IstioOperator
metadata:
  name: control-plane-1-12-4
  namespace: istio-system
spec:
  profile: minimal
  tag: "1.12.4"

  # If namespace is set here then make sure:
  # - You must also set values.global.istioNamespace
  # Otherwise:
  # - it will use the namespace of the CR
  # namespace: istio-system

  # revision (IMPORTANT: change in validatingWebHookConfiguration)
  revision: "1-12-4"

  meshConfig:
    proxyListenPort: 15001
    connectTimeout: 10s
    protocolDetectionTimeout: 5s

    ingressService: pep-eiap-ingress-gw01
    ingressSelector: pep-eiap-ingress-gw01

    accessLogFile: /dev/stdout

    # # Format for the proxy access log Empty value results in proxy’s
    # # default access log format
    # accessLogFormat:
    accessLogEncoding: TEXT

    enableAutoMtls: true

    defaultServiceExportTo:
      - "*"
    defaultVirtualServiceExportTo:
      - "*"
    defaultDestinationRuleExportTo:
      - "*"
    rootNamespace: pep-eiap-istio-config

    h2UpgradePolicy: DO_NOT_UPGRADE

    enablePrometheusMerge: true

    # outboundTrafficPolicy:
    #   mode: REGISTRY_ONLY

    defaultConfig:

      statusPort: 15020

      drainDuration: 45s

      parentShutdownDuration: 60s

      terminationDrainDuration: 5s

      proxyAdminPort: 15000

      controlPlaneAuthPolicy: MUTUAL_TLS

      # proxyMetadata:
      #   # Enable basic DNS proxying
      #   ISTIO_META_DNS_CAPTURE: "true"

  # ##
  # Components to enable or disable
  # ##
  components:

    #: Base Component (type:  BaseComponentSpec)
    # Configuration for base component.
    base:
      enabled: true

    cni:
      enabled: true

    #: Pilot Component
    # type: ComponentSpec
    pilot:
      enabled: true
      k8s:
        hpaSpec:
          minReplicas: 3
          maxReplicas: 24
        nodeSelector:
          kubernetes.azure.com/mode: system
          kubernetes.io/os: linux
        tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
        overlays:

        - kind: Deployment
          name: istiod-1-12-4
          patches:
          - path: spec.template.spec.topologySpreadConstraints
            value:
            - labelSelector:
                matchLabels:
                  operator.istio.io/component: Pilot
              maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: DoNotSchedule

  values:
# When installing revisioned control planes with the CNI component enabled
# values.istio_cni.enabled needs to be set, so that sidecar injector does not inject
# the istio-init init container  
    istio_cni:
      enabled: true
# excluding istio cni operations from istio-system and kube-system namespaces
    cni:
      excludeNamespaces:
       - istio-system
       - kube-system
      logLevel: info
# Disable probe rewrite globally
    # sidecarInjectorWebhook:
    #   rewriteAppHTTPProbe: false
# Setting resource limits and requests for istio-proxy
    global:
      proxy:
        holdApplicationUntilProxyStarts: true
    #     resources:
    #       requests:
    #         memory: 128Mi
    #         cpu: 100m
    #       limits:
    #         memory: 256Mi
    #         cpu: 250m
