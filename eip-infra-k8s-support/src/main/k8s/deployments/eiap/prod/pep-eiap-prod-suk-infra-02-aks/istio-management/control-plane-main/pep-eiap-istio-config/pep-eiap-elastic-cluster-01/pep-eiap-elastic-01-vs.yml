---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-eiap-elastic-01-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
    - istio-system/istio-in-gateway-01
  hosts:
  - pep-eiap-elastic-01.infra.gw01.aks02.suk.prod.azure.intra.pepsico.com
  tls:
    - match:
      - port: 443
        sniHosts:
          - pep-eiap-elastic-01.infra.gw01.aks02.suk.prod.azure.intra.pepsico.com
      route:
        - destination:
            host: cluster-01-es-coordinator-nodes.pep-eiap-elastic-cluster-01.svc.cluster.local
            port: 
              number: 9200
