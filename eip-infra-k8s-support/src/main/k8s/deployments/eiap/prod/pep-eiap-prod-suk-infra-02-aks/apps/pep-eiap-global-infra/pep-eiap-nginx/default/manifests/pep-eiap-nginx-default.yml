apiVersion: v1
kind: Service
metadata:
  labels:
    app: pep-eiap-nginx
  name: pep-eiap-nginx
  namespace: pep-eiap-global-infra
spec:
  ports:
  - name: http-8080
    port: 8080
    protocol: TCP
    targetPort: 8080
  selector:
    app: pep-eiap-nginx
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: pep-eiap-nginx
  name: pep-eiap-nginx
  namespace: pep-eiap-global-infra
spec:
  progressDeadlineSeconds: 600
  replicas: 2
  selector:
    matchLabels:
      app: pep-eiap-nginx
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: pep-eiap-nginx
    spec:
      containers:
      - command:
        - sudo
        - nginx
        image: pepeiapnonprodcommonacr.azurecr.io/pep/eiap/infra/utils/admin-utils/eiap-nginx:ubuntu-18.04-2021.02.15
        imagePullPolicy: Always
        name: pep-eiap-nginx
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - mountPath: /secrets
          name: all-gw-secrets
          readOnly: true
      imagePullSecrets:
      - name: pep-eiap-svc-eiap-infra-sp-regcred
      securityContext:
        fsGroup: 1337
        runAsGroup: 1337
        runAsUser: 1337
      volumes:
      - name: all-gw-secrets
        projected:
          defaultMode: 256
          sources:
          - secret:
              items:
              - key: tls.crt
                path: gw01-tls.crt
              - key: tls.key
                path: gw01-tls.key
              name: pep-eiap-prod-suk-infra-02-aks-gw01-tls
          - secret:
              items:
              - key: tls.crt
                path: gw02-tls.crt
              - key: tls.key
                path: gw02-tls.key
              name: pep-eiap-prod-suk-infra-02-aks-gw02-tls
