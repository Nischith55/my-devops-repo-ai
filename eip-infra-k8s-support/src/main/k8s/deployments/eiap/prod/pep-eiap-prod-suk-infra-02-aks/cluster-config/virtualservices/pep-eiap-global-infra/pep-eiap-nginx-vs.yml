apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  annotations: {}
  labels:
    app: pep-eiap-nginx
  name: pep-eiap-nginx-vs
  namespace: pep-eiap-global-infra
spec:
  gateways:
  - pep-eiap-global-infra/pep-eiap-global-infra-cv-gw
  hosts:
  - pep-eiap-nginx-curl.infra.gw01.aks02.suk.prod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-eiap-nginx.pep-eiap-global-infra.svc.cluster.local
        port:
          number: 8080
