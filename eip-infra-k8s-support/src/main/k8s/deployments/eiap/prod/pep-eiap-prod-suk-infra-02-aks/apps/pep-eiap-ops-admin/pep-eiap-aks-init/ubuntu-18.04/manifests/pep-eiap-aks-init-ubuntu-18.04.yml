apiVersion: v1
data:
  copy-sysctl.sh: |-
    #!/usr/bin/env bash
    set -eu
    ROOT_MOUNT_DIR="${ROOT_MOUNT_DIR:-/root}"
    eiap_sysctl_file=zzz-sysctl-aks-eiap.conf
    cp -p /tmp/${eiap_sysctl_file} /root/etc/sysctl.d/${eiap_sysctl_file}
    # reload all settings in ubuntu
    chroot ${ROOT_MOUNT_DIR} sysctl --load=/etc/sysctl.d/${eiap_sysctl_file} || true
    #FROM README# chroot ${ROOT_MOUNT_DIR} /usr/sbin/service procps start || true
  zzz-sysctl-aks-eiap.conf: |-
    # ##
    # IMPORTANT: Kubernetes has moved to safe and unsafe (namespaced) sysctl.
    # Do NOT mess around with net.* as it will not be inherited by pods.
    # This is mainly for nodelevel tuning
    #
    # ##

    # 65530 - 262144  65530
    vm.max_map_count=262144
    #: ORIG: 3000, flush 5 secs instead of 30 secs
    vm.dirty_expire_centisecs = 500
    # 0 - 100 60
    vm.swappiness=0
    # default: 3284687
    fs.file-max=8388608
    # 65536 - 6553500 (default: 65536)
    fs.aio-max-nr=1048576
    # 8192 - 20000500 (default:1048576)
    fs.nr_open=15728640
    # 4096 - 3240000  def:16384
    net.core.somaxconn=2097152
    # 1000 - 3240000  1000
    net.core.netdev_max_backlog=1048576
    # 212992 - 134217728  212992 (ours: 30mb)
    net.core.rmem_max=31457280
    # 20480 - 4194304 20480
    net.core.optmem_max=2097152
    # 128 - 3240000 16384
    net.ipv4.tcp_max_syn_backlog=65536
    # 131072 - 589824 131072
    net.netfilter.nf_conntrack_max=262144
    # 65536 - 147456  65536
    net.netfilter.nf_conntrack_buckets=98304
    # Default is 2: IMPORTANT please monitor this
    net.ipv4.tcp_tw_reuse=1
    #: this effects nproc as PID's wrap (max for 32bit and default is 32768)
    kernel.pid_max=262144
kind: ConfigMap
metadata:
  labels:
    app: pep-eiap-node-setup
  name: sysctl-conf
  namespace: pep-eiap-ops-admin
---
apiVersion: v1
data:
  timesyncd.conf: |
    #  This file is part of systemd.
    #
    #  systemd is free software; you can redistribute it and/or modify it
    #  under the terms of the GNU Lesser General Public License as published by
    #  the Free Software Foundation; either version 2.1 of the License, or
    #  (at your option) any later version.
    #
    # Entries in this file show the compile time defaults.
    # You can change settings by editing this file.
    # Defaults can be restored by simply deleting this file.
    #
    # See timesyncd.conf(5) for details.

    [Time]
    NTP=time.pbsg.pvt
    #FallbackNTP=ntp.ubuntu.com
    #RootDistanceMaxSec=5
    #PollIntervalMinSec=32
    #PollIntervalMaxSec=2048
  update-ntp.sh: |
    #!/usr/bin/env bash
    set -eu
    ROOT_MOUNT_DIR="${ROOT_MOUNT_DIR:-/root}"
    fs_root=/root
    timesyncd_conf=${fs_root}/etc/systemd/timesyncd.conf
    backup_file=${fs_root}/etc/systemd/timesyncd.conf.aks-orig
    if [[ ! -r ${backup_file} ]]; then
      cp -p ${timesyncd_conf} ${backup_file}
    fi
    cp -p /tmp/timesyncd.conf ${timesyncd_conf}
    # TODO: this will not work
    chroot "${ROOT_MOUNT_DIR}" systemctl restart systemd-timesyncd || true
kind: ConfigMap
metadata:
  labels:
    app: pep-eiap-node-setup
  name: timesyncd-conf
  namespace: pep-eiap-ops-admin
---
apiVersion: v1
data:
  setup-ubuntu.sh: |
    #!/usr/bin/env bash
    set -eu

    ROOT_MOUNT_DIR="${ROOT_MOUNT_DIR:-/root}"
    DEBIAN_FRONTEND=noninteractive

    pkg_mgr="apt-get -qq -y --no-install-recommends "

    # We use chroot to run the following commands in the host root
    # (mounted as the /root volume in the container)
    echo "~~ Disabling auto-update..."
    # Disable auto update
    chroot "${ROOT_MOUNT_DIR}" ${pkg_mgr} purge unattended-upgrades || true
    echo "~~ Disable auto-update done ..."

    echo "~~ Updating apt cache..."
    chroot "${ROOT_MOUNT_DIR}" ${pkg_mgr} update || true
    echo "~~ Done Updating apt cache.."
    # dist-upgrade
    chroot "${ROOT_MOUNT_DIR}" ${pkg_mgr} dist-upgrade || true
kind: ConfigMap
metadata:
  labels:
    app: pep-eiap-node-setup
  name: ubuntu-configure
  namespace: pep-eiap-ops-admin
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app: pep-eiap-node-setup
  name: pep-eiap-node-setup
  namespace: pep-eiap-ops-admin
spec:
  selector:
    matchLabels:
      app: pep-eiap-node-setup
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
      labels:
        app: pep-eiap-node-setup
        name: pep-eiap-node-setup
    spec:
      containers:
      - image: mcr.microsoft.com/oss/kubernetes/pause:1.4.0
        name: pause
      hostNetwork: true
      initContainers:
      - command:
        - /bin/bash
        - -c
        - |
          set -x
          # rm old eiap sysctl file
          rm -f /root/etc/sysctl.d/90-eiap-sysctl.conf || true
          /tmp/copy-sysctl.sh || true
          /tmp/update-ntp.sh || true
          /tmp/setup-ubuntu.sh || true
        env:
        - name: ROOT_MOUNT_DIR
          value: /root
        - name: NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        image: ubuntu:18.04
        imagePullPolicy: IfNotPresent
        name: aks-node-initialize
        securityContext:
          privileged: true
          runAsUser: 0
        volumeMounts:
        - mountPath: /root
          name: root-mount
        - mountPath: /tmp
          name: all-configmaps
          readOnly: true
      tolerations:
      - operator: Exists
      volumes:
      - hostPath:
          path: /
          type: Directory
        name: root-mount
      - name: all-configmaps
        projected:
          defaultMode: 420
          sources:
          - configMap:
              items:
              - key: zzz-sysctl-aks-eiap.conf
                path: zzz-sysctl-aks-eiap.conf
              - key: copy-sysctl.sh
                mode: 493
                path: copy-sysctl.sh
              name: sysctl-conf
          - configMap:
              items:
              - key: timesyncd.conf
                path: timesyncd.conf
              - key: update-ntp.sh
                mode: 493
                path: update-ntp.sh
              name: timesyncd-conf
          - configMap:
              items:
              - key: setup-ubuntu.sh
                mode: 493
                path: setup-ubuntu.sh
              name: ubuntu-configure
  updateStrategy:
    type: RollingUpdate
