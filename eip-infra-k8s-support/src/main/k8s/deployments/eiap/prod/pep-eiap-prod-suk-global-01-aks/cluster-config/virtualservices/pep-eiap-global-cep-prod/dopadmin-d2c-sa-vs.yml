apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  annotations: {}
  labels:
    app: dopadmin-d2c-sa
  name: dopadmin-d2c-sa-vs
  namespace: pep-eiap-global-cep-prod
spec:
  gateways:
  - pep-eiap-global-cep-prod/pep-eiap-global-cep-prod-cv-gw
  hosts:
  - pepcepa04.global.gw01.aks01.suk.prod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: dopadmin-d2c-sa.pep-eiap-global-cep-prod.svc.cluster.local
        port:
          number: 80
