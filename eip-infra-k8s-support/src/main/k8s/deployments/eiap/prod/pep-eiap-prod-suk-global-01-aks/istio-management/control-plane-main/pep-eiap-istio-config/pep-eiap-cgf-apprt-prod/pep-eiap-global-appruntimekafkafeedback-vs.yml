apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-eiap-global-appruntimekafkafeedback-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-eiap-global-appruntimekafkafeedback.global.gw01.aks01.suk.prod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
