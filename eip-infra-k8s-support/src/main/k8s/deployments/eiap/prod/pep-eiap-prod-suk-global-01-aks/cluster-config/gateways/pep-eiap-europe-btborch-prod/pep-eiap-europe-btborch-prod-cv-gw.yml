apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: pep-eiap-europe-btborch-prod-cv-gw
  namespace: pep-eiap-europe-btborch-prod
spec:
  selector:
    istio: pep-eiap-ingress-gw01
  servers:
  - hosts:
    - dummy-passthrough-pep-eiap-europe-btborch-prod.gw01.aks01.suk.prod.azure.intra.pepsico.com
    name: pep-eiap-europe-btborch-prod-cv-gw-tls-443
    port:
      name: https-pep-eiap-europe-btborch-prod-cv-gw-tls-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - dummy-pep-eiap-europe-btborch-prod-443.gw01.aks01.suk.prod.azure.intra.pepsico.com
    name: pep-eiap-europe-btborch-prod-cv-gw-https-443
    port:
      name: https-pep-eiap-europe-btborch-prod-cv-gw-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-eiap-prod-suk-global-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - dummy-pep-eiap-europe-btborch-prod-80.gw01.aks01.suk.prod.azure.intra.pepsico.com
    name: pep-eiap-europe-btborch-prod-cv-gw-http-80
    port:
      name: http-pep-eiap-europe-btborch-prod-cv-gw-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true

