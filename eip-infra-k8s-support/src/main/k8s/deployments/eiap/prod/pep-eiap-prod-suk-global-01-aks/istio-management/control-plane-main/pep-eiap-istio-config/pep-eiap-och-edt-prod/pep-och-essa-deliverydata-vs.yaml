apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-och-essa-deliverydate-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-och-essa-deliverydate.global.gw01.aks01.suk.prod.azure.intra.pepsico.com
  http:
  - match:
    - uri:
        prefix: /v1/api/deliverydate
      ignoreUriCase: true
    - uri:
        prefix: /v1/api/clereplydeliverydate
      ignoreUriCase: true
    - uri:
        prefix: /v1/api/ping
      ignoreUriCase: true
    route:
    - destination:
        host: pep-och-essa-deliverydate.pep-eiap-och-edt-prod.svc.cluster.local
        port:
          number: 80     