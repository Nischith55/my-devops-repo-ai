apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: pep-eiap-cgf-pepconnect-prod-cv-gw
  namespace: pep-eiap-cgf-pepconnect-prod
spec:
  selector:
    istio: pep-eiap-ingress-gw01
  servers:
  - hosts:
    - dummy-passthrough-pep-eiap-cgf-pepconnect-prod.gw01.aks01.suk.prod.azure.intra.pepsico.com
