apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-och-essa-order-reprocess-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-och-essa-order-reprocess.global.gw01.aks01.suk.prod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /v1/api
    route:
    - destination:
        host: pep-och-essa-order-reprocess.pep-eiap-och-edt-prod.svc.cluster.local
        port:
          number: 80
    corsPolicy:
      allowOrigins:
      - exact: https://pep-och-ui.global.gw01.aks01.suk.prod.azure.intra.pepsico.com
      allowMethods:
      - POST
      - GET
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
      allowCredentials: true
      allowHeaders:
      - Authorization
      - Link
      - Content-Type
      - Access-Control-Allow-Origin
      - x-source
      exposeHeaders:
      - x-total-count
