apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-eiap-dopui-ap-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pepcepf02.global.gw01.aks01.suk.prod.azure.intra.pepsico.com
  - pepcepf03.global.gw01.aks01.suk.prod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: dopui-ap.pep-eiap-global-cep-prod.svc.cluster.local
        port:
          number: 80        