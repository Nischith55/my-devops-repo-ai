apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-isalesteru-prod-rest-vs
  namespace: pep-eiap-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-isalesteru-prod-rest.global.gw01.aks01.suk.prod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-isalesteru-prod-rest.pep-eiap-europe-isalesteru-prod.svc.cluster.local
        port: 
          number: 9091