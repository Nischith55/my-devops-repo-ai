---
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: pep-infratools-test-test1-prod-cv-gw
  namespace: pep-infratools-test-test1-prod
spec:
  selector:
    istio: pep-infratools-ingress-gw01
  servers:
  - hosts:
    - "dummy-passthrough-pep-infratools-test-test1-prod.gw01.aks01.scus.prod.azure.intra.pepsico.com"
    name: "pep-infratools-test-test1-prod-cv-gw-tls-443"
    port:
      name: "https-pep-infratools-test-test1-prod-cv-gw-tls-443"
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - "dummy-pep-infratools-test-test1-prod-443.gw01.aks01.scus.prod.azure.intra.pepsico.com"
    name: "pep-infratools-test-test1-prod-cv-gw-https-443"
    port:
      name: "https-pep-infratools-test-test1-prod-cv-gw-443"
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: "pep-infratools-prod-scus-01-aks-gw01-tls"
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - "dummy-pep-infratools-test-test1-prod-80.gw01.aks01.scus.prod.azure.intra.pepsico.com"
    name: "pep-infratools-test-test1-prod-cv-gw-http-80"
    port:
      name: "http-pep-infratools-test-test1-prod-cv-gw-80"
      number: 80
      protocol: http
    tls:
      httpsRedirect: true
