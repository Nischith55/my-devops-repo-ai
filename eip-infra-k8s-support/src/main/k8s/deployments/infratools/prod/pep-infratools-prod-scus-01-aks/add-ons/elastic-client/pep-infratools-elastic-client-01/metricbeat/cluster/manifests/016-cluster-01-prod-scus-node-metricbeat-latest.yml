---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pep-infratools-prod-scus-01-aks-node-metricbeat-config
  namespace: pep-infratools-elastic-client-01
data:
  K8S_CLUSTER_NAME: pep-infratools-prod-scus-01-aks
  metricbeat-processor.yml: |
    
    # ---------------------------------------------------------------------
    # Common Processors across all beats deployment
    # ---------------------------------------------------------------------

    processors:
      - add_fields:
          fields:
            ls-destination: "SCUS"
            pep-aks-cluster: pep-infratools-prod-scus-01-aks
            sn-application: "HYPERAUTOMATION ANSIBLE TOWER PROD"
      - add_host_metadata: {}
      - add_kubernetes_metadata: {}

      - script:
          lang: javascript
          source: >
            function process(event) {
              event.Put("fields.legacy-index", "mb-aks-" + event.Get("fields.pep-aks-cluster"))
              return event;
            }

      - add_cloud_metadata:
          when:
            equals:
              event.module: system
      
    # ~~
    # Logging
    # ~~
    logging:
      level: INFO
      metrics:
        enabled: true
  metricbeat.yml: |
    
    # --------------------
    # All outputs
    # --------------------
    # output.logstash:
    #   hosts: ["pepwap22239.corp.pep.pvt:5070", "pepwap24760.corp.pep.pvt:5070", "pepwap24761.corp.pep.pvt:5070"]
    #   loadbalance: true
    #   worker: 3
    setup.template.name: "pep-metrics-template"
    setup.template.pattern: "metrics-*"
    setup.ilm.enabled: false  

    output.elasticsearch:
        hosts: [https://c0b565d4570c433e91e8d9ff1bd1b170.privatelink.southcentralus.azure.elastic-cloud.com:9243]
        api_key: "icAorZQB3b76NnfoLvcP:6pNMi3PARbmWmEURDk3ipQ"
        #index: "%{[fields][sn-application]}"
        index: "metrics-hyperautomation_ansible_tower_prod"
        #index: "aks-pep-dps-nonprod-eus-global-01-aks-%{[kubernetes.namespace]}"
        #index: "dps-nonprod-eus-global-01-%{[kubernetes][namespace]}"
        #index: "%{[fields][cluster_name]}-%{[kubernetes][namespace]}"
        #worker: 4
        #bulk_max_size: 3000
        ssl.verification_mode: none 
        timeout: 90s  
    # --------------------
    # send metricbeat metrics itself to our monitoring cluster
    # --------------------
    monitoring:
      # TODO: metricbeat daemonset does not allow internal collection. Please
      #  file a support request with elastic. (this is the error)
      #  - Exiting: more than one namespace configured accessing config
      # disabling it for now
      enabled: false
      # UNCOMMENT if working.
      # elasticsearch:
      #   hosts:
      #     - ${MONITORING_CLUSTER_URL}
      #   # IMPORTANT we are re-using the usernae and password
      #   username: ${MONITORING_CLUSTER_USER}
      #   password: ${MONITORING_CLUSTER_PASSWORD}
      #   ssl: *pep_ca_ssl
      # metrics:
      #   # default: 10s
      #   period: 1m
      # state:
      #   # default: 1m
      #   period: 2m

    # --------------------
    # enabling http endpoint since internal collection is not working
    # --------------------
    http:
      enabled: true
      host: 0.0.0.0
      port: 5066


    # ---------------------------------------------------------------------
    # Setup metricbeat configuration (Common K8S stuff)
    # ---------------------------------------------------------------------
    metricbeat:

      monitoring:
        enabled: false

      # ~~
      # modules
      # ~~

      modules:

      # +++
      # 1) System: Node/Host metrics
      # +++
      - module: system
        enabled: true
        period: 1m
        metricsets:
        - cpu
        - load
        - memory
        - network
        - process
        - process_summary
        - uptime
        - core
        process:
          include_top_n:
            by_cpu: 5
            by_memory: 5
        processes:
        - .*

      # +++
      # System: FileSystem metrics
      # +++
      - module: system
        period: 1m
        metricsets:
        - filesystem
        - fsstat
        processors:
        - drop_event:
            when:
              regexp:
                system:
                  filesystem:
                    mount_point: ^/(sys|cgroup|proc|dev|etc|host|lib)($|/)

      # +++
      # Kubernetes: kubelet (secure port)
      # +++
      - module: kubernetes
        enabled: true
        # IMPORTANT: when using module directly, it's still host (not node)
        host: ${NODE_NAME}
        period: 30s
        hosts:
        # change to local host kubelet secure port
        - https://${NODE_IP}:10250
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        ssl:
          verification_mode: none
        metricsets:
        - container
        - node
        - pod
        - system
        - volume

      # +++
      # Kubernetes: kube-proxy
      # +++
      # Currently `proxy` metricset is not supported on Openshift,
      - module: kubernetes
        enabled: true
        # IMPORTANT: when using module directly, it's still host (not node)
        host: ${NODE_NAME}
        period: 30s
        metricsets:
          - proxy
        hosts:
          - "${NODE_IP}:10249"

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: &app_name pep-infratools-prod-scus-01-aks-node-metricbeat
  namespace: pep-infratools-elastic-client-01
  labels:
    app.kubernetes.io/name: pep-infratools-prod-scus-01-aks-node-metricbeat
    app.kubernetes.io/version: 8.19.11
    app: pep-infratools-prod-scus-01-aks-node-metricbeat
    version: 8.19.11
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: pep-infratools-prod-scus-01-aks-node-metricbeat
      app.kubernetes.io/version: 8.19.11
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pep-infratools-prod-scus-01-aks-node-metricbeat
        app.kubernetes.io/version: 8.19.11
        app: pep-infratools-prod-scus-01-aks-node-metricbeat
        version: 8.19.11
        stack-monitoring.elastic.co/type: metricbeat-node
      annotations:
        co.elastic.logs/enabled: "true"
    spec:
      # PEP:
      # - Deployment run only on system node pool taints
      # - also lock down the node selector
      hostAliases:
      - ip: "172.20.79.12"
        hostnames:
        - "c0b565d4570c433e91e8d9ff1bd1b170.privatelink.southcentralus.azure.elastic-cloud.com"
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - operator: Exists
      terminationGracePeriodSeconds: 30
      serviceAccountName: metricbeat
      dnsPolicy: ClusterFirstWithHostNet
      hostNetwork: true
      automountServiceAccountToken: true
      securityContext:
        runAsUser: 0
      volumes:
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
        - name: dockersock
          hostPath:
            path: /var/run/docker.sock
        - name: proc
          hostPath:
            path: /proc
        - name: data
          hostPath:
            path: /var/lib/pep-infratools-elastic-client-01/pep-infratools-prod-scus-01-aks-node-metricbeat/metricbeat-data
            type: DirectoryOrCreate
        - name: config-projected
          projected:
            defaultMode: 384
            sources:
              - configMap:
                  name: pep-ca-certs-config
                  optional: false
                  items:
                    - key: PepsiCoCA01.pem
                      path: etc/certs/PepsiCoCA01.pem
                    - key: PepsiCoRootCA.pem
                      path: etc/certs/PepsiCoRootCA.pem
              - configMap:
                  name: &beats_config pep-infratools-prod-scus-01-aks-node-metricbeat-config
                  optional: false
                  items:
                    - key: metricbeat.yml
                      path: etc/beat.yml
                    - key: metricbeat-processor.yml
                      path: etc/beat-processor-config.yml
      containers:
        - name: metricbeat
          image: docker.elastic.co/beats/metricbeat:8.19.11
          args:
            - --environment
            - container
            - --system.hostfs=/hostfs
            - -e
            - -c
            - /projected/etc/beat-processor-config.yml
            - -c
            - /projected/etc/beat.yml
          ports:
            - name: monitoring
              containerPort: 5066
              protocol: TCP
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          volumeMounts:
            - name: config-projected
              mountPath: /projected
              readOnly: true
            - name: cgroup
              mountPath: /hostfs/sys/fs/cgroup
            - name: dockersock
              mountPath: /var/run/docker.sock
            - name: proc
              mountPath: /hostfs/proc
            - name: data
              mountPath: /usr/share/metricbeat/data
