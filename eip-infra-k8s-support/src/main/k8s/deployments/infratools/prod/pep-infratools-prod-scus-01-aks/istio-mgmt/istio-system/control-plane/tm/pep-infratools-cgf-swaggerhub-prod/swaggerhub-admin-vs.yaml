apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: swaggerhub-admin-vs
  namespace: pep-infratools-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - swaggerhub-admin.infratools.gw01.aks01.scus.prod.azure.intra.pepsico.com
  http:
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        port:
          number: 3000
        host: kotsadm.pep-infratools-cgf-swaggerhub-prod.svc.cluster.local