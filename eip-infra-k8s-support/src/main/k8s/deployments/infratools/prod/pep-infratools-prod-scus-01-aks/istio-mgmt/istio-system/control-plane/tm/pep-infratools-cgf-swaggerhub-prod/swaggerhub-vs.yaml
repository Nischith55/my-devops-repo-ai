apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: swaggerhub-vs
  namespace: pep-infratools-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - swaggerhub.infratools.gw01.aks01.scus.prod.azure.intra.pepsico.com
  - swaggerhub.mypepsico.com
  http:
  - match:
    - uri:
        prefix: /ws
    route:
    - destination:
        port:
          number: 80
        host: swaggerhub-notifications.pep-infratools-cgf-swaggerhub-prod.svc.cluster.local        
  - match:
    - uri:
        prefix: /v1/
    route:
    - destination:
        port:
          number: 80
        host: haproxy.pep-infratools-cgf-swaggerhub-prod.svc.cluster.local 
  - match:
    - uri:
        prefix: /virts/
    route:
    - destination:
        port:
          number: 80
        host: haproxy.pep-infratools-cgf-swaggerhub-prod.svc.cluster.local
  - match:
    - uri:
        prefix: /api/
    route:
    - destination:
        port:
          number: 80
        host: haproxy.pep-infratools-cgf-swaggerhub-prod.svc.cluster.local
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        port:
          number: 80
        host: swaggerhub-frontend.pep-infratools-cgf-swaggerhub-prod.svc.cluster.local        