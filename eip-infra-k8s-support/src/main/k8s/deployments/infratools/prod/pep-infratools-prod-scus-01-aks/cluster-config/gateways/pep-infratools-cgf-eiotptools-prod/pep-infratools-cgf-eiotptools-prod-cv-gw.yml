apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
    name: pep-infratools-cgf-eiotptools-prod-cv-gw
    namespace: pep-infratools-cgf-eiotptools-prod
spec:
    selector:
        istio: pep-infratools-ingress-gw01
    servers:
    -   hosts:
        - dummy-passthrough-pep-infratools-cgf-eiotptools-prod.gw01.aks01.scus.prod.azure.intra.pepsico.com
        name: pep-infratools-cgf-eiotptools-prod-cv-gw-tls-443
        port:
            name: https-pep-infratools-cgf-eiotptools-prod-cv-gw-tls-443
            number: 443
            protocol: https
        tls:
            cipherSuites:
            - AES128-GCM-SHA256
            - AES256-GCM-SHA384
            - ECDHE-ECDSA-AES128-SHA
            - ECDHE-ECDSA-AES256-SHA
            - ECDHE-ECDSA-AES128-GCM-SHA256
            - ECDHE-ECDSA-AES256-GCM-SHA384
            - ECDHE-RSA-AES128-GCM-SHA256
            - ECDHE-RSA-AES256-GCM-SHA384
            maxProtocolVersion: TLSV1_3
            minProtocolVersion: TLSV1_2
            mode: PASSTHROUGH
    -   hosts:
        - dummy-pep-infratools-cgf-eiotptools-prod-443.gw01.aks01.scus.prod.azure.intra.pepsico.com
        - edge-manager.infratools.gw01.aks01.scus.prod.azure.intra.pepsico.com
        - flowfuse.infratools.gw01.aks01.scus.prod.azure.intra.pepsico.com
        - mqtt.infratools.gw01.aks01.scus.prod.azure.intra.pepsico.com
        name: pep-infratools-cgf-eiotptools-prod-cv-gw-https-443
        port:
            name: https-pep-infratools-cgf-eiotptools-prod-cv-gw-443
            number: 443
            protocol: https
        tls:
            cipherSuites:
            - AES128-GCM-SHA256
            - AES256-GCM-SHA384
            - ECDHE-ECDSA-AES128-SHA
            - ECDHE-ECDSA-AES256-SHA
            - ECDHE-ECDSA-AES128-GCM-SHA256
            - ECDHE-ECDSA-AES256-GCM-SHA384
            - ECDHE-RSA-AES128-GCM-SHA256
            - ECDHE-RSA-AES256-GCM-SHA384
            credentialName: pep-infratools-prod-scus-01-aks-gw01-tls
            maxProtocolVersion: TLSV1_3
            minProtocolVersion: TLSV1_2
            mode: SIMPLE
    -   hosts:
        - dummy-pep-infratools-cgf-eiotptools-prod-80.gw01.aks01.scus.prod.azure.intra.pepsico.com
        - edge-manager.infratools.gw01.aks01.scus.prod.azure.intra.pepsico.com
        - flowfuse.infratools.gw01.aks01.scus.prod.azure.intra.pepsico.com
        - mqtt.infratools.gw01.aks01.scus.prod.azure.intra.pepsico.com
        name: pep-infratools-cgf-eiotptools-prod-cv-gw-http-80
        port:
            name: http-pep-infratools-cgf-eiotptools-prod-cv-gw-80
            number: 80
            protocol: http
        tls:
            httpsRedirect: true
