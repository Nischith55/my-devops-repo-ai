apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: istio-in-gateway-01
  namespace: istio-system
spec:
  selector:
    istio: pep-arize-ingress-gw01
  servers:
  - hosts:
    - '*.arize.gw01.aks01.scus.prod.azure.intra.pepsico.com'
    name: istio-in-gateway-01-wildcard-https-443
    port:
      name: https-wc-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-SHA
      - ECDHE-RSA-AES256-SHA
      credentialName: pep-arize-prod-scus-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - '*.arize.gw01.aks01.scus.prod.azure.intra.pepsico.com'
    - app.arize.mypepsico.com
    name: istio-in-gateway-01-wildcard-http-80
    port:
      name: http-wc-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true
  - hosts:
    - app.arize.mypepsico.com
    name: istio-in-gateway-01-arize-https-443
    port:
      name: https-arize-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-arize-server-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE