apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: receiver
  name: receiver-otlp-vs
  namespace: arize
spec:
  gateways:
  - arize/arize-cv-gw
  hosts:
  - receiver-otlp.arize.gw01.aks01.scus.prod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: receiver.arize.svc.cluster.local
        port:
          number: 4317
