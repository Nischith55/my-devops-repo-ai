---
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: arize-cv-gw
  namespace: arize
spec:
  selector:
    istio: pep-arize-ingress-gw01
  servers:
  - hosts:
    - "dummy-passthrough-arize.gw01.aks01.scus.prod.azure.intra.pepsico.com"
    name: "arize-cv-gw-tls-443"
    port:
      name: "https-arize-cv-gw-tls-443"
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - app-server.arize.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - receiver-otlp.arize.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - receiver.arize.gw01.aks01.scus.prod.azure.intra.pepsico.com
    name: "arize-cv-gw-https-443"
    port:
      name: "https-arize-cv-gw-443"
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: "pep-arize-prod-scus-01-aks-gw01-tls"
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - app.arize.mypepsico.com
    - app-server.arize.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - receiver.arize.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - receiver-otlp.arize.gw01.aks01.scus.prod.azure.intra.pepsico.com
    name: "arize-cv-gw-http-80"
    port:
      name: "http-arize-cv-gw-80"
      number: 80
      protocol: http
    tls:
      httpsRedirect: true
  - hosts:
    - app.arize.mypepsico.com
    name: "arize-cv-gw-1-https-443"
    port:
      name: "https-arize-cv-gw-1-443"
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-arize-server-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
