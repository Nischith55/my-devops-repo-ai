---
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: arize-spark-cv-gw
  namespace: arize-spark
spec:
  selector:
    istio: pep-arize-ingress-gw01
  servers:
  - hosts:
    - "dummy-passthrough-arize-spark.gw01.aks01.scus.prod.azure.intra.pepsico.com"
    name: "arize-spark-cv-gw-tls-443"
    port:
      name: "https-arize-spark-cv-gw-tls-443"
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - "dummy-arize-spark-443.gw01.aks01.scus.prod.azure.intra.pepsico.com"
    name: "arize-spark-cv-gw-https-443"
    port:
      name: "https-arize-spark-cv-gw-443"
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: "pep-arize-prod-scus-01-aks-gw01-tls"
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - "dummy-arize-spark-80.gw01.aks01.scus.prod.azure.intra.pepsico.com"
    name: "arize-spark-cv-gw-http-80"
    port:
      name: "http-arize-spark-cv-gw-80"
      number: 80
      protocol: http
    tls:
      httpsRedirect: true
