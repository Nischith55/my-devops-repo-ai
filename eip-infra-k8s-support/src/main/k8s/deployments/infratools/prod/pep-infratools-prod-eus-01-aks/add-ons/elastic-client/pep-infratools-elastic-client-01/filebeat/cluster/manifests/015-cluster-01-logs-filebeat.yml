# ##
# Non-ECK deployment.
# IMPORTANT:
# - This is meant to send all AKS logs to our primary cluster (cluster-01)
# ##
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pep-infratools-prod-eus-01-aks-logs-filebeat-config
  namespace: pep-infratools-elastic-client-01
data:

  # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  # metricbeat environment variables change here
  # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  K8S_CLUSTER_NAME: pep-infratools-prod-eus-01-aks

  # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  # metricbeat processor stuff
  # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  filebeat-processor.yml: |

    # ---------------------------------------------------------------------
    # Common Processors across all beats deployment
    # ---------------------------------------------------------------------

    processors:

    - add_fields:
        fields:
          cluster_name: ${K8S_CLUSTER_NAME}
          ls-destination: "EUS"
          pep-aks-cluster: ${K8S_CLUSTER_NAME}

    - add_cloud_metadata:
        when:
          equals:
            event.module: system

    - add_host_metadata: {}

    - add_kubernetes_metadata:
        # we need this since we disabled hostNetwork
        host: ${NODE_NAME}
        default_indexers:
          enabled: false
        default_matchers:
          enabled: false

    - add_tags:
        tags: ["Prod-EUS-Shared", "retain-logs"]
    - script:
        lang: javascript
        source: >
          function process(event) {
          event.Put("fields.sn-application", "aks-pep-infratools-prod-eus-01-aks" + "-" + event.Get("kubernetes.namespace"));

            
            return event;
          }
    # ~~
    # Logging
    # ~~
    logging:
      level: INFO
      metrics:
        enabled: true

  filebeat.yml: |-

    # --------------------
    # All outputs
    # IMPORTANT:
    # - This is for stack monitoring gather all ES, Beats etc.
    # - By default they go to monitoring-* index CANNOT configure it
    # --------------------

    # --------------------
    # Setup all index patterns
    # --------------------
    # --------------------
    # send metricbeat metrics itself to our monitoring cluster
    # --------------------
    # monitoring:
    #   enabled: true
    #   elasticsearch:
    #     hosts:
    #       - ${MONITORING_CLUSTER_URL}
    #     # IMPORTANT we are re-using the usernae and password
    #     username: ${MONITORING_CLUSTER_USERNAME}
    #     password: ${MONITORING_CLUSTER_PASSWORD}
    #     ssl: *pep_ca_ssl

    # --------------------
    # Setup filebeat configuration
    # --------------------
    filebeat:

      # ~~
      # All enabled modules. NOTE: This requires an ingest-node to be
      # available OTHERWISE it will fail!!!
      # ~~
      modules:
      - module: system
        syslog:
          enabled: true
          # Default: Configured paths: [/var/log/messages* /var/log/syslog*]
          var:
            paths:
            - /var/log/syslog
            - /var/log/messages
            - /var/log/waagent.log
            - /var/log/azure/*.log
        auth:
          enabled: true
          # Default: Configured paths: [/var/log/auth.log* /var/log/secure*]
          var:
            paths:
            - /var/log/auth.log

      # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
      #  autodiscover via hints (pod annotations)
      # NOTE: Only stack monitoring.
      # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
      autodiscover:
        providers:
        - type: kubernetes
          scope: node
          resource: pod
          node: ${NODE_NAME}
          hints:
            enabled: true
          templates:
            - condition:
                not:
                  has_fields:
                  # ignore all logs from elastic pods since we are shipping
                  # it to monitoring cluster
                  - kubernetes.labels.common.k8s.elastic.co/type
              # ##
              # Container input has a lot of config options. Please refer to
              # https://www.elastic.co/guide/en/beats/filebeat/current/filebeat-input-container.html#filebeat-input-container
              # for all the options
              # ##
              config:
              - type: container
                paths:
                - /var/log/containers/*${data.kubernetes.container.id}.log
                # Supporting apparently pep java shared common library
                # output
                multiline:
                  type: pattern
                  pattern: '^(\[|[0-9]{4}-[0-9]{2}-[0-9]{2} )'
                  negate: true
                  match: after
    setup.template.name: "pep-aks-logs-template"
    setup.template.pattern: "aks-*"
    
    setup.ilm.enabled: false     
    #setup.template.overwrite: true
    output.elasticsearch:
        hosts: [https://c0b565d4570c433e91e8d9ff1bd1b170.privatelink.southcentralus.azure.elastic-cloud.com:9243]
        api_key: "-Op1ipUBtMbxeTz3X0oS:8TirsYuVSTuAMHOlq06-Jw"
        index: "%{[fields][sn-application]}"
        worker: 2
        bulk_max_size: 500
        ssl.verification_mode: none
        timeout: 120s


---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: &app_name pep-infratools-prod-eus-01-aks-logs-filebeat
  namespace: pep-infratools-elastic-client-01
  labels:
    app.kubernetes.io/name: *app_name
    app.kubernetes.io/version: &vers 8.19.11
    app: *app_name
    # match the  ES server version (beats is not backward compatible)
    version: *vers
spec:

  selector:
    matchLabels:
      app.kubernetes.io/name: *app_name
      app.kubernetes.io/version: *vers

  template:

    metadata:
      labels:
        app.kubernetes.io/name: *app_name
        app.kubernetes.io/version: *vers

    spec:
      hostAliases:
      - ip: "172.25.237.37"
        hostnames:
        - "c0b565d4570c433e91e8d9ff1bd1b170.privatelink.southcentralus.azure.elastic-cloud.com"

      # Run only on linux nodes, not that we have non linux nodes :)
      nodeSelector:
        kubernetes.io/os: linux
      # PEP: DaemonSet we need to run it on EVERY node. so tolerate all
      # taints
      tolerations:
      - operator: Exists

      serviceAccountName: filebeat
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 0

      # ~~~
      # All volumes
      # ~~~
      volumes:

      # PEP: all in one configMap (using projections)
      - name: config-projected
        projected:
          # 0644 -> 420, 0600 -> 384
          defaultMode: 384
          sources:

          # pep-ca-certs-config
          - configMap:
              name: pep-ca-certs-config
              optional: false
              items:
                - key: PepsiCoCA01.pem
                  # must be relative
                  path: etc/certs/PepsiCoCA01.pem
                - key: PepsiCoRootCA.pem
                  # must be relative
                  path: etc/certs/PepsiCoRootCA.pem

          - configMap:
              name: &beats_config pep-infratools-prod-eus-01-aks-logs-filebeat-config
              optional: false
              items:
                - key: filebeat.yml
                  # must be relative
                  path: etc/beat.yml
                - key: filebeat-processor.yml
                  # must be relative
                  path: etc/beat-processor-config.yml

      - name: varlibdockercontainers
        hostPath:
          path: /var/lib/docker/containers

      - name: varlog
        hostPath:
          path: /var/log

      # data folder stores a registry of read status for all files,
      # so we don't send everything again on a Filebeat pod restart
      - name: data
        hostPath:
          path: /var/lib/pep-infratools-elastic-client-01/pep-infratools-prod-eus-01-aks-logs-filebeat/filebeat-data
          type: DirectoryOrCreate

      - name: dockersock
        hostPath:
          path: /var/run/docker.sock

      # ##
      # All Containers
      # ##
      containers:
      - name: filebeat
        image: docker.elastic.co/beats/filebeat:8.19.11
        args:
        - --environment
        - container
        - -e
        - -c
        - /projected/etc/beat-processor-config.yml
        - -c
        - /projected/etc/beat.yml
        # - -d
        # - "monitoring"
        # - index-management,processors

        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 200Mi

        env:

        # All environment variables from beats-shared-env-config
        - name: K8S_CLUSTER_NAME
          valueFrom:
            configMapKeyRef:
              name: *beats_config
              key: K8S_CLUSTER_NAME

        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName

        - name: NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP

        volumeMounts:

        # PEP:
        - name: config-projected
          # where it is mounted
          mountPath: /projected
          readOnly: true

        - name: data
          mountPath: /usr/share/filebeat/data

        - name: varlibdockercontainers
          mountPath: /var/lib/docker/containers
          readOnly: true

        - name: varlog
          mountPath: /var/log
          readOnly: true

        - name: dockersock
          mountPath: "/var/run/docker.sock"

