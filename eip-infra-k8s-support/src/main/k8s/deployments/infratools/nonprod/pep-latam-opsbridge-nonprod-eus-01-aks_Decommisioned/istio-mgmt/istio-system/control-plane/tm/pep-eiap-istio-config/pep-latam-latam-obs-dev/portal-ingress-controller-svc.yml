apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: portal-ingress-controller-svc-vs
  namespace: pep-latam-opsbridge-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - portal-ingress-controller-svc.latam.opsbridge.gw01.aks01.eus.nonprod.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /apphub
    - ignoreUriCase: true
      uri:
        prefix: /idm-admin
    route:
    - destination:
        host: portal-ingress-controller-svc.pep-latam-latam-obs-dev.svc.cluster.local
        port: 
          number: 5443