apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: pep-infratools-cgf-arize-dev-cv-gw
  namespace: pep-infratools-cgf-arize-dev
spec:
  selector:
    istio: pep-infratools-ingress-gw01
  servers:
  - hosts:
    - dummy-passthrough-pep-infratools-cgf-arize-dev.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    name: pep-infratools-cgf-arize-dev-cv-gw-tls-443
    port:
      name: https-pep-infratools-cgf-arize-dev-cv-gw-tls-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - app-server.arize.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - flightserver.arize.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - receiver.arize.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - grafana.arize.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - receiver-otlp.arize.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    name: pep-infratools-cgf-arize-dev-cv-gw-https-443
    port:
      name: https-pep-infratools-cgf-arize-dev-cv-gw-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-arize-nonprod-eus-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - app-server.arize.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - app.dev.arize.mypepsico.com
    - flightserver.arize.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - receiver.arize.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - grafana.arize.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - receiver-otlp.arize.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    name: pep-infratools-cgf-arize-dev-cv-gw-http-80
    port:
      name: http-pep-infratools-cgf-arize-dev-cv-gw-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true
  - hosts:
    - app.dev.arize.mypepsico.com
    name: pep-infratools-cgf-arize-dev-cv-gw-1-https-443
    port:
      name: https-pep-infratools-cgf-arize-dev-cv-gw-1-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-arize-dev-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE

