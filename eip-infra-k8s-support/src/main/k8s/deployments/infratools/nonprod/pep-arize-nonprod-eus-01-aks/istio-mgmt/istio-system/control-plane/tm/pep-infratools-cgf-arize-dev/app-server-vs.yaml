apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: app-server-vs
  namespace: pep-infratools-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - app-server.arize.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  - app.dev.arize.mypepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /auth/v2/
    route:
    - destination:
        host: auth-external-service.pep-infratools-cgf-arize-dev.svc.cluster.local
        port: 
          number: 443
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: app-server.pep-infratools-cgf-arize-dev.svc.cluster.local
        port: 
          number: 4040
      headers:
        response:
          remove:
          - X-Frame-Options