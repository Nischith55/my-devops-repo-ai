apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: reciever-vs
  namespace: pep-infratools-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - receiver.arize.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: receiver.pep-infratools-cgf-arize-dev.svc.cluster.local
        port: 
          number: 443