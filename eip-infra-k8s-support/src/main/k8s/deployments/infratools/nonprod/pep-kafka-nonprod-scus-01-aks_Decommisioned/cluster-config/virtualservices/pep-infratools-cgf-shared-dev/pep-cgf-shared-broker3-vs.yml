apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: undefined
  name: pep-cgf-shared-broker3-vs
  namespace: pep-infratools-cgf-shared-dev
spec:
  gateways:
  - pep-infratools-cgf-shared-dev/pep-infratools-cgf-shared-dev-cv-gw
  hosts:
  - b3.shared.kafka.gw01.aks01.scus.nonprod.azure.intra.pepsico.com
  tls:
  - match:
    - port: 443
      sniHosts:
      - b3.shared.kafka.gw01.aks01.scus.nonprod.azure.intra.pepsico.com
    route:
    - destination:
        host: kafka-3-internal.pep-infratools-cgf-shared-dev.svc.cluster.local
        port:
          number: 9092
