apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: pep-infratools-cgf-shared-dev-cv-gw
  namespace: pep-infratools-cgf-shared-dev
spec:
  selector:
    istio: pep-kafka-ingress-gw01
  servers:
  - hosts:
    - b0.shared.kafka.gw01.aks01.scus.nonprod.azure.intra.pepsico.com
    - b1.shared.kafka.gw01.aks01.scus.nonprod.azure.intra.pepsico.com
    - b2.shared.kafka.gw01.aks01.scus.nonprod.azure.intra.pepsico.com
    - b3.shared.kafka.gw01.aks01.scus.nonprod.azure.intra.pepsico.com
    - b4.shared.kafka.gw01.aks01.scus.nonprod.azure.intra.pepsico.com
    - controlcenter.shared.kafka.gw01.aks01.scus.nonprod.azure.intra.pepsico.com
    - kafka.shared.kafka.gw01.aks01.scus.nonprod.azure.intra.pepsico.com
    - replicator.shared.kafka.gw01.aks01.scus.nonprod.azure.intra.pepsico.com
    - zookeeper.shared.kafka.gw01.aks01.scus.nonprod.azure.intra.pepsico.com
    name: pep-infratools-cgf-shared-dev-cv-gw-tls-443
    port:
      name: https-pep-infratools-cgf-shared-dev-cv-gw-tls-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - dummy-pep-infratools-cgf-shared-dev-443.gw01.aks01.scus.nonprod.azure.intra.pepsico.com
    name: pep-infratools-cgf-shared-dev-cv-gw-https-443
    port:
      name: https-pep-infratools-cgf-shared-dev-cv-gw-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-kafka-nonprod-scus-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - dummy-pep-infratools-cgf-shared-dev-80.gw01.aks01.scus.nonprod.azure.intra.pepsico.com
    name: pep-infratools-cgf-shared-dev-cv-gw-http-80
    port:
      name: http-pep-infratools-cgf-shared-dev-cv-gw-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true

