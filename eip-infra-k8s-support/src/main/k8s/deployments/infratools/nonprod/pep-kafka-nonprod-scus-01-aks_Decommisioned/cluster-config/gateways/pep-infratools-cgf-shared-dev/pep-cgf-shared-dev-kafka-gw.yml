apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  labels:
    app.kubernetes.io/managed-by: Helm
  name: pep-cgf-shared-dev-kafka-gw
  namespace: pep-infratools-cgf-shared-dev
spec:
  selector:
    istio: pep-kafka-ingress-gw01
  servers:
  - hosts:
    - controlcenter.shared.kafka.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    port:
      name: http-kafka
      number: 80
      protocol: HTTP
    tls:
      httpsRedirect: true
  - hosts:
    - controlcenter.shared.kafka.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - schemaregistry.shared.kafka.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - kafkarestproxy.shared.kafka.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - ksql.shared.kafka.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - connect.shared.kafka.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - zookeeper.shared.kafka.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - kafka.shared.kafka.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - b0.shared.kafka.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - b1.shared.kafka.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - b2.shared.kafka.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - b3.shared.kafka.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - b4.shared.kafka.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    port:
      name: tls-kafka
      number: 443
      protocol: TLS
    tls:
      mode: PASSTHROUGH

