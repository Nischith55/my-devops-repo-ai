apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: undefined
  name: pep-cgf-kafka-qa-broker0-vs
  namespace: pep-infratools-test-kafka-qa
spec:
  gateways:
  - pep-infratools-test-kafka-qa/pep-infratools-test-kafka-qa-cv-gw
  hosts:
  - b0.kafka.kafka.gw01.aks01.scus.nonprod.azure.intra.pepsico.com
  tls:
  - match:
    - gateways:
      - pep-infratools-test-kafka-qa/pep-cgf-kafka-qa-kafka-gw
      port: 443
      sniHosts:
      - b0.kafka.kafka.gw01.aks01.scus.nonprod.azure.intra.pepsico.com
    route:
    - destination:
        host: kafka-0-internal.pep-infratools-test-kafka-qa.svc.cluster.local
        port:
          number: 9092
