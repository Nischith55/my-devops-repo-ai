apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: controlcenter
  name: pep-cgf-kafka-controlcenter-vs
  namespace: pep-infratools-test-kafka-qa
spec:
  gateways:
  - pep-infratools-test-kafka-qa/pep-infratools-test-kafka-qa-cv-gw
  hosts:
  - controlcenter.kafka.kafka.gw01.aks01.scus.nonprod.azure.intra.pepsico.com
  tls:
  - match:
    - port: 443
      sniHosts:
      - controlcenter.kafka.kafka.gw01.aks01.scus.nonprod.azure.intra.pepsico.com
    route:
    - destination:
        host: controlcenter.pep-infratools-test-kafka-qa.svc.cluster.local
        port:
          number: 9021
