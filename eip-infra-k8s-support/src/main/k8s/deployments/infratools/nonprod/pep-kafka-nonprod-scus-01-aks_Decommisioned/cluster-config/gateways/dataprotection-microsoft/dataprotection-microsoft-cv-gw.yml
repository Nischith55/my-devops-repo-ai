apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: dataprotection-microsoft-cv-gw
  namespace: dataprotection-microsoft
spec:
  selector:
    istio: pep-kafka-ingress-gw01
  servers:
  - hosts:
    - dummy-passthrough-dataprotection-microsoft.gw01.aks01.scus.nonprod.azure.intra.pepsico.com
    name: dataprotection-microsoft-cv-gw-tls-443
    port:
      name: https-dataprotection-microsoft-cv-gw-tls-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - dummy-dataprotection-microsoft-443.gw01.aks01.scus.nonprod.azure.intra.pepsico.com
    name: dataprotection-microsoft-cv-gw-https-443
    port:
      name: https-dataprotection-microsoft-cv-gw-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-kafka-nonprod-scus-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - dummy-dataprotection-microsoft-80.gw01.aks01.scus.nonprod.azure.intra.pepsico.com
    name: dataprotection-microsoft-cv-gw-http-80
    port:
      name: http-dataprotection-microsoft-cv-gw-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true

