apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: undefined
  name: pep-kafka-nginx-vs
  namespace: pep-kafka-istio-config
spec:
  gateways:
  - pep-kafka-istio-config/pep-kafka-istio-config-cv-gw
  hosts:
  - pep-kafka-nginx-curl.kafka.gw01.aks01.scus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-kafka-nginx.pep-kafka-infra-dev.svc.cluster.local
        port:
          number: 8080
