apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-kafka-nginx-vs
  namespace: pep-kafka-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-kafka-nginx-curl.kafka.gw01.aks01.scus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-kafka-nginx.pep-kafka-infra-dev.svc.cluster.local
        port: 
          number: 8080