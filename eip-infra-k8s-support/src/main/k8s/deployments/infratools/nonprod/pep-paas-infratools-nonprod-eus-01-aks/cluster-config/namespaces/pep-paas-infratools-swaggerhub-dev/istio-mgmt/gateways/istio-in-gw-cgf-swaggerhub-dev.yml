apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: istio-in-gw-cgf-swaggerhub-dev
  namespace: pep-infratools-cgf-swaggerhub-dev
spec:
  selector:
    istio: pep-paas-infratools-ingress-gw01
  servers:
  - hosts:
    - swaggerhub.dev.mypepsico.com 
    name: cgf-swaggerhub-dev-https-443
    port:
      name: https-swaggerhub-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-infratool-paas-nonprod-eus-swaggerhub-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - swaggerhub.dev.mypepsico.com 
    name: cgf-swaggerhub-dev-http-80
    port:
      name: http-swaggerhub-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true  