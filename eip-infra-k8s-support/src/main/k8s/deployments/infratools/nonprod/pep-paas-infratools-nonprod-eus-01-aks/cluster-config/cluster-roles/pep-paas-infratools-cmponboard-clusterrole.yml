---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pep-paas-infratools-cmponboard-clusterrole
rules: 
-   apiGroups:
    - ''
    resources:
    - namespaces
    - serviceaccounts
    verbs:
    - create
    - list
    - get
    - delete
-   apiGroups:
    - 'rbac.authorization.k8s.io'
    resources:
    - rolebindings
    verbs:
    - create
    - list
    - get
    - delete
-   apiGroups:
    - 'rbac.authorization.k8s.io'
    resources:
    - clusterroles
    verbs:
    - bind
    resourceNames:
    - pep-paas-infratools-developer-clusterrole
    - pep-paas-infratools-springcloudk8s-clusterrole 
-   apiGroups:
    - ''
    resources:
    - pods
    verbs:
    - create
    - list
    - get
    - patch
    - update
    - watch
-   apiGroups:
    - 'apps'
    resources:
    - deployments
    verbs:
    - create
    - list
    - get
    - patch
    - update
    - delete
-   apiGroups:
    - ''
    resources:
    - services
    verbs:
    - create
    - list
    - get
    - patch
    - update
    - delete
-   apiGroups:
    - 'networking.istio.io'
    resources:
    - virtualservices
    - gateways
    verbs:
    - create
    - list
    - get
    - patch
    - update
    - delete
-   apiGroups:
    - ''
    resources:
    - secrets
    verbs:
    - create
    - list
    - get
    - patch
    - update
    - watch
    - delete
