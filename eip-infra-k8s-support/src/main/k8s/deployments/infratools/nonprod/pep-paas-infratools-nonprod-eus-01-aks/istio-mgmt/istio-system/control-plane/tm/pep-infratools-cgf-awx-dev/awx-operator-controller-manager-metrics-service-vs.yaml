apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: awx-operator-controller-manager-metrics-service-vs
  namespace: pep-paas-infratools-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - awx-operator-controller-manager.infratools.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: awx-operator-controller-manager-metrics-service.pep-infratools-cgf-awx-dev.svc.cluster.local
        port: 
          number: 8443