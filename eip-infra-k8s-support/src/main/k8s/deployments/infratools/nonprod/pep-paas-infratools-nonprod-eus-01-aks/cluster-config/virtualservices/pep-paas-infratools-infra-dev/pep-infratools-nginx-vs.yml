apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-paas-infratools-nginx
  name: pep-infratools-nginx-vs
  namespace: pep-paas-infratools-infra-dev
spec:
  gateways:
  - pep-paas-infratools-infra-dev/pep-paas-infratools-infra-dev-cv-gw
  hosts:
  - pep-infratools-nginx-curl.infratools.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-paas-infratools-nginx.pep-paas-infratools-infra-dev.svc.cluster.local
        port:
          number: 8080
