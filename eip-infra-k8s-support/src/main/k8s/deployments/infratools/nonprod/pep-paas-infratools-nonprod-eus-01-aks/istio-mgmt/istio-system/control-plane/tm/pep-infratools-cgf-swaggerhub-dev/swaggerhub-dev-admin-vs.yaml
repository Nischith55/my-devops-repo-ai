apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: swaggerhub-dev-admin-vs
  namespace: pep-paas-infratools-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - swaggerhub-dev-admin.infratools.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        port:
          number: 3000
        host: kotsadm.pep-infratools-cgf-swaggerhub-dev.svc.cluster.local