apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: swaggerhub-dev-customdomain-vs
  namespace: pep-infratools-cgf-swaggerhub-dev
spec:
  gateways:
  - pep-infratools-cgf-swaggerhub-dev/istio-in-gw-cgf-swaggerhub-dev
  hosts:
  - swaggerhub.dev.mypepsico.com
  http:
  - match:
    - uri:
        prefix: /ws
    route:
    - destination:
        port:
          number: 80
        host: swaggerhub-notifications.pep-infratools-cgf-swaggerhub-dev.svc.cluster.local        
  - match:
    - uri:
        prefix: /v1/
    route:
    - destination:
        port:
          number: 80
        host: haproxy.pep-infratools-cgf-swaggerhub-dev.svc.cluster.local 
  - match:
    - uri:
        prefix: /virts/
    route:
    - destination:
        port:
          number: 80
        host: haproxy.pep-infratools-cgf-swaggerhub-dev.svc.cluster.local
  - match:
    - uri:
        prefix: /api/
    route:
    - destination:
        port:
          number: 80
        host: haproxy.pep-infratools-cgf-swaggerhub-dev.svc.cluster.local
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        port:
          number: 80
        host: swaggerhub-frontend.pep-infratools-cgf-swaggerhub-dev.svc.cluster.local        