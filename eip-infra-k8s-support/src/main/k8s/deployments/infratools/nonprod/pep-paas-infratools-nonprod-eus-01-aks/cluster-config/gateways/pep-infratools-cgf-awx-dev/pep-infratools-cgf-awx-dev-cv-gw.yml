---
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: pep-infratools-cgf-awx-dev-cv-gw
  namespace: pep-infratools-cgf-awx-dev
spec:
  selector:
    istio: pep-paas-infratools-ingress-gw01
  servers:
  - hosts:
    - "dummy-passthrough-pep-infratools-cgf-awx-dev.gw01.aks01.eus.nonprod.azure.intra.pepsico.com"
    name: "pep-infratools-cgf-awx-dev-cv-gw-tls-443"
    port:
      name: "https-pep-infratools-cgf-awx-dev-cv-gw-tls-443"
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - awx-service.infratools.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    name: "pep-infratools-cgf-awx-dev-cv-gw-https-443"
    port:
      name: "https-pep-infratools-cgf-awx-dev-cv-gw-443"
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: "pep-paas-infratools-nonprod-eus-01-aks-gw01-tls"
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - awx-service.infratools.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - ha-ansibledev.mypepsico.com
    name: "pep-infratools-cgf-awx-dev-cv-gw-http-80"
    port:
      name: "http-pep-infratools-cgf-awx-dev-cv-gw-80"
      number: 80
      protocol: http
    tls:
      httpsRedirect: true
  - hosts:
    - ha-ansibledev.mypepsico.com
    name: "pep-infratools-cgf-awx-dev-cv-gw-1-https-443"
    port:
      name: "https-pep-infratools-cgf-awx-dev-cv-gw-1-443"
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-paas-infratools-nonprod-awx-gw01-tls.yaml
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
