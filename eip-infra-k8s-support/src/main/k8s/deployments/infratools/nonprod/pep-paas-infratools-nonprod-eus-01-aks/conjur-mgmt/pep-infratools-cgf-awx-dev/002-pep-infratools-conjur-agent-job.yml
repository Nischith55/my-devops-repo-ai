---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: conjur-agent-sa 
  namespace: pep-infratools-cgf-awx-dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: conjur-agent-role
  namespace: pep-infratools-cgf-awx-dev
rules:
  - apiGroups: [""]
    resources: [ "secrets" ]
    verbs: [ "get", "update" ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: pep-infratools-cgf-awx-dev
  name: conjur-agent-rb
subjects:
  - kind: ServiceAccount
    namespace: pep-infratools-cgf-awx-dev
    name: conjur-agent-sa
roleRef:
  kind: Role
  apiGroup: rbac.authorization.k8s.io
  name: conjur-agent-role
---
apiVersion: batch/v1
kind: Job
metadata:
  name: pep-infratools-conjur-agent-job
  namespace: pep-infratools-cgf-awx-dev
spec:
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: conjur-agent-sa
      containers:
      - image: cyberark/secrets-provider-for-k8s:1.1.4
        imagePullPolicy: IfNotPresent
        ## This should be same as the policy annotation authn-k8s/authentication-container-name ##
        name: cyberark-secrets-provider-for-k8s
        env:
        - name: MY_POD_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.name
        - name: MY_POD_NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        ##  Update it with conjur follower URL ##
        - name: CONJUR_APPLIANCE_URL
          value:  "https://mypam.conjur.ite.mypepsico.com"
        ## !!! Important Update it with Conjur Authenticator URL !!! ##
        - name: CONJUR_AUTHN_URL
          value:  "https://mypam.conjur.ite.mypepsico.com/authn-k8s/pep-paas-infratools-nonprod-eus-01-aks"
        ## Update it with Conjur Account ##
        - name: CONJUR_ACCOUNT
          value:  "ITE"
        - name: CONJUR_SSL_CERTIFICATE
          valueFrom:
            configMapKeyRef:
              name: pep-infratools-conjur-cert-cm
              key: ssl-certificate
        ## Update with the id from policy ##
        - name: CONJUR_AUTHN_LOGIN
          value: host/pep/infratools/aks/pep-infratools-cgf-awx-dev
        - name: SECRETS_DESTINATION
          value: k8s_secrets
        - name: DEBUG
          value: "true"
        # Enables the support of multiple Kubernetes applications
        - name: CONTAINER_MODE
          value: application
        ## !!! IMPORTANT NEED TO UPDATE !!! ##
        - name: K8S_SECRETS
          value: pep-infratools-cgf-awx-conjur-secret
      restartPolicy: Never
  backoffLimit: 0
