apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: undefined
  name: argocd-vs
  namespace: pep-paas-infratools-istio-config
spec:
  gateways:
  - pep-paas-infratools-istio-config/pep-paas-infratools-istio-config-cv-gw
  hosts:
  - argocd.infratools.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: argocd-server.argocd.svc.cluster.local
        port:
          number: 80
    timeout: 120s
