apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: prometheus-vs
  namespace: pep-weblogic-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - prometheus.weblogic.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: prometheus.monitoring.svc.cluster.local
        port: 
          number: 80