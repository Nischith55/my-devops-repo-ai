apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: sample-domain-admin-server-vs
  namespace: pep-weblogic-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - sample-domain-admin-server.weblogic.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /console
    route:
    - destination:
        host: sample-domain-admin-server.pep-weblogic-apache-dev.svc.cluster.local
        port: 
          number: 7001