apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-weblogic-nginx-vs
  namespace: pep-weblogic-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-weblogic-nginx-curl.weblogic.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-weblogic-nginx.pep-weblogic-infra-dev.svc.cluster.local
        port: 
          number: 8080