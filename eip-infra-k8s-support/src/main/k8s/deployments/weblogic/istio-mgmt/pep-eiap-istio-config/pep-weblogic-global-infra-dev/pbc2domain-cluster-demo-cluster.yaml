apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pbc2domain-cluster-demo-cluster-vs
  namespace: pep-weblogic-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pbc2domain-cluster-demo-cluster.weblogic.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /SampleWebApp
    - ignoreUriCase: true
      uri:
        prefix: /testJbossConfig
    route:
    - destination:
        host: pbc2domain-cluster-demo-cluster.pep-weblogic-apache-dev.svc.cluster.local
        port: 
          number: 8001 