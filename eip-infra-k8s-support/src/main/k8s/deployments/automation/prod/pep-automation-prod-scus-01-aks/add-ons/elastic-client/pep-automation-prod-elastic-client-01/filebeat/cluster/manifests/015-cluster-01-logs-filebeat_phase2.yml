---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prod-scus-01-aks-logs-filebeat-config
  namespace: pep-automation-elastic-client-01
data:

  K8S_CLUSTER_NAME: pep-automation-prod-scus-01-aks

  filebeat-processor.yml: |
    processors:

    - add_fields:
        #target: aisp
        fields:
          cluster_name: ${K8S_CLUSTER_NAME}
          pep-aks-cluster: ${K8S_CLUSTER_NAME}

    - add_cloud_metadata:
        when:
          equals:
            event.module: system

    - add_host_metadata: {}

    - add_kubernetes_metadata:
        host: ${NODE_NAME}
        default_indexers:
          enabled: false
        default_matchers:
          enabled: false


    - add_tags:
        tags: ["PROD-AUTOMATION-Shared", "retain-logs"]
    - script:
        lang: javascript
        source: >
          function process(event) {
            event.Put("fields.sn-application", "aks-pep-automation-prod-scus-01-aks" + "-" + event.Get("kubernetes.namespace"));  
            return event;
          }


    logging:
      level: INFO
      metrics:
        enabled: true

  filebeat.yml: |-

    filebeat:

      modules:
      - module: system
        syslog:
          enabled: true
          # Default: Configured paths: [/var/log/messages* /var/log/syslog*]
          var:
            paths:
            - /var/log/syslog
            - /var/log/messages
            - /var/log/waagent.log
            - /var/log/azure/*.log
        auth:
          enabled: true
          # Default: Configured paths: [/var/log/auth.log* /var/log/secure*]
          var:
            paths:
            - /var/log/auth.log

      autodiscover:
        providers:
        - type: kubernetes
          scope: node
          resource: pod
          node: ${NODE_NAME}
          hints:
            enabled: true
          templates:
            - condition:
                not:
                  has_fields:
                  # ignore all logs from elastic pods since we are shipping
                  # it to monitoring cluster
                  - kubernetes.labels.common.k8s.elastic.co/type
              
              config:
              - type: container
                paths:
                - /var/log/containers/*${data.kubernetes.container.id}.log
                
                multiline:
                  type: pattern
                  pattern: '^(\[|[0-9]{4}-[0-9]{2}-[0-9]{2} )'
                  negate: true
                  match: after
    setup.template.name: "pep-pfna-aks-logs-template-less10gb-low"
    setup.template.pattern: "aks-pep-automation-prod-scus-01-aks*"

    setup.ilm.enabled: false     
    #setup.template.overwrite: true
    output.elasticsearch:
        hosts: [https://c0b565d4570c433e91e8d9ff1bd1b170.privatelink.southcentralus.azure.elastic-cloud.com:9243]
        api_key: "-Op1ipUBtMbxeTz3X0oS:8TirsYuVSTuAMHOlq06-Jw"
        index: "%{[fields][sn-application]}"
        worker: 2
        bulk_max_size: 500
        ssl.verification_mode: none
        timeout: 90s


---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: &app_name prod-scus-01-aks-logs-filebeat
  namespace: pep-automation-elastic-client-01
  labels:
    app.kubernetes.io/name: *app_name
    app.kubernetes.io/version: &vers 8.19.11
    app: *app_name
    # match the  ES server version (beats is not backward compatible)
    version: *vers
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: *app_name
      app.kubernetes.io/version: *vers

  template:

    metadata:
      labels:
        app.kubernetes.io/name: *app_name
        app.kubernetes.io/version: *vers

    spec:
      hostAliases:
      - ip: "172.20.79.12"
        hostnames:
        - "c0b565d4570c433e91e8d9ff1bd1b170.privatelink.southcentralus.azure.elastic-cloud.com"
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
      - operator: Exists

      serviceAccountName: filebeat
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 0


      volumes:
      - name: config-projected
        projected:
          # 0644 -> 420, 0600 -> 384
          defaultMode: 384
          sources:
          - configMap:
              name: pep-ca-certs-config
              optional: false
              items:
                - key: PepsiCoCA01.pem
                  # must be relative
                  path: etc/certs/PepsiCoCA01.pem
                - key: PepsiCoRootCA.pem
                  # must be relative
                  path: etc/certs/PepsiCoRootCA.pem

          - configMap:
              name: &beats_config prod-scus-01-aks-logs-filebeat-config
              optional: false
              items:
                - key: filebeat.yml
                  # must be relative
                  path: etc/beat.yml
                - key: filebeat-processor.yml
                  # must be relative
                  path: etc/beat-processor-config.yml

      - name: varlibdockercontainers
        hostPath:
          path: /var/lib/docker/containers

      - name: varlog
        hostPath:
          path: /var/log

      - name: data
        hostPath:
          path: /var/lib/pep-automation-elastic-client-01/prod-scus-01-aks-logs-filebeat/filebeat-data
          type: DirectoryOrCreate

      - name: dockersock
        hostPath:
          path: /var/run/docker.sock

  
      containers:
      - name: filebeat
        image: docker.elastic.co/beats/filebeat:8.19.11
        args:
        - --environment
        - container
        - -e
        - -c
        - /projected/etc/beat-processor-config.yml
        - -c
        - /projected/etc/beat.yml


        resources:
          requests:
            # cpu: 200m
            memory: 512Mi

        env:
        - name: K8S_CLUSTER_NAME
          valueFrom:
            configMapKeyRef:
              name: *beats_config
              key: K8S_CLUSTER_NAME


        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName

        - name: NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP

        volumeMounts:

        # PEP:
        - name: config-projected
          # where it is mounted
          mountPath: /projected
          readOnly: true

        - name: data
          mountPath: /usr/share/filebeat/data

        - name: varlibdockercontainers
          mountPath: /var/lib/docker/containers
          readOnly: true

        - name: varlog
          mountPath: /var/log
          readOnly: true

        - name: dockersock
          mountPath: "/var/run/docker.sock"
