apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
    annotations:
        meta.helm.sh/release-name: cf-ipam-allocator
        meta.helm.sh/release-namespace: pep-automation-auto-cvipam-prod
    labels:
        app: cf-ipam-allocator
        app.kubernetes.io/instance: cf-ipam-allocator
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/version: '20250407.12'
        azure.workload.identity/use: 'true'
        environment: prod
        helm.sh/chart: platform-chart-1.0.2
    name: cf-ipam-allocator
    namespace: pep-automation-auto-cvipam-prod
spec:
    gateways:
    - pep-automation-auto-cvipam-prod/pep-automation-auto-cvipam-prod-cv-gw
    hosts:
    - cf-ipam-allocator.automation.gw01.aks01.scus.prod.azure.intra.pepsico.com
    - cloudipam.mypepsico.com
    http:
    -   match:
        -   ignoreUriCase: true
            uri:
                prefix: /
        route:
        -   destination:
                host: cf-ipam-allocator.pep-automation-auto-cvipam-prod.svc.cluster.local
                port:
                    number: 8000
