apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: cv-opa-dev-vs
  namespace: pep-automation-cgf-cvopa-dev
spec:
  gateways:
  - pep-automation-cgf-cvopa-dev/pep-automation-cgf-cvopa-dev-cv-gw
  hosts:
  - cv-opa.automation.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: cv-opa.pep-automation-cgf-cvopa-dev.svc.cluster.local
        port: 
          number: 8181