apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: cf-ipam-allocator-veti-vs
  namespace: pep-automation-auto-cvipam-dev
  labels:
      app: cf-ipam-allocator
spec:
  hosts:
  - cf-ipam-allocator.automation.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  - cloudipam.dev.mypepsico.com
  gateways:
  - pep-automation-auto-cvipam-dev/pep-automation-auto-cvipam-dev-cv-gw
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: cf-ipam-allocator.pep-automation-auto-cvipam-dev.svc.cluster.local
        port:
          number: 8000
  