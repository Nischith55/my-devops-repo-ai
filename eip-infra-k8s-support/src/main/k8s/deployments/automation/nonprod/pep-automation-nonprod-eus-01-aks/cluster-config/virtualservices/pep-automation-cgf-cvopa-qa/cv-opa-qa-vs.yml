apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: cv-opa-qa-vs
  namespace: pep-automation-cgf-cvopa-qa
spec:
  gateways:
  - pep-automation-cgf-cvopa-qa/pep-automation-cgf-cvopa-qa-cv-gw
  hosts:
  - cv-opa-qa.automation.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: cv-opa-qa.pep-automation-cgf-cvopa-qa.svc.cluster.local
        port: 
          number: 8181