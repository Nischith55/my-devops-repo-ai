---
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: pep-automation-auto-cvipam-qa-cv-gw
  namespace: pep-automation-auto-cvipam-qa
spec:
  selector:
    istio: pep-automation-ingress-gw01
  servers:
  - hosts:
    - dummy-passthrough-pep-automation-auto-cvipam-qa.automation.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    name: pep-automation-auto-cvipam-qa-cv-gw-tls-443
    port:
      name: https-pep-automation-auto-cvipam-qa-cv-gw-tls-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - dummy-pep-automation-auto-cvipam-qa.automation.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    name: pep-automation-auto-cvipam-qa-cv-gw-https-443
    port:
      name: https-pep-automation-auto-cvipam-qa-cv-gw-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-automation-nonprod-eus-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - dummy-pep-automation-auto-cvipam-qa-80.automation.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    name: pep-automation-auto-cvipam-qa-cv-gw-http-80
    port:
      name: http-pep-automation-auto-cvipam-qa-cv-gw-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true