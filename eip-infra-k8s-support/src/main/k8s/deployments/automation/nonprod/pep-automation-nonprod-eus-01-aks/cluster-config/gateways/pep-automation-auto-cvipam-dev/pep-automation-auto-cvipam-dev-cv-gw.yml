apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
    name: pep-automation-auto-cvipam-dev-cv-gw
    namespace: pep-automation-auto-cvipam-dev
spec:
    selector:
        istio: pep-automation-ingress-gw01
    servers:
    -   hosts:
        - dummy-passthrough-pep-automation-auto-cvipam-dev.automation.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
        name: pep-automation-auto-cvipam-dev-cv-gw-tls-443
        port:
            name: https-pep-automation-auto-cvipam-dev-cv-gw-tls-443
            number: 443
            protocol: https
        tls:
            cipherSuites:
            - AES128-GCM-SHA256
            - AES256-GCM-SHA384
            - ECDHE-ECDSA-AES128-SHA
            - ECDHE-ECDSA-AES256-SHA
            - ECDHE-ECDSA-AES128-GCM-SHA256
            - ECDHE-ECDSA-AES256-GCM-SHA384
            - ECDHE-RSA-AES128-GCM-SHA256
            - ECDHE-RSA-AES256-GCM-SHA384
            maxProtocolVersion: TLSV1_3
            minProtocolVersion: TLSV1_2
            mode: PASSTHROUGH
    -   hosts:
        - dummy-pep-automation-auto-cvipam-dev.automation.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
        - cf-ipam-allocator.automation.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
        name: pep-automation-auto-cvipam-dev-cv-gw-https-443
        port:
            name: https-pep-automation-auto-cvipam-dev-cv-gw-443
            number: 443
            protocol: https
        tls:
            cipherSuites:
            - AES128-GCM-SHA256
            - AES256-GCM-SHA384
            - ECDHE-ECDSA-AES128-SHA
            - ECDHE-ECDSA-AES256-SHA
            - ECDHE-ECDSA-AES128-GCM-SHA256
            - ECDHE-ECDSA-AES256-GCM-SHA384
            - ECDHE-RSA-AES128-GCM-SHA256
            - ECDHE-RSA-AES256-GCM-SHA384
            credentialName: pep-automation-nonprod-eus-01-aks-gw01-tls
            maxProtocolVersion: TLSV1_3
            minProtocolVersion: TLSV1_2
            mode: SIMPLE
    -   hosts:
        - dummy-pep-automation-auto-cvipam-dev-80.automation.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
        - cf-ipam-allocator.automation.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
        - cloudipam.dev.mypepsico.com
        name: pep-automation-auto-cvipam-dev-cv-gw-http-80
        port:
            name: http-pep-automation-auto-cvipam-dev-cv-gw-80
            number: 80
            protocol: http
        tls:
            httpsRedirect: true
    -   hosts:
        - cloudipam.dev.mypepsico.com
        name: pep-automation-auto-cvipam-dev-cv-gw-3-https-443
        port:
            name: pep-automation-auto-cvipam-dev-cv-gw-3-443
            number: 443
            protocol: https
        tls:
            cipherSuites:
            - AES128-GCM-SHA256
            - AES256-GCM-SHA384
            - ECDHE-ECDSA-AES128-SHA
            - ECDHE-ECDSA-AES256-SHA
            - ECDHE-ECDSA-AES128-GCM-SHA256
            - ECDHE-ECDSA-AES256-GCM-SHA384
            - ECDHE-RSA-AES128-GCM-SHA256
            - ECDHE-RSA-AES256-GCM-SHA384
            credentialName: cloudipam.dev-gw01-tls
            maxProtocolVersion: TLSV1_3
            minProtocolVersion: TLSV1_2
            mode: SIMPLE
