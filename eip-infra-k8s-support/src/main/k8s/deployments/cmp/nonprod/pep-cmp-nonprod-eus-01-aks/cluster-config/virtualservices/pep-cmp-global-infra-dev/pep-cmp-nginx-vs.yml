apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  annotations: {}
  labels:
    app: pep-cmp-nginx
  name: pep-cmp-nginx-vs
  namespace: pep-cmp-global-infra-dev
spec:
  gateways:
  - pep-cmp-global-infra-dev/pep-cmp-global-infra-dev-cv-gw
  hosts:
  - pep-cmp-nginx.cmp.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-cmp-nginx.pep-cmp-global-infra-dev.svc.cluster.local
        port:
          number: 8080
