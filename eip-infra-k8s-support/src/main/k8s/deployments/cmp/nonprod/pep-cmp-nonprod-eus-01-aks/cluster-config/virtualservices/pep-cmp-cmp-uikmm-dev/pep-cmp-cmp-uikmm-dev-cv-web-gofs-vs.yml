        app: pep-cmp-cmp-uikmm-dev-cv-web
    name: pep-cmp-cmp-uikmm-dev-cv-web-gofs-vs
    namespace: pep-cmp-cmp-uikmm-dev
spec:
    gateways:
    - pep-cmp-cmp-uikmm-dev/pep-cmp-cmp-uikmm-dev-cv-gw
    hosts:
    - pep-cmp-cto-devx-infra-web-vg3.cmp.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
    - dcgh01.dev.mypepsico.com
    http:
