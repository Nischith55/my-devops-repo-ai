apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: istio-in-gateway-01
  namespace: istio-system
spec:
  selector:
    istio: pep-cmp-ingress-gw01
  servers:
  - hosts:
    - "*.cmpdmz.gw01.aks01.scus.nonprod.azure.intra.pepsico.com"
    name: istio-in-gateway-01-wildcard-https-443
    port:
      name: https-wc-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-cmp-nonprod-dmz-scus-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - iwms.dev.mypepsico.com
    - api.addcut.dev.mypepsico.com
    - addcut.dev.mypepsico.com
    - "*.cmpdmz.gw01.aks01.scus.nonprod.azure.intra.pepsico.com"
    name: istio-in-gateway-01-wildcard-http-80
    port:
      name: http-wc-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true
  - hosts:
    - iwms.dev.mypepsico.com
    name: istio-in-gateway-01-iwms-https-443
    port:
      name: https-iwms-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-cmp-nonprod-dmz-scus-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - addcut.dev.mypepsico.com
    name: istio-in-gateway-01-addcut-https-443
    port:
      name: https-addcut-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-cmp-nonprod-dmz-scus-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2 
      mode: SIMPLE   
  - hosts:
    - api.addcut.dev.mypepsico.com
    name: istio-in-gateway-01-addcutapi-https-443
    port:
      name: https-addcutapi-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-cmp-nonprod-dmz-scus-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE