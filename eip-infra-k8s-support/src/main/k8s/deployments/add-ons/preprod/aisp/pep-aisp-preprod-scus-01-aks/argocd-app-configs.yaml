---
global:
  env: preprod
  spec:
    destination:
      clusterName: pep-aisp-preprod-scus-01-aks

argoCDApplications:  
  opa-opensource-pep-aisp-preprod-scus-01-aks:  
    enabled: true
    autoSync: true
    helm: true
    recursive: false
    chart: gatekeeper
    revision: 3.20.0
    namespace: gatekeeper-system
    path: /src/main/k8s/deployments/add-ons/base/opa-gatekeeper/osopa
    additionalHelmValueFiles:
    - /src/main/k8s/deployments/add-ons/preprod/base/gatekeeper/helm-values.yaml
    ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
      - /spec/preserveUnknownFields
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jsonPointers:
      - /webhooks/admissionReviewVersions/namespaceSelector/matchExpressions
  opa-constraints-pep-aisp-preprod-scus-01-aks:  
    enabled: true
    autoSync: true
    helm: false    
    recursive: false
    path: src/main/k8s/deployments/cluster-config/preprod/aisp/pep-aisp-preprod-scus-01-aks/constraints
  
  opa-templates-pep-aisp-preprod-scus-01-aks:  
    enabled: true
    autoSync: true
    helm: false    
    recursive: false
    path: src/main/k8s/deployments/cluster-config/base/opa-gatekeeper-policies/validation/constraint-templates