---
global:
  spec:
    destination:
      clusterName: pep-pepgenx-nonprod-eus-global-01-aks

argoCDApplications:  
  opa-opensrc-pep-pepgenx-nonprod-eus-global-01-aks:  
    enabled: true
    autoSync: true
    helm: true
    recursive: false
    chart: gatekeeper
    revision: 3.20.0
    namespace: gatekeeper-system
    path: /src/main/k8s/deployments/add-ons/base/opa-gatekeeper/osopa
    ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
      - /spec/preserveUnknownFields
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jsonPointers:
      - /webhooks/admissionReviewVersions/namespaceSelector/matchExpressions

  opa-constraints-pep-pepgenx-nonprod-eus-global-01-aks:  
    enabled: true
    autoSync: true
    helm: false    
    recursive: false
    path: src/main/k8s/deployments/cluster-config/nonprod/pepgenx/pep-pepgenx-nonprod-eus-global-01-aks/constraints
  
  opa-templates-pep-pepgenx-nonprod-eus-global-01-aks:  
    enabled: true
    autoSync: true
    helm: false    
    recursive: false
    path: src/main/k8s/deployments/cluster-config/nonprod/pepgenx/pep-pepgenx-nonprod-eus-global-01-aks/constraint-templates

  karpenter-pep-pepgenx-nonprod-eus-global-01-aks:  
    enabled: true
    autoSync: true
    helm: false    
    recursive: false
    path: src/main/k8s/deployments/cluster-config/nonprod/pepgenx/pep-pepgenx-nonprod-eus-global-01-aks/karpenter

  karpenter-reso-pep-pepgenx-nonprod-eus-global-01-aks:  
    enabled: true
    autoSync: true
    helm: false    
    recursive: false
    path: src/main/k8s/deployments/cluster-config/nonprod/pepgenx/pep-pepgenx-nonprod-eus-global-01-aks/karpenter-resources

  cert-manager-pep-pepgenx-nonprod-eus-global-01-aks:
    enabled: true
    autoSync: true
    helm: true
    helmRepoURL: https://charts.jetstack.io
    chart: cert-manager
    revision: v1.19.2
    namespace: cert-manager
    path: src/main/k8s/deployments/add-ons/base/cert-manager
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
