---
global:
  spec:
    destination:
      clusterName: pep-eiap-nonprod-eus-sbox-03-aks

argoCDApplications:  
  opa-opensource-pep-eiap-nonprod-eus-sbox-03-aks:  
    enabled: true
    autoSync: true
    helm: true
    recursive: false
    chart: gatekeeper
    revision: 3.20.0
    namespace: cattle-gatekeeper-system
    path: /src/main/k8s/deployments/add-ons/base/opa-gatekeeper/osopa
    ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
      - /spec/preserveUnknownFields
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jsonPointers:
      - /webhooks/admissionReviewVersions/namespaceSelector/matchExpressions
