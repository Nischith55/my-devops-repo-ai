apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sAllowedRepos
metadata:
  name: restrictrepo
spec:
  enforcementAction: warn
  match:
    excludedNamespaces:
    - PATCH
    # - pep-eiap-ops-admin
    # - pep-eiap-global-infra-dev
    # - pep-eiap-istio-config
    # - pep-eiap-elastic-client-01
    # - pep-eiap-elastic-client-02
    # - pep-eiap-elastic-cluster-01
    # - pep-eiap-elastic-cluster-02
    # - pep-eiap-elastic-monitor-01
    # - pep-eiap-global-devsecops-dev
    - snyk-monitor
    - cert-manager-system
    # - reloader 
    # - policy-system
    # - default
    kinds:
    - apiGroups:
      - ""
      kinds:
      - Pod
    labelSelector:
      matchExpressions: []
    namespaceSelector:
      matchExpressions: []
    scope: '*'
  parameters:
    repos:
    - myartifactory.mypepsico.com/
    - artifactory.mypepsico.com/
    - artifactory.pepsico.pvt/
    - pepeiapnonprodcommonacr.azurecr.io/
    - docker.io/istio/
    - cyberark/
    - docker.elastic.co/observability/
    - appdynamics/
    - docker.io/appdynamics/
    - pepeiapnonprodglobalcommonacr.azurecr.io/
    - pepeiotpnonprodpriacr.azurecr.io/
    - peppbnasckmnonprodeusacr.azurecr.io/
    # OPA Exception RITM4296288 SVT-Robotics
    - 31c83f7d416d4d5c8c55de68f1a64d6cacr.azurecr.io/
    # OPA Exemption RITM4327956 OCH-NA DEV and QA enviornments
    - otel/
    # OPA Exemption RITM4538301 OCH-NA DEV and QA enviornments 
    - structurizr/onpremises
    - rancher/