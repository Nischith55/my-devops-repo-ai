apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sContainerRequests
metadata:
  name: container-must-have-requests
spec:
  enforcementAction: warn
  match:
    excludedNamespaces:
    - <PATCH>
    # - calico-system
    # - cattle-fleet-system
    # - cattle-gatekeeper-system
    # - cattle-impersonation-system
    # - cattle-system
    # - istio-operator
    # - istio-system
    # - kube-node-lease
    # - kube-public
    # - kube-system
    # - kubecost
    # - kubernetes-dashboard
    # - monitoring
    # - msi-acrpull-system
    # - observability
    # - twistlocknp
    # - tigera-operator
    # - pep-eiap-ops-admin
    # - pep-eiap-global-infra-dev
    # - pep-eiap-istio-config
    # - pep-eiap-elastic-client-01
    # - pep-eiap-elastic-client-02
    # - pep-eiap-elastic-cluster-01
    # - pep-eiap-elastic-cluster-02
    # - pep-eiap-elastic-monitor-01
    # - pep-eiap-global-devsecops-dev
    # - cert-manager-system
    # - reloader
    # - flux-system
    # - flagger
    # - policy-system
    # - gitops-connector-system
    # # CMP OPA Exception Request 
    # - pep-eiap-global-cmp-dev
    # - pep-eiap-global-cmp-qa
    # - pep-eiap-global-infra-dev
    # - default
    # - pep-eiap-cgf-swaggerhub-dev
    # - pep-eiap-cgf-cvopa-dev
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    scope: '*'
  parameters:
    cpu: "1"
    exemptImages:
    - <PATCH>
    # - cyberark/secrets-provider-for-k8s*
    # - docker.io/istio/*
    # - docker.elastic.co/observability/*
    # - appdynamics/*
    # - docker.io/appdynamics/*
    # OPA Exception RITM4348977 Pricingai-dev
    # - myartifactory.mypepsico.com/gnrmpricingaccelerator-docker-dev-local/pricing-ai-ds-logic*
    # - myartifactory.mypepsico.com/gnrmpricingaccelerator-docker-dev-local/pricing-ai-event-manager*
    # # OPA Exception SCTASK5028734 Label Right Application
    # - myartifactory.mypepsico.com/aks-iai-cv-plt-docker-dev/pep/eiap/labelright/labelright-backend-ml-api-2022* 
    # # OPA Exception RITM4425383 Pricingai-dev
    # - myartifactory.mypepsico.com/gnrmpricingaccelerator-docker-dev-local/pricing-ai-manual-scenarios-api*
    # - myartifactory.mypepsico.com/gnrmpricingaccelerator-docker-dev-local/pep/eip/pep-eip-gnrm-pricingai-pricing-api*
    # # OPA Exception RITM4296288 SVT-Robotics
    # - 31c83f7d416d4d5c8c55de68f1a64d6cacr.azurecr.io/svt-softbot-platform* 
    #  # OPA Exception RITM4600706 pep-och-amazon-flna-mop
    # - pepeiapnonprodglobalcommonacr.azurecr.io/omnichannelecommercehub_docker_local/pep/och/essa/edt/pep-och-amazon-flna-mop*
    #  # OPA Exception RITM5155318
    # - pepeiapnonprodglobalcommonacr.azurecr.io/pep/eiap/labelright/labelright-backend-ml-api-2022*
    # # OPA Exception RITM5184029
    # - pepeiapnonprodglobalcommonacr.azurecr.io/pep/eiap/labelright/labelright-model-server-2023*
    # # OPA Exception RITM5179832
    # - myartifactory.mypepsico.com/aks-pepeiappfnavct-dev-local/pep/eiap/vct-pyservices-persistence*
    # # OPA Exception RITM5230731
    # - pepeiapnonprodglobalcommonacr.azurecr.io/pep/eiap/pfb-pricing-solution-webapp-api*
    # # OPA Exception - RITM5456883 pep-eiap-pfna-vct-dev
    # - myartifactory.mypepsico.com/aks-pepeiappfnavct-dev-local/pep/eiap/dsi-caching-testing*
    # # OPA Exception - INC08630347 for pep-eiap-cgf-rmispecs-dev and pep-eiap-cgf-rmispecs-qa
    # - pepeiapnonprodglobalcommonacr.azurecr.io/pep/eiap/specification-digitization-api*
    memory: 2Gi