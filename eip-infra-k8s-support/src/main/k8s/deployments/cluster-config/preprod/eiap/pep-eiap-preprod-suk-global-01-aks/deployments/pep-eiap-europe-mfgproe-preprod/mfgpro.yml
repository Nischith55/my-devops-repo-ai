apiVersion: apps/v1
kind: Deployment
metadata:
  name: "mfgpro"
  namespace: "pep-eiap-europe-mfgproe-preprod"
  labels:
    app: "mfgpro"

spec:
  progressDeadlineSeconds: 3600
  replicas: 1
  selector:
    matchLabels:
      app: "mfgpro"

  template:
    metadata:
      labels:
        app: "mfgpro"
    spec:
      serviceAccountName: "pep-eiap-europe-mfgproe-preprod-sa"
      automountServiceAccountToken: true
      containers:
      - name: "mfgpro"
        image: "pepeiapprodcommonacr.azurecr.io/pep/cto/cmp/pepsico-cto-cmp-helloworld-webapp:20231024.26"
        imagePullPolicy: Always

        ports:
        - containerPort: 8080

        resources:
          requests:
            memory: "250Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"

        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5

        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5

---
apiVersion: v1
kind: Service
metadata:
  name: "mfgpro"
  namespace: "pep-eiap-europe-mfgproe-preprod"
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
  selector:
    app: "mfgpro"