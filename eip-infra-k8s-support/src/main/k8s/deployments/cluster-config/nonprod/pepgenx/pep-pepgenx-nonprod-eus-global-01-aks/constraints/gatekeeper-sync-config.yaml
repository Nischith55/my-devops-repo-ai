apiVersion: config.gatekeeper.sh/v1alpha1
kind: Config
metadata:
  name: config
  namespace: gatekeeper-system
spec:
  sync:
    syncOnly:
    - group: ""
      kind: Namespace
      version: v1
    - group: networking.istio.io
      kind: VirtualService
      version: v1beta1
    - group: ""
      kind: Service
      version: v1
    - group: apps
      kind: Deployment
      version: v1
    - group: apps
      kind: StatefulSet
      version: v1
    - group: apps
      kind: ReplicaSet
      version: v1
    - group: policy
      kind: PodDisruptionBudget
      version: v1
    - group: ""
      kind: ReplicationController
      version: v1
    - group: apps
      kind: DaemonSet
      version: v1
    - group: autoscaling
      kind: HorizontalPodAutoscaler
      version: v2
    - group: batch
      kind: CronJob
      version: v1
    - group: discovery.k8s.io
      kind: EndpointSlice
      version: v1
    - group: events.k8s.io
      kind: Event
      version: v1
    - group: policy
      kind: PodSecurityPolicy
      version: v1
