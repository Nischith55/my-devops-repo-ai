apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sReplicaLimits
metadata:
  name: replicalimit
spec:
  enforcementAction: deny
  match:
    # excludedNamespaces:
    # - PATCH
    kinds:
    - apiGroups:
      - apps
      kinds:
      - Deployment
    excludedNamespaces:
    - apigee
    - cert-manager
    labelSelector:
      matchExpressions: []
    namespaceSelector:
      matchExpressions: []
    scope: '*'
  parameters:
    ranges:
    - max_replicas: 10
      min_replicas: 0
