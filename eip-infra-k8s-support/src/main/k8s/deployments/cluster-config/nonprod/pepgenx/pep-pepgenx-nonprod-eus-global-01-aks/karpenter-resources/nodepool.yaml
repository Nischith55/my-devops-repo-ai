apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: pepgenx-general
  annotations:
    kubernetes.io/description: "NodePool for Karpenter (NAP) provisioned Standard_E16ds_v5 / Standard_E32ds_v5 nodes"
spec:
  template:
    metadata:
      labels:
        balance-group: KarpenterPools
    spec:
      nodeClassRef:
        group: karpenter.azure.com
        kind: AKSNodeClass
        name: pepgenx-general
      expireAfter: 720h
      requirements:
      - key: kubernetes.io/os
        operator: In
        values: ["linux"]
      - key: kubernetes.io/arch
        operator: In
        values: ["amd64"]
      - key: karpenter.sh/capacity-type
        operator: In
        values: ["on-demand"]
      - key: node.kubernetes.io/instance-type
        operator: In
        values: ["Standard_E16ds_v5", "Standard_E32ds_v5"]
      - key: topology.kubernetes.io/zone
        operator: In
        values: ["eastus-1", "eastus-2", "eastus-3"]
  limits:
    cpu: "100"
    memory: 800Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m
    budgets:
    - nodes: "10%"
