apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sPSPHostFilesystem
metadata:
  name: psp-host-filesystem
spec:
  enforcementAction: warn
  match:
    excludedNamespaces:
    - argocd
    - gatekeeper-system
    - default
    - istio-ingress
    - istio-system
    - keda
    - kube-node-lease
    - kube-public
    - kube-system
    - kubecost
    - monitoring
    - pep-pepgenx-elastic-client-01
    - pep-pepgenx-elastic-askadaa-01
    - pep-pepgenx-global-devsecops-dev
    - pep-pepgenx-global-dev
    - pep-pepgenx-snowdiscovery-nonprod
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
  parameters:
    allowedHostPaths: []
