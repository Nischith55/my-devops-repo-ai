apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: karpenter-apigee-node-pool
  annotations:
    kubernetes.io/description: "Apigee NodePool for Karpenter (NAP) provisioned Standard_D8ds_v5"
spec:
  template:
    metadata:
      labels:
        balance-group: APGRuntime01ZonedPools
    spec:
      nodeClassRef:
        group: karpenter.azure.com
        kind: AKSNodeClass
        name: pepgenx-general
      requirements:
      - key: kubernetes.io/os
        operator: In
        values: ["linux"]
      - key: kubernetes.io/arch
        operator: In
        values: ["amd64"]
      - key: karpenter.sh/capacity-type
        operator: In
        values: ["on-demand"]
      - key: node.kubernetes.io/instance-type
        operator: In
        values: ["Standard_D8ds_v5"]
      - key: topology.kubernetes.io/zone
        operator: In
        values: ["eastus-1", "eastus-2", "eastus-3"]
  limits:
    cpu: "150"
    memory: 800Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 2h
    budgets:
    - nodes: "10%"
