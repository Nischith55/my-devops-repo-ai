apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pod-info-vs
  namespace: test
spec:
  gateways:
  - test/test-cv-gw
  hosts:
  - pod-info-test.sandbox.gw01.aks03.scus.nonprod.azure.intra.pepsico.com
