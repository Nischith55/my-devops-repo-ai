apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:  
  name: pep-apigee-k8sautomation-clusterrole
rules:
- apiGroups:
  - ''
  resources:
  - namespaces
  - persistentvolumeclaims
  - events
  - nodes
  - configmaps
  verbs:
  - get
  - list
- apiGroups:
  - ''
  resources:
  - pods
  - podtemplates
  - pods/attach
  - pods/binding
  - pods/eviction
  - pods/exec
  - pods/log
  - pods/status
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - deployments  
  - deployments/scale
  verbs:
  - get
  - list
  - patch
  - update
- apiGroups:
  - storage.k8s.io
  resources:
  - storageclasses
  verbs:
  - get
  - list
- apiGroups:
  - policy
  resources:
  - poddisruptionbudgets
  verbs:
  - '*'
- apiGroups:
  - networking.istio.io
  resources:
  - gateways
  - virtualservices
  - sidecars
  - destinationrules
  verbs:
  - '*'
- apiGroups:
  - ''
  resources:
  - secrets
  - services
  verbs:
  - get
  - list 
- apiGroups:
  - argoproj.io
  resources:
  - appprojects
  - applications
  verbs:
  - '*' 