apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: cert-manager-cv-gw
  namespace: cert-manager
spec:
  selector:
    istio: pep-apigee-ingress-gw01
  servers:
  - hosts:
    - dummy-passthrough-cert-manager.gw01.aks01.scus.preprod.azure.intra.pepsico.com
    name: cert-manager-cv-gw-tls-443
    port:
      name: https-cert-manager-cv-gw-tls-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - dummy-cert-manager-443.gw01.aks01.scus.preprod.azure.intra.pepsico.com
    name: cert-manager-cv-gw-https-443
    port:
      name: https-cert-manager-cv-gw-443
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-apigee-preprod-scus-01-aks-gw01-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - dummy-cert-manager-80.gw01.aks01.scus.preprod.azure.intra.pepsico.com
    name: cert-manager-cv-gw-http-80
    port:
      name: http-cert-manager-cv-gw-80
      number: 80
      protocol: http
    tls:
      httpsRedirect: true

