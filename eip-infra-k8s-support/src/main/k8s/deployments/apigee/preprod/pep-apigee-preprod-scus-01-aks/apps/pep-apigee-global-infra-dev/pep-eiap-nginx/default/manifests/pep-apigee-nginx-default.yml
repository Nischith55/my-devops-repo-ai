apiVersion: v1
kind: Service
metadata:
  labels:
    app: pep-apigee-nginx
  name: pep-apigee-nginx
  namespace: pep-apigee-global-infra-dev
spec:
  ports:
  - name: http-8080
    port: 8080
    protocol: TCP
    targetPort: 8080
  selector:
    app: pep-apigee-nginx
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: pep-apigee-nginx
  name: pep-apigee-nginx
  namespace: pep-apigee-global-infra-dev
spec:
  progressDeadlineSeconds: 600
  replicas: 2
  selector:
    matchLabels:
      app: pep-apigee-nginx
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: pep-apigee-nginx
    spec:
      containers:
      - command:
        - sudo
        - nginx
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        image: pepeiapprodcommonacr.azurecr.io/pep/eiap/infra/utils/admin-utils/eiap-nginx:ubuntu-bionic-2021.07.12
        imagePullPolicy: Always
        name: pep-apigee-nginx
        ports:
        - containerPort: 8080
          name: http        
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsUser: 1000     
