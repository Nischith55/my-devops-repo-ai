---
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: api-marketplace-cv-gw
  namespace: api-marketplace
spec:
  selector:
    istio: pep-apigee-ingress-gw01
  servers:
  - hosts:
    - "dummy-passthrough-api-marketplace.gw01.aks01.eus.preprod.azure.intra.pepsico.com"
    name: "api-marketplace-cv-gw-tls-443"
    port:
      name: "https-api-marketplace-cv-gw-tls-443"
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - pepxchange.apigee.gw01.aks01.eus.preprod.azure.intra.pepsico.com
    name: "api-marketplace-cv-gw-https-443"
    port:
      name: "https-api-marketplace-cv-gw-443"
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: "pep-apigee-preprod-eus-01-aks-gw01-tls"
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - pepxchange.apigee.gw01.aks01.eus.preprod.azure.intra.pepsico.com
    - developer.preprod.intra.pepsico.com
    name: "api-marketplace-cv-gw-http-80"
    port:
      name: "http-api-marketplace-cv-gw-80"
      number: 80
      protocol: http
    tls:
      httpsRedirect: true
  - hosts:
    - developer.preprod.intra.pepsico.com
    name: "api-marketplace-cv-gw-1-https-443"
    port:
      name: "https-api-marketplace-cv-gw-1-443"
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: pep-apigee-preprod-eus-01-aks-developer-tls
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
