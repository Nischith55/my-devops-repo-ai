---
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: apigee-system-cv-gw
  namespace: apigee-system
spec:
  selector:
    istio: pep-apigee-ingress-gw01
  servers:
  - hosts:
    - "dummy-passthrough-apigee-system.gw01.aks01.eus.preprod.azure.intra.pepsico.com"
    name: "apigee-system-cv-gw-tls-443"
    port:
      name: "https-apigee-system-cv-gw-tls-443"
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - "dummy-apigee-system-443.gw01.aks01.eus.preprod.azure.intra.pepsico.com"
    name: "apigee-system-cv-gw-https-443"
    port:
      name: "https-apigee-system-cv-gw-443"
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: "pep-apigee-preprod-eus-01-aks-gw01-tls"
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - "dummy-apigee-system-80.gw01.aks01.eus.preprod.azure.intra.pepsico.com"
    name: "apigee-system-cv-gw-http-80"
    port:
      name: "http-apigee-system-cv-gw-80"
      number: 80
      protocol: http
    tls:
      httpsRedirect: true
