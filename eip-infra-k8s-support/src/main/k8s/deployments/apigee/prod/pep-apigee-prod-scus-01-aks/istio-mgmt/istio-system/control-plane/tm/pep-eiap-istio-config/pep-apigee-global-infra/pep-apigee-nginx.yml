apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pep-apigee-nginx-vs
  namespace: pep-apigee-istio-config
spec:
  gateways:
  - istio-system/istio-in-gateway-01
  hosts:
  - pep-apigee-nginx-curl.apigee.gw01.aks01.scus.prod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-apigee-nginx.pep-apigee-global-infra.svc.cluster.local
        port: 
          number: 8080