---
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: api-marketplace-external-cv-gw
  namespace: api-marketplace-external
spec:
  selector:
    istio: pep-apigee-ingress-gw01
  servers:
  - hosts:
    - "dummy-passthrough-api-marketplace-external.gw01.aks01.scus.prod.azure.intra.pepsico.com"
    name: "api-marketplace-external-cv-gw-tls-443"
    port:
      name: "https-api-marketplace-external-cv-gw-tls-443"
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - "dummy-api-marketplace-external-443.gw01.aks01.scus.prod.azure.intra.pepsico.com"
    name: "api-marketplace-external-cv-gw-https-443"
    port:
      name: "https-api-marketplace-external-cv-gw-443"
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: "pep-apigee-prod-scus-01-aks-gw01-tls"
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - "dummy-api-marketplace-external-80.gw01.aks01.scus.prod.azure.intra.pepsico.com"
    name: "api-marketplace-external-cv-gw-http-80"
    port:
      name: "http-api-marketplace-external-cv-gw-80"
      number: 80
      protocol: http
    tls:
      httpsRedirect: true
