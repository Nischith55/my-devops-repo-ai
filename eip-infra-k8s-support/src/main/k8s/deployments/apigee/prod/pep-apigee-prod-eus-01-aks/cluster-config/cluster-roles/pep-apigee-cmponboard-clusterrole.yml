---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pep-apigee-cmponboard-clusterrole
rules: 
-   apiGroups:
    - ''
    resources:
    - namespaces
    - serviceaccounts
    verbs:
    - create
    - list
    - get
-   apiGroups:
    - 'rbac.authorization.k8s.io'
    resources:
    - rolebindings
    verbs:
    - create
    - list
    - get
-   apiGroups:
    - 'rbac.authorization.k8s.io'
    resources:
    - clusterroles
    verbs:
    - bind
    resourceNames:
    - pep-apigee-developer-clusterrole
    - pep-apigee-springcloudk8s-clusterrole
    - pep-apigee-appsupport-clusterrole   
