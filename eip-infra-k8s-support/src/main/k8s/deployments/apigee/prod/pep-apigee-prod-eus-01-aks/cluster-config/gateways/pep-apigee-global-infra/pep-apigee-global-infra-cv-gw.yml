---
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: pep-apigee-global-infra-cv-gw
  namespace: pep-apigee-global-infra
spec:
  selector:
    istio: pep-apigee-ingress-gw01
  servers:
  - hosts:
    - "dummy-passthrough-pep-apigee-global-infra.gw01.aks01.eus.prod.azure.intra.pepsico.com"
    name: "pep-apigee-global-infra-cv-gw-tls-443"
    port:
      name: "https-pep-apigee-global-infra-cv-gw-tls-443"
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: PASSTHROUGH
  - hosts:
    - pep-apigee-nginx-curl.apigee.gw01.aks01.eus.prod.azure.intra.pepsico.com
    name: "pep-apigee-global-infra-cv-gw-https-443"
    port:
      name: "https-pep-apigee-global-infra-cv-gw-443"
      number: 443
      protocol: https
    tls:
      cipherSuites:
      - AES128-GCM-SHA256
      - AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-SHA
      - ECDHE-ECDSA-AES256-SHA
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      credentialName: "pep-apigee-prod-eus-01-aks-gw01-tls"
      maxProtocolVersion: TLSV1_3
      minProtocolVersion: TLSV1_2
      mode: SIMPLE
  - hosts:
    - pep-apigee-nginx-curl.apigee.gw01.aks01.eus.prod.azure.intra.pepsico.com
    name: "pep-apigee-global-infra-cv-gw-http-80"
    port:
      name: "http-pep-apigee-global-infra-cv-gw-80"
      number: 80
      protocol: http
    tls:
      httpsRedirect: true
