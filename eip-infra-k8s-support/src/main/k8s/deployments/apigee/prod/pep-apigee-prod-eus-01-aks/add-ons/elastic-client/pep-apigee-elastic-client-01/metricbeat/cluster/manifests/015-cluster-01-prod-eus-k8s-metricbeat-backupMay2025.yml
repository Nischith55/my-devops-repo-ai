      - module: system
        enabled: false

      # ~~
      # kubernetes: add metrics from metrics endpoint
      # ~~
      - module: kubernetes
        enabled: true
        add_metadata: true
        period: 30s
        hosts:
        - kube-state-metrics.${KUBE_STATE_METRICS_NAMESPACE}.svc:${KUBE_STATE_METRICS_PORT}
        metricsets:
        - state_node
        - state_deployment
        - state_daemonset
        - state_replicaset
        - state_pod
        - state_container
        - state_cronjob
        - state_resourcequota
        - state_statefulset
        - state_service
        - state_persistentvolume
        - state_persistentvolumeclaim
        - state_storageclass
        # k8s events
        - event

      # ~~
      # kubernetes: add metrics from apiserver
      # ~~
      - module: kubernetes
        enabled: true
        period: 30s
        hosts:
        - https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}
        metricsets:
        - apiserver
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        ssl:
