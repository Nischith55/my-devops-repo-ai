apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:  
  name: pep-eiap-k8sautomation-clusterrole
rules:
- apiGroups:
  - ''
  resources:
  - namespaces
  - persistentvolumeclaims
  - pods
  - pods/status
  - pods/exec
  - pods/log
  - events
  verbs:
  - get
  - list
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - list
- apiGroups:
  - storage.k8s.io
  resources:
  - storageclasses
  verbs:
  - get
  - list