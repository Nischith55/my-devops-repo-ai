apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:  
  name: pep-eiap-k8sautomation-clusterrole
rules:
- apiGroups:
  - ''
  resources:
  - namespaces
  - persistentvolumeclaims
  - events
  - nodes
  - configmaps
  verbs:
  - get
  - list
- apiGroups:
  - ''
  resources:
  - pods
  - podtemplates
  - pods/attach
  - pods/binding
  - pods/eviction
  - pods/exec
  - pods/log
  - pods/status
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - deployments  
  - deployments/scale
  verbs:
  - get
  - list
  - patch
  - update
- apiGroups:
  - storage.k8s.io
  resources:
  - storageclasses
  verbs:
  - get
  - list
- apiGroups:
  - policy
  resources:
  - poddisruptionbudgets
  verbs:
  - '*'
- apiGroups:
  - networking.istio.io
  resources:
  - virtualservices
  - destinationrules
  verbs:
  - create
  - get
  - list
  - patch
  - update
- apiGroups: [""] 
  resources: [resourcequotas] 
  verbs: ['*'] 
- apiGroups: [""] 
  resources: [namespaces, nodes, services, persistentvolumes] 
  verbs: [get, list, watch] 
- apiGroups: [""] 
  resources: [serviceaccounts, configmaps, secrets, pods] 
  verbs: [get, list, watch, create] 
- apiGroups: [rbac.authorization.k8s.io] 
  resources: [roles, rolebindings, clusterroles, clusterrolebindings] 
  verbs: [get, list, watch, create] 
- apiGroups: [apps] 
  resources: [daemonsets, deployments, replicasets, statefulsets] 
  verbs: [get, list, watch] 
- apiGroups: [batch] 
  resources: [jobs, cronjobs] 
  verbs: [get, list, watch] 
- apiGroups: [admissionregistration.k8s.io] 
  resources: [validatingwebhookconfigurations, mutatingwebhookconfigurations] 
  verbs: [get, list, watch]