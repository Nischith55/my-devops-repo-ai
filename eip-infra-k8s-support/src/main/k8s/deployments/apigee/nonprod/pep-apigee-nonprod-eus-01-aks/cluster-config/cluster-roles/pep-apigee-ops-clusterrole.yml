apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pep-apigee-ops-clusterrole
rules: 
-   apiGroups:
    - ''
    resources:
    - nodes
    - namespaces
    - persistentvolumes
    - configmaps
    - events
    - persistentvolumeclaims
    - pods
    - pods/log
    - pods/portforward
    - pods/status
    - endpoints
    - services
    - secret
    verbs:
    - list
    - watch
    - get
    - update
-   apiGroups:
    - ''
    resources:
    - pods/exec
    verbs:
    - create
-   apiGroups:
    - apps
    resources:
    - deployments
    - replicasets
    - statefulsets
    - daemonsets
    verbs:
    - list
    - get
    - watch
-   apiGroups:
    - storage.k8s.io
    resources:
    - storageclasses
    verbs:
    - list
    - watch
-   apiGroups:
    - autoscaling
    resources:
    - horizontalpodautoscalers
    verbs:
    - list
    - get
-   apiGroups:
    - metrics.k8s.io
    resources:
    - nodes
    - pod
    verbs:
    - list
    - get
-   apiGroups:
    - batch
    resources:
    - jobs
    - cronjobs
    verbs:
    - list
    - get
