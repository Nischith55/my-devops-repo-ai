apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: eiapapigee
  name: eiapapigee-vs
  namespace: api-marketplace
spec:
  gateways:
  - api-marketplace/api-marketplace-cv-gw
  hosts:
  - pepxchange.apigee.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  - developer.dev.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: eiapapigee.api-marketplace.svc.cluster.local
        port:
          number: 80
