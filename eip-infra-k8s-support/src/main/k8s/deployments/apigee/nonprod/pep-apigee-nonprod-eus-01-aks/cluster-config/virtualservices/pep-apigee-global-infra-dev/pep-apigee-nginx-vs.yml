apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: pep-apigee-nginx
  name: pep-apigee-nginx-vs
  namespace: pep-apigee-global-infra-dev
spec:
  gateways:
  - pep-apigee-global-infra-dev/pep-apigee-global-infra-dev-cv-gw
  hosts:
  - pep-apigee-nginx-curl.apigee.gw01.aks01.eus.nonprod.azure.intra.pepsico.com
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: /
    route:
    - destination:
        host: pep-apigee-nginx.pep-apigee-global-infra-dev.svc.cluster.local
        port:
          number: 8080
