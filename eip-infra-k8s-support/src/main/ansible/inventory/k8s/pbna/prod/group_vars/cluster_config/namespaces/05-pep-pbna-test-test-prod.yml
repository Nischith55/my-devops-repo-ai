---
ns_pep_pbna_test_test_prod:
  
  name: pep-pbna-test-test-prod
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: test-test
    sector: test
    project: test
    crosscharge_aks: direct
    istio-injection: enabled
    servicename_aks: sample-ns
    istio.io/rev: prod-stable
    environment: prod
    env-prod: "true"

  service_accounts:
    - name: pep-pbna-test-test-prod-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-pbna-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-pbna-appsupport-rb
      subjects:
        - "{{ k8s_sup_subjects['test_test'] }}"
      roleref:
         "{{ k8s_role_ref['appsupprt_rb'] }}"
  secrets: 
    name: pep-pbna-test-test-prod-sa-token
    namespace: pep-pbna-test-test-prod
    annotations:
      kubernetes.io/service-account.name : "pep-pbna-test-test-prod-sa"
