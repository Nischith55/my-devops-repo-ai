---
ns_pep_pbna_pbna_savvy_qa:
  
  name: pep-pbna-pbna-savvy-qa
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: pbna-savvy
    sector: pbna
    project: savvy
    crosscharge_aks: direct
    istio-injection: enabled
    istio.io/rev: nonprod-stable
    environment: nonprod
    env-qa: "true"

  service_accounts:
    - name: pep-pbna-pbna-savvy-qa-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-pbna-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-pbna-developer-rb
      subjects:
        - "{{ k8s_sup_subjects['pbna_savvy'] }}"
      roleref:
        "{{ k8s_role_ref['developer_rb'] }}"
  secrets: 
    name: pep-pbna-pbna-savvy-qa-sa-token
    namespace: pep-pbna-pbna-savvy-qa
    annotations:
      kubernetes.io/service-account.name : "pep-pbna-pbna-savvy-qa-sa"
