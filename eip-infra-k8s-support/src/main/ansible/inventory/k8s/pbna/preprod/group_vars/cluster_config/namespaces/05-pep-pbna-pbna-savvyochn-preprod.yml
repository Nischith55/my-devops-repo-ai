---
ns_pep_pbna_pbna_savvyochn_preprod:
  
  name: pep-pbna-pbna-savvyochn-preprod
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: pbna-savvyochn
    sector: pbna
    project: savvyochn
    crosscharge_aks: direct
    istio-injection: enabled
    servicename_aks: pbnasavvyoch
    pep-cmdb-app-service-id: "0f985d81473e2ad0f206dcdb416d43ae"
    pep-cmdb-bus-app-id: "6f3ba19d1b7228105f7bcbf2604bcb76"
    pep-environment: "Preprod"
    istio.io/rev: preprod-stable
    environment: preprod
    env-preprod: "true"

  service_accounts:
    - name: pep-pbna-pbna-savvyochn-preprod-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-pbna-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-pbna-appsupport-rb
      subjects:
        - "{{ k8s_sup_subjects['pbna_savvyochn'] }}"
      roleref:
         "{{ k8s_role_ref['appsupprt_rb'] }}"
  secrets: 
    name: pep-pbna-pbna-savvyochn-preprod-sa-token
    namespace: pep-pbna-pbna-savvyochn-preprod
    annotations:
      kubernetes.io/service-account.name : "pep-pbna-pbna-savvyochn-preprod-sa"
