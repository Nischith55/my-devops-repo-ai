---
ns_pep_pfna_flna_transp_qa:
  
  name: pep-pfna-flna-transp-qa
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: flna-transp
    sector: flna
    project: transp
    crosscharge_aks: direct
    istio-injection: enabled
    servicename_aks: dps-dispatchplanningsystemnon-prod
    pep-cmdb-app-service-id: "d87268438783d11c2b90426d0ebb3576"
    pep-cmdb-bus-app-id: "0cbe08f9db3e8c10c2b5f38139961928"
    pep-environment: "QA"
    istio.io/rev: nonprod-stable
    environment: nonprod
    env-qa: "true"

  service_accounts:
    - name: pep-pfna-flna-transp-qa-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-pfna-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-pfna-developer-rb
      subjects:
        - "{{ k8s_sup_subjects['flna_transp'] }}"
      roleref:
        "{{ k8s_role_ref['developer_rb'] }}"
  secrets: 
    name: pep-pfna-flna-transp-qa-sa-token
    namespace: pep-pfna-flna-transp-qa
    annotations:
      kubernetes.io/service-account.name : "pep-pfna-flna-transp-qa-sa"
