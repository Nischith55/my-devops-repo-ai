---
ns_pep_pfna_test_test1_dev:
  
  name: pep-pfna-test-test1-dev
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: test-test1
    sector: test
    project: test1
    crosscharge_aks: direct
    istio-injection: enabled
    servicename_aks: myidmprod
    pep-cmdb-app-service-id: "3bb2a06e1bb9c5d03b070ed8cc4bcbf7"
    pep-cmdb-bus-app-id: "79cec07ddb3e8c10c2b5f38139961954"
    pep-environment: "Production"
    istio.io/rev: nonprod-stable
    environment: nonprod
    env-dev: "true"

  service_accounts:
    - name: pep-pfna-test-test1-dev-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-pfna-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-pfna-developer-rb
      subjects:
        - "{{ k8s_sup_subjects['test_test1'] }}"
      roleref:
        "{{ k8s_role_ref['developer_rb'] }}"
  secrets: 
    name: pep-pfna-test-test1-dev-sa-token
    namespace: pep-pfna-test-test1-dev
    annotations:
      kubernetes.io/service-account.name : "pep-pfna-test-test1-dev-sa"
