---
ns_pep_pfna_test_test2_dev:
  
  name: pep-pfna-test-test2-dev
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: test-test2
    sector: test
    project: test2
    istio.io/rev: nonprod-stable
    environment: nonprod
    env-dev: "true"

  service_accounts:
    - name: pep-pfna-test-test2-dev-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-pfna-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-pfna-developer-rb
      subjects:
        - "{{ k8s_sup_subjects['test_test2'] }}"
      roleref:
        "{{ k8s_role_ref['developer_rb'] }}"
