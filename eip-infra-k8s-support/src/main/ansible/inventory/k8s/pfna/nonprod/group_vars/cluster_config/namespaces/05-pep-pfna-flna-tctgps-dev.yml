---
ns_pep_pfna_flna_tctgps_dev:
  
  name: pep-pfna-flna-tctgps-dev
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: flna-tctgps
    sector: flna
    project: tctgps
    crosscharge_aks: direct
    istio-injection: enabled
    servicename_aks: supplychainhub
    pep-cmdb-app-service-id: "1f4542cc97b52d504bb8326e6253af8b"
    pep-cmdb-bus-app-id: "ba4502cc97b52d504bb8326e6253af48"
    pep-environment: "Development"
    istio.io/rev: nonprod-stable
    environment: nonprod
    env-dev: "true"

  service_accounts:
    - name: pep-pfna-flna-tctgps-dev-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-pfna-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-pfna-developer-rb
      subjects:
        - "{{ k8s_sup_subjects['flna_tctgps'] }}"
      roleref:
        "{{ k8s_role_ref['developer_rb'] }}"
  secrets: 
    name: pep-pfna-flna-tctgps-dev-sa-token
    namespace: pep-pfna-flna-tctgps-dev
    annotations:
      kubernetes.io/service-account.name : "pep-pfna-flna-tctgps-dev-sa"
