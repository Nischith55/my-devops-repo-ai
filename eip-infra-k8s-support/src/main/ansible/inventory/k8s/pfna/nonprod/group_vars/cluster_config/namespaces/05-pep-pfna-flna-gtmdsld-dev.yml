---
ns_pep_pfna_flna_gtmdsld_dev:
  
  name: pep-pfna-flna-gtmdsld-dev
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: flna-gtmdsld
    sector: flna
    project: gtmdsld
    istio.io/rev: nonprod-stable
    environment: nonprod
    env-dev: "true"

  service_accounts:
    - name: pep-pfna-flna-gtmdsld-dev-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-pfna-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-pfna-developer-rb
      subjects:
        - "{{ k8s_sup_subjects['flna_gtmdsld'] }}"
      roleref:
        "{{ k8s_role_ref['developer_rb'] }}"
