---
ns_pep_pfna_flna_schwmi_prod:
  
  name: pep-pfna-flna-schwmi-prod
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: flna-schwmi
    sector: flna
    project: schwmi
    crosscharge_aks: direct
    istio-injection: enabled
    servicename_aks: scwarehouseintegratorprod
    pep-cmdb-app-service-id: "e1b054e9831e16106a4357d0deaad3e6"
    pep-cmdb-bus-app-id: "ba4502cc97b52d504bb8326e6253af48"
    pep-environment: "Production"
    istio.io/rev: prod-stable
    environment: prod
    env-prod: "true"

  service_accounts:
    - name: pep-pfna-flna-schwmi-prod-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-pfna-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-pfna-appsupport-rb
      subjects:
        - "{{ k8s_sup_subjects['flna_schwmi'] }}"
      roleref:
         "{{ k8s_role_ref['appsupprt_rb'] }}"
  secrets: 
    name: pep-pfna-flna-schwmi-prod-sa-token
    namespace: pep-pfna-flna-schwmi-prod
    annotations:
      kubernetes.io/service-account.name : "pep-pfna-flna-schwmi-prod-sa"
