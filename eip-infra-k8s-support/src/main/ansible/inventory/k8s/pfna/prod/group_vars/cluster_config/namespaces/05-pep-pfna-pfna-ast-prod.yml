---
ns_pep_pfna_pfna_ast_prod:
  
  name: pep-pfna-pfna-ast-prod
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: pfna-ast
    sector: pfna
    project: ast
    crosscharge_aks: direct
    istio-injection: enabled
    servicename_aks: salespro-plusprod
    pep-cmdb-app-service-id: "913f3e961b8c70908fd586e3604bcb42"
    pep-cmdb-bus-app-id: "513f3e961b8c70908fd586e3604bcb60"
    pep-environment: "Production"
    istio.io/rev: prod-stable
    environment: prod
    env-prod: "true"

  service_accounts:
    - name: pep-pfna-pfna-ast-prod-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-pfna-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-pfna-appsupport-rb
      subjects:
        - "{{ k8s_sup_subjects['pfna_ast'] }}"
      roleref:
         "{{ k8s_role_ref['appsupprt_rb'] }}"
  secrets: 
    name: pep-pfna-pfna-ast-prod-sa-token
    namespace: pep-pfna-pfna-ast-prod
    annotations:
      kubernetes.io/service-account.name : "pep-pfna-pfna-ast-prod-sa"
