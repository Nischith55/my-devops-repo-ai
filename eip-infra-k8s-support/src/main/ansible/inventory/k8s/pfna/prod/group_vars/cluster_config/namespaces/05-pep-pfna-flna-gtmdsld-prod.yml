---
ns_pep_pfna_flna_gtmdsld_prod:
  
  name: pep-pfna-flna-gtmdsld-prod
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: flna-gtmdsld
    sector: flna
    project: gtmdsld
    istio.io/rev: prod-stable
    environment: prod
    env-prod: "true"

  service_accounts:
    - name: pep-pfna-flna-gtmdsld-prod-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-pfna-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-pfna-appsupport-rb
      subjects:
        - "{{ k8s_sup_subjects['flna_gtmdsld'] }}"
      roleref:
         "{{ k8s_role_ref['appsupprt_rb'] }}"
