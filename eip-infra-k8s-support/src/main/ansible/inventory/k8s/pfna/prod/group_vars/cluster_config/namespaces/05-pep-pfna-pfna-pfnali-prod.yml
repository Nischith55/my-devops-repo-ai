---
ns_pep_pfna_pfna_pfnali_prod:
  
  name: pep-pfna-pfna-pfnali-prod
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: pfna-pfnali
    sector: pfna
    project: pfnali
    crosscharge_aks: direct
    istio-injection: enabled
    servicename_aks: handheldnext
    istio.io/rev: prod-stable
    environment: prod
    env-prod: "true"

  service_accounts:
    - name: pep-pfna-pfna-pfnali-prod-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-pfna-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-pfna-appsupport-rb
      subjects:
        - "{{ k8s_sup_subjects['pfna_pfnali'] }}"
      roleref:
         "{{ k8s_role_ref['appsupprt_rb'] }}"
  secrets: 
    name: pep-pfna-pfna-pfnali-prod-sa-token
    namespace: pep-pfna-pfna-pfnali-prod
    annotations:
      kubernetes.io/service-account.name : "pep-pfna-pfna-pfnali-prod-sa"
