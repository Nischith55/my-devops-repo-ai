---
ns_pep_pfna_flna_ast_prod:
  
  name: pep-pfna-flna-ast-prod
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: flna-ast
    sector: flna
    project: ast
    crosscharge_aks: direct
    istio-injection: enabled
    servicename_aks: pfnagtmwebapps
    pep-cmdb-app-service-id: "8cbcd08d93141e540442b32a6aba1070"
    pep-cmdb-bus-app-id: "59ee1492878e9510d6130dc5cebb359b"
    pep-environment: "Production"
    istio.io/rev: prod-stable
    environment: prod
    env-prod: "true"

  service_accounts:
    - name: pep-pfna-flna-ast-prod-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-pfna-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-pfna-appsupport-rb
      subjects:
        - "{{ k8s_sup_subjects['flna_ast'] }}"
      roleref:
         "{{ k8s_role_ref['appsupprt_rb'] }}"
  secrets: 
    name: pep-pfna-flna-ast-prod-sa-token
    namespace: pep-pfna-flna-ast-prod
    annotations:
      kubernetes.io/service-account.name : "pep-pfna-flna-ast-prod-sa"
