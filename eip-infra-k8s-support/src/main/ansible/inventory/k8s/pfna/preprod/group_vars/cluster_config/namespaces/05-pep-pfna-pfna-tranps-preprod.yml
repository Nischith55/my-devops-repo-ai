---
ns_pep_pfna_pfna_tranps_preprod:
  
  name: pep-pfna-pfna-tranps-preprod
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: pfna-tranps
    sector: pfna
    project: tranps
    crosscharge_aks: direct
    istio-injection: enabled
    istio.io/rev: preprod-stable
    environment: preprod
    env-preprod: "true"

  service_accounts:
    - name: pep-pfna-pfna-tranps-preprod-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-pfna-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-pfna-appsupport-rb
      subjects:
        - "{{ k8s_sup_subjects['pfna_tranps'] }}"
      roleref:
         "{{ k8s_role_ref['appsupprt_rb'] }}"
  secrets: 
    name: pep-pfna-pfna-tranps-preprod-sa-token
    namespace: pep-pfna-pfna-tranps-preprod
    annotations:
      kubernetes.io/service-account.name : "pep-pfna-pfna-tranps-preprod-sa"
