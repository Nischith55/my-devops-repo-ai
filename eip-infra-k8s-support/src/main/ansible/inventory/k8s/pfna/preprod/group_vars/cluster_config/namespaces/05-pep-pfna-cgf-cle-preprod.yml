---
# ##
# IMPORTANT:
#  Variable Name Convention:
#   - Always start with 'ns_'
#   - replace '-' with '_' in the namespace name
# ##

# Namespace cgf cle 
# IMPORTANT:
#  - change environment and add or remove flag env-{dev, qa, prod or preprod etc}

ns_pep_pfna_cgf_cle_preprod:

  name: pep-pfna-cgf-cle-preprod

  # ALL label values MUST be string, quote native yaml types
  labels:
    team: cgf-cle
    sector: cgf
    project: cle
    istio.io/rev: preprod-stable
    environment: preprod
    env-preprod: "true"

  role_bindings:

    # appsupport role
    - name: pep-pfna-appsupport-rb
      subjects:
        - "{{ k8s_sup_subjects['cgf_cle'] }}"

  # service accounts for this namespace
  service_accounts:

    # no specific role as of now
    - name: pep-pfna-cgf-cle-preprod-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-pfna-springcloudk8s-rb
