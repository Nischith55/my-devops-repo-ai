---
ns_pep_pfna_flna_schwmi_preprod:
  
  name: pep-pfna-flna-schwmi-preprod
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: flna-schwmi
    sector: flna
    project: schwmi
    crosscharge_aks: direct
    istio-injection: enabled
    servicename_aks: supplychainhub
    pep-cmdb-app-service-id: "1f4542cc97b52d504bb8326e6253af8b"
    pep-cmdb-bus-app-id: "ba4502cc97b52d504bb8326e6253af48"
    pep-environment: "Preprod"
    istio.io/rev: preprod-stable
    environment: preprod
    env-preprod: "true"

  service_accounts:
    - name: pep-pfna-flna-schwmi-preprod-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-pfna-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-pfna-appsupport-rb
      subjects:
        - "{{ k8s_sup_subjects['flna_schwmi'] }}"
      roleref:
         "{{ k8s_role_ref['appsupprt_rb'] }}"
  secrets: 
    name: pep-pfna-flna-schwmi-preprod-sa-token
    namespace: pep-pfna-flna-schwmi-preprod
    annotations:
      kubernetes.io/service-account.name : "pep-pfna-flna-schwmi-preprod-sa"
