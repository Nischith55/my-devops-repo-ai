---
ns_pep_snt_latam_latamgscaf_prod:
  
  name: pep-snt-latam-latamgscaf-prod
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: latam-latamgscaf
    sector: latam
    project: latamgscaf
    istio.io/rev: prod-stable
    environment: prod
    env-prod: "true"

  service_accounts:
    - name: pep-snt-latam-latamgscaf-prod-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-snt-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-snt-appsupport-rb
      subjects:
        - "{{ k8s_sup_subjects['latam_latamgscaf'] }}"
      roleref:
         "{{ k8s_role_ref['appsupprt_rb'] }}"
