---
ns_pep_snt_cgf_dsxadaptor_prod:
  
  name: pep-snt-cgf-dsxadaptor-prod
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: cgf-dsxadaptor
    sector: cgf
    project: dsxadaptor
    crosscharge_aks: direct
    istio-injection: enabled
    servicename_aks: retail360-aksclusterprod
    pep-cmdb-app-service-id: "d0ec416887e619944751326e0ebb354d"
    pep-cmdb-bus-app-id: "327967b31be36010b050c992604bcbc8"
    pep-environment: "Production"
    istio.io/rev: prod-stable
    environment: prod
    env-prod: "true"

  service_accounts:
    - name: pep-snt-cgf-dsxadaptor-prod-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-snt-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-snt-appsupport-rb
      subjects:
        - "{{ k8s_sup_subjects['cgf_dsxadaptor'] }}"
      roleref:
         "{{ k8s_role_ref['appsupprt_rb'] }}"
  secrets: 
    name: pep-snt-cgf-dsxadaptor-prod-sa-token
    namespace: pep-snt-cgf-dsxadaptor-prod
    annotations:
      kubernetes.io/service-account.name : "pep-snt-cgf-dsxadaptor-prod-sa"
