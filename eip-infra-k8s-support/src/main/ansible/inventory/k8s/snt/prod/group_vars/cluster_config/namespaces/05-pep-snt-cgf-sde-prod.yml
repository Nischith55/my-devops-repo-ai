---
ns_pep_snt_cgf_sde_prod:
  
  name: pep-snt-cgf-sde-prod
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: cgf-sde
    sector: cgf
    project: sde
    istio.io/rev: prod-stable
    environment: prod
    env-prod: "true"

  service_accounts:
    - name: pep-snt-cgf-sde-prod-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-snt-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-snt-appsupport-rb
      subjects:
        - "{{ k8s_sup_subjects['cgf_sde'] }}"
      roleref:
         "{{ k8s_role_ref['appsupprt_rb'] }}"
