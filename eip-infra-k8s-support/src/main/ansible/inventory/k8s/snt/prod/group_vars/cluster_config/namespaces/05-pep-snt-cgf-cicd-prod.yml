---
ns_pep_snt_cgf_cicd_prod:
  
  name: pep-snt-cgf-cicd-prod
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: cgf-cicd
    sector: cgf
    project: cicd
    istio.io/rev: prod-stable
    environment: prod
    env-prod: "true"

  service_accounts:
    - name: pep-snt-cgf-cicd-prod-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-snt-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-snt-appsupport-rb
      subjects:
        - "{{ k8s_sup_subjects['cgf_cicd'] }}"
      roleref:
         "{{ k8s_role_ref['appsupprt_rb'] }}"
  secrets: 
    name: pep-snt-cgf-cicd-prod-sa-token
    namespace: pep-snt-cgf-cicd-prod
    annotations:
      kubernetes.io/service-account.name : "pep-snt-cgf-cicd-prod-sa"
