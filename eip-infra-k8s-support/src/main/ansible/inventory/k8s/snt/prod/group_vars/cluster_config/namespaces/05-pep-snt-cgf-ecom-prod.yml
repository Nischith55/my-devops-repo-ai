---
ns_pep_snt_cgf_ecom_prod:
  
  name: pep-snt-cgf-ecom-prod
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: cgf-ecom
    sector: cgf
    project: ecom
    istio.io/rev: prod-stable
    environment: prod
    env-prod: "true"

  service_accounts:
    - name: pep-snt-cgf-ecom-prod-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-snt-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-snt-appsupport-rb
      subjects:
        - "{{ k8s_sup_subjects['cgf_ecom'] }}"
      roleref:
         "{{ k8s_role_ref['appsupprt_rb'] }}"
