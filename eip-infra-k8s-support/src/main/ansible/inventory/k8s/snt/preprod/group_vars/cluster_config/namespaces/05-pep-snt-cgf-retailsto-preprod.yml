---
ns_pep_snt_cgf_retailsto_preprod:
  
  name: pep-snt-cgf-retailsto-preprod
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: cgf-retailsto
    sector: cgf
    project: retailsto
    istio.io/rev: preprod-stable
    environment: preprod
    env-preprod: "true"

  service_accounts:
    - name: pep-snt-cgf-retailsto-preprod-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-snt-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-snt-appsupport-rb
      subjects:
        - "{{ k8s_sup_subjects['cgf_retailsto'] }}"
      roleref:
         "{{ k8s_role_ref['appsupprt_rb'] }}"
