---
ns_pep_snt_cgf_walmart_dev:
  
  name: pep-snt-cgf-walmart-dev
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: cgf-walmart
    sector: cgf
    project: walmart
    istio.io/rev: nonprod-stable
    environment: nonprod
    env-dev: "true"

  service_accounts:
    - name: pep-snt-cgf-walmart-dev-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-snt-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-snt-developer-rb
      subjects:
        - "{{ k8s_sup_subjects['cgf_walmart'] }}"
      roleref:
        "{{ k8s_role_ref['developer_rb'] }}"
