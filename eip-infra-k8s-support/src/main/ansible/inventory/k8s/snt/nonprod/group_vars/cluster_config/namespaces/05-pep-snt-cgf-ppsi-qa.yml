---
ns_pep_snt_cgf_ppsi_qa:
  
  name: pep-snt-cgf-ppsi-qa
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: cgf-ppsi
    sector: cgf
    project: ppsi
    crosscharge_aks: direct
    istio-injection: enabled
    servicename_aks: productportfolio-sustainabilityinsights
    pep-cmdb-app-service-id: "29e7773d-ed93-4dfe-9426-76be102605f0"
    pep-cmdb-bus-app-id: "9dfd70d493cd2a545161bd0b6aba10de"
    pep-environment: "QA"
    istio.io/rev: nonprod-stable
    environment: nonprod
    env-qa: "true"

  service_accounts:
    - name: pep-snt-cgf-ppsi-qa-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-snt-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-snt-developer-rb
      subjects:
        - "{{ k8s_sup_subjects['cgf_ppsi'] }}"
      roleref:
        "{{ k8s_role_ref['developer_rb'] }}"
  secrets: 
    name: pep-snt-cgf-ppsi-qa-sa-token
    namespace: pep-snt-cgf-ppsi-qa
    annotations:
      kubernetes.io/service-account.name : "pep-snt-cgf-ppsi-qa-sa"
