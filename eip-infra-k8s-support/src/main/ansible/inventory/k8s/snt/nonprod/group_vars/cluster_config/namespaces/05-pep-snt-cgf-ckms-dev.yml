---
ns_pep_snt_cgf_ckms_dev:
  
  name: pep-snt-cgf-ckms-dev
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: cgf-ckms
    sector: cgf
    project: ckms
    crosscharge_aks: direct
    istio-injection: enabled
    servicename_aks: consultingknowledgemanagementsystem
    pep-cmdb-app-service-id: "f48d1eba-a88d-4d46-9293-f2e50ea320cb"
    pep-cmdb-bus-app-id: "a22f4a6c47019e908ab39bbb116d4334"
    pep-environment: "Development"
    istio.io/rev: nonprod-stable
    environment: nonprod
    env-dev: "true"

  service_accounts:
    - name: pep-snt-cgf-ckms-dev-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-snt-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-snt-developer-rb
      subjects:
        - "{{ k8s_sup_subjects['cgf_ckms'] }}"
      roleref:
        "{{ k8s_role_ref['developer_rb'] }}"
  secrets: 
    name: pep-snt-cgf-ckms-dev-sa-token
    namespace: pep-snt-cgf-ckms-dev
    annotations:
      kubernetes.io/service-account.name : "pep-snt-cgf-ckms-dev-sa"
