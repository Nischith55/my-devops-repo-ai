---
ns_pep_snt_cgf_retail_qa:
  
  name: pep-snt-cgf-retail-qa
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: cgf-retail
    sector: cgf
    project: retail
    istio.io/rev: nonprod-stable
    environment: nonprod
    env-qa: "true"

  service_accounts:
    - name: pep-snt-cgf-retail-qa-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-snt-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-snt-developer-rb
      subjects:
        - "{{ k8s_sup_subjects['cgf_retail'] }}"
      roleref:
        "{{ k8s_role_ref['developer_rb'] }}"
  secrets: 
    name: pep-snt-cgf-retail-qa-sa-token
    namespace: pep-snt-cgf-retail-qa
    annotations:
      kubernetes.io/service-account.name : "pep-snt-cgf-retail-qa-sa"
