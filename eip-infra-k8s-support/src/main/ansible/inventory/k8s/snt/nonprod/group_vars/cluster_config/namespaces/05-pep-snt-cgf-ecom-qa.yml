---
ns_pep_snt_cgf_ecom_qa:
  
  name: pep-snt-cgf-ecom-qa
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: cgf-ecom
    sector: cgf
    project: ecom
    istio.io/rev: nonprod-stable
    environment: nonprod
    env-qa: "true"

  service_accounts:
    - name: pep-snt-cgf-ecom-qa-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-snt-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-snt-developer-rb
      subjects:
        - "{{ k8s_sup_subjects['cgf_ecom'] }}"
      roleref:
        "{{ k8s_role_ref['developer_rb'] }}"
