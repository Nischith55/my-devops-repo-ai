---
ns_pep_snt_cgf_adapter_dev:
  
  name: pep-snt-cgf-adapter-dev
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: cgf-adapter
    sector: cgf
    project: adapter
    crosscharge_aks: direct
    istio-injection: enabled
    servicename_aks: retail360-aksclusterprod
    pep-cmdb-app-service-id: "d0ec416887e619944751326e0ebb354d"
    pep-cmdb-bus-app-id: "327967b31be36010b050c992604bcbc8"
    pep-environment: "Development"
    istio.io/rev: nonprod-stable
    environment: nonprod
    env-dev: "true"

  service_accounts:
    - name: pep-snt-cgf-adapter-dev-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-snt-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-snt-developer-rb
      subjects:
        - "{{ k8s_sup_subjects['cgf_adapter'] }}"
      roleref:
        "{{ k8s_role_ref['developer_rb'] }}"
  secrets: 
    name: pep-snt-cgf-adapter-dev-sa-token
    namespace: pep-snt-cgf-adapter-dev
    annotations:
      kubernetes.io/service-account.name : "pep-snt-cgf-adapter-dev-sa"
