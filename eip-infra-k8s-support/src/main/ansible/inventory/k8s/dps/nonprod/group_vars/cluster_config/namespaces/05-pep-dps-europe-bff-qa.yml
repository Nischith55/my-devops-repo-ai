---
ns_pep_dps_europe_bff_qa:
  
  name: pep-dps-europe-bff-qa
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: europe-bff
    sector: europe
    project: bff
    crosscharge_aks: direct
    istio-injection: enabled
    servicename_aks: pepsiconnectb2bportaldominicanrepublicmenegocio-plusnon-prod
    istio.io/rev: nonprod-stable
    environment: nonprod
    env-qa: "true"

  service_accounts:
    - name: pep-dps-europe-bff-qa-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-dps-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-dps-developer-rb
      subjects:
        - "{{ k8s_sup_subjects['europe_bff'] }}"
      roleref:
        "{{ k8s_role_ref['developer_rb'] }}"
  secrets: 
    name: pep-dps-europe-bff-qa-sa-token
    namespace: pep-dps-europe-bff-qa
    annotations:
      kubernetes.io/service-account.name : "pep-dps-europe-bff-qa-sa"
