---
ns_pep_dps_cgf_dsxdevops_dev:
  
  name: pep-dps-cgf-dsxdevops-dev
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: cgf-dsxdevops
    sector: cgf
    project: dsxdevops
    crosscharge_aks: direct
    istio-injection: enabled
    servicename_aks: dsx_devops_non-prod
    pep-cmdb-app-service-id: "86f547f5838c3250f132cfefeeaad30d"
    pep-cmdb-bus-app-id: "f0624479c3cc7e107e0cfbdf050131fd"
    pep-environment: "Development"
    istio.io/rev: nonprod-stable
    environment: nonprod
    env-dev: "true"

  service_accounts:
    - name: pep-dps-cgf-dsxdevops-dev-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-dps-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-dps-developer-rb
      subjects:
        - "{{ k8s_sup_subjects['cgf_dsxdevops'] }}"
      roleref:
        "{{ k8s_role_ref['developer_rb'] }}"
  secrets: 
    name: pep-dps-cgf-dsxdevops-dev-sa-token
    namespace: pep-dps-cgf-dsxdevops-dev
    annotations:
      kubernetes.io/service-account.name : "pep-dps-cgf-dsxdevops-dev-sa"
