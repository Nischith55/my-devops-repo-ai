---
ns_pep_dps_cgf_vcr_dev:
  
  name: pep-dps-cgf-vcr-dev
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: cgf-vcr
    sector: cgf
    project: vcr
    crosscharge_aks: direct
    istio-injection: enabled
    servicename_aks: dpsdsdvisibilityappservice
    pep-cmdb-app-service-id: "c3ba487fc3ee3194ad658535990131a9"
    pep-cmdb-bus-app-id: "a0ee40fddb3e8c10c2b5f381399619cd"
    pep-environment: "Development"
    istio.io/rev: nonprod-stable
    environment: nonprod
    env-dev: "true"

  service_accounts:
    - name: pep-dps-cgf-vcr-dev-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-dps-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-dps-developer-rb
      subjects:
        - "{{ k8s_sup_subjects['cgf_vcr'] }}"
      roleref:
        "{{ k8s_role_ref['developer_rb'] }}"
  secrets: 
    name: pep-dps-cgf-vcr-dev-sa-token
    namespace: pep-dps-cgf-vcr-dev
    annotations:
      kubernetes.io/service-account.name : "pep-dps-cgf-vcr-dev-sa"
