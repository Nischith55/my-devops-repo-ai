---
ns_pep_dps_cgf_devsol_dev:
  
  name: pep-dps-cgf-devsol-dev
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: cgf-devsol
    sector: cgf
    project: devsol
    crosscharge_aks: direct
    istio-injection: enabled
    servicename_aks: azuredevopsprod
    pep-cmdb-app-service-id: "ae0f134bdbabdf008a0e138b4b9619b5"
    pep-cmdb-bus-app-id: "78ae0cb9db3e8c10c2b5f381399619c2"
    pep-environment: "Development"
    istio.io/rev: nonprod-stable
    environment: nonprod
    env-dev: "true"

  service_accounts:
    - name: pep-dps-cgf-devsol-dev-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-dps-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-dps-developer-rb
      subjects:
        - "{{ k8s_sup_subjects['cgf_devsol'] }}"
      roleref:
        "{{ k8s_role_ref['developer_rb'] }}"
  secrets: 
    name: pep-dps-cgf-devsol-dev-sa-token
    namespace: pep-dps-cgf-devsol-dev
    annotations:
      kubernetes.io/service-account.name : "pep-dps-cgf-devsol-dev-sa"
