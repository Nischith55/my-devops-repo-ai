---
ns_pep_dps_cgf_pepconntur_dev:
  
  name: pep-dps-cgf-pepconntur-dev
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: cgf-pepconntur
    sector: cgf
    project: pepconntur
    crosscharge_aks: direct
    istio-injection: enabled
    istio.io/rev: nonprod-stable
    environment: nonprod
    env-dev: "true"

  service_accounts:
    - name: pep-dps-cgf-pepconntur-dev-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-dps-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-dps-developer-rb
      subjects:
        - "{{ k8s_sup_subjects['cgf_pepconntur'] }}"
      roleref:
        "{{ k8s_role_ref['developer_rb'] }}"
  secrets: 
    name: pep-dps-cgf-pepconntur-dev-sa-token
    namespace: pep-dps-cgf-pepconntur-dev
    annotations:
      kubernetes.io/service-account.name : "pep-dps-cgf-pepconntur-dev-sa"
