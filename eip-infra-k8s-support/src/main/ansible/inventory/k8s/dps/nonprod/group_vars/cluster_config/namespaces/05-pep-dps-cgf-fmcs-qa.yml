---
ns_pep_dps_cgf_fmcs_qa:
  
  name: pep-dps-cgf-fmcs-qa
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: cgf-fmcs
    sector: cgf
    project: fmcs
    crosscharge_aks: direct
    istio-injection: enabled
    istio.io/rev: nonprod-stable
    environment: nonprod
    env-qa: "true"

  service_accounts:
    - name: pep-dps-cgf-fmcs-qa-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-dps-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-dps-developer-rb
      subjects:
        - "{{ k8s_sup_subjects['cgf_fmcs'] }}"
      roleref:
        "{{ k8s_role_ref['developer_rb'] }}"
  secrets: 
    name: pep-dps-cgf-fmcs-qa-sa-token
    namespace: pep-dps-cgf-fmcs-qa
    annotations:
      kubernetes.io/service-account.name : "pep-dps-cgf-fmcs-qa-sa"
