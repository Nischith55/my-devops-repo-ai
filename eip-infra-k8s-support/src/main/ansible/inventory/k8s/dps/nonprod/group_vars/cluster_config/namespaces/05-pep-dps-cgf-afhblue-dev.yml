---
ns_pep_dps_cgf_afhblue_dev:
  
  name: pep-dps-cgf-afhblue-dev
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: cgf-afhblue
    sector: cgf
    project: afhblue
    crosscharge_aks: direct
    istio-injection: enabled
    servicename_aks: dpsdsdvisibilityappservice
    pep-cmdb-app-service-id: "c3ba487fc3ee3194ad658535990131a9"
    pep-cmdb-bus-app-id: "7db533d4834042d4613030226daad3f4"
    pep-environment: "Development"
    istio.io/rev: nonprod-stable
    environment: nonprod
    env-dev: "true"

  service_accounts:
    - name: pep-dps-cgf-afhblue-dev-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-dps-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-dps-developer-rb
      subjects:
        - "{{ k8s_sup_subjects['cgf_afhblue'] }}"
      roleref:
        "{{ k8s_role_ref['developer_rb'] }}"
  secrets: 
    name: pep-dps-cgf-afhblue-dev-sa-token
    namespace: pep-dps-cgf-afhblue-dev
    annotations:
      kubernetes.io/service-account.name : "pep-dps-cgf-afhblue-dev-sa"
