---
ns_pep_dps_europe_bffckout_qa:
  
  name: pep-dps-europe-bffckout-qa
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: europe-bffckout
    sector: europe
    project: bffckout
    crosscharge_aks: direct
    istio-injection: enabled
    servicename_aks: b2bpepsiconnectportaladminbffcheckouteuropenon-prod
    pep-cmdb-app-service-id: "35dc580ec3c9aa10120dddaf0501315a"
    pep-cmdb-bus-app-id: "618c890597d295182db4f9f11153afbd"
    pep-environment: "QA"
    istio.io/rev: nonprod-stable
    environment: nonprod
    env-qa: "true"

  service_accounts:
    - name: pep-dps-europe-bffckout-qa-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-dps-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-dps-developer-rb
      subjects:
        - "{{ k8s_sup_subjects['europe_bffckout'] }}"
      roleref:
        "{{ k8s_role_ref['developer_rb'] }}"
  secrets: 
    name: pep-dps-europe-bffckout-qa-sa-token
    namespace: pep-dps-europe-bffckout-qa
    annotations:
      kubernetes.io/service-account.name : "pep-dps-europe-bffckout-qa-sa"
