---
ns_pep_dps_cgf_bffmxbcp_preprod:
  
  name: pep-dps-cgf-bffmxbcp-preprod
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: cgf-bffmxbcp
    sector: cgf
    project: bffmxbcp
    crosscharge_aks: direct
    istio-injection: enabled
    servicename_aks: pepsiconnectb2bportalmexicodelamanonon-prod
    pep-cmdb-app-service-id: "79808cac834c42942bb0bad6feaad370"
    pep-cmdb-bus-app-id: "618c890597d295182db4f9f11153afbd"
    pep-environment: "Preprod"
    istio.io/rev: preprod-stable
    environment: preprod
    env-preprod: "true"

  service_accounts:
    - name: pep-dps-cgf-bffmxbcp-preprod-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-dps-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-dps-appsupport-rb
      subjects:
        - "{{ k8s_sup_subjects['cgf_bffmxbcp'] }}"
      roleref:
         "{{ k8s_role_ref['appsupprt_rb'] }}"
  secrets: 
    name: pep-dps-cgf-bffmxbcp-preprod-sa-token
    namespace: pep-dps-cgf-bffmxbcp-preprod
    annotations:
      kubernetes.io/service-account.name : "pep-dps-cgf-bffmxbcp-preprod-sa"
