---
ns_pep_dps_europe_btbcarts_preprod:
  
  name: pep-dps-europe-btbcarts-preprod
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: europe-btbcarts
    sector: europe
    project: btbcarts
    crosscharge_aks: direct
    istio-injection: enabled
    servicename_aks: b2bpepsiconnectportalcartseuropenon-prod
    pep-cmdb-app-service-id: "f9be6846970122501351f2c0f053af7a"
    pep-cmdb-bus-app-id: "618c890597d295182db4f9f11153afbd"
    pep-environment: "Preprod"
    istio.io/rev: preprod-stable
    environment: preprod
    env-preprod: "true"

  service_accounts:
    - name: pep-dps-europe-btbcarts-preprod-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-dps-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-dps-appsupport-rb
      subjects:
        - "{{ k8s_sup_subjects['europe_btbcarts'] }}"
      roleref:
         "{{ k8s_role_ref['appsupprt_rb'] }}"
  secrets: 
    name: pep-dps-europe-btbcarts-preprod-sa-token
    namespace: pep-dps-europe-btbcarts-preprod
    annotations:
      kubernetes.io/service-account.name : "pep-dps-europe-btbcarts-preprod-sa"
