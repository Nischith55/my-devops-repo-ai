---
ns_pep_dps_cgf_dsxadaptor_preprod:
  
  name: pep-dps-cgf-dsxadaptor-preprod
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: cgf-dsxadaptor
    sector: cgf
    project: dsxadaptor
    crosscharge_aks: direct
    istio-injection: enabled
    servicename_aks: retail360-aksclusternon-prod
    pep-cmdb-app-service-id: "2c5c1f3d83884210e43247747daad333"
    pep-cmdb-bus-app-id: "327967b31be36010b050c992604bcbc8"
    pep-environment: "Preprod"
    istio.io/rev: preprod-stable
    environment: preprod
    env-preprod: "true"

  service_accounts:
    - name: pep-dps-cgf-dsxadaptor-preprod-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-dps-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-dps-appsupport-rb
      subjects:
        - "{{ k8s_sup_subjects['cgf_dsxadaptor'] }}"
      roleref:
         "{{ k8s_role_ref['appsupprt_rb'] }}"
  secrets: 
    name: pep-dps-cgf-dsxadaptor-preprod-sa-token
    namespace: pep-dps-cgf-dsxadaptor-preprod
    annotations:
      kubernetes.io/service-account.name : "pep-dps-cgf-dsxadaptor-preprod-sa"
