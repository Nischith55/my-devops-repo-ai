---
ns_pep_dps_cgf_pepconnmex_preprod:
  
  name: pep-dps-cgf-pepconnmex-preprod
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: cgf-pepconnmex
    sector: cgf
    project: pepconnmex
    crosscharge_aks: direct
    istio-injection: enabled
    servicename_aks: dpsdsdvisibilityappservice
    istio.io/rev: preprod-stable
    environment: preprod
    env-preprod: "true"

  service_accounts:
    - name: pep-dps-cgf-pepconnmex-preprod-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-dps-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-dps-appsupport-rb
      subjects:
        - "{{ k8s_sup_subjects['cgf_pepconnmex'] }}"
      roleref:
         "{{ k8s_role_ref['appsupprt_rb'] }}"
  secrets: 
    name: pep-dps-cgf-pepconnmex-preprod-sa-token
    namespace: pep-dps-cgf-pepconnmex-preprod
    annotations:
      kubernetes.io/service-account.name : "pep-dps-cgf-pepconnmex-preprod-sa"
