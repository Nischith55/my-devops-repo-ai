---
ns_pep_dps_latam_bff_preprod:
  
  name: pep-dps-latam-bff-preprod
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: latam-bff
    sector: latam
    project: bff
    crosscharge_aks: direct
    istio-injection: enabled
    istio.io/rev: preprod-stable
    environment: preprod
    env-preprod: "true"

  service_accounts:
    - name: pep-dps-latam-bff-preprod-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-dps-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-dps-appsupport-rb
      subjects:
        - "{{ k8s_sup_subjects['latam_bff'] }}"
      roleref:
         "{{ k8s_role_ref['appsupprt_rb'] }}"
  secrets: 
    name: pep-dps-latam-bff-preprod-sa-token
    namespace: pep-dps-latam-bff-preprod
    annotations:
      kubernetes.io/service-account.name : "pep-dps-latam-bff-preprod-sa"
