---
ns_pep_dps_devx_test_prod:
  
  name: pep-dps-devx-test-prod
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: devx-test
    sector: devx
    project: test
    crosscharge_aks: direct
    istio-injection: enabled
    servicename_aks: dsx_adapter_preprod
    pep-cmdb-app-service-id: "f4814adf97487e50bec13ae8c253afdb"
    pep-cmdb-bus-app-id: "f0624479c3cc7e107e0cfbdf050131fd"
    pep-environment: "Prod"
    istio.io/rev: prod-stable
    environment: prod
    env-prod: "true"

  service_accounts:
    - name: pep-dps-devx-test-prod-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-dps-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-dps-appsupport-rb
      subjects:
        - "{{ k8s_sup_subjects['devx_test'] }}"
      roleref:
         "{{ k8s_role_ref['appsupprt_rb'] }}"
  secrets: 
    name: pep-dps-devx-test-prod-sa-token
    namespace: pep-dps-devx-test-prod
    annotations:
      kubernetes.io/service-account.name : "pep-dps-devx-test-prod-sa"
