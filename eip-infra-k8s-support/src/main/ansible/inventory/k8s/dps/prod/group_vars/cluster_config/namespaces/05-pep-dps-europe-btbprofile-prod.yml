---
ns_pep_dps_europe_btbprofile_prod:
  
  name: pep-dps-europe-btbprofile-prod
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: europe-btbprofile
    sector: europe
    project: btbprofile
    crosscharge_aks: direct
    istio-injection: enabled
    servicename_aks: b2bpepsiconnectadminbffcustomerloyaltyeuropeprod
    pep-cmdb-app-service-id: "bbd2a40647cdee10531cc5df016d43d7"
    pep-cmdb-bus-app-id: "618c890597d295182db4f9f11153afbd"
    pep-environment: "Production"
    istio.io/rev: prod-stable
    environment: prod
    env-prod: "true"

  service_accounts:
    - name: pep-dps-europe-btbprofile-prod-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-dps-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-dps-appsupport-rb
      subjects:
        - "{{ k8s_sup_subjects['europe_btbprofile'] }}"
      roleref:
         "{{ k8s_role_ref['appsupprt_rb'] }}"
  secrets: 
    name: pep-dps-europe-btbprofile-prod-sa-token
    namespace: pep-dps-europe-btbprofile-prod
    annotations:
      kubernetes.io/service-account.name : "pep-dps-europe-btbprofile-prod-sa"
