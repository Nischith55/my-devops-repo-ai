---
ns_pep_dps_cgf_ibpenemon_prod:
  
  name: pep-dps-cgf-ibpenemon-prod
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: cgf-ibpenemon
    sector: cgf
    project: ibpenemon
    crosscharge_aks: direct
    istio-injection: enabled
    istio.io/rev: prod-stable
    environment: prod
    env-prod: "true"

  service_accounts:
    - name: pep-dps-cgf-ibpenemon-prod-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-dps-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-dps-appsupport-rb
      subjects:
        - "{{ k8s_sup_subjects['cgf_ibpenemon'] }}"
      roleref:
         "{{ k8s_role_ref['appsupprt_rb'] }}"
  secrets: 
    name: pep-dps-cgf-ibpenemon-prod-sa-token
    namespace: pep-dps-cgf-ibpenemon-prod
    annotations:
      kubernetes.io/service-account.name : "pep-dps-cgf-ibpenemon-prod-sa"
