---
ns_pep_dps_cgf_nabtbprom_prod:
  
  name: pep-dps-cgf-nabtbprom-prod
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: cgf-nabtbprom
    sector: cgf
    project: nabtbprom
    crosscharge_aks: direct
    istio-injection: enabled
    servicename_aks: b2bpepsiconnectportalpromotionsamericasprod
    pep-cmdb-app-service-id: "bd02dfcf83311a50282e47747daad305"
    pep-cmdb-bus-app-id: "618c890597d295182db4f9f11153afbd"
    pep-environment: "Production"
    istio.io/rev: prod-stable
    environment: prod
    env-prod: "true"

  service_accounts:
    - name: pep-dps-cgf-nabtbprom-prod-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-dps-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-dps-appsupport-rb
      subjects:
        - "{{ k8s_sup_subjects['cgf_nabtbprom'] }}"
      roleref:
         "{{ k8s_role_ref['appsupprt_rb'] }}"
  secrets: 
    name: pep-dps-cgf-nabtbprom-prod-sa-token
    namespace: pep-dps-cgf-nabtbprom-prod
    annotations:
      kubernetes.io/service-account.name : "pep-dps-cgf-nabtbprom-prod-sa"
