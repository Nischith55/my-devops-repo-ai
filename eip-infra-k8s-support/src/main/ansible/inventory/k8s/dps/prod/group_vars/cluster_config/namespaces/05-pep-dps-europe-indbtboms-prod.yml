---
ns_pep_dps_europe_indbtboms_prod:
  
  name: pep-dps-europe-indbtboms-prod
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: europe-indbtboms
    sector: europe
    project: indbtboms
    crosscharge_aks: direct
    istio-injection: enabled
    servicename_aks: distributororderportalprod
    pep-cmdb-app-service-id: "515ed977db7740106285d2984b961929"
    pep-cmdb-bus-app-id: "e95ed977db7740106285d2984b96192e"
    pep-environment: "Production"
    istio.io/rev: prod-stable
    environment: prod
    env-prod: "true"

  service_accounts:
    - name: pep-dps-europe-indbtboms-prod-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-dps-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-dps-appsupport-rb
      subjects:
        - "{{ k8s_sup_subjects['europe_indbtboms'] }}"
      roleref:
         "{{ k8s_role_ref['appsupprt_rb'] }}"
  secrets: 
    name: pep-dps-europe-indbtboms-prod-sa-token
    namespace: pep-dps-europe-indbtboms-prod
    annotations:
      kubernetes.io/service-account.name : "pep-dps-europe-indbtboms-prod-sa"
