---
ns_pep_dps_latam_bffmerch_prod:
  
  name: pep-dps-latam-bffmerch-prod
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: latam-bffmerch
    sector: latam
    project: bffmerch
    crosscharge_aks: direct
    istio-injection: enabled
    servicename_aks: b2bpepsiconnectportalabffproductselectionamericasprod
    pep-cmdb-app-service-id: "3a02a57c970a9e50170439771153afec"
    pep-cmdb-bus-app-id: "618c890597d295182db4f9f11153afbd"
    pep-environment: "Production"
    istio.io/rev: prod-stable
    environment: prod
    env-prod: "true"

  service_accounts:
    - name: pep-dps-latam-bffmerch-prod-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-dps-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-dps-appsupport-rb
      subjects:
        - "{{ k8s_sup_subjects['latam_bffmerch'] }}"
      roleref:
         "{{ k8s_role_ref['appsupprt_rb'] }}"
  secrets: 
    name: pep-dps-latam-bffmerch-prod-sa-token
    namespace: pep-dps-latam-bffmerch-prod
    annotations:
      kubernetes.io/service-account.name : "pep-dps-latam-bffmerch-prod-sa"
