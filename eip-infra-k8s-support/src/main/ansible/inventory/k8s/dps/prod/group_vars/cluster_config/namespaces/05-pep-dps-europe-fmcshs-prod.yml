---
ns_pep_dps_europe_fmcshs_prod:
  
  name: pep-dps-europe-fmcshs-prod
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: europe-fmcshs
    sector: europe
    project: fmcshs
    crosscharge_aks: direct
    istio-injection: enabled
    servicename_aks: fmcs-prod
    pep-cmdb-app-service-id: "005526e2c3a0c2502dd7773ed40131f7"
    pep-cmdb-bus-app-id: "618c890597d295182db4f9f11153afbd"
    pep-environment: "Production"
    istio.io/rev: prod-stable
    environment: prod
    env-prod: "true"

  service_accounts:
    - name: pep-dps-europe-fmcshs-prod-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-dps-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-dps-appsupport-rb
      subjects:
        - "{{ k8s_sup_subjects['europe_fmcshs'] }}"
      roleref:
         "{{ k8s_role_ref['appsupprt_rb'] }}"
  secrets: 
    name: pep-dps-europe-fmcshs-prod-sa-token
    namespace: pep-dps-europe-fmcshs-prod
    annotations:
      kubernetes.io/service-account.name : "pep-dps-europe-fmcshs-prod-sa"
