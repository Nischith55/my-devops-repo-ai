---
ns_pep_dps_europe_gscafso_prod:
  
  name: pep-dps-europe-gscafso-prod
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: europe-gscafso
    sector: europe
    project: gscafso
    crosscharge_aks: direct
    istio-injection: enabled
    servicename_aks: dpsdsdvisibilityappservice
    istio.io/rev: prod-stable
    environment: prod
    env-prod: "true"

  service_accounts:
    - name: pep-dps-europe-gscafso-prod-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-dps-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-dps-appsupport-rb
      subjects:
        - "{{ k8s_sup_subjects['europe_gscafso'] }}"
      roleref:
         "{{ k8s_role_ref['appsupprt_rb'] }}"
  secrets: 
    name: pep-dps-europe-gscafso-prod-sa-token
    namespace: pep-dps-europe-gscafso-prod
    annotations:
      kubernetes.io/service-account.name : "pep-dps-europe-gscafso-prod-sa"
