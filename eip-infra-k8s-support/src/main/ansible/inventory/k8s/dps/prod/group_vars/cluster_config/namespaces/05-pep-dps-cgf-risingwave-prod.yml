---
ns_pep_dps_cgf_risingwave_prod:
  
  name: pep-dps-cgf-risingwave-prod
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: cgf-risingwave
    sector: cgf
    project: risingwave
    crosscharge_aks: direct
    istio-injection: enabled
    servicename_aks: dpsdsdvisibilityappservice
    pep-cmdb-app-service-id: "c3ba487fc3ee3194ad658535990131a9"
    pep-cmdb-bus-app-id: "a0ee40fddb3e8c10c2b5f381399619cd"
    pep-environment: "Production"
    istio.io/rev: prod-stable
    environment: prod
    env-prod: "true"

  service_accounts:
    - name: pep-dps-cgf-risingwave-prod-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-dps-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-dps-appsupport-rb
      subjects:
        - "{{ k8s_sup_subjects['cgf_risingwave'] }}"
      roleref:
         "{{ k8s_role_ref['appsupprt_rb'] }}"
  secrets: 
    name: pep-dps-cgf-risingwave-prod-sa-token
    namespace: pep-dps-cgf-risingwave-prod
    annotations:
      kubernetes.io/service-account.name : "pep-dps-cgf-risingwave-prod-sa"
