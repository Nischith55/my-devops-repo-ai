# 06/2021 -- Beats clients
ns_pep_eiap_elastic_client_02:

  name: pep-eiap-elastic-client-02

  labels:
    istio-injection: enabled
    # IMPORTANT: NON ECK Managed
    eck-managed: !!str false

  generic_secrets: |-
    {{  pep_eiap_elastic_client_02_misc_secrets| default([]) }}

  registry_secrets: |-
    {{ pep_eiap_elastic_client_02_registry_secrets | default([]) }}

  # override for tls_sercret names a list of map with 'secret_name' key
  tls_secrets: |-
    {{ pep_eiap_elastic_client_02_tls_secrets_names | default([]) }}
