---
# ##
# 05/2021
# - Global Variable Naming Convention
#   <resc_name>_<resc_abbrev>_cfg
#   resc_abbrev: see the 00-k8s-api-spec key
# - This Cluster Role will be used for running the deployment pipelines
# ##

# devsecops-continuous-deployment clusterrole
pep_eiap_devsecops_cd_clusterrole_cr_cfg:
  name: pep-eiap-devsecops-cd-clusterrole
  # short form
  alias: pep-eiap-devsecops-cd
  kind: ClusterRole

  # All rules --
  rules:

    - apiGroups:
        - ""
      resources: 
        - configmaps
      verbs:
        - "*"

    - apiGroups:
        - apps
      resources:
        - deployments
        - replicasets
        - statefulsets
      verbs:
        - "*"

    - apiGroups:
        -  ""
      resources:
        - podtemplates
        - pods
        - pods/status
      verbs:
        - "*"

    - apiGroups:
        - ""
      resources:
        - services
        - services/proxy
      verbs:
        - "*"

    # Removed on 2021-10-25; Pushpam Saxena
    # # istio
    # - apiGroups:
    #     - networking.istio.io
    #   resources:
    #     - virtualservices
    #     - destinationrules
    #   verbs:
    #     - "*"

    - apiGroups:
        - batch
      resources:
        - jobs
        - cronjobs
      verbs:
        - "*"
