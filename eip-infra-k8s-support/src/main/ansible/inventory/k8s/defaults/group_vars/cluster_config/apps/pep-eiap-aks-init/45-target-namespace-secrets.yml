---
# Common secrets to be installed for this app.
# All overrides should be in host_vars/cluster_name -- This will be installed
# by default.

# OVERRIDES:
# - pep_eiap_aks_init_section_name : should be defined per environment or cluster

# ns: pep-eiap-ops-admin (see the namespace config)
ops_admin_generic_secrets_names:
  # secret name that would need to be installed in the namespace
  - secret_name: &aks_init_secret_name pep-eiap-aks-init-secret


# +++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++
# Secrets to be installed via lookup
# +++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++

# ##
# WARNING using ini-lookup method. TODO: make it via key-vault
# ##
pep_eiap_aks_init_secrets_lookup: |-
  {{
    q('ini_helper', pep_eiap_aks_init_section_name,
    keys_map=aks_init_ssh_keys_map, file=secrets_ini_file)
    |
    first
  }}

# This is required to be picked up by the secret template
pep_eiap_aks_init_misc_secret:

  name: *aks_init_secret_name

  ## All secret data (NOTE: everything will be base64 encoded)

  ## All secret data already ENCODED
  data_encoded:
    # MUST be base64 encoded (json file)
    ssh_private_key_0: |-
      {{ pep_eiap_aks_init_secrets_lookup['ssh_private_key_0'] }}
    ssh_public_key_0: |-
      {{ pep_eiap_aks_init_secrets_lookup['ssh_public_key_0'] }}

