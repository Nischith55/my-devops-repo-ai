---
# ##
# 05/2021
# - Global Variable Naming Convention
#   <resc_name>_<resc_abbrev>_cfg
#   resc_abbrev: see the 00-k8s-api-spec key
# ##
pep_eiap_devsecops_clusterrole_cr_cfg:
  name: pep-eiap-devsecops-clusterrole
  kind: ClusterRole
  alias: pep-eiap-devsecops

  rules:
    - apiGroups:
        -  ""
        - apps
        - autoscaling
        - extensions
        - batch
      resources:
        # - deployments
        # - deployments/rollback
        # - deployments/status
        # - deployments/scale
        # - horizontalpodautoscalers
        # - horizontalpodautoscalers/status
        - jobs
        - jobs/status
        - cronjobs
        - pods
        - podtemplates
        - pods/attach
        - pods/binding
        - pods/eviction
        - pods/exec
        - pods/log
        - pods/status
        # - replicasets/scale
        # - replicasets/status
        # - replicasets
        # - services
        # - services/proxy
        # - services/status
        # - statefulsets
        # - statefulsets/scale
        # - statefulsets/status
      verbs:
        - create
        - get
        - list
        - patch
        - update
        - watch
        - delete

    - apiGroups:
        - ""
      resources:
        - secrets
      verbs:
        - list
        - get
