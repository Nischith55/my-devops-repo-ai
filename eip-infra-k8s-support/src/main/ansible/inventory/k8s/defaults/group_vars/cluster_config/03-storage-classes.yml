---
# ##
# Aggregation of ALL PreCreated storage classes
# ##

# ##
# All Clusters that need custom storage classes should provide a list of 
# storage classes that map to storage-class.yml.j2 template params.
# HOST_VAR:
#   - storage_classes_ovrd
# ##
# NOTE: we don't need namespaces, so we just pass [] so we can filter
all_storage_classes: |-
  {{ [] 
     | build_k8s('storage_class', 
        (storage_classes_ovrd | default([])))
  }}

## AKS built-in ends with sto_class_built_in

_aks_sto_class_vars_: |-
  {{ q('varnames', '^pep_eiap.+_sto_class_built_in$') }}

#  - Also, note the use of '*' a python construct to 'expand' a list...
_all_aks_sto_class_obj_: |-
  {{ q('vars', *_aks_sto_class_vars_) }}


# allow ovrd
# NOTE: we don't need namespaces, so we just pass [] so we can filter
all_aks_storage_class: |-
  {{ 
    aks_storage_classes_ovrd 
    | 
    default( [] | build_k8s('storage_class', _all_aks_sto_class_obj_)) 
  }}

