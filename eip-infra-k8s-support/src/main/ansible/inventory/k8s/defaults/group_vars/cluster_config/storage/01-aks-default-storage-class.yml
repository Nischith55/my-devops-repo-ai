---
# ##
# We patch the Default storage class
# IMPORTANT:
# - AKS storage class are immutable, so we need to Delete and IMMEDIATELY
#   apply!
# - NOTE: This ends with built_in !!!!
# ##

pep_eiap_aks_default_parameters_zoned:
  cachingmode: ReadOnly
  storageaccounttype: Standard_LRS
  kind: Managed
  zoned: 'true'

pep_eiap_aks_default_parameters_unzoned:
  cachingmode: ReadOnly
  storageaccounttype: Standard_LRS
  kind: Managed
  zoned: 'false'

pep_eiap_aks_default_patch_sto_class_built_in:

  # CHECK with AKS Clusters on the name
  

  metadata:
    name: default
    annotations:
      # Keep it Default
      storageclass.kubernetes.io/is-default-class: "true"

    labels:
      # THIS LABEL SHOULD BE THERE FOR DEFAULT STORAGE CLASS
      addonmanager.kubernetes.io/mode: EnsureExists
      kubernetes.io/cluster-service: "true"

  # required
  provisioner: kubernetes.io/azure-disk

  # default Delete for std disk
  reclaimPolicy: "{{ sc_aks_default_reclaim_policy | default('Delete') }}"

  allowVolumeExpansion: true
  
  # Always have this for aks (change)
  volumeBindingMode: WaitForFirstConsumer

  # Default to Zoned
  parameters: |-
    {{
      sc_aks_default_params | default(pep_eiap_aks_default_parameters_zoned)
    }}
