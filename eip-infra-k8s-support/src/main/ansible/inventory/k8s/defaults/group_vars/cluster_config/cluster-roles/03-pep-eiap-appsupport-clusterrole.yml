---
# ##
# 05/2021
# - Global Variable Naming Convention
#   <resc_name>_<resc_abbrev>_cfg
#   resc_abbrev: see the 00-k8s-api-spec key
# ##
pep_eiap_appsupport_clusterrole_cr_cfg:
  name: pep-eiap-appsupport-clusterrole
  kind: ClusterRole
  alias: pep-eiap-appsupport

  rules:

    - apiGroups: 
        - ""
      resources: 
        - configmaps
        - events
        - persistentvolumeclaims
        - pods
        - pods/log
        - pods/portforward
        - pods/status
        - endpoints
        - services
      verbs: 
        - list
        - get

    - apiGroups: 
        - ""
      resources: 
        - persistentvolumes
        - secrets
      verbs: 
        - list

    - apiGroups: 
        - apps
      resources: 
        - deployments
        - replicasets
        - statefulsets
      verbs: 
        - list
        - get

    - apiGroups: 
        - autoscaling
      resources: 
        - horizontalpodautoscalers
      verbs: 
        - list
        - get

    - apiGroups: 
        - metrics.k8s.io
      resources: 
        - nodes
        - pod
      verbs: 
        - list
        - get

    - apiGroups:
        - batch
      resources:
        - jobs
        - cronjobs
      verbs:
        - list
        - get

    - apiGroups:
        - msi-acrpull.microsoft.com
      resources:
        - acrpullbindings
      verbs:
        - list
        - get
