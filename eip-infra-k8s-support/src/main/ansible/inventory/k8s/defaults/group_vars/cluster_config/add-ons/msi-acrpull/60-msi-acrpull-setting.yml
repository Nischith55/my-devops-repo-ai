---
# ##
# ABBREVIATION:
# - msi-acrpull
# ##

# must match [add-ons|apps]/<app_name>, where app_name is below value
msi_acrpull_app_name: msi-acrpull

# The namespace in SOURCE files -- i.e. in base directory change
msi_acrpull_src_namespace: msi-acrpull-system

# target namespace!
msi_acrpull_target_namespace: |-
  {{ msi_acrpull_namespace | default(msi_acrpull_src_namespace) }}

# ##
# All directories
# ##

# apps manifest go under namespace (target)
msi_acrpull_deploy_app_root_dir: |-
  {{ (add_ons_deploy_base_dir, msi_acrpull_app_name) 
    | path_join }}
# base source root directory for any files or kustomize sources
# note: we use add-ons as base directory NOTE: apps 
msi_acrpull_source_app_root_dir: |-
  {{ (k8s_add_ons_base_dir, msi_acrpull_app_name) | path_join }}

# ##
# Final app setting
# IMPORTANT: follow the varname convention
#  '^(add_on_|app_)' + (app_name | replace('-', '_')) + '_setting$'
# ##
add_on_msi_acrpull_setting:

  #app_name
  name: "{{ msi_acrpull_app_name }}"

  # #########################################################
  # All components supporting the app
  # #########################################################

  # collect everything that starts with app prefix or app abbrv prefix and 
  # ends with _component_setting
  components: |-
    {{
      q('vars', *q('varnames', '^msi_acrpull_.+_component_setting$'))
    }}

