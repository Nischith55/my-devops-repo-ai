---
# ##
# We patch the managed-premium storage class
# IMPORTANT:
# - AKS storage class are immutable, so we need to Delete and IMMEDIATELY
#   apply!
# - NOTE: This ends with built_in !!!!
# - CHANGES
#   - retain
#   - zoned: false
# ##

pep_eiap_aks_managed_premium_parameters_zoned:
  cachingmode: ReadOnly
  storageaccounttype: Premium_LRS
  kind: Managed
  zoned: 'true'

pep_eiap_aks_managed_premium_parameters_unzoned:
  cachingmode: ReadOnly
  storageaccounttype: Premium_LRS
  kind: Managed
  zoned: 'false'

pep_eiap_aks_managed_premium_patch_sto_class_built_in:

  # CHECK with AKS Clusters on the name
  

  metadata:
    name: managed-premium
    labels:
      # THIS LABEL SHOULD BE THERE FOR DEFAULT STORAGE CLASS
      addonmanager.kubernetes.io/mode: EnsureExists
      kubernetes.io/cluster-service: "true"

  # required
  provisioner: kubernetes.io/azure-disk

  # default Delete for std disk
  reclaimPolicy: |-
    {{ sc_aks_managed_premium_reclaim_policy | default('Retain') }}

  allowVolumeExpansion: true
  
  # Always have this for aks (change)
  volumeBindingMode: WaitForFirstConsumer

  # Default to ZONED
  parameters: |-
    {{
      sc_aks_managed_premium_params | 
        default(pep_eiap_aks_managed_premium_parameters_zoned)
    }}
