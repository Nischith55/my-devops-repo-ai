---
# ##
# 05/2021
# - Global Variable Naming Convention
#   <resc_name>_<resc_abbrev>_cfg
#   resc_abbrev: see the 00-k8s-api-spec key
# ##

pep_eiap_monitor_clusterrole_cr_cfg:
  name: pep-eiap-monitor-clusterrole
  kind: ClusterRole
  alias: pep-eiap-monitor

  rules:
    - apiGroups:
        -  ""
        - apps
        - autoscaling
        - batch
        - extensions
        - events.k8s.io
      resources:
        - endpoints
        - daemonsets
        - deployments
        - jobs
        - cronjobs
        - namespaces
        - nodes
        - pods
        - replicasets
        - services
        - statefulsets
      verbs:
        - get
        - list
        - watch

    # istio
    - apiGroups:
        - networking.k8s.io
      resources:
        - '*'
      verbs:
        - get
        - list
        - watch
        