---
# ##
# Settings for secrets values lookup from ini style config file.
# NOTES:
#   - We use our ini_helper lookup plugin!!
# ##

secrets_ini_file: "{{ ini_file }}"

# ##
# This is the sections keys and default values.
# NOTE:
#   - In case we want the key to exist, leave the default to empty see
#     k8s_username and k8s_password
# ##
k8s_spn_section_keys_map:
  k8s_username: 
  k8s_password:
  k8s_tenant_id: "{{ pep_azure_tenant_id }}"
  k8s_email: "{{ pep_default_email }}"

# ##
# Map of keys to extract for tls key [ MUST be base64 encoded]
# ##
k8s_tls_section_keys_map:
  tls_crt:
  tls_key:


# ##
# Map of keys to extract for appd
# ##
appd_section_keys_map:
  secret_name:
  access_key:

# ##
# Map of keys to extract for elasticsearch
# ##
elasticsearch_section_keys_map:
  secret_name:
  host:
  port:
  username:
  password:
  kibana_host:
  kibana_port:


# ##
# Map of keys to extract license for eck
# ##
elastic_license_section_keys_map:
  license:


# ##
# Map of keys for ECK - Kibana Secrets
# ##
eck_kibana_keys_section_map:
  enc_key:
  reporting_key:
  saved_obj_key:


# ##
# Map of keys for ssh private keys
# ##
aks_init_ssh_keys_map:
  # private key
  ssh_private_key_0:
  ssh_public_key_0:
