---
# ##
# IMPORTANT
#  - this should only have the final secrets list SPN/User etc..
# ##

spn_secrets: |-
  {{ q('vars', *q('varnames', '(^pep-eiap-.+-spn-secret$|^aqua_registry$)') ) }}


# miscellaneous secrets
_misc_secret_var_pattern: |-
  {{ '(^pep-eiap-.+-misc-secret$|^pep_eiap_.+_misc_secret$)' }}

misc_secrets: |-
  {{ q('vars', *q('varnames', _misc_secret_var_pattern)) }}

# NOTE: list's can be added 
# set env specific secrets in env_secrets -- must be list
all_secrets: |-
  {{ spn_secrets + misc_secrets + (env_secrets| default([])) }}

# All generic secrets
generic_secrets: |-
  {{ namespaces | build_k8s('generic_secret', all_secrets) }}


# All registry secrets
registry_secrets: |-
  {{ namespaces | build_k8s('registry_secret', all_secrets) }}

# consolidated tls secrets
_tls_secrets_consolidated: |-
  {{ q('vars', *q('varnames', '^pep_eiap_.+_tls_secret$') ) }}

# All registry secrets
tls_secrets: |-
  {{ namespaces | build_k8s('tls_secret', _tls_secrets_consolidated) }}
