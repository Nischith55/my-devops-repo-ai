---
# ##
# appdynamics main settings.
# ##

# component name : also should match exactly the directory name in
# add-ons/<app_name/<this name>
appd_op_name: operator

# image tag override or change
_appd_op_tag: "{{ appd_op_image_tag | default('0.6.5') }}"

# ##
# component meta information
# ##
appd_op_meta:

  # component_name
  name: "{{ appd_op_name }}"

  # namespace where this component will be targeted
  namespace: "{{ appd_namespace }}"

# ##
# All generation setting.
# ##

# -- Input directories

_appd_op_component_kustomize_resource_base_dir: |-
  {{ (appd_source_app_root_dir, 'kustomize', appd_op_meta['name'], 'base') | path_join }}

# -- Output directories

# root directory for any outputs for this component
_appd_op_component_dest_root_dir: |-
  {{ (appd_deploy_app_root_dir, appd_op_name) | path_join }}
# general template out directory and kustomize build-in dir
_appd_op_component_overlays_dest_dir: |-
  {{ (_appd_op_component_dest_root_dir, 'overlays') | path_join }}
# final location of the manifest
_appd_op_component_manifests_dest_dir: |-
  {{ (_appd_op_component_dest_root_dir, 'manifests') | path_join }}
# The actual manifest filename
_appd_op_manifest_path: |-
  {{ 
    (_appd_op_component_manifests_dest_dir,  
      appd_op_name + '.yml') | path_join 
  }}

# re-usable patch target
__appd_op_target:
  group: apps
  version: v1
  kind: Deployment
  # IMPORTANT: name should match whats in base --
  name: appdynamics-operator
  # IMPORTANT: should be src namespace in base resource
  namespace: appdynamics

# build params
_appd_op_build_params:

  # Final location of the manifest file.
  manifest:
    input_dir: "{{ _appd_op_component_overlays_dest_dir }}"
    output_path: "{{ _appd_op_manifest_path }}"

  # for generating the kustomization.yml file
  kustomization:

    template_kust_src: "{{ kct_kustomization_src }}"
    template_kust_dest: "{{ (_appd_op_component_overlays_dest_dir, 'kustomization.yml') | path_join }}"
    # any resources to add to kustomization overlay - we have a base
    # this has to be relative dir
    resources:
      - |-
        {{ _appd_op_component_kustomize_resource_base_dir 
            | relpath(_appd_op_component_manifests_dest_dir) 
        }}

    images:
      - name: &op_name docker.io/appdynamics/cluster-agent-operator
        newName: *op_name
        newTag: "{{ _appd_op_tag }}"

  patches:

    - name: patch-node-selection-deployment
      template_merge_src: "{{ kct_template_spec_merge_src }}"
      template_merge_dest: |-
        {{ 
          (_appd_op_component_overlays_dest_dir, 'patch-merge-deployment.yml')
          | path_join
        }}
      target: "{{ __appd_op_target }}"
      merge:
        spec:
          template:
            # TODO: make it overridable using combine
            spec: "{{ aks_system_np_deployment_spec }}"


# ##
# Make the final settings - must end with component_setting
# ##
appd_op_component_setting: |-
  {{
    appd_op_meta
    |
    combine(_appd_op_build_params, recursive=True)
  }}

