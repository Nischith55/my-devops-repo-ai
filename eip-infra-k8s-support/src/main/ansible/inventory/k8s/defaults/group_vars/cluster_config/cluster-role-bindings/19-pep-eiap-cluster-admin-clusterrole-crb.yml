---
# ##
# IMPORTANT:
#   - do NOT add service accounts to the 'subjects' list
#   - it is automatically handled -- see the 20-cluster-role-bindings.yml
# ##

pep_eiap_cluster_admin_clusterrole_crb_cfg:
  name: pep-eiap-cluster-admin-clusterrole
  kind: ClusterRoleBinding
  role: cluster-admin
  role_kind: ClusterRole
  
  roleRef:
    "{{ k8s_role_ref['cluster_admin'] }}"
    
  subjects:
    - "{{ k8s_sup_subjects['k8s_admin'] }}"
    - "{{ k8s_sup_subjects['eiap_admins'] }}"
    - "{{ k8s_sup_subjects['global_services'] }}"
# Default K8S Admin access for below users, on all  NON-PROD/PRE-PROD/PROD cluster
    - "{{ k8s_sup_subjects['amele123'] }}"
    - "{{ k8s_sup_subjects['psaxena12'] }}"
    - "{{ k8s_sup_subjects['pnaduvat'] }}"
    - "{{ k8s_sup_subjects['sowola01'] }}"
    - "{{ k8s_sup_subjects['hgurram5'] }}"
    - "{{ k8s_sup_subjects['ssulluru'] }}"
    - "{{ k8s_sup_subjects['upareta5'] }}"

  
