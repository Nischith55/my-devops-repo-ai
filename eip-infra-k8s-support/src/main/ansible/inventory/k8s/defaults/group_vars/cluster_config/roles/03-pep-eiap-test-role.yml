---
# ##
# 05/2021
# - Global Variable Naming Convention
#   <resc_name>_<resc_abbrev>_cfg
#   resc_abbrev: see the 00-k8s-api-spec key
# ##

pep_eiap_test_role_ro_cfg:
  name: pep-eiap-test-role
  # short form..
  alias: pep-eiap-test-role
  kind: Role

  # All rules --
  rules:

    # nodes, namespaces and pv's list and watch 
    - apiGroups: 
        - ""
      resources: 
        - nodes
        - namespaces
        - persistentvolumes
      verbs: 
        - list
        - watch

    # allow node and pod metrics 
    - apiGroups: 
        - metrics.k8s.io
      resources: 
        - nodes
        - pods
      verbs: 
        - get
        - list

    - apiGroups: 
        - ""
      resources: 
        - persistentvolumeclaims
      verbs:
        - "*" 

    # storage class allow list watch
    - apiGroups: 
        - "storage.k8s.io"
      resources: 
        - storageclasses
      verbs: 
        - list
        - watch

    - apiGroups:
        - ""
      resources: 
        - configmaps
      verbs:
        - "*"

    - apiGroups:
        - apps
      resources:
        - deployments
        - replicasets
        - statefulsets
      verbs:
        - "*"

    - apiGroups:
        -  ""
      resources:
        - podtemplates
        - pods
        - pods/attach
        - pods/binding
        - pods/eviction
        - pods/exec
        - pods/log
        - pods/portforward
        - pods/proxy
        - pods/status
      verbs:
        - "*"

    - apiGroups:
        - ""
      resources:
        - services
        - services/proxy
      verbs:
        - "*"
    # secrets -- no delete or get
    - apiGroups:
        - ""
      resources:
        - secrets
      verbs:
        - create
        - list
        - patch
        - update
        - watch

    - apiGroups:
        - extensions
      resources:
        - ingresses
      verbs:
        - "*"

    - apiGroups:
        - autoscaling
      resources:
        - horizontalpodautoscalers
      verbs:
        - "*"

    - apiGroups:
        - batch
      resources:
        - jobs
        - cronjobs
      verbs:
        - "*"

    # all status permissions
    - apiGroups:
        - ""
        - api
        - autoscaling
        - batch
        - networking.istio.io
      resources:
        - "*/status"
        - "*/scale"
      verbs:
        - "*"

    # istio
    - apiGroups:
        - networking.istio.io
      resources:
        - virtualservices
        - destinationrules
      verbs:
        - "*"

    # events
    - apiGroups:
        - ""
      resources:
        - events
      verbs:
        - get
        - list
        - watch
