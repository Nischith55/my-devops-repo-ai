---
# ##
# ABBREVIATION:
# - prom -> prometheus
# ##

# must match [add-ons|apps]/<app_name>, where app_name is below value
prom_app_name: prometheus

# target namespace!
prom_namespace: monitoring

# The namespace in SOURCE files -- i.e. in base directory change
prom_src_namespace: monitoring

# ##
# All directories
# ##
# This can be configure various components directory paths.
prom_deploy_app_root_dir: |-
  {{ (add_ons_deploy_base_dir, prom_app_name) | path_join }}
# base source root directory for any files or kustomize sources
# note: we use add-ons as base directory
prom_source_app_root_dir: |-
  {{ (k8s_add_ons_base_dir, prom_app_name) | path_join }}

# ##
# Final app setting
# ##
add_on_prometheus_setting:

  #app_name
  name: "{{ prom_app_name }}"

  # #########################################################
  # All components supporting the app
  # #########################################################

  # collect everything that starts with app prefix or app abbrv prefix and 
  # ends with _component_setting
  components: |-
    {{
      q('vars', *q('varnames', '^prom_.+_component_setting$'))
    }}
