---
# #
# AKS nodes ansible ssh access
# NOTES:
#  - This should match AKS provisioned ssh user. See Azure inventory.
# #

# NOTE: this should match inventory/azure/defaults/group_vars/aks_common
aks_ssh_user: neipi002
aks_ssh_private_key_dir: |-
  {{
    (lookup('env', 'SSH_KEY_DIR') | default('~/.ssh', True))
    | expandvars | expanduser | realpath
  }}
