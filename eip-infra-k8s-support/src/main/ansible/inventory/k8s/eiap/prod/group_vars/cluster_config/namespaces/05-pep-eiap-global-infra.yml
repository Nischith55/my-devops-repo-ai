---
# ##
# IMPORTANT:
#  Variable Name Convention:
#   - Always start with 'ns_'
#   - replace '-' with '_' in the namespace name
# ##
# Namespace Global/infra
# IMPORTANT:
#  - change environment and add or remove flag env-{dev, qa etc}

ns_pep_eiap_global_infra:

  name: pep-eiap-global-infra

  labels:
    team: global-eiap
    sector: global
    project: infra
    istio-injection: enabled
    environment: prod
    env-prod: "true"

  # NOTE: istio is enabled so it will send the traces!!
  # annotations:
  #   # NOTE: it can be an jaeger instance
  #   sidecar.jaegertracing.io/inject: "true"

  role_bindings:

    # name of the rolebiding 
    - name: pep-eiap-developer-rb
      subjects:
        - "{{ k8s_sup_subjects['eiap_infra_sp'] }}"

  # registry secrets
  registry_secrets:

    - secret_name: "{{ _eiap_infra_spn_name }}"
      registries: 
        - pepeiapprodcommonacr.azurecr.io

  # generic secrets

  generic_secrets:
    - secret_name: "{{ _eiap_infra_spn_name }}"
      # Any contents apart from what is in secret

  tls_secrets: |-
    {{ global_infra_tls_secrets | default([]) }}
