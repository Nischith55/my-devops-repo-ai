---
ns_pep_eiap_cgf_aibiflna_prod:
  
  name: pep-eiap-cgf-aibiflna-prod
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: cgf-aibiflna
    sector: cgf
    project: aibiflna
    crosscharge_aks: crosscharge
    istio-injection: enabled
    servicename_aks: daipepgenx
    pep-cmdb-app-service-id: "841e42b8c3ba46d8b7498535990131f7"
    pep-cmdb-bus-app-id: "7f0e42b8c3ba46d8b74985359901310f"
    pep-environment: "Production"
    istio.io/rev: prod-stable
    environment: prod
    env-prod: "true"

  service_accounts:
    - name: pep-eiap-cgf-aibiflna-prod-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-eiap-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-eiap-appsupport-rb
      subjects:
        - "{{ k8s_sup_subjects['cgf_aibiflna'] }}"
      roleref:
         "{{ k8s_role_ref['appsupprt_rb'] }}"
  secrets: 
    name: pep-eiap-cgf-aibiflna-prod-sa-token
    namespace: pep-eiap-cgf-aibiflna-prod
    annotations:
      kubernetes.io/service-account.name : "pep-eiap-cgf-aibiflna-prod-sa"
