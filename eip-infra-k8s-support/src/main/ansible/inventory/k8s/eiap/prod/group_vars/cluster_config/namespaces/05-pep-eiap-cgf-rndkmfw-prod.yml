---
ns_pep_eiap_cgf_rndkmfw_prod:
  
  name: pep-eiap-cgf-rndkmfw-prod
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: cgf-rndkmfw
    sector: cgf
    project: rndkmfw
    crosscharge_aks: crosscharge
    istio-injection: enabled
    servicename_aks: iaicognitivesearchprod
    pep-cmdb-app-service-id: "03435a0adbda74d03d3e3967f496195d"
    pep-cmdb-bus-app-id: "87435a0adbda74d03d3e3967f4961988"
    pep-environment: "Production"
    istio.io/rev: prod-stable
    environment: prod
    env-prod: "true"

  service_accounts:
    - name: pep-eiap-cgf-rndkmfw-prod-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-eiap-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-eiap-appsupport-rb
      subjects:
        - "{{ k8s_sup_subjects['cgf_rndkmfw'] }}"
      roleref:
         "{{ k8s_role_ref['appsupprt_rb'] }}"
  secrets: 
    name: pep-eiap-cgf-rndkmfw-prod-sa-token
    namespace: pep-eiap-cgf-rndkmfw-prod
    annotations:
      kubernetes.io/service-account.name : "pep-eiap-cgf-rndkmfw-prod-sa"
