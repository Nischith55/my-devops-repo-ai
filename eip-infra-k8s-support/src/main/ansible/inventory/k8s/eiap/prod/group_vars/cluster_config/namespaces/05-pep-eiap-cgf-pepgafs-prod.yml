---
ns_pep_eiap_cgf_pepgafs_prod:
  
  name: pep-eiap-cgf-pepgafs-prod
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: cgf-pepgafs
    sector: cgf
    project: pepgafs
    crosscharge_aks: crosscharge
    istio-injection: enabled
    servicename_aks: iaiconversationaistudioprod
    pep-cmdb-app-service-id: "e03f35e11bd2b4905e6e54ae034bcb98"
    pep-cmdb-bus-app-id: "283f35e11bd2b4905e6e54ae034bcbb6"
    pep-environment: "Production"
    istio.io/rev: prod-stable
    environment: prod
    env-prod: "true"

  service_accounts:
    - name: pep-eiap-cgf-pepgafs-prod-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-eiap-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-eiap-appsupport-rb
      subjects:
        - "{{ k8s_sup_subjects['cgf_pepgafs'] }}"
      roleref:
         "{{ k8s_role_ref['appsupprt_rb'] }}"
  secrets: 
    name: pep-eiap-cgf-pepgafs-prod-sa-token
    namespace: pep-eiap-cgf-pepgafs-prod
    annotations:
      kubernetes.io/service-account.name : "pep-eiap-cgf-pepgafs-prod-sa"
