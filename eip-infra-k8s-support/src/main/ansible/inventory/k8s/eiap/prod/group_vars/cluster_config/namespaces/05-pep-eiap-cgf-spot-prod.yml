---
ns_pep_eiap_cgf_spot_prod:
  
  name: pep-eiap-cgf-spot-prod
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: cgf-spot
    sector: cgf
    project: spot
    crosscharge_aks: crosscharge
    istio-injection: enabled
    servicename_aks: ibpm-spotfrieghtintake-negotiationmanagement
    pep-cmdb-app-service-id: "284ab2bac3fdd6d44c9669deb00131e3"
    pep-cmdb-bus-app-id: "604ab2bac3fdd6d44c9669deb00131aa"
    pep-environment: "Production"
    istio.io/rev: prod-stable
    environment: prod
    env-prod: "true"

  service_accounts:
    - name: pep-eiap-cgf-spot-prod-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-eiap-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-eiap-appsupport-rb
      subjects:
        - "{{ k8s_sup_subjects['cgf_spot'] }}"
      roleref:
         "{{ k8s_role_ref['appsupprt_rb'] }}"
  secrets: 
    name: pep-eiap-cgf-spot-prod-sa-token
    namespace: pep-eiap-cgf-spot-prod
    annotations:
      kubernetes.io/service-account.name : "pep-eiap-cgf-spot-prod-sa"
