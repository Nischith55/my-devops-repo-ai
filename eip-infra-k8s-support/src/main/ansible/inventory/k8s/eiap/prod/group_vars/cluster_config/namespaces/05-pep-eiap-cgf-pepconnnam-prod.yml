---
ns_pep_eiap_cgf_pepconnnam_prod:
  
  name: pep-eiap-cgf-pepconnnam-prod
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: cgf-pepconnnam
    sector: cgf
    project: pepconnnam
    crosscharge_aks: crosscharge
    istio-injection: enabled
    servicename_aks: distributororderportalprod
    pep-cmdb-app-service-id: "515ed977db7740106285d2984b961929"
    pep-cmdb-bus-app-id: "e95ed977db7740106285d2984b96192e"
    pep-environment: "Production"
    istio.io/rev: prod-stable
    environment: prod
    env-prod: "true"

  service_accounts:
    - name: pep-eiap-cgf-pepconnnam-prod-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-eiap-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-eiap-appsupport-rb
      subjects:
        - "{{ k8s_sup_subjects['cgf_pepconnnam'] }}"
      roleref:
         "{{ k8s_role_ref['appsupprt_rb'] }}"
  secrets: 
    name: pep-eiap-cgf-pepconnnam-prod-sa-token
    namespace: pep-eiap-cgf-pepconnnam-prod
    annotations:
      kubernetes.io/service-account.name : "pep-eiap-cgf-pepconnnam-prod-sa"
