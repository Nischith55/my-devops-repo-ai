---
ns_pep_eiap_cmp_test_prod:
  
  name: pep-eiap-cmp-test-prod
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: cmp-test
    sector: cmp
    project: test
    crosscharge_aks: crosscharge
    istio-injection: enabled
    servicename_aks: b2bpepsiconnectportalproductseuropeprod
    pep-cmdb-app-service-id: "c323239bc3bc2650613dce059901318d"
    pep-cmdb-bus-app-id: "618c890597d295182db4f9f11153afbd"
    pep-environment: "Production"
    istio.io/rev: prod-stable
    environment: prod
    env-prod: "true"

  service_accounts:
    - name: pep-eiap-cmp-test-prod-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-eiap-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-eiap-appsupport-rb
      subjects:
        - "{{ k8s_sup_subjects['cmp_test'] }}"
      roleref:
         "{{ k8s_role_ref['appsupprt_rb'] }}"
  secrets: 
    name: pep-eiap-cmp-test-prod-sa-token
    namespace: pep-eiap-cmp-test-prod
    annotations:
      kubernetes.io/service-account.name : "pep-eiap-cmp-test-prod-sa"
