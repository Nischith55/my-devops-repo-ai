---
ns_pep_eiap_cgf_cle_prod:
  
  name: pep-eiap-cgf-cle-prod
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: cgf-cle
    sector: cgf
    project: cle
    crosscharge_aks: crosscharge
    istio-injection: enabled
    servicename_aks: commonloggingandexceptionhandlingservicenextgenprod
    pep-cmdb-app-service-id: "4af99049db762f88f0c4f27139961951"
    pep-cmdb-bus-app-id: "e6aec0f9db3e8c10c2b5f3813996197c"
    pep-environment: "Production"
    istio.io/rev: prod-stable
    environment: prod
    env-prod: "true"

  service_accounts:
    - name: pep-eiap-cgf-cle-prod-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-eiap-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-eiap-appsupport-rb
      subjects:
        - "{{ k8s_sup_subjects['cgf_cle'] }}"
      roleref:
         "{{ k8s_role_ref['appsupprt_rb'] }}"
  secrets: 
    name: pep-eiap-cgf-cle-prod-sa-token
    namespace: pep-eiap-cgf-cle-prod
    annotations:
      kubernetes.io/service-account.name : "pep-eiap-cgf-cle-prod-sa"
