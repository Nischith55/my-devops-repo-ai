---
ns_pep_eiap_cgf_nsgtest_prod:
  
  name: pep-eiap-cgf-nsgtest-prod
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: cgf-nsgtest
    sector: cgf
    project: nsgtest
    crosscharge_aks: crosscharge
    istio-injection: enabled
    servicename_aks: cloudmarketplace-cmp-prod
    pep-cmdb-app-service-id: "3b16ea101b6cb410fa1cb99f034bcb47"
    pep-cmdb-bus-app-id: "7b16ee101b6cb410fa1cb99f034bcb87"
    pep-environment: "Production"
    istio.io/rev: prod-stable
    environment: prod
    env-prod: "true"

  service_accounts:
    - name: pep-eiap-cgf-nsgtest-prod-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-eiap-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-eiap-appsupport-rb
      subjects:
        - "{{ k8s_sup_subjects['cgf_nsgtest'] }}"
      roleref:
         "{{ k8s_role_ref['appsupprt_rb'] }}"
  secrets: 
    name: pep-eiap-cgf-nsgtest-prod-sa-token
    namespace: pep-eiap-cgf-nsgtest-prod
    annotations:
      kubernetes.io/service-account.name : "pep-eiap-cgf-nsgtest-prod-sa"
