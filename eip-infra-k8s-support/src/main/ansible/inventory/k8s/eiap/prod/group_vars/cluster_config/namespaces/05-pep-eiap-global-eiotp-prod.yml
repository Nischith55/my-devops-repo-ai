---
# ##
# IMPORTANT:
#  Variable Name Convention:
#   - Always start with 'ns_'
#   - replace '-' with '_' in the namespace name
# ##

# Namespace GLOBAL EIOTP
# IMPORTANT:
#  - change environment and add or remove flag env-{prod, qa etc}

ns_pep_eiap_global_eiotp_prod:
  
  name: pep-eiap-global-eiotp-prod

  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: global-eiotp
    sector: global
    project: eiotp
    istio.io/rev: prod-stable
    environment: prod
    env-prod: "true"

  role_bindings:

    # appsupport role
    - name: pep-eiap-appsupport-rb
      subjects:
        - "{{ k8s_sup_subjects['eiotp_pepsns_prod'] }}"

  # service accounts for this namespace
  service_accounts:

    # should have springcloudk8s role 
    - name: pep-eiap-global-eiotp-prod-sa
      
