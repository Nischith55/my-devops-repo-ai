---
# ##
# Elasticsearch prod cluster access EIAP
# REQUIRED:
# - cluster_name
# - pep_ca_chain_pem
# ##

# Must END with -misc-secret otherwise it will NOT get picked up
pep_eiap_elasticsearch_prod_scus_misc_secret:

  name: "{{ es_prod_scus_01_lookup_data['name'] }}"

  # secret data
  host: "{{ es_prod_scus_01_lookup_data['host'] }}"
  port: "{{ es_prod_scus_01_lookup_data['port'] }}"
  username: "{{ es_prod_scus_01_lookup_data['username'] }}"
  password: "{{ es_prod_scus_01_lookup_data['password'] }}"

  kibana_host: "{{ es_prod_scus_01_lookup_data['kibana_host'] }}"
  kibana_port: "{{ es_prod_scus_01_lookup_data['kibana_port'] }}"

  # standard pep CA cert chain
  pep_ca_chain: "{{ pep_ca_chain_pem }}"
  # cluster_name
  k8s_cluster_name: "{{ cluster_name }}"
