---
# ##
# IMPORTANT:
#  Variable Name Convention:
#   - Always start with 'ns_'
#   - replace '-' with '_' in the namespace name
# ##

# Namespace CGF DOP
# IMPORTANT:
#  - change environment and add or remove flag env-{dev, qa etc}

ns_pep_eiap_cgf_dop_prod:
  
  name: pep-eiap-cgf-dop-prod

  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: cgf-dop
    sector: cgf
    project: dop
    istio-injection: enabled
    environment: prod
    env-prod: "true"

  role_bindings:

    # appsupport role
    - name: pep-eiap-appsupport-rb
      subjects:
        - "{{ k8s_sup_subjects['cgf_dop'] }}"
#        - "{{ k8s_sup_subjects['cgf_dop_sp'] }}"

