---
# ECK Enterprise License for this cluster

# ##
# WARNING using ini-lookup method
# ##
_lookup_eck_license: |-
  {{
    q('ini_helper', cluster_name + '-eck-license',
    keys_map=elastic_license_section_keys_map, file=secrets_ini_file)
    |
    first
  }}

# 
pep_eiap_eck_license_misc_secret:

  # NOTE: while updating license, create a NEW secret with a different name
  # and then delete the current secret
  name: "{{ cluster_name + '-eck-license' }}"

  ## labels
  labels:
    # this is required
    license.k8s.elastic.co/scope: operator

  ## All secret data (NOTE: everything will be base64 encoded)

  ## All secret data already ENCODED
  data_encoded:
    # MUST be base64 encoded (json file)
    license: "{{ _lookup_eck_license['license'] }}"

