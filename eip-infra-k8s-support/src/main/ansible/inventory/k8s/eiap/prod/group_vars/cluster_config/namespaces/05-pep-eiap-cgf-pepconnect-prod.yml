---
ns_pep_eiap_cgf_pepconnect_prod:
  
  name: pep-eiap-cgf-pepconnect-prod
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: cgf-pepconnect
    sector: cgf
    project: pepconnect
    istio.io/rev: prod-stable
    environment: prod
    env-prod: "true"

  service_accounts:
    - name: pep-eiap-cgf-pepconnect-prod-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-eiap-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-eiap-appsupport-rb
      subjects:
        - "{{ k8s_sup_subjects['cgf_pepconnect'] }}"
      roleref:
         "{{ k8s_role_ref['appsupprt_rb'] }}"
