---
# All xpack Security secrets 
# IMPORTANT
# - could be applicable to kibana or elastic components
# - make sure to use projections in the manifests
# - the realm name SHOULD be pep_ite_ldap if configuring different change!!


_pep_eiap_xpack_secret_name: |-
  {{ cluster_name + '-xpack-generic' }}

# First we use lookup -- via ini file [NOTE: mapping must be set]
_lookup_xpack_cluster_01: |-
  {{
    q('ini_helper', _pep_eiap_xpack_secret_name, file=secrets_ini_file)
    |
    first
  }}


# note: we use misc secret
pep_eiap_kibana_cluster_01_misc_secret:

  name: "{{ _pep_eiap_xpack_secret_name }}"

  # all UNENCODED data -- key value pairs
  xpack.security.encryptionKey: "{{ _lookup_xpack_cluster_01['enc_key'] }}"

  xpack.encryptedSavedObjects.encryptionKey: "{{ _lookup_xpack_cluster_01['saved_obj_key'] }}"

  xpack.reporting.encryptionKey: "{{ _lookup_xpack_cluster_01['reporting_key'] }}"

  # ldap svc account -- to do parameterize
  xpack.security.authc.realms.ldap.pep_prod_ldap.secure_bind_password: |-
    {{ _lookup_xpack_cluster_01['ldap_svc_account_password'] }}

  ## All secret data already ENCODED (under data_encoded)
  # data_encoded:



