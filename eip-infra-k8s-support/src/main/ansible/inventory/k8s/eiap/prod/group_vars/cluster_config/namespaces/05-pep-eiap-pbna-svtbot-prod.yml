---
ns_pep_eiap_pbna_svtbot_prod:
  
  name: pep-eiap-pbna-svtbot-prod
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: pbna-svtbot
    sector: pbna
    project: svtbot
    istio.io/rev: prod-stable
    environment: prod
    env-prod: "true"

  service_accounts:
    - name: pep-eiap-pbna-svtbot-prod-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-eiap-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-eiap-appsupport-rb
      subjects:
        - "{{ k8s_sup_subjects['pbna_svtbot'] }}"
      roleref:
         "{{ k8s_role_ref['appsupprt_rb'] }}"
