---
# Common secret names for whole elastic stack that is shared across 
# various namespaces

# Note generic k8s secret type
pep_eiap_gateway_certs_secret_names_generic:
  - secret_name: "{{ pep_eiap_gw01_tls_misc_secret['name'] }}"
  - secret_name: "{{ pep_eiap_gw02_tls_misc_secret['name'] }}"

# elastic license as generic secret
elastic_license_secret_names_generic:
  - secret_name: "{{ pep_eiap_eck_license_misc_secret['name'] }}"

# kibana encryption keys as generic secret (cluster-01)
pep_eiap_kibana_cluster_01_secret_names_generic:
  - secret_name: "{{ pep_eiap_kibana_cluster_01_misc_secret['name'] }}"


# ##
# Register secrets to appropriate namespaces
# ##

# elastic-system namespace (operator : gw + license)
elastic_generic_secrets_names: |-
  {{ elastic_license_secret_names_generic 
      + pep_eiap_gateway_certs_secret_names_generic 
  }}

# pep-eiap-elastic-cluster-01 namespace
elastic_cluster_01_generic_secrets: |-
  {{ pep_eiap_gateway_certs_secret_names_generic 
      + pep_eiap_kibana_cluster_01_secret_names_generic
  }}
