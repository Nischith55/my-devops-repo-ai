---
ns_pep_eiap_pbna_senfsv_prod:
  
  name: pep-eiap-pbna-senfsv-prod
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: pbna-senfsv
    sector: pbna
    project: senfsv
    crosscharge_aks: crosscharge
    istio-injection: enabled
    servicename_aks: sen_fsv_integration_prod
    pep-cmdb-app-service-id: "cd0aa9e3c3f30ad86bb4be0599013186"
    pep-cmdb-bus-app-id: "2bde4cbddb3e8c10c2b5f38139961943"
    pep-environment: "Production"
    istio.io/rev: prod-stable
    environment: prod
    env-prod: "true"

  service_accounts:
    - name: pep-eiap-pbna-senfsv-prod-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-eiap-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-eiap-appsupport-rb
      subjects:
        - "{{ k8s_sup_subjects['pbna_senfsv'] }}"
      roleref:
         "{{ k8s_role_ref['appsupprt_rb'] }}"
  secrets: 
    name: pep-eiap-pbna-senfsv-prod-sa-token
    namespace: pep-eiap-pbna-senfsv-prod
    annotations:
      kubernetes.io/service-account.name : "pep-eiap-pbna-senfsv-prod-sa"
