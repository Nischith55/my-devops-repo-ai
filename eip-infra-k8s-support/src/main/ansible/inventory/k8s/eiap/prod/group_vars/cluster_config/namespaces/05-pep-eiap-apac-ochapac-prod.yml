---
ns_pep_eiap_apac_ochapac_prod:
  
  name: pep-eiap-apac-ochapac-prod
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: apac-ochapac
    sector: apac
    project: ochapac
    crosscharge_aks: crosscharge
    istio-injection: enabled
    servicename_aks: omni-channelcommerceintegrationhubseaprod
    pep-cmdb-app-service-id: "a5f25b379702ea50e606f527f053af31"
    pep-cmdb-bus-app-id: "aa0ad23ddb149850ccfa65494b961944"
    pep-environment: "Production"
    istio.io/rev: prod-stable
    environment: prod
    env-prod: "true"

  service_accounts:
    - name: pep-eiap-apac-ochapac-prod-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-eiap-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-eiap-appsupport-rb
      subjects:
        - "{{ k8s_sup_subjects['apac_ochapac'] }}"
      roleref:
         "{{ k8s_role_ref['appsupprt_rb'] }}"
  secrets: 
    name: pep-eiap-apac-ochapac-prod-sa-token
    namespace: pep-eiap-apac-ochapac-prod
    annotations:
      kubernetes.io/service-account.name : "pep-eiap-apac-ochapac-prod-sa"
