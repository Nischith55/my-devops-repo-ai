---
#: ##########################################################################
#: K8S Support Master Inventory
#: ##########################################################################

all:

  children:

    # -----------
    # All AKS Cluster inherit vars from cluster_config
    # -----------
    cluster_config:
      hosts:
        #pep-eiap-prod-gwc-infra-02-aks:
        #pep-eiap-prod-suk-infra-02-aks:
        #pep-eiap-prod-suk-global-01-aks:   
             
        # AE
        pep-eiap-prod-ae-infra-02-aks:
        pep-eiap-prod-ae-global-01-aks:

        # EUS
        pep-eiap-prod-eus-aqua-04-aks:
        pep-eiap-prod-eus-global-01-aks:
        pep-eiap-prod-eus-infra-02-aks:

        # GWC
        pep-eiap-prod-gwc-global-01-aks:
        pep-eiap-prod-gwc-infra-02-aks:

        # SEA
        pep-eiap-prod-sea-infra-02-aks:
        pep-eiap-prod-sea-global-01-aks:

        # SCUS
        pep-eiap-prod-scus-aqua-04-aks:
        pep-eiap-prod-scus-global-01-aks:
        pep-eiap-prod-scus-infra-02-aks:

        # SUK
        pep-eiap-prod-suk-infra-02-aks:
        pep-eiap-prod-suk-global-01-aks:

    # ----------------------
    # cluster_node_common
    # ----------------------
    cluster_node_common:
      vars:
        ansible_connection: ssh
        ansible_user: "{{ aks_ssh_user }}"
        ansible_ssh_private_key_file: "{{ aks_ssh_private_key_file }}"

  # ALWAYS local connection
  vars:
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
