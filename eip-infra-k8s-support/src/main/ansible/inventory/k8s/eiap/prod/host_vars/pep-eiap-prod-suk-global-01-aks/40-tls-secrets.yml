---
# ##
# This single file consolidates all the TLS secrets for this particular hosts
# and also set's the secret names for interested namespaces
# ##

# gw01: TLS Secret
pep_eiap_suk_global_01_aks_gw01_tls_secret: |-
  {{ gw01_tls_ini_lookup_data }}

# gw02: TLS Secret
pep_eiap_suk_global_01_aks_gw02_tls_secret: |-
  {{ gw02_tls_ini_lookup_data }}


# ##
# Add the secret names to interested namespaces
# ##

ingress_gw_tls_secret_names:
  - secret_name: "{{ pep_eiap_suk_global_01_aks_gw01_tls_secret['name'] }}"
  - secret_name: "{{ pep_eiap_suk_global_01_aks_gw02_tls_secret['name'] }}"


istio_tls_secrets_names: "{{ ingress_gw_tls_secret_names }}"

# same secrets
kubernetes_dashboard_tls_secrets_names: "{{ ingress_gw_tls_secret_names }}"

# add it to global_infra too

global_infra_tls_secrets: "{{ ingress_gw_tls_secret_names }}"

