---
ns_pep_eiap_latam_iaipsr_preprod:
  
  name: pep-eiap-latam-iaipsr-preprod
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: latam-iaipsr
    sector: latam
    project: iaipsr
    crosscharge_aks: crosscharge
    istio-injection: enabled
    servicename_aks: iaicv-computervisionprod
    pep-cmdb-app-service-id: "28e2e9341bf801104205c9d4604bcba4"
    pep-cmdb-bus-app-id: "ace2e9341bf801104205c9d4604bcba1"
    pep-environment: "Preprod"
    istio.io/rev: preprod-stable
    environment: preprod
    env-preprod: "true"

  service_accounts:
    - name: pep-eiap-latam-iaipsr-preprod-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-eiap-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-eiap-appsupport-rb
      subjects:
        - "{{ k8s_sup_subjects['latam_iaipsr'] }}"
      roleref:
         "{{ k8s_role_ref['appsupprt_rb'] }}"
  secrets: 
    name: pep-eiap-latam-iaipsr-preprod-sa-token
    namespace: pep-eiap-latam-iaipsr-preprod
    annotations:
      kubernetes.io/service-account.name : "pep-eiap-latam-iaipsr-preprod-sa"
