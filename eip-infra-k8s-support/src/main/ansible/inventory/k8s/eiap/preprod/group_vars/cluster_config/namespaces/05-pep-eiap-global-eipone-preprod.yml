---
# ##
# IMPORTANT:
#  Variable Name Convention:
#   - Always start with 'ns_'
#   - replace '-' with '_' in the namespace name
# ##

# Namespace GLOBAL EIP
# IMPORTANT:
#  - change environment and add or remove flag env-{dev, qa, prod or preprod etc}

ns_pep_eiap_global_eipone_preprod:
  
  name: pep-eiap-global-eipone-preprod

  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: global-eip
    sector: global
    project: eip
    istio-injection: enabled
    environment: preprod
    env-preprod: "true"

  # service accounts for this namespace
  service_accounts:

    - name: pep-eiap-global-eipone-preprod-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-eiap-springcloudk8s-rb

  role_bindings:

    # appsupport role
    - name: pep-eiap-appsupport-rb
      subjects:
        - "{{ k8s_sup_subjects['global_mdp'] }}"
