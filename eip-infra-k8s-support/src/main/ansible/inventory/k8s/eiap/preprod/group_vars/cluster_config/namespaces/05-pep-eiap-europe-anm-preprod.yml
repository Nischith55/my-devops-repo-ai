---
# ##
# IMPORTANT:
#  Variable Name Convention:
#   - Always start with 'ns_'
#   - replace '-' with '_' in the namespace name
# ##

# Namespace Europe ANM
# IMPORTANT:
#  - change environment and add or remove flag env-{dev, qa, prod or preprod etc}

ns_pep_eiap_europe_anm_preprod:
  
  name: pep-eiap-europe-anm-preprod

  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: europe-anm
    sector: europe
    project: anm
    istio.io/rev: preprod-stable
    environment: preprod
    env-preprod: "true"

  # service accounts for this namespace
  service_accounts:

    # should have springcloudk8s role 
    - name: pep-eiap-europe-anm-preprod-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-eiap-springcloudk8s-rb

  role_bindings:

    # appsupport role
    - name: pep-eiap-appsupport-rb
      subjects:
        - "{{ k8s_sup_subjects['europe_anm'] }}"
