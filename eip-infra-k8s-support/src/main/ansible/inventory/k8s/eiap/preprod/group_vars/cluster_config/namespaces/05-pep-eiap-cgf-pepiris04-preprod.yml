---
ns_pep_eiap_cgf_pepiris04_preprod:
  
  name: pep-eiap-cgf-pepiris04-preprod
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: cgf-pepiris04
    sector: cgf
    project: pepiris04
    crosscharge_aks: crosscharge
    istio-injection: enabled
    servicename_aks: pepiriscvplatform
    pep-cmdb-app-service-id: "32afc5b847dd2a9001cc7ff4f16d43d1"
    pep-cmdb-bus-app-id: "28b4f10e47b8a21426faaa22516d4351"
    pep-environment: "Preprod"
    istio.io/rev: preprod-stable
    environment: preprod
    env-preprod: "true"

  service_accounts:
    - name: pep-eiap-cgf-pepiris04-preprod-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-eiap-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-eiap-appsupport-rb
      subjects:
        - "{{ k8s_sup_subjects['cgf_pepiris04'] }}"
      roleref:
         "{{ k8s_role_ref['appsupprt_rb'] }}"
  secrets: 
    name: pep-eiap-cgf-pepiris04-preprod-sa-token
    namespace: pep-eiap-cgf-pepiris04-preprod
    annotations:
      kubernetes.io/service-account.name : "pep-eiap-cgf-pepiris04-preprod-sa"
