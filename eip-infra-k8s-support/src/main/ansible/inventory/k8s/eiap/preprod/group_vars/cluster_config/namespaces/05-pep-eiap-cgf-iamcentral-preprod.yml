---
ns_pep_eiap_cgf_iamcentral_preprod:
  
  name: pep-eiap-cgf-iamcentral-preprod
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: cgf-iamcentral
    sector: cgf
    project: iamcentral
    crosscharge_aks: crosscharge
    istio-injection: enabled
    servicename_aks: myidmnon-prod
    pep-cmdb-app-service-id: "d5cf65b61b7905143b070ed8cc4bcbbb"
    pep-cmdb-bus-app-id: "79cec07ddb3e8c10c2b5f38139961954"
    pep-environment: "Preprod"
    istio.io/rev: preprod-stable
    environment: preprod
    env-preprod: "true"

  service_accounts:
    - name: pep-eiap-cgf-iamcentral-preprod-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-eiap-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-eiap-appsupport-rb
      subjects:
        - "{{ k8s_sup_subjects['cgf_iamcentral'] }}"
      roleref:
         "{{ k8s_role_ref['appsupprt_rb'] }}"
  secrets: 
    name: pep-eiap-cgf-iamcentral-preprod-sa-token
    namespace: pep-eiap-cgf-iamcentral-preprod
    annotations:
      kubernetes.io/service-account.name : "pep-eiap-cgf-iamcentral-preprod-sa"
