---
#: ##########################################################################
#: K8S Support Master Inventory
#: ##########################################################################

all:

  children:

    # -----------
    # All AKS Cluster inherit vars from cluster_config
    # -----------
    cluster_config:
      hosts:
        pep-eiap-preprod-eus-global-01-aks:
        pep-eiap-preprod-eus-infra-02-aks:
        pep-eiap-preprod-scus-global-01-aks:
        pep-eiap-preprod-scus-infra-02-aks:
        pep-eiap-preprod-suk-global-01-aks:
        pep-eiap-preprod-gwc-global-01-aks:       

    # ----------------------
    # cluster_node_common
    # ----------------------
    cluster_node_common:
      vars:
        ansible_connection: ssh
        ansible_user: "{{ aks_ssh_user }}"
        ansible_ssh_private_key_file: "{{ aks_ssh_private_key_file }}"

  # ALWAYS local connection
  vars:
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
