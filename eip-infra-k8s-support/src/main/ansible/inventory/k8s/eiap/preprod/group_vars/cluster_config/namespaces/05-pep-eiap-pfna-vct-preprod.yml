---
# ##
# IMPORTANT:
#  Variable Name Convention:
#   - Always start with 'ns_'
#   - replace '-' with '_' in the namespace name
# ##

# Namespace PFNA VCT
# IMPORTANT:
#  - change environment and add or remove flag env-{dev, qa etc}

ns_pep_eiap_pfna_vct_preprod:
  
  name: pep-eiap-pfna-vct-preprod

  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: pfna-vct
    sector: pfna
    project: vct
    istio.io/rev: preprod-stable
    environment: preprod
    env-preprod: "true"

  role_bindings:

    # appsupport role
    - name: pep-eiap-appsupport-rb
      subjects:
        - "{{ k8s_sup_subjects['pfna_vct'] }}"

  # service accounts for this namespace
  service_accounts:

    # no specific role as of now
    - name: pep-eiap-pfna-vct-preprod-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-eiap-springcloudk8s-rb
