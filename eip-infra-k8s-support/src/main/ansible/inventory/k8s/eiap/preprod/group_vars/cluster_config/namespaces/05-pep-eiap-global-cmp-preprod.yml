---
# ##
# IMPORTANT:
#  Variable Name Convention:
#   - Always start with 'ns_'
#   - replace '-' with '_' in the namespace name
# ##

# Namespace GLOBAL EIP
# IMPORTANT:
#  - change environment and add or remove flag env-{dev, qa, prod or preprod etc}

ns_pep_eiap_global_cmp_preprod:
  
  name: pep-eiap-global-cmp-preprod

  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: global-cmp
    sector: global
    project: cmp
    istio.io/rev: preprod-stable
    environment: preprod
    env-preprod: "true"

  role_bindings:

    # appsupport role
    - name: pep-eiap-appsupport-rb
      subjects:
        - "{{ k8s_sup_subjects['global_cmp'] }}"