---
ns_pep_eiap_cgf_pepgptnv_dev:
  
  name: pep-eiap-cgf-pepgptnv-dev
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: cgf-pepgptnv
    sector: cgf
    project: pepgptnv
    crosscharge_aks: direct
    istio-injection: enabled
    servicename_aks: pepgpt
    pep-cmdb-app-service-id: "d5f1022f97c6ea50323778c11153afff"
    pep-cmdb-bus-app-id: "85f1022f97c6ea50323778c11153af98"
    pep-environment: "Development"
    istio.io/rev: nonprod-stable
    environment: nonprod
    env-dev: "true"

  service_accounts:
    - name: pep-eiap-cgf-pepgptnv-dev-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-eiap-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-eiap-developer-rb
      subjects:
        - "{{ k8s_sup_subjects['cgf_pepgptnv'] }}"
      roleref:
        "{{ k8s_role_ref['developer_rb'] }}"
  secrets: 
    name: pep-eiap-cgf-pepgptnv-dev-sa-token
    namespace: pep-eiap-cgf-pepgptnv-dev
    annotations:
      kubernetes.io/service-account.name : "pep-eiap-cgf-pepgptnv-dev-sa"
