---
# ##
# IMPORTANT:
#  Variable Name Convention:
#   - Always start with 'ns_'
#   - replace '-' with '_' in the namespace name
# ##

# Namespace PFNA ONEPEP
# IMPORTANT:
#  - change environment and add or remove flag env-{dev, qa etc}

ns_pep_eiap_pfna_onepep_qa:
  
  name: pep-eiap-pfna-onepep-qa

  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: pfna-onepep
    sector: pfna
    project: onepep
    istio.io/rev: nonprod-stable
    environment: nonprod
    env-dev: "true"

  role_bindings:

    # developer role
    - name: pep-eiap-developer-rb
      subjects:
        - "{{ k8s_sup_subjects['pfna_onepep'] }}"
    


  # service accounts for this namespace
  service_accounts:

    # no rolebinding, unless asked
    - name: pep-eiap-pfna-onepep-qa-sa
      role_bindings: 
        # name of the binding 
        - name: pep-eiap-springcloudk8s-rb



