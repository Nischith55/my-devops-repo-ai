---
# ##
# IMPORTANT:
#  Variable Name Convention:
#   - Always start with 'ns_'
#   - replace '-' with '_' in the namespace name
# ##

# Namespace GLOBAL IDT
# IMPORTANT:
#  - change environment and add or remove flag env-{dev, qa etc}

ns_pep_eiap_global_idt_dev:

  name: pep-eiap-global-idt-dev

  # ALL label values MUST be string, quote native yaml types
  labels:
    team: global-idt
    sector: global
    project: idt
    istio.io/rev: nonprod-stable
    environment: nonprod
    env-dev: "true"

  role_bindings:

    # developer role
    - name: pep-eiap-developer-rb
      subjects:
        - "{{ k8s_sup_subjects['global_idt'] }}"
        - "{{ k8s_sup_subjects['global_idt_sp'] }}"
        
  # registry secrets
  registry_secrets:

    - secret_name: "{{ _global_idt_spn_name }}"
      registries: 
        - digitaltwindev.azurecr.io

  # generic secrets

  generic_secrets:
    - secret_name: "{{ _global_idt_spn_name }}"
      # Any contents apart from what is in secret        
