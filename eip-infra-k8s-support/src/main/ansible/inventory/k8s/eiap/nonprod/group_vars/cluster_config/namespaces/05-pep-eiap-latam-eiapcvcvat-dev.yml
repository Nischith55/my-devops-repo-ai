---
ns_pep_eiap_latam_eiapcvcvat_dev:
  
  name: pep-eiap-latam-eiapcvcvat-dev
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: latam-eiapcvcvat
    sector: latam
    project: eiapcvcvat
    istio-injection: enabled
    istio.io/rev: nonprod-stable
    environment: nonprod
    env-dev: "true"

  service_accounts:
    - name: pep-eiap-latam-eiapcvcvat-dev-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-eiap-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-eiap-developer-rb
      subjects:
        - "{{ k8s_sup_subjects['latam_eiapcvcvat'] }}"
      roleref:
        "{{ k8s_role_ref['developer_rb'] }}"
  secrets: 
    name: pep-eiap-latam-eiapcvcvat-dev-sa-token
    namespace: pep-eiap-latam-eiapcvcvat-dev
    annotations:
      kubernetes.io/service-account.name : "pep-eiap-latam-eiapcvcvat-dev-sa"
