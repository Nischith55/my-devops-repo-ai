---
ns_pep_eiap_pbna_cmptaq3_dev:
  
  name: pep-eiap-pbna-cmptaq3-dev
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: pbna-cmptaq3
    sector: pbna
    project: cmptaq3
    crosscharge_aks: crosscharge
    istio-injection: enabled
    servicename_aks: cloudmarketplace-cmp-non-prod
    pep-cmdb-app-service-id: "67889"
    pep-cmdb-bus-app-id: "12345"
    pep-environment: "Development"
    istio.io/rev: nonprod-stable
    environment: nonprod
    env-dev: "true"

  service_accounts:
    - name: pep-eiap-pbna-cmptaq3-dev-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-eiap-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-eiap-developer-rb
      subjects:
        - "{{ k8s_sup_subjects['pbna_cmptaq3'] }}"
      roleref:
        "{{ k8s_role_ref['developer_rb'] }}"
  secrets: 
    name: pep-eiap-pbna-cmptaq3-dev-sa-token
    namespace: pep-eiap-pbna-cmptaq3-dev
    annotations:
      kubernetes.io/service-account.name : "pep-eiap-pbna-cmptaq3-dev-sa"
