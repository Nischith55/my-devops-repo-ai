---
# ##
# IMPORTANT:
#  Variable Name Convention:
#   - Always start with 'ns_'
#   - replace '-' with '_' in the namespace name
# ##

# Namespace CGF pdm
# IMPORTANT:
#  - change environment and add or remove flag env-{qa, qa etc}

ns_pep_eiap_cgf_pdm_qa:
  
  name: pep-eiap-cgf-pdm-qa

  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: cgf-pdm
    sector: cgf
    project: pdm
    istio.io/rev: nonprod-stable
    environment: nonprod
    env-qa: "true"

  role_bindings:

    # developer role
    - name: pep-eiap-developer-rb
      subjects:
        - "{{ k8s_sup_subjects['cgf_pdm'] }}"
       

