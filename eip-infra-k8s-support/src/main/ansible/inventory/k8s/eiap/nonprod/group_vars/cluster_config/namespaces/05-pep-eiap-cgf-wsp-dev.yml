---
# ##
# IMPORTANT:
#  Variable Name Convention:
#   - Always start with 'ns_'
#   - replace '-' with '_' in the namespace name
# ##

# Namespace FLNA IACOE
# IMPORTANT:
#  - change environment and add or remove flag env-{dev, qa etc}

ns_pep_eiap_cgf_wsp_dev:
  
  name: pep-eiap-cgf-wsp-dev

  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: cgf-wsp
    sector: cgf
    project: wsp
    istio.io/rev: nonprod-stable
    environment: nonprod
    env-dev: "true"

  role_bindings:

    # developer role
    - name: pep-eiap-developer-rb
      subjects:
        - "{{ k8s_sup_subjects['cgf_wsp'] }}"
        - "{{ k8s_sup_subjects['cgf_wsp_sp'] }}"

  # registry secrets
  registry_secrets:

    - secret_name: "{{ _cgf_wsp_spn_name }}"
      registries: 
        - mypep.azurecr.io

  # generic secrets

  generic_secrets:
    - secret_name: "{{ _cgf_wsp_spn_name }}"
      # Any contents apart from what is in secret

  # service accounts for this namespace
  service_accounts:

    # should have springcloudk8s role 
    - name: pep-eiap-cgf-wsp-dev-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-eiap-springcloudk8s-rb

