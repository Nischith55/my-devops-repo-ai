---
# app dynamic secret
# ##

# the section name in a ini style file
_appd_nonprod_controller: appd-nonprod-controller

# ALways take the first since we are giving only 1 section
_lookup_appd_nonprod: |-
  {{
    q('ini_helper', _appd_nonprod_controller,
       keys_map=appd_section_keys_map, file=secrets_ini_file)
    |
    first
  }}

appd_nonprod_secret_name: "{{ _lookup_appd_nonprod['secret_name'] }}"

pep-eiap-appd-nonprod-controller-misc-secret:

  name: "{{ appd_nonprod_secret_name }}"
  controller-key: "{{ _lookup_appd_nonprod['access_key'] }}"

