---
# ##
# Convenient Cluster Specific lookup via ini for GW01 TLS
# ##
# ALways take the first since we are giving only 1 section
_lookup_pep_eiap_scus_infra_02_aks_gw01: |-
  {{
    q('ini_helper', cluster_name + '-gw01-tls',
    keys_map=k8s_tls_section_keys_map, file=secrets_ini_file)
    |
    first
  }}

gw01_tls_ini_lookup_data:

  # name:
  name: "{{ cluster_name + '-gw01-tls' }}"

  tls_key: |-
    {{ _lookup_pep_eiap_scus_infra_02_aks_gw01['tls_key'] }}

  tls_crt: |
    {{ _lookup_pep_eiap_scus_infra_02_aks_gw01['tls_crt'] }}

  # always add pepsico-ca-chain
  ca_crt: |
    {{ pep_ca_chain_pem | string | b64encode }}
