---
ns_pep_eiap_cgf_rmispecs_qa:
  
  name: pep-eiap-cgf-rmispecs-qa
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: cgf-rmispecs
    sector: cgf
    project: rmispecs
    crosscharge_aks: crosscharge
    istio-injection: enabled
    istio.io/rev: nonprod-stable
    environment: nonprod
    env-qa: "true"

  service_accounts:
    - name: pep-eiap-cgf-rmispecs-qa-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-eiap-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-eiap-developer-rb
      subjects:
        - "{{ k8s_sup_subjects['cgf_rmispecs'] }}"
      roleref:
        "{{ k8s_role_ref['developer_rb'] }}"
  secrets: 
    name: pep-eiap-cgf-rmispecs-qa-sa-token
    namespace: pep-eiap-cgf-rmispecs-qa
    annotations:
      kubernetes.io/service-account.name : "pep-eiap-cgf-rmispecs-qa-sa"
