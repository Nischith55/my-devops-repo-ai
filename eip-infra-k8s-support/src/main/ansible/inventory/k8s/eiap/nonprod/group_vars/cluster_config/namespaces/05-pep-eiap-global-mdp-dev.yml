---
# ##
# IMPORTANT:
#  Variable Name Convention:
#   - Always start with 'ns_'
#   - replace '-' with '_' in the namespace name
# ##

# Namespace Global/MDP
# IMPORTANT:
#  - change environment and add or remove flag env-{dev, qa etc}

ns_pep_eiap_global_mdp_dev:

  name: pep-eiap-global-mdp-dev

  # ALL label values MUST be string, quote native yaml types
  labels:
    team: global-mdp
    sector: global
    project: mdp
    istio.io/rev: nonprod-stable
    environment: nonprod
    env-dev: "true"

  role_bindings:

    # developer role
    - name: pep-eiap-developer-rb
      subjects:
        - "{{ k8s_sup_subjects['global_mdp'] }}"
        - "{{ k8s_sup_subjects['global_mdp_sp'] }}"
        
  # registry secrets
  registry_secrets:

    - secret_name: "{{ _global_mdp_spn_name }}"
      registries: 
        - pepeiapnonprodglobalmdpacr.azurecr.io

  # generic secrets

  generic_secrets:
    - secret_name: "{{ _global_mdp_spn_name }}"
      # Any contents apart from what is in secret        

  # service accounts for this namespace
  service_accounts:

    # should have springcloudk8s role 
    - name: pep-eiap-global-mdp-dev-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-eiap-springcloudk8s-rb

