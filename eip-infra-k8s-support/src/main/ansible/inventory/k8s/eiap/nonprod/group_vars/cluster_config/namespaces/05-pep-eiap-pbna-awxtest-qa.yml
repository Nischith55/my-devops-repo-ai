---
ns_pep_eiap_pbna_awxtest_qa:
  
  name: pep-eiap-pbna-awxtest-qa
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: pbna-awxtest
    sector: pbna
    project: awxtest
    crosscharge_aks: direct
    istio-injection: enabled
    servicename_aks: hyperautomationansibletower
    pep-cmdb-app-service-id: "78d3e5cac3f135906e47f145df013110"
    pep-cmdb-bus-app-id: "38d3a5cac3f135906e47f145df0131ee"
    pep-environment: "QA"
    istio.io/rev: nonprod-stable
    environment: nonprod
    env-qa: "true"

  service_accounts:
    - name: pep-eiap-pbna-awxtest-qa-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-eiap-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-eiap-developer-rb
      subjects:
        - "{{ k8s_sup_subjects['pbna_awxtest'] }}"
      roleref:
        "{{ k8s_role_ref['developer_rb'] }}"
  secrets: 
    name: pep-eiap-pbna-awxtest-qa-sa-token
    namespace: pep-eiap-pbna-awxtest-qa
    annotations:
      kubernetes.io/service-account.name : "pep-eiap-pbna-awxtest-qa-sa"
