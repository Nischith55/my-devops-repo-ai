---
ns_pep_eiap_apac_uaemt_dev:
  
  name: pep-eiap-apac-uaemt-dev
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: apac-uaemt
    sector: apac
    project: uaemt
    crosscharge_aks: direct
    istio-injection: enabled
    servicename_aks: pricechangeprocessdigitizationbrazillatam
    pep-cmdb-app-service-id: "ce912a7c4715fd501253efdc416d4385"
    pep-cmdb-bus-app-id: "ee2e272687cd31d486fc0dc5cebb3594"
    pep-environment: "Development"
    istio.io/rev: nonprod-stable
    environment: nonprod
    env-dev: "true"

  service_accounts:
    - name: pep-eiap-apac-uaemt-dev-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-eiap-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-eiap-developer-rb
      subjects:
        - "{{ k8s_sup_subjects['apac_uaemt'] }}"
      roleref:
        "{{ k8s_role_ref['developer_rb'] }}"
  secrets: 
    name: pep-eiap-apac-uaemt-dev-sa-token
    namespace: pep-eiap-apac-uaemt-dev
    annotations:
      kubernetes.io/service-account.name : "pep-eiap-apac-uaemt-dev-sa"
