---
ns_pep_eiap_cgf_pepsar_dev:
  
  name: pep-eiap-cgf-pepsar-dev
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: cgf-pepsar
    sector: cgf
    project: pepsar
    crosscharge_aks: direct
    istio-injection: enabled
    servicename_aks: saparchiving-nanon-prod
    pep-cmdb-app-service-id: "a551ed3847e6151052293238436d4378"
    pep-cmdb-bus-app-id: "26de84bddb3e8c10c2b5f381399619f7"
    pep-environment: "Development"
    istio.io/rev: nonprod-stable
    environment: nonprod
    env-dev: "true"

  service_accounts:
    - name: pep-eiap-cgf-pepsar-dev-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-eiap-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-eiap-developer-rb
      subjects:
        - "{{ k8s_sup_subjects['cgf_pepsar'] }}"
      roleref:
        "{{ k8s_role_ref['developer_rb'] }}"
  secrets: 
    name: pep-eiap-cgf-pepsar-dev-sa-token
    namespace: pep-eiap-cgf-pepsar-dev
    annotations:
      kubernetes.io/service-account.name : "pep-eiap-cgf-pepsar-dev-sa"
