---
ns_pep_eiap_cgf_dseagntdev_dev:
  
  name: pep-eiap-cgf-dseagntdev-dev
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: cgf-dseagntdev
    sector: cgf
    project: dseagntdev
    crosscharge_aks: direct
    istio-injection: enabled
    servicename_aks: eipazurekubernetesserviceprod
    pep-cmdb-app-service-id: "ea7967b31be36010b050c992604bcbc1"
    pep-cmdb-bus-app-id: "327967b31be36010b050c992604bcbc8"
    pep-environment: "Development"
    istio.io/rev: nonprod-stable
    environment: nonprod
    env-dev: "true"

  service_accounts:
    - name: pep-eiap-cgf-dseagntdev-dev-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-eiap-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-eiap-developer-rb
      subjects:
        - "{{ k8s_sup_subjects['cgf_dseagntdev'] }}"
      roleref:
        "{{ k8s_role_ref['developer_rb'] }}"
  secrets: 
    name: pep-eiap-cgf-dseagntdev-dev-sa-token
    namespace: pep-eiap-cgf-dseagntdev-dev
    annotations:
      kubernetes.io/service-account.name : "pep-eiap-cgf-dseagntdev-dev-sa"
