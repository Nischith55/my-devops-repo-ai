---
# ##
# IMPORTANT:
#  Variable Name Convention:
#   - Always start with 'ns_'
#   - replace '-' with '_' in the namespace name
# ##

# Namespace Global TPO
# IMPORTANT:
#  - change environment and add or remove flag env-{dev, qa etc}

ns_pep_eiap_global_tpo_dev:
  
  name: pep-eiap-global-tpo-dev

  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: global-tpo
    sector: global
    project: tpo
    istio.io/rev: nonprod-stable
    environment: nonprod
    env-dev: "true"

  role_bindings:

    # developer role
    - name: pep-eiap-developer-rb
      subjects:
        - "{{ k8s_sup_subjects['global_tpo'] }}"
        - "{{ k8s_sup_subjects['global_tpo_sp'] }}"

  # registry secrets
  registry_secrets:

    - secret_name: "{{ _global_tpo_spn_name }}"
      registries: 
        - acramlstemplate.azurecr.io

  # generic secrets

  generic_secrets:
    - secret_name: "{{ _global_tpo_spn_name }}"
      # Any contents apart from what is in secret        

