---
ns_pep_eiap_pfna_watch_dev:
  
  name: pep-eiap-pfna-watch-dev
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: pfna-watch
    sector: pfna
    project: watch
    istio.io/rev: nonprod-stable
    environment: nonprod
    env-dev: "true"

  service_accounts:
    - name: pep-eiap-pfna-watch-dev-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-eiap-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-eiap-developer-rb
      subjects:
        - "{{ k8s_sup_subjects['pfna_watch'] }}"
      roleref:
        "{{ k8s_role_ref['developer_rb'] }}"
