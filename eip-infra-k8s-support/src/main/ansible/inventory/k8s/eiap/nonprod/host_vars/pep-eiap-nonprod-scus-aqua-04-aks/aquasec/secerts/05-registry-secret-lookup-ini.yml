---
# ##
# Aquasec registry secret
# ##

# ALways take the first since we are giving only 1 section
_lookup_aquasec_registry_secret: |-
  {{
    q('ini_helper', 'aquasec-regcred', keys_map=k8s_spn_section_keys_map,
      file=secrets_ini_file) 
    | first
  }}

aqua_registry:

  # this is the name of the registry secret
  name: aqua-registry
  
  client-id: "{{ _lookup_aquasec_registry_secret['k8s_username'] }}"

  client-secret: "{{ _lookup_aquasec_registry_secret['k8s_password'] }}"

  tenant-id: "{{ _lookup_aquasec_registry_secret['k8s_tenant_id'] }}"

  email: "{{ _lookup_aquasec_registry_secret['k8s_email'] }}"

