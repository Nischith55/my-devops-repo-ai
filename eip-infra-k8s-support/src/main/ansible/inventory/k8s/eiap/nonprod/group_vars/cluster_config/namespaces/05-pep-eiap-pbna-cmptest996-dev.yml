---
ns_pep_eiap_pbna_cmptest996_dev:
  
  name: pep-eiap-pbna-cmptest996-dev
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: pbna-cmptest996
    sector: pbna
    project: cmptest996
    crosscharge_aks: crosscharge
    istio-injection: enabled
    servicename_aks: codeonenon-prod
    istio.io/rev: nonprod-stable
    environment: nonprod
    env-dev: "true"

  service_accounts:
    - name: pep-eiap-pbna-cmptest996-dev-sa

  role_bindings:
    - name: pep-eiap-developer-rb
      subjects:
        - "{{ k8s_sup_subjects['pbna_cmptest996'] }}"
      roleref:
        "{{ k8s_role_ref['developer_rb'] }}"
  secrets: 
    name: pep-eiap-pbna-cmptest996-dev-sa-token
    namespace: pep-eiap-pbna-cmptest996-dev
    annotations:
      kubernetes.io/service-account.name : "pep-eiap-pbna-cmptest996-dev-sa"
