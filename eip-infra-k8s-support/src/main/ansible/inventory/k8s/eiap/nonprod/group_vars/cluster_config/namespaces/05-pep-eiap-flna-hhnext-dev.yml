---
# ##
# IMPORTANT:
#  Variable Name Convention:
#   - Always start with 'ns_'
#   - replace '-' with '_' in the namespace name
# ##

# Namespace GLOBAL SERVICES
# IMPORTANT:
#  - change environment and add or remove flag env-{dev, qa etc}

ns_pep_eiap_flna_hhnext_dev:

  name: pep-eiap-flna-hhnext-dev

  # ALL label values MUST be string, quote native yaml types
  labels:
    team: flna-hhnext
    sector: flna
    project: hhnext
    istio.io/rev: nonprod-stable
    environment: nonprod
    env-dev: "true"

  role_bindings:

    # developer role
    - name: pep-eiap-developer-rb
      subjects:
        - "{{ k8s_sup_subjects['flna_hhnext'] }}"
        - "{{ k8s_sup_subjects['flna_hhnext_sp'] }}"
        
  # registry secrets
  registry_secrets:

    - secret_name: "{{ _flna_hhnext_spn_name }}"
      registries: 
        - pepeiapnonprodflnahhnextacr.azurecr.io

  # generic secrets

  generic_secrets:
    - secret_name: "{{ _flna_hhnext_spn_name }}"
      # Any contents apart from what is in secret        
