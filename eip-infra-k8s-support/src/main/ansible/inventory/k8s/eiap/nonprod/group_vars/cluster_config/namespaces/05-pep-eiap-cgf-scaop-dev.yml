---
ns_pep_eiap_cgf_scaop_dev:
  
  name: pep-eiap-cgf-scaop-dev
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: cgf-scaop
    sector: cgf
    project: scaop
    istio.io/rev: nonprod-stable
    environment: nonprod
    env-dev: "true"

  service_accounts:
    - name: pep-eiap-cgf-scaop-dev-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-eiap-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-eiap-developer-rb
      subjects:
        - "{{ k8s_sup_subjects['cgf_scaop'] }}"
      roleref:
        "{{ k8s_role_ref['developer_rb'] }}"
