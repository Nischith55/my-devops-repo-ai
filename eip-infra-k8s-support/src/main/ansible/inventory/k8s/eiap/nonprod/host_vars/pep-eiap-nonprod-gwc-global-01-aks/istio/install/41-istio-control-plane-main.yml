---
# ##
# This is the configuration or settings for installing Istio Control Plane
# - Any ingress gateway controller's configuration should be specified here
#   one can use the disable flag to remove the ingress
# ##

# installation patches (we reuse for both json and merge patches)
istio_control_plane_main_patches:

  # choose system node pool - patch them whereever needed
  nodeSelector: "{{ aks_system_np_deployment_spec['nodeSelector'] }}"

  tolerations: "{{ aks_system_np_deployment_spec['tolerations'] }}"

  # ##
  # IMPORTANT: the patch is based on list index order from base resource
  # which is generated by hand or we can generate.
  # ##
  ingressGateways:
    # enable gw 1
    - index: 1
      enabled: true
      # CHANGE-IP if copy and paste
      lb-ip: 172.28.218.254

    # enable gw 2
    - index: 2
      enabled: true
      # CHANGE-IP if copy and paste
      lb-ip: 172.28.218.253
