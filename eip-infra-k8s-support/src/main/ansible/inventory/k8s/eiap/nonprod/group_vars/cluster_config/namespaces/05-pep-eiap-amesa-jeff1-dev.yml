---
ns_pep_eiap_amesa_jeff1_dev:
  
  name: pep-eiap-amesa-jeff1-dev
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: amesa-jeff1
    sector: amesa
    project: jeff1
    istio.io/rev: nonprod-stable
    environment: nonprod
    env-dev: "true"

  service_accounts:
    - name: pep-eiap-amesa-jeff1-dev-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-eiap-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-eiap-developer-rb
      subjects:
        - "{{ k8s_sup_subjects['amesa_jeff1'] }}"
      roleref:
        "{{ k8s_role_ref['developer_rb'] }}"
