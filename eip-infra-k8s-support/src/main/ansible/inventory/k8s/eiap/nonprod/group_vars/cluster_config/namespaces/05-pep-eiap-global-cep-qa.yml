---
# ##
# IMPORTANT:
#  Variable Name Convention:
#   - Always start with 'ns_'
#   - replace '-' with '_' in the namespace name
# ##

# Namespace Global cep
# IMPORTANT:
#  - change environment and add or remove flag env-{dev, qa etc}

ns_pep_eiap_global_cep_qa:
  
  name: pep-eiap-global-cep-qa

  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: global-cep
    sector: global
    project: cep
    istio.io/rev: nonprod-stable
    environment: nonprod
    env-qa: "true"

  role_bindings:

    # developer role
    - name: pep-eiap-developer-rb
      subjects:
        - "{{ k8s_sup_subjects['global_cep'] }}"
    

  # service accounts for this namespace
  service_accounts:
    - name: pep-eiap-global-cep-qa-sa