---
# Istio Gateway 01 Config
# ABBREVIATIONS:
#   - icpm -> istio_control_plane_main
#   - wc -> wildcard
# IMPORTANT:
# - if copy & paste make sure to change the selector
# GLOBALS:
# - _icpm_name_: Control Plane Name (see 51-istio-gateways)

_icpm_ig01: &id001 istio-in-gateway-01

# wildcard for this IP
_icpm_ig01_wc: &wc001 |-
  *.infra.gw01.aks02.scus.nonprod.azure.intra.pepsico.com

_icpm_in_01_gwy_params:

  # TODO: move to filter
  extra_dirs: "{{ _icpm_in_gwy_outdir }}"

  name: *id001

  namespace: "{{ _icpm_namespace_ }}"

  # TODO: We wrap everything under k8s so in future we can use variables
  # Nothing but supported values for the resource as defined in CRD should
  # be here.
  k8s:


    spec:
      # TODO: we can actually source this once we parameterize the names
      selector: 
        istio: pep-eiap-ingress-gw01

      servers:

        # specific k8s-dashboard exposes https only, passthrough mode
        - name: istio-in-gateway-01-dashboard-https-443
          hosts:
            - pep-eiap-k8s-dashboard.infra.gw01.aks02.scus.nonprod.azure.intra.pepsico.com
          port:
            name: tls-dashboard-443
            number: 443
            # NOTE: we can use https, but tls implies use sni, no TLS 
            # termination
            protocol: tls
          tls: |-
            {{
              istio_default_tls_settings
              |
              combine({'mode': 'PASSTHROUGH'}, recursive=True)
            }}

        # elastic-cluster-01-admin, passthrough mode (HIDDEN Admin URL)
        - name: istio-in-gateway-01-elastic-cluster-01-admin-https-443
          hosts:
            - pep-eiap-elastic-01-admin.infra.gw01.aks02.scus.nonprod.azure.intra.pepsico.com
          port:
            name: pep-eiap-elastic-01-admin-443
            number: 443
            # NOTE: we can use https, but tls implies use sni, no TLS 
            # termination
            protocol: tls
          tls: |-
            {{
              istio_default_tls_settings
              |
              combine({'mode': 'PASSTHROUGH'}, recursive=True)
            }}


        # elastic-cluster-01, passthrough mode
        - name: istio-in-gateway-01-elastic-cluster-01-https-443
          hosts:
            - pep-eiap-elastic-01.infra.gw01.aks02.scus.nonprod.azure.intra.pepsico.com
          port:
            name: pep-eiap-elastic-01-443
            number: 443
            # NOTE: we can use https, but tls implies use sni, no TLS 
            # termination
            protocol: tls
          tls: |-
            {{
              istio_default_tls_settings
              |
              combine({'mode': 'PASSTHROUGH'}, recursive=True)
            }}

        # kibana-cluster-01, passthrough mode (TODO: remove once the hyphen
        # name is setup)
        - name: istio-in-gateway-01-kibana-cluster-01-https-443
          hosts:
            - pep-eiap-kibana01.infra.gw01.aks02.scus.nonprod.azure.intra.pepsico.com
          port:
            name: pep-eiap-kibana-01-443
            number: 443
            # NOTE: we can use https, but tls implies use sni, no TLS 
            # termination
            protocol: tls
          tls: |-
            {{
              istio_default_tls_settings
              |
              combine({'mode': 'PASSTHROUGH'}, recursive=True)
            }}

        # kibana-cluster-01, passthrough mode (corrected to -01)
        - name: istio-in-gateway-01-kibana-cluster-01-https-443
          hosts:
            - pep-eiap-kibana-01.infra.gw01.aks02.scus.nonprod.azure.intra.pepsico.com
          port:
            name: pep-eiap-kibana-01-new-443
            number: 443
            # NOTE: we can use https, but tls implies use sni, no TLS 
            # termination
            protocol: tls
          tls: |-
            {{
              istio_default_tls_settings
              |
              combine({'mode': 'PASSTHROUGH'}, recursive=True)
            }}

        # ingest-cluster-01, passthrough mode
        - name: istio-in-gateway-01-ingest-cluster-01-https-443
          hosts:
            - pep-eiap-ingest-01.infra.gw01.aks02.scus.nonprod.azure.intra.pepsico.com
          port:
            name: pep-eiap-ingest-01-443
            number: 443
            # NOTE: we can use https, but tls implies use sni, no TLS 
            # termination
            protocol: tls
          tls: |-
            {{
              istio_default_tls_settings
              |
              combine({'mode': 'PASSTHROUGH'}, recursive=True)
            }}

        # ## pep-eiap-elastic-cluster-02 (cle eck instance)
        # elastic-cluster-02-admin, passthrough mode (HIDDEN Admin URL)
        - name: istio-in-gateway-01-elastic-cluster-02-admin-https-443
          hosts:
            - pep-eiap-elastic-02-admin.infra.gw01.aks02.scus.nonprod.azure.intra.pepsico.com
          port:
            name: pep-eiap-elastic-02-admin-443
            number: 443
            # NOTE: we can use https, but tls implies use sni, no TLS 
            # termination
            protocol: tls
          tls: |-
            {{
              istio_default_tls_settings
              |
              combine({'mode': 'PASSTHROUGH'}, recursive=True)
            }}

        # elastic-cluster-02, passthrough mode
        - name: istio-in-gateway-01-elastic-cluster-02-https-443
          hosts:
            - pep-eiap-elastic-02.infra.gw01.aks02.scus.nonprod.azure.intra.pepsico.com
          port:
            name: pep-eiap-elastic-02-443
            number: 443
            # NOTE: we can use https, but tls implies use sni, no TLS 
            # termination
            protocol: tls
          tls: |-
            {{
              istio_default_tls_settings
              |
              combine({'mode': 'PASSTHROUGH'}, recursive=True)
            }}

        # kibana-cluster-02, passthrough mode
        - name: istio-in-gateway-01-kibana-cluster-02-https-443
          hosts:
            - pep-eiap-kibana-02.infra.gw01.aks02.scus.nonprod.azure.intra.pepsico.com
          port:
            name: pep-eiap-kibana-02-443
            number: 443
            # NOTE: we can use https, but tls implies use sni, no TLS 
            # termination
            protocol: tls
          tls: |-
            {{
              istio_default_tls_settings
              |
              combine({'mode': 'PASSTHROUGH'}, recursive=True)
            }}

        # ingest-cluster-02, passthrough mode
        - name: istio-in-gateway-01-ingest-cluster-02-https-443
          hosts:
            - pep-eiap-ingest-02.infra.gw01.aks02.scus.nonprod.azure.intra.pepsico.com
          port:
            name: pep-eiap-ingest-02-443
            number: 443
            # NOTE: we can use https, but tls implies use sni, no TLS 
            # termination
            protocol: tls
          tls: |-
            {{
              istio_default_tls_settings
              |
              combine({'mode': 'PASSTHROUGH'}, recursive=True)
            }}

        # ### 
        # wild-card - port 443
        - name: istio-in-gateway-01-wildcard-https-443
          hosts:
            - *wc001
          port:
            name: https-wc-443
            number: 443
            protocol: https
          # terminate at gwy (our default is SIMPLE)
          tls: |-
            {{
              istio_default_tls_settings
              |
              combine({'credentialName': 'pep-eiap-nonprod-scus-infra-02-aks-gw01-tls'}, recursive=True)
            }}

        # wild-card - port 80
        - name: istio-in-gateway-01-wildcard-http-80
          hosts:
            - *wc001
          port:
            name: http-wc-80
            number: 80
            protocol: http
          tls:
            # always redirect http traffic to https
            httpsRedirect: true

        # wild-card - port 80 (http2)
        - name: istio-in-gateway-01-wildcard-http2-80
          hosts:
            - *wc001
          port:
            name: http2-wc-80
            number: 80
            protocol: http2
          # http2 cannot have TLS
