---
# ##
# IMPORTANT:
#  Variable Name Convention:
#   - Always start with 'ns_'
#   - replace '-' with '_' in the namespace name
# ##

# Namespace Global cep
# IMPORTANT:
#  - change environment and add or remove flag env-{dev, qa etc}

ns_pep_eiap_global_cep_dev:
  
  name: pep-eiap-global-cep-dev

  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: global-cep
    sector: global
    project: cep
    istio.io/rev: nonprod-stable
    environment: nonprod
    env-dev: "true"

  role_bindings:

    # developer role
    - name: pep-eiap-developer-rb
      subjects:
        - "{{ k8s_sup_subjects['global_cep'] }}"
        - "{{ k8s_sup_subjects['global_cep_sp'] }}"

  # registry secrets
  registry_secrets:

    - secret_name: "{{ _global_cep_spn_name }}"
      registries: 
        - pepdopgwc.azurecr.io

  # generic secrets

  generic_secrets:
    - secret_name: "{{ _global_cep_spn_name }}"
      # Any contents apart from what is in secret        

  # service accounts for this namespace
  service_accounts:

    # should have deployment scaler role 
    - name: pep-eiap-global-cep-dev-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-eiap-scaler-rb
