---
# ##
# IMPORTANT:
#  Variable Name Convention:
#   - Always start with 'ns_'
#   - replace '-' with '_' in the namespace name
# ##

# Namespace FLNA DEMAND ACCELERATOR PICASSO
# IMPORTANT:
#  - change environment and add or remove flag env-{dev, qa etc}

ns_pep_eiap_flna_dxpicasso_qa:
  
  name: pep-eiap-flna-dxpicasso-qa

  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: flna-dxpicasso
    sector: flna
    project: dxpicasso
    istio.io/rev: nonprod-stable
    environment: nonprod
    env-qa: "true"

  role_bindings:

    # developer role
    - name: pep-eiap-developer-rb
      subjects:
        - "{{ k8s_sup_subjects['flna_dxpicasso'] }}"


  # service accounts for this namespace
  service_accounts:

    # no rolebinding, unless asked
    - name: pep-eiap-flna-dxpicasso-qa-sa