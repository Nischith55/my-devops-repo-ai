---
ns_pep_eiap_cgf_pepagm_dev:
  
  name: pep-eiap-cgf-pepagm-dev
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: cgf-pepagm
    sector: cgf
    project: pepagm
    crosscharge_aks: direct
    istio-injection: enabled
    servicename_aks: pepagmnon-prod
    pep-cmdb-app-service-id: "1760e57c47a6151052293238436d4311"
    pep-cmdb-bus-app-id: "97ce4c7ddb3e8c10c2b5f3813996194a"
    pep-environment: "Development"
    istio.io/rev: nonprod-stable
    environment: nonprod
    env-dev: "true"

  service_accounts:
    - name: pep-eiap-cgf-pepagm-dev-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-eiap-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-eiap-developer-rb
      subjects:
        - "{{ k8s_sup_subjects['cgf_pepagm'] }}"
      roleref:
        "{{ k8s_role_ref['developer_rb'] }}"
  secrets: 
    name: pep-eiap-cgf-pepagm-dev-sa-token
    namespace: pep-eiap-cgf-pepagm-dev
    annotations:
      kubernetes.io/service-account.name : "pep-eiap-cgf-pepagm-dev-sa"
