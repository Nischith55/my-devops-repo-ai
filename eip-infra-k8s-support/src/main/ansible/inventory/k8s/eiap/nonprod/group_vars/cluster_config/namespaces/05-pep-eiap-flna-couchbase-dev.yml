---
# ##
# IMPORTANT:
#  Variable Name Convention:
#   - Always start with 'ns_'
#   - replace '-' with '_' in the namespace name
# ##

# Namespace FLNA COUCHBASE
# IMPORTANT:
#  - change environment and add or remove flag env-{dev, qa etc}

ns_pep_eiap_flna_couchbase_dev:

  name: pep-eiap-flna-couchbase-dev

  # ALL label values MUST be string, quote native yaml types
  labels:
    team: flna-couchbase
    sector: flna
    project: couchbase
    istio-injection: disabled
    environment: nonprod
    env-dev: "true"

  role_bindings:

    # developer role
    - name: pep-eiap-developer-rb
      subjects:
        - "{{ k8s_sup_subjects['flna_couchbase'] }}"
        - "{{ k8s_sup_subjects['flna_couchbase_sp'] }}"

  # registry secrets
  registry_secrets:

    - secret_name: "{{ _flna_couchbase_spn_name }}"
      registries: 
        - pepeiapnonprodflnacouchbaseacr.azurecr.io

  # generic secrets

  generic_secrets:
    - secret_name: "{{ _flna_couchbase_spn_name }}"
      # Any contents apart from what is in secret        

