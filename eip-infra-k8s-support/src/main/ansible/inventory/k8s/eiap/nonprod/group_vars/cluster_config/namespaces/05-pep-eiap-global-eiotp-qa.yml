---
# ##
# IMPORTANT:
#  Variable Name Convention:
#   - Always start with 'ns_'
#   - replace '-' with '_' in the namespace name
# ##

# Namespace Global EIOTP
# IMPORTANT:
#  - change environment and add or remove flag env-{dev, qa etc}

ns_pep_eiap_global_eiotp_qa:
  
  name: pep-eiap-global-eiotp-qa

  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: global-eiotp
    sector: global
    project: eiotp
    istio.io/rev: nonprod-stable
    environment: nonprod
    env-qa: "true"

  role_bindings:

    # developer role
    - name: pep-eiap-developer-rb
      subjects:
        - "{{ k8s_sup_subjects['global_eiotp'] }}"
        - "{{ k8s_sup_subjects['global_eiotp_sp'] }}"

  # registry secrets
  registry_secrets:

    - secret_name: "{{ _global_eiotp_spn_name }}"
      registries: 
        - pepeiapnonprodglobaleiotpacr.azurecr.io

  # generic secrets

  generic_secrets:
    - secret_name: "{{ _global_eiotp_spn_name }}"
      # Any contents apart from what is in secret        

