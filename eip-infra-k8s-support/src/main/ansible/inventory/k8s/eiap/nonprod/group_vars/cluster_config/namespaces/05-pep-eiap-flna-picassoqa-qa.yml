---
ns_pep_eiap_flna_picassoqa_qa:
  
  name: pep-eiap-flna-picassoqa-qa
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: flna-picassoqa
    sector: flna
    project: picassoqa
    crosscharge_aks: direct
    istio-injection: enabled
    servicename_aks: demandacceleratorpicassoprod
    pep-cmdb-app-service-id: "836c41a987a841504c6e0e97cebb3527"
    pep-cmdb-bus-app-id: "cf6c41a987a841504c6e0e97cebb3523"
    pep-environment: "QA"
    istio.io/rev: nonprod-stable
    environment: nonprod
    env-qa: "true"

  service_accounts:
    - name: pep-eiap-flna-picassoqa-qa-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-eiap-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-eiap-developer-rb
      subjects:
        - "{{ k8s_sup_subjects['flna_picassoqa'] }}"
      roleref:
        "{{ k8s_role_ref['developer_rb'] }}"
  secrets: 
    name: pep-eiap-flna-picassoqa-qa-sa-token
    namespace: pep-eiap-flna-picassoqa-qa
    annotations:
      kubernetes.io/service-account.name : "pep-eiap-flna-picassoqa-qa-sa"
