---
ns_pep_eiap_pbna_senfsv_dev:
  
  name: pep-eiap-pbna-senfsv-dev
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: pbna-senfsv
    sector: pbna
    project: senfsv
    crosscharge_aks: crosscharge
    istio-injection: enabled
    servicename_aks: sen_fsv_integration_servicesnon-prod
    pep-cmdb-app-service-id: "07f0af9d830c16d0fda314326daad3d2"
    pep-cmdb-bus-app-id: "2bde4cbddb3e8c10c2b5f38139961943"
    pep-environment: "Development"
    istio.io/rev: nonprod-stable
    environment: nonprod
    env-dev: "true"

  service_accounts:
    - name: pep-eiap-pbna-senfsv-dev-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-eiap-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-eiap-developer-rb
      subjects:
        - "{{ k8s_sup_subjects['pbna_senfsv'] }}"
      roleref:
        "{{ k8s_role_ref['developer_rb'] }}"
  secrets: 
    name: pep-eiap-pbna-senfsv-dev-sa-token
    namespace: pep-eiap-pbna-senfsv-dev
    annotations:
      kubernetes.io/service-account.name : "pep-eiap-pbna-senfsv-dev-sa"
