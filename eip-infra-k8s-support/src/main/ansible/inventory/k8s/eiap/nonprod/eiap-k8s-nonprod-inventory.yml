---
#: ##########################################################################
#: K8S Support Master Inventory
#: ##########################################################################

all:

  children:

    # ##
    # Certificate Configuration group
    # ##
    certs_config:
      hosts:
        aquasec:

    # -----------
    # All AKS Cluster inherit vars from cluster_config
    # -----------
    cluster_config:
      hosts:
####### BEGIN Added recently --pep-eiap-nonprod-eus-aisp-01-aks######
        pep-eiap-nonprod-eus-aisp-01-aks:
####### END Added recently --pep-eiap-nonprod-eus-aisp-01-aks######
####### BEGIN Added recently --pep-eiap-nonprod-eus-global-02-aks ######
        pep-eiap-nonprod-eus-global-02-aks:
####### END Added recently --pep-eiap-nonprod-eus-global-02-aks ######
####### BEGIN Added recently --pep-eiap-nonprod-gwc-infra-02-aks######
        pep-eiap-nonprod-gwc-infra-02-aks:
####### END Added recently --pep-eiap-nonprod-gwc-infra-02-aks######
####### BEGIN Added recently --pep-eiap-nonprod-eus-mldeploy-04-aks######
        pep-eiap-nonprod-eus-mldeploy-04-aks:
####### END Added recently --pep-eiap-nonprod-eus-mldeploy-04-aks######
####### BEGIN Added recently --pep-eiap-nonprod-eus-iot-06-aks######
        pep-eiap-nonprod-eus-iot-06-aks:
####### END Added recently --pep-eiap-nonprod-eus-iot-06-aks######
        # AE
        pep-eiap-nonprod-ae-global-01-aks:
        # EUS
        pep-eiap-nonprod-eus-aqua-04-aks:
        pep-eiap-nonprod-eus-global-01-aks:
        pep-eiap-nonprod-eus-infra-02-aks:
        pep-eiap-nonprod-eus-sandbox-03-aks:
        pep-eiap-nonprod-eus-sbox-03-aks:

        # GWC
        pep-eiap-nonprod-gwc-global-01-aks:
        pep-eiap-nonprod-gwc-infra-02-aks:

        # SCUS
        pep-eiap-nonprod-scus-aqua-04-aks:
        pep-eiap-nonprod-scus-global-01-aks:
        pep-eiap-nonprod-scus-infra-02-aks:
        pep-eiap-nonprod-scus-sbox-03-aks:

    # ----------------------
    # cluster_node_common
    # ----------------------
    cluster_node_common:
      vars:
        ansible_connection: ssh
        ansible_user: "{{ aks_ssh_user }}"
        ansible_ssh_private_key_file: "{{ aks_ssh_private_key_file }}"

  # ALWAYS local connection
  vars:
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
