---
ns_pep_eiap_pbna_pescntcr_dev:
  
  name: pep-eiap-pbna-pescntcr-dev
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: pbna-pescntcr
    sector: pbna
    project: pescntcr
    crosscharge_aks: direct
    istio-injection: enabled
    servicename_aks: cetsnexgennon-prod
    pep-cmdb-app-service-id: "584ae43fdb3e8810c2b5f38139961927"
    pep-cmdb-bus-app-id: "bdae00f9db3e8c10c2b5f381399619c2"
    pep-environment: "Development"
    istio.io/rev: nonprod-stable
    environment: nonprod
    env-dev: "true"

  service_accounts:
    - name: pep-eiap-pbna-pescntcr-dev-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-eiap-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-eiap-developer-rb
      subjects:
        - "{{ k8s_sup_subjects['pbna_pescntcr'] }}"
      roleref:
        "{{ k8s_role_ref['developer_rb'] }}"
  secrets: 
    name: pep-eiap-pbna-pescntcr-dev-sa-token
    namespace: pep-eiap-pbna-pescntcr-dev
    annotations:
      kubernetes.io/service-account.name : "pep-eiap-pbna-pescntcr-dev-sa"
