---
ns_pep_eiap_cgf_pepiris02_dev:
  
  name: pep-eiap-cgf-pepiris02-dev
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: cgf-pepiris02
    sector: cgf
    project: pepiris02
    crosscharge_aks: direct
    istio-injection: enabled
    servicename_aks: pepiriscvplatform
    pep-cmdb-app-service-id: "32afc5b847dd2a9001cc7ff4f16d43d1"
    pep-cmdb-bus-app-id: "28b4f10e47b8a21426faaa22516d4351"
    pep-environment: "Development"
    istio.io/rev: nonprod-stable
    environment: nonprod
    env-dev: "true"

  service_accounts:
    - name: pep-eiap-cgf-pepiris02-dev-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-eiap-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-eiap-developer-rb
      subjects:
        - "{{ k8s_sup_subjects['cgf_pepiris02'] }}"
      roleref:
        "{{ k8s_role_ref['developer_rb'] }}"
  secrets: 
    name: pep-eiap-cgf-pepiris02-dev-sa-token
    namespace: pep-eiap-cgf-pepiris02-dev
    annotations:
      kubernetes.io/service-account.name : "pep-eiap-cgf-pepiris02-dev-sa"
