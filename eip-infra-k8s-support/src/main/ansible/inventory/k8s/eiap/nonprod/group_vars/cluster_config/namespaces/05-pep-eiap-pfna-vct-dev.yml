---
# ##
# IMPORTANT:
#  Variable Name Convention:
#   - Always start with 'ns_'
#   - replace '-' with '_' in the namespace name
# ##

# Namespace PFNA VCT Value Chain Transformation
# IMPORTANT:
#  - change environment and add or remove flag env-{dev, qa etc}

ns_pep_eiap_pfna_vct_dev:
  
  name: pep-eiap-pfna-vct-dev

  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: pfna-vct
    sector: pfna
    project: vct
    istio.io/rev: nonprod-stable
    environment: nonprod
    env-dev: "true"

  role_bindings:

    # developer role
    - name: pep-eiap-developer-rb
      subjects:
        - "{{ k8s_sup_subjects['pfna_vct'] }}"
    


  # service accounts for this namespace
  service_accounts:

    # no rolebinding, unless asked
    - name: pep-eiap-pfna-vct-dev-sa
      role_bindings: 
        # name of the binding 
        - name: pep-eiap-springcloudk8s-rb



