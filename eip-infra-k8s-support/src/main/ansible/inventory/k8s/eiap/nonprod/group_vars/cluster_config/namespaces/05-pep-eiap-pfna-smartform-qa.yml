---
ns_pep_eiap_pfna_smartform_qa:
  
  name: pep-eiap-pfna-smartform-qa
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: pfna-smartform
    sector: pfna
    project: smartform
    crosscharge_aks: crosscharge
    istio-injection: enabled
    istio.io/rev: nonprod-stable
    environment: nonprod
    env-qa: "true"

  service_accounts:
    - name: pep-eiap-pfna-smartform-qa-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-eiap-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-eiap-developer-rb
      subjects:
        - "{{ k8s_sup_subjects['pfna_smartform'] }}"
      roleref:
        "{{ k8s_role_ref['developer_rb'] }}"
  secrets: 
    name: pep-eiap-pfna-smartform-qa-sa-token
    namespace: pep-eiap-pfna-smartform-qa
    annotations:
      kubernetes.io/service-account.name : "pep-eiap-pfna-smartform-qa-sa"
