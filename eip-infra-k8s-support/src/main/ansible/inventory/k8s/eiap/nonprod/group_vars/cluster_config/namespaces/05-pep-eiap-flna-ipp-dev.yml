---
ns_pep_eiap_flna_ipp_dev:
  
  name: pep-eiap-flna-ipp-dev
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: flna-ipp
    sector: flna
    project: ipp
    istio.io/rev: nonprod-stable
    environment: nonprod
    env-dev: "true"

  service_accounts:
    - name: pep-eiap-flna-ipp-dev-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-eiap-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-eiap-developer-rb
      subjects:
        - "{{ k8s_sup_subjects['flna_ipp'] }}"
      roleref:
        "{{ k8s_role_ref['developer_rb'] }}"
