---
# GW01 and GW02 as generic secret

# note: we use misc secret
pep_eiap_gw01_tls_misc_secret:

  name: "{{ cluster_name + '-gw01-generic' }}"

  ## All secret data already ENCODED
  data_encoded:

    tls.key: "{{ gw01_tls_ini_lookup_data['tls_key'] }}"
    
    tls.crt: "{{ gw01_tls_ini_lookup_data['tls_crt'] }}"

    ca.crt: "{{ gw01_tls_ini_lookup_data['ca_crt'] }}"


pep_eiap_gw02_tls_misc_secret:

  name: "{{ cluster_name + '-gw02-generic' }}"

  ## All secret data already ENCODED
  data_encoded:
    tls.key: "{{ gw02_tls_ini_lookup_data['tls_key'] }}"
    
    tls.crt: "{{ gw02_tls_ini_lookup_data['tls_crt'] }}"

    ca.crt: "{{ gw02_tls_ini_lookup_data['ca_crt'] }}"
