---
ns_pep_eiap_apac_cmptest1_dev:
  
  name: pep-eiap-apac-cmptest1-dev
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: apac-cmptest1
    sector: apac
    project: cmptest1
    istio.io/rev: nonprod-stable
    environment: nonprod
    env-dev: "true"

  service_accounts:
    - name: pep-eiap-apac-cmptest1-dev-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-eiap-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-eiap-developer-rb
      subjects:
        - "{{ k8s_sup_subjects['apac_cmptest1'] }}"
      roleref:
        "{{ k8s_role_ref['developer_rb'] }}"
