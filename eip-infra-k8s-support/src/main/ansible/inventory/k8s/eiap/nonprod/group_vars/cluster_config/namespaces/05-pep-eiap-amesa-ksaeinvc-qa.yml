---
ns_pep_eiap_amesa_ksaeinvc_qa:
  
  name: pep-eiap-amesa-ksaeinvc-qa
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: amesa-ksaeinvc
    sector: amesa
    project: ksaeinvc
    istio.io/rev: nonprod-stable
    environment: nonprod
    env-qa: "true"

  service_accounts:
    - name: pep-eiap-amesa-ksaeinvc-qa-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-eiap-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-eiap-developer-rb
      subjects:
        - "{{ k8s_sup_subjects['amesa_ksaeinvc'] }}"
      roleref:
        "{{ k8s_role_ref['developer_rb'] }}"
  secrets: 
    name: pep-eiap-amesa-ksaeinvc-qa-sa-token
    namespace: pep-eiap-amesa-ksaeinvc-qa
    annotations:
      kubernetes.io/service-account.name : "pep-eiap-amesa-ksaeinvc-qa-sa"
