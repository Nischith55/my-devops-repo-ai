---
ns_pep_eiap_apac_storm_dev:
  
  name: pep-eiap-apac-storm-dev
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: apac-storm
    sector: apac
    project: storm
    istio.io/rev: nonprod-stable
    environment: nonprod
    env-dev: "true"

  service_accounts:
    - name: pep-eiap-apac-storm-dev-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-eiap-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-eiap-developer-rb
      subjects:
        - "{{ k8s_sup_subjects['apac_storm'] }}"
      roleref:
        "{{ k8s_role_ref['developer_rb'] }}"
