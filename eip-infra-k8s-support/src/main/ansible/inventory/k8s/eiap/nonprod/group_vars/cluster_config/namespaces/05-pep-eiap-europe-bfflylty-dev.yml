---
ns_pep_eiap_europe_bfflylty_dev:
  
  name: pep-eiap-europe-bfflylty-dev
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: europe-bfflylty
    sector: europe
    project: bfflylty
    crosscharge_aks: crosscharge
    istio-injection: enabled
    servicename_aks: b2bpepsiconnectportalloyaltyeuropenon-prod
    pep-cmdb-app-service-id: "070dba9397782e14bec13ae8c253af5c"
    pep-cmdb-bus-app-id: "618c890597d295182db4f9f11153afbd"
    pep-environment: "Development"
    istio.io/rev: nonprod-stable
    environment: nonprod
    env-dev: "true"

  service_accounts:
    - name: pep-eiap-europe-bfflylty-dev-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-eiap-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-eiap-developer-rb
      subjects:
        - "{{ k8s_sup_subjects['europe_bfflylty'] }}"
      roleref:
        "{{ k8s_role_ref['developer_rb'] }}"
  secrets: 
    name: pep-eiap-europe-bfflylty-dev-sa-token
    namespace: pep-eiap-europe-bfflylty-dev
    annotations:
      kubernetes.io/service-account.name : "pep-eiap-europe-bfflylty-dev-sa"
