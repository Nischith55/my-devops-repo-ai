---
ns_pep_eiap_latam_iaicv_dev:
  
  name: pep-eiap-latam-iaicv-dev
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: latam-iaicv
    sector: latam
    project: iaicv
    istio.io/rev: nonprod-stable
    environment: nonprod
    env-dev: "true"

  service_accounts:
    - name: pep-eiap-latam-iaicv-dev-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-eiap-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-eiap-developer-rb
      subjects:
        - "{{ k8s_sup_subjects['latam_iaicv'] }}"
      roleref:
        "{{ k8s_role_ref['developer_rb'] }}"
