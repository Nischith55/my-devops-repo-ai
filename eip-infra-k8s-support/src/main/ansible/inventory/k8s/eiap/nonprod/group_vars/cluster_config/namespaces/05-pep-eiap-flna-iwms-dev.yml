---
ns_pep_eiap_flna_iwms_dev:
  
  name: pep-eiap-flna-iwms-dev
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: flna-iwms
    sector: flna
    project: iwms
    crosscharge_aks: crosscharge
    istio-injection: enabled
    servicename_aks: supplychaindatawarehousenon-prod
    pep-cmdb-app-service-id: "4701e53447e6151052293238436d4316"
    pep-cmdb-bus-app-id: "a0ee40fddb3e8c10c2b5f381399619cd"
    pep-environment: "Development"
    istio.io/rev: nonprod-stable
    environment: nonprod
    env-dev: "true"

  service_accounts:
    - name: pep-eiap-flna-iwms-dev-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-eiap-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-eiap-developer-rb
      subjects:
        - "{{ k8s_sup_subjects['flna_iwms'] }}"
      roleref:
        "{{ k8s_role_ref['developer_rb'] }}"
  secrets: 
    name: pep-eiap-flna-iwms-dev-sa-token
    namespace: pep-eiap-flna-iwms-dev
    annotations:
      kubernetes.io/service-account.name : "pep-eiap-flna-iwms-dev-sa"
