---
# ##
# Secret Data -- one per file
# CONVENTION:
#  - please have the variable name end with -spn-secret for Service Principals
#  - change the _ name to match the spn name
#  - change the override variable in each id
# ##

# name of the spn and also doubles up the section name in a ini style file
_flna_pgt_spn_name: pep-eiap-flna-pgt-dev-aks-sp

# ALways take the first since we are giving only 1 section
_lookup_flna_pgt: |-
  {{
    q('ini_helper', _flna_pgt_spn_name, keys_map=k8s_spn_section_keys_map,
      file=secrets_ini_file) 
    | first
  }}

pep-eiap-flna-pgt-spn-secret:

  name: "{{ _flna_pgt_spn_name }}"
  
  client-id: "{{ _lookup_flna_pgt['k8s_username'] }}"

  client-secret: "{{ _lookup_flna_pgt['k8s_password'] }}"

  tenant-id: "{{ _lookup_flna_pgt['k8s_tenant_id'] }}"

  email: "{{ _lookup_flna_pgt['k8s_email'] }}"

