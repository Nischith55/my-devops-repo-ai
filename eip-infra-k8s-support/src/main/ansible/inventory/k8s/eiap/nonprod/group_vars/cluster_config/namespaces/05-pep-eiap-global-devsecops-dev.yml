---
# ##
# IMPORTANT:
#  Variable Name Convention:
#   - Always start with 'ns_'
#   - replace '-' with '_' in the namespace name
# ##

# Namespace GLOBAL DEVSECOPS
# IMPORTANT:
#  - change environment and add or remove flag env-{dev, qa etc}

ns_pep_eiap_global_devsecops_dev:

  name: pep-eiap-global-devsecops-dev

  # ALL label values MUST be string, quote native yaml types
  labels:
    team: global-devsecops
    sector: global
    project: devsecops
    # The build-agent jobs need to get completed. Istio proxy side-car prevents that & thus is disabled.
    istio-injection: disabled
    environment: nonprod
    env-dev: "true"


  # service accounts for this namespace
  service_accounts:

    # should have devsecops role 
    - name: pep-eiap-buildagent
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-eiap-devsecops-rb

  role_bindings:

    # developer role
    - name: pep-eiap-developer-rb
      subjects:
        - "{{ k8s_sup_subjects['global_devsecops'] }}"
        - "{{ k8s_sup_subjects['eiap_infra_sp'] }}"
        - "{{ k8s_sup_subjects['global_devsecops_sp'] }}"

    # appsupport role
    - name: pep-eiap-appsupport-rb
      subjects:
        - "{{ k8s_sup_subjects['sowola01'] }}"
        - "{{ k8s_sup_subjects['hgurram5'] }}"
        - "{{ k8s_sup_subjects['amele123'] }}"
        - "{{ k8s_sup_subjects['pnaduvat'] }}"
        - "{{ k8s_sup_subjects['psaxena12'] }}"

  # registry secrets
  registry_secrets:

    - secret_name: "{{ _global_devsecops_spn_name }}"
      registries: 
        - pepeiapnonprodcommonacr.azurecr.io

  # generic secrets

  generic_secrets:
    - secret_name: "{{ _global_devsecops_spn_name }}"
      # Any contents apart from what is in secret        
