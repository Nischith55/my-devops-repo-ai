---
ns_pep_eiap_cgf_labelright_qa:
  
  name: pep-eiap-cgf-labelright-qa
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: cgf-labelright
    sector: cgf
    project: labelright
    istio.io/rev: nonprod-stable
    environment: nonprod
    env-qa: "true"

  service_accounts:
    - name: pep-eiap-cgf-labelright-qa-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-eiap-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-eiap-developer-rb
      subjects:
        - "{{ k8s_sup_subjects['cgf_labelright'] }}"
      roleref:
        "{{ k8s_role_ref['developer_rb'] }}"
