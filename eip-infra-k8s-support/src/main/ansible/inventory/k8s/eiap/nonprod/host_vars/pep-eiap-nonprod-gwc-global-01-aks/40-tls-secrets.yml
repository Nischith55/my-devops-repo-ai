---
# ##
# This single file consolidates all the TLS secrets for this particular hosts
# and also set's the secret names for interested namespaces
# ##

# gw01: TLS Secret
pep_eiap_gwc_global_01_aks_gw01_tls_secret: |-
  {{ gw01_tls_ini_lookup_data }}

# gw02: TLS Secret
pep_eiap_gwc_global_01_aks_gw02_tls_secret: |-
  {{ gw02_tls_ini_lookup_data }}


# ##
# Add the secret names to interested namespaces
# ##



istio_tls_secrets_names:
  - secret_name: "{{ pep_eiap_gwc_global_01_aks_gw01_tls_secret['name'] }}"
  - secret_name: "{{ pep_eiap_gwc_global_01_aks_gw02_tls_secret['name'] }}"

# same secrets
kubernetes_dashboard_tls_secrets_names: |-
  {{ istio_tls_secrets_names }}

# add it to global_infra too

global_infra_dev_tls_secrets: |-
  {{ istio_tls_secrets_names }}

# Elastic system too
elastic_tls_secrets_names: "{{ istio_tls_secrets_names }}"
