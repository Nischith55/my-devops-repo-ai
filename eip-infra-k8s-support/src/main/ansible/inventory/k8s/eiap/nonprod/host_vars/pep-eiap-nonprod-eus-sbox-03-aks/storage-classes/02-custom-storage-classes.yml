---
# ##
# Custom Storage classes for this host. Note we use lookup plugin
# NOTES:
#  - Made it copy and paste safe as we removed allowedTopologies
# ##

# ##
# storage_classes_ovrd
# ##

storage_classes_ovrd: |-
  {{ q('storage_class', 'create', sc_params=__custom_storage_class_params__) }}

# ##
# All Generator Params
# ##

__common_disk_params: &dsk001
  kind: Managed
  resourceGroup: "{{ _rg_storage }}"

__common_file_params: &file001
  resourceGroup: "{{ _rg_storage }}"
  storageAccount: "{{ _storage_acct }}"


__custom_storage_class_params__:

  # #######################################################
  #  All Azure File provisioner (smb)
  # #######################################################

  #managed-ultrassd
  managed-ultra:
    type: disk
    reclaimPolicy: "{{ sc_aks_managed_premium_reclaim_policy | default('Retain') }}"
    allowVolumeExpansion: |-
      {{ allow_vol_expansion | default('True') | bool }}
    volumeBindingMode: |-
      {{ vol_binding_mode | default('WaitForFirstConsumer') }}
    parameters:
      <<: *dsk001
      zoned: "false"
      storageaccounttype: UltraSSD_LRS

  #managed-stdssd
  managed-stdssd:
    type: disk
    reclaimPolicy: "{{ sc_aks_managed_premium_reclaim_policy | default('Retain') }}"
    allowVolumeExpansion: |-
      {{ allow_vol_expansion | default('True') | bool }}
    volumeBindingMode: |-
      {{ vol_binding_mode | default('WaitForFirstConsumer') }}
    parameters:
      <<: *dsk001
      zoned: "false"
      storageaccounttype: StandardSSD_LRS

  #managed-stdssd-zoned
  managed-stdssd-zoned:
    type: disk
    reclaimPolicy: "{{ sc_aks_managed_premium_reclaim_policy | default('Retain') }}"
    allowVolumeExpansion: |-
      {{ allow_vol_expansion | default('True') | bool }}
    volumeBindingMode: |-
      {{ vol_binding_mode | default('WaitForFirstConsumer') }}
    parameters:
      <<: *dsk001
      zoned: "true"
      storageaccounttype: StandardSSD_LRS
      fsType: xfs

  #elastic-stdssd-zone [IMPORTANT: reclaim policy Delete]
  elastic-stdssd-zoned:
    type: disk
    reclaimPolicy: Delete
    allowVolumeExpansion: |-
      {{ allow_vol_expansion | default('True') | bool }}
    volumeBindingMode: |-
      {{ vol_binding_mode | default('WaitForFirstConsumer') }}
    parameters:
      <<: *dsk001
      zoned: "true"
      storageaccounttype: StandardSSD_LRS
      fsType: xfs

  #managed-premium-zoned
  managed-premium-zoned:
    type: disk
    reclaimPolicy: "{{ sc_aks_managed_premium_reclaim_policy | default('Retain') }}"
    allowVolumeExpansion: |-
      {{ allow_vol_expansion | default('True') | bool }}
    volumeBindingMode: |-
      {{ vol_binding_mode | default('WaitForFirstConsumer') }}
    parameters:
      <<: *dsk001
      zoned: "true"
      storageaccounttype: Premium_LRS
      fsType: xfs

  # #######################################################
  #  All Azure File provisioner (smb)
  # #######################################################

  #azurefile-stdssd (NOTE: file the params is skuName)
  azurefile-stdssd:
    type: file
    reclaimPolicy: "{{ sc_aks_managed_premium_reclaim_policy | default('Retain') }}"
    allowVolumeExpansion: |-
      {{ allow_vol_expansion | default('True') | bool }}
    volumeBindingMode: |-
      {{ vol_binding_mode | default('WaitForFirstConsumer') }}
    mountOptions: "{{ _sc_az_file_mnt_options }}"
    parameters:
      <<: *file001
      skuName: StandardSSD_LRS

