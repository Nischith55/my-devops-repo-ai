---
ns_pep_eiap_latam_pickabox_dev:
  
  name: pep-eiap-latam-pickabox-dev
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: latam-pickabox
    sector: latam
    project: pickabox
    crosscharge_aks: crosscharge
    istio-injection: enabled
    servicename_aks: pickaboxmobilepickinglatamprod
    pep-cmdb-app-service-id: "c884e79fdbbd3c14e052760a68961974"
    pep-cmdb-bus-app-id: "5ace887ddb3e8c10c2b5f3813996196d"
    pep-environment: "Development"
    istio.io/rev: nonprod-stable
    environment: nonprod
    env-dev: "true"

  service_accounts:
    - name: pep-eiap-latam-pickabox-dev-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-eiap-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-eiap-developer-rb
      subjects:
        - "{{ k8s_sup_subjects['latam_pickabox'] }}"
      roleref:
        "{{ k8s_role_ref['developer_rb'] }}"
  secrets: 
    name: pep-eiap-latam-pickabox-dev-sa-token
    namespace: pep-eiap-latam-pickabox-dev
    annotations:
      kubernetes.io/service-account.name : "pep-eiap-latam-pickabox-dev-sa"
