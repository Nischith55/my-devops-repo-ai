---
# ##
# IMPORTANT:
#  Variable Name Convention:
#   - Always start with 'ns_'
#   - replace '-' with '_' in the namespace name
# ##

# Namespace GLOBAL GAIA
# IMPORTANT:
#  - change environment and add or remove flag env-{dev, qa etc}

ns_pep_eiap_global_gaia_dev:

  name: pep-eiap-global-gaia-dev

  # ALL label values MUST be string, quote native yaml types
  labels:
    team: global-gaia
    sector: global
    project: gaia
    istio.io/rev: nonprod-stable
    environment: nonprod
    env-dev: "true"

  role_bindings:

    # developer role
    - name: pep-eiap-developer-rb
      subjects:
        - "{{ k8s_sup_subjects['global_gaia'] }}"
        - "{{ k8s_sup_subjects['global_gaia_sp'] }}"
        
  # registry secrets
  registry_secrets:

    - secret_name: "{{ _global_gaia_spn_name }}"
      registries: 
        - pepeiapnonprodglobalgaiaacr.azurecr.io

  # generic secrets

  generic_secrets:
    - secret_name: "{{ _global_gaia_spn_name }}"
      # Any contents apart from what is in secret        
