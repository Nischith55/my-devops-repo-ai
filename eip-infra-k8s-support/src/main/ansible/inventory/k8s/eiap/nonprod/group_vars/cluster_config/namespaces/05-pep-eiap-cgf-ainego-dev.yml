---
ns_pep_eiap_cgf_ainego_dev:
  
  name: pep-eiap-cgf-ainego-dev
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: cgf-ainego
    sector: cgf
    project: ainego
    crosscharge_aks: direct
    istio-injection: enabled
    servicename_aks: daipepgenx
    pep-cmdb-app-service-id: "841e42b8c3ba46d8b7498535990131f7"
    pep-cmdb-bus-app-id: "7f0e42b8c3ba46d8b74985359901310f"
    pep-environment: "Development"
    istio.io/rev: nonprod-stable
    environment: nonprod
    env-dev: "true"

  service_accounts:
    - name: pep-eiap-cgf-ainego-dev-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-eiap-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-eiap-developer-rb
      subjects:
        - "{{ k8s_sup_subjects['cgf_ainego'] }}"
      roleref:
        "{{ k8s_role_ref['developer_rb'] }}"
  secrets: 
    name: pep-eiap-cgf-ainego-dev-sa-token
    namespace: pep-eiap-cgf-ainego-dev
    annotations:
      kubernetes.io/service-account.name : "pep-eiap-cgf-ainego-dev-sa"
