---
ns_pep_eiap_cgf_pepvigil_dev:
  
  name: pep-eiap-cgf-pepvigil-dev
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: cgf-pepvigil
    sector: cgf
    project: pepvigil
    crosscharge_aks: direct
    istio-injection: enabled
    servicename_aks: engineeringexcellencedlopsnon-prod
    pep-cmdb-app-service-id: "9995ea95836fb19050ed47747daad31a"
    pep-cmdb-bus-app-id: "327967b31be36010b050c992604bcbc8"
    pep-environment: "Development"
    istio.io/rev: nonprod-stable
    environment: nonprod
    env-dev: "true"

  service_accounts:
    - name: pep-eiap-cgf-pepvigil-dev-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-eiap-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-eiap-developer-rb
      subjects:
        - "{{ k8s_sup_subjects['cgf_pepvigil'] }}"
      roleref:
        "{{ k8s_role_ref['developer_rb'] }}"
  secrets: 
    name: pep-eiap-cgf-pepvigil-dev-sa-token
    namespace: pep-eiap-cgf-pepvigil-dev
    annotations:
      kubernetes.io/service-account.name : "pep-eiap-cgf-pepvigil-dev-sa"
