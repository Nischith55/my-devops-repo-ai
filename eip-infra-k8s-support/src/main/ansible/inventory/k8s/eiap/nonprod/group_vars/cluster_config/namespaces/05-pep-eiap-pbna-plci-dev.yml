#  - change environment and add or remove flag env-{dev, qa etc}

ns_pep_eiap_pbna_plci_dev:
  
  name: pep-eiap-pbna-plci-dev

  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: pbna-plci
    sector: pbna
    project: plci
    istio.io/rev: nonprod-stable
    environment: nonprod
    env-dev: "true"

  role_bindings:

    # developer role
    - name: pep-eiap-developer-rb
      subjects:
        - "{{ k8s_sup_subjects['pbna_plci'] }}"
    

