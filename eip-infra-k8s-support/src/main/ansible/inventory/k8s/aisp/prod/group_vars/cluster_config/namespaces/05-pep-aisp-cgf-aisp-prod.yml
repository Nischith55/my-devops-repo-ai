---
ns_pep_aisp_cgf_aisp_prod:
  
  name: pep-aisp-cgf-aisp-prod
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: cgf-aisp
    sector: cgf
    project: aisp
    crosscharge_aks: crosscharge
    istio-injection: enabled
    servicename_aks: engineeringexcellencepepgenx
    pep-cmdb-app-service-id: "167ca5de831bf1d07a58f9447daad331"
    pep-cmdb-bus-app-id: "327967b31be36010b050c992604bcbc8"
    pep-environment: "Production"
    istio.io/rev: prod-stable
    environment: prod
    env-prod: "true"

  service_accounts:
    - name: pep-aisp-cgf-aisp-prod-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-aisp-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-aisp-appsupport-rb
      subjects:
        - "{{ k8s_sup_subjects['cgf_aisp'] }}"
      roleref:
         "{{ k8s_role_ref['appsupprt_rb'] }}"
  secrets: 
    name: pep-aisp-cgf-aisp-prod-sa-token
    namespace: pep-aisp-cgf-aisp-prod
    annotations:
      kubernetes.io/service-account.name : "pep-aisp-cgf-aisp-prod-sa"
