---
ns_pep_infratools_cgf_appdynamic_dev:
  
  name: pep-infratools-cgf-appdynamic-dev
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: cgf-appdynamic
    sector: cgf
    project: appdynamic
    crosscharge_aks: crosscharge
    istio-injection: enabled
    servicename_aks: appdynamicsnon-prod
    istio.io/rev: nonprod-stable
    environment: nonprod
    env-dev: "true"

  service_accounts:
    - name: pep-infratools-cgf-appdynamic-dev-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-infratools-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-infratools-developer-rb
      subjects:
        - "{{ k8s_sup_subjects['cgf_appdynamic'] }}"
      roleref:
        "{{ k8s_role_ref['developer_rb'] }}"
  secrets: 
    name: pep-infratools-cgf-appdynamic-dev-sa-token
    namespace: pep-infratools-cgf-appdynamic-dev
    annotations:
      kubernetes.io/service-account.name : "pep-infratools-cgf-appdynamic-dev-sa"
