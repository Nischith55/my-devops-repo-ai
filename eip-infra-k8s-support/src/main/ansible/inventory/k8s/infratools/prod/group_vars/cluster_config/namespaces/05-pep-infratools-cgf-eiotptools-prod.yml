---
ns_pep_infratools_cgf_eiotptools_prod:
  
  name: pep-infratools-cgf-eiotptools-prod
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: cgf-eiotptools
    sector: cgf
    project: eiotptools
    crosscharge_aks: crosscharge
    istio-injection: enabled
    servicename_aks: pepsenseplatformprod
    pep-cmdb-app-service-id: "8bf83e8c1ba5fb8864eb8597dc4bcb4b"
    pep-cmdb-bus-app-id: "dfbe083ddb3e8c10c2b5f38139961991"
    pep-environment: "Production"
    istio.io/rev: prod-stable
    environment: prod
    env-prod: "true"

  service_accounts:
    - name: pep-infratools-cgf-eiotptools-prod-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-infratools-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-infratools-appsupport-rb
      subjects:
        - "{{ k8s_sup_subjects['cgf_eiotptools'] }}"
      roleref:
         "{{ k8s_role_ref['appsupprt_rb'] }}"
  secrets: 
    name: pep-infratools-cgf-eiotptools-prod-sa-token
    namespace: pep-infratools-cgf-eiotptools-prod
    annotations:
      kubernetes.io/service-account.name : "pep-infratools-cgf-eiotptools-prod-sa"
