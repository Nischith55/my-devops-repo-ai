---
ns_pep_infratools_cgf_swaggerhub_prod:
  
  name: pep-infratools-cgf-swaggerhub-prod
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: cgf-swaggerhub
    sector: cgf
    project: swaggerhub
    istio-injection: enabled
    istio.io/rev: prod-stable
    environment: prod
    env-prod: "true"

  service_accounts:
    - name: pep-infratools-cgf-swaggerhub-prod-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-infratools-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-infratools-appsupport-rb
      subjects:
        - "{{ k8s_sup_subjects['cgf_swaggerhub'] }}"
      roleref:
         "{{ k8s_role_ref['appsupprt_rb'] }}"
  secrets: 
    name: pep-infratools-cgf-swaggerhub-prod-sa-token
    namespace: pep-infratools-cgf-swaggerhub-prod
    annotations:
      kubernetes.io/service-account.name : "pep-infratools-cgf-swaggerhub-prod-sa"
