---
ns_pep_infratools_cgf_appdynamic_prod:
  
  name: pep-infratools-cgf-appdynamic-prod
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: cgf-appdynamic
    sector: cgf
    project: appdynamic
    crosscharge_aks: crosscharge
    istio-injection: enabled
    servicename_aks: appdynamicsprod
    pep-cmdb-app-service-id: "7238e976dbdcaf4441c60252ba961924"
    pep-cmdb-bus-app-id: "9caec8b9db3e8c10c2b5f38139961947"
    pep-environment: "Production"
    istio.io/rev: prod-stable
    environment: prod
    env-prod: "true"

  service_accounts:
    - name: pep-infratools-cgf-appdynamic-prod-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-infratools-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-infratools-appsupport-rb
      subjects:
        - "{{ k8s_sup_subjects['cgf_appdynamic'] }}"
      roleref:
         "{{ k8s_role_ref['appsupprt_rb'] }}"
  secrets: 
    name: pep-infratools-cgf-appdynamic-prod-sa-token
    namespace: pep-infratools-cgf-appdynamic-prod
    annotations:
      kubernetes.io/service-account.name : "pep-infratools-cgf-appdynamic-prod-sa"
