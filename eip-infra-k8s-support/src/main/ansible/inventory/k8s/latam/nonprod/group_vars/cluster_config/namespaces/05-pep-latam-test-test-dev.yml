---
ns_pep_latam_test_test_dev:
  
  name: pep-latam-test-test-dev
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: test-test
    sector: test
    project: test
    istio-injection: enabled
    istio.io/rev: nonprod-stable
    environment: nonprod
    env-dev: "true"

  service_accounts:
    - name: pep-latam-test-test-dev-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-latam-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-latam-developer-rb
      subjects:
        - "{{ k8s_sup_subjects['test_test'] }}"
      roleref:
        "{{ k8s_role_ref['developer_rb'] }}"
  secrets: 
    name: pep-latam-test-test-dev-sa-token
    namespace: pep-latam-test-test-dev
    annotations:
      kubernetes.io/service-account.name : "pep-latam-test-test-dev-sa"
