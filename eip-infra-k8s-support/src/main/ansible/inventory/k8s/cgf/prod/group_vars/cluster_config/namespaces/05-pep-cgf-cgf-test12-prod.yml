---
ns_pep_cgf_cgf_test12_prod:
  
  name: pep-cgf-cgf-test12-prod
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: cgf-test12
    sector: cgf
    project: test12
    crosscharge_aks: direct
    istio-injection: enabled
    servicename_aks: supplychainhub
    pep-cmdb-app-service-id: "1f4542cc97b52d504bb8326e6253af8b"
    pep-cmdb-bus-app-id: "ba4502cc97b52d504bb8326e6253af48"
    pep-environment: "Production"
    istio.io/rev: prod-stable
    environment: prod
    env-prod: "true"

  service_accounts:
    - name: pep-cgf-cgf-test12-prod-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-cgf-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-cgf-appsupport-rb
      subjects:
        - "{{ k8s_sup_subjects['cgf_test12'] }}"
      roleref:
         "{{ k8s_role_ref['appsupprt_rb'] }}"
  secrets: 
    name: pep-cgf-cgf-test12-prod-sa-token
    namespace: pep-cgf-cgf-test12-prod
    annotations:
      kubernetes.io/service-account.name : "pep-cgf-cgf-test12-prod-sa"
