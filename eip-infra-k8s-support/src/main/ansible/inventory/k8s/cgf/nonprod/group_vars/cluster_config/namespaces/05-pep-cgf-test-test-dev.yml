---
ns_pep_cgf_test_test_dev:
  
  name: pep-cgf-test-test-dev
  
  # ALL LABEL VALUES MUST BE STRINGS
  labels:
    team: test-test
    sector: test
    project: test
    crosscharge_aks: direct
    istio-injection: enabled
    servicename_aks: sch
    pep-cmdb-app-service-id: "1f4542cc97b52d504bb8326e6253af8b"
    pep-cmdb-bus-app-id: "ba4502cc97b52d504bb8326e6253af48"
    pep-environment: "Production"
    istio.io/rev: nonprod-stable
    environment: nonprod
    env-dev: "true"

  service_accounts:
    - name: pep-cgf-test-test-dev-sa
      # should really have 1 role but we give it a list
      role_bindings: 
        # name of the binding 
        - name: pep-cgf-springcloudk8s-rb
          roleref: 
            "{{ k8s_role_ref['springcloudk8s_rb'] }}"

  role_bindings:
    - name: pep-cgf-developer-rb
      subjects:
        - "{{ k8s_sup_subjects['test_test'] }}"
      roleref:
        "{{ k8s_role_ref['developer_rb'] }}"
  secrets: 
    name: pep-cgf-test-test-dev-sa-token
    namespace: pep-cgf-test-test-dev
    annotations:
      kubernetes.io/service-account.name : "pep-cgf-test-test-dev-sa"
