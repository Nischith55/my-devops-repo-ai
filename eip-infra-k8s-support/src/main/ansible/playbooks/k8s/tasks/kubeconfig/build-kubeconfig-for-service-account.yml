---
# ##
# Task to build a kubeconfig for Service account.
# GLOBALS:
#   target_dir: for default directory where to dump the final kubeconfig file.
# INPUTS:
#   params_kcfg_sa:
#     sa_name: (required) service account name
#     sa_namespace: (required) service account namespace
#     kube_context: (required) the kubernetes context to operate with
#     context_name: (optional) context name to give in the generated kubeconfig
#     kube_config_file: (optional) a specific kubeconfig file to lookup cluster
#                       information.
# ##

- name: BUILD_KUBECONFIG_FOR_SERVICE_ACCOUNT_BLOCK
  block:

    - name: GET_SA_TOKEN_INC_TASK
      include_tasks:
        file: tasks/cluster-config/get-service-account-token.yml
      vars:
        params_sa_token:
          name: "{{ __sa_name }}"
          namespace: "{{ __sa_namespace }}"
          kube_context: "{{ __kube_context }}"

    # NOTE: kcfg_out is the output from this command
    - name: GET_KUBECONFIG_CURRENT_CONTEXT_INC_TASK
      include_tasks:
        file: tasks/kubeconfig/get-config-for-context-from-kubeconfig.yml
      vars:
        # NOTE: kcfg_out is the output from the command
        params_kcfg:
          kube_context: "{{ __kube_context }}"
          kube_config: "{{ __kube_config }}"

    - name: CREATE_KUBE_CONFIG
      template:
        src: templates/kubeconfig/kubeconfig.yml.j2
        dest: "{{ __kcfg_output_file }}"
      vars:
        # we did a minify -- only 1 entry should be there and kcfg_out
        __cluster_info: "{{ kcfg_out['clusters'] | first }}"
        __unique_name: "{{ sa_name + '_' + __cluster_info['name'] }}"
        __kcfg_output_file: |-
          {{
            params_kcfg_sa['kcfg_output_file']
            |
            default((target_dir, __unique_name + '.kcfg') | path_join)
          }}
        params_tmpl:
          # copy the cluster info verbatim.
          cluster_info: "{{ __cluster_info }}"
          user:
            name: "{{ __unique_name }}"
            creds:
              token: "{{ sa_token }}"
          # For service account let's give context name same as user name
          context:
            name: |-
              {{ params_kcfg_sa['context_name'] | default(__unique_name) }}
  vars:
    __sa_name: "{{ params_kcfg_sa['sa_name'] }}"
    __sa_namespace: "{{ params_kcfg_sa['sa_namespace'] }}"
    __kube_context: "{{ params_kcfg_sa['kube_context'] }}"
    __kube_config: "{{ params_kcfg_sa['kube_config_file'] | default('') }}"
