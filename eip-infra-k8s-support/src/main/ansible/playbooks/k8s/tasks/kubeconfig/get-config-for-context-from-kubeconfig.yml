---
# ##
# Tasks to extract the Kubeconfig for a given context
#
# IMPORTANT:
#   - Follow the convention of 2 underscores for internal params if
#     2 levels deep
# 
# INPUTS:
#   params_kcfg:
#     kube_context: context to extract
#     kube_config: kube config file for lookup
#
# OUTPUTS:
#   kcfg_out: 
# ##

- name: GET_CONFIG_FOR_CONTEXT_FROM_KUBECONFIG_BLOCK
  block:

    - name: GET_CONFIG_FOR_CONTEXT_FROM_KUBECONFIG_PRINT_PARAMS
      debug:
        msg: |
          params_kcfg:
            {{ params_kcfg | to_nice_yaml }}

      # default mute
      when: >-
        (print_params | default('false') | bool)

    - name: GET_CONFIG_FOR_CONTEXT_FROM_KUBECONFIG
      include_role: 
        name: k8s_support/kubectl
        tasks_from: execute
      vars:
        # mute: output
        print_resp: false
        kube_context: "{{ __kube_context }}"
        kctl_options: "{{ __kctl_options }}"
        kube_config: "{{ __kube_config }}"
        kctl_action: config
        kctl_action_args: " view --raw --minify=true -o yaml"

    - name: GET_CONFIG_FOR_CONTEXT_FROM_KUBECONFIG_SET_RESULT
      set_fact:
        kcfg_out: "{{ kctl_exec_result.stdout | from_yaml }}"

  vars:
    __kube_context: "{{ params_kcfg['kube_context'] }}"
    __kctl_options: "{{ params_kcfg['kctl_options'] | default('') }}"
    __kube_config: "{{ params_kcfg['kube_config'] | default('') }}"
