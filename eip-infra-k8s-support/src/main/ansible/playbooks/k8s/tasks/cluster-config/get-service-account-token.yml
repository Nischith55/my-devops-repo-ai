---
# ##
# Task to extract service account token for a service account.
# INPUTS:
#   params_sa_token:
#     sa_name:
#     sa_namespace:
# OUTPUTS:
#   sa_token_name:
#   sa_token:
# ##

- name: GET_SERVICE_ACCOUNT_TOKEN_BLOCK
  block:

    # Step 1) 
    - name: |
        GET_TOKEN_NAME {{ __sa_name }}
      include_role: 
        name: k8s_support/kubectl
        tasks_from: execute
      vars:
        # mute: output
        print_resp: false
        kube_context: "{{ __kube_context }}"
        kctl_action: get
        kctl_action_args: " serviceaccount -n {{ __sa_namespace }} -o yaml"

    - name: |
        SET_SA_TOKEN_NAME {{ __sa_name }} | {{ __sa_namespace }}
      set_fact:
        sa_token_name: |-
          {{ 
              (kctl_exec_result.stdout | from_yaml)['items'] 
              | extract_secret_token_name(sa_name)
          }}

    - name: |
        GET_SERVICE_ACCOUNT_TOKEN {{ sa_token_name }}
      include_role: 
        name: k8s_support/kubectl
        tasks_from: execute
      vars:
        # mute: output
        print_resp: false
        kube_context: "{{ __kube_context }}"
        kctl_action: get
        kctl_action_args: " secret {{ sa_token_name }} -n {{ __sa_namespace }} -o yaml"

    - name: SET_SA_TOKEN
      set_fact:
        sa_token: |-
          {{ 
              (kctl_exec_result.stdout | from_yaml)['data']['token'] 
              | b64decode
          }}

  vars:
    __sa_name: "{{ params_sa_token['name'] }}"
    __sa_namespace: "{{ params_sa_token['namespace'] }}"
    __kube_context: "{{ params_sa_token['kube_context'] }}"