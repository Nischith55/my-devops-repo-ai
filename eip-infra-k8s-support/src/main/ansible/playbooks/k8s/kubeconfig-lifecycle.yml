---
# ##
# - The intent of this playbook is to generate kubeconfig for Service Account
#   or any other user config.
# - IMPORTANT: This relies on *existing* kubeconfig with the context available
#   to copy cluster and other info.
# ##
- name: PLAY_KUBECONFIG_GENERATOR
  # cluster name
  hosts: "{{ target }}"
  gather_facts: false
  serial: 1

  vars:
    cluster_name: "{{ inventory_hostname }}"
    kube_context_name: "{{ cluster_name }}"

  tasks:

    - name: BUILD_KUBECONFIG_FOR_SERVICE_ACCOUNT_BLOCK
      block:

        - name: BUILD_KUBECONFIG_FOR_SERVICE_ACCOUNT_INC_TASK
          include_tasks:
            file: tasks/kubeconfig/build-kubeconfig-for-service-account.yml
          vars:
            params_kcfg_sa:
              sa_name: "{{ sa_name }}"
              sa_namespace: "{{ sa_namespace }}"
              kube_context: "{{ kube_context_name }}"
              kube_config_file: |-
                {{ kubeconfig | default('') }}
      vars:
        # CLI #
        # sa_name: required
        sa_params: |-
          {{ service_accounts | search_list(key='name', value=sa_name)}}
        sa_namespace: "{{ sa_params['namespace'] }}"
      when: >-
        ("sa_kubeconfig_build" in (run_task | default("")).split())