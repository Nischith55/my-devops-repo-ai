---
- name: Create Secret
  hosts: localhost 
  connection: local
  collections:
    - kubernetes.core
  environment:
    K8S_AUTH_KUBECONFIG: ~/.kube/config
    K8S_AUTH_CONTEXT: "{{ vars['cluster_name'] }}"
    K8S_AUTH_USERNAME: "{{ lookup('env', 'AAD_SERVICE_PRINCIPAL_CLIENT_ID') }}"
    K8S_AUTH_PASSWORD: "{{ lookup('env', 'AAD_SERVICE_PRINCIPAL_CLIENT_SECRET') }}"
  vars:
    script_dir: "{{ lookup('env', 'script_dir') }}"
  tasks: 
    - name: set variable
      set_fact:
        cluster_name: "{{ vars['cluster_name'] }}"
        namespace: "{{ vars['namespace'] }}"
        secret_name: "{{ vars['secret_name'] }}"
        operation: "{{ vars['operation'] }}"

    - name: Create Secret 
      block:
        - name: Get an existing Secret object
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Secret
            name: "{{ secret_name }}"
            namespace: "{{ namespace }}"
          register: secret_check

        - debug:
            msg: "There is a secret with the name {{ secret_name }} in the namespace {{ namespace }}."
          when: secret_check.resources | length > 0

        - name: Copy manifest file 
          copy:
            src: "{{ script_dir }}/drop/secrets_general.yml"
            dest: /tmp/secrets_general.yml
          when: secret_check.resources | length == 0

        - name: Create the secret by reading the definition from a local file
          kubernetes.core.k8s:
            state: present
            src: /tmp/secrets_general.yml
          when: secret_check.resources | length == 0

      when: operation == "create"
    
    - name: Update Secret 
      block: 
        - debug:
            msg: "this is inside update block"
        
        - name: Get an existing Secret object
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Secret
            name: "{{ secret_name }}"
            namespace: "{{ namespace }}"
          register: secret_check
        
        - debug:
            msg: "There is no secret {{ secret_name }} in the namespace {{ namespace }}. Please re-run this with create operataion."
          when: secret_check.resources | length ==0

        - name: copy the existing secret object 
          copy:
            content: "{{ secret_check.resources }}"
            dest: "{{ script_dir }}/{{ secret_name }}_bkp.yml"
          when: secret_check.resources | length > 0
        
        - name: Delete the existing Secret
          kubernetes.core.k8s:
            state: absent
            api_version: v1
            kind: Secret
            name: "{{ secret_name }}"
            namespace: "{{ namespace }}"
          when: secret_check.resources | length > 0
          register: delete_status
          
        - name: Copy manifest file 
          copy:
            src: "{{ script_dir }}/drop/secrets_general.yml"
            dest: /tmp/secrets_general.yml
          when: delete_status.result.status == "Success"

        - name: Create the secret again with new data 
          kubernetes.core.k8s:
            state: present
            src: /tmp/secrets_general.yml
          when: delete_status.result.status == "Success" 

      when: operation == "update"