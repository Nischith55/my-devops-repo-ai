- name: set namespace fact 
  set_fact:
    namespace: "{{ item.namespace | trim | lower }}"
    pep_cmdb_bus_app_id: "{{ item.pep_cmdb_bus_app_id | trim | lower }}"
    pep_cmdb_app_service_id: "{{ item.pep_cmdb_app_service_id | trim | lower }}"
    pep_environment: "{{ item.pep_environment | trim }}"

