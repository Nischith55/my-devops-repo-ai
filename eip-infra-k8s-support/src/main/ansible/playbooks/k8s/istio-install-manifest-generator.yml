---
# #
# Playbook to generate various istio installtion manifests, like operator and
# control plane, gateway stubs. NOTE: this is NOT istio configuration or
# management. generally this will be used 1 time and should be host or 
# cluster agnostic.
# #

- name: PLAY_ISTIO_INSTALL_GENERATOR
  # cluster_name TODO really should be agnostic.
  hosts: localhost
  gather_facts: false
  serial: 1

  vars:
    task_list: "{{ (run_task | default('')).split() }}"

  tasks:

    # special handling for istio-operator
    - name: GENERATE_ISTIO_OPERATOR_BASE_MANIFEST_BLOCK
      block:

        - name: GENERATE_ISTIO_OP_INCLUDE_VARS {{ _iop_vars_dir }}
          include_vars:
            dir: vars/istio/operator
            depth: 1
            ignore_unknown_extensions: yes

        - name: GENERATE_ISTIO_OPERATOR_BASE_FILES
          include_tasks:
            file: tasks/istio/generate-operator-manifest.yml
          vars:
            params_istio_op:
              kube_context: "{{ kube_context_name | default('localhost') }}"
              iop_params: "{{ istio_operator_generator_params }}"
      vars:
        _iop_vars_dir: vars/istio/operator
      when: ('gen_base_iop' in task_list)

