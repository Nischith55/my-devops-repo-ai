---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pep-eiap-servicenow-clusterrole
rules:
  - apiGroups:
      -  ""
      - apps
      - autoscaling
      - extensions
      - batch
    resources:
      - endpoints
      - deployments
      - jobs
      - cronjobs
      - namespaces
      - nodes
      - pods
      - replicasets
      - services
      - statefulsets
    verbs:
      - get
      - list
      - watch
