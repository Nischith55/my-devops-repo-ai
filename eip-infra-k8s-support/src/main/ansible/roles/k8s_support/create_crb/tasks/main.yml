---
- name: creates temp directory crb
  ansible.builtin.file:
    path: "{{ source_directory }}/src/main/ansible/playbooks/k8s/aks-post-provisioning/tempforcrb"
    state: directory

- template:
    src: clusterrolebindings.j2 # The Jinja2 template file
    dest: "{{ source_directory }}/src/main/ansible/playbooks/k8s/aks-post-provisioning/tempforcrb/{{ clusterrolebinding[item] }}.yml"
  register: crb_ref
  with_items: "{{ clusterrolebinding }}"

- debug:
    var: file_content
  vars:
    file_content: "{{ lookup('file', '{{ source_directory }}/src/main/ansible/playbooks/k8s/aks-post-provisioning/tempforcrb/{{ clusterrolebinding[item] }}.yml') }}"
  with_items: "{{ clusterrolebinding }}"
   

- name: Create CRBs by reading the definition from a local file
  kubernetes.core.k8s:
    state: present
    src: "{{ source_directory }}/src/main/ansible/playbooks/k8s/aks-post-provisioning/tempforcrb/{{ clusterrolebinding[item] }}.yml"
  register: crb
  with_items: "{{ clusterrolebinding }}"
  environment: 
    K8S_AUTH_KUBECONFIG: ~/.kube/config
    K8S_AUTH_CONTEXT: "{{ resourcename }}"


- name: Copy files folders
  copy:
    dest: "/azp/agent/_work/1/s/src/tmp1/src/main/k8s/deployments/{{ functionalarea }}/{{ env }}/{{ resourcename }}/cluster-config/cluster-role-bindings"
    src: "{{ source_directory }}/src/main/ansible/playbooks/k8s/aks-post-provisioning/tempforcrb/"
    force: true
  with_items: "{{ clusterrolebinding }}"

- name: Add output directory to git
  lvrfrc87.git_acp.git_acp:
    path: "/azp/agent/_work/1/s/src/tmp1"
    branch: "{{ gitbranch }}"
    comment: "Add manifest."
    add: [ "." ]
    url: "https://{{ svcuser | urlencode }}:{{ pat | urlencode }}@dev.azure.com/PepsiCoIT/EIP-Infrastructure/_git/eip-infra-k8s-support"
    push: true
    #pull: true
  environment:
    GIT_AUTHOR_NAME: "{{ svcuser }}"
    GIT_AUTHOR_EMAIL: "{{ svcuser }}:{{ pat }}@dev.azure.com"
    GIT_COMMITTER_NAME: "{{ svcuser }}"
    GIT_COMMITTER_EMAIL: "{{ svcuser }}:{{ pat }}@dev.azure.com"
  register: gitadd

- name: git cat add
  shell: |
    echo "present working directory"
    pwd
    git branch
    echo "directory contents"
    ls -a
    git log -4
    echo "git status shown below"
    git status
  args: 
    chdir: /azp/agent/_work/1/s/src/tmp1/src
  register: gitcat1
