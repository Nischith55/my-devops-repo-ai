---
- name: create temp directory aksinit
  ansible.builtin.file:
    path: "{{ source_directory }}/src/main/ansible/playbooks/k8s/aks-post-provisioning/aksinit"
    state: directory

- name: create temp directory aksinit secret
  ansible.builtin.file:
    path: "{{ source_directory }}/src/main/ansible/playbooks/k8s/aks-post-provisioning/aksinitsecret"
    state: directory

- template:
    src: aks-init-secret.j2 # The Jinja2 template file
    dest: "{{ source_directory }}/src/main/ansible/playbooks/k8s/aks-post-provisioning/aksinitsecret/aks-init-secret.yml"

- name: Create aks init secret 
  kubernetes.core.k8s:
    state: present
    src: "{{ source_directory }}/src/main/ansible/playbooks/k8s/aks-post-provisioning/aksinitsecret/aks-init-secret.yml"
  register: init3
  no_log: true
  environment: 
    K8S_AUTH_KUBECONFIG: ~/.kube/config
    K8S_AUTH_CONTEXT: "{{ resourcename }}"

- template:
    src: aks-init-configs.j2 # The Jinja2 template file
    dest: "{{ source_directory }}/src/main/ansible/playbooks/k8s/aks-post-provisioning/aksinit/{{ prefix }}-aks-init-2.0.0.yml"

- name: Create aks init by reading the definition from a local file
  kubernetes.core.k8s:
    state: present
    src: "{{ source_directory }}/src/main/ansible/playbooks/k8s/aks-post-provisioning/aksinit/{{ prefix }}-aks-init-2.0.0.yml"
  no_log: true
  register: init2
  environment: 
    K8S_AUTH_KUBECONFIG: ~/.kube/config
    K8S_AUTH_CONTEXT: "{{ resourcename }}"

- name: Copy files to repo
  copy:
    dest: "/azp/agent/_work/1/s/src/tmp1/src/main/k8s/deployments/{{ functionalarea }}/{{ env }}/{{ resourcename }}/apps/{{ prefix }}-aks-init/{{ prefix }}-ops-admin/2.0.0/manifests/"
    src: "{{ source_directory }}/src/main/ansible/playbooks/k8s/aks-post-provisioning/aksinit/{{ prefix }}-aks-init-2.0.0.yml"
    force: true

- name: Add output directory to git
  lvrfrc87.git_acp.git_acp:
    path: "/azp/agent/_work/1/s/src/tmp1"
    branch: "{{ gitbranch }}"
    comment: "Add manifest."
    add: [ "." ]
    url: "https://{{ svcuser | urlencode }}:{{ pat | urlencode }}@dev.azure.com/PepsiCoIT/EIP-Infrastructure/_git/eip-infra-k8s-support"
    push: true
    pull: true
  environment:
    GIT_AUTHOR_NAME: "{{ svcuser }}"
    GIT_AUTHOR_EMAIL: "{{ svcuser }}:{{ pat }}@dev.azure.com"
    GIT_COMMITTER_NAME: "{{ svcuser }}"
    GIT_COMMITTER_EMAIL: "{{ svcuser }}:{{ pat }}@dev.azure.com"
  register: gitadd

- name: git cat add
  shell: |
    echo "present working directory"
    pwd
    git branch
    echo "directory contents"
    ls -a
    git log -4
    echo "git status shown below"
    git status
  args: 
    chdir: /azp/agent/_work/1/s/src/tmp1/src
  register: gitcat1
