- name: Creating directory for uploading files into git repo
  ansible.builtin.file:
    path: "/azp/agent/_work/1/s/src/tmp1/src/main/k8s/deployments/{{ functionalarea }}/{{ env }}/{{ resourcename }}/add-ons/opa-gateway/"
    state: directory


- name: Copy files to repo
  copy:
    dest: "/azp/agent/_work/1/s/src/tmp1/src/main/k8s/deployments/{{ functionalarea }}/{{ env }}/{{ resourcename }}/add-ons/opa-gateway/"
    src: "{{ source_directory }}/src/main/ansible/playbooks/k8s/aks-post-provisioning/opa/opa.yaml"
    force: true
  register: copy_opa
  

- name: Copy files to repo
  copy:
    dest: "/azp/agent/_work/1/s/src/tmp1/src/main/k8s/deployments/{{ functionalarea }}/{{ env }}/{{ resourcename }}/add-ons/opa-gateway/"
    src: "{{ source_directory }}/src/main/ansible/playbooks/k8s/aks-post-provisioning/opa-crd/opa-crd.yaml"
    force: true
  register: copy_opa1
