---
- name: create temp directory opa
  ansible.builtin.file:
    path: "{{ source_directory }}/src/main/ansible/playbooks/k8s/aks-post-provisioning/opa"
    state: directory


- name: Add opa chart repo
  kubernetes.core.helm_repository:
    name: rancher-charts
    repo_url: "https://charts.rancher.io"
  environment: 
    K8S_AUTH_KUBECONFIG: /home/neipd999/kubeconfig-admin.kcfg
    K8S_AUTH_CONTEXT: "{{ resourcename }}"

- name: create temp directory for opa-gatekeeper-crd
  ansible.builtin.file:
    path: "{{ source_directory }}/src/main/ansible/playbooks/k8s/aks-post-provisioning/opa-crd"
    state: directory


- template:
    src: values-opa-crd.j2 # The Jinja2 template file
    dest: "{{ source_directory }}/src/main/ansible/playbooks/k8s/aks-post-provisioning/opa-crd/opa-crd.yaml"

- template:
    src: values-opa.j2 # The Jinja2 template file
    dest: "{{ source_directory }}/src/main/ansible/playbooks/k8s/aks-post-provisioning/opa/opa.yaml"


- name: install crd
  command: helm upgrade -install -f opa-crd.yaml rancher-gatekeeper-crd rancher-charts/rancher-gatekeeper-crd --create-namespace -n cattle-gatekeeper-system 
  args: 
    chdir: "{{ source_directory }}/src/main/ansible/playbooks/k8s/aks-post-provisioning/opa-crd"



- name: add_helm_repo
  command: helm upgrade -install -f opa.yaml rancher-gatekeeper rancher-charts/rancher-gatekeeper -n cattle-gatekeeper-system
  args: 
    chdir: "{{ source_directory }}/src/main/ansible/playbooks/k8s/aks-post-provisioning/opa"


