- name: set namespace fact 
  set_fact:
    namespace: "{{ item.metadata.name }}"
    # namespace: "{{ item }}"
- debug:
    msg: "namespace is {{ namespace }}"

### check for namespace gateway status
- name: Get the gateway
  kubernetes.core.k8s_info:
    kind: Gateway 
    api_version: networking.istio.io/v1beta1
    namespace: "{{ namespace }}"
    name: "{{ namespace }}-cv-gw"
  register: gateway_ns

# - debug: var=gateway_ns 

- name: gateway already present  
  block: 
    - name: initialize lists - cmp
      set_fact:
        vs_list: []
        hosts_list: []
        tls_hosts_list: []
        tls_present: false
        common_http_list: []
        custom_http_list: []
        ns_cred_list: {}
        final_custom_https: []
        cust_domain_status: false
        space: "\n"
        cred_fail: false 
    - name: Get list of virtual services - cmp
      kubernetes.core.k8s_info:
        api_version: networking.istio.io/v1beta1
        kind: VirtualService 
        namespace: "{{ namespace }}"
      register: virtualservices_ns
    - name: get ns from vs destination with http - cmp
      set_fact:
        hosts_list: "{{ hosts_list + inner_item.spec.hosts }}"
      with_items: "{{ virtualservices_ns.resources }}"
      when: inner_item.spec.http is defined
      loop_control:
        loop_var: inner_item
    
    - set_fact:
        hosts_list: "{{ hosts_list| unique }}"
    - name: gather credential names - cmp
      set_fact:
        cred_names_ns: "{{ cred_names_ns | default([]) + [{'cred_name': inner_item.tls.credentialName , 'hosts': inner_item.hosts }] }}"
      with_items: 
      - "{{ gateway_ns.resources[0].spec.servers }}"
      when: 
      - inner_item.tls.credentialName is defined
      loop_control:
        loop_var: inner_item
    - name: get common http list - cmp
      set_fact:
        common_http_list: "{{ common_http_list + [ inner_item ] }}"
      when: '"azure.intra.pepsico.com" in inner_item'
      with_items: "{{ hosts_list }}"
      loop_control:
        loop_var: inner_item
    
    - set_fact:
        common_http_list: "{{ common_http_list| unique }}"

    - name: get custom http list - cmp
      set_fact:
        custom_http_list: "{{ custom_http_list + [ inner_item ] }}"
      when: '"azure.intra.pepsico.com" not in inner_item'
      with_items: "{{ hosts_list }}"
      loop_control:
        loop_var: inner_item

    - name: custom domains exist - cmp
      block:
      - name: custom domains status - cmp
        set_fact:
          cust_domain_status: true 
      - name: get cred of custom domain host - cmp
        set_fact:
          ns_cred_list: "{{ ns_cred_list | combine({ inner_item[0] : inner_item[1].cred_name  }) }}"
        with_nested: 
        - "{{ custom_http_list }}"
        - "{{ cred_names_ns }}"
        when: inner_item[0] in inner_item[1].hosts
        loop_control:
          loop_var: inner_item
      - debug: var=ns_cred_list
      
      - name: validate if hosts credentials exists - cmp
        kubernetes.core.k8s_info:
          kind: secret
          namespace: istio-system
          name: "{{ inner_item.value }}"
        with_items: "{{ ns_cred_list | dict2items }}"
        loop_control:
          loop_var: inner_item
        register: cluster_secret_status
        ignore_errors: true
        # failed_when:
        #   - cluster_secret_status.resources is defined
        #   - cluster_secret_status.resources | length == 0
      
      #- debug: var=cluster_secret_status

      - name: check if any secret missing
        debug: 
          msg: "The credential not present {{ inner_item.inner_item.value }} in istio-system namespace. " 
        with_items: "{{ cluster_secret_status.results }}"
        when: inner_item.resources | length == 0
        loop_control:
          loop_var: inner_item
      # - name: debug 
      #   debug: var=cluster_secret_status
      # - fail:
      #     msg: "test fail"      
      
      - name: remove custom hosts without creds in gateway - cmp
        set_fact: 
          final_custom_https: "{{ final_custom_https + [ inner_item ] }}"
        with_items: "{{ custom_http_list }}"
        when: inner_item in ns_cred_list
        loop_control:
            loop_var: inner_item
      - name: printing final custom domains list - cmp
        debug: var=final_custom_https
      
      when: custom_http_list is defined and ( custom_http_list | length > 0)

    # - name: Handle the error - cmp
    #   block:
    # - name: validate if hosts credentials exists - cmp
    #   kubernetes.core.k8s_info:
    #     kind: secret
    #     namespace: istio-system
    #     name: "{{ inner_item.value }}" 
    #   register: cluster_secret_status
    #   with_items: "{{ ns_cred_list | dict2items }}"
    #   loop_control:
    #       loop_var: inner_item
    #   failed_when: cluster_secret_status.resources is defined and (cluster_secret_status.resources | length == 0)
  # rescue:
