###
- name: read the file content  
  slurp:
    src: "{{ item.src }}"
  register: yml_file_content

- name: decode the content 
  set_fact: 
    decoded_yml: "{{ yml_file_content.content | b64decode | from_yaml }}"

- name: set namespace  
  set_fact:
    namespace: "{{ decoded_yml.metadata.namespace }}"

# - name: apply Destinationrule block 
#   block:
- name: apply Destinationrule at namespace level 
  kubernetes.core.k8s:
    state: present
    definition: "{{ decoded_yml }}"
- debug:
    msg: "applying the Destinationrule for namespace {{ namespace }}"
- name: ensures {{ namespace }} directory exists
  file:
    path: "{{ mypath }}/Artifacts/applied/{{ namespace }}"
    state: directory 
- name: storing applied files.
  copy:
    src: "{{ item.src }}"
    dest: "{{ mypath }}/Artifacts/applied/{{ namespace }}"

#########################################################################
- name: Creating directory for uploading files into git repo
  file:
    path: "/tmp/git_repo_clone/src/main/k8s/deployments/{{ dept }}/{{ env }}/{{ cluster_name }}/cluster-config/destinationrules/{{ decoded_yml.metadata.namespace }}"
    state: directory
- name: removing patch in file name if any 
  set_fact:
    temp_file: "{{ item.src| basename }}"
- set_fact:
    filename: "{{ temp_file.replace('-patch','') }}"
- name: Copy folders
  copy:
    dest: "/tmp/git_repo_clone/src/main/k8s/deployments/{{ dept }}/{{ env }}/{{ cluster_name }}/cluster-config/destinationrules/{{ decoded_yml.metadata.namespace }}/{{ filename }}"
    src: "{{ item.src }}"
    force: true

