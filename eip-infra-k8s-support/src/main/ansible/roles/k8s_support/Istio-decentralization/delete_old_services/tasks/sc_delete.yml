- name: name of sidecar 
  set_fact: 
    sc_name: "{{ item.metadata.name }}"

- debug: 
    msg: "deleting the old sidecar."
- name: delete Old Sidecar
  kubernetes.core.k8s: 
    state: absent 
    api_version: networking.istio.io/v1alpha3
    kind: Sidecar 
    namespace: "pep-{{ department }}-istio-config"
    name: "{{ sc_name }}"
  