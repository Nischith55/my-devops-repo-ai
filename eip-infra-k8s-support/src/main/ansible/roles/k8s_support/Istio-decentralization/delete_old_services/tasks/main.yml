- name: Get the Sidecar 
  kubernetes.core.k8s_info:
    api_version: networking.istio.io/v1alpha3
    kind: Sidecar 
    namespace: "pep-{{ department }}-istio-config"
  register: sidecar_old

- name: loop through the Sidecar manifest files 
  include_tasks: sc_delete.yml
  with_items: "{{ sidecar_old.resources }}"
  # with_fileglob: 
  # - "{{ mypath }}/Artifacts/sc-manifests/*"
  # when: sc_status.stat.isdir is defined and sc_status.stat.isdir

