- name: name of virtualservice to delete 
  set_fact: 
    vs_name: "{{ item.metadata.name }}"

- debug: 
    msg: "deleting the virtual service {{ vs_name }}."
- name: delete virtual service
  kubernetes.core.k8s: 
    state: absent 
    api_version: networking.istio.io/v1beta1
    kind: VirtualService 
    namespace: "pep-{{ department }}-istio-config"
    name: "{{ vs_name }}"
  