- name: name of destinationrule 
  set_fact: 
    dr_name: "{{ item.metadata.name }}"

- debug: 
    msg: "deleting the old Destinationrule."
- name: delete Old Destinationrule
  kubernetes.core.k8s: 
    state: absent 
    api_version: networking.istio.io/v1beta1
    kind: DestinationRule 
    namespace: "pep-{{ department }}-istio-config"
    name: "{{ dr_name }}"
  