steps:
- task: PowerShell@2
  displayName: log failures in previous tasks
  condition: failed()
  name: setOutput
  inputs:
    targetType: 'inline'
    script: |
      $token = "$(svcPersonalAccessToken)"
      $url="$(System.TeamFoundationCollectionUri)/$(System.TeamProject)/_apis/build/builds/$(build.buildid)/timeline?api-version=6.0"
      $token = [System.Convert]::ToBase64String([System.Text.Encoding]::ASCII.GetBytes(":$($token)"))
      $response = Invoke-RestMethod -Uri $url -Headers @{Authorization = "Basic $token"} -Method Get -ContentType application/json
      $errors = $response.records.Where({ $_.result -eq "failed" })
      $sys = @()
      $errors.ForEach({
        $sys += $_.name
        $_.issues.ForEach({ $_.message })
      })
      $sys
      Write-Host "##vso[task.setvariable variable=setout;isOutput=true]$sys"