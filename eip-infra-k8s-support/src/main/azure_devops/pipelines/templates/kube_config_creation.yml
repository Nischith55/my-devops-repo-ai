- task: Bash@3
  displayName: "kubeconfig file creation"
  inputs:
    targetType: 'inline'
    script: |
      ansible-playbook -e '{"cluster": "${{ parameters.cluster }}", "namespace": "${{ parameters.namespace }}", "HOME": "$(HOME)" }' "$(system.defaultWorkingDirectory)/src/main/ansible/playbooks/k8s/kubeconfig-file-creation.yml" -v
  env:
    ANSIBLE_HOST_KEY_CHECKING: False
    ANSIBLE_LOCALHOST_WARNING: False


- task: Bash@3
  name: "encode"
  displayName: 'convertb64'
  inputs:
    targetType: 'inline'
    script: |
      file_content=`base64 /tmp/${{ parameters.cluster }}-user-ip.kcfg -w 0`
      echo $file_content
      echo "##vso[task.setvariable variable=outputresult;isoutput=true]$file_content"