apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: vs_name
  namespace: ns_value
spec:
  gateways:
  - pep-eiap-cgf-eecmp-qa/pep-eiap-cgf-eecmp-qa-cv-gw
  hosts:
  - host_value
  http:
  - match:
    - ignoreUriCase: true
      uri:
        prefix: prefix_value
    route:
    - destination:
        host: destination_host_value
        port:
          number: port_value
          