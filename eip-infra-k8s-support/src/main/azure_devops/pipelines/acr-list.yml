# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

# Docker
# Build and push an image to Azure Container Registry
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger: 
- none
pr: 
- none 
parameters:
  - name: env
    displayName: env (Prod and Preprod are using same acr)
    type: string
    values:
      - nonprod
      - prod
variables:
  - group: acr_list_mahesh
  - name: poolname
    ${{ if eq(parameters.env, 'prod') }}:
      value: 'pep-eiap-prod-scus-infra-02-aks-agents'
    ${{ else }}:
      value: 'pep-eiap-nonprod-scus-infra-02-aks-agents'

stages:
- stage: list_acr_images
  displayName: list_acr_images
  pool: 
      name: $(poolname)
      #name: pep-dps-nonprod-eus-global-01-aks-agents
  jobs:
  - job: list_acr_images
    displayName: list_acr_images
    steps:
    - task: Bash@3
      inputs:
        targetType: 'inline'
        script: |
          export DOCKER_CONFIG="$(Pipeline.Workspace)/.docker"
          mkdir -p "$DOCKER_CONFIG"
          crane auth login $(common_acr_name) -u $(common_acr_usr) -p $(common_ acr_pwd)
          echo "printing images."
          for i in `crane catalog $(common_acr_name)`
          do 
            for j in `crane ls $(common_acr_name)/$i`
            do 
              echo $(common_acr_name)/$i:$j
            done 
          done 