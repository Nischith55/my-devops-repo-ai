# Docker
# Build and push an image to Azure Container Registry
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger: 
- none
pr: 
- none 

parameters:
  - name: env
    displayName: 'env'
    type: string
    values:
      - nonprod
      - preprod
      - prod
  - name: command
    type: string
  - name: namespace_list
    displayName: namespace_list
    type: boolean
    default: false 

variables:
  - group: preprod_nonprod_ansible_azure_secrets
  - group: prod_ansible_azure_secrets
  - group: repo_access_token
  - name: env
    ${{ if eq(parameters.env, 'prod') }}:
      value: prod
    ${{ elseif eq(parameters.env, 'preprod') }}:
      value: preprod
    ${{ else }}:
      value: nonprod
  - name: clusters_env
    ${{ if eq(parameters.env, 'prod') }}:
      value: prod
    ${{ elseif eq(parameters.env, 'preprod') }}:
      value: prod
    ${{ else }}:
      value: nonprod

stages: 
- stage: execute_command
  displayName: Execute command on clusters
  variables:
    - name: poolname
      ${{ if eq(parameters.env, 'prod') }}:
        value: 'pep-eiap-prod-scus-infra-02-aks-agents'
      ${{ else }}:
        value: 'pep-eiap-nonprod-gwc-infra-02-aks-agents'
        #value: 'pep-eiap-nonprod-scus-infra-02-aks-agents'
  pool: 
      name: $(poolname)
  jobs:
  - job: get_list
    displayName: Get list
    steps:
    # - task: Bash@3
    #   displayName: 'test_task'
    #   name: test_task
    #   inputs:
    #     targetType: 'inline'
    #     script: |
    #       echo "starting the script execution. "
    #       ansible --version
    #       echo "after version"
    #       source ~/venv/python38-ansible211/bin/activate
    #       ansible --version 
    #       echo "finally ---> "
    #       exit 1
    - task: PythonScript@0
      displayName: get_list
      name: get_list
      inputs:
        scriptSource: 'filePath'
        scriptPath: '$(system.defaultWorkingDirectory)/src/main/azure_devops/pipelines/templates/get_clusters.py'
        arguments: "$(clusters_env) $(system.defaultWorkingDirectory)/src/main/azure_devops/pipelines/templates/clusters_pools.json"
        pythonInterpreter: '/usr/bin/python3'

  - job: execute_command
    displayName: Execute command on clusters
    dependsOn: get_list
    variables:
      input_json: $[ dependencies.get_list.outputs['get_list.data_json'] ]
    strategy:
      matrix: $[ dependencies.get_list.outputs['get_list.data_json'] ]
    pool: $(agentpool)
    steps:    
    - template: templates/set_config_namespace_tagging.yml
      parameters:
        cluster: $(cluster)
        env: $(env)

    - task: Bash@3
      displayName: 'execute_command'
      name: execute_command
      continueOnError: true
      inputs:
        targetType: 'inline'
        script: |
          echo "starting the script execution. "
          type=`echo $(cluster) | cut -d "-" -f 2`
          # output=`${{ parameters.command }}`
          kubectl get deploy --all-namespaces --no-headers | awk '{print $1}' | sort | grep -i ^pep- | uniq -c | awk '{print $2, $1}' > "$(Build.ArtifactStagingDirectory)/$(cluster).txt"
