          # echo "config map name is $conf_map_name "
          # server1=`kubectl get configmap $conf_map_name -n pep-$type-elastic-client-01 -o jsonpath="{.data.*}" | grep 'hosts: ' | cut -d '"' -f 2`
          # echo "server 1 is $server1"
          # server2=`kubectl get configmap $conf_map_name -n pep-$type-elastic-client-01 -o jsonpath="{.data.*}" | grep 'hosts: ' | cut -d '"' -f 4`
          # echo "server 2 is $server2"
          # for i in `kubectl get nodes -o jsonpath="{.items[*].metadata.name}" | sed 's/ /\n/g'`;
          # do 
          #   if [[ $i == *"npu"* ]]; then
          #     echo "Node name $i"
          #   else 
          #     echo "Node name $i and not user node pool. so skipping."
          #     continue
          #   fi
          #   kubectl debug node/$i -it --image=mcr.microsoft.com/dotnet/runtime-deps:6.0 -n  pep-$type-infra-dev
          #   sleep 5
          #   apt-get update 
          #   apt install netcat
          #   nc -zv $server1 
          #   nc -zv $server2
          #   exit 
          # done

      env:
        AAD_SERVICE_PRINCIPAL_CLIENT_ID: $(AZURE_CLIENT_ID)
        AAD_SERVICE_PRINCIPAL_CLIENT_SECRET: $(AZURE_SECRET)
    
    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/'
        ArtifactName: 'output'
        publishLocation: 'Container'
  
  - job: Final_output
    dependsOn: execute_command
    timeoutInMinutes: 0
    condition: ${{ eq(parameters.namespace_list, true) }}
    displayName: Final output 
    steps:
    - task: DownloadBuildArtifacts@1
      inputs:
          buildType: 'current'
          downloadType: 'specific'
          downloadPath: '$(Build.ArtifactStagingDirectory)'
          cleanDestinationFolder: true
    
    - task: Bash@3
      inputs:
        targetType: 'inline'
        script: |
          cd $(Build.ArtifactStagingDirectory)/output/
          ls -lrth
          for dir in `ls -lrth | awk '{print $9}'`;
          do
            cluster_name="${dir%%.*}"
            echo $cluster_name
            while read p; do
              namespace=$(echo $p | awk '{print $1}')
              count=$(echo $p | awk '{print $2}')
              echo "$cluster_name,$namespace,$count" >> $(Build.ArtifactStagingDirectory)/full_list.txt
            done <$dir
          done
    
    - task: CmdLine@2
      displayName: python_configuration
      inputs:
        script: |
          # mkdir -p ~/venv
          # mkdir -p ~/venv/python38-ansible211
          # source ~/venv/python38-ansible211/bin/activate
          . /opt/venv/python38-ansible211/bin/activate
          python3.8 -m pip install pandas
          
    - task: PythonScript@0
      inputs:
        scriptSource: 'inline'
        arguments: $(Build.ArtifactStagingDirectory)
        pythonInterpreter: '/opt/venv/python38-ansible211/bin/python3'
        script: |
          #mkdir -p ~/venv
          #mkdir -p ~/venv/python38-ansible211
          #source ~/venv/python38-ansible211/bin/activate
          #python3 -m pip install pandas
          import pandas as pd
          import sys
          file_txt=sys.argv[1] + "/full_list.txt"
          file_csv=sys.argv[1] + "/full_list.csv"
          images = pd.read_csv(file_txt, delimiter = ',', header = None)
          images.columns = ['Cluster_Name', 'Namespace', 'Deploy_Count']
          #images.columns = ['Cluster_Name','Deploy_Count']
          images.to_csv(file_csv, index = None)

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/full_list.csv'
        ArtifactName: 'output'
        publishLocation: 'Container'