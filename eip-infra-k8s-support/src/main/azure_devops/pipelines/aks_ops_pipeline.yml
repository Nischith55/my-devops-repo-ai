          #kubectl get virtualservice -A -o json | jq -r '.items[].spec.hosts[]' | grep -v "intra.pepsico.com" | sed 's/ /\n/g' > "$(Build.ArtifactStagingDirectory)/$(cluster).txt"
          #kubectl get virtualservice -A -o json | jq -r '.items[].spec.hosts[]' | grep -v "*pepsico.com" | sed 's/ /\n/g' > "$(Build.ArtifactStagingDirectory)/$(cluster).txt"
