# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml
trigger: none

parameters:
  - name: secret_key_values
    type: object
    default:
      - key: "key1"
        value: "value1"
      - key: "key2"
        value: "value2"
      - key: "key3"
        value: "value3"
  
  - name: cluster_name
    type: string
  
  - name: env
    displayName: 'env'
    type: string
    values:
      - NONPROD
      - PREPROD
      - PROD
  
  - name: namespace
    type: string 
  
  - name: secret_name
    type: string 

  - name: operation
    type: string
    displayName: 'operation'
    values:
      - create
      - update

variables:
  - group: preprod_nonprod_ansible_azure_secrets
  - group: prod_ansible_azure_secrets

stages:
- stage: create_secret
  displayName: Create Secret
  pool:
    name: "pep-eiap-prod-scus-infra-02-aks-agents"
  jobs:
  - job: update_manifest
    displayName: Update Manifest 
    steps:
      - task: Ansible@0
        displayName: 'Updating Manifest'
        inputs:
          ansibleInterface: 'agentMachine'
          playbookPathOnAgentMachine: '$(system.defaultWorkingDirectory)/src/main/ansible/playbooks/k8s/secrets-update-manifest.yml'
          args: '-e ''{ "env": "${{ parameters.env }}", "namespace": "${{ parameters.namespace }}", "cluster_name": "${{ parameters.cluster_name }}", "secret_name": "${{ parameters.secret_name }}", "secret_key_values": ${{ convertToJson(parameters.secret_key_values) }} }'' -vv'
        env:
          ANSIBLE_HOST_KEY_CHECKING: False
          ANSIBLE_LOCALHOST_WARNING: False
          script_dir: $(system.defaultWorkingDirectory)
      
      - task: PublishBuildArtifacts@1
        inputs:
          PathtoPublish: '$(system.defaultWorkingDirectory)/artifacts/'
          publishLocation: 'Container'
          ArtifactName: 'drop'
      
      - task: Bash@3
        displayName: Set Agent Pool 
        name: set_agent_pool
        inputs:
          targetType: 'inline'
          script: | 
            echo "setting agent pool"
            pool=`cat $(system.defaultWorkingDirectory)/artifacts/agentpool.txt`
            echo "##vso[task.setvariable variable=agent_pool;isOutput=true]$pool"

  - job: create_update_secret 
    displayName: Create_Update_Secret 
    dependsOn: ['update_manifest']
    variables:
      agent_pool: $[ dependencies.update_manifest.outputs['set_agent_pool.agent_pool'] ]
    pool: $(agent_pool)
    steps:
      - template: templates/set_config_secrets.yml
        parameters:
          cluster: ${{ parameters.cluster_name }}
          env: ${{ parameters.env }}
      
      - task: DownloadBuildArtifacts@1
        inputs:
          buildType: 'current'
          downloadType: 'specific'
          downloadPath: '$(System.DefaultWorkingDirectory)'

      - task: CmdLine@2
        inputs:
          script: |
            pip3 install ruamel.yaml
            ansible-playbook --version
            pip install ansible[Azure]
            pip install futures
            python3 --version
            pip show pyyaml
            pip3 install openshift

      - task: Bash@3
        displayName: 'kubectl'
        inputs:
          targetType: 'inline'
          script: |
            ansible-galaxy collection install kubernetes.core -p ~/.ansible/collections/
            ansible-galaxy collection install cloud.common -p ~/.ansible/collections/

      - task: Ansible@0
        displayName: 'Create Secret'
        name: create_secret
        inputs:
          ansibleInterface: 'agentMachine'
          playbookPathOnAgentMachine: '$(system.defaultWorkingDirectory)/src/main/ansible/playbooks/k8s/secrets-create-secret.yml'
          args: '-e ''{ "cluster_name": "${{ parameters.cluster_name }}", "namespace": "${{ parameters.namespace }}", "secret_name": "${{ parameters.secret_name }}", "operation": "${{ parameters.operation }}" }'' -vv'
        env:
          ANSIBLE_HOST_KEY_CHECKING: False
          ANSIBLE_LOCALHOST_WARNING: False
          script_dir: $(system.defaultWorkingDirectory)
          AAD_SERVICE_PRINCIPAL_CLIENT_ID: $(AZURE_CLIENT_ID)
          AAD_SERVICE_PRINCIPAL_CLIENT_SECRET: $(AZURE_SECRET)
      
      - task: PublishBuildArtifacts@1
        inputs:
          PathtoPublish: '$(System.DefaultWorkingDirectory)/${{ parameters.secret_name }}_bkp.yml'
          ArtifactName: 'Backup'
          publishLocation: 'Container'
        continueOnError: true
   