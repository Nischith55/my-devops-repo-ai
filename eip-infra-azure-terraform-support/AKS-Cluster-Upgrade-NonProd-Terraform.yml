
trigger: none

resources:
 repositories: 
    - repository: terraformmodules
      type: git
      name: eip-infra-terraform-modules
    - repository: eip-infra-azure-terraform-support
      type: git
      name: eip-infra-azure-terraform-support
      ref: main

parameters:
  - name: control_plane_upgrade
    displayName: 'Control_Plane_Upgrade'
    type: boolean
    default: 'false'
  - name: system_pool_upgrade
    displayName: 'System_Pool_Upgrade'
    type: boolean
    default: 'false'
  - name: user_pool_upgrade
    displayName: 'User_Pool_Upgrade'
    type: boolean
    default: 'false'
  - name: service_principal
    displayName: service_principal
    type: string
    values:  
      - NONPROD_K8S_SPN
      - PREPROD_K8S_SPN
      - PROD_K8S_SPN
  - name: Functional_Area
    displayName: Functional_Area
    type: string
    values:
      - eiap
      - aisp
      - edap
      - pfna
      - snt
      - cmp
      - infratools
      - infosectools
      - pbna
      - dps
      - cmptest
      - automation
      - cgf
      - pepgenx
  - name: env
    displayName: Environment
    type: string
    values:
      - nonprod
      - preprod
      - prod
  - name: Region
    displayName: Region
    type: string
    values:
      - scus
      - eus
      - gwc
      - suk
      - sea
      - ae
  - name: ResourceType
    displayName: Resource Type
    type: string
    default: azure-kubernetes-services
    values:
      - azure-kubernetes-services
  - name: ResourceGroupName
    displayName: ResourceGroupName
    type: string
  - name: ResourceName
    displayName: Resource Name
    type: string
  - name: list_of_nodepools
    displayName: User Nodepools List
    type: string
    default: 'all'
  - name:  versions
    displayName: versions
    type: string
  - name: max_surge
    displayName: max_surge for user_nodepools
    type: string
    default: ' '
  - name: nginx_url
    displayName: nginx url
    type: string 
  - name: parallelism
    displayName: Terraform parallelism to run no. of jobs
    type: string
    default: 2
    values:
      - 1
      - 2
      - 3
      - 4
      - 5    
  - name: is_infra_cluster
    displayName: Is this Infra cluster?
    type: boolean
    default: 'false'
#---------------------------------------------------------------------------------------------------------------
