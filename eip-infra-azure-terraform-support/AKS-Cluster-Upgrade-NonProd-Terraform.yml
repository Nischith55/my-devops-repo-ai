    #     inputs:
    #       notifyUsers: |
    #         $(approval_ITEIAPK8sSUPPORT)
    #       instructions: 'Kindly approve the PR before proceeding further'        
#__________________________________________________________________________________________________
  - stage: validation
    displayName: validation
    dependsOn: GitPushFinalChanges
    condition: and(succeeded('GitPushFinalChanges'), ne(variables['build.sourceBranch'], 'refs/heads/main'))
    pool: 
      name: $(agent_pool)
    jobs:  
    - job: validation
      steps:
      - template: templates/validation.yml  # Template reference 
        parameters:
          resource_name: ${{ parameters.ResourceName }}
          department: ${{ parameters.Functional_Area }}
          region: ${{ parameters.region }}
          env: ${{ parameters.env }}
          nginx_url: ${{ parameters.nginx_url }}
          service_principal: ${{parameters.service_principal}}
          service_principal_backend: ${{variables.backend_spn}}
          curl_pfna: ${{variables.curl_pfna}} 
          build: $(Build.BuildId)
