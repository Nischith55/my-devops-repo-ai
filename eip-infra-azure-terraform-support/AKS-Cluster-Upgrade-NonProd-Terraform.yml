#_______________________________________________________________________________________________________________________________________________________________________
stages:   
  - stage: display
    displayName: display-selected-inputs-by-user
    pool: 
      name: $(agent_pool)
    jobs: 
      - job: display_backend_values
        continueOnError: false
        steps:
        - task: Bash@3
          displayName: "display-selected-parameters"
          inputs:
            targetType: 'inline'
            script: |
              echo "Checked out branch: $(Build.SourceBranch)"
              echo "Selected Environment : ${{Parameters.env}}"
              echo "Selected Resource Type : ${{Parameters.ResourceType}}"
              echo "Selected Region : ${{Parameters.Region}}"
              echo "Agent Pool to be used for all stages : ${{variables.agent_pool}}"
              echo "Backend resource group name : ${{variables.resource_group_name_for_backend}}"
              echo "Backend storage account : ${{variables.storage_account_name_for_backend}}"
              echo "Backend container name : ${{variables.container_name_for_backend}}"
              echo "Backend Key : ${{variables.key_for_backend}}"
              echo "Name of the targeted resource : ${{ parameters.ResourceName }}"
              if [ -z "${{ variables.resource_name_input }}" ]; then
                echo "Error: ResourceName parameter is invalid."
                exit 1
              fi
              echo "Resource Group Name : ${{parameters.ResourceGroupName}}"
              echo "Selected SPN details : ${{Parameters.service_principal}}"
              echo "Subscription id for pfna/snt/infratools : ${{variables.subscription_id_others}}"
              echo "Subscription id for EIAP suk/ae/gwc regions : ${{variables.subscription_id_other_regions}}"
              echo "Selected AKS Version : ${{Parameters.versions}}"
              # echo "Selected Upgrade types : ${{variables.plane_select_control_plane}} ${{variables.plane_select_system_pool}} ${{variables.plane_select_user_pool}}"     
              if [[ "${{variables.plane_select_user_pool}}" == "user_pool_upgrade" ]]; then
                echo "Selected Upgrade Type & Usernodepools List : ${{variables.plane_select_user_pool}} & ${{Parameters.list_of_nodepools}}"
              else
                echo "Selected Upgrade types : ${{variables.plane_select_control_plane}} ${{variables.plane_select_system_pool}}"
              fi  
              echo "Selected Max Surge for UserNodepool: ${{Parameters.max_surge}}"
              echo "Selected Parallelism to run no of Jobs: ${{Parameters.parallelism}}"

#__________________________________________________________________________________________
  # - stage: check_for_config
  #   displayName: manual-check-for-selected-parameters
  #   dependsOn: display
  #   pool: 
  #     name: $(agent_pool)
  #   jobs:
  #   - job: approval
  #     pool: server
  #     timeoutInMinutes: 5
  #     steps:
  #     - task: ManualValidation@0
  #       timeoutInMinutes: 6
  #       inputs:
  #         instructions: 'validate the selected parameters before proceeding'
# __________________________________________________________________________________________
  - stage: update_tfvars_tfplan
    displayName: terraform-plan
    # condition: and(succeeded('check_for_config'), ne(variables['build.sourceBranch'], 'refs/heads/main'))
    condition: ne(variables['build.sourceBranch'], 'refs/heads/main')
    # dependsOn: check_for_config
    pool: 
      name: $(agent_pool) 
    jobs:
    - job: aksupgrade
      displayName: TF-plan&updating-tfvars
      steps:
      - template: templates/aks_upgrade.yml
        parameters:
          plane_select_user_pool: ${{variables.plane_select_user_pool}}
          plane_select_system_pool: ${{variables.plane_select_system_pool}}
          plane_select_control_plane: ${{variables.plane_select_control_plane}}
          list_of_nodepools: ${{ parameters.list_of_nodepools}}
          versions: ${{ parameters.versions}}
          max_surge: ${{parameters.max_surge}}
          path_of_nodepools: ${{variables.path_of_nodepools}}
          path_of_mandatory: ${{variables.path_of_mandatory}}
          path_of_defaults: ${{variables.path_of_defaults}}
          Functional_Area: ${{parameters.Functional_Area}}
          env: ${{parameters.env}}
          Region: ${{parameters.Region }}
          ResourceType: ${{parameters.ResourceType}}  
          ResourceName: ${{variables.resource_name_input}}
          service_principal: ${{parameters.service_principal}}
          service_principal_backend: ${{variables.backend_spn}}
          resource_name: ${{variables.resource_name_input}}
          inplace: ${{variables.inplace}}
#_________________________________________________________________________________
  - stage: pre_check
    displayName: pre-check
    dependsOn: update_tfvars_tfplan
    condition: and(succeeded('update_tfvars_tfplan'), ne(variables['build.sourceBranch'], 'refs/heads/main'))
    pool: 
        name: $(agent_pool)    
    jobs:
    - job: pre_check
      displayName: pre-check
      steps:  
      - template: templates/pre_check.yml
        parameters:
          resource_name: ${{variables.resource_name_input}}
          Functional_Area: ${{parameters.Functional_Area}}
          env: ${{parameters.env}}
          Region: ${{parameters.Region }}
          ResourceType: ${{parameters.ResourceType}}  
          service_principal: ${{parameters.service_principal}}
          service_principal_backend: ${{variables.backend_spn}}
          inplace: ${{variables.inplace}}
          curl_pfna: ${{variables.curl_pfna}} 
          opt: pre 
#__________________________________________________________________________________________________
  - stage: checkforapprovalforapply
    displayName: approval-to-terraform-apply
    dependsOn: pre_check
    condition: and(succeeded('pre_check'), ne(variables['build.sourceBranch'], 'refs/heads/main'))
    pool: 
      name: $(agent_pool)
    jobs:
    - job: approvalforapply
      pool: server
      timeoutInMinutes: 4320 # job times out in 3 days
      steps:
      - task: ManualValidation@0
        timeoutInMinutes: 1440 # task times out in 1 day
        inputs:
          notifyUsers: |
            $(approval_ITEIAPK8sSUPPORT)
          instructions: 'Approval required for Terraform Execution'
#__________________________________________________________________________________________________
  - stage: post_check_tfapply
    displayName: terrafrom-apply-upgrade
    condition: and(succeeded('checkforapprovalforapply'), ne(variables['build.sourceBranch'], 'refs/heads/main'))
    dependsOn: checkforapprovalforapply  
    jobs:  
    - job: terraform_apply
      displayName: TF-apply-upgrade-post-check
      pool: 
        name: $(agent_pool) 
      timeoutInMinutes: 0
      steps:
      - template: templates/post_check.yml
        parameters:
          resource_name: ${{variables.resource_name_input}}
          Functional_Area: ${{parameters.Functional_Area}}
          env: ${{parameters.env}}
          Region: ${{parameters.Region }}
          ResourceType: ${{parameters.ResourceType}}  
          service_principal: ${{parameters.service_principal}}
          service_principal_backend: ${{variables.backend_spn}}  
          inplace: ${{variables.inplace}} 
          parallelism: ${{parameters.parallelism}} 
          curl_pfna: ${{variables.curl_pfna}} 
          opt: post
#------------------------------------------------------------------------------------          
  - stage: GitPushFinalChanges
    displayName: approval-to-push-featurebranch
    dependsOn: post_check_tfapply
    condition: and(succeeded('post_check_tfapply'), ne(variables['build.sourceBranch'], 'refs/heads/main'))
    pool: 
      name: $(agent_pool)   
    jobs:
    # - job: approvaltoGitPush
    #   displayName: Gitpush-approval
    #   pool: server
    #   timeoutInMinutes: 4320 # job times out in 3 days
    #   steps:
    #   - task: ManualValidation@0
    #     timeoutInMinutes: 1440 # task times out in 1 day
    #     inputs:
    #       notifyUsers: |
    #         $(approval_ITEIAPK8sSUPPORT)
    #       instructions: 'Approval required for Terraform Execution'
    
    - job: git_push
      #dependsOn: approvaltoGitPush
      steps: 
      - task: DownloadPipelineArtifact@2
        displayName: 'download files'
        inputs:
          artifactName: 'modified-tfvars'
          downloadPath: '$(Build.SourcesDirectory)/src/${{parameters.Functional_Area}}/${{parameters.env}}/resources/${{Parameters.Region}}/${{parameters.ResourceType}}/${{parameters.ResourceName}}'
      - template: templates/git_push.yml
    
    - job: CreatingPR
      displayName: PR-to-Main
      dependsOn: git_push
      steps:
      - task: Bash@3
        displayName: 'raise-pull-request'
        inputs:
          targetType: 'inline'
          script: |
            export AZURE_DEVOPS_EXT_PAT=$(svcPersonalAccessToken)
            pip install azure-devops   
            prid=$(az repos pr create --organization https://dev.azure.com/PepsiCoIT/ --project EIP-Infrastructure --repository eip-infra-azure-terraform-support --source-branch $(Build.SourceBranchName) --target-branch main --title "Merge Request after Upgrade" --description "Mandatory Pull Request to be Approved/Completed Before Proceeding with further Upgrade Steps" --auto-complete true | grep "codeReviewId" | awk '{ print $2 }' | sed 's/,//g')
            echo "Pull request created with ID:$prid, Please Complete it before Proceeding to Validation"
    # - job: approval_if_PR_done
    #   displayName: pull-request-confirmation
