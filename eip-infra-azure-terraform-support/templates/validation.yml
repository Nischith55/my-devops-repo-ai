steps:
- task: PythonScript@0
  displayName: "Extract Azure KV secrets"
  name: "GetAzureCreds"
  inputs:
    scriptSource: 'filePath'
    scriptPath: '$(system.defaultWorkingDirectory)/templates/scripts/get_spn.py'
    arguments: "NONPROD_K8S_SPN:PREPROD_K8S_SPN:PREPROD_NETWORK_SPN:NONPROD_NETWORK_SPN:NONPROD_PAAS_SPN:PREPROD_PAAS_SPN:PROD_NETWORK_SPN:PROD_PAAS_SPN:PROD_K8S_SPN"
    pythonInterpreter: '/usr/bin/python3'
    failOnStderr: true
  env:
    PREPROD_NETWORK_SPN: $(pep-eiap-preprod-network-sp) 
    NONPROD_NETWORK_SPN: $(pep-eiap-nonprod-network-sp)
    PROD_NETWORK_SPN: $(pep-eiap-prod-network-sp)
    NONPROD_PAAS_SPN: $(pep-eiap-nonprod-paas-sp)
    PREPROD_PAAS_SPN: $(pep-eiap-preprod-paas-sp)
    PROD_PAAS_SPN: $(pep-eiap-prod-paas-sp)
    PREPROD_K8S_SPN: $(pep-eiap-preprod-k8s-sp)
    NONPROD_K8S_SPN: $(pep-eiap-nonprod-k8s-sp)
    PROD_K8S_SPN: $(pep-eiap-prod-k8s-sp)

- task: PythonScript@0
  displayName: "Set Azure credentials"
  name: "SetAzureCreds"
  inputs:
    scriptSource: 'filePath'
    scriptPath: '$(system.defaultWorkingDirectory)/templates/scripts/set_spn.py'
    arguments: "${{ parameters.service_principal_backend }}"
    pythonInterpreter: '/usr/bin/python3'
    failOnStderr: true

- task: PythonScript@0
  displayName: "Set Service Principal"
  name: "SetServicePrincipal"
  inputs:
    scriptSource: 'filePath'
    scriptPath: '$(system.defaultWorkingDirectory)/templates/scripts/set_config_spn.py'
    arguments: "${{ parameters.service_principal }}"
    pythonInterpreter: '/usr/bin/python3'
    failOnStderr: true

- task: DownloadSecureFile@1
  displayName: 'Download config file'
  inputs:
    secureFile: 'config'

- task: CopyFiles@2
  displayName: "Copyitems"
  inputs:
    SourceFolder: $(Agent.TempDirectory)
    Contents: config
    TargetFolder: $(HOME)

- task: Bash@3
  displayName: pre-requisite
  inputs:
    targetType: 'inline'
    script: |
      pip3 install ruamel.yaml
      ansible --version
      pip3 install --upgrade ansible
      ansible --version
      pip3 install openshift==0.11.0
      pip3 install kubernetes==28.1.0
      pip3 install pyyaml
      pip3 show pyyaml
      pip3 show openshift
      pip3 show kubernetes
      ansible --version
      ansible-galaxy collection install community.kubernetes -p ~/.ansible/collections
      ansible-galaxy collection install cloud.common -p ~/.ansible/collections

- task: Bash@3
  displayName: 'set_context'
  inputs:
    targetType: 'inline'
    script: |
      set -e
      echo "$(CLIENTID)"
      echo "$(CLIENTSECRET)"
      mkdir $HOME/.kube
      cp $(Agent.TempDirectory)/config $HOME/.kube/
      kubectl config use-context ${{ parameters.resource_name }}
      kubectl config current-context
      pwd
      cd /home/neipd999/.kube/
      ls -la
      cat config
  env:
    AAD_SERVICE_PRINCIPAL_CLIENT_ID: $(CLIENTID)
    AAD_SERVICE_PRINCIPAL_CLIENT_SECRET: $(CLIENTSECRET)


- task: DownloadPipelineArtifact@2
  displayName: 'download files'
  inputs:
    artifactName: 'drop'
    downloadPath: '$(system.defaultWorkingDirectory)/k8s_backups'

- task: Bash@3
  displayName: 'extracting_infra_namespace'
  inputs:
    targetType: 'inline'
    script: |
      viewing_infra_namespace=`kubectl get ns --no-headers -o custom-columns=":metadata.name"  | grep pep-${{ parameters.department }}-global* | grep infra`
      echo $viewing_infra_namespace
      echo "##vso[task.setvariable variable=infra_namespace;isOutput=true]$viewing_infra_namespace"
  name: viewing_infra_namespace
  env:
    AAD_SERVICE_PRINCIPAL_CLIENT_ID: $(CLIENTID)
    AAD_SERVICE_PRINCIPAL_CLIENT_SECRET: $(CLIENTSECRET)

- task: Bash@3
  displayName: 'viewing infra namespace'
  inputs:
    targetType: 'inline'
    script: |
      echo $(viewing_infra_namespace.infra_namespace)
      
  env:
    AAD_SERVICE_PRINCIPAL_CLIENT_ID: $(CLIENTID)
    AAD_SERVICE_PRINCIPAL_CLIENT_SECRET: $(CLIENTSECRET)

- task: Ansible@0
  displayName: "Validation"
  name: "validation"
  inputs:
    ansibleInterface: 'agentMachine'
    playbookPathOnAgentMachine: '$(Build.SourcesDirectory)/src/ansible/playbooks/validation.yml'
    failOnStderr: false
    args: '-e ''{ "resourcename": "${{ parameters.resource_name }}" , "curl_pfna": "${{ parameters.curl_pfna }}" , "working_dir": "$(system.defaultWorkingDirectory)" }'' -v'
  env:
    ANSIBLE_HOST_KEY_CHECKING: False
    ANSIBLE_LOCALHOST_WARNING: False
    K8S_AUTH_KUBECONFIG: ~/.kube/config
    K8S_AUTH_CONTEXT: "{{ parameters.resource_name }}"
    ANSIBLE_ROLES_PATH: $(Build.SourcesDirectory)/src/ansible/roles
    AAD_SERVICE_PRINCIPAL_CLIENT_ID: $(CLIENTID)
    AAD_SERVICE_PRINCIPAL_CLIENT_SECRET: $(CLIENTSECRET)

    

    