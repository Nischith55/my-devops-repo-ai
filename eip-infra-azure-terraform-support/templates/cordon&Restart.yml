steps: 
- task: DownloadSecureFile@1
  displayName: 'Download config file'
  inputs:
    secureFile: 'config'

- task: CopyFiles@2
  displayName: "Copyitems"
  inputs:
    SourceFolder: $(Agent.TempDirectory)
    Contents: config
    TargetFolder: $(HOME)
  
- task: Bash@3
  displayName: 'set_context'
  inputs:
    targetType: 'inline'
    script: |
      mkdir $HOME/.kube
      cp $(Agent.TempDirectory)/config $HOME/.kube/
      #mv $HOME/.kube/config $HOME/.kube/config
      kubectl config use-context ${{ parameters.resource_name }}
      kubectl config current-context
      pwd
      cd /home/neipd999/.kube/
      ls -la
      cat config



    
- task: Bash@3
  displayName: cordon_restart_system
  condition: eq('${{ parameters.mode }}', 'System')
  inputs:
    targetType: 'inline'
    script: |
      if [ ${{ parameters.mode }} = "System" ] ; then
        echo "test"
        IFS=',' read -r -a my_array <<< "${{ parameters.old_system_pool }}"
        echo "test1"
        echo "sys pool array ${my_array[@]}"
      fi
      for i in ${my_array[@]};
      do
        my_node=($(kubectl get nodes -l "kubernetes.azure.com/mode=system,agentpool in ($(echo "$i" | tr ' ' ','))" -o=json | jq ".items[].metadata | [.name] | @csv" -r | tr -d '"'))
        echo "Node- ${my_node[@]}"
        for Item_cor in "${my_node[@]}";
        do
          kubectl cordon $Item_cor
          # kubectl describe node $Item_cor
          echo "post cordoning ($(kubectl get nodes -l kubernetes.azure.com/mode=system -o=json))"
        done
      done
      my_ns=($(kubectl get ns -o=json | jq ".items[].metadata | [.name] | @csv" -r | tr -d '"' ))
      echo "my namepace- ${my_ns[@]}"
      for Item in "${my_ns[@]}";
      do
        echo "my namepaceloop- $Item"
        mydep=($(kubectl get deployments -n $Item -o json | jq -r '.items[] | select((.metadata.namespace == "default") or (.spec.template.spec.tolerations != null )) | .metadata.name'))
        echo "mydep- ${mydep[@]}"
        for dep_item in "${mydep[@]}";
        do
          echo $dep_item
          # kubectl describe deployment $dep_item -n $Item  
        #   kubectl get deployment $dep_item -n $Item -o json        
          kubectl rollout restart deploy $dep_item -n $Item
        done
      done
      echo "after restart ($(kubectl get pods -A  -o  wide))"

  env:
    AAD_SERVICE_PRINCIPAL_CLIENT_ID: $(clientid)
    AAD_SERVICE_PRINCIPAL_CLIENT_SECRET: $(clientsecret)

- task: Bash@3
  displayName: cordon_restart_user
  condition: eq('${{ parameters.mode }}', 'User')
  inputs:
    targetType: 'inline'
    script: |
      if [ ${{ parameters.mode }} = "User" ]; then
        echo "test"
        IFS=',' read -r -a my_array <<< "${{ parameters.old_user_pool }}"
        echo "test1"
        echo "user pool array ${my_array[@]}"
      fi
      for i in ${my_array[@]};
      do
        my_node=($(kubectl get nodes -l "kubernetes.azure.com/mode=user,agentpool in ($(echo "$i" | tr ' ' ','))" -o=json | jq ".items[].metadata | [.name] | @csv" -r | tr -d '"'))
        echo "Node- ${my_node[@]}"
        for Item_cor in "${my_node[@]}";
        do
          kubectl cordon $Item_cor
          # kubectl describe node $Item_cor
          echo "post cordoning ($(kubectl get nodes -l kubernetes.azure.com/mode=user -o=json))"
        done
      done
            
      for n in $(kubectl get ns -l istio-injection=enabled -o name); do 
        n=${n##namespace/}
        echo "Performing rollout restart of deployments in the namespace: "$n""
        kubectl rollout restart deployment -n "$n"
        kubectl rollout restart daemonset -n "$n"
        kubectl rollout restart sts -n "$n"
      done
      echo "Waiting for pods to restart for 1 minute"
      sleep 1m
      echo "after restart ($(kubectl get pods -A  -o  wide))"
  env:
    AAD_SERVICE_PRINCIPAL_CLIENT_ID: $(clientid)
    AAD_SERVICE_PRINCIPAL_CLIENT_SECRET: $(clientsecret)


