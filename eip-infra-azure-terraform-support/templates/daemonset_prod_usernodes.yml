steps:
- task: PythonScript@0
  displayName: "Extract Azure KV secrets"
  name: "GetAzureCredentials"
  inputs:
    scriptSource: 'filePath'
    scriptPath: '$(system.defaultWorkingDirectory)/templates/scripts/get_spn.py'
    arguments: "NONPROD_K8S_SPN:PREPROD_K8S_SPN:PREPROD_NETWORK_SPN:NONPROD_NETWORK_SPN:NONPROD_PAAS_SPN:PREPROD_PAAS_SPN:PROD_NETWORK_SPN:PROD_PAAS_SPN:PROD_K8S_SPN"
    pythonInterpreter: '/usr/bin/python3'
    failOnStderr: true
  env:
    PREPROD_NETWORK_SPN: $(pep-eiap-preprod-network-sp) 
    NONPROD_NETWORK_SPN: $(pep-eiap-nonprod-network-sp)
    PROD_NETWORK_SPN: $(pep-eiap-prod-network-sp)
    NONPROD_PAAS_SPN: $(pep-eiap-nonprod-paas-sp)
    PREPROD_PAAS_SPN: $(pep-eiap-preprod-paas-sp)
    PROD_PAAS_SPN: $(pep-eiap-prod-paas-sp)
    PREPROD_K8S_SPN: $(pep-eiap-preprod-k8s-sp)
    NONPROD_K8S_SPN: $(pep-eiap-nonprod-k8s-sp)
    PROD_K8S_SPN: $(pep-eiap-prod-k8s-sp)

- task: PythonScript@0
  displayName: "Set Azure credentials"
  name: "SetAzureCredentials"
  inputs:
    scriptSource: 'filePath'
    scriptPath: '$(system.defaultWorkingDirectory)/templates/scripts/set_spn.py'
    arguments: "${{ parameters.service_principal_backend }}"
    pythonInterpreter: '/usr/bin/python3'
    failOnStderr: true

- task: PythonScript@0
  displayName: "Set Service Principal"
  name: "SetServicePrincipal"
  inputs:
    scriptSource: 'filePath'
    scriptPath: '$(system.defaultWorkingDirectory)/templates/scripts/set_config_spn.py'
    arguments: "${{ parameters.service_principal }}"
    pythonInterpreter: '/usr/bin/python3'
    failOnStderr: true

- task: Bash@3
  displayName: "kube-config-extract"
  inputs:
    targetType: 'inline'
    workingDirectory: '$(Build.SourcesDirectory)/src/${{parameters.Functional_Area}}/${{parameters.env}}/common-tf-config/${{parameters.ResourceType}}'
    script: |
      set -e
      echo "Current directory: $(pwd)"
      if [[ "${{parameters.Functional_Area}}" == "pfna" ]] || [[ "${{parameters.Functional_Area}}" == "snt" ]] || [[ "${{parameters.Functional_Area}}" == "infratools" ]] || [[ "${{parameters.Functional_Area}}" == "infosectools" ]] || [[ "${{parameters.Functional_Area}}" == "cmp" ]] || [[ "${{parameters.Functional_Area}}" == "pbna" ]] || [[ "${{parameters.Functional_Area}}" == "dps" ]] || [[ "${{parameters.Functional_Area}}" == "cmptest" ]] || [[ "${{parameters.Functional_Area}}" == "cgf" ]] || [[ "${{parameters.Functional_Area}}" == "automation" ]] || [[ "${{parameters.Functional_Area}}" == "aisp" ]] || [[ "${{parameters.Functional_Area}}" == "pepgenx" ]]; then
          export TF_VAR_subscription=$(subscription_id_others)
          echo "subscription set to subscription_id_others"
      elif ([[ "${{parameters.Region}}" == "suk" ]] || [[ "${{parameters.Region}}" == "ae" ]] || [[ "${{parameters.Region}}" == "gwc" ]]) && ([[ "${{parameters.env}}" == "nonprod" ]] || [[ "${{parameters.env}}" == "preprod" ]]); then
          export TF_VAR_subscription=$(subscription_id_other_regions)
          echo "subscription set to subscription_id_other_regions"      
      else
          export TF_VAR_subscription=$SUBSCRIPTION  
          echo "subscription set to KV subscription"          
      fi
      export TF_VAR_tenantid=$TENANTID
      export TF_VAR_clientid=$CLIENTID
      export TF_VAR_clientsecret=$CLIENTSECRET
      export TF_VAR_lp_admin_username=$USER_NAME
      if [[ "${{parameters.env}}" == "preprod" ]]; then
        export TF_VAR_lp_ssh_key=$LINUX_PASS_PREPROD
      elif [[ "${{parameters.env}}" == "prod" ]]; then
        export TF_VAR_lp_ssh_key=$LINUX_PASS_PROD
      elif [[ "${{parameters.env}}" == "prod-dr" ]]; then
        export TF_VAR_lp_ssh_key=$LINUX_PASS_PROD
      else
        export TF_VAR_lp_ssh_key=$LINUX_PASS_NONPROD
      fi  
      export TF_VAR_wp_admin_username=$USER_NAME
      export TF_VAR_wp_admin_password=$WIN_PASS
      git config --global http.$(terraform_modules_repo).extraheader "AUTHORIZATION: bearer $(System.AccessToken)"
      cp $(Build.SourcesDirectory)/src/${{parameters.Functional_Area}}/${{parameters.env}}/resources/${{parameters.Region}}/${{parameters.ResourceType}}/${{parameters.resource_name}}/* .
      rm main.tf
      rm outputs.tf
      rm versions.tf
      ls
      terraform init        
      terraform plan -input=false -var 'resource_name_to_create=${{parameters.resource_name}}' -var-file 'defaults-${{parameters.resource_name}}.tfvars' -var-file 'mandatory-${{parameters.resource_name}}.tfvars' -var-file 'nodepools-${{parameters.resource_name}}.tfvars' -out=extract-kubeconfig-plan
      terraform apply extract-kubeconfig-plan
      
- task: Bash@3
  displayName: "context"
  inputs:
    targetType: 'inline'
    script: |
      mkdir $HOME/.kube
      cp $(Build.SourcesDirectory)/src/${{parameters.Functional_Area}}/${{parameters.env}}/common-tf-config/${{parameters.ResourceType}}/kubeconfig-admin.kcfg $HOME/.kube/
      mv $HOME/.kube/kubeconfig-admin.kcfg $HOME/.kube/config

- task: Bash@3
  displayName: "variables"
  inputs:
    targetType: 'inline'
    workingDirectory: '$(Build.SourcesDirectory)'
    script: |
      IFS=', ' read -r -a userArray <<< "${{parameters.user_np}}"
      for index in "${!userArray[@]}"; 
      do
        name="${userArray[$index]}"
        key="user_pool-$((index+1))"
        echo "Setting variable: $name"
        echo "$key: $name" >> variable.yml
      done
      
- task: CopyFiles@2
  inputs:
    SourceFolder: '$(Build.SourcesDirectory)'
    Contents: |
      variable.yml
    TargetFolder: '$(Build.ArtifactStagingDirectory)'
    flattenFolders: false
    
- task: PublishBuildArtifacts@1
  displayName: 'Publish Artifact: varfile'
  inputs:
    ArtifactName: 'varf'

- task: Bash@3
  displayName: create new directory for var
  inputs:
    targetType: 'inline'
    workingDirectory: '$(Build.SourcesDirectory)/templates'
    script: |
      echo "Current directory: $(pwd)"
      mkdir vars
      echo "src directory contents"
      ls
  
- task: DownloadPipelineArtifact@2
  displayName: 'download var file '
  inputs:
    artifactName: 'varf'
    downloadPath: '$(Build.SourcesDirectory)/templates/vars'

- task: Ansible@0
  displayName: "daemonset_apply_prod_UP"
  name: "daemonset_apply"
  inputs:
    ansibleInterface: 'agentMachine'
    playbookPathOnAgentMachine: '$(Build.SourcesDirectory)/src/ansible/playbooks/daemonset.yml'
    failOnStderr: false
    args: '-e ''{ "working_dir": "$(system.defaultWorkingDirectory)" }'' -v'
  env:
    ANSIBLE_HOST_KEY_CHECKING: False
    ANSIBLE_LOCALHOST_WARNING: False
    
- task: CopyFiles@2
  inputs:
    SourceFolder: '$(Build.SourcesDirectory)/templates/daemonset'
    TargetFolder: '$(Build.ArtifactStagingDirectory)'
    flattenFolders: false

- task: PublishBuildArtifacts@1
  displayName: 'Publish Artifact: varfile'
  inputs:
    ArtifactName: 'daemonset'
