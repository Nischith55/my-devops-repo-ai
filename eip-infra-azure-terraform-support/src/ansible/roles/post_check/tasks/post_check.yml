
##################################
- name: cronjob
  shell: |
      kubectl get cronjobs -A --output=custom-columns='NAMESPACE:.metadata.namespace,NAME:.metadata.name'
  register: cronjob
  environment:
    K8S_AUTH_KUBECONFIG: ~/.kube/config
    K8S_AUTH_CONTEXT: "{{ resourcename }}"

- name: artifact
  copy:
    content: "{{ cronjob.stdout }}"
    dest: "{{ working_dir }}/k8s_backups/{{ resourcename }}/{{ opt }}/cronjobs-{{ opt }}-upgrade.txt"

#####################################
- name: nodestatus
  shell: |
      kubectl get node -o custom-columns='NODE_NAME:.metadata.name,STATUS:.status.conditions[?(@.type=="Ready")].type'
  register: nodestatus
  environment:
    K8S_AUTH_KUBECONFIG: ~/.kube/config
    K8S_AUTH_CONTEXT: "{{ resourcename }}"

- name: artifact
  copy:
    content: "{{ nodestatus.stdout }}"
    dest: "{{ working_dir }}/k8s_backups/{{ resourcename }}/{{ opt }}/nodestatus-{{ opt }}-upgrade.txt"

