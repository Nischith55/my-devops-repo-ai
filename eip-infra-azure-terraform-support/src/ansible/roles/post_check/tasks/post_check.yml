- name: virtual_services
  k8s_info:
    kind: VirtualService
    api_version: networking.istio.io/v1beta1
  no_log: true  
  register: virtual_services_list
  environment:
    K8S_AUTH_KUBECONFIG: ~/.kube/config
    K8S_AUTH_CONTEXT: "{{ resourcename }}"

- name: Extract hosts ending with pepsico.com
  set_fact:
    filtered_list: "{{ virtual_services_list.resources | json_query(query) | flatten }}"
  vars:
    query: "[].spec.hosts[0]"
  register: virtual_service_hosts_list

- name: artifact
  copy:
    content: "{{ virtual_service_hosts_list | to_yaml }}"
    dest: "{{ working_dir }}/k8s_backups/{{ resourcename }}/{{ opt }}/virtualserviceslist-{{ opt }}-upgrade.txt"

