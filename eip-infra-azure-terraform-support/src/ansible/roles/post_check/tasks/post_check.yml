#############################################
- name: pv
  shell: |
      kubectl get pv --sort-by=.spec.capacity.storage -o custom-columns='NAME:.metadata.name,CAPACITY:.spec.capacity.storage,ACCESS MODES:.spec.accessModes,STATUS:.status.phase,CLAIM:.spec.claimRef.name,STORAGECLASS:.spec.storageClassName'
  register: pv
  environment:
    K8S_AUTH_KUBECONFIG: ~/.kube/config
    K8S_AUTH_CONTEXT: "{{ resourcename }}"

- name: artifact
  copy:
    content: "{{ pv.stdout }}"
    dest: "{{ working_dir }}/k8s_backups/{{ resourcename }}/{{ opt }}/pv-{{ opt }}-upgrade.txt"

#############################################
- name: podstatus
  shell: |
      kubectl get pods -A --selector='status.phase!=Failed,status.phase!=Unknown' --output=custom-columns='NAMESPACE:.metadata.namespace,NAME:.metadata.name,STATUS:.status.phase' | grep -v "CrashLoopBackOff"
  register: podstatus
  environment:
    K8S_AUTH_KUBECONFIG: ~/.kube/config
    K8S_AUTH_CONTEXT: "{{ resourcename }}"

- name: artifact
  copy:
    content: "{{ podstatus.stdout }}"
    dest: "{{ working_dir }}/k8s_backups/{{ resourcename }}/{{ opt }}/podstatus-{{ opt }}-upgrade.txt"

