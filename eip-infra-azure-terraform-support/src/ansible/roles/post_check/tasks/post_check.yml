# #-------------------------------------------------
- name: daemon set
  k8s_info:
    kind: DaemonSet
  no_log: true  
  register: daemonset_list
  environment:
    K8S_AUTH_KUBECONFIG: ~/.kube/config
    K8S_AUTH_CONTEXT: "{{ resourcename }}"

- name: filter daemonset_list
  set_fact:
    filtered_list: "{{ daemonset_list.resources | json_query(query) }}"
  vars:
    query: "[].{Namespace: metadata.namespace, Name: metadata.name, Current: status.currentNumberScheduled, Desired: status.desiredNumberScheduled, Available: status.numberAvailable, Ready: status.numberReady, NodeSelector: spec.template.spec.nodeSelector }"
  register: filtered_daemonset_list

- name: artifact
  copy:
    content: "{{ filtered_daemonset_list | to_yaml }}"
    dest: "{{ working_dir }}/k8s_backups/{{ resourcename }}/{{ opt }}/daemonset-status-{{ opt }}-upgrade.txt"

#############################################
- name: npu_nodes_status
  shell: |
      kubectl get nodes | grep -i npu
  register: npunodes
  environment:
    K8S_AUTH_KUBECONFIG: ~/.kube/config
    K8S_AUTH_CONTEXT: "{{ resourcename }}"
- name: artifact
  copy:
    content: "{{ npunodes.stdout }}"
    dest: "{{ working_dir }}/k8s_backups/{{ resourcename }}/{{ opt }}/npunodes-status-{{ opt }}-upgrade.txt"

