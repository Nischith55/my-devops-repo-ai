---
- name: Validation
  hosts: localhost
  gather_facts: false
  tasks:
###################################
    - name: show difference between pre_deployment and post_deployment files of systemnodes
      copy:
        src: "{{ working_dir }}/k8s_backups/{{ resourcename }}/pre/systemnodes-pre-upgrade.txt"
        dest: "{{ working_dir }}/k8s_backups/{{ resourcename }}/post/systemnodes-post-upgrade.txt"
      check_mode: yes
      diff: true
      register: myresults1
#########################################
    - name: show difference between pre_deployment and post_deployment files of usernodes
