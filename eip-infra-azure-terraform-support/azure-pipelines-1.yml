        inputs:
          notifyUsers: |
            $(approval_ITEIAPK8sSUPPORT)        
          instructions: 'Approval required for Terraform Execution'
    - job: Git_push
      dependsOn: approvalforapply1
      steps: 
      - task: DownloadPipelineArtifact@2
        displayName: 'download files'
        inputs:
          artifactName: 'modified-tfvars1'
          downloadPath: '$(Build.SourcesDirectory)/src/${{parameters.Functional_Area}}/${{parameters.env}}/resources/${{Parameters.Region}}/${{parameters.ResourceType}}/${{parameters.ResourceName}}'
      - template: templates/git_push.yml  
#_________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________
  - stage: ApprovePrBeforeProceeding
    displayName: complete-PR-merge-to-main
    dependsOn: 
      # - ${{variables.dependOn}}
      - aks_control_plane_upgrade_apply
      - GitPushFinalChanges
    condition: and(succeeded('${{variables.dependOn}}'), or(eq(${{ parameters.system_pool_upgrade }}, true), eq(${{ parameters.user_pool_upgrade }}, true),  eq(${{ parameters.control_plane_upgrade }}, true)), or(eq(${{ parameters.system_pool_cordon_restart }}, false), eq(${{ parameters.user_pool_cordon_restart }}, false)), ne(variables['build.sourceBranch'], 'refs/heads/main'))
    pool: 
      name: $(agent_pool)
    variables:
      - group: repo_access_token  
    jobs:
    - job: CreatingPR
      displayName: CreatingPR
      steps:     
      - task: Bash@3
        displayName: 'raise_pull_request'
        inputs:
          targetType: 'inline'
          script: |
            export AZURE_DEVOPS_EXT_PAT=$(svcPersonalAccessToken)
            pip install azure-devops   
            az repos pr create --organization https://dev.azure.com/PepsiCoIT/ --project EIP-Infrastructure --repository eip-infra-azure-terraform-support --source-branch $(Build.SourceBranchName) --target-branch main --title "Merge Request after Upgrade" --description "Mandatory Pull Request to be Approved/Completed Before Proceeding with further Upgrade Steps" --auto-complete true

    - job: approval_if_PR_done
      displayName: Pull-Request-Confirmation
      dependsOn: CreatingPR
      pool: server
      timeoutInMinutes: 4320 # job times out in 3 days
      steps:
      - task: ManualValidation@0
        timeoutInMinutes: 1440 # task times out in 1 day
        inputs:
          notifyUsers: |
            $(approval_ITEIAPK8sSUPPORT)
          instructions: 'Kindly approve the PR before proceeding further'
