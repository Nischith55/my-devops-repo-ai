trigger: none
resources:
  repositories: 
    - repository: terraformmodules
      type: git
      name: eip-infra-terraform-modules
    - repository: eip-infra-azure-terraform-support
      type: git
      name: eip-infra-azure-terraform-support
      ref: main
parameters:
- name: control_plane_upgrade
  displayName: 'Control Plane Upgrade'
  type: boolean
  default: 'false'
- name: system_pool_upgrade
  displayName: 'System Pool Upgrade'
  type: boolean
  default: 'false'
- name: user_pool_upgrade
  displayName: 'User Pool Upgrade'
  type: boolean
  default: 'false'
- name: System_Pool_OldNode_Deletion
  displayName: 'System Pool OldNode Drain'
  type: boolean
  default: 'false'
- name: User_Pool_OldNode_Deletion
  displayName: 'User Pool OldNode Drain'
  type: boolean
  default: 'false'
- name: system_pool_cordon_restart
  displayName: 'System Pool Cordon & Restart'
  type: boolean
  default: 'false'  
- name: user_pool_cordon_restart
  displayName: 'User Pool Cordon & Restart'
  type: boolean
  default: 'false'   

- name: env
  displayName: Environment
  type: string
  values:
    - prod
    - nonprod
    - preprod

- name: service_principal
  displayName: Service Principal
  type: string
  values:
  - PREPROD_K8S_SPN
  - NONPROD_K8S_SPN
  - PROD_K8S_SPN

- name: Functional_Area
  displayName: Functional_Area
  type: string
  values:
    - eiap
    - edap
    - pfna
    - snt
    - cmp
    - infratools
    - infosectools
    - pbna
    - dps
    - cmptest
    - automation
    - cgf
    - aisp
    - pepgenx

- name: Region
  displayName: Region
  type: string
  values:
    - scus
    - eus
    - gwc
    - suk
    - sea
    - ae
- name: ResourceType
  displayName: Resource Type
  type: string
  default: azure-kubernetes-services
  values:
    - azure-kubernetes-services
- name: ResourceGroupName
  displayName: Resource Group Name
  type: string
- name: ResourceName
  displayName: Resource Name
  type: string

- name: vmSize
  displayName: VM Size
  type: string
  values:
  - ' '
  - Standard_E4ds_v4
  - Standard_E32ds_v4
  - Standard_E8ds_v4
  - Standard_D4ds_v4
  - Standard_D4ds_v5
  - Standard_D8ds_v4
  - Standard_E4ds_v5
  - Standard_D16as_v4
  - Standard_E8ds_v5
  - Standard_E16ds_v4



- name: version
  displayName: 'AKS Version'
  type: string

- name: nginx_url
  displayName: 'nginx url'
  type: string
  default: ' '

- name: maxSurge
  displayName: 'Max Surge (Greater than 0) '
  type: number

- name: system_pool
  displayName: 'New System Pool Name'
  type: string
  default: ' '

- name: old_system_pool
  displayName: 'Old System Pool Name'
  type: string
  default: ' '

- name: user_pool
  displayName: 'New User Pool Name'
  type: string
  default: ' '

- name: old_user_pool
  displayName: 'Old User Pool Name'
  type: string
  default: ' '

- name: parallelism
  displayName: Terraform parallelism to run no. of jobs
  type: string
  default: 2
  values:
    - 1
    - 2
    - 3
    - 4
    - 5  
  
variables:
  - name: nonprod_eus_agents
    value: pep-eiap-nonprod-eus-infra-02-aks-agents

  - name: nonprod_scus_agents
    value: pep-eiap-nonprod-eus-infra-02-aks-agents

  - name: preprod_eus_agents
    value: pep-eiap-preprod-scus-infra-02-aks-agents

  - name: preprod_scus_agents
    value: pep-eiap-preprod-scus-infra-02-aks-agents

  - name: prod_eus_agents
    value: pep-eiap-prod-eus-infra-02-aks-agents

  - name: prod_scus_agents
    value: pep-eiap-prod-scus-infra-02-aks-agents

  - name: nonprod_pfna_agents
    value: pep-pfna-nonprod-eus-hhnxt-infra-02-aks-agents

  - name: preprod_pfna_agents
    value: pep-pfna-cit-preprod-scus-infra-02-aks-agents

  - name: prod_pfna_agents
    value: pep-eiap-prod-scus-infra-02-aks-agents  
    
  - name: nonprod_backend_resource_group
    value: pep-eiap-nonprod-eus-infra-01-rg

  - name: preprod_backend_resource_group
    value: pep-eiap-preprod-eus-infra-01-rg
    
  - name: prod_backend_resource_group
    value: pep-eiap-prod-eus-infra-01-rg

  - name: nonprod_backend_storage_account
    value: pe1003auto01tf01sa

  - name: preprod_backend_storage_account
    value: pe2003auto01tf01sa
    
  - name: prod_backend_storage_account
    value: pe3003auto01tf01sa

  - name: eiap_backend_storage_container
    value: eiap-storage-container

  - name: edap_backend_storage_container
    value: edap-storage-container
    
  - name: pfna_backend_storage_container
    value: pfna-storage-container

  - name: snt_backend_storage_container
    value: snt-storage-container
    
  - name: cmp_backend_storage_container
    value: cmp-storage-container

  - name: infratools_backend_storage_container
    value: infratools-storage-container

  - name: infosectools_backend_storage_container
    value: infosectools-storage-container

  - name: pbna_backend_storage_container
    value: pbna-storage-container  

  - name: dps_backend_storage_container
    value: dps-storage-container 

  - name: cmptest_backend_storage_container
    value: cmptest-storage-container
  
  - name: automation_backend_storage_container
    value: automation-storage-container
  
  - name: cgf_backend_storage_container
    value: eiap-storage-container

  - name: aisp_backend_storage_container
    value: aisp-storage-container 

  - name: pepgenx_backend_storage_container
    value: pepgenx-storage-container 

  - name: approval_ITEIAPK8sSUPPORT 
    value: iteiapk8ssupport@pepsico.com
 
  - name: env
    ${{ if eq(parameters.env, 'prod') }}:
      value: prod
    ${{ elseif eq(parameters.env, 'preprod') }}:
      value: preprod
    ${{ else }}:
      value: nonprod
  - name: inplace
    value: false    
  - name: curl_pfna
    ${{ if and(or(eq(parameters.env, 'nonprod'),eq(parameters.env, 'preprod')), eq(parameters.Functional_Area, 'pfna')) }}:
      value: false
    ${{ elseif or(eq(parameters.control_plane_upgrade, 'true'),eq(parameters.system_pool_upgrade, 'true')) }}:
      value: false
    ${{ else }}:
      value: true  
     
  - name: env_convert
    value: $[upper(variables['env'])]
  
  - name: agent_pool
    ${{ if and(eq(parameters.env, 'nonprod'), or(eq(parameters.Region, 'eus'),eq(parameters.Region, 'gwc'),eq(parameters.Region, 'suk'))) }}:
      value: $(nonprod_scus_agents)
    ${{ elseif and(eq(parameters.env, 'nonprod'), or(eq(parameters.Region, 'scus'),eq(parameters.Region, 'sea'),eq(parameters.Region, 'ae'))) }}:
      value: $(nonprod_scus_agents)
    ${{ elseif and(eq(parameters.env, 'preprod'), or(eq(parameters.Region, 'eus'),eq(parameters.Region, 'gwc'),eq(parameters.Region, 'suk'))) }}:
      value: $(preprod_eus_agents)
    ${{ elseif and(eq(parameters.env, 'preprod'), or(eq(parameters.Region, 'scus'),eq(parameters.Region, 'sea'),eq(parameters.Region, 'ae'))) }}:
      value: $(preprod_scus_agents)
    ${{ elseif and(eq(parameters.env, 'prod'), or(eq(parameters.Region, 'eus'),eq(parameters.Region, 'sea'),eq(parameters.Region, 'ae'))) }}:
      value: $(prod_eus_agents)
    ${{ elseif and(eq(parameters.env, 'prod'), or(eq(parameters.Region, 'scus'),eq(parameters.Region, 'gwc'),eq(parameters.Region, 'suk'))) }}:
      value: $(prod_scus_agents)  
    ${{ else }}:
      value: $(nonprod_eus_agents)

  - name: pfna_agent_pool
    ${{ if and(eq(parameters.env, 'nonprod'), eq(parameters.Functional_Area, 'pfna'))}}:
      value: $(nonprod_pfna_agents)
    ${{ elseif and(eq(parameters.env, 'preprod'), eq(parameters.Functional_Area, 'pfna'))}}:
      value: $(preprod_pfna_agents)
    ${{ elseif and(eq(parameters.env, 'prod'), eq(parameters.Functional_Area, 'pfna'))}}:
      value: $(prod_pfna_agents)

  - name: backend_spn
    ${{ if eq(parameters.env, 'nonprod') }}:
      value: "NONPROD_NETWORK_SPN"
    ${{ if eq(parameters.env, 'preprod') }}:
      value: "PREPROD_NETWORK_SPN"  
    ${{ if eq(parameters.env, 'prod') }}:
      value: "PROD_NETWORK_SPN" 

  - name: subscription_id_others
    ${{ if and(or(eq(parameters.env, 'nonprod'),eq(parameters.env, 'preprod')), eq(parameters.Functional_Area, 'pfna')) }}:
      value: 498640c4-36eb-4566-b752-ca3d2939c544
    ${{ elseif and(or(eq(parameters.env, 'nonprod'),eq(parameters.env, 'preprod')), eq(parameters.Functional_Area, 'snt')) }}:
      value: cf488406-af15-4248-898e-11932611df2b
    ${{ elseif and(or(eq(parameters.env, 'nonprod'),eq(parameters.env, 'preprod')), eq(parameters.Functional_Area, 'cmp')) }}:
      value: dcae03ca-ca66-40ff-a58e-a8585fd62d6d
    ${{ elseif and(eq(parameters.env, 'prod'), eq(parameters.Functional_Area, 'pfna')) }}:
      value: 55bde1f0-8591-432c-a37f-5c1bdff8c2f8
    ${{ elseif and(eq(parameters.env, 'prod'), eq(parameters.Functional_Area, 'snt')) }}:
      value: c02eac0c-ef5a-4dc0-a613-c4be86e092ab
    ${{ elseif and(or(eq(parameters.env, 'nonprod'),eq(parameters.env, 'preprod')), eq(parameters.Functional_Area, 'infratools')) }}:
      value: 86ddcdc2-9ada-46b9-a53e-dc326f8ecfdc
    ${{ elseif and(eq(parameters.env, 'prod'), eq(parameters.Functional_Area, 'infratools')) }}:
      value: 92ddb5ec-2ad5-45f6-b81f-e358d4904d04
    ${{ elseif and(or(eq(parameters.env, 'preprod'),eq(parameters.env, 'prod'),eq(parameters.env, 'nonprod')), eq(parameters.Functional_Area, 'infosectools')) }}:
      value: bbfb8d7c-7f66-4690-9a6a-0aec959d9035
    ${{ elseif and(or(eq(parameters.env, 'nonprod'),eq(parameters.env, 'preprod')), eq(parameters.Functional_Area, 'pbna')) }}:
      value: f427a039-5122-4a35-ac4a-c63c96d1acde
    ${{ elseif and(eq(parameters.env, 'prod'), eq(parameters.Functional_Area, 'pbna')) }}:
      value: 5f9ba971-f3d4-4706-8d5c-2aae550f9cb4  
    ${{ elseif and(or(eq(parameters.env, 'nonprod'),eq(parameters.env, 'preprod')), eq(parameters.Functional_Area, 'dps')) }}:
      value: 93c33431-a080-4b4a-a362-3b7c5a36b6dc
    ${{ elseif and(eq(parameters.env, 'prod'), eq(parameters.Functional_Area, 'dps')) }}:
      value: 4f85ea10-aee0-4b46-82cc-4416208c1485
    ${{ elseif and(eq(parameters.env, 'nonprod'), eq(parameters.Functional_Area, 'globalit')) }}:
      value: 154431fe-c911-490e-87a0-c84ced2bee05
    ${{ elseif and(eq(parameters.env, 'nonprod'), eq(parameters.Functional_Area, 'cmptest')) }}:
      value: d6451cb5-7d7a-4caf-84e2-5fbaa36c083e  
    ${{ elseif and(or(eq(parameters.env, 'preprod'),eq(parameters.env, 'prod'),eq(parameters.env, 'nonprod')), eq(parameters.Functional_Area, 'automation')) }}:
      value: 34030b4b-d34e-4290-bd1b-a6945f95d9aa
    ${{ elseif and(eq(parameters.env, 'nonprod'), eq(parameters.Functional_Area, 'cgf')) }}:
      value: 0c1319a6-1def-4d09-a0ca-46d9b0812fbd
    ${{ elseif and(eq(parameters.env, 'nonprod'), eq(parameters.Functional_Area, 'aisp')) }}:
      value: d6a9062c-4c82-4e49-8204-100c57f33583
    ${{ elseif and(eq(parameters.env, 'preprod'), eq(parameters.Functional_Area, 'aisp')) }}:
      value: 8a22bd18-1080-472c-a8af-da15be88b076
    ${{ elseif and(eq(parameters.env, 'prod'), eq(parameters.Functional_Area, 'aisp')) }}:
      value: 06d0e1b4-b6e3-43c3-9f97-29e840d4d893
    ${{ elseif and(eq(parameters.env, 'nonprod'), eq(parameters.Functional_Area, 'pepgenx')) }}:
      value: c1eeeb0b-31c1-4cda-b497-3a9c83685dbf
    ${{ elseif and(eq(parameters.env, 'prod'), eq(parameters.Functional_Area, 'cgf')) }}:
      value: f479bd9e-6531-43ea-85eb-cc6c21b4957b
    ${{ else }}:
      value: Using-subscription-id-available-in-keyvault
  
  - name: subscription_id_other_regions
    ${{ if and(eq(parameters.Region, 'suk'), eq(parameters.Functional_Area, 'eiap')) }}:
      value: 8a22bd18-1080-472c-a8af-da15be88b076
    ${{ elseif and(eq(parameters.Region, 'gwc'), eq(parameters.Functional_Area, 'eiap')) }}:
      value: 8a22bd18-1080-472c-a8af-da15be88b076
    ${{ elseif and(eq(parameters.Region, 'ae'), eq(parameters.Functional_Area, 'eiap')) }}:
      value: 8a22bd18-1080-472c-a8af-da15be88b076
    ${{ else }}:
      value: Not-applicable-for-selected-parameters
    
  - name: mode
    ${{ if eq(parameters.system_pool_upgrade, 'true') }}:
        value: System
    ${{ if eq(parameters.System_Pool_OldNode_Deletion, 'true') }}:
        value: System
    ${{ if eq(parameters.user_pool_upgrade, 'true') }}:
        value: User
    ${{ if eq(parameters.User_Pool_OldNode_Deletion, 'true') }}:
        value: User
    ${{ if eq(parameters.system_pool_cordon_restart, 'true') }}:
        value: System   
    ${{ if eq(parameters.user_pool_cordon_restart, 'true') }}:
        value: User             
       
  - name: dependOn
    ${{ if eq(parameters.system_pool_upgrade, 'true') }}:
        value: cordoningRestart
    ${{ if eq(parameters.user_pool_upgrade, 'true') }}:
        value: cordoningRestart
    ${{ if eq(parameters.control_plane_upgrade, 'true') }}:
        value: aks_control_plane_upgrade_apply

  - name: resource_group_name_for_backend
    ${{ if eq(parameters.env, 'nonprod') }}:
      value: $(nonprod_backend_resource_group)
    ${{ if eq(parameters.env, 'preprod') }}:
      value: $(preprod_backend_resource_group)
    ${{ if eq(parameters.env, 'prod') }}:
      value: $(prod_backend_resource_group)
    
  - name: storage_account_name_for_backend
    ${{ if eq(parameters.env, 'nonprod') }}:
      value: $(nonprod_backend_storage_account)
    ${{ if eq(parameters.env, 'preprod') }}:
      value: $(preprod_backend_storage_account)
    ${{ if eq(parameters.env, 'prod') }}:
      value: $(prod_backend_storage_account)
 
  - name: container_name_for_backend  
    ${{ if eq(parameters.Functional_Area, 'eiap') }}:
      value: $(eiap_backend_storage_container)
    ${{ if eq(parameters.Functional_Area, 'edap') }}:
      value: $(edap_backend_storage_container)
    ${{ if eq(parameters.Functional_Area, 'pfna') }}:
      value: $(pfna_backend_storage_container)
    ${{ if eq(parameters.Functional_Area, 'snt') }}:
      value: $(snt_backend_storage_container)
    ${{ if eq(parameters.Functional_Area, 'cmp') }}:
      value: $(cmp_backend_storage_container)
    ${{ if eq(parameters.Functional_Area, 'infratools') }}:
      value: $(infratools_backend_storage_container)
    ${{ if eq(parameters.Functional_Area, 'infosectools') }}:
      value: $(infosectools_backend_storage_container)
    ${{ if eq(parameters.Functional_Area, 'pbna') }}:
      value: $(pbna_backend_storage_container)
    ${{ if eq(parameters.Functional_Area, 'dps') }}:
      value: $(dps_backend_storage_container) 
    ${{ if eq(parameters.Functional_Area, 'cgf') }}:
      value: $(cgf_backend_storage_container)
    ${{ if eq(parameters.Functional_Area, 'pepgenx') }}:
      value: $(pepgenx_backend_storage_container)
    ${{ if eq(parameters.Functional_Area, 'cmptest') }}:
      value: $(cmptest_backend_storage_container)
    ${{ if eq(parameters.Functional_Area, 'automation') }}:
      value: $(automation_backend_storage_container)
    ${{ if eq(parameters.Functional_Area, 'aisp') }}:
      value: $(aisp_backend_storage_container)
           
  
  - name: key_for_backend
    value: "${{parameters.ResourceType}}/${{parameters.Region}}/$(resource_name_input).tfstate"

  - name: terraform_modules_repo
    value: "https://PepsiCoIT@dev.azure.com/PepsiCoIT/EIP-Infrastructure/_git/eip-infra-terraform-modules"  

  - name: resource_name_input
    value: ${{parameters.ResourceName}}

  - name: path_of_nodepools
    value: $(Build.SourcesDirectory)/src/${{parameters.Functional_Area}}/${{parameters.env}}/resources/${{Parameters.Region}}/${{parameters.ResourceType}}/${{parameters.ResourceName}}/nodepools-${{parameters.ResourceName}}.tfvars

  - name: path_of_defaults
    value: $(Build.SourcesDirectory)/src/${{parameters.Functional_Area}}/${{parameters.env}}/resources/${{Parameters.Region}}/${{parameters.ResourceType}}/${{parameters.ResourceName}}/defaults-${{parameters.ResourceName}}.tfvars

  - name: path_of_mandatory
    value: $(Build.SourcesDirectory)/src/${{parameters.Functional_Area}}/${{parameters.env}}/resources/${{Parameters.Region}}/${{parameters.ResourceType}}/${{parameters.ResourceName}}/mandatory-${{parameters.ResourceName}}.tfvars

  - name: plane_select_control_plane
    ${{ if eq(parameters.control_plane_upgrade, true) }}:
      value: control_plane_upgrade
  - name: plane_select_system_pool
    ${{ if eq(parameters.system_pool_upgrade, true) }}:
      value: system_pool_upgrade
  - name: plane_select_user_pool  
    ${{ if eq(parameters.user_pool_upgrade, true) }}:
      value: user_pool_upgrade

#______________________________________________________________________________________________
stages:
  - stage: display
    displayName: display-selected-inputs-by-user
    pool: 
      name: $(agent_pool)
    jobs: 
      - job: display_backend_values
        continueOnError: false
        steps:
        - task: Bash@3
          displayName: "display-selected-parameters"
          inputs:
            targetType: 'inline'
            script: |
              echo "Checked out branch: $(Build.SourceBranch)"
              echo "Selected Environment : ${{Parameters.env}}"
              echo "Selected Resource Type : ${{Parameters.ResourceType}}"
              echo "Selected Region : ${{Parameters.Region}}"
              echo "Agent Pool to be used for all stages : ${{variables.agent_pool}}"
              echo "Backend resource group name : ${{variables.resource_group_name_for_backend}}"
              echo "Backend storage account : ${{variables.storage_account_name_for_backend}}"
              echo "Backend container name : ${{variables.container_name_for_backend}}"
              echo "Backend Key : ${{variables.key_for_backend}}"
              echo "Name of the targeted resource : ${{variables.resource_name_input}}"
              echo "Resource Group Name : ${{parameters.ResourceGroupName}}"
              echo "Selected SPN details : ${{Parameters.service_principal}}"
              echo "Subscription id for pfna/snt/infratools : ${{variables.subscription_id_others}}"
              echo "Subscription id for EIAP suk/ae/gwc regions : ${{variables.subscription_id_other_regions}}"
              echo "Selected AKS Version : ${{Parameters.version}}"
              echo "Selected Upgrade types : ${{variables.plane_select_control_plane}} ${{variables.plane_select_system_pool}} ${{variables.plane_select_user_pool}}"
              echo "Selected VM Size : ${{Parameters.vmSize}}"
              echo "Selected Max Surge: ${{Parameters.maxSurge}}"
              echo "Selected New System Pool: ${{Parameters.system_pool}}"
              echo "Selected Old System Pool: ${{Parameters.old_system_pool}}"
              echo "Selected New User Pool: ${{Parameters.user_pool}}"
              echo "Selected Old User Pool: ${{Parameters.old_user_pool}}"
              echo "Selected Parallelism to run no of Jobs: ${{Parameters.parallelism}}"
#_____________________________________________________________________________________________________________________________________
  - stage: checkforapproval
    displayName: manual-check-for-selected-parameters
    dependsOn: display
    pool: 
      name: $(agent_pool)
    jobs:
    - job: approval
      pool: server
      timeoutInMinutes: 5 # job times out in 5 min
      steps:
      - task: ManualValidation@0
        timeoutInMinutes: 6 # task times out in 6 min
        inputs:
          instructions: 'validate the selected parameters before proceeding'
#__________________________________________________________________________________________________________________________________
  - stage: aks_prod_upgrade
    displayName: terraform-plan
    dependsOn: checkforapproval
    condition: and(succeeded('checkforapproval'), or(eq(${{ parameters.system_pool_upgrade }}, true), eq(${{ parameters.user_pool_upgrade }}, true),  eq(${{ parameters.control_plane_upgrade }}, true)), or(eq(${{ parameters.system_pool_cordon_restart }}, false), eq(${{ parameters.user_pool_cordon_restart }}, false)), ne(variables['build.sourceBranch'], 'refs/heads/main'))
    pool: 
      name: $(agent_pool)
    variables:
      - group: preprod_nonprod_ansible_azure_secrets
      - group: repo_access_token
      - group: prod_ansible_azure_secrets
      - group: linux_windows_profiles  
    jobs: 
    - job: Job1
      displayName: tf-plan&updating-tfvars
      steps:
      - template: templates/minmax.yml      
        parameters:
          cluster: ${{ parameters.ResourceName }}
          Region: ${{ parameters.Region }}
          env: ${{ parameters.env }}
          department: ${{ parameters.Functional_Area }}
          target: ${{ parameters.ResourceGroupName }}
          mode: ${{variables.mode}}
          system_pool: ${{ parameters.system_pool }}
          old_system_pool: ${{ parameters.old_system_pool }}
          service_principal: ${{ parameters.service_principal }}
          subscription: ${{ variables.subscription }}
          service_principal_backend: ${{variables.backend_spn}}
          user_pool: ${{ parameters.user_pool }}
          old_user_pool: ${{ parameters.old_user_pool }}
          Functional_Area: ${{parameters.Functional_Area}}

      - template: templates/aks_upgrade.yml
        parameters:
          plane_select_user_pool: ${{variables.plane_select_user_pool}}
          plane_select_system_pool: ${{variables.plane_select_system_pool}}
          plane_select_control_plane: ${{variables.plane_select_control_plane}}
          max_surge: ${{parameters.maxSurge}}
          path_of_nodepools: ${{variables.path_of_nodepools}}
          path_of_mandatory: ${{variables.path_of_mandatory}}
          path_of_defaults: ${{variables.path_of_defaults}}
          Functional_Area: ${{parameters.Functional_Area}}
          env: ${{parameters.env}}
          list_of_nodepools: ${{ parameters.system_pool }}
          Region: ${{parameters.Region }}
          ResourceType: ${{parameters.ResourceType}}  
          ResourceName: ${{variables.resource_name_input}}
          service_principal: ${{parameters.service_principal}}
          service_principal_backend: ${{variables.backend_spn}}
          resource_name: ${{variables.resource_name_input}}
          cluster: ${{variables.resource_name_input }}
          department: ${{ parameters.Functional_Area }}
          target: ${{ parameters.ResourceGroupName }}
          version: ${{ parameters.version }}
          mode: ${{variables.mode}}
          system_pool: ${{ parameters.system_pool }}
          user_pool: ${{ parameters.user_pool }}
          vmSize: ${{ parameters.vmSize }}
          old_system_pool: ${{ parameters.old_system_pool }}
          old_user_pool: ${{ parameters.old_user_pool }}
          inplace: ${{variables.inplace}}
#______________________________________________________________________________________________________
  - stage: aks_upgrade_precheck
    displayName: pre-check
    dependsOn: aks_prod_upgrade
    condition:  and(succeeded('aks_prod_upgrade'), or(eq(${{ parameters.system_pool_cordon_restart }}, false), eq(${{ parameters.user_pool_cordon_restart }}, false)), ne(variables['build.sourceBranch'], 'refs/heads/main'))
    pool: 
        name: $(agent_pool)
    variables:
      - group: preprod_nonprod_ansible_azure_secrets
      - group: repo_access_token
      - group: prod_ansible_azure_secrets
      - group: linux_windows_profiles    
    jobs:
    - job: pre_check
      displayName: pre-check
      steps:  
      - template: templates/pre_check.yml
        parameters:
