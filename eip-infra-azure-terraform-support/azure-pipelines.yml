  - name: agent_pool
    ${{ if and(eq(parameters.env, 'nonprod'), or(eq(parameters.Region, 'eus'),eq(parameters.Region, 'gwc'),eq(parameters.Region, 'suk'))) }}:
      value: $(nonprod_scus_agents)
    ${{ elseif and(eq(parameters.env, 'nonprod'), or(eq(parameters.Region, 'scus'),eq(parameters.Region, 'sea'),eq(parameters.Region, 'ae'))) }}:
      value: $(nonprod_scus_agents)
    ${{ elseif and(eq(parameters.env, 'preprod'), or(eq(parameters.Region, 'eus'),eq(parameters.Region, 'gwc'),eq(parameters.Region, 'suk'))) }}:
      value: $(preprod_eus_agents)
    ${{ elseif and(eq(parameters.env, 'preprod'), or(eq(parameters.Region, 'scus'),eq(parameters.Region, 'sea'),eq(parameters.Region, 'ae'))) }}:
      value: $(preprod_scus_agents)
    ${{ elseif and(eq(parameters.env, 'prod'), or(eq(parameters.Region, 'eus'),eq(parameters.Region, 'sea'),eq(parameters.Region, 'ae'))) }}:
      value: $(prod_eus_agents)
    ${{ elseif and(eq(parameters.env, 'prod'), or(eq(parameters.Region, 'scus'),eq(parameters.Region, 'gwc'),eq(parameters.Region, 'suk'))) }}:
      value: $(prod_scus_agents) 
    ${{ elseif and(eq(parameters.env, 'prod-dr'), eq(parameters.Region, 'scus')) }}:
      value: $(prod_scus_agents)
    ${{ else }}:
      value: $(nonprod_eus_agents)

  - name: resource_group_name_for_backend
    ${{ if eq(parameters.env, 'nonprod') }}:
      value: $(nonprod_backend_resource_group)
    ${{ if eq(parameters.env, 'preprod') }}:
      value: $(preprod_backend_resource_group)
    ${{ if eq(parameters.env, 'prod') }}:
      value: $(prod_backend_resource_group)
    ${{ if eq(parameters.env, 'prod-dr') }}:
      value: $(prod_backend_resource_group)
    

      
  - name: storage_account_name_for_backend
