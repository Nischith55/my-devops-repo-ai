    value: ITEIAPAZUREPlatformServices@pepsico.com
  - name: approval_ITEIAPCICDSupportServices
    value: ITEIAPCICDSupportServices@pepsico.com
  - name: approval_AzureAutomation
    value: DL-AzureAutomation@pepsico.com
      
