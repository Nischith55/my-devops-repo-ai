# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger: none
#________________________________________
resources:
 repositories: 
    - repository: terraformmodules
      type: git
      name: eip-infra-terraform-modules
    - repository: eip-infra-azure-terraform-support
      type: git
      name: eip-infra-azure-terraform-support
      ref: main

parameters:
  - name: Functional_Area
    displayName: Functional_Area
    type: string
    values:
      - eiap
      - edap
      - pfna
      - snt
      - cmp
      - aisp
      - aisp-sbox
      - infratools
      - infosectools
      - pbna
      - dps
      - globalit
      - cmptest
      - automation
      - cgf
      - pepgenx
  - name: service_principal
    displayName: service_principal
    type: string
    values:  
      - NONPROD_K8S_SPN
      - PREPROD_K8S_SPN
      - PREPROD_NETWORK_SPN
      - NONPROD_NETWORK_SPN
      - NONPROD_PAAS_SPN
      - PREPROD_PAAS_SPN
      - PROD_NETWORK_SPN
      - PROD_PAAS_SPN
      - PROD_K8S_SPN
      - pep-eiap-nonprod-k8s-sp
      - pep-eiap-nonprod-network-sp      
  - name: env
    displayName: Environment
    type: string
    values:
      - nonprod
      - preprod
      - prod
      - prod-dr
  - name: Region
    displayName: Region
    type: string
    values:
      - scus
      - eus
      - gwc
      - suk
      - sea
      - ae
      - na
      - essa
      - apac
  - name: ResourceType
    displayName: Resource Type
    type: string
    values:
      - managed-identity
      - storage-account
      - azure-kubernetes-services
      - key-vault
      - key-vault-certificate
      - acr
      - evh
      - evh-cgrp
      - evhns
      - evhns-authz
      - pvtep
      - asev3
      - logicapp
      - ase-plan
      - federated-credentials
  - name: ReadMode
    displayName: ReadMode? Select Yes to view the state file
    type: string
    values:
      - No
      - Yes 

  - name: ResourceGroupName
    displayName: ResourceGroupName
    type: string
  - name: ResourceName
    displayName: Resource Name
    type: string
    
  - name: DownloadCertificate
    displayName: Download Certificate from Secret Files?
    type: string
    values:
      - No
      - Yes

  - name: CertificateName
    displayName: Certificate Name (Optional)
    type: string
    default: ' '

#---------------------------------------------------------------------------------------------------------------
