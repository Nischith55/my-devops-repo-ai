#________________________________________________________________________________________________________________________________________________________________________
stages:   
  - stage: display
    displayName: display-selected-inputs-by-user
    pool: 
      name: $(agent_pool)
    jobs: 
      - job: display_backend_values
        continueOnError: false
        steps:
        - script: |
           echo "Checked out branch: $(Build.SourceBranch)"
           echo "Selected Environment : ${{Parameters.env}}"
           echo "Selected Resource Type : ${{Parameters.ResourceType}}"
           echo "Selected Region : ${{Parameters.Region}}"
           echo "Agent Pool to be used for all stages : ${{variables.agent_pool}}"
           echo "Backend resource group name : ${{variables.resource_group_name_for_backend}}"
           echo "Backend storage account : ${{variables.storage_account_name_for_backend}}"
           echo "Backend container name : ${{variables.container_name_for_backend}}"
           echo "Backend Key : ${{variables.key_for_backend}}"
           echo "Name of the targeted resource : ${{variables.resource_name_input}}"
           echo "Resource Group Name : ${{parameters.ResourceGroupName}}"
           echo "Selected SPN details : ${{Parameters.service_principal}}"
           echo "Subscription id for pfna/snt/cmp/infratools/infosectools/pbna/dps/globalit/cmptest/automation/aisp/cgf/pepgenx : ${{variables.subscription_id_others}}"
           echo "Subscription id for EIAP suk/ae/gwc regions : ${{variables.subscription_id_other_regions}}"
           echo "Read Mode : ${{Parameters.ReadMode}}"
           echo "Download Certificate from Secret Files : ${{Parameters.DownloadCertificate}}"
           echo "Secret File Name : ${{Parameters.CertificateName}}"  
           terraform -v       
          
#__________________________________________________________________________________________
  - stage: check_for_config
    displayName: manual_check_for_selected_parameters
    dependsOn: display
    pool: 
      name: $(agent_pool)
    jobs:
    - job: approval
      pool: server
      timeoutInMinutes: 5
      steps:
      - task: ManualValidation@0
        timeoutInMinutes: 6
        inputs:
          instructions: 'validate the selected parameters before proceeding'
#__________________________________________________________________________________________
  - stage: init_validate
    displayName: terraform-init-validate
    dependsOn: check_for_config
    pool: 
      name: $(agent_pool)  
    jobs:
    - template: templates/terraform_init_validate.yml
      parameters:
        Functional_Area: ${{parameters.Functional_Area}}
        env: ${{parameters.env}}
        Region: ${{parameters.Region }}
        ResourceType: ${{parameters.ResourceType}}  
        service_principal: ${{variables.backend_spn}}
        resource_name: ${{variables.resource_name_input}}
        ReadMode: ${{parameters.ReadMode}}    
#__________________________________________________________________________________________
  - stage: plan
    displayName: terraform-plan
    dependsOn: init_validate
    condition: and(succeeded(), eq('${{ parameters.ReadMode }}', 'No'))
    pool: 
      name: $(agent_pool)  
    jobs:
    - template: templates/terraform_plan.yml
      parameters:
        Functional_Area: ${{parameters.Functional_Area}}
        env: ${{parameters.env}}
        Region: ${{parameters.Region }}
        ResourceType: ${{parameters.ResourceType}}  
        service_principal: ${{parameters.service_principal}}
        service_principal_backend: ${{variables.backend_spn}}
        resource_name: ${{variables.resource_name_input}}
        ResourceGroupName: ${{parameters.ResourceGroupName}}
        DownloadCertificate: ${{parameters.DownloadCertificate}}
        CertificateName: ${{parameters.CertificateName}}
#_____________________________________________________________________________________________________
  # - stage: snyk_scan
  #   displayName: snyk-scan
  #   dependsOn: plan
  #   condition: and(succeeded('plan'), eq('${{ parameters.ReadMode }}', 'No'))
  #   pool: 
  #     name: $(agent_pool) 
  #   jobs:
  #   - template: templates/snyk_scan.yml
  #     parameters:
  #       Functional_Area: ${{parameters.Functional_Area}}
  #       env: ${{parameters.env}}
  #       Region: ${{parameters.Region }}
  #       ResourceType: ${{parameters.ResourceType}}  
  #       service_principal: ${{variables.backend_spn}}
  #       resource_name: ${{variables.resource_name_input}}
  #       snyk_path: ${{variables.snyk_path}}
      
#__________________________________________________________________________________________________________________________________
# approval -
  - stage: checkforapproval
    displayName: check-for-approval
    #dependsOn: snyk_scan
    dependsOn: plan
    condition: and(succeeded('plan'), eq(variables['build.sourceBranch'], 'refs/heads/main'))
    #condition: and(succeeded('snyk_scan'), eq(variables['build.sourceBranch'], 'refs/heads/main'))
    pool: 
      name: $(agent_pool)
    jobs:
    - job: approval
      pool: server
      timeoutInMinutes: 4320 # job times out in 3 days
      steps:
      - task: ManualValidation@0
        timeoutInMinutes: 1440 # task times out in 1 day
        inputs:
          notifyUsers: |
            $(approval_AzureAutomation)
            $(approval_ITEIAPAZUREPlatformServices)
            $(approval_ITEIAPCICDSupportServices)
          instructions: 'Approval required for Terraform Execution'
#________________________________________________________________________________________________________________________________________________________
  - stage: apply
    displayName: terraform-apply
    dependsOn: checkforapproval
    condition: and(succeeded('checkforapproval'), eq(variables['build.sourceBranch'], 'refs/heads/main'))
    pool: 
        name: $(agent_pool)   
    jobs:
    - template: templates/terraform_apply.yml
      parameters:
        Functional_Area: ${{parameters.Functional_Area}}
        env: ${{ parameters.env }}
        Region: ${{ parameters.Region }}
        ResourceType: ${{ parameters.ResourceType }} 
        service_principal: ${{parameters.service_principal}}
        service_principal_backend: ${{variables.backend_spn}}
        resource_name: ${{variables.resource_name_input}}
        ResourceGroupName: ${{parameters.ResourceGroupName}}
        DownloadCertificate: ${{parameters.DownloadCertificate}}
        CertificateName: ${{parameters.CertificateName}}
#_____________________________________________________________________________________________________________________________________________________________________
  - stage: kube_configs_extract
    displayName: extract-admin-and-user-kube-configs
    condition: and(succeeded(), eq('${{ parameters.ResourceType }}', 'azure-kubernetes-services'), eq(variables['build.sourceBranch'], 'refs/heads/main'))
    pool: 
        name: $(agent_pool)
    jobs:
    - template: templates/extract_kube_configs.yml
      parameters:
        Functional_Area: ${{parameters.Functional_Area}}
        env: ${{ parameters.env }}
        Region: ${{ parameters.Region }}
        ResourceType: ${{ parameters.ResourceType }} 
        service_principal: ${{parameters.service_principal}}
        service_principal_backend: ${{variables.backend_spn}}
        resource_name: ${{variables.resource_name_input}}
        ResourceGroupName: ${{parameters.ResourceGroupName}}
#_____________________________________________________________________________________________________________________________________________________________________

