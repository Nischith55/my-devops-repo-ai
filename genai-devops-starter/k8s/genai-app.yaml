apiVersion: v1
kind: Namespace
metadata:
  name: genai-app
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: genai-config
  namespace: genai-app
data:
  APP_ENV: "dev"
  MOCK_MODE: "true"
  VLLM_BASE_URL: "http://vllm-service.genai-app.svc.cluster.local:8001/v1"
  VLLM_MODEL: "TinyLlama/TinyLlama-1.1B-Chat-v1.0"
  VLLM_API_KEY: "EMPTY"
  API_BASE_URL: "http://backend-service.genai-app.svc.cluster.local:8000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: genai-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: REPLACE_WITH_REGISTRY/genai-backend:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: genai-config
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: genai-app
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: genai-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: REPLACE_WITH_REGISTRY/genai-frontend:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: genai-config
          ports:
            - containerPort: 8501
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: genai-app
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - name: http
      port: 8501
      targetPort: 8501
      nodePort: 30501